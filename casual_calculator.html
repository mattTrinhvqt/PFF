<!DOCTYPE html>
<html>
<head>
  <script>
    /* --- Visual scale toggle (set true/false) --- */
    const ENABLE_SCALE = false;

    let scaleTimer = null;
    let stageHeightTimer = null;

    function scheduleApplyScale() {
      if (!ENABLE_SCALE) return;

      clearTimeout(scaleTimer);

      scaleTimer = setTimeout(() => {
        requestAnimationFrame(applyScale);
      }, 80);
    }

    function applyScale() {
      const app =
        document.getElementById('app');

      const fit =
        document.getElementById('fit');

      if (!app || !fit) {
        return;
      }

      if (!ENABLE_SCALE) {
        app.style.transform =
          'none';

        fit.style.minHeight =
          '0';

        fit.style.width =
          '100%';

        return;
      }

      const previousTransform =
        app.style.transform;

      app.style.transform =
        'none';

      let sizer =
        document.getElementById(
          'appSizer'
        );

      if (!sizer) {
        sizer =
          app.cloneNode(true);

        sizer.id =
          'appSizer';

        document.body.appendChild(
          sizer
        );
      } else {
        sizer.innerHTML =
          app.innerHTML;
      }

      Object.assign(
        sizer.style,
        {
          position:
            'absolute',

          left:
            '-99999px',

          top:
            '0',

          width:
            getComputedStyle(app).width,

          display:
            'block',

          visibility:
            'hidden',

          pointerEvents:
            'none',

          transform:
            'none'
        }
      );

      const sizerResults =
        sizer.querySelector(
          '#results'
        );

      const sizerOutput =
        sizer.querySelector(
          '#out'
        );

      if (sizerResults) {
        sizerResults.style.display =
          'block';
      }

      if (sizerOutput) {
        sizerOutput.textContent =
          'Calculating...';
      }

      const naturalWidth =
        sizer.offsetWidth ||
        app.offsetWidth ||
        1;

      const naturalHeight =
        sizer.offsetHeight ||
        app.offsetHeight ||
        1;

      app.style.transform =
        previousTransform;

      const viewportWidth =
        document.documentElement
          .clientWidth ||
        window.innerWidth;

      const viewportHeight =
        window.innerHeight;

      const scale =
        Math.min(
          viewportWidth /
            naturalWidth,

          viewportHeight /
            naturalHeight,

          1
        );

      app.style.transform =
        `scale(${scale})`;

      fit.style.width =
        '100%';

      fit.style.minHeight =
        Math.max(
          Math.ceil(
            naturalHeight *
            scale
          ),

          viewportHeight
        ) + 'px';
    }

    /*
     * Measure the natural height of the expanded-input view
     * with results visible. This becomes the maximum stage
     * height used by all calculator states.
     */
    function scheduleStageHeightMeasurement() {
      clearTimeout(
        stageHeightTimer
      );

      stageHeightTimer =
        setTimeout(
          () => {
            requestAnimationFrame(
              measureExpandedStageHeight
            );
          },
          80
        );
    }

    function measureExpandedStageHeight() {
      const app =
        document.getElementById(
          'app'
        );

      if (
        !app ||
        !document.body
      ) {
        return;
      }

      const measuringClone =
        app.cloneNode(true);

      measuringClone.classList.add(
        'has-results'
      );

      measuringClone.classList.remove(
        'is-input-collapsed',
        'is-layout-transitioning'
      );

      Object.assign(
        measuringClone.style,
        {
          position:
            'absolute',

          left:
            '-99999px',

          top:
            '0',

          width:
            getComputedStyle(app).width,

          height:
            'auto',

          minHeight:
            '0',

          maxHeight:
            'none',

          display:
            'flex',

          visibility:
            'hidden',

          pointerEvents:
            'none',

          transform:
            'none',

          transition:
            'none'
        }
      );

      const measuringResults =
        measuringClone.querySelector(
          '#results'
        );

      const measuringOutput =
        measuringClone.querySelector(
          '#out'
        );

      if (measuringResults) {
        measuringResults.style.display =
          'block';
      }

      if (measuringOutput) {
        measuringOutput.textContent =
          '';
      }

      document.body.appendChild(
        measuringClone
      );

      const measuredHeight =
        Math.ceil(
          measuringClone
            .getBoundingClientRect()
            .height
        );

      measuringClone.remove();

      if (
        Number.isFinite(
          measuredHeight
        ) &&
        measuredHeight > 0
      ) {
        document.documentElement
          .style
          .setProperty(
            '--stage-height',
            `${measuredHeight}px`
          );
      }
    }

    function refreshCalculatorLayout() {
      scheduleStageHeightMeasurement();
      scheduleApplyScale();
    }

    window.addEventListener(
      'load',
      refreshCalculatorLayout
    );

    window.addEventListener(
      'resize',
      refreshCalculatorLayout
    );

    window.addEventListener(
      'orientationchange',
      refreshCalculatorLayout
    );

    window.addEventListener(
      'pageshow',
      refreshCalculatorLayout
    );

    if (document.fonts?.ready) {
      document.fonts.ready.then(
        refreshCalculatorLayout
      );
    }
  </script>
  <meta charset="utf-8">
  <title>Casual Optom Income Estimator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error-red: #b42318;
      --benchmark-red: #b42318;
      --stage-height: 560px;
      --layout-duration: 920ms;
      --layout-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 0;
      width: 100%;
    }

    .box {
      display: flex;
      width: min(calc(100% - 16px), 520px);
      max-width: 100%;
      min-width: 0;
      min-height: min(100dvh, var(--stage-height));
      margin-inline: auto;
      padding: 9px 10px 12px;
      flex-direction: column;
      text-align: center;
    }

    #app {
      overflow: visible;
      transform-origin: top center;
      will-change: transform;
      transition:
        min-height var(--layout-duration) var(--layout-ease);
    }

    .input-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      width: 100%;
      max-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      background: #fff;
      border: 0;
      border-bottom: 0 solid var(--track);
      border-radius: 0;
      font: inherit;
      text-align: left;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      pointer-events: none;
      cursor: pointer;
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 360ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear var(--layout-duration);
    }

    .input-summary:hover .input-summary-edit {
      color: var(--ink);
    }

    .input-summary:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .input-summary-values {
      display: flex;
      min-width: 0;
      padding: 1px 0 2px;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .input-summary-values::-webkit-scrollbar {
      display: none;
    }

    .input-summary-separator {
      flex: 0 0 auto;
      color: var(--track);
    }

    .input-summary-edit {
      flex: 0 0 auto;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      text-transform: uppercase;
      transition: color 140ms ease;
    }

    .calculator-notice {
      width: 100%;
      max-height: 80px;
      margin: 0 0 4px;
      padding: 0 0 8px;
      overflow: hidden;
      border-bottom: 2px solid var(--track);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 320ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s;
    }

    .calculator-notice p {
      margin: 0;
    }

    .calculator-notice p + p {
      margin-top: 1px;
    }

    #modelMeta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    #modelMeta.is-live::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #e53935;
    }

    .calculator-form {
      display: grid;
      grid-template-columns: 1fr;
      flex: 1 1 auto;
      min-height: 0;
      gap: 0;
      margin-top: 14px;
      align-content: space-between;
      text-align: left;
      transition:
        gap var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease);
    }

    .field {
      max-height: 100px;
      margin: 0;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 320ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s;
    }

    .field label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 0;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.15;
      text-align: center;
    }

    .field label small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.2;
    }

    .field label small a {
      color: var(--purple);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: underline;
    }

    .field-label-with-help {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 15px;
      text-align: center;
    }

    .field-label-with-help label {
      display: block;
      min-height: 0;
      margin: 0;
    }

    .help-tooltip-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
    }

    .help-tooltip-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--muted);
      border-radius: 50%;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .help-tooltip-button:hover {
      color: var(--ink);
      border-color: var(--ink);
    }

    .help-tooltip-button:focus-visible {
      color: var(--ink);
      border-color: var(--purple);
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .help-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      width: max-content;
      max-width: min(280px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      padding: 7px 9px;
      overflow-y: auto;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: 0 7px 20px rgba(21, 21, 21, 0.16);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: left;
      white-space: normal;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 120ms ease,
        visibility 120ms ease;
    }

    .help-tooltip.is-visible {
      opacity: 1;
      visibility: visible;
    }

    .field input[type="number"],
    .field select {
      display: block;
      width: 100%;
      height: 32px;
      margin: 3px auto 0;
      padding: 0 4px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--track);
      border-radius: 0;
      font: inherit;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      outline: none;
      transition:
        border-color 140ms ease,
        box-shadow 140ms ease;
    }

    .field input[type="number"]:hover,
    .field select:hover {
      border-bottom-color: var(--muted);
    }

    .field input[type="number"]:focus-visible,
    .field select:focus-visible {
      border-bottom-color: var(--purple);
      box-shadow: none;
    }

    select {
      text-align-last: center;
      -moz-text-align-last: center;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    #estimateBtn {
      display: block;
      width: 100%;
      min-height: 34px;
      max-height: 34px;
      margin: 1px auto 0;
      padding: 0 12px;
      overflow: hidden;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink);
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
      font-weight: 400;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      cursor: pointer;
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 320ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s,
        color 140ms ease,
        background-color 140ms ease;
    }

    #estimateBtn:hover {
      color: #fff;
      background: var(--ink);
    }

    #estimateBtn:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #out {
      min-height: 0;
      max-height: 70px;
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      text-align: left;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 320ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s;
    }

    #out:empty {
      display: none;
    }

    #out.is-error,
    #resultsStatus.is-error {
      color: var(--error-red);
    }

    #results {
      position: relative;
      display: none;
      grid-column: 1 / -1;
      min-width: 0;
      min-height: 0;
      max-height: 0;
      margin-top: 6px;
      padding-top: 18px;
      overflow: hidden;
      border-top: 1px solid var(--track);
      text-align: left;
      opacity: 0;
      transform: translateY(12px);
      transition:
        max-height 980ms var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        opacity 420ms ease,
        transform 980ms var(--layout-ease);
    }

    #resultsStatus {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      z-index: 5;
      min-height: 18px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      line-height: 1.25;
      text-align: left;
    }

    #results.show-status {
      padding-top: 24px;
      border-top-color: transparent;
    }

    #results.show-status #resultsStatus {
      display: block;
    }

    .results-content,
    .results-primary,
    .scale {
      min-width: 0;
    }

    .results-content {
      width: 100%;
    }

    .results-primary {
      flex: 0 0 auto;
    }

    .results-section-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.2;
      text-align: center;
      text-transform: uppercase;
    }

    .scale {
      --trackY: 48px;
      --barH: 4px;
      --gapValue: 6px;
      --gapLabel: 7px;

      position: relative;
      margin: 14px 28px 0;
      padding: 54px 0 48px;
    }

    .scale .track {
      position: absolute;
      top: var(--trackY);
      right: 0;
      left: 0;
      height: var(--barH);
      background: var(--track);
      border-radius: 0;
    }

    .scale .tick {
      --stemUp: 20px;
      --stemDown: 18px;

      position: absolute;
      top: calc(var(--trackY) + var(--barH) / 2);
      z-index: 2;
      transform: translateX(-50%);
      text-align: center;
    }

    .scale .t20,
    .scale .t80 {
      --stemUp: 17px;
      --stemDown: 16px;
    }

    .scale .t5,
    .scale .t95 {
      --stemUp: 14px;
      --stemDown: 14px;
    }

    .scale .tick .stem {
      position: absolute;
      top: calc(-1 * var(--stemUp));
      left: 50%;
      width: 0;
      height: calc(var(--stemUp) + var(--stemDown));
      transform: translateX(-50%);
      border-left: 2px solid var(--muted);
    }

    .scale .t50 .stem {
      border-left-width: 3px;
      border-left-color: var(--purple);
    }

    .scale .t5 .stem,
    .scale .t95 .stem {
      border-left-width: 1px;
    }

    .scale .tick .value {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(
        -50%,
        calc(-100% - var(--stemUp) - var(--gapValue))
      );
      color: var(--ink);
      font-size: 13px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    .scale .tick .label {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(
        -50%,
        calc(var(--stemDown) + var(--gapLabel))
      );
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
    }

    .scale .t50 .value,
    .scale .t50 .label {
      color: var(--purple);
      font-size: 16px;
      font-weight: 700;
    }

    .scale .t20 .value,
    .scale .t80 .value {
      font-size: 12px;
    }

    .scale .t5 .value,
    .scale .t95 .value {
      font-size: 11px;
    }

    .user-marker {
      position: absolute;
      top: calc(var(--trackY) + var(--barH) / 2);
      z-index: 10;
      color: var(--benchmark-red);
      pointer-events: none;
      transition:
        left 1700ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 320ms ease;
      will-change: left;
    }

    .user-marker[hidden] {
      display: none;
    }

    .user-marker-dot {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 4;
      width: 7px;
      height: 7px;
      transform: translate(-50%, -50%);
      background: transparent;
      border: 1px solid var(--benchmark-red);
      border-radius: 50%;
    }

    .user-marker-dot::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 3px;
      transform: translate(-50%, -50%);
      background: var(--benchmark-red);
      border-radius: 50%;
    }

    .user-marker-stem {
      position: absolute;
      top: -8px;
      left: 0;
      z-index: 1;
      width: 0;
      height: 16px;
      transform: translateX(-50%);
      border-left: 1px solid var(--benchmark-red);
    }

    .user-marker-top,
    .user-marker-percentile {
      position: absolute;
      left: 0;
      z-index: 4;
      display: inline-block;
      padding: 2px 6px 3px;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(180, 35, 24, 0.90);
      border-radius: 4px;
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      transition:
        transform 700ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 260ms ease;
    }

    .user-marker-top {
      bottom: 8px;
    }

    .user-marker-percentile {
      top: 8px;
    }

    .user-marker.edge-left .user-marker-top,
    .user-marker.edge-left .user-marker-percentile {
      transform: translateX(0);
    }

    .user-marker.edge-right .user-marker-top,
    .user-marker.edge-right .user-marker-percentile {
      transform: translateX(-100%);

    @media (prefers-reduced-motion: reduce) {

    /* ==========================================================
     * FINAL TWO-VIEW LAYOUT
     *
     * View 1:
     * Inputs are open. This layout is identical before and
     * after calculation, except results are absent initially.
     *
     * View 2:
     * Inputs collapse into the summary bar and results are
     * vertically centred.
     * ========================================================== */

    /*
     * JavaScript replaces this fallback with the measured
     * height of the open-input plus results view.
     */
    :root {
      --stage-height: 520px;
    }

    /*
     * The initial screen and reopened-input screen use the
     * same compact field spacing. This removes the original
     * vertically spread initial-input layout.
     */

    .calculator-form {
      flex: 1 1 auto;
      min-height: 0;
      align-content: start;
      gap: 8px;

    /*

    #app:not(.is-input-collapsed)
    .calculator-form > .field,
    #app:not(.is-input-collapsed)
    #estimateBtn,
    #app:not(.is-input-collapsed)

    #results {

  <script>
    /**********************
     * CONFIG
     **********************/
    const SPREADSHEET_ID = '1UZizMV2CNlyNbKytN4QCSc4HcsKCx-PxOrboJyMCN1E';
    const SHEET_NAME = 'Data';

    const MMM_TREAT_AS_CATEGORICAL = false;
    const STATE_LEVELS = ['NSW', 'QLD', 'ACT', 'VIC', 'SA', 'NT', 'WA', 'TAS'];

    const MS_PER_YEAR =
      365.25 * 24 * 60 * 60 * 1000;

    const Z_TWO_SIDED_95 = 1.96;

    const Z_P05 = -1.64485;
    const Z_P20 = -0.84162;
    const Z_P50 = 0.00000;
    const Z_P80 = 0.84162;
    const Z_P95 = 1.64485;

    const out = document.getElementById('out');
    const estimateBtn = document.getElementById('estimateBtn');
    const resultsStatus = document.getElementById('resultsStatus');
    const appElement = document.getElementById('app');
    const inputSummaryButton =
      document.getElementById('inputSummaryButton');

    const summaryYears =
      document.getElementById('summaryYears');

    const summaryMmm =
      document.getElementById('summaryMmm');

    const summaryState =
      document.getElementById('summaryState');

    const summaryRate =
      document.getElementById('summaryRate');

    const summaryRateSeparator =
      document.getElementById('summaryRateSeparator');

    let layoutTransitionTimer = null;

    const LAYOUT_TRANSITION_MS = 980;

    function formatInputSummaryRate(value) {
      const numericValue = Number(value);

      if (
        !Number.isFinite(numericValue) ||
        numericValue <= 0
      ) {
        return '';
      }

      return (
        'Benchmark ' +
        new Intl.NumberFormat(
          'en-AU',
          {
            style: 'currency',
            currency: 'AUD',
            maximumFractionDigits: 0
          }
        ).format(numericValue)
      );
    }

    function updateInputSummary() {
      const yearsValue =
        document.getElementById('years').value.trim();

      const mmmElement =
        document.getElementById('mmm');

      const mmmValue =
        mmmElement.value.trim();

      const mmmLabel =
        mmmElement.selectedOptions?.[0]
          ?.textContent
          ?.trim() || '';

      const stateValue =
        document.getElementById('state').value.trim();

      const rateValue =
        document.getElementById('currentRate').value.trim();

      summaryYears.textContent =
        yearsValue === ''
          ? 'Experience'
          : `${yearsValue} yr${Number(yearsValue) === 1 ? '' : 's'} experience`;

      summaryMmm.textContent =
        mmmValue === ''
          ? 'MMM'
          : mmmLabel || `MM${mmmValue}`;

      summaryState.textContent =
        stateValue || 'State';

      const formattedRate =
        formatInputSummaryRate(rateValue);

      const hasBenchmark =
        Boolean(formattedRate);

      summaryRate.textContent =
        formattedRate;

      summaryRate.hidden =
        !hasBenchmark;

      summaryRateSeparator.hidden =
        !hasBenchmark;

      const summaryParts = [
        summaryYears.textContent,
        summaryMmm.textContent,
        summaryState.textContent
      ];

      if (hasBenchmark) {
        summaryParts.push(
          summaryRate.textContent
        );
      }

      inputSummaryButton.setAttribute(
        'aria-label',
        `Edit calculator inputs: ${summaryParts.join(', ')}`
      );
    }

    function setInputPanelCollapsed(collapsed) {
      const shouldCollapse =
        Boolean(
          collapsed &&
          hasPreviousResults
        );

      const isCurrentlyCollapsed =
        appElement.classList.contains(
          'is-input-collapsed'
        );

      if (
        shouldCollapse === isCurrentlyCollapsed
      ) {
        return;
      }

      appElement.classList.add(
        'is-layout-transitioning'
      );

      appElement.classList.toggle(
        'is-input-collapsed',
        shouldCollapse
      );

      inputSummaryButton.setAttribute(
        'aria-expanded',
        String(!shouldCollapse)
      );

      if (shouldCollapse) {
        closeRateHelp();
      }

      window.clearTimeout(
        layoutTransitionTimer
      );

      layoutTransitionTimer =
        window.setTimeout(
          () => {
            appElement.classList.remove(
              'is-layout-transitioning'
            );
          },
          LAYOUT_TRANSITION_MS
        );

      scheduleApplyScale();
    }

    inputSummaryButton.addEventListener(
      'click',
      () => {
        setInputPanelCollapsed(false);
      }
    );

    [
      'years',
      'mmm',
      'state',
      'currentRate'
    ].forEach(elementId => {
      const element =
        document.getElementById(elementId);

      element.addEventListener(
        'input',
        updateInputSummary
      );

      element.addEventListener(
        'change',
        updateInputSummary
      );
    });

    updateInputSummary();

    /*
     * Shows a normal grey message or a red error message.
     */
    function setInlineMessage(
      element,
      message = '',
      isError = false
    ) {
      element.textContent = message;

      element.classList.toggle(
        'is-error',
        isError && Boolean(message)
      );
    }

    /*
     * Shows a message below the Calculate button.
     */
    function setFormMessage(
      message = '',
      isError = false
    ) {
      setInlineMessage(out, message, isError);
      scheduleApplyScale();
    }

    /*
     * Shows a message above existing results, where the divider
     * normally appears.
     */
    function setResultsMessage(
      message = '',
      isError = false
    ) {
      const resultsEl =
        document.getElementById('results');

      setInlineMessage(
        resultsStatus,
        message,
        isError
      );

      resultsEl.classList.toggle(
        'show-status',
        Boolean(message)
      );

      scheduleApplyScale();
    }

    /*
     * Removes final full stops from error messages.
     */
    function cleanErrorMessage(message) {
      return String(
        message || 'Calculation failed'
      )
        .trim()
        .replace(/\.+$/, '');
    }

    /*
     * Clears an inline form error when the user begins correcting
     * any field.
     */
    function clearFormErrorOnEdit() {
      if (out.classList.contains('is-error')) {
        setFormMessage();
      }

      if (resultsStatus.classList.contains('is-error')) {
        setResultsMessage();
      }
    }

    document
      .querySelector('.calculator-form')
      .addEventListener(
        'input',
        clearFormErrorOnEdit
      );

    document
      .querySelector('.calculator-form')
      .addEventListener(
        'change',
        clearFormErrorOnEdit
      );

    const AUFMT = new Intl.NumberFormat('en-AU');

    let cachedModel = null;
    let hasPreviousResults = false;
    let lastRes = null;
    let benchmarkRate = null;
    let numberAnimationToken = 0;

    const NUMBER_ANIMATION_MS = 1700;

    function round0(x) {
      if (x === null || x === undefined || isNaN(x)) return '–';
      return AUFMT.format(Math.round(Number(x)));
    }

    function fmtDollarsInt(x) {
      if (x === null || x === undefined || isNaN(x)) return '–';
      return '$' + AUFMT.format(Math.round(Number(x)));
    }

    function animateNumber(
      elementId,
      targetValue,
      formatter,
      animate,
      token
    ) {
      const element = document.getElementById(elementId);
      const target = Number(targetValue);

      if (!Number.isFinite(target)) {
        element.textContent = '–';
        delete element.dataset.numericValue;
        return;
      }

      const storedStart =
        Number(element.dataset.numericValue);

      const start =
        Number.isFinite(storedStart)
          ? storedStart
          : 0;

      const reduceMotion =
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const shouldAnimate =
        animate &&
        start !== target &&
        !reduceMotion;

      if (!shouldAnimate) {
        element.textContent = formatter(target);
        element.dataset.numericValue = String(target);
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        if (token !== numberAnimationToken) return;

        const progress = Math.min(
          (now - startedAt) / NUMBER_ANIMATION_MS,
          1
        );

        const eased = 1 - Math.pow(1 - progress, 3);
        const current = start + (target - start) * eased;

        element.textContent = formatter(current);
        element.dataset.numericValue = String(current);

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          element.textContent = formatter(target);
          element.dataset.numericValue = String(target);
        }
      }

      requestAnimationFrame(frame);
    }

    function erfApprox(x) {
      const sign = x < 0 ? -1 : 1;
      const absoluteX = Math.abs(x);

      const a1 = 0.254829592;
      const a2 = -0.284496736;
      const a3 = 1.421413741;
      const a4 = -1.453152027;
      const a5 = 1.061405429;
      const p = 0.3275911;

      const t = 1 / (1 + p * absoluteX);

      const y =
        1 -
        (
          (
            (
              (
                (a5 * t + a4) * t + a3
              ) * t + a2
            ) * t + a1
          ) * t
        ) * Math.exp(-absoluteX * absoluteX);

      return sign * y;
    }

    function normalCdf(z) {
      return 0.5 * (
        1 + erfApprox(z / Math.sqrt(2))
      );
    }

    function ordinalNumber(value) {
      const rounded = Math.round(value);
      const mod100 = rounded % 100;

      if (mod100 >= 11 && mod100 <= 13) {
        return `${rounded}th`;
      }

      switch (rounded % 10) {
        case 1:
          return `${rounded}st`;
        case 2:
          return `${rounded}nd`;
        case 3:
          return `${rounded}rd`;
        default:
          return `${rounded}th`;
      }
    }

    function calculateBenchmarkPercentile(res, rate) {
      if (
        rate === null ||
        rate === undefined ||
        String(rate).trim() === ''
      ) {
        return null;
      }

      const p05 = Number(res?.p05);
      const p50 = Number(res?.p50);
      const p95 = Number(res?.p95);
      const rateValue = Number(rate);

      if (
        !Number.isFinite(p05) ||
        !Number.isFinite(p50) ||
        !Number.isFinite(p95) ||
        !Number.isFinite(rateValue) ||
        rateValue <= 0
      ) {
        return null;
      }

      const predictionSe =
        (p95 - p05) / (2 * 1.64485);

      if (
        !Number.isFinite(predictionSe) ||
        predictionSe <= 0
      ) {
        return null;
      }

      const z = (rateValue - p50) / predictionSe;
      const percentile = normalCdf(z) * 100;

      return Math.max(0, Math.min(100, percentile));
    }

    function formatBenchmarkPercentile(percentile) {
      if (percentile < 1) {
        return '&lt;1<sup>st</sup> percentile';
      }

      if (percentile > 99) {
        return '&gt;99<sup>th</sup> percentile';
      }

      const ordinal = ordinalNumber(percentile);

      const match = ordinal.match(
        /^(\d+)(st|nd|rd|th)$/
      );

      if (!match) {
        return `${ordinal} percentile`;
      }

      return (
        `${match[1]}` +
        `<sup>${match[2]}</sup> percentile`
      );
    }

    function renderBenchmarkMarker(res, rate) {
      const marker =
        document.getElementById('userMarker');

      const percentileText =
        document.getElementById('userPercentile');

      const percentile =
        calculateBenchmarkPercentile(res, rate);

      if (
        percentile === null ||
        !marker ||
        !percentileText
      ) {
        if (marker) {
          marker.hidden = true;
        }

        return;
      }

      const rawPosition =
        ((percentile - 5) / (95 - 5)) * 100;

      const boundedPosition =
        Math.max(0, Math.min(100, rawPosition));

      marker.style.left = `${boundedPosition}%`;

      marker.classList.toggle(
        'edge-left',
        boundedPosition <= 10
      );

      marker.classList.toggle(
        'edge-right',
        boundedPosition >= 90
      );

      percentileText.innerHTML =
        formatBenchmarkPercentile(percentile);

      marker.hidden = false;
    }

    function renderPercentileScale(res, animateNumbers = false) {
      const [p05, p20, p50, p80, p95] =
        [res.p05, res.p20, res.p50, res.p80, res.p95].map(Number);

      const P_MIN = 5;
      const P_MAX = 95;
      const P_SPAN = P_MAX - P_MIN;

      const posPct = p => ((p - P_MIN) / P_SPAN) * 100;
      const token = ++numberAnimationToken;

      document.querySelector('.t5').style.left = posPct(5) + '%';
      document.querySelector('.t20').style.left = posPct(20) + '%';
      document.querySelector('.t50').style.left = posPct(50) + '%';
      document.querySelector('.t80').style.left = posPct(80) + '%';
      document.querySelector('.t95').style.left = posPct(95) + '%';

      animateNumber('p05v', p05, round0, animateNumbers, token);
      animateNumber('p20v', p20, round0, animateNumbers, token);
      animateNumber('p50v', p50, fmtDollarsInt, animateNumbers, token);
      animateNumber('p80v', p80, round0, animateNumbers, token);
      animateNumber('p95v', p95, round0, animateNumbers, token);
    }

    function loadGvizData() {
      return new Promise((resolve, reject) => {
        const callbackName =
          `casualEstimatorSheetCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

        const script = document.createElement('script');

        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error('Could not load Google Sheet data'));
        }, 15000);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = response => {
          cleanup();

          if (response?.status === 'error') {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                'Could not load Google Sheet data'
              )
            );

            return;
          }

          resolve(response);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('Could not load Google Sheet data'));
        };

        // Pull only the needed columns:
        // A = timestamp, B = rate, C = years, E = MMM, I = state.
        const tq = 'select A,B,C,E,I where B is not null';

        const params = new URLSearchParams({
          sheet: SHEET_NAME,
          headers: '1',
          tq,
          tqx: `responseHandler:${callbackName}`
        });

        script.src =
          `https://docs.google.com/spreadsheets/d/` +
          `${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

        document.body.appendChild(script);
      });
    }

    function getCellDisplayValue(cell) {
      if (!cell) return '';
      return String(cell.f ?? cell.v ?? '').trim();
    }

    function getCellRawValue(cell) {
      if (!cell) return '';
      return cell.v ?? cell.f ?? '';
    }

    function getDateMsFromCell(cell) {
      const rawMs = toDateMs(cell?.v);

      if (Number.isFinite(rawMs)) {
        return rawMs;
      }

      return toDateMs(cell?.f);
    }

    function normaliseRowsFromGviz(response) {
      const rows = response?.table?.rows || [];

      return rows.map(row => {
        const cells = row?.c || [];

        return {
          timestampMs: getDateMsFromCell(cells[0]),
          rate: toNum(getCellRawValue(cells[1])),
          yearsRaw: toNum(getCellRawValue(cells[2])),
          mmm: toInt(getCellRawValue(cells[3])),
          state: getCellDisplayValue(cells[4]).trim().toUpperCase()
        };
      });
    }

    function loadModel() {
      const modelMeta =
        document.getElementById('modelMeta');

      modelMeta.classList.remove(
        'is-live'
      );

      modelMeta.textContent =
        'Loading model...';

      loadGvizData()
        .then(response => {
          const rawRows =
            normaliseRowsFromGviz(response);

          cachedModel =
            buildModel(rawRows);

          modelMeta.textContent =
            'LIVE MLR (OLS) model loaded';

          modelMeta.classList.add(
            'is-live'
          );

          scheduleApplyScale();
        })
        .catch(err => {
          cachedModel = null;

          modelMeta.classList.remove(
            'is-live'
          );

          modelMeta.innerHTML =
            '<span class="warn">Model error: ' +
            cleanErrorMessage(err?.message) +
            '</span>';

          scheduleApplyScale();
        });
    }

    async function estimate() {
      const years = parseFloat(
        document.getElementById('years').value
      );

      const mmm = parseInt(
        document.getElementById('mmm').value,
        10
      );

      const state =
        document.getElementById('state').value.trim();

      const currentRateText =
        document.getElementById('currentRate').value.trim();

      const enteredBenchmarkRate =
        currentRateText === ''
          ? null
          : Number(currentRateText);

      const resultsEl =
        document.getElementById('results');

      const hadPreviousResults =
        hasPreviousResults;

      /*
       * Before the first calculation, show validation errors below
       * Calculate. After results exist, replace the results divider
       * with the error so nothing moves.
       */
      function showInputError(message) {
        if (hadPreviousResults) {
          setFormMessage();
          setResultsMessage(message, true);
        } else {
          setFormMessage(message, true);
        }
      }

      if (
        !isFinite(years) ||
        years < 0 ||
        !isFinite(mmm) ||
        mmm < 1 ||
        mmm > 7 ||
        !state
      ) {
        showInputError(
          '⚠ Please complete all fields'
        );

        return;
      }

      if (
        enteredBenchmarkRate !== null &&
        (
          !Number.isFinite(enteredBenchmarkRate) ||
          enteredBenchmarkRate <= 0
        )
      ) {
        showInputError(
          '⚠ Please enter a valid hourly rate or leave blank'
        );

        return;
      }

      if (!hadPreviousResults) {
        resultsEl.style.display = 'none';
        setFormMessage();
        estimateBtn.textContent = 'Calculating...';
      } else {
        setFormMessage();
        setResultsMessage();
        estimateBtn.textContent = 'Recalculating...';
      }

      estimateBtn.disabled = true;

      scheduleApplyScale();

      try {
        /*
         * Allow the browser to display the button status before
         * running the local prediction.
         */
        await new Promise(resolve => {
          requestAnimationFrame(() => {
            requestAnimationFrame(resolve);
          });
        });

        if (!cachedModel) {
          throw new Error('Model has not loaded yet.');
        }

        const res = predict({
          years,
          mmm,
          state
        }, cachedModel);

        setResultsMessage();
        setFormMessage();

        resultsEl.style.display = 'block';

        /*
         * Animate the first result from zero and animate later
         * recalculations from the previously displayed values.
         */
        renderPercentileScale(
          res,
          true
        );

        lastRes = res;
        benchmarkRate = enteredBenchmarkRate;

        renderBenchmarkMarker(
          lastRes,
          benchmarkRate
        );

        hasPreviousResults = true;

        updateInputSummary();

        /*
         * Apply the result state and collapsed-input state together
         * so the fields do not jump before sliding closed.
         */
        appElement.classList.add(
          'has-results'
        );

        setInputPanelCollapsed(true);

        scheduleApplyScale();

        estimateBtn.disabled = false;
        estimateBtn.textContent = 'Recalculate';
      } catch (err) {
        const message =
          '⚠ ' + cleanErrorMessage(err?.message);

        if (hadPreviousResults) {
          setFormMessage();
          setResultsMessage(message, true);
        } else {
          setFormMessage(message, true);
        }

        estimateBtn.disabled = false;

        estimateBtn.textContent = hadPreviousResults
          ? 'Recalculate'
          : 'Calculate';
      }
    }

    document
      .getElementById('currentRate')
      .addEventListener('input', event => {
        const rawValue = event.target.value.trim();

        if (rawValue === '') {
          benchmarkRate = null;

          const marker =
            document.getElementById('userMarker');

          if (marker) {
            marker.hidden = true;
          }

          return;
        }

        const value = Number(rawValue);

        if (
          Number.isFinite(value) &&
          value > 0
        ) {
          benchmarkRate = value;

          if (lastRes) {
            renderBenchmarkMarker(
              lastRes,
              benchmarkRate
            );
          }
        } else {
          benchmarkRate = null;

          const marker =
            document.getElementById('userMarker');

          if (marker) {
            marker.hidden = true;
          }
        }
      });

    const rateHelpBtn =
      document.getElementById('rateHelpBtn');

    const rateHelpTooltip =
      document.getElementById('rateHelpTooltip');

    let rateHelpPinned = false;

    document.body.appendChild(rateHelpTooltip);

    function positionRateHelp() {
      const viewportMargin = 12;
      const buttonGap = 8;

      const buttonRect =
        rateHelpBtn.getBoundingClientRect();

      rateHelpTooltip.style.left = '0px';
      rateHelpTooltip.style.top = '0px';

      const tooltipRect =
        rateHelpTooltip.getBoundingClientRect();

      let left =
        buttonRect.left +
        buttonRect.width / 2 -
        tooltipRect.width / 2;

      left = Math.max(
        viewportMargin,
        Math.min(
          left,
          window.innerWidth -
          tooltipRect.width -
          viewportMargin
        )
      );

      let top =
        buttonRect.bottom +
        buttonGap;

      if (
        top + tooltipRect.height >
        window.innerHeight - viewportMargin
      ) {
        top =
          buttonRect.top -
          buttonGap -
          tooltipRect.height;
      }

      top = Math.max(
        viewportMargin,
        Math.min(
          top,
          window.innerHeight -
          tooltipRect.height -
          viewportMargin
        )
      );

      rateHelpTooltip.style.left =
        `${Math.round(left)}px`;

      rateHelpTooltip.style.top =
        `${Math.round(top)}px`;
    }

    function setRateHelpOpen(open) {
      if (open) {
        positionRateHelp();

        rateHelpTooltip.classList.add(
          'is-visible'
        );
      } else {
        rateHelpTooltip.classList.remove(
          'is-visible'
        );

      rateHelpBtn.setAttribute(
        'aria-expanded',

      );

    function closeRateHelp(returnFocus = false) {

        rateHelpBtn.focus();
      }
    }

    rateHelpBtn.addEventListener('mouseenter', () => {
      setRateHelpOpen(true);
    });

    rateHelpBtn.addEventListener('mouseleave', () => {

        setRateHelpOpen(false);
      }
    });

    rateHelpBtn.addEventListener('focus', () => {
      setRateHelpOpen(true);
    });

    rateHelpBtn.addEventListener('blur', () => {
      if (!rateHelpPinned) {

      }

        }

    );

    /**********************
     * MODEL
     **********************/
    function buildModel(rawRows) {
      const rows = [];

      rawRows.forEach(r => {
        const timestampMs =
          toDateMs(r.timestampMs);

        const rate =
          toNum(r.rate);

        const yearsRaw =
          toNum(r.yearsRaw);

        const yearsLog =
          Number.isFinite(yearsRaw) && yearsRaw >= 0
            ? Math.log(1 + yearsRaw)
            : NaN;

        const mmm =
          toInt(r.mmm);

        const state =
          String(r.state ?? '').trim().toUpperCase();

        const numericOk =
          [timestampMs, rate, yearsLog, mmm].every(Number.isFinite) &&
          mmm >= 1 &&
          mmm <= 7;

        const stateOk =
          STATE_LEVELS.includes(state);

        if (numericOk && stateOk) {
          rows.push({
            timestampMs,
            rate,
            years: yearsLog,
            mmm,
            state
          });
        }
      });

      if (rows.length < 10) {
        throw new Error(
          'Not enough valid rows (need ≥10).'
        );
      }

      /*
       * Centre submission time around the average timestamp.
       *
       * 0 represents the average submission date.
       * 1 represents approximately one year later.
       * -1 represents approximately one year earlier.
       */
      const timeOriginMs =
        rows.reduce(
          (sum, row) => sum + row.timestampMs,
          0
        ) / rows.length;

      rows.forEach(row => {
        row.timeYears =
          (
            row.timestampMs -
            timeOriginMs
          ) / MS_PER_YEAR;
      });

      const n = rows.length;

      const stateCounts = countBy(
        rows
          .map(r => r.state)
          .filter(
            s => s && s !== STATE_LEVELS[0]
          )
      );

      let stateKeep =
        sortKeysByCountDesc(stateCounts);

      function baseP() {
        return (
          1 +
          1 +
          1 +
          (MMM_TREAT_AS_CATEGORICAL ? 6 : 1)
        );
      }

      let p =
        baseP() + stateKeep.length;

      while (
        n <= p &&
        stateKeep.length > 0
      ) {
        stateKeep.pop();
        p = baseP() + stateKeep.length;
      }

      if (n <= p) {
        throw new Error(
          `Insufficient data (n=${n}, p=${p}) after pruning states.`
        );
      }

      const designInfo =
        makeDesignInfo(
          stateKeep,
          timeOriginMs
        );

      const X = [];
      const y = [];

      rows.forEach(r => {
        y.push(r.rate);
        X.push(
          buildXRow(r, designInfo)
        );
      });

      const nFinal = y.length;
      const pFinal = X[0].length;

      if (nFinal <= pFinal) {
        throw new Error(
          `Insufficient data (n=${nFinal}, p=${pFinal}).`
        );
      }

      const Xt = transpose(X);
      const XtX = multiply(Xt, X);
      const XtX_inv = invert(XtX);
      const Xty = multiplyVec(Xt, y);
      const beta = multiplyMatVec(
        XtX_inv,
        Xty
      );

      const yhat =
        X.map(row => dot(row, beta));

      const resid =
        y.map((v, i) => v - yhat[i]);

      const sse =
        dot(resid, resid);

      const ybar =
        y.reduce((a, b) => a + b, 0) / n;

      const sst =
        y.reduce(
          (acc, v) =>
            acc + Math.pow(v - ybar, 2),
          0
        );

      const r2 =
        1 - (sse / sst);

      const df =
        n - p;

      const s2 =
        sse / df;

      return {
        beta,
        XtX_inv,
        s2,
        r2,
        n,
        p,
        df,
        designInfo
      };
    }

    function predict(input, model) {
      const x0 =
        buildX0(
          input,
          model.designInfo
        );

      const yhat =
        dot(x0, model.beta);

      const h =
        quadForm(
          model.XtX_inv,
          x0
        );

      const se_pred =
        Math.sqrt(
          model.s2 * (1 + h)
        );

      const p05 =
        yhat + Z_P05 * se_pred;

      const p20 =
        yhat + Z_P20 * se_pred;

      const p50 =
        yhat + Z_P50 * se_pred;

      const p80 =
        yhat + Z_P80 * se_pred;

      const p95 =
        yhat + Z_P95 * se_pred;

      const predLo =
        yhat -
        Z_TWO_SIDED_95 * se_pred;

      const predHi =
        yhat +
        Z_TWO_SIDED_95 * se_pred;

      return {
        yhat,
        p05,
        p20,
        p50,
        p80,
        p95,
        predLo,
        predHi,
        n: model.n,
        r2: model.r2
      };
    }

    function makeDesignInfo(
      stateKeep,
      timeOriginMs
    ) {
      const terms = [
        'Intercept',
        'logYears',
        'timeYears'
      ];

      if (MMM_TREAT_AS_CATEGORICAL) {
        for (let k = 2; k <= 7; k++) {
          terms.push(`MMM${k}`);
        }
      } else {
        terms.push('MMM_ordinal');
      }

      const stateRef =
        STATE_LEVELS[0];

      const stateDummies =
        (stateKeep || []).slice();

      stateDummies.forEach(s => {
        terms.push(`State_${s}`);
      });

      return {
        terms,
        timeOriginMs,
        mmmCategorical:
          MMM_TREAT_AS_CATEGORICAL,
        stateRef,
        stateDummies
      };
    }

    function buildXRow(
      r,
      designInfo
    ) {
      const row = [
        1,
        r.years,
        r.timeYears
      ];

      if (designInfo.mmmCategorical) {
        for (let k = 2; k <= 7; k++) {
          row.push(
            r.mmm === k ? 1 : 0
          );
        }
      } else {
        row.push(r.mmm);
      }

      designInfo.stateDummies.forEach(s => {
        row.push(
          r.state === s ? 1 : 0
        );
      });

      return row;
    }

    function buildX0(
      input,
      designInfo
    ) {
      const yearsRaw =
        toNum(input.years);

      const yearsLog =
        Number.isFinite(yearsRaw) &&
        yearsRaw >= 0
          ? Math.log(1 + yearsRaw)
          : NaN;

      const mmm =
        Math.max(
          1,
          Math.min(
            7,
            Math.round(
              toNum(input.mmm)
            )
          )
        );

      const stateIn =
        String(
          input.state ||
          designInfo.stateRef
        )
          .trim()
          .toUpperCase();

      /*
       * New calculator estimates are predicted for the current date.
       */
      const predictionTimestampMs =
        Date.now();

      const timeYears =
        (
          predictionTimestampMs -
          designInfo.timeOriginMs
        ) / MS_PER_YEAR;

      const row = [
        1,
        yearsLog,
        timeYears
      ];

      if (designInfo.mmmCategorical) {
        for (let k = 2; k <= 7; k++) {
          row.push(
            mmm === k ? 1 : 0
          );
        }
      } else {
        row.push(mmm);
      }

      designInfo.stateDummies.forEach(s => {
        row.push(
          stateIn === s ? 1 : 0
        );
      });

      return row;
    }

    /**********************
     * MATRIX HELPERS
     **********************/
    function toNum(v) {
      const n =
        typeof v === 'string'
          ? parseFloat(v)
          : Number(v);

      return Number.isFinite(n)
        ? n
        : NaN;
    }

    function toInt(v) {
      const n =
        typeof v === 'string'
          ? parseInt(v, 10)
          : Math.floor(Number(v));

      return Number.isFinite(n)
        ? n
        : NaN;
    }

    function toDateMs(v) {
      if (v instanceof Date) {
        const ms = v.getTime();

        return Number.isFinite(ms)
          ? ms
          : NaN;
      }

      if (
        typeof v === 'number' &&
        Number.isFinite(v)
      ) {
        if (v > 100000000000) {
          return v;
        }

        if (v > 0) {
          return (
            Date.UTC(1899, 11, 30) +
            v * 24 * 60 * 60 * 1000
          );
        }

        return NaN;
      }

      const text =
        String(v ?? '').trim();

      if (!text) {
        return NaN;
      }

      const googleDateMatch =
        text.match(
          /^Date\((\d{4}),(\d{1,2}),(\d{1,2})(?:,(\d{1,2}),(\d{1,2}),(\d{1,2}))?\)$/
        );

      if (googleDateMatch) {
        return Date.UTC(
          Number(googleDateMatch[1]),
          Number(googleDateMatch[2]),
          Number(googleDateMatch[3]),
          Number(googleDateMatch[4] || 0),
          Number(googleDateMatch[5] || 0),
          Number(googleDateMatch[6] || 0)
        );
      }

      const australianDateMatch =
        text.match(
          /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
        );

      if (australianDateMatch) {
        const day =
          Number(australianDateMatch[1]);

        const month =
          Number(australianDateMatch[2]);

        const year =
          Number(australianDateMatch[3]);

        const hour =
          Number(australianDateMatch[4] || 0);

        const minute =
          Number(australianDateMatch[5] || 0);

        const second =
          Number(australianDateMatch[6] || 0);

        const ms =
          Date.UTC(
            year,
            month - 1,
            day,
            hour,
            minute,
            second
          );

        const parsed =
          new Date(ms);

        const valid =
          parsed.getUTCFullYear() === year &&
          parsed.getUTCMonth() === month - 1 &&
          parsed.getUTCDate() === day &&
          parsed.getUTCHours() === hour &&
          parsed.getUTCMinutes() === minute &&
          parsed.getUTCSeconds() === second;

        return valid
          ? ms
          : NaN;
      }

      const parsedMs =
        Date.parse(text);

      return Number.isFinite(parsedMs)
        ? parsedMs
        : NaN;
    }

    function transpose(A) {
      return A[0].map(
        (_, i) => A.map(r => r[i])
      );
    }

    function multiply(A, B) {
      const r = A.length;
      const c = B[0].length;
      const m = B.length;

      const out = Array.from(
        { length: r },
        () => Array(c).fill(0)
      );

      for (let i = 0; i < r; i++) {
        for (let k = 0; k < m; k++) {
          const aik = A[i][k];

          for (let j = 0; j < c; j++) {
            out[i][j] +=
              aik * B[k][j];
          }
        }
      }

      return out;
    }

    function multiplyVec(A, v) {
      const r = A.length;
      const c = A[0].length;

      const out =
        Array(r).fill(0);

      for (let i = 0; i < r; i++) {
        let s = 0;

        for (let j = 0; j < c; j++) {
          s += A[i][j] * v[j];
        }

        out[i] = s;
      }

      return out;
    }

    function multiplyMatVec(A, v) {
      return multiplyVec(A, v);
    }

    function dot(a, b) {
      let s = 0;

      for (let i = 0; i < a.length; i++) {
        s += a[i] * b[i];
      }

      return s;
    }

    function identity(n) {
      const I = Array.from(
        { length: n },
        () => Array(n).fill(0)
      );

      for (let i = 0; i < n; i++) {
        I[i][i] = 1;
      }

      return I;
    }

    function invert(A) {
      const n = A.length;
      const M = A.map(r => r.slice());
      const I = identity(n);

      for (let c = 0; c < n; c++) {
        let pivot = c;
        let maxAbs =
          Math.abs(M[c][c]);

        for (let r = c + 1; r < n; r++) {
          const v =
            Math.abs(M[r][c]);

          if (v > maxAbs) {
            maxAbs = v;
            pivot = r;
          }
        }

        if (maxAbs === 0) {
          throw new Error(
            'Design matrix is singular (perfect multicollinearity).'
          );
        }

        if (pivot !== c) {
          [M[c], M[pivot]] =
            [M[pivot], M[c]];

          [I[c], I[pivot]] =
            [I[pivot], I[c]];
        }

        const diag =
          M[c][c];

        for (let j = 0; j < n; j++) {
          M[c][j] /= diag;
          I[c][j] /= diag;
        }

        for (let r = 0; r < n; r++) {
          if (r !== c) {
            const f =
              M[r][c];

            for (let j = 0; j < n; j++) {
              M[r][j] -=
                f * M[c][j];

              I[r][j] -=
                f * I[c][j];
            }
          }
        }
      }

      return I;
    }

    function quadForm(
      invXtX,
      x
    ) {
      const tmp =
        multiplyMatVec(
          invXtX,
          x
        );

      return dot(x, tmp);
    }

    function countBy(arr) {
      const c =
        Object.create(null);

      arr.forEach(v => {
        c[v] =
          (c[v] || 0) + 1;
      });

      return c;
    }

    function sortKeysByCountDesc(counts) {
      return Object.keys(counts).sort(
        (a, b) =>
          counts[b] - counts[a]
      );
    }

    document
      .getElementById('estimateBtn')
      .addEventListener(
        'click',
        estimate
      );

    loadModel();
  </script>
</body>
