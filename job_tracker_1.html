          );

        let selectedEmployerTypes =
          uniqueValidValues(
            saved.selectedEmployerTypes,
            EMPLOYER_TYPE_OPTIONS
          );

        if (
          !Array.isArray(
            saved.selectedEmployerTypes
          )
        ) {
          selectedEmployerTypes =
            saved.showCorporates === false
              ? EMPLOYER_TYPE_OPTIONS.filter(
                  value =>
                    value !==
                    'corporate'
                )
              : [
                  ...EMPLOYER_TYPE_OPTIONS
                ];
        }

        let selectedRurality =
          uniqueValidValues(
            saved.selectedRurality,
            RURALITY_OPTIONS
          );

        if (
          !Array.isArray(
            saved.selectedRurality
          )
        ) {
          if (
            saved.locationMode ===
            'metro'
          ) {
            selectedRurality = [
              'metro'
            ];
          } else if (
            saved.locationMode ===
            'nonmetro'
          ) {
            selectedRurality = [
              'nonmetro'
            ];
          } else {
            selectedRurality = [
              ...RURALITY_OPTIONS
            ];
          }
        }

        let selectedStates =
          uniqueValidValues(
            saved.selectedStates,
            STATE_OPTIONS
          );

        if (
          !Array.isArray(
            saved.selectedStates
          )
        ) {
          if (
            saved.stateFilter &&
            saved.stateFilter !==
              'ALL' &&
            STATE_OPTIONS.includes(
              saved.stateFilter
            )
          ) {
            selectedStates = [
              saved.stateFilter
            ];
          } else {
            selectedStates = [
              ...STATE_OPTIONS
            ];
          }
        }

        const selectedClinicalFocus =
          uniqueValidValues(
            saved.selectedClinicalFocus,
            CLINICAL_FOCUS_OPTIONS
          );

        return {
          showRepeats:
            typeof saved
              .showRepeats ===
            'boolean'
              ? saved.showRepeats
              : DEFAULT_FILTERS
                  .showRepeats,

          selectedEmployerTypes,
          selectedRurality,
          selectedStates,

          showDelisted:
            typeof saved.showDelisted ===
            'boolean'
              ? saved.showDelisted
              : DEFAULT_FILTERS
                  .showDelisted,

          selectedClinicalFocus,

          salaryThreshold:
            normaliseSalaryThreshold(
              saved.salaryThreshold
            )
        };
      } catch (error) {
        return cloneDefaultFilters();
      }
    }

    function saveFilters() {
      try {
        localStorage.setItem(
          CONFIG.STORAGE_KEY,
          JSON.stringify(
            state.filters
          )
        );
      } catch (error) {
        console.warn(
          'The browser could not save the filter settings.',
          error
        );
      }
    }

    function setBooleanButton(
      button,
      isOn
    ) {
      button.classList.toggle(
        'is-on',
        isOn
      );

      button.setAttribute(
        'aria-checked',
        String(isOn)
      );

      button
        .querySelector(
          '.filter-value'
        )
        .textContent =
          isOn
            ? 'ON'
            : 'OFF';
    }

    function setMenuOpen(
      menuName,
      shouldOpen
    ) {
      const menuPairs = {
        employer: {
          button:
            employerTypeButton,
          menu:
            employerTypeMenu
        },

        rurality: {
          button:
            ruralityButton,
          menu:
            ruralityMenu
        },

        state: {
          button:
            stateButton,
          menu:
            stateMenu
        },

        clinical: {
          button:
            clinicalFocusButton,
          menu:
            clinicalFocusMenu
        }
      };

      Object.entries(
        menuPairs
      ).forEach(
        ([
          name,
          controls
        ]) => {
          const isOpen =
            shouldOpen &&
            name === menuName;

          controls.menu
            .classList.toggle(
              'is-open',
              isOpen
            );

          controls.button
            .setAttribute(
              'aria-expanded',
              String(isOpen)
            );
        }
      );

      state.openMenu =
        shouldOpen
          ? menuName
          : null;

      if (
        shouldOpen &&
        menuPairs[menuName]
      ) {
        window.requestAnimationFrame(
          () => {
            positionFilterMenu(
              menuPairs[menuName].button,
              menuPairs[menuName].menu
            );
          }
        );
      }
    }

    function positionFilterMenu(button, menu) {
      if (
        !window.matchMedia(
          '(max-width: 900px)'
        ).matches
      ) {
        menu.style.removeProperty('left');
        menu.style.removeProperty('top');
        menu.style.removeProperty('visibility');
        return;
      }

      const viewportMargin = 8;
      const gap = 4;
      const buttonRect =
        button.getBoundingClientRect();

      menu.style.visibility = 'hidden';
      menu.style.left = '0px';
      menu.style.top = '0px';

      const menuRect =
        menu.getBoundingClientRect();

      let left =
        buttonRect.left;

      left = Math.max(
        viewportMargin,
        Math.min(
          left,
          window.innerWidth -
          menuRect.width -
          viewportMargin
        )
      );

      let top =
        buttonRect.bottom + gap;

      if (
        top + menuRect.height >
        window.innerHeight - viewportMargin
      ) {
        top =
          buttonRect.top -
          menuRect.height -
          gap;
      }

      top = Math.max(
        viewportMargin,
        Math.min(
          top,
          window.innerHeight -
          menuRect.height -
          viewportMargin
        )
      );

      menu.style.left =
        `${Math.round(left)}px`;

      menu.style.top =
        `${Math.round(top)}px`;

      menu.style.visibility = '';
    }

    function toggleMenu(menuName) {
      setMenuOpen(
        menuName,
        state.openMenu !==
          menuName
      );
    }

    function getMultiSelectSummary(
      selected,
      allOptions,
      labels
    ) {
      if (
        selected.length ===
        allOptions.length
      ) {
        return 'ALL';
      }

      if (
        selected.length === 0
      ) {
        return 'NONE';
      }

      if (
        selected.length === 1
      ) {
        return labels
          ? labels[selected[0]]
          : selected[0];
      }

      if (
        selected.length === 2 &&
        allOptions === STATE_OPTIONS
      ) {
        return selected.join('+');
      }

      return `${selected.length} SELECTED`;
    }

    function updateMultiSelectOutline(
      button,
      selected,
      colourMap
    ) {
      const valueElement =
        button.querySelector(
          '.filter-value'
        );

      button.style.background =
        '#fff';

      button.style.color =
        'var(--ink)';

      valueElement.style.color =
        selected.length === 0
          ? 'var(--muted)'
          : 'var(--purple)';

      if (
        selected.length === 0
      ) {
        button.style.borderColor =
          'var(--track)';

        return;
      }

      if (
        selected.length === 1
      ) {
        button.style.borderColor =
          colourMap[selected[0]];

        return;
      }

      button.style.borderColor =
        'var(--purple)';
    }

    function updateEmployerTypeControls() {
      const selected =
        state.filters
          .selectedEmployerTypes;

      employerTypeCheckboxes.forEach(
        checkbox => {
          checkbox.checked =
            selected.includes(
              checkbox.value
            );
        }
      );

      employerTypeAllCheckbox.checked =
        selected.length ===
        EMPLOYER_TYPE_OPTIONS.length;

      employerTypeAllCheckbox.indeterminate =
        selected.length > 0 &&
        selected.length <
          EMPLOYER_TYPE_OPTIONS.length;

      employerTypeButton
        .querySelector(
          '.filter-value'
        )
        .textContent =
          getMultiSelectSummary(
            selected,
            EMPLOYER_TYPE_OPTIONS,
            EMPLOYER_TYPE_LABELS
          );

      updateMultiSelectOutline(
        employerTypeButton,
        selected,
        EMPLOYER_TYPE_OUTLINES
      );
    }

    function updateRuralityControls() {
      const selected =
        state.filters
          .selectedRurality;

      ruralityCheckboxes.forEach(
        checkbox => {
          checkbox.checked =
            selected.includes(
              checkbox.value
            );
        }
      );

      ruralityAllCheckbox.checked =
        selected.length ===
        RURALITY_OPTIONS.length;

      ruralityAllCheckbox.indeterminate =
        selected.length > 0 &&
        selected.length <
          RURALITY_OPTIONS.length;

      const labels = {
        metro: 'METRO',
        nonmetro: 'NON-METRO'
      };

      ruralityButton
        .querySelector(
          '.filter-value'
        )
        .textContent =
          getMultiSelectSummary(
            selected,
            RURALITY_OPTIONS,
            labels
          );

      updateMultiSelectOutline(
        ruralityButton,
        selected,
        RURALITY_OUTLINES
      );
    }

    function updateStateControls() {
      const selected =
        state.filters
          .selectedStates;

      stateCheckboxes.forEach(
        checkbox => {
          checkbox.checked =
            selected.includes(
              checkbox.value
            );
        }
      );

      stateAllCheckbox.checked =
        selected.length ===
        STATE_OPTIONS.length;

      stateAllCheckbox.indeterminate =
        selected.length > 0 &&
        selected.length <
          STATE_OPTIONS.length;

      stateButton
        .querySelector(
          '.filter-value'
        )
        .textContent =
          getMultiSelectSummary(
            selected,
            STATE_OPTIONS
          );

      updateMultiSelectOutline(
        stateButton,
        selected,
        STATE_OUTLINES
      );
    }

    function updateClinicalFocusControls() {
      const selected =
        state.filters.selectedClinicalFocus;

      clinicalFocusCheckboxes.forEach(
        checkbox => {
          checkbox.checked =
            selected.includes(
              checkbox.value
            );
        }
      );

      clinicalFocusAnyCheckbox.checked =
        selected.length === 0;

      clinicalFocusAnyCheckbox.indeterminate =
        false;

      const valueElement =
        clinicalFocusButton.querySelector(
          '.filter-value'
        );

      if (selected.length === 0) {
        valueElement.textContent = 'NONE';
      } else if (selected.length === 1) {
        valueElement.textContent =
          CLINICAL_FOCUS_LABELS[selected[0]];
      } else {
        valueElement.textContent =
          `${selected.length} SELECTED`;
      }

      clinicalFocusButton.style.borderColor =
        selected.length === 0
          ? 'var(--track)'
          : 'var(--purple)';

      valueElement.style.color =
        selected.length === 0
          ? 'var(--muted)'
          : 'var(--purple)';
    }

    function updateSalaryControls() {
      const threshold =
        normaliseSalaryThreshold(
          state.filters.salaryThreshold
        );

      state.filters.salaryThreshold =
        threshold;

      salaryThresholdInput.value =
        String(threshold);

      salaryThresholdInput.setAttribute(
        'aria-invalid',
        'false'
      );

      salaryControl.style.borderColor =
        threshold > 0
          ? 'var(--purple)'
          : 'var(--track)';
    }

    function updateAllControls() {
      setBooleanButton(
        repeatToggle,
        state.filters
          .showRepeats
      );

      setBooleanButton(
        delistedToggle,
        state.filters
          .showDelisted
      );

      updateEmployerTypeControls();
      updateRuralityControls();
      updateStateControls();
      updateClinicalFocusControls();
      updateSalaryControls();
    }

    function markTruncatedText(
      element,
      fullText,
      displayText
    ) {
      if (displayText === fullText) {
        return;
      }

      element.title = fullText;
      element.dataset.fullText = fullText;
      element.classList.add('has-full-text');
      element.tabIndex = 0;
      element.setAttribute(
        'aria-label',
        fullText
      );
    }

    function closeFullTextPopover() {
      fullTextPopover.classList.remove(
        'is-visible'
      );

      fullTextPopover.setAttribute(
        'aria-hidden',
        'true'
      );

      fullTextPopover.textContent = '';
      fullTextAnchor = null;
    }

    function showFullTextPopover(element) {
      const fullText =
        element.dataset.fullText;

      if (!fullText) {
        return;
      }

      if (
        fullTextAnchor === element &&
        fullTextPopover.classList.contains(
          'is-visible'
        )
      ) {
        closeFullTextPopover();
        return;
      }

      fullTextAnchor = element;
      fullTextPopover.textContent = fullText;
      fullTextPopover.classList.add(
        'is-visible'
      );
      fullTextPopover.setAttribute(
        'aria-hidden',
        'false'
      );

      fullTextPopover.style.visibility =
        'hidden';

      fullTextPopover.style.left = '0px';
      fullTextPopover.style.top = '0px';

      const anchorRect =
        element.getBoundingClientRect();

      const popoverRect =
        fullTextPopover.getBoundingClientRect();

      const margin = 8;
      const gap = 5;

      let left =
        anchorRect.left;

      left = Math.max(
        margin,
        Math.min(
          left,
          window.innerWidth -
            popoverRect.width -
            margin
        )
      );

      let top =
        anchorRect.bottom + gap;

      if (
        top + popoverRect.height >
        window.innerHeight - margin
      ) {
        top =
          anchorRect.top -
          popoverRect.height -
          gap;
      }

      top = Math.max(
        margin,
        Math.min(
          top,
          window.innerHeight -
            popoverRect.height -
            margin
        )
      );

      fullTextPopover.style.left =
        `${Math.round(left)}px`;

      fullTextPopover.style.top =
        `${Math.round(top)}px`;

      fullTextPopover.style.visibility = '';
    }

    function appendCellContent(
      cellElement,
      cellModel
    ) {
      const fullDisplayText =
        formatDisplayText(
          cellModel.text
        );

      const displayText =
        formatTableCellText(
          cellModel.text
        );

      markTruncatedText(
        cellElement,
        fullDisplayText,
        displayText
      );

      if (cellModel.link) {
        const anchor =
          document.createElement(
            'a'
          );

        anchor.href =
          cellModel.link;

        anchor.target =
          '_blank';

        anchor.rel =
          'noopener noreferrer';

        anchor.textContent =
          displayText;

        anchor.setAttribute(
          'aria-label',
          `${fullDisplayText} — opens in a new tab`
        );

        if (displayText !== fullDisplayText) {
          anchor.title =
            fullDisplayText;
        }

        if (
          cellModel.linkClass
        ) {
          anchor.classList.add(
            cellModel.linkClass
          );
        }

        cellElement.appendChild(
          anchor
        );

        return;
      }

      cellElement.textContent =
        displayText;
    }

    function measureTextWidth(
      text,
      font
    ) {
      const canvas =
        measureTextWidth.canvas ||
        (
          measureTextWidth.canvas =
            document.createElement(
              'canvas'
            )
        );

      const context =
        canvas.getContext('2d');

      context.font = font;

      return context.measureText(
        formatDisplayText(text)
      ).width;
    }

    function applyTightColumnWidths(model) {
      if (!model) {
        return;
      }

      const colgroup =
        dataTable.querySelector(
          'colgroup'
        );

      colgroup.textContent = '';

      const isMobile =
        window.matchMedia(
          '(max-width: 520px)'
        ).matches;

      const headerFont =
        isMobile
          ? '700 11px Lato, sans-serif'
          : '700 12px Lato, sans-serif';

      const cellFont =
        isMobile
          ? '400 11px Lato, sans-serif'
          : '400 12px Lato, sans-serif';

      let totalWidth = 0;

      model.headers.forEach(
        (header, columnIndex) => {
          const sourceColumn =
            header.sourceColumn;

          let measuredWidth =
            measureTextWidth(
              formatTableCellText(
                header.text
              ),
              headerFont
            );

          model.rows.forEach(
            row => {
              const cell =
                row.cells[columnIndex];

              measuredWidth =
                Math.max(
                  measuredWidth,
                  measureTextWidth(
                    formatTableCellText(
                      cell?.text
                    ),
                    cellFont
                  )
                );
            }
          );

          const horizontalPadding =
            isMobile ? 8 : 10;

          let minimumWidth =
            isMobile ? 40 : 44;

          let maximumWidth =
            isMobile ? 360 : 420;

          if (sourceColumn === 1) {
            minimumWidth =
              isMobile ? 56 : 58;

            maximumWidth =
              minimumWidth;
          }

          if (
            sourceColumn ===
              CONFIG.DATE_COLUMN
          ) {
            minimumWidth =
              isMobile ? 60 : 64;

            maximumWidth =
              minimumWidth;
          }

          if (sourceColumn === 10) {
            minimumWidth =
              isMobile ? 60 : 64;

            maximumWidth =
              isMobile ? 68 : 72;
          }

          if (
            sourceColumn ===
              CONFIG.STATE_COLUMN
          ) {
            maximumWidth =
              isMobile ? 52 : 58;
          }

          if (
            sourceColumn ===
              CONFIG.MM_COLUMN
          ) {
            maximumWidth =
              isMobile ? 86 : 94;
          }

          const width =
            Math.max(
              minimumWidth,
              Math.min(
                maximumWidth,
                Math.ceil(
                  measuredWidth +
                  horizontalPadding
                )
              )
            );

          const col =
            document.createElement(
              'col'
            );

          col.style.width =
            `${width}px`;

          colgroup.appendChild(col);
          totalWidth += width;

          if (sourceColumn === 1) {
            document.documentElement
              .style.setProperty(
                '--first-column-width',
                `${width}px`
              );
          }
        }
      );

      dataTable.style.width =
        `${totalWidth}px`;

      dataTable.style.minWidth =
        `${totalWidth}px`;
    }

    function scheduleTightColumnWidths() {
      window.clearTimeout(
        columnResizeTimer
      );

      columnResizeTimer =
        window.setTimeout(
          () => {
            applyTightColumnWidths(
              state.currentModel
            );
          },
          80
        );
    }

    function renderTable(model) {
      state.currentModel = model;

      const thead =
        dataTable.querySelector(
          'thead'
        );

      const tbody =
        dataTable.querySelector(
          'tbody'
        );

      thead.textContent = '';
      tbody.textContent = '';

      const headerRow =
        document.createElement(
          'tr'
        );

      model.headers.forEach(
        header => {
          const th =
            document.createElement(
              'th'
            );

          th.scope = 'col';

          th.dataset.sourceColumn =
            columnNumberToLetter(
              header.sourceColumn
            );

          const fullHeaderText =
            formatDisplayText(
              header.text ||
              columnNumberToLetter(
                header.sourceColumn
              )
            );

          const displayedHeaderText =
            formatTableCellText(
              fullHeaderText
            );

          th.textContent =
            displayedHeaderText;

          markTruncatedText(
            th,
            fullHeaderText,
            displayedHeaderText
          );

          headerRow.appendChild(
            th
          );
        }
      );

      thead.appendChild(
        headerRow
      );

      const fragment =
        document.createDocumentFragment();

      state.rows = [];

      model.rows.forEach(
        rowModel => {
          const tr =
            document.createElement(
              'tr'
            );

          tr.dataset.sourceRow =
            String(
              rowModel.sourceRow
            );

          tr.dataset.week =
            rowModel.weekKey || '';

          if (
            rowModel.isRepeat
          ) {
            tr.classList.add(
              'repeat-row'
            );
          }

          if (
            rowModel.isDelisted
          ) {
            tr.classList.add(
              'delisted-row'
            );
          }

          rowModel.cells.forEach(
            cellModel => {
              const td =
                document.createElement(
                  'td'
                );

              td.dataset.sourceColumn =
                columnNumberToLetter(
                  cellModel
                    .sourceColumn
                );

              appendCellContent(
                td,
                cellModel
              );

              if (
                cellModel
                  .sourceColumn ===
                CONFIG
                  .EMPLOYER_TYPE_COLUMN
              ) {
                const categoryClass =
                  getEmployerTypeClass(
                    cellModel.text
                  );

                if (
                  categoryClass
                ) {
                  td.classList.add(
                    categoryClass
                  );
                }
              }

              if (
                cellModel
                  .sourceColumn ===
                CONFIG.STATE_COLUMN
              ) {
                const stateClass =
                  getStateClass(
                    cellModel.text
                  );

                if (stateClass) {
                  td.classList.add(
                    stateClass
                  );
                }
              }

              if (
                cellModel
                  .sourceColumn ===
                CONFIG.MM_COLUMN
              ) {
                const ruralityClass =
                  getRuralityClass(
                    cellModel.text
                  );

                if (
                  ruralityClass
                ) {
                  td.classList.add(
                    ruralityClass
                  );
                }
              }

              tr.appendChild(td);
            }
          );

          fragment.appendChild(
            tr
          );

          state.rows.push({
            element: tr,

            isRepeat:
              rowModel.isRepeat,

            employerTypeKey:
              rowModel
                .employerTypeKey,

            isDelisted:
              rowModel.isDelisted,

            hasMM1:
              rowModel.hasMM1,

            hasNonMetroMM:
              rowModel
                .hasNonMetroMM,

            stateCodes:
              rowModel.stateCodes,

            clinicalFocus:
              rowModel.clinicalFocus,

            salaryValue:
              rowModel.salaryValue,

            weekKey:
              rowModel.weekKey ||
              '',

            isHidden: false
          });
        }
      );

      tbody.appendChild(
        fragment
      );

      applyTightColumnWidths(
        model
      );

      if (document.fonts?.ready) {
        document.fonts.ready.then(
          () => {
            applyTightColumnWidths(
              model
            );
          }
        );
      }

      applyFilters(false);
    }

    function rowMatchesEmployerType(
      row
    ) {
      const selected =
        state.filters
          .selectedEmployerTypes;

      if (
        selected.length ===
        EMPLOYER_TYPE_OPTIONS.length
      ) {
        return true;
      }

      if (
        selected.length === 0 ||
        !row.employerTypeKey
      ) {
        return false;
      }

      return selected.includes(
        row.employerTypeKey
      );
    }

    function rowMatchesRurality(
      row
    ) {
      const selected =
        state.filters
          .selectedRurality;

      if (
        selected.length ===
        RURALITY_OPTIONS.length
      ) {
        return true;
      }

      if (
        selected.length === 0
      ) {
        return false;
      }

      return (
        (
          selected.includes(
            'metro'
          ) &&
          row.hasMM1
        ) ||
        (
          selected.includes(
            'nonmetro'
          ) &&
          row.hasNonMetroMM
        )
      );
    }

    function rowMatchesState(row) {
      const selected =
        state.filters
          .selectedStates;

      if (
        selected.length ===
        STATE_OPTIONS.length
      ) {
        return true;
      }

      if (
        selected.length === 0
      ) {
        return false;
      }

      return row.stateCodes.some(
        stateCode =>
          selected.includes(
            stateCode
          )
      );
    }

    function rowMatchesClinicalFocus(row) {
      const selected =
        state.filters.selectedClinicalFocus;

      if (selected.length === 0) {
        return true;
      }

      return selected.some(
        focusKey =>
          row.clinicalFocus?.[focusKey] === true
      );
    }

    function rowMatchesSalary(row) {
      const threshold =
        normaliseSalaryThreshold(
          state.filters.salaryThreshold
        );

      if (threshold <= 0) {
        return true;
      }

      return (
        Number.isFinite(
          row.salaryValue
        ) &&
        row.salaryValue >= threshold
      );
    }

    function calculateFilterResult() {
      let visibleCount = 0;

      const rows =
        state.rows.map(
          row => {
            const hidden =
              (
                !state.filters
                  .showRepeats &&
                row.isRepeat
              ) ||
              (
                !state.filters
                  .showDelisted &&
                row.isDelisted
              ) ||
              !rowMatchesEmployerType(
                row
              ) ||
              !rowMatchesRurality(
                row
              ) ||
              !rowMatchesState(
                row
              ) ||
              !rowMatchesClinicalFocus(
                row
              ) ||
              !rowMatchesSalary(
                row
              );

            if (!hidden) {
              visibleCount++;
            }

            return {
              row,
              hidden
            };
          }
        );

      return {
        rows,
        visibleCount,
        totalCount:
          state.rows.length
      };
    }

    function refreshWeekDividers() {
      state.rows.forEach(
        row => {
          row.element
            .classList.remove(
              'week-divider'
            );
        }
      );

      const visibleRows =
        state.rows.filter(
          row =>
            !row.isHidden
        );

      for (
        let index = 0;
        index <
          visibleRows.length - 1;
        index++
      ) {
        const currentRow =
          visibleRows[index];

        const nextRow =
          visibleRows[
            index + 1
          ];

        if (
          currentRow.weekKey &&
          nextRow.weekKey &&
          currentRow.weekKey !==
            nextRow.weekKey
        ) {
          currentRow.element
            .classList.add(
              'week-divider'
            );
        }
      }
    }

    function animateCount(
      element,
      targetValue
    ) {
      if (
        element._animationFrame
      ) {
        cancelAnimationFrame(
          element._animationFrame
        );
      }

      const reducedMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      const currentValue =
        Number(
          element.dataset.current ??
          element.textContent
        ) || 0;

      const target =
        Math.max(
          0,
          Math.min(
            999,
            Number(targetValue) || 0
          )
        );

      if (
        reducedMotion ||
        currentValue === target
      ) {
        element.textContent =
          String(target);

        element.dataset.current =
          String(target);

        return;
      }

      const duration = 520;
      const startedAt =
        performance.now();

      function frame(now) {
        const progress =
          Math.min(
            (now - startedAt) /
              duration,
            1
          );

        const eased =
          1 -
          Math.pow(
            1 - progress,
            3
          );

        const current =
          Math.round(
            currentValue +
            (
              target -
              currentValue
            ) *
            eased
          );

        element.textContent =
          String(current);

        element.dataset.current =
          String(current);

        if (
          progress < 1
        ) {
          element._animationFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          element.textContent =
            String(target);

          element.dataset.current =
            String(target);

          element._animationFrame =
            null;
        }
      }

      element._animationFrame =
        requestAnimationFrame(
          frame
        );
    }

    function updateStatusCounts(
      visibleCount,
      totalCount
    ) {
      animateCount(
        visibleCountElement,
        visibleCount
      );

      animateCount(
        totalCountElement,
        totalCount
      );
    }

    function commitFilterResult(
      result
    ) {
      result.rows.forEach(
        ({
          row,
          hidden
        }) => {
          row.isHidden =
            hidden;

          row.element
            .classList.toggle(
              'is-hidden',
              hidden
            );
        }
      );

      refreshWeekDividers();

      updateStatusCounts(
        result.visibleCount,
        result.totalCount
      );

      emptyState.classList.toggle(
        'is-visible',
        result.visibleCount === 0
      );

      dataTable.style.display =
        result.visibleCount === 0
          ? 'none'
          : '';
    }

    function applyFilters(
      animate = true
    ) {
      const result =
        calculateFilterResult();

      const reducedMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      const token =
        ++filterAnimationToken;

      tableBody
        .getAnimations()
        .forEach(
          animation =>
            animation.cancel()
        );

      if (
        !animate ||
        reducedMotion ||
        !tableBody.children.length
      ) {
        commitFilterResult(
          result
        );

        return;
      }

      const fadeOut =
        tableBody.animate(
          [
            {
              opacity: 1,
              transform:
                'translateY(0)'
            },
            {
              opacity: 0.60,
              transform:
                'translateY(-2px)'
            }
          ],
          {
            duration: 180,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      fadeOut.onfinish = () => {
        if (
          token !==
          filterAnimationToken
        ) {
          return;
        }

        fadeOut.cancel();

        commitFilterResult(
          result
        );

        const fadeIn =
          tableBody.animate(
            [
              {
                opacity: 0.60,
                transform:
                  'translateY(-2px)'
              },
              {
                opacity: 1,
                transform:
                  'translateY(0)'
              }
            ],
            {
              duration: 280,
              easing:
                'cubic-bezier(0.2, 0.8, 0.2, 1)'
            }
          );

        fadeIn.onfinish = () => {
          fadeIn.cancel();
        };
      };
    }

    function commitFilterChange() {
      saveFilters();
      updateAllControls();
      applyFilters(true);
    }

    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );

      window.requestAnimationFrame(
        updateControlsScrollHints
      );
    }

    function showError(error) {
      console.error(error);

      hideLoadingState();

      tableShell.style.display =
        'none';

      document
        .getElementById(
          'table-status'
        )
        .textContent =
          '';

      errorState.textContent =
        'Please refresh the page';

      errorState.classList.add(
        'is-visible'
      );
    }

    async function loadTableData() {
      const maxAttempts =
        2;

      for (
        let attempt = 1;
        attempt <= maxAttempts;
        attempt++
      ) {
        try {
          const model =
            await loadGvizModel();

          renderTable(
            model
          );

          hideLoadingState();

          return;

        } catch (error) {
          if (
            attempt ===
            maxAttempts
          ) {
            showError(
              error
            );

            return;
          }

          await new Promise(
            resolve =>
              window.setTimeout(
                resolve,
                1500
              )
          );
        }
      }
    }
    function updateSelectedValues(
      currentValues,
      checkbox,
      allowedValues
    ) {
      const selected =
        new Set(
          currentValues
        );

      if (
        checkbox.checked
      ) {
        selected.add(
          checkbox.value
        );
      } else {
        selected.delete(
          checkbox.value
        );
      }

      return allowedValues.filter(
        value =>
          selected.has(
            value
          )
      );
    }

    repeatToggle.addEventListener(
      'click',
      () => {
        state.filters
          .showRepeats =
          !state.filters
            .showRepeats;

        commitFilterChange();
      }
    );

    delistedToggle.addEventListener(
      'click',
      () => {
        state.filters
          .showDelisted =
          !state.filters
            .showDelisted;

        commitFilterChange();
      }
    );

    employerTypeButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        toggleMenu(
          'employer'
        );
      }
    );

    ruralityButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        toggleMenu(
          'rurality'
        );
      }
    );

    stateButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        toggleMenu(
          'state'
        );
      }
    );

    clinicalFocusButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        toggleMenu(
          'clinical'
        );
      }
    );

    employerTypeMenu.addEventListener(
      'click',
      event => {
        event.stopPropagation();
      }
    );

    ruralityMenu.addEventListener(
      'click',
      event => {
        event.stopPropagation();
      }
    );

    stateMenu.addEventListener(
      'click',
      event => {
        event.stopPropagation();
      }
    );

    clinicalFocusMenu.addEventListener(
      'click',
      event => {
        event.stopPropagation();
      }
    );

    employerTypeAllCheckbox
      .addEventListener(
        'change',
        () => {
          state.filters
            .selectedEmployerTypes =
            employerTypeAllCheckbox
              .checked
              ? [
                  ...EMPLOYER_TYPE_OPTIONS
                ]
              : [];

          commitFilterChange();
        }
      );

    employerTypeCheckboxes.forEach(
      checkbox => {
        checkbox.addEventListener(
          'change',
          () => {
            state.filters
              .selectedEmployerTypes =
              updateSelectedValues(
                state.filters
                  .selectedEmployerTypes,
                checkbox,
                EMPLOYER_TYPE_OPTIONS
              );

            commitFilterChange();
          }
        );
      }
    );

    ruralityAllCheckbox
      .addEventListener(
        'change',
        () => {
          state.filters
            .selectedRurality =
            ruralityAllCheckbox
              .checked
              ? [
                  ...RURALITY_OPTIONS
                ]
              : [];

          commitFilterChange();
        }
      );

    ruralityCheckboxes.forEach(
      checkbox => {
        checkbox.addEventListener(
          'change',
          () => {
            state.filters
              .selectedRurality =
              updateSelectedValues(
                state.filters
                  .selectedRurality,
                checkbox,
                RURALITY_OPTIONS
              );

            commitFilterChange();
          }
        );
      }
    );

    stateAllCheckbox
      .addEventListener(
        'change',
        () => {
          state.filters
            .selectedStates =
            stateAllCheckbox
              .checked
              ? [
                  ...STATE_OPTIONS
                ]
              : [];

          commitFilterChange();
        }
      );

    stateCheckboxes.forEach(
      checkbox => {
        checkbox.addEventListener(
          'change',
          () => {
            state.filters
              .selectedStates =
              updateSelectedValues(
                state.filters
                  .selectedStates,
                checkbox,
                STATE_OPTIONS
              );

            commitFilterChange();
          }
        );
      }
    );

    clinicalFocusAnyCheckbox.addEventListener(
      'change',
      () => {
        state.filters.selectedClinicalFocus = [];
        commitFilterChange();
      }
    );

    clinicalFocusCheckboxes.forEach(
      checkbox => {
        checkbox.addEventListener(
          'change',
          () => {
            state.filters.selectedClinicalFocus =
              updateSelectedValues(
                state.filters.selectedClinicalFocus,
                checkbox,
                CLINICAL_FOCUS_OPTIONS
              );

            commitFilterChange();
          }
        );
      }
    );

    /*
     * Select the default zero so the first typed digit replaces it
     * rather than being added after it.
     */
    salaryThresholdInput.addEventListener(
      'focus',
      () => {
        if (
          salaryThresholdInput.value === '0'
        ) {
          salaryThresholdInput.select();
        }
      }
    );

    salaryThresholdInput.addEventListener(
      'click',
      () => {
        if (
          salaryThresholdInput.value === '0'
        ) {
          salaryThresholdInput.select();
        }
      }
    );

    salaryThresholdInput.addEventListener(
      'input',
      () => {
        let digits =
          salaryThresholdInput.value
            .replace(/\D/g, '')
            .slice(0, 6);

        digits =
          digits.replace(
            /^0+(?=\d)/,
            ''
          );

        if (
          salaryThresholdInput.value !== digits
        ) {
          salaryThresholdInput.value =
            digits;
        }

        if (digits === '') {
          state.filters.salaryThreshold = 0;
          salaryControl.style.borderColor =
            'var(--track)';
          salaryThresholdInput.setAttribute(
            'aria-invalid',
            'false'
          );
          saveFilters();
          applyFilters(true);
          return;
        }

        const numericValue =
          Number(digits);

        salaryThresholdInput.setAttribute(
          'aria-invalid',
          'false'
        );

        state.filters.salaryThreshold =
          numericValue;

        salaryControl.style.borderColor =
          numericValue > 0
            ? 'var(--purple)'
            : 'var(--track)';

        saveFilters();
        applyFilters(true);
      }
    );

    salaryThresholdInput.addEventListener(
      'blur',
      () => {
        if (salaryThresholdInput.value.trim() === '') {
          state.filters.salaryThreshold = 0;
          salaryThresholdInput.value = '0';
          salaryControl.style.borderColor =
            'var(--track)';
          salaryThresholdInput.setAttribute(
            'aria-invalid',
            'false'
          );
          saveFilters();
          applyFilters(true);
        }
      }
    );

    resetFiltersButton.addEventListener(
      'click',
      () => {
        state.filters =
          cloneDefaultFilters();

        setMenuOpen(
          null,
          false
        );

        commitFilterChange();
      }
    );

    /*
     * Clicking or tapping anywhere outside an open filter control
     * closes its dropdown menu.
     */
    document.addEventListener(
      'pointerdown',
      event => {
        if (
          fullTextPopover.classList.contains(
            'is-visible'
          ) &&
          !event.target.closest(
            '.has-full-text'
          )
        ) {
          closeFullTextPopover();
        }

        if (
          state.openMenu &&
          !event.target.closest(
            '.filter-control'
          )
        ) {
          setMenuOpen(
            null,
            false
          );
        }
      }
    );

    dataTable.addEventListener(
      'click',
      event => {
        const textElement =
          event.target.closest(
            '.has-full-text'
          );

        if (
          !textElement ||
          !dataTable.contains(
            textElement
          ) ||
          event.target.closest('a')
        ) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();

        showFullTextPopover(
          textElement
        );
      }
    );

    dataTable.addEventListener(
      'keydown',
      event => {
        if (
          event.key !== 'Enter' &&
          event.key !== ' '
        ) {
          return;
        }

        const textElement =
          event.target.closest(
            '.has-full-text'
          );

        if (!textElement) {
          return;
        }

        event.preventDefault();
        showFullTextPopover(
          textElement
        );
      }
    );

    document.addEventListener(
      'keydown',
      event => {
        if (
          event.key ===
          'Escape'
        ) {
          setMenuOpen(
            null,
            false
          );

          closeFullTextPopover();
        }
      }
    );

    controlsScroller.addEventListener(
      'scroll',
      () => {
        updateControlsScrollHints();

        if (state.openMenu) {
          setMenuOpen(
            null,
            false
          );
        }

        closeFullTextPopover();
      },
      {
        passive:
          true
      }
    );

    document
      .querySelector('.table-scroll')
      .addEventListener(
        'scroll',
        closeFullTextPopover,
        {
          passive: true
        }
      );

    window.addEventListener(
      'resize',
      () => {
        setMenuOpen(
          null,
          false
        );

        closeFullTextPopover();
        scheduleTightColumnWidths();
        updateControlsScrollHints();
      }
    );

    updateAllControls();
    loadTableData();
    loadLastUpdatedDate();

    window.setInterval(
      loadLastUpdatedDate,
      CONFIG.LAST_UPDATED_REFRESH_MS
    );
  </script>
</body>
