<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Clinical Optometry Job Tracker</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;

      --track: #f0f2f5;
      --row-line: #f8f9fa;
      --week-line: #cdd2da;
      --soft: #f7f7f9;

      --repeat-red: #cc0000;
      --repeat-row-background: rgba(204, 0, 0, 0.08);
      --repeat-row-solid: #fbebeb;

      --delisted-grey: #989da6;

      --seek-pink: #e5007d;
      --indeed-blue: #2557a7;
      --essilux-blue: #49b7e8;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --corporate-text: #00b26f;
      --independent-text: #5a3be7;
      --ophthal-text: #ffb000;
      --other-text: #bfc3c7;

      --state-nsw: #2db7f5;
      --state-qld: #7a0036;
      --state-act: #7b61ff;
      --state-vic: #2d3a8c;
      --state-sa: #f03a47;
      --state-nt: #c25e00;
      --state-wa: #000000;
      --state-tas: #22a36b;

      --rurality-metro: #3f4851;
      --rurality-nonmetro: #9f6545;

      --first-column-width: 58px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    input,
    select,
    textarea {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 2px 4px;
    }

    #app.is-loading .content {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .content {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 6px 5px;
    }

    .status-group {
      min-width: 0;
      text-align: left;
    }

    .live-data-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #e53935;
    }

    .last-updated-text {
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .table-status {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
      white-space: nowrap;
    }

    .status-count {
      display: inline-block;
      width: 3ch;
      min-width: 3ch;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .controls-scroll-shell {
      position: relative;
      min-width: 0;
    }

    .controls-scroller {
      min-width: 0;
      overflow: visible;
    }

    .controls-scroll-arrow {
      position: absolute;
      top: 5px;
      z-index: 3;

      display: none;
      width: 18px;
      height: 20px;
      align-items: center;
      justify-content: center;

      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 10px;

      font-size: 18px;
      font-weight: 700;
      line-height: 1;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 160ms ease;
    }

    .controls-scroll-arrow-left {
      left: 0;
    }

    .controls-scroll-arrow-right {
      right: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }

    .filter-control {
      position: relative;
      flex: 0 0 auto;
    }

    .filter-button,
    .reset-button {
      min-height: 31px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      cursor: pointer;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .filter-button:hover,
    .filter-button[aria-expanded="true"],
    .reset-button:hover {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .filter-button:focus-visible,
    .reset-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .boolean-button {
      display: grid;
      grid-template-columns: 15px max-content 32px 8px;
      align-items: center;
      gap: 4px;
      border-color: var(--track);
    }

    .boolean-button::after {
      content: "";
      width: 8px;
      height: 1px;
    }

    .boolean-button.is-on {
      border-color: var(--purple);
    }

    .multi-filter-button {
      display: grid;
      grid-template-columns: max-content 58px 8px;
      align-items: center;
      gap: 4px;
    }

    .salary-inline-control {
      display: grid;
      grid-template-columns: max-content auto;
      align-items: center;
      gap: 6px;
      min-height: 31px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      cursor: text;
    }

    .salary-inline-value {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .salary-inline-input {
      width: 48px;
      min-width: 48px;
      height: 22px;
      padding: 0;
      color: var(--purple);
      background: #fff;
      border: 0;
      outline: 0;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      text-align: left;
      -moz-appearance: textfield;
    }

    .salary-inline-input::-webkit-outer-spin-button,
    .salary-inline-input::-webkit-inner-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    .salary-inline-input:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    #repeat-toggle {
      min-width: 194px;
    }

    #employer-type-button {
      min-width: 156px;
      grid-template-columns: max-content 70px 8px;
    }

    #rurality-button {
      min-width: 206px;
      grid-template-columns: max-content 60px 8px;
    }

    #state-button {
      min-width: 124px;
    }

    #delisted-toggle {
      min-width: 130px;
    }

    #clinical-focus-button {
      min-width: 158px;
    }

    #salary-control {
      min-width: 146px;
    }

    #reset-filters {
      min-width: 94px;
    }

    .filter-label-wrap {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 1px;
      text-align: left;
    }

    .filter-label {
      color: var(--ink);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.05;
      white-space: nowrap;
    }

    .filter-subtext {
      color: var(--muted);
      font-size: 8px;
      font-weight: 400;
      line-height: 1.05;
      white-space: nowrap;
    }

    .filter-value {
      display: inline-block;
      width: 58px;
      min-width: 58px;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.025em;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }

    .boolean-button .filter-value {
      width: 32px;
      min-width: 32px;
    }

    .boolean-button:not(.is-on) .filter-value {
      color: var(--muted);
    }

    .binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      flex: 0 0 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .boolean-button.is-on .binary-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .boolean-button.is-on .binary-indicator::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    #repeat-toggle.is-on {
      background: var(--repeat-row-background);
    }

    #delisted-toggle .filter-label {
      color: var(--delisted-grey);
    }

    #delisted-toggle.is-on .filter-value {
      color: var(--purple);
    }

    #delisted-toggle:not(.is-on) .filter-value {
      color: var(--muted);
    }

    .menu-arrow {
      width: 0;
      height: 0;
      min-width: 0;
      flex: 0 0 auto;
      border-top: 4px solid var(--muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .filter-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    .reset-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
    }

    .reset-button:hover {
      color: var(--ink);
      border-color: var(--ink);
    }

    .reset-icon {
      display: inline-block;
      color: var(--purple);
      font-size: 15px;
      line-height: 1;
    }

    .filter-menu {
      position: absolute;
      z-index: 50;
      top: calc(100% + 4px);
      right: 0;
      display: none;
      min-width: 164px;
      padding: 5px 0;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
      text-align: left;
    }

    #rurality-menu {
      min-width: 190px;
    }

    #employer-type-menu {
      min-width: 180px;
    }

    .filter-menu.is-open {
      display: block;
    }

    .filter-menu-title {
      margin: 0;
      padding: 6px 10px 7px;
      color: var(--muted);
      background: #fff;
      border-bottom: 1px solid var(--track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 10px;
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.25;
      cursor: pointer;
      user-select: none;
    }

    .filter-option:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .filter-option input {
      width: 14px;
      height: 14px;
      min-width: 14px;
      max-width: 14px;
      flex: 0 0 14px;
      margin: 0;
      accent-color: var(--purple);
      cursor: pointer;
    }

    .filter-option-all {
      color: var(--ink);
      border-bottom: 1px solid var(--track);
      font-weight: 700;
    }

    .employer-option-corporate {
      color: var(--corporate-text);
      font-weight: 700;
    }

    .employer-option-independent {
      color: var(--independent-text);
      font-weight: 700;
    }

    .employer-option-ophthal {
      color: var(--ophthal-text);
      font-weight: 700;
    }

    .employer-option-other {
      color: var(--other-text);
      font-weight: 700;
    }

    .rurality-option-metro {
      color: var(--rurality-metro);
      font-weight: 700;
    }

    .rurality-option-nonmetro {
      color: var(--rurality-nonmetro);
      font-weight: 700;
    }

    .state-option-code {
      min-width: 30px;
      font-weight: 700;
    }

    .state-filter-nsw { color: var(--state-nsw); }
    .state-filter-qld { color: var(--state-qld); }
    .state-filter-act { color: var(--state-act); }
    .state-filter-vic { color: var(--state-vic); }
    .state-filter-sa { color: var(--state-sa); }
    .state-filter-nt { color: var(--state-nt); }
    .state-filter-wa { color: var(--state-wa); }
    .state-filter-tas { color: var(--state-tas); }

    .table-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
      border-top: 0;
      border-bottom: 1px solid var(--track);
      border-radius: 0;
      box-shadow: none;
      isolation: isolate;
    }

    .table-shell::after {
      content: "";
      position: absolute;
      z-index: 12;
      top: 0;
      bottom: 0;
      left: var(--first-column-width);
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .table-scroll {
      width: 100%;
      max-height: calc(100vh - 94px);
      overflow: auto;
      overscroll-behavior-x: contain;
      overscroll-behavior-y: auto;
      scrollbar-gutter: stable;
    }

    .data-table {
      width: max-content;
      min-width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    .data-table thead {
      position: sticky;
      z-index: 7;
      top: 0;
      background: #fff;
    }

    .data-table thead::after {
      content: "";
      position: absolute;
      z-index: 13;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      pointer-events: none;
      background: var(--ink);
    }

    .data-table th,
    .data-table td {
      position: relative;
      min-width: 0;
      padding: 6px 6px;
      border-right: 1px solid var(--track);
      border-bottom: 1px solid var(--row-line);
      line-height: 1.2;
      text-align: left;
      vertical-align: middle;
      overflow: hidden;
      overflow-wrap: normal;
      text-overflow: clip;
      white-space: nowrap;
    }

    .data-table th {
      color: var(--muted);
      background: #fff;
      border-bottom: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .data-table td {
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      font-weight: 400;
    }

    .data-table th[data-source-column="A"],
    .data-table td[data-source-column="A"] {
      position: sticky;
      left: 0;
      width: var(--first-column-width);
      min-width: var(--first-column-width);
      max-width: var(--first-column-width);
      padding-right: 4px;
      padding-left: 4px;
      overflow: hidden;
      background: #fff;
      background-clip: padding-box;
      text-overflow: clip;
      white-space: nowrap;
    }

    .data-table th[data-source-column="A"] {
      z-index: 11;
    }

    .data-table td[data-source-column="A"] {
      z-index: 5;
      font-weight: 700;
    }

    .data-table tr.repeat-row td[data-source-column="A"] {
      background: var(--repeat-row-solid);
    }

    .data-table th[data-source-column="D"],
    .data-table td[data-source-column="D"],
    .data-table th[data-source-column="G"],
    .data-table td[data-source-column="G"],
    .data-table th[data-source-column="I"],
    .data-table td[data-source-column="I"],
    .data-table th[data-source-column="K"],
    .data-table td[data-source-column="K"] {
      white-space: nowrap;
    }

    .data-table th:last-child,
    .data-table td:last-child {
      border-right: 0;
    }

    .data-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .data-table tbody tr:hover td {
      filter: brightness(0.988);
    }

    .data-table tbody tr.week-divider td {
      border-bottom: 1px solid var(--week-line);
      box-shadow: inset 0 -1px 0 var(--week-line);
    }

    .data-table a {
      color: var(--purple);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      -webkit-user-drag: none;
    }
    .data-table a:hover {
      text-decoration-thickness: 2px;
    }

    .data-table a.link-seek { color: var(--seek-pink); }
    .data-table a.link-indeed { color: var(--indeed-blue); }
    .data-table a.link-essilux { color: var(--essilux-blue); }

    .data-table tr.repeat-row td {
      background: var(--repeat-row-background);
    }

    .data-table td.category-corporate {
      color: var(--corporate-text);
      font-weight: 700;
    }

    .data-table td.category-independent {
      color: var(--independent-text);
      font-weight: 700;
    }

    .data-table td.category-ophthal {
      color: var(--ophthal-text);
      font-weight: 700;
    }

    .data-table td.category-other {
      color: var(--other-text);
      font-weight: 700;
    }

    .data-table td.state-nsw { color: var(--state-nsw); font-weight: 700; }
    .data-table td.state-qld { color: var(--state-qld); font-weight: 700; }
    .data-table td.state-act { color: var(--state-act); font-weight: 700; }
    .data-table td.state-vic { color: var(--state-vic); font-weight: 700; }
    .data-table td.state-sa { color: var(--state-sa); font-weight: 700; }
    .data-table td.state-nt { color: var(--state-nt); font-weight: 700; }
    .data-table td.state-wa { color: var(--state-wa); font-weight: 700; }
    .data-table td.state-tas { color: var(--state-tas); font-weight: 700; }

    .data-table td.rurality-metro {
      color: var(--rurality-metro);
      font-weight: 700;
    }

    .data-table td.rurality-nonmetro {
      color: var(--rurality-nonmetro);
      font-weight: 700;
    }

    .data-table tr.delisted-row td,
    .data-table tr.delisted-row td a,
    .data-table tr.delisted-row td a.link-seek,
    .data-table tr.delisted-row td a.link-indeed,
    .data-table tr.delisted-row td a.link-essilux {
      color: var(--delisted-grey) !important;
    }

    .has-full-text {
      cursor: help;
    }

    .has-full-text:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .full-text-popover {
      position: fixed;
      z-index: 200;
      display: none;

    function normaliseText(value) {
      return String(value ?? '')
        .replace(/\u00A0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ')
        .toLowerCase();
    }

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00A0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function formatDisplayText(value) {
      const text = cleanText(value)
        .replace(/\s*;\s*/g, '; ');

      if (
        !text ||
        normaliseText(text) === 'xxx'
      ) {
        return '—';
      }

      const normalised =
        normaliseText(text);

      if (normalised === 'yes') {
        return '✓';
      }

      if (normalised === 'no') {
        return '×';
      }

      if (
        normalised.startsWith('ophthal') ||
        normalised.startsWith('opthal')
      ) {
        return 'Ophthal';
      }

      return text;
    }

    function formatEmploymentTypeText(value) {
      return cleanText(value)
        .replace(/\s*;\s*/g, '; ')
        .replace(/\blocum\s*\/\s*temp\b/gi, 'Temp');
    }

    function formatTableCellText(value) {
      const text = formatDisplayText(value);

      return text.length > 15
        ? `${text.slice(0, 15)}...`
        : text;
    }

    function isRepeatValue(value) {
      return normaliseText(value) === 'yes';
    }

    function isDelistedValue(value) {
      return normaliseText(value)
        .startsWith('delisted');
    }

      }

      if (
        text === 'corporate' ||
        text.startsWith('corporate ') ||
        text.startsWith('corporate(')
      ) {
        return 'corporate';
      }

      if (
        text === 'independent' ||
        text.startsWith('independent ') ||
        text.startsWith('independent(')
      ) {
        return 'independent';
      }

      if (
        text.includes('ophthal') ||
        text.includes('opthal')
      ) {
        return 'ophthal';
      }

      return 'other';
    }

    function getEmployerTypeClass(value) {
      const employerType =
        getEmployerTypeKey(value);

      return employerType
        ? `category-${employerType}`
        : '';
    }

    function getStateCodes(value) {
      const text =
        cleanText(value).toUpperCase();

      const matches =
        text.match(
          /\b(?:NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/g
        ) || [];

      return [
        ...new Set(matches)
      ];
    }

    function getStateClass(value) {
      const stateCode =
        getStateCodes(value)[0] || '';

      return stateCode
        ? `state-${stateCode.toLowerCase()}`
        : '';
    }

    function getMMCodes(value) {
      const text =
        cleanText(value).toUpperCase();

      const matches = [
        ...text.matchAll(
          /\bMM\s*([1-7])\b/g
        )
      ];

      return [
        ...new Set(
          matches.map(
            match => `MM${match[1]}`
          )
        )
      ];
    }

    function getRuralityClass(value) {
      const text =
        normaliseText(value);

      if (
        !text ||
        text === 'xxx'
      ) {
        return '';
      }

      const mmCodes =
        getMMCodes(value);

      if (
        mmCodes.includes('MM1')
      ) {
        return 'rurality-metro';
      }

      return 'rurality-nonmetro';
    }

    function columnNumberToLetter(
      columnNumber
    ) {
      let number = columnNumber;
      let letters = '';

      while (number > 0) {
        const remainder =
          (number - 1) % 26;

        letters =
          String.fromCharCode(
            65 + remainder
          ) + letters;

        number =
          Math.floor(
            (number - 1) / 26
          );
      }

      return letters;
    }

    function getVisibleColumnNumbers() {
      const columns = [];

      for (
        let column =
          CONFIG.FIRST_COLUMN;
        column <=
          CONFIG.LAST_COLUMN;
        column++
      ) {
        if (
          !CONFIG.HIDDEN_COLUMNS.has(
            column
          )
        ) {
          columns.push(column);
        }
      }

      return columns;
    }

    function getGvizCellDisplay(cell) {
      if (!cell) {
        return '';
      }

      return cleanText(
        cell.f ??
        cell.v ??
        ''
      );
    }

    function getSydneyToday() {
      try {
        const parts =
          new Intl.DateTimeFormat(
            'en-AU',
            {
              timeZone:
                'Australia/Sydney',

              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            }
          ).formatToParts(
            new Date()
          );

        const values =
          Object.fromEntries(
            parts
              .filter(
                part =>
                  part.type !==
                  'literal'
              )
              .map(
                part => [
                  part.type,
                  Number(part.value)
                ]
              )
          );

        return new Date(
          Date.UTC(
            values.year,
            values.month - 1,
            values.day
          )
        );
      } catch (error) {
        const now = new Date();

        return new Date(
          Date.UTC(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
          )
        );
      }
    }

    function subtractCalendarMonths(
      date,
      months
    ) {
      const targetFirstDay =
        new Date(
          Date.UTC(
            date.getUTCFullYear(),
            date.getUTCMonth() -
              months,
            1
          )
        );

      const finalDayOfTargetMonth =
        new Date(
          Date.UTC(
            targetFirstDay
              .getUTCFullYear(),

            targetFirstDay
              .getUTCMonth() + 1,

            0
          )
        ).getUTCDate();

      return new Date(
        Date.UTC(
          targetFirstDay
            .getUTCFullYear(),

          targetFirstDay
            .getUTCMonth(),

          Math.min(
            date.getUTCDate(),
            finalDayOfTargetMonth
          )
        )
      );
    }

    function parseDateValue(value) {
      if (
        value instanceof Date &&
        !Number.isNaN(
          value.getTime()
        )
      ) {
        return new Date(
          Date.UTC(
            value.getFullYear(),
            value.getMonth(),
            value.getDate()
          )
        );
      }

      const text =
        cleanText(value);

      if (!text) {
        return null;
      }

      let match =
        text.match(
          /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/i
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]),
            Number(match[3])
          )
        );
      }

      match =
        text.match(
          /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
        );

      if (match) {
        let year =
          Number(match[3]);

        if (year < 100) {
          year +=
            year >= 70
              ? 1900
              : 2000;
        }

        return new Date(
          Date.UTC(
            year,
            Number(match[2]) - 1,
            Number(match[1])
          )
        );
      }

      match =
        text.match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
          )
        );
      }

      const parsed =
        new Date(text);

      if (
        !Number.isNaN(
          parsed.getTime()
        )
      ) {
        return new Date(
          Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          )
        );
      }

      return null;
    }

    function parseDisplayedDate(value) {
      const text =
        cleanText(value);

      if (!text) {
        return null;
      }

      const match =
        text.match(
          /^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/
        );

      if (!match) {
        return null;
      }

      const day =
        Number(match[1]);

      const month =
        Number(match[2]);

      let year =
        Number(match[3]);

      if (year < 100) {
        year += 2000;
      }

      const date =
        new Date(
          Date.UTC(
            year,
            month - 1,
            day
          )
        );

      if (
        date.getUTCFullYear() !== year ||
        date.getUTCMonth() !== month - 1 ||
        date.getUTCDate() !== day
      ) {
        return null;
      }

      return date;
    }

    function getDateFromGvizCell(cell) {
      return (
        parseDateValue(cell?.v) ||
        parseDateValue(cell?.f)
      );
    }

    function getMondayWeekKey(dateValue) {
      const date =
        parseDateValue(dateValue);

      if (!date) {
        return '';
      }

      const daysSinceMonday =
        (date.getUTCDay() + 6) %
        7;

      date.setUTCDate(
        date.getUTCDate() -
          daysSinceMonday
      );

      const year =
        date.getUTCFullYear();

      const month =
        String(
          date.getUTCMonth() + 1
        ).padStart(2, '0');

      const day =
        String(
          date.getUTCDate()
        ).padStart(2, '0');

      return `${year}-${month}-${day}`;
    }

    function formatDateNumeric(date) {
      if (
        !(date instanceof Date) ||
        Number.isNaN(date.getTime())
      ) {
        return '—';
      }

      const day =
        String(
          date.getUTCDate()
        ).padStart(2, '0');

      const month =
        String(
          date.getUTCMonth() + 1
        ).padStart(2, '0');

      const year =
        date.getUTCFullYear();

      return `${day}/${month}/${year}`;
    }


    function formatDateDayMonth(date) {
      if (
        !(date instanceof Date) ||
        Number.isNaN(date.getTime())
      ) {
        return '—';
      }

      const day =
        String(
          date.getUTCDate()
        ).padStart(2, '0');

      const month =
        String(
          date.getUTCMonth() + 1
        ).padStart(2, '0');

      return `${day}/${month}`;
    }

    function parseSalaryValue(value) {
      if (
        typeof value === 'number' &&
        Number.isFinite(value)
      ) {
        return value;
      }

      const text =
        cleanText(value)
          .toLowerCase();

      if (
        !text ||
        text === 'xxx'
      ) {
        return null;
      }

      const values = [];
      const expression =
        /(?:\$|aud\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k)?/gi;

      let match;

      while (
        (match = expression.exec(text))
      ) {
        let number =
          Number(
            match[1].replace(/,/g, '')
          );

        if (
          match[2] &&
          Number.isFinite(number)
        ) {
          number *= 1000;
        }

        if (
          Number.isFinite(number)
        ) {
          values.push(number);
        }
      }

      return values.length
        ? Math.max(...values)
        : null;
    }

    function getSalaryValueFromGvizCell(cell) {
      if (!cell) {
        return null;
      }

      if (
        typeof cell.v === 'number' &&
        Number.isFinite(cell.v)
      ) {
        return cell.v;
      }

      return parseSalaryValue(
        cell.f ??
        cell.v ??
        ''
      );
    }

    function normaliseSalaryThreshold(value) {
      if (
        value === null ||
        value === undefined ||
        cleanText(value) === ''
      ) {
        return 0;
      }

      const number = Number(value);

      return (
        Number.isFinite(number) &&
        number >= 0
      )
        ? Math.min(
            Math.floor(number),
            999999
          )
        : 0;
    }


    function canBuildJobLink(
      employer,
      suburb,
      stateCode
    ) {
      if (!cleanText(employer)) {
        return false;
      }

      if (
        normaliseText(suburb) ===
        'xxx'
      ) {
        return (
          cleanText(stateCode) !== ''
        );
      }

      return cleanText(suburb) !== '';
    }

    function buildColumnALink(
      sourceMarker,
      employerValue,
      suburbValue,
      stateValue
    ) {
      const sourceMarkerText =
        cleanText(sourceMarker);

      const employer =
        cleanText(employerValue);

      const suburb =
        cleanText(suburbValue);

      const stateCode =
        cleanText(stateValue);

      if (
        !canBuildJobLink(
          employer,
          suburb,
          stateCode
        )
      ) {
        return null;
      }

      const keywords =
        `"Optometrist" ${employer}`;

      const isIndeed =
        normaliseText(
          sourceMarkerText
        ).endsWith('indeed|');

      const employerWithoutSpaces =
        employer
          .replace(/\s+/g, '')
          .toLowerCase();

      const isEssiLux =
        /(opsm|eyeq|laubman&pank)/i
          .test(
            employerWithoutSpaces
          );

      if (isIndeed) {
        const location =
          normaliseText(suburb) ===
          'xxx'
            ? stateCode
            : `${suburb} ${stateCode}`
                .trim();

        return {
          text: 'Indeed',

          url:
            `https://au.indeed.com/jobs?q=${encodeURIComponent(keywords)}` +
            `&l=${encodeURIComponent(location)}` +
            '&radius=0' +
            '&sort=date',

          className:
            'link-indeed'
        };
      }

      if (isEssiLux) {
        return {
          text: 'EssiLux',

          url:
            'https://careers.essilorluxottica.com/search/' +
            '?createNewAlert=false' +
            '&q=optometrist' +
            '&optionsFacetsDD_country=AU' +
            '&optionsFacetsDD_city=' +
            '&optionsFacetsDD_customfield1=' +
            '&optionsFacetsDD_customfield2=' +
            '&optionsFacetsDD_customfield3=' +
            '&optionsFacetsDD_customfield4=',

          className:
            'link-essilux'
        };
      }

      const firstSuburb =
        suburb
          .split(';')[0]
          .trim();

      const location =
        normaliseText(suburb) ===
        'xxx'
          ? stateCode
          : `${firstSuburb} ${stateCode}`
              .trim();

      return {
        text: 'SEEK',

        url:
          `https://www.seek.com.au/jobs?keywords=${encodeURIComponent(keywords)}` +
          `&where=${encodeURIComponent(location)}` +
          '&distance=0',

        className:
          'link-seek'
      };
    }

    function buildModelFromGviz(
      response
    ) {
      if (
        response?.status === 'error'
      ) {
        throw new Error(
          response?.errors?.[0]
            ?.detailed_message ||
          response?.errors?.[0]
            ?.message ||
          'Google Sheets returned an error.'
        );
      }

      const visibleColumns =
        getVisibleColumnNumbers();

      const columns =
        response?.table?.cols || [];

      const sourceRows =
        response?.table?.rows || [];

      const headers =
        visibleColumns.map(
          columnNumber => ({
            sourceColumn:
              columnNumber,

            text:
              ({
                [CONFIG.MM_COLUMN]: 'Rurality',
                13: 'Days / Week',
                15: 'Mentoring / Peer Optoms',
                17: 'Thursday Nights',
                18: 'Weekend Day(s)',
                24: 'Bonuses',
                25: 'Professional Memberships'
              })[columnNumber] ||
              cleanText(
                columns?.[
                  columnNumber - 1
                ]?.label
              ) ||
              columnNumberToLetter(
                columnNumber
              )
          })
        );

      const rows = [];

      sourceRows.forEach(
        (
          sourceRow,
          rowOffset
        ) => {
          const cells =
            sourceRow?.c || [];

          const sourceAText =
            getGvizCellDisplay(
              cells[0]
            );

          if (!sourceAText) {
            return;
          }

          const dateValue =
            getDateFromGvizCell(
              cells[
                CONFIG.DATE_COLUMN -
                  1
              ]
            );

          if (
            !dateValue ||
            dateValue <
              state.dateCutoff
          ) {
            return;
          }

          const repeatValue =
            getGvizCellDisplay(
              cells[
                CONFIG
                  .REPEAT_FLAG_COLUMN -
                  1
              ]
            );

          const sourceMarker =
            getGvizCellDisplay(
              cells[
                CONFIG.SOURCE_COLUMN -
                  1
              ]
            );

          const employerValue =
            getGvizCellDisplay(
              cells[
                CONFIG.EMPLOYER_COLUMN -
                  1
              ]
            );

          const employerTypeValue =
            getGvizCellDisplay(
              cells[
                CONFIG
                  .EMPLOYER_TYPE_COLUMN -
                  1
              ]
            );

          const suburbValue =
            getGvizCellDisplay(
              cells[
                CONFIG.SUBURB_COLUMN -
                  1
              ]
            );

          const stateValue =
            getGvizCellDisplay(
              cells[
                CONFIG.STATE_COLUMN -
                  1
              ]
            );

          const mmValue =
            getGvizCellDisplay(
              cells[
                CONFIG.MM_COLUMN - 1
              ]
            );

          const contactLensValue =
            getGvizCellDisplay(
              cells[
                CONFIG.CONTACT_LENS_COLUMN - 1
              ]
            );

          const paediatricValue =
            getGvizCellDisplay(
              cells[
                CONFIG.PAEDIATRIC_COLUMN - 1
              ]
            );

          const ocularPathologyValue =
            getGvizCellDisplay(
              cells[
                CONFIG.OCULAR_PATHOLOGY_COLUMN - 1
              ]
            );

          const salaryValue =
            getSalaryValueFromGvizCell(
              cells[
                CONFIG.SALARY_COLUMN - 1
              ]
            );

          const isDelisted =
            isDelistedValue(
              sourceAText
            );

          const columnALink =
            isDelisted
              ? null
              : buildColumnALink(
                  sourceMarker,
                  employerValue,
                  suburbValue,
                  stateValue
                );

          const stateCodes =
            getStateCodes(
              stateValue
            );

          const mmCodes =
            getMMCodes(
              mmValue
            );

          rows.push({
            sourceRow:
              CONFIG.HEADER_ROW +
              1 +
              rowOffset,

            isRepeat:
              isRepeatValue(
                repeatValue
              ),

            employerTypeKey:
              getEmployerTypeKey(
                employerTypeValue
              ),

            isDelisted,

            hasMM1:
              mmCodes.includes(
                'MM1'
              ),

            hasNonMetroMM:
              mmCodes.some(
                code =>
                  code !== 'MM1'
              ),

            stateCodes,

            clinicalFocus: {
              contactLens:
                normaliseText(contactLensValue) === 'yes',

              paediatric:
                normaliseText(paediatricValue) === 'yes',

              ocularPathology:
                normaliseText(ocularPathologyValue) === 'yes'
            },

            salaryValue,

            weekKey:
              getMondayWeekKey(
                dateValue
              ),

            cells:
              visibleColumns.map(
                columnNumber => {
                  if (
                    columnNumber === 1
                  ) {
                    if (isDelisted) {
                      return {
                        sourceColumn: 1,
                        text: sourceAText,
                        link: '',
                        linkClass: ''
                      };
                    }

                    return {
                      sourceColumn: 1,

                      text:
                        columnALink?.text ||
                        sourceAText,

                      link:
                        columnALink?.url ||
                        '',

                      linkClass:
                        columnALink
                          ?.className ||
                        ''
                    };
                  }

                  return {
                    sourceColumn:
                      columnNumber,

                    text:
                      columnNumber === CONFIG.DATE_COLUMN
                        ? formatDateDayMonth(dateValue)
                        : (
                            columnNumber === CONFIG.EMPLOYMENT_TYPE_COLUMN
                              ? formatEmploymentTypeText(
                                  getGvizCellDisplay(
                                    cells[
                                      columnNumber -
                                        1
                                    ]
                                  )
                                )
                              : getGvizCellDisplay(
                                  cells[
                                    columnNumber -
                                      1
                                  ]
                                )
                          ),

                    link: '',
                    linkClass: ''
                  };
                }
              )
          });
        }
      );

      return {
        headers,
        rows
      };
    }

    function loadGvizModel() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffJobTrackerCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

          const script =
            document.createElement(
              'script'
            );

          let settled = false;

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'The live Google Sheets feed timed out.'
                  )
                );
              },
              CONFIG
                .FETCH_TIMEOUT_MS
            );

          function cleanup() {
            if (settled) {
              return;
            }

            settled = true;

            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (error) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }

          window[callbackName] =
            response => {
              try {
                const model =
                  buildModelFromGviz(
                    response
                  );

                cleanup();
                resolve(model);
              } catch (error) {
                cleanup();
                reject(error);
              }
            };

          script.onerror = () => {
            cleanup();

            reject(
              new Error(
                'The live Google Sheets feed could not be loaded.'
              )
            );
          };

          const params =
            new URLSearchParams({
              range:
                `A${CONFIG.HEADER_ROW}:Y`,

              headers: '1',

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(Date.now())
            });

          if (CONFIG.SHEET_NAME) {
            params.set(
              'sheet',
              CONFIG.SHEET_NAME
            );
          }

          script.src =
            `https://docs.google.com/spreadsheets/d/${CONFIG.SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

          document.body
            .appendChild(script);
        }
      );
    }

    function getSecondMostRecentDate(
      response
    ) {
      const rows =
        response?.table?.rows || [];

      const dates = rows
        .map(
          row =>
            getGvizCellDisplay(
              row?.c?.[0]
            )
        )
        .map(parseDisplayedDate)
        .filter(Boolean)
        .sort(
          (a, b) =>
            b.getTime() -
            a.getTime()
        );

      return dates.length >= 2
        ? dates[1]
        : null;
    }

    function loadLastUpdatedDate() {
      const callbackName =
        `pffLastUpdatedCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

      const script =
        document.createElement(
          'script'
        );

      let settled = false;

      const timeout =
        window.setTimeout(
          () => {
            cleanup();
            lastUpdatedDateElement.textContent = '—';
          },
          CONFIG.LAST_UPDATED_TIMEOUT_MS
        );

      function cleanup() {
        if (settled) {
          return;
        }

        settled = true;
        window.clearTimeout(timeout);

        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] = undefined;
        }

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[callbackName] = response => {
        cleanup();

        if (response?.status === 'error') {
          lastUpdatedDateElement.textContent = '—';
          return;
        }

        lastUpdatedDateElement.textContent =
          formatDateNumeric(
            getSecondMostRecentDate(
              response
            )
          );
      };

      script.onerror = () => {
        cleanup();
        lastUpdatedDateElement.textContent = '—';
      };

      const params =
        new URLSearchParams({
          gid: CONFIG.SHEET_GID,
          range: 'D:D',
          headers: '0',
          tqx:
            `responseHandler:${callbackName}`,
          _:
            String(Date.now())
        });

      script.src =
        `https://docs.google.com/spreadsheets/d/${CONFIG.SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

      document.body.appendChild(script);
    }
