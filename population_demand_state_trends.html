<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Australia and State Population Coverage Trends</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>

    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --mmm1: #6600ff;
      --mmm2: #2d3a8c;
      --mmm3: #22a36b;
      --mmm4: #f1c232;
      --mmm5: #f03a47;
      --mmm6: #c25e00;
      --mmm7: #151515;

      --saturated: #ff00ff;
      --sufficient: #20c9d7;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 0 4px;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    /* ==========================================================
     * MODULE TITLE + LIVE STATUS
     * ========================================================== */

    .module-top {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
      transition: background-color 220ms ease;
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      position: absolute;
      inset: 0;
      z-index: 101;
      display: flex;
      width: 100%;
      margin: 0;
      padding: 0 8px;
      align-items: center;
      justify-content: center;
      color: var(--error);
      background: #fff;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    #status:empty { display: none; }

    /* ==========================================================
     * GRAPH TITLE + LEGEND
     * ========================================================== */

    .chart-heading-row {
      position: relative;
      z-index: 30;
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      height: 30px;
      min-height: 30px;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin: 0;
    }

    .chart-heading {
      display: inline-flex;
      width: max-content;
      min-width: max-content;
      flex: 0 0 auto;
      align-items: baseline;
      margin: 0;
      padding: 4px 0 0;
      overflow: visible;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-options-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    #chartLegend {
      position: relative;
      z-index: 2;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .legend-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 1;
      transition: opacity 160ms ease, color 160ms ease;
    }

    .legend-item:hover { color: var(--ink); }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
      background: var(--ink);
    }

    /* ==========================================================
     * CHART
     * ========================================================== */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -3px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #coverageChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    .benchmark-legend {
      position: absolute;
      top: 8px;
      right: 5px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 4px 6px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(105, 113, 138, 0.14);
      border-radius: 4px;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .benchmark-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .benchmark-legend-line {
      width: 17px;
      height: 0;
      flex: 0 0 17px;
      border-top: 2px dotted var(--saturated);
    }

    .benchmark-legend-line.is-sufficient {
      border-top-color: var(--sufficient);
    }

    .benchmark-legend-line.is-saturated {
      border-top-color: var(--saturated);
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 0 3px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue { left: 30px; }
      .cone.green { left: 64px; }
      .cone.red { left: 78px; }
      .loader-text { font-size: 10px; }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        height: 29px;
        min-height: 29px;
        gap: 4px;
      }

      .chart-heading {
        padding-top: 4px;
        font-size: 14px;
        line-height: 21px;
      }

      .benchmark-legend {
        top: 7px;
        right: 3px;
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  

    /* ==========================================================
     * SINGLE-GRAPH STATE COVERAGE ADDITIONS
     * ========================================================== */

    .module-title {
      position: relative;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--purple);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .module-title::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: var(--purple);
    }

    .heading-controls {
      display: flex;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-start;
      gap: 4px;
    }

    .yoy-trend-toggle {
      display: grid;
      width: 74px;
      height: 27px;
      flex: 0 0 74px;
      grid-template-columns: 15px max-content 1fr;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .yoy-trend-toggle > * {
      pointer-events: none;
    }

    .yoy-trend-toggle:hover {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .yoy-trend-toggle.is-on {
      border-color: var(--purple);
    }

    .yoy-trend-toggle:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .yoy-binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .yoy-toggle-label,
    .yoy-toggle-value {
      font-size: 8.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .yoy-toggle-label {
      color: var(--ink);
    }

    .yoy-toggle-value {
      display: block;
      width: 100%;
      min-width: 0;
      color: var(--muted);
      letter-spacing: 0.025em;
      text-align: center;
    }

    .yoy-trend-toggle.is-on .yoy-toggle-value {
      color: var(--purple);
    }

    .legend-item.is-hidden-series {
      opacity: 0.36;
    }

    .legend-item:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .legend-line.is-australia {
      height: 3px;
    }

    @media (max-width: 430px) {
      .module-title {
        font-size: 12px;
      }

      .heading-controls {
        gap: 3px;
      }

      .legend-item {
        font-size: 9px;
      }

      .yoy-trend-toggle {
        width: 68px;
        flex-basis: 68px;
        grid-template-columns: 15px max-content 1fr;
        padding-right: 4px;
        padding-left: 4px;
      }

      .yoy-toggle-label,
      .yoy-toggle-value {
        font-size: 8px;
      }

      .yoy-toggle-value {
        width: 100%;
        min-width: 0;
      }
    }

  </style>
</head>


<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        class="app-loading"
        role="status"
        aria-label="Loading Australia and state population coverage data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading population coverage data…</p>
      </div>

      <div class="module-top">
        <h1 class="module-title">Population coverage</h1>

        <div id="liveData" class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="liveDataText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 id="chartHeading" class="chart-heading">Population coverage trends</h2>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="Trend labels on"
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">Trend</span>
            <span id="yoyToggleValue" class="yoy-toggle-value">ON</span>
          </button>
        </div>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >&#8249;</button>

          <div id="legendViewport" class="legend-viewport">
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Population coverage chart legend"
            ></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >&#8250;</button>
        </div>
      </div>

      <div class="chart-shell">
        <div class="benchmark-legend" aria-label="Coverage benchmarks">
          <span class="benchmark-legend-item">
            <span class="benchmark-legend-line is-sufficient" aria-hidden="true"></span>
            <span>Sufficient · 1 / 10k</span>
          </span>
          <span class="benchmark-legend-item">
            <span class="benchmark-legend-line is-saturated" aria-hidden="true"></span>
            <span>Saturated · 1 / 5k</span>
          </span>
        </div>

        <canvas
          id="coverageChart"
          aria-label="Australia and state people per FTE clinician trends over time"
          role="img"
          tabindex="-1"
        ></canvas>
      </div>
    </main>
  </div>


  <script>
    'use strict';

    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    // ============================================================
    // DATA SOURCE
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    /*
      POPULATION: state-level population directly from Auspopnbystate.

      FTE CLINICIANS: use the same hours-adjusted clinician series as the
      pasted PHN coverage code. In OptomsbyPHN, BM:CQ contains the 31 PHN
      clinician denominators used by that app for people-per-FTE coverage.
      This module sums those PHN values within each state/territory and sums
      all 31 for Australia.

      OptomsbyPHN
        A = Year
        BM:CQ = 31 PHN FTE-clinician values

      Auspopnbystate
        A = Year
        B:I = NSW, VIC, QLD, SA, WA, TAS, NT, ACT population
        J = Australia population

      Coverage:
        state population / summed state PHN FTE clinicians
        Australia population / summed Australian PHN FTE clinicians

      No raw Optomsbystate clinician-count denominator and no MMM aggregation
      are used in this version.
    */

    const CLINICIAN_SHEET =
      'OptomsbyPHN';

    const POPULATION_SHEET =
      'Auspopnbystate';

    // Row 30 contains headers; row 31 onward is annual data.
    const CLINICIAN_RANGE =
      'A31:CQ';

    const POPULATION_RANGE =
      'A31:J';

    // With A at zero-based index 0, BM is index 64.
    const CLINICIAN_FIRST_INDEX =
      64;

    const FETCH_TIMEOUT_MS =
      15000;

    // Bump the key so an older raw-count cache cannot be reused as FTE data.
    const CACHE_KEY =
      'pff-australia-state-population-coverage-trends-fte-phn-v4';

    // ============================================================
    // BENCHMARKS + SERIES
    // ============================================================

    const SATURATED_BENCHMARK =
      5000;

    const SUFFICIENT_BENCHMARK =
      10000;

    const SATURATED_COLOUR =
      '#ff00ff';

    const SUFFICIENT_COLOUR =
      '#20c9d7';

    // Matches the dark green used for AUS in the country-of-qualification graph.
    const AUSTRALIA_COLOUR =
      '#0b5d1e';

    const STATE_COLOURS = {
      NSW: '#2db7f5',
      VIC: '#2d3a8c',
      QLD: '#7a0036',
      SA: '#f03a47',
      WA: '#000000',
      TAS: '#22a36b',
      NT: '#c25e00',
      ACT: '#7b61ff'
    };

    // Exact 31-PHN order used by the pasted PHN coverage module.
    const FTE_STATE_CODES = [
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'VIC', 'VIC', 'VIC', 'VIC', 'VIC', 'VIC',
      'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD',
      'SA', 'SA',
      'WA', 'WA', 'WA',
      'TAS', 'NT', 'ACT'
    ];

    const STATE_CODES = [
      'NSW', 'VIC', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT'
    ];

    const SERIES = [

    function reducedMotion() {
      return window.matchMedia?.(
        '(prefers-reduced-motion: reduce)'
      )?.matches === true;
    }

    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.min(
        maximum,
        Math.max(
          minimum,
          value
        )
      );
    }

    function formatInteger(value) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? Math.round(number)
            .toLocaleString('en-AU')
        : '—';
    }

    function formatOneDecimal(value) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? number.toLocaleString(
            'en-AU',
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 1
            }
          )
        : '—';
    }

    function numericCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return null;
      }

      if (
        typeof cell.v === 'number'
      ) {
        return Number.isFinite(cell.v)
          ? cell.v
          : null;
      }

      const cleaned =
        String(cell.v)
          .replace(/,/g, '')
          .replace(/[^0-9.+-]/g, '');

      if (!cleaned) {
        return null;
      }

      const value =
        Number(cleaned);

      return Number.isFinite(value)
        ? value
        : null;
    }

    function yearCell(cell) {
      const value =
        numericCell(cell);

      if (value === null) {
        return null;
      }

      const year =
        Math.round(value);

      return (
        year >= 1900 &&
        year <= 2200
      )
        ? year
        : null;
    }

    function yearsIn(object) {
      return Object.keys(object)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function commonYears() {
      const clinicianYears =
        new Set(
          yearsIn(
            state.clinicianByYear
          )
        );

      return yearsIn(
        state.populationByYear
      ).filter(
        year =>
          clinicianYears.has(year)
      );
    }

    function rgba(
      hex,
      alpha = 1
    ) {
      const cleaned =
        String(hex || '#69718a')
          .replace('#', '')
          .trim();

      if (!/^[0-9a-fA-F]{6}$/.test(cleaned)) {
        return `rgba(105,113,138,${alpha})`;
      }

      const value =
        Number.parseInt(
          cleaned,
          16
        );

      const red =
        (value >> 16) & 255;

      const green =
        (value >> 8) & 255;

      const blue =
        value & 255;

      return `rgba(${red},${green},${blue},${alpha})`;
    }

    function seriesTint(
      hex,
      strength = 0.20,
      alpha = 0.84
    ) {
      const cleaned =
        String(hex || '#69718a')
          .replace('#', '')
          .trim();

      if (!/^[0-9a-fA-F]{6}$/.test(cleaned)) {
        return `rgba(239,240,244,${alpha})`;
      }

      const value =
        Number.parseInt(
          cleaned,
          16
        );

      const red =
        (value >> 16) & 255;

      const green =
        (value >> 8) & 255;

      const blue =
        value & 255;

      const mix =
        channel =>
          Math.round(
            255 +
            (channel - 255) *
            strength
          );

      return `rgba(${mix(red)},${mix(green)},${mix(blue)},${alpha})`;
    }

    function loadGVizSheet(
      sheetName,
      range
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `__pff_gviz_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement('script');

          let completed =
            false;

          const cleanup =
            () => {
              if (script.parentNode) {
                script.parentNode.removeChild(
                  script
                );
              }

              try {
                delete window[
                  callbackName
                ];
              } catch (_) {
                window[
                  callbackName
                ] = undefined;
              }
            };

          const finish =
            callback => {
              if (completed) {
                return;
              }

              completed = true;
              window.clearTimeout(
                timer
              );
              cleanup();
              callback();
            };

          const timer =
            window.setTimeout(
              () => {
                finish(
                  () => reject(
                    new Error(
                      `Timed out loading ${sheetName}.`
                    )
                  )
                );
              },
              FETCH_TIMEOUT_MS
            );

          window[
            callbackName
          ] = response => {
            finish(
              () => {
                if (
                  response?.status ===
                  'error'
                ) {
                  reject(
                    new Error(
                      response?.errors?.[0]
                        ?.detailed_message ||
                      response?.errors?.[0]
                        ?.message ||
                      `Could not load ${sheetName}.`
                    )
                  );

                  return;
                }

                const table =
                  response?.table;

                if (!table) {
                  reject(
                    new Error(
                      `No table data were returned from ${sheetName}.`
                    )
                  );

                  return;
                }

                resolve(table);
              }
            );
          };

          script.onerror =
            () => {
              finish(
                () => reject(
                  new Error(
                    `Could not load ${sheetName}.`
                  )
                )
              );
            };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              tq: 'select *',
              tqx:
                `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async = true;

          document.head.appendChild(
            script
          );
        }
      );
    }

    // ============================================================
    // FTE + POPULATION PARSING
    // ============================================================

    function parseClinicianTable(table) {
      const result = {};
      const rows =
        table?.rows || [];

      const expectedByState =
        FTE_STATE_CODES.reduce(
          (counts, code) => {
            counts[code] =
              (counts[code] || 0) + 1;
            return counts;
          },
          {}
        );

      for (const row of rows) {
        const cells =
          row?.c || [];

        const year =
          yearCell(
            cells[0]
          );

        if (!year) {
          continue;
        }

        const totals =
          Object.fromEntries(
            STATE_CODES.map(
              code => [code, 0]
            )
          );

        const validCounts =
          Object.fromEntries(
            STATE_CODES.map(
              code => [code, 0]
            )
          );

        let nationalTotal = 0;
        let nationalValid = 0;

        FTE_STATE_CODES.forEach(
          (code, index) => {
            const value =
              numericCell(
                cells[
                  CLINICIAN_FIRST_INDEX +
                  index
                ]
              );

            if (
              !Number.isFinite(value) ||
              value < 0
            ) {
              return;
            }

            totals[code] += value;
            validCounts[code] += 1;
            nationalTotal += value;
            nationalValid += 1;
          }
        );

        const values = {};

        STATE_CODES.forEach(
          code => {
            values[code] =
              validCounts[code] ===
                expectedByState[code]
                ? totals[code]
                : null;
          }
        );

        values.AUS =
          nationalValid ===
            FTE_STATE_CODES.length
            ? nationalTotal
            : null;

        if (
          Object.values(values)
            .some(Number.isFinite)
        ) {
          result[year] =
            values;
        }
      }

      return result;
    }

    function parsePopulationTable(table) {
      const result = {};
      const rows =
        table?.rows || [];

      for (const row of rows) {
        const cells =
          row?.c || [];

        const year =
          yearCell(
            cells[0]
          );

        if (!year) {
          continue;
        }

        const values = {
          NSW: numericCell(cells[1]),
          VIC: numericCell(cells[2]),
          QLD: numericCell(cells[3]),
          SA: numericCell(cells[4]),
          WA: numericCell(cells[5]),
          TAS: numericCell(cells[6]),
          NT: numericCell(cells[7]),
          ACT: numericCell(cells[8]),
          AUS: numericCell(cells[9])
        };

        if (
          Object.values(values)
            .some(Number.isFinite)
        ) {
          result[year] =
            values;
        }
      }

      return result;
    }

    function saveCache() {
      try {
        const savedAt =
          Date.now();

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            savedAt,
            clinicianByYear:
              state.clinicianByYear,
            populationByYear:
              state.populationByYear
          })
        );

        state.savedAt =
          savedAt;
      } catch (_) {
        // Local cache is optional.
      }
    }

    function loadCache() {
      try {
        const raw =
          localStorage.getItem(
            CACHE_KEY
          );

        if (!raw) {
          return false;
        }

        const cached =
          JSON.parse(raw);

        if (
          !cached?.clinicianByYear ||
          !cached?.populationByYear
        ) {
          return false;
        }

        state.clinicianByYear =
          cached.clinicianByYear;

        state.populationByYear =
          cached.populationByYear;

        state.savedAt =
          cached.savedAt || null;

        return true;
      } catch (_) {
        return false;
      }
    }

    async function loadData() {
      try {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            loadGVizSheet(
              CLINICIAN_SHEET,
              CLINICIAN_RANGE
            ),
            loadGVizSheet(
              POPULATION_SHEET,
              POPULATION_RANGE
            )
          ]);

        state.clinicianByYear =
          parseClinicianTable(
            clinicianTable
          );

        state.populationByYear =
          parsePopulationTable(
            populationTable
          );

        if (
          !Object.keys(
            state.clinicianByYear
          ).length
        ) {
          throw new Error(
            'No annual FTE-clinician data were found in OptomsbyPHN BM:CQ.'
          );
        }

        if (
          !Object.keys(
            state.populationByYear
          ).length
        ) {
          throw new Error(
            'No annual population data were found in Auspopnbystate.'
          );
        }

        state.sourceState =
          'live';

        saveCache();
      } catch (error) {
        if (loadCache()) {
          state.sourceState =
            'cached';
          return;
        }

        throw error;
      }
    }

    // ============================================================
    // COVERAGE + TREND
    // ============================================================

    function coverageFor(
      year,
      code
    ) {
      const population =
        Number(
          state.populationByYear?.[
            year
          ]?.[
            code
          ]
        );

      const fteClinicians =
        Number(
          state.clinicianByYear?.[
            year
          ]?.[
            code
          ]
        );

      if (
        !Number.isFinite(population) ||
        !Number.isFinite(fteClinicians) ||
        population <= 0 ||
        fteClinicians <= 0
      ) {
        return null;
      }

      const coverage =
        population /
        fteClinicians;

      return Number.isFinite(coverage) &&
        coverage > 0
        ? coverage
        : null;
    }

    function latestAnnualisedGrowth(
      code
    ) {
      const recent =
        state.years
          .map(
            year => ({
              year,
              value:
                coverageFor(
                  year,
                  code
                )
            })
          )
          .filter(
            row =>
              Number.isFinite(
                row.value
              )
          )
          .slice(-3);

      if (
        recent.length < 2
      ) {
        return NaN;
      }

      const firstYear =
        recent[0].year;

      const points =
        recent
          .map(
            row => ({
              x:
                row.year -
                firstYear,
              y:
                row.value > 0
                  ? Math.log(
                      row.value
                    )
                  : NaN
            })
          )
          .filter(
            point =>
              Number.isFinite(
                point.y
              )
          );

      if (
        points.length < 2
      ) {
        return NaN;
      }

      const meanX =
        points.reduce(
          (sum, point) =>
            sum + point.x,
          0
        ) /
        points.length;

      const meanY =
        points.reduce(
          (sum, point) =>
            sum + point.y,
          0
        ) /
        points.length;

      let numerator = 0;
      let denominator = 0;

      points.forEach(
        point => {
          const dx =
            point.x -
            meanX;

          numerator +=
            dx *
            (
              point.y -
              meanY
            );

          denominator +=
            dx *
            dx;
        }
      );

      if (
        denominator <= 0
      ) {
        return NaN;
      }

      const slope =
        numerator /
        denominator;

      return (
        Math.exp(slope) -
        1
      ) * 100;
    }

    // ============================================================
    // SCALE
    // ============================================================

    function niceStep(rawStep) {
      if (
        !Number.isFinite(rawStep) ||
        rawStep <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(rawStep)
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        rawStep /
        magnitude;

      let niceFraction;

      if (fraction <= 1) {
        niceFraction = 1;
      } else if (fraction <= 2) {
        niceFraction = 2;
      } else if (fraction <= 2.5) {
        niceFraction = 2.5;
      } else if (fraction <= 5) {
        niceFraction = 5;
      } else {
        niceFraction = 10;
      }

      return niceFraction *
        magnitude;
    }

    function nextNiceStep(step) {
      const value =
        Math.max(
          1e-9,
          Number(step) || 1
        );

      const exponent =
        Math.floor(
          Math.log10(value)
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        value /
        magnitude;

      if (fraction < 1.5) {
        return 2 *
          magnitude;
      }

      if (fraction < 2.25) {
        return 2.5 *
          magnitude;
      }

      if (fraction < 3.75) {
        return 5 *
          magnitude;
      }

      if (fraction < 7.5) {
        return 10 *
          magnitude;
      }

      return 20 *
        magnitude;
    }

    function deriveScale() {
      const values = [
        SATURATED_BENCHMARK,
        SUFFICIENT_BENCHMARK
      ];

      SERIES.forEach(
        item => {
          state.years.forEach(
            year => {
              const value =
                coverageFor(
                  year,
                  item.code
                );

              if (
                Number.isFinite(value)
              ) {
                values.push(
                  value
                );
              }
            }
          );
        }
      );

      const finite =
        values.filter(
          value =>
            Number.isFinite(value) &&
            value >= 0
        );

      if (!finite.length) {
        return {
          min: 0,
          max: 12000,
          step: 2000
        };
      }

      const highest =
        Math.max(
          ...finite
        );

      /*
        All PFF coverage charts use a true zero baseline here. Aim for
        roughly six major intervals, then add one interval of headroom when
        the highest observed/benchmark value lands near the top boundary.
        This preserves the established major/minor tick hierarchy while also
        leaving useful empty space below the state series for trend labels.
      */
      let step =
        niceStep(
          Math.max(
            1,
            highest / 6
          )
        );

      let maximum =
        Math.ceil(
          highest /
          step
        ) *
        step;

      if (
        maximum -
        highest <
        step * 0.35
      ) {
        maximum +=
          step;
      }

      let intervals =
        Math.round(
          maximum /
          step
        );

      while (
        intervals > 8
      ) {
        step =
          nextNiceStep(
            step
          );

        maximum =
          Math.ceil(
            highest /
            step
          ) *
          step;

        if (
          maximum -
          highest <
          step * 0.35
        ) {
          maximum +=
            step;
        }

        intervals =
          Math.round(
            maximum /
            step
          );
      }

      return {
        min: 0,
        max: maximum,
        step
      };
    }

    function createLegendItem(item) {
      const row =
        document.createElement(
          'button'
        );

      row.type =
        'button';

      row.className =
        'legend-item';

      row.dataset.code =
        item.code;

      row.setAttribute(
        'aria-pressed',
        String(
          !state.hiddenSeries.has(
            item.code
          )
        )
      );

      row.setAttribute(
        'aria-label',
        `${item.label} series`
      );

      if (
        state.hiddenSeries.has(
          item.code
        )
      ) {
        row.classList.add(
          'is-hidden-series'
        );
      }

      const line =
        document.createElement(
          'span'
        );

      line.className =
        'legend-line';

      if (
        item.code === 'AUS'
      ) {
        line.classList.add(
          'is-australia'
        );
      }

      line.style.background =
        item.colour;

      const text =
        document.createElement(
          'span'
        );

      text.textContent =
        item.label;

      row.append(
        line,
        text
      );

      row.addEventListener(
        'click',
        () => {
          if (
            state.hiddenSeries.has(
              item.code
            )
          ) {
            state.hiddenSeries.delete(
              item.code
            );
          } else {
            state.hiddenSeries.add(
              item.code
            );
          }

          row.classList.toggle(
            'is-hidden-series',
            state.hiddenSeries.has(
              item.code
            )
          );

          row.setAttribute(
            'aria-pressed',
            String(
              !state.hiddenSeries.has(
                item.code
              )
            )
          );

          if (chart) {
            const datasetIndex =
              SERIES.findIndex(
                series =>
                  series.code ===
                  item.code
              );

            if (
              datasetIndex >= 0
            ) {
              chart.setDatasetVisibility(
                datasetIndex,
                !state.hiddenSeries.has(
                  item.code
                )
              );

              if (
                state.hiddenSeries.has(
                  item.code
                )
              ) {
                chart.hide(
                  datasetIndex
                );
              } else {
                chart.show(
                  datasetIndex
                );
              }
            }
          }

          requestAnimationFrame(
            updateLegendScrollControls
          );
        }
      );

      return row;
    }

    function updateLegend() {
      chartLegend.textContent =
        '';

      SERIES.forEach(
        item => {
          const element =
            createLegendItem(
              item
            );

          chartLegend.appendChild(
            element
          );

        }
      );


      requestAnimationFrame(
        updateLegendScrollControls
      );
    }

    function updateLegendScrollControls() {
      const maximumScroll =
        Math.max(
          0,
          chartLegend.scrollWidth -
          chartLegend.clientWidth
        );

      legendScrollLeft.classList.toggle(
        'is-hidden',
        maximumScroll <= 2 ||
        chartLegend.scrollLeft <= 2
      );

      legendScrollRight.classList.toggle(
        'is-hidden',
        maximumScroll <= 2 ||
        chartLegend.scrollLeft >=
          maximumScroll - 2
      );
    }

    function majorYAxisValues() {
      const scale =
        state.scale;

      if (
        !scale ||
        !Number.isFinite(scale.min) ||
        !Number.isFinite(scale.max) ||
        !Number.isFinite(scale.step) ||
        scale.step <= 0
      ) {
        return [];
      }

      const count =
        Math.round(
          (
            scale.max -
            scale.min
          ) /
          scale.step
        );

      return Array.from(
        {
          length:
            count + 1
        },
        (_, index) =>
          scale.min +
          scale.step *
          index
      );
    }

    const pffAxesPlugin = {
      id: 'pffAxesPlugin',

      beforeDatasetsDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea,
          scales
        } = chartInstance;

        if (
          !chartArea ||
          !scales?.y
        ) {
          return;
        }

        const majorValues =
          majorYAxisValues();

        ctx.save();

        // Major horizontal guides: same faint treatment as the PFF trend apps.
        majorValues.forEach(
          value => {
            if (
              Math.abs(
                value -
                state.scale.min
              ) < 1e-9
            ) {
              return;
            }

            const y =
              scales.y.getPixelForValue(
                value
              );

            if (!Number.isFinite(y)) {
              return;
            }

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              Math.round(y) + 0.5
            );
            ctx.lineTo(
              chartArea.right,
              Math.round(y) + 0.5
            );
            ctx.strokeStyle =
              'rgba(105, 113, 138, 0.075)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        );

        // Minor horizontal guides sit exactly halfway between major tracks.
        for (
          let index = 0;
          index <
            majorValues.length - 1;
          index += 1
        ) {
          const value =
            (
              majorValues[index] +
              majorValues[index + 1]
            ) /
            2;

          const y =
            scales.y.getPixelForValue(
              value
            );

          if (!Number.isFinite(y)) {
            continue;
          }

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );
          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.035)';
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea,
          scales
        } = chartInstance;

        if (
          !chartArea ||
          !scales?.x ||
          !scales?.y
        ) {
          return;
        }

        const mobile =
          window.innerWidth <= 430;

        const majorValues =
          majorYAxisValues();

        ctx.save();
        ctx.lineCap = 'butt';

        // Y-axis major ticks + labels.
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#151515';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font =
          `12px Lato, sans-serif`;

        majorValues.forEach(
          value => {
            const y =
              scales.y.getPixelForValue(
                value
              );

            if (!Number.isFinite(y)) {
              return;
            }

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              Math.round(y) + 0.5
            );
            ctx.lineTo(
              chartArea.left - 5,
              Math.round(y) + 0.5
            );
            ctx.stroke();

            ctx.fillText(
              formatInteger(value),
              chartArea.left - 8,
              y
            );
          }
        );

        // Y-axis minor ticks.
        ctx.strokeStyle = '#69718a';
        ctx.globalAlpha = 0.60;
        ctx.lineWidth = 0.7;

        for (
          let index = 0;
          index <
            majorValues.length - 1;
          index += 1
        ) {
          const value =
            (
              majorValues[index] +
              majorValues[index + 1]
            ) /
            2;

          const y =
            scales.y.getPixelForValue(
              value
            );

          if (!Number.isFinite(y)) {
            continue;
          }

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 2,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        // X-axis hierarchy: even years = 5 px black major tick;
        // odd years = 2 px muted minor tick.
        ctx.globalAlpha = 1;

        for (
          let index = 0;
          index <
            state.years.length;
          index += 1
        ) {
          const year =
            Number(
              state.years[index]
            );

          const x =
            scales.x.getPixelForTick(
              index
            );

          if (!Number.isFinite(x)) {
            continue;
          }

          const major =
            Number.isFinite(year) &&
            year % 2 === 0;

          ctx.strokeStyle =
            major
              ? '#151515'
              : '#69718a';

          ctx.globalAlpha =
            major
              ? 1
              : 0.60;

          ctx.lineWidth =
            major
              ? 1
              : 0.7;

          ctx.beginPath();
          ctx.moveTo(
            Math.round(x) + 0.5,
            chartArea.bottom
          );
          ctx.lineTo(
            Math.round(x) + 0.5,
            chartArea.bottom +
              (
                major
                  ? 5
                  : 2
              )
          );
          ctx.stroke();
        }

        // Even-year labels use the exact shared PFF trend placement.
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#151515';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font =
          `${mobile ? 9 : 10}px Lato, sans-serif`;

        state.years.forEach(
          (rawYear, index) => {
            const year = Number(rawYear);

            if (
              !Number.isFinite(year) ||
              year % 2 !== 0
            ) {
              return;
            }

            const x =
              scales.x.getPixelForTick(
                index
              );

            if (!Number.isFinite(x)) {
              return;
            }

            const yearText =
              String(year);

            const halfYearWidth =
              ctx.measureText(
                yearText
              ).width / 2;

            const yearX =
              clamp(
                x,
                halfYearWidth + 2,
                chartInstance.width -
                  halfYearWidth - 2
              );

            ctx.fillText(
              yearText,
              yearX,
              chartArea.bottom + 8
            );
          }
        );

        // Shared PFF X-axis title sizing and baseline.
        ctx.textBaseline = 'bottom';
        ctx.font =
          `700 ${mobile ? 12 : 13}px Lato, sans-serif`;

        ctx.fillText(
          'Year',
          chartArea.left +
            chartArea.width / 2,
          chartInstance.height -
            (mobile ? 3 : 4)
        );

        ctx.restore();

        // Shared PFF Y-axis title placement.
        ctx.save();
        ctx.translate(
          chartArea.left -
            (mobile ? 48 : 54),
          chartArea.top +
            chartArea.height / 2
        );
        ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = '#151515';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font =
          `700 ${mobile ? 12 : 13}px Lato, sans-serif`;
        ctx.fillText(
          'People per FTE clinician',
          0,
          0
        );
        ctx.restore();
      }
    };

    const coverageBenchmarksPlugin = {
      id: 'coverageBenchmarksPlugin',

      beforeDatasetsDraw(chartInstance) {
        const {
          ctx,
          chartArea,
          scales
        } = chartInstance;

        if (
          !chartArea ||
          !scales?.y
        ) {
          return;
        }

        const benchmarks = [
          {
            value:
              SUFFICIENT_BENCHMARK,
            colour:
              SUFFICIENT_COLOUR
          },
          {
            value:
              SATURATED_BENCHMARK,
            colour:
              SATURATED_COLOUR
          }
        ];

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineWidth = 2.2;
        ctx.setLineDash([1, 4]);

        benchmarks.forEach(
          benchmark => {
            const y =
              scales.y.getPixelForValue(
                benchmark.value
              );

            if (
              !Number.isFinite(y) ||
              y < chartArea.top - 1 ||
              y > chartArea.bottom + 1
            ) {
              return;
            }

            ctx.strokeStyle =
              benchmark.colour;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              y
            );
            ctx.lineTo(
              chartArea.right,
              y
            );
            ctx.stroke();
          }
        );

        ctx.restore();
      }
    };

    const axisSpinesPlugin = {
      id: 'axisSpinesPlugin',

      afterDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } = chartInstance;

        if (!chartArea) {
          return;
        }

        ctx.save();
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(
          chartArea.left,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.lineTo(
          chartArea.right,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.stroke();

        ctx.restore();
      }
    };

    const coverageTrendLabelsPlugin = {
      id:
        'coverageTrendLabelsPlugin',

      afterDatasetsDraw(
        chartInstance
      ) {
        if (!trendLabelsOn) {
          return;
        }

        const {
          ctx,
          chartArea
        } = chartInstance;

        if (!chartArea) {
          return;
        }

        const mobile =
          window.innerWidth <= 430;

        const fontSize =
          mobile
            ? 8.2
            : 9.1;

        const labelHeight =
          mobile
            ? 14
            : 15;

        const paddingX =
          mobile
            ? 4
            : 5;

        const arrowGap =
          mobile
            ? 2.5
            : 3;

        const items = [];

        ctx.save();

        ctx.font =
          `700 ${fontSize}px Lato, sans-serif`;

        ctx.textBaseline =
          'middle';

        SERIES.forEach(
          (
            series,
            seriesIndex
          ) => {
            const meta =
              chartInstance.getDatasetMeta(
                seriesIndex
              );

            if (
              !meta ||
              meta.hidden ||
              state.hiddenSeries.has(
                series.code
              )
            ) {
              return;
            }

            const growth =
              latestAnnualisedGrowth(
                series.code
              );

            if (
              !Number.isFinite(
                growth
              )
            ) {
              return;
            }

            const dataset =
              chartInstance.data.datasets[
                seriesIndex
              ];

            if (
              !dataset ||
              !meta.data?.length
            ) {
              return;
            }

            let anchorIndex = -1;

            for (
              let index =
                dataset.data.length - 1;
              index >= 0;
              index -= 1
            ) {
              if (
                Number.isFinite(
                  dataset.data[index]
                ) &&
                Number.isFinite(
                  meta.data[index]?.x
                ) &&
                Number.isFinite(
                  meta.data[index]?.y
                )
              ) {
                anchorIndex =
                  index;
                break;
              }
            }

            if (
              anchorIndex < 0
            ) {
              return;
            }

            const point =
              meta.data[
                anchorIndex
              ];

            const isIncrease =
              growth > 0.05;

            const isDecrease =
              growth < -0.05;

            const arrow =
              isIncrease
                ? '↑'
                : isDecrease
                  ? '↓'
                  : '';

            const valueText =
              `${Math.abs(growth).toFixed(1)}% p.a.`;

            const arrowWidth =
              arrow
                ? ctx.measureText(
                    arrow
                  ).width
                : 0;

            const valueWidth =
              ctx.measureText(
                valueText
              ).width;

            const labelWidth =
              paddingX * 2 +
              arrowWidth +
              (
                arrow
                  ? arrowGap
                  : 0
              ) +
              valueWidth;

            items.push({
              seriesIndex,
              seriesColour:
                series.colour,
              growth,
              isIncrease,
              isDecrease,
              arrow,
              valueText,
              arrowWidth,
              labelWidth,
              anchorX:
                point.x,
              anchorY:
                point.y
            });
          }
        );

        if (!items.length) {
          ctx.restore();
          return;
        }

        const placed = [];

        function overlaps(
          rectangle
        ) {
          const padding = 5;

          return placed.some(
            existing =>
              !(
                rectangle.right +
                  padding <
                  existing.left ||
                rectangle.left -
                  padding >
                  existing.right ||
                rectangle.bottom +
                  padding <
                  existing.top ||
                rectangle.top -
                  padding >
                  existing.bottom
              )
          );
        }

        items
          .sort(
            (
              first,
              second
            ) =>
              first.anchorY -
              second.anchorY
          )
          .forEach(
            (
              item,
              itemIndex
            ) => {
              const horizontalOffsets =
                [
                  0,
                  -68,
                  -136,
                  -34,
                  -102,
                  -170
                ];

              const verticalOffsets =
                [
                  0,
                  -2,
                  2,
                  -4,
                  4,
                  -6,
                  6,
                  -8,
                  8
                ];

              let chosen =
                null;

              for (
                const horizontalOffset
                of horizontalOffsets
              ) {
                for (
                  const verticalOffset
                  of verticalOffsets
                ) {
                  const proposedRight =
                    clamp(
                      chartArea.right -
                        4 +
                        horizontalOffset,
                      chartArea.left +
                        item.labelWidth +
                        5,
                      chartArea.right -
                        4
                    );

                  const proposedLeft =
                    proposedRight -
                    item.labelWidth;

                  const proposedY =
                    clamp(
                      item.anchorY +
                        verticalOffset,
                      chartArea.top +
                        labelHeight /
                        2,
                      chartArea.bottom -
                        labelHeight /
                        2
                    );

                  const rectangle = {
                    left:
                      proposedLeft,
                    right:
                      proposedRight,
                    top:
                      proposedY -
                      labelHeight /
                      2,
                    bottom:
                      proposedY +
                      labelHeight /
                      2,
                    y:
                      proposedY
                  };

                  if (
                    !overlaps(
                      rectangle
                    )
                  ) {
                    chosen =
                      rectangle;
                    break;
                  }
                }

                if (chosen) {
                  break;
                }
              }

              if (!chosen) {
                const right =
                  clamp(
                    chartArea.right -
                      4 -
                      itemIndex *
                      64,
                    chartArea.left +
                      item.labelWidth +
                      5,
                    chartArea.right -
                      4
                  );

                const y =
                  clamp(
                    item.anchorY +
                      (
                        itemIndex %
                          2 ===
                        0
                          ? -6
                          : 6
                      ),
                    chartArea.top +
                      labelHeight /
                      2,
                    chartArea.bottom -
                      labelHeight /
                      2
                  );

                chosen = {
                  left:
                    right -
                    item.labelWidth,
                  right,
                  top:
                    y -
                    labelHeight /
                    2,
                  bottom:
                    y +
                    labelHeight /
                    2,
                  y
                };
              }

              item.labelLeft =
                chosen.left;

              item.labelRight =
                chosen.right;

              item.labelY =
                chosen.y;

              placed.push(
                chosen
              );
            }
          );

        // Connector lines first, then label pills.
        items.forEach(
          item => {
            const targetX =
              item.anchorX <
              item.labelLeft
                ? item.labelLeft
                : item.anchorX >
                  item.labelRight
                  ? item.labelRight
                  : clamp(
                      item.anchorX,
                      item.labelLeft,
                      item.labelRight
                    );

            const displaced =
              Math.abs(
                targetX -
                item.anchorX
              ) >
                7 ||
              Math.abs(
                item.labelY -
                item.anchorY
              ) >
                2 ||
              item.labelLeft <
                item.anchorX -
                4;

            if (!displaced) {
              return;
            }

            ctx.beginPath();

            ctx.moveTo(
              item.anchorX,
              item.anchorY
            );

            ctx.lineTo(
              targetX,
              item.labelY
            );

            ctx.strokeStyle =
              'rgba(105, 113, 138, 0.58)';

            ctx.lineWidth =
              0.8;

            ctx.stroke();
          }
        );

        items.forEach(
          item => {
            const fillColour =
              seriesTint(
                item.seriesColour,
                0.20,
                0.84
              );

            const directionColour =
              item.isIncrease
                ? '#14823b'
                : item.isDecrease
                  ? '#b42318'
                  : '#69718a';

            const radius = 3;

            const top =
              item.labelY -
              labelHeight /
              2;

            const bottom =
              item.labelY +
              labelHeight /
              2;

            ctx.beginPath();

            ctx.moveTo(
              item.labelLeft +
                radius,
              top
            );

            ctx.lineTo(
              item.labelRight -
                radius,
              top
            );

            ctx.quadraticCurveTo(
              item.labelRight,
              top,
              item.labelRight,
              top +
                radius
            );

            ctx.lineTo(
              item.labelRight,
              bottom -
                radius
            );

            ctx.quadraticCurveTo(
              item.labelRight,
              bottom,
              item.labelRight -
                radius,
              bottom
            );

            ctx.lineTo(
              item.labelLeft +
                radius,
              bottom
            );

            ctx.quadraticCurveTo(
              item.labelLeft,
              bottom,
              item.labelLeft,
              bottom -
                radius
            );

            ctx.lineTo(
              item.labelLeft,
              top +
                radius
            );

            ctx.quadraticCurveTo(
              item.labelLeft,
              top,
              item.labelLeft +
                radius,
              top
            );

            ctx.closePath();

            ctx.fillStyle =
              fillColour;

            ctx.fill();

            ctx.strokeStyle =
              rgba(
                item.seriesColour,
                0.42
              );

            ctx.lineWidth =
              0.65;

            ctx.stroke();

            let textX =
              item.labelLeft +
              paddingX;

            ctx.textAlign =
              'left';

            ctx.fillStyle =
              directionColour;

            if (item.arrow) {
              ctx.fillText(
                item.arrow,
                textX,
                item.labelY -
                  0.2
              );

              textX +=
                item.arrowWidth +
                arrowGap;
            }

            ctx.fillText(
              item.valueText,
              textX,
              item.labelY
            );
          }
        );

        ctx.restore();
      }
    };

    Chart.register(
      pffAxesPlugin,
      coverageBenchmarksPlugin,
      axisSpinesPlugin,
      coverageTrendLabelsPlugin
    );

    function tooltipLabel(
      context
    ) {
      const code =
        context.dataset._code;

      const year =
        Number(
          state.years[
            context.dataIndex
          ]
        );

      const population =
        Number(
          state.populationByYear?.[
            year
          ]?.[
            code
          ]
        );

      const clinicians =
        Number(
          state.clinicianByYear?.[
            year
          ]?.[
            code
          ]
        );

      const coverage =
        coverageFor(
          year,
          code
        );

      const label =
        code === 'AUS'
          ? 'Australia'
          : code;

      const lines = [
        `${label}: ${formatInteger(coverage)} people per FTE clinician`
      ];

      if (
        Number.isFinite(
          clinicians
        ) &&
        Number.isFinite(
          population
        )
      ) {
        lines.push(
          `${formatOneDecimal(clinicians)} active FTE clinicians · ${formatInteger(population)} people`
        );
      }

      if (trendLabelsOn) {
        const growth =
          latestAnnualisedGrowth(
            code
          );

        if (
          Number.isFinite(
            growth
          )
        ) {
          const arrow =
            growth > 0.05
              ? '↑'
              : growth < -0.05
                ? '↓'
                : '';

          lines.push(
            `Latest trend: ${arrow}${Math.abs(growth).toFixed(1)}% p.a.`
          );
        }
      }

      return lines;
    }

          chartCanvas.getContext(

    }

    // ============================================================
    // SOURCE STATUS
    // ============================================================

    function updateSourceStatus() {
      if (
        state.sourceState ===
        'cached'
      ) {
        liveData.classList.add(
          'is-cached'
        );

        liveData.setAttribute(
          'aria-label',
          'Cached data'
        );

        liveDataText.textContent =
          'CACHED data';
      } else {
        liveData.classList.remove(
          'is-cached'
        );

        liveData.setAttribute(
          'aria-label',
          'Live data'
        );

        liveDataText.textContent =
          'LIVE data';
      }
    }

    // ============================================================
    // EVENTS
    // ============================================================

    yoyTrendToggle.addEventListener(
      'click',
      () => {
        trendLabelsOn =
          !trendLabelsOn;

        updateTrendToggle();

        chart?.draw();
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive: true
      }
    );

    legendScrollLeft.addEventListener(
      'click',
      () => {
        chartLegend.scrollBy({
          left:
            -Math.max(
              80,
              chartLegend.clientWidth *
                0.72
            ),
          behavior:
            'smooth'
        });
      }
    );

    legendScrollRight.addEventListener(
      'click',
      () => {
        chartLegend.scrollBy({
          left:
            Math.max(
              80,
              chartLegend.clientWidth *
                0.72
            ),
          behavior:
            'smooth'
        });
      }
    );

    // ============================================================
    // RESPONSIVE
    // ============================================================

    window.addEventListener(
      'resize',
      () => {
        if (
          resizeFrame !== null
        ) {
          cancelAnimationFrame(
            resizeFrame
          );
        }

        resizeFrame =
          requestAnimationFrame(
            () => {
              resizeFrame =
                null;

              updateLegendScrollControls();

              if (!chart) {
                return;
              }

              chart.options =
                baseChartOptions();

              chart.update(
                'none'
              );
            }
          );
      }
    );

    if (
      'ResizeObserver' in
      window
    ) {
      const resizeObserver =
        new ResizeObserver(
          () => {
            updateLegendScrollControls();
          }
        );

      resizeObserver.observe(
        legendViewport
      );

      resizeObserver.observe(
        chartLegend
      );
    }

    // ============================================================
    // START
    // ============================================================

    async function init() {
      try {
        await loadData();

        state.years =
          commonYears();

        if (
          !state.years.length
        ) {
          throw new Error(
            'No annual years were common to OptomsbyPHN and Auspopnbystate.'
          );
        }

        state.scale =
          deriveScale();

        updateSourceStatus();
        updateTrendToggle();
        updateLegend();
        createChart();

        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );

        requestAnimationFrame(
          updateLegendScrollControls
        );
      } catch (error) {
        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );

        updateSourceStatus();

        statusEl.textContent =
          error?.message ||
          'Could not load population coverage data.';
      }
    }

    init();
  </script>

</body>
</html>
