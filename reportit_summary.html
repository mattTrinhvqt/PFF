<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>PFF Report Summary</title>

  <script src="./assets/pff_chart_core.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: auto;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: visible;
      background: transparent;
    }

    body {
      color: var(--pff-ink);
    }

    #fit {
      display: block;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      display: block;
      width: 100%;
      max-width: 520px;
      min-height: 0;
      margin: 0 auto;
      padding: 14px 2px;
      background: transparent;
      text-align: center;
    }

    #app.is-loading .table-section {
      display: none;
    }

    .response-summary {
      position: relative;
      width: 100%;
      padding: 0;
    }

    .summary-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      align-items: start;
    }

    .summary-item {
      min-width: 0;
      padding: 0 10px;
    }

    .summary-item:first-child .response-label,
    .summary-item:first-child .response-value {
      transform: translateX(8px);
    }

    .summary-item:last-child .response-label,
    .summary-item:last-child .response-value {
      transform: translateX(-8px);
    }

    .summary-item:first-child {
      border-right: 1px solid rgba(105, 113, 138, 0.16);
    }

    .response-label {
      color: var(--pff-muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 31px;
      margin-top: 2px;
      align-items: center;
      justify-content: center;
    }

    .response-value {
      margin-top: 2px;
      color: var(--pff-ink);
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 400;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .response-value.is-loading {
      display: inline-flex;
      min-width: 64px;
      min-height: 31px;
      align-items: center;
      justify-content: center;
    }

    .response-value.is-error {
      color: var(--pff-muted);
      font-size: 14px;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      margin: 0;
      visibility: hidden;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .live-data.is-visible {
      visibility: visible;
      opacity: 1;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: 5px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--pff-purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .table-section {
      width: 100%;
      margin-top: 30px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 1px;
      }

      .summary-item {
        padding: 0 6px;
      }

      .response-label {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main
      id="app"
      class="is-loading"
    >
      <section
        class="response-summary"
        aria-live="polite"
      >
        <div class="summary-grid">
          <div class="summary-item">
            <div class="response-label">
              Reports
            </div>

            <div class="response-value-row">
              <div
                id="reports-value"
                class="response-value is-loading"
              >
                <span
                  class="pff-value-loader"
                  role="status"
                  aria-label="Loading report count"
                >
                  <span class="cone blue" aria-hidden="true"></span>
                  <span class="cone green" aria-hidden="true"></span>
                  <span class="cone red" aria-hidden="true"></span>
                </span>
              </div>
            </div>
          </div>

          <div class="summary-item">
            <div class="response-label">
              Supporting documents
            </div>

            <div class="response-value-row">
              <div
                id="documents-value"
                class="response-value is-loading"
              >
                <span
                  class="pff-value-loader"
                  role="status"
                  aria-label="Loading supporting document count"
                >
                  <span class="cone blue" aria-hidden="true"></span>
                  <span class="cone green" aria-hidden="true"></span>
                  <span class="cone red" aria-hidden="true"></span>
                </span>
              </div>

              <div
                id="dataSourceIndicator"
                class="live-data"
                aria-label="Live data"
              >
                <span
                  class="live-data-dot"
                  aria-hidden="true"
                ></span>

                <span id="dataSourceText">
                  LIVE data
                </span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section
        class="table-section"
        aria-label="Report summary table"
      >
        <div
          id="tableWrap"
          class="pff-autofit-table-wrap has-gradient-divider"
        >
          <table
            id="summary-table"
            class="pff-autofit-table"
          >
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
  (() => {
    'use strict';

    const CONFIG = Object.freeze({
      spreadsheetId:
        '1hMjeY-Cg3ZJWYWrfx0Brxb1QvhDYpiDq6OR4F4g8zCE',

      sheetGid:
        '0',

      countRange:
        'B1:C1',

      tableHeaderRange:
        'T2:V2',

      tableDataRange:
        'T3:V14',

      tableRows:
        12,

      cacheWebAppUrl:
        'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec',

      cacheAppKey:
        'pff-report-summary',

      browserCacheKey:
        'pff-report-summary:dashboard:v1',

      fetchTimeoutMs:
        10000,

      minRows:
        14,

      refreshMs:
        60000,

      forceCached:
        false
    });

    const app =
      document.getElementById(
        'app'
      );

    const reportsValue =
      document.getElementById(
        'reports-value'
      );

    const documentsValue =
      document.getElementById(
        'documents-value'
      );

    const summaryTable =
      document.getElementById(
        'summary-table'
      );

    const tableWrap =
      document.getElementById(
        'tableWrap'
      );

    const tableSection =
      document.querySelector(
        '.table-section'
      );

    const dataSourceIndicator =
      document.getElementById(
        'dataSourceIndicator'
      );

    const dataSourceText =
      document.getElementById(
        'dataSourceText'
      );

    const tableFit =
      PFF.setupAutoFitTable(
        summaryTable,
        {
          wrapper:
            tableWrap,

          dividerVariable:
            '--pff-table-divider-left',

          delay:
            80
        }
      );


    function makeDashboardRows(
      reportsValue,
      documentsValue,
      tableValues
    ) {
      const reports =
        PFF.toNumber(
          reportsValue
        );

      const documents =
        PFF.toNumber(
          documentsValue
        );

      if (
        !Number.isFinite(
          reports
        ) ||
        reports < 0 ||
        !Number.isFinite(
          documents
        ) ||
        documents < 0
      ) {
        throw new Error(
          'Report summary counts are unavailable'
        );
      }

      if (
        !Array.isArray(
          tableValues
        ) ||
        tableValues.length !==
          CONFIG.tableRows + 1
      ) {
        throw new Error(
          'Report summary table is incomplete'
        );
      }

      const normalisedTable =
        tableValues.map(
          row => [
            String(
              row?.[0] ??
              ''
            ).trim(),

            String(
              row?.[1] ??
              ''
            ).trim()
          ]
        );

      normalisedTable[0] = [
        normalisedTable[0]?.[0] ||
          '—',

        normalisedTable[0]?.[1] ||
          '—'
      ];

      return [
        [
          Math.round(
            reports
          ),

          Math.round(
            documents
          )
        ],

        ...normalisedTable
      ];
    }


    function parseLiveRows(
      payload
    ) {
      const countRow =
        payload?.counts?.rows?.[0]?.c ||
        [];

      const headerRow =
        payload?.header?.rows?.[0]?.c ||
        [];

      const dataRows =
        payload?.data?.rows ||
        [];

      const tableValues = [[
        PFF.cellDisplayValue(
          headerRow[0]
        ) ||
          '—',

        PFF.cellDisplayValue(
          headerRow[2]
        ) ||
          '—'
      ]];

      for (
        let index = 0;
        index < CONFIG.tableRows;
        index++
      ) {
        const row =
          dataRows[index]?.c ||
          [];

        tableValues.push([
          PFF.cellDisplayValue(
            row[0]
          ),

          PFF.cellDisplayValue(
            row[2]
          )
        ]);
      }

      return makeDashboardRows(
        PFF.cellDisplayValue(
          countRow[0]
        ),

        PFF.cellDisplayValue(
          countRow[1]
        ),

        tableValues
      );
    }


    function parseRemoteRows(
      response
    ) {
      if (
        !response?.cachedAt ||
        Number.isNaN(
          Date.parse(
            response.cachedAt
          )
        )
      ) {
        throw new Error(
          'The cached report summary has no valid timestamp'
        );
      }

      return makeDashboardRows(
        response?.data?.reports,
        response?.data?.documents,
        response?.data?.tableValues
      );
    }


    function unpackDashboardRows(
      rows
    ) {
      if (
        !Array.isArray(
          rows
        ) ||
        rows.length !==
          CONFIG.minRows
      ) {
        throw new Error(
          'Report summary data are incomplete'
        );
      }

      return {
        reports:
          rows[0]?.[0],

        documents:
          rows[0]?.[1],

        tableValues:
          rows.slice(1)
      };
    }


    function showValue(
      element,
      value,
      isError =
        false
    ) {
      element.classList.remove(
        'is-loading'
      );

      element.classList.toggle(
        'is-error',
        isError
      );

      element.textContent =
        Number.isFinite(
          Number(value)
        )
          ? PFF.formatInteger(
              Number(value)
            )
          : '—';
    }


    function setDataSource(
      source
    ) {
      PFF.setDataSourceIndicator(
        source,
        {
          indicator:
            dataSourceIndicator,

          text:
            dataSourceText
        }
      );

      dataSourceIndicator.classList.add(
        'is-visible'
      );
    }


    function renderDashboard(
      rows
    ) {
      const data =
        unpackDashboardRows(
          rows
        );

      showValue(
        reportsValue,
        data.reports
      );

      showValue(
        documentsValue,
        data.documents
      );

      tableSection.style.visibility =
        'hidden';

      PFF.renderTwoColumnTable(
        summaryTable,
        data.tableValues
      );

      app.classList.remove(
        'is-loading'
      );

      tableFit.fitNow();

      tableSection.style.visibility =
        '';
    }


    function showError(
      error
    ) {
      console.error(
        error
      );

      showValue(
        reportsValue,
        NaN,
        true
      );

      showValue(
        documentsValue,
        NaN,
        true
      );

      const emptyTable = [
        ['—', '—'],
        ...Array.from(
          {
            length:
              CONFIG.tableRows
          },
          () => [
            '—',
            '—'
          ]
        )
      ];

      tableSection.style.visibility =
        'hidden';

      PFF.renderTwoColumnTable(
        summaryTable,
        emptyTable
      );

      app.classList.remove(
        'is-loading'
      );

      tableFit.fitNow();

      tableSection.style.visibility =
        '';

      setDataSource(
        'unavailable'
      );
    }


    async function loadDashboardData() {
      try {
        const loaded =
          await PFF.loadLiveCacheFallback({
            loadLive:
              async () => {
                const [
                  counts,
                  header,
                  data
                ] =
                  await Promise.all([
                    PFF.loadGVizSheet({
                      sheetId:
                        CONFIG.spreadsheetId,

                      gid:
                        CONFIG.sheetGid,

                      range:
                        CONFIG.countRange,

                      headers:
                        0,

                      timeoutMs:
                        CONFIG.fetchTimeoutMs
                    }),

                    PFF.loadGVizSheet({
                      sheetId:
                        CONFIG.spreadsheetId,

                      gid:
                        CONFIG.sheetGid,

                      range:
                        CONFIG.tableHeaderRange,

                      headers:
                        0,

                      timeoutMs:
                        CONFIG.fetchTimeoutMs
                    }),

                    PFF.loadGVizSheet({
                      sheetId:
                        CONFIG.spreadsheetId,

                      gid:
                        CONFIG.sheetGid,

                      range:
                        CONFIG.tableDataRange,

                      headers:
                        0,

                      timeoutMs:
                        CONFIG.fetchTimeoutMs
                    })
                  ]);

                return {
                  counts,
                  header,
                  data
                };
              },

            parseLive:
              parseLiveRows,

            loadRemoteCache:
              () =>
                PFF.loadAppsScriptCache({
                  url:
                    CONFIG.cacheWebAppUrl,

                  appKey:
                    CONFIG.cacheAppKey,

                  timeoutMs:
                    CONFIG.fetchTimeoutMs
                }),

            parseRemoteCache:
              parseRemoteRows,

            cacheKey:
              CONFIG.browserCacheKey,

            minRows:
              CONFIG.minRows,

            forceCached:
              CONFIG.forceCached,

            onSource:
              setDataSource,

            onLiveError:
              error =>
                console.warn(
                  'Live report summary could not be used',
                  error
                ),

            onRemoteCacheError:
              error =>
                console.warn(
                  'Cached report summary could not be used',
                  error
                )
          });

        renderDashboard(
          loaded.rows
        );
      } catch (
        error
      ) {
        showError(
          error
        );
      }
    }


    loadDashboardData();

    window.setInterval(
      loadDashboardData,
      CONFIG.refreshMs
    );
  })();
  </script>
</body>
</html>
