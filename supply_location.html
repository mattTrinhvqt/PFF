<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Workforce Location Trends</title>

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <script src="./assets/pff_chart_core.js"></script>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading workforce location data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading workforce location data…</p>
      </div>

      <div class="module-top">
        <div id="tabScrollShell" class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Workforce location grouping"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              data-group="state"
            >State</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-group="rurality"
            >Rurality</button>
          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"
            type="button"
            aria-label="Scroll tabs right"
          >›</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">
              <span id="chartHeadingFixed" class="chart-heading-fixed">Active clinicians by&nbsp;</span><span id="chartHeadingDetail" class="chart-heading-detail">state</span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3-year trend. Press to switch to 10-year trend."
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>

          <div
            id="metricSwitch"
            class="metric-switch"
            role="group"
            aria-label="Display metric"
          >
            <button
              class="metric-button is-active"
              type="button"
              data-metric="count"
              aria-pressed="true"
            >Count</button>

            <button
              class="metric-button"
              type="button"
              data-metric="share"
              aria-pressed="false"
            >%</button>
          </div>
        </div>
      </div>

      <div id="legendNav" class="legend-nav">
        <button
          id="legendScrollLeft"
          class="legend-scroll-button legend-scroll-left is-hidden"
          type="button"
          aria-label="Scroll legend left"
        >‹</button>

        <div class="legend-viewport">
          <div
            id="chartLegend"
            class="chart-legend"
            aria-label="Chart legend"
          ></div>
        </div>

        <button
          id="legendScrollRight"
          class="legend-scroll-button legend-scroll-right is-hidden"
          type="button"
          aria-label="Scroll legend right"
        >›</button>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="workforceChart"
          aria-label="Australian optometry workforce location trend chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    // ============================================================
    // DATA SOURCE + APP-SPECIFIC SERIES
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const STATE_SHEET =
      'Optomsbystate';

    const RURALITY_SHEET =
      'OptomsbyMMM';

    /*
      Optomsbystate:
        L31:V
        L = Year
        M:T = NSW, VIC, QLD, SA, WA, TAS, NT, ACT
        U = Other
        V = Active clinicians

      OptomsbyMMM:
        A31:J
        A = Year
        B:H = MM1-MM7
        I = Non-metro
        J = Metro

      Both use row 31 as the single GViz header row and row 32 onward
      as raw annual data.
    */
    const STATE_RANGE =
      'L31:V';

    const RURALITY_RANGE =
      'A31:J';

    const FETCH_TIMEOUT_MS =
      15000;

    const LOCAL_CACHE_KEY =
      'pff-workforce-location-v1';

    const STATE_LABELS = [
      'NSW',
      'VIC',
      'QLD',
      'SA',
      'WA',
      'TAS',
      'NT',
      'ACT'
    ];

    const STATE_COLOURS = [
      '#2db7f5',
      '#2d3a8c',
      '#7a0036',
      '#f03a47',
      '#000000',
      '#22a36b',
      '#c25e00',
      '#7b61ff'
    ];

    const RURALITY_LABELS = [
      'Metro',
      'Non-metro'
    ];

    const RURALITY_COLOURS = [
      '#30475d',
      '#b54a0a'
    ];

    const SERIES_SLOT_COUNT =
      STATE_LABELS.length;

    const EMBEDDED_FALLBACK =
{
      state: [
        {year:2013,values:[1382,1037,846,237,342,80,30,67]},
        {year:2014,values:[1392,1064,862,251,368,87,34,66]},
        {year:2015,values:[1508,1103,907,264,381,81,25,78]},
        {year:2016,values:[1533,1171,939,282,394,88,31,72]},
        {year:2017,values:[1568,1217,955,287,381,93,33,73]},
        {year:2018,values:[1609,1256,1021,297,415,104,33,79]},
        {year:2019,values:[1700,1339,1067,329,431,99,30,85]},
        {year:2020,values:[1726,1333,1107,339,429,108,32,94]},
        {year:2021,values:[1738,1426,1138,374,472,104,30,92]},
        {year:2022,values:[1856,1529,1205,393,475,117,29,105]},
        {year:2023,values:[1898,1598,1253,429,539,124,34,98]},
        {year:2024,values:[1971,1656,1307,437,555,122,37,116]}
      ],

      rurality: [
        {year:2013,values:[3129,893]},
        {year:2014,values:[3194,930]},
        {year:2015,values:[3396,952]},
        {year:2016,values:[3519,991]},
        {year:2017,values:[3606,1001]},
        {year:2018,values:[3764,1050]},
        {year:2019,values:[3999,1081]},
        {year:2020,values:[4022,1146]},
        {year:2021,values:[4200,1174]},
        {year:2022,values:[4494,1215]},
        {year:2023,values:[4686,1287]},
        {year:2024,values:[4857,1344]}
      ]
    };

    const TRANSPARENT_COLOUR =
      'rgba(0, 0, 0, 0)';

    // ============================================================
    // DOM + STATE
    // ============================================================

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById('loadingState');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartTabs =
      Array.from(
        document.querySelectorAll('.chart-tab')
      );

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const metricSwitch =
      document.getElementById('metricSwitch');

    const metricButtons =
      Array.from(
        document.querySelectorAll('.metric-button')
      );

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const chartHeadingFixed =
      document.getElementById('chartHeadingFixed');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartShell =
      document.getElementById('chartShell');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const chartCanvas =
      document.getElementById('workforceChart');

    let sourceData = {
      state: [],
      rurality: []
    };

    let chart = null;
    let activeGroup = 'state';
    let activeMetric = 'count';
    let trendMode = '3yr';
    let lastRenderedConfig = null;

    let yAxisController = null;
    let tabsController = null;
    let metricController = null;
    let trendController = null;
    let headingScroller = null;
    let legendController = null;
    let responsiveController = null;
    let chartInteractions = null;
    let chartSummary = null;
    let legendAnimationToken = 0;

    const hiddenSeriesByGroup =
      new Map();

    // ============================================================
    // DATA PARSING
    // ============================================================

    function numericWorkforceCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      if (
        typeof cell.v === 'number' &&
        Number.isFinite(cell.v)
      ) {
        return cell.v;
      }

      const cleaned =
        PFF.cleanText(
          cell.f ?? cell.v
        )
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function parseStateTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          numericWorkforceCell(cells[0]);

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100
        ) {
          return;
        }

        const values =
          Array.from(
            { length: 8 },
            (_, index) =>
              numericWorkforceCell(
                cells[index + 1]
              )
          );

        if (
          values.some(
            value =>
              !Number.isFinite(value)
          )
        ) {
          return;
        }

        parsed.push({
          year:
            Math.round(year),
          values
        });
      });

      return parsed.sort(
        (first, second) =>
          first.year -
          second.year
      );
    }

    function parseRuralityTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          numericWorkforceCell(cells[0]);

        const nonMetro =
          numericWorkforceCell(cells[8]);

        const metro =
          numericWorkforceCell(cells[9]);

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          !Number.isFinite(metro) ||
          !Number.isFinite(nonMetro)
        ) {
          return;
        }

        parsed.push({
          year:
            Math.round(year),

          values: [
            metro,
            nonMetro
          ]
        });
      });

      return parsed.sort(
        (first, second) =>
          first.year -
          second.year
      );
    }

    function validSourceData(data) {
      return Boolean(
        data &&
        Array.isArray(data.state) &&
        Array.isArray(data.rurality) &&
        data.state.length >= 3 &&
        data.rurality.length >= 3
      );
    }

    function parseLiveTables(tables) {
      const state =
        parseStateTable(
          tables?.[0]
        );

      const rurality =
        parseRuralityTable(
          tables?.[1]
        );

      const data = {
        state,
        rurality
      };

      if (!validSourceData(data)) {
        throw new Error(
          'Live workforce location data did not contain enough usable rows.'
        );
      }

      /*
        PFF's shared live/cache loader stores arrays.
        Wrap this two-table data object in one row so both
        source areas can share the same central cache helper.
      */
      return [data];
    }

    // ============================================================
    // VIEW DATA + CONFIGURATION
    // ============================================================

    function groupLabels(
      group = activeGroup
    ) {
      return group === 'state'
        ? STATE_LABELS
        : RURALITY_LABELS;
    }

    function groupColours(
      group = activeGroup
    ) {
      return group === 'state'
        ? STATE_COLOURS
        : RURALITY_COLOURS;
    }

    function groupRows(
      group = activeGroup
    ) {
      return sourceData[group] || [];
    }

    function shareRows(rows) {
      return rows.map(row => {
        const total =
          row.values.reduce(
            (sum, value) =>
              sum +
              (
                Number.isFinite(value)
                  ? value
                  : 0
              ),
            0
          );

        return {
          year:
            row.year,

          values:
            row.values.map(
              value =>
                total > 0
                  ? value /
                    total *
                    100
                  : NaN
            )
        };
      });
    }

    function currentRows() {
      const rows =
        groupRows();

      return activeMetric === 'share'
        ? shareRows(rows)
        : rows;
    }

    function currentViewConfig() {
      if (
        activeGroup === 'state' &&
        activeMetric === 'count'
      ) {
        return {
          headingFixed:
            'Active clinicians by\u00a0',

          headingDetail:
            'state',

          labels:
            STATE_LABELS,

          colours:
            STATE_COLOURS,

          yTitle:
            'Active clinicians',

          scale: {
            min: 0,
            max: 2500,
            step: 500,
            intervals: 5
          },

          axisDecimals: 0,
          valueDecimals: 0,
          suffix: ''
        };
      }

      if (
        activeGroup === 'rurality' &&
        activeMetric === 'count'
      ) {
        return {
          headingFixed:
            'Active clinicians by\u00a0',

          headingDetail:
            'rurality',

          labels:
            RURALITY_LABELS,

          colours:
            RURALITY_COLOURS,

          yTitle:
            'Active clinicians',

          scale: {
            min: 0,
            max: 5000,
            step: 1000,
            intervals: 5
          },

          axisDecimals: 0,
          valueDecimals: 0,
          suffix: ''
        };
      }

      if (
        activeGroup === 'state'
      ) {
        return {
          headingFixed:
            'Active clinicians by\u00a0',

          headingDetail:
            'state',

          labels:
            STATE_LABELS,

          colours:
            STATE_COLOURS,

          yTitle:
            '% of active clinicians',

          scale: {
            min: 0,
            max: 50,
            step: 10,
            intervals: 5
          },

          axisDecimals: 0,
          valueDecimals: 1,
          suffix: '%'
        };
      }

      return {
        headingFixed:
          'Active clinicians by\u00a0',

        headingDetail:
          'rurality',

        labels:
          RURALITY_LABELS,

        colours:
          RURALITY_COLOURS,

        yTitle:
          '% of active clinicians',

        scale: {
          min: 0,
          max: 100,
          step: 20,
          intervals: 5
        },

        axisDecimals: 0,
        valueDecimals: 1,
        suffix: '%'
      };
    }

    function valueForRow(
      row,
      seriesIndex
    ) {
      const value =
        row?.values?.[
          seriesIndex
        ];

      return Number.isFinite(value)
        ? value
        : NaN;
    }

    function activeTrendWindow() {
      return trendMode === '10yr'
        ? 10
        : trendMode === '3yr'
          ? 3
          : 0;
    }

    function trendForSeries(
      seriesIndex
    ) {
      const windowSize =
        activeTrendWindow();

      if (windowSize < 2) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        currentRows(),
        row =>
          valueForRow(
            row,
            seriesIndex
          ),
        windowSize
      );
    }

    function formatTooltipValue(
      value,
      config
    ) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      if (activeMetric === 'share') {
        return `${value.toFixed(
          config.valueDecimals
        )}%`;
      }

      return Math.round(
        value
      ).toLocaleString(
        'en-AU'
      );
    }

    // ============================================================
    // DATASETS
    // ============================================================

    function slotSeriesIndex(
      slotIndex,
      config
    ) {
      if (!config.labels.length) {
        return 0;
      }

      return slotIndex <
        config.labels.length
        ? slotIndex
        : slotIndex %
            config.labels.length;
    }

    function datasetForSlot(
      slotIndex,
      config
    ) {
      const rows =
        currentRows();

      const activeSeries =
        slotIndex <
        config.labels.length;

      const sourceIndex =
        slotSeriesIndex(
          slotIndex,
          config
        );

      const label =
        activeSeries
          ? config.labels[
              slotIndex
            ]
          : '';

      const hidden =
        hiddenSeriesByGroup.get(
          activeGroup
        ) ||
        new Set();

      const userHidden =
        activeSeries &&
        hidden.has(label);

      const visible =
        activeSeries &&
        !userHidden;

      const colour =
        visible
          ? config.colours[
              slotIndex
            ]
          : TRANSPARENT_COLOUR;

      return PFFCharts.lineDataset({
        label,

        data:
          rows.map(row => {
            const value =
              valueForRow(
                row,
                sourceIndex
              );

            return Number.isFinite(
              value
            )
              ? value
              : null;
          }),

        _activeSeries:
          visible,

        _seriesLabel:
          label,

        borderColor:
          colour,

        backgroundColor:
          colour,

        pointBackgroundColor:
          colour,

        pointBorderColor:
          '#ffffff',

        pointBorderWidth:
          visible ? 1 : 0,

        pointHoverRadius:
          visible ? 4 : 0,

        pointHitRadius:
          visible
            ? (
                PFFCharts.mobileLayout()
                  ? 9
                  : 5
              )
            : 0,

        cubicInterpolationMode:
          'monotone'
      });
    }

    function buildDatasets(config) {
      return Array.from(
        {
          length:
            SERIES_SLOT_COUNT
        },
        (_, slotIndex) =>
          datasetForSlot(
            slotIndex,
            config
          )
      );
    }

    function syncChartDatasets(config) {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets(config);

      nextDatasets.forEach(
        (nextDataset, index) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] = nextDataset;
          } else {
            Object.assign(
              current,
              nextDataset
            );
          }

          const activeSeries =
            index <
            config.labels.length;

          const hidden =
            hiddenSeriesByGroup.get(
              activeGroup
            ) ||
            new Set();

          const label =
            activeSeries
              ? config.labels[index]
              : '';

          const userHidden =
            activeSeries &&
            hidden.has(label);

          if (
            typeof chart.setDatasetVisibility ===
            'function'
          ) {
            chart.setDatasetVisibility(
              index,
              activeSeries
                ? !userHidden
                : true
            );
          }
        }
      );
    }

    // ============================================================
    // SHARED PFF PLUGINS
    // ============================================================

    const yearTicksPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'pffWorkforceLocationYearTicks',

        getValue({
          index
        }) {
          return currentRows()[
            index
          ]?.year;
        }
      });

    const trendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'pffWorkforceLocationTrendLabels',

        enabled() {
          return (
            trendMode !==
              'off'
          );
        },

        isActive({
          dataset
        }) {
          return Boolean(
            dataset?._activeSeries
          );
        },

        getTrendValue({
          datasetIndex
        }) {
          return trendForSeries(
            datasetIndex
          );
        },

        getSeriesColour({
          datasetIndex
        }) {
          return currentViewConfig()
            .colours[
              datasetIndex
            ] ||
            '#69718a';
        }
      });

    // ============================================================
    // CHART
    // ============================================================

    function baseChartOptions(config) {
      return PFFCharts.baseChartOptions({
        transitions:
          PFFCharts.seriesVisibilityTransitionOptions(
            240
          ),

        plugins: {
          tooltip: {
            filter(context) {
              return Boolean(
                context.dataset
                  ._activeSeries
              );
            },

            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      items[0].label
                    )
                  : '';
              },

              label(context) {
                const value =
                  Number(
                    context.raw
                  );

                const base =
                  `${context.dataset._seriesLabel}: ${formatTooltipValue(
                    value,
                    currentViewConfig()
                  )}`;

                if (
                  trendMode ===
                    'off'
                ) {
                  return base;
                }

                const trend =
                  trendForSeries(
                    context.datasetIndex
                  );

                return Number.isFinite(
                  trend
                )
                  ? `${base} · ${trend >= 0 ? '+' : '−'}${Math.abs(
                      trend
                    ).toFixed(1)}% p.a.`
                  : base;
              }
            }
          }
        },

        scales: {
          x:
            PFFCharts.xYearScaleOptions({
              ticks: {
                callback(
                  value,
                  index
                ) {
                  const year =
                    Number(
                      currentRows()[
                        index
                      ]?.year
                    );

                  return Number.isFinite(year) &&
                    year % 2 === 0
                    ? String(year)
                    : '';
                }
              }
            }),

          y:
            PFFCharts.yScaleOptions(
              config.scale,
              {
                ticks: {
                  stepSize:
                    config.scale.step
                }
              }
            )
        }
      });
    }

    function syncChartScale(config) {
      if (!chart) {
        return;
      }

      const y =
        chart.options.scales.y;

      y.min =
        config.scale.min;

      y.max =
        config.scale.max;

      y.ticks.stepSize =
        config.scale.step;
    }

    function updateHeading(
      previousConfig,
      nextConfig,
      animate = true
    ) {
      const changed =
        !previousConfig ||
        previousConfig.headingFixed !==
          nextConfig.headingFixed ||
        previousConfig.headingDetail !==
          nextConfig.headingDetail;

      if (changed) {
        if (animate) {
          PFFCharts.animateHeading({
            fixed:
              chartHeadingFixed,

            detail:
              chartHeadingDetail,

            fixedText:
              nextConfig.headingFixed,

            detailText:
              nextConfig.headingDetail,

            duration:
              PFFCharts.defaults
                .viewTransitionMs,

            onComplete() {
              headingScroller?.update();
            }
          });
        } else {
          chartHeadingFixed.textContent =
            nextConfig.headingFixed;

          chartHeadingDetail.textContent =
            nextConfig.headingDetail;
        }
      }

      headingScrollViewport.scrollLeft =
        0;

      requestAnimationFrame(
        () =>
          headingScroller?.update()
      );
    }

    function legendItems() {
      const config =
        currentViewConfig();

      const hidden =
        hiddenSeriesByGroup.get(
          activeGroup
        ) ||
        new Set();

      return config.labels.map(
        (
          label,
          datasetIndex
        ) => ({
          datasetIndex,
          label,

          colour:
            config.colours[
              datasetIndex
            ],

          active:
            !hidden.has(label)
        })
      );
    }

    function renderLegend(
      animate = false
    ) {
      if (!legendController) {
        return;
      }

      const draw = () => {
        legendController.render();
        chartLegend.scrollLeft = 0;
      };

      if (
        !animate ||
        PFFCharts.reducedMotion() ||
        typeof chartLegend.animate !==
          'function' ||
        !chartLegend.childElementCount
      ) {
        draw();
        return;
      }

      const token =
        ++legendAnimationToken;

      chartLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const outgoing =
        chartLegend.animate(
          [
            { opacity: 1 },
            { opacity: 0 }
          ],
          {
            duration: 120,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      outgoing.finished
        .catch(() => {})
        .then(() => {
          if (
            token !==
            legendAnimationToken
          ) {
            return;
          }

          outgoing.cancel();
          draw();

          const incoming =
            chartLegend.animate(
              [
                { opacity: 0 },
                { opacity: 1 }
              ],
              {
                duration: 220,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'both'
              }
            );

          incoming.finished
            .then(
              () =>
                incoming.cancel()
            )
            .catch(() => {});
        });
    }

    function syncTrendVisibility() {
      yoyTrendToggle.hidden =
        false;

      yoyTrendToggle.setAttribute(
        'aria-hidden',
        'false'
      );

      trendController?.set(
        trendMode,
        false
      );
    }

    function updateAccessibleSummary() {
      if (
        !chartSummary ||
        !currentRows().length
      ) {
        return;
      }

      const config =
        currentViewConfig();

      const rows =
        currentRows();

      const latest =
        rows[
          rows.length - 1
        ];

      const values =
        config.labels
          .map(
            (
              label,
              index
            ) => {
              const value =
                valueForRow(
                  latest,
                  index
                );

              return `${label} ${formatTooltipValue(
                value,
                config
              )}`;
            }
          )
          .join(', ');

      const trendDescription =
        trendMode ===
          'off'
          ? 'Trend annotations are off.'
          : `${activeTrendWindow()}-year trend annotations are on.`;

      PFFCharts.updateChartSummary(
        `${config.headingFixed}${config.headingDetail}. Latest data ${latest.year}: ${values}. ${trendDescription}`,
        chartSummary
      );
    }

    function createChart(config) {
      chartHeadingFixed.textContent =
        config.headingFixed;

      chartHeadingDetail.textContent =
        config.headingDetail;

      yAxisController =
        PFFCharts.createUnifiedYAxis({
          id:
            'pffWorkforceLocationAxes',

          getChart() {
            return chart;
          },

          getScale() {
            return currentViewConfig()
              .scale;
          },

          getDecimals() {
            return currentViewConfig()
              .axisDecimals;
          },

          getTitle() {
            return currentViewConfig()
              .yTitle;
          }
        });

      yAxisController.setImmediately(
        config.scale,
        config.axisDecimals
      );

      yAxisController.setTitleImmediately(
        config.yTitle
      );

      const rows =
        currentRows();

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type: 'line',

            data: {
              labels:
                rows.map(
                  row =>
                    String(row.year)
                ),

              datasets:
                buildDatasets(config)
            },

            options:
              baseChartOptions(config),

            plugins: [
              yAxisController.plugin,
              yearTicksPlugin,
              trendLabelsPlugin
            ]
          }
        );

      syncChartDatasets(config);

      lastRenderedConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      updateAccessibleSummary();
    }

    function updateChart(
      reason = 'option'
    ) {
      const config =
        currentViewConfig();

      const previousConfig =
        lastRenderedConfig;

      updateHeading(
        previousConfig,
        config,
        reason !== 'initial'
      );

      syncTrendVisibility();

      if (!chart) {
        createChart(config);
        return;
      }

      chart.tooltip.setActiveElements(
        [],
        {
          x: 0,
          y: 0
        }
      );

      const previousVisibleScale =
        yAxisController.currentScale();

      const previousAxisDecimals =
        yAxisController.currentDecimals();

      const scaleChanged =
        !previousConfig ||
        !PFFCharts.scalesMatch(
          previousConfig.scale,
          config.scale
        ) ||
        previousConfig.axisDecimals !==
          config.axisDecimals;

      const yTitleChanged =
        !previousConfig ||
        previousConfig.yTitle !==
          config.yTitle;

      const legendChanged =
        !previousConfig ||
        !PFFCharts.arraysMatch(
          previousConfig.labels,
          config.labels
        ) ||
        !PFFCharts.arraysMatch(
          previousConfig.colours,
          config.colours
        );

      const rows =
        currentRows();

      chart.data.labels =
        rows.map(
          row =>
            String(row.year)
        );

      syncChartDatasets(config);
      syncChartScale(config);

      const duration =
        reason === 'initial'
          ? 0
          : PFFCharts
              .chartAnimationDuration();

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeInOutCubic';

      chart.options.animations.x.duration =
        duration;

      chart.options.animations.x.easing =
        'easeInOutCubic';

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeInOutCubic';

      chart.options.animations.colors.duration =
        0;

      chart.update();

      if (scaleChanged) {
        yAxisController.animate(
          previousVisibleScale,
          config.scale,
          {
            duration,

            fromDecimals:
              previousAxisDecimals,

            toDecimals:
              config.axisDecimals
          }
        );
      } else {
        yAxisController.setImmediately(
          config.scale,
          config.axisDecimals
        );
      }

      if (yTitleChanged) {
        yAxisController.animateTitle(
          previousConfig?.yTitle ??
            config.yTitle,
          config.yTitle,
          duration
        );
      } else {
        yAxisController.setTitleImmediately(
          config.yTitle
        );
      }

      if (legendChanged) {
        renderLegend(
          reason !== 'initial'
        );
      } else {
        legendController?.render();
      }

      lastRenderedConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      updateAccessibleSummary();
    }

    // ============================================================
    // SHARED CONTROLS
    // ============================================================

    function setupControls() {
      headingScroller =
        PFFCharts.setupScrollableRegion({
          scroller:
            headingScrollViewport,

          leftButton:
            headingScrollLeft,

          rightButton:
            headingScrollRight
        });

      tabsController =
        PFFCharts.setupTabs({
          tabList,

          tabs:
            chartTabs,

          valueAttribute:
            'group',

          initialValue:
            activeGroup,

          leftButton:
            tabScrollLeft,

          rightButton:
            tabScrollRight,

          onChange(group) {
            if (
              group ===
              activeGroup
            ) {
              return;
            }

            activeGroup =
              group;

            updateChart(
              'tab'
            );
          }
        });

      metricController =
        PFFCharts.setupMetricSwitch({
          element:
            metricSwitch,

          buttons:
            metricButtons,

          valueAttribute:
            'metric',

          initialValue:
            activeMetric,

          onChange(metric) {
            if (
              metric ===
              activeMetric
            ) {
              return;
            }

            activeMetric =
              metric;

            updateChart(
              'option'
            );
          }
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,

          initialMode:
            trendMode,

          onChange(mode) {
            trendMode =
              mode;

            updateAccessibleSummary();
            chart?.draw();
          }
        });

      legendController =
        PFFCharts.setupLegend({
          legend:
            chartLegend,

          leftButton:
            legendScrollLeft,

          rightButton:
            legendScrollRight,

          getChart() {
            return chart;
          },

          getItems:
            legendItems,

          onToggle({
            datasetIndex,
            visible,
            item
          }) {
            const hidden =
              new Set(
                hiddenSeriesByGroup.get(
                  activeGroup
                ) ||
                []
              );

            if (visible) {
              hidden.delete(
                item.label
              );
            } else {
              hidden.add(
                item.label
              );
            }

            hiddenSeriesByGroup.set(
              activeGroup,
              hidden
            );

            const config =
              currentViewConfig();

            const dataset =
              chart?.data?.datasets?.[
                datasetIndex
              ];

            if (dataset) {
              dataset._activeSeries =
                visible;

              const colour =
                visible
                  ? config.colours[
                      datasetIndex
                    ]
                  : TRANSPARENT_COLOUR;

              dataset.borderColor =
                colour;

              dataset.backgroundColor =
                colour;

              dataset.pointBackgroundColor =
                colour;

              dataset.pointBorderWidth =
                visible ? 1 : 0;

              dataset.pointHoverRadius =
                visible ? 4 : 0;

              dataset.pointHitRadius =
                visible
                  ? (
                      PFFCharts.mobileLayout()
                        ? 9
                        : 5
                    )
                  : 0;
            }

            const visibilityDuration =
              PFFCharts.reducedMotion()
                ? 0
                : 240;

            chart.options.animation.duration =
              visibilityDuration;

            chart.options.animations.x.duration =
              visibilityDuration;

            chart.options.animations.y.duration =
              visibilityDuration;

            chart.options.animations.colors.duration =
              visibilityDuration;

            updateAccessibleSummary();
          }
        });

      chartInteractions =
        PFFCharts.setupChartInteractions({
          canvas:
            chartCanvas,

          getChart() {
            return chart;
          }
        });

      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },

          observe: [
            app,
            chartShell
          ],

          beforeResize(
            chartInstance
          ) {
            chartInstance
              .data
              .datasets
              .forEach(
                dataset => {
                  dataset.pointHitRadius =
                    dataset._activeSeries
                      ? (
                          PFFCharts.mobileLayout()
                            ? 9
                            : 5
                        )
                      : 0;
                }
              );
          },

          onRefresh() {
            tabsController?.update();
            headingScroller?.update();
            legendController?.update();
          }
        });

      chartSummary =
        PFFCharts.ensureChartSummary({
          parent:
            app
        });

      syncTrendVisibility();
    }

    // ============================================================
    // STARTUP
    // ============================================================

    setupControls();

    PFF.initialiseApp({
      app,

      status:
        statusElement,

      loadLive() {
        return Promise.all([
          PFFCharts.loadGVizSheet({
            sheetId:
              SHEET_ID,

            sheetName:
              STATE_SHEET,

            range:
              STATE_RANGE,

            timeoutMs:
              FETCH_TIMEOUT_MS,

            headers:
              '1'
          }),

          PFFCharts.loadGVizSheet({
            sheetId:
              SHEET_ID,

            sheetName:
              RURALITY_SHEET,

            range:
              RURALITY_RANGE,

            timeoutMs:
              FETCH_TIMEOUT_MS,

            headers:
              '1'
          })
        ]);
      },

      parseLive:
        parseLiveTables,

      cacheKey:
        LOCAL_CACHE_KEY,

      fallback: [
        EMBEDDED_FALLBACK
      ],

      minRows:
        1,

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,

        text:
          dataSourceText
      },

      onLiveError(error) {
        console.warn(
          'Live workforce location data unavailable; using cached data.',
          error
        );
      },

      render(loaded) {
        const data =
          loaded.rows?.[0];

        if (!validSourceData(data)) {
          throw new Error(
            'Unable to read workforce location data.'
          );
        }

        sourceData =
          data;

        const config =
          currentViewConfig();

        createChart(config);
        tabsController?.update();
        metricController?.set(
          activeMetric,
          false
        );
        trendController?.set(
          trendMode,
          false
        );
        syncTrendVisibility();
        legendController?.render();
        responsiveController?.refresh();

        return chart;
      },

      onReady() {
        loadingState.setAttribute(
          'aria-hidden',
          'true'
        );

        updateAccessibleSummary();
      },

      errorMessage:
        'Unable to render workforce location chart'
    });
  </script>
</body>
