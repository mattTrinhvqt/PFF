<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Workforce Location Trends</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --nsw: #2db7f5;
      --vic: #2d3a8c;
      --qld: #7a0036;
      --sa: #f03a47;
      --wa: #000000;
      --tas: #22a36b;
      --nt: #c25e00;
      --act: #7b61ff;

      --metro: #30475d;
      --nonmetro: #b54a0a;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 4px;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    /* ============================================================
     * TOP TABS + LIVE STATUS
     * ============================================================ */

    .module-top {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-list {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow: hidden;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms var(--motion-ease),
        width 420ms var(--motion-ease);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab:hover:not(.is-active) {
      color: var(--ink);
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ============================================================
     * HEADING + SEGMENTED TOGGLE
     * ============================================================ */

    .chart-heading-row {
      position: relative;
      z-index: 30;
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 31px;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
      margin: 0;
    }

    .chart-heading {
      display: inline-flex;
      min-width: 0;
      flex: 1 1 auto;
      align-items: baseline;
      margin: 0;
      padding: 4px 0 0;
      overflow: hidden;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-group,
    .chart-heading-suffix {
      display: inline-block;
      flex: 0 0 auto;
      will-change: opacity;
    }

    .chart-heading-suffix:not(:empty) {
      margin-left: 0.28em;
    }

    .metric-switch {
      position: relative;
      display: grid;
      width: 174px;
      height: 27px;
      flex: 0 0 174px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      margin-top: 2px;
      padding: 1px;
      overflow: hidden;
      background: rgba(232, 234, 240, 0.55);
      border-radius: 4px;
      isolation: isolate;
    }

    .metric-switch::before {
      content: '';
      position: absolute;
      top: 1px;
      bottom: 1px;
      left: 1px;
      z-index: 0;
      width: calc((100% - 2px) / 3);
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.08);
      transform: translateX(calc(var(--metric-index, 0) * 100%));
      transition: transform 300ms var(--motion-ease);
      will-change: transform;
    }

    .metric-button {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 25px;
      padding: 0 3px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 3px;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 220ms ease;
    }

    .metric-button:hover:not(.is-active) {
      color: var(--ink);
    }

    .metric-button.is-active {
      color: var(--purple);
    }

    .metric-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -1px;
    }

    /* ============================================================
     * LEGEND
     * ============================================================ */

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 1;
    }

    .legend-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 1;
      transition: opacity 180ms ease;
    }

    .legend-item.is-hidden-series {
      opacity: 0.36;
    }

    .legend-item:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
      background: var(--ink);
    }

    /* ============================================================
     * CHART
     * ============================================================ */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -2px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .chart-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      opacity: 1;
      transition: opacity 260ms var(--motion-ease);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    .chart-canvas.is-inactive {
      opacity: 0;
      pointer-events: none;
    }

    .shared-chart-spines {
      position: absolute;
      top: 5px;
      right: 5px;
      bottom: 39px;
      left: 61px;
      z-index: 5;
      pointer-events: none;
    }

    .shared-chart-spines::before,
    .shared-chart-spines::after {
      content: '';
      position: absolute;
      background: #151515;
      pointer-events: none;
    }

    .shared-chart-spines::before {
      top: 0;
      bottom: 0;
      left: 0;
      width: 1.1px;
    }

    .shared-chart-spines::after {
      right: 0;
      bottom: 0;
      left: 0;
      height: 1.1px;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 2px;
      }

      .chart-tab {
        padding-right: 8px;
        padding-left: 8px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .shared-chart-spines {
        left: 54px;
      }

      .chart-heading {
        font-size: 14px;
      }

      .metric-switch {
        width: 162px;
        flex-basis: 162px;
      }

      .metric-button {
        font-size: 8px;
      }

      .legend-item {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading workforce location data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading workforce location data…</p>
      </div>

      <div class="module-top">
        <div
          id="tabList"
          class="tab-list"
          role="tablist"
          aria-label="Workforce location grouping"
        >
          <button
            class="chart-tab is-active"
            type="button"
            role="tab"
            aria-selected="true"
            data-group="state"
          >State</button>

          <button
            class="chart-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-group="rurality"
          >Rurality</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 id="chartHeading" class="chart-heading">
          <span class="chart-heading-fixed">Clinicians by&nbsp;</span><span id="chartHeadingGroup" class="chart-heading-group">state</span><span id="chartHeadingSuffix" class="chart-heading-suffix"></span>
        </h2>

        <div
          id="metricSwitch"
          class="metric-switch"
          role="group"
          aria-label="Display metric"
        >
          <button
            class="metric-button is-active"
            type="button"
            data-metric="count"
          >Count</button>

          <button
            class="metric-button"
            type="button"
            data-metric="share"
          >%</button>

          <button
            class="metric-button"
            type="button"
            data-metric="growth"
          >YoY change</button>
        </div>
      </div>

      <div class="chart-options-row">
        <div id="legendNav" class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >‹</button>

          <div class="legend-viewport">
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Chart legend"
            ></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >›</button>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="trendChart"
          class="chart-canvas"
          aria-label="Australian optometry workforce location trend chart"
          role="img"
        ></canvas>

        <canvas
          id="growthChart"
          class="chart-canvas is-inactive"
          aria-label="Australian optometry workforce yearly change chart"
          role="img"
        ></canvas>

        <div
          class="shared-chart-spines"
          aria-hidden="true"
        ></div>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    // ============================================================
    // DATA SOURCE
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const STATE_SHEET =
      'Optomsbystate';

    const RURALITY_SHEET =
      'OptomsbyMMM';

    /*
      Optomsbystate:
        L31:V
        L = Year
        M:T = NSW, VIC, QLD, SA, WA, TAS, NT, ACT
        U = Other
        V = Active clinicians

      OptomsbyMMM:
        A31:J
        A = Year
        B:H = MM1-MM7
        I = Non-metro
        J = Metro

      Both use row 31 as the single GViz header row and row 32 onward
      as raw annual data.
    */
    const STATE_RANGE =
      'L31:V';

    const RURALITY_RANGE =
      'A31:J';

    const FETCH_TIMEOUT_MS =
      15000;

    const LOCAL_CACHE_KEY =
      'pff-workforce-location-v1';

    const STATE_LABELS = [
      'NSW',
      'VIC',
      'QLD',
      'SA',
      'WA',
      'TAS',
      'NT',
      'ACT'
    ];

    const STATE_COLOURS = [
      '#2db7f5',
      '#2d3a8c',
      '#7a0036',
      '#f03a47',
      '#000000',
      '#22a36b',
      '#c25e00',
      '#7b61ff'
    ];

    const RURALITY_LABELS = [
      'Metro',
      'Non-metro'
    ];

    const RURALITY_COLOURS = [
      '#30475d',
      '#b54a0a'
    ];

    const SERIES_SLOT_COUNT =
      STATE_LABELS.length;

    const EMBEDDED_FALLBACK = {
      state: [
        {year:2013,values:[1382,1037,846,237,342,80,30,67]},
        {year:2014,values:[1392,1064,862,251,368,87,34,66]},
        {year:2015,values:[1508,1103,907,264,381,81,25,78]},
        {year:2016,values:[1533,1171,939,282,394,88,31,72]},
        {year:2017,values:[1568,1217,955,287,381,93,33,73]},
        {year:2018,values:[1609,1256,1021,297,415,104,33,79]},
        {year:2019,values:[1700,1339,1067,329,431,99,30,85]},
        {year:2020,values:[1726,1333,1107,339,429,108,32,94]},
        {year:2021,values:[1738,1426,1138,374,472,104,30,92]},
        {year:2022,values:[1856,1529,1205,393,475,117,29,105]},
        {year:2023,values:[1898,1598,1253,429,539,124,34,98]},
        {year:2024,values:[1971,1656,1307,437,555,122,37,116]}
      ],

      rurality: [
        {year:2013,values:[3129,893]},
        {year:2014,values:[3194,930]},
        {year:2015,values:[3396,952]},
        {year:2016,values:[3519,991]},
        {year:2017,values:[3606,1001]},
        {year:2018,values:[3764,1050]},
        {year:2019,values:[3999,1081]},
        {year:2020,values:[4022,1146]},
        {year:2021,values:[4200,1174]},
        {year:2022,values:[4494,1215]},
        {year:2023,values:[4686,1287]},
        {year:2024,values:[4857,1344]}
      ]
    };

    // ============================================================
    // DOM + STATE
    // ============================================================

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById('loadingState');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const chartTabs =
      Array.from(
        document.querySelectorAll('.chart-tab')
      );

    const metricSwitch =
      document.getElementById('metricSwitch');

    const metricButtons =
      Array.from(
        document.querySelectorAll('.metric-button')
      );

    const chartHeadingGroup =
      document.getElementById('chartHeadingGroup');

    const chartHeadingSuffix =
      document.getElementById('chartHeadingSuffix');

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    // ============================================================
    // HELPERS
    // ============================================================

    function reducedMotion() {
      return window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;
    }

    function clamp(value, minimum, maximum) {
      return Math.min(
        maximum,
        Math.max(minimum, value)
      );
    }

    function easeOutQuart(value) {
      return 1 - Math.pow(1 - value, 4);
    }

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function numericCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      if (
        typeof cell.v === 'number' &&
        Number.isFinite(cell.v)
      ) {
        return cell.v;
      }

      const cleaned =
        cleanText(
          cell.f ?? cell.v
        )
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function rgba(hex, alpha) {
      const cleaned =
        String(hex)
          .replace('#', '')
          .trim();

      const value =
        Number.parseInt(cleaned, 16);

      if (!Number.isFinite(value)) {
        return `rgba(21,21,21,${alpha})`;
      }

      const red =
        (value >> 16) & 255;

      const green =
        (value >> 8) & 255;

      const blue =
        value & 255;

      return `rgba(${red},${green},${blue},${alpha})`;
    }

    function hideLoadingState() {
      app.classList.remove('is-loading');
      app.setAttribute('aria-busy', 'false');
      loadingState.setAttribute('aria-hidden', 'true');

    function setDataSource(source) {
      const isCached =
        source !== 'live';

      dataSourceIndicator.classList.toggle(
        'is-cached',

      if (source === 'live') {

    }

      if (!hiddenSeriesByGroup.has(group)) {

    function loadGVizSheet(
      sheetName,
      range
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `__pff_location_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement('script');

          let completed =
            false;

          const cleanup = () => {
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }

            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] = undefined;
            }
          };

          const timer =
            window.setTimeout(
              () => {
                if (completed) {
                  return;
                }

                completed = true;
                cleanup();

                reject(
                  new Error(
                    `Timed out loading ${sheetName}.`
                  )
                );
              },
              FETCH_TIMEOUT_MS
            );

          window[callbackName] =
            response => {
              if (completed) {
                return;
              }

              completed = true;
              window.clearTimeout(timer);
              cleanup();

              if (
                !response ||
                response.status === 'error'
              ) {
                const message =
                  response?.errors?.[0]?.detailed_message ||
                  response?.errors?.[0]?.message ||
                  `Could not load ${sheetName}.`;

                reject(
                  new Error(message)
                );

                return;
              }

              resolve(response.table);
            };

          script.onerror = () => {
            if (completed) {
              return;
            }

            completed = true;
            window.clearTimeout(timer);
            cleanup();

            reject(
              new Error(
                `Could not connect to ${sheetName}.`
              )
            );
          };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              headers: '1',
              tqx: `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async = true;
          document.head.appendChild(script);
        }
      );
    }

    function parseStateTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          numericCell(cells[0]);

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100
        ) {
          return;
        }

        const values =
          Array.from(
            { length: 8 },
            (_, index) =>
              numericCell(
                cells[index + 1]
              )
          );

        if (
          values.some(
            value => !Number.isFinite(value)
          )
        ) {
          return;
        }

        parsed.push({
          year: Math.round(year),
          values
        });
      });

      return parsed
        .sort(
          (a, b) => a.year - b.year
        );
    }

    function parseRuralityTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          numericCell(cells[0]);

        const nonMetro =
          numericCell(cells[8]);

        const metro =
          numericCell(cells[9]);

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          !Number.isFinite(metro) ||
          !Number.isFinite(nonMetro)
        ) {
          return;
        }

        parsed.push({
          year: Math.round(year),
          values: [
            metro,
            nonMetro
          ]
        });
      });

      return parsed
        .sort(
          (a, b) => a.year - b.year
        );
    }

    function validSourceData(data) {
      return Boolean(
        data &&
        Array.isArray(data.state) &&
        Array.isArray(data.rurality) &&
        data.state.length >= 3 &&
        data.rurality.length >= 3
      );
    }

    function saveLocalCache(data) {
      try {
        localStorage.setItem(
          LOCAL_CACHE_KEY,
          JSON.stringify({
            savedAt: Date.now(),
            data
          })
        );
      } catch (_) {
        // Local storage is optional.
      }
    }

    function readLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            LOCAL_CACHE_KEY
          );

        if (!raw) {
          return null;
        }

        const parsed =
          JSON.parse(raw);

        return validSourceData(parsed?.data)
          ? parsed.data
          : null;
      } catch (_) {
        return null;
      }
    }

    async function loadData() {
      try {
        const [
          stateTable,
          ruralityTable
        ] =
          await Promise.all([
            loadGVizSheet(
              STATE_SHEET,
              STATE_RANGE
            ),
            loadGVizSheet(
              RURALITY_SHEET,
              RURALITY_RANGE
            )
          ]);

        const liveData = {
          state:
            parseStateTable(
              stateTable
            ),
          rurality:
            parseRuralityTable(
              ruralityTable
            )
        };

        if (!validSourceData(liveData)) {
          throw new Error(
            'Live sheet data were incomplete.'
          );
        }

        saveLocalCache(liveData);
        setDataSource('live');

        return liveData;
      } catch (error) {
        const cached =
          readLocalCache();

        setDataSource('cached');

        if (validSourceData(cached)) {
          return cached;
        }

        return {
          state:
            EMBEDDED_FALLBACK.state.map(
              row => ({
                year: row.year,
                values: [...row.values]
              })
            ),
          rurality:
            EMBEDDED_FALLBACK.rurality.map(
              row => ({
                year: row.year,
                values: [...row.values]
              })
            )
        };
      }
    }

    function shareRows(rows) {
      return rows.map(row => {
        const total =
          row.values.reduce(
            (sum, value) =>
              sum +
              (
                Number.isFinite(value)
                  ? value
                  : 0
              ),
            0
          );

        return {
          year: row.year,
          values:
            row.values.map(
              value =>
                total > 0
                  ? value / total * 100
                  : NaN
            )
        };
      });
    }

    function linearSlope(values) {
      const points =
        values
          .map((value, index) => ({
            x: index,
            y:
              Number.isFinite(value) &&
              value > 0
                ? Math.log(value)
                : NaN
          }))
          .filter(
            point =>
              Number.isFinite(point.y)
          );

      if (points.length < 2) {
        return NaN;
      }

      const meanX =
        points.reduce(
          (sum, point) => sum + point.x,
          0
        ) /
        points.length;

      const meanY =
        points.reduce(
          (sum, point) => sum + point.y,
          0
        ) /
        points.length;

      let numerator = 0;
      let denominator = 0;

      points.forEach(point => {
        const dx =
          point.x - meanX;

        numerator +=
          dx *
          (point.y - meanY);

        denominator +=
          dx * dx;
      });

      return denominator > 0
        ? numerator / denominator
        : NaN;
    }

    function latestAnnualisedGrowth(rows) {
      const labels =
        groupLabels();

      const recent =
        rows.slice(-3);

      return labels.map(
        (_, seriesIndex) => {
          const values =
            recent.map(
              row =>
                row.values[
                  seriesIndex
                ]
            );

          const slope =
            linearSlope(values);

          return Number.isFinite(slope)
            ? (
                Math.exp(slope) - 1
              ) * 100
            : NaN;
        }
      );
    }

    function fadeTextChange(
      element,
      nextText,
      duration = 240
    ) {
      if (
        !element ||
        element.textContent === nextText
      ) {
        return;
      }

      if (
        reducedMotion() ||
        !element.animate
      ) {
        element.textContent =
          nextText;

        return;
      }

      const token =
        Symbol('text');

      element._pffToken = token;

      const fadeOut =
        element.animate(
          [
            { opacity: 1 },
            { opacity: 0 }
          ],
          {
            duration:
              Math.round(duration * 0.42),
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      fadeOut.finished
        .then(() => {
          if (
            element._pffToken !== token
          ) {
            return;
          }

          element.textContent =
            nextText;

          const fadeIn =
            element.animate(
              [
                { opacity: 0 },
                { opacity: 1 }
              ],
              {
                duration:
                  Math.round(duration * 0.58),
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'forwards'
              }
            );

          return fadeIn.finished;
        })
        .catch(() => {});
    }

    function updateHeading() {
      const nextGroup =
        activeGroup === 'state'

      let nextSuffix = '';

      if (activeMetric === 'share') {

      } else if (activeMetric === 'growth') {
        nextSuffix = 'yearly change (%)';

      fadeTextChange(
        chartHeadingGroup,
        nextGroup

      fadeTextChange(
        chartHeadingSuffix,

    function updateLegendScrollControls() {
      const maximum =
        Math.max(
          0,
          chartLegend.scrollWidth -
          chartLegend.clientWidth
        );

      const tolerance = 2;

      legendScrollLeft.classList.toggle(
        'is-hidden',
        chartLegend.scrollLeft <=
          tolerance
      );

      legendScrollRight.classList.toggle(
        'is-hidden',
        chartLegend.scrollLeft >=
          maximum - tolerance
      );
    }

    function renderLegendItems() {
      const labels =
        groupLabels();

      const colours =
        groupColours();

      const hidden =
        hiddenSeriesSet();

      chartLegend.replaceChildren();

      labels.forEach((label, index) => {
        const button =
          document.createElement('button');

        button.type = 'button';
        button.className =
          'legend-item';

        button.classList.toggle(
          'is-hidden-series',
          hidden.has(label)
        );

        button.setAttribute(
          'aria-pressed',
          String(
            !hidden.has(label)
          )
        );

        button.dataset.series =
          label;

        const swatch =
          document.createElement('span');

        swatch.className =
          'legend-line';

        swatch.style.background =
          colours[index];

        const text =
          document.createElement('span');

        text.textContent =
          label;

        button.append(
          swatch,
          text
        );

        button.addEventListener(
          'click',
          () => {
            const currentHidden =
              hiddenSeriesSet();

            if (
              currentHidden.has(label)
            ) {
              currentHidden.delete(label);
            } else {
              currentHidden.add(label);
            }

            button.classList.toggle(
              'is-hidden-series',
              currentHidden.has(label)
            );

            button.setAttribute(
              'aria-pressed',
              String(
                !currentHidden.has(label)
              )
            );

            renderCurrentChart(
              'legend'
            );
          }
        );

        chartLegend.appendChild(
          button
        );
      });

      requestAnimationFrame(
        updateLegendScrollControls
      );
    }

    function updateLegend(
      previousGroup,
      nextGroup
    ) {
      if (
        previousGroup === nextGroup &&
        chartLegend.children.length
      ) {
        return;
      }

      const token =
        ++legendAnimationToken;

      if (
        reducedMotion() ||
        !chartLegend.animate ||
        !chartLegend.children.length
      ) {
        renderLegendItems();
        return;
      }

      const fadeOut =
        chartLegend.animate(
          [
            { opacity: 1 },
            { opacity: 0 }
          ],
          {
            duration: 150,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      fadeOut.finished
        .then(() => {
          if (
            token !==
            legendAnimationToken
          ) {
            return;
          }

          renderLegendItems();
          chartLegend.scrollLeft = 0;

          const fadeIn =
            chartLegend.animate(
              [
                { opacity: 0 },
                { opacity: 1 }
              ],
              {
                duration: 270,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'forwards'
              }
            );

          return fadeIn.finished;
        })
        .catch(() => {
          renderLegendItems();
        });
    }

    // ============================================================
    // TREND AXIS ANIMATION
    // ============================================================

    function trendTickTargets(config) {
      const count =
        Math.round(
          (
            config.max -
            config.min
          ) /
          config.majorStep
        );

      return Array.from(
        { length: count + 1 },
        (_, index) =>
          config.min +
          config.majorStep * index
      );
    }

    function animateTrendTickValues(
      targets,
      duration = 420
    ) {
      const targetValues =
        [...targets];

      if (!targetValues.length) {
        return;
      }

      if (yAxisTickAnimation.raf) {
        cancelAnimationFrame(
          yAxisTickAnimation.raf
        );
      }

      const token =
        ++yAxisTickAnimation.token;

      const startValues =
        yAxisTickAnimation.values.length ===
          targetValues.length
          ? [...yAxisTickAnimation.values]
          : [...targetValues];

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        yAxisTickAnimation.values =
          targetValues;

        trendChart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      const step = now => {
        if (
          token !==
          yAxisTickAnimation.token
        ) {
          return;
        }

        const progress =
          clamp(
            (
              now - startedAt
            ) /
              duration,
            0,
            1
          );

        const eased =
          easeOutQuart(progress);

        yAxisTickAnimation.values =
          targetValues.map(
            (target, index) =>
              startValues[index] +
              (
                target -
                startValues[index]
              ) *
              eased
          );

        trendChart?.draw();

        if (progress < 1) {
          yAxisTickAnimation.raf =
            requestAnimationFrame(step);
        } else {
          yAxisTickAnimation.raf =
            null;
        }
      };

      yAxisTickAnimation.raf =
        requestAnimationFrame(step);
    }

    function animateYAxisTitle(
      nextTitle,
      duration = 360
    ) {
      if (
        yAxisTitleAnimation.to ===
        nextTitle
      ) {
        return;
      }

      if (yAxisTitleAnimation.raf) {
        cancelAnimationFrame(
          yAxisTitleAnimation.raf
        );
      }

      yAxisTitleAnimation.from =
        yAxisTitleAnimation.to;

      yAxisTitleAnimation.to =
        nextTitle;

      yAxisTitleAnimation.progress = 0;

      const token =
        ++yAxisTitleAnimation.token;

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        yAxisTitleAnimation.progress = 1;
        trendChart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      const step = now => {
        if (
          token !==
          yAxisTitleAnimation.token
        ) {
          return;
        }

        yAxisTitleAnimation.progress =
          clamp(
            (
              now - startedAt
            ) /
              duration,
            0,
            1
          );

        trendChart?.draw();

        if (
          yAxisTitleAnimation.progress < 1
        ) {
          yAxisTitleAnimation.raf =
            requestAnimationFrame(step);
        } else {
          yAxisTitleAnimation.raf =
            null;
        }
      };

      yAxisTitleAnimation.raf =
        requestAnimationFrame(step);
    }

    function formatTrendAxisValue(
      value,
      config
    ) {
      if (!Number.isFinite(value)) {
        return '';
      }

      if (config.suffix === '%') {
        return `${Math.round(value)}%`;
      }

      return Math.round(value)
        .toLocaleString('en-AU');
    }

    function drawYAxisTitle(
      context,
      chartArea
    ) {
      const mobile =
        window.innerWidth <= 430;

      const progress =
        clamp(
          yAxisTitleAnimation.progress,
          0,
          1
        );

      const outgoingOpacity =
        clamp(
          1 - progress * 2.2,
          0,
          1
        );

      const incomingOpacity =
        clamp(
          (
            progress - 0.32
          ) /
            0.68,
          0,
          1
        );

      const x =
        chartArea.left -
        (
          mobile
            ? 48
            : 54
        );

      const y =
        chartArea.top +
        chartArea.height / 2;

      const draw = (
        text,
        opacity
      ) => {
        if (
          !text ||
          opacity <= 0
        ) {
          return;
        }

        context.save();
        context.globalAlpha =
          opacity;
        context.translate(x, y);
        context.rotate(
          -Math.PI / 2
        );
        context.fillStyle =
          '#151515';
        context.textAlign =
          'center';
        context.textBaseline =
          'middle';
        context.font =
          `700 ${mobile ? 12 : 13}px Lato, sans-serif`;
        context.fillText(
          text,
          0,
          0
        );
        context.restore();
      };

      if (
        yAxisTitleAnimation.from ===
          yAxisTitleAnimation.to ||
        progress >= 1
      ) {
        draw(
          yAxisTitleAnimation.to,
          1
        );
        return;
      }

      draw(
        yAxisTitleAnimation.from,
        outgoingOpacity
      );

      draw(
        yAxisTitleAnimation.to,
        incomingOpacity
      );
    }

    const trendAxesPlugin = {
      id: 'pffLocationTrendAxes',

      beforeDatasetsDraw(chartInstance) {

          'rgba(105, 113, 138, 0.035)';

        for (
          let index = 0;

        }

        ctx.strokeStyle =
          'rgba(105, 113, 138, 0.075)';
        ctx.lineWidth = 1;

        for (
          let index = 0;
          index <= majorIntervals;
          index += 1
        ) {
          const ratio =
            index /

        for (

          index <= majorIntervals;
          index += 1
        ) {
          const ratio =
            index /
            majorIntervals;

          const y =
            chartArea.bottom -
            chartArea.height * ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5

        ctx.strokeStyle = '#69718a';
        ctx.globalAlpha = 0.60;
        ctx.lineWidth = 0.8;

        for (
          let index = 0;
          index < majorIntervals;
          index += 1
        ) {
          const ratio =
            (
              index + 0.5

            chartArea.bottom -
            chartArea.height * ratio;

          ctx.beginPath();
          ctx.moveTo(

          ctx.lineTo(

              ctx.strokeStyle =

                  : 0.7;

              ctx.beginPath();
              ctx.moveTo(
                Math.round(x) + 0.5,
                chartArea.bottom
              );
              ctx.lineTo(
                Math.round(x) + 0.5,
                chartArea.bottom +

                      ? 5

                  )

        ctx.globalAlpha = 1;

        if (xScale) {

    // ============================================================

    // ============================================================

    function growthTickTargets(config) {
      const count =
        Math.round(
          (
            config.max -
            config.min
          ) /
            config.majorStep
        );

      return Array.from(
        { length: count + 1 },
        (_, index) =>
          config.min +
          config.majorStep * index
      );
    }

    function animateGrowthAxisValues(
      targets,
      duration = 420
    ) {
      const targetValues =
        [...targets];

      if (growthAxisAnimation.raf) {
        cancelAnimationFrame(
          growthAxisAnimation.raf
        );
      }

      const token =
        ++growthAxisAnimation.token;

      const startValues =
        growthAxisAnimation.values.length ===
          targetValues.length
          ? [...growthAxisAnimation.values]
          : [...targetValues];

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        growthAxisAnimation.values =
          targetValues;
        growthChart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      const step = now => {
        if (
          token !==
          growthAxisAnimation.token
        ) {
          return;
        }

        const progress =
          clamp(
            (
              now - startedAt
            ) /
              duration,
            0,
            1
          );

        const eased =
          easeOutQuart(progress);

        growthAxisAnimation.values =
          targetValues.map(
            (target, index) =>
              startValues[index] +
              (
                target -
                startValues[index]
              ) *
              eased
          );

        growthChart?.draw();

        if (progress < 1) {
          growthAxisAnimation.raf =
            requestAnimationFrame(step);
        } else {
          growthAxisAnimation.raf =
            null;
        }
      };

      growthAxisAnimation.raf =
        requestAnimationFrame(step);
    }

    const growthAxesPlugin = {

      beforeDatasetsDraw(chartInstance) {

          ctx.lineWidth = 1;

          );
          ctx.lineTo(

          );

          if (index < majorIntervals) {

            ctx.strokeStyle =
              'rgba(105, 113, 138, 0.035)';

            ctx.beginPath();

      afterDraw(chartInstance) {

        const {
          ctx,

        ctx.save();
        ctx.fillStyle = '#151515';
        ctx.strokeStyle = '#151515';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font =
          `${mobile ? 9 : 10}px Lato, sans-serif`;

        for (
          let index = 0;
          index <= majorIntervals;
          index += 1
        ) {
          const ratio =
            index /
            majorIntervals;

          const x =
            chartArea.left +
            chartArea.width * ratio;

          ctx.beginPath();
          ctx.moveTo(
            Math.round(x) + 0.5,
            chartArea.bottom
          );
          ctx.lineTo(
            Math.round(x) + 0.5,
            chartArea.bottom + 5
          );
          ctx.stroke();

          ctx.fillText(
            Number(values[index])
              .toFixed(0),
            x,
            chartArea.bottom + 8
          );

          if (index < majorIntervals) {
            const minorX =

              ) /

            ctx.strokeStyle = '#69718a';

    const growthBarValueLabelsPlugin = {
      id: 'pffLocationGrowthBarValueLabels',

      afterDatasetsDraw(chartInstance) {
        if (
          chartInstance.canvas?.id !==
          'growthChart'
        ) {
          return;
        }

        const {
          ctx,
          chartArea,
          scales
        } = chartInstance;

        const meta =
          chartInstance.getDatasetMeta(0);

        const targetValues =
          chartInstance.data.datasets[0].data;

        const colours =
          chartInstance.data.datasets[0].backgroundColor;

        const xScale =
          scales?.x;

        if (
          !chartArea ||
          !meta?.data ||
          !xScale
        ) {
          return;
        }

        ctx.save();
        ctx.font =
          `${window.innerWidth <= 430 ? 8.8 : 9.8}px Lato, sans-serif`;
        ctx.textBaseline = 'middle';

        meta.data.forEach(
          (bar, index) => {
            const target =
              Number(
                targetValues[index]
              );

            if (!Number.isFinite(target)) {
              return;
            }

            /*
             * Convert the CURRENT animated bar end back to a data
             * value so the adjacent number counts smoothly while
             * the bar itself animates.
             */
            let currentValue =
              xScale.getValueForPixel(
                bar.x
              );

            if (!Number.isFinite(currentValue)) {
              currentValue = target;
            }

            if (
              Math.abs(currentValue) <
              0.000001
            ) {
              currentValue = 0;
            }

            const text =
              `${currentValue.toFixed(1)}%`;

            const textWidth =
              ctx.measureText(text).width;

            let x =
              bar.x + 6;

            let align =
              'left';

            if (
              x + textWidth >
              chartArea.right - 1
            ) {
              x =
                chartArea.right - 1;
              align = 'right';
            }

            ctx.fillStyle =
              Array.isArray(colours)
                ? colours[index]
                : colours;

            ctx.textAlign = align;
            ctx.fillText(
              text,
              x,
              bar.y
            );
          }
        );

        ctx.restore();
      }
    };

    Chart.register(
      trendAxesPlugin,
      growthAxesPlugin,
      growthBarValueLabelsPlugin
    );

    // ============================================================
    // DATASETS
    // ============================================================

    function trendDatasets() {
      const rows =
        trendRows();

      const labels =
        groupLabels();

      const colours =
        groupColours();

      const hidden =
        hiddenSeriesSet();

      const firstValues =
        rows.map(
          row =>
            row.values[0]
        );

      return Array.from(
        { length: SERIES_SLOT_COUNT },
        (_, slotIndex) => {
          const active =
            slotIndex < labels.length;

          const label =
            active
              ? labels[slotIndex]
              : `slot-${slotIndex}`;

          const colour =
            active
              ? colours[slotIndex]
              : '#151515';

          const values =
            active
              ? rows.map(
                  row =>
                    row.values[slotIndex]
                )
              : [...firstValues];

          const visible =
            active &&
            !hidden.has(label);

          return {
            label,
            data: values,
            _activeSeries: active,
            _seriesLabel: label,
            borderColor:
              visible
                ? colour
                : rgba(colour, 0),
            backgroundColor:
              visible
                ? colour
                : rgba(colour, 0),
            pointBackgroundColor:
              visible
                ? colour
                : rgba(colour, 0),
            pointBorderColor:
              visible
                ? colour
                : rgba(colour, 0),
            borderWidth: 3,
            pointRadius: 0,
            pointHoverRadius:
              visible
                ? 4
                : 0,
            pointHitRadius:
              visible
                ? 10
                : 0,
            pointBorderWidth: 0,
            tension: 0.28,
            cubicInterpolationMode:
              'monotone',
            spanGaps: true,
            fill: false
          };
        }
      );
    }

    function syncTrendDatasets() {
      const next =
        trendDatasets();

      if (!trendChart) {
        return;
      }

      next.forEach(
        (dataset, index) => {
          const current =
            trendChart.data.datasets[index];

          if (!current) {
            trendChart.data.datasets[index] =
              dataset;
            return;
          }

          Object.assign(
            current,
            dataset
          );
        }
      );
    }

        return `${dataset._seriesLabel}: ${value.toFixed(1)}%`;

      return `${dataset._seriesLabel}: ${Math.round(value).toLocaleString('en-AU')}`;

    function renderTrendChart(reason) {
      const config =
        currentTrendConfig();

      const previous =
        lastTrendConfig || config;

      if (!trendChart) {
        createTrendChart();
        return;
      }

      trendChart.data.labels =
        trendRows().map(
          row => row.year
        );

      syncTrendDatasets();

      trendChart.options.scales.y.min =
        config.min;

      trendChart.options.scales.y.max =
        config.max;

      const duration =
        reducedMotion()
          ? 0
          : reason === 'tab'
            ? 820
            : reason === 'legend'
              ? 260
              : 720;

      trendChart.options.animation.duration =
        duration;

      trendChart.options.animations.y.duration =
        duration;

      trendChart.options.animations.colors.duration =
        reason === 'legend'
          ? 260
          : Math.min(
              520,
              duration
            );

      trendChart.update();

      const previousTargets =
        trendTickTargets(previous);

      if (
        yAxisTickAnimation.values.length !==
        previousTargets.length
      ) {
        yAxisTickAnimation.values =
          previousTargets;
      }

      const nextTargets =
        trendTickTargets(config);

      const scaleChanged =
        previous.min !== config.min ||
        previous.max !== config.max ||
        previous.majorStep !== config.majorStep;

      if (scaleChanged) {
        animateTrendTickValues(
          nextTargets,
          420
        );
      } else {
        yAxisTickAnimation.values =
          nextTargets;
      }

      if (
        previous.yTitle !==
        config.yTitle
      ) {
        animateYAxisTitle(
          config.yTitle,
          360
        );
      }

      lastTrendConfig =
        config;
    }

    function growthData() {
      const labels =
        groupLabels();

      const colours =
        groupColours();

      const hidden =
        hiddenSeriesSet();

      const values =
        latestAnnualisedGrowth(
          groupRows()
        );

      return {
        labels,
        values:
          values.map(
            (value, index) =>
              hidden.has(labels[index])
                ? NaN
                : value
          ),
        colours,
        backgroundColours:
          colours.map(
            (colour, index) =>
              hidden.has(labels[index])
                ? rgba(colour, 0)
                : colour
          )
      };
    }

                    : 720,
                easing: 'easeOutQuart'
              },

              animations: {
                x: {
                  duration:
                    reducedMotion()
                      ? 0
                      : 720,
                  easing: 'easeOutQuart'
                },
                colors: {
                  duration:
                    reducedMotion()
                      ? 0
                      : 420,
                  easing: 'easeOutQuart'
                }
              },

              interaction: {
                mode: 'nearest',
                axis: 'y',
                intersect: true
              },

              layout: {
                autoPadding: false,
                padding: {
                  top: 5,
                  right: 5,
                  bottom: 39,
                  left:
                    window.innerWidth <= 430
                      ? 54
                      : 61
                }
              },

              plugins: {
                legend: {
                  display: false
                },

                tooltip: {
                  displayColors: true,
                  backgroundColor:
                    'rgba(21, 21, 21, 0.94)',
                  titleColor: '#ffffff',
                  bodyColor: '#ffffff',
                  borderColor:
                    'rgba(255,255,255,0.10)',
                  borderWidth: 1,
                  padding: 9,
                  cornerRadius: 4,
                  titleFont: {
                    family: 'Lato',
                    size: 11,
                    weight: '700'
                  },
                  bodyFont: {
                    family: 'Lato',
                    size: 11,
                    weight: '400'
                  },
                  callbacks: {
                    title(items) {
                      return items?.[0]?.label || '';
                    },
                    label(context) {
                      const value =
                        Number(context.raw);

                      return `Annualised change: ${value.toFixed(1)}% p.a. (latest 3 years)`;
                    }
                  }
                }
              },

              scales: {
                x: {
                  min: config.min,
                  max: config.max,
                  display: false,
                  grid: {
                    display: false,
                    drawTicks: false
                  },
                  border: {
                    display: false
                  },
                  ticks: {
                    display: false
                  },
                  title: {
                    display: false
                  }
                },

                y: {
                  display: false,
                  grid: {
                    display: false,
                    drawTicks: false
                  },
                  border: {
                    display: false
                  },
                  ticks: {
                    display: false
                  }
                }
              }
            }
          }
        );
    }

    function renderGrowthChart(reason) {
      const config =
        currentGrowthConfig();

      const growth =
        growthData();

      if (!growthChart) {
        createGrowthChart();
        return;
      }

      growthChart.data.labels =
        growth.labels;

      growthChart.data.datasets[0].data =
        growth.values;

      growthChart.data.datasets[0].backgroundColor =
        growth.backgroundColours;

      growthChart.options.scales.x.min =
        config.min;

      growthChart.options.scales.x.max =
        config.max;

      const duration =
        reducedMotion()
          ? 0
          : reason === 'tab'
            ? 620
            : reason === 'legend'
              ? 260
              : 520;

      growthChart.options.animation.duration =
        duration;

      growthChart.options.animations.x.duration =
        duration;

      growthChart.update();

      animateGrowthAxisValues(
        growthTickTargets(config),
        reason === 'tab'
          ? 420
          : 320
      );
    }

    // ============================================================
    // VIEW SWITCHING
    // ============================================================

    function showTrendCanvas() {
      trendCanvas.classList.remove(
        'is-inactive'
      );

      growthCanvas.classList.add(
        'is-inactive'
      );
    }

    function showGrowthCanvas() {
      growthCanvas.classList.remove(
        'is-inactive'
      );

      trendCanvas.classList.add(
        'is-inactive'
      );
    }

    function renderCurrentChart(reason) {
      if (activeMetric === 'growth') {
        renderGrowthChart(reason);
        showGrowthCanvas();
      } else {
        renderTrendChart(reason);
        showTrendCanvas();
      }
    }

    function setGroup(nextGroup) {
      if (
        nextGroup === activeGroup
      ) {
        return;
      }

      const previousGroup =
        activeGroup;

      activeGroup =
        nextGroup;

      updateTabs();
      updateHeading();
      updateLegend(
        previousGroup,
        activeGroup
      );

      renderCurrentChart('tab');
    }

    function setMetric(nextMetric) {
      if (
        nextMetric === activeMetric
      ) {
        return;
      }

      activeMetric =
        nextMetric;

      updateMetricSwitch();
      updateHeading();
      renderCurrentChart('option');
    }

    // ============================================================
    // EVENTS
    // ============================================================

    chartTabs.forEach(tab => {
      tab.addEventListener(
        'click',
        () => {
          setGroup(
            tab.dataset.group
          );
        }
      );
    });

    metricButtons.forEach(button => {
      button.addEventListener(
        'click',
        () => {
          setMetric(
            button.dataset.metric
          );
        }
      );
    });

    legendScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            -Math.max(
              110,
              chartLegend.clientWidth *
              0.72
            ),
          behavior: 'smooth'
        });
      }
    );

    legendScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            Math.max(
              110,
              chartLegend.clientWidth *
              0.72
            ),
          behavior: 'smooth'
        });
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive: true
      }
    );

    [
      trendCanvas,
      growthCanvas
    ].forEach(canvas => {
      canvas.addEventListener(
        'contextmenu',
        event => {
          event.preventDefault();
        }
      );

      canvas.addEventListener(
        'selectstart',
        event => {
          event.preventDefault();
        }
      );
    });

    document.addEventListener(
      'pointerdown',
      event => {
        if (
          !event.target.closest(
            '#chartShell'
          )
        ) {
          [
            trendChart,
            growthChart
          ].forEach(instance => {
            if (!instance) {
              return;
            }

            instance.tooltip.setActiveElements(
              [],
              {
                x: 0,
                y: 0
              }
            );

            instance.update('none');
          });
        }
      }
    );

    function refreshResponsiveLayout() {
      if (
        responsiveFrame !== null
      ) {
        cancelAnimationFrame(
          responsiveFrame
        );
      }

      responsiveFrame =
        requestAnimationFrame(() => {
          responsiveFrame = null;

          trendChart?.resize();
          growthChart?.resize();
          positionTabIndicator(false);
          updateLegendScrollControls();
        });
    }

    if ('ResizeObserver' in window) {
      const observer =
        new ResizeObserver(entries => {
          const usable =
            entries.some(
              entry =>
                entry.contentRect.width > 1 &&
                entry.contentRect.height > 1
            );

          if (usable) {
            refreshResponsiveLayout();
          }
        });

      observer.observe(app);
      observer.observe(chartShell);
    }

    window.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive: true
      }
    );

    window.visualViewport?.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive: true
      }
    );

    // ============================================================
    // INITIALISE
    // ============================================================

    async function initialise() {
      try {
        sourceData =
          await loadData();

        statusElement.textContent = '';

        updateMetricSwitch();
        updateHeading();
        updateTabs();
        renderLegendItems();
        createTrendChart();
        showTrendCanvas();

        hideLoadingState();

        requestAnimationFrame(() => {
          positionTabIndicator(false);
          updateLegendScrollControls();
          refreshResponsiveLayout();
        });
      } catch (error) {
        statusElement.textContent =
          'Unable to display workforce location data.';

        sourceData = {
          state:
            EMBEDDED_FALLBACK.state.map(
              row => ({
                year: row.year,
                values: [...row.values]
              })
            ),
          rurality:
            EMBEDDED_FALLBACK.rurality.map(
              row => ({
                year: row.year,
                values: [...row.values]
              })
            )
        };

        setDataSource('cached');
        updateMetricSwitch();
        updateHeading();
        updateTabs();
        renderLegendItems();
        createTrendChart();
        showTrendCanvas();
        hideLoadingState();
      }
    }

    initialise();
  </script>
</body>
</html>
