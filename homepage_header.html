<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --purple-soft: #f4efff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      overflow: hidden;
    }

    #fit {
      width: 100%;
      height: auto;
      overflow: hidden;
    }

    #app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 4px 0;
    }

    /* ---------- Live contribution count ---------- */

    .response-summary {
      width: 100%;
      padding: 0;
    }

    .response-label {
      color: var(--muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      margin-top: 4px;
    }

    .response-value {
      color: var(--ink);
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 400;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .response-value.is-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      min-height: 31px;
      margin-top: 2px;
    }

    .gradient-line {
      width: 100%;
      height: 1px;
      margin-top: 10px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.14) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.14) 76%,
        #fff 100%
      );
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;

      /*
       * Keep source completely hidden until
       * the first data load has finished.
       */
      visibility: hidden;
      opacity: 0;
    }

    .live-data.is-visible {
      visibility: visible;
      opacity: 1;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    .live-data.is-unavailable .live-data-dot {
      background: var(--muted);
    }

    /* ---------- Contribution buttons ---------- */

    .actions {
      display: grid;
      gap: 12px;
      width: 100%;
      margin-top: 24px;
    }

    .contribute-button {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 38px;
      padding: 0 12px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.2;
      text-align: left;
      text-decoration: none;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .contribute-button:hover,
    .contribute-button:focus-visible {
      color: #fff;
      background: var(--ink);
      outline: none;
    }

    .button-icon {
      color: var(--purple);
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      text-align: center;
      transition: color 120ms ease;
    }

    .button-label {
      min-width: 0;
    }

    .contribute-button:hover .button-icon,
    .contribute-button:focus-visible .button-icon {
      color: #fff;
    }

    .anonymous-note {
      max-width: 430px;
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .error {
      color: var(--muted);
      font-size: 18px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 10px 2px 0;
      }

      .response-value {
        font-size: 36px;
      }

      .contribute-button {
        min-height: 38px;
        font-size: 14px;
      }

      .anonymous-note {
        font-size: 13px;
      }

         .response-value.is-loading {
        min-width: 76px;
        min-height: 50px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app">
      <section class="response-summary" aria-live="polite">
        <div class="response-label">
          ♡ Data contributions and counting...
        </div>

        <div class="response-value-row">
          <div
            id="contribution-count"
            class="response-value is-loading"
            role="status"
            aria-label="Counting contributions"
          >1</div>

          <div
            id="data-source-indicator"
            class="live-data"
            aria-label="Live data"
          >
            <span class="live-data-dot" aria-hidden="true"></span>
            <span id="data-source-text">LIVE data</span>
          </div>
        </div>

        <div class="gradient-line" aria-hidden="true"></div>
      </section>

      <nav class="actions" aria-label="Contribution options">
        <a
          class="contribute-button"
          href="https://www.phoropterfreefridays.org/Income"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="button-icon" aria-hidden="true">$</span>
          <span class="button-label">Contribute income data</span>
        </a>

        <a
          class="contribute-button"
          href="https://www.phoropterfreefridays.org/WorkplacePromoterScore"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="button-icon" aria-hidden="true">☆</span>
          <span class="button-label">Workplace Promoter Score</span>
        </a>
      </nav>

      <p class="anonymous-note">Your data is anonymous</p>
    </main>
  </div>

  <script>
    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbx4E4fZUhs1RDLFfsMAhJCSHQIWHcNg-PjZOSif93hKSOq6o0gv1OD8wcLjsa3ssy4mDQ/exec';

    const CACHE_APP_KEY =
      'pff-contribution-count';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    const LOCAL_CACHE_KEY =
      'pff-contribution-count-v1';

    /*
     * Duration of the number count-up animation.
     */
    const COUNT_UP_DURATION_MS =
      1400;

    /*
     * Set true to skip the live Apps Script calculation
     * and test the stored Apps Script cache.
     */
    const FORCE_CACHED_DATA =
      false;

    const contributionCount =
      document.getElementById(
        'contribution-count'
      );

    const dataSourceIndicator =
      document.getElementById(
        'data-source-indicator'
      );

    const dataSourceText =
      document.getElementById(
        'data-source-text'
      );

    let hasLoadedCount =
      false;

    let displayedCount =
      null;

    let countAnimationFrame =
      null;

    let randomCountTimer =
      null;

    const RANDOM_COUNT_INTERVAL_MS =
      85;

    function startRandomCount() {
      if (
        randomCountTimer !==
        null
      ) {
        return;
      }

      const updateRandomCount =
        () => {
          contributionCount.textContent =
            String(
              Math.floor(
                Math.random() *
                999
              ) +
              1
            );
        };

      updateRandomCount();

      randomCountTimer =
        window.setInterval(
          updateRandomCount,
          RANDOM_COUNT_INTERVAL_MS
        );
    }

    function stopRandomCount() {
      if (
        randomCountTimer ===
        null
      ) {
        return;
      }

      window.clearInterval(
        randomCountTimer
      );

      randomCountTimer =
        null;
    }

    function setDataSource(
      source
    ) {
      dataSourceIndicator.classList.toggle(
        'is-cached',
        source === 'cached'
      );

      dataSourceIndicator.classList.toggle(
        'is-unavailable',
        source === 'unavailable'
      );

      if (
        source === 'cached'
      ) {
        dataSourceText.textContent =
          'CACHED data';

        dataSourceIndicator.setAttribute(
          'aria-label',
          'Cached data'
        );
      } else if (
        source === 'unavailable'
      ) {
        dataSourceText.textContent =
          'DATA unavailable';

        dataSourceIndicator.setAttribute(
          'aria-label',
          'Data unavailable'
        );
      } else {
        dataSourceText.textContent =
          'LIVE data';

        dataSourceIndicator.setAttribute(
          'aria-label',
          'Live data'
        );
      }

      /*
       * Do not reveal LIVE / CACHED / unavailable
       * until a load has actually finished.
       */
      dataSourceIndicator.classList.add(
        'is-visible'
      );
    }

    function showContributionCount(
      value,
      isError = false
    ) {
      stopRandomCount();

      if (
        countAnimationFrame
      ) {
        cancelAnimationFrame(
          countAnimationFrame
        );

        countAnimationFrame =
          null;
      }

      contributionCount.classList.remove(
        'is-loading'
      );

      contributionCount.textContent =
        value ||
        '—';

      contributionCount.classList.toggle(
        'error',
        isError
      );
    }

    function animateContributionCount(
      value
    ) {
      stopRandomCount();

      const numericValue =
        Number(
          String(
            value ?? ''
          ).replace(
            /,/g,
            ''
          )
        );

      /*
       * If the returned value is not a normal
       * non-negative number, just display it.
       */
      if (
        !Number.isFinite(
          numericValue
        ) ||
        numericValue < 0
      ) {
        showContributionCount(
          value
        );

        displayedCount =
          null;

        hasLoadedCount =
          true;

        return;
      }

      const target =
        Math.round(
          numericValue
        );

      /*
       * First load:
       * count upward from 1.
       *
       * Later refreshes:
       * animate from the currently displayed count
       * if the value has changed.
       */
      let startValue;

      if (
        !hasLoadedCount ||
        displayedCount === null
      ) {
        startValue =
          0;
      } else {
        startValue =
          displayedCount;
      }

      if (
        countAnimationFrame
      ) {
        cancelAnimationFrame(
          countAnimationFrame
        );

        countAnimationFrame =
          null;
      }

      contributionCount.classList.remove(
        'is-loading'
      );

      contributionCount.classList.remove(
        'error'
      );

      /*
       * No animation is needed if a refresh returns
       * exactly the same count.
       */
      if (
        startValue === target
      ) {
        contributionCount.textContent =
          target.toLocaleString(
            'en-AU'
          );

        displayedCount =
          target;

        hasLoadedCount =
          true;

        return;
      }

      const startTime =
        performance.now();

      function drawCount(
        now
      ) {
        const elapsed =
          now -
          startTime;

        const progress =
          Math.min(
            elapsed /
              COUNT_UP_DURATION_MS,
            1
          );

        /*
         * Ease-out animation:
         * fast at first, then gently settles
         * onto the final number.
         */
        const eased =
          1 -
          Math.pow(
            1 - progress,
            3
          );

        let current =
          Math.round(
            startValue +
            (
              target -
              startValue
            ) *
            eased
          );

        /*
         * On the initial upward count, make the
         * first visible number 1 rather than 0.
         */
        if (
          !hasLoadedCount &&
          target > 0
        ) {
          current =
            Math.max(
              1,
              current
            );
        }

        contributionCount.textContent =
          current.toLocaleString(
            'en-AU'
          );

        if (
          progress < 1
        ) {
          countAnimationFrame =
            requestAnimationFrame(
              drawCount
            );

          return;
        }

        contributionCount.textContent =
          target.toLocaleString(
            'en-AU'
          );

        displayedCount =
          target;

        hasLoadedCount =
          true;

        countAnimationFrame =
          null;
      }

      countAnimationFrame =
        requestAnimationFrame(
          drawCount
        );
    }

    function saveLocalCachedCount(
      value
    ) {
      try {
        localStorage.setItem(
          LOCAL_CACHE_KEY,
          String(
            value ??
            ''
          )
        );
      } catch (
        error
      ) {
      }
    }

    function loadLocalCachedCount() {
      try {
        const value =
          localStorage.getItem(
            LOCAL_CACHE_KEY
          );

        return String(
          value ??
          ''
        ).trim() ||
          null;
      } catch (
        error
      ) {
        return null;
      }
    }

    function loadLiveContributionCount() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffContributionLive_${
              Date.now()
            }_${
              Math.floor(
                Math.random() *
                100000
              )
            }`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Live contribution count timed out'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }

          function finish(
            error,
            value
          ) {
            if (settled) {
              return;
            }

            settled =
              true;

            cleanup();

            error
              ? reject(
                  error
                )
              : resolve(
                  value
                );
          }

          window[callbackName] =
            snapshot => {
              if (
                !snapshot ||
                snapshot.ok !== true ||
                snapshot.appKey !==
                  CACHE_APP_KEY
              ) {
                finish(
                  new Error(
                    snapshot?.error ||
                    'Live contribution count is unavailable'
                  )
                );

                return;
              }

              const value =
                String(
                  snapshot?.data
                    ?.contributionCount ??
                  ''
                ).trim();

              if (!value) {
                finish(
                  new Error(
                    'Live contribution count is empty'
                  )
                );

                return;
              }

              finish(
                null,
                value
              );
            };

          script.onerror =
            () => {
              finish(
                new Error(
                  'Network error loading live contribution count'
                )
              );
            };

          const params =
            new URLSearchParams({
              action:
                'liveContributionCount',

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `${
              CACHE_WEB_APP_URL
            }?${
              params.toString()
            }`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function loadCachedContributionCount() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffContributionCache_${
              Date.now()
            }_${
              Math.floor(
                Math.random() *
                100000
              )
            }`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Cached contribution count timed out'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }

          function finish(
            error,
            value
          ) {
            if (settled) {
              return;
            }

            settled =
              true;

            cleanup();

            error
              ? reject(
                  error
                )
              : resolve(
                  value
                );
          }

          window[callbackName] =
            snapshot => {
              if (
                !snapshot ||
                snapshot.ok !== true ||
                snapshot.appKey !==
                  CACHE_APP_KEY
              ) {
                finish(
                  new Error(
                    snapshot?.error ||
                    'Cached contribution count is unavailable'
                  )
                );

                return;
              }

              const value =
                String(
                  snapshot?.data
                    ?.contributionCount ??
                  ''
                ).trim();

              if (!value) {
                finish(
                  new Error(
                    'Cached contribution count is empty'
                  )
                );

                return;
              }

              finish(
                null,
                value
              );
            };

          script.onerror =
            () => {
              finish(
                new Error(
                  'Network error loading cached contribution count'
                )
              );
            };

          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `${
              CACHE_WEB_APP_URL
            }?${
              params.toString()
            }`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    async function loadContributionCount() {
      let liveError =
        null;

      if (
        !FORCE_CACHED_DATA
      ) {
        try {
          const liveValue =
            await loadLiveContributionCount();

          saveLocalCachedCount(
            liveValue
          );

          animateContributionCount(
            liveValue
          );

          setDataSource(
            'live'
          );

          return;
        } catch (
          error
        ) {
          liveError =
            error;
        }
      }

      try {
        const cachedValue =
          await loadCachedContributionCount();

        saveLocalCachedCount(
          cachedValue
        );

        animateContributionCount(
          cachedValue
        );

        setDataSource(
          'cached'
        );

        return;
      } catch (
        cacheError
      ) {
        console.error(
          'Live contribution count load failed',
          liveError
        );

        console.error(
          'Cached contribution count load failed',
          cacheError
        );
      }

      const localValue =
        loadLocalCachedCount();

      if (localValue) {
        animateContributionCount(
          localValue
        );

        setDataSource(
          'cached'
        );

        return;
      }

      showContributionCount(
        '—',
        true
      );

      hasLoadedCount =
        true;

      displayedCount =
        null;

      setDataSource(
        'unavailable'
      );
    }

    startRandomCount();
    loadContributionCount();
  </script>
</body>
</html>
