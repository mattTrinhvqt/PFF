<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Work Loss</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js?v=1.2.2-20260912"></script>

  <style>
    :root {
      --work-meal: #f28e2b;
      --work-tea: #2ca58d;
      --work-outside: #5a3be7;
    }

    .chart-heading-row {
      gap: 8px;
    }

    .heading-scroll-shell {
      height: 30px;
    }

    .heading-scroll-viewport {
      height: 100%;
    }

    .chart-heading {
      gap: 0.28em;
    }

    .chart-heading-part {
      display: inline-block;
      flex: 0 0 auto;
    }

    .chart-heading-part:empty {
      display: none;
    }

    .view-control {
      position: relative;
      z-index: 48;
      flex: 0 0 auto;
    }

    .view-control.is-hidden {
      display: none;
    }

    /*
     * Compact fixed-width View control. The width remains constant when the
     * selected option changes, while avoiding unnecessary horizontal space.
     * The opened menu follows the PFF Job Ads control styling.
     */
    .view-menu-button {
      display: grid;
      width: 90px;
      min-width: 90px;
      min-height: 31px;
      grid-template-columns: max-content 44px 8px;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 0 4px;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      box-shadow: none;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .view-menu-button:hover,
    .view-menu-button[aria-expanded='true'] {
      border-color: var(--pff-ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .view-menu-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .view-menu-button::after {
      width: 0;
      height: 0;
      min-width: 0;
      flex: 0 0 auto;
      border-top: 4px solid var(--pff-muted);
      border-right: 4px solid transparent;
      border-bottom: 0;
      border-left: 4px solid transparent;
      transform: none;
      transition: transform 140ms ease;
    }

    .view-control.is-open .view-menu-button::after,
    .view-menu-button[aria-expanded='true']::after {
      transform: rotate(180deg);
    }

    .view-menu-prefix,
    .pff-chart-toggle-label {
      font-size: 10px;
    }

    .view-menu-prefix {
      color: var(--pff-ink);
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
    }

    .view-menu-value {
      display: inline-block;
      width: 44px;
      min-width: 44px;
      margin-left: 0;
      color: var(--pff-purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
      will-change: opacity;
    }

    .view-control .pff-menu-panel {
      right: 0;
      left: auto;
      min-width: 180px;
      padding: 5px 0;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
      text-align: left;
    }

    .view-menu-title {
      margin: 0;
      padding: 6px 10px 7px;
      color: var(--pff-muted);
      background: var(--pff-white);
      border-bottom: 1px solid var(--pff-track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .view-control .pff-menu-item {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 32px;
      align-items: center;
      padding: 5px 10px 5px 33px;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 0;
      border-radius: 0;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      text-align: left;
      cursor: pointer;
      user-select: none;
    }

    .view-control .pff-menu-item::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 10px;
      width: 15px;
      height: 15px;
      border: 1px solid var(--pff-muted);
      border-radius: 2px;
      background: var(--pff-white);
      transform: translateY(-50%);
    }

    .view-control .pff-menu-item.is-selected::before,
    .view-control .pff-menu-item[aria-selected='true']::before {
      border-color: var(--pff-purple);
      background: var(--pff-purple);
    }

    .view-control .pff-menu-item.is-selected::after,
    .view-control .pff-menu-item[aria-selected='true']::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 15px;
      width: 4px;
      height: 7px;
      border-right: 2px solid var(--pff-white);
      border-bottom: 2px solid var(--pff-white);
      transform: translateY(-60%) rotate(45deg);
    }

    .view-control .pff-menu-item:hover,
    .view-control .pff-menu-item.is-selected,
    .view-control .pff-menu-item[aria-selected='true'] {
      color: var(--pff-ink);
      background: var(--pff-white);
    }

    .view-control .pff-menu-item:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /*
     * One shared pair of axis spines is drawn above the two chart canvases
     * while switching to/from By employer. Their geometry is interpolated
     * between the old and new chart areas, so the axes behave like the same
     * lines being repositioned rather than two separate axes sliding past
     * each other.
     */
    .family-axis-morph-layer {
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
    }

    .family-axis-morph-x,
    .family-axis-morph-y {
      position: absolute;
      display: block;
      background: var(--pff-ink);
      pointer-events: none;
      will-change: left, top, width, height;
    }

    .family-axis-morph-x {
      height: 1px;
    }

    .family-axis-morph-y {
      width: 1px;
    }

    .work-chart-canvas {
      opacity: 1;
      transform: none;
      transform-origin: 50% 50%;
      will-change: opacity;
    }

    #employerWorkChart {
      opacity: 0;
      transform: none;
      pointer-events: none;
    }

    @media (max-width: 430px) {
      .chart-heading-row,
      .heading-scroll-shell {
        min-height: 29px;
        height: 29px;
      }

      .view-menu-button {
        width: 84px;
        min-width: 84px;
        min-height: 27px;
        grid-template-columns: max-content 40px 8px;
        gap: 3px;
        padding-right: 3px;
        padding-left: 3px;
      }

      .view-menu-prefix,
      .pff-chart-toggle-label {
        font-size: 9px;
      }

      .view-menu-value {
        width: 40px;
        min-width: 40px;
        font-size: 9px;
      }

      .view-control .pff-menu-panel {
        min-width: 176px;
      }
    }
  </style>
</head>

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'pff-work-loss';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Testing switch only.
     * Leave false in normal use.
     * Set true temporarily to verify the cached-data fallback.
     */
    const FORCE_CACHED_DATA =
      false;

    const VIEW_CONFIG = {
      cost: {
        tabLabel: '$ loss',
        kind: 'currency',
        metric: 'cost',
        supportsTotal: true,
        supportsAffected: true,
        yTitle: '$ loss per optom (FTE $/year)',
        affectedYTitle: '$ loss per optom (FTE $/year)',
        totalYTitle: 'Total $ loss (FTE $/year)',

      },

      },
      time: {

        supportsAffected: true,
        yTitle: 'Time loss per optom (hours/year)',
        affectedYTitle: 'Time loss per optom (hours/year)',
        totalYTitle: 'Total time loss (hours/year)',
        affectedTotalYTitle: 'Total time loss (hours/year)'
      },
      affected: {
        tabLabel: '% affected',
        kind: 'percentage',
        metric: 'affected',
        supportsTotal: false,
        supportsAffected: false,
        yTitle: '% of optoms affected'
      }
    };

    const CATEGORY_CONFIG = [
      {
        key: 'meal',
        label: 'Work during meal break',
        legendLabel: 'Meal break',
        shortLabel: 'Meal break',
        colour: '#f28e2b',
        x: 0
      },
      {
        key: 'tea',
        label: 'Work during tea break',
        legendLabel: 'Tea break',
        shortLabel: 'Tea break',
        colour: '#2ca58d',
        x: 1
      },
      {
        key: 'outside',
        label: 'Work outside rostered hours',
        legendLabel: 'Outside rostered hours',
        shortLabel: 'Outside roster',
        colour: '#5a3be7',
        x: 2
      }
    ];

    const CATEGORY_BY_KEY = new Map(
      CATEGORY_CONFIG.map(category => [category.key, category])
    );

    const app = document.getElementById('app');
    const statusElement = document.getElementById('status');
    const dataSourceIndicator = document.getElementById('dataSourceIndicator');
    const dataSourceText = document.getElementById('dataSourceText');
    const headingViewport = document.getElementById('headingViewport');
    const headingScrollLeft = document.getElementById('headingScrollLeft');
    const headingScrollRight = document.getElementById('headingScrollRight');
    const chartHeading = document.getElementById('chartHeading');
    const chartHeadingLead = document.getElementById('chartHeadingLead');
    const chartHeadingShared = document.getElementById('chartHeadingShared');
    const chartHeadingTail = document.getElementById('chartHeadingTail');
    const chartHeadingYear = document.getElementById('chartHeadingYear');
    const chartToggleGroup = document.getElementById('chartToggleGroup');
    const viewControl = document.getElementById('viewControl');
    const viewMenuButton = document.getElementById('viewMenuButton');
    const viewMenuPanel = document.getElementById('viewMenuPanel');
    const viewMenuValue = document.getElementById('viewMenuValue');
    const viewMenuItems = [...document.querySelectorAll('.view-menu-item')];
    const totalToggleButton = document.getElementById('totalToggleButton');
    const tabList = document.getElementById('tabList');
    const tabScrollLeft = document.getElementById('tabScrollLeft');
    const tabScrollRight = document.getElementById('tabScrollRight');
    const chartTabs = [...document.querySelectorAll('.chart-tab')];
    const legendViewport = document.getElementById('legendViewport');
    const chartLegend = document.getElementById('chartLegend');
    const legendScrollLeft = document.getElementById('legendScrollLeft');
    const legendScrollRight = document.getElementById('legendScrollRight');
    const chartShell = document.querySelector('.chart-shell');
    const chartCanvas = document.getElementById('lossWorkChart');
    const employerCanvas = document.getElementById('employerWorkChart');

    let sourceRows = [];
    let rows = [];
    let chart = null;
    let employerChart = null;
    let employerModel = null;
    let activeView = 'cost';
    let analysisWindow = null;
    let interactionLocked = false;
    let viewSwitchLocked = false;
    let responsiveLayoutFrame = null;
    let viewUnlockTimer = null;
    let currentYAxisModel = null;
    let axisLabelOpacity = 1;
    let activeTooltipKey = '';
    let tooltipPinned = false;
    let displayedYAxisTitleParts = null;
    let headingAnimationToken = 0;
    let familySpineMorphActive = false;

    const axisLabelAnimator = PFFCharts.createAnimationController();
    const axisTitleAnimator = PFFCharts.createAnimationController();
    const axisNumberAnimator = PFFCharts.createAnimationController();
    const chartFamilyAnimator = PFFCharts.createAnimationController();
    const employerMeasureAnimator = PFFCharts.createAnimationController();
    const employerAxisTitleAnimator = PFFCharts.createAnimationController();

    let tabController = null;
    let headingScroller = null;
    let legendController = null;
    let viewMenuController = null;
    let viewMenuAnimationToken = 0;

    const employerReorderState = {
      active: false,
      progress: 1,
      fromYByKey: new Map()
    };

    const axisTitleTransition = {
      active: false,
      progress: 1,
      fromParts: null,
      toParts: null
    };

    const totalModeByView = {
      cost: false,
      time: false
    };

    const affectedOnlyByView = {
      cost: false,
      time: false
    };

    const viewModeByMetric = {
      cost: 'overall',
      time: 'overall'
    };

    const axisNumberTransition = {
      fromMaximum: 1,
      toMaximum: 1,
      progress: 1
    };

    const employerAxisState = {
      maximum: 1,
      majorStep: 1,
      minorStep: 0.5
    };

    const employerAxisTitleTransition = {
      active: false,
      progress: 1,
      fromText: '',
      toText: ''
    };

    let displayedEmployerAxisTitle = '';

    const cleanText = PFF.cleanText;
    const clamp = PFF.clamp;
    const toNumber = PFF.toNumber;
    const getCellValue = PFF.cellValue;
    const parsePercentCell = PFF.parsePercentCell;
    const parseDate = PFF.parseDateUtc;
    const percentile = PFFStats.percentile;
    const calculateStatistics = PFFStats.calculateStatistics;
    const formatNumber = PFF.formatNumber;
    const rgba = PFF.rgba;
    const easeOutCubic = PFFCharts.easeOutCubic;
    const easeInOutCubic = PFFCharts.easeInOutCubic;

    function formatCurrency(value, maximumFractionDigits = 0) {
      return PFF.formatCurrency(value, {
        minimumFractionDigits: 0,
        maximumFractionDigits
      });
    }

    function formatPercentage(value, maximumFractionDigits = 1) {
      return Number.isFinite(Number(value))
        ? `${formatNumber(value, maximumFractionDigits)}%`
        : '—';
    }

    function formatAxisNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return '';
      }

      return PFF.formatCompactNumber(number, {
        millionDecimals: 1,
        thousandDecimals: Math.abs(number) >= 10000 ? 0 : 1,
        decimals:
          Math.abs(number) < 10 &&
          Math.abs(number - Math.round(number)) > 0.001
            ? 1
            : 0,
        invalid: ''
      });
    }

    function resolveAnalysisWindow(allRows) {
      const current = PFF.getCurrentFinancialYearWindow({
        timeZone: 'Australia/Sydney'
      });

      return {
        window: current,
        rows: allRows.filter(row =>
          Number.isFinite(row.date) &&
          row.date >= current.start &&
          row.date < current.end
        )
      };
    }

    function animateAxisLabelOpacity(from, to, duration, onComplete) {
      axisLabelAnimator.run({
        duration,
        easing: easeOutCubic,
        onFrame(progress) {
          axisLabelOpacity = from + (to - from) * progress;
          chart?.draw();
        },
        onComplete() {
          axisLabelOpacity = to;
          chart?.draw();
          onComplete?.();
        }
      });
    }



    function sameTitleParts(firstParts, secondParts) {
      return ['lead', 'shared', 'tail', 'unit'].every(
        key => String(firstParts?.[key] || '') === String(secondParts?.[key] || '')
      );
    }

    function getYAxisTitleParts(view) {
      const total = isTotalMode(view);

      if (view === 'affected') {
        return {
          lead: '% of optoms affected',
          shared: '',
          tail: '',
          unit: ''
        };
      }

      const isTime = view === 'time';

      return {
        lead: total
          ? isTime
            ? 'Total time'
            : 'Total $'
          : isTime
            ? 'Time'
            : '$',
        shared: 'loss',
        tail: total
          ? ''
          : 'per optom',
        unit: isTime
          ? '(hours/year)'
          : '(FTE $/year)'
      };
    }

    function animateYAxisTitleParts(fromParts, toParts, duration = 660) {
      displayedYAxisTitleParts = toParts;

      if (
        PFF.reducedMotion() ||
        duration <= 0 ||
        sameTitleParts(fromParts, toParts)
      ) {
        axisTitleAnimator.cancel();
        axisTitleTransition.active = false;
        axisTitleTransition.progress = 1;
        axisTitleTransition.fromParts = null;
        axisTitleTransition.toParts = null;
        chart?.draw();
        return;
      }

      axisTitleTransition.active = true;
      axisTitleTransition.progress = 0;
      axisTitleTransition.fromParts = fromParts;
      axisTitleTransition.toParts = toParts;

      axisTitleAnimator.run({
        duration,
        easing: value => value,
        onFrame(progress) {
          axisTitleTransition.progress = progress;
          chart?.draw();
        },
        onComplete() {
          axisTitleTransition.active = false;
          axisTitleTransition.progress = 1;
          axisTitleTransition.fromParts = null;
          axisTitleTransition.toParts = null;
          chart?.draw();
        }
      });
    }

    function animateAxisMaximum(fromMaximum, toMaximum, duration) {
      axisNumberTransition.fromMaximum = Number.isFinite(fromMaximum)
        ? fromMaximum
        : toMaximum;
      axisNumberTransition.toMaximum = Number.isFinite(toMaximum)
        ? toMaximum
        : fromMaximum;
      axisNumberTransition.progress = 0;

      axisNumberAnimator.run({
        duration,
        easing: easeInOutCubic,
        onFrame(progress) {
          axisNumberTransition.progress = progress;
          chart?.draw();
        },
        onComplete() {
          axisNumberTransition.progress = 1;
          chart?.draw();
        }
      });
    }

    function getAnimatedAxisMaximum() {
      return (
        axisNumberTransition.fromMaximum +
        (
          axisNumberTransition.toMaximum -
          axisNumberTransition.fromMaximum
        ) *
        axisNumberTransition.progress
      );
    }

    async function loadSourceRowsWithFallback() {
      const result = await PFFCharts.loadLiveCacheFallback({
        forceCached: FORCE_CACHED_DATA,
        cacheKey: CONFIG.localCacheKey,
        minRows: 1,

        loadLive: () => PFFCharts.loadGVizSheet({
          sheetId: CONFIG.sheetId,
          sheetName: CONFIG.sheetName,
          range: CONFIG.range,
          headers: '1',
          timeoutMs: CONFIG.fetchTimeoutMs,
          query:
            'select A,J,W,AM,BI,BJ,BK,BL where A is not null'
        }),

        parseLive: table =>
          normaliseRows(table?.rows || []),

        loadRemoteCache: () => PFFCharts.loadAppsScriptCache({
          url: CACHE_WEB_APP_URL,
          appKey: CACHE_APP_KEY,
          timeoutMs: CACHE_FETCH_TIMEOUT_MS
        }),

        parseRemoteCache: payload => {
          const cachedRows = Array.isArray(payload?.data?.rows)
            ? payload.data.rows
            : [];

          const rawRows = cachedRows.map((row, rowIndex) => {
            if (!Array.isArray(row) || row.length !== 8) {
              throw new Error(
                `Cached work-loss row ${rowIndex + 1} is malformed`
              );
            }

            return {
              c: row.slice(0, 8).map((cell, cellIndex) => {
                if (!Array.isArray(cell) || cell.length < 2) {
                  throw new Error(
                    `Cached work-loss row ${rowIndex + 1}, ` +
                    `cell ${cellIndex + 1} is malformed`
                  );
                }

                return {
                  v: cell[0],
                  f: cell[1]
                };
              })
            };
          });

          return normaliseRows(rawRows);
        },

        onSource(source) {
          PFF.setDataSourceIndicator(source, {
            indicator: dataSourceIndicator,
            text: dataSourceText
          });
        },

        onLiveError(error) {
          console.warn(
            'Live Google Sheets data could not be used',
            error
          );
        },

        onRemoteCacheError(error) {
          console.warn(
            'Cached Apps Script data could not be used',
            error
          );
        }
      });

      return result.rows;
    }

    function normaliseRows(rawRows) {
      return rawRows
        .map((rawRow, sourceIndex) => {
          const cells = rawRow?.c || [];

          return {
            sourceIndex,
            date: parseDate(cells[0]?.v) ?? parseDate(cells[0]?.f),
            employer: cleanText(getCellValue(cells[1])),
            fteSalary: toNumber(getCellValue(cells[2])),
            hoursPerWeek: toNumber(getCellValue(cells[3])),
            mealReportedPercent: parsePercentCell(cells[4]),
            teaReportedPercent: parsePercentCell(cells[5]),
            outsideMinutesPerFourWeeks: toNumber(getCellValue(cells[6])),
            outsideCompensatedPercent: parsePercentCell(cells[7])
          };
        })
        .filter(row => Number.isFinite(row.date));
    }

    function validFteSalary(value) {
      return Number.isFinite(value) &&
        value >= CONFIG.minimumFteSalary &&
        value <= CONFIG.maximumFteSalary;
    }

    function calculateRowMetrics(row) {
      const assumptions = CONFIG.calculation;

      /*
       * BI and BJ are the percentages of the available break time that
       * respondents actually received. The loss share is therefore
       * 100 minus the reported percentage.
       */
      const mealLossPercent = Number.isFinite(
        row.mealReportedPercent
      )
        ? clamp(100 - row.mealReportedPercent, 0, 100)
        : NaN;

      const teaLossPercent = Number.isFinite(
        row.teaReportedPercent
      )
        ? clamp(100 - row.teaReportedPercent, 0, 100)
        : NaN;

      /*
       * BL is the percentage of outside-roster time paid or returned as TOIL.
       * A valid BL response is retained even when BK is zero. A zero BK value
       * therefore produces zero annual hours/cost rather than a missing row.
       */
      const outsideLossPercent = Number.isFinite(
        row.outsideCompensatedPercent
      )
        ? clamp(100 - row.outsideCompensatedPercent, 0, 100)
        : NaN;

      const annualPaidFteHours =
        assumptions.fullTimeHoursPerWeek *
        assumptions.weeksPerYear;

      const hourlyFteRate = validFteSalary(row.fteSalary)
        ? row.fteSalary / annualPaidFteHours
        : NaN;

      const mealAnnualHours = Number.isFinite(mealLossPercent)
        ? assumptions.mealBreakMinutesPerDay / 60 *
          assumptions.fullTimeDaysPerWeek *
          assumptions.weeksPerYear *
          mealLossPercent / 100
        : NaN;

      const teaAnnualHours = Number.isFinite(teaLossPercent)
        ? assumptions.teaBreakMinutesPerDay / 60 *
          assumptions.fullTimeDaysPerWeek *
          assumptions.weeksPerYear *
          teaLossPercent / 100
        : NaN;

      const validOutsideMinutes = Number.isFinite(
        row.outsideMinutesPerFourWeeks
      ) && row.outsideMinutesPerFourWeeks >= 0;

      const validHoursPerWeek = Number.isFinite(row.hoursPerWeek) &&
        row.hoursPerWeek > 0 &&
        row.hoursPerWeek <= 80;

      const fteScale = validHoursPerWeek
        ? assumptions.fullTimeHoursPerWeek / row.hoursPerWeek
        : NaN;

      const outsideAnnualHours = validOutsideMinutes &&
        Number.isFinite(outsideLossPercent) &&
        Number.isFinite(fteScale)
          ? row.outsideMinutesPerFourWeeks / 60 *
            assumptions.fourWeekCyclesPerYear *
            outsideLossPercent / 100 *
            fteScale
          : NaN;

      const mealAnnualCost = Number.isFinite(mealAnnualHours) &&
        Number.isFinite(hourlyFteRate)
          ? mealAnnualHours * hourlyFteRate
          : NaN;

      const teaAnnualCost = Number.isFinite(teaAnnualHours) &&
        Number.isFinite(hourlyFteRate)
          ? teaAnnualHours * hourlyFteRate
          : NaN;

      const outsideAnnualCost = Number.isFinite(outsideAnnualHours) &&
        Number.isFinite(hourlyFteRate)
          ? outsideAnnualHours * hourlyFteRate
          : NaN;

      return {
        ...row,
        hourlyFteRate,
        fteScale,
        mealLossPercent,
        teaLossPercent,
        outsideLossPercent,
        mealAnnualHours,
        teaAnnualHours,
        outsideAnnualHours,
        mealAnnualCost,
        teaAnnualCost,
        outsideAnnualCost
      };
    }

    function getEmployerIdentity(value) {
      const rawLabel = cleanText(value);

      if (!rawLabel) {
        return null;
      }

      const appearance = PFF.getEmployerAppearance(rawLabel, {
        fallbackLabel: rawLabel,
        fallbackColour: '#777777'
      });

      return {
        key: appearance.matched
          ? appearance.key
          : PFF.normaliseText(rawLabel),
        label: appearance.fullName || rawLabel,
        shortLabel: appearance.label || rawLabel,
        colour: appearance.colour || '#777777'
      };
    }

    function isEmployerView(view = activeView) {
      return view === 'employerCost' || view === 'employerTime';
    }

    function getMetricTabView(view = activeView) {
      if (view === 'employerCost') {
        return 'cost';
      }

      if (view === 'employerTime') {
        return 'time';
      }

      return view;
    }

    function getEmployerViewForMetric(view) {
      return view === 'time'
        ? 'employerTime'
        : 'employerCost';
    }

    function resolveInternalViewForMetric(view) {
      if (view === 'affected') {
        return 'affected';
      }

      const mode =
        viewModeByMetric[view] ||
        'overall';

      affectedOnlyByView[view] =
        mode === 'affected';

      return mode === 'employer'
        ? getEmployerViewForMetric(view)
        : view;
    }

    function getCurrentViewMode(view = activeView) {
      const metricView = getMetricTabView(view);

      if (metricView !== 'cost' && metricView !== 'time') {
        return null;
      }

      if (isEmployerView(view)) {
        return 'employer';
      }

      return affectedOnlyByView[metricView]
        ? 'affected'
        : 'overall';
    }

    function getViewModeLabel(mode) {
      if (mode === 'affected') {
        return 'Affected';
      }

      if (mode === 'employer') {
        return 'Employer';
      }

      return 'Overall';
    }

    function getEmployerMetric(view = activeView) {
      return getMetricTabView(view) === 'time'
        ? 'hours'
        : 'cost';
    }

    function employerRowHasCalculatedMetric(row, view = activeView) {
      const metric = getEmployerMetric(view);

      return CATEGORY_CONFIG.some(category =>
        Number.isFinite(
          getCategoryValues(row, category.key)[metric]
        )
      );
    }

    function wrapEmployerLabel(label, maximumCharacters = 18) {
      const text = cleanText(label);

      if (!text || text.length <= maximumCharacters) {
        return text;
      }

      const words = text.split(' ');
      const lines = [''];

      words.forEach(word => {
        const current = lines[lines.length - 1];
        const proposed = current ? `${current} ${word}` : word;

        if (
          proposed.length > maximumCharacters &&
          current &&
          lines.length < 2
        ) {
          lines.push(word);
        } else {
          lines[lines.length - 1] = proposed;
        }
      });

      return lines;
    }

    function buildEmployerModel(view = activeView, preferredOrderKeys = null) {
      const metric =
        getEmployerMetric(view);

      const groups =
        new Map();

      rows.forEach(row => {
        const identity =
          getEmployerIdentity(
            row.employer
          );

        if (
          !identity ||
          !employerRowHasCalculatedMetric(
            row,
            view
          )
        ) {
          return;
        }

        if (!groups.has(identity.key)) {
          groups.set(
            identity.key,
            {
              ...identity,
              rows: []
            }
          );
        }

        groups
          .get(identity.key)
          .rows
          .push(row);
      });

      const allGroups =
        [...groups.values()]
          .map(group => {
            const categoryStatistics =
              {};

            CATEGORY_CONFIG.forEach(
              category => {
                const values =
                  group.rows
                    .map(
                      row =>
                        getCategoryValues(
                          row,
                          category.key
                        )[metric]
                    )
                    .filter(
                      Number.isFinite
                    );

                categoryStatistics[
                  category.key
                ] =
                  calculateStatistics(
                    values
                  );
              }
            );

            const values =
              CATEGORY_CONFIG.map(
                category => {
                  const statistics =
                    categoryStatistics[
                      category.key
                    ];

                  return isTotalMode(view)
                    ? statistics.sum
                    : statistics.median;
                }
              );

            return {
              ...group,

              responseCount:
                group.rows.length,

              categoryStatistics,

              values,

              displayTotal:
                values.reduce(
                  (
                    total,
                    value
                  ) =>
                    total +
                    (
                      Number.isFinite(value)
                        ? value
                        : 0
                    ),
                  0
                )
            };
          });

      const excludedCount =
        allGroups.filter(
          group =>
            group.responseCount <
            CONFIG.minimumEmployerN
        ).length;

      const includedGroups =
        allGroups.filter(
          group =>
            group.responseCount >=
            CONFIG.minimumEmployerN
        );

      if (
        Array.isArray(
          preferredOrderKeys
        ) &&
        preferredOrderKeys.length
      ) {
        const order =
          new Map(
            preferredOrderKeys.map(
              (
                key,
                index
              ) => [
                key,
                index
              ]
            )
          );

        includedGroups.sort(
          (
            first,
            second
          ) => {
            const firstOrder =
              order.has(first.key)
                ? order.get(first.key)
                : Number.POSITIVE_INFINITY;

            const secondOrder =
              order.has(second.key)
                ? order.get(second.key)
                : Number.POSITIVE_INFINITY;

            return (
              firstOrder -
                secondOrder ||
              second.displayTotal -
                first.displayTotal ||
              first.label.localeCompare(
                second.label
              )
            );
          }
        );
      } else {
        includedGroups.sort(
          (
            first,
            second
          ) =>
            second.displayTotal -
              first.displayTotal ||
            first.label.localeCompare(
              second.label
            )
        );
      }

      return {
        view,
        metric,
        groups:
          includedGroups,
        excludedCount,

        labels:
          includedGroups.map(
            group =>
              group.label
          ),

        totals:
          includedGroups.map(
            group =>
              group.displayTotal
          ),

        datasets:
          CATEGORY_CONFIG.map(
            (
              category,
              categoryIndex
            ) => ({
              label:
                category.legendLabel,

              categoryKey:
                category.key,

              data:
                includedGroups.map(
                  group => {
                    const value =
                      group.values[
                        categoryIndex
                      ];

                    return Number.isFinite(value)
                      ? value
                      : 0;
                  }
                ),

              backgroundColor:
                category.colour,

              hoverBackgroundColor:
                category.colour,

              borderColor:
                'transparent',

              hoverBorderColor:
                'transparent',

              borderWidth:
                0,

              hoverBorderWidth:
                0,

              borderSkipped:
                false,

              borderRadius:
                2,

              barPercentage:
                0.74,

              categoryPercentage:
                0.82,

              employerStatistics:
                includedGroups.map(
                  group =>
                    group
                      .categoryStatistics[
                        category.key
                      ]
                )
            })
          )
      };
    }

    function getCategoryValues(row, categoryKey) {
      if (categoryKey === 'meal') {
        return {
          percent: row.mealLossPercent,
          hours: row.mealAnnualHours,
          cost: row.mealAnnualCost,
          reportedPercent: row.mealReportedPercent
        };
      }

      if (categoryKey === 'tea') {
        return {
          percent: row.teaLossPercent,
          hours: row.teaAnnualHours,
          cost: row.teaAnnualCost,
          reportedPercent: row.teaReportedPercent
        };
      }

      return {
        percent: row.outsideLossPercent,
        hours: row.outsideAnnualHours,
        cost: row.outsideAnnualCost,
        reportedPercent: row.outsideCompensatedPercent,
        reportedMinutes: row.outsideMinutesPerFourWeeks
      };
    }

    function isTotalMode(view) {
      const metricView = getMetricTabView(view);

      return Boolean(
        VIEW_CONFIG[view]?.supportsTotal &&
        totalModeByView[metricView]
      );
    }

    function isAffectedOnly(view) {
      const metricView = getMetricTabView(view);

      return Boolean(
        VIEW_CONFIG[view]?.supportsAffected &&
        affectedOnlyByView[metricView]
      );
    }

    function rowEligibleForCategory(row, categoryKey, view) {
      const metric = VIEW_CONFIG[view]?.metric;
      const values = getCategoryValues(row, categoryKey);

      if (metric === 'affected' || metric === 'hours') {
        return Number.isFinite(values.hours);
      }

      if (metric === 'cost') {
        return Number.isFinite(values.cost);
      }

      return true;
    }

    function getMetricValue(row, categoryKey, view) {
      if (!rowEligibleForCategory(row, categoryKey, view)) {
        return NaN;
      }

      const values = getCategoryValues(row, categoryKey);
      const costAffected = Number.isFinite(values.cost) && values.cost > 0.005;
      const timeAffected = Number.isFinite(values.hours) && values.hours > 0.005;
      const metric = VIEW_CONFIG[view]?.metric;

      if (metric === 'affected') {
        return Number.isFinite(values.hours)
          ? timeAffected
            ? 100
            : 0
          : NaN;
      }

      if (metric === 'cost') {
        return isAffectedOnly(view) && !costAffected
          ? NaN
          : values.cost;
      }

      if (metric === 'hours') {
        return isAffectedOnly(view) && !timeAffected
          ? NaN
          : values.hours;
      }

      return NaN;
    }

    function buildCategoryModel(view, category) {
      const metricRows = rows
        .map(row => {
          const metricValue = getMetricValue(
            row,
            category.key,
            view
          );

          return {
            ...row,
            categoryKey: category.key,
            label: category.label,
            colour: category.colour,
            metricView: view,
            metricValue,
            actualValue: metricValue,
            categoryValues: getCategoryValues(row, category.key)
          };
        });

      const validMetricRows = metricRows.filter(row =>
        Number.isFinite(row.metricValue)
      );

      const statistics = calculateStatistics(
        validMetricRows.map(row => row.metricValue)
      );

      const baseAffectedRows = rows
        .map(row => getCategoryValues(row, category.key).hours)
        .filter(Number.isFinite);

      const affectedValues = baseAffectedRows.filter(value => value > 0.005);
      const affectedStatistics = calculateStatistics(affectedValues);
      const affectedCount = affectedValues.length;
      const validAffectedCount = baseAffectedRows.length;
      const affectedPercent = validAffectedCount
        ? affectedCount / validAffectedCount * 100
        : NaN;

      let aggregateValue;

      if (isTotalMode(view)) {
        aggregateValue = statistics.sum;
      } else if (VIEW_CONFIG[view]?.metric === 'affected') {
        aggregateValue = statistics.mean;
      } else {
        aggregateValue = statistics.median;
      }

      return {
        category,
        metricRows,
        validMetricRows,
        statistics,
        aggregateValue,
        affectedStatistics,
        affectedCount,
        validAffectedCount,
        affectedPercent,
        validCount: statistics.count,
        responseCount: rows.length
      };
    }

    function niceStep(value) {
      if (!Number.isFinite(value) || value <= 0) {
        return 1;
      }

      const exponent = Math.floor(Math.log10(value));
      const magnitude = Math.pow(10, exponent);
      const fraction = value / magnitude;

      if (fraction <= 1) return magnitude;
      if (fraction <= 2) return 2 * magnitude;
      if (fraction <= 2.5) return 2.5 * magnitude;
      if (fraction <= 5) return 5 * magnitude;
      if (fraction <= 7.5) return 7.5 * magnitude;
      return 10 * magnitude;
    }

    function buildYAxisModel(view, categoryModels) {
      const rawValues = categoryModels
        .flatMap(model =>
          model.validMetricRows.map(row => row.metricValue)
        )
        .filter(Number.isFinite)
        .sort((first, second) => first - second);

      const summaryValues = categoryModels
        .map(model => model.aggregateValue)
        .filter(Number.isFinite);

      const summaryMaximum = Math.max(
        0,
        ...summaryValues
      );

      const robustRawMaximum = rawValues.length
        ? percentile(rawValues, 0.80)
        : 0;

      /*
       * The 80th percentile represents the main body of respondent values,
       * while the cap keeps the highest summary bar near the top. This avoids
       * a few high observations compressing the lower individual squares.
       */
      const summaryFocusedMaximum = summaryMaximum > 0
        ? summaryMaximum * 1.20
        : robustRawMaximum * 1.04;

      const targetMaximum = Math.max(
        summaryMaximum * 1.08,
        Math.min(
          robustRawMaximum * 1.04,
          summaryFocusedMaximum
        ),
        VIEW_CONFIG[view].kind === 'percentage'
          ? 10
          : VIEW_CONFIG[view].kind === 'hours'
            ? 10
            : 100
      );

      if (VIEW_CONFIG[view].kind === 'percentage') {
        const maximum = Math.min(
          100,
          Math.max(
            10,
            Math.ceil(targetMaximum / 10) * 10
          )
        );

        return {
          minimum: 0,
          maximum,
          majorStep: 10,
          minorStep: 5
        };
      }

      const majorStep = niceStep(
        targetMaximum / 6
      );

      return {
        minimum: 0,
        maximum: Math.max(
          Math.ceil(targetMaximum / majorStep) * majorStep,
          majorStep
        ),
        majorStep,
        minorStep: majorStep / 2
      };
    }

    function normaliseMetricValue(value, axis) {
      return Number.isFinite(value) &&
        Number.isFinite(axis?.maximum) &&
        axis.maximum > 0
          ? value / axis.maximum
          : null;
    }

    function deterministicJitter(index) {
      const sequence = [
        0,
        -0.18,
        0.18,
        -0.09,
        0.09,
        -0.27,
        0.27
      ];

      return sequence[index % sequence.length];
    }

    function buildViewModel(view) {
      const categoryModels = CATEGORY_CONFIG.map(category =>
        buildCategoryModel(view, category)
      );

      const yAxis = buildYAxisModel(view, categoryModels);
      const datasets = [];

      categoryModels.forEach((model, categoryIndex) => {
        const category = model.category;

        const showRawSquares = VIEW_CONFIG[view]?.metric !== 'affected';

        datasets.push({
          type: 'scatter',
          datasetRole: 'raw',
          categoryKey: category.key,
          label: `${category.label} respondent values`,
          data: showRawSquares
            ? model.metricRows
                .filter(row => Number.isFinite(row.metricValue))
                .map(row => ({
                  ...row,
                  x: category.x + deterministicJitter(row.sourceIndex),
                  y: normaliseMetricValue(row.metricValue, yAxis)
                }))
            : [],
          parsing: false,
          showLine: false,
          clip: true,
          order: 1,
          pointStyle: 'rect',
          pointRadius: CONFIG.pointRadius,
          pointHoverRadius: CONFIG.pointHoverRadius,
          pointHitRadius: 4,
          pointBackgroundColor: rgba(
            category.colour,
            CONFIG.pointOpacity
          ),
          pointHoverBackgroundColor: rgba(
            category.colour,
            CONFIG.pointHoverOpacity
          ),
          pointBorderColor: rgba(category.colour, 0.34),
          pointHoverBorderColor: category.colour,
          pointBorderWidth: 0.45,
          pointHoverBorderWidth: 1
        });

        const summaryRaw = {
          categoryKey: category.key,
          label: category.label,
          colour: category.colour,
          metricView: view,
          aggregateValue: model.aggregateValue,
          statistics: model.statistics,
          affectedStatistics: model.affectedStatistics,
          affectedCount: model.affectedCount,
          validAffectedCount: model.validAffectedCount,
          affectedPercent: model.affectedPercent,
          validCount: model.validCount,
          responseCount: model.responseCount,
          totalMode: isTotalMode(view),
          affectedOnly: isAffectedOnly(view)
        };

        datasets.push({
          type: 'line',
          datasetRole: 'summary',
          categoryKey: category.key,
          order: -10,
          label: `${category.label} summary`,
          data: Number.isFinite(model.aggregateValue)
            ? [
                {
                  ...summaryRaw,
                  x: category.x - 0.27,
                  y: normaliseMetricValue(model.aggregateValue, yAxis)
                },
                {
                  ...summaryRaw,
                  x: category.x + 0.27,
                  y: normaliseMetricValue(model.aggregateValue, yAxis)
                }
              ]
            : [],
          parsing: false,
          showLine: true,
          clip: false,
          fill: false,
          borderColor: category.colour,
          backgroundColor: category.colour,
          borderWidth: CONFIG.medianLineWidth,
          borderCapStyle: 'round',
          borderJoinStyle: 'round',
          pointRadius: 0,
          pointHoverRadius: 0,
          pointHitRadius: 6,
          tension: 0,
          metadata: summaryRaw
        });
      });

      return {
        view,
        yAxis,
        datasets,
        legendItems: CATEGORY_CONFIG.map(category => ({
          colour: category.colour,
          label: category.legendLabel
        }))
      };
    }

    function formatMetricValue(view, value) {
      if (!Number.isFinite(Number(value))) {
        return '—';
      }

      if (VIEW_CONFIG[view].kind === 'percentage') {
        return formatPercentage(value, 1);
      }

      if (VIEW_CONFIG[view].kind === 'hours') {
        return `${formatNumber(value, 1)} hours/year`;
      }

      return formatCurrency(value, 0);
    }

    function formatIqrNumber(view, value) {
      if (!Number.isFinite(Number(value))) {
        return '—';
      }

      if (VIEW_CONFIG[view].kind === 'currency') {
        return formatNumber(value, 0);
      }

      return formatNumber(value, 1);
    }

    function formatMedianIqr(view, statistics) {
      if (!statistics?.count) {
        return '—';
      }

      return (
        `${formatMetricValue(view, statistics.median)} ` +
        `[${formatIqrNumber(view, statistics.q1)}, ` +
        `${formatIqrNumber(view, statistics.q3)}]`
      );
    }

    function createXAxisOptions() {

            family: 'Lato',
            size: window.matchMedia('(max-width: 430px)').matches

          },

    function getYAxisTitle(view) {
      const parts = getYAxisTitleParts(view);

      return [
        parts.lead,
        parts.shared,
        parts.tail,
        parts.unit
      ]
        .filter(Boolean)
        .join(' ');
    }

    function createYAxisOptions(view, axis) {
      const tickCount = getAxisTickCount(axis);

      return {
        min: 0,
        max: 1,
        afterFit(scale) {
          scale.width = window.matchMedia('(max-width: 430px)').matches
            ? 64
            : 70;
        },
        afterBuildTicks(scale) {
          scale.ticks = Array.from(
            { length: tickCount },
            (_, index) => ({
              value: index / Math.max(1, tickCount - 1)
            })
          );
        },
        title: {
          display: false,
          text: getYAxisTitle(view),
          color: '#151515',
          font: {
            family: 'Lato',
            size: 13,
            weight: '700'
          }
        },
        ticks: {
          color: 'rgba(21, 21, 21, 0)',
          autoSkip: false,
          padding: 3,
          font: {
            family: 'Lato',
            size: 10,
            weight: '400'
          },
          callback() {
            return '';
          }
        },
        grid: {
          color(context) {
            const index = context.index ?? 0;
            const alpha = (
              index % 2 === 0
                ? 0.075
                : 0.035
            ) * clamp(axisLabelOpacity, 0, 1);

            return `rgba(105, 113, 138, ${alpha})`;
          },
          lineWidth(context) {
            const index = context.index ?? 0;
            return index % 2 === 0 ? 1 : 0.7;
          },
          drawTicks: true,
          tickLength: 5,
          tickColor: 'rgba(21, 21, 21, 0)',
          tickWidth: 0
        },
        border: {
          display: false,
          color: '#151515',
          width: 1
        }
      };
    }

    function drawVariableTicks(
      context,
      scale,
      axis,
      isMajor,
      opacity = 1
    ) {
      if (!scale?.ticks?.length) {
        return;
      }

      context.save();
      context.globalAlpha = clamp(opacity, 0, 1);
      context.lineCap = 'butt';
      context.strokeStyle = '#151515';

      scale.ticks.forEach((tick, index) => {
        const value = Number(tick.value);
        const pixel = scale.getPixelForTick(index);

        if (!Number.isFinite(value) || !Number.isFinite(pixel)) {
          return;
        }

        const major = isMajor(value, index);
        const tickLength = major ? 6 : 2;

        context.beginPath();
        context.lineWidth = major ? 1 : 0.7;

        if (axis === 'x') {
          context.moveTo(pixel, scale.top);
          context.lineTo(pixel, scale.top + tickLength);
        } else {
          context.moveTo(scale.right, pixel);
          context.lineTo(scale.right - tickLength, pixel);
        }

        context.stroke();
      });

      context.restore();
    }

    const constantSpinePlugin = {
      id: 'constantSpinePlugin',
      afterDatasetsDraw(activeChart) {
        const area = activeChart.chartArea;

        if (
          !area ||
          familySpineMorphActive
        ) {
          return;
        }

        const context = activeChart.ctx;
        context.save();
        context.globalAlpha = 1;
        context.strokeStyle = '#151515';
        context.lineWidth = 1;
        context.lineCap = 'butt';

        context.beginPath();
        context.moveTo(area.left, area.bottom);
        context.lineTo(area.right, area.bottom);
        context.stroke();

        context.beginPath();
        context.moveTo(area.left, area.top);
        context.lineTo(area.left, area.bottom);
        context.stroke();

        context.restore();
      }
    };

    const variableAxisTickPlugin = {
      id: 'variableAxisTickPlugin',
      afterDatasetsDraw(activeChart) {
        drawVariableTicks(
          activeChart.ctx,
          activeChart.scales.x,
          'x',
          () => true,
          1
        );

        drawVariableTicks(
          activeChart.ctx,
          activeChart.scales.y,
          'y',
          (_value, index) => index % 2 === 0,
          axisLabelOpacity
        );
      }
    };

    function getYAxisTitleText(parts) {
      return ['lead', 'shared', 'tail', 'unit']
        .map(key => String(parts?.[key] || '').trim())
        .filter(Boolean)
        .join(' ');
    }

    function drawAxisTitleText(context, text, opacity) {
      if (!text || opacity <= 0.001) {
        return;
      }

      context.save();
      context.globalAlpha = clamp(opacity, 0, 1);
      context.fillText(text, 0, 0);
      context.restore();
    }

    function drawYAxisTitle(context) {
      context.font = '700 13px Lato, sans-serif';
      context.fillStyle = '#151515';
      context.textAlign = 'center';
      context.textBaseline = 'middle';

      if (!axisTitleTransition.active) {
        drawAxisTitleText(
          context,
          getYAxisTitleText(
            displayedYAxisTitleParts || getYAxisTitleParts(activeView)
          ),
          1
        );
        return;
      }

      const progress = clamp(axisTitleTransition.progress, 0, 1);
      const oldText = getYAxisTitleText(axisTitleTransition.fromParts);
      const newText = getYAxisTitleText(axisTitleTransition.toParts);
      const oldOpacity = 1 - clamp(progress / 0.46, 0, 1);
      const newOpacity = clamp((progress - 0.36) / 0.64, 0, 1);

      drawAxisTitleText(context, oldText, oldOpacity);
      drawAxisTitleText(context, newText, newOpacity);
    }

    const animatedYAxisLabelPlugin = {
      id: 'animatedYAxisLabelPlugin',
      afterDatasetsDraw(activeChart) {
        const scale = activeChart.scales.y;

        if (!scale?.ticks?.length) {
          return;
        }

        const maximum = getAnimatedAxisMaximum();
        const context = activeChart.ctx;

        context.save();
        context.globalAlpha = clamp(axisLabelOpacity, 0, 1);
        context.fillStyle = '#151515';
        context.font = '400 12px Lato, sans-serif';
        context.textAlign = 'right';
        context.textBaseline = 'middle';

        scale.ticks.forEach((tick, index) => {
          if (index % 2 !== 0) {
            return;
          }

          const pixel = scale.getPixelForTick(index);
          const value = Number(tick.value) * maximum;

          if (!Number.isFinite(pixel) || !Number.isFinite(value)) {
            return;
          }

          context.fillText(
            formatAxisNumber(value),
            scale.right - 8,
            pixel
          );
        });

        context.save();
        context.translate(
          scale.left + 8,
          (scale.top + scale.bottom) / 2
        );
        context.rotate(-Math.PI / 2);
        drawYAxisTitle(context);
        context.restore();

        context.restore();
      }
    };

    function tooltipTitle(item) {
      return item?.dataset?.label
        ? CATEGORY_BY_KEY.get(item.dataset.categoryKey)?.label || ''
        : item?.raw?.label || '';
    }

    function rawLossLines(raw) {
      const values = raw?.categoryValues || {};
      const lines = [];
      const metric = VIEW_CONFIG[activeView]?.metric;

      if (metric === 'affected') {
        lines.push(`Affected: ${raw.actualValue > 0 ? 'Yes' : 'No'}`);

        if (Number.isFinite(values.cost)) {
          lines.push(
            `Any calculated $ loss: ${formatCurrency(values.cost, 0)}/year`
          );
        }
        return lines;
      }

      if (metric === 'cost') {
        if (Number.isFinite(values.cost)) {
          lines.push(
            `$ loss: ${formatCurrency(values.cost, 0)}/year`
          );
        }
      }

      if (metric === 'hours') {
        if (Number.isFinite(values.hours)) {
          lines.push(
            `Time loss: ${formatNumber(values.hours, 1)} hours/year`
          );
        }
      }

      return lines;
    }

    function formatResponseCount(summary) {
      const responseCount = Number(summary?.responseCount) || rows.length;
      const validCount = Number(summary?.validCount) || 0;

      if (validCount === responseCount) {
        return `Respondents: ${formatNumber(responseCount, 0)}`;
      }

      return (
        `Respondents: ${formatNumber(responseCount, 0)} ` +
        `(${formatNumber(validCount, 0)} values included)`
      );
    }

    function tooltipLabel(item) {
      const role = item.dataset.datasetRole;
      const raw = item.raw;
      const metric = VIEW_CONFIG[activeView]?.metric;

      if (role === 'summary') {
        const summary = item.dataset.metadata || raw || {};
        const lines = [];

        if (isTotalMode(activeView)) {
          const label = metric === 'hours'
            ? 'Total time loss'
            : 'Total $ loss';

          lines.push(
            `${label}: ${formatMetricValue(activeView, summary.aggregateValue)}`
          );
          lines.push(formatResponseCount(summary));
          return lines;
        }

        if (metric === 'affected') {
          lines.push(
            `Optoms affected: ${formatPercentage(summary.aggregateValue, 1)} ` +
            `(${formatNumber(summary.affectedCount, 0)} of ` +
            `${formatNumber(summary.validAffectedCount, 0)} valid)`
          );
          lines.push(
            `Respondents: ${formatNumber(summary.responseCount || rows.length, 0)}`
          );
          return lines;
        }

        lines.push(
          `Median [IQR]: ${formatMedianIqr(
            activeView,
            summary.statistics
          )}`
        );

        lines.push(formatResponseCount(summary));

        return lines;
      }

      return rawLossLines(raw);
    }

    function createChartOptions(model) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 0,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 3),
        animation: {
          duration: CONFIG.transitionMs,
          easing: 'easeInOutCubic'
        },
        transitions: {
          resize: {
            animation: {
              duration: 0
            }
          },
          active: {
            animation: {
              duration: 170,
              easing: 'easeOutCubic'
            }
          }
        },
        layout: {
          autoPadding: false,
          padding: {
            top: 4,
            right: 12,
            bottom: 0,
            left: 0
          }
        },
        interaction: {
          mode: 'nearest',
          axis: 'xy',
          intersect: true,
          includeInvisible: false
        },
        onHover: handleChartHover,
        onClick: handleChartClick,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            enabled: true,
            events: [],
            mode: 'nearest',
            intersect: true,
            displayColors: false,
            backgroundColor: '#ffffff',
            titleColor: '#151515',
            bodyColor: '#69718a',
            borderColor: '#e8eaf0',
            borderWidth: 1,
            cornerRadius: 4,
            padding: 9,
            titleFont: {
              family: 'Lato',
              size: 12,
              weight: '700'
            },
            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },
            filter() {
              return !interactionLocked && !viewSwitchLocked;
            },
            callbacks: {
              title(items) {
                return tooltipTitle(items?.[0]);
              },
              label(item) {
                return tooltipLabel(item);
              }
            }
          }
        },
        scales: {
          x: createXAxisOptions(),
          y: createYAxisOptions(model.view, model.yAxis)
        }
      };
    }

    function distanceToSegment(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;

      if (dx === 0 && dy === 0) {
        return Math.hypot(px - ax, py - ay);
      }

      const proportion = clamp(
        ((px - ax) * dx + (py - ay) * dy) /
        (dx * dx + dy * dy),
        0,
        1
      );

      return Math.hypot(
        px - (ax + proportion * dx),
        py - (ay + proportion * dy)
      );
    }

    function findNearestSummaryLine(event, maximumDistance = 14) {
      if (!chart?.chartArea) {
        return null;
      }

      const x = Number(event?.x);
      const y = Number(event?.y);
      const area = chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let bestMatch = null;

      chart.data.datasets.forEach((dataset, datasetIndex) => {
        if (dataset.datasetRole !== 'summary') {
          return;
        }

        const rendered = chart.getDatasetMeta(datasetIndex)?.data || [];

        if (rendered.length < 2) {
          return;
        }

        const distance = distanceToSegment(
          x,
          y,
          rendered[0].x,
          rendered[0].y,
          rendered[1].x,
          rendered[1].y
        );

        if (distance <= maximumDistance && (
          !bestMatch || distance < bestMatch.distance
        )) {
          bestMatch = {
            datasetIndex,
            index: 0,
            distance
          };
        }
      });

      return bestMatch;
    }

    function getInteractiveElement(elements, event) {
      /*
       * Median bars take priority over nearby respondent squares. This
       * prevents the summary tooltip from being replaced as the pointer
       * moves along a bar that overlaps one or more raw observations.
       */
      return findNearestSummaryLine(event) ||
        (elements || []).find(element => {
          const role = chart?.data?.datasets?.[element.datasetIndex]?.datasetRole;
          return role === 'raw' || role === 'summary';
        });
    }

    function showSelectedTooltip(event, selectedElement) {
      if (!chart || !selectedElement) {
        return;
      }

      const renderedElement = chart
        .getDatasetMeta(selectedElement.datasetIndex)
        ?.data?.[selectedElement.index];

      const nextKey =
        `${selectedElement.datasetIndex}:${selectedElement.index}`;

      chart.tooltip.setActiveElements(
        [
          {
            datasetIndex: selectedElement.datasetIndex,
            index: selectedElement.index
          }
        ],
        {
          x: Number.isFinite(Number(event?.x))
            ? Number(event.x)
            : renderedElement?.x ?? 0,
          y: Number.isFinite(Number(event?.y))
            ? Number(event.y)
            : renderedElement?.y ?? 0
        }
      );

      if (activeTooltipKey === nextKey) {
        return;
      }

      activeTooltipKey = nextKey;

      /*
       * Tooltip events are disabled in the Chart.js tooltip plugin, so only
       * this manual selection controls the active tooltip. That prevents the
       * median tooltip being replaced by an overlapping respondent square.
       */
      chart.tooltip.update(true);
      chart.draw();
    }

    function handleChartHover(event, elements) {
      if (!chart || interactionLocked || viewSwitchLocked) {
        if (chart) {
          chart.canvas.style.cursor = 'default';
        }
        return;
      }

      const selectedElement = getInteractiveElement(elements, event);
      chart.canvas.style.cursor = selectedElement
        ? 'pointer'
        : 'default';

      if (tooltipPinned) {
        return;
      }

      if (selectedElement) {
        showSelectedTooltip(event, selectedElement);
        return;
      }

      if (activeTooltipKey) {
        activeTooltipKey = '';
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.tooltip.update(true);
        chart.draw();
      }
    }

    function handleChartClick(event, elements) {
      if (!chart || interactionLocked || viewSwitchLocked) {
        return;
      }

      event?.native?.preventDefault?.();

      const selectedElement = getInteractiveElement(elements, event);

      if (!selectedElement) {
        tooltipPinned = false;
        activeTooltipKey = '';
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.tooltip.update(true);
        chart.draw();
        return;
      }

      tooltipPinned = true;
      activeTooltipKey = '';
      showSelectedTooltip(event, selectedElement);
    }

    function applyModelToChart(model, animate = true) {
      chart.options.animation.duration = animate
        ? CONFIG.transitionMs
        : 0;

      model.datasets.forEach((target, index) => {
        const current = chart.data.datasets[index];

        if (!current) {
          chart.data.datasets[index] = target;
          return;
        }

        Object.assign(current, target);
        current.data = target.data;
      });

      chart.data.datasets.length = model.datasets.length;
      chart.options.scales.x = createXAxisOptions();
      chart.options.scales.y = createYAxisOptions(
        model.view,
        model.yAxis
      );

      chart.update(animate ? undefined : 'none');
    }

    function createChart() {
      const model = buildViewModel(activeView);
      currentYAxisModel = model.yAxis;
      axisNumberTransition.fromMaximum = model.yAxis.maximum;
      axisNumberTransition.toMaximum = model.yAxis.maximum;
      axisNumberTransition.progress = 1;
      displayedYAxisTitleParts = getYAxisTitleParts(activeView);

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: 'scatter',
          data: {
            datasets: model.datasets
          },
          options: createChartOptions(model),
          plugins: [
            constantSpinePlugin,
            variableAxisTickPlugin,
            animatedYAxisLabelPlugin
          ]
        }
      );

      updateLegend(model.legendItems, false);
      updateViewControls();
    }

    function getHeadingParts(view) {
      const year = analysisWindow?.label
        ? `(${analysisWindow.label})`
        : '';

      if (view === 'affected') {
        return {
          lead: '% of optoms affected',
          shared: '',
          tail: '',
          year
        };
      }

      const metricView =
        getMetricTabView(view);

      const total =
        isTotalMode(view);

      const isTime =
        metricView === 'time';

      if (total) {
        return {
          lead:
            isTime
              ? 'Total time'
              : 'Total $',
          shared: 'loss',
          tail: '',
          year
        };
      }

      return {
        lead:
          isTime
            ? 'Time'
            : '$',
        shared: 'loss',
        tail: 'per optom',
        year
      };
    }

    function updateHeadingParts(nextParts, animate = true) {
      const elements = [
        chartHeadingLead,
        chartHeadingShared,
        chartHeadingTail,
        chartHeadingYear
      ];

      const keys = ['lead', 'shared', 'tail', 'year'];
      const previousText = elements.map(element => element.textContent);
      const nextText = keys.map(key => String(nextParts[key] || ''));

      if (previousText.every((value, index) => value === nextText[index])) {
        requestAnimationFrame(updateHeadingScrollControls);
        return;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      const token = ++headingAnimationToken;

      chartHeading.getAnimations?.().forEach(animation => animation.cancel());

      function commitHeadingText() {
        elements.forEach((element, index) => {
          element.textContent = nextText[index];
        });

        headingViewport.scrollLeft = 0;
        requestAnimationFrame(updateHeadingScrollControls);
      }

      if (!animate || reduceMotion || !chartHeading.animate) {
        commitHeadingText();
        chartHeading.style.opacity = '';
        return;
      }

      const fadeOut = chartHeading.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        {
          duration: 180,
          easing: 'ease-out',
          fill: 'forwards'
        }
      );

      fadeOut.finished
        .then(() => {
          if (token !== headingAnimationToken) {
            return;
          }

          fadeOut.cancel();
          commitHeadingText();

          const fadeIn = chartHeading.animate(
            [{ opacity: 0 }, { opacity: 1 }],
            {
              duration: 280,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );

          fadeIn.finished
            .then(() => fadeIn.cancel())
            .catch(() => {});
        })
        .catch(() => {
          if (token === headingAnimationToken) {
            commitHeadingText();
          }
        });
    }

    function updateHeading(animate = true) {
      updateHeadingParts(
        getHeadingParts(activeView),
        animate
      );
    }

    function setViewMenuValue(mode, animate = true) {
      const nextText = getViewModeLabel(mode);

      if (viewMenuValue.textContent === nextText) {
        return;
      }

      const token = ++viewMenuAnimationToken;
      const reduceMotion = PFF.reducedMotion();

      function commit() {
        if (token !== viewMenuAnimationToken) {
          return;
        }

        viewMenuValue.textContent = nextText;
      }

      if (
        !animate ||
        reduceMotion ||
        !viewMenuValue.animate
      ) {
        commit();
        viewMenuValue.style.opacity = '';
        return;
      }

      const fadeOut = viewMenuValue.animate(
        [
          { opacity: 1 },
          { opacity: 0 }
        ],
        {
          duration: 110,
          easing: 'ease-out',
          fill: 'forwards'
        }
      );

      fadeOut.finished
        .then(() => {
          if (token !== viewMenuAnimationToken) {
            return;
          }

          fadeOut.cancel();
          commit();

          const fadeIn = viewMenuValue.animate(
            [
              { opacity: 0 },
              { opacity: 1 }
            ],
            {
              duration: 180,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );

          fadeIn.finished
            .then(() => fadeIn.cancel())
            .catch(() => {});
        })
        .catch(() => {
          if (token === viewMenuAnimationToken) {
            commit();
          }
        });
    }

    function updateViewControls(animateViewLabel = true) {
      const metricView = getMetricTabView(activeView);
      const supportsViewSelector =
        metricView === 'cost' ||
        metricView === 'time';

      const supportsTotal =
        Boolean(
          VIEW_CONFIG[activeView]?.supportsTotal
        );

      const supportsControls =
        supportsViewSelector ||
        supportsTotal;

      const currentMode =
        getCurrentViewMode(activeView) ||
        'overall';

      const totalActive =
        isTotalMode(activeView);

      chartToggleGroup.classList.toggle(
        'is-hidden',
        !supportsControls
      );

      chartToggleGroup.setAttribute(
        'aria-hidden',
        String(!supportsControls)
      );

      viewControl.classList.toggle(
        'is-hidden',
        !supportsViewSelector
      );

      viewMenuButton.disabled =
        !supportsViewSelector ||
        interactionLocked ||
        viewSwitchLocked;

      viewMenuButton.tabIndex =
        supportsViewSelector
          ? 0
          : -1;

      setViewMenuValue(
        currentMode,
        animateViewLabel
      );

      viewMenuItems.forEach(item => {
        const selected =
          item.dataset.viewMode ===
          currentMode;

        item.classList.toggle(
          'is-selected',
          selected
        );

        item.setAttribute(
          'aria-selected',
          String(selected)
        );
      });

      totalToggleButton.classList.toggle(
        'is-hidden',
        !supportsTotal
      );

      totalToggleButton.classList.toggle(
        'is-active',
        totalActive
      );

      totalToggleButton.setAttribute(
        'aria-checked',
        String(totalActive)
      );

      totalToggleButton
        .querySelector('.pff-chart-toggle-value')
        .textContent =
          totalActive
            ? 'ON'
            : 'OFF';

      totalToggleButton.tabIndex =
        supportsTotal
          ? 0
          : -1;

      totalToggleButton.disabled =
        !supportsTotal ||
        interactionLocked ||
        viewSwitchLocked;

      totalToggleButton.setAttribute(
        'aria-label',
        totalActive
          ? 'Show the median per optom instead of the total'
          : 'Show the total instead of the median per optom'
      );
    }

    function getAxisTickCount(axis) {
      const explicitTickCount = Number(axis?.displayTickCount);

      if (
        Number.isFinite(explicitTickCount) &&
        explicitTickCount >= 2
      ) {
        return Math.round(explicitTickCount);
      }

      return Math.max(
        2,
        Math.round(axis.maximum / axis.minorStep) + 1
      );
    }

    function sameAxisTickLayout(firstAxis, secondAxis) {
      /*
       * The ticks use evenly spaced positions between zero and one.
       * Their physical positions are therefore unchanged whenever
       * both axes display the same number of ticks.
       */
      return (
        getAxisTickCount(firstAxis) ===
        getAxisTickCount(secondAxis)
      );
    }

    function sameAxisNumbers(firstAxis, secondAxis) {
      return (
        firstAxis.maximum === secondAxis.maximum &&
        firstAxis.majorStep === secondAxis.majorStep &&
        firstAxis.minorStep === secondAxis.minorStep
      );
    }

    function applyView(
      nextView,
      animate = true,
      force = false,
      nextTotalMode = null,
      nextAffectedOnly = null
    ) {
      if (
        !chart ||
        viewSwitchLocked ||
        !VIEW_CONFIG[nextView] ||
        (!force && nextView === activeView)
      ) {
        return;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      const previousView = activeView;
      const viewChanged = nextView !== previousView;
      const previousAxis = currentYAxisModel || buildViewModel(previousView).yAxis;
      const previousTitleParts =
        displayedYAxisTitleParts || getYAxisTitleParts(previousView);

      if (
        nextTotalMode !== null &&
        VIEW_CONFIG[nextView]?.supportsTotal
      ) {
        totalModeByView[nextView] = Boolean(nextTotalMode);
      }

      if (
        nextAffectedOnly !== null &&
        VIEW_CONFIG[nextView]?.supportsAffected
      ) {
        affectedOnlyByView[nextView] = Boolean(nextAffectedOnly);
      }

      const nextModel = buildViewModel(nextView);
      const nextAxis = nextModel.yAxis;

      /*
       * A toggle changes the values within the current graph, not the graph's
       * structure. Retain the existing y-axis tick positions and animate the
       * labels between their old and new values. A tab change may use a new
       * tick layout and therefore fades the labels instead.
       */
      if (!viewChanged) {
        nextAxis.displayTickCount = getAxisTickCount(previousAxis);
      }

      const nextTitleParts = getYAxisTitleParts(nextView);

      const axisTickLayoutIdentical = sameAxisTickLayout(
        previousAxis,
        nextAxis
      );

      const axisNumbersIdentical = sameAxisNumbers(
        previousAxis,
        nextAxis
      );

      const titleIdentical = sameTitleParts(
        previousTitleParts,
        nextTitleParts
      );

      if (!animate || reduceMotion) {
        activeView = nextView;
        currentYAxisModel = nextAxis;
        axisNumberTransition.fromMaximum = nextAxis.maximum;
        axisNumberTransition.toMaximum = nextAxis.maximum;
        axisNumberTransition.progress = 1;
        axisLabelOpacity = 1;
        displayedYAxisTitleParts = nextTitleParts;
        axisTitleTransition.active = false;
        axisTitleTransition.progress = 1;
        axisTitleTransition.fromParts = null;
        axisTitleTransition.toParts = null;

        updateHeading(false);
        if (viewChanged) {
          updateActiveTab();
        }
        updateLegend(nextModel.legendItems, false);
        applyModelToChart(nextModel, false);
        updateViewControls();
        return;
      }

      viewSwitchLocked = true;
      interactionLocked = true;
      tooltipPinned = false;
      activeTooltipKey = '';
      chart.tooltip.setActiveElements([], { x: 0, y: 0 });
      updateViewControls();

      let pendingPreparations = 0;

      function commitNextView() {
        activeView = nextView;
        updateHeading(true);
        if (viewChanged) {
          updateActiveTab();
        }
        updateLegend(nextModel.legendItems, true);
        applyModelToChart(nextModel, true);
        currentYAxisModel = nextAxis;

        if (axisTickLayoutIdentical) {
          /*
           * The tick and grid-line positions have not changed. Keep them
           * fully visible and count the displayed numbers to their new
           * values rather than fading the whole axis out and back in.
           */
          axisLabelOpacity = 1;

          if (axisNumbersIdentical) {
            axisNumberTransition.fromMaximum = nextAxis.maximum;
            axisNumberTransition.toMaximum = nextAxis.maximum;
            axisNumberTransition.progress = 1;
          } else {
            animateAxisMaximum(
              previousAxis.maximum,
              nextAxis.maximum,
              CONFIG.transitionMs
            );
          }
        } else {
          /*
           * The graph requires a different number of tick positions.
           * The old axis has already faded out, so initialise the new
           * numbers and fade the new labels, ticks and grid lines in.
           */
          axisNumberTransition.fromMaximum = nextAxis.maximum;
          axisNumberTransition.toMaximum = nextAxis.maximum;
          axisNumberTransition.progress = 1;

          animateAxisLabelOpacity(
            0,
            1,
            CONFIG.axisFadeInMs
          );
        }

        if (titleIdentical) {
          displayedYAxisTitleParts = nextTitleParts;
        } else {
          animateYAxisTitleParts(
            previousTitleParts,
            nextTitleParts
          );
        }

        updateViewControls();

        if (viewUnlockTimer !== null) {
          window.clearTimeout(viewUnlockTimer);
        }

        viewUnlockTimer = window.setTimeout(() => {
          viewUnlockTimer = null;
          viewSwitchLocked = false;
          interactionLocked = false;
          updateViewControls();
          chart?.update('none');
        }, CONFIG.transitionMs + 40);
      }

      function preparationComplete() {
        pendingPreparations -= 1;

        if (pendingPreparations <= 0) {
          commitNextView();
        }
      }

      if (
        viewChanged &&
        !axisTickLayoutIdentical
      ) {
        pendingPreparations += 1;

        animateAxisLabelOpacity(
          axisLabelOpacity,
          0,
          CONFIG.axisFadeOutMs,
          preparationComplete
        );
      }

      if (pendingPreparations === 0) {
        commitNextView();
      }
    }

    function getEmployerAxisTitle(view = activeView) {
      if (getMetricTabView(view) === 'time') {
        return isTotalMode(view)
          ? 'Total time loss (hours/year)'
          : 'Time loss per optom (hours/year)';
      }

      return isTotalMode(view)
        ? 'Total $ loss (FTE $/year)'
        : '$ loss per optom (FTE $/year)';
    }

    function formatEmployerMetric(value, view = activeView) {
      if (!Number.isFinite(Number(value))) {
        return '—';
      }

      return view === 'employerTime'
        ? `${formatNumber(value, Math.abs(Number(value)) < 10 ? 1 : 0)} hrs`
        : formatCurrency(value, 0);
    }

    function formatEmployerAxisTick(value, view = activeView) {
      const compact = PFF.formatCompactNumber(value, {
        millionDecimals: 1,
        thousandDecimals: Math.abs(Number(value)) >= 10000 ? 0 : 1,
        decimals:
          Math.abs(Number(value)) < 10 &&
          Math.abs(Number(value) - Math.round(Number(value))) > 0.001
            ? 1
            : 0,
        invalid: ''
      });

      return compact;
    }

    function getEmployerAxisSpec(values) {
      const finiteValues = (values || [])
        .map(Number)
        .filter(value => Number.isFinite(value) && value >= 0);

      const maximumValue = finiteValues.length
        ? Math.max(...finiteValues)
        : 0;

      const majorStep = niceStep(
        maximumValue > 0
          ? maximumValue / 5
          : 1
      );

      const maximum = Math.max(
        majorStep * 5,
        Math.ceil(maximumValue / majorStep) * majorStep
      );

      return {
        maximum,
        majorStep,
        minorStep: majorStep / 2
      };
    }

    function isEmployerMajorTick(value, axisSpec = employerAxisState) {
      const numeric = Number(value);
      const step = Number(axisSpec?.majorStep);

      if (!Number.isFinite(numeric) || !Number.isFinite(step) || step <= 0) {
        return false;
      }

      const multiple = numeric / step;
      return Math.abs(multiple - Math.round(multiple)) < 1e-6;
    }

    function fixedEmployerYAxisWidth(scale) {
      scale.width = PFF.mobileLayout() ? 138 : 154;
    }

    function fixedEmployerXAxisHeight(scale) {
      scale.height = 46;
    }

    function getRenderedEmployerBarBounds(chartInstance, index) {
      let left = Number.POSITIVE_INFINITY;
      let right = Number.NEGATIVE_INFINITY;
      let y = NaN;
      let height = 0;

      chartInstance.data.datasets.forEach((dataset, datasetIndex) => {
        const element =
          chartInstance
            .getDatasetMeta(datasetIndex)
            ?.data?.[index];

        if (!element) {
          return;
        }

        const elementX = Number(element.x);
        const elementBase = Number(element.base);
