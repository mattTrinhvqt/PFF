        if (
          Number.isFinite(elementX) &&
          Number.isFinite(elementBase)
        ) {
          left = Math.min(left, elementX, elementBase);
          right = Math.max(right, elementX, elementBase);
        }

        if (!Number.isFinite(y) && Number.isFinite(element.y)) {
          y = Number(element.y);
        }

        if (Number.isFinite(element.height)) {
          height = Math.max(height, Number(element.height));
        }
      });

      if (
        !Number.isFinite(left) ||
        !Number.isFinite(right) ||
        !Number.isFinite(y)
      ) {
        return null;
      }

      return {
        left,
        right,
        y,
        height
      };
    }

    function getRenderedEmployerTotal(chartInstance, index) {
      return chartInstance.data.datasets.reduce(
        (total, dataset) => {
          const value = Number(dataset.data?.[index]);

          return total + (
            Number.isFinite(value)
              ? value
              : 0
          );
        },
        0
      );
    }

    function drawEmployerAxisTitleText(
      context,
      text,
      opacity,
      x,
      y
    ) {
      if (!text || opacity <= 0.001) {
        return;
      }

      context.save();
      context.globalAlpha = clamp(opacity, 0, 1);
      context.fillStyle = '#151515';
      context.font = '700 13px Lato, sans-serif';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(text, x, y);
      context.restore();
    }

    function animateEmployerAxisTitle(
      fromText,
      toText,
      duration = 520
    ) {
      displayedEmployerAxisTitle = toText;

      if (
        PFF.reducedMotion() ||
        duration <= 0 ||
        fromText === toText
      ) {
        employerAxisTitleAnimator.cancel();
        employerAxisTitleTransition.active = false;
        employerAxisTitleTransition.progress = 1;
        employerAxisTitleTransition.fromText = '';
        employerAxisTitleTransition.toText = '';
        employerChart?.draw();
        return;
      }

      employerAxisTitleTransition.active = true;
      employerAxisTitleTransition.progress = 0;
      employerAxisTitleTransition.fromText = fromText;
      employerAxisTitleTransition.toText = toText;

      employerAxisTitleAnimator.run({
        duration,
        easing: value => value,

        onFrame(progress) {
          employerAxisTitleTransition.progress = progress;
          employerChart?.draw();
        },

        onComplete() {
          employerAxisTitleTransition.active = false;
          employerAxisTitleTransition.progress = 1;
          employerAxisTitleTransition.fromText = '';
          employerAxisTitleTransition.toText = '';
          employerChart?.draw();
        }
      });
    }

    const employerXAxisTitlePlugin = {
      id: 'pffEmployerXAxisTitlePlugin',

      afterDraw(chartInstance) {
        if (!isEmployerView(activeView)) {
          return;
        }

        const scale = chartInstance.scales.x;

        if (!scale) {
          return;
        }

        const x = (scale.left + scale.right) / 2;
        const y = scale.bottom - 8;
        const context = chartInstance.ctx;

        if (!employerAxisTitleTransition.active) {
          drawEmployerAxisTitleText(
            context,
            displayedEmployerAxisTitle ||
              getEmployerAxisTitle(activeView),
            1,
            x,
            y
          );
          return;
        }

        const progress = clamp(
          employerAxisTitleTransition.progress,
          0,
          1
        );

        const oldOpacity =
          1 - clamp(progress / 0.46, 0, 1);

        const newOpacity =
          clamp((progress - 0.36) / 0.64, 0, 1);

        drawEmployerAxisTitleText(
          context,
          employerAxisTitleTransition.fromText,
          oldOpacity,
          x,
          y
        );

        drawEmployerAxisTitleText(
          context,
          employerAxisTitleTransition.toText,
          newOpacity,
          x,
          y
        );
      }
    };

    const employerOutlinePlugin = {
      id: 'pffEmployerOutlinePlugin',

      afterDatasetsDraw(chartInstance) {
        if (!employerModel?.groups?.length || !chartInstance.chartArea) {
          return;
        }

        const context = chartInstance.ctx;

        context.save();
        context.lineWidth = 0.9;
        context.lineJoin = 'round';

        employerModel.groups.forEach((group, index) => {
          const bounds =
            getRenderedEmployerBarBounds(
              chartInstance,
              index
            );

          if (!bounds) {
            return;
          }

          const top =
            bounds.y -
            bounds.height / 2;

          const width =
            Math.max(
              0,
              bounds.right -
              bounds.left
            );

          const height =
            Math.max(
              0,
              bounds.height
            );

          const radius =
            Math.min(
              2,
              height / 2
            );

          context.beginPath();

          if (typeof context.roundRect === 'function') {
            context.roundRect(
              bounds.left + 0.45,
              top + 0.45,
              Math.max(0, width - 0.9),
              Math.max(0, height - 0.9),
              radius
            );
          } else {
            context.rect(
              bounds.left + 0.45,
              top + 0.45,
              Math.max(0, width - 0.9),
              Math.max(0, height - 0.9)
            );
          }

          context.strokeStyle =
            group.colour ||
            '#777777';

          context.stroke();
        });

        context.restore();
      }
    };

    const employerTotalLabelsPlugin = {
      id: 'pffEmployerTotalLabels',

      afterDatasetsDraw(chartInstance) {
        if (!employerModel?.groups?.length) {
          return;
        }

        const context = chartInstance.ctx;

        context.save();
        context.fillStyle = '#151515';
        context.font = '700 10px Lato, sans-serif';
        context.textAlign = 'left';
        context.textBaseline = 'middle';

        employerModel.groups.forEach((group, index) => {
          const bounds =
            getRenderedEmployerBarBounds(
              chartInstance,
              index
            );

          if (!bounds) {
            return;
          }

          const currentTotal =
            getRenderedEmployerTotal(
              chartInstance,
              index
            );

          const label =
            formatEmployerMetric(
              currentTotal,
              employerModel.view
            );

          const textWidth =
            context.measureText(label).width;

          const preferredX =
            bounds.right + 5;

          const fitsOutside =
            preferredX +
            textWidth <=
            chartInstance.chartArea.right +
            44;

          if (fitsOutside) {
            context.textAlign = 'left';
            context.fillStyle = '#151515';

            context.fillText(
              label,
              preferredX,
              bounds.y
            );
          } else {
            context.textAlign = 'right';
            context.fillStyle = '#151515';

            context.fillText(
              label,
              Math.min(
                chartInstance.chartArea.right + 42,
                chartInstance.width - 4
              ),
              bounds.y
            );
          }
        });

        context.restore();
      }
    };

    function getEmployerAnimatedY(
      chartInstance,
      group,
      index
    ) {
      const targetY =
        chartInstance
          ?.scales
          ?.y
          ?.getPixelForValue(
            index
          );

      if (
        !Number.isFinite(targetY) ||
        !employerReorderState.active
      ) {
        return targetY;
      }

      const fromY =
        employerReorderState
          .fromYByKey
          .get(
            group?.key
          );

      if (!Number.isFinite(fromY)) {
        return targetY;
      }

      return (
        fromY +
        (
          targetY -
          fromY
        ) *
        clamp(
          employerReorderState.progress,
          0,
          1
        )
      );
    }

    const employerReorderGeometryPlugin = {
      id: 'pffEmployerReorderGeometryPlugin',

      beforeDatasetsDraw(chartInstance) {
        if (
          !employerReorderState.active ||
          !employerModel?.groups?.length
        ) {
          return;
        }

        chartInstance.data.datasets.forEach(
          (
            _dataset,
            datasetIndex
          ) => {
            const elements =
              chartInstance
                .getDatasetMeta(
                  datasetIndex
                )
                ?.data ||
              [];

            elements.forEach(
              (
                element,
                index
              ) => {
                const group =
                  employerModel
                    ?.groups?.[
                      index
                    ];

                const y =
                  getEmployerAnimatedY(
                    chartInstance,
                    group,
                    index
                  );

                if (
                  Number.isFinite(
                    y
                  )
                ) {
                  element.y =
                    y;
                }
              }
            );
          }
        );
      }
    };

    const employerReorderLabelsPlugin = {
      id: 'pffEmployerReorderLabelsPlugin',

      afterDatasetsDraw(chartInstance) {
        if (
          !employerReorderState.active ||
          !employerModel?.groups?.length
        ) {
          return;
        }

        const scale =
          chartInstance.scales.y;

        if (!scale) {
          return;
        }

        const context =
          chartInstance.ctx;

        const fontSize =
          PFF.mobileLayout()
            ? 9
            : 10;

        const maximumCharacters =
          PFF.mobileLayout()
            ? 15
            : 18;

        context.save();
        context.fillStyle =
          '#151515';

        context.font =
          `400 ${fontSize}px Lato, sans-serif`;

        context.textAlign =
          'right';

        context.textBaseline =
          'middle';

        employerModel.groups.forEach(
          (
            group,
            index
          ) => {
            const y =
              getEmployerAnimatedY(
                chartInstance,
                group,
                index
              );

            if (!Number.isFinite(y)) {
              return;
            }

            const wrapped =
              wrapEmployerLabel(
                group.label,
                maximumCharacters
              );

            const lines =
              Array.isArray(
                wrapped
              )
                ? wrapped
                : [wrapped];

            const lineHeight =
              fontSize + 1;

            const firstY =
              y -
              (
                lines.length -
                1
              ) *
              lineHeight /
              2;

            lines.forEach(
              (
                line,
                lineIndex
              ) => {
                context.fillText(
                  line,
                  scale.right - 5,
                  firstY +
                    lineIndex *
                    lineHeight
                );
              }
            );
          }
        );

        context.restore();
      }
    };

    const employerAxisTickPlugin = {
      id: 'pffEmployerAxisTickPlugin',

      afterDatasetsDraw(chartInstance) {
        if (!isEmployerView(activeView)) {
          return;
        }

        drawVariableTicks(
          chartInstance.ctx,
          chartInstance.scales.x,
          'x',
          value => isEmployerMajorTick(value, employerAxisState),
          1
        );
      }
    };

    const employerThresholdNotePlugin = {
      id: 'pffEmployerThresholdNotePlugin',

      afterDraw(chartInstance) {
        if (!isEmployerView(activeView) || !chartInstance.chartArea) {
          return;
        }

        const context = chartInstance.ctx;
        const area = chartInstance.chartArea;
        const text = `Employers with n < ${CONFIG.minimumEmployerN} excluded`;
        const fontSize = PFF.mobileLayout() ? 8 : 8.5;
        const horizontalPadding = 7;
        const verticalPadding = 5;
        const radius = 4;

        context.save();
        context.font = `400 ${fontSize}px Lato, sans-serif`;
        context.textBaseline = 'middle';
        context.textAlign = 'left';

        const textWidth = context.measureText(text).width;
        const width = textWidth + horizontalPadding * 2;
        const height = fontSize * 1.3 + verticalPadding * 2;
        const x = area.right - width - 5;
        const y = area.bottom - height - 5;

        context.beginPath();
        if (typeof context.roundRect === 'function') {
          context.roundRect(x, y, width, height, radius);
        } else {
          context.moveTo(x + radius, y);
          context.lineTo(x + width - radius, y);
          context.quadraticCurveTo(x + width, y, x + width, y + radius);
          context.lineTo(x + width, y + height - radius);
          context.quadraticCurveTo(
            x + width,
            y + height,
            x + width - radius,
            y + height
          );
          context.lineTo(x + radius, y + height);
          context.quadraticCurveTo(x, y + height, x, y + height - radius);
          context.lineTo(x, y + radius);
          context.quadraticCurveTo(x, y, x + radius, y);
        }

        context.fillStyle = 'rgba(255, 255, 255, 0.90)';
        context.fill();
        context.strokeStyle = 'rgba(105, 113, 138, 0.16)';
        context.lineWidth = 1;
        context.stroke();

        context.fillStyle = PFF.cssVar('--pff-muted', '#69718a');
        context.fillText(
          text,
          x + horizontalPadding,
          y + height / 2
        );
        context.restore();
      }
    };

    function employerTooltipLabel(item) {
      const index =
        item?.dataIndex;

      const group =
        employerModel
          ?.groups?.[index];

      if (!group) {
        return [];
      }

      const view =
        employerModel.view;

      const costView =
        getEmployerMetric(view) ===
        'cost';

      function formatTooltipValue(
        value
      ) {
        if (!Number.isFinite(value)) {
          return '—';
        }

        if (costView) {
          return (
            `${formatCurrency(
              value,
              0
            )} (FTE $/year)`
          );
        }

        return (
          `${formatNumber(
            value,
            Math.abs(value) < 10
              ? 1
              : 0
          )} hours/year`
        );
      }

      const lines =
        CATEGORY_CONFIG.map(
          (
            category,
            categoryIndex
          ) =>
            `${category.legendLabel}: ` +
            formatTooltipValue(
              group.values[
                categoryIndex
              ]
            )
        );

      lines.push(
        `${
          isTotalMode(view)
            ? 'Total'
            : 'Combined'
        }: ` +
        formatTooltipValue(
          group.displayTotal
        )
      );

      lines.push(
        `Respondents: ${formatNumber(
          group.responseCount,
          0
        )}`
      );

      return lines;
    }

    function createEmployerChart(initialModel = null, animateInitial = true) {
      employerModel =
        initialModel ||
        buildEmployerModel(activeView);

      employerModel.axisSpec =
        employerModel.axisSpec ||
        getEmployerAxisSpec(employerModel.totals);

      employerAxisState.maximum =
        employerModel.axisSpec.maximum;

      employerAxisState.majorStep =
        employerModel.axisSpec.majorStep;

      employerAxisState.minorStep =
        employerModel.axisSpec.minorStep;

      displayedEmployerAxisTitle =
        getEmployerAxisTitle(activeView);

      employerChart = new Chart(
        employerCanvas.getContext('2d'),
        {
          type: 'bar',
          data: {
            labels: employerModel.labels,
            datasets: employerModel.datasets
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            resizeDelay: 0,
            devicePixelRatio: Math.min(
              window.devicePixelRatio || 1,
              PFF.defaults.maxDevicePixelRatio
            ),
            animation: {
              duration:
                animateInitial &&
                !PFF.reducedMotion()
                  ? CONFIG.employerTransitionMs
                  : 0,
              easing: 'easeOutCubic'
            },
            transitions: {
              resize: {
                animation: {
                  duration: 0
                }
              },
              active: {
                animation: {
                  duration: PFF.defaults.hoverAnimationMs,
                  easing: 'easeOutCubic'
                }
              }
            },
            layout: {
              autoPadding: false,
              padding: {
                top: 8,
                right: 45,
                bottom: 0,
                left: 0
              }
            },
            interaction: {
              mode: 'index',
              axis: 'y',
              intersect: false,
              includeInvisible: false
            },
            onHover(event, elements) {
              employerChart.canvas.style.cursor =
                !interactionLocked && elements.length
                  ? 'pointer'
                  : 'default';
            },
            plugins: {
              legend: {
                display: false
              },
              tooltip: PFFCharts.tooltipOptions({
                mode: 'index',
                axis: 'y',
                intersect: false,
                position: 'nearest',
                displayColors: false,
                padding: 7,
                titleMarginBottom: 4,
                bodySpacing: 2,

                /*
                 * Keep one tooltip body entry only. That one entry
                 * returns all three categories + combined/total +
                 * respondent count, so the user never has to target
                 * a particular stacked segment.
                 */
                filter(item) {
                  return (
                    !interactionLocked &&
                    item.datasetIndex === 0
                  );
                },

                callbacks: {
                  title(items) {
                    const index =
                      items?.[0]?.dataIndex;

                    return (
                      employerModel
                        ?.groups?.[index]
                        ?.label ||
                      ''
                    );
                  },

                  label:
                    employerTooltipLabel
                }
              })
            },
            scales: {
              x: {
                type: 'linear',
                afterFit: fixedEmployerXAxisHeight,
                stacked: true,
                beginAtZero: true,
                min: 0,
                max: employerAxisState.maximum,

                afterBuildTicks(scale) {
                  scale.ticks = Array.from(
                    { length: 11 },
                    (_, index) => ({
                      value:
                        employerAxisState.maximum *
                        index /
                        10
                    })
                  );
                },

                title: {
                  display: false
                },
                ticks: {
                  color: '#151515',
                  autoSkip: false,
                  padding: 3,
                  font: {
                    family: 'Lato',
                    size: 12,
                    weight: '400'
                  },
                  callback(value) {
                    return isEmployerMajorTick(value, employerAxisState)
                      ? formatEmployerAxisTick(value, employerModel.view)
                      : '';
                  }
                },
                grid: {
                  color(context) {
                    return isEmployerMajorTick(
                      context.tick?.value,
                      employerAxisState
                    )
                      ? 'rgba(105, 113, 138, 0.075)'
                      : 'rgba(105, 113, 138, 0.035)';
                  },
                  lineWidth(context) {
                    return isEmployerMajorTick(
                      context.tick?.value,
                      employerAxisState
                    )
                      ? 1
                      : 0.7;
                  },
                  drawTicks: true,
                  tickLength: 6,
                  tickColor: 'rgba(21, 21, 21, 0)',
                  tickWidth: 0
                },
                border: {
                  display: false
                }
              },
              y: {
                afterFit: fixedEmployerYAxisWidth,
                stacked: true,
                offset: true,
                ticks: {
                  color() {
                    return employerReorderState.active
                      ? 'rgba(21, 21, 21, 0)'
                      : '#151515';
                  },
                  autoSkip: false,
                  padding: 5,
                  font: {
                    family: 'Lato',
                    size: PFF.mobileLayout() ? 9 : 10,
                    weight: '400'
                  },
                  callback(value) {
                    if (employerReorderState.active) {
                      return '';
                    }

                    return wrapEmployerLabel(
                      this.getLabelForValue(value),
                      PFF.mobileLayout() ? 15 : 18
                    );
                  }
                },
                grid: {
                  drawOnChartArea: false,
                  drawTicks: false
                },
                border: {
                  display: false
                }
              }
            }
          },
          plugins: [
            constantSpinePlugin,
            employerAxisTickPlugin,
            employerXAxisTitlePlugin,
            employerReorderGeometryPlugin,
            employerOutlinePlugin,
            employerTotalLabelsPlugin,
            employerReorderLabelsPlugin,
            employerThresholdNotePlugin
          ]
        }
      );
    }

    function captureEmployerYPositions(
      model
    ) {
      const positions =
        new Map();

      if (
        !employerChart ||
        !model?.groups?.length
      ) {
        return positions;
      }

      const elements =
        employerChart
          .getDatasetMeta(0)
          ?.data ||
        [];

      model.groups.forEach(
        (
          group,
          index
        ) => {
          const y =
            elements[
              index
            ]?.y;

          if (
            Number.isFinite(y)
          ) {
            positions.set(
              group.key,
              y
            );
          }
        }
      );

      return positions;
    }

    function applyEmployerDatasetPresentation(
      targetDataset,
      sourceDataset
    ) {
      Object.keys(
        sourceDataset
      ).forEach(key => {
        if (key === 'data') {
          return;
        }

        targetDataset[key] =
          sourceDataset[key];
      });
    }

    function applyEmployerModelImmediately(
      model,
      axisTitle =
        getEmployerAxisTitle(
          model?.view ||
          activeView
        )
    ) {
      if (!model) {
        return;
      }

      employerMeasureAnimator.cancel();
      employerAxisTitleAnimator.cancel();

      employerReorderState.active =
        false;

      employerReorderState.progress =
        1;

      employerReorderState.fromYByKey =
        new Map();

      employerModel =
        model;

      employerAxisState.maximum =
        model.axisSpec.maximum;

      employerAxisState.majorStep =
        model.axisSpec.majorStep;

      employerAxisState.minorStep =
        model.axisSpec.minorStep;

      displayedEmployerAxisTitle =
        axisTitle;

      employerAxisTitleTransition.active =
        false;

      employerAxisTitleTransition.progress =
        1;

      employerAxisTitleTransition.fromText =
        '';

      employerAxisTitleTransition.toText =
        '';

      employerChart.data.labels =
        model.labels;

      employerChart.data.datasets =
        model.datasets;

      employerChart.options.scales.x.max =
        employerAxisState.maximum;

      employerChart.options.layout.padding.right =
        45;

      employerChart.update(
        'none'
      );
    }

    function animateEmployerFamilyEntry(
      targetModel,
      _startMaximum,
      duration = CONFIG.employerTransitionMs
    ) {
      if (!targetModel) {
        return;
      }

      const targetAxis =
        targetModel.axisSpec;

      const zeroModel = {
        ...targetModel,

        datasets:
          targetModel.datasets.map(
            dataset => ({
              ...dataset,

              data:
                dataset.data.map(
                  () => 0
                )
            })
          )
      };

      zeroModel.axisSpec = {
        ...targetAxis
      };

      if (!employerChart) {
        createEmployerChart(
          zeroModel,
          false
        );
      } else {
        applyEmployerModelImmediately(
          zeroModel,
          getEmployerAxisTitle(
            targetModel.view
          )
        );
      }

      employerModel =
        targetModel;

      employerAxisState.maximum =
        targetAxis.maximum;

      employerAxisState.majorStep =
        targetAxis.majorStep;

      employerAxisState.minorStep =
        targetAxis.minorStep;

      employerChart.options.scales.x.max =
        targetAxis.maximum;

      const targetDatasets =
        targetModel.datasets.map(
          dataset =>
            dataset.data.map(
              value =>
                Number(value) || 0
            )
        );

      employerMeasureAnimator.cancel();

      employerMeasureAnimator.run({
        duration:
          PFF.reducedMotion()
            ? 0
            : duration,

        easing:
          easeOutCubic,

        onFrame(progress) {
          employerChart.data.datasets.forEach(
            (
              dataset,
              datasetIndex
            ) => {
              dataset.data =
                targetDatasets[
                  datasetIndex
                ].map(
                  value =>
                    value *
                    progress
                );
            }
          );

          employerChart.update(
            'none'
          );
        },

        onComplete() {
          employerModel =
            targetModel;

          employerChart.data.labels =
            targetModel.labels;

          employerChart.data.datasets =
            targetModel.datasets;

          employerAxisState.maximum =
            targetAxis.maximum;

          employerAxisState.majorStep =
            targetAxis.majorStep;

          employerAxisState.minorStep =
            targetAxis.minorStep;

          employerChart.options.scales.x.max =
            targetAxis.maximum;

          displayedEmployerAxisTitle =
            getEmployerAxisTitle(
              targetModel.view
            );

          employerChart.update(
            'none'
          );
        }
      });
    }

    function updateEmployerChart(animate = true) {
      const previousModel =
        employerModel;

      const rankedModel =
        buildEmployerModel(
          activeView
        );

      rankedModel.axisSpec =
        getEmployerAxisSpec(
          rankedModel.totals
        );

      const nextAxisTitle =
        getEmployerAxisTitle(
          activeView
        );

      if (!employerChart) {
        createEmployerChart(
          rankedModel,
          false
        );

        return;
      }

      const reduceMotion =
        PFF.reducedMotion();

      const chartVisible =
        employerCanvas
          .classList
          .contains(
            'is-visible'
          );

      if (
        !animate ||
        reduceMotion ||
        !chartVisible ||
        !previousModel
      ) {
        applyEmployerModelImmediately(
          rankedModel,
          nextAxisTitle
        );

        return;
      }

      /*
       * One continuous employer transition:
       * - category values change,
       * - the numeric x scale changes,
       * - employers move to their new descending positions,
       * - employer labels move with their bars,
       * - outlines/end labels follow the rendered bar geometry.
       *
       * There is deliberately no second cross-fade/rebuild phase.
       */
      const previousIndexByKey =
        new Map(
          previousModel.groups.map(
            (
              group,
              index
            ) => [
              group.key,
              index
            ]
          )
        );

      const startYByKey =
        captureEmployerYPositions(
          previousModel
        );

      const startDatasets =
        rankedModel.datasets.map(
          (
            _dataset,
            datasetIndex
          ) =>
            rankedModel.groups.map(
              group => {
                const previousIndex =
                  previousIndexByKey.get(
                    group.key
                  );

                if (
                  previousIndex ===
                  undefined
                ) {
                  return 0;
                }

                return (
                  Number(
                    previousModel
                      .datasets?.[
                        datasetIndex
                      ]
                      ?.data?.[
                        previousIndex
                      ]
                  ) ||
                  0
                );
              }
            )
        );

      const targetDatasets =
        rankedModel.datasets.map(
          dataset =>
            dataset.data.map(
              value =>
                Number(value) || 0
            )
        );

      const startAxis = {
        maximum:
          Number.isFinite(
            employerAxisState.maximum
          ) &&
          employerAxisState.maximum > 0
            ? employerAxisState.maximum
            : rankedModel
                .axisSpec
                .maximum,

        majorStep:
          employerAxisState.majorStep,

        minorStep:
          employerAxisState.minorStep
      };

      const targetAxis =
        rankedModel.axisSpec;

      const previousAxisTitle =
        displayedEmployerAxisTitle ||
        getEmployerAxisTitle(
          previousModel.view ||
          activeView
        );

      const wasInteractionLocked =
        interactionLocked;

      interactionLocked =
        true;

      employerChart.tooltip
        ?.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

      employerModel =
        rankedModel;

      employerChart.data.labels =
        rankedModel.labels;

      rankedModel.datasets.forEach(
        (
          nextDataset,
          datasetIndex
        ) => {
          const currentDataset =
            employerChart
              .data
              .datasets[
                datasetIndex
              ];

          if (!currentDataset) {
            employerChart
              .data
              .datasets[
                datasetIndex
              ] = {
                ...nextDataset,
                data:
                  startDatasets[
                    datasetIndex
                  ].slice()
              };

            return;
          }

          applyEmployerDatasetPresentation(
            currentDataset,
            nextDataset
          );

          currentDataset.data =
            startDatasets[
              datasetIndex
            ].slice();
        }
      );

      employerChart.data.datasets.length =
        rankedModel.datasets.length;

      employerReorderState.active =
        true;

      employerReorderState.progress =
        0;

      employerReorderState.fromYByKey =
        startYByKey;

      employerAxisState.maximum =
        startAxis.maximum;

      employerAxisState.majorStep =
        startAxis.maximum / 5;

      employerAxisState.minorStep =
        startAxis.maximum / 10;

      employerChart.options.scales.x.max =
        startAxis.maximum;

      animateEmployerAxisTitle(
        previousAxisTitle,
        nextAxisTitle,
        CONFIG.employerTransitionMs
      );

      updateViewControls();

      employerChart.update(
        'none'
      );

      employerMeasureAnimator.cancel();

      employerMeasureAnimator.run({
        duration:
          CONFIG.employerTransitionMs,

        easing:
          easeInOutCubic,

        onFrame(progress) {
          employerReorderState.progress =
            progress;

          employerChart
            .data
            .datasets
            .forEach(
              (
                dataset,
                datasetIndex
              ) => {
                const startValues =
                  startDatasets[
                    datasetIndex
                  ] ||
                  [];

                const targetValues =
                  targetDatasets[
                    datasetIndex
                  ] ||
                  [];

                dataset.data =
                  targetValues.map(
                    (
                      targetValue,
                      valueIndex
                    ) => {
                      const startValue =
                        startValues?.[
                          valueIndex
                        ] ??
                        0;

                      return (
                        startValue +
                        (
                          targetValue -
                          startValue
                        ) *
                        progress
                      );
                    }
                  );
              }
            );

          employerAxisState.maximum =
            startAxis.maximum +
            (
              targetAxis.maximum -
              startAxis.maximum
            ) *
            progress;

          employerAxisState.majorStep =
            employerAxisState.maximum /
            5;

          employerAxisState.minorStep =
            employerAxisState.maximum /
            10;

          employerChart.options.scales.x.max =
            employerAxisState.maximum;

          employerChart.update(
            'none'
          );
        },

        onComplete() {
          employerModel =
            rankedModel;

          employerChart.data.labels =
            rankedModel.labels;

          employerChart.data.datasets =
            rankedModel.datasets;

          employerAxisState.maximum =
            targetAxis.maximum;

          employerAxisState.majorStep =
            targetAxis.majorStep;

          employerAxisState.minorStep =
            targetAxis.minorStep;

          employerChart.options.scales.x.max =
            targetAxis.maximum;

          employerReorderState.active =
            false;

          employerReorderState.progress =
            1;

          employerReorderState.fromYByKey =
            new Map();

          employerChart.update(
            'none'
          );

          if (!wasInteractionLocked) {
            interactionLocked =
              false;

            updateViewControls();
          }
        }
      });
    }

    function copyFamilyChartArea(area) {
      if (!area) {
        return null;
      }

      const copy = {
        left: Number(area.left),
        right: Number(area.right),
        top: Number(area.top),
        bottom: Number(area.bottom)
      };

      return Object.values(copy).every(Number.isFinite)
        ? copy
        : null;
    }

    function interpolateFamilyChartArea(
      fromArea,
      toArea,
      progress
    ) {
      const from =
        copyFamilyChartArea(
          fromArea
        );

      const to =
        copyFamilyChartArea(
          toArea
        );

      if (!from || !to) {
        return to || from;
      }

      const p =
        clamp(
          progress,
          0,
          1
        );

      return {
        left:
          from.left +
          (
            to.left -
            from.left
          ) *
          p,

        right:
          from.right +
          (
            to.right -
            from.right
          ) *
          p,

        top:
          from.top +
          (
            to.top -
            from.top
          ) *
          p,

        bottom:
          from.bottom +
          (
            to.bottom -
            from.bottom
          ) *
          p
      };
    }

    function createFamilyAxisMorphLayer(
      initialArea
    ) {
      if (
        !chartShell ||
        !initialArea
      ) {
        return null;
      }

      const layer =
        document.createElement(
          'div'
        );

      layer.className =
        'family-axis-morph-layer';

      const xSpine =
        document.createElement(
          'span'
        );

      xSpine.className =
        'family-axis-morph-x';

      const ySpine =
        document.createElement(
          'span'
        );

      ySpine.className =
        'family-axis-morph-y';

      layer.appendChild(
        xSpine
      );

      layer.appendChild(
        ySpine
      );

      chartShell.appendChild(
        layer
      );

      setFamilyAxisMorphGeometry(
        layer,
        initialArea
      );

      return layer;
    }

    function setFamilyAxisMorphGeometry(
      layer,
      area
    ) {
      const geometry =
        copyFamilyChartArea(
          area
        );

      if (
        !layer ||
        !geometry
      ) {
        return;
      }

      const xSpine =
        layer.querySelector(
          '.family-axis-morph-x'
        );

      const ySpine =
        layer.querySelector(
          '.family-axis-morph-y'
        );

      if (xSpine) {
        xSpine.style.left =
          `${geometry.left}px`;

        xSpine.style.top =
          `${geometry.bottom}px`;

        xSpine.style.width =
          `${Math.max(
            0,
            geometry.right -
            geometry.left
          )}px`;
      }

      if (ySpine) {
        ySpine.style.left =
          `${geometry.left}px`;

        ySpine.style.top =
          `${geometry.top}px`;

        ySpine.style.height =
          `${Math.max(
            0,
            geometry.bottom -
            geometry.top
          )}px`;
      }
    }

    function setChartFamilyVisibility(showEmployer, animate = true, onComplete) {
      const duration =
        animate &&
        !PFF.reducedMotion()
          ? CONFIG.chartFamilyTransitionMs
          : 0;

      const incomingCanvas =
        showEmployer
          ? employerCanvas
          : chartCanvas;

      const outgoingCanvas =
        showEmployer
          ? chartCanvas
          : employerCanvas;

      const incomingChart =
        showEmployer
          ? employerChart
          : chart;

      const outgoingChart =
        showEmployer
          ? chart
          : employerChart;

      employerCanvas
        .classList
        .toggle(
          'is-visible',
          showEmployer
        );

      chartCanvas
        .classList
        .toggle(
          'is-hidden-family',
          showEmployer
        );

      incomingCanvas.style.pointerEvents =
        'none';

      outgoingCanvas.style.pointerEvents =
        'none';

      incomingCanvas.style.transform =
        'none';

      outgoingCanvas.style.transform =
        'none';

      const fromArea =
        copyFamilyChartArea(
          outgoingChart
            ?.chartArea
        );

      const toArea =
        copyFamilyChartArea(
          incomingChart
            ?.chartArea
        );

      if (
        duration <= 0 ||
        !fromArea ||
        !toArea
      ) {
        familySpineMorphActive =
          false;

        employerCanvas.style.opacity =
          showEmployer
            ? '1'
            : '0';

        chartCanvas.style.opacity =
          showEmployer
            ? '0'
            : '1';

        employerCanvas.style.pointerEvents =
          showEmployer
            ? 'auto'
            : 'none';

        chartCanvas.style.pointerEvents =
          showEmployer
            ? 'none'
            : 'auto';

        incomingChart?.draw();

        onComplete?.();
        return;
      }

      /*
       * Match the permanent-legacy animation:
       * the axis spines themselves are one continuous piece of geometry.
       * Only coordinates that actually change move. For example, when the
       * chart bottom is unchanged the x-axis remains on the same baseline
       * while its left/right endpoints reshape with the moving y-axis.
       *
       * Axis labels/ticks transition with their respective canvases, while
       * the shared black spines stay fully opaque throughout the morph.
       */
      const morphLayer =
        createFamilyAxisMorphLayer(
          fromArea
        );

      familySpineMorphActive =
        true;

      /*
       * Redraw once with each chart's own constant spine suppressed. This
       * prevents two static spines appearing underneath the shared morph.
       */
      outgoingChart?.draw();
      incomingChart?.draw();

      outgoingCanvas.style.opacity =
        '1';

      incomingCanvas.style.opacity =
        '0';

      chartFamilyAnimator.run({
        duration,

        easing:
          easeInOutCubic,

        onFrame(progress) {
          const geometry =
            interpolateFamilyChartArea(
              fromArea,
              toArea,
              progress
            );

          setFamilyAxisMorphGeometry(
            morphLayer,
            geometry
          );

          outgoingCanvas.style.opacity =
            String(
              1 -
              progress
            );

          incomingCanvas.style.opacity =
            String(
              progress
            );
        },

        onComplete() {
          familySpineMorphActive =
            false;

          morphLayer?.remove();

          employerCanvas.style.opacity =
            showEmployer
              ? '1'
              : '0';

          chartCanvas.style.opacity =
            showEmployer
              ? '0'
              : '1';

          employerCanvas.style.transform =
            'none';

          chartCanvas.style.transform =
            'none';

          employerCanvas.style.pointerEvents =
            showEmployer
              ? 'auto'
              : 'none';

          chartCanvas.style.pointerEvents =
            showEmployer
              ? 'none'
              : 'auto';

          incomingChart?.draw();

          onComplete?.();
        }
      });
    }

    function unlockAfterFamilyTransition(animate = true) {
      const delay =
        animate &&
        !PFF.reducedMotion()
          ? Math.max(
              0,
              CONFIG.employerTransitionMs -
              CONFIG.chartFamilyTransitionMs
            )
          : 0;

      window.setTimeout(
        () => {
          viewSwitchLocked =
            false;

          interactionLocked =
            false;

          updateViewControls();
        },
        delay
      );
    }

    function switchChartFamily(nextView, animate = true) {
      if (
        viewSwitchLocked ||
        interactionLocked
      ) {
        return;
      }

      const currentIsEmployer =
        isEmployerView(
          activeView
        );

      const nextIsEmployer =
        isEmployerView(
          nextView
        );

      if (
        !currentIsEmployer &&
        !nextIsEmployer
      ) {
        applyView(
          nextView,
          animate
        );

        return;
      }

      if (
        currentIsEmployer &&
        nextIsEmployer
      ) {
        viewSwitchLocked =
          true;

        interactionLocked =
          true;

        activeView =
          nextView;

        updateHeading(true);
        updateActiveTab();

        updateLegend(
          CATEGORY_CONFIG,
          true
        );

        updateViewControls();
        updateEmployerChart(
          animate
        );

        window.setTimeout(
          () => {
            viewSwitchLocked =
              false;

            interactionLocked =
              false;

            updateViewControls();
          },
          animate &&
          !PFF.reducedMotion()
            ? CONFIG.employerTransitionMs +
              40
            : 0
        );

        return;
      }

      viewSwitchLocked =
        true;

      interactionLocked =
        true;

      tooltipPinned =
        false;

      activeTooltipKey =
        '';

      if (nextIsEmployer) {
        const sourceMaximum =
          currentYAxisModel
            ?.maximum;

        activeView =
          nextView;

        const targetModel =
          buildEmployerModel(
            activeView
          );

        targetModel.axisSpec =
          getEmployerAxisSpec(
            targetModel.totals
          );

        animateEmployerFamilyEntry(
          targetModel,
          sourceMaximum,
          Math.min(
            900,
            CONFIG.employerTransitionMs
          )
        );

        updateHeading(true);
        updateActiveTab();

        updateLegend(
          CATEGORY_CONFIG,
          true
        );

        updateViewControls();

        setChartFamilyVisibility(
          true,
          animate,
          () => {
            unlockAfterFamilyTransition(
              animate
            );
          }
        );

        return;
      }

      const employerMaximum =
        employerAxisState.maximum;

      activeView =
        nextView;

      const model =
        buildViewModel(
          activeView
        );

      currentYAxisModel =
        model.yAxis;

      axisLabelOpacity =
        1;

      displayedYAxisTitleParts =
        getYAxisTitleParts(
          activeView
        );

      axisTitleTransition.active =
        false;

      axisTitleTransition.progress =
        1;

      axisTitleTransition.fromParts =
        null;

      axisTitleTransition.toParts =
        null;

      applyModelToChart(
        model,
        false
      );

      axisNumberTransition.fromMaximum =
        Number.isFinite(
          employerMaximum
        )
          ? employerMaximum
          : model.yAxis.maximum;

      axisNumberTransition.toMaximum =
        model.yAxis.maximum;

      axisNumberTransition.progress =
        animate &&
        !PFF.reducedMotion()
          ? 0
          : 1;

      if (
        animate &&
        !PFF.reducedMotion()
      ) {
        animateAxisMaximum(
          axisNumberTransition.fromMaximum,
          model.yAxis.maximum,
          Math.min(
            900,
            CONFIG.chartFamilyTransitionMs
          )
        );
      }

      updateHeading(true);
      updateActiveTab();

      updateLegend(
        model.legendItems,
        true
      );

      updateViewControls();

      setChartFamilyVisibility(
        false,
        animate,
        () => {
          unlockAfterFamilyTransition(
            animate
          );
        }
      );
    }

    function requestTabSwitch(nextTabView) {
      const currentTabView =
        activeView === 'affected'
          ? 'affected'
          : getMetricTabView(activeView);

      if (
        nextTabView === currentTabView ||
        interactionLocked ||
        viewSwitchLocked ||
        !VIEW_CONFIG[nextTabView]
      ) {
        return;
      }

      const nextInternalView =
        resolveInternalViewForMetric(
          nextTabView
        );

      switchChartFamily(
        nextInternalView,
        true
      );
    }

    function requestMetricViewMode(nextMode) {
      if (
        interactionLocked ||
        viewSwitchLocked ||
        !['overall', 'affected', 'employer'].includes(nextMode)
      ) {
        return;
      }

      const metricView =
        getMetricTabView(
          activeView
        );

      if (
        metricView !== 'cost' &&
        metricView !== 'time'
      ) {
        return;
      }

      const currentMode =
        getCurrentViewMode(
          activeView
        );

      if (nextMode === currentMode) {
        viewMenuController?.closeMenu();
        return;
      }

      viewModeByMetric[metricView] =
        nextMode;

      affectedOnlyByView[metricView] =
        nextMode === 'affected';

      viewMenuController?.closeMenu();

      if (nextMode === 'employer') {
        switchChartFamily(
          getEmployerViewForMetric(
            metricView
          ),
          true
        );

        return;
      }

      if (isEmployerView(activeView)) {
        switchChartFamily(
          metricView,
          true
        );

        return;
      }

      applyView(
        metricView,
        true,
        true,
        null,
        nextMode === 'affected'
      );
    }

    function updateHeadingScrollControls() {
      headingScroller?.update();
    }

    function updateLegendScrollControls() {
      legendController?.refresh();
    }

    function updateLegend(items, animate = true) {
      legendController?.update(
        (items || []).map(item => ({
          label: item.legendLabel || item.label,
          colour: item.colour,
          markerType: 'square'
        })),
        animate
      );
    }

    function updateTabScrollHints() {
      tabController?.update();
    }

    function updateTabIndicator() {
      tabController?.update();
    }

    function updateActiveTab() {
      const tabView =
        activeView === 'affected'
          ? 'affected'
          : getMetricTabView(activeView);

      tabController?.set(tabView, {
        notify: false
      });
    }

    tabController = PFF.setupTabs({
      tabList,
      tabs: chartTabs,
      valueAttribute: 'view',
      initialValue: activeView,
      controlled: true,
      leftButton: tabScrollLeft,
      rightButton: tabScrollRight,
      onRequest: requestTabSwitch
    });

    headingScroller = PFF.setupScrollableRegion({
      scroller: headingViewport,
      leftButton: headingScrollLeft,
      rightButton: headingScrollRight,
      minimum: 90
    });

    legendController = PFFCharts.setupDisplayLegend({
      legend: chartLegend,
      leftButton: legendScrollLeft,
      rightButton: legendScrollRight
    });

    viewMenuController = PFF.setupMenu({
      menu: viewControl,
      button: viewMenuButton,
      panel: viewMenuPanel,
      items: viewMenuItems
    });

    viewMenuItems.forEach(item => {
      item.addEventListener('click', () => {
        requestMetricViewMode(
          item.dataset.viewMode
        );
      });
    });

    totalToggleButton.addEventListener('click', () => {
      if (
        interactionLocked ||
        viewSwitchLocked ||
        !VIEW_CONFIG[activeView]?.supportsTotal
      ) {
        return;
      }

      const metricView =
        getMetricTabView(activeView);

      const nextTotalMode =
        !totalModeByView[metricView];

      totalModeByView[metricView] =
        nextTotalMode;

      if (isEmployerView(activeView)) {
        updateHeading(true);
        updateEmployerChart(true);
        updateViewControls();
        return;
      }

      applyView(
        activeView,
        true,
        true,
        nextTotalMode,
        null
      );
    });

    [chartCanvas, employerCanvas].forEach(canvas => {
      canvas.addEventListener('contextmenu', event => {
        event.preventDefault();
      });

      canvas.addEventListener('selectstart', event => {
        event.preventDefault();
      });
    });

    chartCanvas.addEventListener('mouseleave', () => {
      if (!chart) {
        return;
      }

      chart.canvas.style.cursor = 'default';

      if (tooltipPinned) {
        return;
      }

      activeTooltipKey = '';
      chart.tooltip?.setActiveElements([], { x: 0, y: 0 });
      chart.tooltip?.update(true);
      chart.draw();
    });

    document.addEventListener('pointerdown', event => {
      if (
        !event.target.closest('#lossWorkChart') &&
        !event.target.closest('#employerWorkChart') &&
        chart
      ) {
        tooltipPinned = false;
        activeTooltipKey = '';
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.tooltip.update(true);
        chart.draw();
      }
    });

    function refreshResponsiveLayout() {
      if (responsiveLayoutFrame !== null) {
        cancelAnimationFrame(responsiveLayoutFrame);
      }

      responsiveLayoutFrame = requestAnimationFrame(() => {
        responsiveLayoutFrame = null;

        if (isEmployerView(activeView)) {
          updateEmployerChart(false);
          employerChart?.resize();
          employerChart?.update('none');
        } else if (chart) {
          const model = buildViewModel(activeView);
          currentYAxisModel = model.yAxis;
          axisNumberTransition.fromMaximum = model.yAxis.maximum;
          axisNumberTransition.toMaximum = model.yAxis.maximum;
          axisNumberTransition.progress = 1;
          axisLabelOpacity = 1;
          displayedYAxisTitleParts = getYAxisTitleParts(activeView);
          axisTitleTransition.active = false;
          axisTitleTransition.progress = 1;
          axisTitleTransition.fromParts = null;
          axisTitleTransition.toParts = null;
          applyModelToChart(model, false);
          chart.resize();
          chart.update('none');
          updateLegend(model.legendItems, false);
          updateViewControls();
        }

        updateTabIndicator(false);
        updateHeadingScrollControls();
        updateLegendScrollControls();
      });
    }

    const responsiveController = PFFCharts.createResponsiveController({
      getChart: () => isEmployerView(activeView) ? employerChart : chart,
      observe: [app, chartShell, headingViewport],
      applyResponsiveChartOptions: false,
      onRefresh: refreshResponsiveLayout
    });

    function setStatus(message = '') {
      PFF.setStatus(message, statusElement);
    }

    function hideLoadingState() {
      PFF.hideLoadingState(app);
      refreshResponsiveLayout();
    }

    async function loadDashboard() {
      try {
        setStatus();

        sourceRows =
          await loadSourceRowsWithFallback();

        const resolved = resolveAnalysisWindow(sourceRows);
        analysisWindow = resolved.window;
        rows = resolved.rows.map(calculateRowMetrics);

        if (!rows.length) {
          throw new Error(
            `No responses were found in ${analysisWindow.label}`
          );
        }

        const initialModel = buildViewModel(activeView);
        const hasAnyMetric = initialModel.datasets.some(dataset =>
          dataset.datasetRole === 'summary' && dataset.data.length
        );

        if (!hasAnyMetric) {
          throw new Error(
            'No valid BI:BL loss-work responses were found for the selected financial year'
          );
        }

        updateHeading(false);
        updateViewControls();

        hideLoadingState();
        createChart();
        updateTabIndicator(false);
        setStatus();

        requestAnimationFrame(() => {
          if (!chart) {
            return;
          }

          chart.resize();
          chart.update('none');
        });
      } catch (error) {
        console.error(error);
        PFF.setDataSourceIndicator('none', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });
        hideLoadingState();

        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load work loss data'
          ).replace(/\.+$/, '')
        );
      }
    }

    updateTabIndicator(false);
    loadDashboard();
  </script>
</body>
</html>
