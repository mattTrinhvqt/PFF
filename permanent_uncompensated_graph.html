<!DOCTYPE html>
<!-- Latest requested version: 2026-08-07 v7; fade-only titles, single-line heading scroll, tracker-matched toggle ticks, dynamic response counts -->
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Work Loss</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;

      --meal: #f28e2b;
      --tea: #2ca58d;
      --outside: #5a3be7;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 0;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .module-top {
      position: relative;
      display: flex;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 4px;
    }

    .module-top::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 1;
      height: 1px;
      background: var(--track);
      pointer-events: none;
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 4;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translateX(var(--tab-indicator-x, 0px));
      transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        width 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: none;
    }

    .tab-scroll-arrow {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: none;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding-bottom: 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .tab-scroll-arrow-left {
      left: 0;
    }

    .tab-scroll-arrow-right {
      right: 0;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    .chart-heading-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-height: 31px;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin: 0;
    }

    .heading-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      height: 31px;
      overflow: hidden;
    }

    .heading-viewport {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }

    .heading-viewport::-webkit-scrollbar {
      display: none;
    }

    .chart-heading {
      display: flex;
      width: max-content;
      min-width: max-content;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: 0.28em;
      margin: 0;
      padding: 4px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
      will-change: opacity;
    }

    .chart-heading-part {
      display: inline-block;
      flex: 0 0 auto;
    }

    .chart-heading-part:empty {
      display: none;
    }

    .heading-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 160ms ease;
    }

    .heading-scroll-button:hover {
      opacity: 1;
    }

    .heading-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .heading-scroll-left {
      left: 0;
    }

    .heading-scroll-right {
      right: 0;
    }

    .chart-toggle-group {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .chart-toggle-group.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .chart-toggle-button {
      display: grid;
      flex: 0 0 auto;
      grid-template-columns: 15px max-content 24px;
      width: max-content;
      min-height: 31px;
      min-width: 0;
      align-items: center;
      gap: 4px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease;
    }

    .chart-toggle-button:hover:not(:disabled) {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .chart-toggle-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .chart-toggle-button.is-active {
      border-color: var(--purple);
    }

    .chart-toggle-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      flex: 0 0 15px;
      align-self: center;
      justify-self: center;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .chart-toggle-button.is-active .chart-toggle-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .chart-toggle-button.is-active .chart-toggle-indicator::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .chart-toggle-label {
      color: var(--ink);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.05;
      text-align: left;
    }

    .chart-toggle-value {
      display: inline-block;
      width: 24px;
      min-width: 24px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.025em;
      line-height: 1;
      text-align: right;
    }

    .chart-toggle-button.is-active .chart-toggle-value {
      color: var(--purple);
    }

    .chart-toggle-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .chart-options-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 1;
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .legend-square {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border: 1px solid transparent;
    }

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -2px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }


    #lossWorkChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 0;
      }

      .tab-scroll-arrow {
        display: inline-flex;
      }

      .tab-scroll-shell.can-scroll-left .tab-scroll-arrow-left,
      .tab-scroll-shell.can-scroll-right .tab-scroll-arrow-right {
        opacity: 0.72;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row,
      .heading-scroll-shell {
        min-height: 30px;
        height: 30px;
      }

      .chart-heading {
        padding-top: 4px;
        font-size: 14px;
        line-height: 21px;
      }

      .chart-toggle-button {
        grid-template-columns: 15px max-content 22px;
        width: max-content;
        min-width: 0;
        min-height: 29px;
        padding-right: 4px;
        padding-left: 4px;
        font-size: 10px;
      }

      .chart-toggle-label,
      .chart-toggle-value {
        font-size: 9px;
      }

    }

    @media (max-width: 350px) {
      .chart-heading {
        font-size: 13px;
      }

      .chart-toggle-button {
        grid-template-columns: 15px max-content 20px;
        width: max-content;
        min-width: 0;
        padding-right: 3px;
        padding-left: 3px;
        font-size: 9px;
      }

      .chart-tab {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading work loss data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading work loss data...</div>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div
            class="tab-list"
            role="tablist"
            aria-label="Work loss views"
          >
            <button class="chart-tab is-active" type="button" role="tab" data-view="cost" aria-selected="true">$ loss</button>
            <button class="chart-tab" type="button" role="tab" data-view="time" aria-selected="false">Time loss</button>
            <button class="chart-tab" type="button" role="tab" data-view="affected" aria-selected="false"># affected</button>
          </div>

          <span class="tab-scroll-arrow tab-scroll-arrow-left" aria-hidden="true">‹</span>
          <span class="tab-scroll-arrow tab-scroll-arrow-right" aria-hidden="true">›</span>
        </div>

        <div class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span>LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll chart title left"
          >&#8249;</button>

          <div id="headingViewport" class="heading-viewport">
            <h2 id="chartHeading" class="chart-heading" aria-live="polite">
              <span id="chartHeadingLead" class="chart-heading-part">$</span><span id="chartHeadingShared" class="chart-heading-part">loss</span><span id="chartHeadingTail" class="chart-heading-part">per optom</span><span id="chartHeadingYear" class="chart-heading-part"></span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll chart title right"
          >&#8250;</button>
        </div>

        <div id="chartToggleGroup" class="chart-toggle-group">
          <button
            id="affectedToggleButton"
            class="chart-toggle-button"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Show affected optoms"
          >
            <span class="chart-toggle-indicator" aria-hidden="true"></span>
            <span class="chart-toggle-label">Affected optoms</span>
            <span class="chart-toggle-value">OFF</span>
          </button>

          <button
            id="totalToggleButton"
            class="chart-toggle-button"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Show total instead of the median per optom"
          >
            <span class="chart-toggle-indicator" aria-hidden="true"></span>
            <span class="chart-toggle-label">Total</span>
            <span class="chart-toggle-value">OFF</span>
          </button>
        </div>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >&#8249;</button>

          <div id="legendViewport" class="legend-viewport">
            <div id="chartLegend" class="chart-legend" aria-label="Chart legend"></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >&#8250;</button>
        </div>
      </div>

      <div class="chart-shell">
        <canvas
          id="lossWorkChart"
          aria-label="Work loss chart"
          tabindex="-1"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    const CONFIG = {
      sheetId: '1D4EoCMnH_RbwbuzFtw92NOwnvR_r9zQV7dAaXtfnnd0',
      sheetName: 'Data',
      range: 'A:BP',
      fetchTimeoutMs: 20000,

      transitionMs: 1050,
      axisFadeOutMs: 170,
      axisFadeInMs: 300,

      pointRadius: 2.7,
      pointHoverRadius: 4.4,
      pointOpacity: 0.20,
      pointHoverOpacity: 0.68,
      medianLineWidth: 6,

      minimumFteSalary: 30000,
      maximumFteSalary: 500000,

      calculation: {
        fullTimeHoursPerWeek: 38,
        fullTimeDaysPerWeek: 5,
        weeksPerYear: 52,
        fourWeekCyclesPerYear: 13,
        mealBreakMinutesPerDay: 30,
        teaBreakMinutesPerDay: 10
      }
    };

    const VIEW_CONFIG = {
      cost: {
        tabLabel: '$ loss',
        kind: 'currency',
        metric: 'cost',
        supportsTotal: true,
        supportsAffected: true,
        yTitle: '$ loss per optom (FTE $/year)',
        affectedYTitle: '$ loss per optom (FTE $/year)',
        totalYTitle: 'Total $ loss (FTE $/year)',
        affectedTotalYTitle: 'Total $ loss (FTE $/year)'
      },
      time: {

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function toNumber(value) {
      if (typeof value === 'number' && Number.isFinite(value)) {
        return value;
      }

      const cleaned = cleanText(value)
        .replace(/[$,%]/g, '')
        .replace(/[^\d.-]/g, '');

      if (!cleaned || !/\d/.test(cleaned)) {
        return NaN;
      }

      const number = Number(cleaned);
      return Number.isFinite(number) ? number : NaN;
    }

    function getCellValue(cell) {
      return cell?.v ?? cell?.f ?? '';
    }

    function parsePercentCell(cell) {
      const formatted = cleanText(cell?.f);

      if (formatted.includes('%')) {
        const number = toNumber(formatted);
        return Number.isFinite(number)
          ? clamp(number, 0, 100)
          : NaN;
      }

      const number = toNumber(cell?.v ?? cell?.f);

      if (!Number.isFinite(number)) {
        return NaN;
      }

      const percentage = number > 0 && number < 1
        ? number * 100
        : number;

      return clamp(percentage, 0, 100);
    }

    function parseDate(value) {
      if (
        typeof value === 'number' &&
        value > 20000 &&
        value < 80000
      ) {
        return Date.UTC(1899, 11, 30) + value * DAY_MS;
      }

      const text = cleanText(value);

      if (!text) {
        return null;
      }

      const googleDate = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/
      );

      if (googleDate) {
        return Date.UTC(
          Number(googleDate[1]),
          Number(googleDate[2]),
          Number(googleDate[3])
        );
      }

      const auDate = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})/
      );

      if (auDate) {
        let year = Number(auDate[3]);

        if (year < 100) {
          year += 2000;
        }

        return Date.UTC(
          year,
          Number(auDate[2]) - 1,
          Number(auDate[1])
        );
      }

      const isoDate = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
      );

      if (isoDate) {
        return Date.UTC(
          Number(isoDate[1]),
          Number(isoDate[2]) - 1,
          Number(isoDate[3])
        );
      }

      const parsed = new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          );
    }

    function percentile(sortedValues, probability) {
      if (!sortedValues.length) {
        return NaN;
      }

      const index = (sortedValues.length - 1) * probability;
      const lowerIndex = Math.floor(index);
      const upperIndex = Math.ceil(index);

      if (lowerIndex === upperIndex) {
        return sortedValues[lowerIndex];
      }

      return (
        sortedValues[lowerIndex] +
        (
          sortedValues[upperIndex] -
          sortedValues[lowerIndex]
        ) *
        (index - lowerIndex)
      );
    }

    function calculateStatistics(values) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort((first, second) => first - second);

      const sum = sorted.reduce(
        (total, value) => total + value,
        0
      );

      return {
        count: sorted.length,
        median: percentile(sorted, 0.5),
        q1: percentile(sorted, 0.25),
        q3: percentile(sorted, 0.75),
        mean: sorted.length ? sum / sorted.length : NaN,
        sum,
        minimum: sorted.length ? sorted[0] : NaN,
        maximum: sorted.length ? sorted[sorted.length - 1] : NaN
      };
    }

    function formatNumber(value, maximumFractionDigits = 1) {
      return Number.isFinite(Number(value))
        ? new Intl.NumberFormat('en-AU', {
            maximumFractionDigits
          }).format(Number(value))
        : '—';
    }

    function formatCurrency(value, maximumFractionDigits = 0) {
      return Number.isFinite(Number(value))
        ? new Intl.NumberFormat('en-AU', {
            style: 'currency',
            currency: 'AUD',
            minimumFractionDigits: 0,
            maximumFractionDigits
          }).format(Number(value))
        : '—';
    }

    function formatPercentage(value, maximumFractionDigits = 1) {
      return Number.isFinite(Number(value))
        ? `${formatNumber(value, maximumFractionDigits)}%`
        : '—';
    }

    function formatDate(timestamp) {
      return Number.isFinite(Number(timestamp))
        ? new Intl.DateTimeFormat('en-AU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            timeZone: 'UTC'
          }).format(new Date(timestamp))
        : 'Unspecified';
    }

    function formatAxisNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return '';
      }

      const absolute = Math.abs(number);

      if (absolute >= 1000000) {
        return `${formatNumber(number / 1000000, 1)}m`;
      }

      if (absolute >= 1000) {
        return `${formatNumber(number / 1000, absolute >= 10000 ? 0 : 1)}k`;
      }

      return formatNumber(
        number,
        absolute < 10 && Math.abs(number - Math.round(number)) > 0.001
          ? 1
          : 0
      );
    }

    function formatFinancialYear(startYear) {
      return `FY${startYear}–${String(startYear + 1).slice(-2)}`;
    }

    function getCurrentFinancialYearWindow() {
      const parts = new Intl.DateTimeFormat('en-AU', {
        timeZone: 'Australia/Sydney',
        year: 'numeric',
        month: 'numeric'
      }).formatToParts(new Date());

      const year = Number(
        parts.find(part => part.type === 'year')?.value
      );

      const month = Number(
        parts.find(part => part.type === 'month')?.value
      );

      const startYear = month >= 7
        ? year
        : year - 1;

      return {
        startYear,
        start: Date.UTC(startYear, 6, 1),
        end: Date.UTC(startYear + 1, 6, 1),
        label: formatFinancialYear(startYear)
      };
    }

    function resolveAnalysisWindow(allRows) {
      const current = getCurrentFinancialYearWindow();

      return {
        window: current,
        rows: allRows.filter(row =>
          Number.isFinite(row.date) &&
          row.date >= current.start &&
          row.date < current.end
        )
      };
    }

    function rgba(colour, opacity) {
      const match = String(colour || '')
        .trim()
        .match(/^#([0-9a-f]{6})$/i);

      if (!match) {
        return `rgba(119, 119, 119, ${opacity})`;
      }

      const digits = match[1];

      return `rgba(${parseInt(digits.slice(0, 2), 16)}, ${parseInt(
        digits.slice(2, 4),
        16
      )}, ${parseInt(digits.slice(4, 6), 16)}, ${opacity})`;
    }

    function easeOutCubic(progress) {
      return 1 - Math.pow(1 - progress, 3);
    }

    function easeInOutCubic(progress) {
      return progress < 0.5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;
    }

    function animateOpacityState({
      frameKey,
      from,
      to,
      duration,
      setOpacity,
      onComplete
    }) {
      if (frameKey.value !== null) {
        cancelAnimationFrame(frameKey.value);
        frameKey.value = null;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (reduceMotion || duration <= 0) {
        setOpacity(to);
        chart?.draw();
        onComplete?.();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const rawProgress = Math.min(
          (now - startedAt) / duration,
          1
        );

        const progress = easeOutCubic(rawProgress);
        setOpacity(from + (to - from) * progress);
        chart?.draw();

        if (rawProgress < 1) {
          frameKey.value = requestAnimationFrame(frame);
        } else {
          frameKey.value = null;
          setOpacity(to);
          chart?.draw();
          onComplete?.();
        }
      }

      frameKey.value = requestAnimationFrame(frame);
    }

    function animateAxisLabelOpacity(from, to, duration, onComplete) {
      const frameKey = {
        get value() {
          return axisLabelFadeFrame;
        },
        set value(nextValue) {
          axisLabelFadeFrame = nextValue;
        }
      };

      animateOpacityState({

        from,

        duration,
        setOpacity(value) {

        },
        onComplete
      });

    function sameTitleParts(firstParts, secondParts) {

    function animateYAxisTitleParts(fromParts, toParts, duration = 660) {
      if (axisTitleFrame !== null) {

      axisTitleTransition.active = true;

      axisTitleTransition.toParts = toParts;

      const startedAt = performance.now();

      function frame(now) {
        const rawProgress = Math.min(
          (now - startedAt) / duration,
          1
        );

        axisTitleTransition.progress = rawProgress;
        chart?.draw();

        if (rawProgress < 1) {
          axisTitleFrame = requestAnimationFrame(frame);
        } else {
          axisTitleFrame = null;
          axisTitleTransition.active = false;
          axisTitleTransition.progress = 1;
          axisTitleTransition.fromParts = null;
          axisTitleTransition.toParts = null;
          chart?.draw();

      axisTitleFrame = requestAnimationFrame(frame);

    function animateAxisMaximum(fromMaximum, toMaximum, duration) {
      if (axisNumberFrame !== null) {
        cancelAnimationFrame(axisNumberFrame);
        axisNumberFrame = null;
      }

      axisNumberTransition.fromMaximum = Number.isFinite(fromMaximum)
        ? fromMaximum
        : toMaximum;
      axisNumberTransition.toMaximum = Number.isFinite(toMaximum)
        ? toMaximum
        : fromMaximum;
      axisNumberTransition.progress = 0;

      const reduceMotion = window.matchMedia(

      if (reduceMotion || duration <= 0) {
        axisNumberTransition.progress = 1;

      const startedAt = performance.now();

      function frame(now) {
        const rawProgress = Math.min(

        axisNumberTransition.progress = easeInOutCubic(rawProgress);
        chart?.draw();

        if (rawProgress < 1) {
          axisNumberFrame = requestAnimationFrame(frame);
        } else {

          axisNumberTransition.progress = 1;
          chart?.draw();
        }
      }

      axisNumberFrame = requestAnimationFrame(frame);
    }

    function getAnimatedAxisMaximum() {
