  <script>
    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    const CONFIG = {

      sheetName: 'Data',

        fourWeekCyclesPerYear: 13,

      }

    const VIEW_CONFIG = {

        summaryType: 'median',
        note: 'Horizontal bars show the median among affected respondents'
      },

        tabLabel: 'Time loss',
        heading: 'median time loss',
        yTitle: 'Time loss (FTE hours/year)',
        kind: 'hours',
        summaryType: 'median',
        note: 'Horizontal bars show the median annual time loss'
      }
    };

    const CATEGORY_CONFIG = [
      {
        key: 'meal',
        label: 'Work during meal break',
        shortLabel: 'Meal break',
        colour: '#f28e2b',
        x: 0
      },
      {
        key: 'tea',
        label: 'Work during tea break',
        shortLabel: 'Tea break',
        colour: '#2ca58d',
        x: 1
      },
      {
        key: 'outside',
        label: 'Work outside rostered hours',
        shortLabel: 'Outside roster',
        colour: '#5a3be7',
        x: 2
      }
    ];

    const CATEGORY_BY_KEY = new Map(
      CATEGORY_CONFIG.map(category => [category.key, category])
    );

    const DAY_MS = 86400000;

    const app = document.getElementById('app');
    const loadingState = document.getElementById('loadingState');
    const statusElement = document.getElementById('status');
    const chartHeadingDetail = document.getElementById('chartHeadingDetail');
    const chartNote = document.getElementById('chartNote');
    const tabScrollShell = document.querySelector('.tab-scroll-shell');
    const tabList = document.querySelector('.tab-list');
    const chartTabs = [...document.querySelectorAll('.chart-tab')];
    const tabByView = new Map(chartTabs.map(tab => [tab.dataset.view, tab]));
    const legendViewport = document.getElementById('legendViewport');
    const chartLegend = document.getElementById('chartLegend');
    const legendScrollLeft = document.getElementById('legendScrollLeft');
    const legendScrollRight = document.getElementById('legendScrollRight');
    const chartShell = document.querySelector('.chart-shell');
    const chartCanvas = document.getElementById('uncompensatedWorkChart');

    let sourceRows = [];
    let rows = [];
    let chart = null;
    let activeView = 'medianCost';
    let analysisWindow = null;
    let interactionLocked = false;
    let viewSwitchLocked = false;
    let responsiveLayoutFrame = null;
    let axisFadeFrame = null;
    let axisNumberFrame = null;
    let viewUnlockTimer = null;
    let currentYAxisModel = null;
    let currentLegendSignature = '';
    let legendAnimationToken = 0;
    let axisFadeOpacity = 1;
    let activeTooltipKey = '';

    const axisNumberTransition = {
      fromMaximum: 1,
      toMaximum: 1,
      progress: 1
    };

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function toNumber(value) {
      if (typeof value === 'number' && Number.isFinite(value)) {
        return value;
      }

      const cleaned = cleanText(value)
        .replace(/[$,%]/g, '')
        .replace(/[^\d.-]/g, '');

      if (!cleaned || !/\d/.test(cleaned)) {
        return NaN;
      }

      const number = Number(cleaned);
      return Number.isFinite(number) ? number : NaN;
    }

    function getCellValue(cell) {
      return cell?.v ?? cell?.f ?? '';
    }

    function parsePercentCell(cell) {
      const formatted = cleanText(cell?.f);

      if (formatted.includes('%')) {
        const number = toNumber(formatted);
        return Number.isFinite(number)
          ? clamp(number, 0, 100)
          : NaN;
      }

      const number = toNumber(cell?.v ?? cell?.f);

      if (!Number.isFinite(number)) {
        return NaN;
      }

      const percentage = number > 0 && number < 1
        ? number * 100
        : number;

      return clamp(percentage, 0, 100);
    }

    function parseDate(value) {
      if (
        typeof value === 'number' &&
        value > 20000 &&
        value < 80000
      ) {
        return Date.UTC(1899, 11, 30) + value * DAY_MS;
      }

      const text = cleanText(value);

      if (!text) {
        return null;
      }

      const googleDate = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/
      );

      if (googleDate) {
        return Date.UTC(
          Number(googleDate[1]),
          Number(googleDate[2]),
          Number(googleDate[3])
        );
      }

      const auDate = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})/
      );

      if (auDate) {
        let year = Number(auDate[3]);

        if (year < 100) {
          year += 2000;
        }

        return Date.UTC(
          year,
          Number(auDate[2]) - 1,
          Number(auDate[1])
        );
      }

      const isoDate = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
      );

      if (isoDate) {
        return Date.UTC(
          Number(isoDate[1]),
          Number(isoDate[2]) - 1,
          Number(isoDate[3])
        );
      }

      const parsed = new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          );
    }

    function percentile(sortedValues, probability) {
      if (!sortedValues.length) {
        return NaN;
      }

      const index = (sortedValues.length - 1) * probability;
      const lowerIndex = Math.floor(index);
      const upperIndex = Math.ceil(index);

      if (lowerIndex === upperIndex) {
        return sortedValues[lowerIndex];
      }

      return (
        sortedValues[lowerIndex] +
        (
          sortedValues[upperIndex] -
          sortedValues[lowerIndex]
        ) *
        (index - lowerIndex)
      );
    }

    function calculateStatistics(values) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort((first, second) => first - second);

      const sum = sorted.reduce(
        (total, value) => total + value,
        0
      );

      return {
        count: sorted.length,
        median: percentile(sorted, 0.5),
        q1: percentile(sorted, 0.25),
        q3: percentile(sorted, 0.75),
        mean: sorted.length ? sum / sorted.length : NaN,
        sum,
        minimum: sorted.length ? sorted[0] : NaN,
        maximum: sorted.length ? sorted[sorted.length - 1] : NaN
      };
    }

    function formatNumber(value, maximumFractionDigits = 1) {
      return Number.isFinite(Number(value))
        ? new Intl.NumberFormat('en-AU', {
            maximumFractionDigits
          }).format(Number(value))
        : '—';
    }

    function formatCurrency(value, maximumFractionDigits = 0) {
      return Number.isFinite(Number(value))
        ? new Intl.NumberFormat('en-AU', {
            style: 'currency',
            currency: 'AUD',
            minimumFractionDigits: 0,
            maximumFractionDigits
          }).format(Number(value))
        : '—';
    }

    function formatPercentage(value, maximumFractionDigits = 1) {
      return Number.isFinite(Number(value))
        ? `${formatNumber(value, maximumFractionDigits)}%`
        : '—';
    }

    function formatHours(value, maximumFractionDigits = 1) {
      return Number.isFinite(Number(value))
        ? `${formatNumber(value, maximumFractionDigits)} hours`
        : '—';
    }

    function formatDate(timestamp) {
      return Number.isFinite(Number(timestamp))
        ? new Intl.DateTimeFormat('en-AU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            timeZone: 'UTC'
          }).format(new Date(timestamp))
        : 'Unspecified';
    }

    function formatAxisNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return '';
      }

      const absolute = Math.abs(number);

      if (absolute >= 1000000) {
        return `${formatNumber(number / 1000000, 1)}m`;
      }

      if (absolute >= 1000) {
        return `${formatNumber(number / 1000, absolute >= 10000 ? 0 : 1)}k`;
      }

      return formatNumber(
        number,
        absolute < 10 && Math.abs(number - Math.round(number)) > 0.001
          ? 1
          : 0
      );
    }

    function formatFinancialYear(startYear) {
      return `FY${startYear}-${String(startYear + 1).slice(-2)}`;
    }

    function getFinancialYearStartYear(timestamp) {
      const date = new Date(timestamp);
      const year = date.getUTCFullYear();
      const month = date.getUTCMonth();
      return month >= 6 ? year : year - 1;
    }

    function getCurrentFinancialYearWindow() {
      const now = new Date();
      const startYear = now.getMonth() >= 6
        ? now.getFullYear()
        : now.getFullYear() - 1;

      return {
        startYear,
        start: Date.UTC(startYear, 6, 1),
        end: Date.UTC(startYear + 1, 6, 1),
        label: formatFinancialYear(startYear),
        isFallback: false
      };
    }

    function resolveAnalysisWindow(allRows) {
      const current = getCurrentFinancialYearWindow();
      const currentRows = allRows.filter(row =>
        Number.isFinite(row.date) &&
        row.date >= current.start &&
        row.date < current.end
      );

      if (currentRows.length) {
        return {
          window: current,
          rows: currentRows,
          warning: ''
        };
      }

      const availableStartYears = allRows
        .map(row => Number.isFinite(row.date)
          ? getFinancialYearStartYear(row.date)
          : null
        )
        .filter(Number.isFinite);

      if (!availableStartYears.length) {
        return {
          window: current,
          rows: [],
          warning: ''
        };
      }

      const startYear = Math.max(...availableStartYears);
      const fallback = {
        startYear,
        start: Date.UTC(startYear, 6, 1),
        end: Date.UTC(startYear + 1, 6, 1),
        label: formatFinancialYear(startYear),
        isFallback: true
      };

      return {
        window: fallback,
        rows: allRows.filter(row =>
          Number.isFinite(row.date) &&
          row.date >= fallback.start &&
          row.date < fallback.end
        ),
        warning:
          `No responses were found in ${current.label}; showing ${fallback.label}`
      };
    }

    function rgba(colour, opacity) {
      const match = String(colour || '')
        .trim()
        .match(/^#([0-9a-f]{6})$/i);

      if (!match) {
        return `rgba(119, 119, 119, ${opacity})`;
      }

      const digits = match[1];

      return `rgba(${parseInt(digits.slice(0, 2), 16)}, ${parseInt(
        digits.slice(2, 4),
        16
      )}, ${parseInt(digits.slice(4, 6), 16)}, ${opacity})`;
    }

    function easeOutCubic(progress) {
      return 1 - Math.pow(1 - progress, 3);
    }

    function easeInOutCubic(progress) {
      return progress < 0.5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;
    }

    function animateAxisOpacity(from, to, duration, onComplete) {
      if (axisFadeFrame !== null) {
        cancelAnimationFrame(axisFadeFrame);
        axisFadeFrame = null;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (reduceMotion || duration <= 0) {
        axisFadeOpacity = to;
        chart?.draw();
        onComplete?.();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const rawProgress = Math.min(
          (now - startedAt) / duration,
          1
        );

        const progress = easeOutCubic(rawProgress);
        axisFadeOpacity = from + (to - from) * progress;
        chart?.draw();

        if (rawProgress < 1) {
          axisFadeFrame = requestAnimationFrame(frame);
        } else {
          axisFadeFrame = null;
          axisFadeOpacity = to;
          chart?.draw();
          onComplete?.();
        }
      }

      axisFadeFrame = requestAnimationFrame(frame);
    }

    function animateAxisMaximum(fromMaximum, toMaximum, duration) {
      if (axisNumberFrame !== null) {
        cancelAnimationFrame(axisNumberFrame);
        axisNumberFrame = null;
      }

      axisNumberTransition.fromMaximum = Number.isFinite(fromMaximum)
        ? fromMaximum
        : toMaximum;
      axisNumberTransition.toMaximum = Number.isFinite(toMaximum)
        ? toMaximum
        : fromMaximum;
      axisNumberTransition.progress = 0;

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (reduceMotion || duration <= 0) {
        axisNumberTransition.progress = 1;
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const rawProgress = Math.min(
          (now - startedAt) / duration,
          1
        );

        axisNumberTransition.progress = easeInOutCubic(rawProgress);
        chart?.draw();

        if (rawProgress < 1) {
          axisNumberFrame = requestAnimationFrame(frame);
        } else {
          axisNumberFrame = null;
          axisNumberTransition.progress = 1;
          chart?.draw();
        }
      }

      axisNumberFrame = requestAnimationFrame(frame);
    }

    function getAnimatedAxisMaximum() {
      return (
        axisNumberTransition.fromMaximum +
        (
          axisNumberTransition.toMaximum -
          axisNumberTransition.fromMaximum
        ) *
        axisNumberTransition.progress
      );
    }

    function loadSheetRows() {
      return new Promise((resolve, reject) => {
        const callbackName =
          `pffUncompensatedWorkCallback_${Date.now()}_${Math.floor(
            Math.random() * 1000000
          )}`;

        const script = document.createElement('script');
        let settled = false;

        const timeout = window.setTimeout(() => {
          finish(new Error('Could not load Google Sheet data'));
        }, CONFIG.fetchTimeoutMs);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }

          script.remove();
        }

        function finish(error, response) {
          if (settled) {
            return;
          }

          settled = true;
          cleanup();

          if (error) {
            reject(error);
            return;
          }

          if (!response || response.status === 'error') {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                'Could not load Google Sheet data'
              )
            );
            return;
          }

          resolve(response?.table?.rows || []);
        }

        window[callbackName] = response => finish(null, response);
        script.onerror = () => finish(
          new Error('Network error loading Google Sheet data')
        );

        const params = new URLSearchParams({
          sheet: CONFIG.sheetName,
          range: CONFIG.range,
          headers: '1',
          tq: 'select A,W,AN,BI,BJ,BK,BL,BM,BN,BO,BP where A is not null',
          tqx: `responseHandler:${callbackName}`,
          _: String(Date.now())
        });

        script.src =
          `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?` +
          params.toString();

        document.body.appendChild(script);
      });
    }

    function normaliseRows(rawRows) {
      return rawRows
        .map((rawRow, sourceIndex) => {
          const cells = rawRow?.c || [];

          return {
            sourceIndex,
            date: parseDate(cells[0]?.v) ?? parseDate(cells[0]?.f),
            fteSalary: toNumber(getCellValue(cells[1])),
            hoursPerWeek: toNumber(getCellValue(cells[2])),
            mealReportedPercent: parsePercentCell(cells[3]),
            teaReportedPercent: parsePercentCell(cells[4]),
            outsideMinutesPerFourWeeks: toNumber(getCellValue(cells[5])),
            outsideCompensatedPercent: parsePercentCell(cells[6]),
            sheetMealCost: toNumber(getCellValue(cells[7])),
            sheetTeaCost: toNumber(getCellValue(cells[8])),
            sheetOutsideHours: toNumber(getCellValue(cells[9])),
            sheetOutsideCost: toNumber(getCellValue(cells[10]))
          };
        })
        .filter(row => Number.isFinite(row.date));
    }

    function validFteSalary(value) {
      return Number.isFinite(value) &&
        value >= CONFIG.minimumFteSalary &&
        value <= CONFIG.maximumFteSalary;
    }

    function calculateRowMetrics(row) {
      const assumptions = CONFIG.calculation;

      /*
       * BI and BJ are the percentages of the available break time that
       * respondents actually received. The uncompensated share is therefore
       * 100 minus the reported percentage.
       */
      const mealUncompensatedPercent = Number.isFinite(
        row.mealReportedPercent
      )
        ? clamp(100 - row.mealReportedPercent, 0, 100)
        : NaN;

      const teaUncompensatedPercent = Number.isFinite(
        row.teaReportedPercent
      )
        ? clamp(100 - row.teaReportedPercent, 0, 100)
        : NaN;

      /*
       * BL is the percentage of outside-roster time paid or returned as TOIL.
       * A valid BL response is retained even when BK is zero. A zero BK value
       * therefore produces zero annual hours/cost rather than a missing row.
       */
      const outsideUncompensatedPercent = Number.isFinite(
        row.outsideCompensatedPercent
      )
        ? clamp(100 - row.outsideCompensatedPercent, 0, 100)
        : NaN;

      const annualPaidFteHours =
        assumptions.fullTimeHoursPerWeek *
        assumptions.weeksPerYear;

      const hourlyFteRate = validFteSalary(row.fteSalary)
        ? row.fteSalary / annualPaidFteHours
        : NaN;

      const mealAnnualHours = Number.isFinite(mealUncompensatedPercent)
        ? assumptions.mealBreakMinutesPerDay / 60 *
          assumptions.fullTimeDaysPerWeek *
          assumptions.weeksPerYear *
          mealUncompensatedPercent / 100
        : NaN;

      const teaAnnualHours = Number.isFinite(teaUncompensatedPercent)
        ? assumptions.teaBreakMinutesPerDay / 60 *
          assumptions.fullTimeDaysPerWeek *
          assumptions.weeksPerYear *
          teaUncompensatedPercent / 100
        : NaN;

      const validOutsideMinutes = Number.isFinite(
        row.outsideMinutesPerFourWeeks
      ) && row.outsideMinutesPerFourWeeks >= 0;

      const validHoursPerWeek = Number.isFinite(row.hoursPerWeek) &&
        row.hoursPerWeek > 0 &&
        row.hoursPerWeek <= 80;

      const fteScale = validHoursPerWeek
        ? assumptions.fullTimeHoursPerWeek / row.hoursPerWeek
        : NaN;

      const outsideAnnualHours = validOutsideMinutes &&
        Number.isFinite(outsideUncompensatedPercent) &&
        Number.isFinite(fteScale)
          ? row.outsideMinutesPerFourWeeks / 60 *
            assumptions.fourWeekCyclesPerYear *
            outsideUncompensatedPercent / 100 *
            fteScale
          : NaN;

      const mealAnnualCost = Number.isFinite(mealAnnualHours) &&
        Number.isFinite(hourlyFteRate)
          ? mealAnnualHours * hourlyFteRate
          : NaN;

      const teaAnnualCost = Number.isFinite(teaAnnualHours) &&
        Number.isFinite(hourlyFteRate)
          ? teaAnnualHours * hourlyFteRate
          : NaN;

      const outsideAnnualCost = Number.isFinite(outsideAnnualHours) &&
        Number.isFinite(hourlyFteRate)
          ? outsideAnnualHours * hourlyFteRate
          : NaN;

      return {
        ...row,
        hourlyFteRate,
        fteScale,
        mealUncompensatedPercent,
        teaUncompensatedPercent,
        outsideUncompensatedPercent,
        mealAnnualHours,
        teaAnnualHours,
        outsideAnnualHours,
        mealAnnualCost,
        teaAnnualCost,
        outsideAnnualCost
      };
    }

    function getCategoryValues(row, categoryKey) {
      if (categoryKey === 'meal') {
        return {
          percent: row.mealUncompensatedPercent,
          hours: row.mealAnnualHours,
          cost: row.mealAnnualCost,
          reportedPercent: row.mealReportedPercent,
          sheetHours: NaN,
          sheetCost: row.sheetMealCost
        };
      }

      if (categoryKey === 'tea') {
        return {
          percent: row.teaUncompensatedPercent,
          hours: row.teaAnnualHours,
          cost: row.teaAnnualCost,
          reportedPercent: row.teaReportedPercent,
          sheetHours: NaN,
          sheetCost: row.sheetTeaCost
        };
      }

      return {
        percent: row.outsideUncompensatedPercent,
        hours: row.outsideAnnualHours,
        cost: row.outsideAnnualCost,
        reportedPercent: row.outsideCompensatedPercent,
        reportedMinutes: row.outsideMinutesPerFourWeeks,
        sheetHours: row.sheetOutsideHours,
        sheetCost: row.sheetOutsideCost
      };
    }

    function hasCompletePercentResponse(row) {
      return CATEGORY_CONFIG.every(category =>
        Number.isFinite(
          getCategoryValues(row, category.key).percent
        )
      );
    }

    function hasCompleteCostResponse(row) {
      return CATEGORY_CONFIG.every(category =>
        Number.isFinite(
          getCategoryValues(row, category.key).cost
        )
      );
    }

    function rowEligibleForView(row, view) {
      if (view === 'percent') {
        return hasCompletePercentResponse(row);
      }

      if (view === 'affected') {
        return hasCompleteCostResponse(row);
      }

      return true;
    }

    function getMetricValue(row, categoryKey, view) {
      if (!rowEligibleForView(row, view)) {
        return NaN;
      }

      const values = getCategoryValues(row, categoryKey);
      const affected = Number.isFinite(values.cost) && values.cost > 0.005;

      if (view === 'percent') {
        return values.percent;
      }

      if (view === 'affected') {
        return Number.isFinite(values.cost)
          ? affected
            ? 100
            : 0
          : NaN;
      }

      if (view === 'medianCost' || view === 'totalCost') {
        return values.cost;
      }

      if (view === 'affectedMedian') {
        return affected ? values.cost : NaN;
      }

      return values.hours;
    }

    function buildCategoryModel(view, category) {
      const metricRows = rows
        .map(row => {
          const metricValue = getMetricValue(
            row,
            category.key,
            view
          );

          return {
            ...row,
            categoryKey: category.key,
            label: category.label,
            colour: category.colour,
            metricView: view,
            metricValue,
            actualValue: metricValue,
            categoryValues: getCategoryValues(row, category.key)
          };
        });

      const validMetricRows = metricRows.filter(row =>
        Number.isFinite(row.metricValue)
      );

      const statistics = calculateStatistics(
        validMetricRows.map(row => row.metricValue)
      );

      const baseCostRows = rows
        .map(row => getCategoryValues(row, category.key).cost)
        .filter(Number.isFinite);

      const affectedCosts = baseCostRows.filter(value => value > 0.005);
      const affectedCostStatistics = calculateStatistics(affectedCosts);
      const affectedCount = affectedCosts.length;
      const validCostCount = baseCostRows.length;
      const affectedPercent = validCostCount
        ? affectedCount / validCostCount * 100
        : NaN;

      let aggregateValue;

      if (view === 'totalCost') {
        aggregateValue = statistics.sum;
      } else if (view === 'affected') {
        aggregateValue = statistics.mean;
      } else {
        aggregateValue = statistics.median;
      }

      return {
        category,
        metricRows,
        validMetricRows,
        statistics,
        aggregateValue,
        affectedCostStatistics,
        affectedCount,
        validCostCount,
        affectedPercent,
        validCount: statistics.count
      };
    }

    function niceStep(value) {
      if (!Number.isFinite(value) || value <= 0) {
        return 1;
      }

      const exponent = Math.floor(Math.log10(value));
      const magnitude = Math.pow(10, exponent);
      const fraction = value / magnitude;

      if (fraction <= 1) return magnitude;
      if (fraction <= 2) return 2 * magnitude;
      if (fraction <= 2.5) return 2.5 * magnitude;
      if (fraction <= 5) return 5 * magnitude;
      if (fraction <= 7.5) return 7.5 * magnitude;
      return 10 * magnitude;
    }

    function buildYAxisModel(view, categoryModels) {
      const rawValues = categoryModels
        .flatMap(model =>
          model.validMetricRows.map(row => row.metricValue)
        )
        .filter(Number.isFinite)
        .sort((first, second) => first - second);

      const summaryValues = categoryModels
        .map(model => model.aggregateValue)
        .filter(Number.isFinite);

      const observedMaximum = Math.max(
        0,
        ...rawValues,
        ...summaryValues
      );

      if (VIEW_CONFIG[view].kind === 'percentage') {
        const maximum = Math.min(
          100,
          Math.max(
            20,
            Math.ceil(Math.max(observedMaximum, 1) / 10) * 10
          )
        );

        return {
          minimum: 0,
          maximum,
          majorStep: 10,
          minorStep: 5
        };
      }

      const summaryMaximum = Math.max(
        0,
        ...summaryValues
      );

      const robustRawMaximum = rawValues.length
        ? percentile(rawValues, 0.95)
        : 0;

      let targetMaximum;

      if (view === 'totalCost') {
        /*
         * Total bars are sums, while the squares remain individual
         * respondents. Scale to the largest total so that the highest
         * horizontal bar remains close to the top of the chart.
         */
        targetMaximum = Math.max(
          summaryMaximum * 1.04,
          100
        );
      } else {
        /*
         * Show approximately 95% of respondent values without allowing
         * a small number of extreme outliers to flatten the medians.
         */
        targetMaximum = Math.max(
          robustRawMaximum * 1.04,
          summaryMaximum * 1.08,
          view === 'hours' ? 1 : 100
        );
      }

      const majorStep = niceStep(
        targetMaximum / 6
      );

      return {
        minimum: 0,
        maximum: Math.max(majorStep * 6, majorStep),
        majorStep,
        minorStep: majorStep / 2
      };
    }

    function normaliseMetricValue(value, axis) {
      return Number.isFinite(value) &&
        Number.isFinite(axis?.maximum) &&
        axis.maximum > 0
          ? value / axis.maximum
          : null;
    }

    function deterministicJitter(index) {
      const sequence = [
        0,
        -0.18,
        0.18,
        -0.09,
        0.09,
        -0.27,
        0.27
      ];

      return sequence[index % sequence.length];
    }

    function buildViewModel(view) {
      const categoryModels = CATEGORY_CONFIG.map(category =>
        buildCategoryModel(view, category)
      );

      const yAxis = buildYAxisModel(view, categoryModels);
      const datasets = [];

      categoryModels.forEach((model, categoryIndex) => {
        const category = model.category;

        const showRawSquares = view !== 'affected';

        datasets.push({
          type: 'scatter',
          datasetRole: 'raw',
          categoryKey: category.key,
          label: `${category.label} respondent values`,
          data: showRawSquares
            ? model.metricRows
                .filter(row => Number.isFinite(row.metricValue))
                .map(row => ({
                  ...row,
                  x: category.x + deterministicJitter(row.sourceIndex),
                  y: normaliseMetricValue(row.metricValue, yAxis)
                }))
            : [],
          parsing: false,
          showLine: false,
          clip: true,
          order: 1,
          pointStyle: 'rect',
          pointRadius: CONFIG.pointRadius,
          pointHoverRadius: CONFIG.pointHoverRadius,
          pointHitRadius: 4,
          pointBackgroundColor: rgba(
            category.colour,
            CONFIG.pointOpacity
          ),
          pointHoverBackgroundColor: rgba(
            category.colour,
            CONFIG.pointHoverOpacity
          ),
          pointBorderColor: rgba(category.colour, 0.34),
          pointHoverBorderColor: category.colour,
          pointBorderWidth: 0.45,
          pointHoverBorderWidth: 1
        });

        const summaryRaw = {
          categoryKey: category.key,
          label: category.label,
          colour: category.colour,
          metricView: view,
          aggregateValue: model.aggregateValue,
          statistics: model.statistics,
          affectedCostStatistics: model.affectedCostStatistics,
          affectedCount: model.affectedCount,
          validCostCount: model.validCostCount,
          affectedPercent: model.affectedPercent,
          validCount: model.validCount
        };

        datasets.push({
          type: 'line',
          datasetRole: 'summary',
          categoryKey: category.key,
          order: -10,
          label: `${category.label} summary`,
          data: Number.isFinite(model.aggregateValue)
            ? [
                {
                  ...summaryRaw,
                  x: category.x - 0.27,
                  y: normaliseMetricValue(model.aggregateValue, yAxis)
                },
                {
                  ...summaryRaw,
                  x: category.x + 0.27,
                  y: normaliseMetricValue(model.aggregateValue, yAxis)
                }
              ]
            : [],
          parsing: false,
          showLine: true,
          clip: false,
          fill: false,
          borderColor: category.colour,
          backgroundColor: category.colour,
          borderWidth: CONFIG.medianLineWidth,
          borderCapStyle: 'round',
          borderJoinStyle: 'round',
          pointRadius: 0,
          pointHoverRadius: 0,
          pointHitRadius: 6,
          tension: 0,
          metadata: summaryRaw
        });
      });

      return {
        view,
        yAxis,
        datasets,
        legendItems: CATEGORY_CONFIG.map(category => ({
          colour: category.colour,
          label: category.label
        })),
        note: VIEW_CONFIG[view].note
      };
    }

    function formatMetricValue(view, value) {
      if (!Number.isFinite(Number(value))) {
        return '—';
      }

      if (VIEW_CONFIG[view].kind === 'percentage') {
        return formatPercentage(value, 1);
      }

      if (VIEW_CONFIG[view].kind === 'currency') {
        return formatCurrency(value, 0);
      }

      return formatHours(value, 1);
    }

    function formatIqrNumber(view, value) {
      if (!Number.isFinite(Number(value))) {
        return '—';
      }

      if (VIEW_CONFIG[view].kind === 'currency') {
        return formatNumber(value, 0);
      }

      return formatNumber(value, 1);
    }

    function formatMedianIqr(view, statistics) {
      if (!statistics?.count) {
        return '—';
      }

      return (
        `${formatMetricValue(view, statistics.median)} ` +
        `[${formatIqrNumber(view, statistics.q1)}, ` +
        `${formatIqrNumber(view, statistics.q3)}]`
      );
    }

    function createXAxisOptions() {
      return {
        type: 'linear',
        min: -0.55,
        max: 2.55,
        afterFit(scale) {
          scale.height = 48;
        },
        afterBuildTicks(scale) {
          scale.ticks = CATEGORY_CONFIG.map(category => ({
            value: category.x
          }));
        },
        title: {
          display: true,
          text: 'Source of uncompensated work',
          color: '#151515',
          font: {
            family: 'Lato',
            size: 13,
            weight: '700'
          },
          padding: {
            top: 7,
            bottom: 2
          }
        },
        ticks: {
          color: '#151515',
          autoSkip: false,
          maxRotation: 0,
          minRotation: 0,
          padding: 3,
          font: {
            family: 'Lato',
            size: window.matchMedia('(max-width: 430px)').matches
              ? 9
              : 10,
            weight: '400'
          },
          callback(value) {
            const category = CATEGORY_CONFIG.find(
              item => item.x === Number(value)
            );
            return category?.shortLabel || '';
          }
        },
        grid: {
          drawOnChartArea: false,
          drawTicks: true,
          tickLength: 6,
          tickColor: 'rgba(21, 21, 21, 0)',
          tickWidth: 0
        },
        border: {
          display: false,
          color: '#151515',
          width: 1.1
        }
      };
    }

    function createYAxisOptions(view, axis) {
      const tickCount = Math.max(
        2,
        Math.round(axis.maximum / axis.minorStep) + 1
      );

      return {
        min: 0,
        max: 1,
        afterFit(scale) {
          scale.width = window.matchMedia('(max-width: 430px)').matches
            ? 64
            : 70;
        },
        afterBuildTicks(scale) {
          scale.ticks = Array.from(
            { length: tickCount },
            (_, index) => ({
              value: index / Math.max(1, tickCount - 1)
            })
          );
        },
        title: {
          display: false,
          text: VIEW_CONFIG[view].yTitle,
          color: '#151515',
          font: {
            family: 'Lato',
            size: 13,
            weight: '700'
          }
        },
        ticks: {
          color: 'rgba(21, 21, 21, 0)',
          autoSkip: false,
          padding: 3,
          font: {
            family: 'Lato',
            size: 10,
            weight: '400'
          },
          callback() {
            return '';
          }
        },
        grid: {
          color(context) {
            const index = context.index ?? 0;
            return index % 2 === 0
              ? 'rgba(105, 113, 138, 0.075)'
              : 'rgba(105, 113, 138, 0.035)';
          },
          lineWidth(context) {
            const index = context.index ?? 0;
            return index % 2 === 0 ? 1 : 0.7;
          },
          drawTicks: true,
          tickLength: 5,
          tickColor: 'rgba(21, 21, 21, 0)',
          tickWidth: 0
        },
        border: {
          display: false,
          color: '#151515',
          width: 1.1
        }
      };
    }

    function drawVariableTicks(
      context,
      scale,
      axis,
      isMajor,
      opacity = 1
    ) {
      if (!scale?.ticks?.length) {
        return;
      }

      context.save();
      context.globalAlpha = clamp(opacity, 0, 1);
      context.lineCap = 'butt';
      context.strokeStyle = '#151515';

      scale.ticks.forEach((tick, index) => {
        const value = Number(tick.value);
        const pixel = scale.getPixelForTick(index);

        if (!Number.isFinite(value) || !Number.isFinite(pixel)) {
          return;
        }

        const major = isMajor(value, index);
        const tickLength = major ? 6 : 2;

        context.beginPath();
        context.lineWidth = major ? 1.1 : 0.7;

        if (axis === 'x') {
          context.moveTo(pixel, scale.top);
          context.lineTo(pixel, scale.top + tickLength);
        } else {
          context.moveTo(scale.right, pixel);
          context.lineTo(scale.right - tickLength, pixel);
        }

        context.stroke();
      });

      context.restore();
    }

    const constantSpinePlugin = {
      id: 'constantSpinePlugin',
      afterDatasetsDraw(activeChart) {
        const area = activeChart.chartArea;

        if (!area) {
          return;
        }

        const context = activeChart.ctx;
        context.save();
        context.globalAlpha = 1;
        context.strokeStyle = '#151515';
        context.lineWidth = 1.1;
        context.lineCap = 'butt';

        context.beginPath();
        context.moveTo(area.left, area.bottom);
        context.lineTo(area.right, area.bottom);
        context.stroke();

        context.beginPath();
        context.moveTo(area.left, area.top);
        context.lineTo(area.left, area.bottom);
        context.stroke();

        context.restore();
      }
    };

    const variableAxisTickPlugin = {
      id: 'variableAxisTickPlugin',
      afterDatasetsDraw(activeChart) {
        drawVariableTicks(
          activeChart.ctx,
          activeChart.scales.x,
          'x',
          () => true,
          1
        );

        drawVariableTicks(
          activeChart.ctx,
          activeChart.scales.y,
          'y',
          (_value, index) => index % 2 === 0,
          axisFadeOpacity
        );
      }
    };

    const animatedYAxisLabelPlugin = {
      id: 'animatedYAxisLabelPlugin',
      afterDatasetsDraw(activeChart) {
        const scale = activeChart.scales.y;

        if (!scale?.ticks?.length) {
          return;
        }

        const maximum = getAnimatedAxisMaximum();
        const context = activeChart.ctx;

        context.save();
        context.globalAlpha = clamp(axisFadeOpacity, 0, 1);
        context.fillStyle = '#151515';
        context.font = '400 10px Lato, sans-serif';
        context.textAlign = 'right';
        context.textBaseline = 'middle';

        scale.ticks.forEach((tick, index) => {
          if (index % 2 !== 0) {
            return;
          }

          const pixel = scale.getPixelForTick(index);
          const value = Number(tick.value) * maximum;

          if (!Number.isFinite(pixel) || !Number.isFinite(value)) {
            return;
          }

          context.fillText(
            formatAxisNumber(value),
            scale.right - 8,
            pixel
          );
        });

        context.save();
        context.translate(
          scale.left + 8,
          (scale.top + scale.bottom) / 2
        );
        context.rotate(-Math.PI / 2);
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.font = '700 13px Lato, sans-serif';
        context.fillText(
          VIEW_CONFIG[activeView].yTitle,
          0,
          0
        );
        context.restore();

        context.restore();
      }
    };

    function tooltipTitle(item) {
      return item?.dataset?.label
        ? CATEGORY_BY_KEY.get(item.dataset.categoryKey)?.label || ''
        : item?.raw?.label || '';
    }

    function rawLossLines(raw) {
      const values = raw?.categoryValues || {};
      const lines = [];

      if (Number.isFinite(values.percent)) {
        lines.push(
          `Uncompensated time: ${formatPercentage(values.percent, 1)}`
        );
      }

      if (Number.isFinite(values.hours)) {
        lines.push(
          `Time loss: ${formatNumber(values.hours, 1)} FTE hours/year`
        );
      }

      if (Number.isFinite(values.cost)) {
        lines.push(
          `FTE $ loss: ${formatCurrency(values.cost, 0)}/year`
        );
      }

      return lines;
    }

    function tooltipLabel(item) {
      const role = item.dataset.datasetRole;
      const raw = item.raw;

      if (role === 'summary') {
        const summary = item.dataset.metadata || raw || {};
        const lines = [];

        if (activeView === 'totalCost') {
          lines.push(
            `Total $ loss: ${formatCurrency(summary.aggregateValue, 0)}`
          );
          lines.push(
            `Respondents: ${formatNumber(summary.validCount, 0)}`
          );
          return lines;
        }

        if (activeView === 'affected') {
          lines.push(
            `Affected: ${formatPercentage(summary.aggregateValue, 1)} ` +
            `(${formatNumber(summary.affectedCount, 0)} of ` +
            `${formatNumber(summary.validCostCount, 0)})`
          );
          lines.push(
            `Respondents: ${formatNumber(summary.validCount, 0)}`
          );
          return lines;
        }

        lines.push(
          `Median [IQR]: ${formatMedianIqr(
            activeView,
            summary.statistics
          )}`
        );

        lines.push(
          `Respondents: ${formatNumber(summary.validCount, 0)}`
        );

        if (
          activeView === 'medianCost' ||
          activeView === 'affectedMedian'
        ) {
          lines.push(
            `Any calculated $ loss: ${formatPercentage(summary.affectedPercent, 1)} ` +
            `(${formatNumber(summary.affectedCount, 0)} of ` +
            `${formatNumber(summary.validCostCount, 0)})`
          );
        }

        return lines;
      }

      if (activeView === 'affected') {
        return [
          `Affected: ${raw.actualValue > 0 ? 'Yes' : 'No'}`,
          ...rawLossLines(raw)
        ];
      }

      return rawLossLines(raw);
    }

    function createChartOptions(model) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 0,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 3),
        animation: {
          duration: CONFIG.transitionMs,
          easing: 'easeOutCubic'
        },
        transitions: {
          resize: {
            animation: {
              duration: 0
            }
          },
          active: {
            animation: {
              duration: 170,
              easing: 'easeOutCubic'
            }
          }
        },
        layout: {
          autoPadding: false,
          padding: {
            top: 34,
            right: 12,
            bottom: 0,
            left: 0
          }
        },
        interaction: {
          mode: 'nearest',
          axis: 'xy',
          intersect: true,
          includeInvisible: false
        },
        onHover: handleChartHover,
        onClick: handleChartClick,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            enabled: true,
            mode: 'nearest',
            intersect: true,
            displayColors: false,
            backgroundColor: '#ffffff',
            titleColor: '#151515',
            bodyColor: '#69718a',
            borderColor: '#e8eaf0',
            borderWidth: 1,
            cornerRadius: 4,
            padding: 9,
            titleFont: {
              family: 'Lato',
              size: 12,
              weight: '700'
            },
            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },
            filter() {
              return !interactionLocked && !viewSwitchLocked;
            },
            callbacks: {
              title(items) {
                return tooltipTitle(items?.[0]);
              },
              label(item) {
                return tooltipLabel(item);
              }
            }
          }
        },
        scales: {
          x: createXAxisOptions(),
          y: createYAxisOptions(model.view, model.yAxis)
        }
      };
    }

    function distanceToSegment(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;

      if (dx === 0 && dy === 0) {
        return Math.hypot(px - ax, py - ay);
      }

      const proportion = clamp(
        ((px - ax) * dx + (py - ay) * dy) /
        (dx * dx + dy * dy),
        0,
        1
      );

      return Math.hypot(
        px - (ax + proportion * dx),
        py - (ay + proportion * dy)
      );
    }

    function findNearestSummaryLine(event, maximumDistance = 14) {
      if (!chart?.chartArea) {
        return null;
      }

      const x = Number(event?.x);
      const y = Number(event?.y);
      const area = chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let bestMatch = null;

      chart.data.datasets.forEach((dataset, datasetIndex) => {
        if (dataset.datasetRole !== 'summary') {
          return;
        }

        const rendered = chart.getDatasetMeta(datasetIndex)?.data || [];

        if (rendered.length < 2) {
          return;
        }

        const distance = distanceToSegment(
          x,
          y,
          rendered[0].x,
          rendered[0].y,
          rendered[1].x,
          rendered[1].y
        );

        if (distance <= maximumDistance && (
          !bestMatch || distance < bestMatch.distance
        )) {
          bestMatch = {
            datasetIndex,
            index: 0,
            distance
          };
        }
      });

      return bestMatch;
    }

    function getInteractiveElement(elements, event) {
      /*
       * Median bars take priority over nearby respondent squares. This
       * prevents the summary tooltip from being replaced as the pointer
       * moves along a bar that overlaps one or more raw observations.
       */
      return findNearestSummaryLine(event) ||
        (elements || []).find(element => {
          const role = chart?.data?.datasets?.[element.datasetIndex]?.datasetRole;
          return role === 'raw' || role === 'summary';
        });
    }

    function showSelectedTooltip(event, selectedElement) {
      if (!chart || !selectedElement) {
        return;
      }

      const renderedElement = chart
        .getDatasetMeta(selectedElement.datasetIndex)
        ?.data?.[selectedElement.index];

      const nextKey =
        `${selectedElement.datasetIndex}:${selectedElement.index}`;

      chart.tooltip.setActiveElements(
        [
          {
            datasetIndex: selectedElement.datasetIndex,
            index: selectedElement.index
          }
        ],
        {
          x: Number.isFinite(Number(event?.x))
            ? Number(event.x)
            : renderedElement?.x ?? 0,
          y: Number.isFinite(Number(event?.y))
            ? Number(event.y)
            : renderedElement?.y ?? 0
        }
      );

      activeTooltipKey = nextKey;

      /*
       * A draw is sufficient after setActiveElements and avoids a full
       * chart update re-running nearest-element resolution mid-hover.
       */
      chart.tooltip.update(true);
      chart.draw();
    }

    function handleChartHover(event, elements) {
      if (!chart || interactionLocked || viewSwitchLocked) {
        if (chart) {
          chart.canvas.style.cursor = 'default';
        }
        return;
      }

      const selectedElement = getInteractiveElement(elements, event);
      chart.canvas.style.cursor = selectedElement
        ? 'pointer'
        : 'default';

      if (selectedElement) {
        showSelectedTooltip(event, selectedElement);
        return;
      }

      if (activeTooltipKey) {
        activeTooltipKey = '';
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.tooltip.update(true);
        chart.draw();
      }
    }

    function handleChartClick(event, elements) {
      if (!chart || interactionLocked || viewSwitchLocked) {
        return;
      }

      event?.native?.preventDefault?.();

      const selectedElement = getInteractiveElement(elements, event);

      if (!selectedElement) {
        activeTooltipKey = '';
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.tooltip.update(true);
        chart.draw();
        return;
      }

      showSelectedTooltip(event, selectedElement);
    }

    function applyModelToChart(model, animate = true) {
      chart.options.animation.duration = animate
        ? CONFIG.transitionMs
        : 0;

      model.datasets.forEach((target, index) => {
        const current = chart.data.datasets[index];

        if (!current) {
          chart.data.datasets[index] = target;
          return;
        }

        Object.assign(current, target);
        current.data = target.data;
      });

      chart.data.datasets.length = model.datasets.length;
      chart.options.scales.x = createXAxisOptions();
      chart.options.scales.y = createYAxisOptions(
        model.view,
        model.yAxis
      );

      chart.update(animate ? undefined : 'none');
    }

    function createChart() {
      const model = buildViewModel(activeView);
      currentYAxisModel = model.yAxis;
      axisNumberTransition.fromMaximum = model.yAxis.maximum;
      axisNumberTransition.toMaximum = model.yAxis.maximum;
      axisNumberTransition.progress = 1;

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: 'scatter',
          data: {
            datasets: model.datasets
          },
          options: createChartOptions(model),
          plugins: [
            constantSpinePlugin,
            variableAxisTickPlugin,
            animatedYAxisLabelPlugin
          ]
        }
      );

      updateLegend(model.legendItems, false);
      updateChartNote(model.note, false);
    }

    function getHeadingDetail(view) {
      return (
        `${VIEW_CONFIG[view].heading} ` +
        `(${analysisWindow.label})`
      );
    }

    function applyView(nextView, animate = true) {
      if (
        !chart ||
        viewSwitchLocked ||
        !VIEW_CONFIG[nextView] ||
        nextView === activeView
      ) {
        return;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (!animate || reduceMotion) {
        activeView = nextView;
        const model = buildViewModel(activeView);
        currentYAxisModel = model.yAxis;
        axisNumberTransition.fromMaximum = model.yAxis.maximum;
        axisNumberTransition.toMaximum = model.yAxis.maximum;
        axisNumberTransition.progress = 1;
        axisFadeOpacity = 1;

        fadeTextChange(chartHeadingDetail, getHeadingDetail(activeView));
        updateActiveTab();
        updateLegend(model.legendItems, false);
        updateChartNote(model.note, false);
        applyModelToChart(model, false);
        return;
      }

      viewSwitchLocked = true;
      interactionLocked = true;
      activeTooltipKey = '';
      chart.tooltip.setActiveElements([], { x: 0, y: 0 });

      const previousMaximum = currentYAxisModel?.maximum || 1;

      animateAxisOpacity(
        axisFadeOpacity,
        0,
        CONFIG.axisFadeOutMs,
        () => {
          activeView = nextView;
          const model = buildViewModel(activeView);

          fadeTextChange(chartHeadingDetail, getHeadingDetail(activeView));
          updateActiveTab();
          updateLegend(model.legendItems, true);
          updateChartNote(model.note, true);

          applyModelToChart(model, true);
          animateAxisMaximum(
            previousMaximum,
            model.yAxis.maximum,
            CONFIG.transitionMs
          );

          currentYAxisModel = model.yAxis;

          animateAxisOpacity(
            0,
            1,
            CONFIG.axisFadeInMs
          );

          if (viewUnlockTimer !== null) {
            window.clearTimeout(viewUnlockTimer);
          }

          viewUnlockTimer = window.setTimeout(() => {
            viewUnlockTimer = null;
            viewSwitchLocked = false;
            interactionLocked = false;
            chart?.update('none');
          }, CONFIG.transitionMs + 40);
        }
      );
    }

    function requestViewSwitch(nextView) {
      if (
        nextView === activeView ||
        interactionLocked ||
        viewSwitchLocked ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      applyView(nextView, true);
    }

    function appendLegendItem(itemData) {
      const item = document.createElement('span');
      item.className = 'legend-item';

      const marker = document.createElement('span');
      marker.className = 'legend-square';
      marker.style.background = itemData.colour;
      marker.style.borderColor = itemData.colour;

      const text = document.createElement('span');
      text.textContent = itemData.label;

      item.appendChild(marker);
      item.appendChild(text);
      chartLegend.appendChild(item);
    }

    function updateLegendScrollControls() {
      const maximumScroll =
        chartLegend.scrollWidth - chartLegend.clientWidth;

      legendScrollLeft.classList.toggle(
        'is-hidden',
        maximumScroll <= 2 || chartLegend.scrollLeft <= 2
      );

      legendScrollRight.classList.toggle(
        'is-hidden',
        maximumScroll <= 2 ||
        chartLegend.scrollLeft >= maximumScroll - 2
      );
    }

    function renderLegendItems(items) {
      chartLegend.textContent = '';
      chartLegend.scrollLeft = 0;
      items.forEach(appendLegendItem);
      requestAnimationFrame(updateLegendScrollControls);
    }

    function updateLegend(items, animate = true) {
      const signature = JSON.stringify(items);

      if (signature === currentLegendSignature) {
        return;
      }

      const token = ++legendAnimationToken;
      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (!animate || reduceMotion || !chartLegend.animate) {
        renderLegendItems(items);
        currentLegendSignature = signature;
        chartLegend.style.opacity = '';
        return;
      }

      const fadeOut = chartLegend.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        {
          duration: 170,
          easing: 'ease-out',
          fill: 'forwards'
        }
      );

      fadeOut.finished
        .then(() => {
          if (token !== legendAnimationToken) {
            return;
          }

          fadeOut.cancel();
          renderLegendItems(items);
          currentLegendSignature = signature;

          const fadeIn = chartLegend.animate(
            [{ opacity: 0 }, { opacity: 1 }],
            {
              duration: 270,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );

          fadeIn.finished
            .then(() => fadeIn.cancel())
            .catch(() => {});
        })
        .catch(() => {
          if (token !== legendAnimationToken) {
            return;
          }

          renderLegendItems(items);
          currentLegendSignature = signature;
        });
    }

    function fadeTextChange(element, nextText) {
      if (!element || element.textContent === nextText) {
        return;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (reduceMotion || !element.animate) {
        element.textContent = nextText;
        return;
      }

      const fadeOut = element.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        {
          duration: 170,
          easing: 'ease-out',
          fill: 'forwards'
        }
      );

      fadeOut.finished
        .then(() => {
          fadeOut.cancel();
          element.textContent = nextText;

          const fadeIn = element.animate(
            [{ opacity: 0 }, { opacity: 1 }],
            {
              duration: 260,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );

          fadeIn.finished
            .then(() => fadeIn.cancel())
            .catch(() => {});
        })
        .catch(() => {
          element.textContent = nextText;
        });
    }

    function updateChartNote(note, animate = true) {
      const nextText = note || '';

      chartNote.classList.toggle('is-hidden', !nextText);

      if (!animate) {
        chartNote.textContent = nextText;
        return;
      }

      fadeTextChange(chartNote, nextText);
    }

    function updateTabScrollHints() {
      if (!tabList || !tabScrollShell) {
        return;
      }

      const maximumScrollLeft = Math.max(
        0,
        tabList.scrollWidth - tabList.clientWidth
      );

      const tolerance = 2;

      tabScrollShell.classList.toggle(
        'can-scroll-left',
        tabList.scrollLeft > tolerance
      );

      tabScrollShell.classList.toggle(
        'can-scroll-right',
        tabList.scrollLeft < maximumScrollLeft - tolerance
      );
    }

    function updateTabIndicator(animate = true) {
      const selectedTab = tabByView.get(activeView);

      if (!tabList || !selectedTab) {
        return;
      }

      if (!animate) {
        tabList.classList.add('is-positioning');
      }

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${selectedTab.offsetLeft}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${selectedTab.offsetWidth}px`
      );

      if (animate) {
        const targetScrollLeft =
          selectedTab.offsetLeft -
          (tabList.clientWidth - selectedTab.offsetWidth) / 2;

        tabList.scrollTo({
          left: Math.max(0, targetScrollLeft),
          behavior: 'smooth'
        });
      } else {
        requestAnimationFrame(() => {
          tabList.classList.remove('is-positioning');
        });
      }

      requestAnimationFrame(updateTabScrollHints);
    }

    function updateActiveTab() {
      chartTabs.forEach(tab => {
        const isActive = tab.dataset.view === activeView;
        tab.classList.toggle('is-active', isActive);
        tab.setAttribute('aria-selected', String(isActive));
      });

      updateTabIndicator(true);
    }

    chartTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        requestViewSwitch(tab.dataset.view);
      });
    });

    tabList.addEventListener('scroll', updateTabScrollHints, {
      passive: true
    });

    legendScrollLeft.addEventListener('click', event => {
      event.stopPropagation();
      chartLegend.scrollBy({
        left: -Math.max(110, legendViewport.clientWidth * 0.72),
        behavior: 'smooth'
      });
    });

    legendScrollRight.addEventListener('click', event => {
      event.stopPropagation();
      chartLegend.scrollBy({
        left: Math.max(110, legendViewport.clientWidth * 0.72),
        behavior: 'smooth'
      });
    });

    chartLegend.addEventListener('scroll', updateLegendScrollControls, {
      passive: true
    });

    chartCanvas.addEventListener('contextmenu', event => {
      event.preventDefault();
    });

    chartCanvas.addEventListener('selectstart', event => {
      event.preventDefault();
    });

    chartCanvas.addEventListener('mouseleave', () => {
      if (!chart) {
        return;
      }

      chart.canvas.style.cursor = 'default';
      activeTooltipKey = '';
      chart.tooltip?.setActiveElements([], { x: 0, y: 0 });
      chart.update('none');
    });

    document.addEventListener('pointerdown', event => {
      if (!event.target.closest('#uncompensatedWorkChart') && chart) {
        activeTooltipKey = '';
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.update('none');
      }
    });

    function refreshResponsiveLayout() {
      if (responsiveLayoutFrame !== null) {
        cancelAnimationFrame(responsiveLayoutFrame);
      }

      responsiveLayoutFrame = requestAnimationFrame(() => {
        responsiveLayoutFrame = null;

        if (chart) {
          const model = buildViewModel(activeView);
          currentYAxisModel = model.yAxis;
          axisNumberTransition.fromMaximum = model.yAxis.maximum;
          axisNumberTransition.toMaximum = model.yAxis.maximum;
          axisNumberTransition.progress = 1;
          axisFadeOpacity = 1;
          applyModelToChart(model, false);
          chart.resize();
          chart.update('none');
          updateLegend(model.legendItems, false);
          updateChartNote(model.note, false);
        }

        updateTabIndicator(false);
        updateTabScrollHints();
        updateLegendScrollControls();
      });
    }

    let layoutResizeObserver = null;

    if ('ResizeObserver' in window) {
      layoutResizeObserver = new ResizeObserver(entries => {
        const hasUsableSize = entries.some(entry =>
          entry.contentRect.width > 1 &&
          entry.contentRect.height > 1
        );

        if (hasUsableSize) {
          refreshResponsiveLayout();
        }
      });

      layoutResizeObserver.observe(app);
      layoutResizeObserver.observe(chartShell);
    }

    window.addEventListener('resize', refreshResponsiveLayout, {
      passive: true
    });

    window.visualViewport?.addEventListener(
      'resize',
      refreshResponsiveLayout,
      { passive: true }
    );

    window.addEventListener('pageshow', refreshResponsiveLayout);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        refreshResponsiveLayout();
      }
    });

    if (document.fonts?.ready) {
      document.fonts.ready.then(refreshResponsiveLayout);
    }

    function setStatus(message = '') {
      statusElement.textContent = message;
    }

    function hideLoadingState() {
      app.classList.remove('is-loading');
      app.setAttribute('aria-busy', 'false');
      loadingState.setAttribute('aria-hidden', 'true');
      refreshResponsiveLayout();
    }

    async function loadDashboard() {
      try {
        setStatus();

        sourceRows = normaliseRows(await loadSheetRows());

        if (!sourceRows.length) {
          throw new Error(
            'No dated responses were found in the selected Google Sheet columns'
          );
        }

        const resolved = resolveAnalysisWindow(sourceRows);
        analysisWindow = resolved.window;
        rows = resolved.rows.map(calculateRowMetrics);

        if (!rows.length) {
          throw new Error(
            'No responses were found in the current or latest available financial year'
          );
        }

        const initialModel = buildViewModel(activeView);
        const hasAnyMetric = initialModel.datasets.some(dataset =>
          dataset.datasetRole === 'summary' && dataset.data.length
        );

        if (!hasAnyMetric) {
          throw new Error(
            'No valid BI:BL uncompensated-work responses were found for the selected financial year'
          );
        }

        chartHeadingDetail.textContent = getHeadingDetail(activeView);
        chartNote.textContent = initialModel.note;

        hideLoadingState();
        createChart();
        updateTabIndicator(false);
        setStatus(resolved.warning);

        requestAnimationFrame(() => {
          if (!chart) {
            return;
          }

          chart.resize();
          chart.update('none');
        });
      } catch (error) {
        console.error(error);
        hideLoadingState();

        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load uncompensated work data'
          ).replace(/\.+$/, '')
        );
      }
    }

    updateTabIndicator(false);
    loadDashboard();
  </script>
</body>
</html>
