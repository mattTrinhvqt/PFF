<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>CPD Tracker – Online &amp; Live | PFF</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="./assets/pff_loader.js?v=1.2.5"></script>
<style>
  /* PFF job_tracker_1.html-style table and controls. Standalone file. */
  :root {
    --pff-ink:#151515; --pff-muted:#69718a; --pff-purple:#6600ff;
    --track:#f0f2f5; --row-line:#f8f9fa;
    --first-column-width:53px; --row-height:44px;
    --positive:#188048; --negative:#b42318;
    /* Keep these colour mappings identical to PFF/assets/pff_chart_core.js. */
    --pff-state-nsw:#2db7f5; --pff-state-vic:#2d3a8c;
    --pff-state-qld:#7a0036; --pff-state-sa:#f03a47;
    --pff-state-wa:#000000; --pff-state-tas:#22a36b;
    --pff-state-nt:#c25e00; --pff-state-act:#7b61ff;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;background:#fff;overflow-x:clip}
  body{color:var(--pff-ink);font-family:Lato,Arial,sans-serif;font-size:12px;overflow-x:hidden}
  button,input{font:inherit} button{cursor:pointer}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid rgba(102,0,255,.4);outline-offset:2px}
  [hidden]{display:none!important}
  #app{width:100%;margin:0 auto;padding:1px}
  /* Status precedes filters in the DOM. On wide screens they share one row;
     on narrow screens they stack in the familiar job-tracker order. */
  .topbar{display:flex;flex-direction:column;align-items:stretch;gap:7px;width:100%;margin:0 0 5px}
  .toolbar{width:100%;margin:0}
  .controls{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:5px;width:100%}
  /* pff_loader.js owns the spectral animation, ellipsis and reveal timing. */
  .app-loading{position:relative;inset:auto;z-index:auto;width:100%;height:auto;min-height:210px;background:transparent}
  #app.pff-loader-cycle-hold > .app-loading{justify-content:flex-start!important;padding-top:60px!important;box-sizing:border-box!important}
  #app:not(.is-loading):not(.pff-loader-cycle-hold) > .app-loading{display:none}
  #app.is-loading .topbar,#app.is-loading .table-shell,#app.is-loading .message{display:none}
  .status-row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:14px}
  /* Keep Reset on the count line at every viewport width, not in the filter row. */
  .status-count-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-width:0}
  .status-count-row .table-status{flex:1 1 auto;min-width:0}
  .status-count-row .reset-button{flex:0 0 auto;margin-left:auto}
  .filter-control{position:relative;flex:0 0 auto}
  .filter-button,.reset-button{height:29px;min-height:29px;border:1px solid var(--track);border-radius:4px;background:#fff;padding:0 6px;color:var(--pff-ink);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:none}
  .filter-button:hover,.filter-button[aria-expanded="true"],.reset-button:hover{box-shadow:inset 0 0 0 1px rgba(21,21,21,.12)}
  .filter-label{color:var(--pff-ink);font-size:11px;font-weight:400}
  .filter-value{color:var(--pff-purple);font-size:10px;font-weight:700;max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #zoneValue{display:inline-flex;align-items:baseline;gap:4px;max-width:245px}
  .zone-city{color:var(--pff-ink);font-weight:700}
  .state-option-code{display:inline-block;min-width:30px;font-weight:700}
  .state-filter-nsw{color:var(--pff-state-nsw)}.state-filter-vic{color:var(--pff-state-vic)}
  .state-filter-qld{color:var(--pff-state-qld)}.state-filter-sa{color:var(--pff-state-sa)}
  .state-filter-wa{color:var(--pff-state-wa)}.state-filter-tas{color:var(--pff-state-tas)}
  .state-filter-nt{color:var(--pff-state-nt)}.state-filter-act{color:var(--pff-state-act)}
  .state-option-label{display:inline-flex;align-items:center;gap:8px;flex:1}
  .state-option-place{color:var(--pff-ink);font-weight:400}
  .topic-option-text{font-weight:700}
  .menu-arrow{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid var(--pff-muted)}
  .filter-button[aria-expanded="true"] .menu-arrow{transform:rotate(180deg)}
  .filter-menu{position:absolute;z-index:35;top:calc(100% + 4px);right:0;display:none;min-width:176px;max-width:min(310px,calc(100vw - 12px));max-height:330px;overflow:auto;padding:4px 0;border:1px solid var(--track);border-radius:3px;background:#fff;box-shadow:0 6px 18px rgba(21,21,21,.12)}
  .filter-menu.open{display:block}
  .menu-heading{padding:7px 10px;color:var(--pff-muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--track)}
  /* Timezone radios use the same left purple square / white tick as multi-select checkboxes. */
  .zone-option{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 10px;cursor:pointer;white-space:nowrap;color:var(--pff-ink);font-size:12px}
  .zone-option:hover{text-decoration:underline;text-underline-offset:2px}
  .zone-option input[type="radio"]{appearance:none;-webkit-appearance:none;margin:0;width:14px;height:14px;flex:0 0 14px;border:1px solid #aeb3bd;border-radius:2px;background:#fff;display:grid;place-content:center;cursor:pointer}
  .zone-option input[type="radio"]:checked{background:var(--pff-purple);border-color:var(--pff-purple)}
  .zone-option input[type="radio"]:checked::after{content:"✓";color:#fff;font-size:11px;line-height:1;font-weight:700}
  .zone-option input[type="radio"]:focus-visible{outline:2px solid rgba(102,0,255,.4);outline-offset:2px}
  .zone-option:has(input:checked) .state-option-place{font-weight:700}
  .filter-option{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 10px;color:var(--pff-ink);background:#fff;font-size:12px;font-weight:400;line-height:1.25;cursor:pointer;user-select:none;white-space:nowrap}
  .filter-option:hover{text-decoration:underline;text-underline-offset:2px}
  .filter-option input{width:14px;height:14px;min-width:14px;max-width:14px;flex:0 0 14px;margin:0;accent-color:var(--pff-purple);cursor:pointer}
  .filter-option-all{color:var(--pff-ink);border-bottom:1px solid var(--track);font-weight:700}
  .filter-option .topic-option-text{font-weight:700}
  .zone-time-detail{color:var(--pff-muted);font-size:10px;font-weight:400;white-space:nowrap}
  .state-option-label{min-width:0;gap:7px}
  .filter-menu.multi-select{min-width:204px}
  #zoneMenu{min-width:245px;max-width:min(315px,calc(100vw - 12px))}
  #topicMenu{min-width:230px}
  #providerMenu{min-width:195px}
  .reset-button{font-size:11px;color:var(--pff-muted);gap:4px}
  .reset-button b{color:var(--pff-purple);font-size:14px}
  .statusbar{width:100%;margin:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;min-height:37px}
  .table-status{color:var(--pff-muted);font-size:12px;line-height:1.35;margin:0;font-weight:400;white-space:nowrap}
  .status-count{display:inline-block;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
  /* Same inline status treatment as job_tracker_1.html / pff_chart_core.js. */
  .data-source{font-size:9px;font-weight:700;color:var(--pff-muted);display:inline-flex;align-items:center;gap:4px;letter-spacing:.05em;line-height:1;white-space:nowrap}
  .live-data-dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#e53935}
  .data-source:not(.live) .live-data-dot{background:#c27c00}
  .message{margin:4px 0 7px;padding:7px 9px;width:100%;font-size:11px;line-height:1.4;color:#815618;background:#fffbf5;border:1px solid #eadab6;border-radius:3px}
  .message a{color:var(--pff-purple)}
  .table-shell{width:100%;position:relative;background:#fff;overflow:hidden;border-bottom:1px solid var(--track);isolation:isolate}
  .table-shell::after{content:"";position:absolute;top:0;bottom:0;left:calc(var(--first-column-width) - 1px);z-index:15;width:1px;pointer-events:none;background:linear-gradient(to bottom,#fff 0%,rgba(21,21,21,.16) 10%,var(--pff-ink) 18%,rgba(21,21,21,.16) 78%,#fff 100%)}
  .table-scroll{width:100%;overflow-x:auto;overflow-y:visible;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  .data-table{table-layout:fixed;border-collapse:separate;border-spacing:0;width:969px;min-width:969px;font-variant-numeric:tabular-nums}
  /* Four identically sized, compact CPD classification columns. */
  col.hours-col,col.clin-col,col.ther-col,col.inter-col{width:53px}
  col.title-col{width:404px} col.provider-col{width:119px} col.date-col{width:96px} col.time-col{width:137px}
  thead{position:sticky;top:0;z-index:5;background:#fff}
  .data-table th,.data-table td{position:relative;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;vertical-align:middle;border-right:1px solid var(--track);border-bottom:1px solid var(--row-line);padding:6px 6px;line-height:1.2}
  .data-table th{height:35px;background:#fff;color:var(--pff-muted);border-bottom:1px solid var(--pff-ink);font-size:12px;font-weight:700;z-index:1;overflow:visible}
  .data-table td{height:var(--row-height);background:#fff;color:var(--pff-ink);font-size:12px}
  .data-table th:last-child,.data-table td:last-child{border-right:0}
  /* The first sticky column uses only the gradient divider: no grey cell border. */
  .data-table th:first-child,.data-table td:first-child{border-right:0}
  .data-table tbody tr:last-child td{border-bottom:0}
  .data-table tbody tr:hover td{background:#faf9ff}
  .data-table th:first-child,.data-table td:first-child{position:sticky;left:0;z-index:7;background:#fff;background-clip:padding-box;text-align:center;padding-left:2px;padding-right:2px}
  .data-table th:first-child{z-index:10;border-bottom:1px solid var(--pff-ink)!important}
  .data-table tbody tr:hover td:first-child{background:#faf9ff}
  .data-table th.compact-head{font-size:8.8px;letter-spacing:-.045em;overflow:hidden;padding-left:1px;padding-right:1px}
  .data-table th[data-field="therapeutic"],.data-table th[data-field="interactive"]{font-size:7.25px;letter-spacing:-.055em}
  /* Desktop: full-size classification headings, and space for a visible sort arrow.
     Widths are measured from the longest heading and made identical in JS. */
  @media(min-width:731px){
    .data-table th.compact-head,
    .data-table th[data-field="therapeutic"],
    .data-table th[data-field="interactive"]{font-size:12px;letter-spacing:0;padding-left:5px;padding-right:5px}
    .data-table th.compact-head .sort-button{gap:3px}
  }
  /* Reuse available horizontal space instead of constraining the entire table
     to a fixed ~950 px on a desktop monitor. */
  @media(min-width:850px){
    .topbar{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
    .statusbar{width:auto;flex:0 0 auto;flex-direction:row;align-items:center;gap:11px;min-height:29px}
    .status-row{width:auto;flex:0 0 auto}
    .status-count-row{width:auto;flex:0 0 auto;gap:9px}
    .toolbar{width:auto;flex:0 0 auto}
    .controls{width:auto;flex-wrap:nowrap}
  }
  .data-table th .sort-button{display:flex;width:100%;height:100%;align-items:center;justify-content:center;gap:1px;border:0;background:transparent;color:inherit;padding:0;font-size:inherit;font-weight:inherit;white-space:nowrap;overflow:visible}
  .data-table th:not(.compact-head) .sort-button{justify-content:space-between;text-align:left}
  .data-table th .sort-button:hover{color:var(--pff-ink);text-decoration:underline;text-underline-offset:2px}
  .sort-arrow{flex:none;color:var(--pff-purple);font-size:7px}
  td.num-cell,td.flag-cell{text-align:center!important;font-weight:700}
  td.flag-cell{font-size:14px}
  td.flag-cell.no{font-size:13px;font-weight:400}
  td.flag-cell.unclear{font-size:13px;font-weight:700}
  td.flag-cell.yes{color:var(--positive)}td.flag-cell.no{color:var(--negative)}td.flag-cell.unclear{color:#8b919c}
  .data-table td.title-cell{padding:5px 6px!important;font-weight:700}
  /* Two shared grid rows keep each icon precisely aligned with its corresponding text:
     calendar top == topic-tag top; registration bottom == title-text bottom. */
  .title-layout{display:grid;grid-template-columns:15px minmax(0,1fr);grid-template-rows:15px 15px;column-gap:6px;row-gap:3px;align-items:center;min-width:0;width:100%}
  .topic-prefix{grid-column:2;grid-row:1;align-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:7.5px;font-weight:700;letter-spacing:.05em;line-height:1.1;text-transform:uppercase;pointer-events:none}
  .cpd-link,.cpd-no-link{grid-column:2;grid-row:2;align-self:end;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-weight:700;color:var(--pff-ink);text-decoration:none;line-height:1.2}
  .cpd-link:hover{color:var(--pff-purple);text-decoration:none}
  .calendar-action{grid-column:1;grid-row:1;align-self:start}
  /* Align the visible calendar artwork (not just its 15px hitbox) with the
     topic label's top edge. The SVG path has internal top whitespace. */
  .calendar-action svg{transform:translateY(-4px)}
  .website-action{grid-column:1;grid-row:2;align-self:end}
  /* Directly matched to practice_directory.html .practice-action dimensions and hover style. */
  .practice-action{display:inline-flex;width:15px;height:15px;align-items:center;justify-content:center;padding:0;color:var(--pff-muted);background:transparent;border:0;border-radius:3px;text-decoration:none!important;cursor:pointer}
  .practice-action:hover,.practice-action:focus-visible{color:var(--pff-purple);background:rgba(102,0,255,.06);outline:0}
  .practice-action svg{width:12px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .practice-action.is-disabled{opacity:.16;cursor:default;pointer-events:none}
  .date-time{color:#333b47!important}
  .data-table th:nth-child(n+6),.data-table td:nth-child(n+6){padding-left:4px;padding-right:4px}
  .empty-row td{height:70px!important;text-align:center!important;color:var(--pff-muted)!important;white-space:normal}
  @media(max-width:730px){
    :root{--first-column-width:52px}
    #app{padding:1px}
    .topbar{margin:0 0 6px;width:100%;gap:6px}
    .toolbar{margin:0}
    .controls{justify-content:flex-end;width:100%}
    .statusbar{gap:3px}
    .filter-menu{left:auto;right:0}
    #zoneMenu{left:auto;right:0}
    .filter-button,.reset-button{padding-left:5px;padding-right:5px}
    .filter-label{font-size:10px}.filter-value{font-size:9px;max-width:85px}
    #zoneValue{max-width:200px}
    .zone-time-detail{font-size:9px}
    .data-table{width:890px;min-width:890px}
    col.hours-col,col.clin-col,col.ther-col,col.inter-col{width:52px}
    col.title-col{width:330px}col.provider-col{width:119px}col.date-col{width:96px}col.time-col{width:137px}
    .data-table td{font-size:11px}.data-table th{font-size:11px}
    .data-table th.compact-head{font-size:8.6px}
    .data-table th[data-field="therapeutic"],.data-table th[data-field="interactive"]{font-size:7.1px}
    td.flag-cell{font-size:13px}
    td.flag-cell.no{font-size:12px}
    .app-loading{min-height:180px}
    .table-status{white-space:normal}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main id="app" class="is-loading">
  <div id="loadingState" class="app-loading" role="status" aria-label="Loading CPD tracker">
    <div class="cone-loader">
      <div class="cone blue" aria-hidden="true"></div>
      <div class="cone green" aria-hidden="true"></div>
      <div class="cone red" aria-hidden="true"></div>
    </div>
    <div class="loader-text">Free CPD? Yes please!</div>
  </div>
  <div class="topbar">
    <div class="statusbar">
      <div class="status-row"><div id="dataSource" class="data-source" aria-live="polite"><span class="live-data-dot" aria-hidden="true"></span><span id="sourceText">PREVIEW data</span></div></div>
      <div class="status-count-row"><p id="resultCount" class="table-status" aria-live="polite">Showing 0 of 0 upcoming CPD events within 8 wks</p><button id="reset" type="button" class="reset-button">Reset <b aria-hidden="true">↻</b></button></div>
    </div>
    <section class="toolbar" aria-label="CPD filters">
      <div class="controls">
        <div class="filter-control"><button id="topicButton" type="button" class="filter-button" aria-haspopup="true" aria-expanded="false" aria-controls="topicMenu"><span class="filter-label">Topic</span><span id="topicValue" class="filter-value">ALL</span><span class="menu-arrow" aria-hidden="true"></span></button><div id="topicMenu" class="filter-menu" role="group" aria-label="Topic filters"></div></div>
        <div class="filter-control"><button id="providerButton" type="button" class="filter-button" aria-haspopup="true" aria-expanded="false" aria-controls="providerMenu"><span class="filter-label">Provider</span><span id="providerValue" class="filter-value">ALL</span><span class="menu-arrow" aria-hidden="true"></span></button><div id="providerMenu" class="filter-menu" role="group" aria-label="Provider filters"></div></div>
        <div class="filter-control"><button id="zoneButton" type="button" class="filter-button" aria-haspopup="true" aria-expanded="false" aria-controls="zoneMenu"><span class="filter-label">Timezone</span><span id="zoneValue" class="filter-value"><span class="zone-city">Sydney</span><span class="state-filter-nsw">NSW</span></span><span class="menu-arrow" aria-hidden="true"></span></button><div id="zoneMenu" class="filter-menu" role="group" aria-label="Australian timezones"></div></div>
      </div>
    </section>
  </div>
  <p id="loadMessage" class="message" role="status" hidden></p>
  <section class="table-shell" aria-label="Upcoming free online live CPD events"><div class="table-scroll" role="region" tabindex="0" aria-label="Scroll CPD events horizontally"><table id="cpdTable" class="data-table"><colgroup><col class="hours-col"><col class="clin-col"><col class="ther-col"><col class="inter-col"><col class="title-col"><col class="provider-col"><col class="date-col"><col class="time-col"></colgroup><thead><tr>
    <th scope="col" class="compact-head"><button type="button" class="sort-button" data-sort="hours">CPD hrs<span class="sort-arrow" data-arrow="hours"></span></button></th>
    <th scope="col" class="compact-head"><button type="button" class="sort-button" data-sort="clinical">Clinical<span class="sort-arrow" data-arrow="clinical"></span></button></th>
    <th scope="col" class="compact-head" data-field="therapeutic"><button type="button" class="sort-button" data-sort="therapeutic">Therapeutic<span class="sort-arrow" data-arrow="therapeutic"></span></button></th>
    <th scope="col" class="compact-head" data-field="interactive"><button type="button" class="sort-button" data-sort="interactive">Interactive<span class="sort-arrow" data-arrow="interactive"></span></button></th>
    <th scope="col"><button type="button" class="sort-button" data-sort="title">CPD title <span class="sort-arrow" data-arrow="title"></span></button></th>
    <th scope="col"><button type="button" class="sort-button" data-sort="provider">Provider <span class="sort-arrow" data-arrow="provider"></span></button></th>
    <th scope="col"><button type="button" class="sort-button" data-sort="date">Date <span class="sort-arrow" data-arrow="date">▲</span></button></th>
    <th scope="col"><button type="button" class="sort-button" data-sort="time">Time <span class="sort-arrow" data-arrow="time"></span></button></th>
  </tr></thead><tbody id="tableBody"></tbody></table></div></section>
</main>
<script>
(()=>{
'use strict';
const SHEET_ID='13CiEtjDrr-8Jj0RlAksZojPGUKZvhrPn5nHviUD7uuY';
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=0`;

// Size the title column to its actual contents, not the desktop viewport width.
// Keep four equal classification columns wide enough for 12px headings.
function fitCompactColumns(){
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  if(!ctx)return;
  const mobile=window.matchMedia('(max-width:730px)').matches;
  const size=mobile?11:12;
  const widthOf=(str,bold=false)=>{ctx.font=`${bold?'700':'400'} ${size}px Lato,Arial,sans-serif`;return ctx.measureText(str).width};
  const providers=[...new Set(records.map(r=>r.provider).filter(x=>x&&!/^provider$/i.test(x)))];
  const provider=Math.max(widthOf('Provider',true)+18, ...providers.map(v=>widthOf(v)+11), 76);
  const date=Math.max(widthOf('Date',true)+18,widthOf('31/12/2026')+9);
  const endTimes=records.filter(r=>Number.isFinite(r.startMs)).map(r=>formatTimes(r));
  const time=Math.max(widthOf('Time',true)+18, ...endTimes.map(v=>widthOf(v)+10), 82);
  const values={provider:Math.ceil(provider),date:Math.ceil(date),time:Math.ceil(time)};
  for(const [name,width] of Object.entries(values))document.querySelector('col.'+name+'-col').style.width=width+'px';

  // Reserve the longest full heading plus room for its sort caret and padding.
  // On mobile, preserve the original dense, horizontally scrollable table.
  ctx.font='700 12px Lato,Arial,sans-serif';
  const headings=['CPD hrs','Clinical','Therapeutic','Interactive'];
  const columnWidth=mobile?52:Math.ceil(Math.max(...headings.map(h=>ctx.measureText(h).width))+24);
  for(const name of ['hours','clin','ther','inter'])document.querySelector('col.'+name+'-col').style.width=columnWidth+'px';
  document.documentElement.style.setProperty('--first-column-width',columnWidth+'px');

  const fixedWidth=4*columnWidth+values.provider+values.date+values.time;
  // Measure the longest title and reserve only the space it actually needs,
  // including icons, their gap, cell padding and a small font-rendering buffer.
  // Do not stretch the title to consume spare space on wide monitors.
  // Mobile keeps its existing compact 330px title column with horizontal scroll.
  ctx.font='700 12px Lato,Arial,sans-serif';

}
function buildZoneMenu(){
  const menu=$('zoneMenu'),oldScroll=menu.scrollTop;menu.replaceChildren();
  const heading=document.createElement('div');heading.className='menu-heading';heading.textContent='Australian timezones';menu.append(heading);
  for(const item of ZONES){
    const row=document.createElement('label');row.className='zone-option';
    const input=document.createElement('input');input.type='radio';input.name='cpd-timezone';input.value=item.zone;input.checked=item.zone===zone.zone;
    input.setAttribute('aria-label',item.label+' '+item.state+' '+zoneDetail(item.zone));
    const name=document.createElement('span');name.className='state-option-label';
    const state=document.createElement('span');state.className='state-option-code state-filter-'+item.state.toLowerCase();state.textContent=item.state;
    const city=document.createElement('span');city.className='state-option-place';city.textContent=item.label;
    const detail=document.createElement('span');detail.className='zone-time-detail';detail.textContent=zoneDetail(item.zone);
    name.append(state,city,detail);row.append(input,name);
    input.addEventListener('change',()=>{
      if(!input.checked)return;
      zone=item;
      try{localStorage.setItem('pff-cpd-timezone',zone.zone)}catch(_){/* storage unavailable */}
      closeMenus();refreshMenus();render();
    });menu.append(row);
  }
  menu.scrollTop=oldScroll;
}
function buildMultiMenu(id,options,selection){
  const menu=$(id+'Menu'),oldScroll=menu.scrollTop;menu.replaceChildren();menu.classList.add('multi-select');
  const heading=document.createElement('div');heading.className='menu-heading';heading.textContent='Show '+(id==='topic'?'topics':'providers');menu.append(heading);
  const isAll=selection===null||selection.size===options.length;
  function appendOption(value,caption,checked,all=false){
    const row=document.createElement('label');row.className='filter-option'+(all?' filter-option-all':'');
    const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=checked;checkbox.value=value;checkbox.setAttribute('aria-label',caption);
    if(all && !isAll && selection.size>0)checkbox.indeterminate=true;
    const span=document.createElement('span');span.textContent=caption;
    if(!all && id==='topic'){span.className='topic-option-text';span.style.color=TOPIC_COLOURS[value]||'#69718a'}
    row.append(checkbox,span);
    checkbox.addEventListener('change',()=>{
      if(all){
        if(id==='topic')topicSelection=checkbox.checked?null:new Set();
        else providerSelection=checkbox.checked?null:new Set();
      }else{
        const prev=id==='topic'?topicSelection:providerSelection;
        const next=prev===null?new Set(options):new Set(prev);
        if(checkbox.checked)next.add(value);else next.delete(value);
        const result=next.size===options.length?null:next;
        if(id==='topic')topicSelection=result;else providerSelection=result;
      }
      refreshMenus();render(); // Stay open for additional checkbox selections.
    });
    menu.append(row);
  }
  appendOption('',id==='topic'?'All topics':'All providers',isAll,true);
  for(const value of options)appendOption(value,value,isAll||selection.has(value));
  menu.scrollTop=oldScroll;
}
function updateMultiButton(id,options,selection){
  const isAll=selection===null||selection.size===options.length;
  const value=$(id+'Value'),button=$(id+'Button');
  value.textContent=isAll?'ALL':String(selection.size);
  value.style.color=isAll?'var(--pff-purple)':selection.size?'var(--pff-purple)':'var(--pff-muted)';
  button.style.borderColor=(!isAll&&selection.size===1&&id==='topic')?(TOPIC_COLOURS[[...selection][0]]||'var(--pff-purple)'):(!isAll&&selection.size?'var(--pff-purple)':'var(--track)');
}
function refreshMenus(){
  const topics=[...new Set(records.map(r=>r.topic).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'en-AU'));
  const providers=[...new Set(records.map(r=>r.provider).filter(x=>x&&!/^provider$/i.test(x)))].sort((a,b)=>a.localeCompare(b,'en-AU'));
  if(topicSelection!==null){topicSelection=new Set([...topicSelection].filter(x=>topics.includes(x)));if(topicSelection.size===topics.length)topicSelection=null}
  if(providerSelection!==null){providerSelection=new Set([...providerSelection].filter(x=>providers.includes(x)));if(providerSelection.size===providers.length)providerSelection=null}
  updateMultiButton('topic',topics,topicSelection);
  updateMultiButton('provider',providers,providerSelection);
  const selectedCity=document.createElement('span');selectedCity.className='zone-city';selectedCity.textContent=zone.short;
  const selectedState=document.createElement('span');selectedState.className='state-filter-'+zone.state.toLowerCase();selectedState.textContent=zone.state;
  const selectedDetail=document.createElement('span');selectedDetail.className='zone-time-detail';selectedDetail.textContent=zoneDetail(zone.zone);
  $('zoneValue').replaceChildren(selectedCity,selectedState,selectedDetail);
  buildMultiMenu('topic',topics,topicSelection);
  buildMultiMenu('provider',providers,providerSelection);
  buildZoneMenu();
}
function message(text){const el=$('loadMessage');el.replaceChildren();el.append(document.createTextNode(text+' '));const a=document.createElement('a');a.href=SHEET_URL;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open Google Sheet';el.append(a);el.hidden=!text}
function showSource(next,reason=''){
  source=next;$('dataSource').classList.toggle('live',next==='live');$('sourceText').textContent=next==='live'?'LIVE data':'PREVIEW data';
  message(reason);
}
function gvizRequest(identifier){
  return new Promise((resolve,reject)=>{
    const callback='__pffCpd_'+Math.random().toString(36).slice(2)+Date.now();
    let finished=false;
    const script=document.createElement('script');
    const end=(err,result)=>{if(finished)return;finished=true;clearTimeout(timer);script.remove();try{delete window[callback]}catch(_){window[callback]=undefined}err?reject(err):resolve(result)};
    const timer=setTimeout(()=>end(new Error('Google Sheets did not respond (timeout).')),9500);
    window[callback]=response=>{
      if(!response||response.status==='error'){const e=response?.errors?.[0];end(new Error(e?.detailed_message||e?.message||'Google Sheets rejected the request.'));return}
      end(null,response.table);
    };
    script.onerror=()=>end(new Error('Google Sheets access failed.'));
    const query=new URLSearchParams({headers:'1',range:'B1:K',tqx:`out:json;responseHandler:${callback}`, _:String(Date.now())});
    query.set(identifier==='gid'?'gid':'sheet',identifier==='gid'?'0':SHEET_NAME);
    script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${query.toString()}`;
    script.async=true;document.head.append(script);
  });
}
function parseCSV(str){
  const out=[];let cur='',row=[],quoted=false;
  for(let i=0;i<str.length;i++){
    const c=str[i];if(c==='"'){if(quoted&&str[i+1]==='"'){cur+='"';i++}else quoted=!quoted}
    else if(c===','&&!quoted){row.push(cur);cur=''}
    else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&str[i+1]==='\n')i++;row.push(cur);out.push(row);row=[];cur=''}
    else cur+=c;
  }
  if(cur||row.length){row.push(cur);out.push(row)}
  return out;
}
async function loadCSV(){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0&_=${Date.now()}`;
    const res=await fetch(url,{mode:'cors',credentials:'omit',cache:'no-store',signal:controller.signal});
    if(!res.ok)throw Error('CSV export returned HTTP '+res.status);
    const txt=await res.text();if(txt.trim().startsWith('<!DOCTYPE')||txt.trim().startsWith('<html'))throw Error('CSV export requires public access');
    const raw=parseCSV(txt);
    return raw.slice(1).map((r,i)=>parseRow(r.slice(1,11),i,false)).filter(x=>x.title);
  } finally{clearTimeout(timer)}
}
async function refresh(){
  if(busy)return;busy=true;
  let next,reason='';
  try{
    let err;
    for(const identifier of ['gid','sheet']){
      try{const t=await gvizRequest(identifier);next=parsedGViz(t);if(next.length)break;err=new Error('No CPD titles found in base!B1:K')}catch(e){err=e}
    }
    if(!next?.length){try{next=await loadCSV()}catch(e){err=e}}
    if(!next?.length)throw err||Error('No CPD rows returned from the base tab.');
    records=next;showSource('live');refreshMenus();render();
  }catch(e){
    if(source!=='live'){
      reason='Live data unavailable ('+clean(e?.message).slice(0,135)+'). Showing the pasted preview instead. For live updates, set Google Sheet sharing to Anyone with the link → Viewer; or publish the base tab to the web.';
      showSource('preview',reason);
    }else{showSource('live','Could not refresh the live Google Sheet. Showing the last successfully loaded data.')}
  }finally{busy=false}
}
for(const id of ['topic','provider','zone']){
  $(id+'Button').addEventListener('click',()=>{
    const open=$(id+'Menu').classList.contains('open');closeMenus();if(!open){$(id+'Menu').classList.add('open');$(id+'Button').setAttribute('aria-expanded','true')}
  });
}
document.addEventListener('click',e=>{if(!e.target.closest('.filter-control'))closeMenus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});
const resetFilters=()=>{topicSelection=null;providerSelection=null;sortKey='date';sortDirection=1;closeMenus();refreshMenus();render()};
$('reset').addEventListener('click',resetFilters);
document.querySelectorAll('button[data-sort]').forEach(btn=>btn.addEventListener('click',()=>{if(sortKey===btn.dataset.sort)sortDirection*=-1;else{sortKey=btn.dataset.sort;sortDirection=1}render()}));
records=SNAPSHOT.map((r,i)=>parseRow(r,i,true)).filter(x=>x.title);
refreshMenus();render();showSource('preview');
// Prefer live Google Sheets, but do not hide the offline preview indefinitely if access is slow.
const finishLoading=()=>{$('app').classList.remove('is-loading');};
const loadingFallback=setTimeout(finishLoading,4000);
window.PFFLoader?.sync();
refresh().finally(()=>{clearTimeout(loadingFallback);finishLoading()});
window.addEventListener('resize',render);
document.fonts?.ready.then(render).catch(()=>{});
setInterval(render,30000); // Removes an event automatically as soon as it has ended (no user action required).
})();
</script>
