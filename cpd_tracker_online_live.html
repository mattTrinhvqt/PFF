<style>
  /* PFF job_tracker_1.html-style table and controls. Standalone file. */
  :root {

  #app{width:100%;margin:0 auto;padding:1px 3px 12px}
  .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:3px 3px 5px;width:min(100% - 6px,var(--table-width))}
  .search-wrap{height:29px;min-width:205px;flex:1 1 260px;display:flex;align-items:center;gap:6px;border:1px solid var(--track);border-radius:4px;padding:0 6px 0 8px}
  .search-wrap:focus-within{box-shadow:inset 0 0 0 1px rgba(21,21,21,.12)}
  .search-wrap svg{width:14px;height:14px;flex:none;color:var(--pff-muted);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  #search{border:0;outline:0;min-width:0;width:100%;height:27px;font-size:12px;color:var(--pff-ink);background:transparent}
  #search::placeholder{color:var(--pff-muted)}
  #clearSearch{padding:0;border:0;background:transparent;color:var(--pff-muted);width:18px;height:23px;font-size:18px;line-height:1}
  .controls{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
  .filter-control{position:relative;flex:0 0 auto}
  .filter-button,.reset-button,.reload-button{height:29px;min-height:29px;border:1px solid var(--track);border-radius:4px;background:#fff;padding:0 6px;color:var(--pff-ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:none}
  .filter-button:hover,.filter-button[aria-expanded="true"],.reset-button:hover,.reload-button:hover{box-shadow:inset 0 0 0 1px rgba(21,21,21,.12)}
  .filter-label{color:var(--pff-ink);font-size:11px;font-weight:400}
  .filter-value{color:var(--pff-purple);font-size:10px;font-weight:700;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu-arrow{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid var(--pff-muted)}

  .filter-menu.open{display:block}
  .menu-heading{padding:7px 10px;color:var(--pff-muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--track)}

  .menu-option[aria-pressed="true"]{font-weight:700}
  .menu-option .check{color:var(--pff-purple);font-weight:700;width:10px;text-align:right}
  .menu-option:first-of-type{border-bottom:1px solid var(--track)}
  .reset-button,.reload-button{font-size:11px;color:var(--pff-muted);gap:4px}
  .reset-button b,.reload-button b{color:var(--pff-purple);font-size:14px}
  .reload-button:disabled{opacity:.6;cursor:default}
  .statusbar{width:min(100%,var(--table-width));margin:3px 3px 4px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;min-height:22px}
  .table-status{color:var(--pff-muted);font-size:12px;line-height:1.35;margin:0;font-weight:400;white-space:nowrap}
  .status-count{display:inline-block;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
  .data-source{font-size:9px;font-weight:700;color:var(--pff-muted);display:inline-flex;align-items:center;gap:5px;letter-spacing:.02em}
  .data-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b88626}
  .data-source.live .data-dot{background:var(--positive)}
  .message{margin:4px 3px 7px;padding:7px 9px;width:min(100% - 6px,var(--table-width));font-size:11px;line-height:1.4;color:#815618;background:#fffbf5;border:1px solid #eadab6;border-radius:3px}
  .message a,.footnote a{color:var(--pff-purple)}
  .table-shell{width:min(100%,var(--table-width));position:relative;background:#fff;overflow:hidden;border-bottom:1px solid var(--track);isolation:isolate}
  .table-shell::after{content:"";position:absolute;top:0;bottom:0;left:calc(var(--first-column-width) - 1px);z-index:15;width:1px;pointer-events:none;background:linear-gradient(to bottom,#fff 0%,rgba(21,21,21,.16) 10%,var(--pff-ink) 18%,rgba(21,21,21,.16) 78%,#fff 100%)}
  .table-scroll{width:100%;overflow-x:auto;overflow-y:visible;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  .data-table{table-layout:fixed;border-collapse:separate;border-spacing:0;width:1068px;min-width:1068px;font-variant-numeric:tabular-nums}
  col.hours-col{width:54px} col.clin-col{width:53px} col.ther-col{width:64px} col.inter-col{width:60px}
  col.title-col{width:404px} col.provider-col{width:136px} col.date-col{width:108px} col.time-col{width:189px}
  thead{position:sticky;top:0;z-index:5;background:#fff}
  .data-table th,.data-table td{position:relative;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;vertical-align:middle;border-right:1px solid var(--track);border-bottom:1px solid var(--row-line);padding:6px 6px;line-height:1.2}
  .data-table th{height:35px;background:#fff;color:var(--pff-muted);border-bottom:1px solid var(--pff-ink);font-size:12px;font-weight:700;z-index:1;overflow:visible}
  .data-table td{height:var(--row-height);background:#fff;color:var(--pff-ink);font-size:12px}
  .data-table th:last-child,.data-table td:last-child{border-right:0}
  .data-table tbody tr:last-child td{border-bottom:0}
  .data-table tbody tr:hover td{background:#faf9ff}
  .data-table th:first-child,.data-table td:first-child{position:sticky;left:0;z-index:7;background:#fff;background-clip:padding-box;text-align:center;padding-left:2px;padding-right:2px}
  .data-table th:first-child{z-index:10;border-bottom:1px solid var(--pff-ink)!important}
  .data-table tbody tr:hover td:first-child{background:#faf9ff}
  .data-table th.compact-head{font-size:10px;letter-spacing:-.025em;overflow:hidden}
  .data-table th .sort-button{display:flex;width:100%;height:100%;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:inherit;padding:0;font-size:inherit;font-weight:inherit;white-space:nowrap;overflow:hidden}
  .data-table th:not(.compact-head) .sort-button{justify-content:space-between;text-align:left}
  .data-table th .sort-button:hover{color:var(--pff-ink);text-decoration:underline;text-underline-offset:2px}
  .sort-arrow{flex:none;color:var(--pff-purple);font-size:8px}

    .data-table th.compact-head{font-size:9px}

</style>

    'Paediatrics':'#21865b', 'Myopia':'#4c67bd',
    'Cornea':'#ac643c', 'Neuro-ophthalmology':'#6e55ab',
    'Ocular Disease':'#b0444e', 'Diagnostics':'#267996',
    'Optics':'#5b6b80', 'Refractive Care':'#9c5a32'
  });
const ZONES=[
  {label:'Sydney · NSW',short:'Sydney',zone:'Australia/Sydney'},
  {label:'Melbourne · VIC',short:'Melbourne',zone:'Australia/Melbourne'},
  {label:'Brisbane · QLD',short:'Brisbane',zone:'Australia/Brisbane'},
  {label:'Adelaide · SA',short:'Adelaide',zone:'Australia/Adelaide'},
  {label:'Perth · WA',short:'Perth',zone:'Australia/Perth'},
  {label:'Hobart · TAS',short:'Hobart',zone:'Australia/Hobart'},
  {label:'Darwin · NT',short:'Darwin',zone:'Australia/Darwin'},
  {label:'Canberra · ACT',short:'Canberra',zone:'Australia/Canberra'},
  {label:'Broken Hill · NSW',short:'Broken Hill',zone:'Australia/Broken_Hill'},
  {label:'Lord Howe Island · NSW',short:'Lord Howe',zone:'Australia/Lord_Howe'}
];
const $=id=>document.getElementById(id);
let records=[],source='preview',busy=false,sortKey='date',sortDirection=1;
let topic='',provider='',zone=ZONES[0];
const clean=v=>v==null?'':String(v).trim();
const pad=n=>String(n).padStart(2,'0');
const escapeText=s=>clean(s).toLocaleLowerCase('en-AU');
const formatterCache=new Map();
function getFormatter(tz){if(!formatterCache.has(tz))formatterCache.set(tz,new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}));return formatterCache.get(tz)}
function localParts(instant,tz){const parts=getFormatter(tz).formatToParts(new Date(instant));const obj={};parts.forEach(p=>{if(p.type!=='literal')obj[p.type]=+p.value});return obj}
function dateParts(year,month,day){const d=new Date(Date.UTC(year,month-1,day));if(!(year>=1900&&year<=2200&&month>=1&&month<=12&&day>=1&&day<=31)||d.getUTCFullYear()!==year||d.getUTCMonth()!==month-1||d.getUTCDate()!==day)return null;return {key:`${year}-${pad(month)}-${pad(day)}`,y:year,m:month,d:day}}
function parsedDate(raw,snapshot=false){
  const s=clean(raw);
  const g=/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})(?:,.*)?\)$/.exec(s);if(g)return dateParts(+g[1],+g[2]+1,+g[3]);
  const iso=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);if(iso)return dateParts(+iso[1],+iso[2],+iso[3]);
  const slash=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if(slash){const a=+slash[1],b=+slash[2],y=+slash[3];return snapshot||a>12?dateParts(y,b,a):dateParts(y,a,b)}
  // Google Sheets numeric dates can occasionally be returned as serial day numbers.
  if(/^\d+(?:\.\d+)?$/.test(s)){const epoch=Date.UTC(1899,11,30)+Math.round(+s)*86400000;const d=new Date(epoch);return dateParts(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
  return null;
}
function parsedTime(raw){
  const s=clean(raw).replace(/\s/g,'');
  const m=/(\d{1,2}):(\d{2})\s*[–—\-]\s*(\d{1,2}):(\d{2})/.exec(s);
  if(!m)return null;
  const values=m.slice(1).map(Number);
  if(values[0]>23||values[2]>23||values[1]>59||values[3]>59)return null;
  return {start:values[0]*60+values[1],end:values[2]*60+values[3]};
}
// Resolve a wall clock time in Sydney (including NSW daylight saving) to an absolute instant.
function sydneyLocalToMs(parts,minuteOfDay){
  const target=Date.UTC(parts.y,parts.m-1,parts.d,Math.floor(minuteOfDay/60),minuteOfDay%60);
  let guess=target-11*3600000;
  for(let n=0;n<5;n++){
    const p=localParts(guess,'Australia/Sydney');
    const rendered=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second);
    const corrected=guess+(target-rendered);
    if(corrected===guess)break;
    guess=corrected;
  }
  return guess;
}
function parseRow(v,i,snapshot){
  const d=parsedDate(v[3],snapshot),t=parsedTime(v[4]);
  let startMs=NaN,endMs=NaN;
  if(d&&t){startMs=sydneyLocalToMs(d,t.start);endMs=sydneyLocalToMs(d,t.end+(t.end<=t.start?1440:0));}
  const u=clean(v[9]);let url='';try{const checked=new URL(u);if(['https:','http:'].includes(checked.protocol))url=checked.href}catch(_){/*invalid*/}
  return {index:i,title:clean(v[0]),provider:clean(v[1]),topic:clean(v[2]),hours:clean(v[5]),clinical:clean(v[6]),therapeutic:clean(v[7]),interactive:clean(v[8]),url,dateKey:d?.key||'',timeRaw:clean(v[4]),startMs,endMs};
}
function parsedGViz(table){
  if(!table||!Array.isArray(table.rows))throw Error('No data table returned.');
  return table.rows.map((r,i)=>{
    const cells=r.c||[];
    return parseRow(Array.from({length:10},(_,c)=>{
      const cell=cells[c];if(!cell)return '';
      // Unformatted GViz date values preserve year/month/day, unlike US-formatted cell display strings.
      return c===3?clean(cell.v??cell.f):clean(cell.f??cell.v);
    }),i,false);
  }).filter(r=>r.title);
}
function formatDate(ms){const p=localParts(ms,zone.zone);return `${pad(p.day)}/${pad(p.month)}/${p.year}`}
function formatClock(ms){const p=localParts(ms,zone.zone),h=p.hour%12||12;return `${h}:${pad(p.minute)} ${p.hour>=12?'pm':'am'}`}
function formatTimes(r){return `${formatClock(r.startMs)}–${formatClock(r.endMs)}`}
function flagValue(value){const v=escapeText(value);return ['yes','y','true','1'].includes(v)?'yes':['no','n','false','0'].includes(v)?'no':'unclear'}
function flagRank(v){const x=flagValue(v);return x==='yes'?2:x==='no'?0:1}
function cell(text,cl='',tooltip=''){const td=document.createElement('td');td.className=cl;td.textContent=text||'—';if(tooltip)td.title=tooltip;return td}
function flagCell(value){const state=flagValue(value),symbol=state==='yes'?'✓':state==='no'?'✕':'—';const td=cell(symbol,`flag-cell ${state}`,state==='yes'?'Yes':state==='no'?'No':'Unclear');td.setAttribute('aria-label',td.title);return td}
function compare(a,b,key){
  let av,bv;
  if(['clinical','therapeutic','interactive'].includes(key)){av=flagRank(a[key]);bv=flagRank(b[key])}
  else if(key==='hours'){av=Number(a.hours)||0;bv=Number(b.hours)||0}
  else if(key==='date'){av=a.startMs;bv=b.startMs}
  else if(key==='time'){av=Number.isFinite(a.startMs)?localParts(a.startMs,zone.zone).hour*60+localParts(a.startMs,zone.zone).minute:0;bv=Number.isFinite(b.startMs)?localParts(b.startMs,zone.zone).hour*60+localParts(b.startMs,zone.zone).minute:0}
  else{av=clean(a[key]);bv=clean(b[key])}
  if(typeof av==='number')return av-bv;
  return av.localeCompare(bv,'en-AU',{numeric:true,sensitivity:'base'});
}
function render(){
  const now=Date.now(),q=escapeText($('search').value);
  const upcoming=records.filter(r=>Number.isFinite(r.endMs)&&r.endMs>now);
  const visible=upcoming.filter(r=>(!topic||r.topic===topic)&&(!provider||r.provider===provider)&&(!q||escapeText(`${r.title} ${r.provider} ${r.topic} ${formatDate(r.startMs)} ${formatTimes(r)}`).includes(q)));
  visible.sort((a,b)=>compare(a,b,sortKey)*sortDirection||compare(a,b,'date')||a.index-b.index);
  const fragment=document.createDocumentFragment();
  for(const r of visible){
    const tr=document.createElement('tr');
    tr.append(cell(r.hours,'num-cell',`${r.hours} CPD hours`),flagCell(r.clinical),flagCell(r.therapeutic),flagCell(r.interactive));
    const titleTd=document.createElement('td');titleTd.className='title-cell';
    const tag=document.createElement('span');tag.className='topic-prefix';tag.textContent=r.topic||'Other';tag.style.color=TOPIC_COLOURS[r.topic]||'#69718a';
    const link=document.createElement(r.url?'a':'span');link.className=r.url?'cpd-link':'cpd-no-link';link.textContent=r.title;
    link.title=r.url?'Open registration: '+r.title:r.title;
    if(r.url){link.href=r.url;link.target='_blank';link.rel='noopener noreferrer'}
    titleTd.append(tag,link);tr.append(titleTd,cell(r.provider,'',r.provider),cell(formatDate(r.startMs),'date-time'),cell(formatTimes(r),'date-time'));
    fragment.append(tr);
  }
  if(!visible.length){const tr=document.createElement('tr');tr.className='empty-row';const td=cell(upcoming.length?'No upcoming CPD events match these filters.':'No upcoming CPD events are currently listed.');td.colSpan=8;tr.append(td);fragment.append(tr)}
  $('tableBody').replaceChildren(fragment);
  $('resultCount').innerHTML=`Showing <span class="status-count">${visible.length}</span> of <span class="status-count">${upcoming.length}</span> upcoming CPD events`;
  $('clearSearch').hidden=!$('search').value;
  document.querySelectorAll('[data-arrow]').forEach(el=>el.textContent=el.dataset.arrow===sortKey?(sortDirection===1?'▲':'▼'):'');
  document.querySelectorAll('.sort-button').forEach(btn=>btn.closest('th').setAttribute('aria-sort',btn.dataset.sort===sortKey?(sortDirection===1?'ascending':'descending'):'none'));
}
function closeMenus(except=''){
  for(const id of ['topic','provider','zone']){if(id===except)continue;$(id+'Menu').classList.remove('open');$(id+'Button').setAttribute('aria-expanded','false')}
}
function buildMenu(id,items,selected,apply,label='Choose an option'){
  const menu=$(id+'Menu');const oldScroll=menu.scrollTop;menu.replaceChildren();
  const h=document.createElement('div');h.className='menu-heading';h.textContent=label;menu.append(h);
  for(const item of items){const b=document.createElement('button');b.type='button';b.className='menu-option';b.setAttribute('aria-pressed',String(item.value===selected));const name=document.createElement('span');name.textContent=item.label;const check=document.createElement('span');check.className='check';check.textContent=item.value===selected?'✓':'';b.append(name,check);b.addEventListener('click',()=>{apply(item.value);closeMenus();render();refreshMenus()});menu.append(b)}
  menu.scrollTop=oldScroll;
}
function refreshMenus(){
  const topics=[...new Set(records.map(r=>r.topic).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'en-AU'));
  const providers=[...new Set(records.map(r=>r.provider).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'en-AU'));
  if(topic&&!topics.includes(topic))topic='';if(provider&&!providers.includes(provider))provider='';
  $('topicValue').textContent=topic||'ALL';$('providerValue').textContent=provider||'ALL';$('zoneValue').textContent=zone.short;
  buildMenu('topic',[{value:'',label:'All topics'},...topics.map(x=>({value:x,label:x}))],topic,v=>{topic=v},'Show topics');
  buildMenu('provider',[{value:'',label:'All providers'},...providers.map(x=>({value:x,label:x}))],provider,v=>{provider=v},'Show providers');
  buildMenu('zone',ZONES.map(x=>({label:x.label,value:x.zone})),zone.zone,v=>{zone=ZONES.find(x=>x.zone===v)||ZONES[0]},'Australian timezones');
}
function message(text){const el=$('loadMessage');el.replaceChildren();el.append(document.createTextNode(text+' '));const a=document.createElement('a');a.href=SHEET_URL;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open Google Sheet';el.append(a);el.hidden=!text}
function showSource(next,reason=''){
  source=next;$('dataSource').classList.toggle('live',next==='live');$('sourceText').textContent=next==='live'?'LIVE data · base tab':'PREVIEW · pasted 21/10/2026';
  $('updateNote').textContent=next==='live'?'Live from Google Sheets · refreshed '+new Date().toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',hour12:true}):'Pasted preview · 21/10/2026';
  message(reason);
}
function gvizRequest(identifier){
  return new Promise((resolve,reject)=>{
    const callback='__pffCpd_'+Math.random().toString(36).slice(2)+Date.now();
    let finished=false;
    const script=document.createElement('script');
    const end=(err,result)=>{if(finished)return;finished=true;clearTimeout(timer);script.remove();try{delete window[callback]}catch(_){window[callback]=undefined}err?reject(err):resolve(result)};
    const timer=setTimeout(()=>end(new Error('Google Sheets did not respond (timeout).')),9500);
    window[callback]=response=>{
      if(!response||response.status==='error'){const e=response?.errors?.[0];end(new Error(e?.detailed_message||e?.message||'Google Sheets rejected the request.'));return}
      end(null,response.table);
    };
    script.onerror=()=>end(new Error('Google Sheets access failed.'));
    const query=new URLSearchParams({headers:'1',range:'B1:K',tqx:`out:json;responseHandler:${callback}`, _:String(Date.now())});
    query.set(identifier==='gid'?'gid':'sheet',identifier==='gid'?'0':SHEET_NAME);
    script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${query.toString()}`;
    script.async=true;document.head.append(script);
  });
}
function parseCSV(str){
  const out=[];let cur='',row=[],quoted=false;
  for(let i=0;i<str.length;i++){
    const c=str[i];if(c==='"'){if(quoted&&str[i+1]==='"'){cur+='"';i++}else quoted=!quoted}
    else if(c===','&&!quoted){row.push(cur);cur=''}
    else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&str[i+1]==='\n')i++;row.push(cur);out.push(row);row=[];cur=''}
    else cur+=c;
  }
  if(cur||row.length){row.push(cur);out.push(row)}
  return out;
}
async function loadCSV(){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0&_=${Date.now()}`;
    const res=await fetch(url,{mode:'cors',credentials:'omit',cache:'no-store',signal:controller.signal});
    if(!res.ok)throw Error('CSV export returned HTTP '+res.status);
    const txt=await res.text();if(txt.trim().startsWith('<!DOCTYPE')||txt.trim().startsWith('<html'))throw Error('CSV export requires public access');
    const raw=parseCSV(txt);
    return raw.slice(1).map((r,i)=>parseRow(r.slice(1,11),i,false)).filter(x=>x.title);
  } finally{clearTimeout(timer)}
}
async function refresh(){
  if(busy)return;busy=true;const btn=$('reload');btn.disabled=true;btn.firstChild.textContent='Refreshing…';
  let next,reason='';
  try{
    let err;
    for(const identifier of ['gid','sheet']){
      try{const t=await gvizRequest(identifier);next=parsedGViz(t);if(next.length)break;err=new Error('No CPD titles found in base!B1:K')}catch(e){err=e}
    }
    if(!next?.length){try{next=await loadCSV()}catch(e){err=e}}
    if(!next?.length)throw err||Error('No CPD rows returned from the base tab.');
    records=next;showSource('live');refreshMenus();render();
  }catch(e){
    if(source!=='live'){
      reason='Live data unavailable ('+clean(e?.message).slice(0,135)+'). Showing the pasted preview instead. For live updates, set Google Sheet sharing to Anyone with the link → Viewer; or publish the base tab to the web.';
      showSource('preview',reason);
    }else{showSource('live','Could not refresh the live Google Sheet. Showing the last successfully loaded data.')}
  }finally{busy=false;btn.disabled=false;btn.firstChild.textContent='Refresh'}
}
for(const id of ['topic','provider','zone']){
  $(id+'Button').addEventListener('click',()=>{
    const open=$(id+'Menu').classList.contains('open');closeMenus();if(!open){$(id+'Menu').classList.add('open');$(id+'Button').setAttribute('aria-expanded','true')}
  });
}
document.addEventListener('click',e=>{if(!e.target.closest('.filter-control'))closeMenus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});
$('search').addEventListener('input',render);
$('clearSearch').addEventListener('click',()=>{$('search').value='';render();$('search').focus()});
$('reset').addEventListener('click',()=>{$('search').value='';topic='';provider='';zone=ZONES[0];sortKey='date';sortDirection=1;closeMenus();refreshMenus();render()});
$('reload').addEventListener('click',refresh);
document.querySelectorAll('button[data-sort]').forEach(btn=>btn.addEventListener('click',()=>{if(sortKey===btn.dataset.sort)sortDirection*=-1;else{sortKey=btn.dataset.sort;sortDirection=1}render()}));
records=SNAPSHOT.map((r,i)=>parseRow(r,i,true)).filter(x=>x.title);
refreshMenus();render();showSource('preview');refresh();
setInterval(render,30000); // Removes an event automatically as soon as it has ended (no user action required).
})();
</script>
