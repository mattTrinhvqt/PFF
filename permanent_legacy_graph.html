<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Permanent Legacy Results</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --trend-yellow: #f1c232;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --none-grey: #9aa0aa;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 0;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation:
        blueConeCycle
        2.7s
        infinite
        cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation:
        greenConeCycle
        2.7s
        infinite
        cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation:
        redConeCycle
        2.7s
        infinite
        cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation:
        loadingTextPulse
        2.7s
        infinite
        cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .module-top {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform:
        translate3d(
          var(--tab-indicator-x, 0px),
          0,
          0
        );
      transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        width 420ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: none;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    .chart-heading-row {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      min-height: 31px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 4px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
      will-change: opacity;
    }

    .chart-options-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 1;
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .legend-square {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border: 1px solid transparent;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
    }

    .legend-band {
      width: 17px;
      height: 8px;
      flex: 0 0 17px;
      border: 1px solid transparent;
    }

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -2px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .chart-note {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      max-width: min(250px, calc(100% - 76px));
      padding: 5px 7px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(105, 113, 138, 0.16);
      border-radius: 4px;
      font-size: 8.5px;
      line-height: 1.3;
      pointer-events: none;
    }

    .chart-note.is-hidden {
      display: none;
    }

    #legacyResultsChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 0;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        min-height: 30px;
      }

      .chart-heading {
        padding-top: 4px;
        font-size: 14px;
        line-height: 21px;
      }

      .chart-note {
        max-width: min(220px, calc(100% - 62px));
        font-size: 8px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        font-size: 13px;
      }

      .chart-tab {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main
      id="app"
      class="is-loading"
      aria-busy="true"
    >
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading permanent legacy results"
      >
        <div class="cone-loader">
          <div
            class="cone blue"
            aria-hidden="true"
          ></div>

          <div
            class="cone green"
            aria-hidden="true"
          ></div>

          <div
            class="cone red"
            aria-hidden="true"
          ></div>
        </div>

        <div class="loader-text">
          Loading permanent legacy results...
        </div>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div
            class="tab-list"
            role="tablist"
            aria-label="Permanent legacy result views"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-view="patients"
              aria-selected="true"
            >Patients per day (2025)</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="specialty"
              aria-selected="false"
            >Specialty services (2025)</button>
          </div>
        </div>

        <div
          class="live-data"
          aria-label="Live data"
        >
          <span
            class="live-data-dot"
            aria-hidden="true"
          ></span>

          <span>LIVE data</span>
        </div>
      </div>

      <div
        id="status"
        role="alert"
        aria-live="polite"
      ></div>

      <div class="chart-heading-row">
        <h2 class="chart-heading">
          <span
            id="chartHeadingText"
            class="chart-heading-fixed"
          >Patients per day (2025)</span>
        </h2>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >&#8249;</button>

          <div
            id="legendViewport"
            class="legend-viewport"
          >
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Chart legend"
            ></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >&#8250;</button>
        </div>
      </div>

      <div class="chart-shell">
        <aside
          id="chartNote"
          class="chart-note is-hidden"
          role="note"
        ></aside>

        <canvas
          id="legacyResultsChart"
          aria-label="Permanent legacy results chart"
          tabindex="-1"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    Chart.defaults.font.family =
      "'Lato', sans-serif";

    Chart.defaults.color =
      '#151515';

    const CONFIG = {
      sheetId:
        '1D4EoCMnH_RbwbuzFtw92NOwnvR_r9zQV7dAaXtfnnd0',

      sheetName:
        'Data',

      range:
        'A:F',

      fetchTimeoutMs:
        20000,

      transitionMs:
        650,

      spineTransitionMs:
        220,

      minimumPatientsPerDay:
        0,

      maximumPatientsPerDay:
        80
    };

    const VIEW_CONFIG = {
      patients:
        'Patients per day (2025)',

      specialty:
        'Specialty services (2025)'
    };

    const COLOURS = {
      purple:
        '#6600ff',

      yellow:
        '#f1c232',

      none:
        '#9aa0aa',

      ink:
        '#151515',

      muted:
        '#69718a',

      track:
        '#e8eaf0'
    };

    const CHART_GEOMETRY = {
      patientsYAxisWidthDesktop:
        70,

      patientsYAxisWidthMobile:
        64,

      specialtyYAxisWidthDesktop:
        154,

      specialtyYAxisWidthMobile:
        138,

      xAxisHeight:
        46,

      rightPadding:
        45
    };

    function fixedPatientsYAxisWidth(
      scale
    ) {
      scale.width =
        window.matchMedia(
          '(max-width: 430px)'
        ).matches
          ? CHART_GEOMETRY
              .patientsYAxisWidthMobile
          : CHART_GEOMETRY
              .patientsYAxisWidthDesktop;
    }

    function fixedSpecialtyYAxisWidth(
      scale
    ) {
      scale.width =
        window.matchMedia(
          '(max-width: 430px)'
        ).matches
          ? CHART_GEOMETRY
              .specialtyYAxisWidthMobile
          : CHART_GEOMETRY
              .specialtyYAxisWidthDesktop;
    }

    function fixedXAxisHeight(
      scale
    ) {
      scale.height =
        CHART_GEOMETRY
          .xAxisHeight;
    }

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById(
        'loadingState'
      );

    const statusElement =
      document.getElementById(
        'status'
      );

    const chartHeadingText =
      document.getElementById(
        'chartHeadingText'
      );

    const tabList =
      document.querySelector(
        '.tab-list'
      );

    const chartTabs = [
      ...document.querySelectorAll(
        '.chart-tab'
      )
    ];

    const tabByView =
      new Map(
        chartTabs.map(
          tab => [
            tab.dataset.view,
            tab
          ]
        )
      );

    const legendViewport =
      document.getElementById(
        'legendViewport'
      );

    const chartLegend =
      document.getElementById(
        'chartLegend'
      );

    const legendScrollLeft =
      document.getElementById(
        'legendScrollLeft'
      );

    const legendScrollRight =
      document.getElementById(
        'legendScrollRight'
      );

    const chartNote =
      document.getElementById(
        'chartNote'
      );

    const chartShell =
      document.querySelector(
        '.chart-shell'
      );

    const chartCanvas =
      document.getElementById(
        'legacyResultsChart'
      );

    let rows = [];
    let chart = null;
    let activeView = 'patients';
    let responsiveLayoutFrame = null;
    let currentLegendSignature = '';
    let legendAnimationToken = 0;
    let axisFadeFrame = null;
    let axisFadeOpacity = 1;
    let spineTransitionFrame = null;
    let viewSwitchLocked = false;

    const spineTransitionState = {
      active: false,
      left: NaN,
      right: NaN,
      top: NaN,
      bottom: NaN
    };

    const patientsDistributionState = {
      median: NaN,
      q1: NaN,
      q3: NaN,
      count: 0
    };

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function normaliseText(value) {
      return cleanText(value)
        .replace(/[’‘]/g, "'")
        .replace(/[‐‑‒–—]/g, '-')
        .toLowerCase();
    }

    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.max(
        minimum,
        Math.min(
          maximum,
          value
        )
      );
    }

    function animateAxisOpacity(
      from,
      to,
      duration,
      onComplete
    ) {
      if (axisFadeFrame !== null) {
        cancelAnimationFrame(
          axisFadeFrame
        );

        axisFadeFrame = null;
      }

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        reduceMotion ||
        duration <= 0
      ) {
        axisFadeOpacity = to;
        chart?.draw();
        onComplete?.();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        const progress =
          Math.min(
            (
              now -
              startedAt
            ) /
            duration,
            1
          );

        const eased =
          1 -
          Math.pow(
            1 - progress,
            3
          );

        axisFadeOpacity =
          from +
          (
            to - from
          ) *
          eased;

        chart?.draw();

        if (progress < 1) {
          axisFadeFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          axisFadeFrame = null;
          axisFadeOpacity = to;
          chart?.draw();
          onComplete?.();
        }
      }

      axisFadeFrame =
        requestAnimationFrame(
          frame
        );
    }

    function copyChartArea(
      area
    ) {
      if (!area) {
        return null;
      }

      const copy = {
        left:
          Number(area.left),

        right:
          Number(area.right),

        top:
          Number(area.top),

        bottom:
          Number(area.bottom)
      };

      return Object.values(copy).every(
        Number.isFinite
      )
        ? copy
        : null;
    }

    function setSpineGeometry(
      area
    ) {
      const geometry =
        copyChartArea(
          area
        );

      if (!geometry) {
        return;
      }

      spineTransitionState.left =
        geometry.left;

      spineTransitionState.right =
        geometry.right;

      spineTransitionState.top =
        geometry.top;

      spineTransitionState.bottom =
        geometry.bottom;
    }

    function animateSpineGeometry(
      fromArea,
      toArea,
      duration,
      onComplete
    ) {
      if (
        spineTransitionFrame !==
        null
      ) {
        cancelAnimationFrame(
          spineTransitionFrame
        );

        spineTransitionFrame =
          null;
      }

      const from =
        copyChartArea(
          fromArea
        );

      const to =
        copyChartArea(
          toArea
        );

      if (!from || !to) {
        spineTransitionState.active =
          false;

        setSpineGeometry(
          to ||
          from
        );

        chart?.draw();
        onComplete?.();
        return;
      }

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      spineTransitionState.active =
        true;

      setSpineGeometry(
        from
      );

      if (
        reduceMotion ||
        duration <= 0
      ) {
        setSpineGeometry(
          to
        );

        spineTransitionState.active =
          false;

        chart?.draw();
        onComplete?.();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        const progress =
          Math.min(
            (
              now -
              startedAt
            ) /
            duration,
            1
          );

        const eased =
          progress < 0.5
            ? 4 * progress * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        spineTransitionState.left =
          from.left +
          (
            to.left -
            from.left
          ) *
          eased;

        spineTransitionState.right =
          from.right +
          (
            to.right -
            from.right
          ) *
          eased;

        spineTransitionState.top =
          from.top +
          (
            to.top -
            from.top
          ) *
          eased;

        spineTransitionState.bottom =
          from.bottom +
          (
            to.bottom -
            from.bottom
          ) *
          eased;

        chart?.draw();

        if (progress < 1) {
          spineTransitionFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          spineTransitionFrame =
            null;

          setSpineGeometry(
            to
          );

          spineTransitionState.active =
            false;

          chart?.draw();
          onComplete?.();
        }
      }

      spineTransitionFrame =
        requestAnimationFrame(
          frame
        );
    }

    function toNumber(value) {
      const cleaned =
        cleanText(value)
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function getCellValue(cell) {
      return cell?.v ?? cell?.f ?? '';
    }

    function rgba(
      colour,
      opacity
    ) {
      const text =
        String(colour || '').trim();

      const match =
        text.match(
          /^#([0-9a-f]{6})$/i
        );

      if (!match) {
        return (
          `rgba(119, 119, 119, ` +
          `${opacity})`
        );
      }

      const digits =
        match[1];

      return (
        `rgba(` +
        `${parseInt(
          digits.slice(0, 2),
          16
        )}, ` +
        `${parseInt(
          digits.slice(2, 4),
          16
        )}, ` +
        `${parseInt(
          digits.slice(4, 6),
          16
        )}, ` +
        `${opacity})`
      );
    }

    function axisTickLabelColour() {
      return rgba(
        COLOURS.ink,
        clamp(
          axisFadeOpacity,
          0,
          1
        )
      );
    }

    function percentile(
      sortedValues,
      probability
    ) {
      if (!sortedValues.length) {
        return NaN;
      }

      const index =
        (
          sortedValues.length -
          1
        ) *
        probability;

      const lowerIndex =
        Math.floor(index);

      const upperIndex =
        Math.ceil(index);

      if (
        lowerIndex ===
        upperIndex
      ) {
        return sortedValues[
          lowerIndex
        ];
      }

      return (
        sortedValues[
          lowerIndex
        ] +
        (
          sortedValues[
            upperIndex
          ] -
          sortedValues[
            lowerIndex
          ]
        ) *
        (
          index -
          lowerIndex
        )
      );
    }

    function calculateStatistics(
      values
    ) {
      const sorted =
        values
          .filter(
            Number.isFinite
          )
          .slice()
          .sort(
            (
              first,
              second
            ) =>
              first -
              second
          );

      return {
        count:
          sorted.length,

        median:
          percentile(
            sorted,
            0.5
          ),

        q1:
          percentile(
            sorted,
            0.25
          ),

        q3:
          percentile(
            sorted,
            0.75
          )
      };
    }

    function formatNumber(
      value,
      maximumFractionDigits = 1
    ) {
      return Number.isFinite(
        Number(value)
      )
        ? new Intl.NumberFormat(
            'en-AU',
            {
              maximumFractionDigits
            }
          ).format(
            Number(value)
          )
        : '—';
    }

    function formatPercentage(
      value,
      maximumFractionDigits = 1
    ) {
      return Number.isFinite(
        Number(value)
      )
        ? (
            formatNumber(
              value,
              maximumFractionDigits
            ) +
            '%'
          )
        : '—';
    }

    function titleCaseSpecialty(
      value
    ) {
      return cleanText(value)
        .split(' ')
        .map(
          word =>
            word
              ? (
                  word.charAt(0)
                    .toUpperCase() +
                  word
                    .slice(1)
                    .toLowerCase()
                )
              : ''
        )
        .join(' ');
    }

    function canonicalSpecialty(
      value
    ) {
      const original =
        cleanText(value);

      const text =
        normaliseText(value)
          .replace(/\s*\/\s*/g, ' / ')
          .replace(/\s*-\s*/g, '-')
          .replace(/\s+/g, ' ')
          .trim();

      if (!text) {
        return null;
      }

      if (
        text.includes(
          'none'
        ) ||
        text.includes(
          'routine eye exam'
        ) ||
        text ===
          'routine'
      ) {
        return (
          'None – routine eye exams'
        );
      }

      if (
        text ===
          'multiple' ||
        text.includes(
          'multiple specialties'
        )
      ) {
        return null;
      }

      if (
        text.includes(
          'myopia'
        )
      ) {
        return 'Myopia control';
      }

      if (
        text.includes(
          'advanced contact'
        ) ||
        text.includes(
          'specialty contact'
        ) ||
        text.includes(
          'speciality contact'
        )
      ) {
        return (
          'Advanced contact lenses'
        );
      }

      if (
        text.includes(
          'behaviour'
        ) ||
        text.includes(
          'behavior'
        ) ||
        text.includes(
          'paediatric'
        ) ||
        text.includes(
          'pediatric'
        )
      ) {
        return (
          'Behavioural / paediatric'
        );
      }

      if (
        text.includes(
          'low-vision'
        ) ||
        text.includes(
          'low vision'
        )
      ) {
        return 'Low-vision';
      }

      if (
        text.includes(
          'dry-eye'
        ) ||
        text.includes(
          'dry eye'
        ) ||
        text.includes(
          'dryeye'
        )
      ) {
        return 'Dry-eye';
      }

      return titleCaseSpecialty(
        original
      );
    }

    function parseSpecialtyServices(
      value
    ) {
      const text =
        cleanText(value);

      const normalised =
        normaliseText(value);

      const missingResponseValues =
        new Set([
          '',
          'x',
          'xx',
          'xxx',
          'n/a',
          'na',
          'not collected',
          'not asked',
          'unspecified'
        ]);

      if (
        !text ||
        missingResponseValues.has(
          normalised
        )
      ) {
        return {
          hasResponse: false,
          services: [],
          multiple: false,
          none: false
        };
      }

      const parts =
        text
          .split(
            /\s*(?:;|\||\n|\r)\s*/
          )
          .map(
            canonicalSpecialty
          )
          .filter(Boolean);

      const unique =
        [
          ...new Set(parts)
        ];

      const nonRoutine =
        unique.filter(
          service =>
            service !==
            'None – routine eye exams'
        );

      const hasRoutineOnly =
        nonRoutine.length === 0 &&
        unique.includes(
          'None – routine eye exams'
        );

      return {
        hasResponse: true,

        services:
          hasRoutineOnly
            ? [
                'None – routine eye exams'
              ]
            : nonRoutine,

        multiple:
          nonRoutine.length > 1,

        none:
          hasRoutineOnly
      };
    }

    function buildHistogram(
      values
    ) {
      if (!values.length) {
        return {
          bins: [],
          minimum: -0.5,
          maximum: 2.5,
          finalTick: 2
        };
      }

      const maximumObserved =
        Math.max(...values);

      let finalTick =
        Math.max(
          2,
          Math.ceil(
            maximumObserved
          )
        );

      if (finalTick % 2 !== 0) {
        finalTick += 1;
      }

      const bins =
        Array.from(
          {
            length:
              finalTick + 1
          },
          (
            _,
            value
          ) => ({
            x: value,
            count: 0
          })
        );

      values.forEach(value => {
        const roundedValue =
          clamp(
            Math.round(value),
            0,
            finalTick
          );

        bins[
          roundedValue
        ].count += 1;
      });

      return {
        bins,
        minimum: -0.5,
        maximum:
          finalTick + 0.5,
        finalTick
      };
    }

    function loadSheetRows() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffPermanentLegacyCallback_${Date.now()}_${Math.floor(
              Math.random() *
              1000000
            )}`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Could not load Google Sheet data'
                  )
                );
              },
              CONFIG.fetchTimeoutMs
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            script.remove();
          }

          function finish(
            error,
            response
          ) {
            if (settled) {
              return;
            }

            settled = true;
            cleanup();

            if (error) {
              reject(error);
              return;
            }

            if (
              !response ||
              response.status ===
                'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          }

          window[
            callbackName
          ] =
            response =>
              finish(
                null,
                response
              );

          script.onerror =
            () =>
              finish(
                new Error(
                  'Network error loading Google Sheet data'
                )
              );

          const params =
            new URLSearchParams({
              sheet:
                CONFIG.sheetName,

              range:
                CONFIG.range,

              headers:
                '1',

              tq:
                'select A,D,F where A is not null',

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/` +
            `${CONFIG.sheetId}/gviz/tq?` +
            params.toString();

          document.body.appendChild(
            script
          );
        }
      );
    }

    function normaliseRows(
      sourceRows

      return sourceRows
        .map(
          (
            sourceRow,
            sourceIndex

            const cells =

            const responseKey =
              cleanText(

            return {
              sourceIndex,

              specialtyText:
                cleanText(
                  getCellValue(
                    cells[2]

            };
          }
        )
        .filter(
          row =>
            Boolean(
              row.responseKey
            )
        );
    }

    function createSpecialtyView() {
      const specialtyResponses =
        rows
          .map(row => ({
            row,

            parsed:
              parseSpecialtyServices(
                row.specialtyText
              )
          }))
          .filter(
            response =>
              response
                .parsed
                .hasResponse
          );

      const totalSpecialtyResponses =
        specialtyResponses.length;

      const counts =
        new Map();

      specialtyResponses.forEach(
        response => {
          const parsed =
            response.parsed;

          parsed.services.forEach(
            service => {
              counts.set(
                service,
                (
                  counts.get(
                    service
                  ) ||
                  0
                ) +
                1
              );
            }
          );

          if (parsed.multiple) {
            counts.set(
              'Multiple',
              (
                counts.get(
                  'Multiple'
                ) ||
                0
              ) +
              1
            );
          }
        }
      );

      const denominator =
        Math.max(
          1,
          totalSpecialtyResponses
        );

      const categoryItems =
        [
          ...counts.entries()
        ]
          .map(
            (
              [
                label,
                count
              ]
            ) => ({
              label,
              count,

              percentage:
                count /
                denominator *
                100
            })
          );

      const descendingSpecialties =
        categoryItems
          .filter(
            item =>
              item.label !==
                'Multiple' &&
              item.label !==
                'None – routine eye exams'

          .sort(
            (
              first,
              second
            ) =>
              second.percentage -

              first.label.localeCompare(

      const hoverColours =

              ? COLOURS.yellow

    function drawLegacyAxisTicks(
      context,
      scale,
      axis,
      isMajorTick
    ) {
      if (!scale) {
        return;
      }

      const ticks =
        scale.ticks ||
        [];

      if (!ticks.length) {
        return;
      }

      context.save();
      context.globalAlpha =
        clamp(
          axisFadeOpacity,
          0,
          1
        );
      context.lineCap =
        'butt';
      context.strokeStyle =
        COLOURS.ink;

      ticks.forEach(
        (
          tick,
          index
        ) => {
          const value =
            Number(
              tick.value
            );

          const pixel =
            scale.getPixelForTick(
              index
            );

          if (
            !Number.isFinite(
              value
            ) ||
            !Number.isFinite(
              pixel
            )
          ) {
            return;
          }

          const major =
            isMajorTick(
              value
            );

          const tickLength =
            major
              ? 6
              : 2;

          context.beginPath();
          context.lineWidth =
            major
              ? 1.1
              : 0.7;

          if (axis === 'x') {
            context.moveTo(
              pixel,
              scale.top
            );

            context.lineTo(
              pixel,
              scale.top +
              tickLength
            );
          } else {
            context.moveTo(
              scale.right,
              pixel
            );

            context.lineTo(
              scale.right -
              tickLength,
              pixel
            );
          }

          context.stroke();
        }
      );

      context.restore();
    }

    const constantSpinePlugin = {
      id:
        'constantSpinePlugin',

      afterDraw(
        activeChart
      ) {
        const area =
          activeChart.chartArea;

        if (!area) {
          return;
        }

        const left =
          spineTransitionState.active &&
          Number.isFinite(
            spineTransitionState.left
          )
            ? spineTransitionState.left
            : area.left;

        const right =
          spineTransitionState.active &&
          Number.isFinite(
            spineTransitionState.right
          )
            ? spineTransitionState.right
            : area.right;

        const top =
          spineTransitionState.active &&
          Number.isFinite(
            spineTransitionState.top
          )
            ? spineTransitionState.top
            : area.top;

        const bottom =
          spineTransitionState.active &&
          Number.isFinite(
            spineTransitionState.bottom
          )
            ? spineTransitionState.bottom
            : area.bottom;

        const context =
          activeChart.ctx;

        context.save();
        context.globalAlpha = 1;
        context.strokeStyle =
          COLOURS.ink;
        context.lineWidth = 1.1;
        context.lineCap = 'butt';

        context.beginPath();
        context.moveTo(
          left,
          bottom
        );
        context.lineTo(
          right,
          bottom
        );
        context.stroke();

        context.beginPath();
        context.moveTo(
          left,
          top
        );
        context.lineTo(
          left,
          bottom
        );
        context.stroke();

        context.restore();
      }
    };

    const legacyAxisTickPlugin = {
      id:
        'legacyAxisTickPlugin',

      afterDraw(
        activeChart

        if (
          activeView ===

          drawLegacyAxisTicks(

        if (

    const patientsDistributionPlugin = {
      id:
        'patientsDistributionPlugin',

      beforeDatasetsDraw(
        activeChart
      ) {
        if (
          activeView !==
            'patients' ||
          !Number.isFinite(
            patientsDistributionState.q1

          !Number.isFinite(
            patientsDistributionState.q3
          )
        ) {
          return;

        const xScale =
          activeChart.scales.x;

        const area =
          activeChart.chartArea;

        if (
          !xScale ||
          !area
        ) {
          return;
        }

        const q1X =
          xScale.getPixelForValue(
            patientsDistributionState.q1
          );

        const q3X =
          xScale.getPixelForValue(
            patientsDistributionState.q3
          );

        const context =
          activeChart.ctx;

        context.save();

        context.fillStyle =
          rgba(
            COLOURS.purple,
            0.08
          );

        context.strokeStyle =
          rgba(
            COLOURS.purple,
            0.24
          );

        context.lineWidth =
          1;

        const left =
          Math.min(
            q1X,
            q3X
          );

        const width =
          Math.abs(
            q3X -
            q1X
          );

        context.fillRect(
          left,
          area.top,
          width,
          area.bottom -
          area.top
        );

        context.strokeRect(
          left,
          area.top,
          width,
          area.bottom -
          area.top
        );

        context.restore();
      }
    };

    const specialtyValueLabelPlugin = {
      id:
        'specialtyValueLabelPlugin',

      afterDatasetsDraw(
        activeChart
      ) {
        if (
          activeView !==
          'specialty'
        ) {
          return;
        }

        const dataset =
          activeChart
            .data
            .datasets
            ?.[0];

        const metadata =
          activeChart
            .getDatasetMeta(
              0
            );

        if (
          !dataset ||
          !metadata
        ) {
          return;
        }

        const context =
          activeChart.ctx;

        const area =
          activeChart.chartArea;

        context.save();

        context.font =
          '700 10px Lato, sans-serif';

        context.textBaseline =
          'middle';

        metadata.data.forEach(
          (
            element,
            index
          ) => {
            const raw =
              dataset.data[index];

            const label =
              formatPercentage(
                raw?.percentage,
                1
              );

            const textWidth =
              context.measureText(
                label
              ).width;

            const preferredX =
              element.x +
              5;

            const fitsOutside =
              preferredX +
              textWidth <=
              area.right +
              40;

            if (fitsOutside) {
              context.textAlign =
                'left';

              context.fillStyle =
                COLOURS.ink;

              context.fillText(
                label,
                preferredX,
                element.y
              );
            } else {
              context.textAlign =
                'right';

              context.fillStyle =
                '#ffffff';

              context.fillText(
                label,
                element.x -
                5,
                element.y
              );
            }
          }
        );

        context.restore();
      }
    };

    function getInteractiveElement(
      elements,
      activeChart
    ) {
      return (
        elements ||
        []
      ).find(element => {
        const role =
          activeChart
            ?.data
            ?.datasets
            ?.[
              element.datasetIndex
            ]
            ?.datasetRole;

        return (
          role ===
            'patientsHistogram' ||
          role ===
            'patientsMedian' ||
          role ===
            'specialtyBars'
        );
      });
    }

    function findNearestPatientsMedian(
      event,
      activeChart,
      maximumDistance = 10
    ) {
      if (
        activeView !==
          'patients' ||
        !activeChart?.chartArea
      ) {
        return null;
      }

      const datasetIndex =
        activeChart.data.datasets.findIndex(
          dataset =>
            dataset.datasetRole ===
            'patientsMedian'
        );

      if (datasetIndex < 0) {
        return null;
      }

      const renderedPoints =
        activeChart
          .getDatasetMeta(
            datasetIndex
          )
          ?.data ||
        [];

      if (!renderedPoints.length) {
        return null;
      }

      const eventX =
        Number(event?.x);

      const eventY =
        Number(event?.y);

      const area =
        activeChart.chartArea;

      if (
        !Number.isFinite(eventX) ||
        !Number.isFinite(eventY) ||
        eventY < area.top ||
        eventY > area.bottom
      ) {
        return null;
      }

      const lineX =
        Number(
          renderedPoints[0]?.x
        );

      if (
        !Number.isFinite(lineX) ||
        Math.abs(
          eventX -
          lineX
        ) >
          maximumDistance
      ) {
        return null;
      }

      let nearestIndex =
        0;

      let nearestDistance =
        Infinity;

      renderedPoints.forEach(
        (
          point,
          index
        ) => {
          const distance =
            Math.abs(
              eventY -
              Number(point?.y)
            );

          if (
            Number.isFinite(distance) &&
            distance <
              nearestDistance
          ) {
            nearestDistance =
              distance;

            nearestIndex =
              index;
          }
        }
      );

      return {
        datasetIndex,
        index:
          nearestIndex
      };
    }

    function resolveInteractiveElement(
      event,
      elements,
      activeChart
    ) {
      return (
        findNearestPatientsMedian(
          event,
          activeChart
        ) ||
        getInteractiveElement(
          elements,
          activeChart
        )
      );
    }

    function setActiveTooltip(
      event,
      selectedElement,
      activeChart
    ) {
      if (
        !selectedElement ||
        !activeChart?.tooltip
      ) {
        activeChart?.tooltip
          ?.setActiveElements(
            [],
            {
              x: 0,
              y: 0
            }
          );

        activeChart?.update(
          'none'
        );

        return;
      }

      const renderedElement =
        activeChart
          .getDatasetMeta(
            selectedElement.datasetIndex
          )
          ?.data
          ?.[
            selectedElement.index
          ];

      activeChart.tooltip
        .setActiveElements(
          [
            {
              datasetIndex:
                selectedElement.datasetIndex,

              index:
                selectedElement.index
            }
          ],
          {
            x:
              Number.isFinite(
                Number(event?.x)
              )
                ? Number(event.x)
                : renderedElement?.x ||
                  0,

            y:
              Number.isFinite(
                Number(event?.y)
              )
                ? Number(event.y)
                : renderedElement?.y ||
                  0
          }
        );

      activeChart.update(
        'none'
      );
    }

    function handleChartHover(
      event,
      elements,
      activeChart
    ) {
      if (
        !activeChart ||
        viewSwitchLocked
      ) {
        if (activeChart) {
          activeChart.canvas.style.cursor =
            'default';
        }

        return;
      }

      const selectedElement =
        resolveInteractiveElement(
          event,
          elements,
          activeChart
        );

      activeChart.canvas.style.cursor =
        selectedElement
          ? 'pointer'
          : 'default';

      setActiveTooltip(
        event,
        selectedElement,
        activeChart
      );
    }

    function handleChartClick(
      event,
      elements,
      activeChart
    ) {
      if (
        !activeChart ||
        viewSwitchLocked
      ) {
        return;
      }

      event?.native
        ?.preventDefault?.();

      const selectedElement =
        resolveInteractiveElement(
          event,
          elements,
          activeChart
        );

      setActiveTooltip(
        event,
        selectedElement,
        activeChart
      );
    }

    function createChart() {
      const model =
        buildViewModel(
          activeView
        );

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type:
              model.type,

            data:
              model.data,

            options:
              createChartOptions(
                model
              ),

            plugins: [
              constantSpinePlugin,
              legacyAxisTickPlugin,
              patientsDistributionPlugin,
              specialtyValueLabelPlugin
            ]
          }
        );

      setSpineGeometry(
        chart.chartArea
      );

      updateLegend(
        model.legendItems,
        false
      );

      updateChartNote(
        model.note
      );

    function commitView(
      nextView,
      animateData = true
    ) {
      activeView =
        nextView;

      const model =
        buildViewModel(
          activeView
        );

      fadeTextChange(
        chartHeadingText,
        VIEW_CONFIG[
          activeView
        ]
      );

      updateActiveTab();

      updateLegend(
        model.legendItems,
        animateData
      );

      updateChartNote(
        model.note
      );

      chart.config.type =
        model.type;

      chart.data =
        model.data;

      chart.options =
        createChartOptions(
          model
        );

      chart.update(
        animateData
          ? undefined
          : 'none'
      );
    }

    function applyView(
      nextView,
      animate = true
    ) {
      if (
        !chart ||
        viewSwitchLocked ||
        !VIEW_CONFIG[
          nextView
        ] ||
        nextView ===
          activeView
      ) {
        return;
      }

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        !animate ||
        reduceMotion
      ) {
        axisFadeOpacity = 1;
        spineTransitionState.active =
          false;

        commitView(
          nextView,
          false
        );

        setSpineGeometry(
          chart.chartArea
        );

        return;
      }

      viewSwitchLocked = true;

      chart.tooltip
        ?.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

      const previousArea =
        copyChartArea(
          chart.chartArea
        );

      spineTransitionState.active =
        true;

      setSpineGeometry(
        previousArea
      );

      animateAxisOpacity(
        axisFadeOpacity,
        0,
        170,
        () => {
          commitView(
            nextView,
            true
          );

          const nextArea =
            copyChartArea(
              chart.chartArea
            );

          let completedAnimations =
            0;

          function finishViewSwitch() {
            completedAnimations +=
              1;

            if (
              completedAnimations >=
              2
            ) {
              viewSwitchLocked =
                false;
            }
          }

          animateSpineGeometry(
            previousArea,
            nextArea,
            CONFIG.spineTransitionMs,
            finishViewSwitch
          );

          animateAxisOpacity(
            0,
            1,
            300,
            finishViewSwitch
          );
        }
      );
    }

    function appendLegendItem(
      itemData
    ) {
      const item =
        document.createElement(
          'span'
        );

      item.className =
        'legend-item';

      const marker =
        document.createElement(
          'span'
        );

      marker.className =
        itemData.markerType ===
          'line'
          ? 'legend-line'
          : itemData.markerType ===
              'band'
            ? 'legend-band'
            : 'legend-square';

      marker.style.background =
        itemData.colour;

      if (
        itemData.markerType ===
          'square' ||
        itemData.markerType ===
          'band'
      ) {
        marker.style.borderColor =
          itemData.borderColour ||
          itemData.colour;
      }

      const text =
        document.createElement(
          'span'
        );

      text.textContent =
        itemData.label;

      item.appendChild(
        marker
      );

      item.appendChild(
        text
      );

      chartLegend.appendChild(
        item
      );
    }

    function updateLegendScrollControls() {
      const maximumScroll =
        chartLegend.scrollWidth -
        chartLegend.clientWidth;

      legendScrollLeft
        .classList
        .toggle(
          'is-hidden',
          maximumScroll <= 2 ||
          chartLegend.scrollLeft <= 2
        );

      legendScrollRight
        .classList
        .toggle(
          'is-hidden',
          maximumScroll <= 2 ||
          chartLegend.scrollLeft >=
            maximumScroll -
            2
        );
    }

    function renderLegendItems(
      items
    ) {
      chartLegend.textContent =
        '';

      chartLegend.scrollLeft =
        0;

      items.forEach(
        appendLegendItem
      );

      requestAnimationFrame(
        updateLegendScrollControls
      );
    }

    function updateLegend(
      items,
      animate = true
    ) {
      const signature =
        JSON.stringify(
          items
        );

      if (
        signature ===
        currentLegendSignature
      ) {
        return;
      }

      const token =
        ++legendAnimationToken;

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        !animate ||
        reduceMotion ||
        !chartLegend.animate
      ) {
        renderLegendItems(
          items
        );

        currentLegendSignature =
          signature;

        chartLegend.style.opacity =
          '';

        return;
      }

      const fadeOut =
        chartLegend.animate(
          [
            {
              opacity:
                1
            },

            {
              opacity:
                0
            }
          ],
          {
            duration:
              170,

            easing:
              'ease-out',

            fill:
              'forwards'
          }
        );

      fadeOut.finished
        .then(
          () => {
            if (
              token !==
              legendAnimationToken
            ) {
              return;
            }

            fadeOut.cancel();

            renderLegendItems(
              items
            );

            currentLegendSignature =
              signature;

            const fadeIn =
              chartLegend.animate(
                [
                  {
                    opacity:
                      0
                  },

                  {
                    opacity:
                      1
                  }
                ],
                {
                  duration:
                    270,

                  easing:
                    'cubic-bezier(0.22, 1, 0.36, 1)'
                }
              );

            fadeIn.finished
              .then(
                () =>
                  fadeIn.cancel()
              )
              .catch(
                () => {}
              );
          }
        )
        .catch(
          () => {
            if (
              token !==
              legendAnimationToken
            ) {
              return;
            }

            renderLegendItems(
              items
            );

            currentLegendSignature =
              signature;
          }
        );
    }

    function updateChartNote(
      note
    ) {
      chartNote.textContent =
        note ||
        '';

      chartNote
        .classList
        .toggle(
          'is-hidden',
          !note
        );
    }

    function updateTabIndicator(
      animate = true
    ) {
      const selectedTab =
        tabByView.get(
          activeView
        );

      if (
        !tabList ||
        !selectedTab
      ) {
        return;
      }

      if (!animate) {
        tabList.classList.add(
          'is-positioning'
        );
      }

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${selectedTab.offsetLeft}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${selectedTab.offsetWidth}px`
      );

      if (!animate) {
        requestAnimationFrame(
          () => {
            tabList.classList.remove(
              'is-positioning'
            );
          }
        );
      }
    }

    function updateActiveTab() {
      chartTabs.forEach(
        tab => {
          const isActive =
            tab.dataset.view ===
            activeView;

          tab.classList.toggle(
            'is-active',
            isActive
          );

          tab.setAttribute(
            'aria-selected',
            String(
              isActive
            )
          );
        }
      );

      updateTabIndicator(
        true
      );
    }

    function fadeTextChange(
      element,
      nextText
    ) {
      if (
        !element ||
        element.textContent ===
          nextText
      ) {
        return;
      }

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        reduceMotion ||
        !element.animate
      ) {
        element.textContent =
          nextText;

        return;
      }

      const fadeOut =
        element.animate(
          [
            {
              opacity:
                1
            },

            {
              opacity:
                0
            }
          ],
          {
            duration:
              170,

            easing:
              'ease-out',

            fill:
              'forwards'
          }
        );

      fadeOut.finished
        .then(
          () => {
            fadeOut.cancel();

            element.textContent =
              nextText;

            const fadeIn =
              element.animate(
                [
                  {
                    opacity:
                      0
                  },

                  {
                    opacity:
                      1
                  }
                ],
                {
                  duration:
                    260,

                  easing:
                    'cubic-bezier(0.22, 1, 0.36, 1)'
                }
              );

            fadeIn.finished
              .then(
                () =>
                  fadeIn.cancel()
              )
              .catch(
                () => {}
              );
          }
        )
        .catch(
          () => {
            element.textContent =
              nextText;
          }
        );
    }

    chartTabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => {
            applyView(
              tab.dataset.view,
              true
            );
          }
        );
      }
    );

    legendScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            -Math.max(
              110,
              legendViewport
                .clientWidth *
              0.72
            ),

          behavior:
            'smooth'
        });
      }
    );

    legendScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            Math.max(
              110,
              legendViewport
                .clientWidth *
              0.72
            ),

          behavior:
            'smooth'
        });
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive:
          true
      }
    );

    chartCanvas.addEventListener(
      'contextmenu',
      event => {
        event.preventDefault();
      }
    );

    chartCanvas.addEventListener(
      'selectstart',
      event => {
        event.preventDefault();
      }
    );

    chartCanvas.addEventListener(
      'mouseleave',
      () => {
        if (!chart) {
          return;
        }

        chart.canvas.style.cursor =
          'default';

        chart.tooltip
          ?.setActiveElements(
            [],
            {
              x: 0,
              y: 0
            }
          );

        chart.update(
          'none'
        );
      }
    );

    document.addEventListener(
      'pointerdown',
      event => {
        if (
          !event.target.closest(
            '#legacyResultsChart'
          ) &&
          chart
        ) {
          chart.tooltip
            .setActiveElements(
              [],
              {
                x:
                  0,

                y:
                  0
              }
            );

          chart.update(
            'none'
          );
        }
      }
    );

    function refreshResponsiveLayout() {
      if (
        responsiveLayoutFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveLayoutFrame
        );
      }

      responsiveLayoutFrame =
        requestAnimationFrame(
          () => {
            responsiveLayoutFrame =
              null;

            if (chart) {
              const currentView =
                activeView;

              const model =
                buildViewModel(
                  currentView
                );

              chart.config.type =
                model.type;

              chart.data =
                model.data;

              chart.options =
                createChartOptions(
                  model
                );

              chart.resize();
              chart.update(
                'none'
              );

              updateLegend(
                model.legendItems,
                false
              );

              updateChartNote(
                model.note
              );
            }

            updateTabIndicator(
              false
            );

            updateLegendScrollControls();
          }
        );
    }

    let layoutResizeObserver =
      null;

    if (
      'ResizeObserver' in
      window
    ) {
      layoutResizeObserver =
        new ResizeObserver(
          entries => {
            const hasUsableSize =
              entries.some(
                entry =>
                  entry
                    .contentRect
                    .width >
                    1 &&
                  entry
                    .contentRect
                    .height >
                    1
              );

            if (hasUsableSize) {
              refreshResponsiveLayout();
            }
          }
        );

      layoutResizeObserver.observe(
        app
      );

      layoutResizeObserver.observe(
        chartShell
      );
    }

    window.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive:
          true
      }
    );

    window
      .visualViewport
      ?.addEventListener(
        'resize',
        refreshResponsiveLayout,
        {
          passive:
            true
        }
      );

    window.addEventListener(
      'pageshow',
      refreshResponsiveLayout
    );

    document.addEventListener(
      'visibilitychange',
      () => {
        if (!document.hidden) {
          refreshResponsiveLayout();
        }
      }
    );

    if (
      document.fonts?.ready
    ) {
      document.fonts.ready.then(
        refreshResponsiveLayout
      );
    }

    function setStatus(
      message = ''
    ) {
      statusElement.textContent =
        message;
    }

    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      app.setAttribute(
        'aria-busy',
        'false'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );

      refreshResponsiveLayout();
    }

    async function loadDashboard() {
      try {
        setStatus();

        const sourceRows =
          await loadSheetRows();

        rows =
          normaliseRows(
            sourceRows
          );

        if (!rows.length) {
          throw new Error(
            'No permanent optometrist rows were found in columns A, D and F'
          );
        }

        createChart();
        updateTabIndicator(
          false
        );

        hideLoadingState();
        setStatus();
      } catch (error) {
        console.error(
          error
        );

        hideLoadingState();

        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load permanent legacy results'
          ).replace(
            /\.+$/,
            ''
          )
        );
      }
    }

    updateTabIndicator(
      false
    );

    loadDashboard();
  </script>
</body>
</html>
