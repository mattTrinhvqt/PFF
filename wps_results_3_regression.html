<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Workplace Recommendation Associations</title>

  <script src="./assets/pff_chart_core.js"></script>

  <style>
    #app {
      display: block;
      width: min(calc(100% - 12px), 520px);
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 0 4px;
    }
    .app-loading {
      min-height: 220px;
    }
    .top-row {
      width: 100%;
      min-width: 0;
      margin: 0 0 5px;
    }

    h1 {
      margin: 0;
      color: var(--pff-ink);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
    }

    .summary-row {
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      gap: 7px;
      padding: 0 0 5px;
      border-bottom: 1px solid var(--pff-track);
    }

    .intro {
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      color: var(--pff-muted);
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
      white-space: normal;
    }

    .results {
      width: 100%;
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
    }

    .result-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      min-width: 0;
      align-items: center;
      gap: 10px;
      min-height: 35px;
      padding: 5px 0;
    }

    .factor-rank {
      color: var(--pff-muted);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.28;
      text-align: left;
      white-space: nowrap;
    }

    .factor-name {
      min-width: 0;
      color: var(--pff-ink);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.28;
      text-align: left;
    }

    .effect-trigger {
      display: inline-block;
      min-width: 0;
      margin: 0;
      padding: 1px 0 2px;
      color: var(--pff-purple);
      background: transparent;
      border: 0;
      border-radius: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      text-align: right;
      white-space: nowrap;
      cursor: help;
    }

    .effect-trigger:hover,
    .effect-trigger:focus-visible,
    .effect-trigger.is-open {
      color: var(--pff-purple);
      outline: none;
    }

    #status {
      min-height: 220px;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 0 3px;
      }

      h1 {
        font-size: 18px;
      }

      .result-row {
        grid-template-columns: 20px minmax(0, 1fr) auto;
        gap: 7px;
        min-height: 39px;
      }

      .factor-rank,
      .factor-name,
      .effect-trigger,
      .intro {
        font-size: 12px;
      }
    }

    @media (max-width: 350px) {
      h1 {
        font-size: 17px;
      }

      .intro,
      .factor-rank,
      .factor-name,
      .effect-trigger {
        font-size: 12px;
      }

      .result-row {
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div class="app-loading" role="status" aria-label="Analysing workplace survey data">
        <div class="cone-loader" aria-hidden="true">
          <div class="cone blue"></div>
          <div class="cone green"></div>
          <div class="cone red"></div>
        </div>
        <div class="loader-text">Analysing workplace factors…</div>
      </div>

      <div class="top-row">
        <h1>What makes employee optoms recommend a workplace?</h1>
      </div>

      <div class="summary-row">
        <p class="intro">Adjusted for all factors, values show the associated difference in recommendation score (/10)</p>
      </div>

      <ul id="results" class="results" aria-live="polite"></ul>

      <p
        id="status"
        class="pff-status-error"
        role="alert"
        aria-live="polite"
      ></p>
    </main>
  </div>

  <div
    id="tooltip"
    class="pff-tooltip"
    role="tooltip"
  ></div>

  <script>
  (() => {
    'use strict';

    const CONFIG = Object.freeze({
      sheetId:
        '1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ',

      sheetName:
        'Data',

      rawDataRange:
        'A2:D',

      cacheWebAppUrl:
        'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec',

      cacheAppKey:
        'workplace-promoter-score-graph',

      browserCacheKey:
        'pff-workplace-recommendation-associations:raw:v1',

      fetchTimeoutMs:
        10000,

      minRows:
        1,

      forceCached:
        false
    });

    const FACTORS = Object.freeze([
      {
        key:
          'pay',

        label:
          'Pay/bonuses'
      },

      {
        key:
          'worklife',

        label:
          'Work-life flexibility'
      },

      {
        key:
          'autonomy',

        label:
          'Clinical autonomy & professional growth'
      },

      {
        key:
          'support',

        label:
          'Supportive team & management'
      },

      {
        key:
          'workload',

        label:
          'Staffing & sustainable workload'
      },

      {
        key:
          'tech',

        label:
          'Quality equipment & technology'
      }
    ]);

    const app =
      document.getElementById(
        'app'
      );

    const resultsElement =
      document.getElementById(
        'results'
      );

    const statusElement =
      document.getElementById(
        'status'
      );

    const tooltip =
      document.getElementById(
        'tooltip'
      );


    function formatTrimmed(
      value,
      digits =
        2
    ) {
      if (
        !Number.isFinite(
          value
        )
      ) {
        return '—';
      }

      const rounded =
        Number(
          value.toFixed(
            digits
          )
        );

      if (
        Object.is(
          rounded,
          -0
        ) ||
        rounded ===
          0
      ) {
        return '0';
      }

      return String(
        rounded
      );
    }


    function formatSigned(
      value,
      digits =
        2
    ) {
      if (
        !Number.isFinite(
          value
        )
      ) {
        return '—';
      }

      const rounded =
        Number(
          value.toFixed(
            digits
          )
        );

      if (
        Object.is(
          rounded,
          -0
        ) ||
        rounded ===
          0
      ) {
        return '0';
      }

      return (
        `${rounded > 0 ? '+' : '−'}` +
        formatTrimmed(
          Math.abs(
            rounded
          ),
          digits
        )
      );
    }


    function formatCIBound(
      value,
      digits =
        2
    ) {
      return formatTrimmed(
        value,
        digits
      );
    }


    function normaliseRawRows(
      rows
    ) {
      if (
        !Array.isArray(
          rows
        )
      ) {
        return [];
      }

      return rows
        .map(
          row => {
            const source =
              Array.isArray(
                row
              )
                ? row
                : [];

            return [
              PFF.cleanText(
                source[0]
              ),

              PFF.cleanText(
                source[1]
              ),

              Number.isFinite(
                PFF.toNumber(
                  source[2]
                )
              )
                ? PFF.toNumber(
                    source[2]
                  )
                : '',

              String(
                source[3] ??
                ''
              ).trim()
            ];
          }
        )
        .filter(
          row =>
            row.some(
              value =>
                value !== '' &&
                value !== null &&
                value !== undefined
            )
        );
    }


    function parseLiveRows(
      table
    ) {
      const rows =
        table?.rows ||
        [];

      return normaliseRawRows(
        rows.map(
          row => {
            const cells =
              row?.c ||
              [];

            return [
              PFF.cellValue(
                cells[0]
              ),

              PFF.cellValue(
                cells[1]
              ),

              PFF.cellValue(
                cells[2]
              ),

              PFF.cellValue(
                cells[3]
              )
            ];
          }
        )
      );
    }


    function parseRemoteRows(
      response
    ) {
      if (
        !response?.cachedAt ||
        Number.isNaN(
          Date.parse(
            response.cachedAt
          )
        )
      ) {
        throw new Error(
          'The cached-data response has no valid timestamp'
        );
      }

      const rows =
        normaliseRawRows(
          response?.data?.rows
        );

      if (
        rows.length <
        CONFIG.minRows
      ) {
        throw new Error(
          'The cached-data response has no survey rows'
        );
      }

      return rows;
    }


    function normaliseFactorText(
      value
    ) {
      return String(
        value ||
        ''
      )
        .toLowerCase()
        .normalize(
          'NFKD'
        )
        .replace(
          /[’‘]/g,
          "'"
        )
        .replace(
          /&/g,
          ' and '
        )
        .replace(
          /[^a-z0-9]+/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }


    function getFactorKey(
      value
    ) {
      const text =
        normaliseFactorText(
          value
        );

      if (
        !text ||
        text ===
          'none' ||
        text ===
          'nil' ||
        text ===
          'no factors' ||
        text ===
          'no factor' ||
        text ===
          'nothing'
      ) {
        return null;
      }

      if (
        text.includes(
          'pay'
        ) ||
        text.includes(
          'bonus'
        ) ||
        text.includes(
          'remuneration'
        )
      ) {
        return 'pay';
      }

      if (
        text.includes(
          'work life'
        ) ||
        text.includes(
          'worklife'
        ) ||
        text.includes(
          'flexib'
        )
      ) {
        return 'worklife';
      }

      if (
        text.includes(
          'autonomy'
        ) ||
        text.includes(
          'professional growth'
        ) ||
        text.includes(
          'professional development'
        )
      ) {
        return 'autonomy';
      }

      if (
        text.includes(
          'support'
        ) ||
        (
          text.includes(
            'team'
          ) &&
          text.includes(
            'management'
          )
        )
      ) {
        return 'support';
      }

      if (
        text.includes(
          'staffing'
        ) ||
        text.includes(
          'workload'
        )
      ) {
        return 'workload';
      }

      if (
        text.includes(
          'equipment'
        ) ||
        text.includes(
          'technology'
        ) ||
        text ===
          'tech'
      ) {
        return 'tech';
      }

      return null;
    }


    function getEndorsedFactorKeys(
      value
    ) {
      const factorKeys =
        new Set();

      const rawText =
        String(
          value ??
          ''
        ).trim();

      if (!rawText) {
        return factorKeys;
      }

      rawText
        .split(
          /[;,|\n]+/
        )
        .forEach(
          factor => {
            const factorKey =
              getFactorKey(
                factor
              );

            if (factorKey) {
              factorKeys.add(
                factorKey
              );
            }
          }
        );

      if (
        !factorKeys.size
      ) {
        FACTORS.forEach(
          factor => {
            const normalisedLabel =
              normaliseFactorText(
                factor.label
              );

            const normalisedWhole =
              normaliseFactorText(
                rawText
              );

            if (
              normalisedWhole.includes(
                normalisedLabel
              ) ||
              getFactorKey(
                rawText
              ) ===
                factor.key
            ) {
              factorKeys.add(
                factor.key
              );
            }
          }
        );
      }

      return factorKeys;
    }


    function normaliseObservations(
      rows
    ) {
      const observations =
        [];

      rows.forEach(
        row => {
          const timestamp =
            row?.[0];

          const employer =
            PFF.cleanText(
              row?.[1]
            );

          const score =
            PFF.toNumber(
              row?.[2]
            );

          const rawFactors =
            row?.[3];

          if (
            !employer ||
            !Number.isFinite(
              score
            ) ||
            score <
              0 ||
            score >
              10
          ) {
            return;
          }

          const endorsed =
            getEndorsedFactorKeys(
              rawFactors
            );

          const predictors =
            FACTORS.map(
              factor =>
                endorsed.has(
                  factor.key
                )
                  ? 1
                  : 0
            );

          observations.push({
            timestamp,
            employer,
            score,
            predictors
          });
        }
      );

      return observations;
    }


    function buildDesignMatrix(
      observations
    ) {
      const X =
        observations.map(
          observation => [
            1,
            ...observation.predictors
          ]
        );

      const y =
        observations.map(
          observation =>
            observation.score
        );

      return {
        X,
        y
      };
    }


    function validatePredictorVariation(
      observations
    ) {
      const missingVariation =
        [];

      FACTORS.forEach(
        (
          factor,
          index
        ) => {
          const values =
            observations.map(
              observation =>
                observation.predictors[
                  index
                ]
            );

          const hasZero =
            values.some(
              value =>
                value ===
                0
            );

          const hasOne =
            values.some(
              value =>
                value ===
                1
            );

          if (
            !hasZero ||
            !hasOne
          ) {
            missingVariation.push(
              factor.label
            );
          }
        }
      );

      return missingVariation;
    }


    function analyseObservations(
      observations
    ) {
      const parameterCount =
        FACTORS.length +
        1;

      if (
        observations.length <=
        parameterCount +
          2
      ) {
        throw new Error(
          `Not enough usable responses to fit the adjusted model yet (n=${observations.length}).`
        );
      }

      const missingVariation =
        validatePredictorVariation(
          observations
        );

      if (
        missingVariation.length
      ) {
        throw new Error(
          'The adjusted model cannot be estimated yet because these factors do not have both endorsed and non-endorsed responses: ' +
          missingVariation.join(
            ', '
          )
        );
      }

      const {
        X,
        y
      } =
        buildDesignMatrix(
          observations
        );

      const regression =
        PFFStats.fitOlsHc3(
          X,
          y
        );

      const effects =
        FACTORS.map(
          (
            factor,
            index
          ) => ({
            ...factor,
            ...regression.inference[
              index +
              1
            ]
          })
        );

      return {
        model:
          regression.model,

        inference:
          regression.inference,

        effects
      };
    }


    function effectDisplayText(
      effect
    ) {
      if (
        !(
          effect.p <
          0.05
        )
      ) {
        return 'Not significant';
      }

      const magnitude =
        formatTrimmed(
          Math.abs(
            effect.coefficient
          ),
          2
        );

      if (
        effect.coefficient >
        0
      ) {
        return `+${magnitude} points`;
      }

      if (
        effect.coefficient <
        0
      ) {
        return `−${magnitude} points lower`;
      }

      return '0 points';
    }


    function effectTooltipText(
      effect
    ) {
      return (
        `${formatSigned(effect.coefficient)} ` +
        `(95% CI; ${formatCIBound(effect.lower)}, ${formatCIBound(effect.upper)}), ` +
        PFFStats.formatPValue(
          effect.p
        )
      );
    }


    function renderResults(
      analysis
    ) {
      resultsElement.innerHTML =
        '';

      const sortedEffects =
        [
          ...analysis.effects
        ].sort(
          (
            first,
            second
          ) =>
            second.coefficient -
            first.coefficient
        );

      sortedEffects.forEach(
        (
          effect,
          index
        ) => {
          const row =
            document.createElement(
              'li'
            );

          row.className =
            'result-row';

          const rank =
            document.createElement(
              'span'
            );

          rank.className =
            'factor-rank';

          rank.textContent =
            `${index + 1})`;

          const label =
            document.createElement(
              'span'
            );

          label.className =
            'factor-name';

          label.textContent =
            effect.label;

          const trigger =
            document.createElement(
              'button'
            );

          trigger.type =
            'button';

          trigger.className =
            'effect-trigger';

          trigger.textContent =
            effectDisplayText(
              effect
            );

          trigger.dataset.tooltip =
            effectTooltipText(
              effect
            );

          trigger.setAttribute(
            'aria-label',
            `${effect.label}: ${trigger.textContent}. ${trigger.dataset.tooltip}`
          );

          row.appendChild(
            rank
          );

          row.appendChild(
            label
          );

          row.appendChild(
            trigger
          );

          resultsElement.appendChild(
            row
          );
        }
      );
    }


    PFF.setupTextTooltip({
      tooltip,

      selector:
        '[data-tooltip]'
    });


    PFF.initialiseApp({
      app,

      status:
        statusElement,

      loadLive:
        () =>
          PFF.loadGVizSheet({
            sheetId:
              CONFIG.sheetId,

            sheetName:
              CONFIG.sheetName,

            range:
              CONFIG.rawDataRange,

            headers:
              0,

            timeoutMs:
              CONFIG.fetchTimeoutMs
          }),

      parseLive:
        parseLiveRows,

      loadRemoteCache:
        () =>
          PFF.loadAppsScriptCache({
            url:
              CONFIG.cacheWebAppUrl,

            appKey:
              CONFIG.cacheAppKey,

            timeoutMs:
              CONFIG.fetchTimeoutMs
          }),

      parseRemoteCache:
        parseRemoteRows,

      cacheKey:
        CONFIG.browserCacheKey,

      minRows:
        CONFIG.minRows,

      forceCached:
        CONFIG.forceCached,

      onLiveError:
        error =>
          console.warn(
            'Live workplace data could not be used',
            error
          ),

      onRemoteCacheError:
        error =>
          console.warn(
            'Cached workplace data could not be used',
            error
          ),

      render:
        loaded => {
          const rows =
            loaded?.rows ||
            [];

          const observations =
            normaliseObservations(
              rows
            );

          if (
            !observations.length
          ) {
            throw new Error(
              'No usable workplace survey responses were found'
            );
          }

          const analysis =
            analyseObservations(
              observations
            );

          renderResults(
            analysis
          );

          return analysis;
        },

      errorMessage:
        'Loading failed, please refresh'
    });
  })();
  </script>
</body>
</html>
