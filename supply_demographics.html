<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Workforce Demographics Trends</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 4px;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    /* ============================================================
     * TOP TABS + LIVE STATUS
     * ============================================================ */

    .module-top {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms var(--motion-ease),
        width 420ms var(--motion-ease);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab:hover:not(.is-active) {
      color: var(--ink);
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .tab-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .tab-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .tab-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .tab-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .tab-scroll-left { left: 0; }
    .tab-scroll-right { right: 0; }

    .metric-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -1px;
    }

    .legend-item:focus-visible,
    .legend-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
      transition: background-color 220ms ease;
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ============================================================
     * HEADING + METRIC SWITCH
     * ============================================================ */

    .chart-heading-row {
      position: relative;
      z-index: 30;
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 31px;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
      margin: 0;
    }

    .heading-scroll-shell {
      position: relative;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }

    .heading-scroll-viewport {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .heading-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    .heading-scroll-button {
      position: absolute;
      top: 4px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .heading-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .heading-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .heading-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .heading-scroll-left { left: 0; }
    .heading-scroll-right { right: 0; }

    .chart-heading {
      display: inline-flex;
      width: max-content;
      min-width: max-content;
      flex: 0 0 auto;
      align-items: baseline;
      margin: 0;
      padding: 4px 0 0;
      overflow: visible;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline;
      will-change: opacity;
    }

    .metric-switch {
      position: relative;
      display: grid;
      width: 132px;
      height: 27px;
      flex: 0 0 auto;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      margin-top: 2px;
      padding: 1px;
      overflow: hidden;
      background: rgba(232, 234, 240, 0.55);
      border-radius: 4px;
      isolation: isolate;
    }

    .metric-switch::before {
      content: '';
      position: absolute;
      top: 1px;
      bottom: 1px;
      left: 1px;
      z-index: 0;
      width: calc((100% - 2px) / 2);
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.08);
      transform: translateX(0);
      transition: transform 300ms var(--motion-ease);
    }

    .metric-switch.is-hours-selected::before {
      transform: translateX(100%);
    }

    .metric-button {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 25px;
      padding: 0 4px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition:
        color 220ms ease,
        transform 300ms var(--motion-ease);
    }

    .metric-button:hover:not(.is-active) {
      color: var(--ink);
    }

    .metric-button.is-active {
      color: var(--purple);
    }

    /* ============================================================
     * LEGEND
     * ============================================================ */

    .legend-nav {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 1;
      transition:
        opacity 160ms ease,
        color 160ms ease;
    }

    .legend-item:hover {
      color: var(--ink);
    }

    .legend-item.is-hidden-series {
      opacity: 0.38;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
      background: var(--legend-colour);
    }

    /* ============================================================
     * CHART
     * ============================================================ */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -2px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #workforceChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 2px;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        min-height: 30px;
      }

      .chart-heading {
        padding-top: 4px;
        font-size: 14px;
        line-height: 21px;
      }

      .metric-switch {
        width: 124px;
        height: 26px;
      }

      .metric-button {
        min-height: 24px;
        padding-right: 3px;
        padding-left: 3px;
        font-size: 8.5px;
      }

      .legend-item {
        font-size: 9px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        font-size: 13px;
      }

      .metric-switch {
        width: 116px;
      }

      .metric-button {
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading workforce data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading workforce data...</div>
      </div>

      <div class="module-top">
        <div id="tabScrollShell" class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Demographic view"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-group="sex"
              aria-selected="true"
            >Sex</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-group="age"
              aria-selected="false"
            >Age</button>
          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"
            type="button"
            aria-label="Scroll tabs right"
          >›</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">
              <span id="chartHeadingFixed" class="chart-heading-fixed">Sex composition</span><span id="chartHeadingDetail" class="chart-heading-detail"></span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div
          id="metricSwitch"
          class="metric-switch"
          role="group"
          aria-label="Display metric"
        >
          <button
            id="workforceButton"
            class="metric-button is-active"
            type="button"
            data-metric="workforce"
            aria-pressed="true"
          >%</button>

          <button
            id="hoursButton"
            class="metric-button"
            type="button"
            data-metric="hours"
            aria-pressed="false"
          >Weekly hours</button>
        </div>
      </div>

      <div id="legendNav" class="legend-nav">
        <button
          id="legendScrollLeft"
          class="legend-scroll-button legend-scroll-left is-hidden"
          type="button"
          aria-label="Scroll legend left"
        >‹</button>

        <div class="legend-viewport">
          <div
            id="chartLegend"
            class="chart-legend"
            aria-label="Chart legend"
          ></div>
        </div>

        <button
          id="legendScrollRight"
          class="legend-scroll-button legend-scroll-right is-hidden"
          type="button"
          aria-label="Scroll legend right"
        >›</button>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="workforceChart"
          aria-label="Australian optometry workforce demographics chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    // ============================================================
    // DATA SOURCE
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const SHEET_NAME =
      'Miscellaneous';

    /*
      Row 31 contains the column headers for these four blocks:

      AW:AY = Sex %
      BA:BC = Sex clinical hours
      BE:BK = Age counts
      BM:BS = Age clinical hours

      Using row 31 as the single GViz header row means row 32 onward
      is returned directly as data and future years are picked up
      automatically without relying on the decorative rows 29-30.
    */
    const DATA_RANGE =
      'AW31:BS';

    const FETCH_TIMEOUT_MS =
      15000;

    const LOCAL_CACHE_KEY =
      'pff-workforce-demographics-v2';

    const SEX_LABELS = [
      'Male',
      'Female'
    ];

    const AGE_LABELS = [
      '20-34',
      '35-44',
      '45-54',

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');

    function numericCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      if (
        typeof cell.v === 'number' &&
        Number.isFinite(cell.v)
      ) {
        return cell.v;
      }

      const cleaned =
        cleanText(
          cell.f ?? cell.v
        )
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function loadGVizSheet(
      sheetName,
      range
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `__pff_demographics_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement('script');

          let completed =
            false;

          const cleanup = () => {
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }

            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] = undefined;
            }
          };

          const timer =
            window.setTimeout(
              () => {
                if (completed) {
                  return;
                }

                completed = true;
                cleanup();

                reject(
                  new Error(
                    `Timed out loading ${sheetName}.`
                  )
                );
              },
              FETCH_TIMEOUT_MS
            );

          window[callbackName] =
            response => {
              if (completed) {
                return;
              }

              completed = true;
              window.clearTimeout(timer);
              cleanup();

              if (
                !response ||
                response.status === 'error'
              ) {
                const message =
                  response?.errors?.[0]?.detailed_message ||
                  response?.errors?.[0]?.message ||
                  `Could not load ${sheetName}.`;

                reject(
                  new Error(message)
                );

                return;
              }

              resolve(response.table);
            };

          script.onerror = () => {
            if (completed) {
              return;
            }

            completed = true;
            window.clearTimeout(timer);
            cleanup();

            reject(
              new Error(
                `Could not connect to ${sheetName}.`
              )
            );
          };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              headers: '1',
              tqx: `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async = true;
          document.head.appendChild(script);
        }
      );
    }

    function parseDemographicTable(table) {
      const sourceRows =
        table?.rows || [];

      const parsed = [];

      sourceRows.forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          numericCell(cells[0]);

        if (!Number.isFinite(year)) {
          return;
        }

        const record = {
          year:
            Math.round(year),

          sexPct: [
            numericCell(cells[1]),
            numericCell(cells[2])
          ],

          sexHours: [
            numericCell(cells[5]),
            numericCell(cells[6])
          ],

          ageCounts:
            Array.from(
              { length: 6 },
              (_, index) =>
                numericCell(
                  cells[9 + index]
                )
            ),

          ageHours:
            Array.from(
              { length: 6 },
              (_, index) =>
                numericCell(
                  cells[17 + index]
                )
            )
        };

        const hasUsableValues =
          [
            ...record.sexPct,
            ...record.sexHours,
            ...record.ageCounts,
            ...record.ageHours
          ].some(
            Number.isFinite
          );

        if (hasUsableValues) {
          parsed.push(record);
        }
      });

      const uniqueByYear =
        new Map();

      parsed.forEach(row => {
        uniqueByYear.set(
          row.year,
          row
        );
      });

      const result =
        Array.from(
          uniqueByYear.values()
        )
          .sort(
            (first, second) =>
              first.year - second.year
          );

      if (result.length < 2) {
        throw new Error(
          'No usable demographic trend rows were found.'
        );
      }

      return result;
    }

    function calculateAgeCountScale() {
      const maximum =
        Math.max(
          ...rows
            .flatMap(
              row => row.ageCounts
            )
            .filter(
              Number.isFinite

          100
        );

      const step =
        Math.max(
          100,
          Math.ceil(
            maximum /
            AXIS_MAJOR_INTERVALS /
            100
          ) * 100
        );

      return {
        min: 0,
        max:
          step *
          AXIS_MAJOR_INTERVALS,
        step,
        intervals:
          AXIS_MAJOR_INTERVALS
      };
    }

    function easeOutCubic(value) {
      const clamped =

    function animateYAxisTickValues(
      targets,
      duration = 720
    ) {
      const targetValues =
        Array.from(targets || []);

      if (!targetValues.length) {
        return;
      }

      if (yAxisTickAnimation.raf) {
        cancelAnimationFrame(
          yAxisTickAnimation.raf
        );

        yAxisTickAnimation.raf =
          null;
      }

      const token =
        ++yAxisTickAnimation.token;

      const startValues =
        yAxisTickAnimation.values.length ===
          targetValues.length
          ? [
              ...yAxisTickAnimation.values
            ]
          : [
              ...targetValues
            ];

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        yAxisTickAnimation.values =
          [...targetValues];

        chart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (
          token !==
          yAxisTickAnimation.token
        ) {
          return;
        }

        const progress =
          clamp(
            (now - startedAt) /
              duration,
            0,
            1
          );

        const eased =
          easeOutCubic(progress);

        yAxisTickAnimation.values =
          targetValues.map(
            (target, index) => {
              const start =
                Number(
                  startValues[index]
                );

              return Number.isFinite(start)
                ? start +
                    (
                      target - start
                    ) *
                    eased
                : target;
            }
          );

        chart?.draw();

        if (progress < 1) {
          yAxisTickAnimation.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          yAxisTickAnimation.raf =
            null;

          yAxisTickAnimation.values =
            [...targetValues];

          chart?.draw();
        }
      }

      yAxisTickAnimation.raf =
        requestAnimationFrame(frame);
    }

      if (yAxisTitleAnimation.raf) {

      const token =
        ++yAxisTitleAnimation.token;

      if (

        const progress =

    function fadeTextChange(
      element,
      nextText,
      animate = true
    ) {
      if (!element) {
        return;
      }

      const text =
        String(nextText);

      if (
        element.textContent ===
        text
      ) {
        return;
      }

      if (
        !animate ||
        reducedMotion() ||
        typeof element.animate !==
          'function'
      ) {
        element.textContent =
          text;

        return;
      }

      const token =
        (
          Number(
            element.dataset
              .textAnimationToken
          ) || 0
        ) + 1;

      element.dataset.textAnimationToken =
        String(token);

      element
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const fadeOut =
        element.animate(
          [
            {
              opacity: 1
            },
            {
              opacity: 0
            }
          ],
          {
            duration: 150,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      fadeOut.finished
        .then(() => {
          if (
            Number(
              element.dataset
                .textAnimationToken
            ) !== token
          ) {
            return;
          }

          fadeOut.cancel();

          element.textContent =
            text;

          const fadeIn =
            element.animate(
              [
                {
                  opacity: 0
                },
                {
                  opacity: 1
                }
              ],
              {
                duration: 230,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );

          fadeIn.finished
            .then(
              () => fadeIn.cancel()
            )
            .catch(() => {});
        })
        .catch(() => {
          element.textContent =
            text;
        });
    }

    function updateHeading(
      previousConfig,
      nextConfig,
      animate = true
    ) {
      const previousFixed =
        previousConfig?.headingFixed ??
        chartHeadingFixed?.textContent ??
        '';

      const previousDetail =
        previousConfig?.headingDetail ??
        chartHeadingDetail?.textContent ??
        '';

      const fixedChanged =
        previousFixed !==
        nextConfig.headingFixed;

      const detailChanged =
        previousDetail !==
        nextConfig.headingDetail;

      if (fixedChanged) {
        fadeTextChange(
          chartHeadingFixed,
          nextConfig.headingFixed,
          animate
        );
      }

      if (detailChanged) {
        fadeTextChange(
          chartHeadingDetail,
          nextConfig.headingDetail,
          animate
        );
      }

      headingScrollViewport.scrollLeft = 0;

      requestAnimationFrame(
        updateHeadingScrollControls
      );

      window.setTimeout(
        updateHeadingScrollControls,
        animate ? 420 : 0
      );
    }

    function updateLegendScrollControls() {
      const maximumScrollLeft =
        Math.max(
          0,
          chartLegend.scrollWidth -
            chartLegend.clientWidth
        );

      const tolerance = 2;

      legendScrollLeft.classList.toggle(
        'is-hidden',
        maximumScrollLeft <= 2 ||
          chartLegend.scrollLeft <=
            tolerance
      );

      legendScrollRight.classList.toggle(
        'is-hidden',
        maximumScrollLeft <= 2 ||
          chartLegend.scrollLeft >=
            maximumScrollLeft -
            tolerance
      );
    }

    function renderLegendItems(config) {
      const hidden =
        hiddenSeriesByView.get(
          currentLegendKey()
        ) ||
        new Set();

      chartLegend.textContent = '';

      config.labels.forEach(
        (labelText, datasetIndex) => {
          const item =
            document.createElement(
              'button'
            );

          item.type =
            'button';

          item.className =
            'legend-item';

          const isVisible =
            !hidden.has(labelText);

          item.setAttribute(
            'aria-pressed',
            String(isVisible)
          );

          if (!isVisible) {
            item.classList.add(
              'is-hidden-series'
            );
          }

          const line =
            document.createElement(
              'span'
            );

          line.className =
            'legend-line';

          line.style.setProperty(
            '--legend-colour',
            config.colours[
              datasetIndex
            ]
          );

          const label =
            document.createElement(
              'span'
            );

          label.textContent =
            labelText;

          item.appendChild(line);
          item.appendChild(label);

          item.addEventListener(
            'click',
            () => {
              const viewKey =
                currentLegendKey();

              const currentHidden =
                new Set(
                  hiddenSeriesByView.get(
                    viewKey
                  ) ||
                  []
                );

              if (
                currentHidden.has(
                  labelText
                )
              ) {
                currentHidden.delete(
                  labelText
                );
              } else {
                currentHidden.add(
                  labelText
                );
              }

              hiddenSeriesByView.set(
                viewKey,
                currentHidden
              );

              const currentConfig =
                currentViewConfig();

              syncChartDatasets(
                currentConfig
              );

              if (chart) {
                chart.options.animation.duration =
                  reducedMotion()
                    ? 0
                    : 260;

                chart.options.animations.x.duration =
                  260;

                chart.options.animations.y.duration =
                  260;

                chart.options.animations.colors.duration =
                  260;

                chart.update();
              }

              renderLegendItems(
                currentConfig
              );
            }
          );

          chartLegend.appendChild(
            item
          );
        }
      );

      requestAnimationFrame(
        updateLegendScrollControls
      );
    }

    function animateLegendChange(config) {
      const token =
        ++legendAnimationToken;

      const drawLegend = () => {
        if (
          token !==
          legendAnimationToken
        ) {
          return;
        }

        renderLegendItems(config);
        chartLegend.scrollLeft = 0;
      };

      if (
        reducedMotion() ||
        typeof chartLegend.animate !==
          'function' ||
        !chartLegend.childElementCount
      ) {
        drawLegend();
        return;
      }

      chartLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const outgoing =
        chartLegend.animate(
          [
            {
              opacity: 1
            },
            {
              opacity: 0
            }
          ],
          {
            duration: 120,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      outgoing.finished
        .catch(() => {})
        .then(() => {
          drawLegend();

          if (
            token !==
            legendAnimationToken
          ) {
            return;
          }

          const incoming =
            chartLegend.animate(
              [
                {
                  opacity: 0
                },
                {
                  opacity: 1
                }
              ],
              {
                duration: 220,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'both'
              }
            );

          incoming.finished
            .then(
              () => incoming.cancel()
            )
            .catch(() => {});
        });
    }

    // ============================================================
    // DATASETS
    // ============================================================

    function slotSeriesIndex(
      slotIndex,
      config
    ) {
      if (!config.labels.length) {
        return 0;
      }

      return slotIndex <
        config.labels.length
        ? slotIndex
        : slotIndex %
            config.labels.length;
    }

    function datasetForSlot(
      slotIndex,
      config
    ) {
      const activeSeries =
        slotIndex <
        config.labels.length;

      const sourceIndex =
        slotSeriesIndex(
          slotIndex,
          config
        );

      const label =
        activeSeries
          ? config.labels[
              slotIndex
            ]
          : '';

      const hidden =
        hiddenSeriesByView.get(
          currentLegendKey()
        ) ||
        new Set();

      const userHidden =
        activeSeries &&
        hidden.has(label);

      const colour =
        activeSeries &&
        !userHidden
          ? config.colours[
              slotIndex
            ]
          : TRANSPARENT_COLOUR;

      return {
        label,

        data:
          rows.map(row => {
            const value =
              row[
                config.valueKey
              ]?.[
                sourceIndex
              ];

            return Number.isFinite(
              value
            )
              ? value
              : null;
          }),

        _activeSeries:
          activeSeries &&
          !userHidden,

        _seriesLabel:
          label,

        borderColor:
          colour,

        backgroundColor:
          colour,

        borderWidth: 3,
        fill: false,

        pointRadius: 0,

        pointHoverRadius:
          activeSeries &&
          !userHidden
            ? 4
            : 0,

        pointHitRadius:
          activeSeries &&
          !userHidden
            ? pointHitRadiusForViewport()
            : 0,

        pointBackgroundColor:
          colour,

        pointBorderColor:
          '#fff',

        pointBorderWidth:
          activeSeries &&
          !userHidden
            ? 1
            : 0,

        tension: 0.28,

        cubicInterpolationMode:
          'monotone',

        spanGaps: false
      };
    }

    function buildDatasets(config) {
      return Array.from(
        {
          length:
            SERIES_SLOT_COUNT
        },
        (_, slotIndex) =>
          datasetForSlot(
            slotIndex,
            config
          )
      );
    }

    function syncChartDatasets(config) {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets(config);

      nextDatasets.forEach(
        (nextDataset, index) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] = nextDataset;

            return;
          }

          current.label =
            nextDataset.label;

          current.data =
            nextDataset.data;

          current._activeSeries =
            nextDataset._activeSeries;

          current._seriesLabel =
            nextDataset._seriesLabel;

          current.borderColor =
            nextDataset.borderColor;

          current.backgroundColor =
            nextDataset.backgroundColor;

          current.pointBackgroundColor =
            nextDataset.pointBackgroundColor;

          current.pointBorderColor =
            nextDataset.pointBorderColor;

          current.pointBorderWidth =
            nextDataset.pointBorderWidth;

          current.pointHoverRadius =
            nextDataset.pointHoverRadius;

          current.pointHitRadius =
            nextDataset.pointHitRadius;

          current.borderWidth =
            nextDataset.borderWidth;

          current.tension =
            nextDataset.tension;

          current.cubicInterpolationMode =
            nextDataset.cubicInterpolationMode;

          current.spanGaps =
            nextDataset.spanGaps;

          current.fill =
            false;
        }
      );
    }

    // ============================================================
    // PFF AXES
    // ============================================================

    function drawYAxisTitle(
      context,
      chartArea
    ) {
      const mobile =
        window.innerWidth <= 430;

      const progress =
        clamp(
          yAxisTitleAnimation.progress,
          0,
          1
        );

      const outgoingOpacity =
        clamp(
          1 -
            progress * 2.2,
          0,
          1
        );

      const incomingOpacity =
        clamp(
          (
            progress - 0.32
          ) /
            0.68,
          0,
          1
        );

      const x =
        chartArea.left -
        (
          mobile
            ? 48
            : 54
        );

      const y =
        chartArea.top +
        chartArea.height / 2;

      const draw = (
        text,
        opacity
      ) => {
        if (
          !text ||
          opacity <= 0
        ) {
          return;
        }

        context.save();
        context.globalAlpha =
          opacity;
        context.translate(x, y);
        context.rotate(
          -Math.PI / 2
        );
        context.fillStyle =
          '#151515';
        context.textAlign =
          'center';
        context.textBaseline =
          'middle';
        context.font =
          `700 ${mobile ? 12 : 13}px Lato, sans-serif`;
        context.fillText(
          text,
          0,
          0
        );
        context.restore();
      };

      if (
        yAxisTitleAnimation.from ===
        yAxisTitleAnimation.to ||
        progress >= 1
      ) {
        draw(
          yAxisTitleAnimation.to,
          1
        );

        return;
      }

      draw(
        yAxisTitleAnimation.from,
        outgoingOpacity
      );

      draw(
        yAxisTitleAnimation.to,
        incomingOpacity
      );
    }

    const pffAxesPlugin = {
      id: 'pffDemographicsAxes',

      beforeDatasetsDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const intervals =
          AXIS_MAJOR_INTERVALS;

        ctx.save();

        // Minor horizontal guides sit halfway between each major interval.
        ctx.strokeStyle =
          'rgba(105, 113, 138, 0.035)';

        ctx.lineWidth =
          0.7;

        for (
          let index = 0;
          index < intervals;
          index += 1
        ) {
          const ratio =
            (
              index + 0.5
            ) /
            intervals;

          const y =
            chartArea.bottom -
            chartArea.height *
              ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        // Major horizontal guides.
        ctx.strokeStyle =
          'rgba(105, 113, 138, 0.075)';

        ctx.lineWidth =
          1;

        for (
          let index = 0;
          index <= intervals;
          index += 1
        ) {
          const ratio =
            index /
            intervals;

          const y =
            chartArea.bottom -
            chartArea.height *
              ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea,
          scales
        } =
          chartInstance;

        const xScale =
          scales?.x;

        if (
          !chartArea ||
          !xScale
        ) {
          return;
        }

        const config =
          currentViewConfig();

        const intervals =
          AXIS_MAJOR_INTERVALS;

        const mobile =
          window.innerWidth <= 430;

        const values =
          yAxisTickAnimation.values.length ===
            intervals + 1
            ? yAxisTickAnimation.values
            : yTickTargets(config);

        ctx.save();
        ctx.lineCap =
          'butt';

        // Major Y ticks and counting labels stay in fixed positions.
        ctx.strokeStyle =
          '#151515';

        ctx.lineWidth =
          1;

        ctx.fillStyle =
          '#151515';

        ctx.textAlign =
          'right';

        ctx.textBaseline =
          'middle';

        ctx.font =
          `${mobile ? 9 : 10}px Lato, sans-serif`;

        for (
          let index = 0;
          index <= intervals;
          index += 1
        ) {
          const ratio =
            index /
            intervals;

          const y =
            chartArea.bottom -
            chartArea.height *
              ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 5,
            Math.round(y) + 0.5
          );
          ctx.stroke();

          const value =
            Number(
              values[index]
            );

          ctx.fillText(
            formatAxisValue(
              Number.isFinite(value)
                ? value
                : config.scale.min +
                  config.scale.step *
                    index,
              config
            ),
            chartArea.left - 8,
            y
          );
        }

        // Minor Y ticks.
        ctx.strokeStyle =
          '#69718a';

        ctx.globalAlpha =
          0.60;

        ctx.lineWidth =
          1;

        for (
          let index = 0;
          index < intervals;
          index += 1
        ) {
          const ratio =
            (
              index + 0.5
            ) /
            intervals;

          const y =
            chartArea.bottom -
            chartArea.height *
              ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 2,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        // X ticks: each year gets a tick; even years are major.
        ctx.globalAlpha =
          1;

        rows.forEach(
          (row, index) => {
            const year =
              Number(row.year);

            const x =
              xScale.getPixelForTick(
                index
              );

            if (!Number.isFinite(x)) {
              return;
            }

            const major =
              Number.isFinite(year) &&
              year % 2 === 0;

            ctx.strokeStyle =
              major
                ? '#151515'
                : '#69718a';

            ctx.globalAlpha =
              major
                ? 1
                : 0.60;

            ctx.lineWidth =
              major
                ? 1
                : 0.7;

            ctx.beginPath();
            ctx.moveTo(
              Math.round(x) + 0.5,
              chartArea.bottom
            );
            ctx.lineTo(
              Math.round(x) + 0.5,
              chartArea.bottom +
                (
                  major
                    ? 5
                    : 2
                )
            );
            ctx.stroke();
          }
        );

        ctx.restore();

        drawYAxisTitle(
          ctx,
          chartArea
        );
      }
    };

    const axisSpinesPlugin = {
      id: 'pffDemographicsAxisSpines',

      afterDraw(chartInstance) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        ctx.save();
        ctx.strokeStyle =
          '#151515';
        ctx.lineWidth =
          1.1;

        ctx.beginPath();
        ctx.moveTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(
          chartArea.left,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.lineTo(
          chartArea.right,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.stroke();

        ctx.restore();
      }
    };

    Chart.register(
      pffAxesPlugin,
      axisSpinesPlugin
    );

    // ============================================================
    // CHART CONFIGURATION
    // ============================================================

    function chartAnimationDuration(reason) {
      if (reducedMotion()) {
        return 0;
      }

      switch (reason) {
        case 'tab':
          return 820;

        case 'option':
          return 720;

        case 'legend':
          return 260;

        case 'initial':
          return 760;

        default:
          return 520;
      }
    }

    function baseChartOptions(config) {
      const mobile =
        window.innerWidth <= 430;

      return {
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 0,

        devicePixelRatio:
          Math.min(
            window.devicePixelRatio || 1,
            2
          ),

        animation: {
          duration: 760,
          easing: 'easeOutQuart'
        },

        animations: {
          x: {
            duration: 760,
            easing: 'easeOutQuart'
          },

          y: {
            duration: 760,
            easing: 'easeOutQuart'
          },

          colors: {
            type: 'color',
            properties: [
              'borderColor',
              'backgroundColor',
              'pointBackgroundColor'
            ],
            duration: 760,
            easing: 'easeOutQuart'
          }
        },

        transitions: {
          active: {
            animation: {
              duration: 180
            }
          }
        },

        interaction: {
          mode: 'nearest',
          intersect: true,
          axis: 'xy'
        },

        layout: {
          autoPadding: true,
          padding: {
            top: mobile ? 8 : 9,
            right: 3,
            bottom: 0,
            left: 0
          }
        },

        plugins: {
          legend: {
            display: false
          },

          tooltip: {
            displayColors: true,
            backgroundColor:
              'rgba(21, 21, 21, 0.94)',
            titleColor: '#ffffff',
            bodyColor: '#ffffff',
            borderColor:
              'rgba(255,255,255,0.10)',
            borderWidth: 1,
            padding: 9,
            cornerRadius: 4,

            titleFont: {
              family: 'Lato',
              size: 11,
              weight: '700'
            },

            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },

            filter(context) {
              return Boolean(
                context.dataset
                  ._activeSeries
              );
            },

            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      items[0].label
                    )
                  : '';
              },

              label(context) {
                return `${context.dataset._seriesLabel}: ${formatTooltipValue(
                  Number(
                    context.raw
                  ),
                  currentViewConfig()
                )}`;
              }
            }
          }
        },

        scales: {
          x: {
            type: 'category',
            offset: false,

            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },

            border: {
              display: false
            },

            ticks: {
              color: '#151515',
              padding: 7,
              maxRotation: 0,
              minRotation: 0,
              autoSkip: false,

              font: {
                family: 'Lato',
                size: mobile ? 9 : 10,
                weight: '400'
              },

              callback(value, index) {
                const year =
                  Number(
                    rows[index]?.year
                  );

                return Number.isFinite(year) &&
                  year % 2 === 0
                  ? String(year)
                  : '';
              }
            },

            title: {
              display: true,
              text: 'Year',
              color: '#151515',
              padding: {
                top: 3
              },

              font: {
                family: 'Lato',
                size: mobile ? 12 : 13,
                weight: '700'
              }
            }
          },

          y: {
            min:
              config.scale.min,
            max:
              config.scale.max,

            afterFit(scale) {
              scale.width =
                mobile
                  ? 61
                  : 69;
            },

            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },

            border: {
              display: false
            },

            ticks: {
              display: false,
              stepSize:
                config.scale.step
            },

            title: {
              display: false
            }
          }
        }
      };
    }

    function createChart(config) {
      setYAxisTickValuesImmediately(
        config
      );

      setYAxisTitleImmediately(
        config.yTitle
      );

      if (chartHeadingFixed) {
        chartHeadingFixed.textContent =
          config.headingFixed;
      }

      if (chartHeadingDetail) {
        chartHeadingDetail.textContent =
          config.headingDetail;
      }

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type: 'line',

            data: {
              labels:
                rows.map(
                  row =>
                    String(row.year)
                ),

              datasets:
                buildDatasets(config)
            },

            options:
              baseChartOptions(config)
          }
        );

      renderLegendItems(config);
      lastRenderedConfig =
        cloneViewConfig(config);
    }

    function syncChartScale(config) {
      if (!chart) {
        return;
      }

      const y =
        chart.options.scales.y;

      y.min =
        config.scale.min;

      y.max =
        config.scale.max;

      y.ticks.stepSize =
        config.scale.step;
    }

    function updateChart(
      reason = 'option'
    ) {
      const config =
        currentViewConfig();

      const previousConfig =
        lastRenderedConfig;

      updateHeading(
        previousConfig,
        config,
        reason !== 'initial'
      );

      if (!chart) {
        createChart(config);
        return;
      }

      chart.tooltip.setActiveElements(
        [],
        {
          x: 0,
          y: 0
        }
      );

      const nextAxisTargets =
        yTickTargets(config);

      const scaleChanged =
        !previousConfig ||
        !scalesMatch(
          previousConfig.scale,
          config.scale
        );

      const yTitleChanged =
        !previousConfig ||
        previousConfig.yTitle !==
          config.yTitle;

      const legendChanged =
        !previousConfig ||
        !arraysMatch(
          previousConfig.labels,
          config.labels
        ) ||
        !arraysMatch(
          previousConfig.colours,
          config.colours
        );

      syncChartDatasets(config);
      syncChartScale(config);

      const duration =
        chartAnimationDuration(reason);

      chart.options.animation.duration =
        duration;

      chart.options.animations.x.duration =
        duration;

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.colors.duration =
        duration;

      chart.update();

      if (scaleChanged) {
        animateYAxisTickValues(
          nextAxisTargets,
          duration
        );
      } else {
        setYAxisTickValuesImmediately(
          config
        );
      }

      if (yTitleChanged) {
        animateYAxisTitle(
          config.yTitle,
          Math.min(
            duration,
            420
          )
        );
      }

      if (legendChanged) {
        animateLegendChange(config);
      }

      lastRenderedConfig =
        cloneViewConfig(config);
    }

    // ============================================================
    // TABS + METRIC CONTROL
    // ============================================================

    function updateTabIndicator(
      animate = true
    ) {
      const activeTab =
        chartTabs.find(
          tab =>
            tab.dataset.group ===
            activeGroup
        );

      if (!activeTab) {
        return;
      }

      if (!animate) {
        tabList.classList.add(
          'is-positioning'
        );
      }

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${activeTab.offsetLeft}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${activeTab.offsetWidth}px`
      );

      if (!animate) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            tabList.classList.remove(
              'is-positioning'
            );
          });
        });
      }

      requestAnimationFrame(
        updateTabScrollControls
      );
    }

    function syncMetricSwitch() {
      const hoursSelected =
        activeMetric === 'hours';

      const workforceLabel =
        activeGroup === 'sex'
          ? '%'
          : 'Count';

      if (workforceButton) {
        workforceButton.textContent =
          workforceLabel;

        workforceButton.setAttribute(
          'aria-label',
          activeGroup === 'sex'
            ? 'Percentage'
            : 'Count'
        );
      }

      if (hoursButton) {
        hoursButton.setAttribute(
          'aria-label',
          'Weekly hours'
        );
      }

      metricSwitch.classList.toggle(
        'is-hours-selected',
        hoursSelected
      );

      metricButtons.forEach(button => {
        const active =
          button.dataset.metric ===
          activeMetric;

        button.classList.toggle(
          'is-active',
          active
        );

        button.setAttribute(
          'aria-pressed',
          String(active)
        );
      });
    }

    function setGroup(group) {
      if (
        group === activeGroup
      ) {
        return;
      }

      activeGroup =
        group;

      chartTabs.forEach(tab => {
        const active =
          tab.dataset.group ===
          activeGroup;

        tab.classList.toggle(
          'is-active',
          active
        );

        tab.setAttribute(
          'aria-selected',
          String(active)
        );
      });

      syncMetricSwitch();
      updateTabIndicator(true);
      updateChart('tab');
    }

    function setMetric(metric) {
      if (
        metric === activeMetric
      ) {
        return;
      }

      activeMetric =
        metric;

      syncMetricSwitch();
      updateChart('option');
    }

    chartTabs.forEach(tab => {
      tab.addEventListener(
        'click',
        () => {
          setGroup(
            tab.dataset.group
          );
        }
      );
    });

    metricButtons.forEach(button => {
      button.addEventListener(
        'click',
        () => {
          const nextMetric =
            button.dataset.metric ===
            activeMetric
              ? activeMetric === 'workforce'
                ? 'hours'
                : 'workforce'
              : button.dataset.metric;

          setMetric(
            nextMetric
          );
        }
      );
    });

    // ============================================================
    // TAB / HEADING / LEGEND SCROLLING
    // ============================================================

    tabScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();
        scrollByAmount(
          tabList,
          -1
        );
      }
    );

    tabScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();
        scrollByAmount(
          tabList,
          1
        );
      }
    );

    tabList.addEventListener(
      'scroll',
      updateTabScrollControls,
      { passive: true }
    );

    headingScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();
        scrollByAmount(
          headingScrollViewport,
          -1
        );
      }
    );

    headingScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();
        scrollByAmount(
          headingScrollViewport,
          1
        );
      }
    );

    headingScrollViewport.addEventListener(
      'scroll',
      updateHeadingScrollControls,
      { passive: true }
    );

    legendScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            -Math.max(
              110,
              chartLegend.clientWidth *
                0.72
            ),

          behavior: 'smooth'
        });
      }
    );

    legendScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            Math.max(
              110,
              chartLegend.clientWidth *
                0.72
            ),

          behavior: 'smooth'
        });
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive: true
      }
    );

    // ============================================================
    // INTERACTION + RESPONSIVE LAYOUT
    // ============================================================

    chartCanvas.addEventListener(
      'contextmenu',
      event => {
        event.preventDefault();
      }
    );

    chartCanvas.addEventListener(
      'selectstart',
      event => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      'pointerdown',
      event => {
        if (
          !event.target.closest(
            '#workforceChart'
          ) &&
          chart
        ) {
          chart.tooltip.setActiveElements(
            [],
            {
              x: 0,
              y: 0
            }
          );

          chart.update('none');
        }
      }
    );

    function refreshResponsiveLayout() {
      if (
        responsiveFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveFrame
        );
      }

      responsiveFrame =
        requestAnimationFrame(() => {
          responsiveFrame =
            null;

          if (chart) {
            const mobile =
              mobileLayout();

            chart.options.interaction.intersect =
              mobile;

            chart.options.layout.padding.top =
              mobile ? 8 : 9;

            chart.options.scales.x.ticks.font.size =
              mobile ? 9 : 10;

            chart.options.scales.x.title.font.size =
              mobile ? 12 : 13;

            chart.options.scales.y.afterFit =
              scale => {
                scale.width =
                  mobile ? 61 : 69;
              };

            chart.data.datasets.forEach(
              dataset => {
                dataset.pointHitRadius =
                  dataset._activeSeries
                    ? pointHitRadiusForViewport()
                    : 0;
              }
            );

            chart.resize();
          }

          updateTabIndicator(false);
          updateTabScrollControls();
          updateHeadingScrollControls();
          updateLegendScrollControls();
        });
    }

    if ('ResizeObserver' in window) {
      const layoutResizeObserver =
        new ResizeObserver(entries => {
          const hasUsableSize =
            entries.some(
              entry =>
                entry.contentRect.width > 1 &&
                entry.contentRect.height > 1
            );

          if (hasUsableSize) {
            refreshResponsiveLayout();
          }
        });

      layoutResizeObserver.observe(app);
      layoutResizeObserver.observe(chartShell);
    }

    window.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive: true
      }
    );

    window.visualViewport?.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive: true
      }
    );

    window.addEventListener(
      'pageshow',
      refreshResponsiveLayout
    );

    if (document.fonts?.ready) {
      document.fonts.ready.then(
        refreshResponsiveLayout
      );
    }

    // ============================================================
    // STARTUP
    // ============================================================

    async function start() {
      statusElement.textContent = '';

      try {
        const table =
          await loadGVizSheet(
            SHEET_NAME,
            DATA_RANGE
          );

        rows =
          parseDemographicTable(
            table
          );

        saveLocalCache(rows);
        setDataSource('live');
      } catch (liveError) {
        console.warn(
          'Live demographic data unavailable; trying local cache.',
          liveError
        );

        const cached =
          loadLocalCache();

        if (cached) {
          rows =
            cached;
        } else {
          rows =
            EMBEDDED_FALLBACK;
        }

        setDataSource('cached');
      }

      try {
        const config =
          currentViewConfig();

        createChart(config);
        syncMetricSwitch();
        updateTabIndicator(false);
        hideLoadingState();
      } catch (error) {
        console.error(error);

        statusElement.textContent =
          String(
            error?.message ||
            'Unable to render workforce chart'
          )
            .replace(/\.+$/, '');

        hideLoadingState();
      }
    }

    start();
  </script>
</body>
</html>
