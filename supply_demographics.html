<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Workforce Demographics Trends</title>

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <script src="./assets/pff_chart_core.js"></script>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading workforce data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading workforce data…</div>
      </div>

      <div class="module-top">
        <div id="tabScrollShell" class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Demographic view"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-group="sex"
              aria-selected="true"
            >Sex</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-group="age"
              aria-selected="false"
            >Age</button>
          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"
            type="button"
            aria-label="Scroll tabs right"
          >›</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">
              <span id="chartHeadingFixed" class="chart-heading-fixed">Sex composition</span><span id="chartHeadingDetail" class="chart-heading-detail"></span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3yr Trend. Press to switch to 10-year trend mode."
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>

          <div
            id="metricSwitch"
            class="metric-switch"
            role="group"
            aria-label="Display metric"
          >
            <button
              id="workforceButton"
              class="metric-button is-active"
              type="button"
              data-metric="workforce"
              aria-pressed="true"
              aria-label="Percentage"
            >%</button>

            <button
              id="hoursButton"
              class="metric-button"
              type="button"
              data-metric="hours"
              aria-pressed="false"
              aria-label="Weekly hours"
            >Weekly hours</button>
          </div>
        </div>
      </div>

      <div id="legendNav" class="legend-nav">
        <button
          id="legendScrollLeft"
          class="legend-scroll-button legend-scroll-left is-hidden"
          type="button"
          aria-label="Scroll legend left"
        >‹</button>

        <div class="legend-viewport">
          <div
            id="chartLegend"
            class="chart-legend"
            aria-label="Chart legend"
          ></div>
        </div>

        <button
          id="legendScrollRight"
          class="legend-scroll-button legend-scroll-right is-hidden"
          type="button"
          aria-label="Scroll legend right"
        >›</button>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="workforceChart"
          aria-label="Australian optometry workforce demographics chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>

    'use strict';

    // ============================================================
    // DATA SOURCE
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const SHEET_NAME =
      'Miscellaneous';

    /*
      Row 31 contains the column headers for these four blocks:

      AW:AY = Sex %
      BA:BC = Sex clinical hours
      BE:BK = Age counts
      BM:BS = Age clinical hours

      Using row 31 as the single GViz header row means row 32 onward
      is returned directly as data and future years are picked up
      automatically without relying on the decorative rows 29-30.
    */
    const DATA_RANGE =
      'AW31:BS';

    const FETCH_TIMEOUT_MS =
      15000;

    const LOCAL_CACHE_KEY =
      'pff-workforce-demographics-v2';

    const SEX_LABELS = [
      'Male',
      'Female'
    ];

    const AGE_LABELS = [
      '20–34',
      '35–44',
      '45–54',
      '55–64',
      '65–74',
      '75–99'
    ];

    const SEX_COLOURS = [
      '#247db8',
      '#d76b82'
    ];

    const AGE_COLOURS = [
      '#9ecae1',
      '#247db8',
      '#2ca02c',
      '#f28e2b',
      '#e34a33',
      '#6a3d9a'
    ];

    const SERIES_SLOT_COUNT =
      AGE_LABELS.length;

    const AXIS_MAJOR_INTERVALS =
      4;

    const TRANSPARENT_COLOUR =
      'rgba(0, 0, 0, 0)';

    const EMBEDDED_FALLBACK = [
      {year:2013,sexPct:[51.00671141,48.99328859],sexHours:[37.2,30.2],ageCounts:[1408,1035,919,570,78,13],ageHours:[35,31.5,34.5,34.9,28,16.9]},
      {year:2014,sexPct:[50.70320078,49.29679922],sexHours:[37.1,30.4],ageCounts:[1417,1057,906,648,84,12],ageHours:[35.2,31.3,34.2,35,27.7,23.3]},
      {year:2015,sexPct:[49.4366521,50.5633479],sexHours:[36.8,30.5],ageCounts:[1549,1067,910,709,98,16],ageHours:[35.4,30.9,33.7,34.7,27.2,23.5]},
      {year:2016,sexPct:[48.45932166,51.54067834],sexHours:[36.4,30.4],ageCounts:[1630,1072,937,730,124,18],ageHours:[35.6,30.7,33.1,33.9,25.3,21.6]},
      {year:2017,sexPct:[47.40724669,52.59275331],sexHours:[36.1,30.6],ageCounts:[1673,1065,973,748,135,15],ageHours:[35.7,30.7,32.7,33.3,26.2,20.4]},
      {year:2018,sexPct:[46.09634551,53.90365449],sexHours:[36.2,30.8],ageCounts:[1829,1062,1009,761,138,17],ageHours:[36,30.7,32.5,33.4,26.3,21.1]},
      {year:2019,sexPct:[45.13274336,54.86725664],sexHours:[35.8,30.9],ageCounts:[2048,1045,1027,770,179,16],ageHours:[35.9,29.9,32.2,32.8,27.5,21.3]},
      {year:2020,sexPct:[44.54545455,55.45454545],sexHours:[34.1,30.2],ageCounts:[2158,1051,1015,742,189,15],ageHours:[34.8,28.8,30.8,31.3,26.6,15.2]},
      {year:2021,sexPct:[43.55588618,56.44411382],sexHours:[34,30],ageCounts:[2306,1083,1001,743,226,18],ageHours:[34.6,28.5,30,31,28.1,21.5]},
      {year:2022,sexPct:[42.73713686,57.26286314],sexHours:[35.2,31.4],ageCounts:[2528,1121,1012,774,265,14],ageHours:[36.1,29.7,30.9,32.2,28.7,22.5]},
      {year:2023,sexPct:[41.39488209,58.60511791],sexHours:[34.8,30.9],ageCounts:[2739,1153,1003,779,288,17],ageHours:[35.5,29.2,30.5,31.3,27.9,22.3]},
      {year:2024,sexPct:[40.80515298,59.19484702],sexHours:[34.8,30.8],ageCounts:[2936,1163,1008,769,316,18],ageHours:[35.5,28.8,30.4,31,27.6,21.1]}
    ];

    // ============================================================
    // DOM + STATE
    // ============================================================

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById('loadingState');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartTabs =
      Array.from(
        document.querySelectorAll('.chart-tab')
      );

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const metricSwitch =
      document.getElementById('metricSwitch');

    const metricButtons =
      Array.from(
        document.querySelectorAll('.metric-button')
      );

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const chartHeadingFixed =
      document.getElementById('chartHeadingFixed');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartShell =
      document.getElementById('chartShell');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const chartCanvas =
      document.getElementById('workforceChart');

    let rows = [];
    let chart = null;
    let activeGroup = 'sex';
    let activeMetric = 'workforce';
    let trendMode = '3yr';
    let lastRenderedConfig = null;

    let yAxisController = null;
    let tabsController = null;
    let metricController = null;
    let trendController = null;
    let headingScroller = null;
    let legendController = null;
    let responsiveController = null;
    let chartInteractions = null;
    let chartSummary = null;
    let legendAnimationToken = 0;

    const hiddenSeriesByView =
      new Map();

    // ============================================================
    // DEMOGRAPHIC DATA
    // ============================================================

    function numericDemographicCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      const direct =
        PFFCharts.numericCell(cell);

      if (Number.isFinite(direct)) {
        return direct;
      }

      const cleaned =
        PFF.cleanText(
          cell.f ?? cell.v
        )
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function parseDemographicTable(table) {
      const sourceRows =
        table?.rows || [];

      const parsed = [];

      sourceRows.forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          numericDemographicCell(
            cells[0]
          );

        if (!Number.isFinite(year)) {
          return;
        }

        const record = {
          year:
            Math.round(year),

          sexPct: [
            numericDemographicCell(cells[1]),
            numericDemographicCell(cells[2])
          ],

          sexHours: [
            numericDemographicCell(cells[5]),
            numericDemographicCell(cells[6])
          ],

          ageCounts:
            Array.from(
              { length: 6 },
              (_, index) =>
                numericDemographicCell(
                  cells[9 + index]
                )
            ),

          ageHours:
            Array.from(
              { length: 6 },
              (_, index) =>
                numericDemographicCell(
                  cells[17 + index]
                )
            )
        };

        const hasUsableValues =
          [
            ...record.sexPct,
            ...record.sexHours,
            ...record.ageCounts,
            ...record.ageHours
          ].some(
            Number.isFinite
          );

        if (hasUsableValues) {
          parsed.push(record);
        }
      });

      const uniqueByYear =
        new Map();

      parsed.forEach(row => {
        uniqueByYear.set(
          row.year,
          row
        );
      });

      const result =
        Array.from(
          uniqueByYear.values()
        )
          .sort(
            (first, second) =>
              first.year - second.year
          );

      if (result.length < 2) {
        throw new Error(
          'No usable demographic trend rows were found.'
        );
      }

      return result;
    }

    // ============================================================
    // VIEW CONFIGURATION
    // ============================================================

    function currentViewKey() {
      return `${activeGroup}:${activeMetric}`;
    }

    function currentLegendKey() {
      return activeGroup;
    }

    function currentViewConfig() {
      if (
        activeGroup === 'sex' &&
        activeMetric === 'workforce'
      ) {
        return {
          headingFixed: 'Sex composition',
          headingDetail: '',
          labels: SEX_LABELS,
          colours: SEX_COLOURS,
          valueKey: 'sexPct',
          yTitle: '% of optometrists',
          scale: {
            min: 0,
            max: 60,
            step: 15,
            intervals:
              AXIS_MAJOR_INTERVALS
          },
          decimals: 1,
          tooltipSuffix: '%'
        };
      }

      if (
        activeGroup === 'sex' &&
        activeMetric === 'hours'
      ) {
        return {
          headingFixed: 'Sex composition',
          headingDetail: '',
          labels: SEX_LABELS,
          colours: SEX_COLOURS,
          valueKey: 'sexHours',
          yTitle: 'Weekly hours',
          scale: {
            min: 0,
            max: 40,
            step: 10,
            intervals:
              AXIS_MAJOR_INTERVALS
          },
          decimals: 1,
          tooltipSuffix: ' hrs'
        };
      }

      if (
        activeGroup === 'age' &&
        activeMetric === 'workforce'
      ) {
        return {
          headingFixed: 'Age composition',
          headingDetail: '',
          labels: AGE_LABELS,
          colours: AGE_COLOURS,
          valueKey: 'agePct',
          yTitle: '% of optometrists',
          scale: {
            min: 0,
            max: 60,
            step: 15,
            intervals:
              AXIS_MAJOR_INTERVALS
          },
          decimals: 1,
          tooltipSuffix: '%'
        };
      }

      return {
        headingFixed: 'Age composition',
        headingDetail: '',
        labels: AGE_LABELS,
        colours: AGE_COLOURS,
        valueKey: 'ageHours',
        yTitle: 'Weekly hours',
        scale: {
          min: 0,
          max: 40,
          step: 10,
          intervals:
            AXIS_MAJOR_INTERVALS
        },
        decimals: 1,
        tooltipSuffix: ' hrs'
      };
    }

    function valueForRow(
      row,
      config,
      seriesIndex
    ) {
      if (config.valueKey === 'agePct') {
        const counts =
          Array.isArray(row?.ageCounts)
            ? row.ageCounts
            : [];

        const total =
          counts.reduce(
            (sum, value) =>
              Number.isFinite(value)
                ? sum + value
                : sum,
            0
          );

        const count =
          counts[seriesIndex];

        return Number.isFinite(count) &&
          total > 0
          ? count / total * 100
          : NaN;
      }

      const value =
        row?.[config.valueKey]?.[
          seriesIndex
        ];

      return Number.isFinite(value)
        ? value
        : NaN;
    }

    function formatTooltipValue(
      value,
      config
    ) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      return `${new Intl.NumberFormat(
        'en-AU',
        {
          minimumFractionDigits:
            config.decimals,

          maximumFractionDigits:
            config.decimals
        }
      ).format(value)}${config.tooltipSuffix}`;
    }

    function activeTrendWindow() {
      return trendMode === '10yr'
        ? 10
        : trendMode === '3yr'
          ? 3
          : 0;
    }

    function trendForSeries(
      seriesIndex,
      config = currentViewConfig()
    ) {
      const windowSize =
        activeTrendWindow();

      if (windowSize < 2) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        rows,
        row =>
          valueForRow(
            row,
            config,
            seriesIndex
          ),
        windowSize
      );
    }

    // ============================================================
    // DATASETS
    // ============================================================

    function slotSeriesIndex(
      slotIndex,
      config
    ) {
      if (!config.labels.length) {
        return 0;
      }

      return slotIndex <
        config.labels.length
        ? slotIndex
        : slotIndex %
            config.labels.length;
    }

    function datasetForSlot(
      slotIndex,
      config
    ) {
      const activeSeries =
        slotIndex <
        config.labels.length;

      const sourceIndex =
        slotSeriesIndex(
          slotIndex,
          config
        );

      const label =
        activeSeries
          ? config.labels[
              slotIndex
            ]
          : '';

      const hidden =
        hiddenSeriesByView.get(
          currentLegendKey()
        ) ||
        new Set();

      const userHidden =
        activeSeries &&
        hidden.has(label);

      const visible =
        activeSeries &&
        !userHidden;

      const colour =
        visible
          ? config.colours[
              slotIndex
            ]
          : TRANSPARENT_COLOUR;

      return PFFCharts.lineDataset({
        label,

        data:
          rows.map(row => {
            const value =
              valueForRow(
                row,
                config,
                sourceIndex
              );

            return Number.isFinite(
              value
            )
              ? value
              : null;
          }),

        _activeSeries:
          visible,

        _seriesLabel:
          label,

        borderColor:
          colour,

        backgroundColor:
          colour,

        pointBackgroundColor:
          colour,

        pointBorderColor:
          '#fff',

        pointBorderWidth:
          visible ? 1 : 0,

        pointHoverRadius:
          visible ? 4 : 0,

        pointHitRadius:
          visible
            ? (
                PFFCharts.mobileLayout()
                  ? 9
                  : 5
              )
            : 0,

        cubicInterpolationMode:
          'monotone'
      });
    }

    function buildDatasets(config) {
      return Array.from(
        {
          length:
            SERIES_SLOT_COUNT
        },
        (_, slotIndex) =>
          datasetForSlot(
            slotIndex,
            config
          )
      );
    }

    function syncChartDatasets(config) {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets(config);

      nextDatasets.forEach(
        (nextDataset, index) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] = nextDataset;
          } else {
            Object.assign(
              current,
              nextDataset
            );
          }

          const activeSeries =
            index <
            config.labels.length;

          const hidden =
            hiddenSeriesByView.get(
              currentLegendKey()
            ) ||
            new Set();

          const label =
            activeSeries
              ? config.labels[index]
              : '';

          const userHidden =
            activeSeries &&
            hidden.has(label);

          if (
            typeof chart.setDatasetVisibility ===
            'function'
          ) {
            chart.setDatasetVisibility(
              index,
              activeSeries
                ? !userHidden
                : true
            );
          }
        }
      );
    }

    // ============================================================
    // SHARED PFF PLUGINS
    // ============================================================

    const yearTicksPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'pffDemographicsYearTicks',

        getValue({
          index
        }) {
          return rows[index]?.year;
        }
      });

    const trendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'pffDemographicTrendLabels',

        enabled() {
          return trendMode !==
            'off';
        },

        isActive({
          dataset
        }) {
          return Boolean(
            dataset?._activeSeries
          );
        },

        getTrendValue({
          datasetIndex
        }) {
          return trendForSeries(
            datasetIndex
          );
        },

        getSeriesColour({
          datasetIndex
        }) {
          return currentViewConfig()
            .colours[
              datasetIndex
            ] ||
            '#69718a';
        }
      });

    // ============================================================
    // CHART
    // ============================================================

    function baseChartOptions(config) {
      return PFFCharts.baseChartOptions({
        transitions:
          PFFCharts.seriesVisibilityTransitionOptions(
            240
          ),

        plugins: {
          tooltip: {
            filter(context) {
              return Boolean(
                context.dataset
                  ._activeSeries
              );
            },

            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      items[0].label
                    )
                  : '';
              },

              label(context) {
                return `${context.dataset._seriesLabel}: ${formatTooltipValue(
                  Number(
                    context.raw
                  ),
                  currentViewConfig()
                )}`;
              }
            }
          }
        },

        scales: {
          x:
            PFFCharts.xYearScaleOptions({
              ticks: {
                callback(
                  value,
                  index
                ) {
                  const year =
                    Number(
                      rows[index]?.year
                    );

                  return Number.isFinite(year) &&
                    year % 2 === 0
                    ? String(year)
                    : '';
                }
              }
            }),

          y:
            PFFCharts.yScaleOptions(
              config.scale,
              {
                ticks: {
                  stepSize:
                    config.scale.step
                }
              }
            )
        }
      });
    }

    function syncChartScale(config) {
      if (!chart) {
        return;
      }

      const y =
        chart.options.scales.y;

      y.min =
        config.scale.min;

      y.max =
        config.scale.max;

      y.ticks.stepSize =
        config.scale.step;
    }

    function updateHeading(
      previousConfig,
      nextConfig,
      animate = true
    ) {
      const changed =
        !previousConfig ||
        previousConfig.headingFixed !==
          nextConfig.headingFixed ||
        previousConfig.headingDetail !==
          nextConfig.headingDetail;

      if (changed) {
        if (animate) {
          PFFCharts.animateHeading({
            fixed:
              chartHeadingFixed,

            detail:
              chartHeadingDetail,

            fixedText:
              nextConfig.headingFixed,

            detailText:
              nextConfig.headingDetail,

            duration:
              PFFCharts.defaults
                .viewTransitionMs,

            onComplete() {
              headingScroller?.update();
            }
          });
        } else {
          chartHeadingFixed.textContent =
            nextConfig.headingFixed;

          chartHeadingDetail.textContent =
            nextConfig.headingDetail;
        }
      }

      headingScrollViewport.scrollLeft =
        0;

      requestAnimationFrame(
        () =>
          headingScroller?.update()
      );
    }

    function legendItems() {
      const config =
        currentViewConfig();

      const hidden =
        hiddenSeriesByView.get(
          currentLegendKey()
        ) ||
        new Set();

      return config.labels.map(
        (
          label,
          datasetIndex
        ) => ({
          datasetIndex,
          label,
          colour:
            config.colours[
              datasetIndex
            ],
          active:
            !hidden.has(label)
        })
      );
    }

    function renderLegend(
      animate = false
    ) {
      if (!legendController) {
        return;
      }

      const draw = () => {
        legendController.render();
        chartLegend.scrollLeft = 0;
      };

      if (
        !animate ||
        PFFCharts.reducedMotion() ||
        typeof chartLegend.animate !==
          'function' ||
        !chartLegend.childElementCount
      ) {
        draw();
        return;
      }

      const token =
        ++legendAnimationToken;

      chartLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const outgoing =
        chartLegend.animate(
          [
            { opacity: 1 },
            { opacity: 0 }
          ],
          {
            duration: 120,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      outgoing.finished
        .catch(() => {})
        .then(() => {
          if (
            token !==
            legendAnimationToken
          ) {
            return;
          }

          outgoing.cancel();
          draw();

          const incoming =
            chartLegend.animate(
              [
                { opacity: 0 },
                { opacity: 1 }
              ],
              {
                duration: 220,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'both'
              }
            );

          incoming.finished
            .then(
              () => incoming.cancel()
            )
            .catch(() => {});
        });
    }

    function updateAccessibleSummary() {
      if (
        !chartSummary ||
        !rows.length
      ) {
        return;
      }

      const config =
        currentViewConfig();

      const latest =
        rows[
          rows.length - 1
        ];

      const values =
        config.labels
          .map(
            (
              label,
              index
            ) => {
              const value =
                valueForRow(
                  latest,
                  config,
                  index
                );

              return `${label} ${formatTooltipValue(
                value,
                config
              )}`;
            }
          )
          .join(', ');

      const trendDescription =
        trendMode === 'off'
          ? 'Trend annotations are off.'
          : `${activeTrendWindow()}-year trend annotations are on.`;

      PFFCharts.updateChartSummary(
        `${config.headingFixed}. Latest data ${latest.year}: ${values}. ${trendDescription}`,
        chartSummary
      );
    }

    function createChart(config) {
      chartHeadingFixed.textContent =
        config.headingFixed;

      chartHeadingDetail.textContent =
        config.headingDetail;

      yAxisController =
        PFFCharts.createUnifiedYAxis({
          id:
            'pffDemographicsAxes',

          getChart() {
            return chart;
          },

          getScale() {
            return currentViewConfig()
              .scale;
          },

          getDecimals() {
            return 0;
          },

          getTitle() {
            return currentViewConfig()
              .yTitle;
          }
        });

      yAxisController.setImmediately(
        config.scale,
        0
      );

      yAxisController.setTitleImmediately(
        config.yTitle
      );

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type: 'line',

            data: {
              labels:
                rows.map(
                  row =>
                    String(row.year)
                ),

              datasets:
                buildDatasets(config)
            },

            options:
              baseChartOptions(config),

            plugins: [
              yAxisController.plugin,
              yearTicksPlugin,
              trendLabelsPlugin
            ]
          }
        );

      syncChartDatasets(config);

      lastRenderedConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      updateAccessibleSummary();
    }

    function updateChart(
      reason = 'option'
    ) {
      const config =
        currentViewConfig();

      const previousConfig =
        lastRenderedConfig;

      updateHeading(
        previousConfig,
        config,
        reason !== 'initial'
      );

      if (!chart) {
        createChart(config);
        return;
      }

      chart.tooltip.setActiveElements(
        [],
        {
          x: 0,
          y: 0
        }
      );

      const previousVisibleScale =
        yAxisController.currentScale();

      const scaleChanged =
        !previousConfig ||
        !PFFCharts.scalesMatch(
          previousConfig.scale,
          config.scale
        );

      const yTitleChanged =
        !previousConfig ||
        previousConfig.yTitle !==
          config.yTitle;

      const legendChanged =
        !previousConfig ||
        !PFFCharts.arraysMatch(
          previousConfig.labels,
          config.labels
        ) ||
        !PFFCharts.arraysMatch(
          previousConfig.colours,
          config.colours
        );

      syncChartDatasets(config);
      syncChartScale(config);

      const duration =
        reason === 'initial'
          ? 0
          : PFFCharts
              .chartAnimationDuration();

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeInOutCubic';

      chart.options.animations.x.duration =
        duration;

      chart.options.animations.x.easing =
        'easeInOutCubic';

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeInOutCubic';

      chart.options.animations.colors.duration =
        0;

      chart.update();

      if (scaleChanged) {
        yAxisController.animate(
          previousVisibleScale,
          config.scale,
          {
            duration,
            fromDecimals:
              yAxisController.currentDecimals(),
            toDecimals: 0
          }
        );
      } else {
        yAxisController.setImmediately(
          config.scale,
          0
        );
      }

      if (yTitleChanged) {
        yAxisController.animateTitle(
          previousConfig?.yTitle ??
            config.yTitle,
          config.yTitle,
          duration
        );
      } else {
        yAxisController.setTitleImmediately(
          config.yTitle
        );
      }

      if (legendChanged) {
        renderLegend(
          reason !== 'initial'
        );
      } else {
        legendController?.render();
      }

      lastRenderedConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      updateAccessibleSummary();
    }

    // ============================================================
    // SHARED CONTROLS
    // ============================================================

    function setupControls() {
      headingScroller =
        PFFCharts.setupScrollableRegion({
          scroller:
            headingScrollViewport,

          leftButton:
            headingScrollLeft,

          rightButton:
            headingScrollRight
        });

      tabsController =
        PFFCharts.setupTabs({
          tabList,

          tabs:
            chartTabs,

          valueAttribute:
            'group',

          initialValue:
            activeGroup,

          leftButton:
            tabScrollLeft,

          rightButton:
            tabScrollRight,

          onChange(group) {
            if (
              group ===
              activeGroup
            ) {
              return;
            }

            activeGroup =
              group;

            updateChart(
              'tab'
            );
          }
        });

      metricController =
        PFFCharts.setupMetricSwitch({
          element:
            metricSwitch,

          buttons:
            metricButtons,

          valueAttribute:
            'metric',

          initialValue:
            activeMetric,

          onChange(metric) {
            if (
              metric ===
              activeMetric
            ) {
              return;
            }

            activeMetric =
              metric;

            updateChart(
              'option'
            );
          }
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,

          initialMode:
            trendMode,

          onChange(mode) {
            trendMode =
              mode;

            updateAccessibleSummary();
            chart?.draw();
          }
        });

      legendController =
        PFFCharts.setupLegend({
          legend:
            chartLegend,

          leftButton:
            legendScrollLeft,

          rightButton:
            legendScrollRight,

          getChart() {
            return chart;
          },

          getItems:
            legendItems,

          onToggle({
            datasetIndex,
            visible,
            item
          }) {
            const key =
              currentLegendKey();

            const hidden =
              new Set(
                hiddenSeriesByView.get(
                  key
                ) ||
                []
              );

            if (visible) {
              hidden.delete(
                item.label
              );
            } else {
              hidden.add(
                item.label
              );
            }

            hiddenSeriesByView.set(
              key,
              hidden
            );

            const config =
              currentViewConfig();

            const dataset =
              chart?.data?.datasets?.[
                datasetIndex
              ];

            if (dataset) {
              dataset._activeSeries =
                visible;

              const colour =
                visible
                  ? config.colours[
                      datasetIndex
                    ]
                  : TRANSPARENT_COLOUR;

              dataset.borderColor =
                colour;

              dataset.backgroundColor =
                colour;

              dataset.pointBackgroundColor =
                colour;

              dataset.pointBorderWidth =
                visible ? 1 : 0;

              dataset.pointHoverRadius =
                visible ? 4 : 0;

              dataset.pointHitRadius =
                visible
                  ? (
                      PFFCharts.mobileLayout()
                        ? 9
                        : 5
                    )
                  : 0;
            }

            const visibilityDuration =
              PFFCharts.reducedMotion()
                ? 0
                : 240;

            chart.options.animation.duration =
              visibilityDuration;

            chart.options.animations.x.duration =
              visibilityDuration;

            chart.options.animations.y.duration =
              visibilityDuration;

            chart.options.animations.colors.duration =
              visibilityDuration;

            updateAccessibleSummary();
          }
        });

      chartInteractions =
        PFFCharts.setupChartInteractions({
          canvas:
            chartCanvas,

          getChart() {
            return chart;
          }
        });

      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },

          observe: [
            app,
            chartShell
          ],

          beforeResize(
            chartInstance
          ) {
            chartInstance
              .data
              .datasets
              .forEach(
                dataset => {
                  dataset.pointHitRadius =
                    dataset._activeSeries
                      ? (
                          PFFCharts.mobileLayout()
                            ? 9
                            : 5
                        )
                      : 0;
                }
              );
          },

          onRefresh() {
            tabsController?.update();
            headingScroller?.update();
            legendController?.update();
          }
        });

      chartSummary =
        PFFCharts.ensureChartSummary({
          parent:
            app
        });
    }

    // ============================================================
    // STARTUP
    // ============================================================

    setupControls();

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      loadLive() {
        return PFFCharts.loadGVizSheet({
          sheetId:
            SHEET_ID,

          sheetName:
            SHEET_NAME,

          range:
            DATA_RANGE,

          timeoutMs:
            FETCH_TIMEOUT_MS,

          headers:
            '1'
        });
      },

      parseLive:
        parseDemographicTable,

      cacheKey:
        LOCAL_CACHE_KEY,

      fallback:
        EMBEDDED_FALLBACK,

      minRows:
        2,

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,

        text:
          dataSourceText
      },

      onLiveError(error) {
        console.warn(
          'Live demographic data unavailable; using cached data.',
          error
        );
      },

      render(loaded) {
        rows =
          loaded.rows;

        const config =
          currentViewConfig();

        createChart(config);
        tabsController?.update();
        metricController?.set(
          activeMetric,
          false
        );
        trendController?.set(
          trendMode,
          false
        );
        legendController?.render();
        responsiveController?.refresh();

        return chart;
      },

      onReady() {
        loadingState.setAttribute(
          'aria-hidden',
          'true'
        );

        updateAccessibleSummary();
      },

      errorMessage:
        'Unable to render workforce chart'
    });
  </script>
</body>
