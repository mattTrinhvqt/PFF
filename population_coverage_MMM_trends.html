    function saveCache() {
      try {
        const savedAt =
          Date.now();

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            savedAt,
            clinicianCountByYear:
              state.clinicianCountByYear,
            weeklyHoursByYear:
              state.weeklyHoursByYear,
            populationByYear:
              state.populationByYear
          })
        );

        state.savedAt =
          savedAt;
      } catch (_) {
        // Cache is optional.
      }
    }

    function loadCache() {
      try {
        const raw =
          localStorage.getItem(
            CACHE_KEY
          );

        if (!raw) {
          return false;
        }

        const cached =
          JSON.parse(raw);

        if (
          !cached?.clinicianCountByYear ||
          !cached?.weeklyHoursByYear ||
          !cached?.populationByYear
        ) {
          return false;
        }

        state.clinicianCountByYear =
          cached.clinicianCountByYear;

        state.weeklyHoursByYear =
          cached.weeklyHoursByYear;

        state.populationByYear =
          cached.populationByYear;

        state.savedAt =
          cached.savedAt || null;

        return true;
      } catch (_) {
        return false;
      }
    }

    async function loadData() {
      try {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            loadGVizSheet(
              CLINICIAN_SHEET,
              CLINICIAN_RANGE
            ),
            loadGVizSheet(
              POPULATION_SHEET,
              POPULATION_RANGE
            )
          ]);

        const clinician =
          parseClinicianTable(
            clinicianTable
          );

        state.clinicianCountByYear =
          clinician.counts;

        state.weeklyHoursByYear =
          clinician.hours;

        state.populationByYear =
          parsePopulationTable(
            populationTable
          );

        if (
          !Object.keys(
            state.clinicianCountByYear
          ).length
        ) {
          throw new Error(
            'No raw clinician counts were found.'
          );
        }

        if (
          !Object.keys(
            state.weeklyHoursByYear
          ).length
        ) {
          throw new Error(
            'No raw weekly clinical hours were found.'
          );
        }

        if (
          !Object.keys(
            state.populationByYear
          ).length
        ) {
          throw new Error(
            'No raw population data were found.'
          );
        }

        state.sourceState =
          'live';

        saveCache();
      } catch (error) {
        if (loadCache()) {
          state.sourceState =
            'cached';

          return;
        }

        throw error;
      }
    }

    // ============================================================
    // Y SCALES
    // ============================================================

    function niceStep(rawStep) {
      if (
        !Number.isFinite(rawStep) ||
        rawStep <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(rawStep)
        );

      const magnitude =
        Math.pow(10, exponent);

      const fraction =
        rawStep / magnitude;

      let niceFraction;

      if (fraction <= 1) {
        niceFraction = 1;
      } else if (fraction <= 2) {
        niceFraction = 2;
      } else if (fraction <= 2.5) {
        niceFraction = 2.5;
      } else if (fraction <= 5) {
        niceFraction = 5;
      } else {
        niceFraction = 10;
      }

      return niceFraction *
        magnitude;
    }

    function nextNiceStep(step) {
      const value =
        Math.max(
          1e-9,
          Number(step) || 1
        );

      const exponent =
        Math.floor(
          Math.log10(value)
        );

      const magnitude =
        Math.pow(10, exponent);

      const fraction =
        value / magnitude;

      if (fraction < 1.5) {
        return 2 * magnitude;
      }

      if (fraction < 2.25) {
        return 2.5 * magnitude;
      }

      if (fraction < 3.75) {
        return 5 * magnitude;
      }

      if (fraction < 7.5) {
        return 10 * magnitude;
      }

      return 20 * magnitude;
    }

    function valuesForState(
      stateCode
    ) {
      const values = [];

      for (
        const mmm of
        mmmsForState(stateCode)
      ) {
        for (
          const year of
          state.years
        ) {
          const value =
            coverageFor(
              year,
              stateCode,
              mmm
            );

          if (
            Number.isFinite(value)
          ) {
            values.push(value);
          }
        }
      }

      values.push(
        SATURATED_BENCHMARK,
        SUFFICIENT_BENCHMARK
      );

      return values;
    }

    function deriveStateScale(
      stateCode
    ) {
      const values =
        valuesForState(
          stateCode
        ).filter(
          Number.isFinite
        );

      if (!values.length) {
        return {
          min: 4000,
          max: 11000,
          step: 1000,
          intervals: 7
        };
      }

      /*
       * Fit each state to its actual coverage range rather than forcing the
       * Y-axis to start at zero. Both benchmark lines are already included
       * in valuesForState(), so they remain visible while the MMM trends use
       * substantially more of the available vertical plotting area.
       */
      const lowest =
        Math.min(...values);

      const highest =
        Math.max(...values);

      const span =
        Math.max(
          1,
          highest - lowest
        );

      // Aim for about 6–8 major intervals. This gives useful detail without
      // crowding the compact PFF graph.
      let step =
        niceStep(
          span / 7
        );

      let minimum =
        Math.max(
          0,
          Math.floor(
            lowest / step
          ) * step
        );

      let maximum =
        Math.ceil(
          highest / step
        ) * step;

      // Give a real data series a little room below it if it falls beneath
      // the 1:5k benchmark. Do not waste a whole interval below 5k merely to
      // pad the benchmark itself.
      if (
        lowest <
          SATURATED_BENCHMARK &&
        lowest - minimum <
          step * 0.28 &&
        minimum - step >= 0
      ) {
        minimum -= step;
      }

      // Keep the uppermost line/benchmark away from the top edge when it sits
      // close to the final tick.
      if (
        maximum - highest <
        step * 0.35
      ) {
        maximum += step;
      }

      let intervals =
        Math.round(
          (maximum - minimum) /
            step
        );

      // Avoid an overly busy Y-axis for an unusually wide state range.
      while (intervals > 8) {
        step =
          nextNiceStep(step);

        minimum =
          Math.max(
            0,
            Math.floor(
              lowest / step
            ) * step
          );

        maximum =
          Math.ceil(
            highest / step
          ) * step;

        if (
          maximum - highest <
          step * 0.35
        ) {
          maximum += step;
        }

        intervals =
          Math.round(
            (maximum - minimum) /
              step
          );
      }

      // Preserve enough labelled levels for the chart to read naturally.
      while (intervals < 5) {
        maximum += step;
        intervals += 1;
      }

      return {
        min: minimum,
        max: maximum,
        step,
        intervals
      };
    }

    function buildYScales() {
      for (
        const stateCode of
        ALL_STATES
      ) {
        state.yScales[
          stateCode
        ] =
          deriveStateScale(
            stateCode
          );
      }
    }

    function yScaleForState(
      stateCode =
        state.activeState
    ) {
      return (
        state.yScales[
          stateCode
        ] || {
          min: 0,
          max: 10000,
          step: 2000,
          intervals: 5
        }
      );
    }

    function yTickTargets(
      stateCode =
        state.activeState
    ) {
      const scale =
        yScaleForState(
          stateCode
        );

      return Array.from(
        {
          length:
            scale.intervals + 1
        },
        (_, index) =>
          scale.min +
          scale.step *
          index
      );
    }

    // ============================================================
    // UNIFIED Y-AXIS TRANSITION
    //
    // One animation clock drives the Y-axis numbers, tick marks,
    // horizontal guides and benchmark positions. When a state's scale
    // changes, labels count up/down while the markings slide to their new
    // locations. If the scale is unchanged, the axis remains completely
    // static.
    // ============================================================

    function copyScale(scale) {
      const intervals =
        Math.max(
          1,
          Math.round(
            Number(scale?.intervals) || 1
          )
        );

      const minimum =
        Number(scale?.min);

      const maximum =
        Number(scale?.max);

      const min =
        Number.isFinite(minimum)
          ? minimum
          : 0;

      const max =
        Number.isFinite(maximum) &&
        maximum > min
          ? maximum
          : min + 1;

      return {
        min,
        max,
        intervals,
        step:
          (max - min) /
          intervals
      };
    }

    function scalesNearlyEqual(
      first,
      second,
      tolerance = 1e-9
    ) {
      if (!first || !second) {
        return false;
      }

      return (
        Math.abs(
          Number(first.min) -
          Number(second.min)
        ) <= tolerance &&
        Math.abs(
          Number(first.max) -
          Number(second.max)
        ) <= tolerance &&
        Math.round(
          Number(first.intervals)
        ) ===
          Math.round(
            Number(second.intervals)
          )
      );
    }

    function easeOutQuart(value) {
      return 1 - Math.pow(1 - value, 4);
    }

    function majorTickDefinitions(scale) {
      const current =
        copyScale(scale);

      return Array.from(
        {
          length:
            current.intervals + 1
        },
        (_, index) => ({
          value:
            current.min +
            current.step * index,
          ratio:
            index /
            current.intervals
        })
      );
    }

    function minorTickDefinitions(scale) {
      const current =
        copyScale(scale);

      return Array.from(
        {
          length:
            current.intervals
        },
        (_, index) => ({
          value:
            current.min +
            current.step *
              (index + 0.5),
          ratio:
            (index + 0.5) /
            current.intervals
        })
      );
    }

    function nearestDefinition(
      definitions,
      ratio
    ) {
      if (!definitions.length) {
        return {
          value: 0,
          ratio: 0
        };
      }

      let best =
        definitions[0];

      let bestDistance =
        Math.abs(
          best.ratio - ratio
        );

      for (
        let index = 1;
        index < definitions.length;
        index += 1
      ) {
        const candidate =
          definitions[index];

        const distance =
          Math.abs(
            candidate.ratio - ratio
          );

        if (distance < bestDistance) {
          best = candidate;
          bestDistance = distance;
        }
      }

      return best;
    }

    function buildAxisTracks(
      fromDefinitions,
      toDefinitions
    ) {
      const from =
        [...fromDefinitions];

      const to =
        [...toDefinitions];

      if (!from.length && !to.length) {
        return [];
      }

      if (!from.length) {
        return to.map(
          target => ({
            fromValue: target.value,
            toValue: target.value,
            fromRatio: target.ratio,
            toRatio: target.ratio,
            fromAlpha: 0,
            toAlpha: 1
          })
        );
      }

      if (!to.length) {
        return from.map(
          source => ({
            fromValue: source.value,
            toValue: source.value,
            fromRatio: source.ratio,
            toRatio: source.ratio,
            fromAlpha: 1,
            toAlpha: 0
          })
        );
      }

      const pairedCount =
        Math.min(
          from.length,
          to.length
        );

      const usedFrom =
        new Set();

      const usedTo =
        new Set();

      const tracks = [];

      for (
        let pairIndex = 0;
        pairIndex < pairedCount;
        pairIndex += 1
      ) {
        const fromIndex =
          pairedCount === 1
            ? 0
            : Math.round(
                pairIndex *
                (from.length - 1) /
                (pairedCount - 1)
              );

        const toIndex =
          pairedCount === 1
            ? 0
            : Math.round(
                pairIndex *
                (to.length - 1) /
                (pairedCount - 1)
              );

        if (
          usedFrom.has(fromIndex) ||
          usedTo.has(toIndex)
        ) {
          continue;
        }

        const source =
          from[fromIndex];

        const target =
          to[toIndex];

        usedFrom.add(fromIndex);
        usedTo.add(toIndex);

        tracks.push({
          fromValue: source.value,
          toValue: target.value,
          fromRatio: source.ratio,
          toRatio: target.ratio,
          fromAlpha: 1,
          toAlpha: 1
        });
      }

      from.forEach(
        (source, index) => {
          if (usedFrom.has(index)) {
            return;
          }

          const target =
            nearestDefinition(
              to,
              source.ratio
            );

          tracks.push({
            fromValue: source.value,
            toValue: target.value,
            fromRatio: source.ratio,
            toRatio: target.ratio,
            fromAlpha: 1,
            toAlpha: 0
          });
        }
      );

      to.forEach(
        (target, index) => {
          if (usedTo.has(index)) {
            return;
          }

          const source =
            nearestDefinition(
              from,
              target.ratio
            );

          tracks.push({
            fromValue: source.value,
            toValue: target.value,
            fromRatio: source.ratio,
            toRatio: target.ratio,
            fromAlpha: 0,
            toAlpha: 1
          });
        }
      );

      return tracks.sort(
        (first, second) =>
          first.toRatio -
          second.toRatio
      );
    }

    function interpolateAxisTrack(
      track,
      progress
    ) {
      return {
        value:
          track.fromValue +
          (
            track.toValue -
            track.fromValue
          ) * progress,
        ratio:
          track.fromRatio +
          (
            track.toRatio -
            track.fromRatio
          ) * progress,
        alpha:
          track.fromAlpha +
          (
            track.toAlpha -
            track.fromAlpha
          ) * progress
      };
    }

    const yAxisTransition = {
      raf: null,
      token: 0,
      progress: 1,
      fromScale: null,
      toScale: null,
      currentScale: null,
      majorTracks: [],
      minorTracks: []
    };

    function cancelYAxisTransition() {
      if (yAxisTransition.raf) {
        cancelAnimationFrame(
          yAxisTransition.raf
        );

        yAxisTransition.raf = null;
      }

      ++yAxisTransition.token;
    }

    function setYAxisTransitionImmediately(
      stateCode =
        state.activeState
    ) {
      cancelYAxisTransition();

      const scale =
        copyScale(
          yScaleForState(
            stateCode
          )
        );

      yAxisTransition.progress = 1;
      yAxisTransition.fromScale =
        scale;
      yAxisTransition.toScale =
        scale;
      yAxisTransition.currentScale =
        scale;
      yAxisTransition.majorTracks =
        buildAxisTracks(
          majorTickDefinitions(scale),
          majorTickDefinitions(scale)
        );
      yAxisTransition.minorTracks =
        buildAxisTracks(
          minorTickDefinitions(scale),
          minorTickDefinitions(scale)
        );
    }

    function currentYAxisScale() {
      return copyScale(
        yAxisTransition.currentScale ||
        yScaleForState()
      );
    }

    function currentMajorAxisTracks() {
      const progress =
        clamp(
          yAxisTransition.progress,
          0,
          1
        );

      const tracks =
        yAxisTransition.majorTracks.length
          ? yAxisTransition.majorTracks
          : buildAxisTracks(
              majorTickDefinitions(
                yScaleForState()
              ),
              majorTickDefinitions(
                yScaleForState()
              )
            );

      return tracks.map(
        track =>
          interpolateAxisTrack(
            track,
            progress
          )
      );
    }

    function currentMinorAxisTracks() {
      const progress =
        clamp(
          yAxisTransition.progress,
          0,
          1
        );

      const tracks =
        yAxisTransition.minorTracks.length
          ? yAxisTransition.minorTracks
          : buildAxisTracks(
              minorTickDefinitions(
                yScaleForState()
              ),
              minorTickDefinitions(
                yScaleForState()
              )
            );

      return tracks.map(
        track =>
          interpolateAxisTrack(
            track,
            progress
          )
      );
    }

    function animateYAxisTransition(
      fromScale,
      toScale,
      duration = 720
    ) {
      cancelYAxisTransition();

      const from =
        copyScale(fromScale);

      const to =
        copyScale(toScale);

      if (
        reducedMotion() ||
        duration <= 0 ||
        scalesNearlyEqual(from, to)
      ) {
        setYAxisTransitionImmediately();
        chart?.draw();
        return;
      }

      const token =
        ++yAxisTransition.token;

      yAxisTransition.progress = 0;
      yAxisTransition.fromScale =
        from;
      yAxisTransition.toScale =
        to;
      yAxisTransition.currentScale =
        from;
      yAxisTransition.majorTracks =
        buildAxisTracks(
          majorTickDefinitions(from),
          majorTickDefinitions(to)
        );
      yAxisTransition.minorTracks =
        buildAxisTracks(
          minorTickDefinitions(from),
          minorTickDefinitions(to)
        );

      const startedAt =
        performance.now();

      const frame = now => {
        if (
          token !==
          yAxisTransition.token
        ) {
          return;
        }

        const raw =
          clamp(
            (now - startedAt) /
            duration,
            0,
            1
          );

        const progress =
          easeOutQuart(raw);

        const min =
          from.min +
          (to.min - from.min) *
          progress;

        const max =
          from.max +
          (to.max - from.max) *
          progress;

        const intervals =
          progress < 0.5
            ? from.intervals
            : to.intervals;

        yAxisTransition.progress =
          progress;

        yAxisTransition.currentScale = {
          min,
          max,
          intervals,
          step:
            (max - min) /
            Math.max(1, intervals)
        };

        chart?.draw();

        if (raw < 1) {
          yAxisTransition.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          yAxisTransition.raf =
            null;
          yAxisTransition.progress =
            1;
          yAxisTransition.fromScale =
            to;
          yAxisTransition.toScale =
            to;
          yAxisTransition.currentScale =
            to;
          yAxisTransition.majorTracks =
            buildAxisTracks(
              majorTickDefinitions(to),
              majorTickDefinitions(to)
            );
          yAxisTransition.minorTracks =
            buildAxisTracks(
              minorTickDefinitions(to),
              minorTickDefinitions(to)
            );

          chart?.draw();
        }
      };

      yAxisTransition.raf =
        requestAnimationFrame(
          frame
        );
    }

    function benchmarkRatiosForScale(
      scale =
        currentYAxisScale()
    ) {
      const current =
        copyScale(scale);

      const span =
        Math.max(
          1e-9,
          current.max -
          current.min
        );

      return [
        clamp(
          (
            SUFFICIENT_BENCHMARK -
            current.min
          ) / span,
          0,
          1
        ),
        clamp(
          (
            SATURATED_BENCHMARK -
            current.min
          ) / span,
          0,
          1
        )
      ];
    }

    // ============================================================
    // LEGEND
    // ============================================================

    function legendItemsForState(
      stateCode =
        state.activeState
    ) {
      return mmmsForState(
        stateCode
      ).map(
        mmm => ({
          mmm,
          label: `MM${mmm}`,
          colour:
            MMM_COLOURS[mmm]
        })
      );
    }

    function createLegendItem(
      item
    ) {
      const row =
        document.createElement(
          'span'
        );

      row.className =
        'legend-item';

      row.dataset.mmm =
        String(item.mmm);

      const line =
        document.createElement(
          'span'
        );

      line.className =
        'legend-line';

      line.style.background =
        item.colour;

      const text =
        document.createElement(
          'span'
        );

      text.textContent =
        item.label;

      row.append(
        line,
        text
      );

      return row;
    }

    function renderLegendContents(
      items
    ) {
      chartLegend.textContent = '';

      for (
        const item of
        items
      ) {
        chartLegend.appendChild(
          createLegendItem(item)
        );
      }
    }

    function updateLegend(
      animate = true
    ) {
      const items =
        legendItemsForState();

      const existing =
        new Map(
          Array.from(
            chartLegend.querySelectorAll(
              '.legend-item[data-mmm]'
            )
          ).map(
            element => [
              Number(
                element.dataset.mmm
              ),
              element
            ]
          )
        );

      const nextMMMs =
        new Set(
          items.map(
            item => item.mmm
          )
        );

      // Cancel only animations belonging to items that are actually changing.
      // Retained MM entries are reused as the same DOM nodes, so they remain
      // completely static between tabs instead of fading out and back in.
      for (
        const [mmm, element] of
        existing
      ) {
        if (!nextMMMs.has(mmm)) {
          element.getAnimations?.().forEach(
            animation => animation.cancel()
          );
          element.remove();
          existing.delete(mmm);
        }
      }

      const fragment =
        document.createDocumentFragment();

      const added = [];

      for (
        const item of
        items
      ) {
        let element =
          existing.get(
            item.mmm
          );

        if (!element) {
          element =
            createLegendItem(
              item
            );

          added.push(
            element
          );
        }

        fragment.appendChild(
          element
        );
      }

      chartLegend.appendChild(
        fragment
      );

      chartLegend.scrollLeft = 0;

      if (
        animate &&
        !reducedMotion()
      ) {
        for (
          const element of
          added
        ) {
          element.animate?.(
            [
              {
                opacity: 0,
                transform:
                  'translateX(5px)'
              },
              {
                opacity: 1,
                transform:
                  'translateX(0)'
              }
            ],
            {
              duration: 260,
              easing:
                'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );
        }
      }

      requestAnimationFrame(
        updateLegendScrollControls
      );
    }

    function updateLegendScrollControls() {
      const maxScroll =
        Math.max(
          0,
          chartLegend.scrollWidth -
            legendViewport.clientWidth
        );

      const left =
        chartLegend.scrollLeft;

      legendScrollLeft.classList.toggle(
        'is-hidden',
        left <= 2
      );

      legendScrollRight.classList.toggle(
        'is-hidden',
        left >= maxScroll - 2 ||
        maxScroll <= 2
      );
    }

    legendScrollLeft.addEventListener(
      'click',
      () => {
        chartLegend.scrollBy({
          left:
            -Math.max(
              120,
              legendViewport.clientWidth *
                0.65
            ),
          behavior: 'smooth'
        });
      }
    );

    legendScrollRight.addEventListener(
      'click',
      () => {
        chartLegend.scrollBy({
          left:
            Math.max(
              120,
              legendViewport.clientWidth *
                0.65
            ),
          behavior: 'smooth'
        });
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive: true
      }
    );

    // ============================================================
    // STATE TAB BEHAVIOUR
    // ============================================================

    function positionStateTabIndicator(
      animate = true
    ) {
      const activeTab =
        stateTabs.find(
          tab =>
            tab.classList.contains(
              'is-active'
            )
        );

      if (
        !activeTab ||
        !stateTabList
      ) {
        return;
      }

      if (!animate) {
        stateTabList.classList.add(
          'is-positioning'
        );
      }

      const listRect =
        stateTabList.getBoundingClientRect();

      const tabRect =
        activeTab.getBoundingClientRect();

      const x =
        tabRect.left -
        listRect.left +
        stateTabList.scrollLeft;

      stateTabList.style.setProperty(
        '--tab-indicator-x',
        `${x}px`
      );

      stateTabList.style.setProperty(
        '--tab-indicator-width',
        `${tabRect.width}px`
      );

      if (!animate) {
        requestAnimationFrame(
          () =>
            requestAnimationFrame(
              () =>
                stateTabList.classList.remove(
                  'is-positioning'
                )
            )
        );
      }
    }

    function syncStateTabs(
      animate = true
    ) {
      stateTabs.forEach(
        tab => {
          const active =
            tab.dataset.state ===
            state.activeState;

          tab.classList.toggle(
            'is-active',
            active
          );

          tab.setAttribute(
            'aria-selected',
            active
              ? 'true'
              : 'false'
          );

          if (
            active &&
            tab.scrollIntoView
          ) {
            tab.scrollIntoView({
              behavior:
                animate
                  ? 'smooth'
                  : 'auto',
              block: 'nearest',
              inline: 'nearest'
            });
          }
        }
      );

      requestAnimationFrame(
        () => {
          positionStateTabIndicator(
            animate
          );

          updateTabScrollState();
        }
      );
    }

    function updateTabScrollState() {
      const maxScroll =
        Math.max(
          0,
          stateTabList.scrollWidth -
            stateTabList.clientWidth
        );

      tabScrollShell.classList.toggle(
        'can-scroll-left',
        stateTabList.scrollLeft > 2
      );

      tabScrollShell.classList.toggle(
        'can-scroll-right',
        stateTabList.scrollLeft <
          maxScroll - 2
      );
    }

    stateTabList.addEventListener(
      'scroll',
      updateTabScrollState,
      {
        passive: true
      }
    );

    tabScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        stateTabList.scrollBy({
          left:
            -Math.max(
              80,
              stateTabList.clientWidth * 0.72
            ),
          behavior: 'smooth'
        });
      }
    );

    tabScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        stateTabList.scrollBy({
          left:
            Math.max(
              80,
              stateTabList.clientWidth * 0.72
            ),
          behavior: 'smooth'
        });
      }
    );

    if ('ResizeObserver' in window) {
      const tabResizeObserver =
        new ResizeObserver(
          updateTabScrollState
        );

      tabResizeObserver.observe(
        tabScrollShell
      );
    }

    requestAnimationFrame(
      updateTabScrollState
    );

    stateTabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => {
            const nextState =
              tab.dataset.state;

            if (
              !ALL_STATES.includes(
                nextState
              ) ||
              nextState ===
                state.activeState
            ) {
              return;
            }

            // If the user switches again during a transition, start the
            // next move from the scale that is actually visible on screen.
            const previousScale =
              currentYAxisScale();

            state.activeState =
              nextState;

            syncStateTabs(true);

            renderChart(
              'state',
              previousScale
            );
          }
        );
      }
    );

    // ============================================================
    // CHART DATASETS
    // ============================================================

    function datasetForMMM(
      mmm
    ) {
      const exists =
        mmmsForState(
          state.activeState
        ).includes(
          mmm
        );

      const data =
        state.years.map(
          year =>
            exists
              ? coverageFor(
                  year,
                  state.activeState,
                  mmm
                )
              : null
        );

      return {
        label:
          `MM${mmm}`,

        data,

        borderColor:
          MMM_COLOURS[mmm],

        backgroundColor:
          MMM_COLOURS[mmm],

        borderWidth: 3,
        borderCapStyle: 'round',
        borderJoinStyle: 'round',
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHitRadius: 5,
        pointBorderColor: '#fff',
        pointBorderWidth: 1,
        pointBackgroundColor:
          MMM_COLOURS[mmm],

        tension: 0.28,
        cubicInterpolationMode:
          'monotone',

        spanGaps: false,
        fill: false,

        _mmm: mmm,
        _existsForActiveState:
          exists
      };
    }

    function buildDatasets() {
      return MMM_NUMBERS.map(
        datasetForMMM
      );
    }

    // ============================================================
    // CUSTOM CHART PLUGINS
    // ============================================================

    const pffAxesPlugin = {
      id: 'pffAxesPlugin',

      beforeDatasetsDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const majorTracks =
          currentMajorAxisTracks();

        const minorTracks =
          currentMinorAxisTracks();

        ctx.save();

        // Major horizontal guides slide with their Y-axis markings.
        for (
          const track of
          majorTracks
        ) {
          if (
            track.alpha <= 0.001 ||
            track.ratio <= 0.001
          ) {
            continue;
          }

          const y =
            chartArea.bottom -
            chartArea.height *
              track.ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );

          ctx.globalAlpha =
            clamp(
              track.alpha,
              0,
              1
            );

          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.075)';

          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // Minor guides use the same transition clock as the major ticks.
        for (
          const track of
          minorTracks
        ) {
          if (
            track.alpha <= 0.001
          ) {
            continue;
          }

          const y =
            chartArea.bottom -
            chartArea.height *
              track.ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );

          ctx.globalAlpha =
            clamp(
              track.alpha,
              0,
              1
            );

          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.035)';

          ctx.lineWidth = 0.7;
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea,
          scales
        } =
          chartInstance;

        if (
          !chartArea ||
          !scales?.x
        ) {
          return;
        }

        const mobile =
          window.innerWidth <= 430;

        const majorTracks =
          currentMajorAxisTracks();

        const minorTracks =
          currentMinorAxisTracks();

        ctx.save();

        ctx.lineCap =
          'butt';

        ctx.strokeStyle =
          '#151515';

        ctx.lineWidth = 1;

        ctx.fillStyle =
          '#151515';

        ctx.textAlign =
          'right';

        ctx.textBaseline =
          'middle';

        ctx.font =
          `${mobile ? 9 : 10}px Lato, sans-serif`;

        // Each major tick uses one interpolated position and one interpolated
        // value, so the mark slides while its label counts in the same frame.
        for (
          const track of
          majorTracks
        ) {
          if (
            track.alpha <= 0.001
          ) {
            continue;
          }

          const y =
            chartArea.bottom -
            chartArea.height *
              track.ratio;

          ctx.globalAlpha =
            clamp(
              track.alpha,
              0,
              1
            );

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 5,
            Math.round(y) + 0.5
          );
          ctx.stroke();

          ctx.fillText(
            formatInteger(
              track.value
            ),
            chartArea.left - 8,
            y
          );
        }

        // Minor Y ticks slide/fade with the same unified transition.
        ctx.strokeStyle =
          '#69718a';

        ctx.lineWidth = 1;

        for (
          const track of
          minorTracks
        ) {
          if (
            track.alpha <= 0.001
          ) {
            continue;
          }

          const y =
            chartArea.bottom -
            chartArea.height *
              track.ratio;

          ctx.globalAlpha =
            0.60 *
            clamp(
              track.alpha,
              0,
              1
            );

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 2,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        // X-axis tick marks for every year; even years are major.
        ctx.globalAlpha = 1;

        for (
          let index = 0;
          index <
            state.years.length;
          index += 1
        ) {
          const year =
            Number(
              state.years[index]
            );

          const x =
            scales.x.getPixelForTick(
              index
            );

          if (
            !Number.isFinite(x)
          ) {
            continue;
          }

          const major =
            Number.isFinite(year) &&
            year % 2 === 0;

          ctx.strokeStyle =
            major
              ? '#151515'
              : '#69718a';

          ctx.globalAlpha =
            major
              ? 1
              : 0.60;

          ctx.lineWidth =
            major
              ? 1
              : 0.7;

          ctx.beginPath();
          ctx.moveTo(
            Math.round(x) + 0.5,
            chartArea.bottom
          );
          ctx.lineTo(
            Math.round(x) + 0.5,
            chartArea.bottom +
              (
                major
                  ? 5
                  : 2
              )
          );
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    const coverageBenchmarksPlugin = {
      id: 'coverageBenchmarksPlugin',

      beforeDatasetsDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const benchmarks = [
          {
            value:
              SUFFICIENT_BENCHMARK,
            colour:
              SUFFICIENT_COLOUR
          },
          {
            value:
              SATURATED_BENCHMARK,
            colour:
              SATURATED_COLOUR
          }
        ];

        const ratios =
          benchmarkRatiosForScale(
            currentYAxisScale()
          );

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineWidth = 2.2;
        ctx.setLineDash([1, 4]);

        benchmarks.forEach(
          (benchmark, index) => {
            const ratio =
              clamp(
                Number(
                  ratios[index]
                ),
                0,
                1
              );

            const y =
              chartArea.bottom -
              chartArea.height *
                ratio;

            ctx.strokeStyle =
              benchmark.colour;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              y
            );
            ctx.lineTo(
              chartArea.right,
              y
            );
            ctx.stroke();
          }
        );

        ctx.restore();
      }
    };

    const axisSpinesPlugin = {
      id: 'axisSpinesPlugin',

      afterDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        ctx.save();

        ctx.strokeStyle =
          '#151515';

        ctx.lineWidth =
          1.1;

        ctx.beginPath();
        ctx.moveTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(
          chartArea.left,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.lineTo(
          chartArea.right,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.stroke();

        ctx.restore();
      }
    };

    Chart.register(
      pffAxesPlugin,
      coverageBenchmarksPlugin,
      axisSpinesPlugin
    );

    // ============================================================
    // CHART OPTIONS + TRANSITIONS
    // ============================================================

    function chartAnimationDuration(
      reason
    ) {
      if (reducedMotion()) {
        return 0;
      }

      switch (reason) {
        case 'state':
          return 720;

        case 'initial':
          return 760;

        default:
          return 520;
      }
    }

    function tooltipLabel(
      context
    ) {
      const mmm =
        context.dataset._mmm;

      const year =
        Number(
          state.years[
            context.dataIndex
          ]
        );

      const rawIndex =
        rawIndexFor(
          state.activeState,
          mmm
        );

      const coverage =
        Number(
          context.raw
        );

      const fte =
        rawIndex >= 0
          ? fteFor(
              year,
              rawIndex
            )
          : null;

      const population =
        rawIndex >= 0
          ? populationFor(
              year,
              rawIndex
            )
          : null;

      const count =
        rawIndex >= 0
          ? Number(
              state.clinicianCountByYear?.[
                year
              ]?.[
                rawIndex
              ]
            )
          : null;

      const hours =
        rawIndex >= 0
          ? Number(
              state.weeklyHoursByYear?.[
                year
              ]?.[
                rawIndex
              ]
            )
          : null;

      const lines = [
        `${state.activeState} · MM${mmm}`,
        `${formatInteger(coverage)} people per FTE clinician`
      ];

      if (
        Number.isFinite(fte) &&
        Number.isFinite(population)
      ) {
        lines.push(
          `${formatOneDecimal(fte)} FTE · ${formatInteger(population)} people`
        );
      }

      if (
        Number.isFinite(count) &&
        Number.isFinite(hours)
      ) {
        lines.push(
          `${formatInteger(count)} clinicians · ${formatOneDecimal(hours)} h/wk`
        );
      }

      return lines;
    }

    function baseChartOptions() {
      const mobile =
        window.innerWidth <= 430;

      const scaleDef =
        yScaleForState();

      return {
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 0,

        devicePixelRatio:
          Math.min(
            window.devicePixelRatio ||
              1,
            2
          ),

        animation: {
          duration: 760,
          easing:
            'easeOutQuart'
        },

        animations: {
          x: {
            // Years/x positions are identical between state tabs.
            duration: 0
          },
          y: {
            duration: 760,
            easing:
              'easeOutQuart'
          }
        },

        interaction: {
          mode: 'nearest',
          intersect: true,
          axis: 'xy'
        },

        layout: {
          autoPadding: true,
          padding: {
            // Extra top room prevents the highest custom Y-axis value
            // from being visually clipped.
            top:
              mobile
                ? 16
                : 18,
            right: 3,
            bottom: 0,
            left: 0
          }
        },

        plugins: {
          legend: {
            display: false
          },

          tooltip: {
            displayColors: true,
            backgroundColor:
              'rgba(21, 21, 21, 0.94)',
            titleColor:
              '#ffffff',
            bodyColor:
              '#ffffff',
            borderColor:
              'rgba(255,255,255,0.10)',
            borderWidth: 1,
            padding: 9,
            cornerRadius: 4,

            titleFont: {
              family: 'Lato',
              size: 11,
              weight: '700'
            },

            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },

            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      items[0].label
                    )
                  : '';
              },

              label:
                tooltipLabel
            }
          }
        },

        scales: {
          x: {
            type: 'category',
            offset: false,

            grid: {
              drawOnChartArea:
                false,
              drawTicks: false
            },

            border: {
              display: false
            },

            ticks: {
              color: '#151515',
              padding: 7,
              maxRotation: 0,
              minRotation: 0,
              autoSkip: false,

              font: {
                family: 'Lato',
                size:
                  mobile
                    ? 9
                    : 10,
                weight: '400'
              },

              callback(
                value,
                index
              ) {
                const year =
                  Number(
                    state.years[
                      index
                    ]
                  );

                return (
                  Number.isFinite(
                    year
                  ) &&
                  year % 2 === 0
                )
                  ? String(year)
                  : '';
              }
            },

            title: {
              display: true,
              text: 'Year',
              color: '#151515',
              padding: {
                top: 3
              },

              font: {
                family: 'Lato',
                size:
                  mobile
                    ? 12
                    : 13,
                weight: '700'
              }
            }
          },

          y: {
            min:
              scaleDef.min,

            max:
              scaleDef.max,

            afterFit(scale) {
              scale.width =
                mobile
                  ? 61
                  : 69;
            },

            grid: {
              drawOnChartArea:
                false,
              drawTicks: false
            },

            border: {
              display: false
            },

            ticks: {
              display: false,
              stepSize:
                scaleDef.step
            },

            title: {
              display: true,
              text:
                'People per FTE clinician',
              color: '#151515',
              padding: {
                bottom: 4
              },

              font: {
                family: 'Lato',
                size:
                  mobile
                    ? 12
                    : 13,
                weight: '700'
              }
            }
          }
        }
      };
    }

    function createChart() {
      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type: 'line',

            data: {
              labels:
                state.years,
              datasets:
                buildDatasets()
            },

            options:
              baseChartOptions()
          }
        );
    }

    function syncChartScale() {
      if (!chart) {
        return;
      }

      const scaleDef =
        yScaleForState();

      chart.options.scales.y.min =
        scaleDef.min;

      chart.options.scales.y.max =
        scaleDef.max;

      chart.options.scales.y.ticks.stepSize =
        scaleDef.step;
    }

    function syncChartDatasets() {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets();

      nextDatasets.forEach(
        (
          nextDataset,
          index
        ) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] =
              nextDataset;

            return;
          }

          Object.assign(
            current,
            nextDataset
          );
        }
      );

      chart.data.datasets.length =
        nextDatasets.length;
    }

    function renderChart(
      reason = 'state',
      previousScale = null
    ) {
      if (!chart) {
        return;
      }

      const duration =
        chartAnimationDuration(
          reason
        );

      const oldScale =
        previousScale
          ? copyScale(
              previousScale
            )
          : currentYAxisScale();

      const nextScale =
        copyScale(
          yScaleForState()
        );

      syncChartScale();
      syncChartDatasets();

      chart.options.animation.duration =
        duration;

      // The year positions never change between state tabs, so there is no
      // reason to animate the X dimension. Only values that actually change
      // are animated.
      chart.options.animations.x.duration =
        0;

      chart.options.animations.y.duration =
        duration;

      chart.update();

      // One RAF transition controls Y-axis values, positions, markings,
      // horizontal guides and benchmark placement. It shares the graph's
      // duration/easing, so the whole state change reads as one movement.
      if (
        scalesNearlyEqual(
          oldScale,
          nextScale
        )
      ) {
        setYAxisTransitionImmediately();
      } else {
        animateYAxisTransition(
          oldScale,
          nextScale,
          duration
        );
      }

      updateLegend(
        reason !== 'initial'
      );
    }

    // ============================================================
    // SOURCE STATUS
    // ============================================================

    function updateSourceStatus() {
      if (
        state.sourceState ===
        'cached'
      ) {
        liveData.classList.add(
          'is-cached'
        );

        const when =
          state.savedAt
            ? new Date(
                state.savedAt
              ).toLocaleString(
                'en-AU',
                {
                  day: 'numeric',
                  month: 'short',
                  hour: 'numeric',
                  minute: '2-digit'
                }
              )
            : '';

        liveDataText.textContent =
          when
            ? `CACHED data · ${when}`
            : 'CACHED data';
      } else {
        liveData.classList.remove(
          'is-cached'
        );

        liveDataText.textContent =
          'LIVE data';
      }
    }

    // ============================================================
    // RESPONSIVE
    // ============================================================

    window.addEventListener(
      'resize',
      () => {
        if (
          resizeFrame !== null
        ) {
          cancelAnimationFrame(
            resizeFrame
          );
        }

        resizeFrame =
          requestAnimationFrame(
            () => {
              resizeFrame = null;

              updateLegendScrollControls();
              updateTabScrollState();
              positionStateTabIndicator(
                false
              );

              if (!chart) {
                return;
              }

              chart.options =
                baseChartOptions();

              setYAxisTransitionImmediately();

              chart.update('none');
            }
          );
      }
    );

    if (
      'ResizeObserver' in
      window
    ) {
      const legendResizeObserver =
        new ResizeObserver(
          updateLegendScrollControls
        );

      legendResizeObserver.observe(
        legendViewport
      );

      legendResizeObserver.observe(
        chartLegend
      );

      const tabResizeObserver =
        new ResizeObserver(
          () => {
            updateTabScrollState();

            positionStateTabIndicator(
              false
            );
          }
        );

      tabResizeObserver.observe(
        stateTabList
      );
    }

    // ============================================================
    // START
    // ============================================================

    async function init() {
      syncStateTabs(false);

      try {
        await loadData();

        state.years =
          commonYears();

        if (
          !state.years.length
        ) {
          throw new Error(
            'No years were common to the raw clinician and population data.'
          );
        }

        buildYScales();

        setYAxisTransitionImmediately(
          state.activeState
        );

        updateSourceStatus();
        updateLegend(false);
        createChart();

        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );

        requestAnimationFrame(
          () => {
            updateLegendScrollControls();
            updateTabScrollState();
            positionStateTabIndicator(
              false
            );
          }
        );
      } catch (error) {
        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );

        updateSourceStatus();

        statusEl.textContent =
          error?.message ||
          'Could not load population coverage data.';
      }
    }

    init();
  </script>
</body>
</html>
