<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Population Coverage MMM Trends</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js"></script>

  <style>
    :root {
      --pff-saturated: #ff00ff;
      --pff-sufficient: #20c9d7;
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .benchmark-legend {
      position: absolute;
      top: 8px;
      right: 5px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 4px 6px;
      color: var(--pff-muted);
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(105, 113, 138, 0.14);
      border-radius: 4px;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .benchmark-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .benchmark-legend-line {
      width: 17px;
      height: 0;
      flex: 0 0 17px;
      border-top: 2px dotted var(--pff-saturated);
    }

    .benchmark-legend-line.is-sufficient {
      border-top-color: var(--pff-sufficient);
    }

    .benchmark-legend-line.is-saturated {
      border-top-color: var(--pff-saturated);
    }

    @media (max-width: 430px) {
      .benchmark-legend {
        top: 7px;
        right: 3px;
        font-size: 8px;
      }
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading Population Coverage MMM Trends data"

        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading population coverage data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll state tabs left"
          >‹</button>

          <div
            id="stateTabs"
            class="tab-list"
            role="tablist"
            aria-label="State and territory population coverage"

            <button class="chart-tab is-active" type="button" role="tab" aria-selected="true" data-state="NSW">NSW</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="VIC">VIC</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="QLD">QLD</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="SA">SA</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="WA">WA</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="TAS">TAS</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="NT">NT</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="ACT">ACT</button>
          </div>

          <button
            id="tabScrollRight"

        <div id="liveData" class="live-data" aria-label="Live data" aria-live="polite">
          <span class="live-data-dot" aria-hidden="true"></span>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">

            id="headingScrollRight"

        <div class="heading-controls">
          <button

            <span class="yoy-binary-indicator" aria-hidden="true"></span>

      <div class="chart-options-row">
        <div class="legend-nav">

          <div id="legendViewport" class="legend-viewport">

          </div>

            type="button"
            aria-label="Scroll legend right"

      </div>

      <div id="chartShell" class="chart-shell">

            <span class="benchmark-legend-line is-sufficient" aria-hidden="true"></span>

          <span class="benchmark-legend-item">

        <canvas
          id="coverageChart"
          aria-label="Population coverage by Modified Monash Model category over time"
          role="img"
        ></canvas>

    </main>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      sheetId:
        '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE',

      clinicianSheet:
        'OptomsbystatebyMMM',

      clinicianRange:
        'A29:CC',

      populationSheet:
        'AuspopnbystatebyMMM',

      populationRange:
        'A29:AO',

      localCacheKey:
        'pff_state_mmm_coverage_raw_v1'
    });

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    // Reuse the existing Backend 1 raw State × MMM workforce snapshot.
    const CACHE_APP_KEY =
      'pff-state-mmm-workforce-v1';

    const COUNT_FIRST_INDEX =
      1;   // B

    const HOURS_FIRST_INDEX =
      41;  // AP

    const POPULATION_FIRST_INDEX =
      1;   // B

    const RAW_SERIES_COUNT =
      40;

    const FULL_TIME_HOURS =
      38;

    const SATURATED_BENCHMARK =
      5000;

    const SUFFICIENT_BENCHMARK =
      10000;

    const SATURATED_COLOUR =
      '#ff00ff';

    const SUFFICIENT_COLOUR =
      '#20c9d7';

    const ALL_STATES = [
      'NSW', 'VIC', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT'
    ];

    const SERIES_SCHEMA = [
      { state: 'NSW', mmm: 1 },
      { state: 'NSW', mmm: 2 },
      { state: 'NSW', mmm: 3 },
      { state: 'NSW', mmm: 4 },
      { state: 'NSW', mmm: 5 },
      { state: 'NSW', mmm: 6 },
      { state: 'NSW', mmm: 7 },

      { state: 'VIC', mmm: 1 },
      { state: 'VIC', mmm: 2 },
      { state: 'VIC', mmm: 3 },
      { state: 'VIC', mmm: 4 },
      { state: 'VIC', mmm: 5 },

      { state: 'QLD', mmm: 1 },
      { state: 'QLD', mmm: 2 },
      { state: 'QLD', mmm: 3 },
      { state: 'QLD', mmm: 4 },
      { state: 'QLD', mmm: 5 },
      { state: 'QLD', mmm: 6 },
      { state: 'QLD', mmm: 7 },

      { state: 'SA', mmm: 1 },
      { state: 'SA', mmm: 2 },
      { state: 'SA', mmm: 3 },
      { state: 'SA', mmm: 4 },
      { state: 'SA', mmm: 5 },
      { state: 'SA', mmm: 6 },
      { state: 'SA', mmm: 7 },

      { state: 'WA', mmm: 1 },
      { state: 'WA', mmm: 2 },
      { state: 'WA', mmm: 3 },
      { state: 'WA', mmm: 4 },
      { state: 'WA', mmm: 5 },
      { state: 'WA', mmm: 6 },
      { state: 'WA', mmm: 7 },

      { state: 'TAS', mmm: 2 },
      { state: 'TAS', mmm: 3 },
      { state: 'TAS', mmm: 5 },

      { state: 'NT', mmm: 2 },
      { state: 'NT', mmm: 6 },
      { state: 'NT', mmm: 7 },

      { state: 'ACT', mmm: 1 }
    ];

    const MMM_COLOURS = {
      1: '#2c3e50',
      2: '#4f1500',
      3: '#7e2800',
      4: '#a14216',
      5: '#c87452',
      6: '#e1b69a',
      7: '#f3e0d3'
    };

    const MMM_NUMBERS =
      [1, 2, 3, 4, 5, 6, 7];

    const app =
      document.getElementById('app');

    const statusEl =
      document.getElementById('status');

    const liveData =
      document.getElementById('liveData');

    const liveDataText =
      document.getElementById('liveDataText');

    const stateTabList =
      document.getElementById('stateTabs');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const stateTabs =
      Array.from(
        document.querySelectorAll('.chart-tab[data-state]')
      );

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartShell =
      document.getElementById('chartShell');

    const chartCanvas =
      document.getElementById('coverageChart');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const state = {
      clinicianCountByYear: {},
      weeklyHoursByYear: {},
      populationByYear: {},
      years: [],
      activeState: 'NSW',
      yScales: {},
      hiddenMMMs: new Set()
    };

    let chart =
      null;

    let chartSummary =
      null;

    let tabsController =
      null;

    let legendController =
      null;

    let headingScroller =
      null;


    let trendController =
      null;

    let interactionsController =
      null;

    let responsiveController =
      null;

    let unifiedYAxis =
      null;

    function rawIndexFor(
      stateCode,
      mmm
    ) {
      return SERIES_SCHEMA.findIndex(
        item =>
          item.state === stateCode &&
          item.mmm === mmm
      );
    }

    function mmmsForState(
      stateCode = state.activeState
    ) {
      return SERIES_SCHEMA
        .filter(
          item =>
            item.state === stateCode
        )
        .map(item => item.mmm);
    }

    function yearsIn(object) {
      return Object.keys(object)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function commonYears() {
      const counts =
        new Set(
          yearsIn(
            state.clinicianCountByYear
          )
        );

      const hours =
        new Set(
          yearsIn(
            state.weeklyHoursByYear
          )
        );

      return yearsIn(
        state.populationByYear
      ).filter(
        year =>
          counts.has(year) &&
          hours.has(year)
      );
    }

    function fteFor(
      year,
      rawIndex
    ) {
      const count =
        Number(
          state.clinicianCountByYear?.[
            year
          ]?.[
            rawIndex
          ]
        );

      const hours =
        Number(
          state.weeklyHoursByYear?.[
            year
          ]?.[
            rawIndex
          ]
        );

      if (
        !Number.isFinite(count) ||
        !Number.isFinite(hours) ||
        count <= 0 ||
        hours <= 0
      ) {
        return null;
      }

      const fte =
        count *
        hours /
        FULL_TIME_HOURS;

      return Number.isFinite(fte) &&
        fte > 0
          ? fte
          : null;
    }

    function populationFor(
      year,
      rawIndex
    ) {
      const population =
        Number(
          state.populationByYear?.[
            year
          ]?.[
            rawIndex
          ]
        );

      return Number.isFinite(population) &&
        population > 0
          ? population
          : null;
    }

    function coverageFor(
      year,
      stateCode,
      mmm
    ) {
      const rawIndex =
        rawIndexFor(
          stateCode,
          mmm
        );

      if (rawIndex < 0) {
        return null;
      }

      const fte =
        fteFor(
          year,
          rawIndex
        );

      const population =
        populationFor(
          year,
          rawIndex
        );

      if (
        !Number.isFinite(fte) ||
        !Number.isFinite(population) ||
        fte <= 0
      ) {
        return null;
      }

      const coverage =
        population / fte;

      return Number.isFinite(coverage) &&
        coverage > 0
          ? coverage
          : null;
    }

    function trendRows() {
      return state.years.map(
        year => ({ year })
      );
    }

    function latestAnnualisedGrowth(
      mmm
    ) {
      if (
        !trendController ||
        trendController.mode === 'off'
      ) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        trendRows(),
        row =>
          coverageFor(
            row.year,
            state.activeState,
            mmm
          ),
        trendController.windowSize
      );
    }

    function dataNumber(value) {
      if (
        value &&
        typeof value === 'object' &&
        (
          Object.prototype.hasOwnProperty.call(value, 'v') ||
          Object.prototype.hasOwnProperty.call(value, 'f')
        )
      ) {
        const direct =
          PFFCharts.numericCell(value);

        return Number.isFinite(direct)
          ? direct
          : null;
      }

      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {
        return null;
      }

      const cleaned =
        PFF.cleanText(value)
          .replace(/,/g, '')
          .replace(/[^0-9.+-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return null;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : null;
    }

    function yearValue(value) {
      const numeric =
        dataNumber(value);

      if (!Number.isFinite(numeric)) {
        return null;
      }

      const year =
        Math.round(numeric);

      return year >= 1900 && year <= 2200
        ? year
        : null;
    }

    function parseClinicianValues(getValue) {
      const counts =
        Array.from(
          { length: RAW_SERIES_COUNT },
          (_, index) =>
            dataNumber(
              getValue(
                COUNT_FIRST_INDEX +
                index
              )
            )
        );

      const hours =
        Array.from(
          { length: RAW_SERIES_COUNT },
          (_, index) =>
            dataNumber(
              getValue(
                HOURS_FIRST_INDEX +
                index
              )
            )
        );

      return {
        counts,
        hours
      };
    }

    function parsePopulationValues(getValue) {
      return Array.from(
        { length: RAW_SERIES_COUNT },
        (_, index) =>
          dataNumber(
            getValue(
              POPULATION_FIRST_INDEX +
              index
            )
          )
      );
    }

    function parseClinicianTable(table) {
      const counts = {};
      const hours = {};

      (table?.rows || []).forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const year =
            yearValue(cells[0]);

          if (!year) {
            return;
          }

          const parsed =
            parseClinicianValues(
              index => cells[index]
            );

          if (parsed.counts.some(Number.isFinite)) {
            counts[year] =
              parsed.counts;
          }

          if (parsed.hours.some(Number.isFinite)) {
            hours[year] =
              parsed.hours;
          }
        }
      );

      return {
        counts,
        hours
      };
    }

    function parsePopulationTable(table) {
      const population = {};

      (table?.rows || []).forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const year =
            yearValue(cells[0]);

          if (!year) {
            return;
          }

          const values =
            parsePopulationValues(
              index => cells[index]
            );

          if (values.some(Number.isFinite)) {
            population[year] =
              values;
          }
        }
      );

      return population;
    }

    function parseRemoteClinicianRows(sourceRows) {
      const counts = {};
      const hours = {};

      (Array.isArray(sourceRows) ? sourceRows : [])
        .forEach(row => {
          const year =
            yearValue(row?.[0]);

          if (!year) {
            return;
          }

          const parsed =
            parseClinicianValues(
              index => row?.[index]
            );

          if (parsed.counts.some(Number.isFinite)) {
            counts[year] =
              parsed.counts;
          }

          if (parsed.hours.some(Number.isFinite)) {
            hours[year] =
              parsed.hours;
          }
        });

      return {
        counts,
        hours
      };
    }

    function parseRemotePopulationRows(sourceRows) {
      const population = {};

      (Array.isArray(sourceRows) ? sourceRows : [])
        .forEach(row => {
          const year =
            yearValue(row?.[0]);

          if (!year) {
            return;
          }

          const values =
            parsePopulationValues(
              index => row?.[index]
            );

          if (values.some(Number.isFinite)) {
            population[year] =
              values;
          }
        });

      return population;
    }

    function normaliseSeries(values) {
      if (
        !Array.isArray(values) ||
        values.length < RAW_SERIES_COUNT
      ) {
        return null;
      }

      const normalised =
        values
          .slice(0, RAW_SERIES_COUNT)
          .map(value => {
            if (
              value === null ||
              value === undefined ||
              value === ''
            ) {
              return null;
            }

            const number =
              Number(value);

            return Number.isFinite(number)
              ? number
              : null;
          });

      return normalised.some(Number.isFinite)
        ? normalised
        : null;
    }

    function combineYearMaps(
      countsByYear,
      hoursByYear,
      populationByYear
    ) {
      const years =
        Array.from(
          new Set([
            ...Object.keys(countsByYear || {}).map(Number),
            ...Object.keys(hoursByYear || {}).map(Number),
            ...Object.keys(populationByYear || {}).map(Number)
          ])
        )
          .filter(Number.isFinite)
          .sort((first, second) => first - second);

      return years.map(year => ({
        year,
        counts:
          normaliseSeries(
            countsByYear?.[year]
          ),
        hours:
          normaliseSeries(
            hoursByYear?.[year]
          ),
        population:
          normaliseSeries(
            populationByYear?.[year]
          )
      }));
    }

    function validateCombinedRows(sourceRows) {
      const rows =
        (Array.isArray(sourceRows) ? sourceRows : [])
          .map(row => {
            const year =
              Number(row?.year);

            if (
              !Number.isFinite(year) ||
              year < 1900 ||
              year > 2200
            ) {
              return null;
            }

            const counts =
              normaliseSeries(row?.counts);

            const hours =
              normaliseSeries(row?.hours);

            const population =
              normaliseSeries(row?.population);

            if (!counts && !hours && !population) {
              return null;
            }

            return {
              year:
                Math.round(year),
              counts,
              hours,
              population
            };
          })
          .filter(Boolean)
          .sort(
            (first, second) =>
              first.year -
              second.year
          );

      if (
        !rows.some(row => row.counts) ||
        !rows.some(row => row.hours) ||
        !rows.some(row => row.population) ||
        !rows.some(
          row =>
            row.counts &&
            row.hours &&
            row.population
        )
      ) {
        throw new Error(
          'Population Coverage MMM Trends data were incomplete.'
        );
      }

      return rows;
    }

    function parseLiveData(raw) {
      const clinician =
        parseClinicianTable(
          raw?.clinicianTable
        );

      return validateCombinedRows(
        combineYearMaps(
          clinician.counts,
          clinician.hours,
          parsePopulationTable(
            raw?.populationTable
          )
        )
      );
    }

    function parseRemoteCache(snapshot) {
      const clinician =
        parseRemoteClinicianRows(
          snapshot?.data?.clinicianRows
        );

      return validateCombinedRows(
        combineYearMaps(
          clinician.counts,
          clinician.hours,
          parseRemotePopulationRows(
            snapshot?.data?.populationRows
          )
        )
      );
    }

    function applyLoadedRows(sourceRows) {
      const rows =
        validateCombinedRows(sourceRows);

      state.clinicianCountByYear = {};
      state.weeklyHoursByYear = {};
      state.populationByYear = {};

      rows.forEach(row => {
        if (row.counts) {
          state.clinicianCountByYear[
            row.year
          ] = [...row.counts];
        }

        if (row.hours) {
          state.weeklyHoursByYear[
            row.year
          ] = [...row.hours];
        }

        if (row.population) {
          state.populationByYear[
            row.year
          ] = [...row.population];
        }
      });
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(raw);

        if (
          Array.isArray(
            parsed?.rows
          )
        ) {
          return;
        }

        if (
          parsed?.clinicianCountByYear &&
          parsed?.weeklyHoursByYear &&
          parsed?.populationByYear
        ) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            validateCombinedRows(
              combineYearMaps(
                parsed.clinicianCountByYear,
                parsed.weeklyHoursByYear,
                parsed.populationByYear
              )
            )
          );
        }
      } catch (_) {
        // Browser cache is optional.
      }
    }

    function niceStep(rawStep) {
      if (
        !Number.isFinite(rawStep) ||
        rawStep <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(rawStep)
        );

      const magnitude =
        Math.pow(10, exponent);

      const fraction =
        rawStep / magnitude;

      let niceFraction;

      if (fraction <= 1) {
        niceFraction = 1;
      } else if (fraction <= 2) {
        niceFraction = 2;
      } else if (fraction <= 2.5) {
        niceFraction = 2.5;
      } else if (fraction <= 5) {
        niceFraction = 5;
      } else {
        niceFraction = 10;
      }

      return niceFraction *
        magnitude;
    }

    function nextNiceStep(step) {
      const value =
        Math.max(
          1e-9,
          Number(step) || 1
        );

      const exponent =
        Math.floor(
          Math.log10(value)
        );

      const magnitude =
        Math.pow(10, exponent);

      const fraction =
        value / magnitude;

      if (fraction < 1.5) {
        return 2 * magnitude;
      }

      if (fraction < 2.25) {
        return 2.5 * magnitude;
      }

      if (fraction < 3.75) {
        return 5 * magnitude;
      }

      if (fraction < 7.5) {
        return 10 * magnitude;
      }

      return 20 * magnitude;
    }

    function valuesForState(
      stateCode
    ) {
      const values = [];

      for (
        const mmm of
        mmmsForState(stateCode)
      ) {
        for (
          const year of
          state.years
        ) {
          const value =
            coverageFor(
              year,
              stateCode,
              mmm
            );

          if (Number.isFinite(value)) {
            values.push(value);
          }
        }
      }

      values.push(
        SATURATED_BENCHMARK,
        SUFFICIENT_BENCHMARK
      );

      return values;
    }

    function deriveStateScale(
      stateCode
    ) {
      const values =
        valuesForState(
          stateCode
        ).filter(
          Number.isFinite
        );

      if (!values.length) {
        return {
          min: 4000,
          max: 11000,
          step: 1000,
          intervals: 7
        };
      }

      const lowest =
        Math.min(...values);

      const highest =
        Math.max(...values);

      const span =
        Math.max(
          1,
          highest - lowest
        );

      let step =
        niceStep(
          span / 7
        );

      let minimum =
        Math.max(
          0,
          Math.floor(
            lowest / step
          ) * step
        );

      let maximum =
        Math.ceil(
          highest / step
        ) * step;

      if (
        lowest <
          SATURATED_BENCHMARK &&
        lowest - minimum <
          step * 0.28 &&
        minimum - step >= 0
      ) {
        minimum -= step;
      }

      if (
        maximum - highest <
        step * 0.35
      ) {
        maximum += step;
      }

      let intervals =
        Math.round(
          (maximum - minimum) /
            step
        );

      while (intervals > 8) {
        step =
          nextNiceStep(step);

        minimum =
          Math.max(
            0,
            Math.floor(
              lowest / step
            ) * step
          );

        maximum =
          Math.ceil(
            highest / step
          ) * step;

        if (
          maximum - highest <
          step * 0.35
        ) {
          maximum += step;
        }

        intervals =
          Math.round(
            (maximum - minimum) /
              step
          );
      }

      while (intervals < 5) {
        maximum += step;
        intervals += 1;
      }

      return {
        min: minimum,
        max: maximum,
        step,
        intervals
      };
    }

    function buildYScales() {
      ALL_STATES.forEach(
        stateCode => {
          state.yScales[
            stateCode
          ] =
            deriveStateScale(
              stateCode
            );
        }
      );
    }

    function yScaleForState(
      stateCode = state.activeState
    ) {
      return (
        state.yScales[
          stateCode
        ] || {
          min: 0,
          max: 10000,
          step: 2000,
          intervals: 5
        }
      );
    }

    function datasetForMMM(mmm) {
      const exists =
        mmmsForState(
          state.activeState
        ).includes(mmm);

      const data =
        state.years.map(
          year =>
            exists
              ? coverageFor(
                  year,
                  state.activeState,
                  mmm
                )
              : null
        );

      const visible =
        !state.hiddenMMMs.has(mmm);

      return PFFCharts.lineDataset({
        label:
          `MM${mmm}`,
        data,
        borderColor:
          MMM_COLOURS[mmm],
        backgroundColor:
          MMM_COLOURS[mmm],
        pointBackgroundColor:
          MMM_COLOURS[mmm],
        pointBorderColor:
          '#ffffff',
        pointBorderWidth:
          1,
        borderCapStyle:
          'round',
        borderJoinStyle:
          'round',
        cubicInterpolationMode:
          'monotone',
        hidden:
          !visible,
        _mmm:
          mmm,
        _seriesLabel:
          `MM${mmm}`,
        _existsForActiveState:
          exists,
        _activeSeries:
          visible
      });
    }

    function buildDatasets() {
      return MMM_NUMBERS.map(
        datasetForMMM
      );
    }

    function tooltipLabel(context) {
      const mmm =
        context.dataset._mmm;

      const year =
        Number(
          state.years[
            context.dataIndex
          ]
        );

      const rawIndex =
        rawIndexFor(
          state.activeState,
          mmm
        );

      const coverage =
        Number(
          context.raw
        );

      const fte =
        rawIndex >= 0
          ? fteFor(
              year,
              rawIndex
            )
          : null;

      const population =
        rawIndex >= 0
          ? populationFor(
              year,
              rawIndex
            )
          : null;

      const count =
        rawIndex >= 0
          ? Number(
              state.clinicianCountByYear?.[
                year
              ]?.[
                rawIndex
              ]
            )
          : null;

      const hours =
        rawIndex >= 0
          ? Number(
              state.weeklyHoursByYear?.[
                year
              ]?.[
                rawIndex
              ]
            )
          : null;

      const lines = [
        `${state.activeState} · MM${mmm}`,
        `${PFF.formatInteger(coverage)} people per FTE clinician`
      ];

      if (
        Number.isFinite(fte) &&
        Number.isFinite(population)
      ) {
        lines.push(
          `${PFF.formatOneDecimal(fte)} active FTE clinicians · ${PFF.formatInteger(population)} people`
        );
      }

      if (
        Number.isFinite(count) &&
        Number.isFinite(hours)
      ) {
        lines.push(
          `${PFF.formatInteger(count)} active clinicians · ${PFF.formatOneDecimal(hours)} h/wk`
        );
      }

      return lines;
    }

    const coverageBenchmarksPlugin = {
      id:
        'coverageBenchmarksPlugin',

      beforeDatasetsDraw(chartInstance) {
        const {
          ctx,
          chartArea
        } = chartInstance;

        if (
          !chartArea ||
          !unifiedYAxis
        ) {
          return;
        }

        const benchmarks = [
          {
            value:
              SUFFICIENT_BENCHMARK,
            colour:
              SUFFICIENT_COLOUR
          },
          {
            value:
              SATURATED_BENCHMARK,
            colour:
              SATURATED_COLOUR
          }
        ];

        ctx.save();
        ctx.lineCap =
          'round';
        ctx.lineWidth =
          2.2;
        ctx.setLineDash(
          [1, 4]
        );

        benchmarks.forEach(
          benchmark => {
            const ratio =
              PFF.clamp(
                unifiedYAxis.valueToRatio(
                  benchmark.value
                ),
                0,
                1
              );

            const y =
              chartArea.bottom -
              chartArea.height *
                ratio;

            ctx.strokeStyle =
              benchmark.colour;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              y
            );
            ctx.lineTo(
              chartArea.right,
              y
            );
            ctx.stroke();
          }
        );

        ctx.restore();
      }
    };

    const yearTickMarksPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'coverageYearTickMarks',
        getValue({ index }) {
          return state.years[index];
        },
        isMajor(value) {
          const year =
            Number(value);

          return Number.isFinite(year) &&
            year % 2 === 0;
        }
      });

    const coverageTrendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'coverageTrendLabelsPlugin',

        enabled() {
          return (
            trendController?.mode !==
            'off'
          );
        },

        isActive({
          dataset,
          meta
        }) {
          return Boolean(
            dataset?._existsForActiveState &&
            dataset?._activeSeries !== false &&
            !meta?.hidden
          );
        },

        getTrendValue({ dataset }) {
          return latestAnnualisedGrowth(
            dataset?._mmm
          );
        }
      });

    function chartOptions() {
      const scale =
        yScaleForState();

      const duration =
        PFFCharts.chartAnimationDuration();

      return PFFCharts.baseChartOptions({
        normalized:
          true,

        animation: {
          duration,
          easing:
            'easeInOutCubic'
        },

        animations: {
          x: {
            duration:
              0
          },
          y: {
            duration,
            easing:
              'easeInOutCubic'
          },
          colors: {
            duration:
              0
          }
        },

        transitions:
          PFFCharts.seriesVisibilityTransitionOptions(
            260
          ),

        layout: {
          autoPadding:
            true,
          padding: {
            top:
              PFF.mobileLayout()
                ? 16
                : 18,
            right:
              3,
            bottom:
              0,
            left:
              0
          }
        },

        plugins: {
          tooltip: {
            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      items[0].label
                    )
                  : '';
              },
              label:
                tooltipLabel
            }
          }
        },

        scales: {
          x:
            PFFCharts.xYearScaleOptions(),

          y:
            PFFCharts.yScaleOptions(
              scale,
              {
                ticks: {
                  display:
                    false,
                  stepSize:
                    scale.step
                },
                title: {
                  display:
                    false
                }
              }
            )
        }
      });
    }

    function syncChartScale() {
      if (!chart) {
        return;
      }

      const scale =
        yScaleForState();

      chart.options.scales.y.min =
        scale.min;

      chart.options.scales.y.max =
        scale.max;

      chart.options.scales.y.ticks.stepSize =
        scale.step;
    }

    function syncChartDatasets() {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets();

      nextDatasets.forEach(
        (
          nextDataset,
          index
        ) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] =
              nextDataset;

            return;
          }

          Object.assign(
            current,
            nextDataset
          );

          const visible =
            !state.hiddenMMMs.has(
              nextDataset._mmm
            );

          current._activeSeries =
            visible;

          chart.setDatasetVisibility(
            index,
            visible
          );
        }
      );

      chart.data.datasets.length =
        nextDatasets.length;
    }

    function legendItemsForState() {
      return mmmsForState()
        .map(mmm => ({
          datasetIndex:
            MMM_NUMBERS.indexOf(mmm),
          label:
            `MM${mmm}`,
          colour:
            MMM_COLOURS[mmm],
          active:
            !state.hiddenMMMs.has(mmm),
          mmm
        }));
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const visible =
        mmmsForState()
          .filter(
            mmm =>
              !state.hiddenMMMs.has(mmm)
          )
          .map(mmm => `MM${mmm}`);

      const trendText =
        trendController?.mode !== 'off'
          ? ` ${trendController.windowSize}-year trend labels are on.`
          : ' Trend labels are off.';

      PFFCharts.updateChartSummary(
        `${state.activeState} MMM population coverage trends from ${state.years[0] ?? 'unavailable'} to ${state.years[state.years.length - 1] ?? 'unavailable'}. Visible series: ${visible.length ? visible.join(', ') : 'none'}.${trendText}`,
        chartSummary
      );
    }

    function createChart() {
      unifiedYAxis =
        PFFCharts.createUnifiedYAxis({
          id:
            'coverageUnifiedYAxis',
          getChart() {
            return chart;
          },
          getScale() {
            return yScaleForState();
          },
          getDecimals() {
            return 0;
          },
          getTitle() {
            return 'People per FTE clinician';
          },
          formatValue(value) {
            return PFF.formatInteger(value);
          }
        });

      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type:
              'line',

            data: {
              labels:
                state.years,
              datasets:
                buildDatasets()
            },

            options:
              chartOptions(),

            plugins: [
              unifiedYAxis.plugin,
              coverageBenchmarksPlugin,
              yearTickMarksPlugin,
              coverageTrendLabelsPlugin
            ]
          }
        );

      unifiedYAxis.setImmediately(
        yScaleForState(),
        0
      );
    }

    function renderChart(
      reason = 'state',
      previousScale = null
    ) {
      if (!chart) {
        return;
      }

      const duration =
        reason === 'state'
          ? PFFCharts.chartAnimationDuration()
          : 520;

      const oldScale =
        previousScale
          ? PFFCharts.copyScale(
              previousScale
            )
          : unifiedYAxis.currentScale();

      const nextScale =
        PFFCharts.copyScale(
          yScaleForState()
        );

      syncChartScale();
      syncChartDatasets();

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeInOutCubic';

      chart.options.animations.x.duration =
        0;

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeInOutCubic';

      chart.update();

      unifiedYAxis.animate(
        oldScale,
        nextScale,
        {
          duration,
          fromDecimals:
            0,
          toDecimals:
            0
        }
      );

      legendController?.render();
      tabsController?.update();
      updateAccessibleSummary();
    }

    function setActiveState(nextState) {
      if (
        !ALL_STATES.includes(nextState) ||
        nextState === state.activeState
      ) {
        return;
      }

      const previousScale =
        unifiedYAxis
          ? unifiedYAxis.currentScale()
          : yScaleForState();

      state.activeState =
        nextState;

      renderChart(
        'state',
        previousScale
      );
    }

    function setupControls() {
      headingScroller =
        PFF.setupScrollableRegion({
          scroller:
            headingScrollViewport,
          leftButton:
            headingScrollLeft,
          rightButton:
            headingScrollRight
        });

      tabsController =
        PFF.setupTabs({
          tabList:
            stateTabList,
          tabs:
            stateTabs,
          valueAttribute:
            'state',
          initialValue:
            state.activeState,
          leftButton:
            tabScrollLeft,
          rightButton:
            tabScrollRight,
          onChange(value) {
            setActiveState(value);
          }
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,
          initialMode:
            '3yr',
          onChange() {
            chart?.draw();
            updateAccessibleSummary();
          }
        });
    }

    function setupLegend() {
      legendController =
        PFFCharts.setupLegend({
          legend:
            chartLegend,
          leftButton:
            legendScrollLeft,
          rightButton:
            legendScrollRight,
          getChart() {
            return chart;
          },
          getItems:
            legendItemsForState,
          updateMode:
            undefined,
          onToggle({
            dataset,
            visible,
            item
          }) {
            const mmm =
              Number(
                item?.mmm ??
                dataset?._mmm
              );

            if (!Number.isFinite(mmm)) {
              return;
            }

            if (visible) {
              state.hiddenMMMs.delete(mmm);
            } else {
              state.hiddenMMMs.add(mmm);
            }

            if (dataset) {
              dataset._activeSeries =
                visible;
            }

            updateAccessibleSummary();
          }
        });

      legendController.render();
    }

    function setupResponsiveBehaviour() {
      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },
          observe: [
            app,
            chartShell,
            chartLegend
          ],
          beforeResize(chartInstance) {
            const scale =
              yScaleForState();

            chartInstance.options.scales.x =
              PFFCharts.xYearScaleOptions();

            chartInstance.options.scales.y =
              PFFCharts.yScaleOptions(
                scale,
                {
                  ticks: {
                    display:
                      false,
                    stepSize:
                      scale.step
                  },
                  title: {
                    display:
                      false
                  }
                }
              );
          },
          afterResize() {
            unifiedYAxis?.setImmediately(
              yScaleForState(),
              0
            );
            chart?.draw();
          },
          onRefresh() {
            tabsController?.update();
            headingScroller?.update();
            legendController?.update();
          }
        });
    }

    migrateLegacyLocalCache();
    setupControls();

    PFF.initialiseApp({
      app,
      status:
        statusEl,

      async loadLive() {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.clinicianSheet,
              range:
                CONFIG.clinicianRange,
              headers:
                '2'
            }),

            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.populationSheet,
              range:
                CONFIG.populationRange,
              headers:
                '2'
            })
          ]);

        return {
          clinicianTable,
          populationTable
        };
      },

      parseLive:
        parseLiveData,

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,
          appKey:
            CACHE_APP_KEY
        });
      },

      parseRemoteCache,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        1,

      onLiveError(error) {
        console.warn(
          'Live Population Coverage MMM Trends data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(error) {
        console.warn(
          'Apps Script Population Coverage MMM Trends cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          liveData,
        text:
          liveDataText
      },

      render(loaded) {
        applyLoadedRows(
          loaded.rows
        );

        state.years =
          commonYears();

        if (!state.years.length) {
          throw new Error(
            'No years were common to the raw clinician and population data.'
          );
        }

        buildYScales();
        createChart();
        setupLegend();

        chartSummary =
          PFFCharts.ensureChartSummary({
            id:
              'populationCoverageMmmTrendsSummary',
            parent:
              app
          });

        chartCanvas.setAttribute(
          'aria-describedby',
          chartSummary.id
        );

        updateAccessibleSummary();

        interactionsController =
          PFFCharts.setupChartInteractions({
            canvas:
              chartCanvas,
            getChart() {
              return chart;
            }
          });

        setupResponsiveBehaviour();

        requestAnimationFrame(
          () => {
            tabsController?.update();
            headingScroller?.update();
            legendController?.update();
            unifiedYAxis?.setImmediately(
              yScaleForState(),
              0
            );
            chart?.draw();
          }
        );

        return chart;
      },

      onError() {
        liveData.style.visibility =
          'hidden';
      },

      errorMessage:
        'Population Coverage MMM Trends data unavailable.'
    });
  </script>
</body>
</html>
