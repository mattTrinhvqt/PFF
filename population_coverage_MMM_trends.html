<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF State MMM Population Coverage Trends</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --mmm1: #6600ff;
      --mmm2: #2d3a8c;
      --mmm3: #22a36b;
      --mmm4: #f1c232;
      --mmm5: #f03a47;
      --mmm6: #c25e00;
      --mmm7: #151515;

      --saturated: #ff00ff;
      --sufficient: #20c9d7;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 4px;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    /* ==========================================================
     * STATE TABS + LIVE STATUS
     * ========================================================== */

    .module-top {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms var(--motion-ease),
        width 420ms var(--motion-ease);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .tab-scroll-arrow {
      position: absolute;
      top: 3px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .tab-scroll-shell.can-scroll-left .tab-scroll-arrow-left,
    .tab-scroll-shell.can-scroll-right .tab-scroll-arrow-right {
      opacity: 0.68;
      visibility: visible;
      pointer-events: auto;
    }

    .tab-scroll-arrow:hover {
      opacity: 0.96 !important;
      background: rgba(255, 255, 255, 0.90);
    }

    .tab-scroll-arrow:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .tab-scroll-arrow-left {
      left: 0;
    }

    .tab-scroll-arrow-right {
      right: 0;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ==========================================================
     * GRAPH TITLE + LEGEND
     * ========================================================== */

    .chart-heading-row {
      position: relative;
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      min-height: 31px;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 4px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-options-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    #chartLegend {
      position: relative;
      z-index: 2;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .legend-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
    }

    /* ==========================================================
     * CHART
     * ========================================================== */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -2px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #coverageChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    .benchmark-legend {
      position: absolute;
      top: 8px;
      right: 5px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 4px 6px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(105, 113, 138, 0.14);
      border-radius: 4px;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .benchmark-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .benchmark-legend-line {
      width: 17px;
      height: 0;
      flex: 0 0 17px;
      border-top: 2px dotted var(--saturated);
    }

    .benchmark-legend-line.is-sufficient {
      border-top-color: var(--sufficient);
    }

    .benchmark-legend-line.is-saturated {
      border-top-color: var(--saturated);
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 2px;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        min-height: 30px;
      }

      .chart-heading {
        padding-top: 4px;
        font-size: 14px;
        line-height: 21px;
      }

      .benchmark-legend {
        top: 7px;
        right: 3px;
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div class="app-loading" role="status" aria-label="Loading state MMM population coverage data">
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading population coverage data…</p>
      </div>

      <div class="module-top">
        <div id="tabScrollShell" class="tab-scroll-shell">
          <div
            id="stateTabs"
            class="tab-list"
            role="tablist"
            aria-label="State and territory population coverage"
          >
            <button class="chart-tab is-active" type="button" role="tab" aria-selected="true" data-state="NSW">NSW</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="VIC">VIC</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="QLD">QLD</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="SA">SA</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="WA">WA</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="TAS">TAS</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="NT">NT</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-state="ACT">ACT</button>
          </div>

          <button
            id="tabScrollLeft"
            class="tab-scroll-arrow tab-scroll-arrow-left"
            type="button"
            aria-label="Scroll state tabs left"
          >&#8249;</button>

          <button
            id="tabScrollRight"
            class="tab-scroll-arrow tab-scroll-arrow-right"
            type="button"
            aria-label="Scroll state tabs right"
          >&#8250;</button>
        </div>

        <div id="liveData" class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="liveDataText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 class="chart-heading">MMM population coverage trends</h2>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >&#8249;</button>

          <div id="legendViewport" class="legend-viewport">
            <div id="chartLegend" class="chart-legend" aria-label="MMM chart legend"></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >&#8250;</button>
        </div>
      </div>

      <div class="chart-shell">
        <div class="benchmark-legend" aria-label="Coverage benchmarks">
          <span class="benchmark-legend-item">
            <span class="benchmark-legend-line is-sufficient" aria-hidden="true"></span>
            <span>Sufficient · 1 / 10k</span>
          </span>
          <span class="benchmark-legend-item">
            <span class="benchmark-legend-line is-saturated" aria-hidden="true"></span>
            <span>Saturated · 1 / 5k</span>
          </span>
        </div>

        <canvas
          id="coverageChart"
          aria-label="Population coverage by Modified Monash Model over time"
          role="img"
          tabindex="-1"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    // ============================================================
    // DATA SOURCE
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const CLINICIAN_SHEET =
      'OptomsbystatebyMMM';

    const POPULATION_SHEET =
      'AuspopnbystatebyMMM';

    /*
      Both tabs have two header rows:
      row 29 = measure/state headers
      row 30 = year/MMM headers
      row 31 onward = data

      Raw clinician sheet:
      A       = year
      B:AO    = active clinical optometrist counts, 40 state × MMM cells
      AP:CC   = average weekly clinical hours, same 40 cells

      Raw population sheet:
      A       = year
      B:AO    = population, same 40 state × MMM cells

      FTE is calculated in this HTML:
        FTE = clinician count × weekly clinical hours / 38

      Population coverage is then calculated in this HTML:
        people per FTE clinician = population / FTE
    */
    const CLINICIAN_RANGE =
      'A29:CC';

    const POPULATION_RANGE =
      'A29:AO';

    const COUNT_FIRST_INDEX =
      1;   // B

    const HOURS_FIRST_INDEX =
      41;  // AP

    const POPULATION_FIRST_INDEX =
      1;   // B

    const RAW_SERIES_COUNT =
      40;

    const FULL_TIME_HOURS =
      38;

    const CACHE_KEY =
      'pff_state_mmm_coverage_raw_v1';

    const SATURATED_BENCHMARK =
      5000;

    const SUFFICIENT_BENCHMARK =
      10000;

    const SATURATED_COLOUR =
      '#ff00ff';

    const SUFFICIENT_COLOUR =
      '#20c9d7';

    const ALL_STATES = [
      'NSW', 'VIC', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT'
    ];

    /*
      Column order in both raw sheets, B:AO.
      Missing MMMs are deliberately absent from the source and therefore
      are also absent from the graph for those states.
    */
    const SERIES_SCHEMA = [
      { state: 'NSW', mmm: 1 },
      { state: 'NSW', mmm: 2 },
      { state: 'NSW', mmm: 3 },
      { state: 'NSW', mmm: 4 },
      { state: 'NSW', mmm: 5 },
      { state: 'NSW', mmm: 6 },
      { state: 'NSW', mmm: 7 },

      { state: 'VIC', mmm: 1 },
      { state: 'VIC', mmm: 2 },
      { state: 'VIC', mmm: 3 },
      { state: 'VIC', mmm: 4 },
      { state: 'VIC', mmm: 5 },

      { state: 'QLD', mmm: 1 },
      { state: 'QLD', mmm: 2 },
      { state: 'QLD', mmm: 3 },
      { state: 'QLD', mmm: 4 },
      { state: 'QLD', mmm: 5 },
      { state: 'QLD', mmm: 6 },
      { state: 'QLD', mmm: 7 },

      { state: 'SA', mmm: 1 },
      { state: 'SA', mmm: 2 },
      { state: 'SA', mmm: 3 },
      { state: 'SA', mmm: 4 },
      { state: 'SA', mmm: 5 },
      { state: 'SA', mmm: 6 },
      { state: 'SA', mmm: 7 },

      { state: 'WA', mmm: 1 },
      { state: 'WA', mmm: 2 },
      { state: 'WA', mmm: 3 },
      { state: 'WA', mmm: 4 },
      { state: 'WA', mmm: 5 },
      { state: 'WA', mmm: 6 },
      { state: 'WA', mmm: 7 },

      { state: 'TAS', mmm: 2 },
      { state: 'TAS', mmm: 3 },
      { state: 'TAS', mmm: 5 },

      { state: 'NT', mmm: 2 },
      { state: 'NT', mmm: 6 },
      { state: 'NT', mmm: 7 },

      { state: 'ACT', mmm: 1 }
    ];

    const MMM_COLOURS = {
      1: '#2c3e50',
      2: '#4f1500',
      3: '#7e2800',
      4: '#a14216',
      5: '#c87452',
      6: '#e1b69a',
      7: '#f3e0d3'
    };

    const MMM_NUMBERS =
      [1, 2, 3, 4, 5, 6, 7];

    // ============================================================
    // DOM
    // ============================================================

    const app =
      document.getElementById('app');

    const statusEl =
      document.getElementById('status');

    const liveData =
      document.getElementById('liveData');

    const liveDataText =
      document.getElementById('liveDataText');

    const tabScrollShell =
      document.getElementById('tabScrollShell');

    const stateTabList =

    const state = {
      clinicianCountByYear: {},
      weeklyHoursByYear: {},
      populationByYear: {},

    // ============================================================
    // HELPERS
    // ============================================================

    function reducedMotion() {
      return window.matchMedia?.(
        '(prefers-reduced-motion: reduce)'
      )?.matches === true;
    }

    function clamp(value, minimum, maximum) {
      return Math.max(
        minimum,
        Math.min(maximum, value)
      );
    }

    function arraysNearlyEqual(
      first,
      second,
      tolerance = 1e-9
    ) {
      if (
        !Array.isArray(first) ||
        !Array.isArray(second) ||
        first.length !== second.length
      ) {
        return false;
      }

      return first.every(
        (value, index) =>
          Math.abs(
            Number(value) -
            Number(second[index])
          ) <= tolerance
      );
    }

    function easeOutCubic(value) {
      return 1 - Math.pow(1 - value, 3);
    }

    function formatInteger(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      return Math.round(number)
        .toLocaleString('en-AU');
    }

    function formatOneDecimal(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      return number.toLocaleString(
        'en-AU',
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 1
        }
      );
    }

    function rawIndexFor(
      stateCode,
      mmm
    ) {
      return SERIES_SCHEMA.findIndex(
        item =>
          item.state === stateCode &&
          item.mmm === mmm
      );
    }

    function mmmsForState(
      stateCode = state.activeState
    ) {
      return SERIES_SCHEMA
        .filter(
          item =>
            item.state === stateCode
        )
        .map(item => item.mmm);
    }

    function yearsIn(object) {
      return Object.keys(object)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function commonYears() {
      const counts =
        new Set(
          yearsIn(
            state.clinicianCountByYear
          )
        );

      const hours =
        new Set(
          yearsIn(
            state.weeklyHoursByYear
          )
        );

      return yearsIn(
        state.populationByYear
      ).filter(
        year =>
          counts.has(year) &&
          hours.has(year)
      );
    }

    function fteFor(
      year,
      rawIndex
    ) {
      const count =
        Number(
          state.clinicianCountByYear?.[
            year
          ]?.[
            rawIndex
          ]
        );

      const hours =
        Number(
          state.weeklyHoursByYear?.[
            year
          ]?.[
            rawIndex
          ]
        );

      if (
        !Number.isFinite(count) ||
        !Number.isFinite(hours) ||
        count <= 0 ||
        hours <= 0
      ) {
        return null;
      }

      const fte =
        count *
        hours /
        FULL_TIME_HOURS;

      return Number.isFinite(fte) &&
        fte > 0
        ? fte
        : null;
    }

    function populationFor(
      year,
      rawIndex
    ) {
      const population =
        Number(
          state.populationByYear?.[
            year
          ]?.[
            rawIndex
          ]
        );

      return Number.isFinite(population) &&
        population > 0
        ? population
        : null;
    }

    function coverageFor(
      year,
      stateCode,
      mmm
    ) {
      const rawIndex =
        rawIndexFor(
          stateCode,
          mmm
        );

      if (rawIndex < 0) {
        return null;
      }

      const fte =
        fteFor(
          year,
          rawIndex
        );

      const population =
        populationFor(
          year,
          rawIndex
        );

      if (
        !Number.isFinite(fte) ||
        !Number.isFinite(population) ||
        fte <= 0
      ) {
        return null;
      }

      const coverage =
        population / fte;

      return Number.isFinite(coverage) &&
        coverage > 0
        ? coverage
        : null;
    }

    // ============================================================
    // GOOGLE SHEETS GVIZ
    // ============================================================

    function loadGVizSheet(
      sheetName,
      range
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `pffGviz_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement('script');

          const timer =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    `Timed out loading ${sheetName}.`
                  )
                );
              },
              15000
            );

          function cleanup() {
            window.clearTimeout(timer);

            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] =
                undefined;
            }

            script.remove();
          }

          window[callbackName] =
            response => {
              cleanup();

              if (
                response?.status === 'error'
              ) {
                reject(
                  new Error(
                    response?.errors?.[0]?.detailed_message ||
                    response?.errors?.[0]?.message ||
                    `Could not load ${sheetName}.`
                  )
                );

                return;
              }

              const table =
                response?.table;

              if (!table) {
                reject(
                  new Error(
                    `No table data were returned from ${sheetName}.`
                  )
                );

                return;
              }

              resolve(table);
            };

          script.onerror =
            () => {
              cleanup();

              reject(
                new Error(
                  `Could not load ${sheetName}.`
                )
              );
            };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              tq: 'select *',
              tqx:
                `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async = true;
          document.head.appendChild(script);
        }
      );
    }

    function numericCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return null;
      }

      if (
        typeof cell.v === 'number'
      ) {
        return Number.isFinite(cell.v)
          ? cell.v
          : null;
      }

      const cleaned =
        String(cell.v)
          .replace(/,/g, '')
          .replace(/[^0-9.+-]/g, '');

      if (!cleaned) {
        return null;
      }

      const value =
        Number(cleaned);

      return Number.isFinite(value)
        ? value
        : null;
    }

    function yearCell(cell) {
      const value =
        numericCell(cell);

      if (value === null) {
        return null;
      }

      const year =
        Math.round(value);

      return (
        year >= 1900 &&
        year <= 2200
      )
        ? year
        : null;
    }

    function parseClinicianTable(table) {
      const counts = {};
      const hours = {};
      const rows =
        table?.rows || [];

      for (const row of rows) {
        const cells =
          row?.c || [];

        const year =
          yearCell(
            cells[0]
          );

        if (!year) {
          continue;
        }

        const countValues =
          Array.from(
            { length: RAW_SERIES_COUNT },
            (_, index) =>
              numericCell(
                cells[
                  COUNT_FIRST_INDEX +
                  index
                ]
              )
          );

        const hourValues =
          Array.from(
            { length: RAW_SERIES_COUNT },
            (_, index) =>
              numericCell(
                cells[
                  HOURS_FIRST_INDEX +
                  index
                ]
              )
          );

        if (
          countValues.some(
            Number.isFinite
          )
        ) {
          counts[year] =
            countValues;
        }

        if (
          hourValues.some(
            Number.isFinite
          )
        ) {
          hours[year] =
            hourValues;
        }
      }

      return {
        counts,
        hours
      };
    }

    function parsePopulationTable(table) {
      const population = {};
      const rows =
        table?.rows || [];

      for (const row of rows) {
        const cells =
          row?.c || [];

        const year =
          yearCell(
            cells[0]
          );

        if (!year) {
          continue;
        }

        const values =
          Array.from(
            { length: RAW_SERIES_COUNT },
            (_, index) =>
              numericCell(
                cells[
                  POPULATION_FIRST_INDEX +
                  index
                ]
              )
          );

        if (
          values.some(
            Number.isFinite
          )
        ) {
          population[year] =
            values;
        }
      }

      return population;
    }
