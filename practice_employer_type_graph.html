<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Practice Employer Type</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    /* Practice employer type-specific components only. Shared PFF chart styling lives in pff_chart_core.js. */

    :root {
      --practice-corporate: #00b26f;
      --practice-independent: #5a3be7;
      --practice-other: #8b9099;
    }

    .chart-heading-row {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 31px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0;
    }

    .chart-heading {
      min-width: 0;
      margin: 0;
      padding: 4px 0 3px;
      overflow: hidden;
      color: var(--pff-ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      will-change: opacity;
    }

    #metricSwitch {
      margin-left: auto;
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .chart-options-row .legend-nav {
      min-width: 54px;
      flex: 1 1 auto;
    }

    .chart-scroll {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 113, 138, 0.34) transparent;
      -webkit-overflow-scrolling: touch;
    }

    .chart-scroll.is-pie {
      overflow-y: hidden;
    }

    .chart-stage {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 100%;
    }

    .chart-shell canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      opacity: 1;
      will-change: opacity;
    }

    @media (max-width: 430px) {
      .chart-heading-row {
        min-height: 29px;
      }

      .chart-heading {
        padding-top: 4px;
        font-size: 14px;
        line-height: 21px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        font-size: 13px;
      }
    }
  </style>
</head>

<body class="pff-chart-app">

  <script>
    const CONFIG = Object.freeze({
      spreadsheetId: '1v6nHeJDkbYF-Pan7OEDLLBhYLghuGxFVBoRX4ibuWSE',
      sheetName: '2026 Optom practice directory',
      sheetGid: '1196929681',
      sourceRange: 'B32:X',
      sourceColumnCount: 23,
      fetchTimeoutMs: 25000,
      columns: Object.freeze({
        practiceName: 0,
        state: 3,
        employerType: 10,
        rurality: 11,
        phn: 22
      })
    });

    const EMPLOYER_TYPES = Object.freeze([
      'Corporate',
      'Independent',
      'Other'
    ]);

    const EMPLOYER_COLOURS = Object.freeze({
      Corporate: '#00b26f',
      Independent: '#5a3be7',
      Other: '#8b9099'
    });

    const STATE_ORDER = Object.freeze([
      'NSW',
      'VIC',
      'QLD',
      'SA',
      'WA',
      'TAS',
      'ACT',
      'NT'
    ]);

    const MMM_ORDER = Object.freeze([
      'MM1',
      'MM2',
      'MM3',
      'MM4',
      'MM5',
      'MM6',
      'MM7'
    ]);

    const LEGEND_ITEMS = Object.freeze(
      EMPLOYER_TYPES.map(type => ({
        label: type,
        colour: EMPLOYER_COLOURS[type],
        markerType: 'square'
      }))
    );

    const app = document.getElementById('app');
    const loadingState = document.getElementById('loadingState');
    const statusElement = document.getElementById('status');
    const dataSourceIndicator = document.getElementById('dataSourceIndicator');
    const dataSourceText = document.getElementById('dataSourceText');
    const tabList = document.getElementById('tabList');
    const tabScrollLeft = document.getElementById('tabScrollLeft');
    const tabScrollRight = document.getElementById('tabScrollRight');
    const chartHeading = document.getElementById('chartHeading');
    const metricSwitch = document.getElementById('metricSwitch');
    const chartShell = document.getElementById('chartShell');
    const chartScroll = document.getElementById('chartScroll');
    const chartStage = document.getElementById('chartStage');
    const chartCanvas = document.getElementById('practiceChart');
    const chartLegend = document.getElementById('chartLegend');
    const legendScrollLeft = document.getElementById('legendScrollLeft');
    const legendScrollRight = document.getElementById('legendScrollRight');

    let sourceRows = [];
    let chart = null;
    let activeView = 'all';
    let activeMetric = 'count';
    let activeModel = null;
    let tabsController = null;
    let metricController = null;
    let legendController = null;
    let responsiveController = null;

    const chartTransitionController =
      PFFCharts.createAnimationController();

    function normaliseEmployerType(value) {
      const text = PFF.cleanText(value).toLowerCase();

      if (!text) {
        return null;
      }

      if (
        text === 'corporate' ||
        text.startsWith('corporate ')
      ) {
        return 'Corporate';
      }

      if (
        text === 'independent' ||
        text.startsWith('independent ')
      ) {
        return 'Independent';
      }

      return 'Other';
    }

    function normaliseRurality(value) {
      const text = PFF.cleanText(value).toUpperCase();

      if (!text) {
        return null;
      }

      const mmmMatch = text.match(/\bM{2,3}\s*([1-7])\b/);

      if (mmmMatch) {
        return `MM${mmmMatch[1]}`;
      }

      return PFF.normaliseMMM(text);
    }

    function normalisePhn(value) {
      const text = PFF.cleanText(value);
      return text || null;
    }

    function parseRows(table) {
      return (table?.rows || [])
        .map((rawRow, sourceIndex) => {
          const cells = rawRow?.c || [];
          const values = Array.from(
            { length: CONFIG.sourceColumnCount },
            (_, index) => PFF.cellValue(cells[index])
          );

          const practiceName = PFF.cleanText(
            values[CONFIG.columns.practiceName]
          );

          if (!practiceName) {
            return null;
          }

          return {
            sourceIndex,
            practiceName,
            state: PFF.normaliseState(
              values[CONFIG.columns.state]
            ),
            employerType: normaliseEmployerType(
              values[CONFIG.columns.employerType]
            ),
            rurality: normaliseRurality(
              values[CONFIG.columns.rurality]
            ),
            phn: normalisePhn(
              values[CONFIG.columns.phn]
            )
          };
        })
        .filter(Boolean);
    }

    function emptyCounts() {
      return {
        Corporate: 0,
        Independent: 0,
        Other: 0
      };
    }

    function groupKey(row, view) {
      if (view === 'all') {
        return 'All practices';
      }

      if (view === 'state') {
        return row.state;
      }

      if (view === 'rurality') {
        return row.rurality;
      }

      if (view === 'phn') {
        return row.phn;
      }

      return null;
    }

    function dominantState(rows) {
      const counts = new Map();

      rows.forEach(row => {
        if (!row.state) {
          return;
        }

        counts.set(
          row.state,
          (counts.get(row.state) || 0) + 1
        );
      });

      return [...counts.entries()]
        .sort((first, second) =>
          second[1] - first[1] ||
          first[0].localeCompare(second[0])
        )[0]?.[0] || null;
    }

    function groupOutlineColour(view, key, rows) {
      if (view === 'state') {
        return PFF.stateColours?.[key] || '#69718a';
      }

      if (view === 'rurality') {
        return PFF.mmmColours?.[key] || '#69718a';
      }

      if (view === 'phn') {
        const state = dominantState(rows);
        return PFF.stateColours?.[state] || '#6600ff';
      }

      return '#6600ff';
    }

    function buildModel(view = activeView) {
      const classifiedRows = sourceRows.filter(
        row => row.employerType
      );

      const groups = new Map();

      classifiedRows.forEach(row => {
        const key = groupKey(row, view);

        if (!key) {
          return;
        }

        if (!groups.has(key)) {
          groups.set(key, {
            key,
            rows: [],
            counts: emptyCounts()
          });
        }

        const group = groups.get(key);
        group.rows.push(row);
        group.counts[row.employerType] += 1;
      });

      let orderedGroups = [...groups.values()];

      orderedGroups.forEach(group => {
        group.total = EMPLOYER_TYPES.reduce(
          (sum, type) => sum + group.counts[type],
          0
        );

        group.proportions = Object.fromEntries(
          EMPLOYER_TYPES.map(type => [
            type,
            group.total > 0
              ? group.counts[type] / group.total * 100
              : 0
          ])
        );

        group.outlineColour = groupOutlineColour(
          view,
          group.key,
          group.rows
        );
      });

      if (view === 'all') {
        orderedGroups = orderedGroups.filter(
          group => group.key === 'All practices'
        );
      } else if (view === 'state') {
        const order = new Map(
          STATE_ORDER.map((value, index) => [value, index])
        );

        orderedGroups.sort((first, second) =>
          (order.get(first.key) ?? 999) -
            (order.get(second.key) ?? 999)
        );
      } else if (view === 'rurality') {
        const order = new Map(
          MMM_ORDER.map((value, index) => [value, index])
        );

        orderedGroups.sort((first, second) =>
          (order.get(first.key) ?? 999) -
            (order.get(second.key) ?? 999)
        );
      } else if (view === 'phn') {
        orderedGroups.sort((first, second) =>
          second.total - first.total ||
          first.key.localeCompare(
            second.key,
            'en-AU',
            {
              sensitivity: 'base',
              numeric: true
            }
          )
        );
      }

      return {
        view,
        groups: orderedGroups,
        labels: orderedGroups.map(group => group.key),
        totals: orderedGroups.map(group => group.total),
        outlineColours: orderedGroups.map(
          group => group.outlineColour
        )
      };
    }

    function barValue(group, type) {
      return activeMetric === 'proportion'
        ? group.proportions[type]
        : group.counts[type];
    }

    function formatDisplayedValue(count, proportion) {
      return activeMetric === 'proportion'
        ? PFF.formatPercent(proportion, 1)
        : PFF.formatInteger(count);
    }

    function headingForView(view) {
      if (view === 'state') {
        return 'Practice employer type by state';
      }

      if (view === 'rurality') {
        return 'Practice employer type by rurality';
      }

      if (view === 'phn') {
        return 'Practice employer type by PHN';
      }

      return 'Practice employer type';
    }

    function wrapLabel(value, maximumCharacters = 20) {
      const text = PFF.cleanText(value);

      if (
        !text ||
        text.length <= maximumCharacters ||
        !text.includes(' ')
      ) {
        return text;
      }

      const words = text.split(/\s+/);
      const lines = [];
      let current = '';

      words.forEach(word => {
        const candidate = current
          ? `${current} ${word}`
          : word;

        if (
          current &&
          candidate.length > maximumCharacters &&
          lines.length < 1
        ) {
          lines.push(current);
          current = word;
        } else {
          current = candidate;
        }
      });

      if (current) {
        lines.push(current);
      }

      return lines.slice(0, 2);
    }

    function barStageHeight(model) {
      const rowHeight = PFF.mobileLayout() ? 31 : 34;
      return Math.max(
        chartShell.clientHeight || 260,
        model.groups.length * rowHeight + 56
      );
    }

    function updateStageGeometry(model) {
      const pie = model.view === 'all';
      chartScroll.classList.toggle('is-pie', pie);

      if (pie) {
        chartStage.style.height = '100%';
        chartStage.style.minHeight = '100%';
        chartScroll.scrollTop = 0;
        return;
      }

      const height = barStageHeight(model);
      chartStage.style.height = `${height}px`;
      chartStage.style.minHeight = `${height}px`;
      chartScroll.scrollTop = 0;
    }

    function labelTextColour(type) {
      return type === 'Other'
        ? '#151515'
        : '#ffffff';
    }

    function renderedBarBounds(chartInstance, index) {
      let left = Number.POSITIVE_INFINITY;
      let right = Number.NEGATIVE_INFINITY;
      let y = NaN;
      let height = 0;

      chartInstance.data.datasets.forEach((dataset, datasetIndex) => {
        const meta = chartInstance.getDatasetMeta(datasetIndex);
        const element = meta?.data?.[index];

        if (!element || element.skip) {
          return;
        }

        const properties = element.getProps(
          ['x', 'base', 'y', 'height'],
          true
        );

        if (
          !Number.isFinite(properties.x) ||
          !Number.isFinite(properties.base) ||
          !Number.isFinite(properties.y)
        ) {
          return;
        }

        left = Math.min(
          left,
          properties.x,
          properties.base
        );

        right = Math.max(
          right,
          properties.x,
          properties.base
        );

        y = properties.y;
        height = Math.max(
          height,
          Number(properties.height) || 0
        );
      });

      if (
        !Number.isFinite(left) ||
        !Number.isFinite(right) ||
        !Number.isFinite(y) ||
        height <= 0
      ) {
        return null;
      }

      return {
        left,
        right,
        y,
        height
      };
    }

    const barOutlinePlugin = {
      id: 'pffPracticeGroupOutline',

      afterDatasetsDraw(chartInstance) {
        if (
          activeView === 'all' ||
          !activeModel?.groups?.length ||
          !chartInstance.chartArea
        ) {
          return;
        }

        const context = chartInstance.ctx;

        context.save();
        context.lineWidth = 0.9;
        context.lineJoin = 'round';

        activeModel.groups.forEach((group, index) => {
          const bounds = renderedBarBounds(
            chartInstance,
            index
          );

          if (!bounds) {
            return;
          }

          const top = bounds.y - bounds.height / 2;
          const width = Math.max(
            0,
            bounds.right - bounds.left
          );
          const height = Math.max(0, bounds.height);
          const radius = Math.min(2, height / 2);

          context.beginPath();

          if (typeof context.roundRect === 'function') {
            context.roundRect(
              bounds.left + 0.45,
              top + 0.45,
              Math.max(0, width - 0.9),
              Math.max(0, height - 0.9),
              radius
            );
          } else {
            context.rect(
              bounds.left + 0.45,
              top + 0.45,
              Math.max(0, width - 0.9),
              Math.max(0, height - 0.9)
            );
          }

          context.strokeStyle =
            group.outlineColour || '#69718a';

          context.stroke();
        });

        context.restore();
      }
    };

    const valueLabelsPlugin = {
      id: 'pffPracticeValueLabels',

      afterDatasetsDraw(chartInstance) {
        if (!activeModel?.groups?.length) {
          return;
        }

        const context = chartInstance.ctx;
        const mobile = PFF.mobileLayout();

        context.save();
        context.textAlign = 'center';
        context.textBaseline = 'middle';

        if (activeView === 'all') {
          const group = activeModel.groups[0];
          const meta = chartInstance.getDatasetMeta(0);
          const dataset = chartInstance.data.datasets[0];

          meta.data.forEach((arc, index) => {
            const type = EMPLOYER_TYPES[index];
            const count = group?.counts?.[type] || 0;
            const proportion = group?.proportions?.[type] || 0;

            if (!count || !arc) {
              return;
            }

            const properties = arc.getProps(
              [
                'x',
                'y',
                'startAngle',
                'endAngle',
                'innerRadius',
                'outerRadius'
              ],
              true
            );

            const angle =
              (properties.startAngle + properties.endAngle) / 2;

            const radius =
              properties.innerRadius +
              (properties.outerRadius - properties.innerRadius) * 0.62;

            const x = properties.x + Math.cos(angle) * radius;
            const y = properties.y + Math.sin(angle) * radius;

            context.font = `${mobile ? 8 : 10}px Lato, sans-serif`;
            context.font = `700 ${mobile ? 8 : 10}px Lato, sans-serif`;
            context.fillStyle = labelTextColour(type);

            context.fillText(
              formatDisplayedValue(count, proportion),
              x,
              y
            );
          });

          context.restore();
          return;
        }

        chartInstance.data.datasets.forEach((dataset, datasetIndex) => {
          const meta = chartInstance.getDatasetMeta(datasetIndex);
          const type = dataset.employerType;

          meta.data.forEach((bar, dataIndex) => {
            const group = activeModel.groups[dataIndex];
            const count = group?.counts?.[type] || 0;
            const proportion = group?.proportions?.[type] || 0;

            if (!count || !bar) {
              return;
            }

            const properties = bar.getProps(
              ['x', 'base', 'y', 'height'],
              true
            );

            if (
              !Number.isFinite(properties.x) ||
              !Number.isFinite(properties.base) ||
              !Number.isFinite(properties.y)
            ) {
              return;
            }

            const centreX =
              (properties.x + properties.base) / 2;

            context.font = `700 ${mobile ? 8 : 9}px Lato, sans-serif`;
            context.fillStyle = labelTextColour(type);

            context.fillText(
              formatDisplayedValue(count, proportion),
              centreX,
              properties.y
            );
          });
        });

        context.restore();
      }
    };

    function pieDataset(model) {
      const group = model.groups[0] || {
        counts: emptyCounts(),
        proportions: emptyCounts()
      };

      return {
        label: 'Practice employer type',
        data: EMPLOYER_TYPES.map(
          type => group.counts[type]
        ),
        backgroundColor: EMPLOYER_TYPES.map(
          type => EMPLOYER_COLOURS[type]
        ),
        hoverBackgroundColor: EMPLOYER_TYPES.map(
          type => EMPLOYER_COLOURS[type]
        ),
        borderColor: '#ffffff',
        hoverBorderColor: '#ffffff',
        borderWidth: 2,
        hoverBorderWidth: 2,
        spacing: 0,
        _counts: EMPLOYER_TYPES.map(
          type => group.counts[type]
        ),
        _proportions: EMPLOYER_TYPES.map(
          type => group.proportions[type]
        )
      };
    }

    function barDatasets(model) {
      return EMPLOYER_TYPES.map(type => ({
        label: type,
        employerType: type,
        data: model.groups.map(
          group => barValue(group, type)
        ),
        backgroundColor: EMPLOYER_COLOURS[type],
        hoverBackgroundColor: EMPLOYER_COLOURS[type],
        borderColor: 'transparent',
        hoverBorderColor: 'transparent',
        borderWidth: 0,
        hoverBorderWidth: 0,
        borderSkipped: false,
        borderRadius: 2,
        barPercentage: 0.74,
        categoryPercentage: 0.82,
        _counts: model.groups.map(
          group => group.counts[type]
        ),
        _proportions: model.groups.map(
          group => group.proportions[type]
        )
      }));
    }

    function overallTooltipOptions(model) {
      return PFFCharts.tooltipOptions({
        callbacks: {
          title(items) {
            return items?.[0]?.label || '';
          },

          label(item) {
            const type = item.label;
            const group = model.groups[0];
            const count = group?.counts?.[type] || 0;
            const proportion = group?.proportions?.[type] || 0;

            return (
              `${PFF.formatInteger(count)} ` +
              `(${PFF.formatPercent(proportion, 1)})`
            );
          }
        }
      });
    }

    function barTooltipOptions(model) {
      return PFFCharts.tooltipOptions({
        mode: 'index',
        axis: 'y',
        intersect: false,
        position: 'nearest',
        padding: 7,
        titleMarginBottom: 4,
        bodySpacing: 1,

        filter(item) {
          return item.datasetIndex === 0;
        },

        callbacks: {
          title(items) {
            const index = items?.[0]?.dataIndex;
            return model.groups?.[index]?.key || '';
          },

          label(item) {
            const group = model.groups?.[item.dataIndex];

            if (!group) {
              return '';
            }

            const lines = EMPLOYER_TYPES.map(type =>
              `${type}: ${PFF.formatInteger(group.counts[type])} ` +
              `(${PFF.formatPercent(group.proportions[type], 1)})`
            );

            lines.push(
              `Total: ${PFF.formatInteger(group.total)}`
            );

            return lines;
          }
        }
      });
    }

    function pieOptions(model) {
      return PFFCharts.baseChartOptions({
        interaction: {
          mode: 'nearest',
          intersect: true
        },
        layout: {
          autoPadding: false,
          padding: {
            top: 10,
            right: 12,
            bottom: 10,
            left: 12
          }
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: overallTooltipOptions(model)
        }
      });
    }

    function barOptions(model) {
      return PFFCharts.baseChartOptions({
        indexAxis: 'y',
        interaction: {
          mode: 'index',
          axis: 'y',
          intersect: false,
          includeInvisible: false
        },
        layout: {
          autoPadding: false,
          padding: {
            top: 8,
            right: 8,
            bottom: 0,
            left: 0
          }
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: barTooltipOptions(model)
        },
        scales: {
          x: {
            type: 'linear',
            stacked: true,
            beginAtZero: true,
            min: 0,
            max: activeMetric === 'proportion'
              ? 100
              : undefined,
            title: {
              display: true,
              text: activeMetric === 'proportion'
                ? 'Proportion of practices (%)'
                : 'Number of practices',
              color: '#151515',
              padding: {
                top: 5
              },
              font: {
                family: 'Lato',
                size: PFF.mobileLayout() ? 12 : 13,
                weight: '700'
              }
            },
            ticks: {
              color: '#151515',
              autoSkip: true,
              maxTicksLimit: PFF.mobileLayout() ? 5 : 7,
              padding: 3,
              font: {
                family: 'Lato',
                size: PFF.mobileLayout() ? 9 : 10,
                weight: '400'
              },
              callback(value) {
                return activeMetric === 'proportion'
                  ? `${Math.round(Number(value))}`
                  : PFF.formatInteger(value);
              }
            },
            grid: {
              color: 'rgba(105, 113, 138, 0.075)',
              lineWidth: 1,
              drawTicks: true,
              tickLength: 5,
              tickColor: 'rgba(21, 21, 21, 0)',
              tickWidth: 0
            },
            border: {
              display: false
            }
          },
          y: {
            stacked: true,
            offset: true,
            afterFit(scale) {
              if (activeView === 'phn') {
                scale.width = PFF.mobileLayout() ? 130 : 176;
                return;
              }

              scale.width = PFF.mobileLayout() ? 60 : 72;
            },
            ticks: {
              color: '#151515',
              autoSkip: false,
              padding: 5,
              font: {
                family: 'Lato',
                size: PFF.mobileLayout() ? 9 : 10,
                weight: '400'
              },
              callback(value) {
                const label = this.getLabelForValue(value);

                if (activeView === 'phn') {
                  return wrapLabel(
                    label,
                    PFF.mobileLayout() ? 16 : 23
                  );
                }

                return label;
              }
            },
            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },
            border: {
              display: false
            }
          }
        }
      });
    }

    function createChart(model, animate = true) {
      activeModel = model;
      updateStageGeometry(model);

      const isPie = model.view === 'all';

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: isPie ? 'pie' : 'bar',
          data: isPie
            ? {
                labels: EMPLOYER_TYPES,
                datasets: [pieDataset(model)]
              }
            : {
                labels: model.labels,
                datasets: barDatasets(model)
              },
          options: isPie
            ? pieOptions(model)
            : barOptions(model),
          plugins: isPie
            ? [valueLabelsPlugin]
            : [barOutlinePlugin, valueLabelsPlugin]
        }
      );

      if (!animate || PFF.reducedMotion()) {
        chartCanvas.style.opacity = '1';
      }
    }

    function updateBarChart(model) {
      activeModel = model;
      updateStageGeometry(model);

      chart.data.labels = model.labels;

      chart.data.datasets.forEach((dataset, index) => {
        const type = EMPLOYER_TYPES[index];

        dataset.data = model.groups.map(
          group => barValue(group, type)
        );

        dataset._counts = model.groups.map(
          group => group.counts[type]
        );

        dataset._proportions = model.groups.map(
          group => group.proportions[type]
        );
      });

      chart.options.scales.x.max =
        activeMetric === 'proportion'
          ? 100
          : undefined;

      chart.options.scales.x.title.text =
        activeMetric === 'proportion'
          ? 'Proportion of practices (%)'
          : 'Number of practices';

      chart.options.plugins.tooltip =
        barTooltipOptions(model);

      chart.update();
    }

    function updatePieChart(model) {
      activeModel = model;
      updateStageGeometry(model);

      const dataset = chart.data.datasets[0];
      const nextDataset = pieDataset(model);

      dataset.data = nextDataset.data;
      dataset._counts = nextDataset._counts;
      dataset._proportions = nextDataset._proportions;

      chart.options.plugins.tooltip =
        overallTooltipOptions(model);

      chart.update();
    }

    function replaceChart(model) {
      const finishCreate = () => {
        chart?.destroy();
        chart = null;
        createChart(model, true);

        chartCanvas.style.opacity = '0';

        chartTransitionController.run({
          duration: PFF.defaults.microTransitionMs,
          easing: PFFCharts.easeOutCubic,
          onFrame(progress) {
            chartCanvas.style.opacity = String(progress);
          },
          onComplete() {
            chartCanvas.style.opacity = '1';
          }
        });
      };

      if (
        !chart ||
        PFF.reducedMotion()
      ) {
        finishCreate();
        return;
      }

      chartTransitionController.run({
        duration: PFF.defaults.microTransitionMs,
        easing: PFFCharts.easeInOutCubic,
        onFrame(progress) {
          chartCanvas.style.opacity = String(1 - progress);
        },
        onComplete: finishCreate
      });
    }

    function renderView({ animate = true } = {}) {
      const model = buildModel(activeView);
      const desiredType = activeView === 'all'
        ? 'pie'
        : 'bar';
      const currentType = chart?.config?.type || null;

      PFF.animateTextChange(
        chartHeading,
        headingForView(activeView)
      );

      if (!chart) {
        createChart(model, false);
        return;
      }

      if (currentType !== desiredType) {
        replaceChart(model);
        return;
      }

      if (desiredType === 'pie') {
        updatePieChart(model);
        return;
      }

      updateBarChart(model);
    }

    function configureControls() {
      tabsController = PFF.setupTabs({
        tabList,
        tabs: tabList.querySelectorAll('.chart-tab'),
        valueAttribute: 'view',
        initialValue: activeView,
        leftButton: tabScrollLeft,
        rightButton: tabScrollRight,
        onChange(value) {
          activeView = value;
          renderView({ animate: true });
        }
      });

      metricController = PFF.setupMetricSwitch({
        element: metricSwitch,
        buttons: metricSwitch.querySelectorAll('.metric-button'),
        valueAttribute: 'metric',
        initialValue: activeMetric,
        onChange(value) {
          activeMetric = value;
          renderView({ animate: true });
        }
      });

      legendController = PFFCharts.setupDisplayLegend({
        legend: chartLegend,
        leftButton: legendScrollLeft,
        rightButton: legendScrollRight
      });

      legendController.update(
        LEGEND_ITEMS,
        false
      );

      responsiveController = PFFCharts.createResponsiveController({
        getChart: () => chart,
        observe: [app, chartShell],
        applyResponsiveChartOptions: false,
        onRefresh() {
          if (!chart || !activeModel) {
            return;
          }

          updateStageGeometry(activeModel);
        }
      });
    }

    async function initialise() {
      PFF.setStatus('', statusElement);

      try {
        const table = await PFFCharts.loadGVizSheet({
          sheetId: CONFIG.spreadsheetId,
          sheetName: CONFIG.sheetName,
          gid: CONFIG.sheetGid,
          range: CONFIG.sourceRange,
          headers: '1',
          timeoutMs: CONFIG.fetchTimeoutMs
        });

        sourceRows = parseRows(table);

        if (!sourceRows.length) {
          throw new Error(
            'No usable practice rows were returned from the practice directory.'
          );
        }

        PFF.setDataSourceIndicator('live', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        dataSourceText.textContent = 'LIVE data';

        configureControls();
        renderView({ animate: false });
        PFF.hideLoadingState(app);
      } catch (error) {
        console.error(error);

        PFF.setDataSourceIndicator('unavailable', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        PFF.setStatus(
          error?.message ||
          'Unable to load practice employer type data.',
          statusElement
        );

        PFF.hideLoadingState(app);
      } finally {
        app.setAttribute('aria-busy', 'false');
      }
    }

    initialise();
  </script>
</body>
</html>
