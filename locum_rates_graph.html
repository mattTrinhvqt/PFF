    function handleChartClick(
      event,
      elements
    ) {
      if (
        !chart ||
        interactionLocked
      ) {
        return;
      }

      event?.native
        ?.preventDefault?.();

      const selectedElement =
        findRawBubbleElement(event) ||
        findPrioritySummaryElement(event) ||
        getInteractiveElement(elements);

      if (!selectedElement) {
        chart.tooltip.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

        chart.update('none');
        return;
      }

      showSelectedTooltip(
        event,
        selectedElement
      );

      const dataset =
        chart.data.datasets[
          selectedElement.datasetIndex
        ];

      const raw =
        dataset?.data?.[
          selectedElement.index
        ];

      if (
        dataset?.datasetRole !==
          'bubbleAggregate' ||
        !raw ||
        bubbleStores[
          raw.bubbleView
        ].splitKeys.has(
          raw.categoryKey
        )
      ) {
        lastAggregateClickKey =
          null;

        lastAggregateClickTime =
          0;

        return;
      }

      const clickedAt =
        performance.now();

      const clickKey =
        `${raw.bubbleView}:${raw.categoryKey}`;

      const isSecondActivation =
        lastAggregateClickKey ===
          clickKey &&
        clickedAt -
          lastAggregateClickTime <=
          CONFIG.doubleActivationMs;

      if (isSecondActivation) {
        lastAggregateClickKey =
          null;

        lastAggregateClickTime =
          0;

        chart.tooltip.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

        chart.update('none');

        animateBubbleSplit(
          raw.bubbleView,
          raw.categoryKey
        );

        return;
      }

      lastAggregateClickKey =
        clickKey;

      lastAggregateClickTime =
        clickedAt;
    }


    function getTargetPointStyle(
      dataset,
      raw,
      index
    ) {
      const context = {
        chart,
        raw,
        dataIndex: index,
        dataset,
        datasetIndex: 0,
        type: 'data'
      };

      const backgroundColour =
        resolveScriptableValue(
          dataset.pointBackgroundColor,
          context,
          raw?.colour
            ? rgba(
                raw.colour,
                CONFIG.aggregateOpacity
              )
            : 'rgba(102, 0, 255, 0.20)'
        );

      const borderColour =
        resolveScriptableValue(
          dataset.pointBorderColor,
          context,
          backgroundColour
        );

      const radius =
        Number(
          resolveScriptableValue(
            dataset.pointRadius,
            context,
            CONFIG.pointRadius
          )
        );

      return {
        backgroundColour,
        borderColour,

        radius:
          Number.isFinite(radius)
            ? radius
            : CONFIG.pointRadius,

        pointStyle:
          resolveScriptableValue(
            dataset.pointStyle,
            context,
            'circle'
          )
      };
    }

    function captureRenderedGeometry() {
      const pointPixels = [];
      const lineGroups = [];

      if (!chart) {
        return {
          pointPixels,
          lineGroups
        };
      }

      chart.data.datasets.forEach(
        (dataset, datasetIndex) => {
          const metadata =
            chart.getDatasetMeta(
              datasetIndex
            );

          const renderedElements =
            metadata?.data || [];

          const data =
            dataset.data || [];

          const pixels =
            renderedElements
              .map((element, index) => {
                if (
                  !Number.isFinite(
                    element?.x
                  ) ||
                  !Number.isFinite(
                    element?.y
                  )
                ) {
                  return null;
                }

                return {
                  x:
                    element.x,

                  y:
                    element.y,

                  raw:
                    data[index] || {},

                  role:
                    dataset.datasetRole,

                  datasetMetadata:
                    dataset.metadata || {},

                  style: {
                    backgroundColour:
                      element.options
                        ?.backgroundColor ||
                      element.options
                        ?.borderColor ||
                      'rgba(119, 119, 119, 0.35)',

                    borderColour:
                      element.options
                        ?.borderColor ||
                      element.options
                        ?.backgroundColor ||
                      'rgba(119, 119, 119, 0.35)',

                    radius:
                      Number(
                        element.options?.radius
                      ) ||
                      CONFIG.pointRadius,

                    pointStyle:
                      element.options
                        ?.pointStyle ||
                      'circle'
                  }
                };
              })
              .filter(Boolean);

          if (!pixels.length) {
            return;
          }

          if (
            isLineDataset(dataset) &&
            pixels.length > 1
          ) {
            lineGroups.push({
              role:
                dataset.datasetRole,

              pixels,

              metadata:
                dataset.metadata || {},

              style: {
                borderColour:
                  metadata
                    ?.dataset
                    ?.options
                    ?.borderColor ||
                  dataset.borderColor ||
                  '#777777',

                borderWidth:
                  Number(
                    metadata
                      ?.dataset
                      ?.options
                      ?.borderWidth
                  ) ||
                  Number(
                    dataset.borderWidth
                  ) ||
                  1
              }
            });
          } else {
            pointPixels.push(
              ...pixels
            );
          }
        }
      );

      return {
        pointPixels,
        lineGroups
      };
    }

    function samplePixel(
      sourcePixels,
      index,
      targetLength
    ) {
      if (!sourcePixels.length) {
        return null;
      }

      if (targetLength <= 1) {
        return sourcePixels[0];
      }

      const sourceIndex =
        Math.round(
          index *
          (
            sourcePixels.length - 1
          ) /
          Math.max(
            1,
            targetLength - 1
          )
        );

      return sourcePixels[
        sourceIndex
      ];
    }

    function findNearestPixel(
      targetPixel,
      candidates
    ) {
      if (!candidates.length) {
        return null;
      }

      let nearest =
        candidates[0];

      let nearestDistance =
        Infinity;

      candidates.forEach(candidate => {
        const distance =
          Math.hypot(
            targetPixel.x -
              candidate.x,

            targetPixel.y -
              candidate.y
          );

        if (
          distance <
          nearestDistance
        ) {
          nearest =
            candidate;

          nearestDistance =
            distance;
        }
      });

      return nearest;
    }

    function choosePointStartPixel(
      targetRaw,
      targetPixel,
      geometry
    ) {
      const allPointPixels =
        geometry.pointPixels;

      if (!allPointPixels.length) {
        return findNearestPixel(
          targetPixel,

          geometry.lineGroups.flatMap(
            group => group.pixels
          )
        );
      }

      if (
        Number.isInteger(
          targetRaw?.sourceIndex
        )
      ) {
        const exactSource =
          allPointPixels.find(
            pixel =>
              pixel.raw?.sourceIndex ===
              targetRaw.sourceIndex
          );

        if (exactSource) {
          return exactSource;
        }
      }

      if (
        targetRaw?.bubbleView &&
        targetRaw?.categoryKey
      ) {
        const sameBubble =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.bubbleView ===
                targetRaw.bubbleView &&
              pixel.raw?.categoryKey ===
                targetRaw.categoryKey
          );

        if (sameBubble.length) {
          return findNearestPixel(
            targetPixel,
            sameBubble
          );
        }
      }

      if (targetRaw?.state) {
        const sameState =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.state ===
              targetRaw.state
          );

        if (sameState.length) {
          return findNearestPixel(
            targetPixel,
            sameState
          );
        }
      }

      if (targetRaw?.employerKey) {
        const sameEmployer =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.employerKey ===
              targetRaw.employerKey
          );

        if (sameEmployer.length) {
          return findNearestPixel(
            targetPixel,
            sameEmployer
          );
        }
      }

      if (targetRaw?.structure) {
        const sameStructure =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.structure ===
              targetRaw.structure
          );

        if (sameStructure.length) {
          return findNearestPixel(
            targetPixel,
            sameStructure
          );
        }
      }

      if (targetRaw?.category) {
        const sameCategory =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.category ===
              targetRaw.category
          );

        if (sameCategory.length) {
          return findNearestPixel(
            targetPixel,
            sameCategory
          );
        }
      }

      return findNearestPixel(
        targetPixel,
        allPointPixels
      );
    }

    function chooseLineSourceGroup(
      targetDataset,
      geometry
    ) {
      const sameRoleGroups =
        geometry.lineGroups.filter(
          group =>
            group.role ===
            targetDataset.datasetRole
        );

      if (sameRoleGroups.length) {
        const targetCategory =
          targetDataset
            .metadata
            ?.category;

        const exactCategory =
          sameRoleGroups.find(
            group =>
              targetCategory &&
              group.metadata?.category ===
              targetCategory
          );

        if (exactCategory) {
          return exactCategory;
        }

        const targetMedian =
          Number(
            targetDataset
              .metadata
              ?.statistics
              ?.median
          );

        if (
          Number.isFinite(
            targetMedian
          )
        ) {
          return sameRoleGroups
            .slice()
            .sort(
              (first, second) =>
                Math.abs(
                  Number(
                    first
                      .metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                ) -
                Math.abs(
                  Number(
                    second
                      .metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                )
            )[0];
        }

        return sameRoleGroups[0];
      }

      return {
        role:
          'points',

        pixels:
          geometry.pointPixels,

        metadata:
          {},

        style: {
          borderColour:
            'rgba(119, 119, 119, 0)',

          borderWidth:
            0
        }
      };
    }

    function createTransitionPlans(
      targetDatasets,
      geometry
    ) {
      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return targetDatasets.map(
        targetDataset => {
          const targetData =
            (
              targetDataset.data || []
            ).map(point => ({
              ...point
            }));

          const targetIsLine =
            isLineDataset(
              targetDataset
            );

          const lineSourceGroup =
            targetIsLine
              ? chooseLineSourceGroup(
                  targetDataset,
                  geometry
                )
              : null;

          const sourcePixels = [];

          const startData =
            targetData.map(
              (targetPoint, index) => {
                const targetPixel = {
                  x:
                    xScale.getPixelForValue(
                      targetPoint.x
                    ),

                  y:
                    yScale.getPixelForValue(
                      targetPoint.y
                    )
                };

                const sourcePixel =
                  targetIsLine
                    ? samplePixel(
                        lineSourceGroup
                          ?.pixels || [],

                        index,

                        targetData.length
                      )
                    : choosePointStartPixel(
                        targetPoint,
                        targetPixel,
                        geometry
                      );

                sourcePixels.push(
                  sourcePixel
                );

                if (!sourcePixel) {
                  return {
                    ...targetPoint
                  };
                }

                return {
                  ...targetPoint,

                  x:
                    xScale.getValueForPixel(
                      sourcePixel.x
                    ),

                  y:
                    yScale.getValueForPixel(
                      sourcePixel.y
                    )
                };
              }
            );

          if (targetIsLine) {
            const targetColour =
              String(
                targetDataset.borderColor ||
                '#777777'
              );

            const targetWidth =
              Number(
                targetDataset.borderWidth
              ) ||
              1;

            const startColour =
              lineSourceGroup
                ?.style
                ?.borderColour ||
              fadeCssColour(
                targetColour,
                0
              );

            const startWidth =
              Number(
                lineSourceGroup
                  ?.style
                  ?.borderWidth
              ) ||
              0;

            return {
              kind:
                'line',

              transitionDataset: {
                ...targetDataset,

                data:
                  startData,

                borderColor:
                  startColour,

                backgroundColor:
                  startColour,

                borderWidth:
                  startWidth,

                pointHitRadius:
                  0
              },

              targetDataset,
              startData,
              targetData,
              startColour,
              targetColour,
              startWidth,
              targetWidth
            };
          }

          const targetStyles =
            targetData.map(
              (point, index) =>
                getTargetPointStyle(
                  targetDataset,
                  point,
                  index
                )
            );

          const startStyles =
            targetStyles.map(
              (targetStyle, index) => {
                const sourceStyle =
                  sourcePixels[index]?.style;

                if (sourceStyle) {
                  return sourceStyle;
                }

                return {
                  backgroundColour:
                    fadeCssColour(
                      targetStyle
                        .backgroundColour,
                      0
                    ),

                  borderColour:
                    fadeCssColour(
                      targetStyle
                        .borderColour,
                      0
                    ),

                  radius:
                    0,

                  pointStyle:
                    targetStyle.pointStyle
                };
              }
            );

          return {
            kind:
              'point',

            transitionDataset: {
              ...targetDataset,

              data:
                startData,

              pointBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointHoverBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointHoverBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHoverRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHitRadius:
                0,

              pointStyle:
                targetDataset.pointStyle ||
                'circle'
            },

            targetDataset,
            startData,
            targetData,
            startStyles,
            targetStyles
          };
        }
      );
    }

    function createDepartingLinePlans(
      geometry,
      targetDatasets
    ) {
      const targetRoles =
        new Set(
          targetDatasets
            .filter(
              isLineDataset
            )
            .map(
              dataset =>
                dataset.datasetRole
            )
        );

      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return geometry.lineGroups
        .filter(
          group =>
            !targetRoles.has(
              group.role
            )
        )
        .map(group => {
          const data =
            group.pixels.map(
              pixel => ({
                x:
                  xScale.getValueForPixel(
                    pixel.x
                  ),

                y:
                  yScale.getValueForPixel(
                    pixel.y
                  )
              })
            );

          const colour =
            group.style.borderColour ||
            '#777777';

          const width =
            Number(
              group.style.borderWidth
            ) ||
            1;

          return {
            dataset: {
              type:
                'line',

              datasetRole:
                'transitionGhost',

              data,

              parsing:
                false,

              showLine:
                true,

              clip:
                false,

              fill:
                false,

              order:
                20,

              borderColor:
                colour,

              backgroundColor:
                colour,

              borderWidth:
                width,

              borderCapStyle:
                'round',

              borderJoinStyle:
                'round',

              pointRadius:
                0,

              pointHoverRadius:
                0,

              pointHitRadius:
                0,

              tension:
                0
            },

            colour,
            width
          };
        });
    }
    function animateViewMorph(
      model,
      duration
    ) {
      PFFCharts.runViewMorph({
        chart,
        model,
        duration,
        xAxisFade,
        currentXAxisOptions,
        captureRenderedGeometry,
        captureXAxisSnapshot:
          safeCaptureXAxisSnapshot,
        getXAxisChangeMap,
        createFadingXAxisOptions,
        createYAxisOptions,
        createTransitionPlans,
        createDepartingLinePlans,
        animationController,
        setCurrentXAxisOptions(value) {
          currentXAxisOptions =
            value;
        },
        setInteractionLocked(value) {
          interactionLocked =
            value;
        },
        setViewMorphInProgress(value) {
          viewMorphInProgress =
            value;
        },
        onComplete() {
          updateReaggregateButton();
        }
      });
    }

    function createChart() {
      const model =
        buildViewModel(
          activeView
        );

      currentXAxisOptions =
        model.xScale;

      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type:
              'scatter',

            data: {
              datasets:
                model.datasets
            },

            options: {
              responsive:
                true,

              maintainAspectRatio:
                false,

              resizeDelay:
                0,

              devicePixelRatio:
                Math.min(
                  window.devicePixelRatio ||
                  1,
                  3
                ),

              animation: {
                duration:
                  0
              },

              transitions: {
                resize: {
                  animation: {
                    duration:
                      0
                  }
                },

                active: {
                  animation: {
                    duration:
                      170,

                    easing:
                      'easeOutCubic'
                  }
                }
              },

              layout: {
                autoPadding:
                  false,

                padding: {
                  top: 4,
                  right: 4,
                  bottom: 0,
                  left: 0
                }
              },

              interaction: {
                mode:
                  'nearest',

                axis:
                  'xy',

                intersect:
                  true,

                includeInvisible:
                  false
              },

              onHover:
                handleChartHover,

              onClick:
                handleChartClick,

              plugins: {
                legend: {
                  display:
                    false
                },

                tooltip:
                  PFFCharts.tooltipOptions({
                    padding: 9,
                    bodySpacing: 0,
                    footerColor: '#69718a',
                    footerMarginTop: 4,

                    footerFont: {
                      family: 'Lato',
                      size: 11,
                      weight: '400'
                    },

                    filter(
                      item,
                      index,
                      tooltipItems
                    ) {
                      if (interactionLocked) {
                        return false;
                      }

                      const signature =
                        tooltipEntrySignature(
                          item
                        );

                      const allIdentical =
                        Boolean(signature) &&
                        tooltipItems.length > 1 &&
                        tooltipItems.every(
                          tooltipItem =>
                            tooltipEntrySignature(
                              tooltipItem
                            ) === signature
                        );

                      item.pffTooltipVisibleIndex =
                        allIdentical
                          ? 0
                          : index;

                      item.pffTooltipVisibleCount =
                        allIdentical
                          ? 1
                          : tooltipItems.length;

                      return (
                        !allIdentical ||
                        index === 0
                      );
                    },

                    callbacks: {
                      title(items) {
                        return tooltipTitle(
                          items?.[0]
                        );
                      },

                      label(item) {
                        return tooltipLabel(
                          item
                        );
                      },

                      afterLabel(item) {
                        const visibleIndex =
                          Number(
                            item
                              ?.pffTooltipVisibleIndex
                          );

                        const visibleCount =
                          Number(
                            item
                              ?.pffTooltipVisibleCount
                          );

                        return (
                          visibleCount > 1 &&
                          visibleIndex <
                            visibleCount - 1
                        )
                          ? ' '
                          : '';
                      },

                      footer(items) {
                        const count =
                          identicalTooltipCount(
                            items?.[0]
                          );

                        return count > 1
                          ? `×${count} identical submissions`
                          : '';
                      }
                    }
                  })
              },

              scales: {
                x:
                  model.xScale,

                y:
                  createYAxisOptions()
              }
            },

            plugins: [
              xAxisFadePlugin,
              rateYAxisPlugin,
              variableAxisTickPlugin,
              bubbleLabelPlugin,
              interactionNotePlugin
            ]
          }
        );

      const initialYAxisRange =
        yAxisTargetForView(
          activeView
        );

      setDisplayedYAxisRange(
        initialYAxisRange
      );

      if (
        activeView === 'location' ||
        activeView === 'employer'
      ) {
        applyBubbleAggregateRange(
          activeView,
          initialYAxisRange
        );

        chart.update('none');
      }

      updateLegend(
        model.legendItems,
        false
      );

      updateChartNote(
        model.note
      );
    }

    function applyView(
      nextView,
      animate = true
    ) {
      if (
        !chart ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      activeView = nextView;

      lastAggregateClickKey = null;
      lastAggregateClickTime = 0;

      const targetYAxisRange =
        yAxisTargetForView(
          activeView
        );

      if (
        activeView === 'location' ||
        activeView === 'employer'
      ) {
        applyBubbleAggregateRange(
          activeView,
          targetYAxisRange
        );
      }

      const model =
        buildViewModel(
          activeView
        );

      PFF.animateTextChange(
        chartHeadingDetail,
        VIEW_CONFIG[
          activeView
        ].headingDetail
      );

      tabsController?.set(
        activeView,
        {
          notify: false
        }
      );

      updateLegend(
        model.legendItems,
        animate
      );

      updateChartNote(
        model.note
      );

      updateReaggregateButton();

      if (!animate) {
        cancelYAxisRangeAnimation();

        setDisplayedYAxisRange(
          targetYAxisRange
        );

        currentXAxisOptions =
          model.xScale;

        chart.options.animation.duration =
          0;

        chart.data.datasets =
          model.datasets;

        chart.options.scales.x =
          model.xScale;

        chart.options.scales.y =
          createYAxisOptions();

        chart.update('none');
        return;
      }

      animateDisplayedYAxisRange(
        targetYAxisRange,
        CONFIG.transitionMs
      );

      animateViewMorph(
        model,
        CONFIG.transitionMs
      );
    }

    function requestViewSwitch(
      nextView
    ) {
      if (
        nextView === activeView ||
        interactionLocked ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      const currentBubbleStore =
        bubbleStores[
          activeView
        ];

      if (
        currentBubbleStore?.splitKeys.size
      ) {
        const nextYAxisRange =
          yAxisTargetForView(
            nextView
          );

        animateReaggregation(
          () => {
            applyView(
              nextView,
              true
            );
          },
          nextYAxisRange
        );

        return;
      }

      applyView(
        nextView,
        true
      );
    }
    function updateLegend(
      items,
      animate = true
    ) {
      legendController?.update(
        items,
        animate
      );
    }

    function updateChartNote(note) {
      chartNote.textContent =
        note || '';

      chartNote.classList.toggle(
        'is-hidden',
        !note
      );
    }





    function updateReaggregateButton() {
      const store =
        bubbleStores[
          activeView
        ];

      const shouldShow =
        Boolean(
          store &&
          (
            store.splitKeys.size > 0 ||
            store.mergingKeys.size > 0
          )
        );

      reaggregateButton.classList.toggle(
        'is-hidden',
        !shouldShow
      );

      reaggregateButton.setAttribute(
        'aria-hidden',
        String(!shouldShow)
      );

      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;

      reaggregateButton.disabled =
        interactionLocked;
    }

    function createRawBubblePoints(
      view,
      categoryKey
    ) {
      const store =
        bubbleStores[view];

      const aggregatePoint =
        store.aggregates.find(
          point =>
            point.categoryKey ===
            categoryKey
        );

      const categoryRows =
        store.rowsByKey.get(
          categoryKey
        ) || [];

      if (
        !aggregatePoint ||
        !categoryRows.length
      ) {
        return [];
      }

      const rateGroups =
        new Map();

      categoryRows.forEach(row => {
        const key =
          String(row.hourlyRate);

        if (!rateGroups.has(key)) {
          rateGroups.set(
            key,
            []
          );
        }

        rateGroups.get(key).push(
          row
        );
      });

      const points = [];

      rateGroups.forEach(groupRows => {
        const pointCount =
          groupRows.length;

        const availableHalfSpan =
          Math.max(
            0,

            Math.min(
              aggregatePoint.x - 5,
              95 - aggregatePoint.x
            )
          );

        const halfSpan =
          Math.min(
            17,

            Math.max(
              0,
              (pointCount - 1) *
              1.5
            ),

            availableHalfSpan
          );

        groupRows.forEach(
          (row, index) => {
            const targetX =
              pointCount === 1
                ? aggregatePoint.x
                : aggregatePoint.x -
                  halfSpan +
                  index /
                  (pointCount - 1) *
                  halfSpan *
                  2;

            points.push({
              kind:
                'bubbleRaw',

              bubbleView:
                view,

              categoryKey,

              label:
                aggregatePoint.label,

              fullName:
                aggregatePoint.fullName,

              x:
                aggregatePoint.x,

              y:
                aggregatePoint.y,

              targetX,

              targetY:
                row.hourlyRate,

              colour:
                aggregatePoint.colour,

              statistics:
                aggregatePoint.statistics,

              ...row
            });
          }
        );
      });

      return points;
    }

    function animateBubbleSplit(
      view,
      categoryKey
    ) {
      const store =
        bubbleStores[view];

      if (
        activeView !== view ||
        interactionLocked ||
        store.splitKeys.has(
          categoryKey
        ) ||
        !chart
      ) {
        return;
      }

      const newPoints =
        createRawBubblePoints(
          view,
          categoryKey
        );

      if (!newPoints.length) {
        return;
      }

      const shouldDim =
        store.splitKeys.size === 0;

      const startYAxisRange =
        copyDisplayedYAxisRange();

      const targetYAxisRange =
        fixedYAxisRange();

      cancelYAxisRangeAnimation();
      interactionLocked = true;

      store.splitKeys.add(
        categoryKey
      );

      store.splitProgress.set(
        categoryKey,
        0
      );

      newPoints.forEach(point => {
        point.startX = point.x;
        point.startY = point.y;
      });

      store.rawPoints.push(
        ...newPoints
      );

      chart.data.datasets[1].data =
        store.rawPoints;

      chart.update('none');
      updateReaggregateButton();

      animationController.run({
        duration:
          CONFIG.splitAnimationMs,

        easing:
          easeInOutCubic,

        onFrame(progress) {
          const currentYAxisRange =
            interpolateYAxisRange(
              startYAxisRange,
              targetYAxisRange,
              progress
            );

          setDisplayedYAxisRange(
            currentYAxisRange
          );

          applyBubbleAggregateRange(
            view,
            currentYAxisRange
          );

          store.splitProgress.set(
            categoryKey,
            progress
          );

          if (shouldDim) {
            store.dimProgress =
              progress;
          }

          newPoints.forEach(point => {
            point.x =
              point.startX +
              (
                point.targetX -
                point.startX
              ) *
              progress;

            point.y =
              point.startY +
              (
                point.targetY -
                point.startY
              ) *
              progress;
          });

          chart.update('none');
        },

        onComplete() {
          setDisplayedYAxisRange(
            targetYAxisRange
          );

          applyBubbleAggregateRange(
            view,
            targetYAxisRange
          );

          newPoints.forEach(point => {
            point.x = point.targetX;
            point.y = point.targetY;
          });

          store.splitProgress.delete(
            categoryKey
          );

          if (shouldDim) {
            store.dimProgress = 1;
          }

          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();
        }
      });
    }

    function animateReaggregation(
      onCompleteCallback = null,
      targetYAxisRangeOverride = null
    ) {
      const store =
        bubbleStores[
          activeView
        ];

      if (
        !store ||
        interactionLocked ||
        !chart ||
        store.splitKeys.size === 0
      ) {
        return;
      }

      const view =
        activeView;

      const startYAxisRange =
        copyDisplayedYAxisRange();

      const targetYAxisRange =
        normaliseYAxisRange(
          targetYAxisRangeOverride ||
          deriveBubbleYAxisRange(
            view
          )
        );

      cancelYAxisRangeAnimation();
      interactionLocked = true;

      store.mergeProgress = 0;

      store.splitKeys.forEach(
        categoryKey => {
          store.mergingKeys.add(
            categoryKey
          );
        }
      );

      store.rawPoints.forEach(
        point => {
          const aggregatePoint =
            store.aggregates.find(
              item =>
                item.categoryKey ===
                point.categoryKey
            );

          point.mergeStartX =
            point.x;

          point.mergeStartY =
            point.y;

          point.mergeTargetX =
            aggregatePoint?.x ??
            point.x;
        }
      );

      chart.update('none');
      updateReaggregateButton();

      animationController.run({
        duration:
          CONFIG.mergeAnimationMs,

        easing:
          easeInOutCubic,

        onFrame(progress) {
          const currentYAxisRange =
            interpolateYAxisRange(
              startYAxisRange,
              targetYAxisRange,
              progress
            );

          setDisplayedYAxisRange(
            currentYAxisRange
          );

          applyBubbleAggregateRange(
            view,
            currentYAxisRange
          );

          store.mergeProgress =
            progress;

          store.dimProgress =
            1 - progress;

          store.rawPoints.forEach(
            point => {
              const aggregatePoint =
                store.aggregates.find(
                  item =>
                    item.categoryKey ===
                    point.categoryKey
                );

              const currentTargetY =
                aggregatePoint?.y ??
                point.mergeStartY;

              point.x =
                point.mergeStartX +
                (
                  point.mergeTargetX -
                  point.mergeStartX
                ) *
                progress;

              point.y =
                point.mergeStartY +
                (
                  currentTargetY -
                  point.mergeStartY
                ) *
                progress;
            }
          );

          chart.update('none');
        },

        onComplete() {
          setDisplayedYAxisRange(
            targetYAxisRange
          );

          applyBubbleAggregateRange(
            view,
            targetYAxisRange
          );

          store.rawPoints = [];

          chart.data.datasets[1].data =
            store.rawPoints;

          store.splitKeys.clear();
          store.splitProgress.clear();
          store.mergingKeys.clear();
          store.mergeProgress = 0;
          store.dimProgress = 0;

          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();

          onCompleteCallback?.();
        }
      });
    }

    reaggregateButton.addEventListener(
      'click',
      () => {
        animateReaggregation();
      }
    );

    tabsController =
      PFF.setupTabs({
        tabList,
        tabs:
          chartTabs,
        scroller:
          tabList,
        leftButton:
          tabScrollLeft,
        rightButton:
          tabScrollRight,
        valueAttribute:
          'view',
        initialValue:
          activeView,
        controlled:
          true,
        onRequest(nextView) {
          requestViewSwitch(
            nextView
          );
        }
      });

    legendController =
      PFFCharts.setupDisplayLegend({
        legend:
          chartLegend,
        leftButton:
          legendScrollLeft,
        rightButton:
          legendScrollRight
      });

    interactionsController =
      PFFCharts.setupChartInteractions({
        canvas:
          chartCanvas,
        getChart() {
          return chart;
        }
      });

    responsiveController =
      PFFCharts.createResponsiveController({
        getChart() {
          return chart;
        },
        observe: [
          app,
          chartShell
        ],
        applyResponsiveChartOptions:
          false,
        onRefresh() {
          if (
            chart &&
            !interactionLocked &&
            !viewMorphInProgress &&
            (
              activeView === 'location' ||
              activeView === 'employer'
            ) &&
            !bubbleStores[
              activeView
            ]?.splitKeys.size
          ) {
            const targetYAxisRange =
              deriveBubbleYAxisRange(
                activeView
              );

            setDisplayedYAxisRange(
              targetYAxisRange
            );

            applyBubbleAggregateRange(
              activeView,
              targetYAxisRange
            );

            chart.update('none');
          }

          tabsController?.update();
          legendController?.refresh();
        }
      });

    async function loadDashboard() {
      await PFF.initialiseApp({
        app,
        status:
          statusElement,
        forceCached:
          FORCE_CACHED_DATA,
        cacheKey:
          CONFIG.localCacheKey,
        minRows:
          1,
        dataSourceOptions: {
          indicator:
            dataSourceIndicator,
          text:
            dataSourceText
        },
        loadLive() {
          return PFFCharts.loadGVizSheet({
            sheetId:
              CONFIG.sheetId,
            sheetName:
              CONFIG.sheetName,
            range:
              CONFIG.range,
            headers:
              '1',
            query:
              'select *',
            timeoutMs:
              CONFIG.fetchTimeoutMs
          });
        },
        parseLive(table) {
          const parsedRows =
            normaliseRows(
              table?.rows || []
            );

          if (!parsedRows.length) {
            throw new Error(
              'No valid hourly rate rows were found in columns A to K'
            );
          }

          return parsedRows;
        },
        loadRemoteCache() {
          return PFFCharts.loadAppsScriptCache({
            url:
              CACHE_WEB_APP_URL,
            appKey:
              CACHE_APP_KEY,
            timeoutMs:
              CACHE_FETCH_TIMEOUT_MS
          });
        },
        parseRemoteCache(response) {
          if (
            !response?.cachedAt ||
            Number.isNaN(
              Date.parse(
                response.cachedAt
              )
            )
          ) {
            throw new Error(
              'Cached locum rate data are unavailable'
            );
          }

          const sourceRows =
            Array.isArray(
              response?.data?.rows
            )
              ? response.data.rows
              : [];

          const parsedRows =
            sourceRows
              .map(
                (row, sourceIndex) => {
                  if (
                    !Array.isArray(row) ||
                    row.length < 9
                  ) {
                    return null;
                  }

                  return {
                    sourceIndex,
                    date:
                      parseDate(row[0]),
                    hourlyRate:
                      toNumber(row[1]),
                    experience:
                      toNumber(row[2]),
                    patientsPerDay:
                      toNumber(row[3]),
                    rurality:
                      normaliseRurality(
                        row[4]
                      ),
                    specialtyServices:
                      cleanText(
                        row[5]
                      ),
                    state:
                      normaliseState(
                        row[6]
                      ),
                    structure:
                      normaliseStructure(
                        row[7]
                      ),
                    employerKey:
                      normaliseEmployer(
                        row[8]
                      )
                  };
                }
              )
              .filter(Boolean)
              .filter(
                row =>
                  Number.isFinite(
                    row.hourlyRate
                  ) &&
                  row.hourlyRate >
                    CONFIG.minimumHourlyRate &&
                  row.hourlyRate <=
                    CONFIG.maximumHourlyRate
              )
              .map(row => ({
                ...row,
                experience:
                  Number.isFinite(
                    row.experience
                  )
                    ? row.experience
                    : null
              }));

          if (!parsedRows.length) {
            throw new Error(
              'No valid cached hourly rate rows were found'
            );
          }

          return parsedRows;
        },
        onLiveError(error) {
          console.warn(
            'Live Google Sheets locum rate data could not be used',
            error
          );
        },
        onRemoteCacheError(error) {
          console.warn(
            'Cached locum rate backend data could not be used',
            error
          );
        },
        render(loaded) {
          rows =
            loaded.rows;

          rebuildBubbleStore(
            'location'
          );

          rebuildBubbleStore(
            'employer'
          );

          createChart();

          tabsController?.set(
            activeView,
            {
              animate: false,
              notify: false
            }
          );

          return chart;
        },
        onReady() {
          responsiveController?.refresh();
        },
        onError() {
          dataSourceIndicator.style.display =
            'none';
        },
        errorMessage:
          '⚠ Live and cached locum rate data are currently unavailable'
      });
    }

    loadDashboard();
  </script>
</body>
</html>
