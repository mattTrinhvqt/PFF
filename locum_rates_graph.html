<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Locum Rates Data</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js?v=1.2.11-20260917"></script>

  <style>
    /* Locum Rates-specific components only. Shared PFF chart styling lives in pff_chart_core.js. */

    .chart-heading-row {
      position: relative;
      display: block;
      width: 100%;
      height: 30px;
      min-width: 0;
      min-height: 30px;
      flex: 0 0 auto;
      margin: 0;
    }

    .chart-heading {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 4px 116px 0 0;
      overflow: visible;
      color: var(--pff-ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
      will-change: opacity;
    }

    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;
      display: inline-flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      color: var(--pff-muted);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--pff-ink);
      border-color: var(--pff-ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--pff-purple);
      font-size: 15px;
      line-height: 1;
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .chart-options-row .legend-nav {
      min-width: 54px;
      flex: 1 1 auto;
    }

    .chart-note {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      max-width: min(230px, calc(100% - 80px));
      padding: 5px 7px;
      color: var(--pff-muted);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(105, 113, 138, 0.16);
      border-radius: 4px;
      font-size: 8.5px;
      line-height: 1.3;
      pointer-events: none;
    }

    .chart-note.is-hidden {
      display: none;
    }

    @media (max-width: 430px) {
      .chart-heading-row {
        height: 29px;
        min-height: 29px;
      }

      .chart-heading {
        padding-top: 4px;
        padding-right: 108px;
        font-size: 14px;
        line-height: 21px;
      }

      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .chart-note {
        max-width: min(205px, calc(100% - 68px));
        font-size: 8px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 100px;
        font-size: 13px;
      }

      .reaggregate-button {
        font-size: 9px;
      }
    }
  </style>
</head>

<body class="pff-chart-app">

        <button

  <script>
    const CONFIG = {
      sheetId: '1wmrmNS4cz-_aPKnyBVg7-SShbhs6czMNh07UjyLo04s',
      sheetName: 'Data',
      range: 'A:K',

    };

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'locum-rates-data';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Testing switch only.

     */
    const FORCE_CACHED_DATA =
      false;

    const VIEW_CONFIG = {
      employer: {

      },
      experience: {
        headingDetail: 'by experience'
      },
      rurality: {
        headingDetail: 'by rurality'
      },

      },

    };

    const STATE_ORDER = [
      'NSW',
      'QLD',

      'ACT',

      'NT',

    ];

    const STATE_COLOURS =

    const RURALITY_ORDER = [
      'MM1',

      'MM4',
      'MM5',

    ];

    const RURALITY_COLOURS =
      PFF.mmmColours;

    const STRUCTURE_ORDER = [
      'Unspecified',

    ];

    const STRUCTURE_COLOURS = {
      Unspecified: '#bfc3c7',
      'Sole trader': '#5a3be7',
      'Company/trust': '#00b26f'
    };

    const EMPLOYER_FRONT_NAMES = Object.freeze({
      '1001': '1001 Optometry',
      bn: 'Bailey Nelson',
      bupa: 'Bupa Optical',
      cw: 'Chemist Warehouse Optometry',
      costco: 'Costco Optical',
      dresden: 'Dresden Vision',
      eyeconcepts: 'Eye Concepts',
      gm: 'George & Matilda Eyecare',
      hcf: 'HCF Eyecare',
      icontact: 'iContact',
      indie: 'Independent',
      ophthal: 'Ophthalmologist',
      opsm: 'OPSM (incl. L&P, EyeQ)',
      obnp: 'Optical by National Pharmacies',
      ow: 'Oscar Wylee',
      other: 'Other (e.g., uni, hospital, govt, not-for-profit)',
      ss: 'Specsavers',
      th: 'Teachers Health',
      toc: 'The Optical Company (incl. NIB)',
      toss: 'The Optical Superstore'
    });

    const EMPLOYERS = Object.freeze(
      PFF.employers.map(employer =>
        Object.freeze({
          ...employer,
          fullName:
            EMPLOYER_FRONT_NAMES[employer.key] ||
            employer.fullName
        })
      )
    );

    const EMPLOYER_BY_KEY = new Map(
      EMPLOYERS.map(employer => [
        employer.key,
        employer
      ])
    );

    const YEAR_MS =
      365.2425 * 86400000;

    const app =
      document.getElementById('app');

    const statusElement =
      document.getElementById('status');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const reaggregateButton =
      document.getElementById('reaggregateButton');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartTabs =
      [...document.querySelectorAll('.chart-tab')];

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartNote =
      document.getElementById('chartNote');

    const chartShell =
      document.getElementById('chartShell');

    const chartCanvas =
      document.getElementById('locumChart');

    let chart = null;
    let rows = [];
    let activeView = 'employer';
    let interactionLocked = false;
    let viewMorphInProgress = false;
    let currentXAxisOptions = null;
    let tabsController = null;
    let legendController = null;
    let responsiveController = null;
    let interactionsController = null;

    const animationController =
      PFFCharts.createAnimationController();


    const yAxisModel = {
      minimum: 40,
      maximum: 160,
      majorStep: 10,
      minorStep: 5
    };

    const displayedYAxisRange = {
      minimum: yAxisModel.minimum,
      maximum: yAxisModel.maximum
    };

    const yAxisRangeAnimation = {
      token: 0,
      raf: null
    };

    function fixedYAxisRange() {
      return {
        minimum: yAxisModel.minimum,
        maximum: yAxisModel.maximum
      };
    }

    function normaliseYAxisRange(range) {
      const minimum = Number(range?.minimum);
      const maximum = Number(range?.maximum);

      if (
        !Number.isFinite(minimum) ||
        !Number.isFinite(maximum) ||
        maximum <= minimum
      ) {
        return fixedYAxisRange();
      }

      return { minimum, maximum };
    }

    function copyDisplayedYAxisRange() {
      return {
        minimum: displayedYAxisRange.minimum,
        maximum: displayedYAxisRange.maximum
      };
    }

    function interpolateYAxisRange(
      fromRange,
      toRange,
      progress
    ) {
      const from = normaliseYAxisRange(fromRange);
      const to = normaliseYAxisRange(toRange);

      return {
        minimum:
          from.minimum +
          (to.minimum - from.minimum) * progress,

        maximum:
          from.maximum +
          (to.maximum - from.maximum) * progress
      };
    }

    function setDisplayedYAxisRange(range) {
      const normalised = normaliseYAxisRange(range);

      displayedYAxisRange.minimum =
        normalised.minimum;

      displayedYAxisRange.maximum =
        normalised.maximum;
    }

    function rangesNearlyEqual(
      first,
      second,
      tolerance = 0.0001
    ) {
      const a = normaliseYAxisRange(first);
      const b = normaliseYAxisRange(second);

      return (
        Math.abs(a.minimum - b.minimum) <= tolerance &&
        Math.abs(a.maximum - b.maximum) <= tolerance
      );
    }

    const xAxisFade = {
      active: false,
      progress: 1,
      from: null,
      changes: {
        ticks: false,
        labels: false,
        title: false,
        border: false
      }
    };

    function getXAxisChangeMap(
      previousOptions,
      nextOptions
    ) {
      const previousView =
        previousOptions?.pffTickView || '';

      const nextView =
        nextOptions?.pffTickView || '';

      const previousAxisVisible =
        previousOptions?.display !== false;

      const nextAxisVisible =
        nextOptions?.display !== false;

      const previousTicksVisible =
        previousAxisVisible &&
        previousOptions?.grid?.drawTicks !== false &&
        previousView !== 'hidden';

      const nextTicksVisible =
        nextAxisVisible &&
        nextOptions?.grid?.drawTicks !== false &&
        nextView !== 'hidden';

      const previousLabelsVisible =
        previousAxisVisible &&
        previousOptions?.ticks?.display !== false &&
        previousView !== 'hidden';

      const nextLabelsVisible =
        nextAxisVisible &&
        nextOptions?.ticks?.display !== false &&
        nextView !== 'hidden';

      const previousTitleText =
        previousOptions?.title?.text;

      const nextTitleText =
        nextOptions?.title?.text;

      const previousTitleHasText =
        Array.isArray(previousTitleText)
          ? previousTitleText.some(Boolean)
          : Boolean(previousTitleText);

      const nextTitleHasText =
        Array.isArray(nextTitleText)
          ? nextTitleText.some(Boolean)
          : Boolean(nextTitleText);

      const previousTitleVisible =
        previousAxisVisible &&
        previousOptions?.title?.display !== false &&
        previousTitleHasText;

      const nextTitleVisible =
        nextAxisVisible &&
        nextOptions?.title?.display !== false &&
        nextTitleHasText;

      const previousBorderVisible =
        previousAxisVisible &&
        previousOptions?.border?.display !== false;

      const nextBorderVisible =
        nextAxisVisible &&
        nextOptions?.border?.display !== false;

      const previousTickSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        tickLength: previousOptions?.grid?.tickLength
      });

      const nextTickSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        tickLength: nextOptions?.grid?.tickLength
      });

      const previousLabelSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        colour: previousOptions?.ticks?.color,
        font: previousOptions?.ticks?.font || {}
      });

      const nextLabelSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        colour: nextOptions?.ticks?.color,
        font: nextOptions?.ticks?.font || {}
      });

      const previousTitleSignature = JSON.stringify({
        text: previousTitleText,
        colour: previousOptions?.title?.color,
        font: previousOptions?.title?.font || {},
        padding: previousOptions?.title?.padding || {}
      });

      const nextTitleSignature = JSON.stringify({
        text: nextTitleText,
        colour: nextOptions?.title?.color,
        font: nextOptions?.title?.font || {},
        padding: nextOptions?.title?.padding || {}
      });

      const previousBorderSignature = JSON.stringify({
        colour: previousOptions?.border?.color,
        width: previousOptions?.border?.width
      });

      const nextBorderSignature = JSON.stringify({
        colour: nextOptions?.border?.color,
        width: nextOptions?.border?.width
      });

      return {
        ticks:
          previousTicksVisible !== nextTicksVisible ||
          (
            previousTicksVisible &&
            nextTicksVisible &&
            previousTickSignature !== nextTickSignature
          ),

        labels:
          previousLabelsVisible !== nextLabelsVisible ||
          (
            previousLabelsVisible &&
            nextLabelsVisible &&
            previousLabelSignature !== nextLabelSignature
          ),

        title:
          previousTitleVisible !== nextTitleVisible ||
          (
            previousTitleVisible &&
            nextTitleVisible &&
            previousTitleSignature !== nextTitleSignature
          ),

        border:
          previousBorderVisible !== nextBorderVisible ||
          (
            previousBorderVisible &&
            nextBorderVisible &&
            previousBorderSignature !== nextBorderSignature
          )
      };
    }

    function isMajorXAxisTick(value, view) {
      if (!Number.isFinite(value)) {
        return false;
      }

      if (view === 'experience') {
        return value % 5 === 0;
      }

      if (view === 'date') {
        const month =
          new Date(value).getUTCMonth();

        return [0, 3, 6, 9].includes(month);
      }

      return false;
    }

    function isMajorYAxisTick(value) {
      if (!Number.isFinite(value)) {
        return false;
      }

      return (
        (value - yAxisModel.minimum) %
        yAxisModel.majorStep === 0
      );
    }

    function drawVariableAxisTicks(
      context,
      scale,
      axis,
      view
    ) {
      if (!scale) {
        return;
      }

      const ticks =
        scale.ticks || [];

      if (!ticks.length) {
        return;
      }

      const tickColour =
        axis === 'x'
          ? fadeCssColour(
              '#151515',
              getIncomingXAxisOpacity('ticks')
            )
          : '#151515';

      context.save();
      context.lineCap = 'butt';

      ticks.forEach((tick, index) => {
        const value =
          Number(tick.value);

        const pixel =
          scale.getPixelForTick(index);

        if (!Number.isFinite(pixel)) {
          return;
        }

        const isMajor =
          axis === 'x'
            ? isMajorXAxisTick(value, view)
            : isMajorYAxisTick(value);

        const tickLength =
          axis === 'x'
            ? isMajor
              ? 6
              : 2
            : isMajor
              ? 5
              : 2;

        const tickWidth =
          isMajor
            ? 1.1
            : 0.7;

        context.beginPath();
        context.strokeStyle = tickColour;
        context.lineWidth = tickWidth;

        if (axis === 'x') {
          context.moveTo(
            pixel,
            scale.top
          );

          context.lineTo(
            pixel,
            scale.top + tickLength
          );
        } else {
          context.moveTo(
            scale.right,
            pixel
          );

          context.lineTo(
            scale.right - tickLength,
            pixel
          );
        }

        context.stroke();
      });

      context.restore();
    }

    function resolveAxisValue(
      value,
      context,
      fallback
    ) {
      try {
        return typeof value === 'function'
          ? value(context)
          : value ?? fallback;
      } catch (_) {
        return fallback;
      }
    }

    function normaliseAxisPadding(value) {
      const numericValue =
        typeof value === 'number' ||
        typeof value === 'string'
          ? Number(value)
          : NaN;

      if (Number.isFinite(numericValue)) {
        return {
          top: numericValue,
          right: numericValue,
          bottom: numericValue,
          left: numericValue
        };
      }

      return {
        top: Number(value?.top) || 0,
        right: Number(value?.right) || 0,
        bottom: Number(value?.bottom) || 0,
        left: Number(value?.left) || 0
      };
    }

    function getAxisFont(
      fontOptions,
      fallbackSize = 10,
      fallbackWeight = '400'
    ) {
      const family =
        fontOptions?.family ||
        Chart.defaults.font.family ||
        "'Lato', sans-serif";

      const size =
        Number(fontOptions?.size) ||
        fallbackSize;

      const weight =
        fontOptions?.weight ||
        fallbackWeight;

      const style =
        fontOptions?.style
          ? `${fontOptions.style} `
          : '';

      const configuredLineHeight =
        fontOptions?.lineHeight;

      let lineHeight =
        size * 1.2;

      if (typeof configuredLineHeight === 'string') {
        const text =
          configuredLineHeight.trim();

        const numericValue =
          parseFloat(text);

        if (Number.isFinite(numericValue)) {
          if (text.endsWith('px')) {
            lineHeight =
              numericValue;
          } else if (text.endsWith('%')) {
            lineHeight =
              size * numericValue / 100;
          } else {
            lineHeight =
              size * numericValue;
          }
        }
      } else if (
        Number.isFinite(
          Number(configuredLineHeight)
        )
      ) {
        lineHeight =
          size *
          Number(configuredLineHeight);
      }

      return {
        css:
          `${style}${weight} ${size}px ${family}`,

        lineHeight
      };
    }

    function captureXAxisSnapshot(
      scale,
      styleOptions = scale?.options
    ) {
      if (!scale || !styleOptions) {
        return null;
      }

      const tickOptions =
        styleOptions.ticks || {};

      const gridOptions =
        styleOptions.grid || {};

      const titleOptions =
        styleOptions.title || {};

      const borderOptions =
        styleOptions.border || {};

      const tickPadding =
        Number(tickOptions.padding) || 0;

      const ticks =
        (scale.ticks || []).map((tick, index) => {
          const context =
            typeof scale.getContext === 'function'
              ? scale.getContext(index)
              : {
                  chart,
                  scale,

          let label =

            typeof tickOptions.callback === 'function'

                tickOptions.callback.call(
                  scale,
                  tick.value,
                  index,
                  scale.ticks
                );
            } catch (_) {
              label =
                tick.value;
            }
          }

          const labelLines =
            Array.isArray(label)
              ? label.map(
                  line => String(line ?? '')
                )
              : [String(label ?? '')];

          const fontOptions =
            resolveAxisValue(
              tickOptions.font,
              context,
              tickOptions.font || {}
            );

          const font =
            getAxisFont(
              fontOptions,
              10,
              '400'
            );

          const tickValue =
            Number(tick.value);

          const isMajor =
            isMajorXAxisTick(
              tickValue,
              styleOptions.pffTickView

          const tickLength =
            isMajor
              ? 6
              : 2;

          const tickWidth =
            isMajor
              ? 1.1
              : 0.7;

          const configuredLayoutTickLength =
            Number(gridOptions.tickLength);

          const layoutTickLength =
            Number.isFinite(
              configuredLayoutTickLength
            )
              ? configuredLayoutTickLength
              : tickLength;

          return {
            x:
              scale.getPixelForTick(index),

            axisY:
              scale.top,

            labelY:
              scale.top +
              layoutTickLength +
              tickPadding +
              font.lineHeight / 2,

            labelLines,

            tickLength,
            tickWidth,

            showTick:

    function drawXAxisSnapshot(
      context,
      snapshot,
      opacities,
      offsetX = 0
    ) {
      if (!snapshot) {
        return;
      }

      const tickOpacity =
        clamp(
          Number(opacities?.ticks) || 0,
          0,
          1
        );

      const labelOpacity =
        clamp(
          Number(opacities?.labels) || 0,
          0,
          1
        );

      const titleOpacity =
        clamp(
          Number(opacities?.title) || 0,
          0,
          1
        );

      const borderOpacity =
        clamp(
          Number(opacities?.border) || 0,
          0,
          1
        );

      if (
        tickOpacity <= 0.001 &&
        labelOpacity <= 0.001 &&
        titleOpacity <= 0.001 &&
        borderOpacity <= 0.001
      ) {
        return;
      }

      context.save();
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.lineCap = 'butt';

      if (
        snapshot.border?.show &&
        borderOpacity > 0.001
      ) {
        context.globalAlpha =
          borderOpacity;

        context.beginPath();
        context.strokeStyle =
          snapshot.border.colour;

        context.lineWidth =
          snapshot.border.width;

        context.moveTo(
          snapshot.border.left + offsetX,
          snapshot.border.y
        );

        context.lineTo(
          snapshot.border.right + offsetX,
          snapshot.border.y
        );

        context.stroke();
      }

      snapshot.ticks.forEach(tick => {
        const x =
          tick.x + offsetX;

        if (
          tick.showTick &&
          tick.tickLength > 0 &&
          tickOpacity > 0.001
        ) {
          context.globalAlpha =
            tickOpacity;

          context.beginPath();
          context.strokeStyle =
            tick.tickColour;

          context.lineWidth =
            tick.tickWidth;

          context.moveTo(
            x,
            tick.axisY
          );

          context.lineTo(
            x,
            tick.axisY + tick.tickLength
          );

          context.stroke();
        }

        if (
          !tick.showLabel ||
          !tick.labelLines.some(Boolean) ||
          labelOpacity <= 0.001
        ) {
          return;
        }

        context.globalAlpha =
          labelOpacity;

        context.font =
          tick.font.css;

        context.fillStyle =
          tick.labelColour;

        const firstLineY =
          tick.labelY -
          (
            tick.labelLines.length - 1
          ) *
          tick.font.lineHeight / 2;

        tick.labelLines.forEach(
          (line, lineIndex) => {
            if (!line) {
              return;
            }

            context.fillText(
              line,
              x,
              firstLineY +
              lineIndex * tick.font.lineHeight
            );
          }
        );
      });

      if (
        snapshot.title.show &&
        titleOpacity > 0.001
      ) {
        context.globalAlpha =
          titleOpacity;

        context.font =
          snapshot.title.font.css;

        context.fillStyle =
          snapshot.title.colour;

        const firstLineY =
          snapshot.title.y -
          (
            snapshot.title.lines.length - 1
          ) *
          snapshot.title.font.lineHeight / 2;

        snapshot.title.lines.forEach(
          (line, lineIndex) => {
            if (!line) {
              return;
            }

            context.fillText(
              line,
              snapshot.title.x + offsetX,
              firstLineY +
              lineIndex *
              snapshot.title.font.lineHeight
            );
          }
        );
      }

      context.restore();
    }

    function rateYAxisTicks() {
      const range =
        normaliseYAxisRange(
          displayedYAxisRange
        );

      const first =
        Math.ceil(
          range.minimum /
          yAxisModel.minorStep
        ) *
        yAxisModel.minorStep;

      const last =
        Math.floor(
          range.maximum /
          yAxisModel.minorStep
        ) *
        yAxisModel.minorStep;

      const ticks = [];

      for (
        let value = first;
        value <= last + 0.000001;
        value += yAxisModel.minorStep
      ) {
        ticks.push({
          value,
          major:
            Math.abs(
              value /
              yAxisModel.majorStep -
              Math.round(
                value /
                yAxisModel.majorStep
              )
            ) <
            1e-8
        });
      }

      return ticks;
    }

      chartArea,
      value

      const range =
        normaliseYAxisRange(
          displayedYAxisRange

      const span =
        range.maximum -
        range.minimum;

      if (span <= 0) {
        return chartArea.bottom;
      }

      return (
        chartArea.bottom -
        (
          (value - range.minimum) /
          span
        ) *
        chartArea.height

       * Any tick that remains inside the visible range stays

       */
      return (
        y >= chartArea.top - 0.5 &&
        y <= chartArea.bottom + 0.5

    function getBaseBubbleRadius(
      respondents
    ) {
      return clamp(
        11 +
        Math.pow(
          respondents,
          0.78
        ) *
        3.15,
        18,
        66
      );
    }

    function buildBubblePositions(
      items
    ) {
      const sortedItems =
        items
          .slice()
          .sort(
            (first, second) =>
              first.y -
                second.y ||
              second.statistics.count -
                first.statistics.count ||
              first.fullName.localeCompare(
                second.fullName,
                'en-AU'
              )
          );

      const laneLastValues = [];
      const laneAssignments =
        new Map();

      sortedItems.forEach(item => {
        let laneIndex =
          laneLastValues.findIndex(
            previousValue =>
              item.y -
              previousValue >
              10
          );

        if (laneIndex === -1) {
          laneIndex =
            laneLastValues.length;

          laneLastValues.push(
            item.y
          );
        } else {
          laneLastValues[
            laneIndex
          ] =
            item.y;
        }

        laneAssignments.set(
          item.categoryKey,
          laneIndex
        );
      });

      const positionCount =
        Math.max(
          5,
          laneLastValues.length
        );

      return new Map(
        [...laneAssignments.entries()]
          .map(([key, laneIndex]) => [
            key,

            21 +
            laneIndex /
            Math.max(
              1,
              positionCount - 1
            ) *
            63
          ])
      );
    }

    function rebuildBubbleStore(view) {
      const store =
        bubbleStores[view];

      const config =
        bubbleConfig(view);

      store.categories =
        config.order.filter(
          categoryKey =>
            rows.some(
              row =>
                config.accessor(row) ===
                categoryKey

      store.rowsByKey =
        new Map();

      const items =
        store.categories.map(
          categoryKey => {
            const categoryRows =
              rows.filter(
                row =>
                  config.accessor(row) ===
                  categoryKey
              );

            const statistics =
              calculateStatistics(
                categoryRows.map(
                  row => row.hourlyRate

            store.rowsByKey.set(
              categoryKey,
              categoryRows
            );

            return {
              kind:
                'bubbleAggregate',

              bubbleView:
                view,

              categoryKey,

              label:
                config.label(
                  categoryKey
                ),

              fullName:
                config.fullName(
                  categoryKey
                ),

              x:
                21,

              y:
                statistics.median,

              rateY:
                statistics.median,

              baseRadius:
                getBaseBubbleRadius(
                  statistics.count
                ),

              colour:
                config.colour(
                  categoryKey
                ),

              statistics
            };
          }
        );

      const positions =
        buildBubblePositions(
          items
        );

      store.aggregates =
        items
          .map(item => ({
            ...item,

            x:
              positions.get(
                item.categoryKey
              ) ??
              21
          }))
          .sort(
            (first, second) =>
              second.y -
                first.y ||
              second.baseRadius -
                first.baseRadius
          );
    }

    function projectRateToBaseAxis(
      rate,
      range = displayedYAxisRange
    ) {
      const sourceRange =
        normaliseYAxisRange(range);

      const sourceSpan =
        sourceRange.maximum -
        sourceRange.minimum;

      const baseSpan =
        yAxisModel.maximum -
        yAxisModel.minimum;

      if (
        !Number.isFinite(rate) ||
        sourceSpan <= 0
      ) {
        return rate;
      }

      return (
        yAxisModel.minimum +
        (
          (rate - sourceRange.minimum) /
          sourceSpan
        ) *
        baseSpan
      );
    }

    function applyBubbleAggregateRange(
      view,
      range
    ) {
      const store =
        bubbleStores[view];

      if (!store) {
        return;
      }

      store.aggregates.forEach(
        aggregate => {
          const rate =
            Number.isFinite(
              aggregate.rateY
            )
              ? aggregate.rateY
              : aggregate.y;

          aggregate.y =
            projectRateToBaseAxis(
              rate,
              range
            );
        }
      );
    }

    function bubbleRadiusScale(
      activeChart = chart
    ) {
      return Math.min(
        clamp(
          (
            activeChart?.width ||
            chartCanvas.clientWidth ||
            520
          ) /
          520,
          0.78,
          1.05
        ),

        clamp(
          (
            activeChart?.height ||
            chartCanvas.clientHeight ||
            585
          ) /
          585,
          0.68,
          1.04
        )
      );
    }

    function bubbleChartAreaHeight() {
      const measured =
        Number(
          chart?.chartArea?.height
        );

      if (
        Number.isFinite(measured) &&
        measured > 80
      ) {
        return measured;
      }

      return Math.max(
        260,
        (
          chart?.height ||
          chartCanvas.clientHeight ||
          585
        ) -
        110
      );
    }

    function deriveBubbleYAxisRange(view) {
      const store =
        bubbleStores[view];

      if (
        !store ||
        !store.aggregates.length
      ) {
        return fixedYAxisRange();
      }

      const scale =
        bubbleRadiusScale();

      const height =
        bubbleChartAreaHeight();

      const extents =
        store.aggregates
          .map(aggregate => ({
            rate:
              Number(
                aggregate.rateY
              ),

            radiusPx:
              aggregate.baseRadius *
              scale +
              CONFIG.bubbleYAxisPaddingPx
          }))
          .filter(item =>
            Number.isFinite(
              item.rate
            )
          );

      if (!extents.length) {
        return fixedYAxisRange();
      }

      const centreMinimum =
        Math.min(
          ...extents.map(
            item => item.rate
          )
        );

      const centreMaximum =
        Math.max(
          ...extents.map(
            item => item.rate
          )
        );

      let minimum = centreMinimum;
      let maximum = centreMaximum;

      let span =
        Math.max(
          CONFIG.bubbleYAxisMinimumSpan,
          maximum - minimum
        );

      for (
        let iteration = 0;
        iteration < 5;
        iteration += 1
      ) {
        const unitsPerPixel =
          span / height;

        minimum =
          Math.min(
            ...extents.map(
              item =>
                item.rate -
                item.radiusPx *
                unitsPerPixel
            )
          );

        maximum =
          Math.max(
            ...extents.map(
              item =>
                item.rate +
                item.radiusPx *
                unitsPerPixel
            )
          );

        const requiredSpan =
          maximum - minimum;

        if (
          requiredSpan <
          CONFIG.bubbleYAxisMinimumSpan
        ) {
          const centre =
            (minimum + maximum) / 2;

          minimum =
            centre -
            CONFIG.bubbleYAxisMinimumSpan / 2;

          maximum =
            centre +
            CONFIG.bubbleYAxisMinimumSpan / 2;
        }

        span = maximum - minimum;
      }

      const snap =
        CONFIG.bubbleYAxisSnap;

      minimum =
        Math.floor(
          minimum / snap
        ) * snap;

      maximum =
        Math.ceil(
          maximum / snap
        ) * snap;

      while (
        maximum - minimum <
        CONFIG.bubbleYAxisMinimumSpan
      ) {
        minimum -= snap;
        maximum += snap;
      }

      minimum =
        Math.max(
          CONFIG.minimumHourlyRate,
          minimum
        );

      maximum =
        Math.min(
          CONFIG.maximumHourlyRate,
          maximum
        );

      const fitted =
        normaliseYAxisRange({
          minimum,
          maximum
        });

      const fixed =
        fixedYAxisRange();

      if (
        fitted.maximum - fitted.minimum >=
        fixed.maximum - fixed.minimum
      ) {
        return fixed;
      }

      return fitted;
    }

    function yAxisTargetForView(view) {
      if (
        view === 'location' ||
        view === 'employer'
      ) {
        const store =
          bubbleStores[view];

        if (store?.splitKeys.size) {
          return fixedYAxisRange();
        }

        return deriveBubbleYAxisRange(
          view
        );
      }

      return fixedYAxisRange();
    }

    function cancelYAxisRangeAnimation() {
      yAxisRangeAnimation.token += 1;

      if (
        yAxisRangeAnimation.raf !== null
      ) {
        cancelAnimationFrame(
          yAxisRangeAnimation.raf
        );

        yAxisRangeAnimation.raf = null;
      }
    }

    function animateDisplayedYAxisRange(
      targetRange,
      duration = CONFIG.transitionMs
    ) {
      const target =
        normaliseYAxisRange(
          targetRange
        );

      const start =
        copyDisplayedYAxisRange();

      cancelYAxisRangeAnimation();

      if (
        rangesNearlyEqual(
          start,
          target
        )
      ) {
        setDisplayedYAxisRange(
          target
        );

        chart?.draw();
        return;
      }

      if (
        PFF.reducedMotion() ||
        duration <= 0
      ) {
        setDisplayedYAxisRange(
          target
        );

        chart?.draw();
        return;
      }

      const token =
        ++yAxisRangeAnimation.token;

      const startedAt =
        performance.now();

      function frame(now) {
        if (
          token !==
          yAxisRangeAnimation.token
        ) {
          return;
        }

        const rawProgress =
          Math.min(
            (now - startedAt) /
            duration,
            1
          );

        const progress =
          easeInOutCubic(
            rawProgress
          );

        setDisplayedYAxisRange(
          interpolateYAxisRange(
            start,
            target,
            progress
          )
        );

        chart?.draw();

        if (rawProgress < 1) {
          yAxisRangeAnimation.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          yAxisRangeAnimation.raf = null;
          setDisplayedYAxisRange(
            target
          );
          chart?.draw();
        }
      }

      yAxisRangeAnimation.raf =
        requestAnimationFrame(
          frame
        );
    }

    function getBubbleVisibility(raw) {
      const store =
        bubbleStores[
          raw.bubbleView
        ];

      if (
        store.splitProgress.has(
          raw.categoryKey
        )
      ) {
        return (
          1 -
          store.splitProgress.get(
            raw.categoryKey
          )
        );
      }

      if (
        store.mergingKeys.has(
          raw.categoryKey
        )
      ) {
        return store.mergeProgress;
      }

      return store.splitKeys.has(
        raw.categoryKey
      )
        ? 0
        : 1;
    }

    function getDisplayedBubbleRadius(
      activeChart,
      raw
    ) {
      const baseRadius =
        Number(raw?.baseRadius);

      if (
        !Number.isFinite(baseRadius) ||
        baseRadius <= 0
      ) {

      return (

      return getDisplayedBubbleRadius(

    function drawInteractionNote(
      context,
      area,
      text
    ) {
      if (!text) return;

      context.save();
      context.font =
        '400 8.5px Lato, sans-serif';
      context.textBaseline =
        'middle';
      context.textAlign =
        'left';

      const maximumTextWidth =
        Math.max(
          90,
          Math.min(
            235,
            area.right -
              area.left -
              20
          )
        );

      const words =
        text.split(/\s+/);

      const lines = [];
      let line = '';

      words.forEach(word => {
        const candidate =
          line
            ? `${line} ${word}`
            : word;

        if (
          line &&
          context
            .measureText(candidate)
            .width > maximumTextWidth
        ) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      });

      if (line) {
        lines.push(line);
      }

      const paddingX = 5;
      const paddingY = 4;
      const lineHeight = 11;

      const textWidth =
        Math.max(
          ...lines.map(
            item =>
              context
                .measureText(item)
                .width
          )
        );

      const boxWidth =
        textWidth + paddingX * 2;

      const boxHeight =
        lines.length * lineHeight +
        paddingY * 2;

      const x =
        area.right - boxWidth - 6;

      const y =
        area.bottom - boxHeight - 6;

      const radius = 4;

      context.beginPath();
      context.moveTo(
        x + radius,
        y
      );
      context.lineTo(
        x + boxWidth - radius,
        y
      );
      context.quadraticCurveTo(
        x + boxWidth,
        y,
        x + boxWidth,
        y + radius
      );
      context.lineTo(
        x + boxWidth,
        y + boxHeight - radius
      );
      context.quadraticCurveTo(
        x + boxWidth,
        y + boxHeight,
        x + boxWidth - radius,
        y + boxHeight
      );
      context.lineTo(
        x + radius,
        y + boxHeight
      );
      context.quadraticCurveTo(
        x,
        y + boxHeight,
        x,
        y + boxHeight - radius
      );
      context.lineTo(
        x,
        y + radius
      );
      context.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
      );
      context.closePath();

      context.fillStyle =
        'rgba(255, 255, 255, 0.84)';
      context.fill();

      context.strokeStyle =
        'rgba(105, 113, 138, 0.16)';
      context.lineWidth = 1;
      context.stroke();

      context.fillStyle =
        'rgba(105, 113, 138, 0.88)';

      lines.forEach(
        (item, index) => {
          context.fillText(
            item,
            x + paddingX,
            y +
              paddingY +
              lineHeight * index +
              lineHeight / 2
          );
        }
      );

      context.restore();
    }

    function distanceToSegment(
      px,
      py,
      ax,
      ay,
      bx,
      by
    ) {
      const dx =
        bx - ax;

      const dy =
        by - ay;

      if (
        dx === 0 &&
        dy === 0
      ) {
        return Math.hypot(
          px - ax,
          py - ay
        );
      }

      const proportion =
        clamp(
          (
            (px - ax) * dx +
            (py - ay) * dy
          ) /
          (
            dx * dx +
            dy * dy
          ),
          0,
          1
        );

      const closestX =
        ax + proportion * dx;

      const closestY =
        ay + proportion * dy;

      return Math.hypot(
        px - closestX,
        py - closestY
      );
    }

    function findNearestInteractiveLine(
      event,
      maximumDistance = 10
    ) {
      if (!chart?.chartArea) {
        return null;
      }

      const x =
        Number(event?.x);

      const y =
        Number(event?.y);

      const area =
        chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let bestMatch = null;

      chart.data.datasets.forEach(
        (dataset, datasetIndex) => {
          if (
            dataset.datasetRole !==
              'regression' &&
            dataset.datasetRole !==
              'categoryMedian'
          ) {
            return;
          }

          const renderedPoints =
            chart
              .getDatasetMeta(
                datasetIndex
              )
              ?.data || [];

          for (
            let index = 0;
            index <
              renderedPoints.length - 1;
            index += 1
          ) {
            const first =
              renderedPoints[index];

            const second =
              renderedPoints[index + 1];

            if (
              !Number.isFinite(first?.x) ||
              !Number.isFinite(first?.y) ||
              !Number.isFinite(second?.x) ||
              !Number.isFinite(second?.y)
            ) {
              continue;
            }

            const distance =
              distanceToSegment(
                x,
                y,
                first.x,
                first.y,
                second.x,
                second.y
              );

            if (
              distance >
              maximumDistance
            ) {
              continue;
            }

            const firstDistance =
              Math.hypot(
                x - first.x,
                y - first.y
              );

            const secondDistance =
              Math.hypot(
                x - second.x,
                y - second.y
              );

            const nearestIndex =
              firstDistance <=
                secondDistance
                ? index
                : index + 1;

            if (
              !bestMatch ||
              distance <
                bestMatch.distance
            ) {
              bestMatch = {
                datasetIndex,
                index:
                  nearestIndex,
                distance
              };
            }
          }
        }
      );

      return bestMatch;
    }
    function findRawBubbleElement(event) {
      if (!chart?.chartArea) {
        return null;
      }

      const x =
        Number(event?.x);

      const y =

      const area =

        x < area.left ||

              const distance =

              if (

              ) {
                nearestRawPoint = {

                };

            }
          );
        }
      );

      return nearestRawPoint;
    }

      const selectedElement =

      const dataset =

      if (

            'categoryMedian' ||

            'bubbleAggregate' ||
