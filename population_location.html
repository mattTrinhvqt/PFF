<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Population Location Trends</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_loader.js"></script>
  <script src="./assets/pff_chart_core.js"></script>
  <!-- Opt-in small chart assets; the legacy core remains only for existing
       loading, controls, custom Y-axis geometry and accessibility helpers. -->
  <script src="./assets/chart-styling-and-defaults.js"></script>
  <script src="./assets/chart-axes-and-ticks.js"></script>
  <script src="./assets/chart-animations-and-transitions.js"></script>
  <script src="./assets/chart-trends-and-labels.js"></script>
  <script src="./assets/chart-tooltips-and-hover.js"></script>
  <script src="./assets/chart-responsive-layouts-and-touch.js"></script>
  <script src="./assets/chart-legends-and-interactions.js"></script>

  <style>

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }
    /* Let the modular legend own its scroll arrows and focusable items. */
    #chartLegend.pff-shared-legend {
      width: 100%;
      height: 28px;
      min-height: 28px;
    }
    #chartLegend .pff-shared-legend__viewport {
      height: 28px;
      padding-bottom: 2px;
    }

  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading population location data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading population location data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Population location grouping"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              data-group="state"
            >State</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-group="rurality"
            >Rurality</button>
          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"
            type="button"
            aria-label="Scroll tabs right"
          >›</button>
        </div>

        <div
          id="liveData"
          class="live-data"
          aria-label="Live data"
          aria-live="polite"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="liveDataText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">
              <span id="chartHeadingFixed" class="chart-heading-fixed">Population by&nbsp;</span>
              <span id="chartHeadingDetail" class="chart-heading-detail">state</span><span id="chartHeadingMetric" class="chart-heading-detail"></span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3-year trend. Press to switch to 10-year trend."
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>

          <div
            id="metricSwitch"
            class="metric-switch"
            role="group"
            aria-label="Display metric"
          >
            <button
              class="metric-button is-active"
              type="button"
              data-metric="count"
            >Count</button>

            <button
              class="metric-button"
              type="button"
              data-metric="share"
            >%</button>
          </div>
        </div>
      </div>

      <div class="chart-options-row">
        <div id="chartLegend" class="chart-legend" aria-label="Chart legend"></div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="trendChart"
          aria-label="Australian population location trend chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const Shared = window.PFFModules || {};

    const CONFIG = Object.freeze({
      sheetId:
        '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE',

      stateSheet:
        'Auspopnbystate',

      stateRange:
        'A30:J',

      ruralitySheet:
        'AuspopnbyMMM',

      ruralityRange:
        'A30:I',

      localCacheKey:
        'pff-population-location-v1'
    });

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    /*
     * The population-location app shares the existing population cache
     * snapshot. Backend 1 is extended below so this same snapshot also
     * contains stateRows and ruralityRows.
     */
    const CACHE_APP_KEY =
      'pff-australian-population-trends';

    const STATE_LABELS = Object.freeze([
      'NSW',
      'VIC',
      'QLD',
      'SA',
      'WA',
      'TAS',
      'NT',
      'ACT'
    ]);

    const STATE_COLOURS = Object.freeze([
      '#2db7f5',
      '#2d3a8c',
      '#7a0036',
      '#f03a47',
      '#000000',
      '#22a36b',
      '#c25e00',
      '#7b61ff'
    ]);

    const RURALITY_LABELS = Object.freeze([
      'Metro',
      'Non-metro'
    ]);

    const RURALITY_COLOURS = Object.freeze([
      '#30475d',
      '#b54a0a'
    ]);

    const SERIES_SLOT_COUNT =
      STATE_LABELS.length;

    const app =
      document.getElementById('app');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartTabs =
      Array.from(
        document.querySelectorAll('.chart-tab')
      );

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const chartHeadingFixed =
      document.getElementById('chartHeadingFixed');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const chartHeadingMetric =
      document.getElementById('chartHeadingMetric');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const metricSwitch =
      document.getElementById('metricSwitch');

    const metricButtons =
      Array.from(
        document.querySelectorAll('.metric-button')
      );

    const chartLegend =
      document.getElementById('chartLegend');

    const chartShell =
      document.getElementById('chartShell');

    const liveData =
      document.getElementById('liveData');

    const liveDataText =
      document.getElementById('liveDataText');

    const chartCanvas =
      document.getElementById('trendChart');

    let sourceData = {
      state: [],
      rurality: []
    };

    let activeGroup =
      'state';

    let activeMetric =
      'count';

    let chart =
      null;

    let chartSummary =
      null;

    let tabsController =
      null;

    let headingScroller =
      null;

    let metricController =
      null;

    let trendController =
      null;

    let legendController =
      null;

    let interactionsController =
      null;

    let responsiveController =
      null;

    let yAxisController =
      null;

    let lastYAxisTitle =
      'Population';

    const CHART_TRANSITION_MS = Shared.chartAnimations?.defaults?.chartMs ?? 600;
    let tooltipEscapeListenerInstalled = false;

    const hiddenSeriesByGroup =
      new Map();

    function groupLabels(group = activeGroup) {
      return group === 'state'
        ? STATE_LABELS
        : RURALITY_LABELS;
    }

    function groupColours(group = activeGroup) {
      return group === 'state'
        ? STATE_COLOURS
        : RURALITY_COLOURS;
    }

    function groupRows(group = activeGroup) {
      return sourceData[group] || [];
    }

    function hiddenSeriesSet(group = activeGroup) {
      if (
        !hiddenSeriesByGroup.has(
          group
        )
      ) {
        hiddenSeriesByGroup.set(
          group,
          new Set()
        );
      }

      return hiddenSeriesByGroup.get(
        group
      );
    }

    function dataNumber(value) {
      if (
        value &&
        typeof value === 'object' &&
        (
          Object.prototype.hasOwnProperty.call(value, 'v') ||
          Object.prototype.hasOwnProperty.call(value, 'f')
        )
      ) {
        const direct =
          PFFCharts.numericCell(
            value
          );

        if (
          Number.isFinite(
            direct
          )
        ) {
          return direct;
        }

        value =
          value.f ??
          value.v;
      }

      const cleaned =
        PFF.cleanText(
          value
        )
          .replace(/,/g, '')
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(
          cleaned
        )
      ) {
        return NaN;
      }

      const number =
        Number(
          cleaned
        );

      return Number.isFinite(
        number
      )
        ? number
        : NaN;
    }

    function normaliseViewRows(
      sourceRows,
      group,
      expectedValueCount
    ) {
      return (
        Array.isArray(sourceRows)
          ? sourceRows
          : []
      )
        .map(row => {
          if (
            !row ||
            row.group !== group
          ) {
            return null;
          }

          const year =
            Number(
              row.year
            );

          const values =
            Array.from(
              row.values || []
            )
              .slice(
                0,
                expectedValueCount
              )
              .map(Number);

          if (
            !Number.isFinite(year) ||
            year < 2000 ||
            year > 2100 ||
            values.length !== expectedValueCount ||
            values.some(
              value =>
                !Number.isFinite(
                  value
                )
            )
          ) {
            return null;
          }

          return {
            year:
              Math.round(
                year
              ),
            values
          };
        })
        .filter(Boolean)
        .sort(
          (
            first,
            second
          ) =>
            first.year -
            second.year
        );
    }

    function splitCombinedRows(combinedRows) {
      return {
        state:
          normaliseViewRows(
            combinedRows,
            'state',
            STATE_LABELS.length
          ),

        rurality:
          normaliseViewRows(
            combinedRows,
            'rurality',
            RURALITY_LABELS.length
          )
      };
    }

    function combineSourceData(data) {
      const state =
        normaliseViewRows(
          (data?.state || []).map(
            row => ({
              group:
                'state',
              year:
                row.year,
              values:
                row.values
            })
          ),
          'state',
          STATE_LABELS.length
        );

      const rurality =
        normaliseViewRows(
          (data?.rurality || []).map(
            row => ({
              group:
                'rurality',
              year:
                row.year,
              values:
                row.values
            })
          ),
          'rurality',
          RURALITY_LABELS.length
        );

      return [
        ...state.map(
          row => ({
            group:
              'state',
            year:
              row.year,
            values:
              [...row.values]
          })
        ),
        ...rurality.map(
          row => ({
            group:
              'rurality',
            year:
              row.year,
            values:
              [...row.values]
          })
        )
      ];
    }

    function validSourceData(data) {
      return Boolean(
        data &&
        Array.isArray(data.state) &&
        Array.isArray(data.rurality) &&
        data.state.length >= 3 &&
        data.rurality.length >= 3
      );
    }

    function validateCombinedRows(combinedRows) {
      const split =
        splitCombinedRows(
          combinedRows
        );

      if (
        !validSourceData(
          split
        )
      ) {
        throw new Error(
          'Population location data were incomplete.'
        );
      }

      return [
        ...split.state.map(
          row => ({
            group:
              'state',
            year:
              row.year,
            values:
              [...row.values]
          })
        ),
        ...split.rurality.map(
          row => ({
            group:
              'rurality',
            year:
              row.year,
            values:
              [...row.values]
          })
        )
      ];
    }

    function parseStateTable(table) {
      const rows = [];

      (
        table?.rows || []
      ).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          dataNumber(
            cells[0]
          );

        const values =
          Array.from(
            {
              length:
                STATE_LABELS.length
            },
            (_, index) =>
              dataNumber(
                cells[index + 1]
              ) /
              1000000
          );

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          values.some(
            value =>
              !Number.isFinite(
                value
              )
          )
        ) {
          return;
        }

        rows.push({
          group:
            'state',
          year:
            Math.round(
              year
            ),
          values
        });
      });

      return rows;
    }

    function parseRuralityTable(table) {
      const rows = [];

      (
        table?.rows || []
      ).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          dataNumber(
            cells[0]
          );

        const metro =
          dataNumber(
            cells[1]
          );

        const nonMetro =
          dataNumber(
            cells[8]
          );

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          !Number.isFinite(metro) ||
          !Number.isFinite(nonMetro)
        ) {
          return;
        }

        rows.push({
          group:
            'rurality',
          year:
            Math.round(
              year
            ),
          values: [
            metro,
            nonMetro
          ]
        });
      });

      return rows;
    }

    function parseLiveData(raw) {
      const combined = [
        ...parseStateTable(
          raw?.stateTable
        ),
        ...parseRuralityTable(
          raw?.ruralityTable
        )
      ];

      return validateCombinedRows(
        combined
      );
    }

    function parseRemoteStateRows(sourceRows) {
      return (
        Array.isArray(sourceRows)
          ? sourceRows
          : []
      )
        .map(row => {
          const year =
            dataNumber(
              row?.[0]
            );

          const values =
            Array.from(
              {
                length:
                  STATE_LABELS.length
              },
              (_, index) =>
                dataNumber(
                  row?.[index + 1]
                ) /
                1000000
            );

          if (
            !Number.isFinite(year) ||
            year < 2000 ||
            year > 2100 ||
            values.some(
              value =>
                !Number.isFinite(
                  value
                )
            )
          ) {
            return null;
          }

          return {
            group:
              'state',
            year:
              Math.round(
                year
              ),
            values
          };
        })
        .filter(Boolean);
    }

    function parseRemoteRuralityRows(sourceRows) {
      return (
        Array.isArray(sourceRows)
          ? sourceRows
          : []
      )
        .map(row => {
          const year =
            dataNumber(
              row?.[0]
            );

          const metro =
            dataNumber(
              row?.[1]
            );

          const nonMetro =
            dataNumber(
              row?.[8]
            );

          if (
            !Number.isFinite(year) ||
            year < 2000 ||
            year > 2100 ||
            !Number.isFinite(metro) ||
            !Number.isFinite(nonMetro)
          ) {
            return null;
          }

          return {
            group:
              'rurality',
            year:
              Math.round(
                year
              ),
            values: [
              metro,
              nonMetro
            ]
          };
        })
        .filter(Boolean);
    }

    function parseRemoteCache(snapshot) {
      const combined = [
        ...parseRemoteStateRows(
          snapshot?.data?.stateRows
        ),
        ...parseRemoteRuralityRows(
          snapshot?.data?.ruralityRows
        )
      ];

      return validateCombinedRows(
        combined
      );
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(
            raw
          );

        if (
          Array.isArray(
            parsed?.rows
          )
        ) {
          return;
        }

        if (
          validSourceData(
            parsed?.data
          )
        ) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            combineSourceData(
              parsed.data
            )
          );
        }
      } catch (_) {
      }
    }

    function shareRows(viewRows) {
      return viewRows.map(row => {
        const total =
          row.values.reduce(
            (
              sum,
              value
            ) =>
              sum +
              (
                Number.isFinite(value)
                  ? value
                  : 0
              ),
            0
          );

        return {
          year:
            row.year,
          values:
            row.values.map(
              value =>
                total > 0
                  ? value /
                    total *
                    100
                  : NaN
            )
        };
      });
    }

    function viewRows() {
      const rows =
        groupRows();

      return activeMetric === 'share'
        ? shareRows(
            rows
          )
        : rows;
    }

    function currentViewConfig() {
      if (
        activeGroup === 'state' &&
        activeMetric === 'count'
      ) {
        return {
          scale: {
            min:
              0,
            max:
              10,
            intervals:
              5
          },
          yTitle:
            'Population'
        };
      }

      if (
        activeGroup === 'rurality' &&
        activeMetric === 'count'
      ) {
        return {
          scale: {
            min:
              0,
            max:
              25,
            intervals:
              5
          },
          yTitle:
            'Population'
        };
      }

      if (
        activeGroup === 'state' &&
        activeMetric === 'share'
      ) {
        return {
          scale: {
            min:
              0,
            max:
              40,
            intervals:
              4
          },
          yTitle:
            '% of population'
        };
      }

      return {
        scale: {
          min:
            0,
          max:
            100,
          intervals:
            5
        },
        yTitle:
          '% of population'
      };
    }

    function formatYAxisValue(value) {
      const number =
        Number(
          value
        );

      if (
        !Number.isFinite(
          number
        )
      ) {
        return '';
      }

      if (
        activeMetric === 'share'
      ) {
        return `${Math.round(number)}%`;
      }

      if (
        Math.abs(number) <
        0.0000005
      ) {
        return '0';
      }

      return `${Math.round(number)}m`;
    }

    function latestTrendForSeries(seriesIndex) {
      if (
        !trendController ||
        trendController.mode === 'off'
      ) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        viewRows(),
        row =>
          row.values[
            seriesIndex
          ],
        trendController.windowSize
      );
    }

    function updateHeading() {
      const groupText =
        activeGroup === 'state' ? 'state' : 'rurality';

      const metricText =
        activeMetric === 'share' ? '\u00a0(%)' : '';

      // Keep "Population by" visible. Animate only the changing spans.
      PFF.animateTextChange(chartHeadingDetail, groupText, {
        fadeOutMs: 150,
        fadeInMs: 220
      });

      PFF.animateTextChange(chartHeadingMetric, metricText, {
        fadeOutMs: 150,
        fadeInMs: 220
      });

      headingScrollViewport.scrollLeft =
        0;

      requestAnimationFrame(
        () =>
          headingScroller?.update()
      );
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const latest =
        groupRows().at(-1);

      if (!latest) {
        PFFCharts.updateChartSummary(
          'Australian population location chart.',
          chartSummary
        );
        return;
      }

      const labels =
        groupLabels();

      const hidden =
        hiddenSeriesSet();

      const visibleLabels =
        labels.filter(
          label =>
            !hidden.has(
              label
            )
        );

      const metricText =
        activeMetric === 'share'
          ? 'percentage share'
          : 'population count';

      const trendText =
        trendController?.mode !== 'off'
          ? ` ${trendController.windowSize}-year trend labels are on.`
          : '';

      PFFCharts.updateChartSummary(
        `Population by ${activeGroup}, ${metricText}. Latest year ${latest.year}. Visible series: ${visibleLabels.join(', ')}.${trendText}`,
        chartSummary
      );
    }

    function datasetForSlot(slotIndex) {
      const rows =
        viewRows();

      const labels =
        groupLabels();

      const colours =
        groupColours();

      const hidden =
        hiddenSeriesSet();

      const active =
        slotIndex <
        labels.length;

      const label =
        active
          ? labels[
              slotIndex
            ]
          : `slot-${slotIndex}`;

      const colour =
        active
          ? colours[
              slotIndex
            ]
          : '#69718a';

      const fallbackValues =
        rows.map(
          row =>
            row.values[0]
        );

      const data =
        active
          ? rows.map(
              row =>
                row.values[
                  slotIndex
                ]
            )
          : fallbackValues;

      const visible =
        active &&
        !hidden.has(
          label
        );

      return PFFCharts.lineDataset({
        label,
        _seriesLabel:
          label,
        _slotActive:
          active,
        _activeSeries:
          visible,
        data,
        colour,
        pointBorderColor:
          '#ffffff',
        pointBorderWidth:
          active
            ? 1
            : 0,
        cubicInterpolationMode:
          'monotone',
        hidden:
          !visible
      });
    }

    function buildDatasets() {
      return Array.from(
        {
          length:
            SERIES_SLOT_COUNT
        },
        (_, index) =>
          datasetForSlot(
            index
          )
      );
    }

    function applyDatasetVisibility() {
      if (!chart) {
        return;
      }

      const labels =
        groupLabels();

      const hidden =
        hiddenSeriesSet();

      chart.data.datasets.forEach(
        (
          dataset,
          index
        ) => {
          const active =
            index <
            labels.length;

          const label =
            active
              ? labels[index]
              : dataset._seriesLabel;

          const visible =
            active &&
            !hidden.has(
              label
            );

          dataset._slotActive =
            active;

          dataset._activeSeries =
            visible;

          chart.setDatasetVisibility(
            index,
            visible
          );
        }
      );
    }

    function syncDatasets() {
      if (!chart) {
        return;
      }

      const next =
        buildDatasets();

      next.forEach(
        (
          dataset,
          index
        ) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] =
              dataset;
            return;
          }

          Object.assign(
            current,
            dataset
          );
        }
      );

      applyDatasetVisibility();
    }

    function tooltipLabel(context) {
      const dataset =
        context.dataset;

      if (
        !dataset?._slotActive
      ) {
        return '';
      }

      const value =
        Number(
          context.raw
        );

      const trend =
        latestTrendForSeries(
          context.datasetIndex
        );

      const trendText =
        Number.isFinite(
          trend
        )
          ? ` · ${trend > 0 ? '+' : trend < 0 ? '−' : ''}${Math.abs(trend).toFixed(1)}% p.a.`
          : '';

      if (
        activeMetric === 'share'
      ) {
        return `${dataset._seriesLabel}: ${PFF.formatOneDecimal(value)}%${trendText}`;
      }

      const population =
        PFF.formatInteger(
          value *
          1000000
        );

      return `${dataset._seriesLabel}: ${population}${trendText}`;
    }

    // Shared 6 px labelled-year / 2 px unlabelled-year tick strokes.
    const yearTickPlugin = Shared.chartAxes.createLabelDrivenTicksPlugin({
      id: 'populationLocationYearTicks', axes: ['x']
    });

    // Shared opaque trend pills with collision-aware placement. Trend
    // calculations and 3yr/10yr/off toggle stay exactly as before.
    const trendLabelsPlugin = Shared.chartTrends.createTrendPillsPlugin({
      id: 'populationLocationTrendLabels',
      enabled() { return trendController?.mode !== 'off'; },
      isMobile: () => PFF.mobileLayout(),
      isActive({ chart: chartInstance, dataset, datasetIndex }) {
        return Boolean(dataset?._slotActive && dataset?._activeSeries &&
          chartInstance.isDatasetVisible(datasetIndex));
      },
      getTrendValue({ datasetIndex }) {
        return latestTrendForSeries(datasetIndex);
      },
      getSeriesColour({ dataset }) {
        return dataset?.borderColor || Shared.chartStyling.palette.secondary;
      }
    });

    function createChart() {
      const config =
        currentViewConfig();

      yAxisController =
        PFFCharts.createUnifiedYAxis({
          id:
            'populationLocationYAxis',

          getChart() {
            return chart;
          },

          getScale() {
            return currentViewConfig()
              .scale;
          },

          getDecimals() {
            return 0;
          },

          getTitle() {
            return currentViewConfig()
              .yTitle;
          },

          formatValue(value) {
            return formatYAxisValue(
              value
            );
          }
        });

      const initialOptions = PFFCharts.baseChartOptions({
        normalized: true,
        animation: { duration: PFF.reducedMotion() ? 0 : CHART_TRANSITION_MS,
          easing: 'easeInOutCubic' },
        animations: {
          x: {duration: 0},
          y: {duration: PFF.reducedMotion() ? 0 : CHART_TRANSITION_MS},
          colors: {duration: 0}
        },
        // Retain the original visibility transition, now using the approved
        // shared time; reduced-motion users still receive an instant update.
        transitions: PFFCharts.seriesVisibilityTransitionOptions(CHART_TRANSITION_MS),
        plugins: {
          tooltip: Shared.chartTooltips.tooltipOptions({
            callbacks: {
              title(items) { return items?.[0]?.label || ''; },
              label(context) { return tooltipLabel(context); }
            }
          })
        },
        scales: {
          x: Shared.chartAxes.withXAxisTickMarks(
            PFFCharts.xYearScaleOptions(), {yearMode: 'even'}
          ),
          y: PFFCharts.yScaleOptions(config.scale)
        }
      });
      const options = Shared.chartAnimations.withChartJsTiming(initialOptions);
      // Use the shared 600 ms entrance animation; preserve the fixed-year X
      // axis and disable animation when the user requests reduced motion.
      const initialDuration = PFF.reducedMotion() ? 0 : CHART_TRANSITION_MS;
      options.animation.duration = initialDuration;
      options.animations.x.duration = 0;
      options.animations.y.duration = initialDuration;
      options.animations.colors.duration = 0;
      if (PFF.reducedMotion()) {
        options.transitions.active.animation.duration = 0;
      }

      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type:
              'line',

            data: {
              labels:
                viewRows().map(
                  row =>
                    String(
                      row.year
                    )
                ),

              datasets:
                buildDatasets()
            },

            options,

            plugins: [
              yAxisController.plugin,
              trendLabelsPlugin,
              yearTickPlugin,
              {
                id: 'pffTooltipTopLayer',
                afterDraw(chartInstance) {
                  const tooltip = chartInstance?.tooltip;
                  if (!tooltip || !(Number(tooltip.opacity) > 0)) return;
                  tooltip.draw(chartInstance.ctx);
                }
              }
            ]
          }
        );

      applyDatasetVisibility();
      // The existing chart interaction controller handles outside presses.
      // Add only Escape dismissal to avoid duplicate redraw handlers.
      if (!tooltipEscapeListenerInstalled) {
        document.addEventListener('keydown', event => {
          if (event.key !== 'Escape' || !chart?.tooltip) return;
          chart.setActiveElements([]);
          chart.tooltip.setActiveElements([], { x: 0, y: 0 });
          chart.draw();
        });
        tooltipEscapeListenerInstalled = true;
      }

      lastYAxisTitle =
        config.yTitle;

      updateAccessibleSummary();
    }

    function renderCurrentChart() {
      if (!chart) {
        return;
      }

      const previousScale =
        yAxisController.currentScale();

      const previousTitle =
        lastYAxisTitle;

      const config =
        currentViewConfig();

      chart.data.labels =
        viewRows().map(
          row =>
            String(
              row.year
            )
        );

      syncDatasets();

      chart.options.scales.y.min =
        config.scale.min;

      chart.options.scales.y.max =
        config.scale.max;

      const duration = PFF.reducedMotion() ? 0 : CHART_TRANSITION_MS;
      chart.options.animation.duration = duration;
      chart.options.animation.easing = 'easeInOutCubic';
      chart.options.animations.x.duration = 0;
      chart.options.animations.y.duration = duration;
      chart.options.animations.y.easing = 'easeInOutCubic';
      chart.options.animations.colors.duration = duration;
      chart.update();

      // Capture currently rendered numeric ticks before retargeting. The core
      // continues to draw the established axis geometry; the shared module
      // re-pairs labels by VALUE, producing the approved sliding effect.
      const priorMajor = yAxisController.majorTracks();
      const priorMinor = yAxisController.minorTracks();
      yAxisController.animate(previousScale, config.scale, {
        duration, fromDecimals: 0, toDecimals: 0
      });
      if (duration > 0 &&
          (previousScale.min !== config.scale.min ||
           previousScale.max !== config.scale.max ||
           previousScale.intervals !== config.scale.intervals)) {
        yAxisController.state.majorTracks =
          Shared.chartAxes.slidingNumericAxisTracks(previousScale, config.scale, {
            kind: 'major', fromTracks: priorMajor
          });
        yAxisController.state.minorTracks =
          Shared.chartAxes.slidingNumericAxisTracks(previousScale, config.scale, {
            kind: 'minor', fromTracks: priorMinor
          });
      }

      if (previousTitle !== config.yTitle) {
        yAxisController.animateTitle(previousTitle, config.yTitle, duration);
      }
      lastYAxisTitle = config.yTitle;

      // Recreate only legend BUTTONS, not Chart.js data visibility state.
      // Stable group-specific hidden sets preserve choices across tabs.
      legendController?.setItems(legendItems());
      updateAccessibleSummary();
    }

    function setGroup(nextGroup) {
      if (
        ![
          'state',
          'rurality'
        ].includes(
          nextGroup
        ) ||
        nextGroup ===
          activeGroup
      ) {
        return;
      }

      activeGroup =
        nextGroup;

      updateHeading();
      renderCurrentChart();
    }

    function setMetric(nextMetric) {
      if (
        ![
          'count',
          'share'
        ].includes(
          nextMetric
        ) ||
        nextMetric ===
          activeMetric
      ) {
        return;
      }

      activeMetric =
        nextMetric;

      updateHeading();
      renderCurrentChart();
    }

    function legendItems() {
      const hidden = hiddenSeriesSet();
      return groupLabels().map((label, index) => ({
        id: label,
        datasetIndex: index,
        label,
        colour: groupColours()[index],
        markerType: 'line',
        visible: !hidden.has(label)
      }));
    }

    function setupControls() {
      tabsController =
        PFF.setupTabs({
          tabList,
          tabs:
            chartTabs,
          valueAttribute:
            'group',
          initialValue:
            activeGroup,
          leftButton:
            tabScrollLeft,
          rightButton:
            tabScrollRight,
          onChange(value) {
            setGroup(
              value
            );
          }
        });

      headingScroller =
        PFF.setupScrollableRegion({
          scroller:
            headingScrollViewport,
          leftButton:
            headingScrollLeft,
          rightButton:
            headingScrollRight
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,
          initialMode:
            '3yr',
          onChange() {
            chart?.draw();
            updateAccessibleSummary();
          }
        });

      metricController =
        PFF.setupMetricSwitch({
          element:
            metricSwitch,
          buttons:
            metricButtons,
          valueAttribute:
            'metric',
          initialValue:
            activeMetric,
          onChange(value) {
            setMetric(
              value
            );
          }
        });

      // Shared keyboard-accessible, horizontally scrolling legend. State and
      // Rurality retain separate hidden-series sets, as in the original app.
      legendController = Shared.chartLegends.mount({
        root: chartLegend,
        getChart() { return chart; },
        items: legendItems(),
        onToggle({ id, visible }) {
          const hidden = hiddenSeriesSet();
          if (visible) hidden.delete(id);
          else hidden.add(id);
          const index = groupLabels().indexOf(id);
          if (index >= 0 && chart?.data?.datasets?.[index]) {
            chart.data.datasets[index]._activeSeries = visible;
          }
          updateAccessibleSummary();
        }
      });

      interactionsController =
        PFFCharts.setupChartInteractions({
          canvas:
            chartCanvas,
          getChart() {
            return chart;
          }
        });

    }

    const requiredModules = [
      ['styling', Shared.chartStyling?.palette],
      ['axes', Shared.chartAxes?.withXAxisTickMarks],
      ['sliding ticks', Shared.chartAxes?.slidingNumericAxisTracks],
      ['year ticks', Shared.chartAxes?.createLabelDrivenTicksPlugin],
      ['animations', Shared.chartAnimations?.withChartJsTiming],
      ['trend pills', Shared.chartTrends?.createTrendPillsPlugin],
      ['tooltips', Shared.chartTooltips?.tooltipOptions],
      ['responsive', Shared.chartResponsive?.suppressTapFlash],
      ['legend', Shared.chartLegends?.mount]
    ];
    const missingModules = requiredModules
      .filter(([, fn]) => !fn)
      .map(([name]) => name);
    if (missingModules.length) {
      const message = `Missing shared chart assets: ${missingModules.join(', ')}`;
      console.error('[PFF Population Location pilot]', message);
      statusElement.textContent = message;
      statusElement.setAttribute('role', 'alert');
      app.classList.remove('is-loading');
      app.setAttribute('aria-busy', 'false');
      document.getElementById('loadingState').style.display = 'none';
    } else {
      Shared.chartResponsive.suppressTapFlash(chartCanvas);
      migrateLegacyLocalCache();
      setupControls();
      startPopulationLocationApp();
    }

    function startPopulationLocationApp() {

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      async loadLive() {
        const [
          stateTable,
          ruralityTable
        ] =
          await Promise.all([
            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.stateSheet,
              range:
                CONFIG.stateRange,
              headers:
                '1'
            }),

            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.ruralitySheet,
              range:
                CONFIG.ruralityRange,
              headers:
                '1'
            })
          ]);

        return {
          stateTable,
          ruralityTable
        };
      },

      parseLive:
        parseLiveData,

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,
          appKey:
            CACHE_APP_KEY
        });
      },

      parseRemoteCache,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        6,

      onLiveError(error) {
        console.warn(
          'Live population location data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(error) {
        console.warn(
          'Apps Script population location cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          liveData,
        text:
          liveDataText
      },

      render(loaded) {
        const combinedRows =
          validateCombinedRows(
            loaded.rows
          );

        sourceData =
          splitCombinedRows(
            combinedRows
          );

        chartSummary =
          PFFCharts.ensureChartSummary({
            id:
              'populationLocationChartSummary',
            parent:
              app
          });

        chartCanvas.setAttribute(
          'aria-describedby',
          chartSummary.id
        );

        createChart();

        legendController.refresh();
        tabsController.update();
        headingScroller.update();

        responsiveController =
          PFFCharts.createResponsiveController({
            getChart() {
              return chart;
            },
            observe: [
              app,
              chartShell
            ],
            onRefresh() {
              tabsController?.update();
              headingScroller?.update();
            }
          });

        return chart;
      },

      errorMessage:
        'Population location data unavailable.'
    });
    }
  </script>
</body>
