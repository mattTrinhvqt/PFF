<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF PHN workforce</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --nsw: #2db7f5;
      --vic: #2d3a8c;
      --qld: #7a0036;
      --sa: #f03a47;
      --wa: #000000;
      --tas: #22a36b;
      --nt: #c25e00;
      --act: #7b61ff;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      -webkit-touch-callout: none;
    }

    button,
    input {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 4px;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    /* ==========================================================
     * TOP TABS + LIVE STATUS
     * ========================================================== */

    .module-top {
      display: flex;
      width: 100%;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms var(--motion-ease),
        width 420ms var(--motion-ease);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ==========================================================
     * GRAPH TITLE
     * ========================================================== */

    .chart-heading-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 31px;
      flex: 0 0 auto;
      align-items: flex-start;
      margin: 0;
    }

    .chart-heading {
      display: inline-flex;
      max-width: 100%;
      min-width: 0;
      align-items: baseline;
      gap: 0.28em;
      margin: 0;
      padding: 4px 0 0;
      overflow: hidden;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-part,
    .chart-heading-year-wrap,
    .chart-heading-year {
      display: inline-block;
      flex: 0 0 auto;
    }

    .chart-heading-part,
    .chart-heading-year {
      will-change: opacity, transform;
    }

    /* ==========================================================
     * CONTROLS — MATCH PFF SEGMENTED TOGGLE + TIMELINE STYLE
     * ========================================================== */

    .controls-row {
      display: grid;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      flex: 0 0 auto;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      column-gap: 9px;
      padding: 0 0 3px;
    }

    .timeline-section {
      min-width: 0;
    }

    .timeline-topline {
      display: flex;
      width: 100%;
      min-height: 15px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 1px;
    }

    .timeline-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }

    .timeline-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .projection-year {
      min-width: 42px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-align: right;
      will-change: opacity, transform;
    }

    .year-slider-wrap {
      --slider-progress: 100%;
      position: relative;
      width: 100%;
      min-height: 22px;
      margin: 0;
    }

    .year-slider-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 1;
      height: 4px;
      transform: translateY(-50%);
      background:
        linear-gradient(
          to right,
          rgba(21, 21, 21, 0.72) 0,
          rgba(21, 21, 21, 0.72) var(--slider-progress),
          var(--track) var(--slider-progress),
          var(--track) 100%
        );
      border-radius: 999px;
      pointer-events: none;
    }

    .year-ticks {
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 2;
      height: 10px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .year-tick {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 6px;
      transform: translate(-50%, -50%);
      background: var(--muted);
      opacity: 0.38;
    }

    .year-tick.is-major {
      height: 10px;
      opacity: 0.58;
    }

    .year-range {
      position: relative;
      z-index: 4;
      display: block;
      width: 100%;
      height: 22px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    .year-range::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
      border-radius: 999px;
    }

    .year-range::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -4px;
      appearance: none;
      -webkit-appearance: none;
      background: var(--ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .year-range::-moz-range-track,
    .year-range::-moz-range-progress {
      height: 4px;
      background: transparent;
      border: 0;
      border-radius: 999px;
    }

    .year-range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .year-range:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.20);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .slider-drag-cue {
      position: absolute;
      top: -8px;
      left: calc(var(--slider-progress) - 23px);
      z-index: 5;
      display: inline-block;
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      animation: sliderDragCue 1.7s var(--motion-ease) infinite;
    }

    .year-slider-wrap.has-been-dragged .slider-drag-cue,
    .year-slider-wrap.only-one-year .slider-drag-cue {
      display: none;
    }

    @keyframes sliderDragCue {
      0%,
      12%,
      100% {
        opacity: 0;
        transform: translateX(0);
      }

      28% {
        opacity: 0.78;
        transform: translateX(0);
      }

      54% {
        opacity: 0.88;
        transform: translateX(-6px);
      }

      72% {
        opacity: 0.42;
        transform: translateX(-8px);
      }
    }

    .benchmark-control {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      padding-bottom: 1px;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        opacity 220ms ease,
        transform 360ms var(--motion-ease),
        visibility 0s linear 0s;
    }

    .benchmark-control.is-hidden {
      opacity: 0;
      visibility: hidden;
      transform: translateY(3px);
      pointer-events: none;
      transition:
        opacity 180ms ease,
        transform 300ms var(--motion-ease),
        visibility 0s linear 300ms;
    }

    .benchmark-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .benchmark-mode-toggle {
      position: relative;
      display: grid;
      width: 108px;
      height: 22px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      padding: 1px;
      overflow: hidden;
      background: rgba(232, 234, 240, 0.55);
      border-radius: 4px;
      isolation: isolate;
    }

    .benchmark-mode-toggle::before {
      content: '';
      position: absolute;
      top: 1px;
      bottom: 1px;
      left: 1px;
      z-index: 0;
      width: calc((100% - 2px) / 2);
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.08);
      transform: translateX(0);
      transition: transform 300ms var(--motion-ease);
    }

    .benchmark-mode-toggle.is-five-k-selected::before {
      transform: translateX(100%);
    }

    .benchmark-mode-button {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 20px;
      padding: 0 4px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 3px;
      font-family: inherit;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition:
        color 220ms ease,
        transform 300ms var(--motion-ease);
    }

    .benchmark-mode-button.is-active {
      color: var(--purple);
      background: transparent;
      box-shadow: none;
    }

    .benchmark-mode-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -1px;
    }

    .chart-note {
      flex: 0 0 auto;
      min-height: 12px;
      margin: -1px 0 1px;
      color: var(--muted);
      font-size: 8.5px;
      line-height: 1.35;
      text-align: left;
    }

    .chart-note:empty {
      display: none;
    }

    /* ==========================================================
     * CHART
     * ========================================================== */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
    }

    #phnChart {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    @media (max-width: 430px) {
      #app {
        width: min(calc(100% - 8px), 520px);
        padding-right: 4px;
        padding-left: 4px;
      }

      .chart-tab {
        padding-right: 8px;
        padding-left: 8px;
        font-size: 12px;
      }

      .controls-row {
        column-gap: 7px;
      }

      .benchmark-mode-toggle {
        width: 100px;
      }

      .benchmark-mode-button {
        padding-right: 3px;
        padding-left: 3px;
        font-size: 8px;
      }

      .benchmark-label,
      .timeline-label,
      .projection-year {
        font-size: 9px;
      }

      .chart-note {
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading">
      <div class="app-loading" aria-live="polite">
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading PHN workforce data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div id="tabList" class="tab-list" role="tablist" aria-label="PHN workforce charts">
            <button class="chart-tab is-active" type="button" role="tab" aria-selected="true" data-mode="oversupply">Oversupply</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-mode="coverage">Coverage</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-mode="population">Population</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-mode="clinicians">Clinicians</button>
          </div>
        </div>

        <div id="liveData" class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="liveDataText">LIVE</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 class="chart-heading">
          <span id="headingMetric" class="chart-heading-part">FTE clinician oversupply</span>
          <span class="chart-heading-year-wrap">(<span id="headingYear" class="chart-heading-year">—</span>)</span>
        </h2>
      </div>

      <div class="controls-row">
        <div class="timeline-section">
          <div class="timeline-topline">
            <span class="timeline-label">
              <span class="timeline-symbol" aria-hidden="true">◷</span>
              <span>Year</span>
            </span>
            <span id="projectionYear" class="projection-year">—</span>
          </div>

          <div id="yearSliderWrap" class="year-slider-wrap">
            <div id="yearTicks" class="year-ticks" aria-hidden="true"></div>
            <span class="slider-drag-cue" aria-hidden="true">←</span>
            <input
              id="yearSlider"
              class="year-range"
              type="range"
              min="0"
              max="0"
              step="1"
              value="0"
              aria-label="Year"
            >
          </div>
        </div>

        <div id="benchmarkControl" class="benchmark-control">
          <span class="benchmark-label">Benchmark</span>

          <div
            id="benchmarkModeToggle"
            class="benchmark-mode-toggle"
            role="group"
            aria-label="Oversupply benchmark"
          >
            <button
              id="benchmark10k"
              class="benchmark-mode-button is-active"
              type="button"
              aria-pressed="true"
              data-benchmark="10000"
            >1 / 10k</button>

            <button
              id="benchmark5k"
              class="benchmark-mode-button"
              type="button"
              aria-pressed="false"
              data-benchmark="5000"
            >1 / 5k</button>
          </div>
        </div>
      </div>

      <div id="chartNote" class="chart-note"></div>

      <div class="chart-shell">
        <canvas
          id="phnChart"
          aria-label="Primary Health Network workforce chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    // ============================================================
    // DATA SOURCE
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const CLINICIAN_SHEET =
      'OptomsbyPHN';

    const POPULATION_SHEET =
      'AuspopnbyPHN';

    // Row 30 = headers; row 31 onward = data.
    // A = year.
    // OptomsbyPHN BM:CQ = 31 PHNs.
    // AuspopnbyPHN B:AF = 31 PHNs.
    const CLINICIAN_RANGE =
      'A30:CQ';

    const POPULATION_RANGE =
      'A30:AF';

    // With A at zero-based index 0, BM = index 64 and B = index 1.
    const CLINICIAN_FIRST_INDEX =
      64;

    const POPULATION_FIRST_INDEX =
      1;

    const CACHE_KEY =
      'pff_phn_workforce_v3';

    const DEFAULT_MODE =
      'oversupply';

    // ============================================================
    // PHN ORDER + STATE COLOURS
    // ============================================================

    const PHNS = [
      'Central and Eastern Sydney',
      'Northern Sydney',
      'Western Sydney',
      'Nepean Blue Mountains',
      'South Western Sydney',
      'South Eastern NSW',
      'Western NSW',
      'Hunter New England and Central Coast',
      'North Coast',
      'Murrumbidgee',
      'North Western Melbourne',
      'Eastern Melbourne',
      'South Eastern Melbourne',
      'Gippsland',
      'Murray',
      'Western Victoria',
      'Brisbane North',
      'Brisbane South',
      'Gold Coast',
      'Darling Downs and West Moreton',
      'Western Queensland',
      'Central Queensland',
      'Northern Queensland',
      'Adelaide',
      'Country SA',
      'Perth North',
      'Perth South',
      'Country WA',
      'Tasmania',
      'Northern Territory',
      'Australian Capital Territory'
    ];

    const STATE_CODES = [
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'VIC', 'VIC', 'VIC', 'VIC', 'VIC', 'VIC',
      'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD',
      'SA', 'SA',
      'WA', 'WA', 'WA',
      'TAS',
      'NT',
      'ACT'

      NSW: '#2db7f5',
      VIC: '#2d3a8c',
      QLD: '#7a0036',
      SA: '#f03a47',
      WA: '#000000',
      TAS: '#22a36b',

    };

    const BAR_COLOURS =
      STATE_CODES.map(
        code => STATE_COLOURS[code]

    // ============================================================
    // DOM

    const app =
      document.getElementById('app');

      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const tabs =

    const liveDataText =
      document.getElementById('liveDataText');

    const headingMetric =
      document.getElementById('headingMetric');

    const headingYear =
      document.getElementById('headingYear');

    const projectionYear =

      document.getElementById('yearTicks');

    const yearSlider =

    // ============================================================
    // APP STATE
    // ============================================================

    const state = {
      mode: DEFAULT_MODE,
      year: null,
      benchmarkPopulation: 10000,
      clinicianByYear: {},
      populationByYear: {},
      activeYears: [],
      scaleCache: {},
      sourceState: 'live',
      lastRenderedMode: null
    };

    let chart =
      null;

    let textAnimationToken =
      0;

    // ============================================================
    // GOOGLE SHEETS JSONP
    // ============================================================

    function loadGVizSheet(
      sheetName,
      range
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `__pff_gviz_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement('script');

          let completed =
            false;

          const cleanup = () => {
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }

            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] = undefined;
            }
          };

          const timer =
            window.setTimeout(
              () => {
                if (completed) {
                  return;
                }

                completed = true;
                cleanup();

                reject(
                  new Error(
                    `Timed out loading ${sheetName}.`
                  )
                );
              },
              15000
            );

          window[callbackName] =
            response => {
              if (completed) {
                return;
              }

              completed = true;
              window.clearTimeout(timer);
              cleanup();

              if (
                !response ||
                response.status === 'error'
              ) {
                const message =
                  response?.errors?.[0]?.detailed_message ||
                  response?.errors?.[0]?.message ||
                  `Could not load ${sheetName}.`;

                reject(
                  new Error(message)
                );

                return;
              }

              resolve(response.table);
            };

          script.onerror = () => {
            if (completed) {
              return;
            }

            completed = true;
            window.clearTimeout(timer);
            cleanup();

            reject(
              new Error(
                `Could not connect to ${sheetName}.`
              )
            );
          };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              headers: '1',
              tqx: `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async = true;
          document.head.appendChild(script);
        }
      );
    }

    function numericCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return null;
      }

      if (
        typeof cell.v === 'number'
      ) {
        return Number.isFinite(cell.v)
          ? cell.v
          : null;
      }

      const cleaned =
        String(cell.v)
          .replace(/,/g, '')
          .replace(/[^0-9.+-]/g, '');

      if (!cleaned) {
        return null;
      }

      const value =
        Number(cleaned);

      return Number.isFinite(value)
        ? value
        : null;
    }

    function yearCell(cell) {
      const value =
        numericCell(cell);

      if (value === null) {
        return null;
      }

      const year =
        Math.round(value);

      return (
        year >= 1900 &&
        year <= 2200
      )
        ? year
        : null;
    }

    function parseTable(
      table,
      firstDataIndex
    ) {
      const result = {};
      const rows = table?.rows || [];

      for (const row of rows) {
        const cells = row?.c || [];
        const year = yearCell(cells[0]);

        if (!year) {
          continue;
        }

        const values =
          PHNS.map(
            (_, index) =>
              numericCell(
                cells[firstDataIndex + index]
              )
          );

        if (
          values.some(Number.isFinite)
        ) {
          result[year] = values;
        }
      }

      return result;
    }

    // ============================================================
    // CACHE
    // ============================================================

    function saveCache() {
      try {
        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            savedAt: Date.now(),
            clinicianByYear: state.clinicianByYear,
            populationByYear: state.populationByYear
          })
        );
      } catch (_) {
        // Cache is optional.
      }
    }

    function loadCache() {
      try {
        const raw =
          localStorage.getItem(CACHE_KEY);

        if (!raw) {
          return false;
        }

        const cached =
          JSON.parse(raw);

        if (
          !cached?.clinicianByYear ||
          !cached?.populationByYear
        ) {
          return false;
        }

        state.clinicianByYear =
          cached.clinicianByYear;

        state.populationByYear =
          cached.populationByYear;

        return true;
      } catch (_) {
        return false;
      }
    }

    async function loadData() {
      try {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            loadGVizSheet(
              CLINICIAN_SHEET,
              CLINICIAN_RANGE
            ),
            loadGVizSheet(
              POPULATION_SHEET,
              POPULATION_RANGE
            )
          ]);

        state.clinicianByYear =
          parseTable(
            clinicianTable,
            CLINICIAN_FIRST_INDEX
          );

        state.populationByYear =
          parseTable(
            populationTable,
            POPULATION_FIRST_INDEX
          );

        if (
          !Object.keys(state.clinicianByYear).length
        ) {
          throw new Error(
            'No clinician data were found from row 31 onward.'
          );
        }

        if (
          !Object.keys(state.populationByYear).length
        ) {
          throw new Error(
            'No population data were found from row 31 onward.'
          );
        }

        state.sourceState = 'live';
        saveCache();
      } catch (error) {
        if (loadCache()) {
          state.sourceState = 'cached';
          return;
        }

        throw error;
      }
    }

    // ============================================================
    // YEARS
    // ============================================================

    function sortedYears(object) {
      return Object.keys(object)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function commonYears() {
      const clinicianYears =
        new Set(
          sortedYears(state.clinicianByYear)
        );

      return sortedYears(
        state.populationByYear
      ).filter(
        year => clinicianYears.has(year)
      );
    }

    function yearsForMode(mode) {
      if (mode === 'clinicians') {
        return sortedYears(
          state.clinicianByYear
        );
      }

      if (mode === 'population') {
        return sortedYears(
          state.populationByYear
        );
      }

      return commonYears();
    }

    function buildYearTicks(years) {
      yearTicks.textContent = '';

      if (!years.length) {
        return;
      }

      const lastIndex =
        Math.max(0, years.length - 1);

      const majorStride =
        Math.max(
          1,
          Math.ceil(
            lastIndex / 4
          )
        );

      years.forEach(
        (_, index) => {
          const tick =
            document.createElement('span');

          const pct =
            lastIndex > 0
              ? (index / lastIndex) * 100
              : 50;

          tick.className = 'year-tick';
          tick.style.left = `${pct}%`;

          if (
            index === 0 ||
            index === lastIndex ||
            index % majorStride === 0
          ) {
            tick.classList.add('is-major');
          }

          yearTicks.appendChild(tick);
        }
      );
    }

    function configureYearSlider(
      keepYear = true,
      animateText = false
    ) {
      const years =
        yearsForMode(state.mode);

      state.activeYears = years;

      if (!years.length) {
        state.year = null;
        yearSlider.min = '0';
        yearSlider.max = '0';
        yearSlider.value = '0';
        yearSlider.disabled = true;
        yearSliderWrap.classList.add('only-one-year');
        buildYearTicks([]);
        setYearText('—', animateText);
        updateSliderProgress();
        return;
      }

      yearSlider.disabled = false;

      if (
        !keepYear ||
        !years.includes(state.year)
      ) {
        state.year =
          years[years.length - 1];
      }

      const index =
        Math.max(
          0,
          years.indexOf(state.year)
        );

      yearSlider.min = '0';
      yearSlider.max = String(years.length - 1);
      yearSlider.step = '1';
      yearSlider.value = String(index);

      yearSliderWrap.classList.toggle(
        'only-one-year',
        years.length <= 1
      );

      buildYearTicks(years);
      setYearText(String(state.year), animateText);
      updateSliderProgress();
    }

    function updateSliderProgress() {
      const min = Number(yearSlider.min);
      const max = Number(yearSlider.max);
      const value = Number(yearSlider.value);

      const percentage =
        max > min
          ? ((value - min) / (max - min)) * 100
          : 100;

      yearSliderWrap.style.setProperty(
        '--slider-progress',
        `${percentage}%`
      );
    }

    // ============================================================
    // METRICS
    // ============================================================

    function safeNumber(value) {
      const numeric = Number(value);

      return Number.isFinite(numeric)
        ? numeric
        : null;
    }

    function round1(value) {
      return Math.round(value * 10) / 10;
    }

    function metricValuesFor(
      mode,
      year,
      benchmarkPopulation = state.benchmarkPopulation
    ) {
      const clinicians =
        state.clinicianByYear[year] || [];

      const population =
        state.populationByYear[year] || [];

      if (mode === 'clinicians') {
        return PHNS.map(
          (_, index) => {
            const value =
              safeNumber(clinicians[index]);

            return value === null
              ? null
              : Math.round(value);
          }
        );
      }

      if (mode === 'population') {
        return PHNS.map(
          (_, index) => {
            const value =
              safeNumber(population[index]);

            return value === null
              ? null
              : Math.round(value);
          }
        );
      }

      if (mode === 'coverage') {
        return PHNS.map(
          (_, index) => {
            const c = safeNumber(clinicians[index]);
            const p = safeNumber(population[index]);

            if (
              c === null ||
              p === null ||
              c <= 0
            ) {
              return null;
            }

            return Math.round(p / c);
          }
        );
      }

      return PHNS.map(
        (_, index) => {
          const c = safeNumber(clinicians[index]);
          const p = safeNumber(population[index]);

          if (
            c === null ||
            p === null
          ) {
            return null;
          }

          return round1(
            c - (p / benchmarkPopulation)
          );
        }
      );
    }

    function metricValues() {
      if (!state.year) {
        return PHNS.map(() => null);
      }

      return metricValuesFor(
        state.mode,
        state.year,
        state.benchmarkPopulation
      );
    }

    function metricTitle(mode) {
      switch (mode) {
        case 'clinicians':
          return '# FTE clinicians';

        case 'population':
          return 'Population';

        case 'coverage':
          return 'Population per FTE clinician';

        case 'oversupply':
        default:
          return 'FTE clinician oversupply';
      }
    }

    function xAxisTitle(mode) {
      switch (mode) {
        case 'clinicians':
          return 'Count';

        case 'population':
          return 'Population';

        case 'coverage':
          return 'People per FTE clinician';

        case 'oversupply':
        default:
          return 'Excess FTE clinicians';
      }
    }

    function chartNoteText() {
      if (state.mode !== 'oversupply') {
        return '';
      }

      const benchmark =
        state.benchmarkPopulation.toLocaleString('en-AU');

      return `Benchmark: 1 FTE per ${benchmark} people. Positive = excess; negative = shortfall.`;
    }

    // ============================================================
    // CONSTANT PER-TAB X SCALES
    //
    // Each tab gets one scale calculated from every available year.
    // Oversupply additionally considers BOTH 1/10k and 1/5k values.
    // The scale therefore does not jump when the year slider or benchmark
    // toggle changes, but it is allowed to change when switching tabs.
    // ============================================================

    function flattenFinite(arrays) {
      return arrays
        .flat()
        .filter(Number.isFinite);
    }

    function niceStep(rawStep) {
      if (
        !Number.isFinite(rawStep) ||
        rawStep <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(rawStep)
        );

      const magnitude =
        Math.pow(10, exponent);

      const fraction =
        rawStep / magnitude;

      let niceFraction;

      if (fraction <= 1) {
        niceFraction = 1;
      } else if (fraction <= 2) {
        niceFraction = 2;
      } else if (fraction <= 2.5) {
        niceFraction = 2.5;
      } else if (fraction <= 5) {
        niceFraction = 5;
      } else {
        niceFraction = 10;
      }

      return niceFraction * magnitude;
    }

    function deriveConstantScale(
      values,
      allowNegative
    ) {
      const finite =
        values.filter(Number.isFinite);

      if (!finite.length) {
        return {
          min: 0,
          max: 1,
          step: 0.2,
          minorStep: 0.1
        };
      }

      const rawMin =
        Math.min(...finite);

      const rawMax =
        Math.max(...finite);

      if (!allowNegative) {
        const paddedMax =
          Math.max(1, rawMax) * 1.14;

        const step =
          niceStep(paddedMax / 5.4);

        const max =
          Math.max(
            step,
            Math.ceil(paddedMax / step) * step
          );

        return {
          min: 0,
          max,
          step,
          minorStep: step / 2
        };
      }

      const baseSpan =
        Math.max(
          rawMax - rawMin,
          Math.abs(rawMax),
          Math.abs(rawMin),
          1
        );

      const lower =
        Math.min(0, rawMin) - baseSpan * 0.10;

      const upper =
        Math.max(0, rawMax) + baseSpan * 0.12;

      const step =
        niceStep(
          (upper - lower) / 6
        );

      let min =
        Math.floor(lower / step) * step;

      let max =
        Math.ceil(upper / step) * step;

      if (rawMin >= 0) {
        min = 0;
      }

      if (rawMax <= 0) {
        max = 0;
      }

      if (min === max) {
        max = min + step;
      }

      return {
        min,
        max,
        step,
        minorStep: step / 2
      };
    }

    function buildScaleCache() {
      const clinicianYears =
        yearsForMode('clinicians');

      const populationYears =
        yearsForMode('population');

      const sharedYears =
        commonYears();

      const clinicianValues =
        flattenFinite(
          clinicianYears.map(
            year => metricValuesFor('clinicians', year)
          )
        );

      const populationValues =
        flattenFinite(
          populationYears.map(
            year => metricValuesFor('population', year)
          )
        );

      const coverageValues =
        flattenFinite(
          sharedYears.map(
            year => metricValuesFor('coverage', year)
          )
        );

      const oversupplyValues =
        flattenFinite(
          sharedYears.flatMap(
            year => [
              metricValuesFor('oversupply', year, 10000),
              metricValuesFor('oversupply', year, 5000)
            ]
          )
        );

      state.scaleCache = {
        clinicians:
          deriveConstantScale(
            clinicianValues,
            false
          ),

        population:
          deriveConstantScale(
            populationValues,
            false
          ),

        coverage:
          deriveConstantScale(
            coverageValues,
            false
          ),

        oversupply:
          deriveConstantScale(
            oversupplyValues,
            true
          )
      };
    }

    // ============================================================
    // FORMATTERS
    // ============================================================

    function formatInteger(value) {
      return Math.round(value)
        .toLocaleString('en-AU');
    }

    function formatOneDecimal(value) {
      return Number(value)
        .toLocaleString(
          'en-AU',
          {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
          }
        );
    }

    function formatDisplayValue(
      value,
      mode = state.mode,
      includePlus = false
    ) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      if (mode === 'oversupply') {
        const rounded = round1(value);
        const prefix =
          includePlus && rounded > 0
            ? '+'
            : '';

        return `${prefix}${formatOneDecimal(rounded)}`;
      }

      return formatInteger(value);
    }

    function formatAxisValue(
      value,
      mode = state.mode
    ) {
      const numeric = Number(value);

      if (!Number.isFinite(numeric)) {
        return '';
      }

      const abs = Math.abs(numeric);

      if (mode === 'population') {
        if (abs >= 1000000) {
          return `${(numeric / 1000000).toLocaleString('en-AU', {
            maximumFractionDigits: 1
          })}m`;
        }

        if (abs >= 1000) {
          return `${(numeric / 1000).toLocaleString('en-AU', {
            maximumFractionDigits: 1
          })}k`;
        }
      }

      if (mode === 'coverage' && abs >= 1000) {
        return `${(numeric / 1000).toLocaleString('en-AU', {
          maximumFractionDigits: 1
        })}k`;
      }

      if (mode === 'oversupply') {
        return numeric.toLocaleString(
          'en-AU',
          {
            maximumFractionDigits: 1
          }
        );
      }

      return formatInteger(numeric);
    }

    // ============================================================
    // SMALL TEXT ANIMATIONS
    // Only the text that actually changes moves/fades.
    // ============================================================

    function reducedMotion() {
      return window
        .matchMedia(
          '(prefers-reduced-motion: reduce)'
        )
        .matches;
    }

    function animateChangedText(
      element,
      nextText,
      animate = true
    ) {
      if (!element) {
        return;
      }

      const text = String(nextText);

      if (element.textContent === text) {
        return;
      }

      element.textContent = text;

      if (
        !animate ||
        reducedMotion() ||
        typeof element.animate !== 'function'
      ) {
        return;
      }

      const token = ++textAnimationToken;

      const animation =
        element.animate(
          [
            {
              opacity: 0.18,
              transform: 'translateY(4px)'
            },
            {
              opacity: 1,
              transform: 'translateY(0)'
            }
          ],
          {
            duration: 360,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'none'
          }
        );

      animation.onfinish = () => {
        if (token !== textAnimationToken) {
          return;
        }
      };
    }

    function setYearText(
      yearText,
      animate
    ) {
      animateChangedText(
        headingYear,
        yearText,
        animate
      );

      animateChangedText(
        projectionYear,
        yearText,
        animate
      );
    }

    // ============================================================
    // ZERO LINE ANIMATION
    // ============================================================

    const zeroLineState = {
      x: null,
      opacity: 0,
      raf: null,
      token: 0
    };

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function animateZeroLine(
      targetX,
      targetOpacity,
      duration = 620,
      onFinish = null
    ) {
      if (!chart?.chartArea) {
        return;
      }

      if (zeroLineState.raf) {
        cancelAnimationFrame(zeroLineState.raf);
      }

      const token =
        ++zeroLineState.token;

      const startX =
        Number.isFinite(zeroLineState.x)
          ? zeroLineState.x
          : targetX;

      const startOpacity =
        Number.isFinite(zeroLineState.opacity)
          ? zeroLineState.opacity
          : 0;

      if (
        reducedMotion() ||
        duration <= 0 ||
        (
          Math.abs(startX - targetX) < 0.2 &&
          Math.abs(startOpacity - targetOpacity) < 0.01
        )
      ) {
        zeroLineState.x = targetX;
        zeroLineState.opacity = targetOpacity;
        chart.draw();
        onFinish?.();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (token !== zeroLineState.token) {
          return;
        }

        const progress =
          Math.min(
            (now - startedAt) / duration,
            1
          );

        const eased =
          easeOutCubic(progress);

        zeroLineState.x =
          startX +
          (targetX - startX) * eased;

        zeroLineState.opacity =
          startOpacity +
          (targetOpacity - startOpacity) * eased;

        chart.draw();

        if (progress < 1) {
          zeroLineState.raf =
            requestAnimationFrame(frame);
        } else {
          zeroLineState.raf = null;
          onFinish?.();
        }
      }

      zeroLineState.raf =
        requestAnimationFrame(frame);
    }

    function zeroTargetPixel() {
      if (!chart?.scales?.x) {
        return null;
      }

      const scale =
        state.scaleCache[state.mode];

      if (
        !scale ||
        !(scale.min < 0 && scale.max > 0)
      ) {
        return null;
      }

      return chart.scales.x.getPixelForValue(0);
    }

    function syncZeroLine(
      animate = true
    ) {
      if (!chart?.chartArea) {
        return;
      }

      const target =
        zeroTargetPixel();

      const left =
        chart.chartArea.left;

      if (Number.isFinite(target)) {
        if (!Number.isFinite(zeroLineState.x)) {
          zeroLineState.x = left;
          zeroLineState.opacity = 0;
        }

        animateZeroLine(
          target,
          1,
          animate ? 620 : 0
        );

        return;
      }

      if (Number.isFinite(zeroLineState.x)) {
        animateZeroLine(
          left,
          0,
          animate ? 480 : 0,
          () => {
            zeroLineState.x = null;
            zeroLineState.opacity = 0;
          }
        );
      }
    }

    // ============================================================
    // CHART PLUGINS
    // ============================================================

    const zeroLinePlugin = {
      id: 'zeroLinePlugin',

      beforeDatasetsDraw(chartInstance) {
        const x = zeroLineState.x;
        const opacity = zeroLineState.opacity;

        if (
          !Number.isFinite(x) ||
          opacity <= 0.001
        ) {
          return;
        }

        const { ctx, chartArea } =
          chartInstance;

        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(
          Math.round(x) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(x) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();
        ctx.restore();
      }
    };

    const axisSpinesPlugin = {
      id: 'axisSpinesPlugin',

      afterDraw(chartInstance) {
        const { ctx, chartArea } =
          chartInstance;

        ctx.save();
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;

        // Fixed left y-axis spine.
        ctx.beginPath();
        ctx.moveTo(
          Math.round(chartArea.left) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(chartArea.left) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();

        // Fixed bottom x-axis spine.
        ctx.beginPath();
        ctx.moveTo(
          chartArea.left,
          Math.round(chartArea.bottom) + 0.5
        );
        ctx.lineTo(
          chartArea.right,
          Math.round(chartArea.bottom) + 0.5
        );
        ctx.stroke();

        ctx.restore();
      }
    };

    const minorTicksPlugin = {
      id: 'minorTicksPlugin',

      afterDraw(chartInstance) {
        const xScale =
          chartInstance.scales.x;

        const { ctx, chartArea } =
          chartInstance;

        const scaleDef =
          state.scaleCache[state.mode];

        if (
          !xScale ||
          !scaleDef ||
          !Number.isFinite(scaleDef.minorStep) ||
          scaleDef.minorStep <= 0
        ) {
          return;
        }

        const minorStep =
          scaleDef.minorStep;

        const majorStep =
          scaleDef.step;

        const epsilon =
          minorStep * 0.0001;

        ctx.save();
        ctx.strokeStyle = '#69718a';
        ctx.globalAlpha = 0.60;
        ctx.lineWidth = 1;

        const first =
          Math.ceil(
            scaleDef.min / minorStep
          ) * minorStep;

        for (
          let value = first;
          value <= scaleDef.max + epsilon;
          value += minorStep
        ) {
          const majorRatio =
            value / majorStep;

          const isMajor =
            Math.abs(
              majorRatio - Math.round(majorRatio)
            ) < 0.00001;

          if (isMajor) {
            continue;
          }

          const x =
            xScale.getPixelForValue(value);

          if (
            x < chartArea.left - 0.5 ||
            x > chartArea.right + 0.5
          ) {
            continue;
          }

          ctx.beginPath();
          ctx.moveTo(
            Math.round(x) + 0.5,
            chartArea.bottom
          );
          ctx.lineTo(
            Math.round(x) + 0.5,
            chartArea.bottom + 3
          );
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    const barValueLabelsPlugin = {
      id: 'barValueLabelsPlugin',

      afterDatasetsDraw(chartInstance) {
        const { ctx, chartArea } =
          chartInstance;

        const meta =
          chartInstance.getDatasetMeta(0);

        const targetValues =
          chartInstance.data.datasets[0].data;

        const colours =
          chartInstance.data.datasets[0].backgroundColor;

        const xScale =
          chartInstance.scales.x;

        if (!meta?.data || !xScale) {
          return;
        }

        ctx.save();
        ctx.font =
          `${window.innerWidth <= 430 ? 8.5 : 9.5}px Lato, sans-serif`;
        ctx.textBaseline = 'middle';

        meta.data.forEach(
          (bar, index) => {
            const target =
              Number(targetValues[index]);

            if (!Number.isFinite(target)) {
              return;
            }

            // Convert the CURRENT animated bar end back into a data value.
            // This makes the label count smoothly while the bar morphs.
            let currentValue =
              xScale.getValueForPixel(bar.x);

            if (!Number.isFinite(currentValue)) {
              currentValue = target;
            }

            // Avoid a tiny signed value at the start of an animation.
            if (Math.abs(currentValue) < 0.000001) {
              currentValue = 0;
            }

            const text =
              formatDisplayValue(
                currentValue,
                state.mode,
                state.mode === 'oversupply'
              );

            const textWidth =
              ctx.measureText(text).width;

            const negative =
              target < 0;

            let x =
              negative
                ? bar.x - 6
                : bar.x + 6;

            let align =
              negative
                ? 'right'
                : 'left';

            if (
              !negative &&
              x + textWidth > chartArea.right - 1
            ) {
              x = chartArea.right - 1;
              align = 'right';
            }

            if (
              negative &&
              x - textWidth < chartArea.left + 1
            ) {
              x = chartArea.left + 1;
              align = 'left';
            }

            ctx.fillStyle =
              Array.isArray(colours)
                ? colours[index]
                : colours;

            ctx.textAlign = align;
            ctx.fillText(text, x, bar.y);
          }
        );

        ctx.restore();
      }
    };

    Chart.register(
      zeroLinePlugin,
      axisSpinesPlugin,
      minorTicksPlugin,
      barValueLabelsPlugin
    );

    // ============================================================
    // CHART CONFIGURATION
    // ============================================================

    function chartAnimationDuration(reason) {
      if (reducedMotion()) {
        return 0;
      }

      switch (reason) {
        case 'tab':
          return 820;

        case 'benchmark':
          return 620;

        case 'year':
          return 520;

        case 'initial':
          return 900;

        default:
          return 520;
      }
    }

    function tooltipLabel(context) {
      const value = Number(context.raw);
      const stateCode = STATE_CODES[context.dataIndex];

      if (state.mode === 'oversupply') {
        return `${stateCode}: ${formatDisplayValue(value, 'oversupply', true)} FTE`;
      }

      if (state.mode === 'clinicians') {
        return `${stateCode}: ${formatDisplayValue(value)} FTE`;
      }

      if (state.mode === 'population') {
        return `${stateCode}: ${formatDisplayValue(value)} people`;
      }

      return `${stateCode}: ${formatDisplayValue(value)} people per FTE`;
    }

    function baseChartOptions() {
      const mobile =
        window.innerWidth <= 430;

      const scaleDef =
        state.scaleCache[state.mode];

      return {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 80,

        animation: {
          duration: 900,
          easing: 'easeOutQuart'
        },

        transitions: {
          active: {
            animation: {
              duration: 180
            }
          }
        },

        interaction: {
          mode: 'nearest',
          axis: 'y',
          intersect: true
        },

        layout: {
          autoPadding: false,
          padding: {
            top: 1,
            right: 1,
            bottom: 0,
            left: 0
          }
        },

        plugins: {
          legend: {
            display: false
          },

          tooltip: {
            displayColors: true,
            backgroundColor: 'rgba(21, 21, 21, 0.94)',
            titleColor: '#ffffff',
            bodyColor: '#ffffff',
            borderColor: 'rgba(255,255,255,0.10)',
            borderWidth: 1,
            padding: 9,
            cornerRadius: 4,

            titleFont: {
              family: 'Lato',
              size: 11,
              weight: '700'
            },

            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },

            callbacks: {
              title(items) {
                return items?.[0]?.label || '';
              },

              label(context) {
                return tooltipLabel(context);
              }
            }
          }
        },

        scales: {
          x: {
            type: 'linear',
            min: scaleDef.min,
            max: scaleDef.max,

            border: {
              display: false
            },

            grid: {
              drawOnChartArea: true,
              drawTicks: true,
              tickLength: 5,
              tickWidth: 1,
              tickColor: '#69718a',
              color: 'rgba(105, 113, 138, 0.16)',
              lineWidth: 1
            },

            title: {
              display: true,
              text: xAxisTitle(state.mode),
              color: '#151515',
              padding: {
                top: 5
              },
              font: {
                family: 'Lato',
                size: 10,
                weight: '400'
              }
            },

            ticks: {
              autoSkip: false,
              stepSize: scaleDef.step,
              color: '#151515',
              padding: 2,
              font: {
                family: 'Lato',
                size: 9.5,
                weight: '400'
              },
              callback(value) {
                return formatAxisValue(value);
              }
            }
          },

          y: {
            position: 'left',

            border: {
              display: false
            },

            grid: {
              display: false,
              drawTicks: true,
              tickLength: 3,
              tickWidth: 1,
              tickColor: '#151515'
            },

            ticks: {
              autoSkip: false,
              color: '#151515',
              padding: 3,
              font: {
                family: 'Lato',
                size: mobile ? 7.4 : 8.1,
                weight: '400'
              }
            }
          }
        }
      };
    }

    function createChart() {
      const values = metricValues();

      chart =
        new Chart(
          chartCanvas,
          {
            type: 'bar',

            data: {
              labels: PHNS,
              datasets: [
                {
                  data: values,
                  backgroundColor: BAR_COLOURS,
                  borderColor: BAR_COLOURS,
                  borderWidth: 0,
                  borderRadius: 2,
                  borderSkipped: false,
                  categoryPercentage: 0.78,
                  barPercentage: 0.80
                }
              ]
            },

            options: baseChartOptions()
          }
        );
    }

    function syncChartScale() {
      const scaleDef =
        state.scaleCache[state.mode];

      const x =
        chart.options.scales.x;

      x.min = scaleDef.min;
      x.max = scaleDef.max;
      x.ticks.stepSize = scaleDef.step;
      x.title.text = xAxisTitle(state.mode);
      x.ticks.callback = value => formatAxisValue(value);

      chart.options.scales.y.ticks.font.size =
        window.innerWidth <= 430
          ? 7.4
          : 8.1;
    }

    function renderChart(
      reason = 'year',
      animateText = true
    ) {
      if (!state.year) {
        return;
      }

      const modeChanged =
        state.lastRenderedMode !== state.mode;

      animateChangedText(
        headingMetric,
        metricTitle(state.mode),
        animateText && modeChanged
      );

      setYearText(
        String(state.year),
        animateText
      );

      chartNote.textContent =
        chartNoteText();

      benchmarkControl.classList.toggle(
        'is-hidden',
        state.mode !== 'oversupply'
      );

      if (!chart) {
        createChart();
        state.lastRenderedMode = state.mode;

        requestAnimationFrame(
          () => syncZeroLine(true)
        );

        return;
      }

      chart.data.datasets[0].data =
        metricValues();

      chart.data.datasets[0].backgroundColor =
        BAR_COLOURS;

      chart.data.datasets[0].borderColor =
        BAR_COLOURS;

      syncChartScale();

      chart.options.animation.duration =
        chartAnimationDuration(reason);

      chart.update();

      requestAnimationFrame(
        () => syncZeroLine(reason === 'tab')
      );

      state.lastRenderedMode = state.mode;
    }

    // ============================================================
    // TABS
    // ============================================================

    function positionTabIndicator(
      animate = true
    ) {
      const activeTab =
        tabs.find(
          tab => tab.classList.contains('is-active')
        );

      if (!activeTab) {
        return;
      }

      if (!animate) {
        tabList.classList.add('is-positioning');
      }

      const listRect =
        tabList.getBoundingClientRect();

      const tabRect =
        activeTab.getBoundingClientRect();

      const x =
        tabRect.left -
        listRect.left +
        tabList.scrollLeft;

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${x}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${tabRect.width}px`
      );

      if (!animate) {
        requestAnimationFrame(
          () => {
            requestAnimationFrame(
              () => {
                tabList.classList.remove('is-positioning');
              }
            );
          }
        );
      }
    }

    function setActiveTab(mode) {
      if (mode === state.mode) {
        return;
      }

      state.mode = mode;

      tabs.forEach(
        tab => {
          const active =
            tab.dataset.mode === mode;

          tab.classList.toggle(
            'is-active',
            active
          );

          tab.setAttribute(
            'aria-selected',
            active ? 'true' : 'false'
          );
        }
      );

      const activeTab =
        tabs.find(
          tab => tab.dataset.mode === mode
        );

      activeTab?.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest',
        inline: 'nearest'
      });

      configureYearSlider(
        true,
        true
      );

      positionTabIndicator(true);
      renderChart('tab', true);
    }

    // ============================================================
    // BENCHMARK TOGGLE
    // ============================================================

    function syncBenchmarkToggle() {
      const fiveK =
        state.benchmarkPopulation === 5000;

      benchmarkModeToggle.classList.toggle(
        'is-five-k-selected',
        fiveK
      );

      benchmark10k.classList.toggle(
        'is-active',
        !fiveK
      );

      benchmark5k.classList.toggle(
        'is-active',
        fiveK
      );

      benchmark10k.setAttribute(
        'aria-pressed',
        String(!fiveK)
      );

      benchmark5k.setAttribute(
        'aria-pressed',
        String(fiveK)
      );
    }

    function setBenchmark(value) {
      const next = Number(value);

      if (
        ![5000, 10000].includes(next) ||
        next === state.benchmarkPopulation
      ) {
        return;
      }

      state.benchmarkPopulation = next;
      syncBenchmarkToggle();

      if (state.mode === 'oversupply') {
        renderChart('benchmark', false);
      }
    }

    // ============================================================
    // EVENTS
    // ============================================================

    tabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => setActiveTab(tab.dataset.mode)
        );
      }
    );

    yearSlider.addEventListener(
      'input',
      () => {
        yearSliderWrap.classList.add('has-been-dragged');

        const index =
          Number(yearSlider.value);

        const year =
          state.activeYears[index];

        if (!Number.isFinite(year)) {
          return;
        }

        if (year === state.year) {
          updateSliderProgress();
          return;
        }

        state.year = year;
        updateSliderProgress();
        renderChart('year', true);
      }
    );

    benchmark10k.addEventListener(
      'click',
      () => setBenchmark(10000)
    );

    benchmark5k.addEventListener(
      'click',
      () => setBenchmark(5000)
    );

    window.addEventListener(
      'resize',
      () => {
        positionTabIndicator(false);
        updateSliderProgress();

        if (chart) {
          chart.options.scales.y.ticks.font.size =
            window.innerWidth <= 430
              ? 7.4
              : 8.1;

          chart.resize();

          requestAnimationFrame(
            () => {
              const target = zeroTargetPixel();

              if (Number.isFinite(target)) {
                zeroLineState.x = target;
                zeroLineState.opacity = 1;
              } else {
                zeroLineState.x = null;
                zeroLineState.opacity = 0;
              }

              chart.draw();
            }
          );
        }
      }
    );

    // ============================================================
    // DATA STATUS
    // ============================================================

    function updateSourceStatus() {
      const cached =
        state.sourceState === 'cached';

      liveData.classList.toggle(
        'is-cached',
        cached
      );

      liveDataText.textContent =
        cached ? 'CACHED' : 'LIVE';

      liveData.setAttribute(
        'aria-label',
        cached ? 'Cached data' : 'Live data'
      );
    }

    // ============================================================
    // INITIALISE
    // ============================================================

    async function initialise() {
      try {
        await loadData();

        buildScaleCache();
        updateSourceStatus();
        syncBenchmarkToggle();

        // Default to the most recent year available for the default tab.
        configureYearSlider(false, false);

        renderChart('initial', false);

        app.classList.remove('is-loading');

        requestAnimationFrame(
          () => {
            positionTabIndicator(false);
            syncZeroLine(true);
          }
        );
      } catch (error) {
        app.classList.remove('is-loading');
        liveData.style.visibility = 'hidden';

        statusEl.textContent =
          `${error.message || 'Could not load the Google Sheet.'} Make sure the spreadsheet is viewable without signing in.`;
      }
    }

    initialise();
  </script>
</body>
