<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF PHN Workforce</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --nsw: #2db7f5;
      --vic: #2d3a8c;
      --qld: #7a0036;
      --sa: #f03a47;
      --wa: #000000;
      --tas: #22a36b;
      --nt: #c25e00;
      --act: #7b61ff;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-touch-callout: none;
    }

    button,
    input {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      min-height: 100vh;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(calc(100% - 12px), 520px);
      height: 100vh;
      min-height: 780px;
      max-width: 100%;
      min-width: 0;
      margin-inline: auto;
      padding: 7px 6px 8px;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .module-top {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        width 420ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    .chart-heading-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      min-height: 31px;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin: 0;
    }

    .chart-heading {
      min-width: 0;
      margin: 0;
      padding: 4px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      align-items: center;
      gap: 10px;
      padding: 1px 0 7px;
    }

    .year-control {
      flex: 1 1 auto;
      min-width: 0;
    }

    .year-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 18px;
      margin-bottom: 1px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
    }

    .year-value {
      color: var(--purple);
      font-size: 11px;
      font-weight: 700;
    }

    .year-slider {
      --range-progress: 100%;
      display: block;
      width: 100%;
      height: 14px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
    }

    .year-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background:
        linear-gradient(
          to right,
          var(--purple) 0%,
          var(--purple) var(--range-progress),
          var(--track) var(--range-progress),
          var(--track) 100%
        );
    }

    .year-slider::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      margin-top: -5px;
      appearance: none;
      -webkit-appearance: none;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 0 1px rgba(102, 0, 255, 0.22);
    }

    .year-slider::-moz-range-track {
      width: 100%;
      height: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--track);
    }

    .year-slider::-moz-range-progress {
      height: 4px;
      border-radius: 999px;
      background: var(--purple);
    }

    .year-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 0 1px rgba(102, 0, 255, 0.22);
    }

    .year-slider:focus-visible {
      outline: none;
    }

    .year-slider:focus-visible::-webkit-slider-thumb {
      box-shadow:
        0 0 0 1px rgba(102, 0, 255, 0.22),
        0 0 0 4px rgba(102, 0, 255, 0.12);
    }

    .year-ends {
      display: flex;
      justify-content: space-between;
      margin-top: -1px;
      color: var(--muted);
      font-size: 8px;
      line-height: 1;
    }

    .benchmark-wrap {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      padding-top: 1px;
    }

    .benchmark-wrap.is-hidden {
      display: none;
    }

    .benchmark-label {
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
    }

    .benchmark-toggle {
      display: inline-grid;
      grid-template-columns: auto 30px auto;
      align-items: center;
      gap: 5px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .benchmark-option {
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      transition: color 160ms ease;
    }

    .benchmark-option.is-active {
      color: var(--purple);
    }

    .toggle-track {
      position: relative;
      width: 30px;
      height: 16px;
      border-radius: 999px;
      background: #ddd8e8;
      box-shadow: inset 0 0 0 1px rgba(102, 0, 255, 0.08);
      transition: background 180ms ease;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
      transform: translateX(0);
      transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .benchmark-toggle.is-five-k .toggle-thumb {
      transform: translateX(14px);
    }

    .benchmark-toggle:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .chart-note {
      flex: 0 0 auto;
      min-height: 13px;
      margin: -2px 0 2px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.3;
    }

    .chart-note:empty {
      display: none;
    }

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
    }

    #phnChart {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    @media (max-width: 420px) {
      #app {
        min-height: 850px;
      }

      .chart-tab {
        padding-right: 8px;
        padding-left: 8px;
        font-size: 12px;
      }

      .controls-row {
        gap: 7px;
      }

      .benchmark-toggle {
        gap: 4px;
      }

      .benchmark-option {
        font-size: 8px;
      }

      .toggle-track {
        width: 28px;
      }

      .benchmark-toggle.is-five-k .toggle-thumb {
        transform: translateX(12px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading">
      <div class="app-loading" aria-live="polite">
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading PHN workforce data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div id="tabList" class="tab-list" role="tablist" aria-label="PHN workforce charts">
            <button class="chart-tab is-active" type="button" role="tab" aria-selected="true" data-mode="oversupply">Oversupply</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-mode="coverage">Coverage</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-mode="population">Population</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-mode="clinicians">Clinicians</button>
          </div>
        </div>

        <div id="liveData" class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="liveDataText">LIVE</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 id="chartHeading" class="chart-heading">FTE clinician oversupply</h2>
      </div>

      <div class="controls-row">
        <div class="year-control">
          <div class="year-topline">
            <span>Year</span>
            <span id="yearValue" class="year-value">—</span>
          </div>

          <input
            id="yearSlider"
            class="year-slider"
            type="range"
            min="0"
            max="0"
            step="1"
            value="0"
            aria-label="Year"
          >

          <div class="year-ends" aria-hidden="true">
            <span id="yearMin">—</span>
            <span id="yearMax">—</span>
          </div>
        </div>

        <div id="benchmarkWrap" class="benchmark-wrap">
          <span class="benchmark-label">Benchmark</span>

          <button
            id="benchmarkToggle"
            class="benchmark-toggle"
            type="button"
            aria-label="Switch oversupply benchmark between one FTE per 10,000 people and one FTE per 5,000 people"
            aria-pressed="false"
          >
            <span id="benchmark10Label" class="benchmark-option is-active">1 / 10k</span>

            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>

            <span id="benchmark5Label" class="benchmark-option">1 / 5k</span>
          </button>
        </div>
      </div>

      <div id="chartNote" class="chart-note"></div>

      <div class="chart-shell">
        <canvas
          id="phnChart"
          aria-label="Primary Health Network workforce chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    // ============================================================

    const SHEET_ID =

    const CLINICIAN_SHEET =

    const POPULATION_SHEET =

    // Row 30 = headers.

    // ============================================================

    const state = {
      mode: DEFAULT_MODE,

      activeYears: [],

    };

    let chart =

    // ============================================================
    // GOOGLE SHEETS JSONP LOADER
    // ============================================================

    function loadGVizSheet(
      sheetName,
      range
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `__pff_gviz_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement(
              'script'
            );

          let completed =
            false;

          const cleanup = () => {
            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }

            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] =
                undefined;
            }
          };

          const timer =
            window.setTimeout(
              () => {
                if (completed) {
                  return;
                }

                completed =
                  true;

                cleanup();

                reject(
                  new Error(
                    `Timed out loading ${sheetName}.`
                  )
                );
              },
              15000
            );

          window[callbackName] =
            response => {
              if (completed) {
                return;
              }

              completed =
                true;

              window.clearTimeout(
                timer
              );

              cleanup();

              if (
                !response ||
                response.status === 'error'
              ) {
                const message =
                  response
                    ?.errors?.[0]
                    ?.detailed_message ||
                  response
                    ?.errors?.[0]
                    ?.message ||
                  `Could not load ${sheetName}.`;

                reject(
                  new Error(
                    message
                  )
                );

                return;
              }

              resolve(
                response.table
              );
            };

          script.onerror = () => {
            if (completed) {
              return;
            }

            completed =
              true;

            window.clearTimeout(
              timer
            );

            cleanup();

            reject(
              new Error(
                `Could not connect to ${sheetName}.`
              )
            );
          };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              headers: '1',
              tqx:
                `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async =
            true;

          document.head.appendChild(
            script
          );
        }
      );
    }

    function numericCell(
      cell
    ) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return null;
      }

      if (
        typeof cell.v === 'number'
      ) {
        return Number.isFinite(
          cell.v
        )
          ? cell.v
          : null;
      }

      const cleaned =
        String(cell.v)
          .replace(/,/g, '')
          .replace(
            /[^0-9.+-]/g,
            ''
          );

      if (!cleaned) {
        return null;
      }

      const value =
        Number(cleaned);

      return Number.isFinite(
        value
      )
        ? value
        : null;
    }

    function yearCell(
      cell
    ) {
      const value =
        numericCell(cell);

      if (value === null) {
        return null;
      }

      const year =
        Math.round(value);

      return (
        year >= 1900 &&
        year <= 2200
      )
        ? year
        : null;
    }

    function parseClinicianTable(
      table
    ) {
      const result =
        {};

      const rows =
        table?.rows || [];

      for (
        const row of rows
      ) {
        const cells =
          row?.c || [];

        const year =
          yearCell(
            cells[0]
          );

        if (!year) {
          continue;
        }

        const values =
          PHNS.map(
            (_, index) =>
              numericCell(
                cells[
                  CLINICIAN_FIRST_INDEX +
                  index
                ]
              )
          );

        if (
          values.some(
            Number.isFinite
          )
        ) {
          result[year] =
            values;
        }
      }

      return result;
    }

    function parsePopulationTable(
      table
    ) {
      const result =
        {};

      const rows =
        table?.rows || [];

      for (
        const row of rows
      ) {
        const cells =
          row?.c || [];

        const year =
          yearCell(
            cells[0]
          );

        if (!year) {
          continue;
        }

        const values =
          PHNS.map(
            (_, index) =>
              numericCell(
                cells[
                  POPULATION_FIRST_INDEX +
                  index
                ]
              )
          );

        if (
          values.some(
            Number.isFinite
          )
        ) {
          result[year] =
            values;
        }
      }

      return result;
    }

    // ============================================================
    // CACHE
    // ============================================================

    function saveCache() {
      try {
        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            savedAt:
              Date.now(),

            clinicianByYear:
              state.clinicianByYear,

            populationByYear:
              state.populationByYear
          })
        );
      } catch (_) {
        // Cache is optional.
      }
    }

    function loadCache() {
      try {
        const raw =
          localStorage.getItem(
            CACHE_KEY
          );

        if (!raw) {
          return false;
        }

        const cached =
          JSON.parse(raw);

        if (
          !cached?.clinicianByYear ||
          !cached?.populationByYear
        ) {
          return false;
        }

        state.clinicianByYear =
          cached.clinicianByYear;

        state.populationByYear =
          cached.populationByYear;

        return true;
      } catch (_) {
        return false;
      }
    }

    async function loadData() {
      try {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            loadGVizSheet(
              CLINICIAN_SHEET,
              CLINICIAN_RANGE
            ),

            loadGVizSheet(
              POPULATION_SHEET,
              POPULATION_RANGE
            )
          ]);

        state.clinicianByYear =
          parseClinicianTable(
            clinicianTable
          );

        state.populationByYear =
          parsePopulationTable(
            populationTable
          );

        if (
          !Object.keys(
            state.clinicianByYear
          ).length
        ) {
          throw new Error(
            'No clinician rows were found from row 31 onward.'
          );
        }

        if (
          !Object.keys(
            state.populationByYear
          ).length
        ) {
          throw new Error(
            'No population rows were found from row 31 onward.'
          );
        }

        state.sourceState =
          'live';

        saveCache();

        return;
      } catch (error) {
        if (loadCache()) {
          state.sourceState =
            'cached';

          statusEl.textContent =
            '';

          return;
        }

        throw error;
      }
    }

    // ============================================================
    // YEAR HANDLING
    // ============================================================

    function sortedYears(
      object
    ) {
      return Object.keys(
        object
      )
        .map(Number)
        .filter(
          Number.isFinite
        )
        .sort(
          (a, b) =>
            a - b
        );
    }

    function commonYears() {
      const clinicianYears =
        new Set(
          sortedYears(
            state.clinicianByYear
          )
        );

      return sortedYears(
        state.populationByYear
      ).filter(
        year =>
          clinicianYears.has(
            year
          )
      );
    }

    function yearsForMode(
      mode
    ) {
      if (
        mode === 'clinicians'
      ) {
        return sortedYears(
          state.clinicianByYear
        );
      }

      if (
        mode === 'population'
      ) {
        return sortedYears(
          state.populationByYear
        );
      }

      return commonYears();
    }

    function configureYearSlider(
      keepYear = true
    ) {
      const years =
        yearsForMode(
          state.mode
        );

      state.activeYears =
        years;

      if (!years.length) {
        state.year =
          null;

        yearSlider.min =
          '0';

        yearSlider.max =
          '0';

        yearSlider.value =
          '0';

        yearSlider.disabled =
          true;

        yearValue.textContent =
          '—';

        yearMin.textContent =
          '—';

        yearMax.textContent =
          '—';

        updateSliderFill();

        return;
      }

      yearSlider.disabled =
        false;

      if (
        !keepYear ||
        !years.includes(
          state.year
        )
      ) {
        state.year =
          years[
            years.length - 1
          ];
      }

      const index =
        years.indexOf(
          state.year
        );

      yearSlider.min =
        '0';

      yearSlider.max =
        String(
          years.length - 1
        );

      yearSlider.step =
        '1';

      yearSlider.value =
        String(
          Math.max(
            0,
            index
          )
        );

      yearValue.textContent =
        String(
          state.year
        );

      yearMin.textContent =
        String(
          years[0]
        );

      yearMax.textContent =
        String(
          years[
            years.length - 1
          ]
        );

      updateSliderFill();
    }

    function updateSliderFill() {
      const min =
        Number(
          yearSlider.min
        );

      const max =
        Number(
          yearSlider.max
        );

      const value =
        Number(
          yearSlider.value
        );

      const percentage =
        max > min
          ? (
              (
                value - min
              ) /
              (
                max - min
              )
            ) * 100
          : 100;

      yearSlider.style.setProperty(
        '--range-progress',
        `${percentage}%`
      );
    }

    // ============================================================
    // METRIC CALCULATIONS
    // ============================================================

    function safeNumber(
      value
    ) {
      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {
        return null;
      }

      const numeric =
        Number(value);

      return Number.isFinite(
        numeric
      )
        ? numeric
        : null;
    }

    function metricValues() {
      if (!state.year) {
        return PHNS.map(
          () => null
        );
      }

      const clinicians =
        state.clinicianByYear[
          state.year
        ] || [];

      const population =
        state.populationByYear[
          state.year
        ] || [];

      if (
        state.mode ===
        'clinicians'
      ) {
        return PHNS.map(
          (_, index) =>
            safeNumber(
              clinicians[
                index
              ]
            )
        );
      }

      if (
        state.mode ===
        'population'
      ) {
        return PHNS.map(
          (_, index) =>
            safeNumber(
              population[
                index
              ]
            )
        );
      }

      if (
        state.mode ===
        'coverage'
      ) {
        return PHNS.map(
          (_, index) => {
            const c =
              safeNumber(
                clinicians[
                  index
                ]
              );

            const p =
              safeNumber(
                population[
                  index
                ]
              );

            if (
              c === null ||
              p === null ||
              c <= 0
            ) {
              return null;
            }

            return p / c;
          }
        );
      }

      // Oversupply =
      // observed FTE minus required FTE.

      return PHNS.map(
        (_, index) => {
          const c =
            safeNumber(
              clinicians[
                index
              ]
            );

          const p =
            safeNumber(
              population[
                index
              ]
            );

          if (
            c === null ||
            p === null
          ) {
            return null;
          }

          return (
            c -
            (
              p /
              state.benchmarkPopulation
            )
          );
        }
      );
    }

    function headingText() {
      const year =
        state.year ?? '—';

      switch (
        state.mode
      ) {
        case 'clinicians':
          return (
            `# FTE clinicians (${year})`
          );

        case 'population':
          return (
            `Population (${year})`
          );

        case 'coverage':
          return (
            `Population per FTE clinician (${year})`
          );

        case 'oversupply':
        default:
          return (
            `FTE clinician oversupply (${year})`
          );
      }
    }

    function xAxisTitle() {
      switch (
        state.mode
      ) {
        case 'clinicians':
          return 'Count';

        case 'population':
          return 'Population';

        case 'coverage':
          return (
            'People per FTE clinician'
          );

        case 'oversupply':
        default:
          return (
            'Excess FTE clinicians'
          );
      }
    }

    function formatValue(
      value
    ) {
      if (
        !Number.isFinite(
          value
        )
      ) {
        return '—';
      }

      if (
        state.mode ===
        'oversupply'
      ) {
        const rounded =
          Math.round(
            value * 10
          ) / 10;

        const sign =
          rounded > 0
            ? '+'
            : '';

        return (
          `${sign}${rounded.toLocaleString(
            'en-AU',
            {
              minimumFractionDigits:
                1,

              maximumFractionDigits:
                1
            }
          )}`
        );
      }

      return Math.round(
        value
      ).toLocaleString(
        'en-AU'
      );
    }

    function formatAxisValue(
      value
    ) {
      const numeric =
        Number(value);

      if (
        !Number.isFinite(
          numeric
        )
      ) {
        return '';
      }

      if (
        state.mode ===
        'population'
      ) {
        const abs =
          Math.abs(
            numeric
          );

        if (
          abs >= 1000000
        ) {
          return (
            `${(
              numeric /
              1000000
            ).toFixed(
              abs >= 10000000
                ? 0
                : 1
            )}m`
          );
        }

        if (
          abs >= 1000
        ) {
          return (
            `${(
              numeric /
              1000
            ).toFixed(
              abs >= 100000
                ? 0
                : 1
            )}k`
          );
        }
      }

      if (
        state.mode ===
        'oversupply'
      ) {
        return Number.isInteger(
          numeric
        )
          ? numeric.toLocaleString(
              'en-AU'
            )
          : numeric.toLocaleString(
              'en-AU',
              {
                maximumFractionDigits:
                  1
              }
            );
      }

      return Math.round(
        numeric
      ).toLocaleString(
        'en-AU'
      );
    }

    function chartNoteText() {
      if (
        state.mode !==
        'oversupply'
      ) {
        return '';
      }

      const benchmark =
        state.benchmarkPopulation
          .toLocaleString(
            'en-AU'
          );

      return (
        `Benchmark: 1 FTE per ${benchmark} people. Positive = oversupply; negative = shortfall.`
      );
    }

    // ============================================================
    // VALUE LABELS
    // ============================================================

    const barValueLabels = {
      id:
        'barValueLabels',

      afterDatasetsDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        const meta =
          chartInstance
            .getDatasetMeta(
              0
            );

        const data =
          chartInstance
            .data
            .datasets[0]
            .data;

        const colours =
          chartInstance
            .data
            .datasets[0]
            .backgroundColor;

        ctx.save();

        ctx.font =
          `${window.innerWidth <= 420 ? 9 : 10}px Lato, sans-serif`;

        ctx.textBaseline =
          'middle';

        meta.data.forEach(
          (
            bar,
            index
          ) => {
            const value =
              data[index];

            if (
              !Number.isFinite(
                value
              )
            ) {
              return;
            }

            const text =
              formatValue(
                value
              );

            const textWidth =
              ctx.measureText(
                text
              ).width;

            const isNegative =
              value < 0;

            let x =
              isNegative
                ? bar.x - 7
                : bar.x + 7;

            let align =
              isNegative
                ? 'right'
                : 'left';

            if (
              !isNegative &&
              x + textWidth >
                chartArea.right - 1
            ) {
              x =
                chartArea.right - 1;

              align =
                'right';
            }

            if (
              isNegative &&
              x - textWidth <
                chartArea.left + 1
            ) {
              x =
                chartArea.left + 1;

              align =
                'left';
            }

            ctx.fillStyle =
              Array.isArray(
                colours
              )
                ? colours[index]
                : colours;

            ctx.textAlign =
              align;

            ctx.fillText(
              text,
              x,
              bar.y
            );
          }
        );

        ctx.restore();
      }
    };

    Chart.register(
      barValueLabels
    );

    // ============================================================
    // CHART
    // ============================================================

    function xBounds(
      values
    ) {
      const finite =
        values.filter(
          Number.isFinite
        );

      if (
        !finite.length
      ) {
        return {
          min: 0,
          max: 1
        };
      }

      if (
        state.mode !==
        'oversupply'
      ) {
        const maxValue =
          Math.max(
            ...finite,
            1
          );

        return {
          min: 0,
          max:
            maxValue *
            1.16
        };
      }

      const rawMin =
        Math.min(
          0,
          ...finite
        );

      const rawMax =
        Math.max(
          0,
          ...finite
        );

      const span =
        Math.max(
          rawMax - rawMin,
          1
        );

      const pad =
        span * 0.11;

      return {
        min:
          rawMin < 0
            ? rawMin - pad
            : 0,

        max:
          rawMax + pad
      };
    }

    function chartOptions(
      values
    ) {

        xBounds(values);

      const mobile =
        window.innerWidth <=
        420;

      return {
        indexAxis:
          'y',

        responsive:
          true,

        maintainAspectRatio:
          false,

        animation: {
          duration:
            300,

          easing:
            'easeOutQuart'
        },

        resizeDelay:
          80,

        interaction: {
          mode:
            'nearest',

          axis:
            'y',

          intersect:
            true
        },

        layout: {
          padding: {
            top: 2,
            right: 2,
            bottom: 0,
            left: 0
          }
        },

        plugins: {
          legend: {
            display:
              false
          },

          tooltip: {
            displayColors:
              true,

            backgroundColor:
              'rgba(21, 21, 21, 0.94)',

            titleColor:
              '#ffffff',

            bodyColor:
              '#ffffff',

            borderColor:
              'rgba(255,255,255,0.10)',

            borderWidth:
              1,

            padding:
              9,

            cornerRadius:
              4,

            titleFont: {
              family:
                'Lato',

              size:
                11,

              weight:
                '700'
            },

            bodyFont: {
              family:
                'Lato',

              size:
                11,

              weight:
                '400'
            },

            callbacks: {
              title(
                items
              ) {
                return (
                  items?.[0]
                    ?.label ||
                  ''
                );
              },

              label(
                context
              ) {
                const value =
                  context.raw;

                const stateCode =
                  STATE_CODES[
                    context
                      .dataIndex
                  ];

                if (
                  state.mode ===
                  'oversupply'
                ) {
                  return (
                    `${stateCode}: ${formatValue(value)} FTE`
                  );
                }

                if (
                  state.mode ===
                  'clinicians'
                ) {
                  return (
                    `${stateCode}: ${formatValue(value)} FTE`
                  );
                }

                if (
                  state.mode ===
                  'population'
                ) {
                  return (
                    `${stateCode}: ${formatValue(value)} people`
                  );
                }

                return (
                  `${stateCode}: ${formatValue(value)} people per FTE`
                );
              }
            }
          }
        },

        scales: {
          x: {
            min:
              bounds.min,

            max:
              bounds.max,

            border: {
              color:
                '#151515',

              width:
                1
            },

            grid: {
              drawTicks:
                true,

              color(
                context
              ) {
                const value =
                  Number(
                    context
                      .tick
                      ?.value
                  );

                if (
                  state.mode ===
                    'oversupply' &&
                  Math.abs(
                    value
                  ) < 1e-9
                ) {
                  return (
                    'rgba(21,21,21,0.52)'
                  );
                }

                return (
                  'rgba(105,113,138,0.16)'
                );
              },

              lineWidth(
                context
              ) {
                const value =
                  Number(
                    context
                      .tick
                      ?.value
                  );

                return (
                  state.mode ===
                    'oversupply' &&
                  Math.abs(
                    value
                  ) < 1e-9
                )
                  ? 1.2
                  : 1;
              }
            },

            title: {
              display:
                true,

              text:
                xAxisTitle(),

              color:
                '#151515',

              padding: {
                top: 6
              },

              font: {
                family:
                  'Lato',

                size:
                  10,

                weight:
                  '400'
              }
            },

            ticks: {
              color:
                '#151515',

              maxTicksLimit:
                mobile
                  ? 5
                  : 6,

              font: {
                family:
                  'Lato',

                size:
                  10,

                weight:
                  '400'
              },

              callback(
                value
              ) {
                return (
                  formatAxisValue(
                    value
                  )
                );
              }
            }
          },

          y: {
            border: {
              display:
                false
            },

            grid: {
              display:
                false
            },

            ticks: {
              autoSkip:
                false,

              color:
                '#151515',

              padding:
                3,

              font: {
                family:
                  'Lato',

                size:
                  mobile
                    ? 8
                    : 8.5,

                weight:
                  '400'
              }
            }
          }
        }
      };

    function createChart() {
      const values =
        metricValues();

      chart =
        new Chart(
          chartCanvas,
          {
            type:
              'bar',

            data: {
              labels:
                PHNS,

              datasets: [
                {
                  data:
                    values,

                  backgroundColor:
                    BAR_COLOURS,

                  borderColor:
                    BAR_COLOURS,

                  borderWidth:
                    0,

                  borderRadius:
                    2,

                  borderSkipped:
                    false,

                  categoryPercentage:
                    0.78,

                  barPercentage:
                    0.78
                }
              ]
            },

            options:
              chartOptions(
                values
              )
          }
        );
    }

    function renderChart() {
      if (
        !state.year
      ) {
        return;
      }

      const values =
        metricValues();

      const bounds =
        xBounds(
          values
        );

      chartHeading.textContent =
        headingText();

      chartNote.textContent =
        chartNoteText();

      const oversupplyActive =
        state.mode ===
        'oversupply';

      benchmarkWrap
        .classList
        .toggle(
          'is-hidden',
          !oversupplyActive
        );

      if (!chart) {
        createChart();

        return;
      }

      chart.data.labels =
        PHNS;

      chart.data.datasets[0].data =
        values;

      chart.data.datasets[0].backgroundColor =
        BAR_COLOURS;

      chart.data.datasets[0].borderColor =
        BAR_COLOURS;

      chart.options.scales.x.min =
        bounds.min;

      chart.options.scales.x.max =
        bounds.max;

      chart.options.scales.x.title.text =
        xAxisTitle();

      chart.options.scales.x.ticks.callback =
        value =>
          formatAxisValue(
            value
          );

      chart.options.scales.y.ticks.font.size =
        window.innerWidth <= 420
          ? 8
          : 8.5;

      chart.update();
    }

    // ============================================================
    // TABS
    // ============================================================

    function positionTabIndicator(
      animate = true
    ) {
      const activeTab =
        tabs.find(
          tab =>
            tab.classList
              .contains(
                'is-active'
              )
        );

      if (!activeTab) {
        return;
      }

      if (!animate) {
        tabList.classList.add(
          'is-positioning'
        );
      }

      const listRect =
        tabList
          .getBoundingClientRect();

      const tabRect =
        activeTab
          .getBoundingClientRect();

      const x =
        tabRect.left -
        listRect.left +
        tabList.scrollLeft;

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${x}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${tabRect.width}px`
      );

      if (!animate) {
        requestAnimationFrame(
          () => {
            requestAnimationFrame(
              () => {
                tabList
                  .classList
                  .remove(
                    'is-positioning'
                  );
              }
            );
          }
        );
      }
    }

    function setActiveTab(
      mode
    ) {
      state.mode =
        mode;

      tabs.forEach(
        tab => {
          const active =
            tab.dataset.mode ===
            mode;

          tab.classList.toggle(
            'is-active',
            active
          );

          tab.setAttribute(
            'aria-selected',
            active
              ? 'true'
              : 'false'
          );
        }
      );

      const active =
        tabs.find(
          tab =>
            tab.dataset.mode ===
            mode
        );

      active?.scrollIntoView({
        behavior:
          'smooth',

        block:
          'nearest',

        inline:
          'nearest'
      });

      configureYearSlider(
        true
      );

      positionTabIndicator(
        true
      );

      renderChart();
    }

    // ============================================================
    // BENCHMARK TOGGLE
    // ============================================================

    function updateBenchmarkToggle() {
      const fiveK =
        state.benchmarkPopulation ===
        5000;

      benchmarkToggle
        .classList
        .toggle(
          'is-five-k',
          fiveK
        );

      benchmarkToggle.setAttribute(
        'aria-pressed',
        fiveK
          ? 'true'
          : 'false'
      );

      benchmark10Label
        .classList
        .toggle(
          'is-active',
          !fiveK
        );

      benchmark5Label
        .classList
        .toggle(
          'is-active',
          fiveK
        );
    }

    // ============================================================
    // EVENTS
    // ============================================================

    tabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => {
            if (
              tab.dataset.mode ===
              state.mode
            ) {
              return;
            }

            setActiveTab(
              tab.dataset.mode
            );
          }
        );
      }
    );

    yearSlider.addEventListener(
      'input',
      () => {
        const index =
          Number(
            yearSlider.value
          );

        const year =
          state.activeYears[
            index
          ];

        if (
          !Number.isFinite(
            year
          )
        ) {
          return;
        }

        state.year =
          year;

        yearValue.textContent =
          String(year);

        updateSliderFill();

        renderChart();
      }
    );

    benchmarkToggle.addEventListener(
      'click',
      () => {
        state.benchmarkPopulation =
          state.benchmarkPopulation ===
          10000
            ? 5000
            : 10000;

        updateBenchmarkToggle();

        renderChart();
      }
    );

    window.addEventListener(
      'resize',
      () => {
        positionTabIndicator(
          false
        );

        updateSliderFill();

        if (chart) {
          chart.options
            .scales
            .y
            .ticks
            .font
            .size =
              window.innerWidth <=
              420
                ? 8
                : 8.5;

          chart.options
            .scales
            .x
            .ticks
            .maxTicksLimit =
              window.innerWidth <=
              420
                ? 5
                : 6;

          chart.resize();
        }
      }
    );

    // ============================================================
    // SOURCE STATUS
    // ============================================================

    function updateSourceStatus() {
      const cached =
        state.sourceState ===
        'cached';

      liveData
        .classList
        .toggle(
          'is-cached',
          cached
        );

      liveDataText.textContent =
        cached
          ? 'CACHED'
          : 'LIVE';

      liveData.setAttribute(
        'aria-label',
        cached
          ? 'Cached data'
          : 'Live data'
      );
    }

    // ============================================================
    // INITIALISE
    // ============================================================

    async function initialise() {
      try {
        await loadData();

        updateSourceStatus();

        updateBenchmarkToggle();

        // false means:
        // do not preserve a previous year.
        // Use the newest available year.
        configureYearSlider(
          false
        );

        renderChart();

        app.classList.remove(
          'is-loading'
        );

        requestAnimationFrame(
          () => {
            positionTabIndicator(
              false
            );
          }
        );
      } catch (error) {
        app.classList.remove(
          'is-loading'
        );

        liveData.style.visibility =
          'hidden';

        statusEl.textContent =
          `${
            error.message ||
            'Could not load the Google Sheet.'
          } Make sure the spreadsheet is viewable without signing in.`;
      }
    }

    initialise();
  </script>
</body>
</html>
