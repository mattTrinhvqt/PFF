<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>CPD Certificate Request</title>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <script src="./assets/pff_chart_core.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      overflow: hidden;
    }

    #fit {
      width: 100%;
      min-height: 100dvh;
    }

    #app.box {
      display: block;
      width: min(calc(100% - 16px), 520px);
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 14px 14px 22px;
      background: transparent;
      text-align: center;
    }

    .step.is-active {
      display: grid;
      grid-template-areas:
        "progress"
        "body"
        "nav";
      grid-template-rows: 28px auto 48px;
      min-height: clamp(290px, 44dvh, 350px);
      align-items: stretch;
      align-content: start;
      row-gap: 16px;
    }

    .progress {
      grid-area: progress;
      min-height: 28px;
      margin: 0;
      padding: 0;
      color: var(--pff-purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 28px;
      text-align: center;
      text-transform: uppercase;
    }

    .step-body {
      grid-area: body;
      display: flex;
      min-width: 0;
      padding: 18px 0 0;
      flex-direction: column;
      align-items: stretch;
    }

    .step-body > label {
      display: flex;
      min-height: 100px;
      margin: 0;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: var(--pff-ink);
      font-size: clamp(22px, 5.4vw, 28px);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }

    .step-body > label small {
      display: block;
      margin-top: 8px;
      color: var(--pff-muted);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
    }

    .step-body > input[type="text"],
    .step-body > input[type="email"] {
      display: block;
      width: 100%;
      min-width: 0;
      height: 50px;
      margin: 0 auto;
      padding: 0 4px;
      color: var(--pff-ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--pff-track);
      border-radius: 0;
      font: inherit;
      font-size: 20px;
      text-align: center;
      outline: none;
      transition:
        border-color 140ms ease,
        box-shadow 140ms ease;
    }

    .step-body > input[type="text"]:hover,
    .step-body > input[type="email"]:hover {
      border-bottom-color: var(--pff-muted);
    }

    .step-body > input[type="text"]:focus-visible,
    .step-body > input[type="email"]:focus-visible {
      border-bottom-color: var(--pff-purple);
      box-shadow: none;
    }

    .nav-row {
      grid-area: nav;
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 48px;
      margin: 0;
      padding: 0;
      align-self: end;
      align-items: center;
      gap: 10px;
    }

    .nav-row .next,
    .nav-row #btn {
      min-height: 48px;
      flex: 1;
      padding: 0 18px;
      color: var(--pff-white);
      background: var(--pff-ink);
      border: 0;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
    }

    .nav-row .next:hover,
    .nav-row #btn:hover {
      background: #26324d;
    }

    .nav-row .next:focus-visible,
    .nav-row #btn:focus-visible {
      outline: none;
    }

    .nav-row .back {
      min-height: 48px;
      flex: 0 0 64px;
      padding: 0 4px;
      color: var(--pff-muted);
      background: transparent;
      border: 0;
      font-size: 14px;
    }

    .nav-row .back:hover {
      color: var(--pff-ink);
    }

    .nav-row .back:focus-visible {
      color: var(--pff-ink);
      outline: none;
    }

    .nav-row .next:only-child {
      width: 100%;
    }

    button:disabled,
    input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #msg {
      width: 100%;
      min-height: 0;
      margin: 14px auto 0;
      color: var(--pff-muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
    }

    #msg:empty {
      display: none;
    }

    #msg.terminal-state {
      min-height: 0;
      margin: 28px auto 0;
      text-align: center;
    }

    .terminal-card {
      width: 100%;
      text-align: center;
    }

    .terminal-title {
      color: var(--pff-ink);
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 700;
      line-height: 1.2;
    }

    .terminal-subtitle {
      margin-top: 8px;
      color: var(--pff-muted);
      font-size: 14px;
      line-height: 1.45;
    }

    @media (max-width: 430px) {
      #app.box {
        width: calc(100% - 12px);
        padding: 12px 8px 20px;
      }

      .step.is-active {
        min-height: clamp(280px, 42dvh, 340px);
        row-gap: 16px;
      }

      .step-body {
        padding-top: 16px;
      }

      .step-body > label {
        min-height: 94px;
      }

      .step-body > input[type="text"],
      .step-body > input[type="email"] {
        height: 46px;
        padding-right: 8px;
        padding-left: 8px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <div
      id="app"
      class="box"
    >
      <form id="f">
        <div
          class="step pff-step is-active"
          data-step="1"
        >
          <div class="step-body">
            <label for="eventId">
              Event ID
              <small>
                Shown during the presentation
              </small>
            </label>

            <input
              id="eventId"
              type="text"
              name="eventId"
              required
              maxlength="12"
              style="text-transform: uppercase"
              autocomplete="off"
              spellcheck="false"
              inputmode="text"
              enterkeyhint="next"
              pattern="[A-Za-z0-9]+"
              title="Letters and digits only"
            >
          </div>

          <div class="nav-row">
            <button
              type="button"
              class="next"
              data-step-next
            >
              Next
            </button>
          </div>

          <div class="progress"></div>
        </div>

        <div
          class="step pff-step"
          data-step="2"
        >
          <div class="step-body">
            <label for="firstName">
              First name
            </label>

            <input
              id="firstName"
              type="text"
              name="firstName"
              required
              autocomplete="given-name"
              enterkeyhint="next"
            >
          </div>

          <div class="nav-row">
            <button
              type="button"
              class="back"
              data-step-back
            >
              Back
            </button>

            <button
              type="button"
              class="next"
              data-step-next
            >
              Next
            </button>
          </div>

          <div class="progress"></div>
        </div>

        <div
          class="step pff-step"
          data-step="3"
        >
          <div class="step-body">
            <label for="lastName">
              Last name
            </label>

            <input
              id="lastName"
              type="text"
              name="lastName"
              required
              autocomplete="family-name"
              enterkeyhint="next"
            >
          </div>

          <div class="nav-row">
            <button
              type="button"
              class="back"
              data-step-back
            >
              Back
            </button>

            <button
              type="button"
              class="next"
              data-step-next
            >
              Next
            </button>
          </div>

          <div class="progress"></div>
        </div>

        <div
          class="step pff-step"
          data-step="4"
        >
          <div class="step-body">
            <label for="ahpra">
              Ahpra registration number
              <small>
                e.g., OPT0001234567
              </small>
            </label>

            <input
              id="ahpra"
              type="text"
              name="ahpra"
              required
              inputmode="text"
              enterkeyhint="next"
              pattern="[A-Za-z0-9]+"
              title="Letters and digits only"
              autocomplete="off"
              spellcheck="false"
            >
          </div>

          <div class="nav-row">
            <button
              type="button"
              class="back"
              data-step-back
            >
              Back
            </button>

            <button
              type="button"
              class="next"
              data-step-next
            >
              Next
            </button>
          </div>

          <div class="progress"></div>
        </div>

        <div
          class="step pff-step"
          data-step="5"
        >
          <div class="step-body">
            <label for="email">
              Email address
            </label>

            <input
              id="email"
              type="email"
              name="email"
              required
              inputmode="email"
              enterkeyhint="done"
              autocomplete="email"
            >
          </div>

          <div class="nav-row">
            <button
              type="button"
              class="back"
              data-step-back
            >
              Back
            </button>

            <button
              type="submit"
              id="btn"
            >
              Submit
            </button>
          </div>

          <div class="progress"></div>
        </div>
      </form>

      <div
        id="msg"
        aria-live="polite"
      ></div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    const CONFIG =
      Object.freeze({
        scriptUrl:
          'https://script.google.com/macros/s/AKfycbxuCqIpTWWbbiUsOy3XbgimgIs2gvVMcsXINZbHcTQ0j8FL8YaN1pYRZtIlB_rHXkrNDQ/exec',

        failMaxPerDay:
          3,

        requestTimeoutMs:
          15000
      });

    const form =
      document.getElementById(
        'f'
      );

    const message =
      document.getElementById(
        'msg'
      );

    const submitButton =
      document.getElementById(
        'btn'
      );

    const steps =
      Array.from(
        form.querySelectorAll(
          '.pff-step'
        )
      );

    let isTerminalState =
      false;


    function capFirst(
      value
    ) {
      const text =
        String(
          value ||
          ''
        ).trim();

      return text
        ? text
            .charAt(0)
            .toUpperCase() +
          text
            .slice(1)
            .toLowerCase()
        : '';
    }


    function todayStr() {
      const date =
        new Date();

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(
          2,
          '0'
        );

      const day =
        String(
          date.getDate()
        ).padStart(
          2,
          '0'
        );

      return `${year}-${month}-${day}`;
    }


    function getStoredInt(
      key,
      fallback =
        0
    ) {
      try {
        return (
          parseInt(
            localStorage.getItem(
              key
            ) ||
            String(
              fallback
            ),
            10
          ) ||
          fallback
        );
      } catch (_) {
        return fallback;
      }
    }


    function setStoredInt(
      key,
      value
    ) {
      try {
        localStorage.setItem(
          key,
          String(
            value
          )
        );
      } catch (_) {
      }
    }


    function failKey() {
      return `cpd_fail_${todayStr()}`;
    }


    function getFailCountToday() {
      return getStoredInt(
        failKey(),
        0
      );
    }


    function incrementFailCountToday() {
      setStoredInt(
        failKey(),
        getFailCountToday() +
          1
      );
    }


    function remainingFails() {
      return Math.max(
        0,
        CONFIG.failMaxPerDay -
          getFailCountToday()
      );
    }


    function isFailLocked() {
      return (
        remainingFails() <=
        0
      );
    }


    function showTerminalState() {
      isTerminalState =
        true;

      steps.forEach(
        step => {
          step.classList.remove(
            'is-active'
          );

          step.setAttribute(
            'aria-hidden',
            'true'
          );
        }
      );

      message.classList.add(
        'terminal-state'
      );

      message.innerHTML = `
        <section class="terminal-card">
          <div class="terminal-title">
            Remember to log your CPD
          </div>

          <div class="terminal-subtitle">
            Your certificate will be emailed within 10 minutes
          </div>
        </section>
      `;
    }


    function updateProgress(
      index,
      step
    ) {
      const progress =
        step?.querySelector(
          '.progress'
        );

      if (progress) {
        progress.textContent =
          `Q ${index + 1} of ${steps.length}`;
      }
    }


    function focusStep(
      _index,
      step
    ) {
      window.setTimeout(
        () => {
          const firstField =
            step?.querySelector(
              'input:not(:disabled)'
            );

          firstField?.focus();
        },
        0
      );
    }


    function stepValid(
      index
    ) {
      const requiredFields =
        Array.from(
          steps[
            index
          ]?.querySelectorAll(
            'input[required], select[required]'
          ) ||
          []
        );

      const invalidField =
        requiredFields.find(
          field =>
            !field.checkValidity()
        );

      if (invalidField) {
        invalidField.reportValidity();

        return false;
      }

      return true;
    }


    function canAdvance(
      index
    ) {
      if (
        isTerminalState ||
        isFailLocked()
      ) {
        return false;
      }

      if (
        stepValid(
          index
        )
      ) {
        return true;
      }

      navigator.vibrate?.(
        10
      );

      return false;
    }


    const stepper =
      PFF.setupStepper({
        root:
          form,

        steps,

        backButtons:
          form.querySelectorAll(
            '[data-step-back]'
          ),

        nextButtons:
          form.querySelectorAll(
            '[data-step-next]'
          ),

        canAdvance,

        onChange:
          updateProgress,

        onStep:
          focusStep
      });


    function updateUI() {
      const failLocked =
        isFailLocked();

      document
        .querySelectorAll(
          'input, button'
        )
        .forEach(
          control => {
            control.disabled =
              failLocked;
          }
        );

      message.classList.remove(
        'terminal-state'
      );

      if (failLocked) {
        message.textContent =
          'No attempts remaining, try again tomorrow.';
      }
    }


    document.addEventListener(
      'keydown',
      event => {
        if (
          event.key !==
          'Enter'
        ) {
          return;
        }

        const activeStep =
          event.target.closest(
            '.pff-step'
          );

        if (
          !activeStep ||
          !activeStep.classList.contains(
            'is-active'
          )
        ) {
          return;
        }

        if (
          stepper.index <
          stepper.count - 1
        ) {
          event.preventDefault();

          stepper.next();
        }
      }
    );


    updateProgress(
      stepper.index,
      steps[
        stepper.index
      ]
    );

    updateUI();


    form.addEventListener(
      'submit',
      async event => {
        event.preventDefault();

        if (
          stepper.index <
          stepper.count - 1
        ) {
          stepper.next();

          return;
        }

        if (
          !stepValid(
            stepper.index
          )
        ) {
          return;
        }

        if (
          isFailLocked()
        ) {
          updateUI();

          return;
        }

        message.textContent =
          'Submitting...';

        submitButton.disabled =
          true;

        const data =
          Object.fromEntries(
            new FormData(
              form
            ).entries()
          );

        data.eventId =
          String(
            data.eventId ||
            ''
          )
            .trim()
            .toUpperCase();

        data.firstName =
          capFirst(
            data.firstName
          );

        data.lastName =
          capFirst(
            data.lastName
          );

        data.ahpra =
          String(
            data.ahpra ||
            ''
          )
            .replace(
              /\s+/g,
              ''
            )
            .toUpperCase();

        data.email =
          String(
            data.email ||
            ''
          ).trim();

        try {
          const response =
            await PFF.loadAppsScriptJsonp({
              url:
                CONFIG.scriptUrl,

              params:
                data,

              timeoutMs:
                CONFIG.requestTimeoutMs
            });

          if (
            response &&
            response.ok
          ) {
            form.reset();

            showTerminalState();

            return;
          }

          if (
            response &&
            response.message ===
              'Event ID not found'
          ) {
            incrementFailCountToday();

            const remaining =
              remainingFails();

            if (
              remaining >
              0
            ) {
              message.textContent =
                `Event ID not found, ${remaining} attempt${remaining === 1 ? '' : 's'} remaining`;

              submitButton.disabled =
                false;
            } else {
              updateUI();

              return;
            }

            return;
          }

          message.textContent =
            response?.message ||
            'Error – please try again.';

          submitButton.disabled =
            false;
        } catch (
          error
        ) {
          console.error(
            error
          );

          message.textContent =
            'Error – please try again.';

          submitButton.disabled =
            false;
        }
      }
    );
  })();
  </script>
</body>
</html>
