<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Clinical Optometry Job Tracker</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;

      --track: #f0f2f5;
      --row-line: #f8f9fa;
      --week-line: #cdd2da;

      --repeat-red: #cc0000;

      /*
       * 20% opacity = 80% transparent, producing a faint repeat-row shade.
       */
      --repeat-row-background: rgba(204, 0, 0, 0.20);

      --delisted-grey: #989da6;
      --soft: #f7f7f9;

      --seek-pink: #e5007d;
      --indeed-blue: #2557a7;
      --essilux-blue: #49b7e8;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      /*
       * Original employer-type colours are retained as reference colours.
       * Darker related shades are used for text so they remain readable
       * against a white background.
       */
      --corporate: #8dc4af;
      --independent: #c3bce9;
      --ophthal: #ffe9b8;
      --other: #eaebec;

      --corporate-text: #4f8f77;
      --independent-text: #7567b8;
      --ophthal-text: #a56b00;
      --other-text: #69718a;

      --state-nsw: #2db7f5;
      --state-qld: #7a0036;
      --state-act: #7b61ff;
      --state-vic: #2d3a8c;
      --state-sa: #f03a47;
      --state-nt: #c25e00;
      --state-wa: #000000;
      --state-tas: #22a36b;

      --rurality-metro: #3f4851;
      --rurality-nonmetro: #9f6545;

      --first-column-width: 76px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 16px 4px 22px;
    }

    #app.is-loading .content {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    .content {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 8px 12px;
    }

    .heading-group {
      min-width: 0;
      text-align: left;
    }

    .heading-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(20px, 3vw, 27px);
      font-weight: 700;
      line-height: 1.2;
    }

    .live-data-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #e53935;
    }

    .table-status {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .filter-control {
      position: relative;
      flex: 0 0 auto;
    }

    /*
     * All filters use a solid white default background.
     */
    .filter-button {
      height: 48px;
      min-height: 48px;
      padding: 0 10px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        background 140ms ease;
    }

    .boolean-button {
      display: grid;
      grid-template-columns: 15px minmax(0, 1fr) auto 8px;
      align-items: center;
      gap: 7px;
    }

    /*
     * This invisible final grid column keeps the ON/OFF text the same
     * distance from the right edge as multi-select controls with arrows.
     */
    .boolean-button::after {
      content: "";
      width: 8px;
      height: 1px;
    }

    .multi-filter-button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 8px;
      align-items: center;
      gap: 7px;
    }

    #repeat-toggle {
      width: 205px;
    }

    #corporate-toggle {
      width: 128px;
    }

    #rurality-button {
      width: 220px;
    }

    #state-button {
      width: 132px;
    }

    #delisted-toggle {
      width: 138px;
    }

    .filter-button:hover,
    .filter-button[aria-expanded="true"] {
      border-color: var(--ink);
    }

    .filter-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .filter-label-wrap {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
      text-align: left;
    }

    .filter-label {
      color: inherit;
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
    }

    .filter-subtext {
      color: inherit;
      font-size: 9px;
      font-weight: 400;
      line-height: 1.15;
      opacity: 0.72;
      white-space: nowrap;
    }

    .filter-value {
      display: inline-block;
      min-width: 28px;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.025em;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }

    .binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      flex: 0 0 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .boolean-button.is-on .binary-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .boolean-button.is-on .binary-indicator::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .boolean-button:not(.is-on) .filter-value {
      color: var(--muted);
    }

    /*
     * Filter colours are applied to text, border and checkbox only.
     * The control backgrounds remain white.
     */
    #repeat-toggle.is-on {
      color: var(--repeat-red);
      background: #fff;
      border-color: rgba(204, 0, 0, 0.55);
    }

    #repeat-toggle.is-on .binary-indicator {
      background: var(--repeat-red);
      border-color: var(--repeat-red);
    }

    #repeat-toggle.is-on .filter-value {
      color: var(--repeat-red);
    }

    #corporate-toggle.is-on {
      color: var(--corporate-text);
      background: #fff;
      border-color: var(--corporate-text);
    }

    #corporate-toggle.is-on .binary-indicator {
      background: var(--corporate-text);
      border-color: var(--corporate-text);
    }

    #corporate-toggle.is-on .filter-value {
      color: var(--corporate-text);
    }

    .menu-arrow {
      width: 0;
      height: 0;
      min-width: 0;
      flex: 0 0 auto;
      border-top: 4px solid currentColor;
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      opacity: 0.65;
      transition: transform 140ms ease;
    }

    .filter-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    .filter-menu {
      position: absolute;
      z-index: 50;
      top: calc(100% + 4px);
      right: 0;
      display: none;
      min-width: 154px;
      padding: 5px 0;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
      text-align: left;
    }

    .filter-menu.is-open {
      display: block;
    }

    .filter-menu-title {
      margin: 0;
      padding: 6px 10px 7px;
      color: var(--muted);
      background: #fff;
      border-bottom: 1px solid var(--track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 10px;
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.25;
      cursor: pointer;
      user-select: none;
    }

    .filter-option:hover {
      background: #fff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .filter-option input {
      width: 14px;
      height: 14px;
      min-width: 14px;
      max-width: 14px;
      flex: 0 0 14px;
      margin: 0;
      accent-color: var(--purple);
      cursor: pointer;
    }

    .filter-option-all {
      color: var(--ink);
      background: #fff;
      border-bottom: 1px solid var(--track);
      font-weight: 700;
    }

    .rurality-option-metro {
      color: var(--rurality-metro);
      background: #fff;
      font-weight: 700;
    }

    .rurality-option-nonmetro {
      color: var(--rurality-nonmetro);
      background: #fff;
      font-weight: 700;
    }

    .state-option-code {
      min-width: 30px;
      font-weight: 700;
    }

    .state-filter-nsw {
      color: var(--state-nsw);
      background: #fff;
    }

    .state-filter-qld {
      color: var(--state-qld);
      background: #fff;
    }

    .state-filter-act {
      color: var(--state-act);
      background: #fff;
    }

    .state-filter-vic {
      color: var(--state-vic);
      background: #fff;
    }

    .state-filter-sa {
      color: var(--state-sa);
      background: #fff;
    }

    .state-filter-nt {
      color: var(--state-nt);
      background: #fff;
    }

    .state-filter-wa {
      color: var(--state-wa);
      background: #fff;
    }

    .state-filter-tas {
      color: var(--state-tas);
      background: #fff;
    }

    .table-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
      border-top: 1px solid var(--track);
      border-bottom: 1px solid var(--track);
      border-radius: 0;
      box-shadow: none;
      isolation: isolate;
    }

    .table-shell::after {
      content: "";
      position: absolute;
      z-index: 9;
      top: 0;
      bottom: 0;
      left: var(--first-column-width);
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .table-scroll {
      width: 100%;
      max-height: calc(100vh - 155px);
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .data-table {
      width: max-content;
      min-width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: auto;
    }

    .data-table thead {
      position: sticky;
      z-index: 5;
      top: 0;
      background: #fff;
    }

    .data-table thead::after {
      content: "";
      position: absolute;
      z-index: 8;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      pointer-events: none;
      background: linear-gradient(
        to right,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 8%,
        var(--ink) 18%,
        var(--ink) 82%,
        rgba(21, 21, 21, 0.16) 92%,
        #fff 100%
      );
    }

    .data-table th,
    .data-table td {
      position: relative;
      width: auto;
      min-width: 0;
      max-width: 240px;
      padding: 7px 8px;
      border-right: 1px solid var(--track);
      border-bottom: 1px solid var(--row-line);
      line-height: 1.2;
      text-align: left;
      vertical-align: middle;
      overflow-wrap: break-word;
      white-space: normal;
    }

    .data-table th {
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    /*
     * White is the default cell background.
     */
    .data-table td {
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      font-weight: 400;
    }

    .data-table th[data-source-column="A"],
    .data-table td[data-source-column="A"] {
      position: sticky;
      left: 0;
      width: var(--first-column-width);
      min-width: var(--first-column-width);
      max-width: var(--first-column-width);
      padding-right: 5px;
      padding-left: 5px;
      white-space: nowrap;
    }

    .data-table th[data-source-column="A"] {
      z-index: 7;
    }

    .data-table td[data-source-column="A"] {
      z-index: 2;
      font-weight: 700;
    }

    .data-table th[data-source-column="D"],
    .data-table td[data-source-column="D"],
    .data-table th[data-source-column="G"],
    .data-table td[data-source-column="G"],
    .data-table th[data-source-column="I"],
    .data-table td[data-source-column="I"],
    .data-table th[data-source-column="K"],
    .data-table td[data-source-column="K"] {
      white-space: nowrap;
    }

    .data-table th:last-child,
    .data-table td:last-child {
      border-right: 0;
    }

    .data-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .data-table tbody tr:hover td {
      filter: brightness(0.988);
    }

    .data-table tbody tr.week-divider td {
      border-bottom: 1px solid var(--week-line);
      box-shadow: inset 0 -1px 0 var(--week-line);
    }

    .data-table a {
      color: var(--purple);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    .data-table a:hover {
      text-decoration-thickness: 2px;
    }

    .data-table a.link-seek {
      color: var(--seek-pink);
    }

    .data-table a.link-indeed {
      color: var(--indeed-blue);
    }

    .data-table a.link-essilux {
      color: var(--essilux-blue);
    }

    /*
     * This is the only persistent table-cell background shading.
     */
    .data-table tr.repeat-row td {
      background: var(--repeat-row-background);
    }

    /*
     * Employer type uses bold coloured text only.
     * Backgrounds remain inherited from the row.
     */
    .data-table td.category-corporate {
      color: var(--corporate-text);
      font-weight: 700;
    }

    .data-table td.category-independent {
      color: var(--independent-text);
      font-weight: 700;
    }

    .data-table td.category-ophthal {
      color: var(--ophthal-text);
      font-weight: 700;
    }

    .data-table td.category-other {
      color: var(--other-text);
      font-weight: 700;
    }

    /*
     * State uses bold coloured text only.
     */
    .data-table td.state-nsw {
      color: var(--state-nsw);
      font-weight: 700;
    }

    .data-table td.state-qld {
      color: var(--state-qld);
      font-weight: 700;
    }

    .data-table td.state-act {
      color: var(--state-act);
      font-weight: 700;
    }

    .data-table td.state-vic {
      color: var(--state-vic);
      font-weight: 700;
    }

    .data-table td.state-sa {
      color: var(--state-sa);
      font-weight: 700;
    }

    .data-table td.state-nt {
      color: var(--state-nt);
      font-weight: 700;
    }

    .data-table td.state-wa {
      color: var(--state-wa);
      font-weight: 700;
    }

    .data-table td.state-tas {
      color: var(--state-tas);
      font-weight: 700;
    }

    /*
     * Rurality uses bold coloured text only.
     */
    .data-table td.rurality-metro {
      color: var(--rurality-metro);
      font-weight: 700;
    }

    .data-table td.rurality-nonmetro {
      color: var(--rurality-nonmetro);
      font-weight: 700;
    }

    /*
     * Delisted text remains grey and overrides category/state/rurality text.
     */
    .data-table tr.delisted-row td,
    .data-table tr.delisted-row td a,
    .data-table tr.delisted-row td a.link-seek,
    .data-table tr.delisted-row td a.link-indeed,
    .data-table tr.delisted-row td a.link-essilux {
      color: var(--delisted-grey) !important;
    }

    .data-table tr.is-hidden {
      display: none;
    }

    .empty-state {
      display: none;
      padding: 42px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .empty-state.is-visible {
      display: block;
    }

    .error-state {
      display: none;
      max-width: 720px;
      margin: 20px auto;
      padding: 18px;
      color: var(--muted);
      background: #fff;
      border-top: 1px solid var(--track);
      border-bottom: 1px solid var(--track);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .error-state.is-visible {
      display: block;
    }

    @media (max-width: 900px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .controls {
        justify-content: flex-start;
      }

      .filter-menu {
        right: auto;
        left: 0;
      }

      .table-scroll {
        max-height: calc(100vh - 235px);
      }
    }

    @media (max-width: 520px) {
      :root {
        --first-column-width: 72px;
      }

      #app {
        padding: 12px 1px 18px;
      }

      .topbar {
        margin-right: 4px;
        margin-left: 4px;
      }

      .filter-button {
        height: 46px;
        min-height: 46px;
        padding: 0 8px;
        gap: 6px;
      }

      #repeat-toggle {
        width: 195px;
      }

      #corporate-toggle {
        width: 122px;
      }

      #rurality-button {
        width: 210px;
      }

      #state-button {
        width: 126px;
      }

      #delisted-toggle {
        width: 132px;
      }

      .filter-label {
        font-size: 11px;
      }

      .filter-subtext {
        font-size: 8px;
      }

      .filter-value {

    function normaliseText(value) {
      return String(value ?? '')
        .replace(/\u00A0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ')
        .toLowerCase();
    }

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00A0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function formatDisplayText(value) {
      const text = cleanText(value);

      if (
        !text ||
        normaliseText(text) === 'xxx'
      ) {
        return '—';
      }

      return text;
    }

    function isRepeatValue(value) {
      return normaliseText(value) === 'yes';
    }

    function isDelistedValue(value) {
      return normaliseText(value)
        .startsWith('delisted');
    }

    function isCorporateValue(value) {
      const text =
        normaliseText(value);

      return (
        text === 'corporate' ||
        text.startsWith('corporate ') ||
        text.startsWith('corporate(') ||
        text
          .split(/[;,|/]/)
          .some(
            part =>
              normaliseText(part) ===
              'corporate'
          )
      );
    }

    function getEmployerTypeClass(value) {
      const text =
        normaliseText(value);

      if (
        !text ||
        text === 'xxx'
      ) {
        return '';
      }

      if (
        text === 'corporate' ||
        text.startsWith('corporate ') ||
        text.startsWith('corporate(')
      ) {
        return 'category-corporate';
      }

      if (
        text === 'independent' ||
        text.startsWith('independent ') ||
        text.startsWith('independent(')
      ) {
        return 'category-independent';
      }

      if (
        text.includes('ophthal') ||
        text.includes('opthal')
      ) {
        return 'category-ophthal';
      }

      return 'category-other';
    }

    function getStateCodes(value) {
      const text =
        cleanText(value).toUpperCase();

      const matches =
        text.match(
          /\b(?:NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/g
        ) || [];

      return [
        ...new Set(matches)
      ];
    }

    function getStateClass(value) {
      const stateCode =
        getStateCodes(value)[0] || '';

      return stateCode
        ? `state-${stateCode.toLowerCase()}`
        : '';
    }

    function getMMCodes(value) {
      const text =
        cleanText(value).toUpperCase();

      const matches = [
        ...text.matchAll(
          /\bMM\s*([1-7])\b/g
        )
      ];

      return [
        ...new Set(
          matches.map(
            match => `MM${match[1]}`
          )
        )
      ];
    }

    function getRuralityClass(value) {
      const text =
        normaliseText(value);

      if (
        !text ||
        text === 'xxx'
      ) {
        return '';
      }

      const mmCodes =
        getMMCodes(value);

      if (
        mmCodes.includes('MM1')
      ) {
        return 'rurality-metro';
      }

      return 'rurality-nonmetro';
    }

    function columnNumberToLetter(
      columnNumber
    ) {
      let number = columnNumber;
      let letters = '';

      while (number > 0) {
        const remainder =
          (number - 1) % 26;

        letters =
          String.fromCharCode(
            65 + remainder
          ) + letters;

        number =
          Math.floor(
            (number - 1) / 26
          );
      }

      return letters;
    }

    function getVisibleColumnNumbers() {
      const columns = [];

      for (
        let column =
          CONFIG.FIRST_COLUMN;
        column <=
          CONFIG.LAST_COLUMN;
        column++
      ) {
        if (
          !CONFIG.HIDDEN_COLUMNS.has(
            column
          )
        ) {
          columns.push(column);
        }
      }

      return columns;
    }

    function getGvizCellDisplay(cell) {
      if (!cell) {
        return '';
      }

      return cleanText(
        cell.f ??
        cell.v ??
        ''
      );
    }

    function getSydneyToday() {
      try {
        const parts =
          new Intl.DateTimeFormat(
            'en-AU',
            {
              timeZone:
                'Australia/Sydney',

              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            }
          ).formatToParts(
            new Date()
          );

        const values =
          Object.fromEntries(
            parts
              .filter(
                part =>
                  part.type !==
                  'literal'
              )
              .map(
                part => [
                  part.type,
                  Number(part.value)
                ]
              )
          );

        return new Date(
          Date.UTC(
            values.year,
            values.month - 1,
            values.day
          )
        );
      } catch (error) {
        const now = new Date();

        return new Date(
          Date.UTC(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
          )
        );
      }
    }

    function subtractCalendarMonths(
      date,
      months
    ) {
      const targetFirstDay =
        new Date(
          Date.UTC(
            date.getUTCFullYear(),
            date.getUTCMonth() -
              months,
            1
          )
        );

      const finalDayOfTargetMonth =
        new Date(
          Date.UTC(
            targetFirstDay
              .getUTCFullYear(),

            targetFirstDay
              .getUTCMonth() + 1,

            0
          )
        ).getUTCDate();

      return new Date(
        Date.UTC(
          targetFirstDay
            .getUTCFullYear(),

          targetFirstDay
            .getUTCMonth(),

          Math.min(
            date.getUTCDate(),
            finalDayOfTargetMonth
          )
        )
      );
    }

    function parseDateValue(value) {
      if (
        value instanceof Date &&
        !Number.isNaN(
          value.getTime()
        )
      ) {
        return new Date(
          Date.UTC(
            value.getFullYear(),
            value.getMonth(),
            value.getDate()
          )
        );
      }

      const text =
        cleanText(value);

      if (!text) {
        return null;
      }

      let match =
        text.match(
          /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/i
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]),
            Number(match[3])
          )
        );
      }

      match =
        text.match(
          /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
        );

      if (match) {
        let year =
          Number(match[3]);

        if (year < 100) {
          year +=
            year >= 70
              ? 1900
              : 2000;
        }

        return new Date(
          Date.UTC(
            year,
            Number(match[2]) - 1,
            Number(match[1])
          )
        );
      }

      match =
        text.match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
          )
        );
      }

      const parsed =
        new Date(text);

      if (
        !Number.isNaN(
          parsed.getTime()
        )
      ) {
        return new Date(
          Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          )
        );
      }

      return null;
    }

    function getDateFromGvizCell(cell) {
      return (
        parseDateValue(cell?.v) ||
        parseDateValue(cell?.f)
      );
    }

    function getMondayWeekKey(dateValue) {
      const date =
        parseDateValue(dateValue);

      if (!date) {
        return '';
      }

      const daysSinceMonday =
        (date.getUTCDay() + 6) %
        7;

      date.setUTCDate(
        date.getUTCDate() -
          daysSinceMonday
      );

      const year =
        date.getUTCFullYear();

      const month =
        String(
          date.getUTCMonth() + 1
        ).padStart(2, '0');

      const day =
        String(
          date.getUTCDate()
        ).padStart(2, '0');

      return `${year}-${month}-${day}`;
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat(
        'en-AU',
        {
          timeZone: 'UTC',
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        }
      ).format(date);
    }

    function canBuildJobLink(
      employer,
      suburb,
      stateCode
    ) {
      if (!cleanText(employer)) {
        return false;
      }

      if (
        normaliseText(suburb) ===
        'xxx'
      ) {
        return (
          cleanText(stateCode) !== ''
        );
      }

      return cleanText(suburb) !== '';
    }

    function buildColumnALink(
      sourceMarker,
      employerValue,
      suburbValue,
      stateValue
    ) {
      const sourceMarkerText =
        cleanText(sourceMarker);

      const employer =
        cleanText(employerValue);

      const suburb =
        cleanText(suburbValue);

      const stateCode =
        cleanText(stateValue);

      if (
        !canBuildJobLink(
          employer,
          suburb,
          stateCode
        )
      ) {
        return null;
      }

      const keywords =
        `"Optometrist" ${employer}`;

      const isIndeed =
        normaliseText(
          sourceMarkerText
        ).endsWith('indeed|');

      const employerWithoutSpaces =
        employer
          .replace(/\s+/g, '')
          .toLowerCase();

      const isEssiLux =
        /(opsm|eyeq|laubman&pank)/i
          .test(
            employerWithoutSpaces
          );

      if (isIndeed) {
        const location =
          normaliseText(suburb) ===
          'xxx'
            ? stateCode
            : `${suburb} ${stateCode}`
                .trim();

        return {
          text: 'Indeed',

          url:
            `https://au.indeed.com/jobs?q=${encodeURIComponent(keywords)}` +
            `&l=${encodeURIComponent(location)}` +
            '&radius=0' +
            '&sort=date',

          className:
            'link-indeed'
        };
      }

      if (isEssiLux) {
        return {
          text: 'EssiLux',

          url:
            'https://careers.essilorluxottica.com/search/' +
            '?createNewAlert=false' +
            '&q=optometrist' +
            '&optionsFacetsDD_country=AU' +
            '&optionsFacetsDD_city=' +
            '&optionsFacetsDD_customfield1=' +
            '&optionsFacetsDD_customfield2=' +
            '&optionsFacetsDD_customfield3=' +
            '&optionsFacetsDD_customfield4=',

          className:
            'link-essilux'
        };
      }

      const firstSuburb =
        suburb
          .split(';')[0]
          .trim();

      const location =
        normaliseText(suburb) ===
        'xxx'
          ? stateCode
          : `${firstSuburb} ${stateCode}`
              .trim();

      return {
        text: 'SEEK',

        url:
          `https://www.seek.com.au/jobs?keywords=${encodeURIComponent(keywords)}` +
          `&where=${encodeURIComponent(location)}` +
          '&distance=0',

        className:
          'link-seek'
      };
    }

    function buildModelFromGviz(
      response
    ) {
      if (
        response?.status === 'error'
      ) {
        throw new Error(
          response?.errors?.[0]
            ?.detailed_message ||
          response?.errors?.[0]
            ?.message ||
          'Google Sheets returned an error.'
        );
      }

      const visibleColumns =
        getVisibleColumnNumbers();

      const columns =
        response?.table?.cols || [];

      const sourceRows =
        response?.table?.rows || [];

      const headers =
        visibleColumns.map(
          columnNumber => ({
            sourceColumn:
              columnNumber,

            text:
              columnNumber ===
                CONFIG.MM_COLUMN
                ? 'Rurality'
                : (
                    cleanText(
                      columns?.[
                        columnNumber - 1
                      ]?.label
                    ) ||
                    columnNumberToLetter(
                      columnNumber
                    )
                  )
          })
        );

      const rows = [];

      sourceRows.forEach(
        (
          sourceRow,
          rowOffset
        ) => {
          const cells =
            sourceRow?.c || [];

          const sourceAText =
            getGvizCellDisplay(
              cells[0]

          if (!sourceAText) {
            return;
          }

          const dateValue =
            getDateFromGvizCell(
              cells[
                CONFIG.DATE_COLUMN -
                  1
              ]
            );

          if (
            !dateValue ||
            dateValue <
              state.dateCutoff
          ) {
            return;
          }

          const repeatValue =
            getGvizCellDisplay(
              cells[
                CONFIG
                  .REPEAT_FLAG_COLUMN -
                  1
              ]
            );

          const sourceMarker =
            getGvizCellDisplay(
              cells[
                CONFIG.SOURCE_COLUMN -
                  1
              ]
            );

          const employerValue =
            getGvizCellDisplay(
              cells[
                CONFIG.EMPLOYER_COLUMN -
                  1
              ]
            );

          const employerTypeValue =
            getGvizCellDisplay(
              cells[
                CONFIG
                  .EMPLOYER_TYPE_COLUMN -
                  1
              ]
            );

          const suburbValue =
            getGvizCellDisplay(
              cells[
                CONFIG.SUBURB_COLUMN -
                  1
              ]
            );

          const stateValue =
            getGvizCellDisplay(
              cells[
                CONFIG.STATE_COLUMN -
                  1
              ]
            );

          const mmValue =
            getGvizCellDisplay(
              cells[
                CONFIG.MM_COLUMN - 1
              ]
            );

          const isDelisted =
            isDelistedValue(
              sourceAText
            );

          const columnALink =
            isDelisted
              ? null
              : buildColumnALink(
                  sourceMarker,
                  employerValue,
                  suburbValue,
                  stateValue
                );

          const stateCodes =
            getStateCodes(
              stateValue
            );

          const mmCodes =
            getMMCodes(
              mmValue
            );

          rows.push({
            sourceRow:
              CONFIG.HEADER_ROW +
              1 +
              rowOffset,

            isRepeat:
              isRepeatValue(
                repeatValue
              ),

            isCorporate:
              isCorporateValue(
                employerTypeValue
              ),

            isDelisted,

            hasMM1:
              mmCodes.includes(
                'MM1'
              ),

            hasNonMetroMM:
              mmCodes.some(
                code =>
                  code !== 'MM1'
              ),

            stateCodes,

            weekKey:
              getMondayWeekKey(
                dateValue
              ),

            cells:
              visibleColumns.map(
                columnNumber => {
                  if (
                    columnNumber === 1
                  ) {
                    if (isDelisted) {
                      return {
                        sourceColumn: 1,
                        text: sourceAText,
                        link: '',
                        linkClass: ''
                      };
                    }

                    return {
                      sourceColumn: 1,

                      text:
                        columnALink?.text ||
                        sourceAText,

                      link:
                        columnALink?.url ||
                        '',

                      linkClass:
                        columnALink
                          ?.className ||
                        ''
                    };
                  }

                  return {
                    sourceColumn:
                      columnNumber,

                    text:
                      getGvizCellDisplay(
                        cells[
                          columnNumber -
                            1
                        ]
                      ),

                    link: '',
                    linkClass: ''
                  };
                }
              )
          });
        }
      );

      return {
        headers,
        rows
      };
    }

    function loadGvizModel() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffJobTrackerCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

          const script =
            document.createElement(
              'script'
            );

          let settled = false;

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'The live Google Sheets feed timed out.'
                  )
                );
              },
              CONFIG
                .FETCH_TIMEOUT_MS
            );

          function cleanup() {
            if (settled) {
              return;
            }

            settled = true;

            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (error) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }

          window[callbackName] =
            response => {
              try {
                const model =
                  buildModelFromGviz(
                    response
                  );

                cleanup();
                resolve(model);
              } catch (error) {
                cleanup();
                reject(error);
              }
            };

          script.onerror = () => {
            cleanup();

            reject(
              new Error(
                'The live Google Sheets feed could not be loaded.'
              )
            );
          };

          const params =
            new URLSearchParams({
              range:
                `A${CONFIG.HEADER_ROW}:Y`,

              headers: '1',

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(Date.now())
            });

          if (CONFIG.SHEET_NAME) {
            params.set(
              'sheet',
              CONFIG.SHEET_NAME
            );
          }

          script.src =
            `https://docs.google.com/spreadsheets/d/${CONFIG.SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

          document.body
            .appendChild(script);
        }
      );
    }

    function uniqueValidValues(
      values,
      allowedValues
    ) {
      if (!Array.isArray(values)) {
        return [];
      }

      return [
        ...new Set(
          values.filter(
            value =>
              allowedValues.includes(
                value
              )
          )
        )
      ];
    }

    function loadSavedFilters() {
      try {
        const saved =
          JSON.parse(
            localStorage.getItem(
              CONFIG.STORAGE_KEY
            ) || '{}'
          );

        let selectedRurality =
          uniqueValidValues(
            saved.selectedRurality,
            RURALITY_OPTIONS
          );

        if (
          !Array.isArray(
            saved.selectedRurality
          )
        ) {
          if (
            saved.locationMode ===
            'metro'
          ) {
            selectedRurality = [
              'metro'
            ];
          } else if (
            saved.locationMode ===
            'nonmetro'
          ) {
            selectedRurality = [
              'nonmetro'
            ];
          } else {
            selectedRurality = [
              ...RURALITY_OPTIONS
            ];
          }
        }

        let selectedStates =
          uniqueValidValues(
            saved.selectedStates,
            STATE_OPTIONS
          );

        if (
          !Array.isArray(
            saved.selectedStates
          )
        ) {
          if (
            saved.stateFilter &&
            saved.stateFilter !==
              'ALL' &&
            STATE_OPTIONS.includes(
              saved.stateFilter
            )
          ) {
            selectedStates = [
              saved.stateFilter
            ];
          } else {
            selectedStates = [
              ...STATE_OPTIONS
            ];
          }
        }

        return {
          showRepeats:
            typeof saved
              .showRepeats ===
            'boolean'
              ? saved.showRepeats
              : DEFAULT_FILTERS
                  .showRepeats,

          showCorporates:
            typeof saved
              .showCorporates ===
            'boolean'
              ? saved
                  .showCorporates
              : DEFAULT_FILTERS
                  .showCorporates,

          selectedRurality,

          selectedStates,

          showDelisted:
            typeof saved
              .showDelisted ===
            'boolean'
              ? saved.showDelisted
              : DEFAULT_FILTERS
                  .showDelisted
        };
      } catch (error) {
        return {
          showRepeats:
            DEFAULT_FILTERS
              .showRepeats,

          showCorporates:
            DEFAULT_FILTERS
              .showCorporates,

          selectedRurality: [
            ...DEFAULT_FILTERS
              .selectedRurality
          ],

          selectedStates: [
            ...DEFAULT_FILTERS
              .selectedStates
          ],

          showDelisted:
            DEFAULT_FILTERS
              .showDelisted
        };
      }
    }

    function saveFilters() {
      try {
        localStorage.setItem(
          CONFIG.STORAGE_KEY,
          JSON.stringify({
            showRepeats:
              state.filters
                .showRepeats,

            showCorporates:
              state.filters
                .showCorporates,

            selectedRurality:
              state.filters
                .selectedRurality,

            selectedStates:
              state.filters
                .selectedStates,

            showDelisted:
              state.filters
                .showDelisted
          })
        );
      } catch (error) {
        console.warn(
          'The browser could not save the filter settings.',
          error
        );
      }
    }

    function setBooleanButton(
      button,
      isOn
    ) {
      button.classList.toggle(
        'is-on',
        isOn
      );

      button.setAttribute(
        'aria-checked',
        String(isOn)
      );

      button
        .querySelector(
          '.filter-value'
        )
        .textContent =
          isOn
            ? 'ON'
            : 'OFF';
    }

    function clearButtonColour(button) {
      button.style.background =
        '#fff';

      button.style.removeProperty(
        'color'
      );

      button.style.removeProperty(
        'border-color'
      );

      const valueElement =
        button.querySelector(
          '.filter-value'
        );

      if (valueElement) {
        valueElement.style.removeProperty(
          'color'
        );
      }
    }

    /*
     * Multi-select buttons use coloured text and borders only.
     * Their backgrounds remain solid white.
     */
    function applyButtonColour(
      button,
      colour
    ) {
      button.style.background =
        '#fff';

      button.style.color =
        colour;

      button.style.borderColor =
        colour;

      const valueElement =
        button.querySelector(
          '.filter-value'
        );

      if (valueElement) {
        valueElement.style.color =
          colour;
      }
    }

    function setMenuOpen(
      menuName,
      shouldOpen
    ) {
      const menuPairs = {
        rurality: {
          button:
            ruralityButton,
          menu:
            ruralityMenu
        },

        state: {
          button:
            stateButton,
          menu:
            stateMenu
        }
      };

      Object.entries(
        menuPairs
      ).forEach(
        ([
          name,
          controls
        ]) => {
          const isOpen =
            shouldOpen &&
            name === menuName;

          controls.menu
            .classList.toggle(
              'is-open',
              isOpen
            );

          controls.button
            .setAttribute(
              'aria-expanded',
              String(isOpen)
            );
        }
      );

      state.openMenu =
        shouldOpen
          ? menuName
          : null;
    }

    function toggleMenu(menuName) {
      const shouldOpen =
        state.openMenu !==
        menuName;

      setMenuOpen(
        menuName,
        shouldOpen
      );
    }

    function getRuralitySummary() {
      const selected =
        state.filters
          .selectedRurality;

      if (
        selected.length ===
        RURALITY_OPTIONS.length
      ) {
        return 'ALL';
      }

      if (
        selected.length === 0
      ) {
        return 'NONE';
      }

      if (
        selected.includes(
          'metro'
        )
      ) {
        return 'METRO';
      }

      return 'NON-METRO';
    }

    function getStateSummary() {
      const selected =
        STATE_OPTIONS.filter(
          stateCode =>
            state.filters
              .selectedStates
              .includes(
                stateCode
              )
        );

      if (
        selected.length ===
        STATE_OPTIONS.length
      ) {
        return 'ALL';
      }

      if (
        selected.length === 0
      ) {
        return 'NONE';
      }

      if (
        selected.length <= 2
      ) {
        return selected.join('+');
      }

      return `${selected.length} SELECTED`;
    }

    function updateRuralityControls() {
      const selected =
        state.filters
          .selectedRurality;

      ruralityCheckboxes
        .forEach(
          checkbox => {
            checkbox.checked =
              selected.includes(
                checkbox.value
              );
          }
        );

      ruralityAllCheckbox.checked =
        selected.length ===
        RURALITY_OPTIONS.length;

      ruralityAllCheckbox.indeterminate =
        selected.length > 0 &&
        selected.length <
          RURALITY_OPTIONS.length;

      ruralityButton
        .querySelector(
          '.filter-value'
        )
        .textContent =
          getRuralitySummary();

      clearButtonColour(
        ruralityButton
      );

      if (
        selected.length === 1 &&
        selected[0] === 'metro'
      ) {
        applyButtonColour(
          ruralityButton,
          '#3f4851'
        );
      }

      if (
        selected.length === 1 &&
        selected[0] === 'nonmetro'
      ) {
        applyButtonColour(
          ruralityButton,
          '#9f6545'
        );
      }
    }

    function updateStateControls() {
      const selected =
        state.filters
          .selectedStates;

      stateCheckboxes.forEach(
        checkbox => {
          checkbox.checked =
            selected.includes(
              checkbox.value
            );
        }
      );

      stateAllCheckbox.checked =
        selected.length ===
        STATE_OPTIONS.length;

      stateAllCheckbox.indeterminate =
        selected.length > 0 &&
        selected.length <
          STATE_OPTIONS.length;

      const summaryElement =
        stateButton.querySelector(
          '.filter-value'
        );

      summaryElement.textContent =
        getStateSummary();

      clearButtonColour(
        stateButton
      );

      if (
        selected.length === 1
      ) {
        const selectedStyle =
          STATE_STYLES[
            selected[0]
          ];

        applyButtonColour(
          stateButton,
          selectedStyle.colour
        );
      }
    }

    function updateAllControls() {
      setBooleanButton(
        repeatToggle,
        state.filters
          .showRepeats
      );

      setBooleanButton(
        corporateToggle,
        state.filters
          .showCorporates
      );

      setBooleanButton(
        delistedToggle,
        state.filters
          .showDelisted
      );

      updateRuralityControls();
      updateStateControls();
    }

    function appendCellContent(
      cellElement,
      cellModel
    ) {
      const displayText =
        formatDisplayText(
          cellModel.text
        );

      if (cellModel.link) {
        const anchor =
          document.createElement(
            'a'
          );

        anchor.href =
          cellModel.link;

        anchor.target =
          '_blank';

        anchor.rel =
          'noopener noreferrer';

        anchor.textContent =
          displayText;

        anchor.setAttribute(
          'aria-label',
          `${displayText} — opens in a new tab`
        );

        if (
          cellModel.linkClass
        ) {
          anchor.classList.add(
            cellModel.linkClass
          );
        }

        cellElement.appendChild(
          anchor
        );

        return;
      }

      cellElement.textContent =
        displayText;
    }

    function renderTable(model) {
      const thead =
        dataTable.querySelector(
          'thead'
        );

      const tbody =
        dataTable.querySelector(
          'tbody'
        );

      thead.textContent = '';
      tbody.textContent = '';

      const headerRow =
        document.createElement(
          'tr'
        );

      model.headers.forEach(
        header => {
          const th =
            document.createElement(
              'th'
            );

          th.scope = 'col';

          th.dataset.sourceColumn =
            columnNumberToLetter(
              header.sourceColumn
            );

          th.textContent =
            header.text ||
            columnNumberToLetter(
              header.sourceColumn
            );

          headerRow.appendChild(
            th
          );
        }
      );

      thead.appendChild(
        headerRow
      );

      const fragment =
        document.createDocumentFragment();

      state.rows = [];

      model.rows.forEach(
        rowModel => {
          const tr =
            document.createElement(
              'tr'
            );

          tr.dataset.sourceRow =
            String(
              rowModel.sourceRow
            );

          tr.dataset.week =
            rowModel.weekKey || '';

          if (
            rowModel.isRepeat
          ) {
            tr.classList.add(
              'repeat-row'
            );
          }

          if (
            rowModel.isDelisted
          ) {
            tr.classList.add(
              'delisted-row'
            );
          }

          rowModel.cells.forEach(
            cellModel => {
              const td =
                document.createElement(
                  'td'
                );

              td.dataset.sourceColumn =
                columnNumberToLetter(
                  cellModel
                    .sourceColumn
                );

              appendCellContent(
                td,
                cellModel
              );

              if (
                cellModel
                  .sourceColumn ===
                CONFIG
                  .EMPLOYER_TYPE_COLUMN
              ) {
                const categoryClass =
                  getEmployerTypeClass(
                    cellModel.text
                  );

                if (
                  categoryClass
                ) {
                  td.classList.add(
                    categoryClass
                  );
                }
              }

              if (
                cellModel
                  .sourceColumn ===
                CONFIG.STATE_COLUMN
              ) {
                const stateClass =
                  getStateClass(
                    cellModel.text
                  );

                if (stateClass) {
                  td.classList.add(
                    stateClass
                  );
                }
              }

              if (
                cellModel
                  .sourceColumn ===
                CONFIG.MM_COLUMN
              ) {
                const ruralityClass =
                  getRuralityClass(
                    cellModel.text
                  );

                if (
                  ruralityClass
                ) {
                  td.classList.add(
                    ruralityClass
                  );
                }
              }

              tr.appendChild(td);
            }
          );

          fragment.appendChild(
            tr
          );

          state.rows.push({
            element: tr,

            isRepeat:
              rowModel.isRepeat,

            isCorporate:
              rowModel.isCorporate,

            isDelisted:
              rowModel.isDelisted,

            hasMM1:
              rowModel.hasMM1,

            hasNonMetroMM:
              rowModel
                .hasNonMetroMM,

            stateCodes:
              rowModel.stateCodes,

            weekKey:
              rowModel.weekKey ||
              '',

            isHidden: false
          });
        }
      );

      tbody.appendChild(
        fragment
      );

      applyFilters();
    }

    function rowMatchesRurality(
      row
    ) {
      const selected =
        state.filters
          .selectedRurality;

      if (
        selected.length ===
        RURALITY_OPTIONS.length
      ) {
        return true;
      }

      if (
        selected.length === 0
      ) {
        return false;
      }

      const matchesMetro =
        selected.includes(
          'metro'
        ) &&
        row.hasMM1;

      const matchesNonMetro =
        selected.includes(
          'nonmetro'
        ) &&
        row.hasNonMetroMM;

      return (
        matchesMetro ||
        matchesNonMetro
      );
    }

    function rowMatchesState(row) {
      const selected =
        state.filters
          .selectedStates;

      if (
        selected.length ===
        STATE_OPTIONS.length
      ) {
        return true;
      }

      if (
        selected.length === 0
      ) {
        return false;
      }

      return row.stateCodes.some(
        stateCode =>
          selected.includes(
            stateCode
          )
      );
    }

    function refreshWeekDividers() {
      state.rows.forEach(
        row => {
          row.element
            .classList.remove(
              'week-divider'
            );
        }
      );

      const visibleRows =
        state.rows.filter(
          row =>
            !row.isHidden
        );

      for (
        let index = 0;
        index <
          visibleRows.length - 1;
        index++
      ) {
        const currentRow =
          visibleRows[index];

        const nextRow =
          visibleRows[
            index + 1
          ];

        if (
          currentRow.weekKey &&
          nextRow.weekKey &&
          currentRow.weekKey !==
            nextRow.weekKey
        ) {
          currentRow.element
            .classList.add(
              'week-divider'
            );
        }
      }
    }

    function applyFilters() {
      let visibleCount = 0;

      state.rows.forEach(
        row => {
          const hidden =
            (
              !state.filters
                .showRepeats &&
              row.isRepeat
            ) ||
            (
              !state.filters
                .showCorporates &&
              row.isCorporate
            ) ||
            (
              !state.filters
                .showDelisted &&
              row.isDelisted
            ) ||
            !rowMatchesRurality(
              row
            ) ||
            !rowMatchesState(
              row
            );

          row.isHidden = hidden;

          row.element
            .classList.toggle(
              'is-hidden',
              hidden
            );

          if (!hidden) {
            visibleCount++;
          }
        }
      );

      refreshWeekDividers();

      const totalCount =
        state.rows.length;

      tableStatus.textContent =
        `Showing ${visibleCount.toLocaleString('en-AU')} of ` +
        `${totalCount.toLocaleString('en-AU')} jobs since ` +
        `${formatDate(state.dateCutoff)} (last 2 mths)`;

      emptyState.classList.toggle(
        'is-visible',
        visibleCount === 0
      );

      dataTable.style.display =
        visibleCount === 0
          ? 'none'
          : '';
    }

    function commitFilterChange() {
      saveFilters();
      updateAllControls();
      applyFilters();
    }

    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );
    }

    function showError(error) {
      console.error(error);

      hideLoadingState();

      tableShell.style.display =
        'none';

      tableStatus.textContent =
        'Could not load jobs';

      errorState.textContent =
        `${
          error?.message ||
          'Could not load the spreadsheet.'
        } ` +
        'Ensure the spreadsheet is shared as “Anyone with the link can view” and, if required, set the exact worksheet tab in CONFIG.SHEET_NAME.';

      errorState.classList.add(
        'is-visible'
      );
    }

    async function loadTableData() {
      try {
        const model =
          await loadGvizModel();

        renderTable(model);
        hideLoadingState();
      } catch (error) {
        showError(error);
      }
    }

      'click',
      () => {
        state.filters
          .showRepeats =
          !state.filters
            .showRepeats;

        commitFilterChange();
      }
    );

    corporateToggle.addEventListener(
      'click',
      () => {
        state.filters
          .showCorporates =
          !state.filters
            .showCorporates;

        commitFilterChange();
      }
    );

    delistedToggle.addEventListener(
      'click',
      () => {
        state.filters
          .showDelisted =
          !state.filters
            .showDelisted;

        commitFilterChange();
      }
    );

    ruralityButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        toggleMenu(
          'rurality'
        );
      }
    );

    stateButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        toggleMenu(
          'state'
        );
      }
    );

    ruralityMenu.addEventListener(
      'click',
      event => {
        event.stopPropagation();
      }
    );

    stateMenu.addEventListener(
      'click',
      event => {
        event.stopPropagation();
      }
    );

    ruralityAllCheckbox
      .addEventListener(
        'change',
        () => {
          state.filters
            .selectedRurality =
            ruralityAllCheckbox
              .checked
              ? [
                  ...RURALITY_OPTIONS
                ]
              : [];

          commitFilterChange();
        }
      );

    ruralityCheckboxes.forEach(
      checkbox => {
        checkbox.addEventListener(
          'change',
          () => {
            const selected =
              new Set(
                state.filters
                  .selectedRurality
              );

            if (
              checkbox.checked
            ) {
              selected.add(
                checkbox.value
              );
            } else {
              selected.delete(
                checkbox.value
              );
            }

            state.filters
              .selectedRurality =
              RURALITY_OPTIONS
                .filter(
                  value =>
                    selected.has(
                      value
                    )
                );

            commitFilterChange();
          }
        );
      }
    );

    stateAllCheckbox
      .addEventListener(
        'change',
        () => {
          state.filters
            .selectedStates =
            stateAllCheckbox
              .checked
              ? [
                  ...STATE_OPTIONS
                ]
              : [];

          commitFilterChange();
        }
      );

    stateCheckboxes.forEach(
      checkbox => {
        checkbox.addEventListener(
          'change',
          () => {
            const selected =
              new Set(
                state.filters
                  .selectedStates
              );

            if (
              checkbox.checked
            ) {
              selected.add(
                checkbox.value
              );
            } else {
              selected.delete(
                checkbox.value
              );
            }

            state.filters
              .selectedStates =
              STATE_OPTIONS.filter(
                value =>
                  selected.has(
                    value
                  )
              );

            commitFilterChange();
          }
        );
      }
    );

    document.addEventListener(
      'click',
      () => {
        setMenuOpen(
          null,
          false
        );
      }
    );

    document.addEventListener(
      'keydown',
      event => {
        if (
          event.key ===
          'Escape'
        ) {
          setMenuOpen(
            null,
            false
          );
        }
      }
    );

    window.addEventListener(
      'resize',
      () => {
        setMenuOpen(
          null,
          false
        );
      }
    );

    updateAllControls();
    loadTableData();
  </script>
</body>
</html>
