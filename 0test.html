                  nearestAggregate.distance
              ) {
                nearestAggregate = {
                  datasetIndex,
                  index,
                  distance
                };
              }
            }
          );
        }
      );

      if (nearestAggregate) {
        return nearestAggregate;
      }

      return findNearestInteractiveLine(
        event
      );
    }

    function showSelectedTooltip(
      event,
      selectedElement
    ) {
      const renderedElement =
        chart
          .getDatasetMeta(
            selectedElement.datasetIndex
          )
          ?.data
          ?.[selectedElement.index];

      chart.tooltip.setActiveElements(
        [
          {
            datasetIndex:
              selectedElement.datasetIndex,

            index:
              selectedElement.index
          }
        ],
        {
          x:
            Number.isFinite(event?.x)
              ? event.x
              : renderedElement?.x ?? 0,

          y:
            Number.isFinite(event?.y)
              ? event.y
              : renderedElement?.y ?? 0
        }
      );

      chart.update('none');
    }

    function showHoveredLineTooltip(
      event,
      selectedElement
    ) {
      if (
        !selectedElement ||
        !chart
      ) {
        return;
      }

      const dataset =
        chart.data.datasets[
          selectedElement.datasetIndex
        ];

      if (
        dataset?.datasetRole !==
          'regression' &&
        dataset?.datasetRole !==
          'categoryMedian' &&
        dataset?.datasetRole !==
          'locationAggregate' &&
        dataset?.datasetRole !==
          'locationRaw'
      ) {
        return;
      }

      const currentActive =
        chart.tooltip
          ?.getActiveElements
          ?.()
          ?.[0];

      if (
        currentActive?.datasetIndex ===
          selectedElement.datasetIndex &&
        currentActive?.index ===
          selectedElement.index
      ) {
        return;
      }

      showSelectedTooltip(
        event,
        selectedElement
      );
    }

    function handleChartHover(
      event,
      elements
    ) {
      if (
        !chart ||
        interactionLocked
      ) {
        if (chart) {
          chart.canvas.style.cursor =
            'default';
        }

        return;
      }

      const selectedElement =
        findRawLocationElement(event) ||
        findPrioritySummaryElement(event) ||
        getInteractiveElement(elements);

      const dataset =
        selectedElement
          ? chart.data.datasets[
              selectedElement.datasetIndex
            ]
          : null;

      const raw =
        selectedElement
          ? dataset?.data?.[
              selectedElement.index
            ]
          : null;

      chart.canvas.style.cursor =
        activeView === 'location' &&
        dataset?.datasetRole ===
          'locationAggregate' &&
        raw &&
        !splitStates.has(raw.state)
          ? 'pointer'
          : selectedElement
            ? 'pointer'
            : 'default';

      if (
        selectedElement &&
        (
          dataset?.datasetRole ===
            'regression' ||
          dataset?.datasetRole ===
            'categoryMedian' ||
          dataset?.datasetRole ===
            'locationAggregate' ||
          dataset?.datasetRole ===
            'locationRaw'
        )
      ) {
        showHoveredLineTooltip(
          event,
          selectedElement
        );
      }
    }

    function handleChartClick(
      event,
      elements
    ) {
      if (
        !chart ||
        interactionLocked
      ) {
        return;
      }

      event?.native
        ?.preventDefault?.();

      const selectedElement =
        findRawLocationElement(event) ||
        findPrioritySummaryElement(event) ||
        getInteractiveElement(elements);

      if (!selectedElement) {
        chart.tooltip.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

        chart.update('none');
        return;
      }

      showSelectedTooltip(
        event,
        selectedElement
      );

      const dataset =
        chart.data.datasets[
          selectedElement.datasetIndex
        ];

      const raw =
        dataset?.data?.[
          selectedElement.index
        ];

      if (
        activeView !== 'location' ||
        dataset?.datasetRole !==
          'locationAggregate' ||
        !raw ||
        splitStates.has(raw.state)
      ) {
        lastAggregateClickKey =
          null;

        lastAggregateClickTime =
          0;

        return;
      }

      const clickedAt =
        performance.now();

      const isSecondActivation =
        lastAggregateClickKey ===
          raw.state &&
        clickedAt -
          lastAggregateClickTime <=
          CONFIG.doubleActivationMs;

      if (isSecondActivation) {
        lastAggregateClickKey =
          null;

        lastAggregateClickTime =
          0;

        chart.tooltip.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

        chart.update('none');

        animateStateSplit(
          raw.state
        );

        return;
      }

      lastAggregateClickKey =
        raw.state;

      lastAggregateClickTime =
        clickedAt;
    }


    function getTargetPointStyle(
      dataset,
      raw,
      index
    ) {
      const context = {
        chart,
        raw,
        dataIndex: index,
        dataset,
        datasetIndex: 0,
        type: 'data'
      };

      const backgroundColour =
        resolveScriptableValue(
          dataset.pointBackgroundColor,
          context,
          raw?.colour
            ? rgba(
                raw.colour,
                CONFIG.aggregateOpacity
              )
            : 'rgba(102, 0, 255, 0.20)'
        );

      const borderColour =
        resolveScriptableValue(
          dataset.pointBorderColor,
          context,
          backgroundColour
        );

      const radius =
        Number(
          resolveScriptableValue(
            dataset.pointRadius,
            context,
            CONFIG.pointRadius
          )
        );

      return {
        backgroundColour,
        borderColour,

        radius:
          Number.isFinite(radius)
            ? radius
            : CONFIG.pointRadius,

        pointStyle:
          resolveScriptableValue(
            dataset.pointStyle,
            context,
            'circle'
          )
      };
    }

    function captureRenderedGeometry() {
      const pointPixels = [];
      const lineGroups = [];

      if (!chart) {
        return {
          pointPixels,
          lineGroups
        };
      }

      chart.data.datasets.forEach(
        (dataset, datasetIndex) => {
          const metadata =
            chart.getDatasetMeta(
              datasetIndex
            );

          const renderedElements =
            metadata?.data || [];

          const data =
            dataset.data || [];

          const pixels =
            renderedElements
              .map((element, index) => {
                if (
                  !Number.isFinite(
                    element?.x
                  ) ||
                  !Number.isFinite(
                    element?.y
                  )
                ) {
                  return null;
                }

                return {
                  x:
                    element.x,

                  y:
                    element.y,

                  raw:
                    data[index] || {},

                  role:
                    dataset.datasetRole,

                  datasetMetadata:
                    dataset.metadata || {},

                  style: {
                    backgroundColour:
                      element.options
                        ?.backgroundColor ||
                      element.options
                        ?.borderColor ||
                      'rgba(119, 119, 119, 0.35)',

                    borderColour:
                      element.options
                        ?.borderColor ||
                      element.options
                        ?.backgroundColor ||
                      'rgba(119, 119, 119, 0.35)',

                    radius:
                      Number(
                        element.options?.radius
                      ) ||
                      CONFIG.pointRadius,

                    pointStyle:
                      element.options
                        ?.pointStyle ||
                      'circle'
                  }
                };
              })
              .filter(Boolean);

          if (!pixels.length) {
            return;
          }

          if (
            isLineDataset(dataset) &&
            pixels.length > 1
          ) {
            lineGroups.push({
              role:
                dataset.datasetRole,

              pixels,

              metadata:
                dataset.metadata || {},

              style: {
                borderColour:
                  metadata
                    ?.dataset
                    ?.options
                    ?.borderColor ||
                  dataset.borderColor ||
                  '#777777',

                borderWidth:
                  Number(
                    metadata
                      ?.dataset
                      ?.options
                      ?.borderWidth
                  ) ||
                  Number(
                    dataset.borderWidth
                  ) ||
                  1
              }
            });
          } else {
            pointPixels.push(
              ...pixels
            );
          }
        }
      );

      return {
        pointPixels,
        lineGroups
      };
    }

    function samplePixel(
      sourcePixels,
      index,
      targetLength
    ) {
      if (!sourcePixels.length) {
        return null;
      }

      if (targetLength <= 1) {
        return sourcePixels[0];
      }

      const sourceIndex =
        Math.round(
          index *
          (
            sourcePixels.length - 1
          ) /
          Math.max(
            1,
            targetLength - 1
          )
        );

      return sourcePixels[
        sourceIndex
      ];
    }

    function findNearestPixel(
      targetPixel,
      candidates
    ) {
      if (!candidates.length) {
        return null;
      }

      let nearest =
        candidates[0];

      let nearestDistance =
        Infinity;

      candidates.forEach(candidate => {
        const distance =
          Math.hypot(
            targetPixel.x -
              candidate.x,

            targetPixel.y -
              candidate.y
          );

        if (
          distance <
          nearestDistance
        ) {
          nearest =
            candidate;

          nearestDistance =
            distance;
        }
      });

      return nearest;
    }

    function choosePointStartPixel(
      targetRaw,
      targetPixel,
      geometry
    ) {
      const allPointPixels =
        geometry.pointPixels;

      if (!allPointPixels.length) {
        return findNearestPixel(
          targetPixel,

          geometry.lineGroups.flatMap(
            group => group.pixels
          )
        );
      }

      if (
        Number.isInteger(
          targetRaw?.sourceIndex
        )
      ) {
        const exactSource =
          allPointPixels.find(
            pixel =>
              pixel.raw?.sourceIndex ===
              targetRaw.sourceIndex
          );

        if (exactSource) {
          return exactSource;
        }
      }

      if (targetRaw?.state) {
        const sameState =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.state ===
              targetRaw.state
          );

        if (sameState.length) {
          return findNearestPixel(
            targetPixel,
            sameState
          );
        }
      }

      if (targetRaw?.structure) {
        const sameStructure =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.structure ===
              targetRaw.structure
          );

        if (sameStructure.length) {
          return findNearestPixel(
            targetPixel,
            sameStructure
          );
        }
      }

      if (targetRaw?.category) {
        const sameCategory =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.category ===
              targetRaw.category
          );

        if (sameCategory.length) {
          return findNearestPixel(
            targetPixel,
            sameCategory
          );
        }
      }

      return findNearestPixel(
        targetPixel,
        allPointPixels
      );
    }

    function chooseLineSourceGroup(
      targetDataset,
      geometry
    ) {
      const sameRoleGroups =
        geometry.lineGroups.filter(
          group =>
            group.role ===
            targetDataset.datasetRole
        );

      if (sameRoleGroups.length) {
        const targetCategory =
          targetDataset
            .metadata
            ?.category;

        const exactCategory =
          sameRoleGroups.find(
            group =>
              targetCategory &&
              group.metadata?.category ===
              targetCategory
          );

        if (exactCategory) {
          return exactCategory;
        }

        const targetMedian =
          Number(
            targetDataset
              .metadata
              ?.statistics
              ?.median
          );

        if (
          Number.isFinite(
            targetMedian
          )
        ) {
          return sameRoleGroups
            .slice()
            .sort(
              (first, second) =>
                Math.abs(
                  Number(
                    first
                      .metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                ) -
                Math.abs(
                  Number(
                    second
                      .metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                )
            )[0];
        }

        return sameRoleGroups[0];
      }

      return {
        role:
          'points',

        pixels:
          geometry.pointPixels,

        metadata:
          {},

        style: {
          borderColour:
            'rgba(119, 119, 119, 0)',

          borderWidth:
            0
        }
      };
    }

    function createTransitionPlans(
      targetDatasets,
      geometry
    ) {
      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return targetDatasets.map(
        targetDataset => {
          const targetData =
            (
              targetDataset.data || []
            ).map(point => ({
              ...point
            }));

          const targetIsLine =
            isLineDataset(
              targetDataset
            );

          const lineSourceGroup =
            targetIsLine
              ? chooseLineSourceGroup(
                  targetDataset,
                  geometry
                )
              : null;

          const sourcePixels = [];

          const startData =
            targetData.map(
              (targetPoint, index) => {
                const targetPixel = {
                  x:
                    xScale.getPixelForValue(
                      targetPoint.x
                    ),

                  y:
                    yScale.getPixelForValue(
                      targetPoint.y
                    )
                };

                const sourcePixel =
                  targetIsLine
                    ? samplePixel(
                        lineSourceGroup
                          ?.pixels || [],

                        index,

                        targetData.length
                      )
                    : choosePointStartPixel(
                        targetPoint,
                        targetPixel,
                        geometry
                      );

                sourcePixels.push(
                  sourcePixel
                );

                if (!sourcePixel) {
                  return {
                    ...targetPoint
                  };
                }

                return {
                  ...targetPoint,

                  x:
                    xScale.getValueForPixel(
                      sourcePixel.x
                    ),

                  y:
                    yScale.getValueForPixel(
                      sourcePixel.y
                    )
                };
              }
            );

          if (targetIsLine) {
            const targetColour =
              String(
                targetDataset.borderColor ||
                '#777777'
              );

            const targetWidth =
              Number(
                targetDataset.borderWidth
              ) ||
              1;

            const startColour =
              lineSourceGroup
                ?.style
                ?.borderColour ||
              fadeCssColour(
                targetColour,
                0
              );

            const startWidth =
              Number(
                lineSourceGroup
                  ?.style
                  ?.borderWidth
              ) ||
              0;

            return {
              kind:
                'line',

              transitionDataset: {
                ...targetDataset,

                data:
                  startData,

                borderColor:
                  startColour,

                backgroundColor:
                  startColour,

                borderWidth:
                  startWidth,

                pointHitRadius:
                  0
              },

              targetDataset,
              startData,
              targetData,
              startColour,
              targetColour,
              startWidth,
              targetWidth
            };
          }

          const targetStyles =
            targetData.map(
              (point, index) =>
                getTargetPointStyle(
                  targetDataset,
                  point,
                  index
                )
            );

          const startStyles =
            targetStyles.map(
              (targetStyle, index) => {
                const sourceStyle =
                  sourcePixels[index]?.style;

                if (sourceStyle) {
                  return sourceStyle;
                }

                return {
                  backgroundColour:
                    fadeCssColour(
                      targetStyle
                        .backgroundColour,
                      0
                    ),

                  borderColour:
                    fadeCssColour(
                      targetStyle
                        .borderColour,
                      0
                    ),

                  radius:
                    0,

                  pointStyle:
                    targetStyle.pointStyle
                };
              }
            );

          return {
            kind:
              'point',

            transitionDataset: {
              ...targetDataset,

              data:
                startData,

              pointBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointHoverBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointHoverBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHoverRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHitRadius:
                0,

              pointStyle:
                targetDataset.pointStyle ||
                'circle'
            },

            targetDataset,
            startData,
            targetData,
            startStyles,
            targetStyles
          };
        }
      );
    }

    function createDepartingLinePlans(
      geometry,
      targetDatasets
    ) {
      const targetRoles =
        new Set(
          targetDatasets
            .filter(
              isLineDataset
            )
            .map(
              dataset =>
                dataset.datasetRole
            )
        );

      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return geometry.lineGroups
        .filter(
          group =>
            !targetRoles.has(
              group.role
            )
        )
        .map(group => {
          const data =
            group.pixels.map(
              pixel => ({
                x:
                  xScale.getValueForPixel(
                    pixel.x
                  ),

                y:
                  yScale.getValueForPixel(
                    pixel.y
                  )
              })
            );

          const colour =
            group.style.borderColour ||
            '#777777';

          const width =
            Number(
              group.style.borderWidth
            ) ||
            1;

          return {
            dataset: {
              type:
                'line',

              datasetRole:
                'transitionGhost',

              data,

              parsing:
                false,

              showLine:
                true,

              clip:
                false,

              fill:
                false,

              order:
                20,

              borderColor:
                colour,

              backgroundColor:
                colour,

              borderWidth:
                width,

              borderCapStyle:
                'round',

              borderJoinStyle:
                'round',

              pointRadius:
                0,

              pointHoverRadius:
                0,

              pointHitRadius:
                0,

              tension:
                0
            },

            colour,
            width
          };
        });
    }
    function animateViewMorph(
      model,
      duration
    ) {
      PFFCharts.runViewMorph({
        chart,
        model,
        duration,
        xAxisFade,
        currentXAxisOptions,
        captureRenderedGeometry,
        captureXAxisSnapshot:
          safeCaptureXAxisSnapshot,
        getXAxisChangeMap,
        createFadingXAxisOptions,
        createYAxisOptions,
        createTransitionPlans,
        createDepartingLinePlans,
        animationController,
        setCurrentXAxisOptions(value) {
          currentXAxisOptions =
            value;
        },
        setInteractionLocked(value) {
          interactionLocked =
            value;
        },
        setViewMorphInProgress(value) {
          viewMorphInProgress =
            value;
        },
        onComplete() {
          updateReaggregateButton();
        }
      });
    }

    function createChart() {
      const model =
        buildViewModel(
          activeView
        );

      currentXAxisOptions =
        model.xScale;

      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type:
              'scatter',

            data: {
              datasets:
                model.datasets
            },

            options: {
              responsive:
                true,

              maintainAspectRatio:
                false,

              resizeDelay:
                0,

              devicePixelRatio:
                Math.min(
                  window.devicePixelRatio ||
                  1,
                  3
                ),

              animation: {
                duration:
                  0
              },

              transitions: {
                resize: {
                  animation: {
                    duration:
                      0
                  }
                },

                active: {
                  animation: {
                    duration:
                      170,

                    easing:
                      'easeOutCubic'
                  }
                }
              },

              layout: {
                autoPadding:
                  false,

                padding: {
                  top: 4,
                  right: 4,
                  bottom: 0,
                  left: 0
                }
              },

              interaction: {
                mode:
                  'nearest',

                axis:
                  'xy',

                intersect:
                  true,

                includeInvisible:
                  false
              },

              onHover:
                handleChartHover,

              onClick:
                handleChartClick,

              plugins: {
                legend: {
                  display:
                    false
                },

                tooltip:
                  PFFCharts.tooltipOptions({
                    filter() {
                      return !interactionLocked;
                    },

                    callbacks: {
                      title(items) {
                        return tooltipTitle(
                          items?.[0]
                        );
                      },

                      label(item) {
                        return tooltipLabel(
                          item
                        );
                      }
                    }
                  })
              },

              scales: {
                x:
                  model.xScale,

                y:
                  createYAxisOptions()
              }
            },

            plugins: [
              xAxisFadePlugin,
              variableAxisTickPlugin,
              locationLabelPlugin
            ]
          }
        );

      updateLegend(
        model.legendItems,
        false
      );

      updateChartNote(
        model.note
      );
    }

    function applyView(
      nextView,
      animate = true
    ) {
      if (
        !chart ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      activeView =
        nextView;

      lastAggregateClickKey =
        null;

      lastAggregateClickTime =
        0;

      const model =
        buildViewModel(
          activeView
        );

      PFF.animateTextChange(
        chartHeadingDetail,
        VIEW_CONFIG[
          activeView
        ].headingDetail
      );

      tabsController?.set(
        activeView,
        {
          notify: false
        }
      );

      updateLegend(
        model.legendItems,
        animate
      );

      updateChartNote(
        model.note
      );

      updateReaggregateButton();

      if (!animate) {
        currentXAxisOptions =
          model.xScale;

        chart.options.animation.duration =
          0;

        chart.data.datasets =
          model.datasets;

        chart.options.scales.x =
          model.xScale;

        chart.options.scales.y =
          createYAxisOptions();

        chart.update('none');
        return;
      }

      animateViewMorph(
        model,
        CONFIG.transitionMs
      );
    }

    function requestViewSwitch(
      nextView
    ) {
      if (
        nextView === activeView ||
        interactionLocked ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      if (
        activeView === 'location' &&
        splitStates.size > 0
      ) {
        animateReaggregation(
          () => {
            applyView(
              nextView,
              true
            );
          }
        );

        return;
      }

      applyView(
        nextView,
        true
      );
    }
    function updateLegend(
      items,
      animate = true
    ) {
      legendController?.update(
        items,
        animate
      );
    }

    function updateChartNote(note) {
      chartNote.textContent =
        note || '';

      chartNote.classList.toggle(
        'is-hidden',
        !note
      );
    }





    function updateReaggregateButton() {
      const shouldShow =
        splitStates.size > 0 ||
        mergingStates.size > 0;

      reaggregateButton.classList.toggle(
        'is-hidden',
        !shouldShow
      );

      reaggregateButton.setAttribute(
        'aria-hidden',
        String(!shouldShow)
      );

      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;

      reaggregateButton.disabled =
        interactionLocked;
    }

    function createRawStatePoints(state) {
      const aggregatePoint =
        locationAggregatePoints.find(
          point =>
            point.state === state
        );

      const stateRows =
        locationRawRows.get(state) ||
        [];

      if (
        !aggregatePoint ||
        !stateRows.length
      ) {
        return [];
      }

      const statistics =
        aggregatePoint.statistics;

      const rateGroups =
        new Map();

      stateRows.forEach(row => {
        const key =
          String(row.hourlyRate);

        if (!rateGroups.has(key)) {
          rateGroups.set(
            key,
            []
          );
        }

        rateGroups.get(key).push(
          row
        );
      });

      const points = [];

      rateGroups.forEach(groupRows => {
        const pointCount =
          groupRows.length;

        const availableHalfSpan =
          Math.max(
            0,

            Math.min(
              aggregatePoint.x - 5,
              95 - aggregatePoint.x
            )
          );

        const halfSpan =
          Math.min(
            9,

            Math.max(
              0,
              (pointCount - 1) *
              0.8
            ),

            availableHalfSpan
          );

        groupRows.forEach(
          (row, index) => {
            const targetX =
              pointCount === 1
                ? aggregatePoint.x
                : aggregatePoint.x -
                  halfSpan +
                  index /
                  (pointCount - 1) *
                  halfSpan *
                  2;

            points.push({
              kind:
                'locationRaw',

              state,

              x:
                aggregatePoint.x,

              y:
                aggregatePoint.y,

              targetX,

              targetY:
                row.hourlyRate,

              colour:
                aggregatePoint.colour,

              statistics,

              ...row
            });
          }
        );
      });

      return points;
    }

    function animateStateSplit(state) {
      if (
        activeView !== 'location' ||
        interactionLocked ||
        splitStates.has(state) ||
        !chart
      ) {
        return;
      }

      const newPoints =
        createRawStatePoints(
          state
        );

      if (!newPoints.length) {
        return;
      }

      const shouldDim =
        splitStates.size === 0;

      interactionLocked =
        true;

      splitStates.add(state);

      splitProgress.set(
        state,
        0
      );

      newPoints.forEach(point => {
        point.startX =
          point.x;

        point.startY =
          point.y;
      });

      locationRawDisplayPoints.push(
        ...newPoints
      );

      chart.data.datasets[1].data =
        locationRawDisplayPoints;

      chart.update('none');

      updateReaggregateButton();

      animationController.run({
        duration:
          CONFIG.splitAnimationMs,

        easing:
          easeOutCubic,

        onFrame(progress) {
          splitProgress.set(
            state,
            progress
          );

          if (shouldDim) {
            aggregateDimProgress =
              progress;
          }

          newPoints.forEach(point => {
            point.x =
              point.startX +
              (
                point.targetX -
                point.startX
              ) *
              progress;

            point.y =
              point.startY +
              (
                point.targetY -
                point.startY
              ) *
              progress;
          });

          chart.update('none');
        },

        onComplete() {
          newPoints.forEach(point => {
            point.x =
              point.targetX;

            point.y =
              point.targetY;
          });

          splitProgress.delete(
            state
          );

          if (shouldDim) {
            aggregateDimProgress =
              1;
          }

          interactionLocked =
            false;

          chart.update('none');

          updateReaggregateButton();
        }
      });
    }

    function animateReaggregation(
      onCompleteCallback = null
    ) {
      if (
        activeView !== 'location' ||
        interactionLocked ||
        !chart ||
        splitStates.size === 0
      ) {
        return;
      }

      interactionLocked =
        true;

      mergeProgress =
        0;

      splitStates.forEach(state => {
        mergingStates.add(state);
      });

      locationRawDisplayPoints.forEach(
        point => {
          const aggregatePoint =
            locationAggregatePoints.find(
              item =>
                item.state ===
                point.state
            );

          point.mergeStartX =
            point.x;

          point.mergeStartY =
            point.y;

          point.mergeTargetX =
            aggregatePoint?.x ??
            point.x;

          point.mergeTargetY =
            aggregatePoint?.y ??
            point.y;
        }
      );

      chart.update('none');

      updateReaggregateButton();

      animationController.run({
        duration:
          CONFIG.mergeAnimationMs,

        easing:
          easeInOutCubic,

        onFrame(progress) {
          mergeProgress =
            progress;

          aggregateDimProgress =
            1 - progress;

          locationRawDisplayPoints.forEach(
            point => {
              point.x =
                point.mergeStartX +
                (
                  point.mergeTargetX -
                  point.mergeStartX
                ) *
                progress;

              point.y =
                point.mergeStartY +
                (
                  point.mergeTargetY -
                  point.mergeStartY
                ) *
                progress;
            }
          );

          chart.update('none');
        },

        onComplete() {
          locationRawDisplayPoints =
            [];

          chart.data.datasets[1].data =
            locationRawDisplayPoints;

          splitStates.clear();
          splitProgress.clear();
          mergingStates.clear();

          mergeProgress =
            0;

          aggregateDimProgress =
            0;

          interactionLocked =
            false;

          chart.update('none');

          updateReaggregateButton();

          onCompleteCallback?.();
        }
      });
    }

    reaggregateButton.addEventListener(
      'click',
      () => {
        animateReaggregation();
      }
    );

    tabsController =
      PFF.setupTabs({
        tabList,
        tabs:
          chartTabs,
        scroller:
          tabList,
        leftButton:
          tabScrollLeft,
        rightButton:
          tabScrollRight,
        valueAttribute:
          'view',
        initialValue:
          activeView,
        controlled:
          true,
        onRequest(nextView) {
          requestViewSwitch(
            nextView
          );
        }
      });

    legendController =
      PFFCharts.setupDisplayLegend({
        legend:
          chartLegend,
        leftButton:
          legendScrollLeft,
        rightButton:
          legendScrollRight
      });

    interactionsController =
      PFFCharts.setupChartInteractions({
        canvas:
          chartCanvas,
        getChart() {
          return chart;
        }
      });

    responsiveController =
      PFFCharts.createResponsiveController({
        getChart() {
          return chart;
        },
        observe: [
          app,
          chartShell
        ],
        applyResponsiveChartOptions:
          false,
        onRefresh() {
          tabsController?.update();
          legendController?.refresh();
        }
      });

    async function loadDashboard() {
      await PFF.initialiseApp({
        app,
        status:
          statusElement,
        forceCached:
          FORCE_CACHED_DATA,
        cacheKey:
          CONFIG.localCacheKey,
        minRows:
          1,
        dataSourceOptions: {
          indicator:
            dataSourceIndicator,
          text:
            dataSourceText
        },
        loadLive() {
          return PFFCharts.loadGVizSheet({
            sheetId:
              CONFIG.sheetId,
            sheetName:
              CONFIG.sheetName,
            range:
              CONFIG.range,
            headers:
              '1',
            query:
              'select *',
            timeoutMs:
              CONFIG.fetchTimeoutMs
          });
        },
        parseLive(table) {
          const parsedRows =
            normaliseRows(
              table?.rows || []
            );

          if (!parsedRows.length) {
            throw new Error(
              'No valid hourly rate rows were found in columns A to J'
            );
          }

          return parsedRows;
        },
        loadRemoteCache() {
          return PFFCharts.loadAppsScriptCache({
            url:
              CACHE_WEB_APP_URL,
            appKey:
              CACHE_APP_KEY,
            timeoutMs:
              CACHE_FETCH_TIMEOUT_MS
          });
        },
        parseRemoteCache(response) {
          if (
            !response?.cachedAt ||
            Number.isNaN(
              Date.parse(
                response.cachedAt
              )
            )
          ) {
            throw new Error(
              'Cached locum rate data are unavailable'
            );
          }

          const sourceRows =
            Array.isArray(
              response?.data?.rows
            )
              ? response.data.rows
              : [];

          const parsedRows =
            sourceRows
              .map(
                (row, sourceIndex) => {
                  if (
                    !Array.isArray(row) ||
                    row.length < 6
                  ) {
                    return null;
                  }

                  return {
                    sourceIndex,
                    date:
                      parseDate(row[0]),
                    hourlyRate:
                      toNumber(row[1]),
                    experience:
                      toNumber(row[2]),
                    rurality:
                      normaliseRurality(
                        row[3]
                      ),
                    state:
                      normaliseState(
                        row[4]
                      ),
                    structure:
                      normaliseStructure(
                        row[5]
                      )
                  };
                }
              )
              .filter(Boolean)
              .filter(
                row =>
                  Number.isFinite(
                    row.hourlyRate
                  ) &&
                  row.hourlyRate >
                    CONFIG.minimumHourlyRate &&
                  row.hourlyRate <=
                    CONFIG.maximumHourlyRate
              )
              .map(row => ({
                ...row,
                experience:
                  Number.isFinite(
                    row.experience
                  )
                    ? row.experience
                    : null
              }));

          if (!parsedRows.length) {
            throw new Error(
              'No valid cached hourly rate rows were found'
            );
          }

          return parsedRows;
        },
        onLiveError(error) {
          console.warn(
            'Live Google Sheets locum rate data could not be used',
            error
          );
        },
        onRemoteCacheError(error) {
          console.warn(
            'Cached locum rate backend data could not be used',
            error
          );
        },
        render(loaded) {
          rows =
            loaded.rows;

          rebuildLocationData();
          createChart();

          tabsController?.set(
            activeView,
            {
              animate: false,
              notify: false
            }
          );

          return chart;
        },
        onReady() {
          responsiveController?.refresh();
        },
        onError() {
          dataSourceIndicator.style.display =
            'none';
        },
        errorMessage:
          '⚠ Live, Backend 1 cached and browser-cached locum rate data are currently unavailable'
      });
    }

    loadDashboard();
  </script>
</body>
</html>
