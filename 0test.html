<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFF Job Ads Data</title>

<link
href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
rel="stylesheet"
>

<script
src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
></script>

<style>
:root {
  --purple: #6600ff;
  --trend-yellow: #f1c232;
  --ink: #151515;
  --muted: #69718a;
  --track: #e8eaf0;
  --error: #b42318;
  --live-red: #e53935;

  --state-nsw: #2db7f5;
  --state-qld: #7a0036;
  --state-act: #7b61ff;
  --state-vic: #2d3a8c;
  --state-sa: #f03a47;
  --state-nt: #c25e00;
  --state-wa: #000000;
  --state-tas: #22a36b;

  --rurality-metro: #3f4851;
  --rurality-nonmetro: #9f6545;

  --corporate: #00b26f;
  --independent: #5a3be7;
  --ophthal: #ffb000;
  --other: #bfc3c7;

  --blue-cone: rgba(74, 86, 255, 0.82);
  --green-cone: rgba(36, 210, 116, 0.78);
  --red-cone: rgba(255, 92, 48, 0.76);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  background: #fff;
  -webkit-tap-highlight-color: transparent;
}

body {
  color: var(--ink);
  background: #fff;
  font-family: 'Lato', sans-serif;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

button,
input {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

#fit {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  width: 100%;
}

#app {
  position: relative;
  width: min(calc(100% - 12px), 520px);
  max-width: 100%;
  min-width: 0;
  margin-inline: auto;
  padding: 7px 6px 0;
  overflow: visible;
  background: #fff;
}

#app.is-loading > :not(.app-loading) {
  visibility: hidden;
}

#app:not(.is-loading) .app-loading {
  display: none;
}

.app-loading {
  position: absolute;
  inset: 0;
  z-index: 100;

  display: flex;
  min-height: 210px;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  background: #fff;
}

.cone-loader {
  position: relative;
  width: 176px;
  height: 78px;
  margin: 0 auto;
  overflow: visible;
  isolation: isolate;
}

.cone {
  position: absolute;
  bottom: 8px;
  width: 58px;
  height: 68px;
  opacity: 0;

  clip-path:
    polygon(
      50% 0%,
      100% 100%,
      0% 100%
    );

  -webkit-clip-path:
    polygon(
      50% 0%,
      100% 100%,
      0% 100%
    );

  mix-blend-mode: normal;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);
  will-change: opacity;
}

.cone.blue {
  left: 33px;
  background: var(--blue-cone);

  animation:
    blueConeCycle
    2.7s
    infinite
    cubic-bezier(
      0.45,
      0,
      0.25,
      1
    );
}

.cone.green {
  left: 69px;
  background: var(--green-cone);

  animation:
    greenConeCycle
    2.7s
    infinite
    cubic-bezier(
      0.45,
      0,
      0.25,
      1
    );
}

.cone.red {
  left: 85px;
  background: var(--red-cone);

  animation:
    redConeCycle
    2.7s
    infinite
    cubic-bezier(
      0.45,
      0,
      0.25,
      1
    );
}

.loader-text {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 400;
  line-height: 1.35;
  text-align: center;

  animation:
    loadingTextPulse
    2.7s
    infinite
    cubic-bezier(
      0.45,
      0,
      0.25,
      1
    );
}

@keyframes blueConeCycle {
  0% {
    opacity: 0;
  }

  12% {
    opacity: 1;
  }

  76% {
    opacity: 1;
  }

  87% {
    opacity: 0;
  }

  100% {
    opacity: 0;
  }
}

@keyframes greenConeCycle {
  0% {
    opacity: 0;
  }

  20% {
    opacity: 0;
  }

  32% {
    opacity: 1;
  }

  76% {
    opacity: 1;
  }

  87% {
    opacity: 0;
  }

  100% {
    opacity: 0;
  }
}

@keyframes redConeCycle {
  0% {
    opacity: 0;
  }

  40% {
    opacity: 0;
  }

  52% {
    opacity: 1;
  }

  76% {
    opacity: 1;
  }

  87% {
    opacity: 0;
  }

  100% {
    opacity: 0;
  }
}

@keyframes loadingTextPulse {
  0% {
    opacity: 0.45;
  }

  52% {
    opacity: 0.78;
  }

  76% {
    opacity: 0.78;
  }

  87% {
    opacity: 0.45;
  }

  100% {
    opacity: 0.45;
  }
}

/* ---------- Tabs and live status ---------- */

.module-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  margin: 0 0 4px;
  border-bottom: 1px solid var(--track);
}

.tab-list {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}

.tab-list::-webkit-scrollbar {
  display: none;
}

.tab-list::after {
  content: '';
  position: absolute;
  right: auto;
  bottom: 0;
  left: 0;
  z-index: 2;

  width:
    var(
      --tab-indicator-width,
      0px
    );

  height: 2px;
  background: var(--purple);
  pointer-events: none;

  transform:
    translate3d(
      var(
        --tab-indicator-x,
        0px
      ),
      0,
      0
    );

  transition:
    transform 420ms
      cubic-bezier(
        0.22,
        1,
        0.36,
        1
      ),
    width 420ms
      cubic-bezier(
        0.22,
        1,
        0.36,
        1
      );

  will-change:
    transform,
    width;
}

.tab-list.is-positioning::after {
  transition: none;
}

.chart-tab {
  flex: 0 0 auto;
  min-height: 29px;
  margin: 0;
  padding: 0 9px 6px;

  color: var(--muted);
  background: #fff;
  border: 0;
  border-bottom: 2px solid transparent;

  font-size: 13px;
  font-weight: 700;
  line-height: 1;

  cursor: pointer;

  transition:
    color 180ms ease,
    border-color 180ms ease;
}

.chart-tab.is-active {
  color: var(--purple);
  border-bottom-color: transparent;
  cursor: default;
}

.chart-tab:focus-visible {
  outline: none;
}

.live-data {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 4px;

  margin: 0 1px 8px 0;

  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.05em;
  line-height: 1;
  white-space: nowrap;
}

.live-data-dot {
  width: 6px;
  height: 6px;
  flex: 0 0 6px;
  border-radius: 50%;
  background: var(--live-red);
}

#status {
  width: 100%;
  margin: 3px 0 0;
  color: var(--error);
  font-size: 12px;
  line-height: 1.35;
  text-align: left;
}

#status:empty {
  display: none;
}

/* ---------- Heading and grouping ---------- */

.chart-heading-row {
  position: relative;
  width: 100%;
  height: 31px;
  min-height: 31px;
  margin: 0;
}

.chart-heading {
  margin: 0;
  padding: 4px 165px 0 0;

  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
  line-height: 22px;
  text-align: left;
  white-space: nowrap;

  will-change: opacity;
}

.group-control {
  position: absolute;
  top: 2px;
  right: 0;
  z-index: 30;
}

.group-button {
  display: grid;
  grid-template-columns:
    max-content
    minmax(70px, 1fr)
    8px;

  align-items: center;
  justify-content: stretch;
  gap: 5px;

  min-width: 154px;
  min-height: 27px;
  padding: 0 6px;

  color: var(--ink);
  background: #fff;
  border: 1px solid var(--track);
  border-radius: 4px;
  box-shadow: none;

  font-size: 11px;
  font-weight: 400;
  line-height: 1;
  text-align: left;
  white-space: nowrap;

  cursor: pointer;

  transition:
    color 140ms ease,
    border-color 140ms ease,
    box-shadow 140ms ease;
}

.group-button > span:first-child {
  text-align: left;
}

.group-button:hover,
.group-button[aria-expanded="true"] {
  color: var(--ink);
  border-color: var(--ink);

  box-shadow:
    inset 0 0 0 1px
    rgba(21, 21, 21, 0.12);
}

.group-button:focus-visible {
  outline: 2px solid rgba(102, 0, 255, 0.22);
  outline-offset: 2px;
}

.group-value {
  display: inline-block;
  min-width: 70px;

  color: var(--purple);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1;
  text-align: right;
  white-space: nowrap;
}

.menu-arrow {
  width: 0;
  height: 0;
  flex: 0 0 auto;

  border-top: 4px solid var(--muted);
  border-right: 4px solid transparent;
  border-left: 4px solid transparent;

  transition:
    transform 140ms ease;
}

.group-button[aria-expanded="true"]
.menu-arrow {
  transform: rotate(180deg);
}

.group-menu {
  position: absolute;
  z-index: 50;
  top: calc(100% + 4px);
  right: 0;

  display: none;
  min-width: 180px;
  padding: 5px 0;

  color: var(--ink);
  background: #fff;
  border: 1px solid var(--track);
  border-radius: 3px;

  box-shadow:
    0 6px 18px
    rgba(21, 21, 21, 0.12);

  text-align: left;
}

.group-menu.is-open {
  display: block;
}

.group-menu-title {
  margin: 0;
  padding: 6px 10px 7px;

  color: var(--muted);
  background: #fff;
  border-bottom: 1px solid var(--track);

  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1.2;
  text-transform: uppercase;

  will-change: opacity;
}

.group-option {
  position: relative;

  display: flex;
  align-items: center;
  gap: 8px;

  min-height: 32px;
  padding: 5px 10px;

  color: var(--ink);
  background: #fff;

  font-size: 12px;
  font-weight: 700;
  line-height: 1.25;

  cursor: pointer;
  user-select: none;
}

.group-option:hover {
  text-decoration: underline;
  text-underline-offset: 2px;
}

.group-option input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.group-option-box {
  position: relative;

  width: 15px;
  height: 15px;
  min-width: 15px;
  max-width: 15px;
  flex: 0 0 15px;

  border: 1px solid var(--muted);
  border-radius: 2px;
  background: #fff;
}

.group-option input:checked
+ .group-option-box {
  border-color: var(--purple);
  background: var(--purple);
}

.group-option input:checked
+ .group-option-box::after {
  content: "";

  position: absolute;
  top: 2px;
  left: 4px;

  width: 4px;
  height: 7px;

  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;

  transform: rotate(45deg);
}

.group-option input:focus-visible
+ .group-option-box {
  outline: 2px solid rgba(102, 0, 255, 0.22);
  outline-offset: 2px;
}

.group-option-all {
  border-bottom: 1px solid var(--track);
}

/* ---------- Count display controls ---------- */

.chart-options-row {
  display: flex;
  width: 100%;
  min-height: 29px;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  padding: 1px 1px 2px;
}

.metric-toggle {
  display: grid;
  grid-template-columns:
    15px
    max-content
    32px;

  flex: 0 0 auto;
  min-height: 27px;
  align-items: center;
  gap: 4px;
  padding: 0 5px;

  color: var(--ink);
  background: #fff;
  border: 1px solid var(--track);
  border-radius: 4px;
  box-shadow: none;

  font-size: 11px;
  font-weight: 400;
  line-height: 1;
  white-space: nowrap;

  cursor: pointer;

  transition:
    border-color 140ms ease,
    background 140ms ease,
    box-shadow 140ms ease,
    opacity 140ms ease;
}

.metric-toggle:hover:not(:disabled) {
  box-shadow:
    inset 0 0 0 1px
    rgba(21, 21, 21, 0.12);
}

.metric-toggle.is-on {
  border-color: var(--purple);
}

.metric-toggle:focus-visible {
  outline: 2px solid rgba(102, 0, 255, 0.22);
  outline-offset: 2px;
}

.metric-toggle:disabled {
  opacity: 0.48;
  cursor: default;
}

.metric-toggle.is-hidden {
  display: none;
}

.metric-toggle-indicator {
  position: relative;

  width: 15px;
  height: 15px;
  min-width: 15px;
  max-width: 15px;
  flex: 0 0 15px;

  border: 1px solid var(--muted);
  border-radius: 2px;
  background: #fff;
}

.metric-toggle.is-on
.metric-toggle-indicator {
  border-color: var(--purple);
  background: var(--purple);
}

.metric-toggle.is-on
.metric-toggle-indicator::after {
  content: "";

  position: absolute;
  top: 2px;
  left: 4px;

  width: 4px;
  height: 7px;

  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;

  transform: rotate(45deg);
}

.metric-toggle-state {
  display: inline-block;
  width: 32px;
  min-width: 32px;

  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.025em;
  line-height: 1;
  text-align: right;
  white-space: nowrap;

  transition:
    color 140ms ease;
}

.metric-toggle.is-on
.metric-toggle-state {
  color: var(--purple);
}

/* ---------- Legend and note ---------- */

.legend-row {
  display: flex;
  width: 100%;
  min-width: 0;
  min-height: 28px;
  align-items: center;
  gap: 8px;
}

.chart-legend {
  display: flex;
  flex: 1 1 auto;
  width: auto;
  min-width: 0;
  min-height: 28px;
  align-items: center;
  gap: 12px;
  padding: 1px 1px 4px;

  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  white-space: nowrap;
}

.chart-legend::-webkit-scrollbar {
  display: none;
}

.legend-item {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 5px;

  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
}

.legend-square {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border: 1px solid transparent;
}

.legend-line {
  width: 17px;
  height: 3px;
  flex: 0 0 17px;
  border-radius: 2px;
}

.chart-footnote {
  min-height: 14px;
  margin: 2px 6px 0;

  color: var(--muted);
  font-size: 8px;
  font-weight: 400;
  line-height: 14px;
  text-align: left;
  white-space: nowrap;

  opacity: 1;
  visibility: visible;

  transition:
    opacity 180ms ease,
    visibility 0s linear;
}

.chart-footnote.is-hidden {
  opacity: 0;
  visibility: hidden;
}

/* ---------- Chart ---------- */

.chart-shell {
  position: relative;
  display: block;

  width: 100%;
  height: 585px;
  min-height: 585px;
  max-height: 585px;

  margin: -2px 0 0;
  overflow: hidden;
  contain: strict;

  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

#jobChart {
  display: block;
  width: 100% !important;
  height: 100% !important;

  touch-action: manipulation;

  -webkit-tap-highlight-color:
    rgba(0, 0, 0, 0) !important;

  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;

  outline: none !important;
}

#jobChart::selection {
  background: transparent;
}

@media (max-width: 430px) {
  #app {
    width: calc(100% - 6px);
    padding: 6px 2px 0;
  }

  .chart-tab {
    padding-right: 7px;
    padding-left: 7px;
    font-size: 12px;
  }

  .live-data {
    margin-right: 3px;
    font-size: 8px;
  }

  .chart-heading-row {
    height: 30px;
    min-height: 30px;
  }

  .chart-heading {
    padding-top: 4px;
    padding-right: 157px;
    font-size: 14px;
    line-height: 21px;
  }

  .group-button {
    min-width: 149px;
    min-height: 26px;
    padding-right: 5px;
    padding-left: 5px;
    font-size: 10px;
  }

  .group-value {
    min-width: 66px;
    font-size: 9px;
  }

  .group-menu {
    min-width: 176px;
  }

  .chart-options-row {
    min-height: 28px;
    gap: 4px;
    padding-right: 1px;
  }

  .metric-toggle {
    min-height: 26px;
    padding-right: 5px;
    padding-left: 5px;
    font-size: 10px;
  }

  .metric-toggle-state {
    font-size: 9px;
  }

  .chart-footnote {
    margin-right: 3px;
    font-size: 7px;
  }

  .chart-shell {
    height: 450px;
    min-height: 450px;
    max-height: 450px;
  }
}

@media (max-width: 350px) {
  .chart-heading {
    padding-right: 147px;
    font-size: 12px;
  }

  .group-button {
    min-width: 141px;
    font-size: 9px;
  }

  .group-value {
    min-width: 60px;
  }

  .group-menu {
    min-width: 170px;
  }

  .metric-toggle {
    font-size: 9px;
  }

  .chart-shell {
    height: 420px;
    min-height: 420px;
    max-height: 420px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }

  .cone.blue,
  .cone.green,
  .cone.red {
    animation: none;
    opacity: 1;
  }

  .loader-text {
    animation: none;
    opacity: 0.72;
  }
}
</style>
</head>

<body>
<div id="fit">
<main
id="app"
class="is-loading"
aria-busy="true"
>
<div
id="loadingState"
class="app-loading"
role="status"
aria-label="Loading job ad data"
>
<div class="cone-loader">
<div
class="cone blue"
aria-hidden="true"
></div>

<div
class="cone green"
aria-hidden="true"
></div>

<div
class="cone red"
aria-hidden="true"
></div>
</div>

<div class="loader-text">
Loading job ad data...
</div>
</div>

<div class="module-top">
<div
class="tab-list"
role="tablist"
aria-label="Job data views"
>
<button
class="chart-tab is-active"
type="button"
role="tab"
data-view="count"
aria-selected="true"
>
Job ad count
</button>

<button
class="chart-tab"
type="button"
role="tab"
data-view="pay"
aria-selected="false"
>
Advertised pay
</button>
</div>

<div
class="live-data"
aria-label="Live data"
>
<span
class="live-data-dot"
aria-hidden="true"
></span>

<span>LIVE data</span>
</div>
</div>

<div
id="status"
role="alert"
aria-live="polite"
></div>

<div class="chart-heading-row">
<h2
id="chartHeading"
class="chart-heading"
>
FTE-adjusted job ads over time
</h2>

<div class="group-control">
<button
id="groupButton"
class="group-button"
type="button"
aria-haspopup="true"
aria-expanded="false"
aria-controls="groupMenu"
>
<span>Group by:</span>

<span
id="groupValue"
class="group-value"
>
None
</span>

<span
class="menu-arrow"
aria-hidden="true"
></span>
</button>

<div
id="groupMenu"
class="group-menu"
role="group"
aria-label="Group chart data"
>
<p
id="groupMenuTitle"
class="group-menu-title"
>
Group job ad count
</p>

<label class="group-option group-option-all">
<input
class="group-option-input"
type="radio"
name="chart-group-mode"
value="none"
checked
>

<span
class="group-option-box"
aria-hidden="true"
></span>

<span>None</span>
</label>

<label class="group-option">
<input
class="group-option-input"
type="radio"
name="chart-group-mode"
value="state"
>

<span
class="group-option-box"
aria-hidden="true"
></span>

<span>State</span>
</label>

<label class="group-option">
<input
class="group-option-input"
type="radio"
name="chart-group-mode"
value="rurality"
>

function cleanText(
  value
) {

    value ??

/************************************************************
 * DATE AND SALARY PARSING
 ************************************************************/

function parseDateValue(
  value
) {
  if (
    value instanceof
      Date &&
    !Number.isNaN(
      value.getTime()
    )
  ) {
    return new Date(
      Date.UTC(
        value.getFullYear(),
        value.getMonth(),
        value.getDate()
      )
    );
  }


  if (
    typeof value ===
      'number' &&
    Number.isFinite(
      value
    ) &&
    value >
      20000 &&
    value <
      80000
  ) {
    return new Date(
      Date.UTC(
        1899,
        11,
        30
      ) +
      value *
      DAY_MS
    );
  }


  const text =
    cleanText(
      value
    );


  if (
    !text
  ) {
    return null;
  }


  let match =
    text.match(
      /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/i
    );


  if (
    match
  ) {
    return new Date(
      Date.UTC(
        Number(
          match[1]
        ),

        Number(
          match[2]
        ),

        Number(
          match[3]
        )
      )
    );
  }


  match =
    text.match(
      /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
    );


  if (
    match
  ) {
    let year =
      Number(
        match[3]
      );


    if (
      year <
      100
    ) {
      year +=
        2000;
    }


    return new Date(
      Date.UTC(
        year,

        Number(
          match[2]
        ) -
        1,

        Number(
          match[1]
        )
      )
    );
  }


  match =
    text.match(
      /^(\d{4})-(\d{1,2})-(\d{1,2})$/
    );


  if (
    match
  ) {
    return new Date(
      Date.UTC(
        Number(
          match[1]
        ),

        Number(
          match[2]
        ) -
        1,

        Number(
          match[3]
        )
      )
    );
  }


  const parsed =
    new Date(
      text
    );


  return Number.isNaN(
    parsed.getTime()
  )
    ? null
    : new Date(
        Date.UTC(
          parsed.getFullYear(),
          parsed.getMonth(),
          parsed.getDate()
        )
      );
}


function parseDateCell(
  cell
) {
  return (

}


function parseSalaryValue(
  value
) {
  if (
    typeof value ===
      'number' &&
    Number.isFinite(
      value
    )
  ) {
    return value >
      0
        ? value
        : NaN;
  }


  const text =
    cleanText(
      value
    );


  if (
    !text ||
    normaliseText(
      text
    ) ===
      'xxx'
  ) {
    return NaN;
  }


  const values =
    [];


  const expression =
    /(?:\$|aud\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k)?/gi;


  let match;


  while (
    (
      match =
        expression.exec(
          text
        )
    )
  ) {
    let number =
      Number(
        match[1]
          .replace(
            /,/g,
            ''
          )
      );


    if (
      match[2]
    ) {
      number *=
        1000;
    }


    if (
      Number.isFinite(
        number
      ) &&
      number >
        0
    ) {
      values.push(
        number
      );
    }
  }


  if (
    !values.length
  ) {
    return NaN;
  }


  return (
    values.reduce(
      (
        total,
        number
      ) =>
        total +
        number,

      0
    ) /
    values.length
  );
}


/*
 * Blank, invalid or xxx values are treated as five days.
 *
 * A displayed range such as 3–5 is averaged to four days.
 * Values above five are capped at five because five days is
 * defined as 1.0 FTE for this graph.
 */
function parseEstimatedDaysPerWeek(
  value
) {
  if (
    typeof value ===
      'number' &&
    Number.isFinite(
      value
    )
  ) {
    return clamp(
      value,
      0,
      5
    );
  }


  const text =
    cleanText(
      value
    );


  if (
    !text ||
    normaliseText(
      text
    ) ===
      'xxx'
  ) {
    return 5;
  }


  const values =
    Array.from(
      text.matchAll(
        /\d+(?:\.\d+)?/g
      )
    )
      .map(
        match =>
          Number(
            match[0]
          )
      )
      .filter(
        number =>
          Number.isFinite(
            number
          ) &&
          number >=
            0 &&
          number <=
            7
      );


  if (
    !values.length
  ) {
    return 5;
  }


  const estimate =
    values.reduce(
      (
        total,
        number
      ) =>
        total +
        number,

      0
    ) /
    values.length;


  return clamp(
    estimate,
    0,
    5
  );
}

    return 'Independent';

  if (

      'ophthal'

    text.includes(
      'opthal'
    )
  ) {
    return 'Ophthal';
  }


  return 'Other';
}


/************************************************************
 * COLOUR HELPERS
 ************************************************************/

function parseColour(
  value,
  fallback =
    '#777777'
) {
  const text =
    String(
      value ??
      ''
    ).trim();


  const shortHex =
    text.match(
      /^#([0-9a-f]{3})$/i
    );


  const fullHex =
    text.match(
      /^#([0-9a-f]{6})$/i
    );


  const rgb =
    text.match(
      /^rgba?\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)/i
    );


  if (
    shortHex
  ) {
    const digits =
      shortHex[1];


    return {
      red:
        parseInt(
          digits[0] +
          digits[0],
          16
        ),

      green:
        parseInt(
          digits[1] +
          digits[1],
          16
        ),

      blue:
        parseInt(
          digits[2] +
          digits[2],
          16
        )
    };
  }


  if (
    fullHex
  ) {
    const digits =
      fullHex[1];


    return {
      red:
        parseInt(
          digits.slice(
            0,
            2
          ),
          16
        ),

      green:
        parseInt(
          digits.slice(
            2,
            4
          ),
          16
        ),

      blue:
        parseInt(
          digits.slice(
            4,
            6
          ),
          16
        )
    };
  }


  if (
    rgb
  ) {
    return {
      red:
        clamp(
          Number(
            rgb[1]
          ),
          0,
          255
        ),

      green:
        clamp(
          Number(
            rgb[2]
          ),
          0,
          255
        ),

      blue:
        clamp(
          Number(
            rgb[3]
          ),
          0,
          255
        )
    };
  }


  if (
    text !==
    fallback
  ) {
    return parseColour(
      fallback,
      '#777777'
    );
  }


  return {
    red:
      119,

    green:
      119,

    blue:
      119
  };
}


function rgba(
  colour,
  opacity
) {
  const parsed =
    parseColour(
      colour
    );


  const safeOpacity =
    clamp(
      Number(
        opacity
      ) ||
      0,
      0,
      1
    );


  return (
    `rgba(${Math.round(parsed.red)}, ` +
    `${Math.round(parsed.green)}, ` +
    `${Math.round(parsed.blue)}, ` +
    `${safeOpacity})`
  );
}


function rgbToHsl({
  red,
  green,
  blue
}) {
  const r =
    red /
    255;


  const g =
    green /
    255;


  const b =
    blue /
    255;


  const maximum =
    Math.max(
      r,
      g,
      b
    );


  const minimum =
    Math.min(
      r,
      g,
      b
    );


  const lightness =
    (
      maximum +
      minimum
    ) /
    2;


  if (
    maximum ===
    minimum
  ) {
    return {
      hue:
        0,

      saturation:
        0,

      lightness
    };
  }


  const difference =
    maximum -
    minimum;


  const saturation =
    lightness >
      0.5
      ? difference /
        (
          2 -
          maximum -
          minimum
        )
      : difference /
        (
          maximum +
          minimum
        );


  let hue;


  if (
    maximum ===
    r
  ) {
    hue =
      (
        g -
        b
      ) /
      difference +
      (
        g <
        b
          ? 6
          : 0
      );
  } else if (
    maximum ===
    g
  ) {
    hue =
      (
        b -
        r
      ) /
      difference +
      2;
  } else {
    hue =
      (
        r -
        g
      ) /
      difference +
      4;
  }


  return {
    hue:
      hue *
      60,

    saturation,

    lightness
  };
}


function hslToRgb({
  hue,
  saturation,
  lightness
}) {
  const normalisedHue =
    (
      (
        hue %
        360
      ) +
      360
    ) %
    360;


  const chroma =
    (
      1 -
      Math.abs(
        2 *
        lightness -
        1
      )
    ) *
    saturation;


  const hueSection =
    normalisedHue /
    60;


  const secondary =
    chroma *
    (
      1 -
      Math.abs(
        hueSection %
        2 -
        1
      )
    );


  let red =
    0;


  let green =
    0;


  let blue =
    0;


  if (
    hueSection <
    1
  ) {
    red =
      chroma;

    green =
      secondary;
  } else if (
    hueSection <
    2
  ) {
    red =
      secondary;

    green =
      chroma;
  } else if (
    hueSection <
    3
  ) {
    green =
      chroma;

    blue =
      secondary;
  } else if (
    hueSection <
    4
  ) {
    green =
      secondary;

    blue =
      chroma;
  } else if (
    hueSection <
    5
  ) {
    red =
      secondary;

    blue =
      chroma;
  } else {
    red =
      chroma;

    blue =
      secondary;
  }


  const match =
    lightness -
    chroma /
    2;


  return {
    red:
      Math.round(
        (
          red +
          match
        ) *
        255
      ),

    green:
      Math.round(
        (
          green +
          match
        ) *
        255
      ),

    blue:
      Math.round(
        (
          blue +
          match
        ) *
        255
      )
  };
}


/*
 * Interpolate via HSL instead of ordinary RGB. This keeps the
 * transition saturated rather than passing through a grey-looking
 * midpoint when changing between unrelated colours.
 */
function interpolateRgbWithoutGrey(
  firstColour,
  secondColour,
  progress
) {
  const firstRgb =
    parseColour(
      firstColour,
      secondColour
    );


  const secondRgb =
    parseColour(
      secondColour,
      firstColour
    );


  const firstHsl =
    rgbToHsl(
      firstRgb
    );


  const secondHsl =
    rgbToHsl(
      secondRgb
    );


  if (
    firstHsl.saturation <
      0.02 &&
    secondHsl.saturation >=
      0.02
  ) {
    firstHsl.hue =
      secondHsl.hue;
  }


  if (
    secondHsl.saturation <
      0.02 &&
    firstHsl.saturation >=
      0.02
  ) {
    secondHsl.hue =
      firstHsl.hue;
  }


  let hueDifference =
    secondHsl.hue -
    firstHsl.hue;


  if (
    hueDifference >
    180
  ) {
    hueDifference -=
      360;
  }


  if (
    hueDifference <
    -180
  ) {
    hueDifference +=
      360;
  }


  return hslToRgb({
    hue:
      firstHsl.hue +
      hueDifference *
      progress,

    saturation:
      firstHsl.saturation +
      (
        secondHsl.saturation -
        firstHsl.saturation
      ) *
      progress,

    lightness:
      firstHsl.lightness +
      (
        secondHsl.lightness -
        firstHsl.lightness
      ) *
      progress
  });
}


function interpolateColour(
  firstColour,
  secondColour,
  progress
) {
  const colour =
    interpolateRgbWithoutGrey(
      firstColour,
      secondColour,
      progress
    );


  return (
    `rgb(${colour.red}, ` +
    `${colour.green}, ` +
    `${colour.blue})`
  );
}


function interpolateRgba(
  firstColour,
  secondColour,
  firstOpacity,
  secondOpacity,
  progress
) {
  const colour =
    interpolateRgbWithoutGrey(
      firstColour,
      secondColour,
      progress
    );


  const opacity =
    firstOpacity +
    (
      secondOpacity -
      firstOpacity
    ) *
    progress;


  return (
    `rgba(${colour.red}, ` +
    `${colour.green}, ` +
    `${colour.blue}, ` +
    `${opacity})`
  );
}

 ************************************************************/

function easeInOutCubic(
  progress
) {
  return progress <
    0.5
      ? 4 *
        progress *
        progress *
        progress
      : 1 -
        Math.pow(
          -2 *
          progress +
          2,
          3
        ) /
        2;
}


function formatAnimatedAxisValue(
  value
) {
  if (
    !Number.isFinite(
      value
    )
  ) {
    return '';
  }


  const displayView =
    axisTransition.progress <
      0.5
      ? axisTransition.fromView
      : axisTransition.toView;


  /*
   * The % unit is already supplied in the proportion axis title.
   */
  if (
    displayView ===
    'proportion'
  ) {
    return String(
      Math.round(
        value
      )
    );
  }


  if (
    Math.abs(
      value
    ) >=
    1000
  ) {
    return (
      `${Math.round(value / 1000)}k`
    );
  }


  return String(
    Math.round(
      value
    )
  );
}

          0
      }
    ).format(
      Math.round(

      )
    );


  return value <

      ? `−$${absoluteValue}/year`
      : `$${absoluteValue}/year`;

function formatPValue(

) {
  if (
    !Number.isFinite(
      value
    )
  ) {

  }


  if (

    0.0001
  ) {
    return 'p < 0.0001';
  }


  if (
    value <
    0.001
  ) {
    return 'p < 0.001';
  }


  if (
    value <
    0.01
  ) {
    return 'p < 0.01';
  }


  if (
    value <
    0.05
  ) {
    return 'p < 0.05';
  }


  return (
    `p = ${value.toFixed(2)}`
  );
}


/************************************************************
 * MONTH HELPERS
 ************************************************************/

function startOfUtcMonth(
  date
) {
  return new Date(
    Date.UTC(
      date.getUTCFullYear(),
      date.getUTCMonth(),
      1
    )
  );
}


function addUtcMonths(
  date,
  months
) {
  return new Date(
    Date.UTC(
      date.getUTCFullYear(),
      date.getUTCMonth() +
        months,
      1
    )
  );
}


function buildMonthTicks(
  minimum,
  maximumDataMonth
) {
  const ticks =
    [];


  let month =
    startOfUtcMonth(
      new Date(
        minimum
      )
    );


  const finalMonth =
    startOfUtcMonth(
      new Date(
        maximumDataMonth
      )
    );


  while (
    month <=
    finalMonth
  ) {
    ticks.push({
      value:
        month.getTime()
    });


    month =
      addUtcMonths(
        month,
        1
      );
  }


  return ticks;
}


function buildMonthSequence() {
  return buildMonthTicks(
    axisBounds.xMin,
    axisBounds.lastDataMonth
  ).map(
    tick =>
      tick.value
  );
}


function formatQuarterTick(
  timestamp
) {
  const date =
    new Date(
      timestamp
    );


  const month =
    date.getUTCMonth();


  return [
    0,
    3,
    6,
    9
  ].includes(
    month
  )
    ? `${month + 1}/${date.getUTCFullYear()}`
    : '';
}


function isQuarterTick(
  value
) {
  const month =
    new Date(
      Number(
        value
      )
    ).getUTCMonth();


  return [
    0,
    3,
    6,
    9
  ].includes(
    month
  );
}

/************************************************************
 * GOOGLE SHEETS JSONP
 ************************************************************/

function loadSheetRows() {
  return new Promise(
    (
      resolve,
      reject
    ) => {
      const callbackName =
        (
          'pffJobDataCallback_' +
          Date.now() +
          '_' +
          Math.floor(
            Math.random() *
            1000000
          )
        );


      const script =
        document.createElement(
          'script'
        );


      let settled =
        false;


      const timeout =
        window.setTimeout(
          () => {
            finish(
              new Error(
                'Could not load Google Sheet data'
              )
            );
          },
          CONFIG.fetchTimeoutMs
        );


      function cleanup() {
        window.clearTimeout(
          timeout
        );


        try {
          delete window[
            callbackName
          ];
        } catch (
          error
        ) {
          window[
            callbackName
          ] =
            undefined;
        }


        if (
          script.parentNode
        ) {
          script.parentNode
            .removeChild(
              script
            );
        }
      }


      function finish(
        error,
        response
      ) {
        if (
          settled
        ) {
          return;
        }


        settled =
          true;


        cleanup();


        if (
          error
        ) {
          reject(
            error
          );

          return;
        }


        if (
          !response ||
          response.status ===
            'error'
        ) {
          reject(
            new Error(
              response
                ?.errors
                ?.[0]
                ?.detailed_message ||
              'Could not load Google Sheet data'
            )
          );

          return;
        }


        resolve(
          response
            ?.table
            ?.rows ||
          []
        );
      }


      window[
        callbackName
      ] =
        response =>
          finish(
            null,
            response
          );


      script.onerror =
        () =>
          finish(
            new Error(
              'Network error loading Google Sheet data'
            )
          );


      const params =
        new URLSearchParams({
          gid:
            CONFIG.sheetGid,

          sheet:
            CONFIG.sheetName,

          range:
            CONFIG.range,

          headers:
            '0',

          tq:
            'select *',

          tqx:
            `responseHandler:${callbackName}`,

          _:
            String(
              Date.now()
            )
        });


      script.src =
        (
          `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?` +
          params.toString()
        );


      document.body
        .appendChild(
          script
        );
    }
  );
}


/************************************************************
 * NORMALISE ROWS
 ************************************************************/

function normaliseRows(
  sourceRows
) {
  const result =
    [];


  sourceRows.forEach(
    sourceRow => {
      const cells =
        sourceRow?.c ||
        [];


      const repeatFlag =
        normaliseText(
          getCellText(
            cells[
              CONFIG
                .columns
                .repeatFlag
            ]
          )
        );


      if (
        repeatFlag !==
        'no'
      ) {
        return;
      }


      const date =
        parseDateCell(
          cells[
            CONFIG
              .columns
              .date
          ]
        );


      if (
        !date
      ) {
        return;
      }


      const salaryCell =
        cells[
          CONFIG
            .columns
            .salary
        ];


      const salary =
        parseSalaryValue(
          salaryCell?.v ??
          salaryCell?.f ??
          ''
        );


      const employer =
        getCellText(
          cells[
            CONFIG
              .columns
              .employer
          ]
        );


      const suburb =
        getCellText(
          cells[
            CONFIG
              .columns
              .suburb
          ]
        );


      const stateText =
        getCellText(
          cells[
            CONFIG
              .columns
              .state
          ]
        );


      const employerTypeText =
        getCellText(
          cells[
            CONFIG
              .columns
              .employerType
          ]
        );


      const ruralityText =
        getCellText(
          cells[
            CONFIG
              .columns
              .rurality
          ]
        );


      const fteDays =
        parseEstimatedDaysPerWeek(
          cells[
            CONFIG
              .columns
              .fteDays
          ]?.v ??
          cells[
            CONFIG
              .columns
              .fteDays
          ]?.f ??
          ''
        );


      result.push({
        x:
          date.getTime(),

        salary,

        fteDays,

        /*
         * Five advertised days equals one FTE.
         */
        fteWeight:
          fteDays /
          5,

        employer,

        suburb,

        stateText,

        state:
          getStateGroup(
            stateText
          ),

        rurality:
          getRuralityGroup(
            ruralityText
          ),

        employerType:
          getEmployerTypeGroup(
            employerTypeText
          )
      });
    }
  );


  return result.sort(
    (
      first,
      second
    ) =>
      first.x -
      second.x
  );
}

function calculateAxisBounds(
  data
) {
  const xValues =
    data.map(
      row =>
        row.x
    );


  const minimumDate =
    new Date(
      Math.min(
        ...xValues
      )
    );


  const maximumDate =
    new Date(
      Math.max(
        ...xValues
      )
    );


  const firstMonth =
    startOfUtcMonth(
      minimumDate
    );


  const lastDataMonth =
    startOfUtcMonth(
      maximumDate
    );


  const monthAfterLast =
    addUtcMonths(
      lastDataMonth,
      1
    );


  return {
    xMin:
      firstMonth.getTime(),

    xMax:
      monthAfterLast.getTime(),

    firstDataTime:
      Math.min(
        ...xValues
      ),

    lastDataMonth:
      lastDataMonth.getTime()
  };
}


function niceStep(
  value
) {
  if (
    !Number.isFinite(
      value
    ) ||
    value <=
      0
  ) {
    return 5;
  }


  const exponent =
    Math.floor(
      Math.log10(
        value
      )
    );


  const magnitude =
    Math.pow(
      10,
      exponent
    );


  const fraction =
    value /
    magnitude;


  if (
    fraction <=
    1
  ) {
    return (
      1 *
      magnitude
    );
  }


  if (
    fraction <=
    2
  ) {
    return (
      2 *
      magnitude
    );
  }


  if (
    fraction <=
    5
  ) {
    return (
      5 *
      magnitude
    );
  }


  return (
    10 *
    magnitude
  );
}


function getRowCountWeight(
  row,

) {
  if (
    !useFte
  ) {

    : 1;
}


function calculateCountAxis(
  useFte
) {
  const overallSeries =
    buildMonthlyCountSeries(
      rows,
      false,
      useFte
    );


  const trendSeries =
    buildTrailingAverageSeries(
      rows,
      false,
      useFte
    );


  const values = [
    ...overallSeries.map(
      point =>
        point.value
    ),

    ...trendSeries
      .map(
        point =>
          point.value
      )
      .filter(
        Number.isFinite
      )
  ];


  const observedMaximum =
    Math.max(
      1,
      ...values
    );


  const targetMaximum =
    observedMaximum *
    1.08;


  const majorStep =
    Math.max(
      1,
      niceStep(
        targetMaximum /
        6
      )
    );


  return {
    minimum:
      0,

    maximum:
      majorStep *
      6,

    majorStep,

    minorStep:
      majorStep /
      2
  };
}

/************************************************************
 * REGRESSION CALCULATIONS
 ************************************************************/

function logGamma(
  value
) {
  const coefficients = [
    676.5203681218851,
    -1259.1392167224028,
    771.3234287776531,
    -176.6150291621406,
    12.507343278686905,
    -0.13857109526572012,
    9.984369578019572e-6,
    1.5056327351493116e-7
  ];


  if (
    value <
    0.5
  ) {
    return (
      Math.log(
        Math.PI
      ) -
      Math.log(
        Math.sin(
          Math.PI *
          value
        )
      ) -
      logGamma(
        1 -
        value
      )
    );
  }


  const shifted =
    value -
    1;


  let series =
    0.9999999999998099;


  coefficients.forEach(
    (
      coefficient,
      index
    ) => {
      series +=
        coefficient /
        (
          shifted +
          index +
          1
        );
    }
  );


  const total =
    shifted +
    coefficients.length -
    0.5;


  return (
    0.5 *
    Math.log(
      2 *
      Math.PI
    ) +
    (
      shifted +
      0.5
    ) *
    Math.log(
      total
    ) -
    total +
    Math.log(
      series
    )
  );
}


function betaContinuedFraction(
  a,
  b,
  x
) {
  const maximumIterations =
    200;


  const epsilon =
    3e-14;


  const minimumValue =
    1e-300;


  const qab =
    a +
    b;


  const qap =
    a +
    1;


  const qam =
    a -
    1;


  let c =
    1;


  let d =
    1 -
    qab *
    x /
    qap;


  if (
    Math.abs(
      d
    ) <
    minimumValue
  ) {
    d =
      minimumValue;
  }


  d =
    1 /
    d;


  let result =
    d;


  for (
    let iteration =
      1;
    iteration <=
      maximumIterations;
    iteration++
  ) {
    const doubledIteration =
      2 *
      iteration;


    let coefficient =
      iteration *
      (
        b -
        iteration
      ) *
      x /
      (
        (
          qam +
          doubledIteration
        ) *
        (
          a +
          doubledIteration
        )
      );


    d =
      1 +
      coefficient *
      d;


    if (
      Math.abs(
        d
      ) <
      minimumValue
    ) {
      d =
        minimumValue;
    }


    c =
      1 +
      coefficient /
      c;


    if (
      Math.abs(
        c
      ) <
      minimumValue
    ) {
      c =
        minimumValue;
    }


    d =
      1 /
      d;


    result *=
      d *
      c;


    coefficient =
      -(
        a +
        iteration
      ) *
      (
        qab +
        iteration
      ) *
      x /
      (
        (
          a +
          doubledIteration
        ) *
        (
          qap +
          doubledIteration
        )
      );


    d =
      1 +
      coefficient *
      d;


    if (
      Math.abs(
        d
      ) <
      minimumValue
    ) {
      d =
        minimumValue;
    }


    c =
      1 +
      coefficient /
      c;


    if (
      Math.abs(
        c
      ) <
      minimumValue
    ) {
      c =
        minimumValue;
    }


    d =
      1 /
      d;


    const change =
      d *
      c;


    result *=
      change;


    if (
      Math.abs(
        change -
        1
      ) <
      epsilon
    ) {
      break;
    }
  }


  return result;
}


function regularizedIncompleteBeta(
  x,
  a,
  b
) {
  if (
    x <=
    0
  ) {
    return 0;
  }


  if (
    x >=
    1
  ) {
    return 1;
  }


  const betaTerm =
    Math.exp(
      logGamma(
        a +
        b
      ) -
      logGamma(
        a
      ) -
      logGamma(
        b
      ) +
      a *
      Math.log(
        x
      ) +
      b *
      Math.log1p(
        -x
      )
    );


  if (
    x <
    (
      a +
      1
    ) /
    (
      a +
      b +
      2
    )
  ) {
    return (
      betaTerm *
      betaContinuedFraction(
        a,
        b,
        x
      ) /
      a
    );
  }


  return (
    1 -
    betaTerm *
    betaContinuedFraction(
      b,
      a,
      1 -
      x
    ) /
    b
  );
}


function calculateTwoSidedTTestPValue(
  tStatistic,
  degreesOfFreedom
) {
  if (
    !Number.isFinite(
      tStatistic
    ) ||
    !Number.isFinite(
      degreesOfFreedom
    ) ||
    degreesOfFreedom <=
      0
  ) {
    return NaN;
  }


  const absoluteT =
    Math.abs(
      tStatistic
    );


  const betaInput =
    degreesOfFreedom /
    (
      degreesOfFreedom +
      absoluteT *
      absoluteT
    );


  return Math.max(
    0,
    Math.min(
      1,
      regularizedIncompleteBeta(
        betaInput,
        degreesOfFreedom /
          2,
        0.5
      )
    )
  );
}


function calculateRegression(
  data
) {
  if (
    data.length <
    2
  ) {
    return null;
  }


  const meanX =
    data.reduce(
      (
        total,
        row
      ) =>
        total +
        row.x,
      0
    ) /
    data.length;


  const meanY =
    data.reduce(
      (
        total,
        row
      ) =>
        total +
        row.salary,
      0
    ) /
    data.length;


  let numerator =
    0;


  let denominator =
    0;


  data.forEach(
    row => {
      const centredXYears =
        (
          row.x -
          meanX
        ) /
        YEAR_MS;


      numerator +=
        centredXYears *
        (
          row.salary -
          meanY
        );


      denominator +=
        centredXYears *
        centredXYears;
    }
  );


  if (
    denominator ===
    0
  ) {
    return null;
  }


  const slopePerYear =
    numerator /
    denominator;


  const minimumX =
    Math.min(
      ...data.map(
        row =>
          row.x
      )
    );


  const maximumX =
    Math.max(
      ...data.map(
        row =>
          row.x
      )
    );


  const predict =
    timestamp =>
      meanY +
      slopePerYear *
      (
        (
          timestamp -
          meanX
        ) /
        YEAR_MS
      );


  let pValue =
    NaN;


  if (
    data.length >
    2
  ) {
    const residualSumOfSquares =
      data.reduce(
        (
          total,
          row
        ) => {
          const residual =
            row.salary -
            predict(
              row.x
            );


          return (
            total +
            residual *
            residual
          );
        },
        0
      );


    const degreesOfFreedom =
      data.length -
      2;


    const residualVariance =
      residualSumOfSquares /
      degreesOfFreedom;


    const slopeStandardError =
      Math.sqrt(
        residualVariance /
        denominator
      );


    if (
      slopeStandardError ===
      0
    ) {
      pValue =
        slopePerYear ===
          0
          ? 1
          : 0;
    } else if (
      Number.isFinite(
        slopeStandardError
      )
    ) {
      pValue =
        calculateTwoSidedTTestPValue(
          slopePerYear /
          slopeStandardError,

          degreesOfFreedom
        );
    }
  }


  return {
    minimumX,

    maximumX,

    meanX,

    meanY,

    slopePerYear,

    pValue
  };
}


function buildRegressionLinePoints(
  regression
) {
  const sampleCount =
    Math.max(
      2,
      CONFIG.regressionSamples
    );


  const span =
    regression.maximumX -
    regression.minimumX;


  return Array.from(
    {
      length:
        sampleCount
    },

    (
      _,
      index
    ) => {
      const proportion =
        index /
        (
          sampleCount -
          1
        );


      const x =
        regression.minimumX +
        span *
        proportion;


      const salary =
        regression.meanY +
        regression.slopePerYear *
        (
          (
            x -
            regression.meanX
          ) /
          YEAR_MS
        );


      return {
        x,

        y:
          normaliseSalaryValue(
            salary
          ),

        value:
          salary
      };
    }
  );
}


/************************************************************
 * GROUPING HELPERS
 ************************************************************/

function getGroupColour(
  mode,
  label
) {
  if (
    mode ===
    'state'
  ) {
    return (
      STATE_COLOURS[
        label
      ]
    );
  }


  if (
    mode ===
    'rurality'
  ) {
    return (
      RURALITY_COLOURS[
        label
      ]
    );
  }


  if (
    mode ===
    'employerType'
  ) {
    return (
      EMPLOYER_TYPE_COLOURS[
        label
      ]
    );
  }


  return '#6600ff';
}


function getRowGroupLabel(
  row,
  mode
) {
  return mode ===
    'none'
      ? null
      : (
          row[
            mode
          ] ||
          null
        );
}


function getBaseRows(
  view
) {
  return view ===
    'pay'
      ? salaryRows
      : rows;
}


function getUngroupedLabel(
  view
) {
  if (
    view ===
    'pay'
  ) {
    return 'Advertised salary';
  }


  if (
    view ===
    'proportion'
  ) {
    return 'All job ads';
  }


  return 'Job ads';
}


function getGroupedRows(
  view,
  mode,
  includeSmallGroups =
    false
) {
  if (
    mode ===
    'none'
  ) {
    return [
      {
        label:
          getUngroupedLabel(
            view
          ),

        colour:
          '#f1c232',

        rows:
          getBaseRows(
            view
          )
      }
    ];
  }


  const grouped =
    new Map();


  getBaseRows(
    view
  ).forEach(
    row => {
      const label =
        getRowGroupLabel(
          row,
          mode
        );


      if (
        !label
      ) {
        return;
      }


      if (
        !grouped.has(
          label
        )
      ) {
        grouped.set(
          label,
          []
        );
      }


      grouped
        .get(
          label
        )
        .push(
          row
        );
    }
  );


  return GROUP_ORDER[
    mode
  ]
    .filter(
      label => {
        if (
          !grouped.has(
            label
          )
        ) {
          return false;
        }


        return (
          includeSmallGroups ||
          grouped
            .get(
              label
            )
            .length >=
            CONFIG.minimumGroupSize
        );
      }
    )
    .map(
      label => ({
        label,

        colour:
          getGroupColour(
            mode,
            label
          ),

        rows:
          grouped.get(
            label
          )
      })
    );
}


function getExcludedGroupCount(
  view,
  mode
) {
  if (
    mode ===
    'none'
  ) {
    return 0;
  }


  return getGroupedRows(
    view,
    mode,
    true
  )
    .filter(
      group =>
        group.rows.length <
        CONFIG.minimumGroupSize
    )
    .length;
}


/************************************************************
 * COUNT AND PROPORTION SERIES
 ************************************************************/

function getMonthTimestamp(
  timestamp
) {
  return startOfUtcMonth(
    new Date(
      timestamp
    )
  ).getTime();
}


function buildMonthlyCountSeries(
  data,
  shouldNormalise =
    true,
  useFte =
    fteAdjusted
) {
  const counts =
    new Map();


  buildMonthSequence()
    .forEach(
      month => {
        counts.set(
          month,
          0
        );
      }
    );


  data.forEach(
    row => {
      const month =
        getMonthTimestamp(
          row.x
        );


      if (
        counts.has(
          month
        )
      ) {
        counts.set(
          month,

          counts.get(
            month
          ) +
          getRowCountWeight(
            row,
            useFte
          )
        );
      }
    }
  );


  return Array.from(
    counts.entries()
  ).map(
    ([
      x,
      value
    ]) => ({
      x,

      y:
        shouldNormalise
          ? normaliseCountValue(
              value,
              useFte
            )
          : value,

      value,

      monthLabel:
        formatTooltipMonth(
          x
        )
    })
  );
}


function buildTrailingAverageSeries(
  data,
  shouldNormalise =
    true,
  useFte =
    fteAdjusted
) {
  const now =
    Date.now();


  return buildMonthSequence()
    .map(
      monthTimestamp => {
        const monthStart =
          new Date(
            monthTimestamp
          );


        const monthEnd =
          addUtcMonths(
            monthStart,
            1
          ).getTime();


        const effectiveEnd =
          Math.min(
            monthEnd,
            now
          );


        const windowStart =
          effectiveEnd -
          TRAILING_WINDOW_MS;


        if (
          windowStart <
          axisBounds.firstDataTime
        ) {
          return {
            x:
              monthTimestamp,

            y:
              null,

            value:
              null,

            quarterLabel:
              formatQuarterRange(
                monthTimestamp
              )
          };
        }


        const windowCount =
          data.reduce(
            (
              total,
              row
            ) =>
              total +
              (
                row.x >=
                  windowStart &&
                row.x <
                  effectiveEnd
                  ? getRowCountWeight(
                      row,
                      useFte
                    )
                  : 0
              ),

            0
          );


        const value =
          windowCount *
          AVERAGE_MONTH_DAYS /
          (
            CONFIG.trailingWeeks *
            7
          );


        return {
          x:
            monthTimestamp,

          y:
            shouldNormalise
              ? normaliseCountValue(
                  value,
                  useFte
                )
              : value,

          value,

          quarterLabel:
            formatQuarterRange(
              monthTimestamp
            )
        };
      }
    );
}


function buildMonthlyProportionSeries(
  groupRows,
  denominatorRows,
  shouldNormalise =
    true,
  useFte =
    fteAdjusted
) {
  const numeratorCounts =
    new Map();


  const denominatorCounts =
    new Map();


  buildMonthSequence()
    .forEach(
      month => {
        numeratorCounts.set(
          month,
          0
        );


        denominatorCounts.set(
          month,
          0
        );
      }
    );


  groupRows.forEach(
    row => {
      const month =
        getMonthTimestamp(
          row.x
        );


      if (
        numeratorCounts.has(
          month
        )
      ) {
        numeratorCounts.set(
          month,

          numeratorCounts.get(
            month
          ) +
          getRowCountWeight(
            row,
            useFte
          )
        );
      }
    }
  );


  denominatorRows.forEach(
    row => {
      const month =
        getMonthTimestamp(
          row.x
        );


      if (
        denominatorCounts.has(
          month
        )
      ) {
        denominatorCounts.set(
          month,

          denominatorCounts.get(
            month
          ) +
          getRowCountWeight(
            row,
            useFte
          )
        );
      }
    }
  );


  return buildMonthSequence()
    .map(
      x => {
        const numerator =
          numeratorCounts.get(
            x
          ) ||
          0;


        const denominator =
          denominatorCounts.get(
            x
          ) ||
          0;


        const value =
          denominator >
            0
            ? numerator /
              denominator *
              100
            : null;


        return {
          x,

          y:
            Number.isFinite(
              value
            )
              ? (
                  shouldNormalise
                    ? normaliseProportionValue(
                        value
                      )
                    : value
                )
              : null,

          value,

          monthLabel:
            formatTooltipMonth(
              x
            )
        };
      }
    );
}


function buildTrailingProportionSeries(
  groupRows,
  denominatorRows,
  shouldNormalise =
    true,
  useFte =

) {
  const now =

  return buildMonthSequence()

        const monthStart =

        const monthEnd =

        const numerator =

                  ? getRowCountWeight(

          );


        const denominator =

        const value =

function createEmptyDescriptor(

) {

    kind,

    role:

      '',

      '',

    colour:
      '#6600ff',

    pointColours:

    pointOpacities:
      [],

      {}
  };
}


function buildTargetDescriptors(
  view,
  mode
) {
  const pointTargets =
    Array.from(
      {
        length:
          CONFIG.maxGroups
      },

      () =>
        createEmptyDescriptor(
          'point'
        )
    );


  const lineTargets =
    Array.from(
      {
        length:
          CONFIG.maxGroups
      },

      () =>
        createEmptyDescriptor(
          'line'
        )
    );


  const groups =
    getGroupedRows(
      view,
      mode
    );


  /*
   * Advertised pay keeps one persistent point dataset.
   * Changing grouping only changes point colour/visibility.
   */
  if (
    view ===
    'pay'
  ) {
    const eligibleLabels =
      mode ===
        'none'
        ? null
        : new Set(
            groups.map(
              group =>
                group.label
            )
          );


    const salaryData =
      salaryRows.map(
        row => ({
          x:
            row.x,

          y:
            normaliseSalaryValue(
              row.salary
            ),

          value:
            row.salary,

          employer:
            row.employer,

          suburb:
            row.suburb,

          stateText:
            row.stateText
        })
      );


    const pointColours =
      salaryRows.map(
        row => {
          if (
            mode ===
            'none'
          ) {
            return '#6600ff';
          }


          const label =
            getRowGroupLabel(
              row,
              mode
            );


          return (
            label &&
            eligibleLabels.has(
              label
            )
          )
            ? getGroupColour(
                mode,
                label
              )
            : '#6600ff';
        }
      );


    const pointOpacities =
      salaryRows.map(
        row => {
          if (
            mode ===
            'none'
          ) {
            return (
              CONFIG.pointOpacity
            );
          }


          const label =
            getRowGroupLabel(
              row,
              mode
            );


          return (
            label &&
            eligibleLabels.has(
              label
            )
          )
            ? CONFIG.pointOpacity
            : 0;
        }
      );


    pointTargets[0] = {
      kind:
        'point',

      role:
        'salaryPoints',

      label:
        'Advertised salary points',

      groupLabel:
        'Advertised salary',

      colour:
        '#6600ff',

      opacity:
        CONFIG.pointOpacity,

      lineWidth:
        0,

      data:
        salaryData,

      pointColours,

      pointOpacities,

      metadata:
        {}
    };


    groups.forEach(
      (
        group,
        index
      ) => {
        if (
          index >=
          CONFIG.maxGroups
        ) {
          return;
        }


        const regression =
          calculateRegression(
            group.rows
          );


        if (
          !regression
        ) {
          return;
        }


        lineTargets[
          index
        ] = {
          kind:
            'line',

          role:
            'regression',

          label:
            `${group.label} linear regression`,

          groupLabel:
            group.label,

          colour:
            mode ===
              'none'
              ? '#f1c232'
              : group.colour,

          opacity:
            1,

          lineWidth:
            CONFIG.regressionWidth,

          data:
            buildRegressionLinePoints(
              regression
            ),

          pointColours:
            [],

          pointOpacities:
            [],

          metadata: {
            slopePerYear:
              regression.slopePerYear,

            pValue:
              regression.pValue
          }
        };
      }
    );


    return [
      ...pointTargets,
      ...lineTargets
    ];
  }


  /*
   * Proportions use the total of all eligible displayed groups
   * in that month or trailing window as the denominator.
   */
  if (
    view ===
    'proportion'
  ) {
    const denominatorRows =
      mode ===
        'none'
        ? rows
        : groups.flatMap(
            group =>
              group.rows
          );


    groups.forEach(
      (
        group,
        index
      ) => {
        if (
          index >=
          CONFIG.maxGroups
        ) {
          return;
        }


        const pointColour =
          mode ===
            'none'
            ? '#6600ff'
            : group.colour;


        const lineColour =
          mode ===
            'none'
            ? '#f1c232'
            : group.colour;


        pointTargets[
          index
        ] = {
          kind:
            'point',

          role:
            'proportionPoints',

          label:
            `${group.label} monthly job ad proportion`,

          groupLabel:
            group.label,

          colour:
            pointColour,

          opacity:
            CONFIG.pointOpacity,

          lineWidth:
            0,

          data:
            buildMonthlyProportionSeries(
              group.rows,
              denominatorRows
            ),

          pointColours:
            [],

          pointOpacities:
            [],

          metadata: {
            fteAdjusted
          }
        };


        lineTargets[
          index
        ] = {
          kind:
            'line',

          role:
            'proportionTrend',

          label:
            `${group.label} 13-week trailing proportion`,

          groupLabel:
            group.label,

          colour:
            lineColour,

          opacity:
            1,

          lineWidth:
            CONFIG.trendWidth,

          data:
            buildTrailingProportionSeries(
              group.rows,
              denominatorRows
            ),

          pointColours:
            [],

          pointOpacities:
            [],

          metadata: {
            fteAdjusted
          }
        };
      }
    );


    return [
      ...pointTargets,
      ...lineTargets
    ];
  }


  groups.forEach(
    (
      group,
      index
    ) => {
      if (
        index >=
        CONFIG.maxGroups
      ) {
        return;
      }


      const pointColour =
        mode ===
          'none'
          ? '#6600ff'
          : group.colour;


      const lineColour =
        mode ===
          'none'
          ? '#f1c232'
          : group.colour;


      pointTargets[
        index
      ] = {
        kind:
          'point',

        role:
          'countPoints',

        label:
          `${group.label} monthly job ads`,

        groupLabel:
          group.label,

        colour:
          pointColour,

        opacity:
          CONFIG.pointOpacity,

        lineWidth:
          0,

        data:
          buildMonthlyCountSeries(
            group.rows
          ),

        pointColours:
          [],

        pointOpacities:
          [],

        metadata: {
          fteAdjusted
        }
      };


      lineTargets[
        index
      ] = {
        kind:
          'line',

        role:
          'countTrend',

        label:
          `${group.label} 13-week trailing average`,

        groupLabel:
          group.label,

        colour:
          lineColour,

        opacity:
          1,

        lineWidth:
          CONFIG.trendWidth,

        data:
          buildTrailingAverageSeries(
            group.rows
          ),

        pointColours:
          [],

        pointOpacities:
          [],

        metadata: {
          fteAdjusted
        }
      };
    }
  );


  return [
    ...pointTargets,
    ...lineTargets
  ];
}
