    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;

      --error: #b42318;
      --live-red: #e53935;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
    }

      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    #app {
      width: min(calc(100% - 16px), 520px);
      max-width: 100%;
      min-width: 0;
      margin-inline: auto;
      padding: 10px 8px 12px;
      background: #fff;
    }

    /* ---------- Tab and live status ---------- */

    .module-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 7px;
      border-bottom: 1px solid var(--track);
    }

    .tab-list {
      display: flex;
      align-items: flex-end;
      min-width: 0;
    }

    .chart-tab {
      min-height: 31px;
      margin: 0;
      padding: 0 10px 7px;
      color: var(--purple);
      background: #fff;
      border: 0;
      border-bottom: 2px solid var(--purple);
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: default;
    }

    .live-data {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      width: 100%;
      margin: 4px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ---------- Chart heading ---------- */

    .chart-heading-row {
      position: relative;
      width: 100%;
      min-height: 36px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 6px 112px 6px 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      text-align: left;
    }

    /*
     * Absolute positioning means the button never changes the
     * heading or chart position when it becomes visible.
     */
    .reaggregate-button {
      position: absolute;
      top: 1px;
      right: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;

      min-height: 31px;
      padding: 0 7px;

      color: var(--muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;

      font-size: 11px;
      font-weight: 400;
      white-space: nowrap;

      cursor: pointer;

      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        visibility 0s linear;
    }

    .reaggregate-button:hover {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow:
        inset 0 0 0 1px
        rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: none;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--purple);
      font-size: 15px;
      line-height: 1;
    }

    /* ---------- Chart ---------- */

    .chart-shell {
      position: relative;
      width: 100%;
      height: 480px;
      margin: 0;
    }

    #promoterChart {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 8px);
        padding: 8px 3px 10px;
      }

      .chart-tab {
        padding-right: 8px;
        padding-left: 8px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {

      }

      .reaggregate-button {

        padding-left: 6px;
        font-size: 10px;
      }

      }

      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }

    function normaliseEmployerName(
      value
    ) {
      return String(
        value || ''
      )
        .toLowerCase()
        .normalize('NFKD')
        .replace(
          /[’‘]/g,
          "'"
        )
        .replace(
          /&/g,
          ' and '
        )
        .replace(
          /[^a-z0-9]+/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }


    const EMPLOYER_ALIAS_MAP =
      new Map();

      employer => {
        [
          employer.label,
          employer.fullName,
          ...employer.aliases
        ].forEach(
          alias => {
            EMPLOYER_ALIAS_MAP.set(
              normaliseEmployerName(
                alias
              ),
              employer
            );
          }
        );
      }
    );


    function getEmployerAppearance(
      employerName
    ) {
      const original =
        String(
          employerName || ''
        ).trim();

      const normalised =
        normaliseEmployerName(
          original
        );

      const knownEmployer =
        EMPLOYER_ALIAS_MAP.get(
          normalised
        );

      if (
        knownEmployer
      ) {
        return knownEmployer;
      }

      const fallbackKey =
        normalised ||
        `unknown-${original}`;

      if (
        original.length <=
        10
      ) {
        return {
          key:
            fallbackKey,

          label:
            original || '—',

          fullName:
            original ||
            'Unknown employer',

          colour:
            '#777777'
        };
      }

      const initials =
        original
          .split(/\s+/)
          .filter(Boolean)
          .map(
            word =>
              word.charAt(0)
          )
          .join('')
          .slice(0, 6);

      return {
        key:
          fallbackKey,

        label:
          initials ||
          original.slice(
            0,
            10
          ),

        fullName:
          original,

        colour:
          '#777777'
      };
    }

    function formatNumber(
      value
    ) {
      return new Intl.NumberFormat(

    function formatStatistic(
      value
    ) {
      if (
        !Number.isFinite(
          value
        )
      ) {
        return '—';
      }

      if (
        Number.isInteger(
          value
        )
      ) {
        return String(
          value
        );
      }

      return value
        .toFixed(1)
        .replace(
          /\.0$/,
          ''
        );
    }


    function getCellValue(

    ) {
      if (!cell) {

      }

      return (

    }


    function toNumber(
      value
    ) {
      const number =
        typeof value ===
          'number'
          ? value
          : parseFloat(
              String(
                value
              ).replace(
                /[^\d.-]/g,
                ''
              )
            );

      return Number.isFinite(
        number
      )
        ? number
        : NaN;
    }


    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.max(
        minimum,
        Math.min(
          maximum,
          value
        )
      );
    }


    function hexToRgba(
      hex,
      opacity
    ) {
      const cleaned =
        String(
          hex
        )
          .replace(
            '#',
            ''
          )
          .trim();

      if (
        !/^[0-9a-f]{6}$/i.test(
          cleaned
        )
      ) {
        return (
          `rgba(119, 119, 119, ${opacity})`
        );
      }

      const red =
        parseInt(
          cleaned.slice(
            0,
            2
          ),
          16
        );

      const green =
        parseInt(
          cleaned.slice(
            2,
            4
          ),
          16
        );

      const blue =
        parseInt(
          cleaned.slice(
            4,
            6
          ),
          16
        );

      return (
        `rgba(${red}, ${green}, ${blue}, ${opacity})`
      );
    }


    function getBaseBubbleRadius(
      respondents
    ) {
      const calculated =
        BUBBLE_OFFSET +
        (
          Math.pow(
            respondents,
            BUBBLE_EXPONENT
          ) *
          BUBBLE_MULTIPLIER
        );

      return clamp(
        calculated,
        MIN_RADIUS,
        MAX_RADIUS
      );
    }


    function getDisplayedBubbleRadius(
      chart,
      raw
    ) {
      const widthScale =
        clamp(
          chart.width / 520,
          0.72,
          1
        );

      return (
        raw.baseRadius *
        widthScale
      );
    }


    function percentile(
      sortedValues,
      probability
    ) {
      if (
        !sortedValues.length
      ) {
        return NaN;
      }

      if (
        sortedValues.length ===
        1
      ) {
        return sortedValues[0];
      }

      const index =
        (
          sortedValues.length -
          1
        ) *
        probability;

      const lowerIndex =
        Math.floor(
          index
        );

      const upperIndex =
        Math.ceil(
          index
        );

      if (
        lowerIndex ===
        upperIndex
      ) {
        return sortedValues[
          lowerIndex
        ];
      }

      const fraction =
        index -
        lowerIndex;

      return (
        sortedValues[
          lowerIndex
        ] +
        (
          sortedValues[
            upperIndex
          ] -
          sortedValues[
            lowerIndex
          ]
        ) *
        fraction
      );
    }


    function calculateScoreStatistics(
      scores
    ) {
      const sorted =
        scores
          .filter(
            Number.isFinite
          )
          .slice()
          .sort(
            (
              first,
              second
            ) =>
              first -
              second
          );

      return {
        count:
          sorted.length,

        median:
          percentile(
            sorted,
            0.50
          ),

        q1:
          percentile(
            sorted,
            0.25
          ),

        q3:
          percentile(
            sorted,
            0.75
          )
      };
    }

    function loadSheetQuery(
      query
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            'pffPromoterCallback_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() *
              1000000
            );

          const script =
            document.createElement(
              'script'
            );

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'Could not load Google Sheet data'
                  )
                );
              },
              20000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response => {
            cleanup();

            if (
              !response ||
              response.status ===
                'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          };


          script.onerror =
            () => {
              cleanup();

              reject(
                new Error(
                  'Network error loading Google Sheet data'
                )
              );
            };


          const params =
            new URLSearchParams({
              sheet:
                SHEET_NAME,

              headers:
                '1',

              tq:
                query,

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(
                  Date.now()
                )
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
            params.toString();


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    /************************************************************
     * NORMALISE AGGREGATE DATA
     ************************************************************/

    function normaliseAggregateRows(
      rows
    ) {
      const employers =
        new Map();


      rows.forEach(
        row => {
          const employerName =
            String(
              getCellValue(
                row?.c?.[0]
              ) || ''
            ).trim();

          const score =
            toNumber(
              getCellValue(
                row?.c?.[1]
              )
            );

          const respondents =
            toNumber(
              getCellValue(
                row?.c?.[2]
              )
            );


          if (
            !employerName ||
            !Number.isFinite(
              score
            ) ||
            score < 0 ||
            score > 10 ||
            !Number.isFinite(
              respondents
            ) ||
            respondents <= 0
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          employers.set(
            appearance.key,
            {
              canonicalKey:
                appearance.key,

              sourceName:
                employerName,

              score,

              respondents,

              label:
                appearance.label,

              fullName:
                appearance.fullName,

              colour:
                appearance.colour
            }
          );
        }
      );


      return [
        ...employers.values()
      ];
    }

          const employerName =
            String(
              getCellValue(
                row?.c?.[0]
              ) || ''
            ).trim();

          const score =
            toNumber(
              getCellValue(
                row?.c?.[1]
              )
            );


          if (
            !employerName ||
            !Number.isFinite(
              score
            ) ||
            score < 0 ||
            score > 10
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          if (
            !employerMap.has(
              appearance.key
            )
          ) {
            employerMap.set(
              appearance.key,
              {
                canonicalKey:
                  appearance.key,

                label:
                  appearance.label,

                fullName:
                  appearance.fullName,

                colour:
                  appearance.colour,

                scores:
                  []
              }
            );
          }


          employerMap
            .get(
              appearance.key
            )
            .scores
            .push(
              score
            );
        }
      );


      employerMap.forEach(
        employer => {
          employer.statistics =
            calculateScoreStatistics(
              employer.scores
            );
        }
      );


      return employerMap;
    }


    /************************************************************
     * FIXED AGGREGATE POSITIONS
     *
     * These positions are calculated once. Splitting one employer
     * never recalculates or moves any other aggregate bubble.
     ************************************************************/

    function buildAggregatePositions(
      items
    ) {
      const groups =
        new Map();


      items.forEach(
        item => {
          const scoreKey =
            String(
              Number(
                item.score
              )
            );

          if (
            !groups.has(
              scoreKey
            )
          ) {
            groups.set(
              scoreKey,
              []
            );
          }

          groups
            .get(
              scoreKey
            )
            .push(
              item
            );
        }
      );


      const maximumGroupSize =
        Math.max(
          1,
          ...[
            ...groups.values()
          ].map(
            group =>
              group.length
          )
        );


      const leftPosition =
        12;

      const rightPosition =
        91;


      const sharedPositions =
        maximumGroupSize ===
          1
          ? [
              leftPosition
            ]
          : Array.from(
              {
                length:
                  maximumGroupSize
              },
              (
                _,
                index
              ) =>
                leftPosition +
                (
                  index /
                  (
                    maximumGroupSize -
                    1
                  )
                ) *
                (
                  rightPosition -
                  leftPosition
                )
            );


      const positions =
        new Map();


      groups.forEach(
        group => {
          group
            .slice()
            .sort(
              (
                first,
                second
              ) =>
                second.respondents -
                  first.respondents ||
                first.fullName.localeCompare(
                  second.fullName
                )
            )
            .forEach(
              (
                item,
                index
              ) => {
                positions.set(
                  item.canonicalKey,
                  sharedPositions[
                    index
                  ]
                );
              }
            );
        }
      );


      return positions;
    }


    function buildAggregatePoints(
      items
    ) {
      return items
        .map(
          item => ({
            kind:
              'aggregate',

            x:
              aggregatePositions.get(
                item.canonicalKey
              ) ??
              12,

            y:
              item.score,

            baseRadius:
              getBaseBubbleRadius(
                item.respondents
              ),

            canonicalKey:
              item.canonicalKey,

            shortLabel:
              item.label,

            fullName:
              item.fullName,

            respondents:
              item.respondents,

            colour:
              item.colour,

            canSplit:
              Boolean(
                rawEmployerData
                  .get(
                    item.canonicalKey
                  )
                  ?.scores
                  ?.length
              )
          })
        )
        .sort(
          (
            first,
            second
          ) => {
            /*
             * Higher scores are drawn first.
             * Lower scores are drawn later and appear on top.
             */
            if (
              first.y !==
              second.y
            ) {
              return (
                second.y -
                first.y
              );
            }

            /*
             * At the same score, smaller bubbles appear on top.
             */
            return (
              second.baseRadius -
              first.baseRadius
            );
          }
        );
    }


    /************************************************************
     * RAW SCORE POSITIONS
     ************************************************************/

    function buildRawEmployerPoints(
      aggregateItem,
      rawEmployer
    ) {
      const aggregateX =
        aggregatePositions.get(
          aggregateItem.canonicalKey
        ) ??
        12;

      const scoreGroups =
        new Map();


      rawEmployer.scores.forEach(
        score => {
          const scoreKey =
            String(
              score
            );

          if (
            !scoreGroups.has(
              scoreKey
            )
          ) {
            scoreGroups.set(
              scoreKey,
              []
            );
          }

          scoreGroups
            .get(
              scoreKey
            )
            .push(
              score
            );
        }
      );


      const points =
        [];


      scoreGroups.forEach(
        (
          scores,
          scoreKey
        ) => {
          const score =
            Number(
              scoreKey
            );

          const pointCount =
            scores.length;

          const span =
            Math.min(
              24,
              Math.max(
                0,
                (
                  pointCount -
                  1
                ) *
                2.5
              )
            );


          let startX =
            aggregateX -
            span / 2;


          startX =
            clamp(
              startX,
              4,
              96 -
              span
            );


          scores.forEach(
            (
              _,
              index
            ) => {
              const x =
                pointCount ===
                  1
                  ? aggregateX
                  : startX +
                    (
                      index /
                      (
                        pointCount -
                        1
                      )
                    ) *
                    span;


              points.push({
                kind:
                  'raw',

                x:
                  clamp(
                    x,
                    4,
                    96
                  ),

                y:
                  score,

                baseRadius:
                  RAW_POINT_RADIUS,

                canonicalKey:
                  aggregateItem.canonicalKey,

                fullName:
                  aggregateItem.fullName,

                colour:
                  aggregateItem.colour,

                rawScore:
                  score,

                scoreCount:
                  rawEmployer.statistics.count,

                median:
                  rawEmployer.statistics.median,

                q1:
                  rawEmployer.statistics.q1,

                q3:
                  rawEmployer.statistics.q3
              });
            }
          );
        }
      );


      return points;
    }


    function buildRawPoints() {
      const points =
        [];


      splitEmployers.forEach(
        employerKey => {
          const aggregateItem =
            aggregateItems.find(
              item =>
                item.canonicalKey ===
                employerKey
            );

          const rawEmployer =
            rawEmployerData.get(
              employerKey
            );


          if (
            !aggregateItem ||
            !rawEmployer
              ?.scores
              ?.length
          ) {
            return;
          }


          points.push(
            ...buildRawEmployerPoints(
              aggregateItem,
              rawEmployer
            )
          );
        }
      );


      /*
       * Higher raw scores are drawn first so lower raw scores
       * remain on top where they overlap.
       */
      return points.sort(
        (
          first,
          second
        ) =>
          second.y -
          first.y
      );
    }


    /************************************************************
     * BUTTON VISIBILITY
     ************************************************************/

    function updateReaggregateButton() {
      const shouldShow =
        splitEmployers.size >
        0;


      reaggregateButton
        .classList
        .toggle(
          'is-hidden',
          !shouldShow
        );


      reaggregateButton.setAttribute(
        'aria-hidden',
        String(
          !shouldShow
        )
      );


      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;
    }


    /************************************************************
     * BUBBLE LABELS
     ************************************************************/

    const bubbleLabelPlugin = {
      id:
        'bubbleLabelPlugin',

      afterDatasetsDraw(
        chart
      ) {
        const context =
          chart.ctx;

        const dataset =
          chart.data
            .datasets[0];

        const metadata =
          chart.getDatasetMeta(
            0
          );


        metadata.data.forEach(
          (
            element,
            index
          ) => {
            const raw =
              dataset.data[
                index
              ];


            if (
              raw?.kind !==
                'aggregate' ||
              !raw.shortLabel ||
              splitEmployers.has(
                raw.canonicalKey
              )
            ) {
              return;
            }


            const radius =
              getDisplayedBubbleRadius(
                chart,
                raw
              );


            const fontSize =
              clamp(
                radius *
                  0.43,
                9,
                15
              );


            context.save();

            context.textAlign =
              'center';

            context.textBaseline =
              'middle';

            context.font =
              `700 ${fontSize}px Lato, sans-serif`;

            context.lineJoin =
              'round';

            context.lineWidth =
              Math.max(
                1.4,
                fontSize *
                  0.12
              );

            context.strokeStyle =
              'rgba(255, 255, 255, 0.94)';

            context.fillStyle =
              '#151515';


            context.strokeText(
              raw.shortLabel,
              element.x,
              element.y
            );

            context.fillText(
              raw.shortLabel,
              element.x,
              element.y
            );


            context.restore();
          }
        );
      }
    };


    /************************************************************
     * UPDATE CHART WITHOUT MOVING OTHER AGGREGATE BUBBLES
     ************************************************************/

    function updateChartPoints() {
      if (
        !promoterChart
      ) {
        return;
      }


      /*
       * Dataset 0 remains in its original fixed order.
       * Its point radii are controlled by splitEmployers.
       *
       * Dataset 1 is always drawn afterwards, ensuring every raw
       * score bubble appears above every aggregate bubble.
       */
      promoterChart
        .data
        .datasets[1]
        .data =
          buildRawPoints();


      /*
       * No animation is used for this update, so aggregate bubbles
       * other than the selected one do not shift or animate.
       */
      promoterChart.update(
        'none'
      );


      updateReaggregateButton();
    }


    /************************************************************
     * CREATE CHART
     ************************************************************/

    function createChart() {
      const canvas =
        document.getElementById(
          'promoterChart'
        );

      const context =
        canvas.getContext(
          '2d'
        );


      promoterChart =
        new Chart(
          context,
          {
            type:
              'scatter',

            data: {
              datasets: [
                {
                  label:
                    'Aggregated employer scores',

                  data:
                    aggregatePoints,

                  parsing:
                    false,

                  showLine:
                    false,

                  clip:
                    false,


                  pointRadius:
                    chartContext => {
                      const raw =
                        chartContext.raw;

                      if (
                        splitEmployers.has(
                          raw.canonicalKey
                        )
                      ) {
                        return 0;
                      }

                      return getDisplayedBubbleRadius(
                        chartContext.chart,
                        raw
                      );
                    },


                  pointHoverRadius:
                    chartContext => {
                      const raw =
                        chartContext.raw;

                      if (
                        splitEmployers.has(
                          raw.canonicalKey
                        )
                      ) {
                        return 0;
                      }

                      return (
                        getDisplayedBubbleRadius(
                          chartContext.chart,
                          raw
                        ) +
                        1.5
                      );
                    },


                  pointHitRadius:
                    chartContext =>
                      splitEmployers.has(
                        chartContext
                          .raw
                          .canonicalKey
                      )
                        ? 0
                        : 5,


                  pointBackgroundColor:
                    chartContext =>
                      hexToRgba(
                        chartContext
                          .raw
                          ?.colour ||
                          '#777777',

                        BUBBLE_OPACITY
                      ),


                  pointHoverBackgroundColor:
                    chartContext =>
                      hexToRgba(
                        chartContext
                          .raw
                          ?.colour ||
                          '#777777',

                        BUBBLE_HOVER_OPACITY
                      ),


                  pointBorderWidth:
                    0,

                  pointHoverBorderWidth:
                    0
                },

                {
                  label:
                    'Raw employer scores',

                  data:
                    [],

                  parsing:
                    false,

                  showLine:
                    false,

                  clip:
                    false,


                  /*
                   * This dataset is declared second and therefore
                   * always renders over every aggregate bubble.
                   */
                  pointRadius:
                    chartContext =>
                      getDisplayedBubbleRadius(
                        chartContext.chart,
                        chartContext.raw
                      ),


                  pointHoverRadius:
                    chartContext =>
                      getDisplayedBubbleRadius(
                        chartContext.chart,
                        chartContext.raw
                      ) +
                      2,


                  pointHitRadius:
                    5,


                  pointBackgroundColor:
                    chartContext =>
                      hexToRgba(
                        chartContext
                          .raw
                          ?.colour ||
                          '#777777',

                        BUBBLE_OPACITY
                      ),


                  pointHoverBackgroundColor:
                    chartContext =>
                      hexToRgba(
                        chartContext
                          .raw
                          ?.colour ||
                          '#777777',

                        BUBBLE_HOVER_OPACITY
                      ),


                  pointBorderWidth:
                    0,

                  pointHoverBorderWidth:
                    0
                }
              ]
            },


            options: {
              responsive:
                true,

              maintainAspectRatio:
                false,


              animation: {
                duration:
                  560,

                easing:
                  'easeOutCubic'
              },


              interaction: {
                mode:
                  'nearest',

                intersect:
                  true
              },


              layout: {
                padding: {
                  top:
                    4,

                  right:
                    5,

                  bottom:
                    2,

                  left:
                    0
                }
              },


              onHover(
                event,
                elements,
                chart
              ) {
                if (
                  !elements.length
                ) {
                  chart.canvas.style.cursor =
                    'default';

                  return;
                }


                const selectedElement =
                  elements[0];

                const point =
                  chart
                    .data
                    .datasets[
                      selectedElement
                        .datasetIndex
                    ]
                    .data[
                      selectedElement
                        .index
                    ];


                chart.canvas.style.cursor =
                  selectedElement
                    .datasetIndex ===
                      0 &&
                  point?.kind ===
                    'aggregate' &&
                  point.canSplit &&
                  !splitEmployers.has(
                    point.canonicalKey
                  )
                    ? 'pointer'
                    : 'default';
              },


              onClick(
                event,
                elements,
                chart
              ) {
                if (
                  !elements.length
                ) {
                  return;
                }


                const selectedElement =
                  elements[0];


                /*
                 * Only aggregate bubbles in dataset 0 are clickable.
                 * Individual raw bubbles in dataset 1 are not.
                 */
                if (
                  selectedElement
                    .datasetIndex !==
                  0
                ) {
                  return;
                }


                const point =
                  chart
                    .data
                    .datasets[0]
                    .data[
                      selectedElement
                        .index
                    ];


                if (
                  point?.kind !==
                    'aggregate' ||
                  !point.canSplit ||
                  splitEmployers.has(
                    point.canonicalKey
                  )
                ) {
                  return;
                }


                splitEmployers.add(
                  point.canonicalKey
                );


                updateChartPoints();
              },


              plugins: {
                legend: {
                  display:
                    false
                },


                tooltip: {
                  displayColors:
                    false,

                  backgroundColor:
                    '#ffffff',

                  titleColor:
                    '#151515',

                  bodyColor:
                    '#69718a',

                  borderColor:
                    '#e8eaf0',

                  borderWidth:
                    1,

                  cornerRadius:
                    4,

                  padding:
                    9,

                  titleFont: {
                    family:
                      'Lato',

                    size:
                      12,

                    weight:
                      '700'
                  },

                  bodyFont: {
                    family:
                      'Lato',

                    size:
                      11,

                    weight:
                      '400'
                  },


                  callbacks: {
                    title(
                      tooltipItems
                    ) {
                      return (
                        tooltipItems
                          ?.[0]
                          ?.raw
                          ?.fullName ||
                        ''
                      );
                    },


                    label(
                      tooltipItem
                    ) {
                      const raw =
                        tooltipItem.raw;


                      if (
                        raw.kind ===
                        'raw'
                      ) {
                        return [
                          `Raw score: ${formatStatistic(raw.rawScore)}`,
                          `Scores: ${formatNumber(raw.scoreCount)}`,
                          (
                            'Median [IQR]: ' +
                            `${formatStatistic(raw.median)} ` +
                            `[${formatStatistic(raw.q1)}–${formatStatistic(raw.q3)}]`
                          )
                        ];
                      }


                      return [
                        `Median score: ${formatStatistic(raw.y)}`,
                        `Respondents: ${formatNumber(raw.respondents)}`,
                        raw.canSplit
                          ? 'Click to show raw scores'
                          : ''
                      ].filter(
                        Boolean
                      );
                    }
                  }
                }
              },


              scales: {
                x: {
                  type:
                    'linear',

                  min:
                    0,

                  max:
                    100,

                  display:
                    false,

                  grid: {
                    display:
                      false
                  },

                  border: {
                    display:
                      false
                  }
                },


                y: {
                  min:
                    0,

                  max:
                    10,


                  /*
                   * Chart.js now reserves sufficient space for the
                   * Score title and all text labels, preventing
                   * clipping and overlap.
                   */
                  title: {
                    display:
                      true,

                    text:
                      'Score',

                    color:
                      '#151515',

                    font: {
                      family:
                        'Lato',

                      size:
                        13,

                      weight:
                        '700'
                    },

                    padding: {
                      bottom:
                        7
                    }
                  },


                  ticks: {
                    stepSize:
                      1,

                    color:
                      '#151515',

                    padding:
                      7,

                    autoSkip:
                      false,

                    maxRotation:
                      0,

                    minRotation:
                      0,

                    font: {
                      family:
                        'Lato',

                      size:
                        12,

                      weight:
                        '400'
                    },


                    callback(
                      value
                    ) {
                      const number =
                        Number(
                          value
                        );


                      if (
                        number === 0
                      ) {
                        return '0  not at all';
                      }


                      if (
                        number === 5
                      ) {
                        return '5  unsure';
                      }


                      if (
                        number === 10
                      ) {
                        return '10  extremely';
                      }


                      return String(
                        number
                      );
                    }
                  },


                  grid: {
                    color:
                      'rgba(105, 113, 138, 0.075)',

                    lineWidth:
                      1,

                    drawTicks:
                      true,

                    tickLength:
                      7,

                    tickColor:
                      '#151515',

                    tickWidth:
                      1.2
                  },


                  border: {
                    display:
                      true,

                    color:
                      '#151515',

                    width:
                      1.1
                  }
                }
              }
            },


            plugins: [
              bubbleLabelPlugin
            ]
          }
        );
    }


    /************************************************************
     * RE-AGGREGATE
     ************************************************************/

    reaggregateButton.addEventListener(
      'click',
      () => {
        splitEmployers.clear();

        updateChartPoints();
      }
    );


    /************************************************************
     * LOAD ONCE
     ************************************************************/

    async function loadPromoterChart() {
      try {
        setStatus();


        const [
          aggregateRows,
          rawRows
        ] =
          await Promise.all([
            loadSheetQuery(
              AGGREGATE_QUERY
            ),

            loadSheetQuery(
              RAW_QUERY
            )
          ]);


        aggregateItems =
          normaliseAggregateRows(
            aggregateRows
          );


        rawEmployerData =
          normaliseRawRows(
            rawRows
          );


        if (
          !aggregateItems.length
        ) {
          throw new Error(
            'No valid aggregate rows found in columns AM to AO'
          );
        }


        aggregatePositions =
          buildAggregatePositions(
            aggregateItems
          );


        /*
         * The fixed aggregate array is created once and never
         * reordered during splitting.
         */
        aggregatePoints =
          buildAggregatePoints(
            aggregateItems
          );


        createChart();

        updateReaggregateButton();

        setStatus();

      } catch (
        error
      ) {
        console.error(
          error
        );


        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load chart'
          ).replace(
            /\.+$/,
            ''
          )
        );
      }
    }


    loadPromoterChart();
  </script>
