<!DOCTYPE html>
<html lang="en">
  <head>

    <script>
      /* --- Visual scale toggle (set true/false) --- */
      const ENABLE_SCALE = false;

      let scaleTimer = null;

      function scheduleApplyScale() {
        if (!ENABLE_SCALE) return;
        clearTimeout(scaleTimer);

        scaleTimer = setTimeout(() => {
          requestAnimationFrame(applyScale);
        }, 80);
      }

      function applyScale() {
        const app = document.getElementById('app');
        const fit = document.getElementById('fit');
        if (!app || !fit) return;

        if (!ENABLE_SCALE) {
          app.style.transform = 'none';
          fit.style.minHeight = '100vh';
          fit.style.width = '100%';
          return;
        }

        const prevTransform = app.style.transform;
        app.style.transform = 'none';

        let sizer = document.getElementById('appSizer');
        if (!sizer) {
          sizer = app.cloneNode(true);
          sizer.id = 'appSizer';
          document.body.appendChild(sizer);
        } else {
          sizer.innerHTML = app.innerHTML;
        }

        Object.assign(sizer.style, {
          position: 'absolute',
          left: '-99999px',
          top: '0',
          transform: 'none',
          visibility: 'hidden',
          pointerEvents: 'none',
          display: 'block',
          width: getComputedStyle(app).width
        });

        const sResults = sizer.querySelector('#results');
        const sOut = sizer.querySelector('#out');
        if (sResults) sResults.style.display = 'block';
        if (sOut) sOut.textContent = 'Calculating…';

        const NAT_W = sizer.offsetWidth || app.offsetWidth || 1;
        const NAT_H = sizer.offsetHeight || app.offsetHeight || 1;

        app.style.transform = prevTransform;

        const vw =
          document.documentElement.clientWidth ||
          window.innerWidth;

        const vh = window.innerHeight;

        const scale = Math.min(
          vw / NAT_W,
          vh / NAT_H,
          1
        );

        app.style.transform = `scale(${scale})`;
        fit.style.width = '100%';

        fit.style.minHeight =
          Math.max(
            Math.ceil(NAT_H * scale),
            vh
          ) + 'px';
      }

      window.addEventListener(
        'load',
        scheduleApplyScale
      );

      window.addEventListener(
        'resize',
        scheduleApplyScale
      );

      window.addEventListener(
        'orientationchange',
        scheduleApplyScale
      );

      window.addEventListener(
        'pageshow',
        scheduleApplyScale
      );
    </script>

    <meta charset="utf-8">

    <title>Casual & Locum Optom Income Estimator</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >

    <meta
      name="theme-color"
      content="#ffffff"
    >

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    >

    <style>
      :root {
        --purple: #6600ff;
        --ink: #151515;
        --muted: #69718a;
        --muted-light: #9a9fab;
        --track: #e8eaf0;
        --divider: #ececf1;
        --error-red: #b42318;
        --focus-ring: rgba(102, 0, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        font-family: 'Lato', sans-serif;
        color: var(--ink);
        background: #fff;
        overflow-x: hidden;
        overflow-y: auto;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      button,
      input,
      select,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      #fit {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100dvh;
        width: 100%;
      }

      .box {
        width: min(calc(100% - 24px), 520px);
        max-width: 100%;
        min-width: 0;
        margin-inline: auto;
        padding: 24px 20px 30px;
        text-align: center;
      }

      #app {
        transform-origin: top center;
        will-change: transform;
      }

      .calculator-notice {
        width: 100%;
        margin: 0 0 10px;
        padding: 0 4px 16px;
        border-bottom: 1px solid var(--divider);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        text-align: center;
      }

      .calculator-notice p {
        margin: 0;
      }

      .calculator-notice p:first-child {
        color: var(--ink);
        font-weight: 700;
      }

      .calculator-notice p + p {
        margin-top: 3px;
      }

      #modelMeta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .calculator-form {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 16px;
        text-align: left;
      }

      .field {
        margin: 0;
      }

      .field label {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.005em;
        line-height: 1.3;
        text-align: center;
      }

      .field label small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        line-height: 1.3;
      }

      .field label small a {
        color: var(--purple);
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
      }

      .field input[type="number"],
      .field select {
        display: block;
        width: 100%;
        height: 42px;
        margin: 7px auto 0;
        padding: 0 8px;
        color: var(--ink);
        background: transparent;
        border: 0;
        border-bottom: 1px solid #b8bcc6;
        border-radius: 0;
        font: inherit;
        font-size: 16px;
        text-align: center;
        outline: none;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease;
      }

      .field input[type="number"]:hover,
      .field select:hover {
        border-bottom-color: #777d8b;
      }

      .field input[type="number"]:focus,
      .field select:focus {
        border-bottom-color: var(--purple);
        box-shadow: 0 2px 0 -1px var(--purple);
      }

      .field input[type="number"]:focus-visible,
      .field select:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }

      select {
        text-align-last: center;
        -moz-text-align-last: center;
        cursor: pointer;
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        margin: 0;
        -webkit-appearance: none;
      }

      #estimateBtn {
        display: block;
        width: 100%;
        min-height: 42px;
        margin: 1px auto 0;
        padding: 0 14px;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--ink);
        border-radius: 8px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          color 150ms ease,
          background-color 150ms ease,
          border-color 150ms ease,
          box-shadow 150ms ease,
          transform 150ms ease;
      }

      #estimateBtn:hover:not(:disabled) {
        color: #fff;
        background: var(--ink);
        box-shadow:
          0 5px 12px rgba(21, 21, 21, 0.12);
        transform: translateY(-1px);
      }

      #estimateBtn:active:not(:disabled) {
        box-shadow: none;
        transform: translateY(0);
      }

      #estimateBtn:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }

      #estimateBtn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      #out {
        min-height: 0;
        margin: -4px 1px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        text-align: left;
      }

      #out:empty {
        display: none;
      }

      /* Inline calculator errors */
      #out.is-error,
      #resultsStatus.is-error {
        color: var(--error-red);
      }

      #results {
        position: relative;
        display: none;
        margin-top: 14px;
        padding-top: 24px;
        border-top: 1px solid var(--divider);
        text-align: left;
      }

      #resultsStatus {
        display: none;
        position: absolute;
        top: -11px;
        right: 0;
        left: 0;
        width: fit-content;
        max-width: 100%;
        padding-right: 10px;
        color: var(--muted);
        background: #fff;
        font-size: 13px;
        line-height: 1.45;
        text-align: left;
      }

      #results.show-status {
        border-top-color: transparent;
      }

      #results.show-status #resultsStatus {
        display: block;
      }

      .results-section-label {
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.005em;
        line-height: 1.35;
        text-align: center;
      }

      .scale {
        --trackY: 34px;
        --barH: 6px;
        --gapValue: 7px;
        --gapLabel: 8px;

        position: relative;
        width: calc(100% - 20px);
        margin: 17px 10px 0;
        padding: 42px 0 47px;
      }

      .scale .track {
        position: absolute;
        top: var(--trackY);
        right: 0;
        left: 0;
        height: var(--barH);
        background: var(--track);
        border-radius: 999px;
      }

      .scale .tick {
        --stemUp: 20px;
        --stemDown: 18px;

        position: absolute;
        top: calc(
          var(--trackY) +
          var(--barH) / 2
        );
        transform: translateX(-50%);
        text-align: center;
      }

      .scale .t20,
      .scale .t80 {
        --stemUp: 17px;
        --stemDown: 16px;
      }

      .scale .t5,
      .scale .t95 {
        --stemUp: 14px;
        --stemDown: 14px;
      }

      .scale .tick .stem {
        position: absolute;
        top: calc(-1 * var(--stemUp));
        left: 50%;
        width: 2px;
        height: calc(
          var(--stemUp) +
          var(--stemDown)
        );
        background: var(--muted);
        border-radius: 999px;
        transform: translateX(-50%);
      }

      .scale .t50 .stem {
        width: 4px;
        background: var(--purple);
        box-shadow:
          0 0 0 3px rgba(102, 0, 255, 0.07);
      }

      .scale .t5 .stem,
      .scale .t95 .stem {
        width: 1px;
        background: var(--muted-light);
      }

      .scale .tick .value {
        position: absolute;
        top: 0;
        left: 50%;
        transform:
          translate(
            -50%,
            calc(
              -100% -
              var(--stemUp) -
              var(--gapValue)
            )
          );
        color: var(--ink);
        font-size: 13px;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        white-space: nowrap;
      }

      .scale .tick .label {
        position: absolute;
        top: 0;
        left: 50%;
        transform:
          translate(
            -50%,
            calc(
              var(--stemDown) +
              var(--gapLabel)
            )
          );
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
      }

      .scale .t50 .value,
      .scale .t50 .label {
        color: var(--purple);
        font-size: 16px;
        font-weight: 700;
      }

      .scale .t20 .value,
      .scale .t80 .value {
        font-size: 12px;
      }

      .scale .t5 .value,
      .scale .t95 .value {
        color: var(--muted);
        font-size: 11px;
      }

      .caption {
        margin-top: 7px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
      }

      .warn {
        color: var(--error-red);
      }

      @media (max-width: 430px) {
        .box {
          width: calc(100% - 24px);
          padding: 20px 14px 27px;
        }

        .calculator-notice {
          padding-bottom: 15px;
        }

        .calculator-form {
          gap: 18px;
          margin-top: 14px;
        }

        .field label {
          font-size: 12px;
        }

        .field label small,
        .field label small a {
          font-size: 11px;
        }

        .field input[type="number"],
        .field select {
          height: 40px;
          margin-top: 6px;
          font-size: 15px;
        }

        #estimateBtn {
          min-height: 40px;
        }

        .scale {
          width: calc(100% - 16px);
          margin-right: 8px;
          margin-left: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

    <script>
      const SCRIPT_URL =
        'https://script.google.com/macros/s/AKfycbyJKRhC3WEDrX9j323MOwEccI3Iv1_O-pEb7PJhPBpQHKFvAqPwrz3il7t-xPFv8D7htg/exec';

      const out =
        document.getElementById('out');

      const estimateBtn =
        document.getElementById('estimateBtn');

      const resultsStatus =
        document.getElementById('resultsStatus');

      /*
       * Shows a normal grey message or a red error message.
       */
      function setInlineMessage(
        element,
        message = '',
        isError = false
      ) {
        element.textContent = message;

        element.classList.toggle(
          'is-error',
          isError && Boolean(message)
        );
      }

      /*
       * Shows a message below the Calculate button.
       */
      function setFormMessage(
        message = '',
        isError = false
      ) {
        setInlineMessage(
          out,
          message,
          isError
        );

        scheduleApplyScale();
      }

      /*
       * Shows a message above existing results, where the divider
       * normally appears.
       */
      function setResultsMessage(
        message = '',
        isError = false
      ) {
        const resultsEl =
          document.getElementById('results');

        setInlineMessage(
          resultsStatus,
          message,
          isError
        );

        resultsEl.classList.toggle(
          'show-status',
          Boolean(message)
        );

        scheduleApplyScale();
      }

      /*
       * Removes final full stops from backend error messages.
       */
      function cleanErrorMessage(message) {
        return String(
          message || 'Request failed'
        )
          .trim()
          .replace(/\.+$/, '');
      }

      /*
       * Clears a form error when the user begins correcting a field.
       */
      function clearFormErrorOnEdit() {
        if (
          out.classList.contains('is-error')
        ) {
          setFormMessage();
        }

        if (
          resultsStatus.classList.contains(
            'is-error'
          )
        ) {
          setResultsMessage();
        }
      }

      document
        .querySelector('.calculator-form')
        .addEventListener(
          'input',
          clearFormErrorOnEdit
        );

      document
        .querySelector('.calculator-form')
        .addEventListener(
          'change',
          clearFormErrorOnEdit
        );

      const AUFMT =
        new Intl.NumberFormat('en-AU');

      let hasPreviousResults = false;
      let numberAnimationToken = 0;

      const NUMBER_ANIMATION_MS = 1000;

      function round0(x) {
        if (
          x === null ||
          x === undefined ||
          isNaN(x)
        ) {
          return '–';
        }

        return AUFMT.format(
          Math.round(Number(x))
        );
      }

      function fmtDollarsInt(x) {
        if (
          x === null ||
          x === undefined ||
          isNaN(x)
        ) {
          return '–';
        }

        return (
          '$' +
          AUFMT.format(
            Math.round(Number(x))
          )
        );
      }

      function callEstimatorBackend(
        action,
        params = {}
      ) {
        return new Promise(
          (resolve, reject) => {
            const callbackName =
              `locumEstimatorCallback_${Date.now()}_${Math.floor(
                Math.random() * 100000
              )}`;

            const script =
              document.createElement('script');

            const timeout =
              window.setTimeout(() => {
                cleanup();

                reject(
                  new Error(
                    'Request timed out.'
                  )
                );
              }, 30000);

            function cleanup() {
              window.clearTimeout(timeout);

              try {
                delete window[callbackName];
              } catch (error) {
                window[callbackName] =
                  undefined;
              }

              if (script.parentNode) {
                script.parentNode.removeChild(
                  script
                );
              }
            }

            window[callbackName] =
              response => {
                cleanup();

                if (
                  !response ||
                  !response.ok
                ) {
                  reject(
                    new Error(
                      response?.message ||
                      'Unable to load model.'
                    )
                  );

                  return;
                }

                resolve(response);
              };

            script.onerror = () => {
              cleanup();

              reject(
                new Error('Network error.')
              );
            };

            const query =
              new URLSearchParams({
                callback: callbackName,
                action,
                ...params
              });

            script.src =
              `${SCRIPT_URL}?${query.toString()}`;

            document.body.appendChild(
              script
            );
          }
        );
      }

      function animateNumber(
        elementId,
        targetValue,
        formatter,
        animate,
        token
      ) {
        const element =
          document.getElementById(elementId);

        const target =
          Number(targetValue);

        if (!Number.isFinite(target)) {
          element.textContent = '–';

          delete element.dataset.numericValue;
          return;
        }

        const start =
          Number(
            element.dataset.numericValue
          );

        const reduceMotion =
          window.matchMedia(
            '(prefers-reduced-motion: reduce)'
          ).matches;

        const shouldAnimate =
          animate &&
          Number.isFinite(start) &&
          start !== target &&
          !reduceMotion;

        if (!shouldAnimate) {
          element.textContent =
            formatter(target);

          element.dataset.numericValue =
            String(target);

          return;
        }

        const startedAt =
          performance.now();

        function frame(now) {
          if (
            token !== numberAnimationToken
          ) {
            return;
          }

          const progress = Math.min(
            (now - startedAt) /
              NUMBER_ANIMATION_MS,
            1
          );

          const eased =
            1 -
            Math.pow(
              1 - progress,
              3
            );

          const current =
            start +
            (target - start) *
              eased;

          element.textContent =
            formatter(current);

          element.dataset.numericValue =
            String(current);

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            element.textContent =
              formatter(target);

            element.dataset.numericValue =
              String(target);
          }
        }

        requestAnimationFrame(frame);
      }

      function renderPercentileScale(
        res,
        animateNumbers = false
      ) {
        const [
          p05,
          p20,
          p50,
          p80,
          p95
        ] = [
          res.p05,
          res.p20,
          res.p50,
          res.p80,
          res.p95
        ].map(Number);

        const P_MIN = 5;
        const P_MAX = 95;
        const P_SPAN =
          P_MAX - P_MIN;

        const posPct = p =>
          ((p - P_MIN) / P_SPAN) *
          100;

        const token =
          ++numberAnimationToken;

        document.querySelector(
          '.t5'
        ).style.left =
          posPct(5) + '%';

        document.querySelector(
          '.t20'
        ).style.left =
          posPct(20) + '%';

        document.querySelector(
          '.t50'
        ).style.left =
          posPct(50) + '%';

        document.querySelector(
          '.t80'
        ).style.left =
          posPct(80) + '%';

        document.querySelector(
          '.t95'
        ).style.left =
          posPct(95) + '%';

        animateNumber(
          'p05v',
          p05,
          round0,
          animateNumbers,
          token
        );

        animateNumber(
          'p20v',
          p20,
          round0,
          animateNumbers,
          token
        );

        animateNumber(
          'p50v',
          p50,
          fmtDollarsInt,
          animateNumbers,
          token
        );

        animateNumber(
          'p80v',
          p80,
          round0,
          animateNumbers,
          token
        );

        animateNumber(
          'p95v',
          p95,
          round0,
          animateNumbers,
          token
        );
      }

      async function loadModel() {
        try {
          await callEstimatorBackend(
            'summary'
          );

          document.getElementById(
            'modelMeta'
          ).textContent =
            'MLR (OLS) model loaded';

          scheduleApplyScale();
        } catch (err) {
          document.getElementById(
            'modelMeta'
          ).innerHTML =
            '<span class="warn">Model error: ' +
            cleanErrorMessage(
              err?.message
            ) +
            '</span>';

          scheduleApplyScale();
        }
      }

      async function estimate() {
        const years = parseFloat(
          document.getElementById(
            'years'
          ).value
        );

        const mmm = parseInt(
          document.getElementById(
            'mmm'
          ).value,
          10
        );

        const resultsEl =
          document.getElementById(
            'results'
          );

        const hadPreviousResults =
          hasPreviousResults;

        /*
         * Before the first calculation, show validation errors below
         * Calculate. After results exist, replace the results divider
         * with the error so nothing moves.
         */
        function showInputError(message) {
          if (hadPreviousResults) {
            setFormMessage();

            setResultsMessage(
              message,
              true
            );
          } else {
            setFormMessage(
              message,
              true
            );
          }
        }

        if (
          !isFinite(years) ||
          years < 0 ||
          !isFinite(mmm) ||
          mmm < 1 ||
          mmm > 7
        ) {
          showInputError(
            '⚠ Please complete all fields'
          );

          return;
        }

        if (!hadPreviousResults) {
          /*
           * First calculation: show the status below Calculate.
           */
          resultsEl.style.display =
            'none';

          setFormMessage(
            'Calculating…'
          );
        } else {
          /*
           * Keep the existing results stationary while recalculating.
           */
          setFormMessage();

          setResultsMessage(
            'Recalculating…'
          );
        }

        estimateBtn.disabled = true;

        scheduleApplyScale();

        try {
          const res =
            await callEstimatorBackend(
              'predict',
              {
                years: String(years),
                mmm: String(mmm)
              }
            );

          /*
           * Restore the divider before animating the updated values.
           */
          setResultsMessage();
          setFormMessage();

          resultsEl.style.display =
            'block';

          renderPercentileScale(
            res,
            hadPreviousResults
          );

          hasPreviousResults = true;

          scheduleApplyScale();

          estimateBtn.disabled = false;
          estimateBtn.textContent =
            'Recalculate';
        } catch (err) {
          const message =
            '⚠ ' +
            cleanErrorMessage(
              err?.message
            );

          if (hadPreviousResults) {
            /*
             * Keep the previous results stationary and show the error
             * above them.
             */
            setFormMessage();

            setResultsMessage(
              message,
              true
            );
          } else {
            /*
             * No results exist yet, so show the error below Calculate.
             */
            setFormMessage(
              message,
              true
            );
          }

          estimateBtn.disabled = false;

          estimateBtn.textContent =
            hadPreviousResults
              ? 'Recalculate'
              : 'Calculate';
        }
      }

      document
        .getElementById('estimateBtn')
        .addEventListener(
          'click',
          estimate
        );

      loadModel();
    </script>
  </body>
</html>
