<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Medicare Service Demand</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js"></script>

  <style>
    :root {
      --pff-metric-width: 74px;
      --pff-metric-width-mobile: 68px;
      --pff-metric-width-small: 64px;
    }

    .item-control {
      position: relative;
      z-index: 70;
      flex: 0 0 auto;
    }

    .item-button {
      display: grid;
      width: 96px;
      height: 27px;
      grid-template-columns: max-content minmax(0, 1fr) 8px;
      align-items: center;
      gap: 4px;
      padding: 0 5px;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      text-align: left;
      cursor: pointer;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .item-button:hover,
    .item-button[aria-expanded="true"] {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .item-button[aria-expanded="true"] {
      border-color: var(--pff-purple);
    }

    .item-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .item-button-value {
      min-width: 0;
      overflow: hidden;
      color: var(--pff-purple);
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-arrow {
      width: 0;
      height: 0;
      border-top: 4px solid var(--pff-muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .item-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    .item-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 100;
      display: none;
      width: 136px;
      max-height: min(330px, calc(100vh - 120px));
      overflow: hidden;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
    }

    .item-menu.is-open {
      display: flex;
      flex-direction: column;
    }

    .item-menu-title {
      flex: 0 0 auto;
      margin: 0;
      padding: 7px 10px;
      color: var(--pff-muted);
      background: var(--pff-white);
      border-bottom: 1px solid var(--pff-track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .item-menu-scroll {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .item-option {
      display: grid;
      width: 100%;
      min-height: 31px;
      grid-template-columns: 15px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 5px 9px;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 0;
      border-bottom: 1px solid rgba(232, 234, 240, 0.58);
      font-family: inherit;
      font-size: 11px;
      line-height: 1.2;
      text-align: left;
      cursor: pointer;
    }

    .item-option:last-child { border-bottom: 0; }
    .item-option:hover { background: rgba(232, 234, 240, 0.30); }

    .item-option:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .item-check {
      position: relative;
      width: 15px;
      height: 15px;
      border: 1px solid var(--pff-muted);
      border-radius: 2px;
      background: var(--pff-white);
    }

    .item-option.is-selected .item-check,
    .item-option.is-indeterminate .item-check {
      border-color: var(--pff-purple);
      background: var(--pff-purple);
    }

    .item-option.is-selected .item-check::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid var(--pff-white);
      border-bottom: 2px solid var(--pff-white);
      transform: rotate(45deg);
    }

    .item-option.is-indeterminate .item-check::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 3px;
      width: 7px;
      height: 2px;
      background: var(--pff-white);
    }

    .item-option-master,
    .item-option-total {
      font-weight: 700;
      border-bottom-color: var(--pff-track);
    }

    .item-option-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-option.is-selected .item-option-label,
    .item-option-master.is-indeterminate .item-option-label {
      color: var(--pff-purple);
      font-weight: 700;
    }

    .chart-legend .legend-item {
      color: var(--pff-muted);
      cursor: default;
    }

    .chart-legend .legend-item:hover {
      color: var(--pff-muted);
    }

    .legend-line.is-short-consult {
      height: 0;
      background: transparent !important;
      border-top: 3px dashed var(--legend-colour);
      border-radius: 0;
    }

    @media (max-width: 430px) {
      .item-button {
        width: 88px;
        padding-right: 4px;
        padding-left: 4px;
        font-size: 8px;
      }

      .item-menu { width: 138px; }
    }

    @media (max-width: 365px) {
      .item-button { width: 82px; }
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div id="loadingState" class="app-loading" role="status" aria-label="Loading Medicare service data">
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading Medicare service data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <button id="tabScrollLeft" class="tab-scroll-button tab-scroll-left is-hidden" type="button" aria-label="Scroll tabs left">‹</button>
          <div id="tabList" class="tab-list" role="tablist" aria-label="Medicare service demand charts">
            <button class="chart-tab is-active" type="button" role="tab" aria-selected="true" data-view="services">Services</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-view="hours">Hours</button>
          </div>
          <button id="tabScrollRight" class="tab-scroll-button tab-scroll-right is-hidden" type="button" aria-label="Scroll tabs right">›</button>
        </div>

        <div id="dataSourceIndicator" class="live-data" aria-label="Live data" aria-live="polite">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div class="heading-scroll-shell">
          <button id="headingScrollLeft" class="heading-scroll-button heading-scroll-left is-hidden" type="button" aria-label="Scroll graph title left">‹</button>
          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 class="chart-heading">
              <span id="chartHeadingFixed" class="chart-heading-fixed">Medicare</span><span id="chartHeadingDetail" class="chart-heading-detail"> services</span>
            </h2>
          </div>
          <button id="headingScrollRight" class="heading-scroll-button heading-scroll-right is-hidden" type="button" aria-label="Scroll graph title right">›</button>
        </div>

        <div class="heading-controls">
          <div id="metricSwitch" class="metric-switch" role="group" aria-label="Chart value mode">
            <button class="metric-button is-active" type="button" data-metric="count" aria-pressed="true">Count</button>
            <button class="metric-button" type="button" data-metric="percent" aria-pressed="false">%</button>
          </div>

          <div id="itemControl" class="item-control">
            <button id="itemButton" class="item-button" type="button" aria-haspopup="true" aria-expanded="false">
              <span>Items</span>
              <span id="itemButtonValue" class="item-button-value">7 selected</span>
              <span class="menu-arrow" aria-hidden="true"></span>
            </button>

            <div id="itemMenu" class="item-menu" role="menu" aria-label="Select Medicare items">
              <p class="item-menu-title">Medicare items</p>
              <div id="itemMenuScroll" class="item-menu-scroll"></div>
            </div>
          </div>

          <button id="yoyTrendToggle" class="yoy-trend-toggle is-on" type="button" aria-pressed="true" aria-label="3-year trend. Press to switch to 10-year trend.">
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>
        </div>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <button id="legendScrollLeft" class="legend-scroll-button legend-scroll-left is-hidden" type="button" aria-label="Scroll legend left">‹</button>
          <div class="legend-viewport">
            <div id="chartLegend" class="chart-legend" aria-label="Chart legend"></div>
          </div>
          <button id="legendScrollRight" class="legend-scroll-button legend-scroll-right is-hidden" type="button" aria-label="Scroll legend right">›</button>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas id="demandChart" aria-label="Australian Medicare optometry service demand trend chart" role="img"></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    // ============================================================
    // DATA SOURCE — RAW MEDICAREITEMS ONLY
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const MEDICARE_SHEET =
      'Medicareitems';

    const MEDICARE_DATA_RANGE =
      'C30:KE';

    const MEDICARE_ITEM_RANGE =
      'D29:KE29';

    const MEDICARE_HOURS_RANGE =
      'D28:KE28';

    const FETCH_TIMEOUT_MS =
      15000;

    /*
     * Retain the v13 browser-cache key so an existing cache created from
     * a previous successful live load can still be used. No embedded data
     * fallback is retained in this refactor.
     */
    const LOCAL_CACHE_KEY =
      'pff-medicare-service-demand-v13';

    const ALL_SERIES_KEY =
      '__all__';

    const SELECT_ALL_KEY =
      '__select_all__';

    const ALL_SERIES_COLOUR =
      '#00a651';

    const ITEM_COLOUR_MAP = Object.freeze({
      '10900': '#FF1493',
      '10905': '#00C2FF',
      '10907': '#7CFC00',
      '10910': '#FF6B00',
      '10911': '#B400FF',
      '10912': '#00E5A8',
      '10913': '#FF1744',
      '10914': '#D4FF00',
      '10915': '#006BFF',
      '10916': '#6B1E3F',
      '10918': '#00695C',
      '10921': '#8B4513',
      '10922': '#003F5C',
      '10923': '#5A189A',
      '10924': '#B22222',
      '10925': '#386641',
      '10926': '#264653',
      '10927': '#9A5B00',
      '10928': '#005F73',
      '10929': '#7B2CBF',
      '10930': '#9D0208',
      '10938': '#00F5D4',
      '10939': '#FF00A8',
      '10940': '#64FF00',
      '10941': '#9D00FF',
      '10942': '#FF8C00',
      '10943': '#00B8FF',
      '10944': '#7A003C',
      '10945': '#4A4E69',
      '10946': '#F50057',
      '10947': '#1B4332',
      '10948': '#39FF14'
    });

    const LONG_CONSULT_HOURS =
      0.475;

    const EXPECTED_ITEM_COUNT =
      32;

    // ============================================================
    // DOM + STATE
    // ============================================================

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById('loadingState');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const chartTabs =
      Array.from(document.querySelectorAll('.chart-tab'));

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const chartHeadingFixed =
      document.getElementById('chartHeadingFixed');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const metricSwitch =
      document.getElementById('metricSwitch');

    const metricButtons =
      Array.from(document.querySelectorAll('.metric-button'));

    const itemControl =
      document.getElementById('itemControl');

    const itemButton =
      document.getElementById('itemButton');

    const itemButtonValue =
      document.getElementById('itemButtonValue');

    const itemMenu =
      document.getElementById('itemMenu');

    const itemMenuScroll =
      document.getElementById('itemMenuScroll');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartShell =
      document.getElementById('chartShell');

    const demandCanvas =
      document.getElementById('demandChart');

    let sourceData = null;
    let chart = null;
    let yAxisController = null;
    let tabsController = null;
    let headingScroller = null;
    let metricController = null;
    let trendController = null;
    let menuController = null;
    let legendScroller = null;
    let responsiveController = null;
    let chartInteractions = null;
    let chartSummary = null;

    let activeView =
      'services';

    let valueMode =
      'count';

    let trendMode =
      '3yr';

    let currentScale = {
      min: 0,
      max: 5,
      step: 1,
      intervals: 5
    };

    const axisTitleState = {
      from: '',
      to: '',
      progress: 1,
      token: 0,
      raf: null
    };

    let selectedSeries =
      new Set([
        '10910',
        '10911',
        '10913',
        '10914',
        '10915',
        '10916',
        '10918'
      ]);

    // ============================================================
    // DATA HELPERS
    // ============================================================

    function finiteNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function cellValue(cell) {
      if (!cell) return null;
      const raw = cell.v ?? cell.f ?? null;
      return raw === null || raw === '' ? null : raw;
    }

    function numericCell(cell) {
      const raw = cellValue(cell);
      if (raw === null || raw === undefined || raw === '') return null;
      const number = Number(
        typeof raw === 'string'
          ? raw.replace(/,/g, '')
          : raw
      );
      return Number.isFinite(number) ? number : null;
    }

    function itemNumberCell(cell) {
      const value = numericCell(cell);
      if (Number.isFinite(value)) {
        return String(Math.round(value));
      }
      const text = String(cell?.v ?? cell?.f ?? '').trim();
      return /^\d{5}$/.test(text) ? text : '';
    }

    function validSourceData(data) {
      return Boolean(
        data &&
        Array.isArray(data.items) &&
        data.items.length === EXPECTED_ITEM_COUNT &&
        data.items.every(item => /^\d{5}$/.test(String(item?.item || ''))) &&
        Array.isArray(data.rows) &&
        data.rows.length >= 3
      );
    }

    function parseMetadataRows(itemTable, hoursTable) {
      const itemCells = itemTable?.rows?.[0]?.c || [];
      const hourCells = hoursTable?.rows?.[0]?.c || [];
      const parsed = [];

      for (let start = 0; start + 8 < itemCells.length; start += 9) {
        const item = itemNumberCell(itemCells[start]);
        if (!/^\d{5}$/.test(item)) break;

        const repeated = Array.from(
          { length: 9 },
          (_, offset) => itemNumberCell(itemCells[start + offset])
        );

        if (!repeated.every(value => value === item)) break;

        const hours = numericCell(hourCells[start]);
        parsed.push({ item, hours });
      }

      if (parsed.length !== EXPECTED_ITEM_COUNT) {
        throw new Error('Medicare item metadata were incomplete.');
      }

      return parsed;
    }

    function parseMedicareDataTable(table, itemSchema) {
      const rows = table?.rows || [];
      const parsedRows = [];

      if (!rows.length) {
        throw new Error('Medicareitems returned no annual rows.');
      }

      for (const row of rows) {
        const cells = row?.c || [];
        const yearValue = numericCell(cells[0]);
        if (!Number.isFinite(yearValue)) continue;

        const year = Math.round(yearValue);
        if (year < 1900 || year > 2200) continue;

        const totals = itemSchema.map(
          (_, itemIndex) =>
            numericCell(cells[9 + itemIndex * 9])
        );

        if (totals.some(Number.isFinite)) {
          parsedRows.push({ year, totals });
        }
      }

      parsedRows.sort((a, b) => a.year - b.year);

      return {
        items: itemSchema.map(item => ({ ...item })),
        rows: parsedRows
      };
    }

    function saveBrowserCache(data) {
      return PFFCharts.saveLocalCache(
        LOCAL_CACHE_KEY,
        data.rows,
        { items: data.items }
      );
    }

    function readBrowserCache() {
      const current = PFFCharts.loadLocalCache(
        LOCAL_CACHE_KEY,
        { minRows: 3 }
      );

      const currentData = current
        ? { items: current.items, rows: current.rows }
        : null;

      if (validSourceData(currentData)) {
        return currentData;
      }

      /* Compatibility with the pre-refactor v13 browser-cache shape. */
      try {
        const legacyRaw = localStorage.getItem(LOCAL_CACHE_KEY);
        if (!legacyRaw) return null;
        const legacy = JSON.parse(legacyRaw);
        return validSourceData(legacy?.data)
          ? legacy.data
          : null;
      } catch (_) {
        return null;
      }
    }

    async function loadLiveData() {
      const [dataTable, itemTable, hoursTable] =
        await Promise.all([
          PFFCharts.loadGVizSheet({
            sheetId: SHEET_ID,
            sheetName: MEDICARE_SHEET,
            range: MEDICARE_DATA_RANGE,
            headers: '1',
            timeoutMs: FETCH_TIMEOUT_MS,
            query: 'select *'
          }),
          PFFCharts.loadGVizSheet({
            sheetId: SHEET_ID,
            sheetName: MEDICARE_SHEET,
            range: MEDICARE_ITEM_RANGE,
            headers: '0',
            timeoutMs: FETCH_TIMEOUT_MS,
            query: 'select *'
          }),
          PFFCharts.loadGVizSheet({
            sheetId: SHEET_ID,
            sheetName: MEDICARE_SHEET,
            range: MEDICARE_HOURS_RANGE,
            headers: '0',
            timeoutMs: FETCH_TIMEOUT_MS,
            query: 'select *'
          })
        ]);

      const itemSchema =
        parseMetadataRows(itemTable, hoursTable);

      const data =
        parseMedicareDataTable(dataTable, itemSchema);

      if (!validSourceData(data)) {
        throw new Error('Live Medicare data were incomplete.');
      }

      return data;
    }

    async function loadData() {
      try {
        const live = await loadLiveData();
        saveBrowserCache(live);
        PFF.setDataSourceIndicator('live', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });
        return live;
      } catch (liveError) {
        const cached = readBrowserCache();

        if (validSourceData(cached)) {
          PFF.setDataSourceIndicator('cached', {
            indicator: dataSourceIndicator,
            text: dataSourceText
          });
          return cached;
        }

        throw liveError;
      }
    }

    // ============================================================
    // SERIES + METRICS
    // ============================================================

    function itemIndexFor(itemNumber) {
      return sourceData.items.findIndex(item => item.item === itemNumber);
    }

    function itemMetaFor(itemNumber) {
      return sourceData.items.find(item => item.item === itemNumber) || null;
    }

    function isLongConsultItem(key) {
      if (key === ALL_SERIES_KEY) return false;
      const hours = Number(itemMetaFor(key)?.hours);
      return Number.isFinite(hours) &&
        Math.abs(hours - LONG_CONSULT_HOURS) < 1e-6;
    }

    function isShortConsultItem(key) {
      if (key === ALL_SERIES_KEY) return false;
      const hours = Number(itemMetaFor(key)?.hours);
      return Number.isFinite(hours) &&
        hours < LONG_CONSULT_HOURS - 1e-6;
    }

    function rawItemCount(row, itemIndex) {
      return finiteNumber(row?.totals?.[itemIndex]);
    }

    function allMetric(row) {
      let total = 0;
      let found = false;

      sourceData.items.forEach((item, itemIndex) => {
        const count = rawItemCount(row, itemIndex);
        if (!Number.isFinite(count)) return;

        if (activeView === 'hours') {
          const hours = finiteNumber(item.hours);
          if (!Number.isFinite(hours)) return;
          total += count * hours;
        } else {
          total += count;
        }

        found = true;
      });

      return found ? total : null;
    }

    function itemMetric(row, itemNumber) {
      const index = itemIndexFor(itemNumber);
      if (index < 0) return null;

      const count = rawItemCount(row, index);
      if (!Number.isFinite(count)) return null;
      if (activeView === 'services') return count;

      const hours = finiteNumber(sourceData.items[index]?.hours);
      return Number.isFinite(hours)
        ? count * hours
        : null;
    }

    function absoluteMetric(row, seriesKey) {
      return seriesKey === ALL_SERIES_KEY
        ? allMetric(row)
        : itemMetric(row, seriesKey);
    }

    function displayMetric(row, seriesKey) {
      const absolute = absoluteMetric(row, seriesKey);
      if (valueMode === 'count') return absolute;
      if (seriesKey === ALL_SERIES_KEY) return null;

      const all = allMetric(row);
      if (
        !Number.isFinite(absolute) ||
        !Number.isFinite(all) ||
        all <= 0
      ) {
        return null;
      }

      return absolute / all * 100;
    }

    function itemSeriesKeys() {
      return sourceData.items.map(item => item.item);
    }

    function allDatasetKeys() {
      return [ALL_SERIES_KEY, ...itemSeriesKeys()];
    }

    function selectableKeysForMode() {
      const items = itemSeriesKeys();
      return valueMode === 'percent'
        ? items
        : [ALL_SERIES_KEY, ...items];
    }

    function selectedKeys() {
      const ordered = [];

      if (selectedSeries.has(ALL_SERIES_KEY)) {
        ordered.push(ALL_SERIES_KEY);
      }

      sourceData.items.forEach(item => {
        if (selectedSeries.has(item.item)) {
          ordered.push(item.item);
        }
      });

      return ordered;
    }

    function visibleSelectedKeys() {
      const keys = selectedKeys();
      return valueMode === 'percent'
        ? keys.filter(key => key !== ALL_SERIES_KEY)
        : keys;
    }

    function datasetVisible(key) {
      if (key === ALL_SERIES_KEY) {
        return valueMode === 'count' && selectedSeries.has(key);
      }
      return selectedSeries.has(key);
    }

    function seriesLabel(key) {
      return key === ALL_SERIES_KEY
        ? 'Total Medicare'
        : key;
    }

    function seriesColour(key) {
      return key === ALL_SERIES_KEY
        ? ALL_SERIES_COLOUR
        : ITEM_COLOUR_MAP[key] || '#69718a';
    }

    function currentRows() {
      return sourceData.rows;
    }

    function buildSeriesData(key) {
      return currentRows().map(row => {
        const value = displayMetric(row, key);
        return Number.isFinite(value) ? value : null;
      });
    }

    function datasetModel(key) {
      const colour = seriesColour(key);
      const longConsult = isLongConsultItem(key);
      const shortConsult = isShortConsultItem(key);
      const visible = datasetVisible(key);

      return PFFCharts.lineDataset({
        label: seriesLabel(key),
        _seriesLabel: seriesLabel(key),
        _seriesKey: key,
        _activeSeries: visible,
        data: buildSeriesData(key),
        hidden: !visible,
        borderColor: colour,
        backgroundColor: colour,
        pointBackgroundColor: colour,
        pointBorderColor: '#ffffff',
        borderWidth:
          key === ALL_SERIES_KEY
            ? 2.8
            : longConsult
              ? 2.45
              : 1.9,
        borderDash: shortConsult ? [8, 4] : [],
        borderDashOffset: 0,
        borderCapStyle: 'round',
        borderJoinStyle: 'round',
        pointBorderWidth: visible ? 1 : 0,
        pointHoverRadius: visible ? 4 : 0,
        pointHitRadius: visible ? (PFF.mobileLayout() ? 9 : 5) : 0,
        cubicInterpolationMode: 'monotone'
      });
    }

    function buildDatasets() {
      return allDatasetKeys().map(datasetModel);
    }

    function syncChartDatasets() {
      const existing = new Map(
        chart.data.datasets.map(dataset => [dataset._seriesKey, dataset])
      );

      chart.data.datasets = allDatasetKeys().map((key, datasetIndex) => {
        const model = datasetModel(key);
        const dataset = existing.get(key);

        if (!dataset) return model;

        Object.assign(dataset, model);

        const visible = datasetVisible(key);
        chart.setDatasetVisibility(datasetIndex, visible);
        dataset._activeSeries = visible;
        dataset.pointHoverRadius = visible ? 4 : 0;
        dataset.pointHitRadius = visible ? (PFF.mobileLayout() ? 9 : 5) : 0;
        dataset.pointBorderWidth = visible ? 1 : 0;

        return dataset;
      });
    }

    // ============================================================
    // TREND + SCALE
    // ============================================================

    function trendWindowSize() {
      return trendMode === '10yr'
        ? 10
        : trendMode === '3yr'
          ? 3
          : 0;
    }

    function trendForSeries(key) {
      const windowSize = trendWindowSize();
      if (windowSize < 2) return NaN;

      return PFFCharts.latestConsecutiveTrend(
        currentRows(),
        row => displayMetric(row, key),
        windowSize
      );
    }

    function niceNumber(value, round) {
      if (!Number.isFinite(value) || value <= 0) return 1;

      const exponent = Math.floor(Math.log10(value));
      const fraction = value / Math.pow(10, exponent);
      let niceFraction;

      if (round) {
        niceFraction =
          fraction < 1.5 ? 1 :
          fraction < 3 ? 2 :
          fraction < 7 ? 5 : 10;
      } else {
        niceFraction =
          fraction <= 1 ? 1 :
          fraction <= 2 ? 2 :
          fraction <= 5 ? 5 : 10;
      }

      return niceFraction * Math.pow(10, exponent);
    }

    function computeScale() {
      const values = [];

      visibleSelectedKeys().forEach(key => {
        currentRows().forEach(row => {
          const value = displayMetric(row, key);
          if (Number.isFinite(value) && value >= 0) {
            values.push(value);
          }
        });
      });

      const maximum = values.length ? Math.max(...values) : 5;
      const roughStep = Math.max(maximum / 5, Number.EPSILON);
      const step = niceNumber(roughStep, true);
      let max = Math.ceil(maximum / step) * step;

      if (max <= maximum) max += step;
      if (max <= 0) max = step * 5;

      const finalStep = niceNumber(max / 5, true);
      max = Math.ceil(maximum / finalStep) * finalStep;

      while (max / finalStep < 4) {
        max += finalStep;
      }

      return {
        min: 0,
        max,
        step: finalStep,
        intervals: Math.max(1, Math.round(max / finalStep))
      };
    }

    function formatAxisValue(value) {
      const number = finiteNumber(value);
      if (number === null) return '';
      if (valueMode === 'percent') return `${Math.round(number)}%`;

      const absolute = Math.abs(number);

      if (absolute >= 1000000000) {
        return `${(number / 1000000000)
          .toFixed(absolute >= 10000000000 ? 0 : 1)
          .replace(/\.0$/, '')}b`;
      }

      if (absolute >= 1000000) {
        return `${(number / 1000000)
          .toFixed(absolute >= 10000000 ? 0 : 1)
          .replace(/\.0$/, '')}m`;
      }

      if (absolute >= 1000) {
        return `${(number / 1000)
          .toFixed(absolute >= 10000 ? 0 : 1)
          .replace(/\.0$/, '')}k`;
      }

      return number.toLocaleString(
        'en-AU',
        {
          maximumFractionDigits: 1
        }
      );
    }

    function yAxisTitle() {
      if (valueMode === 'percent') {
        return activeView === 'hours'
          ? '% of Medicare-billed hours'
          : '% of Medicare services';
      }

      return activeView === 'hours'
        ? 'Medicare-billed hours'
        : 'Medicare services';
    }

    function setAxisTitleImmediately(
      text = yAxisTitle()
    ) {
      if (axisTitleState.raf) {
        cancelAnimationFrame(
          axisTitleState.raf
        );

        axisTitleState.raf =
          null;
      }

      ++axisTitleState.token;

      const value =
        String(
          text || ''
        );

      axisTitleState.from =
        value;

      axisTitleState.to =
        value;

      axisTitleState.progress =
        1;
    }

    function animateAxisTitle(
      nextText,
      duration = 420
    ) {
      const target =
        String(
          nextText || ''
        );

      const current =
        axisTitleState.progress < 0.5
          ? axisTitleState.from
          : axisTitleState.to;

      if (
        current === target ||
        PFF.reducedMotion() ||
        duration <= 0
      ) {
        setAxisTitleImmediately(
          target
        );

        chart?.draw();

        return;
      }

      if (axisTitleState.raf) {
        cancelAnimationFrame(
          axisTitleState.raf
        );

        axisTitleState.raf =
          null;
      }

      const token =
        ++axisTitleState.token;

      axisTitleState.from =
        current;

      axisTitleState.to =
        target;

      axisTitleState.progress =
        0;

      const startedAt =
        performance.now();

      const frame = now => {
        if (
          token !==
          axisTitleState.token
        ) {
          return;
        }

        const raw =
          PFF.clamp(
            (
              now -
              startedAt
            ) /
              duration,
            0,
            1
          );

        axisTitleState.progress =
          PFFCharts.easeOutCubic(
            raw
          );

        chart?.draw();

        if (raw < 1) {
          axisTitleState.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          axisTitleState.raf =
            null;

          setAxisTitleImmediately(
            target
          );

          chart?.draw();
        }
      };

      axisTitleState.raf =
        requestAnimationFrame(
          frame
        );
    }

    function drawAxisTitle(
      ctx,
      chartArea
    ) {
      const progress =
        PFF.clamp(
          axisTitleState.progress,
          0,
          1
        );

      const x =
        Math.max(
          PFF.mobileLayout()
            ? 10
            : 11,
          chartArea.left -
            (
              PFF.mobileLayout()
                ? 53
                : 59
            )
        );

      const y =
        chartArea.top +
        chartArea.height /
          2;

      const draw = (
        text,
        opacity
      ) => {
        if (
          !text ||
          opacity <= 0
        ) {
          return;
        }

        ctx.save();

        ctx.globalAlpha =
          opacity;

        ctx.translate(
          x,
          y
        );

        ctx.rotate(
          -Math.PI /
          2
        );

        ctx.fillStyle =
          '#151515';

        ctx.textAlign =
          'center';

        ctx.textBaseline =
          'middle';

        ctx.font =
          `700 ${PFF.mobileLayout() ? 12 : 13}px Lato, sans-serif`;

        ctx.fillText(
          text,
          0,
          0
        );

        ctx.restore();
      };

      if (
        axisTitleState.from ===
          axisTitleState.to ||
        progress >= 1
      ) {
        draw(
          axisTitleState.to ||
            yAxisTitle(),
          1
        );

        return;
      }

      draw(
        axisTitleState.from,
        PFF.clamp(
          1 -
            progress *
            2.2,
          0,
          1
        )
      );

      draw(
        axisTitleState.to,
        PFF.clamp(
          (
            progress -
            0.32
          ) /
            0.68,
          0,
          1
        )
      );
    }

    // ============================================================
    // ITEM MULTI-SELECT
    // ============================================================

    function allSelectableSelected() {
      const selectable =
        selectableKeysForMode();

      return (
        selectable.length > 0 &&
        selectable.every(
          key =>
            selectedSeries.has(
              key
            )
        )
      );
    }

    function someSelectableSelected() {
      return selectableKeysForMode()
        .some(
          key =>
            selectedSeries.has(
              key
            )
        );
    }

    function updateItemButtonText() {
      const keys =
        visibleSelectedKeys();

      const selectable =
        selectableKeysForMode();

      const selectedVisibleCount =
        selectable.filter(
          key =>
            selectedSeries.has(
              key
            )
        ).length;

      if (
        selectable.length > 0 &&
        selectedVisibleCount ===
          selectable.length
      ) {
        itemButtonValue.textContent =
          'All selected';

        return;
      }

      if (!keys.length) {
        itemButtonValue.textContent =
          'Select';

        return;
      }

      if (
        valueMode === 'count' &&
        keys.length === 1 &&
        keys[0] ===
          ALL_SERIES_KEY
      ) {
        itemButtonValue.textContent =
          'Total';

        return;
      }

      const itemCount =
        keys.filter(
          key =>
            key !==
            ALL_SERIES_KEY
        ).length;

      const hasTotal =
        valueMode === 'count' &&
        keys.includes(
          ALL_SERIES_KEY
        );

      if (
        itemCount === 1 &&
        !hasTotal
      ) {
        itemButtonValue.textContent =
          keys.find(
            key =>
              key !==
              ALL_SERIES_KEY
          ) ||
          'Select';

        return;
      }

      itemButtonValue.textContent =
        hasTotal &&
        itemCount > 0
          ? `Total + ${itemCount}`
          : `${itemCount} selected`;
    }

    function syncItemMenuSelection() {
      const allSelected =
        allSelectableSelected();

      const someSelected =
        someSelectableSelected();

      itemMenuScroll
        .querySelectorAll(
          '.item-option'
        )
        .forEach(button => {
          const key =
            button.dataset.key;

          if (
            key ===
            SELECT_ALL_KEY
          ) {
            button.hidden =
              false;

            button.classList.toggle(
              'is-selected',
              allSelected
            );

            button.classList.toggle(
              'is-indeterminate',
              !allSelected &&
                someSelected
            );

            button.setAttribute(
              'aria-checked',
              allSelected
                ? 'true'
                : someSelected
                  ? 'mixed'
                  : 'false'
            );

            return;
          }

          button.classList.remove(
            'is-indeterminate'
          );

          button.hidden =
            key ===
              ALL_SERIES_KEY &&
            valueMode ===
              'percent';

          const selected =
            selectedSeries.has(
              key
            );

          button.classList.toggle(
            'is-selected',
            selected
          );

          button.setAttribute(
            'aria-checked',
            String(
              selected
            )
          );
        });
    }

    function toggleAllSelectable() {
      const selectable =
        selectableKeysForMode();

      const next =
        new Set(
          selectedSeries
        );

      const shouldClear =
        selectable.length > 0 &&
        selectable.every(
          key =>
            next.has(
              key
            )
        );

      selectable.forEach(
        key => {
          if (shouldClear) {
            next.delete(
              key
            );
          } else {
            next.add(
              key
            );
          }
        }
      );

      selectedSeries =
        next;

      updateItemButtonText();
      syncItemMenuSelection();

      renderChartChange(
        'selection'
      );
    }

    function toggleSelectedSeries(
      key
    ) {
      const next =
        new Set(
          selectedSeries
        );

      if (
        next.has(
          key
        )
      ) {
        next.delete(
          key
        );
      } else {
        next.add(
          key
        );
      }

      selectedSeries =
        next;

      updateItemButtonText();
      syncItemMenuSelection();

      renderChartChange(
        'selection'
      );
    }

    function buildItemMenu() {
      itemMenuScroll
        .replaceChildren();

      const options = [
        {
          key:
            SELECT_ALL_KEY,
          label:
            'Select all',
          kind:
            'master'
        },
        {
          key:
            ALL_SERIES_KEY,
          label:
            'Total Medicare',
          kind:
            'total'
        },
        ...sourceData.items
          .map(item => ({
            key:
              item.item,
            label:
              item.item,
            kind:
              'item'
          }))
      ];

      options.forEach(
        option => {
          const button =
            document.createElement(
              'button'
            );

          button.type =
            'button';

          button.className =
            'item-option';

          button.dataset.key =
            option.key;

          button.setAttribute(
            'role',
            'menuitemcheckbox'
          );

          if (
            option.kind ===
              'master'
          ) {
            button.classList.add(
              'item-option-master'
            );
          }

          if (
            option.kind ===
              'total'
          ) {
            button.classList.add(
              'item-option-total'
            );
          }

          const check =
            document.createElement(
              'span'
            );

          check.className =
            'item-check';

          check.setAttribute(
            'aria-hidden',
            'true'
          );

          const label =
            document.createElement(
              'span'
            );

          label.className =
            'item-option-label';

          label.textContent =
            option.label;

          button.append(
            check,
            label
          );

          button.addEventListener(
            'click',
            event => {
              event.stopPropagation();

              if (
                option.key ===
                  SELECT_ALL_KEY
              ) {
                toggleAllSelectable();
              } else {
                toggleSelectedSeries(
                  option.key
                );
              }
            }
          );

          itemMenuScroll
            .appendChild(
              button
            );
        }
      );

      syncItemMenuSelection();
    }

    // ============================================================
    // LEGEND
    // ============================================================

    function createLegendItem(
      key
    ) {
      const item =
        document.createElement(
          'span'
        );

      item.className =
        'legend-item';

      item.dataset.key =
        key;

      const swatch =
        document.createElement(
          'span'
        );

      swatch.className =
        'legend-line';

      swatch.setAttribute(
        'aria-hidden',
        'true'
      );

      const text =
        document.createElement(
          'span'
        );

      item.append(
        swatch,
        text
      );

      syncLegendItemState(
        item,
        key
      );

      return item;
    }

    function syncLegendItemState(
      element,
      key
    ) {
      const swatch =
        element.querySelector(
          '.legend-line'
        );

      const text =
        element.querySelector(
          'span:last-child'
        );

      const colour =
        seriesColour(
          key
        );

      const shortConsult =
        isShortConsultItem(
          key
        );

      const longConsult =
        isLongConsultItem(
          key
        );

      if (swatch) {
        swatch.classList.toggle(
          'is-short-consult',
          shortConsult
        );

        swatch.style.setProperty(
          '--legend-colour',
          colour
        );

        swatch.style.background =
          shortConsult
            ? 'transparent'
            : colour;

        swatch.title =
          longConsult
            ? '28.5-minute consultation item'
            : shortConsult
              ? 'Short consultation item'
              : '';
      }

      if (text) {
        text.textContent =
          seriesLabel(
            key
          );
      }
    }

    function updateLegend(
      animate = true
    ) {
      const nextKeys =
        visibleSelectedKeys();

      const existing =
        new Map(
          Array.from(
            chartLegend.querySelectorAll(
              '.legend-item[data-key]'
            )
          ).map(
            element => [
              element.dataset.key,
              element
            ]
          )
        );

      const nextSet =
        new Set(
          nextKeys
        );

      for (
        const [key, element]
        of existing
      ) {
        if (
          !nextSet.has(
            key
          )
        ) {
          element
            .getAnimations?.()
            .forEach(
              animation =>
                animation.cancel()
            );

          element.remove();

          existing.delete(
            key
          );
        }
      }

      const fragment =
        document.createDocumentFragment();

      const added =
        [];

      nextKeys.forEach(
        key => {
          let element =
            existing.get(
              key
            );

          if (!element) {
            element =
              createLegendItem(
                key
              );

            added.push(
              element
            );
          } else {
            syncLegendItemState(
              element,
              key
            );
          }

          fragment.appendChild(
            element
          );
        }
      );

      chartLegend.appendChild(
        fragment
      );

      if (
        animate &&
        !PFF.reducedMotion()
      ) {
        added.forEach(
          element => {
            element.animate?.(
              [
                {
                  opacity: 0,
                  transform:
                    'translateX(5px)'
                },
                {
                  opacity: 1,
                  transform:
                    'translateX(0)'
                }
              ],
              {
                duration: 260,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );
          }
        );
      }

      requestAnimationFrame(
        () =>
          legendScroller?.update()
      );
    }

    // ============================================================
    // HEADING + TOOLTIP
    // ============================================================

    function headingDetailText() {
      return activeView ===
        'hours'
        ? '-billed hours'
        : ' services';
    }

    function updateHeading() {
      PFF.animateHeading({
        fixed:
          chartHeadingFixed,

        detail:
          chartHeadingDetail,

        fixedText:
          'Medicare',

        detailText:
          headingDetailText(),

        duration:
          PFF.defaults
            .microTransitionMs
      });

      headingScrollViewport
        .scrollLeft =
        0;

      requestAnimationFrame(
        () =>
          headingScroller?.update()
      );
    }

    function tooltipValue(
      rawValue
    ) {
      const value =
        Number(
          rawValue
        );

      if (
        !Number.isFinite(
          value
        )
      ) {
        return '—';
      }

      if (
        valueMode ===
          'percent'
      ) {
        return PFF.formatPercent(
          value,
          1
        );
      }

      if (
        activeView ===
          'hours'
      ) {
        return `${value.toLocaleString(
          'en-AU',
          {
            minimumFractionDigits: 0,
            maximumFractionDigits:
              Math.abs(
                value
              ) < 100
                ? 1
                : 0
          }
        )} hours`;
      }

      return `${PFF.formatInteger(
        value
      )} services`;
    }

    // ============================================================
    // CHART PLUGINS
    // ============================================================

    const yearTicksPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'pffMedicareYearTicks',

        getValue({
          index
        }) {
          return currentRows()[
            index
          ]?.year;
        }
      });

    const trendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'pffMedicareTrendLabels',

        enabled() {
          return trendMode !==
            'off';
        },

        isActive({
          chart:
            chartInstance,
          dataset,
          datasetIndex
        }) {
          return Boolean(
            dataset
              ?._activeSeries &&
            chartInstance
              .isDatasetVisible(
                datasetIndex
              )
          );
        },

        getTrendValue({
          dataset
        }) {
          return trendForSeries(
            dataset
              ._seriesKey
          );
        },

        getSeriesColour({
          dataset
        }) {
          return seriesColour(
            dataset
              ._seriesKey
          );
        }
      });

    /*
     * createUnifiedYAxis intentionally remains the source of axis tracks,
     * guides and movement. This overlay only substitutes Medicare's compact
     * k/m/b and % labels, which the current master formatter cannot yet do.
     */
    const medicareAxisLabelsPlugin = {
      id:
        'pffMedicareAxisLabels',

      afterDraw(
        chartInstance
      ) {
        if (
          !yAxisController ||
          !chartInstance
            .chartArea
        ) {
          return;
        }

        const {
          ctx,
          chartArea
        } =
          chartInstance;

        const tracks =
          yAxisController
            .majorTracks();

        const x =
          chartArea.left -
          8;

        ctx.save();

        ctx.font =
          '12px Lato, sans-serif';

        ctx.textAlign =
          'right';

        ctx.textBaseline =
          'middle';

        tracks.forEach(
          track => {
            if (
              track.alpha <=
              0.001
            ) {
              return;
            }

            const y =
              chartArea.bottom -
              chartArea.height *
                track.ratio;

            const masterText =
              PFFCharts.formatAxisValue(
                track.value,
                0
              );

            const compactText =
              formatAxisValue(
                track.value
              );

            const width =
              Math.max(
                ctx.measureText(
                  masterText
                ).width,

                ctx.measureText(
                  compactText
                ).width
              );

            ctx.globalAlpha =
              1;

            ctx.fillStyle =
              '#ffffff';

            ctx.fillRect(
              x -
                width -
                2,
              y - 8,
              width + 4,
              16
            );

            ctx.globalAlpha =
              PFF.clamp(
                track.alpha,
                0,
                1
              );

            ctx.fillStyle =
              '#151515';

            ctx.fillText(
              compactText,
              x,
              y
            );
          }
        );

        ctx.restore();

        drawAxisTitle(
          ctx,
          chartArea
        );
      }
    };

    // ============================================================
    // CHART
    // ============================================================

    function chartOptions(
      scale
    ) {
      return PFFCharts.baseChartOptions({
        animations: {
          x: {
            duration: 0
          }
        },

        plugins: {
          tooltip:
            PFFCharts.tooltipOptions({
              callbacks: {
                title(items) {
                  return items?.[0]
                    ?.label ||
                    '';
                },

                label(
                  context
                ) {
                  const valueText =
                    `${context.dataset._seriesLabel}: ${tooltipValue(context.raw)}`;

                  if (
                    trendMode ===
                      'off'
                  ) {
                    return valueText;
                  }

                  const trend =
                    trendForSeries(
                      context.dataset
                        ._seriesKey
                    );

                  if (
                    !Number.isFinite(
                      trend
                    )
                  ) {
                    return valueText;
                  }

                  const sign =
                    trend > 0
                      ? '+'
                      : trend < 0
                        ? '−'
                        : '';

                  return `${valueText} · ${sign}${Math.abs(trend).toFixed(1)}% p.a.`;
                }
              }
            })
        },

        scales: {
          x:
            PFFCharts.xYearScaleOptions(),

          y:
            PFFCharts.yScaleOptions(
              scale
            )
        }
      });
    }

    function applyDatasetVisibility() {
      chart.data.datasets
        .forEach(
          (
            dataset,
            datasetIndex
          ) => {
            const visible =
              datasetVisible(
                dataset
                  ._seriesKey
              );

            chart.setDatasetVisibility(
              datasetIndex,
              visible
            );

            dataset._activeSeries =
              visible;

            dataset.pointHoverRadius =
              visible
                ? 4
                : 0;

            dataset.pointHitRadius =
              visible
                ? (
                    PFF.mobileLayout()
                      ? 9
                      : 5
                  )
                : 0;

            dataset.pointBorderWidth =
              visible
                ? 1
                : 0;
          }
        );
    }

    function createChart() {
      currentScale =
        computeScale();

      yAxisController =
        PFFCharts.createUnifiedYAxis({
          id:
            'pffMedicareYAxis',

          getChart() {
            return chart;
          },

          getScale() {
            return currentScale;
          },

          getDecimals() {
            return 0;
          },

          getTitle() {
            return '';
          }
        });

      yAxisController
        .setImmediately(
          currentScale,
          0
        );

      yAxisController
        .setTitleImmediately(
          ''
        );

      setAxisTitleImmediately(
        yAxisTitle()
      );

      chart =
        new Chart(
          demandCanvas.getContext(
            '2d'
          ),
          {
            type:
              'line',

            data: {
              labels:
                currentRows()
                  .map(
                    row =>
                      String(
                        row.year
                      )
                  ),

              datasets:
                buildDatasets()
            },

            options:
              chartOptions(
                currentScale
              ),

            plugins: [
              yAxisController.plugin,
              yearTicksPlugin,
              trendLabelsPlugin,
              medicareAxisLabelsPlugin
            ]
          }
        );

      applyDatasetVisibility();
      updateLegend(false);
      updateAccessibleSummary();
    }

    function renderChartChange(
      reason = 'view'
    ) {
      if (!chart) {
        return;
      }

      chart.tooltip
        .setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

      const previousScale =
        yAxisController
          .currentScale();

      const previousDecimals =
        yAxisController
          .currentDecimals();

      const previousTitle =
        axisTitleState.progress <
          0.5
          ? axisTitleState.from
          : axisTitleState.to;

      const nextScale =
        computeScale();

      const nextTitle =
        yAxisTitle();

      const duration =
        PFFCharts
          .chartAnimationDuration();

      currentScale = {
        ...nextScale
      };

      chart.data.labels =
        currentRows()
          .map(
            row =>
              String(
                row.year
              )
          );

      syncChartDatasets();

      chart.options.scales.y.min =
        nextScale.min;

      chart.options.scales.y.max =
        nextScale.max;

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeInOutCubic';

      chart.options.animations.x.duration =
        0;

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeInOutCubic';

      chart.options.animations.colors.duration =
        0;

      chart.update();

      if (
        !PFFCharts.scalesNearlyEqual(
          previousScale,
          nextScale
        )
      ) {
        yAxisController.animate(
          previousScale,
          nextScale,
          {
            duration,
            fromDecimals:
              previousDecimals,
            toDecimals:
              0
          }
        );
      } else {
        yAxisController.setImmediately(
          nextScale,
          0
        );
      }

      if (
        previousTitle !==
          nextTitle
      ) {
        animateAxisTitle(
          nextTitle,
          Math.min(
            duration,
            420
          )
        );
      } else {
        setAxisTitleImmediately(
          nextTitle
        );
      }

      updateLegend(
        true
      );

      updateAccessibleSummary();
    }

    function updateAccessibleSummary() {
      if (
        !chartSummary ||
        !sourceData
          ?.rows
          ?.length
      ) {
        return;
      }

      const latest =
        sourceData.rows[
          sourceData.rows.length -
            1
        ];

      const keys =
        visibleSelectedKeys();

      const seriesText =
        keys.length
          ? keys.map(
              key => {
                const value =
                  displayMetric(
                    latest,
                    key
                  );

                return `${seriesLabel(key)} ${tooltipValue(value)}`;
              }
            ).join(
              ', '
            )
          : 'no Medicare items selected';

      const trendText =
        trendMode ===
          'off'
          ? 'Trend annotations are off.'
          : `${trendWindowSize()}-year trend annotations are on.`;

      PFFCharts.updateChartSummary(
        `${activeView === 'hours' ? 'Medicare-billed hours' : 'Medicare services'}, ${valueMode === 'percent' ? 'percentage' : 'count'} view. Latest year ${latest.year}: ${seriesText}. ${trendText}`,
        chartSummary
      );
    }

    // ============================================================
    // CONTROLS
    // ============================================================

    function setupControls() {
      tabsController =
        PFFCharts.setupTabs({
          tabList,

          tabs:
            chartTabs,

          valueAttribute:
            'view',

          initialValue:
            activeView,

          leftButton:
            tabScrollLeft,

          rightButton:
            tabScrollRight,

          onChange(
            nextView
          ) {
            if (
              !nextView ||
              nextView ===
                activeView
            ) {
              return;
            }

            activeView =
              nextView;

            menuController
              ?.closeMenu?.();

            updateHeading();

            renderChartChange(
              'view'
            );
          }
        });

      headingScroller =
        PFFCharts.setupScrollableRegion({
          scroller:
            headingScrollViewport,

          leftButton:
            headingScrollLeft,

          rightButton:
            headingScrollRight
        });

      metricController =
        PFFCharts.setupMetricSwitch({
          element:
            metricSwitch,

          buttons:
            metricButtons,

          valueAttribute:
            'metric',

          initialValue:
            valueMode,

          onChange(
            nextMode
          ) {
            if (
              !nextMode ||
              nextMode ===
                valueMode
            ) {
              return;
            }

            valueMode =
              nextMode;

            menuController
              ?.closeMenu?.();

            syncItemMenuSelection();
            updateItemButtonText();

            renderChartChange(
              'mode'
            );
          }
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,

          initialMode:
            trendMode,

          onChange(
            mode
          ) {
            trendMode =
              mode;

            chart?.draw();

            updateAccessibleSummary();
          }
        });

      legendScroller =
        PFFCharts.setupScrollableRegion({
          scroller:
            chartLegend,

          leftButton:
            legendScrollLeft,

          rightButton:
            legendScrollRight
        });

      chartInteractions =
        PFFCharts.setupChartInteractions({
          canvas:
            demandCanvas,

          getChart() {
            return chart;
          }
        });

      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },

          observe: [
            app,
            chartShell
          ],

          beforeResize(
            chartInstance
          ) {
            chartInstance
              .data
              .datasets
              .forEach(
                (
                  dataset,
                  datasetIndex
                ) => {
                  const visible =
                    chartInstance
                      .isDatasetVisible(
                        datasetIndex
                      );

                  dataset.pointHitRadius =
                    visible
                      ? (
                          PFF.mobileLayout()
                            ? 9
                            : 5
                        )
                      : 0;
                }
              );
          },

          onRefresh() {
            tabsController?.update();
            headingScroller?.update();
            legendScroller?.update();
          }
        });

      chartSummary =
        PFFCharts.ensureChartSummary({
          parent:
            app
        });
    }

    // ============================================================
    // STARTUP
    // ============================================================

    setupControls();

    PFF.initialiseApp({
      app,

      status:
        statusElement,

      load:
        loadData,

      async render(
        data
      ) {
        sourceData =
          data;

        if (
          !validSourceData(
            sourceData
          )
        ) {
          throw new Error(
            'No usable Medicare service data were found.'
          );
        }

        buildItemMenu();

        menuController =
          PFF.setupMenu({
            menu:
              itemControl,

            button:
              itemButton,

            panel:
              itemMenu,

            items:
              itemMenuScroll
                .querySelectorAll(
                  '.item-option'
                )
          });

        updateItemButtonText();
        updateHeading();
        createChart();

        tabsController?.set(
          activeView,
          {
            animate: false,
            notify: false
          }
        );

        metricController?.set(
          valueMode,
          false
        );

        trendController?.set(
          trendMode,
          false
        );

        responsiveController?.refresh();

        return chart;
      },

      onReady() {l
        loadingState
          ?.setAttribute(
            'aria-hidden',
            'true'
          );

        updateAccessibleSummary();
      }
    });
  </script>
</body>
</html>
