function cleanText(value) {

function parseDateValue(value) {

pointData = rows.map((row, rowIndex) => ({
x: row.x,
y: row.y,
rowIndex
}));
updateLegend(currentGroup);
createChart();
hideLoadingState();
setStatus(
'Live data could not be refreshed; showing the most recently saved data'
);
return;
}
console.error(lastError);
hideLoadingState();
setStatus(
'⚠ ' +
String(
lastError?.message ||
'Unable to load advertised salary data'
).replace(/\.+$/, '')
);
}
applyGrouping('none', false);
loadChart();
</script>
