<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Table</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
      --cached-amber: #c27c00;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow: hidden;
    }

    #fit {
      width: 100%;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 14px 2px 14px;
      text-align: center;
    }

    #app.is-loading .table-section {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      filter: none;
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
        transform: translateY(0);
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }

    .table-section {
      width: 100%;
      margin-top: 0;
    }

    .table-lead {
      margin: 0 0 10px;
      color: var(--ink);
      text-align: center;
    }

    .table-lead-secondary {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
    }

    .table-wrap {
      position: relative;
      width: 100%;
    }

    .table-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 24%;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .data-table th,
    .data-table td {
      position: relative;
      padding: 8px 6px;
      line-height: 1.2;
      text-align: center;
    }

    .data-table th {
      color: var(--muted);
      font-size: clamp(11px, 3.4vw, 14px);
      font-weight: 700;
      white-space: nowrap;
    }

    .data-table td {
      color: var(--ink);
      font-size: clamp(12px, 3.6vw, 15px);
      font-weight: 400;
    }

    .data-table th + th,
    .data-table td + td {
      border-left: 1px solid var(--track);
    }

    .data-table th:nth-child(2),
    .data-table td:nth-child(2) {
      border-left: 0;
    }

    .data-table .table-major-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--ink);
    }

    .data-table .table-empty-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--track);
    }

    .live-data-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #e53935;
    }

    .live-data-inline.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    .live-data-inline.is-unavailable .live-data-dot {
      background: var(--muted);
    }

    .data-table th:first-child,
    .data-table td:first-child {
      width: 24%;
    }

    .data-table td:first-child {
      font-weight: 700;
      white-space: nowrap;
    }

    .data-table td.category-corporate {
      background: #8dc4af;
    }

    .data-table td.category-independent {
      background: #c3bce9;
    }

    .data-table td.category-ophthal {
      background: #ffe9b8;
    }

    .data-table td.category-other {
      background: #eaebec;
    }

    .error {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 1px 12px;
      }

      .data-table th,
      .data-table td {
        padding: 7px 3px;
      }

      .data-table th {
        font-size: 11px;
      }

      .data-table td {
        font-size: 12px;
      }

      .app-loading {
        min-height: 155px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">

    <main id="app" class="is-loading">
      <div id="loading-state" class="app-loading" role="status" aria-label="Loading">
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading...</div>
      </div>

      <section class="table-section" aria-label="PFF table">
        <div class="table-lead">
          <p class="table-lead-secondary">New jobs in the last...:</p>
        </div>

        <div class="table-wrap">
          <table id="data-table" class="data-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID =
      '1ZcZrPHvux_ckk2cJqRYu1oz9uT4brcRmcJ80bP-v--4';

    const SHEET_NAME =
      'Mirror table';

    /*
     * B2:H contains:
     *
     * Repeat first instance
     * Repeat
     * Result
     * Date
     * Job Title
     * Employer
     * Employer Type
     */
    const RAW_RANGE =
      'B2:H';

    /*
     * Repeat = No means this is not a repeat advertisement
     * and should be included in the job totals.
     */
    const NON_DUPLICATE_VALUE =
      'No';

    const SUMMARY_CATEGORIES = [
      'Corporate',
      'Independent',
      'Ophthal',
      'Other'
    ];

    const EXPECTED_ROWS =
      1 +
      SUMMARY_CATEGORIES.length;

    const EXPECTED_COLS =
      3;

    const FETCH_TIMEOUT_MS =
      15000;

    const FETCH_MAX_ATTEMPTS =
      2;

    const FETCH_RETRY_DELAY_MS =
      1000;

    const TABLE_STORAGE_KEY =
      'pff-clinical-optom-summary-table-raw-week-v2';

    /*
     * Set to true only if you want to test
     * the locally cached summary.
     */
    const FORCE_CACHED_DATA =
      false;

    const MILLISECONDS_PER_DAY =
      24 *
      60 *
      60 *
      1000;

    const app =
      document.getElementById(
        'app'
      );

    const dataTable =
      document.getElementById(
        'data-table'
      );

    const loadingState =
      document.getElementById(
        'loading-state'
      );

    function appendLiveDataCell(
      cell,
      source = 'live'
    ) {
      const liveData =
        document.createElement(
          'span'
        );

      liveData.className =
        'live-data-inline';

      if (
        source === 'cached'
      ) {
        liveData.classList.add(
          'is-cached'
        );
      }

      if (
        source === 'unavailable'
      ) {
        liveData.classList.add(
          'is-unavailable'
        );
      }

      const dot =
        document.createElement(
          'span'
        );

      dot.className =
        'live-data-dot';

      dot.setAttribute(
        'aria-hidden',
        'true'
      );

      const text =
        document.createElement(
          'span'
        );

      if (
        source === 'cached'
      ) {
        text.textContent =
          'CACHED data';

        liveData.setAttribute(
          'aria-label',
          'Cached data'
        );
      } else if (
        source === 'unavailable'
      ) {
        text.textContent =
          'DATA unavailable';

        liveData.setAttribute(
          'aria-label',
          'Data unavailable'
        );
      } else {
        text.textContent =
          'LIVE data';

        liveData.setAttribute(
          'aria-label',
          'Live data'
        );
      }

      liveData.appendChild(
        dot
      );

      liveData.appendChild(
        text
      );

      cell.appendChild(
        liveData
      );
    }

    function appendHeaderText(
      cell,
      value
    ) {
      cell.textContent =
        String(
          value ||
          '—'
        );
    }

    function normaliseText(
      value
    ) {
      return String(
        value ||
        ''
      )
        .replace(
          /\u00A0/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        )
        .toLowerCase();
    }

    function formatCellText(
      value
    ) {
      const text =
        String(
          value ||
          ''
        )
          .replace(
            /\u00A0/g,
            ' '
          )
          .trim()
          .replace(
            /\s+/g,
            ' '
          );

      return text || '—';
    }

    function getFirstColumnCategoryClass(
      value
    ) {
      const text =
        normaliseText(
          value
        );

      if (
        text === 'corporate'
      ) {
        return 'category-corporate';
      }

      if (
        text === 'independent'
      ) {
        return 'category-independent';
      }

      if (
        text === 'ophthal'
      ) {
        return 'category-ophthal';
      }

      if (
        text === 'other'
      ) {
        return 'category-other';
      }

      return '';
    }

    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );
    }

    function renderTable(
      values,
      source = 'live'
    ) {
      hideLoadingState();

      dataTable.classList.remove(
        'error'
      );

      const thead =
        dataTable.querySelector(
          'thead'
        );

      const tbody =
        dataTable.querySelector(
          'tbody'
        );

      thead.textContent =
        '';

      tbody.textContent =
        '';

      const headers =
        values?.[0] ||
        [];

      const dataRows =
        values?.slice(1) ||
        [];

      const headerRow =
        document.createElement(
          'tr'
        );

      headers.forEach(
        (
          value,
          index
        ) => {
          const th =
            document.createElement(
              'th'
            );

          th.scope =
            'col';

          if (
            index === 0
          ) {
            appendLiveDataCell(
              th,
              source
            );
          } else {
            appendHeaderText(
              th,
              value
            );
          }

          headerRow.appendChild(
            th
          );
        }
      );

      thead.appendChild(
        headerRow
      );

      const separatorRow =
        document.createElement(
          'tr'
        );

      separatorRow.className =
        'table-major-separator';

      const separatorCell =
        document.createElement(
          'td'
        );

      separatorCell.colSpan =
        Math.max(
          headers.length,
          1
        );

      separatorRow.appendChild(
        separatorCell
      );

      thead.appendChild(
        separatorRow
      );

      dataRows.forEach(
        row => {
          const tr =
            document.createElement(
              'tr'
            );

          headers.forEach(
            (
              _,
              index
            ) => {
              const td =
                document.createElement(
                  'td'
                );

              const rawValue =
                row?.[index] ??
                '';

              td.textContent =
                formatCellText(
                  rawValue
                );

              if (
                index === 0
              ) {
                const categoryClass =
                  getFirstColumnCategoryClass(
                    rawValue
                  );

                if (
                  categoryClass
                ) {
                  td.classList.add(
                    categoryClass
                  );
                }
              }

              tr.appendChild(
                td
              );
            }
          );

          tbody.appendChild(
            tr
          );
        }
      );
    }

    function showError(
      error
    ) {
      console.error(
        error
      );

      hideLoadingState();

      renderTable(
        [
          [
            'ERROR',
            '—',
            '—'
          ],
          [
            error?.message ||
              'Could not load data',
            '—',
            '—'
          ],
          [
            '—',
            '—',
            '—'
          ],
          [
            '—',
            '—',
            '—'
          ],
          [
            '—',
            '—',
            '—'
          ]
        ],
        'unavailable'
      );

      dataTable.classList.add(
        'error'
      );
    }

    function getCellDisplayValue(
      cell
    ) {
      if (
        !cell
      ) {
        return '';
      }

      return String(
        cell.f ??
        cell.v ??
        ''
      ).trim();
    }

    function normaliseGvizRawData(
      response
    ) {
      if (
        response?.status ===
        'error'
      ) {
        throw new Error(
          response?.errors?.[0]
            ?.detailed_message ||
          'Could not load Google Sheet data'
        );
      }

      const cols =
        response?.table?.cols ||
        [];

      const rows =
        response?.table?.rows ||
        [];

      const headers =
        cols.map(
          column =>
            String(
              column?.label ??
              ''
            ).trim()
        );

      const values =
        rows.map(
          row =>
            cols.map(
              (
                _,
                index
              ) =>
                getCellDisplayValue(
                  row?.c?.[index]
                )
            )
        );

      return {
        headers,
        rows: values
      };
    }

    function findHeaderIndex(
      headers,
      wantedHeader
    ) {
      const wanted =
        normaliseText(
          wantedHeader
        );

      return headers.findIndex(
        header =>
          normaliseText(
            header
          ) === wanted
      );
    }

    /*
     * Convert DD/MM/YYYY from the Google Sheet
     * into a UTC day value.
     */
    function parseSheetDate(
      value
    ) {
      const text =
        String(
          value ||
          ''
        ).trim();

      if (
        !text
      ) {
        return null;
      }

      let match =
        text.match(
          /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

      if (
        match
      ) {
        const day =
          Number(
            match[1]
          );

        const month =
          Number(
            match[2]
          );

        const year =
          Number(
            match[3]
          );

        return Date.UTC(
          year,
          month - 1,
          day
        );
      }

      /*
       * Fallback in case GViz supplies a raw Date(...)
       * value instead of the formatted date.
       */
      match =
        text.match(
          /^(?:Date|new Date)\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/
        );

      if (
        match
      ) {
        return Date.UTC(
          Number(
            match[1]
          ),
          Number(
            match[2]
          ),
          Number(
            match[3]
          )
        );
      }

      return null;
    }

    /*
     * Return the Monday containing a supplied date.
     *
     * Sunday = 0 in JavaScript,
     * so (day + 6) % 7 converts Monday to 0.
     */
    function getMondayForDate(
      dateUtc
    ) {
      const date =
        new Date(
          dateUtc
        );

      const dayOfWeek =
        date.getUTCDay();

      const daysSinceMonday =
        (
          dayOfWeek +
          6
        ) %
        7;

      return dateUtc -
        (
          daysSinceMonday *
          MILLISECONDS_PER_DAY
        );
    }

    function addDays(
      dateUtc,
      days
    ) {
      return dateUtc +
        (
          days *
          MILLISECONDS_PER_DAY
        );
    }

    /*
     * Format a UTC date as DD/MM.
     */
    function formatShortDate(
      dateUtc
    ) {
      const date =
        new Date(
          dateUtc
        );

      const day =
        String(
          date.getUTCDate()
        ).padStart(
          2,
          '0'
        );

      const month =
        String(
          date.getUTCMonth() +
          1
        ).padStart(
          2,
          '0'
        );

      return `${day}/${month}`;
    }

    function mapEmployerCategory(
      value
    ) {
      const type =
        normaliseText(
          value
        );

      /*
       * Do not treat unknown employer types as Other.
       */
      if (
        !type ||
        type === 'xxx'
      ) {
        return null;
      }

      if (
        type === 'corporate'
      ) {
        return 'Corporate';
      }

      if (
        type === 'independent'
      ) {
        return 'Independent';
      }

      if (
        type === 'ophthalmologist' ||
        type === 'ophthalmology' ||
        type === 'ophthal' ||
        type === 'ophthal practice' ||
        type === 'opthal practice'
      ) {
        return 'Ophthal';
      }

      /*
       * Government, Hospital, University,
       * Not-for-profit and other recognised types.
       */
      return 'Other';
    }

    /*
     * Find the latest genuine job date in the imported data.
     *
     * IMPORTANT:
     * We require Result to contain a value.
     *
     * This prevents date-only helper/formula rows such as
     * 22/08/2026 with no actual job from advancing the week.
     *
     * Repeat is NOT considered here.
     * Even if every job added in a new week happened to be a
     * repeat, the tracker has still been updated and the week
     * should advance.
     */
    function findLatestRealJobDate(
      rows,
      resultIndex,
      dateIndex
    ) {
      let latestDate =
        null;

      rows.forEach(
        row => {
          const resultValue =
            String(
              row?.[
                resultIndex
              ] ??
              ''
            ).trim();

          if (
            !resultValue
          ) {
            return;
          }

          const jobDate =
            parseSheetDate(
              row?.[
                dateIndex
              ]
            );

          if (
            jobDate === null
          ) {
            return;
          }

          if (
            latestDate === null ||
            jobDate > latestDate
          ) {
            latestDate =
              jobDate;
          }
        }
      );

      return latestDate;
    }

    function buildSummaryTable(
      rawData
    ) {
      const headers =
        rawData?.headers ||
        [];

      const rows =
        rawData?.rows ||
        [];

      const repeatIndex =
        findHeaderIndex(
          headers,
          'Repeat'
        );

      const resultIndex =
        findHeaderIndex(
          headers,
          'Result'
        );

      const dateIndex =
        findHeaderIndex(
          headers,
          'Date'
        );

      const employerTypeIndex =
        findHeaderIndex(
          headers,
          'Employer Type'
        );

      if (
        repeatIndex < 0 ||
        resultIndex < 0 ||
        dateIndex < 0 ||
        employerTypeIndex < 0
      ) {
        throw new Error(
          'Required raw-data columns were not found.'
        );
      }

      /*
       * Anchor the table to the latest genuine job row,
       * NOT today's date.
       *
       * Therefore the table will not move into a new week
       * simply because Monday has arrived.
       */
      const latestRealJobDate =
        findLatestRealJobDate(
          rows,
          resultIndex,
          dateIndex
        );

      if (
        latestRealJobDate === null
      ) {
        throw new Error(
          'No valid job dates were found.'
        );
      }

      /*
       * Current displayed week:
       * Monday through Sunday.
       */
      const weekStart =
        getMondayForDate(
          latestRealJobDate
        );

      const weekEnd =
        addDays(
          weekStart,
          6
        );

      /*
       * Four-week period:
       * current Monday-based week plus
       * the preceding three full weeks.
       *
       * Example:
       * latest job = 20/08/2026
       * week       = 17/08–23/08
       * 4-weeks    = 27/07–23/08
       */
      const fourWeekStart =
        addDays(
          weekStart,
          -21
        );

      const fourWeekEnd =
        weekEnd;

      const weekHeader =
        `Week (${formatShortDate(
          weekStart
        )}–${formatShortDate(
          weekEnd
        )})`;

      const fourWeekHeader =
        `4-weeks (${formatShortDate(
          fourWeekStart
        )}–${formatShortDate(
          fourWeekEnd
        )})`;

      const counts =
        {};

      SUMMARY_CATEGORIES.forEach(
        category => {
          counts[
            category
          ] = {
            week: 0,
            fourWeeks: 0
          };
        }
      );

      rows.forEach(
        row => {
          /*
           * Count only non-repeat advertisements.
           */
          const repeatValue =
            normaliseText(
              row?.[
                repeatIndex
              ]
            );

          if (
            repeatValue !==
            normaliseText(
              NON_DUPLICATE_VALUE
            )
          ) {
            return;
          }

          /*
           * Require this to be a genuine job row.
           */
          const resultValue =
            String(
              row?.[
                resultIndex
              ] ??
              ''
            ).trim();

          if (
            !resultValue
          ) {
            return;
          }

          const jobDate =
            parseSheetDate(
              row?.[
                dateIndex
              ]
            );

          if (
            jobDate === null
          ) {
            return;
          }

          const category =
            mapEmployerCategory(
              row?.[
                employerTypeIndex
              ]
            );

          if (
            !category
          ) {
            return;
          }

          /*
           * Week:
           * Monday through Sunday, inclusive.
           */
          if (
            jobDate >= weekStart &&
            jobDate <= weekEnd
          ) {
            counts[
              category
            ].week += 1;
          }

          /*
           * Four Monday-based weeks, inclusive.
           */
          if (
            jobDate >= fourWeekStart &&
            jobDate <= fourWeekEnd
          ) {
            counts[
              category
            ].fourWeeks += 1;
          }
        }
      );

      return [
        [
          '',
          weekHeader,
          fourWeekHeader
        ],

        ...SUMMARY_CATEGORIES.map(
          category => [
            category,
            counts[
              category
            ].week,
            counts[
              category
            ].fourWeeks
          ]
        )
      ];
    }

    function saveStoredTable(
      values
    ) {
      try {
        localStorage.setItem(
          TABLE_STORAGE_KEY,
          JSON.stringify(
            values
          )
        );
      } catch (
        error
      ) {
        console.warn(
          'The latest table could not be stored.',
          error
        );
      }
    }

    function loadStoredTable() {
      try {
        const values =
          JSON.parse(
            localStorage.getItem(
              TABLE_STORAGE_KEY
            ) ||
            'null'
          );

        const isValid =
          Array.isArray(
            values
          ) &&
          values.length ===
            EXPECTED_ROWS &&
          values.every(
            row =>
              Array.isArray(
                row
              ) &&
              row.length ===
                EXPECTED_COLS
          );

        return isValid
          ? values
          : null;
      } catch (
        error
      ) {
        console.warn(
          'The stored table could not be read.',
          error
        );

        return null;
      }
    }

    function useStoredTableOrError(
      error
    ) {
      const storedValues =
        loadStoredTable();

      if (
        storedValues
      ) {
        renderTable(
          storedValues,
          'cached'
        );

        return;
      }

      showError(
        error
      );
    }

    function loadForcedCachedData() {
      const storedValues =
        loadStoredTable();

      if (
        storedValues
      ) {
        renderTable(
          storedValues,
          'cached'
        );

        return;
      }

      showError(
        new Error(
          'No cached data are available.'
        )
      );
    }

    function loadTableData(
      attempt = 1
    ) {
      const callbackName =
        `pffJobTrackerRawCallback_${
          Date.now()
        }_${
          Math.floor(
            Math.random() *
            100000
          )
        }`;

      const script =
        document.createElement(
          'script'
        );

      let settled =
        false;

      const timeout =
        window.setTimeout(
          () => {
            finish(
              new Error(
                'Could not load data'
              )
            );
          },
          FETCH_TIMEOUT_MS
        );

      function cleanup() {
        window.clearTimeout(
          timeout
        );

        try {
          delete window[
            callbackName
          ];
        } catch (
          error
        ) {
          window[
            callbackName
          ] =
            undefined;
        }

        if (
          script.parentNode
        ) {
          script.parentNode
            .removeChild(
              script
            );
        }
      }

      function retryOrUseCachedTable(
        error
      ) {
        if (
          attempt <
          FETCH_MAX_ATTEMPTS
        ) {
          window.setTimeout(
            () => {
              loadTableData(
                attempt + 1
              );
            },
            FETCH_RETRY_DELAY_MS
          );

          return;
        }

        useStoredTableOrError(
          error
        );
      }

      function finish(
        error,
        response
      ) {
        if (
          settled
        ) {
          return;
        }

        settled =
          true;

        cleanup();

        if (
          error
        ) {
          retryOrUseCachedTable(
            error
          );

          return;
        }

        try {
          const rawData =
            normaliseGvizRawData(
              response
            );

          const values =
            buildSummaryTable(
              rawData
            );

          /*
           * Cache only the small calculated summary,
           * not the full raw dataset.
           */
          saveStoredTable(
            values
          );

          renderTable(
            values,
            'live'
          );
        } catch (
          processingError
        ) {
          retryOrUseCachedTable(
            processingError
          );
        }
      }

      window[
        callbackName
      ] =
        response => {
          finish(
            null,
            response
          );
        };

      script.onerror =
        () => {
          finish(
            new Error(
              'Could not load data'
            )
          );
        };

      const params =
        new URLSearchParams({
          sheet:
            SHEET_NAME,

          range:
            RAW_RANGE,

          headers:
            '1',

          tqx:
            `responseHandler:${callbackName}`,

          _:
            String(
              Date.now()
            )
        });

      script.src =
        `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

      document.body.appendChild(
        script
      );
    }

    if (
      FORCE_CACHED_DATA
    ) {
      loadForcedCachedData();
    } else {
      loadTableData();
    }
  </script>
</body>
</html>
