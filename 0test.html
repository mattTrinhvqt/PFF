<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Best Optometry Workplaces</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --track: #e8eaf0;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --gold-bg: #fff7d9;
      --gold-border: #ead58a;
      --gold-ink: #78600a;

      --silver-bg: #f3f5f8;
      --silver-border: #d9dee6;
      --silver-ink: #657084;

      --bronze-bg: #faeee5;
      --bronze-border: #e8c9af;
      --bronze-ink: #8b5635;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      margin: 0;
      padding:
        clamp(6px, 2.5vh, 14px)
        4px
        2px;
      overflow: hidden;
      background: #fff;
      text-align: center;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      -webkit-clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation:
        blueConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation:
        greenConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation:
        redConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation:
        loadingTextPulse
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    .response-summary {
      flex: 0 0 auto;
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: clamp(2px, 1vh, 5px);
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: clamp(
        11px,
        min(3.8vw, 3.3vh),
        16px
      );
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: clamp(
        18px,
        min(6vw, 5.5vh),
        28px
      );
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      width: 100%;
      min-height: clamp(23px, 6vh, 31px);
      margin-top: 2px;
      align-items: center;
      justify-content: center;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: clamp(7px, 1.8vh, 9px);
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    h1 {
      flex: 0 0 auto;
      margin:
        clamp(7px, 4vh, 28px)
        12px
        clamp(5px, 2.5vh, 14px);
      color: var(--ink);
      font-size: clamp(
        13px,
        min(3.8vw, 3.5vh),
        18px
      );
      font-weight: 700;
      line-height: 1.2;
    }

    /*
     * This area takes all remaining embed height.
     * JavaScript changes the three row proportions according
     * to the number of employers in each box.
     */
    .podium-list {
      display: grid;
      flex: 1 1 0;
      grid-template-rows: repeat(
        3,
        minmax(0, 1fr)
      );
      gap: clamp(4px, 1.4vh, 8px);
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .podium-row {
      display: grid;
      grid-template-columns:
        clamp(
          54px,
          16vw,
          78px
        )
        minmax(
          0,
          1fr
        );
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--track);
      border-radius: clamp(4px, 1.4vh, 7px);
      text-align: left;
    }

    .medal {
      display: flex;
      min-width: 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
      padding: clamp(3px, 1.5vh, 8px);
      font-size: clamp(8px, 2.5vh, 12px);
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .result {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: clamp(0px, 0.4vh, 2px);
      padding:
        clamp(3px, 1.5vh, 10px)
        clamp(6px, 2.7vw, 14px);
      overflow: hidden;
      color: var(--ink);
      background: #fff;
      font-size: clamp(
        15px,
        3.8vw,
        18px
      );
      font-weight: 400;
      line-height: 1.2;
    }

    /*
     * Every employer remains on one line.
     * One shared font size is applied to every employer.
     */
    .employer-line {
      display: block;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      line-height: 1.2;
      text-align: left;
      white-space: nowrap;
    }

    .gold {
      border-color: var(--gold-border);
    }

    .gold .medal {
      color: var(--gold-ink);
      background: var(--gold-bg);
    }

    .silver {
      border-color: var(--silver-border);
    }

    .silver .medal {
      color: var(--silver-ink);
      background: var(--silver-bg);
    }

    .bronze {
      border-color: var(--bronze-border);
    }

    .bronze .medal {
      color: var(--bronze-ink);
      background: var(--bronze-bg);
    }

    #status {
      flex: 0 0 auto;
      max-height: 42px;
      margin: 6px 8px 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    #status[hidden] {
      display: none;
    }

    @media (max-width: 430px) {
      #app {
        padding-right: 3px;
        padding-left: 3px;
      }

      .podium-row {
        grid-template-columns:
          clamp(
            52px,
            18vw,
            70px
          )
          minmax(
            0,
            1fr
          );
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main
      id="app"
      class="is-loading"
      aria-busy="true"
    >
      <div
        id="loading-state"
        class="app-loading"
        role="status"
        aria-label="Loading"
      >
        <div class="cone-loader">
          <div
            class="cone blue"
            aria-hidden="true"
          ></div>

          <div
            class="cone green"
            aria-hidden="true"
          ></div>

          <div
            class="cone red"
            aria-hidden="true"
          ></div>
        </div>

        <div class="loader-text">
          Loading...
        </div>
      </div>

      <section
        class="response-summary"
        aria-live="polite"
      >
        <div class="response-label">
          No. of responses
        </div>

        <div class="response-value-row">
          <div
            id="response-count"
            class="response-value"
          ></div>

          <div
            id="data-source-indicator"
            class="live-data"
            aria-label="Live data"
          >
            <span
              class="live-data-dot"
              aria-hidden="true"
            ></span>

            <span id="data-source-text">LIVE data</span>
          </div>
        </div>
      </section>

      <h1>
        Best optometry workplaces
      </h1>

      <div class="podium-list">
        <section class="podium-row gold">
          <div class="medal">
            Gold
          </div>

          <div
            id="gold-text"
            class="result"
          ></div>
        </section>

        <section class="podium-row silver">
          <div class="medal">
            Silver
          </div>

          <div
            id="silver-text"
            class="result"
          ></div>
        </section>

        <section class="podium-row bronze">
          <div class="medal">
            Bronze
          </div>

          <div
            id="bronze-text"
            class="result"
          ></div>
        </section>
      </div>

      <p
        id="status"
        role="alert"
        hidden
      ></p>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID =
      '1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ';

    const SHEET_GID =
      '0';

    const RESPONSE_CELL =
      'BU2';

    const PODIUM_RANGE =
      'AL64:AL66';

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'best-optometry-workplaces';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;


    const app =
      document.getElementById(
        'app'
      );

    const loadingState =
      document.getElementById(
        'loading-state'
      );

    const responseCount =
      document.getElementById(
        'response-count'
      );

    const podiumList =
      document.querySelector(
        '.podium-list'
      );

    const dataSourceIndicator =
      document.getElementById(
        'data-source-indicator'
      );

    const dataSourceText =
      document.getElementById(
        'data-source-text'
      );

    const status =
      document.getElementById(
        'status'
      );


    const podiumRows = [
      {
        key:
          'gold'
      },

      {
        key:
          'silver'
      },

      {
        key:
          'bronze'
      }
    ];


    function setDataSource(
      source
    ) {
      const isCached =
        source ===
        'cached';


      dataSourceIndicator.hidden =
        false;


      dataSourceIndicator
        .classList
        .toggle(
          'is-cached',
          isCached
        );


      dataSourceIndicator
        .setAttribute(
          'aria-label',
          isCached
            ? 'Cached data'
            : 'Live data'
        );


      dataSourceText.textContent =
        isCached
          ? 'CACHED data'
          : 'LIVE data';
    }


    function escapeRegExp(
      text
    ) {
      return text.replace(
        /[.*+?^${}()|[\]\\]/g,
        '\\$&'
      );
    }


    function formatWorkplaceEmployers(
      value
    ) {
      let text =
        String(
          value || ''
        ).trim();


      text =
        text.replace(
          /^#(?:1|2|3)\s*/,
          ''
        );


      const protectedNames = [
        [
          'George & Matilda',
          '__GEORGE_MATILDA__'
        ]
      ];


      protectedNames.forEach(
        (
          [
            name,
            token
          ]
        ) => {
          text =
            text.replaceAll(
              name,
              token
            );
        }
      );


      const employers =
        text
          .split(
            /\s+&\s+/
          )
          .map(
            name =>
              name.trim()
          )
          .filter(
            Boolean
          )
          .map(
            name => {
              protectedNames.forEach(
                (
                  [
                    originalName,
                    token
                  ]
                ) => {
                  name =
                    name.replaceAll(
                      token,
                      originalName
                    );
                }
              );


              const visualNames = [
                [
                  'Chemist/Optometrist Warehouse',
                  'Chemist Warehouse Optometry'
                ],

                [
                  'NIB (incl. the Optical Company)',
                  'The Optical Company (incl. NIB)'
                ],

                [
                  'Teacher’s Health Fund',
                  'Teachers Health'
                ],

                [
                  'Teachers Health Fund',
                  'Teachers Health'
                ],

                [
                  'George & Matilda',
                  'George & Matilda Eyecare'
                ],

                [
                  '1001',
                  '1001 Optometry'
                ],

                [
                  'Bupa',
                  'Bupa Optical'
                ],

                [
                  'Costco',
                  'Costco Optical'
                ],

                [
                  'Dresden',
                  'Dresden Vision'
                ],

                [
                  'HCF',
                  'HCF Eyecare'
                ]
              ];


              visualNames.forEach(
                (
                  [
                    storedName,
                    displayName
                  ]
                ) => {
                  name =
                    name.replace(
                      new RegExp(
                        escapeRegExp(
                          storedName
                        ),
                        'g'
                      ),
                      displayName
                    );
                }
              );


              return name;
            }
          );


      return employers.length
        ? employers
        : [
            'No result available'
          ];
    }


    function renderWorkplaceResult(
      target,
      value
    ) {
      const employers =
        formatWorkplaceEmployers(
          value
        );

      const fragment =
        document.createDocumentFragment();


      employers.forEach(
        (
          employer,
          index
        ) => {
          const line =
            document.createElement(
              'span'
            );

          line.className =
            'employer-line';

          line.textContent =
            index <
            employers.length - 1
              ? `${employer};`
              : employer;

          fragment.appendChild(
            line
          );
        }
      );


      target.replaceChildren(
        fragment
      );
    }


    /*
     * Boxes with more employers receive proportionally more
     * of the available podium height.
     */
    function updatePodiumRowProportions() {
      const results =
        Array.from(
          document.querySelectorAll(
            '.result'
          )
        );

      const employerCounts =
        results.map(
          result =>
            Math.max(
              1,
              result.querySelectorAll(
                '.employer-line'
              ).length
            )
        );


      podiumList.style.gridTemplateRows =
        employerCounts
          .map(
            count =>
              `${count}fr`
          )
          .join(
            ' '
          );
    }


    /*
     * Calculate one shared font size that fits:
     * 1. the longest employer name horizontally; and
     * 2. every set of employer lines vertically.
     */
    function fitSharedEmployerFontSize() {
      const results =
        Array.from(
          document.querySelectorAll(
            '.result'
          )
        );

      const lines =
        Array.from(
          document.querySelectorAll(
            '.employer-line'
          )
        );


      if (
        !lines.length
      ) {
        return;
      }


      lines.forEach(
        line => {
          line.style.fontSize =
            '';
        }
      );


      const baseFontSize =
        Math.min(
          ...lines.map(
            line =>
              parseFloat(
                window
                  .getComputedStyle(
                    line
                  )
                  .fontSize
              ) || 18
          )
        );


      lines.forEach(
        line => {
          line.style.fontSize =
            `${baseFontSize}px`;
        }
      );


      let sharedFontSize =
        baseFontSize;


      /*
       * Horizontal limit: find the scale required by the
       * widest employer name.
       */
      lines.forEach(
        line => {
          if (
            line.clientWidth <=
              1 ||
            line.scrollWidth <=
              0
          ) {
            return;
          }


          const widthScale =
            line.clientWidth /
            line.scrollWidth;


          sharedFontSize =
            Math.min(
              sharedFontSize,
              baseFontSize *
              widthScale
            );
        }
      );


      /*
       * Vertical limit: make sure every employer line fits within
       * its assigned podium box.
       */
      results.forEach(
        result => {
          const resultLines =
            Array.from(
              result.querySelectorAll(
                '.employer-line'
              )
            );


          if (
            !resultLines.length
          ) {
            return;
          }


          const styles =
            window.getComputedStyle(
              result
            );

          const paddingTop =
            parseFloat(
              styles.paddingTop
            ) || 0;

          const paddingBottom =
            parseFloat(
              styles.paddingBottom
            ) || 0;

          const gap =
            parseFloat(
              styles.rowGap ||
              styles.gap
            ) || 0;

          const computedLineHeight =
            parseFloat(
              window
                .getComputedStyle(
                  resultLines[0]
                )
                .lineHeight
            ) ||
            baseFontSize *
              1.2;

          const lineHeightRatio =
            computedLineHeight /
            baseFontSize;

          const availableHeight =
            Math.max(
              1,
              result.clientHeight -
              paddingTop -
              paddingBottom -
              gap *
              Math.max(
                0,
                resultLines.length -
                1
              )
            );

          const verticalFontLimit =
            availableHeight /
            (
              resultLines.length *
              lineHeightRatio
            );


          sharedFontSize =
            Math.min(
              sharedFontSize,
              verticalFontLimit
            );
        }
      );


      sharedFontSize =
        Math.max(
          1,
          Math.floor(
            sharedFontSize *
            10
          ) /
          10
        );


      lines.forEach(
        line => {
          line.style.fontSize =
            `${sharedFontSize}px`;
        }
      );


      /*
       * Small final correction for browser rounding.
       */
      const finalWidthScale =
        Math.min(
          1,
          ...lines.map(
            line => {
              if (
                line.clientWidth <=
                  1 ||
                line.scrollWidth <=
                  0
              ) {
                return 1;
              }

              return (
                line.clientWidth /
                line.scrollWidth
              );
            }
          )
        );


      if (
        finalWidthScale <
        1
      ) {
        sharedFontSize =
          Math.max(
            1,
            sharedFontSize *
            finalWidthScale *
            0.995
          );


        lines.forEach(
          line => {
            line.style.fontSize =
              `${sharedFontSize}px`;
          }
        );
      }
    }


    let responsiveLayoutFrame =
      null;


    function refreshPodiumLayout() {
      if (
        responsiveLayoutFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveLayoutFrame
        );
      }


      responsiveLayoutFrame =
        requestAnimationFrame(
          () => {
            responsiveLayoutFrame =
              null;

            updatePodiumRowProportions();


            /*
             * Allow the new grid row proportions to be applied
             * before measuring the available line height.
             */
            requestAnimationFrame(
              fitSharedEmployerFontSize
            );
          }
        );
    }


    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      app.setAttribute(
        'aria-busy',
        'false'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );

      refreshPodiumLayout();
    }


    function getCellDisplayValue(
      cell
    ) {
      if (
        !cell
      ) {
        return '';
      }


      return String(
        cell.f ??
        cell.v ??
        ''
      ).trim();
    }


    function loadGvizRange(
      range
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `bestWorkplacesCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              'script'
            );

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'Could not load data'
                  )
                );
              },
              10000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response => {
            cleanup();


            if (
              response?.status ===
              'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }


            resolve(
              response
            );
          };


          script.onerror =
            () => {
              cleanup();

              reject(
                new Error(
                  'Could not load data'
                )
              );
            };


          const params =
            new URLSearchParams({
              gid:
                SHEET_GID,

              range,

              headers:
                '0',

              tqx:
                `responseHandler:${callbackName}`
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function loadCachedDashboard() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          if (
            !CACHE_WEB_APP_URL ||
            CACHE_WEB_APP_URL.includes(
              'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE'
            )
          ) {
            reject(
              new Error(
                'The cached-data web app URL has not been configured'
              )
            );

            return;
          }


          const callbackName =
            `bestWorkplacesCacheCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;


          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'The cached-data request timed out'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          function finish(
            error,
            response
          ) {
            if (
              settled
            ) {
              return;
            }


            settled =
              true;

            cleanup();


            if (
              error
            ) {
              reject(
                error
              );

              return;
            }


            resolve(
              response
            );
          }


          window[
            callbackName
          ] = response => {
            if (
              !response ||
              typeof response !==
                'object'
            ) {
              finish(
                new Error(
                  'The cached-data response was malformed'
                )
              );

              return;
            }


            finish(
              null,
              response
            );
          };


          script.onerror =
            () => {
              finish(
                new Error(
                  'Could not load the cached-data service'
                )
              );
            };


          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });


          const separator =
            CACHE_WEB_APP_URL.includes(
              '?'
            )
              ? '&'
              : '?';


          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function normaliseDashboard(
      responseData,
      podiumData
    ) {
      const responseCell =
        responseData
          ?.table
          ?.rows
          ?.[0]
          ?.c
          ?.[0];

      const podiumDataRows =
        podiumData
          ?.table
          ?.rows ||
        [];


      return {
        responseCount:
          getCellDisplayValue(
            responseCell
          ) ||
          '—',

        gold:
          getCellDisplayValue(
            podiumDataRows
              ?.[0]
              ?.c
              ?.[0]
          ) ||
          '',

        silver:
          getCellDisplayValue(
            podiumDataRows
              ?.[1]
              ?.c
              ?.[0]
          ) ||
          '',

        bronze:
          getCellDisplayValue(
            podiumDataRows
              ?.[2]
              ?.c
              ?.[0]
          ) ||
          ''
      };
    }


    function isUsableDashboardText(
      value
    ) {
      const text =
        String(
          value ??
          ''
        ).trim();


      return Boolean(
        text &&
        text !==
          '—'
      );
    }


    function validateDashboardData(
      data
    ) {
      const requiredFields = [
        'responseCount',
        'gold',
        'silver',
        'bronze'
      ];


      const missingField =
        requiredFields.find(
          field =>
            !isUsableDashboardText(
              data?.[
                field
              ]
            )
        );


      if (
        missingField
      ) {
        throw new Error(
          `Dashboard data is missing a usable ${missingField} value`
        );
      }


      return {
        responseCount:
          String(
            data.responseCount
          ).trim(),

        gold:
          String(
            data.gold
          ).trim(),

        silver:
          String(
            data.silver
          ).trim(),

        bronze:
          String(
            data.bronze
          ).trim()
      };
    }


    function normaliseCachedDashboard(
      response
    ) {
      if (
        response?.ok !==
        true
      ) {
        throw new Error(
          response?.error ||
          'The cached-data service did not return a snapshot'
        );
      }


      if (
        response.appKey !==
        CACHE_APP_KEY
      ) {
        throw new Error(
          'The cached-data response belongs to a different app'
        );
      }


      if (
        !response.cachedAt ||
        Number.isNaN(
          Date.parse(
            response.cachedAt
          )
        )
      ) {
        throw new Error(
          'The cached-data response has no valid timestamp'
        );
      }


      return validateDashboardData(
        response.data
      );
    }


    function renderDashboard(
      data
    ) {
      status.hidden =
        true;

      status.textContent =
        '';


      responseCount.textContent =
        data.responseCount ||
        '—';


      podiumRows.forEach(
        (
          {
            key
          }
        ) => {
          const target =
            document.getElementById(
              `${key}-text`
            );


          renderWorkplaceResult(
            target,
            data[
              key
            ]
          );
        }
      );


      hideLoadingState();
    }


    function showError(
      error
    ) {
      console.error(
        error
      );


      dataSourceIndicator.hidden =
        true;


      responseCount.textContent =
        '—';


      podiumRows.forEach(
        (
          {
            key
          }
        ) => {
          const target =
            document.getElementById(
              `${key}-text`
            );


          renderWorkplaceResult(
            target,
            '—'
          );
        }
      );


      status.hidden =
        false;

      status.textContent =
        `Unable to load results: ${
          error.message ||
          error
        }`;


      hideLoadingState();
    }


    async function loadDashboard() {
      let liveError =
        null;


      try {
        const [
          responseData,
          podiumData
        ] =
          await Promise.all([
            loadGvizRange(
              RESPONSE_CELL
            ),

            loadGvizRange(
              PODIUM_RANGE
            )
          ]);


        const liveDashboard =
          validateDashboardData(
            normaliseDashboard(
              responseData,
              podiumData
            )
          );


        setDataSource(
          'live'
        );


        renderDashboard(
          liveDashboard
        );

        return;
      } catch (
        error
      ) {
        liveError =
          error;


        console.warn(
          'Live Google Sheets data could not be used',
          error
        );
      }


      try {
        const cachedResponse =
          await loadCachedDashboard();


        const cachedDashboard =
          normaliseCachedDashboard(
            cachedResponse
          );


        setDataSource(
          'cached'
        );


        renderDashboard(
          cachedDashboard
        );
      } catch (
        cachedError
      ) {
        console.error(
          'Live Google Sheets data error',
          liveError
        );


        console.error(
          'Cached Apps Script data error',
          cachedError
        );


        showError(
          new Error(
            'Live and cached data are currently unavailable'
          )
        );
      }
    }


    let lastObservedWidth =
      0;

    let lastObservedHeight =
      0;

    let layoutResizeObserver =
      null;


    if (
      'ResizeObserver' in
      window
    ) {
      layoutResizeObserver =
        new ResizeObserver(
          entries => {
            const appEntry =
              entries.find(
                entry =>
                  entry.target ===
                  app
              );


            if (
              !appEntry
            ) {
              return;
            }


            const currentWidth =
              appEntry.contentRect.width;

            const currentHeight =
              appEntry.contentRect.height;

            const widthChanged =
              Math.abs(
                currentWidth -
                lastObservedWidth
              ) >
              0.5;

            const heightChanged =
              Math.abs(
                currentHeight -
                lastObservedHeight
              ) >
              0.5;


            if (
              currentWidth >
                1 &&
              currentHeight >
                1 &&
              (
                widthChanged ||
                heightChanged
              )
            ) {
              lastObservedWidth =
                currentWidth;

              lastObservedHeight =
                currentHeight;

              refreshPodiumLayout();
            }
          }
        );


      layoutResizeObserver.observe(
        app
      );
    }


    window.addEventListener(
      'resize',
      refreshPodiumLayout,
      {
        passive:
          true
      }
    );


    window.visualViewport
      ?.addEventListener(
        'resize',
        refreshPodiumLayout,
        {
          passive:
            true
        }
      );


    window.addEventListener(
      'pageshow',
      refreshPodiumLayout
    );


    document.addEventListener(
      'visibilitychange',
      () => {
        if (
          !document.hidden
        ) {
          refreshPodiumLayout();
        }
      }
    );


    if (
      document.fonts
        ?.ready
    ) {
      document.fonts.ready.then(
        refreshPodiumLayout
      );
    }


    document.addEventListener(
      'DOMContentLoaded',
      loadDashboard
    );
  </script>
</body>
</html>
