<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Australian Population Trends — Shared-assets pilot</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_loader.js"></script>
  <script src="./assets/pff_chart_core.js"></script>
  <!-- PFF chart migration pilot: approved visual helpers, no changes to core/data/loader. -->
  <script src="./assets/colours-and-settings.js"></script>
  <script src="./assets/chart-styling-and-defaults.js"></script>
  <script src="./assets/chart-axes-and-ticks.js"></script>
  <script src="./assets/chart-animations-and-transitions.js"></script>
  <script src="./assets/chart-legends-and-interactions.js"></script>
  <script src="./assets/chart-tooltips-and-hover.js"></script>
  <script src="./assets/chart-trends-and-labels.js"></script>
  <script src="./assets/chart-responsive-layouts-and-touch.js"></script>

  <style>

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }
    /* The shared, borderless legend occupies the existing 28px legend row. */
    #chartLegend.pff-shared-legend { height: 28px; min-height: 0; }
    #chartLegend .pff-shared-legend__viewport { height: 28px; padding-bottom: 2px; }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading Australian population data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading Australian population data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Australian population chart"
          >
            <button
              id="populationTab"
              class="chart-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              data-view="population"
            >Population</button>
          </div>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
          aria-live="polite"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">Australian population</h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3-year trend. Press to switch to 10-year trend."
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>
        </div>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <div class="legend-viewport">
            <div
              id="chartLegend"
              class="pff-population-legend-host"
              aria-label="Chart legend"
            ></div>
          </div>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="trendChart"
          aria-label="Australian population trend chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const CONFIG = {
      sheetId:
        '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE',

      sheetName:
        'Auspopnbystate',

      // Row 30 = headers; row 31 onward = raw data.
      // A = Year; J = Australia.
      range:
        'A30:J',

      localCacheKey:
        'pff-australian-population-trends-v1',

      scaleTargetIntervals:
        7
    };

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'pff-australian-population-trends';

    const AUSTRALIA_COLOUR =
      '#0b5d1e';

    // Approved modules are explicit dependencies of this pilot. Fail visibly
    // instead of silently replacing approved behaviour with older defaults.
    const shared = window.PFFModules || {};
    const requiredChartModules = {
      settings: 'colours-and-settings.js',
      chartStyling: 'chart-styling-and-defaults.js',
      chartAxes: 'chart-axes-and-ticks.js',
      chartAnimations: 'chart-animations-and-transitions.js',
      chartLegends: 'chart-legends-and-interactions.js',
      chartTooltips: 'chart-tooltips-and-hover.js',
      chartTrends: 'chart-trends-and-labels.js',
      chartResponsive: 'chart-responsive-layouts-and-touch.js'
    };
    const missingChartModules = Object.entries(requiredChartModules)
      .filter(([key]) => !shared[key])
      .map(([, filename]) => filename);

    const app =
      document.getElementById('app');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const populationTab =
      document.getElementById('populationTab');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const chartLegend =
      document.getElementById('chartLegend');

    const chartShell =
      document.getElementById('chartShell');

    const chartCanvas =
      document.getElementById('trendChart');

    let rows = [];
    let chart = null;
    let chartSummary = null;
    let seriesHidden = false;
    let tabsController = null;
    let headingScroller = null;
    let trendController = null;
    let legendController = null;
    let interactionsController = null;
    let responsiveController = null;
    let restoreTapAppearance = null;

    function populationNumber(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      const direct =
        PFFCharts.numericCell(
          cell
        );

      if (
        Number.isFinite(
          direct
        )
      ) {
        return direct;
      }

      const cleaned =
        PFF.cleanText(
          cell.f ??
          cell.v
        )
          .replace(/,/g, '')
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(
          cleaned
        )
      ) {
        return NaN;
      }

      const number =
        Number(
          cleaned
        );

      return Number.isFinite(
        number
      )
        ? number
        : NaN;
    }

    function normalisePopulationRows(sourceRows) {
      return (
        Array.isArray(sourceRows)
          ? sourceRows
          : []
      )
        .map(row => {
          const rawYear =
            Array.isArray(row)
              ? row?.[0]
              : row?.year;

          const rawValue =
            Array.isArray(row)
              ? row?.[1]
              : row?.value;

          const yearText =
            PFF.cleanText(
              rawYear
            );

          const valueText =
            PFF.cleanText(
              rawValue
            );

          return {
            year:
              yearText
                ? Number(
                    yearText.replace(
                      /,/g,
                      ''
                    )
                  )
                : NaN,

            value:
              valueText
                ? Number(
                    valueText.replace(
                      /,/g,
                      ''
                    )
                  )
                : NaN
          };
        })
        .filter(
          row =>
            Number.isFinite(
              row.year
            ) &&
            row.year >= 1900 &&
            row.year <= 2200 &&
            Number.isFinite(
              row.value
            ) &&
            row.value >= 0
        )
        .map(row => ({
          year:
            Math.round(
              row.year
            ),

          value:
            row.value
        }))
        .sort(
          (
            first,
            second
          ) =>
            first.year -
            second.year
        );
    }

    function parsePopulationTable(table) {
      const parsed = [];

      (
        table?.rows ||
        []
      ).forEach(sourceRow => {
        const cells =
          sourceRow?.c ||
          [];

        const year =
          populationNumber(
            cells[0]
          );

        const australia =
          populationNumber(
            cells[9]
          );

        if (
          !Number.isFinite(
            year
          ) ||
          year < 1900 ||
          year > 2200 ||
          !Number.isFinite(
            australia
          )
        ) {
          return;
        }

        parsed.push({
          year:
            Math.round(
              year
            ),
          value:
            australia
        });
      });

      return normalisePopulationRows(
        parsed
      );
    }

    function parseRemoteRows(snapshot) {
      return normalisePopulationRows(
        snapshot?.data?.rows
      );
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(
            raw
          );

        if (
          Array.isArray(
            parsed?.data
          ) &&
          parsed.data.length
        ) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            normalisePopulationRows(
              parsed.data
            )
          );
        }
      } catch (_) {
      }
    }

    function formatMillions(value) {
      const number =
        Number(
          value
        );

      if (
        !Number.isFinite(
          number
        )
      ) {
        return '—';
      }

      if (
        Math.abs(
          number
        ) < 0.5
      ) {
        return '0';
      }

      return `${
        PFF.formatOneDecimal(
          number /
          1000000
        )
      }m`;
    }

    function niceStep(value) {
      if (
        !Number.isFinite(
          value
        ) ||
        value <= 0
      ) {
        return 1000000;
      }

      const exponent =
        Math.floor(
          Math.log10(
            value
          )
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        value /
        magnitude;

      const multipliers =
        [
          1,
          2,
          2.5,
          5,
          10
        ];

      const multiplier =
        multipliers.find(
          candidate =>
            fraction <=
            candidate
        ) ??
        10;

      return multiplier *
        magnitude;
    }

    function populationScale() {
      const maximumObserved =
        rows.reduce(
          (
            maximum,
            row
          ) =>
            Number.isFinite(
              row?.value
            )
              ? Math.max(
                  maximum,
                  row.value
                )
              : maximum,
          0
        );

      const paddedMaximum =
        maximumObserved > 0
          ? maximumObserved *
            1.06
          : 30000000;

      const step =
        niceStep(
          paddedMaximum /
          CONFIG.scaleTargetIntervals
        );

      const max =
        Math.max(
          step,
          Math.ceil(
            paddedMaximum /
            step
          ) *
          step
        );

      return {
        min:
          0,
        max,
        step,
        intervals:
          Math.max(
            1,
            Math.round(
              max /
              step
            )
          )
      };
    }

    function trendGrowth() {
      if (
        !trendController ||
        trendController.mode ===
          'off'
      ) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        rows,
        row =>
          row.value,
        trendController.windowSize
      );
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const latest =
        rows.at(-1);

      const growth =
        trendGrowth();

      const trendText =
        Number.isFinite(
          growth
        )
          ? ` ${trendController.windowSize}-year trend ${growth >= 0 ? '+' : '−'}${Math.abs(growth).toFixed(1)}% per year.`
          : '';

      PFFCharts.updateChartSummary(
        latest
          ? `Australian population. Latest value ${PFF.formatInteger(latest.value)} in ${latest.year}.${trendText}`
          : 'Australian population chart.',
        chartSummary
      );
    }

    function yScaleOptions() {
      const scale =
        populationScale();

      const halfStep =
        scale.step /
        2;

      return PFFCharts.yScaleOptions(
        scale,
        {
          border: {
            display:
              false
          },

          grid: {
            display:
              true,
            drawOnChartArea:
              true,
            drawTicks:
              true,
            tickColor:
              '#151515',
            tickWidth:
              1,
            tickLength(context) {
              const index =
                context.index ??
                0;

              return index % 2 === 0
                ? shared.chartAxes.defaults.tickLength
                : shared.chartAxes.defaults.minorTickLength;
            },
            color(context) {
              const index =
                context.index ??
                0;

              return index % 2 === 0
                ? shared.chartStyling.palette.gridMajor
                : shared.chartStyling.palette.gridMinor;
            },
            lineWidth(context) {
              const index =
                context.index ??
                0;

              return index % 2 === 0
                ? shared.chartAxes.defaults.tickWidth
                : shared.chartAxes.defaults.minorTickWidth;
            }
          },

          ticks: {
            display:
              true,
            autoSkip:
              false,
            stepSize:
              halfStep,
            color:
              '#151515',
            padding:
              3,
            font: {
              family:
                'Lato',
              size:
                12,
              weight:
                '400'
            },
            callback(
              value,
              index
            ) {
              return index % 2 === 0
                ? formatMillions(
                    value
                  )
                : '';
            }
          },

          title: {
            display:
              true,
            text:
              'Population',
            color:
              '#151515',
            padding: {
              bottom:
                4
            },
            font: {
              family:
                'Lato',
              size:
                PFF.mobileLayout()
                  ? 12
                  : 13,
              weight:
                '700'
            }
          }
        }
      );
    }

    // Keep the existing custom spines; use native 6px/2px X-axis ticks
    // rather than also installing the legacy manual year-tick painter.
    const axisSpinesPlugin =
      PFFCharts.createAxisSpinesPlugin({
        id: 'populationAxisSpines'
      });

    // The approved shared 22%-backed annual-trend pills replace the old
    // trend-label plugin; the original 3yr/10yr/off calculations are retained.
    const trendLabelsPlugin = shared.chartTrends.createTrendPillsPlugin({
      id: 'populationTrendLabels',
      enabled() { return trendController?.mode !== 'off'; },
      getTrendValue() { return trendGrowth(); },
      getSeriesColour() { return AUSTRALIA_COLOUR; }
    });

    function buildDataset() {
      // Opt into the common line style but retain this graph's pre-existing
      // 3px stroke, hidden resting points and monotone interpolation.
      return PFFCharts.lineDataset({
        ...shared.chartStyling.getLineStyle({
          borderWidth: 3, pointRadius: 0, pointHoverRadius: 4,
          tension: 0.28
        }),
        label:
          'Australia',

        _seriesLabel:
          'Australia',

        _activeSeries:
          !seriesHidden,

        data:
          rows.map(
            row =>
              row.value
          ),

        colour:
          AUSTRALIA_COLOUR,

        pointBorderColor:
          '#ffffff',

        pointBorderWidth:
          1,

        pointHitRadius:
          shared.chartResponsive.getPointHitRadius(),

        borderCapStyle:
          'round',

        borderJoinStyle:
          'round',

        cubicInterpolationMode:
          'monotone',

        hidden:
          seriesHidden
      });
    }

    function createChart() {
      // Keep all PFFCharts data/scale functions. Apply the new modules only
      // to chart appearance, interactions and animation configuration.
      const xScale = shared.chartAxes.withXAxisTickMarks(
        PFFCharts.xYearScaleOptions(),
        { yearMode: 'even' }
      );
      const yScale = shared.chartAxes.withStableAxis(yScaleOptions());

      const tooltip = shared.chartTooltips.tooltipOptions({
          callbacks: {
                title(items) {
                  const index =
                    items?.[0]?.dataIndex;

                  return Number.isInteger(
                    index
                  )
                    ? String(
                        rows?.[index]?.year ??
                        ''
                      )
                    : '';
                },

                label(context) {
                  const value =
                    Number(
                      context.raw
                    );

                  const valueText =
                    `Australia: ${PFF.formatInteger(value)}`;

                  const growth =
                    trendGrowth();

                  if (
                    !Number.isFinite(
                      growth
                    )
                  ) {
                    return valueText;
                  }

                  const sign =
                    growth > 0
                      ? '+'
                      : growth < 0
                        ? '−'
                        : '';

                  return `${valueText} · ${sign}${Math.abs(growth).toFixed(1)}% p.a.`;
                }
              }
      });

      let options = PFFCharts.baseChartOptions({
        interaction: shared.chartTooltips.interactionOptions('line'),
        elements: shared.chartTooltips.subtleEmphasisOptions(),
        plugins: { tooltip },
        scales: { x: xScale, y: yScale }
      });

      // Both the Chart.js animation and the inherited x/y property animations
      // must use 600ms; otherwise the old core's 900ms properties win.
      options = shared.chartAnimations.withChartJsTiming(options);
      const duration = shared.chartAnimations.defaults.chartMs;
      options.animations = {
        ...options.animations,
        x: { ...(options.animations?.x || {}), duration, easing: 'easeInOutCubic' },
        y: { ...(options.animations?.y || {}), duration, easing: 'easeInOutCubic' }
      };
      options.devicePixelRatio = shared.chartResponsive.getLayout().devicePixelRatio;

      // This graph uses a single value-axis grid (no custom grid painter).
      // Retain its established alternating faint major/minor levels.
      const chartConfig = shared.chartStyling.styleChartConfig({
        type: 'line',
        data: {
          labels: rows.map(row => String(row.year)),
          datasets: [buildDataset()]
        },
        options,
        plugins: [
          trendLabelsPlugin,
          axisSpinesPlugin,
          {
            id: 'pffTooltipTopLayer',
            afterDraw(chartInstance) {
              const tip = chartInstance?.tooltip;
              if (tip && Number(tip.opacity) > 0) tip.draw(chartInstance.ctx);
            }
          }
        ]
      });

      chartConfig.options.scales.y.grid = {
        ...chartConfig.options.scales.y.grid,
        color(context) {
          return (context.index ?? 0) % 2 === 0
            ? shared.chartStyling.palette.gridMajor
            : shared.chartStyling.palette.gridMinor;
        },
        lineWidth(context) {
          return (context.index ?? 0) % 2 === 0
            ? shared.chartAxes.defaults.tickWidth
            : shared.chartAxes.defaults.minorTickWidth;
        }
      };

      chart = new Chart(chartCanvas.getContext('2d'), chartConfig);
      updateAccessibleSummary();
    }

    function setupControls() {
      tabsController =
        PFF.setupTabs({
          tabList,
          tabs: [
            populationTab
          ],
          valueAttribute:
            'view',
          initialValue:
            'population'
        });

      headingScroller =
        PFF.setupScrollableRegion({
          scroller:
            headingScrollViewport,
          leftButton:
            headingScrollLeft,
          rightButton:
            headingScrollRight
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,
          initialMode:
            '3yr',
          onChange() {
            chart?.draw();
            updateAccessibleSummary();
          }
        });

      // Mount exactly one legend controller. Do not retain the old
      // PFFCharts.setupLegend handler on the same DOM element.
      legendController = shared.chartLegends.mount({
        root: chartLegend,
        getChart() { return chart; },
        items: [{
          id: 'Australia', datasetIndex: 0,
          label: 'Australia', colour: AUSTRALIA_COLOUR,
          markerType: 'line', visible: !seriesHidden
        }],
        onToggle({ visible }) {
          seriesHidden = !visible;
          updateAccessibleSummary();
        }
      });

      interactionsController =
        PFFCharts.setupChartInteractions({
          canvas:
            chartCanvas,
          getChart() {
            return chart;
          }
        });
    }

    if (missingChartModules.length) {
      const message = `Shared chart assets missing: ${missingChartModules.join(', ')}`;
      console.error('[PFF population pilot]', message);
      const loaderMessage = document.querySelector('#loadingState .loader-text');
      if (loaderMessage) loaderMessage.textContent = message;
      throw new Error(message);
    }

    restoreTapAppearance = shared.chartResponsive.suppressTapFlash(chartCanvas);
    migrateLegacyLocalCache();
    setupControls();

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      loadLive() {
        return PFFCharts.loadGVizSheet({
          sheetId:
            CONFIG.sheetId,
          sheetName:
            CONFIG.sheetName,
          range:
            CONFIG.range,
          headers:
            '1'
        });
      },

      parseLive:
        parsePopulationTable,

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,
          appKey:
            CACHE_APP_KEY
        });
      },

      parseRemoteCache:
        parseRemoteRows,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        3,

      onLiveError(error) {
        console.warn(
          'Live Australian population data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(error) {
        console.warn(
          'Apps Script Australian population cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,
        text:
          dataSourceText
      },

      render(loaded) {
        rows =
          normalisePopulationRows(
            loaded.rows
          );

        chartSummary =
          PFFCharts.ensureChartSummary({
            canvas:
              chartCanvas,
            id:
              'populationChartSummary'
          });

        createChart();
        legendController.refresh();
        tabsController.update();
        headingScroller.update();

        // Reuse the original lifecycle/resize observer (no duplicate observer)
        // while applying the approved responsive geometry on every refresh.
        responsiveController = PFFCharts.createResponsiveController({
          getChart() { return chart; },
          observe: [app, chartShell],
          applyResponsiveChartOptions: false,
          beforeResize(chartInstance) {
            const layout = shared.chartResponsive.getLayout();
            chartInstance.options.interaction =
              shared.chartTooltips.interactionOptions('line');
            chartInstance.options.layout.padding.top = layout.topPadding;
            chartInstance.options.scales.x.ticks.font.size = layout.tickFontSize;
            chartInstance.options.scales.x.title.font.size = layout.titleFontSize;
            chartInstance.options.scales.y.afterFit =
              shared.chartAxes.lockAxisWidth(null);
            if (chartInstance.data.datasets[0]) {
              chartInstance.data.datasets[0].pointHitRadius =
                layout.pointHitRadius;
            }
          },
          onRefresh() {
            tabsController?.update();
            headingScroller?.update();
            legendController?.updateArrows();
          }
        });

        return chart;
      },

      errorMessage:
        'Australian population data unavailable.'
    });
