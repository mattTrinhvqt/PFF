<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Population Location Trends</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js"></script>

  <style>
    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .yoy-trend-toggle.is-hidden {
      display: none;
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading population location data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading population location data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Population location grouping"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              data-group="state"
            >State</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-group="rurality"
            >Rurality</button>
          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"
            type="button"
            aria-label="Scroll tabs right"
          >›</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
          aria-live="polite"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">
              <span id="chartHeadingFixed" class="chart-heading-fixed">Population by&nbsp;</span>
              <span id="chartHeadingDetail" class="chart-heading-detail">state</span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3-year trend. Press to switch to 10-year trend."
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>

          <div
            id="metricSwitch"
            class="metric-switch"
            role="group"
            aria-label="Display metric"
          >
            <button
              class="metric-button is-active"
              type="button"
              data-metric="count"
            >Count</button>

            <button
              class="metric-button"
              type="button"
              data-metric="share"
            >%</button>
          </div>
        </div>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >‹</button>

          <div class="legend-viewport">
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Chart legend"
            ></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >›</button>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="trendChart"
          aria-label="Australian population location trend chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      sheetId:
        '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE',

      stateSheet:
        'Auspopnbystate',

      stateRange:
        'A30:J',

      ruralitySheet:
        'AuspopnbyMMM',

      ruralityRange:
        'A30:I',

      localCacheKey:
        'pff-population-location-v1'
    });

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    /*
     * The population-location app shares the existing population cache
     * snapshot. Backend 1 is extended below so this same snapshot also
     * contains stateRows and ruralityRows.
     */
    const CACHE_APP_KEY =
      'pff-australian-population-trends';

    const STATE_LABELS = Object.freeze([
      'NSW',
      'VIC',
      'QLD',
      'SA',
      'WA',
      'TAS',
      'NT',
      'ACT'
    ]);

    const STATE_COLOURS = Object.freeze([
      '#2db7f5',
      '#2d3a8c',
      '#7a0036',
      '#f03a47',
      '#000000',
      '#22a36b',
      '#c25e00',
      '#7b61ff'
    ]);

    const RURALITY_LABELS = Object.freeze([
      'Metro',
      'Non-metro'
    ]);

    const RURALITY_COLOURS = Object.freeze([
      '#30475d',
      '#b54a0a'
    ]);

    const SERIES_SLOT_COUNT =
      STATE_LABELS.length;

    const app =
      document.getElementById('app');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartTabs =
      Array.from(
        document.querySelectorAll('.chart-tab')
      );

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const chartHeadingFixed =
      document.getElementById('chartHeadingFixed');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const metricSwitch =
      document.getElementById('metricSwitch');

    const metricButtons =
      Array.from(
        document.querySelectorAll('.metric-button')
      );

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartShell =
      document.getElementById('chartShell');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const chartCanvas =
      document.getElementById('trendChart');

    let sourceData = {
      state: [],
      rurality: []
    };

    let activeGroup =
      'state';

    let activeMetric =
      'count';

    let chart =
      null;

    let chartSummary =
      null;

    let tabsController =
      null;

    let headingScroller =
      null;

    let metricController =
      null;

    let trendController =
      null;

    let legendController =
      null;

    let interactionsController =
      null;

    let responsiveController =
      null;

    let yAxisController =
      null;

    let lastYAxisTitle =
      'Population';

    const hiddenSeriesByGroup =
      new Map();

    function groupLabels(group = activeGroup) {
      return group === 'state'
        ? STATE_LABELS
        : RURALITY_LABELS;
    }

    function groupColours(group = activeGroup) {
      return group === 'state'
        ? STATE_COLOURS
        : RURALITY_COLOURS;
    }

    function groupRows(group = activeGroup) {
      return sourceData[group] || [];
    }

    function hiddenSeriesSet(group = activeGroup) {
      if (
        !hiddenSeriesByGroup.has(
          group
        )
      ) {
        hiddenSeriesByGroup.set(
          group,
          new Set()
        );
      }

      return hiddenSeriesByGroup.get(
        group
      );
    }

    function dataNumber(value) {
      if (
        value &&
        typeof value === 'object' &&
        (
          Object.prototype.hasOwnProperty.call(value, 'v') ||
          Object.prototype.hasOwnProperty.call(value, 'f')
        )
      ) {
        const direct =
          PFFCharts.numericCell(
            value
          );

        if (
          Number.isFinite(
            direct
          )
        ) {
          return direct;
        }

        value =
          value.f ??
          value.v;
      }

      const cleaned =
        PFF.cleanText(
          value
        )
          .replace(/,/g, '')
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(
          cleaned
        )
      ) {
        return NaN;
      }

      const number =
        Number(
          cleaned
        );

      return Number.isFinite(
        number
      )
        ? number
        : NaN;
    }

    function normaliseViewRows(
      sourceRows,
      group,
      expectedValueCount
    ) {
      return (
        Array.isArray(sourceRows)
          ? sourceRows
          : []
      )
        .map(row => {
          if (
            !row ||
            row.group !== group
          ) {
            return null;
          }

          const year =
            Number(
              row.year
            );

          const values =
            Array.from(
              row.values || []
            )
              .slice(
                0,
                expectedValueCount
              )
              .map(Number);

          if (
            !Number.isFinite(year) ||
            year < 2000 ||
            year > 2100 ||
            values.length !== expectedValueCount ||
            values.some(
              value =>
                !Number.isFinite(
                  value
                )
            )
          ) {
            return null;
          }

          return {
            year:
              Math.round(
                year
              ),
            values
          };
        })
        .filter(Boolean)
        .sort(
          (
            first,
            second
          ) =>
            first.year -
            second.year
        );
    }

    function splitCombinedRows(combinedRows) {
      return {
        state:
          normaliseViewRows(
            combinedRows,
            'state',
            STATE_LABELS.length
          ),

        rurality:
          normaliseViewRows(
            combinedRows,
            'rurality',
            RURALITY_LABELS.length
          )
      };
    }

    function combineSourceData(data) {
      const state =
        normaliseViewRows(
          (data?.state || []).map(
            row => ({
              group:
                'state',
              year:
                row.year,
              values:
                row.values
            })
          ),
          'state',
          STATE_LABELS.length
        );

      const rurality =
        normaliseViewRows(
          (data?.rurality || []).map(
            row => ({
              group:
                'rurality',
              year:
                row.year,
              values:
                row.values
            })
          ),
          'rurality',
          RURALITY_LABELS.length
        );

      return [
        ...state.map(
          row => ({
            group:
              'state',
            year:
              row.year,
            values:
              [...row.values]
          })
        ),
        ...rurality.map(
          row => ({
            group:
              'rurality',
            year:
              row.year,
            values:
              [...row.values]
          })
        )
      ];
    }

    function validSourceData(data) {
      return Boolean(
        data &&
        Array.isArray(data.state) &&
        Array.isArray(data.rurality) &&
        data.state.length >= 3 &&
        data.rurality.length >= 3
      );
    }

    function validateCombinedRows(combinedRows) {
      const split =
        splitCombinedRows(
          combinedRows
        );

      if (
        !validSourceData(
          split
        )
      ) {
        throw new Error(
          'Population location data were incomplete.'
        );
      }

      return [
        ...split.state.map(
          row => ({
            group:
              'state',
            year:
              row.year,
            values:
              [...row.values]
          })
        ),
        ...split.rurality.map(
          row => ({
            group:
              'rurality',
            year:
              row.year,
            values:
              [...row.values]
          })
        )
      ];
    }

    function parseStateTable(table) {
      const rows = [];

      (
        table?.rows || []
      ).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          dataNumber(
            cells[0]
          );

        const values =
          Array.from(
            {
              length:
                STATE_LABELS.length
            },
            (_, index) =>
              dataNumber(
                cells[index + 1]
              ) /
              1000000
          );

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          values.some(
            value =>
              !Number.isFinite(
                value
              )
          )
        ) {
          return;
        }

        rows.push({
          group:
            'state',
          year:
            Math.round(
              year
            ),
          values
        });
      });

      return rows;
    }

    function parseRuralityTable(table) {
      const rows = [];

      (
        table?.rows || []
      ).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          dataNumber(
            cells[0]
          );

        const metro =
          dataNumber(
            cells[1]
          );

        const nonMetro =
          dataNumber(
            cells[8]
          );

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          !Number.isFinite(metro) ||
          !Number.isFinite(nonMetro)
        ) {
          return;
        }

        rows.push({
          group:
            'rurality',
          year:
            Math.round(
              year
            ),
          values: [
            metro,
            nonMetro
          ]
        });
      });

      return rows;
    }

    function parseLiveData(raw) {
      const combined = [
        ...parseStateTable(
          raw?.stateTable
        ),
        ...parseRuralityTable(
          raw?.ruralityTable
        )
      ];

      return validateCombinedRows(
        combined
      );
    }

    function parseRemoteStateRows(sourceRows) {
      return (
        Array.isArray(sourceRows)
          ? sourceRows
          : []
      )
        .map(row => {
          const year =
            dataNumber(
              row?.[0]
            );

          const values =
            Array.from(
              {
                length:
                  STATE_LABELS.length
              },
              (_, index) =>
                dataNumber(
                  row?.[index + 1]
                ) /
                1000000
            );

          if (
            !Number.isFinite(year) ||
            year < 2000 ||
            year > 2100 ||
            values.some(
              value =>
                !Number.isFinite(
                  value
                )
            )
          ) {
            return null;
          }

          return {
            group:
              'state',
            year:
              Math.round(
                year
              ),
            values
          };
        })
        .filter(Boolean);
    }

    function parseRemoteRuralityRows(sourceRows) {
      return (
        Array.isArray(sourceRows)
          ? sourceRows
          : []
      )
        .map(row => {
          const year =
            dataNumber(
              row?.[0]
            );

          const metro =
            dataNumber(
              row?.[1]
            );

          const nonMetro =
            dataNumber(
              row?.[8]
            );

          if (
            !Number.isFinite(year) ||
            year < 2000 ||
            year > 2100 ||
            !Number.isFinite(metro) ||
            !Number.isFinite(nonMetro)
          ) {
            return null;
          }

          return {
            group:
              'rurality',
            year:
              Math.round(
                year
              ),
            values: [
              metro,
              nonMetro
            ]
          };
        })
        .filter(Boolean);
    }

    function parseRemoteCache(snapshot) {
      const combined = [
        ...parseRemoteStateRows(
          snapshot?.data?.stateRows
        ),
        ...parseRemoteRuralityRows(
          snapshot?.data?.ruralityRows
        )
      ];

      return validateCombinedRows(
        combined
      );
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(
            raw
          );

        if (
          Array.isArray(
            parsed?.rows
          )
        ) {
          return;
        }

        if (
          validSourceData(
            parsed?.data
          )
        ) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            combineSourceData(
              parsed.data
            )
          );
        }
      } catch (_) {
      }
    }

    function shareRows(viewRows) {
      return viewRows.map(row => {
        const total =
          row.values.reduce(
            (
              sum,
              value
            ) =>
              sum +
              (
                Number.isFinite(value)
                  ? value
                  : 0
              ),
            0
          );

        return {
          year:
            row.year,
          values:
            row.values.map(
              value =>
                total > 0
                  ? value /
                    total *
                    100
                  : NaN
            )
        };
      });
    }

    function viewRows() {
      const rows =
        groupRows();

      return activeMetric === 'share'
        ? shareRows(
            rows
          )
        : rows;
    }

    function currentViewConfig() {
      if (
        activeGroup === 'state' &&
        activeMetric === 'count'
      ) {
        return {
          scale: {
            min:
              0,
            max:
              10,
            intervals:
              5
          },
          yTitle:
            'Population'
        };
      }

      if (
        activeGroup === 'rurality' &&
        activeMetric === 'count'
      ) {
        return {
          scale: {
            min:
              0,
            max:
              25,
            intervals:
              5
          },
          yTitle:
            'Population'
        };
      }

      if (
        activeGroup === 'state' &&
        activeMetric === 'share'
      ) {
        return {
          scale: {
            min:
              0,
            max:
              40,
            intervals:
              4
          },
          yTitle:
            '% of population'
        };
      }

      return {
        scale: {
          min:
            0,
          max:
            100,
          intervals:
            5
        },
        yTitle:
          '% of population'
      };
    }

    function formatYAxisValue(value) {
      const number =
        Number(
          value
        );

      if (
        !Number.isFinite(
          number
        )
      ) {
        return '';
      }

      if (
        activeMetric === 'share'
      ) {
        return `${Math.round(number)}%`;
      }

      if (
        Math.abs(number) <
        0.0000005
      ) {
        return '0';
      }

      return `${Math.round(number)}m`;
    }

    function latestTrendForSeries(seriesIndex) {
      if (
        activeMetric !== 'count' ||
        !trendController ||
        trendController.mode === 'off'
      ) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        groupRows(),
        row =>
          row.values[
            seriesIndex
          ],
        trendController.windowSize
      );
    }

    function updateTrendVisibility() {
      const hidden =
        activeMetric !== 'count';

      yoyTrendToggle.classList.toggle(
        'is-hidden',
        hidden
      );

      yoyTrendToggle.setAttribute(
        'aria-hidden',
        String(hidden)
      );
    }

    function updateHeading() {
      const detailText =
        `${
          activeGroup === 'state'
            ? 'state'
            : 'rurality'
        }${
          activeMetric === 'share'
            ? ' (%)'
            : ''
        }`;

      PFF.animateHeading({
        fixed:
          chartHeadingFixed,
        detail:
          chartHeadingDetail,
        fixedText:
          'Population by\u00a0',
        detailText
      });

      headingScrollViewport.scrollLeft =
        0;

      requestAnimationFrame(
        () =>
          headingScroller?.update()
      );
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const latest =
        groupRows().at(-1);

      if (!latest) {
        PFFCharts.updateChartSummary(
          'Australian population location chart.',
          chartSummary
        );
        return;
      }

      const labels =
        groupLabels();

      const hidden =
        hiddenSeriesSet();

      const visibleLabels =
        labels.filter(
          label =>
            !hidden.has(
              label
            )
        );

      const metricText =
        activeMetric === 'share'
          ? 'percentage share'
          : 'population count';

      const trendText =
        activeMetric === 'count' &&
        trendController?.mode !== 'off'
          ? ` ${trendController.windowSize}-year trend labels are on.`
          : '';

      PFFCharts.updateChartSummary(
        `Population by ${activeGroup}, ${metricText}. Latest year ${latest.year}. Visible series: ${visibleLabels.join(', ')}.${trendText}`,
        chartSummary
      );
    }

    function datasetForSlot(slotIndex) {
      const rows =
        viewRows();

      const labels =
        groupLabels();

      const colours =
        groupColours();

      const hidden =
        hiddenSeriesSet();

      const active =
        slotIndex <
        labels.length;

      const label =
        active
          ? labels[
              slotIndex
            ]
          : `slot-${slotIndex}`;

      const colour =
        active
          ? colours[
              slotIndex
            ]
          : '#69718a';

      const fallbackValues =
        rows.map(
          row =>
            row.values[0]
        );

      const data =
        active
          ? rows.map(
              row =>
                row.values[
                  slotIndex
                ]
            )
          : fallbackValues;

      const visible =
        active &&
        !hidden.has(
          label
        );

      return PFFCharts.lineDataset({
        label,
        _seriesLabel:
          label,
        _slotActive:
          active,
        _activeSeries:
          visible,
        data,
        colour,
        pointBorderColor:
          '#ffffff',
        pointBorderWidth:
          active
            ? 1
            : 0,
        cubicInterpolationMode:
          'monotone',
        hidden:
          !visible
      });
    }

    function buildDatasets() {
      return Array.from(
        {
          length:
            SERIES_SLOT_COUNT
        },
        (_, index) =>
          datasetForSlot(
            index
          )
      );
    }

    function applyDatasetVisibility() {
      if (!chart) {
        return;
      }

      const labels =
        groupLabels();

      const hidden =
        hiddenSeriesSet();

      chart.data.datasets.forEach(
        (
          dataset,
          index
        ) => {
          const active =
            index <
            labels.length;

          const label =
            active
              ? labels[index]
              : dataset._seriesLabel;

          const visible =
            active &&
            !hidden.has(
              label
            );

          dataset._slotActive =
            active;

          dataset._activeSeries =
            visible;

          chart.setDatasetVisibility(
            index,
            visible
          );
        }
      );
    }

    function syncDatasets() {
      if (!chart) {
        return;
      }

      const next =
        buildDatasets();

      next.forEach(
        (
          dataset,
          index
        ) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] =
              dataset;
            return;
          }

          Object.assign(
            current,
            dataset
          );
        }
      );

      applyDatasetVisibility();
    }

    function tooltipLabel(context) {
      const dataset =
        context.dataset;

      if (
        !dataset?._slotActive
      ) {
        return '';
      }

      const value =
        Number(
          context.raw
        );

      if (
        activeMetric === 'share'
      ) {
        return `${dataset._seriesLabel}: ${PFF.formatOneDecimal(value)}%`;
      }

      const population =
        PFF.formatInteger(
          value *
          1000000
        );

      const trend =
        latestTrendForSeries(
          context.datasetIndex
        );

      if (
        !Number.isFinite(
          trend
        )
      ) {
        return `${dataset._seriesLabel}: ${population}`;
      }

      const sign =
        trend > 0
          ? '+'
          : trend < 0
            ? '−'
            : '';

      return `${dataset._seriesLabel}: ${population} · ${sign}${Math.abs(trend).toFixed(1)}% p.a.`;
    }

    const yearTickPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'populationLocationYearTicks'
      });

    const trendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'populationLocationTrendLabels',

        enabled() {
          return (
            activeMetric === 'count' &&
            trendController?.mode !== 'off'
          );
        },

        isActive({
          chart: chartInstance,
          dataset,
          datasetIndex
        }) {
          return Boolean(
            dataset?._slotActive &&
            chartInstance.isDatasetVisible(
              datasetIndex
            )
          );
        },

        getTrendValue({
          datasetIndex
        }) {
          return latestTrendForSeries(
            datasetIndex
          );
        }
      });

    function createChart() {
      const config =
        currentViewConfig();

      yAxisController =
        PFFCharts.createUnifiedYAxis({
          id:
            'populationLocationYAxis',

          getChart() {
            return chart;
          },

          getScale() {
            return currentViewConfig()
              .scale;
          },

          getDecimals() {
            return 0;
          },

          getTitle() {
            return currentViewConfig()
              .yTitle;
          },

          formatValue(value) {
            return formatYAxisValue(
              value
            );
          }
        });

      const options =
        PFFCharts.baseChartOptions({
          normalized:
            true,

          transitions:
            PFFCharts.seriesVisibilityTransitionOptions(),

          plugins: {
            tooltip: {
              callbacks: {
                title(items) {
                  return items?.[0]?.label || '';
                },

                label(context) {
                  return tooltipLabel(
                    context
                  );
                }
              }
            }
          },

          scales: {
            x:
              PFFCharts.xYearScaleOptions(),

            y:
              PFFCharts.yScaleOptions(
                config.scale
              )
          }
        });

      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type:
              'line',

            data: {
              labels:
                viewRows().map(
                  row =>
                    String(
                      row.year
                    )
                ),

              datasets:
                buildDatasets()
            },

            options,

            plugins: [
              yAxisController.plugin,
              trendLabelsPlugin,
              yearTickPlugin
            ]
          }
        );

      applyDatasetVisibility();

      lastYAxisTitle =
        config.yTitle;

      updateAccessibleSummary();
    }

    function renderCurrentChart() {
      if (!chart) {
        return;
      }

      const previousScale =
        yAxisController.currentScale();

      const previousTitle =
        lastYAxisTitle;

      const config =
        currentViewConfig();

      chart.data.labels =
        viewRows().map(
          row =>
            String(
              row.year
            )
        );

      syncDatasets();

      chart.options.scales.y.min =
        config.scale.min;

      chart.options.scales.y.max =
        config.scale.max;

      yAxisController.animate(
        previousScale,
        config.scale
      );

      if (
        previousTitle !==
        config.yTitle
      ) {
        yAxisController.animateTitle(
          previousTitle,
          config.yTitle
        );
      }

      lastYAxisTitle =
        config.yTitle;

      chart.update();

      legendController?.render();
      updateAccessibleSummary();
    }

    function setGroup(nextGroup) {
      if (
        ![
          'state',
          'rurality'
        ].includes(
          nextGroup
        ) ||
        nextGroup ===
          activeGroup
      ) {
        return;
      }

      activeGroup =
        nextGroup;

      updateHeading();
      renderCurrentChart();
    }

    function setMetric(nextMetric) {
      if (
        ![
          'count',
          'share'
        ].includes(
          nextMetric
        ) ||
        nextMetric ===
          activeMetric
      ) {
        return;
      }

      activeMetric =
        nextMetric;

      updateTrendVisibility();
      updateHeading();
      renderCurrentChart();
    }

    function setupControls() {
      tabsController =
        PFF.setupTabs({
          tabList,
          tabs:
            chartTabs,
          valueAttribute:
            'group',
          initialValue:
            activeGroup,
          leftButton:
            tabScrollLeft,
          rightButton:
            tabScrollRight,
          onChange(value) {
            setGroup(
              value
            );
          }
        });

      headingScroller =
        PFF.setupScrollableRegion({
          scroller:
            headingScrollViewport,
          leftButton:
            headingScrollLeft,
          rightButton:
            headingScrollRight
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,
          initialMode:
            '3yr',
          onChange() {
            chart?.draw();
            updateAccessibleSummary();
          }
        });

      metricController =
        PFF.setupMetricSwitch({
          element:
            metricSwitch,
          buttons:
            metricButtons,
          valueAttribute:
            'metric',
          initialValue:
            activeMetric,
          onChange(value) {
            setMetric(
              value
            );
          }
        });

      legendController =
        PFFCharts.setupLegend({
          legend:
            chartLegend,
          leftButton:
            legendScrollLeft,
          rightButton:
            legendScrollRight,
          getChart() {
            return chart;
          },
          getItems() {
            const labels =
              groupLabels();

            const colours =
              groupColours();

            const hidden =
              hiddenSeriesSet();

            return labels.map(
              (
                label,
                index
              ) => ({
                datasetIndex:
                  index,
                label,
                colour:
                  colours[index],
                active:
                  !hidden.has(
                    label
                  )
              })
            );
          },
          onToggle({
            visible,
            item,
            dataset
          }) {
            const hidden =
              hiddenSeriesSet();

            if (visible) {
              hidden.delete(
                item.label
              );
            } else {
              hidden.add(
                item.label
              );
            }

            if (dataset) {
              dataset._activeSeries =
                visible &&
                dataset._slotActive;
            }

            updateAccessibleSummary();
          }
        });

      interactionsController =
        PFFCharts.setupChartInteractions({
          canvas:
            chartCanvas,
          getChart() {
            return chart;
          }
        });

      updateTrendVisibility();
    }

    migrateLegacyLocalCache();
    setupControls();

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      async loadLive() {
        const [
          stateTable,
          ruralityTable
        ] =
          await Promise.all([
            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.stateSheet,
              range:
                CONFIG.stateRange,
              headers:
                '1'
            }),

            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.ruralitySheet,
              range:
                CONFIG.ruralityRange,
              headers:
                '1'
            })
          ]);

        return {
          stateTable,
          ruralityTable
        };
      },

      parseLive:
        parseLiveData,

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,
          appKey:
            CACHE_APP_KEY
        });
      },

      parseRemoteCache,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        6,

      onLiveError(error) {
        console.warn(
          'Live population location data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(error) {
        console.warn(
          'Apps Script population location cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,
        text:
          dataSourceText
      },

      render(loaded) {
        const combinedRows =
          validateCombinedRows(
            loaded.rows
          );

        sourceData =
          splitCombinedRows(
            combinedRows
          );

        chartSummary =
          PFFCharts.ensureChartSummary({
            id:
              'populationLocationChartSummary',
            parent:
              app
          });

        chartCanvas.setAttribute(
          'aria-describedby',
          chartSummary.id
        );

        createChart();

        legendController.render();
        tabsController.update();
        headingScroller.update();

        responsiveController =
          PFFCharts.createResponsiveController({
            getChart() {
              return chart;
            },
            observe: [
              app,
              chartShell
            ],
            onRefresh() {
              tabsController?.update();
              headingScroller?.update();
            }
          });

        return chart;
      },

      errorMessage:
        'Population location data unavailable.'
    });
  </script>
</body>
</html>
