<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Locum Rates Data</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --trend-yellow: #f1c232;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;

      --state-nsw: #2db7f5;
      --state-qld: #7a0036;
      --state-act: #7b61ff;
      --state-vic: #2d3a8c;
      --state-sa: #f03a47;
      --state-nt: #c25e00;
      --state-wa: #000000;
      --state-tas: #22a36b;

      --rurality-mm1: #3f4851;
      --rurality-mm2: #4f1500;
      --rurality-mm3: #7e2800;
      --rurality-mm4: #a14216;
      --rurality-mm5: #c87452;
      --rurality-mm6: #e1b69a;
      --rurality-mm7: #f3e0d3;

      --structure-unspecified: #bfc3c7;
      --structure-sole: #5a3be7;
      --structure-company: #00b26f;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 0;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .module-top {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        width 420ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: none;
    }

    .tab-scroll-arrow {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: none;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding-bottom: 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .tab-scroll-arrow-left {
      left: 0;
    }

    .tab-scroll-arrow-right {
      right: 0;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    .chart-heading-row {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      height: 30px;
      min-height: 30px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 4px 112px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
      will-change: opacity;
    }

    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;
      display: inline-flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--purple);
      font-size: 15px;
      line-height: 1;
    }

    .chart-options-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 1;
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .legend-square {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border: 1px solid transparent;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
    }

    .legend-bubble {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
    }

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -2px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .chart-note {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      width: min(252px, calc(100% - 82px));
      padding: 8px 9px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(105, 113, 138, 0.16);
      border-radius: 4px;
      font-size: 9px;
      font-weight: 400;
      line-height: 1.35;
      pointer-events: none;
    }

    .chart-note.is-hidden {
      display: none;
    }

    #locumChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 0;
      }

      .tab-scroll-arrow {
        display: inline-flex;
      }

      .tab-scroll-shell.can-scroll-left .tab-scroll-arrow-left,
      .tab-scroll-shell.can-scroll-right .tab-scroll-arrow-right {
        opacity: 0.72;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        height: 29px;
        min-height: 29px;
      }

      .chart-heading {
        padding-top: 4px;
        padding-right: 105px;
        font-size: 14px;
        line-height: 21px;
      }

      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .chart-note {
        top: 5px;
        right: 5px;
        width: min(224px, calc(100% - 70px));
        padding: 7px 8px;
        font-size: 9px;
        line-height: 1.35;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 97px;
        font-size: 13px;
      }

      .reaggregate-button {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading locum rate data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading locum rate data...</div>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div
            class="tab-list"
            role="tablist"
            aria-label="Locum rate views"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-view="experience"
              aria-selected="true"
            >
              Experience
            </button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="rurality"
              aria-selected="false"
            >
              Rurality
            </button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="structure"
              aria-selected="false"
            >
              Business
            </button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="location"
              aria-selected="false"
            >
              Location
            </button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="date"
              aria-selected="false"
            >
              Time
            </button>
          </div>

          <span
            class="tab-scroll-arrow tab-scroll-arrow-left"
            aria-hidden="true"
          >‹</span>

          <span
            class="tab-scroll-arrow tab-scroll-arrow-right"
            aria-hidden="true"
          >›</span>
        </div>

        <div class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span>LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 id="chartHeading" class="chart-heading">
          <span class="chart-heading-fixed">Locum rates</span><span id="chartHeadingDetail" class="chart-heading-detail">by experience</span>
        </h2>

        <button
          id="reaggregateButton"
          class="reaggregate-button is-hidden"
          type="button"
          aria-hidden="true"
          tabindex="-1"
        >
          <span>Re-aggregate</span>
          <span class="reset-icon" aria-hidden="true">↻</span>
        </button>
      </div>

      <div class="chart-options-row">
        <div id="legendNav" class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >
            &#8249;
          </button>

          <div id="legendViewport" class="legend-viewport">
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Chart legend"
            ></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >
            &#8250;
          </button>
        </div>
      </div>

      <div class="chart-shell">
        <aside id="chartNote" class="chart-note is-hidden" role="note"></aside>

        <canvas
          id="locumChart"
          aria-label="Locum rate chart"
          tabindex="-1"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    const CONFIG = {
      sheetId: '1wmrmNS4cz-_aPKnyBVg7-SShbhs6czMNh07UjyLo04s',
      sheetName: 'Data',
      range: 'A:J',
      fetchTimeoutMs: 20000,

      transitionMs: 1050,
      splitAnimationMs: 820,
      mergeAnimationMs: 820,
      doubleActivationMs: 420,

      pointRadius: 2.7,
      pointHoverRadius: 4.4,
      regressionWidth: 3.6,

      pointOpacity: 0.20,
      pointHoverOpacity: 0.68,
      categoryPointOpacity: 0.20,
      categoryPointHoverOpacity: 0.68,

      aggregateOpacity: 0.91,
      aggregateHoverOpacity: 0.98,
      dimmedAggregateOpacity: 0.48,
      dimmedAggregateHoverOpacity: 0.60,
      rawPointRadius: 4,

      /*
       * All positive rates are included. To exclude the apparent
       * $2 entry, change minimumHourlyRate from 0 to 20.
       */
      minimumHourlyRate: 0,
      maximumHourlyRate: 500
    };

    const VIEW_CONFIG = {
      experience: {
        headingDetail: 'by experience'
      },
      rurality: {
        headingDetail: 'by rurality'
      },
      structure: {
        headingDetail: 'by business structure'
      },
      location: {
        headingDetail: 'by location'
      },
      date: {
        headingDetail: 'over time'
      }
    };

    const STATE_ORDER = [
      'NSW',
      'QLD',
      'VIC',
      'ACT',
      'SA',
      'NT',
      'WA',
      'TAS'
    ];

    const STATE_COLOURS = {
      NSW: '#2db7f5',
      QLD: '#7a0036',
      ACT: '#7b61ff',
      VIC: '#2d3a8c',
      SA: '#f03a47',
      NT: '#c25e00',
      WA: '#000000',
      TAS: '#22a36b'
    };

    const RURALITY_ORDER = [
      'MM1',
      'MM2',
      'MM3',
      'MM4',
      'MM5',
      'MM6',
      'MM7'
    ];

    const RURALITY_COLOURS = {
      MM1: '#3f4851',
      MM2: '#4f1500',
      MM3: '#7e2800',
      MM4: '#a14216',
      MM5: '#c87452',
      MM6: '#e1b69a',
      MM7: '#f3e0d3'
    };

    const STRUCTURE_ORDER = [
      'Unspecified',
      'Sole trader',
      'Company/trust'
    ];

    const STRUCTURE_COLOURS = {
      Unspecified: '#bfc3c7',
      'Sole trader': '#5a3be7',
      'Company/trust': '#00b26f'
    };

    const DAY_MS = 24 * 60 * 60 * 1000;
    const YEAR_MS = 365.2425 * DAY_MS;

    const app = document.getElementById('app');
    const loadingState = document.getElementById('loadingState');
    const statusElement = document.getElementById('status');
    const chartHeading = document.getElementById('chartHeading');
    const chartHeadingDetail = document.getElementById('chartHeadingDetail');
    const reaggregateButton = document.getElementById('reaggregateButton');
    const tabScrollShell = document.querySelector('.tab-scroll-shell');
    const tabList = document.querySelector('.tab-list');
    const chartTabs = [...document.querySelectorAll('.chart-tab')];

    const tabByView = new Map(
      chartTabs.map(tab => [tab.dataset.view, tab])
    );

    const legendNav = document.getElementById('legendNav');
    const legendViewport = document.getElementById('legendViewport');
    const chartLegend = document.getElementById('chartLegend');
    const legendScrollLeft = document.getElementById('legendScrollLeft');
    const legendScrollRight = document.getElementById('legendScrollRight');

    function captureXAxisSnapshot(
      scale,
      styleOptions = scale?.options
    ) {
      if (!scale || !styleOptions) {
        return null;
      }

      const tickOptions =
        styleOptions.ticks || {};

      const gridOptions =
        styleOptions.grid || {};

      const titleOptions =
        styleOptions.title || {};

      const tickPadding =
        Number(tickOptions.padding) || 0;

      const ticks =
        (scale.ticks || []).map((tick, index) => {
          const context =
            typeof scale.getContext === 'function'
              ? scale.getContext(index)
              : {
                  chart,

                  tick,
                  index,
                  type: 'tick'

          let label =
            tick.label;

          if (
            label === undefined &&
            typeof tickOptions.callback === 'function'
          ) {
            try {
              label = tickOptions.callback.call(
                scale,
                tick.value,
                index,
                scale.ticks
              );
            } catch (_) {
              label = tick.value;
            }
          }

          const labelLines =
            Array.isArray(label)
              ? label.map(line => String(line ?? ''))
              : [String(label ?? '')];

          const fontOptions =
            resolveAxisValue(
              tickOptions.font,

              tickOptions.font || {}

            getAxisFont(

          const tickWidth =
            Number(

            ) || 1;

        title: {

    function drawXAxisSnapshot(
      context,
      snapshot,
      opacity,
      offsetX
    ) {
      if (
        !snapshot ||
        opacity <= 0.001
      ) {
        return;
      }

      context.save();
      context.globalAlpha = opacity;
      context.textAlign = 'center';
      context.textBaseline = 'middle';

      snapshot.ticks.forEach(tick => {
        const x =
          tick.x +
          offsetX;

        if (
          tick.showTick &&
          tick.tickLength > 0
        ) {
          context.beginPath();
          context.strokeStyle =
            tick.tickColour;
          context.lineWidth =
            tick.tickWidth;
          context.moveTo(
            x,
            tick.axisY
          );
          context.lineTo(
            x,
            tick.axisY +
            tick.tickLength
          );
          context.stroke();
        }

        if (
          !tick.showLabel ||
          !tick.labelLines.some(Boolean)
        ) {
          return;
        }

        context.font =
          tick.font.css;
        context.fillStyle =
          tick.labelColour;

        const firstLineY =
          tick.labelY -
          (
            tick.labelLines.length -
            1
          ) *
          tick.font.lineHeight /
          2;

        tick.labelLines.forEach((line, lineIndex) => {
          if (!line) {
            return;
          }

          context.fillText(
            line,
            x,
            firstLineY +
            lineIndex *
            tick.font.lineHeight
          );
        });
      });

      if (
        snapshot.title.show
      ) {
        context.font =
          snapshot.title.font.css;
        context.fillStyle =
          snapshot.title.colour;

        const firstLineY =
          snapshot.title.y -
          (
            snapshot.title.lines.length -
            1
          ) *
          snapshot.title.font.lineHeight /
          2;

        snapshot.title.lines.forEach((line, lineIndex) => {
          if (!line) {
            return;

          context.fillText(
            line,
            snapshot.title.x +
            offsetX,
            firstLineY +
            lineIndex *
            snapshot.title.font.lineHeight
          );
        });
      }

      context.restore();
    }

    function cleanText(value) {

    function parseDateValue(value) {
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return new Date(Date.UTC(
          value.getFullYear(),
          value.getMonth(),
          value.getDate()
        ));
      }

      if (
        typeof value === 'number' &&
        Number.isFinite(value) &&
        value > 20000 &&
        value < 80000
      ) {
        return new Date(Date.UTC(1899, 11, 30) + value * DAY_MS);
      }

      const text = cleanText(value);

      if (!text) {
        return null;
      }

      let match = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/i
      );

      if (match) {
        return new Date(Date.UTC(
          Number(match[1]),
          Number(match[2]),
          Number(match[3])
        ));
      }

      match = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})/
      );

      if (match) {
        let year = Number(match[3]);

        if (year < 100) {
          year += 2000;
        }

        return new Date(Date.UTC(
          year,
          Number(match[2]) - 1,
          Number(match[1])
        ));
      }

      match = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
      );

      if (match) {
        return new Date(Date.UTC(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        ));
      }

      const parsed = new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : new Date(Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          ));
    }

    function percentile(sortedValues, probability) {
      if (!sortedValues.length) {
        return NaN;
      }

      if (sortedValues.length === 1) {
        return sortedValues[0];
      }

      const index =
        (sortedValues.length - 1) *
        probability;

      const lowerIndex = Math.floor(index);
      const upperIndex = Math.ceil(index);

      if (lowerIndex === upperIndex) {
        return sortedValues[lowerIndex];
      }

      const fraction =
        index -
        lowerIndex;

      return (
        sortedValues[lowerIndex] +
        (
          sortedValues[upperIndex] -
          sortedValues[lowerIndex]
        ) *
        fraction
      );
    }

    function calculateStatistics(values) {

      return {

        median: percentile(sorted, 0.50),
        q1: percentile(sorted, 0.25),
        q3: percentile(sorted, 0.75)

    function logGamma(value) {
      const coefficients = [
        676.5203681218851,
        -1259.1392167224028,
        771.3234287776531,
        -176.6150291621406,
        12.507343278686905,
        -0.13857109526572012,
        9.984369578019572e-6,
        1.5056327351493116e-7
      ];

      if (value < 0.5) {
        return (
          Math.log(Math.PI) -
          Math.log(Math.sin(Math.PI * value)) -
          logGamma(1 - value)
        );
      }

      const shifted = value - 1;
      let series = 0.9999999999998099;

      coefficients.forEach((coefficient, index) => {
        series += coefficient /
          (shifted + index + 1);
      });

      const total =
        shifted +
        coefficients.length -
        0.5;

      return (
        0.5 * Math.log(2 * Math.PI) +
        (shifted + 0.5) * Math.log(total) -
        total +
        Math.log(series)
      );
    }

    function betaContinuedFraction(a, b, x) {
      const maximumIterations = 200;
      const epsilon = 3e-14;
      const minimumValue = 1e-300;
      const qab = a + b;
      const qap = a + 1;
      const qam = a - 1;

      let c = 1;
      let d = 1 - qab * x / qap;

      if (Math.abs(d) < minimumValue) {
        d = minimumValue;
      }

      d = 1 / d;

      let result = d;

      for (
        let iteration = 1;
        iteration <= maximumIterations;
        iteration++
      ) {
        const doubledIteration =
          2 *
          iteration;

        let coefficient =
          iteration *
          (b - iteration) *
          x /
          (
            (qam + doubledIteration) *
            (a + doubledIteration)
          );

        d = 1 + coefficient * d;

        if (Math.abs(d) < minimumValue) {
          d = minimumValue;
        }

        c = 1 + coefficient / c;

        if (Math.abs(c) < minimumValue) {
          c = minimumValue;
        }

        d = 1 / d;
        result *= d * c;

        coefficient =
          -(a + iteration) *
          (qab + iteration) *
          x /
          (
            (a + doubledIteration) *
            (qap + doubledIteration)
          );

        d = 1 + coefficient * d;

        if (Math.abs(d) < minimumValue) {
          d = minimumValue;
        }

        c = 1 + coefficient / c;

        if (Math.abs(c) < minimumValue) {
          c = minimumValue;
        }

        d = 1 / d;

        const change = d * c;
        result *= change;

        if (Math.abs(change - 1) < epsilon) {
          break;
        }
      }

      return result;
    }

    function regularizedIncompleteBeta(x, a, b) {
      if (x <= 0) {
        return 0;
      }

      if (x >= 1) {
        return 1;
      }

      const betaTerm = Math.exp(
        logGamma(a + b) -
        logGamma(a) -
        logGamma(b) +
        a * Math.log(x) +
        b * Math.log1p(-x)
      );

      if (x < (a + 1) / (a + b + 2)) {
        return (
          betaTerm *
          betaContinuedFraction(a, b, x) /
          a
        );
      }

      return (
        1 -
        betaTerm *
        betaContinuedFraction(b, a, 1 - x) /
        b
      );
    }

    function calculateTwoSidedTTestPValue(
      tStatistic,
      degreesOfFreedom
    ) {
      if (
        !Number.isFinite(tStatistic) ||
        !Number.isFinite(degreesOfFreedom) ||
        degreesOfFreedom <= 0
      ) {
        return NaN;
      }

      const absoluteT =
        Math.abs(tStatistic);

      const betaInput =
        degreesOfFreedom /
        (
          degreesOfFreedom +
          absoluteT *
          absoluteT
        );

      return clamp(
        regularizedIncompleteBeta(
          betaInput,
          degreesOfFreedom / 2,
          0.5
        ),
        0,
        1
      );
    }

    function formatPValue(value) {
      if (!Number.isFinite(value)) {
        return 'p unavailable';

      if (value < 0.0001) {

      if (value < 0.001) {
        return 'p < 0.001';
      }

      if (value < 0.01) {

      }

      if (value < 0.05) {
        return 'p < 0.05';
      }

      return `p = ${value.toFixed(2)}`;

    function calculateRegression(
      data,
      transformX = value => value
    ) {
      const transformedData = data
        .map(point => ({
          originalX: point.x,
          x: transformX(point.x),
          y: point.y
        }))
        .filter(point =>
          Number.isFinite(point.x) &&
          Number.isFinite(point.y)
        );

      if (transformedData.length < 2) {
        return null;
      }

      const meanX =
        transformedData.reduce(
          (total, point) =>
            total +
            point.x,
          0
        ) /
        transformedData.length;

      const meanY =
        transformedData.reduce(
          (total, point) =>
            total +
            point.y,
          0
        ) /
        transformedData.length;

      let numerator = 0;
      let denominator = 0;

      transformedData.forEach(point => {
        numerator +=
          (point.x - meanX) *
          (point.y - meanY);

        denominator +=
          Math.pow(
            point.x - meanX,
            2
          );
      });

      if (denominator === 0) {
        return null;
      }

      const slope =
        numerator /
        denominator;

      const intercept =
        meanY -
        slope *
        meanX;

      const minimumX = Math.min(
        ...transformedData.map(
          point =>
            point.originalX
        )
      );

      const maximumX = Math.max(
        ...transformedData.map(
          point =>
            point.originalX
        )
      );

      const predict = originalX =>
        intercept +
        slope *
        transformX(originalX);

      const totalVariation =
        transformedData.reduce(
          (total, point) =>
            total +
            Math.pow(
              point.y - meanY,
              2
            ),
          0
        );

      const residualVariation =
        transformedData.reduce(
          (total, point) => {
            const predicted =
              intercept +
              slope *
              point.x;

            return (
              total +
              Math.pow(
                point.y -
                predicted,
                2
              )
            );
          },
          0
        );

      const rSquared =
        totalVariation > 0
          ? 1 -
            residualVariation /
            totalVariation
          : 0;

      let pValue = NaN;

      if (transformedData.length > 2) {
        const degreesOfFreedom =
          transformedData.length -
          2;

        const residualVariance =
          residualVariation /
          degreesOfFreedom;

        const slopeStandardError =
          Math.sqrt(
            residualVariance /
            denominator
          );

        if (slopeStandardError === 0) {
          pValue =
            slope === 0
              ? 1
              : 0;
        } else if (
          Number.isFinite(
            slopeStandardError
          )
        ) {
          pValue =
            calculateTwoSidedTTestPValue(
              slope /
              slopeStandardError,
              degreesOfFreedom
            );
        }
      }

      return {
        slope,
        intercept,
        minimumX,
        maximumX,
        predict,
        rSquared,
        pValue
      };
    }

    function rgba(colour, opacity) {
      const text = String(
        colour || ''
      ).trim();

      const match = text.match(
        /^#([0-9a-f]{6})$/i
      );

      if (!match) {
        return `rgba(119, 119, 119, ${opacity})`;
      }

      const digits = match[1];

      const red = parseInt(
        digits.slice(0, 2),
        16
      );

      const green = parseInt(
        digits.slice(2, 4),
        16
      );

      const blue = parseInt(
        digits.slice(4, 6),
        16
      );

      return `rgba(${red}, ${green}, ${blue}, ${opacity})`;
    }

    function parseCssColour(
      value,
      fallback = 'rgba(119, 119, 119, 1)'
    ) {
      const text = String(
        value || ''
      ).trim();

      const hex = text.match(
        /^#([0-9a-f]{6})$/i
      );

      const rgbaMatch = text.match(
        /^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)(?:\s*,\s*([\d.]+))?\s*\)$/i
      );

      if (hex) {
        const digits = hex[1];

        return {
          red: parseInt(
            digits.slice(0, 2),
            16
          ),

          green: parseInt(
            digits.slice(2, 4),
            16
          ),

          blue: parseInt(
            digits.slice(4, 6),
            16
          ),

          alpha: 1
        };
      }

      if (rgbaMatch) {
        return {
          red: clamp(
            Number(rgbaMatch[1]),
            0,
            255
          ),

          green: clamp(
            Number(rgbaMatch[2]),
            0,
            255
          ),

          blue: clamp(
            Number(rgbaMatch[3]),
            0,
            255
          ),

          alpha: clamp(
            rgbaMatch[4] === undefined
              ? 1
              : Number(rgbaMatch[4]),
            0,
            1
          )
        };
      }

      if (text !== fallback) {
        return parseCssColour(
          fallback,
          'rgba(119, 119, 119, 1)'
        );
      }

      return {
        red: 119,
        green: 119,
        blue: 119,
        alpha: 1
      };
    }

    function interpolateCssColour(
      firstColour,
      secondColour,
      progress
    ) {
      const first =
        parseCssColour(firstColour);

      const second =
        parseCssColour(secondColour);

      const mix =
        clamp(progress, 0, 1);

      return `rgba(${Math.round(
        first.red +
        (
          second.red -
          first.red
        ) *
        mix
      )}, ${Math.round(
        first.green +
        (
          second.green -
          first.green
        ) *
        mix
      )}, ${Math.round(
        first.blue +
        (
          second.blue -
          first.blue
        ) *
        mix
      )}, ${
        first.alpha +
        (
          second.alpha -
          first.alpha
        ) *
        mix
      })`;
    }

    function fadeCssColour(
      colour,
      opacityMultiplier
    ) {
      const parsed =
        parseCssColour(colour);

      return `rgba(${Math.round(parsed.red)}, ${Math.round(parsed.green)}, ${Math.round(parsed.blue)}, ${
        parsed.alpha *
        clamp(
          opacityMultiplier,
          0,
          1
        )
      })`;
    }

    function easeOutCubic(progress) {
      return (
        1 -
        Math.pow(
          1 - progress,
          3
        )
      );
    }

    function easeInOutCubic(progress) {
      return progress < 0.5
        ? 4 *
          progress *
          progress *
          progress
        : 1 -
          Math.pow(
            -2 *
            progress +
            2,
            3
          ) /
          2;
    }

    function runAnimation({
      duration,
      easing,
      onFrame,
      onComplete
    }) {
      if (
        activeAnimationFrame !==
        null
      ) {
        cancelAnimationFrame(
          activeAnimationFrame
        );

        activeAnimationFrame =
          null;
      }

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        reduceMotion ||
        duration <= 0
      ) {
        onFrame(1);
        onComplete?.();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        const rawProgress =
          Math.min(
            (
              now -
              startedAt
            ) /
            duration,
            1
          );

        onFrame(
          easing(rawProgress)
        );

        if (rawProgress < 1) {
          activeAnimationFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          activeAnimationFrame =
            null;

          onComplete?.();
        }
      }

      activeAnimationFrame =
        requestAnimationFrame(
          frame
        );
    }

    function loadSheetRows() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffLocumRatesCallback_${Date.now()}_${Math.floor(
              Math.random() *
              1000000
            )}`;

          const script =
            document.createElement(
              'script'
            );

          let settled = false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Could not load Google Sheet data'
                  )
                );
              },
              CONFIG.fetchTimeoutMs
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (error) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }

          function finish(
            error,
            response
          ) {
            if (settled) {
              return;
            }

            settled = true;
            cleanup();

            if (error) {
              reject(error);
              return;
            }

            if (
              !response ||
              response.status ===
                'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          }

          window[
            callbackName
          ] = response =>
            finish(
              null,
              response
            );

          script.onerror =
            () =>
              finish(
                new Error(
                  'Network error loading Google Sheet data'
                )
              );

          const params =
            new URLSearchParams({
              sheet:
                CONFIG.sheetName,

              range:
                CONFIG.range,

              headers:
                '1',

              tq:
                'select *',

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?` +
            params.toString();

          document.body
            .appendChild(
              script
            );
        }
      );
    }

    function normaliseRows(sourceRows) {
      const result = [];

      sourceRows.forEach(
        (
          sourceRow,
          rowIndex
        ) => {
          const cells =
            sourceRow?.c ||
            [];

          const date =
            parseDateCell(
              cells[0]
            );

          const hourlyRate =
            toNumber(
              getCellValue(
                cells[1]
              )
            );

          const experience =
            toNumber(
              getCellValue(
                cells[2]
              )
            );

          const rurality =
            normaliseRurality(
              getCellValue(
                cells[4]
              )
            );

          const state =
            normaliseState(
              getCellValue(
                cells[8]
              )
            );

          const structure =
            normaliseStructure(
              getCellValue(
                cells[9]
              )
            );

          if (
            !Number.isFinite(
              hourlyRate
            ) ||
            hourlyRate <=
              CONFIG.minimumHourlyRate ||
            hourlyRate >
              CONFIG.maximumHourlyRate
          ) {
            return;
          }

          result.push({
            sourceIndex:
              rowIndex,

            date:
              date?.getTime() ??
              null,

            hourlyRate,

            experience:
              Number.isFinite(
                experience
              )
                ? experience
                : null,

            rurality,
            state,
            structure
          });
        }
      );

      return result;
    }

    function deterministicJitter(
      index,
      amplitude = 0.27
    ) {
      const sequence = [
        0,
        -0.34,
        0.34,
        -0.17,
        0.17,
        -0.50,
        0.50,
        -0.08,
        0.08,
        -0.42,
        0.42,
        -0.25,
        0.25
      ];

      return (
        sequence[
          index %
          sequence.length
        ] *
        amplitude /
        0.50
      );
    }

    function buildContinuousView({
      sourceRows,
      xAccessor,
      xLabel,
      xScale,
      regressionType = 'linear',
      slopeLabel,
      slopeMultiplier = 1
    }) {
      const points = sourceRows
        .map(row => ({
          x:
            xAccessor(row),

          y:
            row.hourlyRate,

          kind:
            'continuousPoint',

          sourceIndex:
            row.sourceIndex,

          hourlyRate:
            row.hourlyRate,

          experience:
            row.experience,

          rurality:
            row.rurality,

          structure:
            row.structure,

          state:
            row.state,

          date:
            row.date
        }))
        .filter(point =>
          Number.isFinite(
            point.x
          )
        );

      const transformX =
        regressionType ===
          'logarithmic'
          ? value =>
              Math.log1p(
                Math.max(
                  0,
                  value
                )
              )
          : value =>
              value;

      const regression =
        calculateRegression(
          points,
          transformX
        );

      const datasets = [
        {
          type:
            'scatter',

          datasetRole:
            'continuousPoints',

          label:
            'Hourly weekday rate',

          data:
            points,

          parsing:
            false,

          showLine:
            false,

          clip:
            false,

          order:
            1,

          pointStyle:
            'rect',

          pointRadius:
            CONFIG.pointRadius,

          pointHoverRadius:
            CONFIG.pointHoverRadius,

          pointHitRadius:
            4,

          pointBackgroundColor:
            rgba(
              '#6600ff',
              CONFIG.pointOpacity
            ),

          pointHoverBackgroundColor:
            rgba(
              '#6600ff',
              CONFIG.pointHoverOpacity
            ),

          pointBorderColor:
            rgba(
              '#6600ff',
              0.34
            ),

          pointHoverBorderColor:
            '#6600ff',

          pointBorderWidth:
            0.45,

          pointHoverBorderWidth:
            1,

          metadata: {
            xLabel
          }
        }
      ];

      if (regression) {
        const sampleCount =
          regressionType ===
            'logarithmic'
            ? 96
            : 2;

        const span =
          regression.maximumX -
          regression.minimumX;

        const regressionData =
          Array.from(
            {
              length:
                sampleCount
            },
            (
              _,
              index
            ) => {
              const proportion =
                sampleCount ===
                  1
                  ? 0
                  : index /
                    (
                      sampleCount -
                      1
                    );

              const x =
                regression.minimumX +
                span *
                proportion;

              return {
                x,
                y:
                  regression.predict(
                    x
                  )
              };
            }
          );

        datasets.push({
          type:
            'line',

          datasetRole:
            'regression',

          label:
            regressionType ===
              'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',

          data:
            regressionData,

          parsing:
            false,

          showLine:
            true,

          clip:
            false,

          fill:
            false,

          order:
            10,

          borderColor:
            '#f1c232',

          backgroundColor:
            '#f1c232',

          borderWidth:
            CONFIG.regressionWidth,

          borderCapStyle:
            'round',

          borderJoinStyle:
            'round',

          pointRadius:
            0,

          pointHoverRadius:
            0,

          pointHitRadius:
            7,

          tension:
            regressionType ===
              'logarithmic'
              ? 0.12
              : 0,

          metadata: {
            regressionType,

            slope:
              regression.slope,

            pValue:
              regression.pValue,

            rSquared:
              regression.rSquared,

            slopeLabel,
            slopeMultiplier
          }
        });
      }

      return {
        datasets,
        xScale,

        legendItems: [
          buildLegendItem(
            rgba(
              '#6600ff',
              CONFIG.pointOpacity
            ),
            'Hourly weekday rate',
            'square'
          ),

          buildLegendItem(
            '#f1c232',
            regressionType ===
              'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',
            'line'
          )
        ],

        note:
          ''
      };
    }

    function startOfUtcMonth(date) {
      return new Date(Date.UTC(
        date.getUTCFullYear(),

    function addUtcMonths(
      date,
      months
    ) {
      return new Date(Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth() +
          months,
        1
      ));
    }

    function buildDateTicks(
      minimum,
      maximum
    ) {
      const ticks = [];

      let month =
        startOfUtcMonth(
          new Date(
            minimum
          )
        );

      const finalMonth =
        startOfUtcMonth(
          new Date(
            maximum
          )
        );

      while (
        month <=
        finalMonth
      ) {
        ticks.push(
          month.getTime()
        );

        month =
          addUtcMonths(
            month,
            1
          );
      }

      return ticks;
    }

    function getBaseLocationRadius(
      respondents
    ) {
      return clamp(
        11 +
        Math.pow(
          respondents,
          0.78
        ) *
        3.15,
        18,
        66
      );
    }

    function getDisplayedLocationRadius(
      activeChart,
      raw
    ) {
      const baseRadius =
        Number(
          raw?.baseRadius
        );

      if (
        !Number.isFinite(
          baseRadius
        ) ||
        baseRadius <= 0
      ) {
        return 0;
      }

      const widthScale =
        clamp(
          (
            Number(
              activeChart?.width
            ) ||
            520
          ) /
          520,
          0.78,
          1.05
        );

      const heightScale =
        clamp(
          (
            Number(
              activeChart?.height
            ) ||
            585
          ) /
          585,
          0.68,
          1.04
        );

      return (
        baseRadius *
        Math.min(
          widthScale,
          heightScale
        )
      );
    }

    function buildLocationPositions(
      items,
      proximityThreshold = 10
    ) {
      const sortedItems =
        items
          .slice()
          .sort(
            (
              first,
              second
            ) =>
              first.y -
                second.y ||
              second.statistics.count -
                first.statistics.count ||
              first.state.localeCompare(
                second.state
              )
          );

      const laneLastValues = [];
      const laneAssignments =
        new Map();

      sortedItems.forEach(
        item => {
          let laneIndex =
            laneLastValues.findIndex(
              previousValue =>
                item.y -
                previousValue >
                proximityThreshold
            );

          if (laneIndex === -1) {
            laneIndex =
              laneLastValues.length;

            laneLastValues.push(
              item.y
            );
          } else {
            laneLastValues[
              laneIndex
            ] =
              item.y;
          }

          laneAssignments.set(
            item.state,
            laneIndex
          );
        }
      );

      const laneCount =
        Math.max(
          1,
          laneLastValues.length
        );

      const positionCount =
        Math.max(
          5,
          laneCount
        );

      const leftPosition =
        21;

      const rightPosition =
        84;

      const sharedPositions =
        Array.from(
          {
            length:
              positionCount
          },
          (
            _,
            index
          ) =>
            leftPosition +
            index /
            Math.max(
              1,
              positionCount -
              1
            ) *
            (
              rightPosition -
              leftPosition
            )
        );

      const positions =
        new Map();

      laneAssignments.forEach(
        (
          laneIndex,
          state
        ) => {
          positions.set(
            state,
            sharedPositions[
              laneIndex
            ]
          );
        }
      );

      return positions;
    }

    function rebuildLocationData() {
      locationCategories =
        STATE_ORDER.filter(
          state =>
            rows.some(
              row =>
                row.state ===
                state
            )
        );

      locationRawRows =
        new Map();

      const items =
        locationCategories.map(
          state => {
            const stateRows =
              rows.filter(
                row =>
                  row.state ===
                  state
              );

            const statistics =
              calculateStatistics(
                stateRows.map(
                  row =>
                    row.hourlyRate
                )
              );

            locationRawRows.set(
              state,
              stateRows
            );

            return {
              kind:
                'locationAggregate',

              state,

              x:
                21,

              y:
                statistics.median,

              baseRadius:
                getBaseLocationRadius(
                  statistics.count
                ),

              colour:
                STATE_COLOURS[
                  state
                ],

              statistics
            };
          }
        );

      const positions =
        buildLocationPositions(
          items,
          10
        );

      locationAggregatePoints =
        items
          .map(
            item => ({
              ...item,

              x:
                positions.get(
                  item.state
                ) ??
                21
            })
          )
          .sort(
            (
              first,
              second
            ) =>
              second.y -
                first.y ||
              second.baseRadius -
                first.baseRadius
          );
    }

    function getLocationAggregateVisibility(
      state

      if (
        splitProgress.has(
          state

        return (

          splitProgress.get(
            state
          )
        );
      }

      if (
        mergingStates.has(
          state
        )
      ) {
        return mergeProgress;
      }

      return splitStates.has(
        state
      )
        ? 0
        : 1;
    }

      const visibility =

      if (visibility <= 0.001) {
        return 0;

      return getDisplayedLocationRadius(
        activeChart,
        raw

    function distanceToSegment(
      px,
      py,
      ax,
      ay,
      bx,
      by
    ) {
      const dx =
        bx -
        ax;

      const dy =
        by -
        ay;

      if (
        dx === 0 &&
        dy === 0
      ) {
        return Math.hypot(
          px - ax,
          py - ay
        );
      }

      const proportion =
        clamp(
          (
            (
              px -
              ax
            ) *
            dx +
            (
              py -
              ay
            ) *
            dy
          ) /
          (
            dx *
            dx +
            dy *
            dy
          ),
          0,
          1
        );

      const closestX =
        ax +
        proportion *
        dx;

      const closestY =
        ay +
        proportion *
        dy;

      return Math.hypot(
        px -
        closestX,
        py -
        closestY
      );
    }

    function findNearestInteractiveLine(
      event,
      maximumDistance = 10
    ) {
      if (!chart?.chartArea) {
        return null;
      }

      const x =
        Number(
          event?.x
        );

      const y =
        Number(
          event?.y
        );

      const area =
        chart.chartArea;

      if (
        !Number.isFinite(
          x
        ) ||
        !Number.isFinite(
          y
        ) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let bestMatch =
        null;

      chart.data.datasets.forEach(
        (
          dataset,
          datasetIndex
        ) => {
          if (
            dataset.datasetRole !==
              'regression' &&
            dataset.datasetRole !==
              'categoryMedian'
          ) {
            return;
          }

          const renderedPoints =
            chart
              .getDatasetMeta(
                datasetIndex
              )
              ?.data ||
            [];

          for (
            let index = 0;
            index <
              renderedPoints.length -
              1;
            index += 1
          ) {
            const first =
              renderedPoints[
                index
              ];

            const second =
              renderedPoints[
                index +
                1
              ];

            if (
              !Number.isFinite(
                first?.x
              ) ||
              !Number.isFinite(
                first?.y
              ) ||
              !Number.isFinite(
                second?.x
              ) ||
              !Number.isFinite(
                second?.y
              )
            ) {
              continue;
            }

            const distance =
              distanceToSegment(
                x,
                y,
                first.x,
                first.y,
                second.x,
                second.y
              );

            if (
              distance >
              maximumDistance
            ) {
              continue;
            }

            const firstDistance =
              Math.hypot(
                x -
                first.x,
                y -
                first.y
              );

            const secondDistance =
              Math.hypot(
                x -
                second.x,
                y -
                second.y
              );

            const nearestIndex =
              firstDistance <=
                secondDistance
                ? index
                : index +
                  1;

            if (
              !bestMatch ||
              distance <
                bestMatch.distance
            ) {
              bestMatch = {
                datasetIndex,
                index:
                  nearestIndex,
                distance
              };
            }
          }
        }
      );

      return bestMatch;
    }

          'locationAggregate' &&
        raw &&
        !splitStates.has(
          raw.state

          ? 'pointer'

      if (
        role ===
          'regression' ||
        role ===
          'categoryMedian'

        showHoveredLineTooltip(
          event,

      elements
    ) {
      if (
        !chart ||
        interactionLocked
      ) {
        return;
      }

      if (
        event?.native
          ?.preventDefault
      ) {
        event.native
          .preventDefault();
      }

      const selectedElement =
        getInteractiveElement(
          elements
        ) ||
        findNearestInteractiveLine(
          event
        );

      if (!selectedElement) {
        chart.tooltip
          .setActiveElements(
            [],
            {
              x:
                0,

              y:
                0
            }
          );

        chart.update(
          'none'
        );

        return;
      }

      showSelectedTooltip(
        event,
        selectedElement
      );

      const dataset =
        chart.data.datasets[
          selectedElement.datasetIndex
        ];

      const raw =
        dataset
          ?.data
          ?.[
            selectedElement.index
          ];

      if (
        activeView !==
          'location' ||
        dataset?.datasetRole !==
          'locationAggregate' ||
        !raw ||
        splitStates.has(
          raw.state
        )
      ) {
        lastAggregateClickKey =
          null;

        lastAggregateClickTime =
          0;

        return;
      }

      const clickedAt =
        performance.now();

      const isSecondActivation =
        lastAggregateClickKey ===
          raw.state &&
        clickedAt -
          lastAggregateClickTime <=
          CONFIG.doubleActivationMs;

      if (
        isSecondActivation
      ) {
        lastAggregateClickKey =
          null;

        lastAggregateClickTime =
          0;

        chart.tooltip
          .setActiveElements(
            [],
            {
              x:
                0,

              y:
                0
            }
          );

        chart.update(
          'none'
        );

        animateStateSplit(
          raw.state
        );

        return;
      }

      lastAggregateClickKey =
        raw.state;

      lastAggregateClickTime =
        clickedAt;
    }

    const locationLabelPlugin = {
      id:
        'locationLabelPlugin',

      afterDatasetDraw(

      ) {

            .datasets[

            context.save();

            context.globalAlpha =
              visibility *
              (
                1 -
                aggregateDimProgress *
                0.43
              );

            context.textAlign =
              'center';

            context.textBaseline =
              'middle';

            context.font =
              `700 ${fontSize}px Lato, sans-serif`;

            context.lineJoin =
              'round';

            context.lineWidth =
              Math.max(
                1.7,
                fontSize *
                0.15
              );

            context.strokeStyle =
              'rgba(255, 255, 255, 0.94)';

            context.fillStyle =
              '#151515';

            context.strokeText(
              raw.state,
              element.x,
              element.y
            );

            context.fillText(
              raw.state,
              element.x,
              element.y
            );

            context.restore();
          }
        );
      }
    };

    function createChart() {
      const model =
        buildViewModel(
          activeView
        );

      currentXAxisOptions =
        model.xScale;

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type:
              'scatter',

            data: {
              datasets:
                model.datasets
            },

            options: {
              responsive:
                true,

              maintainAspectRatio:
                false,

              resizeDelay:
                0,

              devicePixelRatio:
                Math.min(
                  window.devicePixelRatio ||
                  1,
                  3
                ),

              animation: {
                duration:
                  0
              },

              transitions: {
                resize: {
                  animation: {
                    duration:
                      0
                  }
                },

                active: {
                  animation: {
                    duration:
                      170,

                    easing:
                      'easeOutCubic'
                  }
                }
              },

              interaction: {
                mode:
                  'nearest',

                axis:

                  true,

              },

                padding: {

                    4,

                  right:

                    0,

                    0
                }
              },

              onHover:
                handleChartHover,

              onClick:
                handleChartClick,

              plugins: {
                legend: {
                  display:
                    false
                },

                tooltip: {
                  enabled:
                    true,

                  mode:
                    'nearest',

                  intersect:
                    true,

                  displayColors:
                    false,

                  backgroundColor:
                    '#ffffff',

                  titleColor:
                    '#151515',

                  bodyColor:
                    '#69718a',

                  borderColor:
                    '#e8eaf0',

                  borderWidth:
                    1,

                  cornerRadius:
                    4,

                  padding:
                    9,

                  titleFont: {
                    family:
                      'Lato',

                    size:
                      12,

                    weight:
                      '700'
                  },

                  bodyFont: {
                    family:
                      'Lato',

                    size:
                      11,

                    weight:
                      '400'
                  },

                  filter() {
                    return (
                      !interactionLocked
                    );
                  },

                  callbacks: {
                    title(
                      tooltipItems
                    ) {
                      const item =
                        tooltipItems
                          ?.[0];

                      const role =
                        item
                          ?.dataset
                          ?.datasetRole;

                      const raw =
                        item
                          ?.raw;

                      if (
                        role ===
                          'locationAggregate' ||
                        role ===
                          'locationRaw'
                      ) {
                        return (
                          raw?.state ||
                          ''
                        );
                      }

                      if (
                        role ===
                          'categoryPoints' ||
                        role ===
                          'categoryMedian'
                      ) {
                        return (
                          raw?.category ||
                          item
                            ?.dataset
                            ?.metadata
                            ?.category ||
                          ''
                        );
                      }

                      if (
                        role ===
                        'regression'
                      ) {
                        return (
                          item
                            ?.dataset
                            ?.metadata
                            ?.regressionType ===
                          'logarithmic'
                            ? 'Logarithmic regression'
                            : 'Linear regression'
                        );
                      }

                      return (
                        'Locum rate'
                      );
                    },

                    label(
                      tooltipItem
                    ) {
                      const role =
                        tooltipItem
                          .dataset
                          .datasetRole;

                      const raw =
                        tooltipItem
                          .raw;

                      const metadata =
                        tooltipItem
                          .dataset
                          .metadata ||
                        {};

                      if (
                        role ===
                        'regression'
                      ) {
                        const displayedSlope =
                          Number(
                            metadata.slope
                          ) *
                          Number(
                            metadata.slopeMultiplier ||
                            1
                          );

                        return [
                          `Slope: ${formatCurrency(
                            displayedSlope,
                            1
                          )}${metadata.slopeLabel || ''}`,

                          formatPValue(
                            Number(
                              metadata.pValue
                            )
                          )
                        ];
                      }

                      if (
                        role ===
                        'categoryMedian'
                      ) {
                        const statistics =
                          metadata.statistics ||
                          {};

                        return [
                          `Median [IQR]: ${formatMedianIqr(
                            statistics
                          )}`,

                          `Respondents: ${formatNumber(
                            statistics.count,
                            0
                          )}`
                        ];
                      }

                      if (
                        role ===
                        'locationAggregate'
                      ) {
                        const statistics =
                          raw?.statistics ||
                          {};

                        return [
                          `Median [IQR]: ${formatMedianIqr(
                            statistics
                          )}`,

                          `Respondents: ${formatNumber(
                            statistics.count,
                            0
                          )}`,

                          'Double-tap for raw rates'
                        ];
                      }

                      if (
                        role ===
                        'locationRaw'
                      ) {
                        return [
                          `Rate: ${formatCurrency(
                            raw?.hourlyRate,
                            1
                          )}/hour`,

                          ...buildRecordDetailLines(
                            raw
                          ),

                          `Median [IQR]: ${formatMedianIqr(
                            raw?.statistics
                          )}`,

                          `Respondents: ${formatNumber(
                            raw
                              ?.statistics
                              ?.count,
                            0
                          )}`
                        ];
                      }

                      if (
                        role ===
                          'categoryPoints' ||
                        role ===
                          'continuousPoints'
                      ) {
                        return [
                          `Rate: ${formatCurrency(
                            raw?.hourlyRate,
                            1
                          )}/hour`,

                          ...buildRecordDetailLines(
                            raw
                          )
                        ];
                      }

                      return '';
                    }
