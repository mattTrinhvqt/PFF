          }
        },
        layout: {
          autoPadding: false,
          padding: {
            top: 4,
            right: 12,
            bottom: 0,
            left: 0
          }
        },
        interaction: {
          mode: 'nearest',
          axis: 'xy',
          intersect: true,
          includeInvisible: false
        },
        onHover: handleChartHover,
        onClick: handleChartClick,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            enabled: true,
            events: [],
            mode: 'nearest',
            intersect: true,
            displayColors: false,
            backgroundColor: '#ffffff',
            titleColor: '#151515',
            bodyColor: '#69718a',
            borderColor: '#e8eaf0',
            borderWidth: 1,
            cornerRadius: 4,
            padding: 9,
            titleFont: {
              family: 'Lato',
              size: 12,
              weight: '700'
            },
            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },
            filter() {
              return !interactionLocked && !viewSwitchLocked;
            },
            callbacks: {
              title(items) {
                return tooltipTitle(items?.[0]);
              },
              label(item) {
                return tooltipLabel(item);
              }
            }
          }
        },
        scales: {
          x: createXAxisOptions(),
          y: createYAxisOptions(model.view, model.yAxis)
        }
      };
    }

    function distanceToSegment(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;

      if (dx === 0 && dy === 0) {
        return Math.hypot(px - ax, py - ay);
      }

      const proportion = clamp(
        ((px - ax) * dx + (py - ay) * dy) /
        (dx * dx + dy * dy),
        0,
        1
      );

      return Math.hypot(
        px - (ax + proportion * dx),
        py - (ay + proportion * dy)
      );
    }

    function findNearestSummaryLine(event, maximumDistance = 14) {
      if (!chart?.chartArea) {
        return null;
      }

      const x = Number(event?.x);
      const y = Number(event?.y);
      const area = chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let bestMatch = null;

      chart.data.datasets.forEach((dataset, datasetIndex) => {
        if (dataset.datasetRole !== 'summary') {
          return;
        }

        const rendered = chart.getDatasetMeta(datasetIndex)?.data || [];

        if (rendered.length < 2) {
          return;
        }

        const distance = distanceToSegment(
          x,
          y,
          rendered[0].x,
          rendered[0].y,
          rendered[1].x,
          rendered[1].y
        );

        if (distance <= maximumDistance && (
          !bestMatch || distance < bestMatch.distance
        )) {
          bestMatch = {
            datasetIndex,
            index: 0,
            distance
          };
        }
      });

      return bestMatch;
    }

    function getInteractiveElement(elements, event) {
      /*
       * Median bars take priority over nearby respondent squares. This
       * prevents the summary tooltip from being replaced as the pointer
       * moves along a bar that overlaps one or more raw observations.
       */
      return findNearestSummaryLine(event) ||
        (elements || []).find(element => {
          const role = chart?.data?.datasets?.[element.datasetIndex]?.datasetRole;
          return role === 'raw' || role === 'summary';
        });
    }

    function showSelectedTooltip(event, selectedElement) {
      if (!chart || !selectedElement) {
        return;
      }

      const renderedElement = chart
        .getDatasetMeta(selectedElement.datasetIndex)
        ?.data?.[selectedElement.index];

      const nextKey =
        `${selectedElement.datasetIndex}:${selectedElement.index}`;

      chart.tooltip.setActiveElements(
        [
          {
            datasetIndex: selectedElement.datasetIndex,
            index: selectedElement.index
          }
        ],
        {
          x: Number.isFinite(Number(event?.x))
            ? Number(event.x)
            : renderedElement?.x ?? 0,
          y: Number.isFinite(Number(event?.y))
            ? Number(event.y)
            : renderedElement?.y ?? 0
        }
      );

      if (activeTooltipKey === nextKey) {
        return;
      }

      activeTooltipKey = nextKey;

      /*
       * Tooltip events are disabled in the Chart.js tooltip plugin, so only
       * this manual selection controls the active tooltip. That prevents the
       * median tooltip being replaced by an overlapping respondent square.
       */
      chart.tooltip.update(true);
      chart.draw();
    }

    function handleChartHover(event, elements) {
      if (!chart || interactionLocked || viewSwitchLocked) {
        if (chart) {
          chart.canvas.style.cursor = 'default';
        }
        return;
      }

      const selectedElement = getInteractiveElement(elements, event);
      chart.canvas.style.cursor = selectedElement
        ? 'pointer'
        : 'default';

      if (tooltipPinned) {
        return;
      }

      if (selectedElement) {
        showSelectedTooltip(event, selectedElement);
        return;
      }

      if (activeTooltipKey) {
        activeTooltipKey = '';
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.tooltip.update(true);
        chart.draw();
      }
    }

    function handleChartClick(event, elements) {
      if (!chart || interactionLocked || viewSwitchLocked) {
        return;
      }

      event?.native?.preventDefault?.();

      const selectedElement = getInteractiveElement(elements, event);

      if (!selectedElement) {
        tooltipPinned = false;
        activeTooltipKey = '';
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.tooltip.update(true);
        chart.draw();
        return;
      }

      tooltipPinned = true;
      activeTooltipKey = '';
      showSelectedTooltip(event, selectedElement);
    }

    function applyModelToChart(model, animate = true) {
      chart.options.animation.duration = animate
        ? CONFIG.transitionMs
        : 0;

      model.datasets.forEach((target, index) => {
        const current = chart.data.datasets[index];

        if (!current) {
          chart.data.datasets[index] = target;
          return;
        }

        Object.assign(current, target);
        current.data = target.data;
      });

      chart.data.datasets.length = model.datasets.length;
      chart.options.scales.x = createXAxisOptions();
      chart.options.scales.y = createYAxisOptions(
        model.view,
        model.yAxis
      );

      chart.update(animate ? undefined : 'none');
    }

    function createChart() {
      const model = buildViewModel(activeView);
      currentYAxisModel = model.yAxis;
      axisNumberTransition.fromMaximum = model.yAxis.maximum;
      axisNumberTransition.toMaximum = model.yAxis.maximum;
      axisNumberTransition.progress = 1;
      displayedYAxisTitleParts = getYAxisTitleParts(activeView);

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: 'scatter',
          data: {
            datasets: model.datasets
          },
          options: createChartOptions(model),
          plugins: [
            constantSpinePlugin,
            variableAxisTickPlugin,
            animatedYAxisLabelPlugin
          ]
        }
      );

      updateLegend(model.legendItems, false);
      updateViewToggles();
    }

    function getHeadingParts(view) {
      const year = analysisWindow?.label
        ? `(${analysisWindow.label})`
        : '';

      if (view === 'affected') {
        return {
          lead: '% of optoms affected',
          shared: '',
          tail: '',
          year: analysisWindow.label ? `(${analysisWindow.label})` : ''
        };
      }

      if (view === 'employerCost') {
        return isTotalMode(view)
          ? {
              lead: 'Total $',
              shared: 'loss',
              tail: 'by employer',
              year
            }
          : {
              lead: '$',
              shared: 'loss per optom',
              tail: 'by employer',
              year
            };
      }

      if (view === 'employerTime') {
        return isTotalMode(view)
          ? {
              lead: 'Total time',
              shared: 'loss',
              tail: 'by employer',
              year
            }
          : {
              lead: 'Time',
              shared: 'loss per optom',
              tail: 'by employer',
              year
            };
      }

      const total = isTotalMode(view);
      const isTime = view === 'time';

      if (total) {
        return {
          lead: isTime ? 'Total time' : 'Total $',
          shared: 'loss',
          tail: '',
          year
        };
      }

      return {
        lead: isTime ? 'Time' : '$',
        shared: 'loss',
        tail: 'per optom',
        year
      };
    }

    function updateHeadingParts(nextParts, animate = true) {
      const elements = [
        chartHeadingLead,
        chartHeadingShared,
        chartHeadingTail,
        chartHeadingYear
      ];

      const keys = ['lead', 'shared', 'tail', 'year'];
      const previousText = elements.map(element => element.textContent);
      const nextText = keys.map(key => String(nextParts[key] || ''));

      if (previousText.every((value, index) => value === nextText[index])) {
        requestAnimationFrame(updateHeadingScrollControls);
        return;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      const token = ++headingAnimationToken;

      chartHeading.getAnimations?.().forEach(animation => animation.cancel());

      function commitHeadingText() {
        elements.forEach((element, index) => {
          element.textContent = nextText[index];
        });

        headingViewport.scrollLeft = 0;
        requestAnimationFrame(updateHeadingScrollControls);
      }

      if (!animate || reduceMotion || !chartHeading.animate) {
        commitHeadingText();
        chartHeading.style.opacity = '';
        return;
      }

      const fadeOut = chartHeading.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        {
          duration: 180,
          easing: 'ease-out',
          fill: 'forwards'
        }
      );

      fadeOut.finished
        .then(() => {
          if (token !== headingAnimationToken) {
            return;
          }

          fadeOut.cancel();
          commitHeadingText();

          const fadeIn = chartHeading.animate(
            [{ opacity: 0 }, { opacity: 1 }],
            {
              duration: 280,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );

          fadeIn.finished
            .then(() => fadeIn.cancel())
            .catch(() => {});
        })
        .catch(() => {
          if (token === headingAnimationToken) {
            commitHeadingText();
          }
        });
    }

    function updateHeading(animate = true) {
      updateHeadingParts(
        getHeadingParts(activeView),
        animate
      );
    }

    function updateViewToggles() {
      const config = VIEW_CONFIG[activeView] || {};
      const supportsControls = Boolean(
        config.supportsAffected || config.supportsTotal
      );
      const affectedActive = isAffectedOnly(activeView);
      const totalActive = isTotalMode(activeView);

      chartToggleGroup.classList.toggle('is-hidden', !supportsControls);
      affectedToggleButton.classList.toggle(
        'is-hidden',
        !config.supportsAffected
      );
      totalToggleButton.classList.toggle(
        'is-hidden',
        !config.supportsTotal
      );
      chartToggleGroup.setAttribute('aria-hidden', String(!supportsControls));

      affectedToggleButton.classList.toggle('is-active', affectedActive);
      affectedToggleButton.setAttribute('aria-checked', String(affectedActive));
      affectedToggleButton.querySelector('.pff-chart-toggle-value').textContent =
        affectedActive ? 'ON' : 'OFF';
      affectedToggleButton.tabIndex = config.supportsAffected ? 0 : -1;
      affectedToggleButton.disabled =
        !config.supportsAffected || interactionLocked || viewSwitchLocked;
      affectedToggleButton.setAttribute(
        'aria-label',
        affectedActive
          ? 'Show all optoms'
          : 'Show affected optoms'
      );

      totalToggleButton.classList.toggle('is-active', totalActive);
      totalToggleButton.setAttribute('aria-checked', String(totalActive));
      totalToggleButton.querySelector('.pff-chart-toggle-value').textContent =
        totalActive ? 'ON' : 'OFF';
      totalToggleButton.tabIndex = config.supportsTotal ? 0 : -1;
      totalToggleButton.disabled =
        !config.supportsTotal || interactionLocked || viewSwitchLocked;
      totalToggleButton.setAttribute(
        'aria-label',
        totalActive
          ? 'Show the median per optom instead of the total'
          : 'Show the total instead of the median per optom'
      );
    }

    function getAxisTickCount(axis) {
      const explicitTickCount = Number(axis?.displayTickCount);

      if (
        Number.isFinite(explicitTickCount) &&
        explicitTickCount >= 2
      ) {
        return Math.round(explicitTickCount);
      }

      return Math.max(
        2,
        Math.round(axis.maximum / axis.minorStep) + 1
      );
    }

    function sameAxisTickLayout(firstAxis, secondAxis) {
      /*
       * The ticks use evenly spaced positions between zero and one.
       * Their physical positions are therefore unchanged whenever
       * both axes display the same number of ticks.
       */
      return (
        getAxisTickCount(firstAxis) ===
        getAxisTickCount(secondAxis)
      );
    }

    function sameAxisNumbers(firstAxis, secondAxis) {
      return (
        firstAxis.maximum === secondAxis.maximum &&
        firstAxis.majorStep === secondAxis.majorStep &&
        firstAxis.minorStep === secondAxis.minorStep
      );
    }

    function applyView(
      nextView,
      animate = true,
      force = false,
      nextTotalMode = null,
      nextAffectedOnly = null
    ) {
      if (
        !chart ||
        viewSwitchLocked ||
        !VIEW_CONFIG[nextView] ||
        (!force && nextView === activeView)
      ) {
        return;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      const previousView = activeView;
      const viewChanged = nextView !== previousView;
      const previousAxis = currentYAxisModel || buildViewModel(previousView).yAxis;
      const previousTitleParts =
        displayedYAxisTitleParts || getYAxisTitleParts(previousView);

      if (
        nextTotalMode !== null &&
        VIEW_CONFIG[nextView]?.supportsTotal
      ) {
        totalModeByView[nextView] = Boolean(nextTotalMode);
      }

      if (
        nextAffectedOnly !== null &&
        VIEW_CONFIG[nextView]?.supportsAffected
      ) {
        affectedOnlyByView[nextView] = Boolean(nextAffectedOnly);
      }

      const nextModel = buildViewModel(nextView);
      const nextAxis = nextModel.yAxis;

      /*
       * A toggle changes the values within the current graph, not the graph's
       * structure. Retain the existing y-axis tick positions and animate the
       * labels between their old and new values. A tab change may use a new
       * tick layout and therefore fades the labels instead.
       */
      if (!viewChanged) {
        nextAxis.displayTickCount = getAxisTickCount(previousAxis);
      }

      const nextTitleParts = getYAxisTitleParts(nextView);

      const axisTickLayoutIdentical = sameAxisTickLayout(
        previousAxis,
        nextAxis
      );

      const axisNumbersIdentical = sameAxisNumbers(
        previousAxis,
        nextAxis
      );

      const titleIdentical = sameTitleParts(
        previousTitleParts,
        nextTitleParts
      );

      if (!animate || reduceMotion) {
        activeView = nextView;
        currentYAxisModel = nextAxis;
        axisNumberTransition.fromMaximum = nextAxis.maximum;
        axisNumberTransition.toMaximum = nextAxis.maximum;
        axisNumberTransition.progress = 1;
        axisLabelOpacity = 1;
        displayedYAxisTitleParts = nextTitleParts;
        axisTitleTransition.active = false;
        axisTitleTransition.progress = 1;
        axisTitleTransition.fromParts = null;
        axisTitleTransition.toParts = null;

        updateHeading(false);
        if (viewChanged) {
          updateActiveTab();
        }
        updateLegend(nextModel.legendItems, false);
        applyModelToChart(nextModel, false);
        updateViewToggles();
        return;
      }

      viewSwitchLocked = true;
      interactionLocked = true;
      tooltipPinned = false;
      activeTooltipKey = '';
      chart.tooltip.setActiveElements([], { x: 0, y: 0 });
      updateViewToggles();

      let pendingPreparations = 0;

      function commitNextView() {
        activeView = nextView;
        updateHeading(true);
        if (viewChanged) {
          updateActiveTab();
        }
        updateLegend(nextModel.legendItems, true);
        applyModelToChart(nextModel, true);
        currentYAxisModel = nextAxis;

        if (axisTickLayoutIdentical) {
          /*
           * The tick and grid-line positions have not changed. Keep them
           * fully visible and count the displayed numbers to their new
           * values rather than fading the whole axis out and back in.
           */
          axisLabelOpacity = 1;

          if (axisNumbersIdentical) {
            axisNumberTransition.fromMaximum = nextAxis.maximum;
            axisNumberTransition.toMaximum = nextAxis.maximum;
            axisNumberTransition.progress = 1;
          } else {
            animateAxisMaximum(
              previousAxis.maximum,
              nextAxis.maximum,
              CONFIG.transitionMs
            );
          }
        } else {
          /*
           * The graph requires a different number of tick positions.
           * The old axis has already faded out, so initialise the new
           * numbers and fade the new labels, ticks and grid lines in.
           */
          axisNumberTransition.fromMaximum = nextAxis.maximum;
          axisNumberTransition.toMaximum = nextAxis.maximum;
          axisNumberTransition.progress = 1;

          animateAxisLabelOpacity(
            0,
            1,
            CONFIG.axisFadeInMs
          );
        }

        if (titleIdentical) {
          displayedYAxisTitleParts = nextTitleParts;
        } else {
          animateYAxisTitleParts(
            previousTitleParts,
            nextTitleParts
          );
        }

        updateViewToggles();

        if (viewUnlockTimer !== null) {
          window.clearTimeout(viewUnlockTimer);
        }

        viewUnlockTimer = window.setTimeout(() => {
          viewUnlockTimer = null;
          viewSwitchLocked = false;
          interactionLocked = false;
          updateViewToggles();
          chart?.update('none');
        }, CONFIG.transitionMs + 40);
      }

      function preparationComplete() {
        pendingPreparations -= 1;

        if (pendingPreparations <= 0) {
          commitNextView();
        }
      }

      if (
        viewChanged &&
        !axisTickLayoutIdentical
      ) {
        pendingPreparations += 1;

        animateAxisLabelOpacity(
          axisLabelOpacity,
          0,
          CONFIG.axisFadeOutMs,
          preparationComplete
        );
      }

      if (pendingPreparations === 0) {
        commitNextView();
      }
    }

    function getEmployerAxisTitle(view = activeView) {
      if (view === 'employerTime') {
        return isTotalMode(view)
          ? 'Total time loss among respondents (hours/year)'
          : 'Time loss per optom (hours/year)';
      }

      return isTotalMode(view)
        ? 'Total $ loss among respondents (FTE $/year)'
        : '$ loss per optom (FTE $/year)';
    }

    function formatEmployerMetric(value, view = activeView) {
      if (!Number.isFinite(Number(value))) {
        return '—';
      }

      return view === 'employerTime'
        ? `${formatNumber(value, Math.abs(Number(value)) < 10 ? 1 : 0)} hrs`
        : formatCurrency(value, 0);
    }

    function formatEmployerAxisTick(value, view = activeView) {
      const compact = PFF.formatCompactNumber(value, {
        millionDecimals: 1,
        thousandDecimals: Math.abs(Number(value)) >= 10000 ? 0 : 1,
        decimals:
          Math.abs(Number(value)) < 10 &&
          Math.abs(Number(value) - Math.round(Number(value))) > 0.001
            ? 1
            : 0,
        invalid: ''
      });

      return view === 'employerTime'
        ? compact
        : compact
          ? `$${compact}`
          : '';
    }

    function getEmployerAxisSpec(values) {
      const finiteValues = (values || [])
        .map(Number)
        .filter(value => Number.isFinite(value) && value >= 0);

      const maximumValue = finiteValues.length
        ? Math.max(...finiteValues)
        : 0;

      const majorStep = niceStep(
        maximumValue > 0
          ? maximumValue / 5
          : 1
      );

      const maximum = Math.max(
        majorStep * 5,
        Math.ceil(maximumValue / majorStep) * majorStep
      );

      return {
        maximum,
        majorStep,
        minorStep: majorStep / 2
      };
    }

    function isEmployerMajorTick(value, axisSpec) {
      const numeric = Number(value);
      const step = Number(axisSpec?.majorStep);

      if (!Number.isFinite(numeric) || !Number.isFinite(step) || step <= 0) {
        return false;
      }

      const multiple = numeric / step;
      return Math.abs(multiple - Math.round(multiple)) < 1e-6;
    }

    function fixedEmployerYAxisWidth(scale) {
      scale.width = PFF.mobileLayout() ? 138 : 154;
    }

    function fixedEmployerXAxisHeight(scale) {
      scale.height = 46;
    }

    const employerOutlinePlugin = {
      id: 'pffEmployerOutlinePlugin',

      afterDatasetsDraw(chartInstance) {
        if (!employerModel?.groups?.length || !chartInstance.chartArea) {
          return;
        }

        const context = chartInstance.ctx;
        const xScale = chartInstance.scales.x;
        const firstMeta = chartInstance.getDatasetMeta(0);

        context.save();
        context.lineWidth = 0.9;

        employerModel.groups.forEach((group, index) => {
          const element = firstMeta?.data?.[index];
          const total = employerModel.totals[index];

          if (!element || !Number.isFinite(total)) {
            return;
          }

          const left = xScale.getPixelForValue(0);
          const right = xScale.getPixelForValue(total);
          const top = element.y - element.height / 2;
          const width = Math.max(0, right - left);
          const height = Math.max(0, element.height);
          const radius = Math.min(2, height / 2);

          context.beginPath();
          if (typeof context.roundRect === 'function') {
            context.roundRect(
              left + 0.45,
              top + 0.45,
              Math.max(0, width - 0.9),
              Math.max(0, height - 0.9),
              radius
            );
          } else {
            context.rect(
              left + 0.45,
              top + 0.45,
              Math.max(0, width - 0.9),
              Math.max(0, height - 0.9)
            );
          }

          context.strokeStyle = group.colour || '#777777';
          context.stroke();
        });

        context.restore();
      }
    };

    const employerTotalLabelsPlugin = {
      id: 'pffEmployerTotalLabels',

      afterDatasetsDraw(chartInstance) {
        if (!employerModel?.groups?.length) {
          return;
        }

        const context = chartInstance.ctx;
        const xScale = chartInstance.scales.x;
        const lastDatasetIndex = chartInstance.data.datasets.length - 1;
        const lastMeta = chartInstance.getDatasetMeta(lastDatasetIndex);

        context.save();
        context.fillStyle = '#151515';
        context.font = '700 10px Lato, sans-serif';
        context.textAlign = 'left';
        context.textBaseline = 'middle';

        employerModel.totals.forEach((total, index) => {
          const element = lastMeta?.data?.[index];

          if (!element || !Number.isFinite(total)) {
            return;
          }

          const text = formatEmployerMetric(total, employerModel.view);
          const textWidth = context.measureText(text).width;
          const preferredX = xScale.getPixelForValue(total) + 5;
          const fitsOutside =
            preferredX + textWidth <= chartInstance.chartArea.right + 44;

          if (fitsOutside) {
            context.textAlign = 'left';
            context.fillStyle = '#151515';
            context.fillText(text, preferredX, element.y);
          } else {
            context.textAlign = 'right';
            context.fillStyle = '#151515';
            context.fillText(
              text,
              Math.min(
                chartInstance.chartArea.right + 42,
                chartInstance.width - 4
              ),
              element.y
            );
          }
        });

        context.restore();
      }
    };

    const employerAxisTickPlugin = {
      id: 'pffEmployerAxisTickPlugin',

      afterDatasetsDraw(chartInstance) {
        if (!isEmployerView(activeView)) {
          return;
        }

        const axisSpec = employerModel?.axisSpec;

        drawVariableTicks(
          chartInstance.ctx,
          chartInstance.scales.x,
          'x',
          value => isEmployerMajorTick(value, axisSpec),
          1
        );

        drawVariableTicks(
          chartInstance.ctx,
          chartInstance.scales.y,
          'y',
          () => true,
          1
        );
      }
    };

    const employerThresholdNotePlugin = {
      id: 'pffEmployerThresholdNotePlugin',

      afterDraw(chartInstance) {
        if (!isEmployerView(activeView) || !chartInstance.chartArea) {
          return;
        }

        const context = chartInstance.ctx;
        const area = chartInstance.chartArea;
        const text = `Employers with n < ${CONFIG.minimumEmployerN} excluded`;
        const fontSize = PFF.mobileLayout() ? 8 : 8.5;
        const horizontalPadding = 7;
        const verticalPadding = 5;
        const radius = 4;

        context.save();
        context.font = `400 ${fontSize}px Lato, sans-serif`;
        context.textBaseline = 'middle';
        context.textAlign = 'left';

        const textWidth = context.measureText(text).width;
        const width = textWidth + horizontalPadding * 2;
        const height = fontSize * 1.3 + verticalPadding * 2;
        const x = area.right - width - 5;
        const y = area.bottom - height - 5;

        context.beginPath();
        if (typeof context.roundRect === 'function') {
          context.roundRect(x, y, width, height, radius);
        } else {
          context.moveTo(x + radius, y);
          context.lineTo(x + width - radius, y);
          context.quadraticCurveTo(x + width, y, x + width, y + radius);
          context.lineTo(x + width, y + height - radius);
          context.quadraticCurveTo(
            x + width,
            y + height,
            x + width - radius,
            y + height
          );
          context.lineTo(x + radius, y + height);
          context.quadraticCurveTo(x, y + height, x, y + height - radius);
          context.lineTo(x, y + radius);
          context.quadraticCurveTo(x, y, x + radius, y);
        }

        context.fillStyle = 'rgba(255, 255, 255, 0.90)';
        context.fill();
        context.strokeStyle = 'rgba(105, 113, 138, 0.16)';
        context.lineWidth = 1;
        context.stroke();

        context.fillStyle = PFF.cssVar('--pff-muted', '#69718a');
        context.fillText(
          text,
          x + horizontalPadding,
          y + height / 2
        );
        context.restore();
      }
    };

    function employerTooltipLabel(item) {
      const modeLabel = isTotalMode(employerModel?.view)
        ? 'Total'
        : 'Median per optom';

      return (
        `${item.dataset.label} — ${modeLabel}: ` +
        `${formatEmployerMetric(item.parsed.x, employerModel?.view)}/year`
      );
    }

    function employerTooltipFooter(items) {
      const index = items?.[0]?.dataIndex;
      const group = employerModel?.groups?.[index];

      if (!group) {
        return [];
      }

      const totalLabel = isTotalMode(employerModel.view)
        ? 'Total'
        : 'Combined category medians';

      return [
        `${totalLabel}: ${formatEmployerMetric(group.displayTotal, employerModel.view)}/year`,
        `Respondents included: ${formatNumber(group.responseCount, 0)}`
      ];
    }

    function createEmployerChart() {
      employerModel = buildEmployerModel(activeView);
      employerModel.axisSpec = getEmployerAxisSpec(employerModel.totals);

      employerChart = new Chart(
        employerCanvas.getContext('2d'),
        {
          type: 'bar',
          data: {
            labels: employerModel.labels,
            datasets: employerModel.datasets
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            resizeDelay: 0,
            devicePixelRatio: Math.min(
              window.devicePixelRatio || 1,
              PFF.defaults.maxDevicePixelRatio
            ),
            animation: {
              duration: PFF.reducedMotion() ? 0 : CONFIG.transitionMs,
              easing: 'easeOutCubic'
            },
            transitions: {
              resize: {
                animation: {
                  duration: 0
                }
              },
              active: {
                animation: {
                  duration: PFF.defaults.hoverAnimationMs,
                  easing: 'easeOutCubic'
                }
              }
            },
            layout: {
              autoPadding: false,
              padding: {
                top: 8,
                right: 48,
                bottom: 0,
                left: 0
              }
            },
            interaction: {
              mode: 'index',
              axis: 'y',
              intersect: false,
              includeInvisible: false
            },
            onHover(event, elements) {
              employerChart.canvas.style.cursor =
                !interactionLocked && elements.length
                  ? 'pointer'
                  : 'default';
            },
            plugins: {
              legend: {
                display: false
              },
              tooltip: PFFCharts.tooltipOptions({
                filter() {
                  return !interactionLocked;
                },
                callbacks: {
                  title(items) {
                    const index = items?.[0]?.dataIndex;
                    return employerModel?.groups?.[index]?.label || '';
                  },
                  label: employerTooltipLabel,
                  footer: employerTooltipFooter
                }
              })
            },
            scales: {
              x: {
                type: 'linear',
                afterFit: fixedEmployerXAxisHeight,
                stacked: true,
                beginAtZero: true,
                min: 0,
                max: employerModel.axisSpec.maximum,
                afterBuildTicks(scale) {
                  const ticks = [];
                  const step = employerModel.axisSpec.minorStep;

                  for (
                    let value = 0;
                    value <= employerModel.axisSpec.maximum + step * 0.25;
                    value += step
                  ) {
                    ticks.push({ value });
                  }

                  scale.ticks = ticks;
                },
                title: {
                  display: true,
                  text: getEmployerAxisTitle(activeView),
                  color: '#151515',
                  font: {
                    family: 'Lato',
                    size: 13,
                    weight: '700'
                  },
                  padding: {
                    top: 7,
                    bottom: 2
                  }
                },
                ticks: {
                  color: '#151515',
                  autoSkip: false,
                  padding: 3,
                  font: {
                    family: 'Lato',
                    size: 12,
                    weight: '400'
                  },
                  callback(value) {
                    return isEmployerMajorTick(value, employerModel.axisSpec)
                      ? formatEmployerAxisTick(value, employerModel.view)
                      : '';
                  }
                },
                grid: {
                  color(context) {
                    return isEmployerMajorTick(
                      context.tick?.value,
                      employerModel.axisSpec
                    )
                      ? 'rgba(105, 113, 138, 0.075)'
                      : 'rgba(105, 113, 138, 0.035)';
                  },
                  lineWidth(context) {
                    return isEmployerMajorTick(
                      context.tick?.value,
                      employerModel.axisSpec
                    )
                      ? 1
                      : 0.7;
                  },
                  drawTicks: true,
                  tickLength: 6,
                  tickColor: 'rgba(21, 21, 21, 0)',
                  tickWidth: 0
                },
                border: {
                  display: false
                }
              },
              y: {
                afterFit: fixedEmployerYAxisWidth,
                stacked: true,
                offset: true,
                ticks: {
                  color: '#151515',
                  autoSkip: false,
                  padding: 5,
                  font: {
                    family: 'Lato',
                    size: PFF.mobileLayout() ? 9 : 10,
                    weight: '400'
                  },
                  callback(value) {
                    return wrapEmployerLabel(
                      this.getLabelForValue(value),
                      PFF.mobileLayout() ? 15 : 18
                    );
                  }
                },
                grid: {
                  drawOnChartArea: false,
                  drawTicks: false
                },
                border: {
                  display: false
                }
              }
            }
          },
          plugins: [
            constantSpinePlugin,
            employerAxisTickPlugin,
            employerOutlinePlugin,
            employerTotalLabelsPlugin,
            employerThresholdNotePlugin
          ]
        }
      );
    }

    function updateEmployerChart(animate = true) {
      employerModel = buildEmployerModel(activeView);
      employerModel.axisSpec = getEmployerAxisSpec(employerModel.totals);

      if (!employerChart) {
        createEmployerChart();
        return;
      }

      employerChart.data.labels = employerModel.labels;
      employerChart.data.datasets = employerModel.datasets;
      employerChart.options.scales.x.max = employerModel.axisSpec.maximum;
      employerChart.options.scales.x.title.text = getEmployerAxisTitle(activeView);
      employerChart.options.layout.padding.right = 48;

      employerChart.update(animate ? undefined : 'none');
    }

    function setChartFamilyVisibility(showEmployer, animate = true, onComplete) {
      const fromEmployer = employerCanvas.classList.contains('is-visible');
      const startEmployerOpacity = fromEmployer ? 1 : 0;
      const endEmployerOpacity = showEmployer ? 1 : 0;

      chartFamilyAnimator.run({
        duration: animate ? CONFIG.chartFamilyFadeMs : 0,
        easing: easeInOutCubic,
        onFrame(progress) {
          const employerOpacity =
            startEmployerOpacity +
            (endEmployerOpacity - startEmployerOpacity) * progress;

          employerCanvas.style.opacity = String(employerOpacity);
          chartCanvas.style.opacity = String(1 - employerOpacity);
        },
        onComplete() {
          employerCanvas.style.opacity = showEmployer ? '1' : '0';
          chartCanvas.style.opacity = showEmployer ? '0' : '1';
          employerCanvas.classList.toggle('is-visible', showEmployer);
          chartCanvas.classList.toggle('is-hidden-family', showEmployer);
          employerCanvas.style.pointerEvents = showEmployer ? 'auto' : 'none';
          chartCanvas.style.pointerEvents = showEmployer ? 'none' : 'auto';
          onComplete?.();
        }
      });
    }

    function switchChartFamily(nextView, animate = true) {
      if (viewSwitchLocked || interactionLocked) {
        return;
      }

      const currentIsEmployer = isEmployerView(activeView);
      const nextIsEmployer = isEmployerView(nextView);

      if (!currentIsEmployer && !nextIsEmployer) {
        applyView(nextView, animate);
        return;
      }

      if (currentIsEmployer && nextIsEmployer) {
        viewSwitchLocked = true;
        interactionLocked = true;
        activeView = nextView;
        updateHeading(true);
        updateActiveTab();
        updateLegend(CATEGORY_CONFIG, true);
        updateViewToggles();
        updateEmployerChart(animate);

        window.setTimeout(() => {
          viewSwitchLocked = false;
          interactionLocked = false;
          updateViewToggles();
        }, animate && !PFF.reducedMotion() ? CONFIG.transitionMs + 40 : 0);

        return;
      }

      viewSwitchLocked = true;
      interactionLocked = true;
      tooltipPinned = false;
      activeTooltipKey = '';

      if (nextIsEmployer) {
        activeView = nextView;
        updateEmployerChart(false);
        updateHeading(true);
        updateActiveTab();
        updateLegend(CATEGORY_CONFIG, true);
        updateViewToggles();

        setChartFamilyVisibility(true, animate, () => {
          viewSwitchLocked = false;
          interactionLocked = false;
          updateViewToggles();
        });

        return;
      }

      activeView = nextView;

      const model = buildViewModel(activeView);
      currentYAxisModel = model.yAxis;
      axisNumberTransition.fromMaximum = model.yAxis.maximum;
      axisNumberTransition.toMaximum = model.yAxis.maximum;
      axisNumberTransition.progress = 1;
      axisLabelOpacity = 1;
      displayedYAxisTitleParts = getYAxisTitleParts(activeView);
      axisTitleTransition.active = false;
      axisTitleTransition.progress = 1;
      axisTitleTransition.fromParts = null;
      axisTitleTransition.toParts = null;
      applyModelToChart(model, false);
      updateHeading(true);
      updateActiveTab();
      updateLegend(model.legendItems, true);
      updateViewToggles();

      setChartFamilyVisibility(false, animate, () => {
        viewSwitchLocked = false;
        interactionLocked = false;
        updateViewToggles();
      });
    }

    function requestViewSwitch(nextView) {
      if (
        nextView === activeView ||
        interactionLocked ||
        viewSwitchLocked ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      switchChartFamily(nextView, true);
    }

    function updateHeadingScrollControls() {
      headingScroller?.update();
    }

    function updateLegendScrollControls() {
      legendController?.refresh();
    }

    function updateLegend(items, animate = true) {
      legendController?.update(
        (items || []).map(item => ({
          label: item.legendLabel || item.label,
          colour: item.colour,
          markerType: 'square'
        })),
        animate
      );
    }

    function updateTabScrollHints() {
      tabController?.update();
    }

    function updateTabIndicator() {
      tabController?.update();
    }

    function updateActiveTab() {
      tabController?.set(activeView, {
        notify: false
      });
    }

    tabController = PFF.setupTabs({
      tabList,
      tabs: chartTabs,
      valueAttribute: 'view',
      initialValue: activeView,
      controlled: true,
      leftButton: tabScrollLeft,
      rightButton: tabScrollRight,
      onRequest: requestViewSwitch
    });

    headingScroller = PFF.setupScrollableRegion({
      scroller: headingViewport,
      leftButton: headingScrollLeft,
      rightButton: headingScrollRight,
      minimum: 90
    });

    legendController = PFFCharts.setupDisplayLegend({
      legend: chartLegend,
      leftButton: legendScrollLeft,
      rightButton: legendScrollRight
    });

    affectedToggleButton.addEventListener('click', () => {
      if (
        interactionLocked ||
        viewSwitchLocked ||
        !VIEW_CONFIG[activeView]?.supportsAffected
      ) {
        return;
      }

      const nextAffectedOnly = !affectedOnlyByView[activeView];
      applyView(
        activeView,
        true,
        true,
        null,
        nextAffectedOnly
      );
    });

    totalToggleButton.addEventListener('click', () => {
      if (
        interactionLocked ||
        viewSwitchLocked ||
        !VIEW_CONFIG[activeView]?.supportsTotal
      ) {
        return;
      }

      const nextTotalMode = !totalModeByView[activeView];

      if (isEmployerView(activeView)) {
        totalModeByView[activeView] = nextTotalMode;
        updateHeading(true);
        updateEmployerChart(true);
        updateViewToggles();
        return;
      }

      applyView(
        activeView,
        true,
        true,
        nextTotalMode,
        null
      );
    });

    [chartCanvas, employerCanvas].forEach(canvas => {
      canvas.addEventListener('contextmenu', event => {
        event.preventDefault();
      });

      canvas.addEventListener('selectstart', event => {
        event.preventDefault();
      });
    });

    chartCanvas.addEventListener('mouseleave', () => {
      if (!chart) {
        return;
      }

      chart.canvas.style.cursor = 'default';

      if (tooltipPinned) {
        return;
      }

      activeTooltipKey = '';
      chart.tooltip?.setActiveElements([], { x: 0, y: 0 });
      chart.tooltip?.update(true);
      chart.draw();
    });

    document.addEventListener('pointerdown', event => {
      if (
        !event.target.closest('#lossWorkChart') &&
        !event.target.closest('#employerWorkChart') &&
        chart
      ) {
        tooltipPinned = false;
        activeTooltipKey = '';
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.tooltip.update(true);
        chart.draw();
      }
    });

    function refreshResponsiveLayout() {
      if (responsiveLayoutFrame !== null) {
        cancelAnimationFrame(responsiveLayoutFrame);
      }

      responsiveLayoutFrame = requestAnimationFrame(() => {
        responsiveLayoutFrame = null;

        if (isEmployerView(activeView)) {
          updateEmployerChart(false);
          employerChart?.resize();
          employerChart?.update('none');
        } else if (chart) {
          const model = buildViewModel(activeView);
          currentYAxisModel = model.yAxis;
          axisNumberTransition.fromMaximum = model.yAxis.maximum;
          axisNumberTransition.toMaximum = model.yAxis.maximum;
          axisNumberTransition.progress = 1;
          axisLabelOpacity = 1;
          displayedYAxisTitleParts = getYAxisTitleParts(activeView);
          axisTitleTransition.active = false;
          axisTitleTransition.progress = 1;
          axisTitleTransition.fromParts = null;
          axisTitleTransition.toParts = null;
          applyModelToChart(model, false);
          chart.resize();
          chart.update('none');
          updateLegend(model.legendItems, false);
          updateViewToggles();
        }

        updateTabIndicator(false);
        updateHeadingScrollControls();
        updateLegendScrollControls();
      });
    }

    const responsiveController = PFFCharts.createResponsiveController({
      getChart: () => isEmployerView(activeView) ? employerChart : chart,
      observe: [app, chartShell, headingViewport],
      applyResponsiveChartOptions: false,
      onRefresh: refreshResponsiveLayout
    });

    function setStatus(message = '') {
      PFF.setStatus(message, statusElement);
    }

    function hideLoadingState() {
      PFF.hideLoadingState(app);
      refreshResponsiveLayout();
    }

    async function loadDashboard() {
      try {
        setStatus();

        sourceRows =
          await loadSourceRowsWithFallback();

        const resolved = resolveAnalysisWindow(sourceRows);
        analysisWindow = resolved.window;
        rows = resolved.rows.map(calculateRowMetrics);

        if (!rows.length) {
          throw new Error(
            `No responses were found in ${analysisWindow.label}`
          );
        }

        const initialModel = buildViewModel(activeView);
        const hasAnyMetric = initialModel.datasets.some(dataset =>
          dataset.datasetRole === 'summary' && dataset.data.length
        );

        if (!hasAnyMetric) {
          throw new Error(
            'No valid BI:BL loss-work responses were found for the selected financial year'
          );
        }

        updateHeading(false);
        updateViewToggles();

        hideLoadingState();
        createChart();
        updateTabIndicator(false);
        setStatus();

        requestAnimationFrame(() => {
          if (!chart) {
            return;
          }

          chart.resize();
          chart.update('none');
        });
      } catch (error) {
        console.error(error);
        PFF.setDataSourceIndicator('none', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });
        hideLoadingState();

        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load work loss data'
          ).replace(/\.+$/, '')
        );
      }
    }

    updateTabIndicator(false);
    loadDashboard();
  </script>
</body>
</html>
