<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Australian Population Trends</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js"></script>

  <style>
    :root {
      --population-green: #0b5d1e;
    }

    .chart-options-row {
      min-height: 28px;
      padding-bottom: 2px;
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading Australian population data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading Australian population data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Australian population chart"
          >
            <button
              id="populationTab"
              class="chart-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              data-view="population"
            >Population</button>
          </div>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
          aria-live="polite"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 class="chart-heading">Australian population</h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3-year trend. Press to switch to 10-year trend."
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>
        </div>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <div class="legend-viewport">
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Chart legend"
            ></div>
          </div>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="trendChart"
          aria-label="Australian population trend chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const CONFIG = {
      sheetId:
        '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE',

      sheetName:
        'Auspopnbystate',

      // Row 30 = headers; row 31 onward = raw data.
      // A = Year; J = Australia.
      range:
        'A30:J',

      fetchTimeoutMs:
        15000,

      cacheFetchTimeoutMs:
        10000,

      localCacheKey:
        'pff-australian-population-trends-v1',

      scaleTargetIntervals:
        7
    };

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'pff-australian-population-trends';

    const AUSTRALIA_COLOUR =
      '#0b5d1e';

    const app =
      document.getElementById('app');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const populationTab =
      document.getElementById('populationTab');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const chartLegend =
      document.getElementById('chartLegend');

    const chartShell =
      document.getElementById('chartShell');

    const chartCanvas =
      document.getElementById('trendChart');

    let rows = [];
    let chart = null;
    let chartSummary = null;
    let seriesHidden = false;
    let tabsController = null;
    let headingScroller = null;
    let trendController = null;
    let legendController = null;
    let interactionsController = null;
    let responsiveController = null;

    function populationNumber(cell) {
      const direct =
        PFFCharts.numericCell(
          cell
        );

      if (
        Number.isFinite(
          direct
        )
      ) {
        return direct;
      }

      const cleaned =
        PFF.cleanText(
          cell?.f ??
          cell?.v ??
          ''
        )
          .replace(/,/g, '')
          .replace(/[^\d.-]/g, '');

      const number =
        Number(
          cleaned
        );

      return Number.isFinite(
        number
      )
        ? number
        : NaN;
    }

    function normalisePopulationRows(sourceRows) {
      return (
        Array.isArray(sourceRows)
          ? sourceRows
          : []
      )
        .map(row => {
          if (
            Array.isArray(
              row
            )
          ) {
            return {
              year:
                Number(
                  row?.[0]
                ),
              value:
                Number(
                  row?.[1]
                )
            };
          }

          return {
            year:
              Number(
                row?.year
              ),
            value:
              Number(
                row?.value
              )
          };
        })
        .filter(
          row =>
            Number.isFinite(
              row.year
            ) &&
            row.year >= 1900 &&
            row.year <= 2200 &&
            Number.isFinite(
              row.value
            ) &&
            row.value >= 0
        )
        .map(row => ({
          year:
            Math.round(
              row.year
            ),
          value:
            row.value
        }))
        .sort(
          (
            first,
            second
          ) =>
            first.year -
            second.year
        );
    }

    function parsePopulationTable(table) {
      const parsed = [];

      (
        table?.rows ||
        []
      ).forEach(sourceRow => {
        const cells =
          sourceRow?.c ||
          [];

        const year =
          populationNumber(
            cells[0]
          );

        const australia =
          populationNumber(
            cells[9]
          );

        if (
          !Number.isFinite(
            year
          ) ||
          year < 1900 ||
          year > 2200 ||
          !Number.isFinite(
            australia
          )
        ) {
          return;
        }

        parsed.push({
          year:
            Math.round(
              year
            ),
          value:
            australia
        });
      });

      return normalisePopulationRows(
        parsed
      );
    }

    function parseRemoteRows(snapshot) {
      return normalisePopulationRows(
        snapshot?.data?.rows
      );
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(
            raw
          );

        if (
          Array.isArray(
            parsed?.data
          ) &&
          parsed.data.length
        ) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            normalisePopulationRows(
              parsed.data
            )
          );
        }
      } catch (_) {
      }
    }

    function formatMillions(value) {
      const number =
        Number(
          value
        );

      if (
        !Number.isFinite(
          number
        )
      ) {
        return '';
      }

      if (
        Math.abs(
          number
        ) < 0.5
      ) {
        return '0';
      }

      const millions =
        number /
        1000000;

      const rounded =
        Math.round(
          millions *
          10
        ) /
        10;

      return `${
        Number.isInteger(
          rounded
        )
          ? rounded.toFixed(0)
          : rounded.toFixed(1)
      }m`;
    }

    function niceStep(value) {
      if (
        !Number.isFinite(
          value
        ) ||
        value <= 0
      ) {
        return 1000000;
      }

      const exponent =
        Math.floor(
          Math.log10(
            value
          )
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        value /
        magnitude;

      const multipliers =
        [
          1,
          2,
          2.5,
          5,
          10
        ];

      const multiplier =
        multipliers.find(
          candidate =>
            fraction <=
            candidate
        ) ??
        10;

      return multiplier *
        magnitude;
    }

    function populationScale() {
      const maximumObserved =
        rows.reduce(
          (
            maximum,
            row
          ) =>
            Number.isFinite(
              row?.value
            )
              ? Math.max(
                  maximum,
                  row.value
                )
              : maximum,
          0
        );

      const paddedMaximum =
        maximumObserved > 0
          ? maximumObserved *
            1.06
          : 30000000;

      const step =
        niceStep(
          paddedMaximum /
          CONFIG.scaleTargetIntervals
        );

      const max =
        Math.max(
          step,
          Math.ceil(
            paddedMaximum /
            step
          ) *
          step
        );

      return {
        min:
          0,
        max,
        step,
        intervals:
          Math.max(
            1,
            Math.round(
              max /
              step
            )
          )
      };
    }

    function trendGrowth() {
      if (
        !trendController ||
        trendController.mode ===
          'off'
      ) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        rows,
        row =>
          row.value,
        trendController.windowSize
      );
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const latest =
        rows.at(-1);

      const growth =
        trendGrowth();

      const trendText =
        Number.isFinite(
          growth
        )
          ? ` ${trendController.windowSize}-year trend ${growth >= 0 ? '+' : '−'}${Math.abs(growth).toFixed(1)}% per year.`
          : '';

      PFFCharts.updateChartSummary(
        latest
          ? `Australian population. Latest value ${PFF.formatInteger(latest.value)} in ${latest.year}.${trendText}`
          : 'Australian population chart.',
        chartSummary
      );
    }

    function yScaleOptions() {
      const scale =
        populationScale();

      const halfStep =
        scale.step /
        2;

      return PFFCharts.yScaleOptions(
        scale,
        {
          border: {
            display:
              false
          },

          grid: {
            display:
              true,
            drawOnChartArea:
              true,
            drawTicks:
              true,
            tickColor:
              '#151515',
            tickWidth:
              1,
            tickLength(context) {
              const index =
                context.index ??
                0;

              return index % 2 === 0
                ? 5
                : 2;
            },
            color(context) {
              const index =
                context.index ??
                0;

              return index % 2 === 0
                ? 'rgba(105, 113, 138, 0.075)'
                : 'rgba(105, 113, 138, 0.035)';
            },
            lineWidth(context) {
              const index =
                context.index ??
                0;

              return index % 2 === 0
                ? 1
                : 0.7;
            }
          },

          ticks: {
            display:
              true,
            autoSkip:
              false,
            stepSize:
              halfStep,
            color:
              '#151515',
            padding:
              3,
            font: {
              family:
                'Lato',
              size:
                PFF.mobileLayout()
                  ? 10
                  : 11,
              weight:
                '400'
            },
            callback(
              value,
              index
            ) {
              return index % 2 === 0
                ? formatMillions(
                    value
                  )
                : '';
            }
          },

          title: {
            display:
              true,
            text:
              'Population',
            color:
              '#151515',
            padding: {
              bottom:
                4
            },
            font: {
              family:
                'Lato',
              size:
                PFF.mobileLayout()
                  ? 12
                  : 13,
              weight:
                '700'
            }
          }
        }
      );
    }

    const yearTickPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'populationYearTicks',
        isMajor(value) {
          return (
            Number.isFinite(
              Number(
                value
              )
            ) &&
            Number(
              value
            ) % 2 === 0
          );
        }
      });

    const axisSpinesPlugin =
      PFFCharts.createAxisSpinesPlugin({
        id:
          'populationAxisSpines',
        lineWidth:
          1.1
      });

    const trendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'populationTrendLabels',

        enabled() {
          return (
            trendController?.mode !==
              'off' &&
            !seriesHidden
          );
        },

        isActive({
          dataset,
          meta
        }) {
          return (
            dataset?._activeSeries !==
              false &&
            !meta?.hidden
          );
        },

        getTrendValue() {
          return trendGrowth();
        },

        getSeriesColour() {
          return AUSTRALIA_COLOUR;
        },

        formatValue(value) {
          return `${Math.abs(value).toFixed(1)}% p.a.`;
        }
      });

    function buildDataset() {
      return PFFCharts.lineDataset({
        label:
          'Australia',

        _seriesLabel:
          'Australia',

        _activeSeries:
          !seriesHidden,

        data:
          rows.map(
            row =>
              row.value
          ),

        borderColor:
          AUSTRALIA_COLOUR,

        backgroundColor:
          AUSTRALIA_COLOUR,

        pointBackgroundColor:
          AUSTRALIA_COLOUR,

        pointBorderColor:
          '#ffffff',

        borderWidth:
          3,

        pointRadius:
          0,

        pointHoverRadius:
          4,

        pointHitRadius:
          PFF.mobileLayout()
            ? 9
            : 5,

        pointBorderWidth:
          1,

        cubicInterpolationMode:
          'monotone',

        hidden:
          seriesHidden
      });
    }

    function createChart() {
      const scale =
        populationScale();

      const options =
        PFFCharts.baseChartOptions({
          plugins: {
            tooltip:
              PFFCharts.tooltipOptions({
                displayColors:
                  false,
                callbacks: {
                  title(items) {
                    const index =
                      items?.[0]?.dataIndex;

                    return Number.isInteger(
                      index
                    )
                      ? String(
                          rows?.[index]?.year ??
                          ''
                        )
                      : '';
                  },

                  label(context) {
                    const value =
                      Number(
                        context.raw
                      );

                    const valueText =
                      `Australia: ${PFF.formatInteger(value)}`;

                    const growth =
                      trendGrowth();

                    if (
                      !Number.isFinite(
                        growth
                      )
                    ) {
                      return valueText;
                    }

                    const sign =
                      growth > 0
                        ? '+'
                        : growth < 0
                          ? '−'
                          : '';

                    return `${valueText} · ${sign}${Math.abs(growth).toFixed(1)}% p.a.`;
                  }
                }
              })
          },

          scales: {
            x:
              PFFCharts.xYearScaleOptions({
                ticks: {
                  callback(value) {
                    const label =
                      this.getLabelForValue(
                        value
                      );

                    const year =
                      Number(
                        label
                      );

                    return (
                      Number.isFinite(
                        year
                      ) &&
                      year % 2 === 0
                    )
                      ? String(
                          year
                        )
                      : '';
                  }
                }
              }),

            y:
              yScaleOptions()
          }
        });

      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type:
              'line',
            data: {
              labels:
                rows.map(
                  row =>
                    String(
                      row.year
                    )
                ),
              datasets: [
                buildDataset()
              ]
            },
            options,
            plugins: [
              trendLabelsPlugin,
              yearTickPlugin,
              axisSpinesPlugin
            ]
          }
        );

      chart.options.scales.y.min =
        scale.min;

      chart.options.scales.y.max =
        scale.max;

      chart.update(
        'none'
      );

      updateAccessibleSummary();
    }

    function setupControls() {
      tabsController =
        PFF.setupTabs({
          tabList,
          tabs: [
            populationTab
          ],
          valueAttribute:
            'view',
          initialValue:
            'population'
        });

      headingScroller =
        PFF.setupScrollableRegion({
          scroller:
            headingScrollViewport,
          leftButton:
            headingScrollLeft,
          rightButton:
            headingScrollRight
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,
          initialMode:
            '3yr',
          onChange() {
            chart?.draw();
            updateAccessibleSummary();
          }
        });

      legendController =
        PFFCharts.setupLegend({
          legend:
            chartLegend,
          getChart() {
            return chart;
          },
          getItems() {
            return [
              {
                datasetIndex:
                  0,
                label:
                  'Australia',
                colour:
                  AUSTRALIA_COLOUR,
                active:
                  !seriesHidden
              }
            ];
          },
          updateMode:
            'none',
          onToggle({
            visible
          }) {
            seriesHidden =
              !visible;

            if (
              chart?.data?.datasets?.[0]
            ) {
              chart.data.datasets[0]._activeSeries =
                visible;
            }

            updateAccessibleSummary();
          }
        });

      interactionsController =
        PFFCharts.setupChartInteractions({
          canvas:
            chartCanvas,
          getChart() {
            return chart;
          }
        });
    }

    migrateLegacyLocalCache();
    setupControls();

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      loadLive() {
        return PFFCharts.loadGVizSheet({
          sheetId:
            CONFIG.sheetId,
          sheetName:
            CONFIG.sheetName,
          range:
            CONFIG.range,
          headers:
            '1',
          timeoutMs:
            CONFIG.fetchTimeoutMs
        });
      },

      parseLive:
        parsePopulationTable,

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,
          appKey:
            CACHE_APP_KEY,
          timeoutMs:
            CONFIG.cacheFetchTimeoutMs
        });
      },

      parseRemoteCache:
        parseRemoteRows,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        3,

      onLiveError(error) {
        console.warn(
          'Live Australian population data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(error) {
        console.warn(
          'Apps Script Australian population cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,
        text:
          dataSourceText
      },

      render(loaded) {
        rows =
          normalisePopulationRows(
            loaded.rows
          );

        chartSummary =
          PFFCharts.ensureChartSummary({
            canvas:
              chartCanvas,
            id:
              'populationChartSummary'
          });

        createChart();
        legendController.render();
        tabsController.update();
        headingScroller.update();

        responsiveController =
          PFFCharts.createResponsiveController({
            getChart() {
              return chart;
            },
            observe: [
              app,
              chartShell
            ],
            onRefresh() {
              tabsController?.update();
              headingScroller?.update();
            }
          });

        return chart;
      },

      errorMessage:
        'Australian population data unavailable.'
    });
  </script>
</body>
</html>
