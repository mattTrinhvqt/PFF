  <style>

    :root {
      --landscape-purple: #6600ff;
      --landscape-unclassified: #bfc3c7;
      --landscape-australia: #0b5d1e;
    }

    .loader-ellipsis {
      display: inline-flex;
      width: 1.12em;
    }

    .loader-ellipsis > span {
      opacity: 0;
      animation-duration: 1.2s;
      animation-timing-function: steps(1, end);
      animation-iteration-count: infinite;
    }

    .loader-ellipsis > span:nth-child(1) {
      animation-name: landscapeLoaderDotOne;
    }

    .loader-ellipsis > span:nth-child(2) {
      animation-name: landscapeLoaderDotTwo;
    }

    .loader-ellipsis > span:nth-child(3) {
      animation-name: landscapeLoaderDotThree;
    }

    @keyframes landscapeLoaderDotOne {
      0%, 19.9% { opacity: 0; }
      20%, 99.9% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes landscapeLoaderDotTwo {
      0%, 44.9% { opacity: 0; }
      45%, 99.9% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes landscapeLoaderDotThree {
      0%, 69.9% { opacity: 0; }
      70%, 99.9% { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-ellipsis > span {
        opacity: 1;
        animation: none;
      }
    }

    .chart-heading-row {
      align-items: flex-start;
      gap: 6px;
    }

    .chart-heading-row .heading-scroll-shell {
      min-width: 0;
      flex: 1 1 auto;
    }

    .chart-heading-row .heading-scroll-viewport {
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .chart-heading-row .heading-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    .chart-heading {
      width: max-content;
      min-width: max-content;
      max-width: none;
      margin: 0;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
    }

    .chart-heading-fixed:empty + .chart-heading-detail {
      margin-left: 0;
    }

    .heading-controls {
      margin-left: auto;
      padding-top: 2px;
      flex: 0 0 auto;
    }






    .area-button {
      min-width: 84px;
      grid-template-columns: max-content minmax(30px, 1fr) 8px;
      gap: 3px;
      padding-right: 4px;
      padding-left: 4px;
    }

    .area-menu {
      min-width: 164px;
      max-height: min(390px, calc(100vh - 92px));
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 113, 138, 0.34) transparent;
    }



    .area-option-name {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .chart-scroll {
      position: absolute;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 113, 138, 0.30) transparent;
    }

    .chart-scroll.is-scrollable {
      overflow-x: hidden;
      overflow-y: auto;
    }

    .chart-stage {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 100%;
    }

    .chart-stage canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      opacity: 1;
      will-change: opacity;
    }

    @media (max-width: 430px) {

      .area-button {
        min-width: 80px;
        padding-right: 4px;
        padding-left: 4px;
      }

      .area-menu {
        width: min(238px, calc(100vw - 14px));
      }

    }

    @media (max-width: 350px) {
      .area-button {
        min-width: 78px;
      }

    }
  </style>

    const landscapeLoaderText =

    function positionLandscapeLoaderDots() {
      if (!landscapeLoaderText) {
        return;
      }

      const pffDots =
        landscapeLoaderText.querySelector('.pff-loader-dots');
      const pffLabel =
        landscapeLoaderText.querySelector('.pff-loading-label');

      if (!pffDots || !pffLabel) {
        return;
      }

      const suffixText =
        ' let’s see the eyecare landscape';

      if (
        pffLabel.textContent === 'Excellent' &&
        landscapeLoaderText.querySelector('.landscape-loader-suffix')
      ) {
        return;
      }

      pffLabel.textContent =
        'Excellent';

      const suffix =
        document.createElement('span');
      suffix.className =
        'landscape-loader-suffix';
      suffix.textContent =
        suffixText;

      landscapeLoaderText.replaceChildren(
        pffLabel,
        pffDots,
        suffix
      );
    }

    if (landscapeLoaderText) {
      const landscapeLoaderObserver =
        new MutationObserver(
          positionLandscapeLoaderDots
        );

      landscapeLoaderObserver.observe(
        landscapeLoaderText,
        {
          childList: true,
          subtree: true
        }
      );

      window.requestAnimationFrame(
        positionLandscapeLoaderDots
      );
    }

    let sourceRows = [];

    let chart = null;
    let activeModel = null;

    let activeArea = 'AUS';
    let practiceSpatialIndex = null;

    const collator =

      });

    function normaliseGroupingText(value) {
      return PFF.cleanText(value)
        .replace(/\s+/g, ' ')
        .trim();
    }

    function normaliseBrand(value) {
      const text = normaliseGroupingText(value);

      if (
        !text ||
        /^(?:x|xx|xxx|n\/?a|not available)$/i.test(text)
      ) {
        return 'Unclassified';
      }

      return text;
    }

    const LOCATION_KEYS = Object.freeze([
      'postcode',
      'suburb',
      'latitude',
      'longitude',
      'phn',
      'mmm',
      'state',
      'population',
      'optometrists',
      'populationCoverage'
    ]);

    function dataNumber(value) {
      const cleaned = String(value ?? '').replace(/,/g, '').trim();
      if (!cleaned) return NaN;
      const number = Number(cleaned);
      return Number.isFinite(number) ? number : NaN;
    }

    function normaliseLocationRow(values, sourceIndex) {
      if (!Array.isArray(values) || values.length < CONFIG.locationSourceColumnCount) return null;
      const row = {};
      LOCATION_KEYS.forEach((key, index) => { row[key] = PFF.cleanText(values[index]); });
      row.sourceIndex = sourceIndex;
      row.stateCode = PFF.normaliseState(row.state);
      row.latitudeNumber = dataNumber(row.latitude);
      row.longitudeNumber = dataNumber(row.longitude);
      if (!row.suburb || !row.stateCode || !Number.isFinite(row.latitudeNumber) || !Number.isFinite(row.longitudeNumber)) return null;
      return row;
    }

    function sourceRowsFromTable(table) {
      return (table?.rows || [])
        .map(rawRow => {
          const cells = rawRow?.c || [];
          return Array.from({ length: CONFIG.sourceColumnCount }, (_, index) => PFF.cleanText(PFF.cellValue(cells[index])));
        })
        .filter(values => Boolean(PFF.cleanText(values[CONFIG.columns.practiceName])));
    }

    function locationRowsFromTable(table) {
      return (table?.rows || [])
        .map(rawRow => {
          const cells = rawRow?.c || [];
          return Array.from({ length: CONFIG.locationSourceColumnCount }, (_, index) => PFF.cleanText(PFF.cellValue(cells[index])));
        })
        .map((values, sourceIndex) => normaliseLocationRow(values, sourceIndex))
        .filter(Boolean);
    }

    function sourceRowsFromRemoteCache(payload) {
      const rows = Array.isArray(payload?.data?.rows) ? payload.data.rows : [];

      return rows
        .map(row => {
          if (!Array.isArray(row)) return null;
          const offset = row.length >= CONFIG.sourceColumnCount + 1 ? 1 : 0;
          if (row.length < CONFIG.sourceColumnCount + offset) return null;
          return Array.from({ length: CONFIG.sourceColumnCount }, (_, index) => PFF.cleanText(row[index + offset]));
        })
        .filter(Boolean)
        .filter(values => Boolean(PFF.cleanText(values[CONFIG.columns.practiceName])));
    }

    function locationRowsFromRemoteCache(payload) {
      return (Array.isArray(payload?.data?.locationRows)
        ? payload.data.locationRows
        : [])
        .map((values, sourceIndex) =>
          normaliseLocationRow(values, sourceIndex)
        )
        .filter(Boolean);
    }

    function normaliseRows(rows) {
      return (Array.isArray(rows) ? rows : [])
        .map((values, sourceIndex) => {
          if (
            !Array.isArray(values) ||
            values.length < CONFIG.sourceColumnCount
          ) {
            return null;
          }

          const practiceName = PFF.cleanText(
            values[CONFIG.columns.practiceName]
          );

          if (!practiceName) {
            return null;
          }

          return {
            sourceIndex,
            practiceName,
            suburb: normaliseGroupingText(
              values[CONFIG.columns.suburb]
            ),
            state: PFF.normaliseState(
              values[CONFIG.columns.state]
            ),
            employerType: normaliseGroupingText(
              values[CONFIG.columns.employerType]
            ),
            brand: normaliseBrand(
              values[CONFIG.columns.cleanedBrandParent]
            ),
            latitudeNumber: dataNumber(values[5]),
            longitudeNumber: dataNumber(values[6])
          };
        })
        .filter(Boolean);
    }

    /*
     * Keep the browser fallback compact while preserving everything required
     * by Brands, Densest locations and Remoteness.  The shared cache loader
     * stores the parsed row array, so practices and Localities are tagged and
     * cached together instead of relying on an in-memory side effect.
     */
    function encodeLandscapeCacheRows(practices, locations) {
      return [
        ...practices.map(row => [
          'P',
          row.practiceName,
          row.suburb,
          row.state,
          row.employerType,
          row.brand,
          row.latitudeNumber,
          row.longitudeNumber
        ]),
        ...locations.map(row => [
          'L',
          row.postcode,
          row.suburb,
          row.stateCode,
          row.latitudeNumber,
          row.longitudeNumber
        ])
      ];
    }

    function decodeLandscapeCacheRows(rows) {
      const practices = [];
      const locations = [];

      (Array.isArray(rows) ? rows : []).forEach(row => {
        if (!Array.isArray(row) || !row.length) {
          return;
        }

        if (row[0] === 'P') {
          const practiceName = PFF.cleanText(row[1]);
          const state = PFF.normaliseState(row[3]);

          if (!practiceName || !state) {
            return;
          }

          practices.push({
            sourceIndex: practices.length,
            practiceName,
            suburb: normaliseGroupingText(row[2]),
            state,
            employerType: normaliseGroupingText(row[4]),
            brand: normaliseBrand(row[5]),
            latitudeNumber: dataNumber(row[6]),
            longitudeNumber: dataNumber(row[7])
          });
          return;
        }

        if (row[0] === 'L') {
          const suburb = PFF.cleanText(row[2]);
          const stateCode = PFF.normaliseState(row[3]);
          const latitudeNumber = dataNumber(row[4]);
          const longitudeNumber = dataNumber(row[5]);

          if (
            !suburb ||
            !stateCode ||
            !Number.isFinite(latitudeNumber) ||
            !Number.isFinite(longitudeNumber)
          ) {
            return;
          }

          locations.push({
            sourceIndex: locations.length,
            postcode: PFF.cleanText(row[1]),
            suburb,
            stateCode,
            latitudeNumber,
            longitudeNumber
          });
        }
      });

      return {
        practices,
        locations
      };
    }

    async function loadJsonFallback() {
      const controller =
        new AbortController();

      const timeout =
        window.setTimeout(
          () => controller.abort(),
          CONFIG.jsonFetchTimeoutMs
        );

      try {
        const url = new URL(
          CONFIG.jsonFallbackUrl,
          window.location.href
        );

        url.searchParams.set(
          '_',
          String(Date.now())
        );

        const response = await fetch(
          url.toString(),
          {
            cache: 'no-store',
            signal: controller.signal
          }
        );

        if (!response.ok) {
          throw new Error(
            `Static JSON fallback returned HTTP ${response.status}.`
          );
        }

        const payload =
          await response.json();

        if (
          !payload ||
          payload.ok !== true ||
          !payload.data
        ) {
          throw new Error(
            payload?.error ||
            'Static JSON fallback has an invalid snapshot structure.'
          );
        }

        if (
          payload.appKey !==
          CONFIG.appKey
        ) {
          throw new Error(
            'Static JSON fallback has the wrong app key.'
          );
        }

        if (
          Number(payload.version) !==
          CONFIG.jsonFallbackVersion
        ) {
          throw new Error(
            'Static JSON fallback has the wrong version.'
          );
        }

        return payload;
      } catch (error) {
        if (error?.name === 'AbortError') {
          throw new Error(
            'Timed out loading the static JSON fallback.'
          );
        }

        throw error;
      } finally {
        window.clearTimeout(timeout);
      }
    }


    function setLoadedSourceIndicator(loaded) {
      const source = loaded?.source;
      const remote = Boolean(loaded?.remote);

      if (source === 'live') {
        PFF.setDataSourceIndicator('live', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        dataSourceText.textContent = 'LIVE data';
        return;
      }

      if (source === 'cached' && remote) {
        PFF.setDataSourceIndicator('cached', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        dataSourceText.textContent = 'JSON cache';
        return;
      }

      if (source === 'cached') {
        PFF.setDataSourceIndicator('cached', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        dataSourceText.textContent = 'BROWSER cache';
        return;
      }

      PFF.setDataSourceIndicator('unavailable', {
        indicator: dataSourceIndicator,
        text: dataSourceText
      });
    }

    async function loadPracticeRows() {
      return PFFCharts.loadLiveCacheFallback({
        forceCached: FORCE_CACHED_DATA,
        cacheKey: CONFIG.localCacheKey,
        minRows: CONFIG.minimumRows,

        loadLive: async () => {
          const [practiceTable, locationTable] = await Promise.all([
            PFFCharts.loadGVizSheet({
              sheetId: CONFIG.spreadsheetId,
              sheetName: CONFIG.sheetName,
              gid: CONFIG.sheetGid,
              range: CONFIG.sourceRange,
              headers: '1',
              timeoutMs: CONFIG.fetchTimeoutMs
            }),
            PFFCharts.loadGVizSheet({
              sheetId: CONFIG.spreadsheetId,
              sheetName: CONFIG.locationSheetName,
              range: CONFIG.locationRange,
              headers: '1',
              timeoutMs: CONFIG.fetchTimeoutMs
            })
          ]);
          return { practiceTable, locationTable };
        },

        parseLive: payload => {
          const practices = normaliseRows(
            sourceRowsFromTable(payload?.practiceTable)
          );
          const locations = locationRowsFromTable(
            payload?.locationTable
          );

          if (practices.length < CONFIG.minimumRows) {
            throw new Error(
              'Live optometry practice data did not contain enough usable rows.'
            );
          }

          if (!locations.length) {
            throw new Error(
              'Live Localities data did not contain any usable rows.'
            );
          }

          return encodeLandscapeCacheRows(
            practices,
            locations
          );
        },

        loadRemoteCache: loadJsonFallback,

        parseRemoteCache: payload => {
          const practices = normaliseRows(
            sourceRowsFromRemoteCache(payload)
          );
          const locations = locationRowsFromRemoteCache(
            payload
          );

          if (practices.length < CONFIG.minimumRows) {
            throw new Error(
              'Static fallback optometry data did not contain enough usable rows.'
            );
          }

          if (!locations.length) {
            throw new Error(
              'Static fallback Localities data did not contain any usable rows.'
            );
          }

          return encodeLandscapeCacheRows(
            practices,
            locations
          );
        },

        onLiveError(error) {
          console.warn('Live practice-landscape data unavailable; trying static JSON fallback.', error);
        },

        onRemoteCacheError(error) {
          console.warn('Practice Directory static JSON fallback unavailable; trying browser cache.', error);
        }
      });
    }

    function availableStates() {
      const found = new Set(
        sourceRows
          .map(row => row.state)
          .filter(Boolean)
      );

      return STATE_ORDER.filter(state => found.has(state));
    }

    function areaLabel(value = activeArea) {
      return value === 'AUS'
        ? 'Australia'
        : value;
    }

    function areaLongLabel(value = activeArea) {
      return value === 'AUS'
        ? 'Australia'
        : STATE_NAMES[value] || value;
    }

    function filteredRowsForArea() {
      if (activeArea === 'AUS') {
        return sourceRows;
      }

      return sourceRows.filter(row => row.state === activeArea);
    }

    function rankLimit() {
      return CONFIG.rankLimit;
    }

    function titleCaseLocation(value) {
      const text = PFF.cleanText(value);

      if (!text) {
        return '';
      }

      let titled = text
        .toLocaleLowerCase('en-AU')
        .replace(
          /(^|[\s\-'/])([a-z])/g,
          (_, prefix, letter) =>
            `${prefix}${letter.toLocaleUpperCase('en-AU')}`
        );

      titled = titled.replace(
        /\bMc([a-z])/g,
        (_, letter) => `Mc${letter.toLocaleUpperCase('en-AU')}`
      );

      return titled;
    }

    function buildSuburbGroups(rows) {
      const groups = new Map();
      let usableRows = 0;

      rows.forEach(row => {
        if (!row.suburb || !row.state) {
          return;
        }

        usableRows += 1;

        const key =
          `${row.state}\u0000${row.suburb.toLowerCase()}`;

        if (!groups.has(key)) {
          groups.set(key, {
            key: `suburb:${key}`,
            label: titleCaseLocation(row.suburb),
            state: row.state,
            count: 0
          });
        }

        groups.get(key).count += 1;
      });

      return {
        groups: Array.from(groups.values()),
        usableRows
      };
    }

    function haversineKm(
      latitude1,
      longitude1,
      latitude2,
      longitude2
    ) {
      const lat1 = Number(latitude1);
      const lon1 = Number(longitude1);
      const lat2 = Number(latitude2);
      const lon2 = Number(longitude2);

      if (
        ![lat1, lon1, lat2, lon2]
          .every(Number.isFinite)
      ) {
        return NaN;
      }

      const toRadians =
        degrees =>
          degrees * Math.PI / 180;

      const dLat =
        toRadians(lat2 - lat1);

      const dLon =
        toRadians(lon2 - lon1);

      const firstLat =
        toRadians(lat1);

      const secondLat =
        toRadians(lat2);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(firstLat) *
          Math.cos(secondLat) *
          Math.sin(dLon / 2) ** 2;

      return 6371 * 2 *
        Math.asin(
          Math.sqrt(
            Math.min(1, a)
          )
        );
    }

    function buildPracticeSpatialIndex(rows) {
      const cellDegrees = 1;
      const spatial = new Map();

      rows.forEach(row => {
        if (
          !Number.isFinite(row.latitudeNumber) ||
          !Number.isFinite(row.longitudeNumber)
        ) {
          return;
        }

        const latCell =
          Math.floor(row.latitudeNumber / cellDegrees);
        const lonCell =
          Math.floor(row.longitudeNumber / cellDegrees);
        const key =
          `${latCell}:${lonCell}`;

        if (!spatial.has(key)) {
          spatial.set(key, []);
        }

        spatial.get(key).push([
          row.latitudeNumber,
          row.longitudeNumber
        ]);
      });

      return {
        spatial,
        cellDegrees
      };
    }

    function nearestPracticeDistanceKm(location) {
      if (
        !location ||
        !practiceSpatialIndex ||
        !Number.isFinite(location.latitudeNumber) ||
        !Number.isFinite(location.longitudeNumber)
      ) {
        return NaN;
      }

      const cacheKey = [
        location.sourceIndex,
        location.latitudeNumber,
        location.longitudeNumber
      ].join(':');

      if (nearestDistanceCache.has(cacheKey)) {
        return nearestDistanceCache.get(cacheKey);
      }

      const latitude =
        location.latitudeNumber;
      const longitude =
        location.longitudeNumber;
      const cellDegrees =
        practiceSpatialIndex.cellDegrees;
      const centerLatCell =
        Math.floor(latitude / cellDegrees);
      const centerLonCell =
        Math.floor(longitude / cellDegrees);

      let best = Infinity;
      const maximumRing = 60;

      const inspectCell = (
        latCell,
        lonCell
      ) => {
        const bucket =
          practiceSpatialIndex.spatial.get(
            `${latCell}:${lonCell}`
          );

        if (!bucket) {
          return;
        }

        bucket.forEach(point => {
          const distance =
            haversineKm(
              latitude,
              longitude,
              point[0],
              point[1]
            );

          if (
            Number.isFinite(distance) &&
            distance < best
          ) {
            best = distance;
          }
        });
      };

      for (
        let ring = 0;
        ring <= maximumRing;
        ring += 1
      ) {
        if (ring === 0) {
          inspectCell(
            centerLatCell,
            centerLonCell
          );
        } else {
          const minLat =
            centerLatCell - ring;
          const maxLat =
            centerLatCell + ring;
          const minLon =
            centerLonCell - ring;
          const maxLon =
            centerLonCell + ring;

          for (
            let lonCell = minLon;
            lonCell <= maxLon;
            lonCell += 1
          ) {
            inspectCell(minLat, lonCell);
            inspectCell(maxLat, lonCell);
          }

          for (
            let latCell = minLat + 1;
            latCell < maxLat;
            latCell += 1
          ) {
            inspectCell(latCell, minLon);
            inspectCell(latCell, maxLon);
          }
        }

        /*
         * At Australian latitudes, one degree of longitude is at least
         * roughly 79 km. Using 70 km gives a conservative lower bound for
         * cells beyond the searched square, including cell-edge effects.
         */
        const outsideLowerBoundKm =
          Math.max(0, (ring - 1) * 70);

        if (
          Number.isFinite(best) &&
          outsideLowerBoundKm > best
        ) {
          break;
        }
      }

      const result =
        Number.isFinite(best)
          ? best
          : NaN;

      nearestDistanceCache.set(
        cacheKey,
        result
      );

      return result;
    }

    function buildRemotenessGroups() {
      const candidates =
        locationRows.filter(location =>
          activeArea === 'AUS' ||
          location.stateCode === activeArea
        );

      const groups =
        candidates
          .map(location => {
            const distanceKm =
              nearestPracticeDistanceKm(
                location
              );

            if (!Number.isFinite(distanceKm)) {
              return null;
            }

            return {
              key: [
                'remote',
                location.stateCode,
                location.postcode,
                location.suburb,
                location.sourceIndex
              ].join(':'),
              label: titleCaseLocation(location.suburb),
              state: location.stateCode,
              postcode: location.postcode,
              distanceKm,
              count: distanceKm
            };
          })
          .filter(Boolean);

      return {
        groups,
        usableRows: groups.length
      };
    }

    function excludedBrand(value) {
      const key = normaliseGroupingText(value)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      return (
        key.startsWith('independent') ||
        key.startsWith('provision') ||
        key === 'eyecare plus'
      );
    }

    function buildBrandGroups(rows) {
      const groups = new Map();
      let usableRows = 0;

      rows.forEach(row => {
        const label = row.brand || 'Unclassified';
        const employerType = normaliseGroupingText(
          row.employerType
        ).toLowerCase();

        if (
          employerType === 'independent' ||
          excludedBrand(label)
        ) {
          return;
        }

        usableRows += 1;
        const key = label.toLowerCase();

        if (!groups.has(key)) {
          groups.set(key, {
            key: `brand:${key}`,
            label,
            count: 0
          });
        }

        groups.get(key).count += 1;
      });

      return {
        groups: Array.from(groups.values()),
        usableRows
      };
    }

    function buildModel() {
      const areaRows =
        filteredRowsForArea();

      let grouped;

      if (activeView === 'brands') {
        grouped =
          buildBrandGroups(areaRows);
      } else if (activeView === 'dense') {
        grouped =
          buildSuburbGroups(areaRows);
      } else {
        grouped =
          buildRemotenessGroups();
      }

      const allGroups =
        grouped.groups.sort((a, b) => {
          const valueDifference =
            activeView === 'remote'
              ? b.distanceKm - a.distanceKm
              : b.count - a.count;

          if (valueDifference !== 0) {
            return valueDifference;
          }

          const stateDifference =
            collator.compare(
              a.state || '',
              b.state || ''
            );

          if (stateDifference !== 0) {
            return stateDifference;
          }

          const labelDifference =
            collator.compare(
              a.label || '',
              b.label || ''
            );

          if (labelDifference !== 0) {
            return labelDifference;
          }

          return collator.compare(
            a.postcode || '',
            b.postcode || ''
          );
        });

      const groups =
        allGroups.slice(0, rankLimit());

      return {
        view: activeView,
        area: activeArea,
        areaRows,
        usableRows: grouped.usableRows,
        totalCategories: allGroups.length,
        groups,
        values:
          groups.map(group =>
            activeView === 'remote'
              ? group.distanceKm
              : group.count
          )
      };
    }

    function tickLabel(group) {
      if (!group) {
        return '';
      }

      if (activeView === 'brands') {
        return group.label;
      }

      if (activeView === 'remote') {
        const locationSuffix =
          activeArea === 'AUS'
            ? [group.state, group.postcode]
                .filter(Boolean)
                .join(' ')
            : group.postcode;

        return locationSuffix
          ? `${group.label} · ${locationSuffix}`
          : group.label;
      }

      return activeArea === 'AUS'
        ? `${group.label} · ${group.state}`
        : group.label;
    }

    function clippedTickLabel(value) {
      const text = String(value || '');
      const limit =
        PFF.mobileLayout()
          ? 21
          : 30;

      if (text.length <= limit) {
        return text;
      }

      return `${text.slice(
        0,
        Math.max(1, limit - 1)
      )}…`;
    }

    function axisTickLabel(group) {
      const text = tickLabel(group);

      return activeView === 'brands'
        ? clippedTickLabel(text)
        : text;
    }

    function brandColourKey(value) {
      return normaliseGroupingText(value)
        .toLowerCase()
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function rgbaFromHex(hex, alpha) {
      const clean = String(hex || '').replace('#', '').trim();

      if (!/^[0-9a-f]{6}$/i.test(clean)) {
        return hex;
      }

      const red = parseInt(clean.slice(0, 2), 16);
      const green = parseInt(clean.slice(2, 4), 16);
      const blue = parseInt(clean.slice(4, 6), 16);

      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function groupAppearance(group) {
      if (activeView !== 'brands') {
        const colour =
          PFF.stateColours?.[group?.state] || '#69718a';

        return {
          background: colour,
          hoverBackground: colour,
          border: colour,
          hoverBorder: colour,
          borderWidth: 0
        };
      }

      const label = group?.label || '';

      if (label === 'Unclassified') {
        return {
          background: '#bfc3c7',
          hoverBackground: '#bfc3c7',
          border: '#bfc3c7',
          hoverBorder: '#bfc3c7',
          borderWidth: 0
        };
      }

      const key = brandColourKey(label);
      const explicitColour = BRAND_COLOURS[key];

      if (explicitColour) {
        return {
          background: explicitColour,
          hoverBackground: explicitColour,
          border: explicitColour,
          hoverBorder: explicitColour,
          borderWidth: 0
        };
      }

      const sharedAppearance = PFF.getEmployerAppearance(
        label,
        {
          fallbackLabel: label,
          fallbackColour: ''
        }
      );

      if (sharedAppearance?.matched && sharedAppearance.colour) {
        return {
          background: sharedAppearance.colour,
          hoverBackground: sharedAppearance.colour,
          border: sharedAppearance.colour,
          hoverBorder: sharedAppearance.colour,
          borderWidth: 0
        };
      }

      const purple = '#6600ff';

      return {
        background: rgbaFromHex(purple, 0.50),
        hoverBackground: rgbaFromHex(purple, 0.76),
        border: rgbaFromHex(purple, 0.68),
        hoverBorder: purple,
        borderWidth: 0.7
      };
    }

    function metricValueText(value) {
      const rounded =
        Math.max(
          0,
          Math.round(Number(value) || 0)
        );

      return activeView === 'remote'
        ? `${PFF.formatInteger(rounded)} km`
        : PFF.formatInteger(rounded);
    }

    function valueText(group) {
      if (!group) {
        return '';
      }

      return metricValueText(
        activeView === 'remote'
          ? group.distanceKm
          : group.count
      );
    }

    function headingFixedText() {
      return activeView === 'brands'
        ? 'Practice landscape by'
        : '';
    }

    function headingDetail() {
      if (activeView === 'brands') {
        return 'brand (non-independent)';
      }

      if (activeView === 'dense') {
        return 'Densest locations by suburb';
      }

      return 'Remoteness (nearest-practice distance)';
    }

    function updateHeading(animate = true) {
      const nextFixed = headingFixedText();
      const nextDetail = headingDetail();

      if (!animate || PFF.reducedMotion()) {
        chartHeadingFixed.textContent = nextFixed;
        chartHeadingDetail.textContent = nextDetail;
        requestAnimationFrame(() => headingScroller?.update?.());
        return;
      }

      PFF.animateTextChange(
        chartHeadingFixed,
        nextFixed,
        {
          fadeOutMs: 150,

        }
      );

      PFF.animateTextChange(
        chartHeadingDetail,
        nextDetail,

          fadeInMs: 220
        }
      );

      );

    function buildAreaMenu() {
      areaOptions.textContent = '';

      const options = [
        {
          value: 'AUS',
          label: 'Australia'
        },
        ...availableStates().map(state => ({
          value: state,
          label: state
        }))
      ];

      options.forEach(option => {

        const input = document.createElement('input');

        label.append(input, box, name);

    function syncLocationMenuSelection() {
      areaOptions
        .querySelectorAll(
          'input[name="practice-landscape-area"]'
        )
        .forEach(input => {
          input.checked =
            input.value === activeArea;
        });

    function syncAreaControl(animate = true) {
      const next = areaLabel();

      areaButtonValue.style.color = activeArea === 'AUS'
        ? 'var(--landscape-australia)'
        : PFF.stateColours?.[activeArea] || '#69718a';

      syncLocationMenuSelection();

      if (!animate || PFF.reducedMotion()) {
        areaButtonValue.textContent = next;
        return;
      }

      PFF.animateTextChange(
        areaButtonValue,
        next,
        {
          fadeOutMs: 130,
          fadeInMs: 200
        }
      );

    function stageHeightFor() {
      return Math.max(
        chartShell.clientHeight || 0,
        PFF.mobileLayout() ? 310 : 340
      );
    }

    function updateStageGeometry(model, resetScroll = false) {
      const height = stageHeightFor();
      const shellHeight = Math.max(chartShell.clientHeight || 0, 1);
      const scrollable = height > shellHeight + 4;

      chartStage.style.height = `${height}px`;
      chartStage.style.minHeight = `${height}px`;
      chartScroll.classList.toggle('is-scrollable', scrollable);

      if (resetScroll) {
        chartScroll.scrollTop = 0;
      }
    }

    const barValueLabelsPlugin = {
      id: 'practiceLandscapeValueLabels',

      afterDatasetsDraw(chartInstance) {
        const model = activeModel;

        if (!model?.groups?.length) {
          return;
        }

        const meta = chartInstance.getDatasetMeta(0);
        const area = chartInstance.chartArea;
        const ctx = chartInstance.ctx;

        ctx.save();
        ctx.font = '700 10px Lato, sans-serif';
        ctx.fillStyle = '#69718a';
        ctx.textBaseline = 'middle';

        meta.data.forEach((element, index) => {
          const group = model.groups[index];

          if (!element || !group) {
            return;
          }

          const properties = element.getProps(
            ['x', 'y'],
            true
          );

          if (
            !Number.isFinite(properties.x) ||
            !Number.isFinite(properties.y)
          ) {
            return;
          }

          const animatedValue =
            locationReorderState.active
              ? Number(
                  chartInstance.data.datasets?.[0]?.data?.[index]
                )
              : NaN;
          const text = Number.isFinite(animatedValue)
            ? metricValueText(animatedValue)
            : valueText(group);
          const width = ctx.measureText(text).width;
          const proposedX = properties.x + 5;

          if (proposedX + width <= area.right - 2) {
            ctx.textAlign = 'left';
            ctx.fillText(text, proposedX, properties.y);
          } else {
            ctx.textAlign = 'right';
            ctx.fillText(text, area.right - 2, properties.y);
          }
        });

        ctx.restore();
      }
    };

    function captureGroupYPositions(model) {
      const positions = new Map();

      if (!chart || !model?.groups?.length) {
        return positions;
      }

      const elements = chart.getDatasetMeta(0)?.data || [];

      model.groups.forEach((group, index) => {
        const y = elements[index]?.y;

        if (group?.key && Number.isFinite(y)) {
          positions.set(group.key, y);
        }
      });

      return positions;
    }

    function animatedGroupY(chartInstance, group, index) {
      const targetY = chartInstance?.scales?.y?.getPixelForValue(index);

      if (
        !Number.isFinite(targetY) ||
        !locationReorderState.active
      ) {
        return targetY;
      }

      const fromY = locationReorderState.fromYByKey.get(
        group?.key
      );

      if (!Number.isFinite(fromY)) {
        return targetY;
      }

      return fromY +
        (targetY - fromY) *
        Math.max(0, Math.min(locationReorderState.progress, 1));
    }

    const locationReorderGeometryPlugin = {
      id: 'pffPracticeLandscapeLocationReorder',

      beforeDatasetsDraw(chartInstance) {
        if (
          !locationReorderState.active ||
          !activeModel?.groups?.length
        ) {
          return;
        }

        chartInstance.data.datasets.forEach((_dataset, datasetIndex) => {
          const elements =
            chartInstance.getDatasetMeta(datasetIndex)?.data || [];

          elements.forEach((element, index) => {
            const group = activeModel.groups[index];
            const y = animatedGroupY(
              chartInstance,
              group,
              index
            );

            if (Number.isFinite(y)) {
              element.y = y;
            }
          });
        });
      }
    };

    function niceAxisStep(roughStep) {
      const value = Math.max(Number(roughStep) || 1, 1);
      const magnitude = 10 ** Math.floor(Math.log10(value));
      const candidates = [1, 2, 5, 10].map(
        factor => factor * magnitude
      );

      return candidates.reduce((best, candidate) => {
        const bestDistance = Math.abs(Math.log(best / value));
        const candidateDistance = Math.abs(
          Math.log(candidate / value)
        );

        return candidateDistance < bestDistance
          ? candidate
          : best;
      }, candidates[0]);
    }

    function axisSpecFor(model) {
      const maximum = model.values.length
        ? Math.max(...model.values)
        : 0;
      const paddedMaximum = Math.max(2, maximum * 1.14 + 1);
      const majorStep = Math.max(
        1,
        Math.round(niceAxisStep(paddedMaximum / 5))
      );
      const minorStep = majorStep / 2;
      const max = Math.max(
        majorStep,
        Math.ceil(paddedMaximum / majorStep) * majorStep
      );

      return {
        max,
        majorStep,
        minorStep
      };
    }


    function adaptiveMajorStepForMaximum(maximum) {
      return Math.max(
        1,
        Math.round(
          niceAxisStep(
            Math.max(Number(maximum) || 1, 1) / 5
          )
        )
      );
    }

    function majorStepWithHysteresis(
      maximum,
      currentStep
    ) {
      const max = Math.max(
        Number(maximum) || 1,
        1
      );
      const current = Math.max(
        1,
        Number(currentStep) || 1
      );
      const intervalCount =
        max / current;

      /*
       * Keep the current tick interval while it still gives a sensible
       * number of major divisions. This prevents small range changes from
       * causing distracting 5 -> 4 -> 5 style tick-step changes.
       */
      if (
        intervalCount >= 3.5 &&
        intervalCount <= 6.5
      ) {
        return current;
      }

      return adaptiveMajorStepForMaximum(max);
    }

    function resetTickStepTransition(majorStep) {
      const step = Math.max(
        1,
        Number(majorStep) || 1
      );

      axisTransitionState.displayMajorStep = step;
      tickStepTransitionState.active = false;
      tickStepTransitionState.fromMajorStep = step;
      tickStepTransitionState.toMajorStep = step;
      tickStepTransitionState.fromMaximum = NaN;
      tickStepTransitionState.toMaximum = NaN;
      tickStepTransitionState.progress = 1;
    }

    function setTickStepHandoff(
      fromMajorStep,
      toMajorStep,
      progress,
      fromMaximum,
      toMaximum
    ) {
      const from = Math.max(
        1,
        Number(fromMajorStep) || 1
      );
      const to = Math.max(
        1,
        Number(toMajorStep) || 1
      );
      const amount = Math.max(
        0,
        Math.min(1, Number(progress) || 0)
      );

      if (Math.abs(from - to) < 1e-9 || amount >= 1) {
        resetTickStepTransition(to);
        return;
      }

      axisTransitionState.displayMajorStep = to;
      tickStepTransitionState.active = true;
      tickStepTransitionState.fromMajorStep = from;
      tickStepTransitionState.toMajorStep = to;
      tickStepTransitionState.fromMaximum =
        Number.isFinite(Number(fromMaximum))
          ? Math.max(0, Number(fromMaximum))
          : NaN;
      tickStepTransitionState.toMaximum =
        Number.isFinite(Number(toMaximum))
          ? Math.max(0, Number(toMaximum))
          : NaN;
      tickStepTransitionState.progress = amount;
    }

    function tickStepHandoffProgress(
      resizeProgress,
      expanding
    ) {
      const progress = Math.max(
        0,
        Math.min(1, Number(resizeProgress) || 0)
      );

      /*
       * On expansion, introduce the coarser scale early so labels never
       * become crowded. On contraction, retain the coarser scale for most
       * of the slide and introduce the finer scale before the movement ends.
       * Both paths overlap continuously, so the X axis is never blank.
       */
      const localProgress = expanding
        ? Math.min(progress / 0.34, 1)
        : Math.max(
            0,
            Math.min((progress - 0.58) / 0.42, 1)
          );

      return PFFCharts.easeInOutCubic(localProgress);
    }

    function axisTickLayers() {
      const currentStep = Number.isFinite(
        axisTransitionState.displayMajorStep
      )
        ? axisTransitionState.displayMajorStep
        : activeAxisSpec?.majorStep;

      if (
        tickStepTransitionState.active &&
        Number.isFinite(
          tickStepTransitionState.fromMajorStep
        ) &&
        Number.isFinite(
          tickStepTransitionState.toMajorStep
        )
      ) {
        const progress = Math.max(
          0,
          Math.min(
            1,
            tickStepTransitionState.progress
          )
        );

        return [
          {
            majorStep:
              tickStepTransitionState.fromMajorStep,
            minorStep:
              tickStepTransitionState.fromMajorStep / 2,
            max:
              tickStepTransitionState.fromMaximum,
            alpha: 1 - progress
          },
          {
            majorStep:
              tickStepTransitionState.toMajorStep,
            minorStep:
              tickStepTransitionState.toMajorStep / 2,
            max:
              tickStepTransitionState.toMaximum,
            alpha: progress
          }
        ].filter(layer => layer.alpha > 0.001);
      }

      const majorStep = Math.max(
        1,
        Number(currentStep) || 1
      );

      return [
        {
          majorStep,
          minorStep: majorStep / 2,
          max: displayedAxisMaximum(),
          alpha: 1
        }
      ];
    }

    function axisTickMarks(currentMaximum) {
      const marks = new Map();

      axisTickLayers().forEach(layer => {
        const layerMaximum = Number.isFinite(layer.max)
          ? Math.max(0, layer.max)
          : currentMaximum;
        const lastValue = Math.floor(
          (layerMaximum + layer.minorStep * 1e-7) /
          layer.minorStep
        ) * layer.minorStep;

        for (
          let value = 0;
          value <= lastValue + layer.minorStep * 0.25;
          value += layer.minorStep
        ) {
          const roundedValue =
            Math.round(value * 1e9) / 1e9;
          const key = roundedValue.toFixed(9);
          const major = Math.abs(
            roundedValue / layer.majorStep -
            Math.round(roundedValue / layer.majorStep)
          ) < 1e-6;
          const existing = marks.get(key) || {
            value: roundedValue,
            alpha: 0,
            labelAlpha: 0,
            majorAlpha: 0,
            minorAlpha: 0
          };

          existing.alpha = Math.min(
            1,
            existing.alpha + layer.alpha
          );

          if (major) {
            existing.majorAlpha += layer.alpha;
            existing.labelAlpha = Math.min(
              1,
              existing.labelAlpha + layer.alpha
            );
          } else {
            existing.minorAlpha += layer.alpha;
          }

          marks.set(key, existing);
        }
      });

      return Array.from(marks.values())
        .map(mark => {
          const styleWeight =
            mark.majorAlpha + mark.minorAlpha;

          return {
            ...mark,
            majorStrength:
              styleWeight > 1e-9
                ? Math.max(
                    0,
                    Math.min(
                      1,
                      mark.majorAlpha / styleWeight
                    )
                  )
                : 0
          };
        })
        .sort((a, b) => a.value - b.value);
    }

    function copyChartArea(area) {
      if (!area) {
        return null;
      }

      const copy = {
        left: Number(area.left),
        right: Number(area.right),
        top: Number(area.top),
        bottom: Number(area.bottom)
      };

      return Object.values(copy).every(Number.isFinite)
        ? copy
        : null;
    }

    function setSpineGeometry(area) {
      const geometry = copyChartArea(area);

      if (!geometry) {
        return;
      }

      spineTransitionState.left = geometry.left;
      spineTransitionState.right = geometry.right;
      spineTransitionState.top = geometry.top;
      spineTransitionState.bottom = geometry.bottom;
    }

    function animateSpineGeometry(
      fromArea,
      toArea,
      duration = CONFIG.spineTransitionMs
    ) {
      if (spineTransitionFrame !== null) {
        cancelAnimationFrame(spineTransitionFrame);
        spineTransitionFrame = null;
      }

      const from = copyChartArea(fromArea);
      const to = copyChartArea(toArea);

      if (!from || !to) {
        spineTransitionState.active = false;
        setSpineGeometry(to || from);
        chart?.draw();
        return;
      }

      spineTransitionState.active = true;
      setSpineGeometry(from);

      if (PFF.reducedMotion() || duration <= 0) {
        setSpineGeometry(to);
        spineTransitionState.active = false;
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );
        const eased = PFFCharts.easeInOutCubic(progress);

        spineTransitionState.left =
          from.left + (to.left - from.left) * eased;
        spineTransitionState.right =
          from.right + (to.right - from.right) * eased;
        spineTransitionState.top =
          from.top + (to.top - from.top) * eased;
        spineTransitionState.bottom =
          from.bottom + (to.bottom - from.bottom) * eased;

        chart?.draw();

        if (progress < 1) {
          spineTransitionFrame = requestAnimationFrame(frame);
        } else {
          spineTransitionFrame = null;
          setSpineGeometry(to);
          spineTransitionState.active = false;
          chart?.draw();
        }
      }

      spineTransitionFrame = requestAnimationFrame(frame);
    }

    function animateAxisMaximum(
      fromMaximum,
      toMaximum,
      duration = CONFIG.axisTransitionMs
    ) {
      if (axisTransitionFrame !== null) {
        cancelAnimationFrame(axisTransitionFrame);
        axisTransitionFrame = null;
      }

      const from = Number(fromMaximum);
      const to = Number(toMaximum);
      const heldMajorStep = Math.max(
        1,
        Number(axisTransitionState.displayMajorStep) ||
          adaptiveMajorStepForMaximum(from)
      );

      if (!Number.isFinite(from) || !Number.isFinite(to)) {
        axisTransitionState.active = false;
        axisTransitionState.max = to;
        resetTickStepTransition(
          activeAxisSpec?.majorStep || 1
        );
        chart?.draw();
        return;
      }

      const targetMajorStep =
        majorStepWithHysteresis(
          to,
          heldMajorStep
        );
      const expanding =
        to > from + 1e-9;
      const stepChanges =
        Math.abs(
          targetMajorStep - heldMajorStep
        ) > 1e-9;

      axisTransitionState.active = true;
      axisTransitionState.max = from;
      resetTickStepTransition(heldMajorStep);

      if (
        PFF.reducedMotion() ||
        duration <= 0 ||
        from === to
      ) {
        axisTransitionState.max = to;
        axisTransitionState.active = false;
        resetTickStepTransition(targetMajorStep);
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );
        const eased =
          PFFCharts.easeInOutCubic(progress);

        axisTransitionState.max =
          from + (to - from) * eased;

        if (stepChanges) {
          setTickStepHandoff(
            heldMajorStep,
            targetMajorStep,
            tickStepHandoffProgress(
              progress,
              expanding
            ),
            from,
            to
          );
        }

        chart?.draw();

        if (progress < 1) {
          axisTransitionFrame =
            requestAnimationFrame(frame);
        } else {
          axisTransitionFrame = null;
          axisTransitionState.max = to;
          axisTransitionState.active = false;
          resetTickStepTransition(targetMajorStep);
          chart?.draw();
        }
      }

      axisTransitionFrame =
        requestAnimationFrame(frame);
    }

    function currentAxisGeometry(chartInstance) {
      const area = chartInstance?.chartArea;

      if (!area) {
        return null;
      }

      return {
        left:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.left)
            ? spineTransitionState.left
            : area.left,
        right:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.right)
            ? spineTransitionState.right
            : area.right,
        top:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.top)
            ? spineTransitionState.top
            : area.top,
        bottom:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.bottom)
            ? spineTransitionState.bottom
            : area.bottom
      };
    }

    function displayedAxisMaximum() {
      const maximum =
        axisTransitionState.active &&
        Number.isFinite(axisTransitionState.max)
          ? axisTransitionState.max
          : activeAxisSpec?.max;

      return Math.max(Number(maximum) || 1, 1);
    }

    function xAxisPixel(geometry, value) {
      return geometry.left +
        (geometry.right - geometry.left) *
        (Number(value) / displayedAxisMaximum());
    }

    function displayedAxisSpec() {
      if (!activeAxisSpec) {
        return null;
      }

      const currentMaximum =
        displayedAxisMaximum();
      const majorStep = Math.max(
        1,
        Number(
          axisTransitionState.displayMajorStep
        ) || activeAxisSpec.majorStep
      );

      return {
        max: currentMaximum,
        majorStep,
        minorStep: majorStep / 2
      };
    }

    const constantSpinePlugin = {
      id: 'pffPracticeLandscapeConstantSpines',

      afterDatasetsDraw(chartInstance) {
        const geometry = currentAxisGeometry(chartInstance);

        if (!geometry) {
          return;
        }

        const context = chartInstance.ctx;

        context.save();
        context.strokeStyle = '#151515';
        context.lineWidth = 1;
        context.lineCap = 'butt';

        context.beginPath();
        context.moveTo(geometry.left, geometry.bottom);
        context.lineTo(geometry.right, geometry.bottom);
        context.stroke();

        context.beginPath();
        context.moveTo(geometry.left, geometry.top);
        context.lineTo(geometry.left, geometry.bottom);
        context.stroke();

        context.restore();
      }
    };

    const barAxisPresentationPlugin = {
      id: 'pffPracticeLandscapeAxisPresentation',

      beforeDatasetsDraw(chartInstance) {
        const geometry = currentAxisGeometry(chartInstance);
        const spec = displayedAxisSpec();

        if (!geometry || !spec) {
          return;
        }

        const currentMaximum = displayedAxisMaximum();
        const context = chartInstance.ctx;
        const marks = axisTickMarks(currentMaximum);

        context.save();
        context.lineCap = 'butt';

        marks.forEach(mark => {
          const x = xAxisPixel(
            geometry,
            mark.value
          );

          if (x < geometry.left - 1 || x > geometry.right + 1) {
            return;
          }

          context.globalAlpha = mark.alpha;
          const gridOpacity =
            0.035 + 0.04 * mark.majorStrength;
          context.strokeStyle =
            `rgba(105, 113, 138, ${gridOpacity})`;
          context.lineWidth =
            0.7 + 0.3 * mark.majorStrength;
          context.beginPath();
          context.moveTo(Math.round(x) + 0.5, geometry.top);
          context.lineTo(Math.round(x) + 0.5, geometry.bottom);
          context.stroke();
        });

        context.globalAlpha = 1;
        context.restore();
      },

      afterDraw(chartInstance) {
        const geometry = currentAxisGeometry(chartInstance);
        const spec = displayedAxisSpec();

        if (!geometry || !spec) {
          return;
        }

        const context = chartInstance.ctx;
        const mobile = PFF.mobileLayout();
        const tickFontSize = mobile ? 9 : 10;
        const titleFontSize = mobile ? 12 : 13;
        const currentMaximum = displayedAxisMaximum();
        const marks = axisTickMarks(currentMaximum);
        const meta = chartInstance.getDatasetMeta(0);

        context.save();
        context.lineCap = 'butt';
        context.strokeStyle = '#151515';
        context.fillStyle = '#151515';
        context.textAlign = 'right';
        context.textBaseline = 'middle';

        const labelBaseSize =
          mobile ? 9 : 10;
        const labelMinSize =
          activeView === 'brands'
            ? (mobile ? 6 : 7)
            : (mobile ? 5 : 5.5);
        const labelMaxWidth =
          Math.max(50, geometry.left - 8);
        const labelTexts =
          (activeModel?.groups || []).map(
            group => axisTickLabel(group)
          );

        (activeModel?.groups || []).forEach((group, index) => {
          const bar = meta?.data?.[index];

          if (!Number.isFinite(bar?.y)) {
            return;
          }

          const text =
            labelTexts[index] || '';
          let labelFontSize =
            labelBaseSize;

          context.font =
            `400 ${labelFontSize}px Lato, sans-serif`;

          while (
            labelFontSize > labelMinSize &&
            context.measureText(text).width > labelMaxWidth
          ) {
            labelFontSize -= 0.5;
            context.font =
              `400 ${labelFontSize}px Lato, sans-serif`;
          }

          context.fillText(
            text,
            geometry.left - 5,
            bar.y
          );
        });

        marks.forEach(mark => {
          const x = xAxisPixel(
            geometry,
            mark.value
          );

          if (x < geometry.left - 1 || x > geometry.right + 1) {
            return;
          }

          context.globalAlpha = mark.alpha;
          const tickLength =
            2 + 4 * mark.majorStrength;

          context.beginPath();
          context.lineWidth =
            0.7 + 0.3 * mark.majorStrength;
          context.moveTo(Math.round(x) + 0.5, geometry.bottom);
          context.lineTo(
            Math.round(x) + 0.5,
            geometry.bottom + tickLength
          );
          context.stroke();
        });

        context.font = `400 ${tickFontSize}px Lato, sans-serif`;
        context.textBaseline = 'top';

        marks
          .filter(mark => mark.labelAlpha > 0.001)
          .forEach(mark => {
            const x = xAxisPixel(
              geometry,
              mark.value
            );

            if (x < geometry.left - 1 || x > geometry.right + 1) {
              return;
            }

            context.globalAlpha = mark.labelAlpha;
            context.textAlign = mark.value === 0
              ? 'left'
              : 'center';
            context.fillText(
              PFF.formatInteger(mark.value),
              x,
              geometry.bottom + 9
            );
          });

        context.globalAlpha = 1;
        context.font = `700 ${titleFontSize}px Lato, sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'alphabetic';
        context.fillText(
          activeView === 'remote'
            ? 'Distance to nearest practice (km)'
            : 'Number of practices',
          geometry.left + (geometry.right - geometry.left) / 2,
          geometry.bottom + 42
        );

        context.restore();
      }
    };

    function tooltipCallbacks() {
      return {
        title(items) {
          const index =
            items?.[0]?.dataIndex;
          const group =
            activeModel?.groups?.[index];

          if (!group) {
            return '';
          }

          if (activeView === 'remote') {
            return [
              group.label,
              [group.state, group.postcode]
                .filter(Boolean)
                .join(' ')
            ]
              .filter(Boolean)
              .join(', ');
          }

          if (activeView === 'dense') {
            return `${group.label}, ${group.state}`;
          }

          return group.label;
        },

        label(context) {
          const group =
            activeModel?.groups?.[
              context.dataIndex
            ];

          if (!group) {
            return '';
          }

          if (activeView === 'remote') {
            return `Nearest practice: ${metricValueText(group.distanceKm)}`;
          }

          return `Practices: ${PFF.formatInteger(group.count)}`;
        }
      };
    }

    function chartOptions(model) {
      const spec = axisSpecFor(model);

      return PFFCharts.baseChartOptions({
        indexAxis: 'y',

        interaction: {
          mode: 'nearest',
          intersect: true,
          axis: 'y'
        },

        layout: {
          autoPadding: false,
          padding: {
            top: 5,
            right: PFF.mobileLayout() ? 28 : 36,
            bottom: 0,
            left: 0
          }
        },

        scales: {
          x: {
            beginAtZero: true,
            min: 0,
            max: spec.max,
            afterFit(scale) {
              scale.height = 50;
            },
            ticks: {
              display: false
            },
            grid: {
              display: false,
              drawTicks: false
            },
            border: {
              display: false
            },
            title: {
              display: false
            }
          },

          y: {
            afterFit(scale) {
              scale.width = PFF.mobileLayout()
                ? 112
                : 148;
            },
            ticks: {
              display: false
            },
            grid: {
              display: false,
              drawTicks: false
            },
            border: {
              display: false
            }
          }
        },

        plugins: {
          legend: {
            display: false
          },
          tooltip: PFFCharts.tooltipOptions({
            callbacks: tooltipCallbacks()
          })
        }
      });
    }

    function chartData(model) {
      const appearances = model.groups.map(group =>
        groupAppearance(group)
      );

      return {
        labels: model.groups.map(group => tickLabel(group)),
        datasets: [
          {
            label: model.view === 'remote'
              ? 'Distance to nearest practice (km)'
              : 'Practices',
            data: model.values,
            backgroundColor: appearances.map(item => item.background),
            hoverBackgroundColor: appearances.map(
              item => item.hoverBackground
            ),
            borderColor: appearances.map(item => item.border),
            hoverBorderColor: appearances.map(item => item.hoverBorder),
            borderWidth: appearances.map(item => item.borderWidth),
            borderRadius: 2,
            borderSkipped: false,
            categoryPercentage: 0.82,
            barPercentage: 0.74,
            minBarLength: 2
          }
        ]
      };
    }

    function createChart(model) {
      activeModel = model;
      activeAxisSpec = axisSpecFor(model);
      axisTransitionState.max = activeAxisSpec.max;
      axisTransitionState.active = false;
      resetTickStepTransition(
        activeAxisSpec.majorStep
      );
      updateStageGeometry(model, true);

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: 'bar',
          data: chartData(model),
          options: chartOptions(model),
          plugins: [
            locationReorderGeometryPlugin,
            barAxisPresentationPlugin,
            constantSpinePlugin,
            barValueLabelsPlugin,
            {
              id: 'pffTooltipTopLayer',
              afterDraw(chartInstance) {
                const tooltip = chartInstance?.tooltip;
                if (!tooltip || !(Number(tooltip.opacity) > 0)) return;
                tooltip.draw(chartInstance.ctx);
              }
            }
          ]
        }
      );

      setSpineGeometry(chart.chartArea);
    }

    function updateChart(model, animate = true) {
      const previousModel = activeModel;
      const previousArea = copyChartArea(chart?.chartArea);
      const previousMaximum = Number(
        chart?.options?.scales?.x?.max ??
        axisTransitionState.max ??
        activeAxisSpec?.max
      );
      const shouldAnimateLocationReorder = Boolean(
        chart &&
        previousModel &&
        previousModel.view === model.view &&
        previousModel.area !== model.area &&
        animate &&
        !PFF.reducedMotion()
      );

      const previousYByKey = shouldAnimateLocationReorder
        ? captureGroupYPositions(previousModel)
        : new Map();
      const previousIndexByKey = shouldAnimateLocationReorder
        ? new Map(
            previousModel.groups.map((group, index) => [
              group.key,
              index
            ])
          )
        : new Map();
      const currentValues = shouldAnimateLocationReorder
        ? (chart.data.datasets?.[0]?.data || []).map(
            value => Number(value) || 0
          )
        : [];

      locationTransitionAnimator.cancel();
      locationReorderState.active = false;
      locationReorderState.progress = 1;
      locationReorderState.fromYByKey = new Map();

      activeModel = model;
      activeAxisSpec = axisSpecFor(model);
      updateStageGeometry(model, true);

      if (!chart) {
        createChart(model);
        return;
      }

      if (shouldAnimateLocationReorder) {
        if (axisTransitionFrame !== null) {
          cancelAnimationFrame(axisTransitionFrame);
          axisTransitionFrame = null;
        }

        const targetData = chartData(model);
        const targetDataset = targetData.datasets[0];
        const startValues = model.groups.map(group => {
          const previousIndex = previousIndexByKey.get(group.key);

          return previousIndex === undefined
            ? 0
            : currentValues[previousIndex] || 0;
        });
        const targetValues = model.values.map(
          value => Number(value) || 0
        );
        const startMaximum =
          Number.isFinite(previousMaximum) && previousMaximum > 0
            ? previousMaximum
            : activeAxisSpec.max;
        const targetMaximum = activeAxisSpec.max;
        const dataset = chart.data.datasets[0];

        chart.data.labels = targetData.labels;

        Object.keys(targetDataset).forEach(key => {
          if (key !== 'data') {
            dataset[key] = targetDataset[key];
          }
        });
        dataset.data = startValues.slice();

        chart.options = chartOptions(model);
        chart.options.scales.x.max = startMaximum;

        locationReorderState.active = true;
        locationReorderState.progress = 0;
        locationReorderState.fromYByKey = previousYByKey;

        const heldMajorStep = Math.max(
          1,
          Number(axisTransitionState.displayMajorStep) ||
            adaptiveMajorStepForMaximum(startMaximum)
        );

        axisTransitionState.active = true;
        axisTransitionState.max = startMaximum;
        resetTickStepTransition(heldMajorStep);

        chart.tooltip?.setActiveElements([], { x: 0, y: 0 });
        chart.update('none');

        const nextArea = copyChartArea(chart.chartArea);
        animateSpineGeometry(previousArea, nextArea);

        const targetMajorStep =
          majorStepWithHysteresis(
            targetMaximum,
            heldMajorStep
          );
        const expanding =
          targetMaximum > startMaximum + 1e-9;
        const stepChanges =
          Math.abs(
            targetMajorStep - heldMajorStep
          ) > 1e-9;

        resetTickStepTransition(heldMajorStep);
        axisTransitionState.active = true;
        axisTransitionState.max = startMaximum;

        locationTransitionAnimator.run({
          duration: CONFIG.locationTransitionMs,
          easing: PFFCharts.easeInOutCubic,

          onFrame(progress) {
            locationReorderState.progress = progress;

            dataset.data = targetValues.map((targetValue, index) => {
              const startValue = startValues[index] || 0;

              return startValue +
                (targetValue - startValue) * progress;
            });

            const displayedMaximum =
              startMaximum +
              (targetMaximum - startMaximum) * progress;

            chart.options.scales.x.max = displayedMaximum;
            axisTransitionState.max = displayedMaximum;

            if (stepChanges) {
              setTickStepHandoff(
                heldMajorStep,
                targetMajorStep,
                tickStepHandoffProgress(
                  progress,
                  expanding
                ),
                startMaximum,
                targetMaximum
              );
            }

            chart.update('none');
          },

          onComplete() {
            dataset.data = targetValues.slice();
            chart.options.scales.x.max = targetMaximum;

            locationReorderState.active = false;
            locationReorderState.progress = 1;
            locationReorderState.fromYByKey = new Map();

            axisTransitionState.active = false;
            axisTransitionState.max = targetMaximum;
            resetTickStepTransition(targetMajorStep);

            chart.update('none');
            setSpineGeometry(chart.chartArea);
          }
        });

        return;
      }

      chart.data = chartData(model);
      chart.options = chartOptions(model);
      chart.update(
        animate && !PFF.reducedMotion()
          ? undefined
          : 'none'
      );

      const nextArea = copyChartArea(chart.chartArea);

      if (animate && !PFF.reducedMotion()) {
        animateSpineGeometry(previousArea, nextArea);
        animateAxisMaximum(
          previousMaximum,
          activeAxisSpec.max
        );
      } else {
        if (spineTransitionFrame !== null) {
          cancelAnimationFrame(spineTransitionFrame);
          spineTransitionFrame = null;
        }
        if (axisTransitionFrame !== null) {
          cancelAnimationFrame(axisTransitionFrame);
          axisTransitionFrame = null;
        }

        spineTransitionState.active = false;
        axisTransitionState.active = false;
        axisTransitionState.max = activeAxisSpec.max;
        resetTickStepTransition(
          activeAxisSpec.majorStep
        );
        setSpineGeometry(nextArea);
        chart.draw();
      }
    }

    function updateAccessibleSummary() {
      if (!chartSummary || !activeModel) {
        return;
      }

      const first =
        activeModel.groups[0];

      let summaryText = '';

      if (activeView === 'brands') {
        summaryText =
          `Practice landscape showing ${PFF.formatInteger(activeModel.groups.length)} non-independent brand or parent categories for ${areaLongLabel()}. ` +
          `${PFF.formatInteger(activeModel.usableRows)} practice rows contribute to this view.`;

        if (first) {
          summaryText +=
            ` Highest shown: ${tickLabel(first)}, ${PFF.formatInteger(first.count)} practices.`;
        }
      } else if (activeView === 'dense') {
        summaryText =
          `Practice landscape showing the ${PFF.formatInteger(activeModel.groups.length)} densest suburbs for ${areaLongLabel()}. ` +
          `${PFF.formatInteger(activeModel.usableRows)} practice rows contribute to this view.`;

        if (first) {
          summaryText +=
            ` Densest shown: ${tickLabel(first)}, ${PFF.formatInteger(first.count)} practices.`;
        }
      } else {
        summaryText =
          `Practice landscape showing the ${PFF.formatInteger(activeModel.groups.length)} most remote localities for ${areaLongLabel()}, ranked by distance to the nearest optometry practice anywhere in Australia. ` +
          `${PFF.formatInteger(activeModel.usableRows)} locality rows contribute to this view.`;

        if (first) {
          summaryText +=
            ` Most remote shown: ${tickLabel(first)}, ${metricValueText(first.distanceKm)} from the nearest practice.`;
        }
      }

      PFFCharts.updateChartSummary(
        summaryText,
        chartSummary
      );
    }

    function renderView({ animate = true } = {}) {
      const model = buildModel();

      updateHeading(animate);
      syncLocationMenuSelection();
      syncAreaControl(animate);
      updateChart(model, animate);
      updateAccessibleSummary();
    }

    function configureControls() {
      headingScroller = PFF.setupScrollableRegion({
        scroller: headingScrollViewport,
        leftButton: headingScrollLeft,
        rightButton: headingScrollRight,
        tolerance: 2
      });

      tabsController = PFF.setupTabs({
        tabList,
        tabs: tabList.querySelectorAll('.chart-tab'),
        valueAttribute: 'view',
        initialValue: activeView,
        leftButton: tabScrollLeft,
        rightButton: tabScrollRight,
        onChange(value) {
          activeView = value;
          areaMenuController?.closeMenu?.();


          buildAreaMenu();
          renderView({ animate: true });
        }
      });

      areaMenuController =
        PFF.setupMenu({
          menu: areaControl,
          button: areaButton,
          panel: areaMenu,
          focusOnOpen: false
        });


      areaOptions.addEventListener('change', event => {
        const input = event.target.closest(
          'input[name="practice-landscape-area"]'
        );

        if (!input) {
          return;
        }

        activeArea = input.value;


        buildAreaMenu();
        areaMenuController?.closeMenu?.();
        renderView({ animate: true });
      });

      chartInteractionController =
        PFFCharts.setupChartInteractions({
          canvas: chartCanvas,
          getChart: () => chart
        });

      responsiveController =
        PFFCharts.createResponsiveController({
          getChart: () => chart,
          observe: [app, chartShell],
          applyResponsiveChartOptions: false,
          onRefresh() {
            if (!chart || !activeModel) {
              return;
            }

            locationTransitionAnimator.cancel();
            locationReorderState.active = false;
            locationReorderState.progress = 1;
            locationReorderState.fromYByKey = new Map();

            if (axisTransitionFrame !== null) {
              cancelAnimationFrame(axisTransitionFrame);
              axisTransitionFrame = null;
            }

            updateStageGeometry(activeModel, false);
            activeAxisSpec = axisSpecFor(activeModel);
            axisTransitionState.active = false;
            axisTransitionState.max = activeAxisSpec.max;
            resetTickStepTransition(
              activeAxisSpec.majorStep
            );
            chart.data = chartData(activeModel);
            chart.options = chartOptions(activeModel);
            chart.resize();
            chart.update('none');
            setSpineGeometry(chart.chartArea);
            tabsController?.update?.();
            headingScroller?.update?.();
          }
        });
    }

    PFF.initialiseApp({
      app,
      status: statusElement,
      load: loadPracticeRows,

      render(loaded) {
        const decoded =
          decodeLandscapeCacheRows(loaded.rows);

        sourceRows = decoded.practices;
        locationRows = decoded.locations;
        practiceSpatialIndex =
          buildPracticeSpatialIndex(
            sourceRows
          );
        nearestDistanceCache.clear();

        if (sourceRows.length < CONFIG.minimumRows) {
          throw new Error(
            'No usable optometry practice rows were returned from the practice directory.'
          );
        }

        if (!locationRows.length) {
          throw new Error(
            'No usable Localities rows were returned for the Remoteness view.'
          );
        }

        setLoadedSourceIndicator(loaded);
        buildAreaMenu();
        configureControls();

        chartSummary = PFFCharts.ensureChartSummary({
          id: 'practiceLandscapeChartSummary',
          parent: app
        });

        chartCanvas.setAttribute(
          'aria-describedby',
          chartSummary.id
        );

        renderView({ animate: false });
        return chart;
      },

      onError() {
        PFF.setDataSourceIndicator('unavailable', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });
      },

      errorMessage:
        'Practice landscape data unavailable.'
    });
  </script>
</body>
</html>
