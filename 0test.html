<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Optometry Supply Trends</title>

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <script src="./assets/pff_chart_core.js"></script>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading optometry supply data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading optometry supply data…</p>
      </div>

      <div class="module-top">
        <div id="tabScrollShell" class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Optometry supply charts"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              data-view="optoms"
            >Optometrists</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-view="flows"
            >Entrants & exits</button>
          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"
            type="button"
            aria-label="Scroll tabs right"
          >›</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">
              <span id="chartHeadingFixed" class="chart-heading-fixed"></span><span id="chartHeadingDetail" class="chart-heading-detail">Optometrists</span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3-year trend. Press to switch to 10-year trend."
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>
        </div>
      </div>

      <div id="legendNav" class="legend-nav">
        <button
          id="legendScrollLeft"
          class="legend-scroll-button legend-scroll-left is-hidden"
          type="button"
          aria-label="Scroll legend left"
        >‹</button>

        <div class="legend-viewport">
          <div
            id="chartLegend"
            class="chart-legend"
            aria-label="Chart legend"
          ></div>
        </div>

        <button
          id="legendScrollRight"
          class="legend-scroll-button legend-scroll-right is-hidden"
          type="button"
          aria-label="Scroll legend right"
        >›</button>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="workforceChart"
          aria-label="Australian optometry supply trend chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    // ============================================================
    // DATA SOURCE + APP-SPECIFIC SERIES
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const OPTOM_SHEET =
      'Optomsbystate';

    const FLOW_SHEET =
      'Miscellaneous';

    // Optomsbystate: L = Year, V = Active clinicians, W = General registration.
    const OPTOM_RANGE =
      'L31:W';

    // Miscellaneous entrant/exit table:
    // row 30 = headers (Year, Entrants, Exits); row 31 onward = annual data.
    const FLOW_RANGE =
      'A30:C';

    const FETCH_TIMEOUT_MS =
      15000;

    const LOCAL_CACHE_KEY =
      'pff-optoms-entrants-exits-v4';

    const EMBEDDED_FALLBACK =
{
      optoms: [
        {year:2013,values:[4559,4021]},
        {year:2014,values:[4749,4124]},
        {year:2015,values:[4941,4350]},
        {year:2016,values:[5134,4510]},
        {year:2017,values:[5296,4610]},
        {year:2018,values:[5492,4814]},
        {year:2019,values:[5768,5085]},
        {year:2020,values:[5962,5171]},
        {year:2021,values:[6282,5377]},
        {year:2022,values:[6495,5714]},
        {year:2023,values:[6781,5979]},
        {year:2024,values:[7104,6210]}
      ],
      flows: [
        {year:2019,values:[393,79]},
        {year:2020,values:[299,90]},
        {year:2021,values:[343,134]},
        {year:2022,values:[406,140]},
        {year:2023,values:[399,142]}
      ]
    };

    const VIEW_CONFIG = {
      optoms: {
        heading:
          'Optometrists',

        labels: [
          'General registration',
          'Active clinicians'
        ],

        colours: [
          '#6600ff',
          '#f1b916'
        ],

        yTitle:
          'Optometrists',

        scale: {
          min: 0,
          max: 7500,
          step: 1500,
          intervals: 5
        },

        axisDecimals: 0
      },

      flows: {
        heading:
          'Entrants & exits',

        labels: [
          'Entrants',
          'Exits'
        ],

        colours: [
          '#df2f2f',
          '#2f8138'
        ],

        yTitle:
          'Optometrists',

        scale: {
          min: 0,
          max: 500,
          step: 100,
          intervals: 5
        },

        axisDecimals: 0
      }
    };

    // ============================================================
    // DOM + STATE
    // ============================================================

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById('loadingState');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartTabs =
      Array.from(
        document.querySelectorAll('.chart-tab')
      );

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const chartHeadingFixed =
      document.getElementById('chartHeadingFixed');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartShell =
      document.getElementById('chartShell');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const chartCanvas =
      document.getElementById('workforceChart');

    let sourceData = {
      optoms: [],
      flows: []
    };

    let chart = null;
    let activeView = 'optoms';
    let trendMode = '3yr';
    let lastRenderedConfig = null;

    let yAxisController = null;
    let tabsController = null;
    let trendController = null;
    let headingScroller = null;
    let legendController = null;
    let responsiveController = null;
    let chartInteractions = null;
    let chartSummary = null;
    let legendAnimationToken = 0;

    const hiddenSeriesByView =
      new Map();

    // ============================================================
    // DATA PARSING
    // ============================================================

    function numericSupplyCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      if (
        typeof cell.v === 'number' &&
        Number.isFinite(cell.v)
      ) {
        return cell.v;
      }

      const cleaned =
        PFF.cleanText(
          cell.f ?? cell.v
        )
          .replace(/,/g, '')
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function parseOptomTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          numericSupplyCell(cells[0]);

        const active =
          numericSupplyCell(cells[10]);

        const general =
          numericSupplyCell(cells[11]);

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          !Number.isFinite(active) ||
          !Number.isFinite(general)
        ) {
          return;
        }

        parsed.push({
          year:
            Math.round(year),

          values: [
            general,
            active
          ]
        });
      });

      return parsed.sort(
        (first, second) =>
          first.year -
          second.year
      );
    }

    function parseFlowTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const year =
          numericSupplyCell(cells[0]);

        const entrants =
          numericSupplyCell(cells[1]);

        const exits =
          numericSupplyCell(cells[2]);

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          !Number.isFinite(entrants) ||
          !Number.isFinite(exits)
        ) {
          return;
        }

        parsed.push({
          year:
            Math.round(year),

          values: [
            entrants,
            exits
          ]
        });
      });

      return parsed.sort(
        (first, second) =>
          first.year -
          second.year
      );
    }

    function validSourceData(data) {
      return Boolean(
        data &&
        Array.isArray(data.optoms) &&
        Array.isArray(data.flows) &&
        data.optoms.length >= 3 &&
        data.flows.length >= 3
      );
    }

    function parseLiveTables(tables) {
      const data = {
        optoms:
          parseOptomTable(
            tables?.[0]
          ),

        flows:
          parseFlowTable(
            tables?.[1]
          )
      };

      if (!validSourceData(data)) {
        throw new Error(
          'Live workforce supply data did not contain enough usable rows.'
        );
      }

      /*
        PFF's shared live/cache loader stores arrays.
        Wrap the two-source data object in one row so both
        tables can share the same central cache helper.
      */
      return [data];
    }

    // ============================================================
    // VIEW DATA + CONFIGURATION
    // ============================================================

    function currentConfig() {
      return VIEW_CONFIG[
        activeView
      ];
    }

    function currentRows() {
      return sourceData[
        activeView
      ] || [];
    }

    function hiddenSeriesSet(
      view = activeView
    ) {
      if (
        !hiddenSeriesByView.has(
          view
        )
      ) {
        hiddenSeriesByView.set(
          view,
          new Set()
        );
      }

      return hiddenSeriesByView.get(
        view
      );
    }

    function valueForRow(
      row,
      seriesIndex
    ) {
      const value =
        row?.values?.[
          seriesIndex
        ];

      return Number.isFinite(value)
        ? value
        : NaN;
    }

    function activeTrendWindow() {
      return trendMode === '10yr'
        ? 10
        : trendMode === '3yr'
          ? 3
          : 0;
    }

    function trendForSeries(
      seriesIndex
    ) {
      const windowSize =
        activeTrendWindow();

      if (windowSize < 2) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        currentRows(),
        row =>
          valueForRow(
            row,
            seriesIndex
          ),
        windowSize
      );
    }

    // ============================================================
    // DATASETS
    // ============================================================

    function datasetForSeries(
      seriesIndex,
      config
    ) {
      const rows =
        currentRows();

      const label =
        config.labels[
          seriesIndex
        ];

      const hidden =
        hiddenSeriesSet();

      const visible =
        !hidden.has(label);

      const colour =
        config.colours[
          seriesIndex
        ];

      return PFFCharts.lineDataset({
        label,

        data:
          rows.map(
            row => {
              const value =
                valueForRow(
                  row,
                  seriesIndex
                );

              return Number.isFinite(value)
                ? value
                : null;
            }
          ),

        _activeSeries:
          visible,

        _seriesLabel:
          label,

        borderColor:
          colour,

        backgroundColor:
          colour,

        pointBackgroundColor:
          colour,

        pointBorderColor:
          '#ffffff',

        pointBorderWidth:
          visible ? 1 : 0,

        pointHoverRadius:
          visible ? 4 : 0,

        pointHitRadius:
          visible
            ? (
                PFFCharts.mobileLayout()
                  ? 9
                  : 5
              )
            : 0,

        cubicInterpolationMode:
          'monotone'
      });
    }

    function buildDatasets(config) {
      return config.labels.map(
        (
          _label,
          seriesIndex
        ) =>
          datasetForSeries(
            seriesIndex,
            config
          )
      );
    }

    function syncChartDatasets(config) {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets(config);

      nextDatasets.forEach(
        (nextDataset, index) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] = nextDataset;
          } else {
            Object.assign(
              current,
              nextDataset
            );
          }

          const hidden =
            hiddenSeriesSet();

          const label =
            config.labels[
              index
            ];

          const visible =
            !hidden.has(label);

          if (
            typeof chart.setDatasetVisibility ===
            'function'
          ) {
            chart.setDatasetVisibility(
              index,
              visible
            );
          } else {
            chart.data.datasets[
              index
            ].hidden =
              !visible;
          }
        }
      );

      chart.data.datasets.length =
        nextDatasets.length;
    }

    // ============================================================
    // SHARED PFF PLUGINS
    // ============================================================

    const yearTicksPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'pffSupplySummaryYearTicks',

        getValue({
          index
        }) {
          return currentRows()[
            index
          ]?.year;
        }
      });

    const trendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'pffSupplySummaryTrendLabels',

        enabled() {
          return (
            trendMode !==
              'off'
          );
        },

        isActive({
          dataset
        }) {
          return Boolean(
            dataset?._activeSeries
          );
        },

        getTrendValue({
          datasetIndex
        }) {
          return trendForSeries(
            datasetIndex
          );
        },

        getSeriesColour({
          datasetIndex
        }) {
          return currentConfig()
            .colours[
              datasetIndex
            ] ||
            '#69718a';
        }
      });

    // ============================================================
    // CHART
    // ============================================================

    function baseChartOptions(config) {
      return PFFCharts.baseChartOptions({
        transitions:
          PFFCharts.seriesVisibilityTransitionOptions(
            240
          ),

        plugins: {
          tooltip: {
            filter(context) {
              return Boolean(
                context.dataset
                  ._activeSeries
              );
            },

            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      currentRows()[
                        items[0].dataIndex
                      ]?.year ??
                      ''
                    )
                  : '';
              },

              label(context) {
                const value =
                  Number(
                    context.raw
                  );

                const base =
                  `${context.dataset._seriesLabel}: ${PFF.formatInteger(
                    value
                  )}`;

                if (
                  trendMode ===
                    'off'
                ) {
                  return base;
                }

                const trend =
                  trendForSeries(
                    context.datasetIndex
                  );

                return Number.isFinite(
                  trend
                )
                  ? `${base} · ${trend >= 0 ? '+' : '−'}${Math.abs(
                      trend
                    ).toFixed(1)}% p.a.`
                  : base;
              }
            }
          }
        },

        scales: {
          x:
            PFFCharts.xYearScaleOptions({
              ticks: {
                callback(
                  value,
                  index
                ) {
                  const year =
                    Number(
                      currentRows()[
                        index
                      ]?.year
                    );

                  if (
                    !Number.isFinite(
                      year
                    )
                  ) {
                    return '';
                  }

                  /*
                    Keep the compact Entrants & exits view readable by
                    labelling each available year. The longer Optometrists
                    view follows the shared even-year PFF convention.
                  */
                  return currentRows().length <= 6 ||
                    year % 2 === 0
                    ? String(year)
                    : '';
                }
              }
            }),

          y:
            PFFCharts.yScaleOptions(
              config.scale,
              {
                ticks: {
                  stepSize:
                    config.scale.step
                }
              }
            )
        }
      });
    }

    function syncChartScale(config) {
      if (!chart) {
        return;
      }

      const y =
        chart.options.scales.y;

      y.min =
        config.scale.min;

      y.max =
        config.scale.max;

      y.ticks.stepSize =
        config.scale.step;
    }

    function updateHeading(
      previousConfig,
      nextConfig,
      animate = true
    ) {
      const changed =
        !previousConfig ||
        previousConfig.heading !==
          nextConfig.heading;

      if (changed) {
        if (animate) {
          PFFCharts.animateHeading({
            fixed:
              chartHeadingFixed,

            detail:
              chartHeadingDetail,

            fixedText:
              '',

            detailText:
              nextConfig.heading,

            duration:
              PFFCharts.defaults
                .viewTransitionMs,

            onComplete() {
              headingScroller?.update();
            }
          });
        } else {
          chartHeadingFixed.textContent =
            '';

          chartHeadingDetail.textContent =
            nextConfig.heading;
        }
      }

      headingScrollViewport.scrollLeft =
        0;

      requestAnimationFrame(
        () =>
          headingScroller?.update()
      );
    }

    function legendItems() {
      const config =
        currentConfig();

      const hidden =
        hiddenSeriesSet();

      return config.labels.map(
        (
          label,
          datasetIndex
        ) => ({
          datasetIndex,
          label,

          colour:
            config.colours[
              datasetIndex
            ],

          active:
            !hidden.has(label)
        })
      );
    }

    function renderLegend(
      animate = false
    ) {
      if (!legendController) {
        return;
      }

      const draw = () => {
        legendController.render();
        chartLegend.scrollLeft = 0;
      };

      if (
        !animate ||
        PFFCharts.reducedMotion() ||
        typeof chartLegend.animate !==
          'function' ||
        !chartLegend.childElementCount
      ) {
        draw();
        return;
      }

      const token =
        ++legendAnimationToken;

      chartLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const outgoing =
        chartLegend.animate(
          [
            { opacity: 1 },
            { opacity: 0 }
          ],
          {
            duration: 120,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      outgoing.finished
        .catch(() => {})
        .then(() => {
          if (
            token !==
            legendAnimationToken
          ) {
            return;
          }

          outgoing.cancel();
          draw();

          const incoming =
            chartLegend.animate(
              [
                { opacity: 0 },
                { opacity: 1 }
              ],
              {
                duration: 220,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'both'
              }
            );

          incoming.finished
            .then(
              () =>
                incoming.cancel()
            )
            .catch(() => {});
        });
    }

    function updateAccessibleSummary() {
      if (
        !chartSummary ||
        !currentRows().length
      ) {
        return;
      }

      const config =
        currentConfig();

      const rows =
        currentRows();

      const latest =
        rows[
          rows.length - 1
        ];

      const values =
        config.labels
          .map(
            (
              label,
              index
            ) => {
              const value =
                valueForRow(
                  latest,
                  index
                );

              return `${label} ${PFF.formatInteger(
                value
              )}`;
            }
          )
          .join(', ');

      const trendDescription =
        trendMode ===
          'off'
          ? 'Trend annotations are off.'
          : `${activeTrendWindow()}-year trend annotations are on.`;

      PFFCharts.updateChartSummary(
        `${config.heading}. Latest data ${latest.year}: ${values}. ${trendDescription}`,
        chartSummary
      );
    }

    function createChart(config) {
      chartHeadingFixed.textContent =
        '';

      chartHeadingDetail.textContent =
        config.heading;

      yAxisController =
        PFFCharts.createUnifiedYAxis({
          id:
            'pffSupplySummaryAxes',

          getChart() {
            return chart;
          },

          getScale() {
            return currentConfig()
              .scale;
          },

          getDecimals() {
            return currentConfig()
              .axisDecimals;
          },

          getTitle() {
            return currentConfig()
              .yTitle;
          }
        });

      yAxisController.setImmediately(
        config.scale,
        config.axisDecimals
      );

      yAxisController.setTitleImmediately(
        config.yTitle
      );

      const rows =
        currentRows();

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type: 'line',

            data: {
              labels:
                rows.map(
                  row =>
                    String(row.year)
                ),

              datasets:
                buildDatasets(config)
            },

            options:
              baseChartOptions(config),

            plugins: [
              yAxisController.plugin,
              yearTicksPlugin,
              trendLabelsPlugin
            ]
          }
        );

      syncChartDatasets(config);

      lastRenderedConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      updateAccessibleSummary();
    }

    function updateChart(
      reason = 'tab'
    ) {
      const config =
        currentConfig();

      const previousConfig =
        lastRenderedConfig;

      updateHeading(
        previousConfig,
        config,
        reason !== 'initial'
      );

      if (!chart) {
        createChart(config);
        return;
      }

      chart.tooltip.setActiveElements(
        [],
        {
          x: 0,
          y: 0
        }
      );

      const previousVisibleScale =
        yAxisController.currentScale();

      const previousAxisDecimals =
        yAxisController.currentDecimals();

      const scaleChanged =
        !previousConfig ||
        !PFFCharts.scalesMatch(
          previousConfig.scale,
          config.scale
        ) ||
        previousConfig.axisDecimals !==
          config.axisDecimals;

      const yTitleChanged =
        !previousConfig ||
        previousConfig.yTitle !==
          config.yTitle;

      const legendChanged =
        !previousConfig ||
        !PFFCharts.arraysMatch(
          previousConfig.labels,
          config.labels
        ) ||
        !PFFCharts.arraysMatch(
          previousConfig.colours,
          config.colours
        );

      const rows =
        currentRows();

      chart.data.labels =
        rows.map(
          row =>
            String(row.year)
        );

      syncChartDatasets(config);
      syncChartScale(config);

      const duration =
        reason === 'initial'
          ? 0
          : PFFCharts
              .chartAnimationDuration();

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeInOutCubic';

      chart.options.animations.x.duration =
        duration;

      chart.options.animations.x.easing =
        'easeInOutCubic';

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeInOutCubic';

      chart.options.animations.colors.duration =
        0;

      chart.update();

      if (scaleChanged) {
        yAxisController.animate(
          previousVisibleScale,
          config.scale,
          {
            duration,

            fromDecimals:
              previousAxisDecimals,

            toDecimals:
              config.axisDecimals
          }
        );
      } else {
        yAxisController.setImmediately(
          config.scale,
          config.axisDecimals
        );
      }

      if (yTitleChanged) {
        yAxisController.animateTitle(
          previousConfig?.yTitle ??
            config.yTitle,
          config.yTitle,
          duration
        );
      } else {
        yAxisController.setTitleImmediately(
          config.yTitle
        );
      }

      if (legendChanged) {
        renderLegend(
          reason !== 'initial'
        );
      } else {
        legendController?.render();
      }

      lastRenderedConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      updateAccessibleSummary();
    }

    // ============================================================
    // SHARED CONTROLS
    // ============================================================

    function setupControls() {
      headingScroller =
        PFFCharts.setupScrollableRegion({
          scroller:
            headingScrollViewport,

          leftButton:
            headingScrollLeft,

          rightButton:
            headingScrollRight
        });

      tabsController =
        PFFCharts.setupTabs({
          tabList,

          tabs:
            chartTabs,

          valueAttribute:
            'view',

          initialValue:
            activeView,

          leftButton:
            tabScrollLeft,

          rightButton:
            tabScrollRight,

          onChange(view) {
            if (
              view ===
              activeView
            ) {
              return;
            }

            activeView =
              view;

            updateChart(
              'tab'
            );
          }
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,

          initialMode:
            trendMode,

          onChange(mode) {
            trendMode =
              mode;

            updateAccessibleSummary();
            chart?.draw();
          }
        });

      legendController =
        PFFCharts.setupLegend({
          legend:
            chartLegend,

          leftButton:
            legendScrollLeft,

          rightButton:
            legendScrollRight,

          getChart() {
            return chart;
          },

          getItems:
            legendItems,

          onToggle({
            datasetIndex,
            visible,
            item
          }) {
            const hidden =
              new Set(
                hiddenSeriesSet()
              );

            if (visible) {
              hidden.delete(
                item.label
              );
            } else {
              hidden.add(
                item.label
              );
            }

            hiddenSeriesByView.set(
              activeView,
              hidden
            );

            const dataset =
              chart?.data?.datasets?.[
                datasetIndex
              ];

            if (dataset) {
              dataset._activeSeries =
                visible;

              dataset.pointBorderWidth =
                visible ? 1 : 0;

              dataset.pointHoverRadius =
                visible ? 4 : 0;

              dataset.pointHitRadius =
                visible
                  ? (
                      PFFCharts.mobileLayout()
                        ? 9
                        : 5
                    )
                  : 0;
            }

            const visibilityDuration =
              PFFCharts.reducedMotion()
                ? 0
                : 240;

            chart.options.animation.duration =
              visibilityDuration;

            chart.options.animations.x.duration =
              visibilityDuration;

            chart.options.animations.y.duration =
              visibilityDuration;

            chart.options.animations.colors.duration =
              visibilityDuration;

            updateAccessibleSummary();
          }
        });

      chartInteractions =
        PFFCharts.setupChartInteractions({
          canvas:
            chartCanvas,

          getChart() {
            return chart;
          }
        });

      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },

          observe: [
            app,
            chartShell
          ],

          beforeResize(
            chartInstance
          ) {
            chartInstance
              .data
              .datasets
              .forEach(
                dataset => {
                  dataset.pointHitRadius =
                    dataset._activeSeries
                      ? (
                          PFFCharts.mobileLayout()
                            ? 9
                            : 5
                        )
                      : 0;
                }
              );
          },

          onRefresh() {
            tabsController?.update();
            headingScroller?.update();
            legendController?.update();
          }
        });

      chartSummary =
        PFFCharts.ensureChartSummary({
          parent:
            app
        });
    }

    // ============================================================
    // STARTUP
    // ============================================================

    setupControls();

    PFF.initialiseApp({
      app,

      status:
        statusElement,

      loadLive() {
        return Promise.all([
          PFFCharts.loadGVizSheet({
            sheetId:
              SHEET_ID,

            sheetName:
              OPTOM_SHEET,

            range:
              OPTOM_RANGE,

            timeoutMs:
              FETCH_TIMEOUT_MS,

            headers:
              '1'
          }),

          PFFCharts.loadGVizSheet({
            sheetId:
              SHEET_ID,

            sheetName:
              FLOW_SHEET,

            range:
              FLOW_RANGE,

            timeoutMs:
              FETCH_TIMEOUT_MS,

            headers:
              '1'
          })
        ]);
      },

      parseLive:
        parseLiveTables,

      cacheKey:
        LOCAL_CACHE_KEY,

      fallback: [
        EMBEDDED_FALLBACK
      ],

      minRows:
        1,

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,

        text:
          dataSourceText
      },

      onLiveError(error) {
        console.warn(
          'Live optometry supply data unavailable; using cached data.',
          error
        );
      },

      render(loaded) {
        const data =
          loaded.rows?.[0];

        if (!validSourceData(data)) {
          throw new Error(
            'Unable to read optometry supply data.'
          );
        }

        sourceData =
          data;

        const config =
          currentConfig();

        createChart(config);
        tabsController?.update();
        trendController?.set(
          trendMode,
          false
        );
        legendController?.render();
        responsiveController?.refresh();

        return chart;
      },

      onReady() {
        loadingState.setAttribute(
          'aria-hidden',
          'true'
        );

        updateAccessibleSummary();
      },

      errorMessage:
        'Unable to render optometry supply chart'
    });
  </script>
</body>
</html>
