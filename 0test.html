<!DOCTYPE html>
<html lang="en-AU">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <script src="./assets/pff_chart_core.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: auto;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    #fit {
      display: block;
      width: 100%;
      height: auto;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      display: block;
      width: 100%;
      max-width: 520px;
      min-height: 0;
      margin: 0 auto;
      padding: 12px 4px 0;
      background: transparent;
    }

    .response-summary {
      width: 100%;
      padding: 0;
    }

    .response-label {
      color: var(--pff-muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 50px;
      margin-top: 4px;
      align-items: center;
      justify-content: center;
    }

    .response-value {
      color: var(--pff-ink);
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 400;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .response-value.is-loading {
      display: inline-flex;
      width: 64px;
      min-width: 64px;
      align-items: center;
      justify-content: center;
    }

    .gradient-line {
      margin-top: 10px;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 10px;
      margin: 0;
      padding: 0;
      visibility: hidden;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .live-data.is-visible {
      visibility: visible;
      opacity: 1;
    }

    .actions {
      display: grid;
      width: 100%;
      gap: 12px;
      margin-top: 24px;
    }

    .contribute-button {
      display: grid;
      width: 100%;
      min-height: 38px;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: var(--pff-ink);
      background: transparent;
      border: 1px solid var(--pff-ink);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.2;
      text-align: left;
      text-decoration: none;
      transition:
        background-color 120ms ease,
        color 120ms ease;
    }

    .contribute-button:hover,
    .contribute-button:focus-visible {
      color: var(--pff-white);
      background: var(--pff-ink);
      outline: none;
    }

    .button-icon {
      color: var(--pff-purple);
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      text-align: center;
      transition: color 120ms ease;
    }

    .button-label {
      min-width: 0;
    }

    .contribute-button:hover .button-icon,
    .contribute-button:focus-visible .button-icon {
      color: var(--pff-white);
    }

    .anonymous-note {
      max-width: 430px;
      margin: 12px auto 0;
      color: var(--pff-muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .response-value.is-error {
      color: var(--pff-muted);
      font-size: 18px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 10px 2px 0;
      }

      .response-value {
        font-size: 36px;
      }

      .contribute-button {
        min-height: 38px;
        font-size: 14px;
      }

      .anonymous-note {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app">
      <section
        class="response-summary"
        aria-live="polite"
      >
        <div class="response-label">
          ♡ Data contributions and counting...
        </div>

        <div class="response-value-row">
          <div
            id="contribution-count"
            class="response-value is-loading"
          >
            <span
              class="pff-value-loader"
              role="status"
              aria-label="Counting contributions"
            >
              <span class="cone blue"></span>
              <span class="cone green"></span>
              <span class="cone red"></span>
            </span>
          </div>

          <div
            id="data-source-indicator"
            class="live-data"
            aria-label="Live data"
          >
            <span
              class="live-data-dot"
              aria-hidden="true"
            ></span>

            <span id="data-source-text">
              LIVE data
            </span>
          </div>
        </div>

        <div
          class="pff-gradient-line gradient-line"
          aria-hidden="true"
        ></div>
      </section>

      <nav
        class="actions"
        aria-label="Contribution options"
      >
        <a
          class="contribute-button"
          href="https://www.phoropterfreefridays.org/Income"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span
            class="button-icon"
            aria-hidden="true"
          >$</span>

          <span class="button-label">
            Contribute income data
          </span>
        </a>

        <a
          class="contribute-button"
          href="https://www.phoropterfreefridays.org/WorkplacePromoterScore"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span
            class="button-icon"
            aria-hidden="true"
          >☆</span>

          <span class="button-label">
            Workplace Promoter Score
          </span>
        </a>
      </nav>

      <p class="anonymous-note">
        Your data is anonymous
      </p>
    </main>
  </div>

  <script>
  (() => {
    'use strict';

    const CONFIG = Object.freeze({
      backendUrl:
        'https://script.google.com/macros/s/AKfycbx4E4fZUhs1RDLFfsMAhJCSHQIWHcNg-PjZOSif93hKSOq6o0gv1OD8wcLjsa3ssy4mDQ/exec',

      appKey:
        'pff-contribution-count',

      browserCacheKey:
        'pff-contribution-count-v1',

      liveTimeoutMs:
        20000,

      cacheTimeoutMs:
        10000,

      countUpDurationMs:
        1400,

      forceCached:
        false
    });

    const contributionCount =
      document.getElementById(
        'contribution-count'
      );

    const dataSourceIndicator =
      document.getElementById(
        'data-source-indicator'
      );

    const dataSourceText =
      document.getElementById(
        'data-source-text'
      );

    const countAnimator =
      PFF.createIntegerCounter(
        contributionCount,
        {
          duration:
            CONFIG.countUpDurationMs,

          minimum:
            0,

          firstVisibleMinimum:
            1
        }
      );


    function upgradeLegacyBrowserCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.browserCacheKey
          );

        if (!raw) {
          return;
        }

        let legacyValue =
          '';

        try {
          const parsed =
            JSON.parse(
              raw
            );

          if (
            Array.isArray(
              parsed?.rows
            )
          ) {
            return;
          }

          legacyValue =
            String(
              parsed ??
              ''
            ).trim();
        } catch (_) {
          legacyValue =
            String(
              raw
            ).trim();
        }

        if (!legacyValue) {
          return;
        }

        PFF.saveLocalCache(
          CONFIG.browserCacheKey,
          [[
            legacyValue
          ]],
          {
            migratedFromLegacy:
              true
          }
        );
      } catch (_) {
      }
    }


    function snapshotToRows(
      snapshot
    ) {
      if (
        !snapshot ||
        snapshot.ok !==
          true ||
        snapshot.appKey !==
          CONFIG.appKey
      ) {
        throw new Error(
          snapshot?.error ||
          'Contribution count is unavailable'
        );
      }

      const value =
        String(
          snapshot?.data
            ?.contributionCount ??
          ''
        ).trim();

      if (!value) {
        throw new Error(
          'Contribution count is empty'
        );
      }

      return [[
        value
      ]];
    }


    function setDataSource(
      source
    ) {
      PFF.setDataSourceIndicator(
        source,
        {
          indicator:
            dataSourceIndicator,

          text:
            dataSourceText
        }
      );

      dataSourceIndicator.classList.add(
        'is-visible'
      );
    }


    async function loadContributionCount() {
      try {
        const loaded =
          await PFF.loadLiveCacheFallback({
            loadLive:
              () =>
                PFF.loadAppsScriptJsonp({
                  url:
                    CONFIG.backendUrl,

                  params: {
                    action:
                      'liveContributionCount'
                  },

                  timeoutMs:
                    CONFIG.liveTimeoutMs
                }),

            parseLive:
              snapshotToRows,

            loadRemoteCache:
              () =>
                PFF.loadAppsScriptCache({
                  url:
                    CONFIG.backendUrl,

                  appKey:
                    CONFIG.appKey,

                  timeoutMs:
                    CONFIG.cacheTimeoutMs
                }),

            parseRemoteCache:
              snapshotToRows,

            cacheKey:
              CONFIG.browserCacheKey,

            minRows:
              1,

            forceCached:
              CONFIG.forceCached,

            onSource:
              setDataSource,

            onLiveError:
              error =>
                console.warn(
                  'Live contribution count could not be used',
                  error
                ),

            onRemoteCacheError:
              error =>
                console.warn(
                  'Cached contribution count could not be used',
                  error
                )
          });

        countAnimator.set(
          loaded.rows?.[0]?.[0]
        );
      } catch (
        error
      ) {
        console.error(
          error
        );

        countAnimator.show(
          '—',
          {
            error:
              true
          }
        );

        setDataSource(
          'unavailable'
        );
      }
    }


    upgradeLegacyBrowserCache();

    loadContributionCount();
  })();
  </script>
</body>
</html>
