<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Job Tracker</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --row-line: #f4f5f7;
      --soft: #f7f7f9;
      --repeat-red: #7a1111;

      --seek-pink: #e5007d;
      --indeed-blue: #2557a7;
      --essilux-blue: #49b7e8;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --corporate: #8dc4af;
      --independent: #c3bce9;
      --ophthal: #ffe9b8;
      --other: #eaebec;

      /* State colours sampled from the supplied image. */
      --state-nsw: #5bb4f0;
      --state-qld: #6b1436;
      --state-act: #7561f4;
      --state-vic: #2f3a89;
      --state-sa: #dd4b4c;
      --state-nt: #b36324;
      --state-wa: #000000;
      --state-tas: #4fa171;

      --first-column-width: 150px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 18px 10px 24px;
    }

    #app.is-loading .content {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .content {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin: 0 0 12px;
    }

    .heading-group {
      min-width: 0;
      text-align: left;
    }

    .heading-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 700;
      line-height: 1.15;
    }

    .live-data-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 0 0 auto;
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #e53935;
    }

    .table-status {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .filter-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 7px 10px 7px 12px;
      border: 1px solid var(--track);
      border-radius: 999px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(21, 21, 21, 0.04);
      transition:
        border-color 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
    }

    .filter-button:hover {
      border-color: rgba(102, 0, 255, 0.30);
      box-shadow: 0 3px 10px rgba(21, 21, 21, 0.08);
    }

    .filter-button:active {
      transform: translateY(1px);
    }

    .filter-button:focus-visible {
      outline: 3px solid rgba(102, 0, 255, 0.20);
      outline-offset: 2px;
    }

    .filter-label {
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .filter-value {
      min-width: 31px;
      padding: 4px 7px;
      border-radius: 999px;
      color: var(--purple);
      background: rgba(102, 0, 255, 0.08);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.035em;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .boolean-button .toggle-track {
      position: relative;
      width: 37px;
      height: 21px;
      flex: 0 0 37px;
      border-radius: 999px;
      background: #c9cdd5;
      transition: background 160ms ease;
    }

    .boolean-button .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.28);
      transition: transform 160ms ease;
    }

    .boolean-button.is-on {
      border-color: rgba(102, 0, 255, 0.24);
      background: rgba(102, 0, 255, 0.035);
    }

    .boolean-button.is-on .toggle-track {
      background: var(--purple);
    }

    .boolean-button.is-on .toggle-thumb {
      transform: translateX(16px);
    }

    .boolean-button.is-on .filter-value {
      color: var(--purple);
    }

    .boolean-button:not(.is-on) .filter-value {
      color: var(--muted);
      background: var(--soft);
    }

    .cycle-button::after {
      content: "›";
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
    }

    .notice {
      display: none;
      margin: 0 0 10px;
      padding: 9px 11px;
      border: 1px solid #f0dfaa;
      border-radius: 8px;
      color: #67551b;
      background: #fff9e8;
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    .notice.is-visible {
      display: block;
    }

    .table-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--track);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 5px 22px rgba(21, 21, 21, 0.06);
      isolation: isolate;
    }

    /* Gradient black divider after the first visible column. */
    .table-shell::after {
      content: "";
      position: absolute;
      z-index: 9;
      top: 0;
      bottom: 0;
      left: var(--first-column-width);
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .table-scroll {
      width: 100%;
      max-height: calc(100vh - 150px);
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .data-table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: auto;
    }

    .data-table thead {
      position: sticky;
      z-index: 5;
      top: 0;
      background: #fff;
    }

    /* Gradient black divider below the header row. */
    .data-table thead::after {
      content: "";
      position: absolute;
      z-index: 8;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      pointer-events: none;
      background: linear-gradient(
        to right,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 8%,
        var(--ink) 18%,
        var(--ink) 82%,
        rgba(21, 21, 21, 0.16) 92%,
        #fff 100%
      );
    }

    .data-table th,
    .data-table td {
      position: relative;
      min-width: 120px;
      max-width: 300px;
      padding: 9px 8px;
      border-right: 1px solid var(--track);
      border-bottom: 1px solid var(--row-line);
      line-height: 1.25;
      text-align: center;
      vertical-align: middle;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .data-table th {
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: normal;
    }

    .data-table td {
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      font-weight: 400;
    }

    .data-table th:first-child,
    .data-table td:first-child {
      position: sticky;
      left: 0;
      width: var(--first-column-width);
      min-width: var(--first-column-width);
      max-width: var(--first-column-width);
    }

    .data-table th:first-child {
      z-index: 7;
    }

    .data-table td:first-child {
      z-index: 2;
      font-weight: 700;
    }

    .data-table th:last-child,
    .data-table td:last-child {
      border-right: 0;
    }

    .data-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .data-table tbody tr:hover td {
      filter: brightness(0.985);
    }

    /* Light grey separator after the last visible row of each Monday-starting week. */
    .data-table tbody tr.week-divider td {
      border-bottom-color: var(--track);
      box-shadow: inset 0 -1px 0 var(--track);
    }

    .data-table a {
      color: var(--purple);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    .data-table a:hover {
      text-decoration-thickness: 2px;
    }

    .data-table a.link-seek {
      color: var(--seek-pink);
    }

    .data-table a.link-indeed {
      color: var(--indeed-blue);
    }

    .data-table a.link-essilux {
      color: var(--essilux-blue);
    }

    .data-table td.category-corporate {
      background: var(--corporate);
    }

    .data-table td.category-independent {
      background: var(--independent);
    }

    .data-table td.category-ophthal {
      background: var(--ophthal);
    }

    .data-table td.category-other {
      background: var(--other);
    }

    /* Column I state styling. */
    .data-table td.state-nsw {
      color: var(--state-nsw);
      background: rgba(91, 180, 240, 0.16);
      font-weight: 700;
    }

    .data-table td.state-qld {
      color: var(--state-qld);
      background: rgba(107, 20, 54, 0.12);
      font-weight: 700;
    }

    .data-table td.state-act {
      color: var(--state-act);
      background: rgba(117, 97, 244, 0.14);
      font-weight: 700;
    }

    .data-table td.state-vic {
      color: var(--state-vic);
      background: rgba(47, 58, 137, 0.12);
      font-weight: 700;
    }

    .data-table td.state-sa {
      color: var(--state-sa);
      background: rgba(221, 75, 76, 0.12);
      font-weight: 700;
    }

    .data-table td.state-nt {
      color: var(--state-nt);
      background: rgba(179, 99, 36, 0.13);
      font-weight: 700;
    }

    .data-table td.state-wa {
      color: var(--state-wa);
      background: rgba(0, 0, 0, 0.07);
      font-weight: 700;
    }

    .data-table td.state-tas {
      color: var(--state-tas);
      background: rgba(79, 161, 113, 0.14);
      font-weight: 700;
    }

    .data-table td.delisted-cell {
      color: var(--muted);
      font-weight: 700;
    }

    /* Repeat status overrides ordinary text and hyperlink colours. */
    .data-table tr.repeat-row td,
    .data-table tr.repeat-row td a,
    .data-table tr.repeat-row td a.link-seek,
    .data-table tr.repeat-row td a.link-indeed,
    .data-table tr.repeat-row td a.link-essilux {
      color: var(--repeat-red);
    }

    .data-table tr.is-hidden {
      display: none;
    }

    .empty-state {
      display: none;
      padding: 42px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .empty-state.is-visible {
      display: block;
    }

    .error-state {
      display: none;
      max-width: 720px;
      margin: 20px auto;
      padding: 18px;
      border: 1px solid var(--track);
      border-radius: 10px;
      color: var(--muted);
      background: var(--soft);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .error-state.is-visible {
      display: block;
    }

    @media (max-width: 900px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .controls {
        justify-content: flex-start;
      }

      .table-scroll {
        max-height: calc(100vh - 220px);
      }
    }

    @media (max-width: 520px) {
      :root {
        --first-column-width: 128px;
      }

      #app {
        padding: 12px 4px 18px;
      }

      .filter-button {
        min-height: 35px;
        padding: 6px 8px 6px 10px;
        gap: 6px;
      }

      .filter-label {
        font-size: 11px;
      }

      .filter-value {
        font-size: 8px;
      }

      .table-scroll {
        max-height: calc(100vh - 285px);
      }

      .data-table th,
      .data-table td {
        min-width: 105px;
        max-width: 225px;
        padding: 8px 5px;
        font-size: 11px;
      }

      .data-table th:first-child,
      .data-table td:first-child {
        width: var(--first-column-width);
        min-width: var(--first-column-width);
        max-width: var(--first-column-width);
      }

      .app-loading {
        min-height: 180px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <main id="app" class="is-loading">
    <div
      id="loading-state"
      class="app-loading"
      role="status"
      aria-label="Loading job tracker"
    >
      <div class="cone-loader">
        <div class="cone blue" aria-hidden="true"></div>
        <div class="cone green" aria-hidden="true"></div>
        <div class="cone red" aria-hidden="true"></div>
      </div>

      <div class="loader-text">Loading jobs...</div>
    </div>

    <section class="content" aria-label="PFF job tracker">
      <div class="topbar">
        <div class="heading-group">
          <div class="heading-row">
            <h1>Optometry job tracker</h1>

            <span class="live-data-inline" aria-label="Live data">
              <span class="live-data-dot" aria-hidden="true"></span>
              <span>LIVE data</span>
            </span>
          </div>

          <p
            id="table-status"
            class="table-status"
            aria-live="polite"
          >
            Loading jobs...
          </p>
        </div>

        <div class="controls" aria-label="Table filters">
          <button
            id="repeat-toggle"
            class="filter-button boolean-button"
            type="button"
            role="switch"
            aria-label="Include job ad repeats"
          >
            <span class="filter-label">Job ad repeats</span>

            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>

            <span class="filter-value">ON</span>
          </button>

          <button
            id="corporate-toggle"
            class="filter-button boolean-button"
            type="button"
            role="switch"
            aria-label="Include corporate jobs"
          >
            <span class="filter-label">Corporates</span>

            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>

            <span class="filter-value">ON</span>
          </button>

          <button
            id="location-toggle"
            class="filter-button cycle-button"
            type="button"
            aria-label="Location filter: all locations. Click to change."
            title="Click to cycle: All → Metro only → Non-metro only"
          >
            <span class="filter-label">Location</span>
            <span class="filter-value">ALL</span>
          </button>

          <button
            id="state-toggle"
            class="filter-button cycle-button"
            type="button"
            aria-label="State filter: all states. Click to change."
            title="Click to cycle through all states and territories"
          >
            <span class="filter-label">State</span>
            <span class="filter-value">ALL</span>
          </button>

          <button
            id="delisted-toggle"
            class="filter-button boolean-button"
            type="button"
            role="switch"
            aria-label="Include delisted ads"
          >
            <span class="filter-label">Delisted ads</span>

            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>

            <span class="filter-value">ON</span>
          </button>
        </div>
      </div>

      <div
        id="fallback-notice"
        class="notice"
        role="status"
      ></div>

      <div id="table-shell" class="table-shell">
        <div class="table-scroll">
          <table id="data-table" class="data-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <div id="empty-state" class="empty-state">
          No rows match the current filters.
        </div>
      </div>

      <div
        id="error-state"
        class="error-state"
        role="alert"
      ></div>
    </section>
  </main>

  <script>
    const CONFIG = {
      SPREADSHEET_ID: '1gdLoeP2VKwv6ctpLsmXKZiMWybCgc987ucFgTIU4jEc',

      /*
       * Leave blank to use the spreadsheet's first worksheet tab.
       * Enter the exact tab name only if the tracker is on another tab.
       */
      SHEET_NAME: '',

      HEADER_ROW: 2,
      FIRST_COLUMN: 1,  // A
      LAST_COLUMN: 25,  // Y

      HIDDEN_COLUMNS: new Set([2, 3, 5]), // B, C and E

      REPEAT_FLAG_COLUMN: 2,   // B
      SOURCE_COLUMN: 3,        // C
      DATE_COLUMN: 4,          // D
      EMPLOYER_COLUMN: 6,      // F
      EMPLOYER_TYPE_COLUMN: 7, // G
      SUBURB_COLUMN: 8,        // H
      STATE_COLUMN: 9,         // I
      MM_COLUMN: 11,           // K

      FETCH_TIMEOUT_MS: 20000,
      STORAGE_KEY: 'pff-job-tracker-filters-v3'
    };

    const LOCATION_MODES = [
      {
        value: 'all',
        label: 'ALL',
        spoken: 'all locations'
      },
      {
        value: 'metro',
        label: 'METRO',
        spoken: 'metro only, MM1'
      },
      {
        value: 'nonmetro',
        label: 'NON-METRO',
        spoken: 'non-metro only, MM2 to MM7'
      }
    ];

    const STATE_OPTIONS = [
      'ALL',
      'NSW',
      'QLD',
      'VIC',
      'ACT',
      'SA',
      'NT',
      'WA',
      'TAS'
    ];

    const STATE_COLOURS = {
      NSW: '#5bb4f0',
      QLD: '#6b1436',
      ACT: '#7561f4',
      VIC: '#2f3a89',
      SA: '#dd4b4c',
      NT: '#b36324',
      WA: '#000000',
      TAS: '#4fa171'
    };

    const DEFAULT_FILTERS = {
      showRepeats: true,
      showCorporates: true,
      locationMode: 'all',
      stateFilter: 'ALL',
      showDelisted: true
    };

    const state = {
      filters: loadSavedFilters(),
      rows: [],
      dateCutoff: subtractCalendarMonths(
        getSydneyToday(),
        2
      )
    };

    const app = document.getElementById('app');
    const loadingState = document.getElementById('loading-state');
    const dataTable = document.getElementById('data-table');
    const tableShell = document.getElementById('table-shell');
    const tableStatus = document.getElementById('table-status');
    const emptyState = document.getElementById('empty-state');
    const errorState = document.getElementById('error-state');
    const fallbackNotice = document.getElementById('fallback-notice');

    const repeatToggle = document.getElementById('repeat-toggle');
    const corporateToggle = document.getElementById('corporate-toggle');
    const locationToggle = document.getElementById('location-toggle');
    const stateToggle = document.getElementById('state-toggle');
    const delistedToggle = document.getElementById('delisted-toggle');

    function normaliseText(value) {
      return String(value ?? '')
        .replace(/\u00A0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ')
        .toLowerCase();
    }

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00A0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function isRepeatValue(value) {
      return normaliseText(value) === 'yes';
    }

    function isDelistedValue(value) {
      return normaliseText(value).startsWith('delisted');
    }

    function isCorporateValue(value) {
      const text = normaliseText(value);

      return (
        text === 'corporate' ||
        text.startsWith('corporate ') ||
        text.startsWith('corporate(') ||
        text
          .split(/[;,|/]/)
          .some(part => normaliseText(part) === 'corporate')
      );
    }

    function getEmployerTypeClass(value) {
      const text = normaliseText(value);

      if (
        text === 'corporate' ||
        text.startsWith('corporate ') ||
        text.startsWith('corporate(')
      ) {
        return 'category-corporate';
      }

      if (
        text === 'independent' ||
        text.startsWith('independent ') ||
        text.startsWith('independent(')
      ) {
        return 'category-independent';
      }

      if (
        text.includes('ophthal') ||
        text.includes('opthal')
      ) {
        return 'category-ophthal';
      }

      if (
        text === 'other' ||
        text.startsWith('other ') ||
        text.startsWith('other(')
      ) {
        return 'category-other';
      }

      return '';
    }

    function getStateCodes(value) {
      const text = cleanText(value).toUpperCase();

      const matches =
        text.match(
          /\b(?:NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/g
        ) || [];

      return [...new Set(matches)];
    }

    function getStateClass(value) {
      const stateCode =
        getStateCodes(value)[0] || '';

      return stateCode
        ? `state-${stateCode.toLowerCase()}`
        : '';
    }

    function getMMCodes(value) {
      const text = cleanText(value).toUpperCase();

      const matches = [
        ...text.matchAll(/\bMM\s*([1-7])\b/g)
      ];

      return [
        ...new Set(
          matches.map(match => `MM${match[1]}`)
        )
      ];
    }

    function columnNumberToLetter(columnNumber) {
      let number = columnNumber;
      let letters = '';

      while (number > 0) {
        const remainder = (number - 1) % 26;

        letters =
          String.fromCharCode(65 + remainder) +
          letters;

        number =
          Math.floor((number - 1) / 26);
      }

      return letters;
    }

    function getVisibleColumnNumbers() {
      const columns = [];

      for (
        let column = CONFIG.FIRST_COLUMN;
        column <= CONFIG.LAST_COLUMN;
        column++
      ) {
        if (!CONFIG.HIDDEN_COLUMNS.has(column)) {
          columns.push(column);
        }
      }

      return columns;
    }

    function getGvizCellDisplay(cell) {
      if (!cell) {
        return '';
      }

      return cleanText(
        cell.f ??
        cell.v ??
        ''
      );
    }

    function getSydneyToday() {
      try {
        const parts =
          new Intl.DateTimeFormat(
            'en-AU',
            {
              timeZone: 'Australia/Sydney',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            }
          ).formatToParts(new Date());

        const values =
          Object.fromEntries(
            parts
              .filter(
                part =>
                  part.type !== 'literal'
              )
              .map(
                part => [
                  part.type,
                  Number(part.value)
                ]
              )
          );

        return new Date(
          Date.UTC(
            values.year,
            values.month - 1,
            values.day
          )
        );
      } catch (error) {
        const now = new Date();

        return new Date(
          Date.UTC(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
          )
        );
      }
    }

    function subtractCalendarMonths(date, months) {
      const targetFirstDay =
        new Date(
          Date.UTC(
            date.getUTCFullYear(),
            date.getUTCMonth() - months,
            1
          )
        );

      const finalDayOfTargetMonth =
        new Date(
          Date.UTC(
            targetFirstDay.getUTCFullYear(),
            targetFirstDay.getUTCMonth() + 1,
            0
          )
        ).getUTCDate();

      return new Date(
        Date.UTC(
          targetFirstDay.getUTCFullYear(),
          targetFirstDay.getUTCMonth(),
          Math.min(
            date.getUTCDate(),
            finalDayOfTargetMonth
          )
        )
      );
    }

    function parseDateValue(value) {
      if (
        value instanceof Date &&
        !Number.isNaN(value.getTime())
      ) {
        return new Date(
          Date.UTC(
            value.getFullYear(),
            value.getMonth(),
            value.getDate()
          )
        );
      }

      const text = cleanText(value);

      if (!text) {
        return null;
      }

      let match = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/i
      );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]),
            Number(match[3])
          )
        );
      }

      match = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
      );

      if (match) {
        let year = Number(match[3]);

        if (year < 100) {
          year +=
            year >= 70
              ? 1900
              : 2000;
        }

        return new Date(
          Date.UTC(
            year,
            Number(match[2]) - 1,
            Number(match[1])
          )
        );
      }

      match = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})$/
      );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
          )
        );
      }

      const parsed = new Date(text);

      if (!Number.isNaN(parsed.getTime())) {
        return new Date(
          Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          )
        );
      }

      return null;
    }

    function getDateFromGvizCell(cell) {
      return (
        parseDateValue(cell?.v) ||
        parseDateValue(cell?.f)
      );
    }

    function getMondayWeekKey(dateValue) {
      const date = parseDateValue(dateValue);

      if (!date) {
        return '';
      }

      const daysSinceMonday =
        (date.getUTCDay() + 6) % 7;

      date.setUTCDate(
        date.getUTCDate() -
        daysSinceMonday
      );

      const year =
        date.getUTCFullYear();

      const month =
        String(
          date.getUTCMonth() + 1
        ).padStart(2, '0');

      const day =
        String(
          date.getUTCDate()
        ).padStart(2, '0');

      return `${year}-${month}-${day}`;
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat(
        'en-AU',
        {
          timeZone: 'UTC',
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        }
      ).format(date);
    }

    function canBuildJobLink(
      employer,
      suburb,
      stateCode
    ) {
      if (!cleanText(employer)) {
        return false;
      }

      if (normaliseText(suburb) === 'xxx') {
        return cleanText(stateCode) !== '';
      }

      return cleanText(suburb) !== '';
    }

    function buildColumnALink(
      sourceMarker,
      employerValue,
      suburbValue,
      stateValue
    ) {
      const sourceMarkerText =
        cleanText(sourceMarker);

      const employer =
        cleanText(employerValue);

      const suburb =
        cleanText(suburbValue);

      const stateCode =
        cleanText(stateValue);

      if (
        !canBuildJobLink(
          employer,
          suburb,
          stateCode
        )
      ) {
        return null;
      }

      const keywords =
        `"Optometrist" ${employer}`;

      const isIndeed =
        normaliseText(
          sourceMarkerText
        ).endsWith('indeed|');

      const employerWithoutSpaces =
        employer
          .replace(/\s+/g, '')
          .toLowerCase();

      const isEssiLux =
        /(opsm|eyeq|laubman&pank)/i.test(
          employerWithoutSpaces
        );

      if (isIndeed) {
        const location =
          normaliseText(suburb) === 'xxx'
            ? stateCode
            : `${suburb} ${stateCode}`.trim();

        return {
          text: 'Indeed',

          url:
            `https://au.indeed.com/jobs?q=${encodeURIComponent(keywords)}` +
            `&l=${encodeURIComponent(location)}` +
            '&radius=0&sort=date',

          className: 'link-indeed'
        };
      }

      if (isEssiLux) {
        return {
          text: 'EssiLux',

          url:
            'https://careers.essilorluxottica.com/search/' +
            '?createNewAlert=false' +
            '&q=optometrist' +
            '&optionsFacetsDD_country=AU' +
            '&optionsFacetsDD_city=' +
            '&optionsFacetsDD_customfield1=' +
            '&optionsFacetsDD_customfield2=' +
            '&optionsFacetsDD_customfield3=' +
            '&optionsFacetsDD_customfield4=',

          className: 'link-essilux'
        };
      }

      const firstSuburb =
        suburb
          .split(';')[0]
          .trim();

      const location =
        normaliseText(suburb) === 'xxx'
          ? stateCode
          : `${firstSuburb} ${stateCode}`.trim();

      return {
        text: 'SEEK',

        url:
          `https://www.seek.com.au/jobs?keywords=${encodeURIComponent(keywords)}` +
          `&where=${encodeURIComponent(location)}` +
          '&distance=0',

        className: 'link-seek'
      };
    }

    function buildModelFromGviz(response) {
      if (response?.status === 'error') {
        throw new Error(
          response?.errors?.[0]
            ?.detailed_message ||
          response?.errors?.[0]
            ?.message ||
          'Google Sheets returned an error.'
        );
      }

      const visibleColumns =
        getVisibleColumnNumbers();

      const columns =
        response?.table?.cols || [];

      const sourceRows =
        response?.table?.rows || [];

      const headers =
        visibleColumns.map(
          columnNumber => ({
            sourceColumn:
              columnNumber,

            text:
              cleanText(
                columns?.[
                  columnNumber - 1
                ]?.label
              ) ||
              columnNumberToLetter(
                columnNumber
              )
          })
        );

      const rows = [];

      sourceRows.forEach(
        (sourceRow, rowOffset) => {
          const cells =
            sourceRow?.c || [];

          const sourceAText =
            getGvizCellDisplay(
              cells[0]
            );

          /*
           * Column A's displayed formula result controls
           * whether the row is included.
           */
          if (!sourceAText) {
            return;
          }

          const dateValue =
            getDateFromGvizCell(
              cells[
                CONFIG.DATE_COLUMN - 1
              ]
            );

          /*
           * Only include ads dated within the last
           * two calendar months.
           */
          if (
            !dateValue ||
            dateValue < state.dateCutoff
          ) {
            return;
          }

          const repeatValue =
            getGvizCellDisplay(
              cells[
                CONFIG.REPEAT_FLAG_COLUMN -
                1
              ]
            );

          const sourceMarker =
            getGvizCellDisplay(
              cells[
                CONFIG.SOURCE_COLUMN -
                1
              ]
            );

          const employerValue =
            getGvizCellDisplay(
              cells[
                CONFIG.EMPLOYER_COLUMN -
                1
              ]
            );

          const employerTypeValue =
            getGvizCellDisplay(
              cells[
                CONFIG.EMPLOYER_TYPE_COLUMN -
                1
              ]
            );

          const suburbValue =
            getGvizCellDisplay(
              cells[
                CONFIG.SUBURB_COLUMN -
                1
              ]
            );

          const stateValue =
            getGvizCellDisplay(
              cells[
                CONFIG.STATE_COLUMN -
                1
              ]
            );

          const mmValue =
            getGvizCellDisplay(
              cells[
                CONFIG.MM_COLUMN -
                1
              ]
            );

          const delisted =
            isDelistedValue(
              sourceAText
            );

          const manualColumnALink =
            delisted
              ? null
              : buildColumnALink(
                  sourceMarker,
                  employerValue,
                  suburbValue,
                  stateValue
                );

          const stateCodes =
            getStateCodes(
              stateValue
            );

          const mmCodes =
            getMMCodes(
              mmValue
            );

          rows.push({
            sourceRow:
              CONFIG.HEADER_ROW +
              1 +
              rowOffset,

            isRepeat:
              isRepeatValue(
                repeatValue
              ),

            isCorporate:
              isCorporateValue(
                employerTypeValue
              ),

            isDelisted:
              delisted,

            hasMM1:
              mmCodes.includes('MM1'),

            hasNonMetroMM:
              mmCodes.some(
                code =>
                  code !== 'MM1'
              ),

            stateCodes,

            employerType:
              employerTypeValue,

            weekKey:
              getMondayWeekKey(
                dateValue
              ),

            cells:
              visibleColumns.map(
                columnNumber => {
                  if (
                    columnNumber === 1
                  ) {
                    if (delisted) {
                      return {
                        sourceColumn: 1,
                        text: sourceAText,
                        link: '',
                        linkClass: '',
                        isDelisted: true
                      };
                    }

                    return {
                      sourceColumn: 1,

                      text:
                        manualColumnALink
                          ?.text ||
                        sourceAText,

                      link:
                        manualColumnALink
                          ?.url ||
                        '',

                      linkClass:
                        manualColumnALink
                          ?.className ||
                        '',

                      isDelisted: false
                    };
                  }

                  return {
                    sourceColumn:
                      columnNumber,

                    text:
                      getGvizCellDisplay(
                        cells[
                          columnNumber -
                          1
                        ]
                      ),

                    link: '',
                    linkClass: '',
                    isDelisted: false
                  };
                }
              )
          });
        }
      );

      return {
        headers,
        rows
      };
    }

    function loadGvizModel() {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `pffJobTrackerCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

          const script =
            document.createElement(
              'script'
            );

          let settled = false;

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'The live Google Sheets feed timed out.'
                  )
                );
              },
              CONFIG.FETCH_TIMEOUT_MS
            );

          function cleanup() {
            if (settled) {
              return;
            }

            settled = true;

            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (error) {
              window[
                callbackName
              ] = undefined;
            }

            if (script.parentNode) {
              script.parentNode
                .removeChild(script);
            }
          }

          window[callbackName] =
            response => {
              try {
                const model =
                  buildModelFromGviz(
                    response
                  );

                cleanup();
                resolve(model);
              } catch (error) {
                cleanup();
                reject(error);
              }
            };

          script.onerror = () => {
            cleanup();

            reject(
              new Error(
                'The live Google Sheets feed could not be loaded.'
              )
            );
          };

          const params =
            new URLSearchParams({
              range:
                `A${CONFIG.HEADER_ROW}:Y`,

              headers: '1',

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(Date.now())
            });

          if (CONFIG.SHEET_NAME) {
            params.set(
              'sheet',
              CONFIG.SHEET_NAME
            );
          }

          script.src =
            `https://docs.google.com/spreadsheets/d/${CONFIG.SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

          document.body
            .appendChild(script);
        }
      );
    }

    function loadSavedFilters() {
      try {
        const saved =
          JSON.parse(
            localStorage.getItem(
              CONFIG.STORAGE_KEY
            ) || '{}'
          );

        return {
          showRepeats:
            typeof saved.showRepeats ===
            'boolean'
              ? saved.showRepeats
              : DEFAULT_FILTERS
                  .showRepeats,

          showCorporates:
            typeof saved.showCorporates ===
            'boolean'
              ? saved.showCorporates
              : DEFAULT_FILTERS
                  .showCorporates,

          locationMode:
            LOCATION_MODES.some(
              option =>
                option.value ===
                saved.locationMode
            )
              ? saved.locationMode
              : DEFAULT_FILTERS
                  .locationMode,

          stateFilter:
            STATE_OPTIONS.includes(
              saved.stateFilter
            )
              ? saved.stateFilter
              : DEFAULT_FILTERS
                  .stateFilter,

          showDelisted:
            typeof saved.showDelisted ===
            'boolean'
              ? saved.showDelisted
              : DEFAULT_FILTERS
                  .showDelisted
        };
      } catch (error) {
        return {
          ...DEFAULT_FILTERS
        };
      }
    }

    function saveFilters() {
      try {
        localStorage.setItem(
          CONFIG.STORAGE_KEY,
          JSON.stringify(
            state.filters
          )
        );
      } catch (error) {
        console.warn(
          'The browser could not save the filter settings.',
          error
        );
      }
    }

    function cycleValue(
      currentValue,
      options
    ) {
      const currentIndex =
        options.indexOf(
          currentValue
        );

      return options[
        (currentIndex + 1) %
        options.length
      ];
    }

    function setBooleanButton(
      button,
      isOn
    ) {
      button.classList.toggle(
        'is-on',
        isOn
      );

      button.setAttribute(
        'aria-checked',
        String(isOn)
      );

      button
        .querySelector(
          '.filter-value'
        )
        .textContent =
          isOn
            ? 'ON'
            : 'OFF';
    }

    function updateLocationButton() {
      const option =
        LOCATION_MODES.find(
          item =>
            item.value ===
            state.filters.locationMode
        ) ||
        LOCATION_MODES[0];

      locationToggle
        .querySelector(
          '.filter-value'
        )
        .textContent =
          option.label;

      locationToggle.setAttribute(
        'aria-label',
        `Location filter: ${option.spoken}. Click to change.`
      );
    }

    function updateStateButton() {
      const selectedState =
        state.filters.stateFilter;

      const valueElement =
        stateToggle.querySelector(
          '.filter-value'
        );

      valueElement.textContent =
        selectedState;

      valueElement.style.color =
        selectedState === 'ALL'
          ? 'var(--purple)'
          : STATE_COLOURS[
              selectedState
            ];

      valueElement.style.background =
        selectedState === 'ALL'
          ? 'rgba(102, 0, 255, 0.08)'
          : `${STATE_COLOURS[selectedState]}1f`;

      stateToggle.setAttribute(
        'aria-label',
        `State filter: ${
          selectedState === 'ALL'
            ? 'all states'
            : selectedState
        }. Click to change.`
      );
    }

    function updateAllControls() {
      setBooleanButton(
        repeatToggle,
        state.filters.showRepeats
      );

      setBooleanButton(
        corporateToggle,
        state.filters.showCorporates
      );

      setBooleanButton(
        delistedToggle,
        state.filters.showDelisted
      );

      updateLocationButton();
      updateStateButton();
    }

    function appendCellContent(
      cellElement,
      cellModel
    ) {
      const displayText =
        cellModel.text || '—';

      if (cellModel.link) {
        const anchor =
          document.createElement(
            'a'
          );

        anchor.href =
          cellModel.link;

        anchor.target =
          '_blank';

        anchor.rel =
          'noopener noreferrer';

        anchor.textContent =
          displayText;

        anchor.setAttribute(
          'aria-label',
          `${displayText} — opens in a new tab`
        );

        if (cellModel.linkClass) {
          anchor.classList.add(
            cellModel.linkClass
          );
        }

        cellElement.appendChild(
          anchor
        );

        return;
      }

      cellElement.textContent =
        displayText;
    }

    function renderTable(model) {
      const thead =
        dataTable.querySelector(
          'thead'
        );

      const tbody =
        dataTable.querySelector(
          'tbody'
        );

      thead.textContent = '';
      tbody.textContent = '';

      const headerRow =
        document.createElement(
          'tr'
        );

      model.headers.forEach(
        header => {
          const th =
            document.createElement(
              'th'
            );

          th.scope = 'col';

          th.dataset.sourceColumn =
            columnNumberToLetter(
              header.sourceColumn
            );

          th.textContent =
            header.text ||
            columnNumberToLetter(
              header.sourceColumn
            );

          headerRow.appendChild(
            th
          );
        }
      );

      thead.appendChild(
        headerRow
      );

      const fragment =
        document.createDocumentFragment();

      state.rows = [];

      model.rows.forEach(
        rowModel => {
          const tr =
            document.createElement(
              'tr'
            );

          tr.dataset.sourceRow =
            String(
              rowModel.sourceRow
            );

          tr.dataset.week =
            rowModel.weekKey || '';

          if (rowModel.isRepeat) {
            tr.classList.add(
              'repeat-row'
            );
          }

          rowModel.cells.forEach(
            cellModel => {
              const td =
                document.createElement(
                  'td'
                );

              td.dataset.sourceColumn =
                columnNumberToLetter(
                  cellModel.sourceColumn
                );

              appendCellContent(
                td,
                cellModel
              );

              if (
                cellModel.sourceColumn ===
                CONFIG.EMPLOYER_TYPE_COLUMN
              ) {
                const categoryClass =
                  getEmployerTypeClass(
                    cellModel.text
                  );

                if (categoryClass) {
                  td.classList.add(
                    categoryClass
                  );
                }
              }

              if (
                cellModel.sourceColumn ===
                CONFIG.STATE_COLUMN
              ) {
                const stateClass =
                  getStateClass(
                    cellModel.text
                  );

                if (stateClass) {
                  td.classList.add(
                    stateClass
                  );
                }
              }

              if (
                cellModel.sourceColumn ===
                  1 &&
                cellModel.isDelisted
              ) {
                td.classList.add(
                  'delisted-cell'
                );
              }

              tr.appendChild(td);
            }
          );

          fragment.appendChild(tr);

          state.rows.push({
            element: tr,

            isRepeat:
              rowModel.isRepeat,

            isCorporate:
              rowModel.isCorporate,

            isDelisted:
              rowModel.isDelisted,

            hasMM1:
              rowModel.hasMM1,

            hasNonMetroMM:
              rowModel
                .hasNonMetroMM,

            stateCodes:
              rowModel.stateCodes,

            weekKey:
              rowModel.weekKey ||
              '',

            isHidden: false
          });
        }
      );

      tbody.appendChild(
        fragment
      );

      applyFilters();
    }

    function rowMatchesLocation(row) {
      switch (
        state.filters.locationMode
      ) {
        case 'metro':
          return row.hasMM1;

        case 'nonmetro':
          return row.hasNonMetroMM;

        default:
          return true;
      }
    }

    function rowMatchesState(row) {
      return (
        state.filters.stateFilter ===
          'ALL' ||
        row.stateCodes.includes(
          state.filters.stateFilter
        )
      );
    }

    function refreshWeekDividers() {
      state.rows.forEach(
        row => {
          row.element.classList.remove(
            'week-divider'
          );
        }
      );

      const visibleRows =
        state.rows.filter(
          row =>
            !row.isHidden
        );

      for (
        let index = 0;
        index <
          visibleRows.length - 1;
        index++
      ) {
        const currentRow =
          visibleRows[index];

        const nextRow =
          visibleRows[index + 1];

        if (
          currentRow.weekKey &&
          nextRow.weekKey &&
          currentRow.weekKey !==
            nextRow.weekKey
        ) {
          currentRow.element
            .classList.add(
              'week-divider'
            );
        }
      }
    }

    function applyFilters() {
      let visibleCount = 0;

      state.rows.forEach(
        row => {
          const hidden =
            (
              !state.filters
                .showRepeats &&
              row.isRepeat
            ) ||
            (
              !state.filters
                .showCorporates &&
              row.isCorporate
            ) ||
            (
              !state.filters
                .showDelisted &&
              row.isDelisted
            ) ||
            !rowMatchesLocation(
              row
            ) ||
            !rowMatchesState(
              row
            );

          row.isHidden =
            hidden;

          row.element.classList.toggle(
            'is-hidden',
            hidden
          );

          if (!hidden) {
            visibleCount++;
          }
        }
      );

      refreshWeekDividers();

      const totalCount =
        state.rows.length;

      tableStatus.textContent =
        `Showing ${visibleCount.toLocaleString('en-AU')} of ` +
        `${totalCount.toLocaleString('en-AU')} jobs since ` +
        `${formatDate(state.dateCutoff)}`;

      emptyState.classList.toggle(
        'is-visible',
        visibleCount === 0
      );

      dataTable.style.display =
        visibleCount === 0
          ? 'none'
          : '';
    }

    function commitFilterChange() {
      saveFilters();
      updateAllControls();
      applyFilters();
    }

    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );
    }

    function showError(error) {
      console.error(error);

      hideLoadingState();

      tableShell.style.display =
        'none';

      tableStatus.textContent =
        'Could not load jobs';

      errorState.textContent =
        `${
          error?.message ||
          'Could not load the spreadsheet.'
        } ` +
        'Ensure the spreadsheet is shared as “Anyone with the link can view” and, if needed, set the exact worksheet tab in CONFIG.SHEET_NAME.';

      errorState.classList.add(
        'is-visible'
      );
    }

    async function loadTableData() {
      try {
        const model =
          await loadGvizModel();

        renderTable(model);
        hideLoadingState();
      } catch (error) {
        showError(error);
      }
    }

    repeatToggle.addEventListener(
      'click',
      () => {
        state.filters.showRepeats =
          !state.filters.showRepeats;

        commitFilterChange();
      }
    );

    corporateToggle.addEventListener(
      'click',
      () => {
        state.filters.showCorporates =
          !state.filters.showCorporates;

        commitFilterChange();
      }
    );

    locationToggle.addEventListener(
      'click',
      () => {
        const values =
          LOCATION_MODES.map(
            option =>
              option.value
          );

        state.filters.locationMode =
          cycleValue(
            state.filters.locationMode,
            values
          );

        commitFilterChange();
      }
    );

    stateToggle.addEventListener(
      'click',
      () => {
        state.filters.stateFilter =
          cycleValue(
            state.filters.stateFilter,
            STATE_OPTIONS
          );

        commitFilterChange();
      }
    );

    delistedToggle.addEventListener(
      'click',
      () => {
        state.filters.showDelisted =
          !state.filters.showDelisted;

        commitFilterChange();
      }
    );

    updateAllControls();
    loadTableData();
  </script>
</body>
</html>
