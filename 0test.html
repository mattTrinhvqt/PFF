<!DOCTYPE html>
<html>
<head>
  <script>
    /* --- Visual scale toggle (set true/false) --- */
    const ENABLE_SCALE = false;

    let scaleTimer = null;

    function scheduleApplyScale() {
      if (!ENABLE_SCALE) return;
      clearTimeout(scaleTimer);

      scaleTimer = setTimeout(() => {
        requestAnimationFrame(applyScale);
      }, 80);
    }

    function applyScale() {
      const app = document.getElementById('app');
      const fit = document.getElementById('fit');
      if (!app || !fit) return;

      if (!ENABLE_SCALE) {
        app.style.transform = 'none';
        fit.style.minHeight = '100vh';
        fit.style.width = '100%';
        return;
      }

      const prevTransform = app.style.transform;
      app.style.transform = 'none';

      let sizer = document.getElementById('appSizer');

      if (!sizer) {
        sizer = app.cloneNode(true);
        sizer.id = 'appSizer';
        document.body.appendChild(sizer);
      } else {
        sizer.innerHTML = app.innerHTML;
      }

      Object.assign(sizer.style, {
        position: 'absolute',
        left: '-99999px',
        top: '0',
        transform: 'none',
        visibility: 'hidden',
        pointerEvents: 'none',
        display: 'block',
        width: getComputedStyle(app).width
      });

      const sResults = sizer.querySelector('#results');
      const sOut = sizer.querySelector('#out');

      if (sResults) sResults.style.display = 'block';
      if (sOut) sOut.textContent = 'Calculating…';

      const NAT_W = sizer.offsetWidth || app.offsetWidth || 1;
      const NAT_H = sizer.offsetHeight || app.offsetHeight || 1;

      app.style.transform = prevTransform;

      const vw = document.documentElement.clientWidth || window.innerWidth;
      const vh = window.innerHeight;

      const scale = Math.min(vw / NAT_W, vh / NAT_H, 1);

      app.style.transform = `scale(${scale})`;
      fit.style.width = '100%';
      fit.style.minHeight = Math.max(Math.ceil(NAT_H * scale), vh) + 'px';
    }

    window.addEventListener('load', scheduleApplyScale);
    window.addEventListener('resize', scheduleApplyScale);
    window.addEventListener('orientationchange', scheduleApplyScale);
    window.addEventListener('pageshow', scheduleApplyScale);
  </script>

  <meta charset="utf-8">
  <title>Locum Optom Income Estimator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --benchmark-red: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 0;
      width: 100%;
    }

    .box {
      width: min(calc(100% - 24px), 520px);
      max-width: 100%;
      min-width: 0;
      margin-inline: auto;
      padding: 20px 18px 28px;
      text-align: center;
    }

    #app {
      transform-origin: top center;
      will-change: transform;
    }

    .calculator-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(28px, 6.6vw, 36px);
      font-weight: 700;
      line-height: 1.2;
    }

    .calculator-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .calculator-notice {
      width: 100%;
      margin: 0 0 8px;
      padding: 0 0 14px;
      border-bottom: 1px solid var(--track);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .calculator-notice p {
      margin: 0;
    }

    .calculator-notice p + p {
      margin-top: 2px;
    }

    #modelMeta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .calculator-form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-top: 14px;
      text-align: left;
    }

    .field,
    .field:first-child,
    .field:nth-child(3) {
      grid-column: auto;
      margin: 0;
    }

    .field label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 0;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.25;
      text-align: center;
    }

    .field label small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
    }

    .field-label-with-help {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 17px;
      text-align: center;
    }

    .field-label-with-help label {
      display: block;
      min-height: 0;
      margin: 0;
    }

    .help-tooltip-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
    }

    .help-tooltip-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--muted);
      border-radius: 50%;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .help-tooltip-button:hover,
    .help-tooltip-button:focus-visible {
      color: var(--ink);
      border-color: var(--ink);
      outline: none;
    }

    .help-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      width: max-content;
      max-width: min(280px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      padding: 8px 10px;
      overflow-y: auto;
      color: #fff;
      background: var(--ink);
      border-radius: 5px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      white-space: normal;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 120ms ease,
        visibility 120ms ease;
    }

    .help-tooltip.is-visible {
      opacity: 1;
      visibility: visible;
    }

    /* Position is calculated dynamically, so no arrow is needed. */
    .help-tooltip::after {
      display: none;
    }

    .field label small a {
      color: var(--purple);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      text-decoration: underline;
    }

    .field input[type="number"],
    .field select {
      display: block;
      width: 100%;
      height: 38px;
      margin: 6px auto 0;
      padding: 0 3px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--muted);
      border-radius: 0;
      font: inherit;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .field input[type="number"]:focus,
    .field select:focus {
      border-bottom-color: var(--ink);
    }

    select {
      text-align-last: center;
      -moz-text-align-last: center;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    #estimateBtn,
    #toggleBtn {
      display: block;
      width: 100%;
      min-height: 48px;
      margin: 0 auto;
      padding: 0 18px;
      border-radius: 6px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #estimateBtn {
      align-self: end;
      min-height: 38px;
      padding: 0 12px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink);
      font-size: 14px;
      font-weight: 400;
    }

    #estimateBtn:hover {
      color: #fff;
      background: var(--ink);
    }

    #toggleBtn {
      margin-top: 16px;
      min-height: 38px;
      padding: 0 12px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink);
      font-size: 14px;
      font-weight: 400;
    }

    #toggleBtn:hover {
      color: #fff;
      background: var(--ink);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #out {
      grid-column: 1 / -1;
      min-height: 0;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
    }

    #out:empty {
      display: none;
    }

    /* Same red used by the permanent tracker */
    #out.is-error,
    #resultsStatus.is-error {
      color: var(--benchmark-red);
    }

    #results {
      position: relative;
      display: none;
      grid-column: 1 / -1;
      margin-top: 12px;
      padding-top: 22px;
      border-top: 1px solid var(--track);
      text-align: left;
    }

    #resultsStatus {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      z-index: 5;
      min-height: 18px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      line-height: 1.25;
      text-align: left;
    }

    #results.show-status {
      border-top-color: transparent;
    }

    #results.show-status #resultsStatus {
      display: block;
    }

    .results-section-label {
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
    }

    .scale {
      --trackY: 52px;
      --barH: 6px;
      --gapValue: 6px;
      --gapLabel: 7px;

      position: relative;
      margin-top: 16px;
      padding: 58px 0 76px;
    }

    .scale .track {
      position: absolute;
      top: var(--trackY);
      right: 0;
      left: 0;
      height: var(--barH);
      background: var(--track);
      border-radius: 0;
    }

    .scale .tick {
      --stemUp: 20px;
      --stemDown: 18px;

      position: absolute;
      top: calc(var(--trackY) + var(--barH) / 2);
      transform: translateX(-50%);
      text-align: center;
    }

    .scale .t20,
    .scale .t80 {
      --stemUp: 17px;
      --stemDown: 16px;
    }

    .scale .t5,
    .scale .t95 {
      --stemUp: 14px;
      --stemDown: 14px;
    }

    .scale .tick .stem {
      position: absolute;
      top: calc(-1 * var(--stemUp));
      left: 50%;
      width: 0;
      height: calc(var(--stemUp) + var(--stemDown));
      transform: translateX(-50%);
      border-left: 3px solid var(--muted);
    }

    .scale .t50 .stem {
      border-left-width: 4px;
      border-left-color: var(--purple);
    }

    .scale .t5 .stem,
    .scale .t95 .stem {
      border-left-width: 2px;
    }

    .scale .tick .value {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, calc(-100% - var(--stemUp) - var(--gapValue)));
      color: var(--ink);
      font-size: 13px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    .scale .tick .label {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, calc(var(--stemDown) + var(--gapLabel)));
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
    }

    .scale .t50 .value,
    .scale .t50 .label {
      color: var(--purple);
      font-size: 16px;
      font-weight: 700;
    }

    .scale .t20 .value,
    .scale .t80 .value {
      font-size: 12px;
    }

    .scale .t5 .value,
    .scale .t95 .value {
      font-size: 11px;
    }

    /* Personal salary benchmark marker */
    .user-marker {
      position: absolute;
      top: calc(var(--trackY) + var(--barH) / 2);
      z-index: 10;
      color: var(--benchmark-red);
      pointer-events: none;
      transition:
        left 1700ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 320ms ease;
      will-change: left;
    }

    .user-marker[hidden] {
      display: none;
    }

    /*
     * Keep the normal grey and purple markers above the thin
     * red stem where they cross.
     */
    .scale .tick {
      z-index: 2;
    }

    /* Target-style “You are here” marker */
    .user-marker-dot {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 4;
      width: 7px;
      height: 7px;
      transform: translate(-50%, -50%);
      background: transparent;
      border: 1px solid var(--benchmark-red);
      border-radius: 50%;
      box-shadow: none;
    }

    /* Small target centre */
    .user-marker-dot::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 3px;
      transform: translate(-50%, -50%);
      background: var(--benchmark-red);
      border-radius: 50%;
    }

    /*
     * Minimal stem: only slightly protrudes above and below
     * the horizontal grey bar.
     */
    .user-marker-stem {
      position: absolute;
      top: -8px;
      left: 0;
      z-index: 1;
      width: 0;
      height: 16px;
      transform: translateX(-50%);
      border-left: 1px solid var(--benchmark-red);
    }

    /*
     * Small red rounded rectangles overlaid in the existing gaps.
     * These do not alter the positions of any existing values.
     */
    .user-marker-top,
    .user-marker-percentile {
      position: absolute;
      left: 0;
      z-index: 4;
      display: inline-block;
      padding: 2px 6px 3px;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(180, 35, 24, 0.90);
      border-radius: 4px;
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      transition:
        transform 700ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 260ms ease;
    }

    /*
     * Below the existing salary number, but above the grey bar.
     * The bottom edge remains 8px above the bar centre.
     */
    .user-marker-top {
      bottom: 8px;
    }

    /*
     * Below the grey bar, but above the existing percentile label.
     */
    .user-marker-percentile {
      top: 8px;
    }

    /*
     * Keep pills inside the chart at percentiles near its endpoints.
     * They remain centred everywhere else.
     */
    .user-marker.edge-left .user-marker-top,
    .user-marker.edge-left .user-marker-percentile {
      transform: translateX(0);
    }

    .user-marker.edge-right .user-marker-top,
    .user-marker.edge-right .user-marker-percentile {
      transform: translateX(-100%);
    }

    .caption {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .calculator-note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .warn {
      color: #b42318;
    }

    @media (max-width: 430px) {
      .box {
        width: calc(100% - 24px);
        padding: 18px 14px 26px;
      }

      .calculator-form {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 12px;
      }

      .field label {
        min-height: 0;
        font-size: 12px;
      }

      .field label small a {
        font-size: 12px;
      }

      .field input[type="number"],
      .field select {
        height: 36px;
        margin-top: 6px;
        font-size: 15px;
      }
    }


    /* ==========================================================
     * EXPANDING INPUTS / EXPANDING RESULTS LAYOUT
     * ==========================================================
     */

    .box {
      display: flex;
      width: min(calc(100% - 16px), 520px);
      min-height: 0;
      flex-direction: column;
      padding: 14px 14px 22px;
    }

    #app {
      overflow: visible;
    }

    .input-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      width: 100%;
      max-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      background: #fff;
      border: 0;
      border-bottom: 0 solid var(--track);
      border-radius: 0;
      font: inherit;
      text-align: left;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      pointer-events: none;
      cursor: pointer;
      transition:
        max-height 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        padding 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        border-width 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 420ms ease,
        transform 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        visibility 0s linear 1100ms;
    }

    .input-summary:hover .input-summary-edit {
      color: var(--ink);
    }

    .input-summary:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .input-summary-values {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .input-summary-values::-webkit-scrollbar {
      display: none;
    }

    .input-summary-separator {
      flex: 0 0 auto;
      color: var(--track);
    }

    .input-summary-edit {
      flex: 0 0 auto;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      text-transform: uppercase;
      transition: color 140ms ease;
    }

    .calculator-notice,
    .calculator-form > .field,
    #estimateBtn,
    #out {
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        max-height 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        min-height 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        margin 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        padding 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        border-width 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 380ms ease,
        transform 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        visibility 0s linear 0s;
    }

    .calculator-notice {
      max-height: 80px;
    }

    .calculator-form > .field {
      max-height: 100px;
    }

    #estimateBtn {
      max-height: 48px;
    }

    #out {
      max-height: 70px;
    }

    .calculator-form {
      flex: 0 0 auto;
      min-height: 0;
      transition:
        gap 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        margin 1100ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Before the first calculation, distribute the inputs vertically
       so the calculator uses the available viewport instead of leaving
       a large blank area below the button. */
    #app:not(.has-results) .calculator-form {
      align-content: start;
    }

    #results {
      min-height: 0;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      transition:
        max-height 1250ms cubic-bezier(0.16, 1, 0.3, 1),
        margin 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        padding 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 480ms ease,
        transform 1250ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #app.has-results #results {
      max-height: 190px;
      opacity: 1;
      transform: translateY(0);
    }

    /* With the inputs open, retain the heading and percentile numbers
       as a live preview while clipping the lower result controls. */
    #app.has-results:not(.is-input-collapsed) #results {
      max-height: 220px;
      padding-bottom: 4px;
      overflow: hidden;
    }

    #app.has-results:not(.is-input-collapsed) #toggleBtn,
    #app.has-results:not(.is-input-collapsed) .calculator-note {
      display: none !important;
    }

    #app.has-results:not(.is-input-collapsed) #results::after {
      display: none;
    }

    /* Successful calculation: compress all inputs into one top row and
       allow the complete results area to occupy the remaining space. */
    #app.is-input-collapsed .input-summary {
      max-height: 54px;
      padding: 13px 2px 12px;
      border-bottom-width: 1px;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
      transition:
        max-height 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        padding 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        border-width 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 460ms ease 180ms,
        transform 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        visibility 0s linear 0s;
    }

    #app.is-input-collapsed .calculator-notice,
    #app.is-input-collapsed .calculator-form > .field,
    #app.is-input-collapsed #estimateBtn,
    #app.is-input-collapsed #out {
      max-height: 0;
      min-height: 0;
      margin-top: 0;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-9px);
      pointer-events: none;
      transition:
        max-height 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        min-height 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        margin 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        padding 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        border-width 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 360ms ease,
        transform 1100ms cubic-bezier(0.16, 1, 0.3, 1),
        visibility 0s linear 420ms;
    }

    #app.is-input-collapsed .calculator-form {
      display: flex;
      flex: 0 0 auto;
      min-height: 0;
      flex-direction: column;
      gap: 0;
      margin-top: 0;
    }

    #app.is-input-collapsed #results {

    /* Retain the current compact visual settings. */
    #modelMeta {

    .help-tooltip {

    .field input[type="number"],

    .field input[type="number"]:hover,

    #estimateBtn:focus-visible,
    #toggleBtn:focus-visible {

    .results-section-label {

    }

    .results-heading {
      display: flex;
      width: 100%;
      align-items: baseline;
      justify-content: center;
      overflow: visible;
      white-space: nowrap;
    }

    .results-heading-fixed,
    .results-heading-detail {

    }

    .results-heading-detail {

    }

    .scale {
      --trackY: 48px;
      --barH: 4px;
      margin: 14px 22px 0;

    }

    .scale .tick .stem {

    }

    .scale .t50 .stem {

    }

    .scale .t5 .stem,
    .scale .t95 .stem {

    .caption {
      margin-top: 2px;
      font-size: 12px;
    }

    .calculator-note {

      font-size: 12px;
    }

    @media (max-width: 430px) {
      .box {
        width: calc(100% - 12px);
        padding: 12px 8px 20px;
      }

      .calculator-form {

      }

      #app.is-input-collapsed .input-summary {

      }

      .input-summary-values {
        font-size: 10px;
      }

      .input-summary-edit {
        font-size: 9px;
      }

      #app.has-results:not(.is-input-collapsed) #results {

      }

      .scale {

      .field input[type="number"],
      .field select {
        margin-top: 5px;
        padding-right: 8px;
        padding-left: 8px;
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .input-summary,
      .calculator-notice,
      .calculator-form,
      .calculator-form > .field,
      #estimateBtn,
      #out,
      #results,
      .user-marker,
      .user-marker-top,

      .results-heading-fixed,
      .results-heading-detail {

      }
    }


    /* ==========================================================
     * FINAL VERTICAL COMPACTION
     * Keeps the original visual language while reducing unused
     * height in both the input and result states.
     * ==========================================================
     */

    .box {
      padding: 9px 10px 12px;
    }

    .calculator-notice {
      margin-bottom: 4px;

    }

    #app:not(.has-results) .calculator-form {

    }

    #app.has-results:not(.is-input-collapsed) .calculator-form {

    .field label {

    .field label small {

    }

    .field label small a {

    }

    .field-label-with-help {
      min-height: 15px;
      gap: 4px;
    }

    .help-tooltip-button {
      width: 15px;
      height: 15px;
      font-size: 10px;
    }

    .field input[type="number"],
    .field select {
      height: 32px;
      margin-top: 3px;
      padding-right: 4px;
      padding-left: 4px;
      font-size: 15px;
    }

    #estimateBtn {
      min-height: 34px;
      max-height: 34px;
      margin-top: 1px;
      font-size: 13px;
    }

    #out {
      font-size: 12px;
      line-height: 1.25;
    }

    #results {
      margin-top: 6px;
      padding-top: 18px;
    }

    #results.show-status {
      padding-top: 24px;
    }

    .results-section-label {
      line-height: 1.2;
    }

    .scale {
      --trackY: 48px;
      margin: 14px 28px 0;
      padding: 54px 0 48px;
    }

    .caption {
      margin-top: 2px;
      font-size: 12px;
      line-height: 1.2;

    #toggleBtn {

      font-size: 13px;
    }

    .calculator-note {
      margin-top: 8px;

    }

    #app.is-input-collapsed .input-summary {

    #app.has-results #results {

    }

    #app.has-results:not(.is-input-collapsed) #results {

    #app.has-results:not(.is-input-collapsed) #results.show-status {

    .results-content,

    /* In the compact-results state, use the available viewport height
       to centre the complete results group without changing the spacing
       between its heading, percentile bar, caption, button, or note. */
    #app.is-input-collapsed {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #app.is-input-collapsed .calculator-form {
      flex: 1 1 auto;

    @media (max-width: 430px) {
      .box {
        padding: 8px 6px 10px;
      }

      .calculator-form {

        margin-top: 6px;
      }

      .field input[type="number"],
      .field select {
        height: 31px;
        margin-top: 3px;

      }

      #app.is-input-collapsed .input-summary {

    /* ==========================================================
     * BALANCED COMPACT STAGE
     * Caps the overall calculator height while distributing each
     * view through that space. Spacing inside the results block is
     * intentionally unchanged.
     * ==========================================================
     */

    #app {
      min-height: min(100dvh, 520px);
    }

    /* Initial calculator and reopened-input views use the same compact
       stage. Their visible rows are distributed from top to bottom so
       unused space is shared between elements rather than collecting
       beneath the Calculate button. */
    #app:not(.is-input-collapsed) {
      display: flex;
      flex-direction: column;
    }

    #app:not(.is-input-collapsed) .calculator-form {
      flex: 1 1 auto;
      min-height: 0;
      align-content: space-between;
      gap: 0;
    }

    /* Keep a small, consistent minimum separation when the viewport is
       too short for space-between to create a larger natural gap. */
    #app:not(.is-input-collapsed) .calculator-form > .field,
    #app:not(.is-input-collapsed) #estimateBtn,
    #app:not(.is-input-collapsed) #out,
    #app:not(.is-input-collapsed) #results {
      margin-top: 0;
      margin-bottom: 0;
    }

    /* Once the inputs collapse, centre the complete results group in
       the remaining compact stage. This does not alter the established
       spacing between the Estimated heading, percentile values, bar,
       caption, switch button, or note. */
    #app.is-input-collapsed {
      min-height: min(100dvh, 520px);
    }

    #app.is-input-collapsed .calculator-form {
      flex: 1 1 auto;
      min-height: 0;
    }

    #app.is-input-collapsed #results {
      flex: 1 1 auto;
      min-height: 0;
      justify-content: center;
      margin-top: 0;
    }

    #app.is-input-collapsed .results-content {
      margin-top: 0;
      margin-bottom: 0;
    }

    @media (max-width: 430px) {
      #app,
      #app.is-input-collapsed {
        min-height: min(100dvh, 500px);
      }

      #app:not(.is-input-collapsed) .calculator-form {
        align-content: space-between;
      }
    }


    /* ==========================================================
     * SMOOTHER BALANCED TRANSITIONS
     * Gives the reopened input fields comfortable separation and
     * makes each view change as one continuous movement.
     * ==========================================================
     */

    :root {
      --layout-duration: 920ms;
      --layout-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    #app {
      transition:
        min-height var(--layout-duration) var(--layout-ease);
    }

    .input-summary {
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 360ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear var(--layout-duration);
    }

    #app.is-input-collapsed .input-summary {
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 420ms ease 120ms,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s;
    }

    .calculator-notice,
    .calculator-form > .field,
    #estimateBtn,
    #out {
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 320ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s;
    }

    #app.is-input-collapsed .calculator-notice,
    #app.is-input-collapsed .calculator-form > .field,
    #app.is-input-collapsed #estimateBtn,
    #app.is-input-collapsed #out {
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 280ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 360ms;
    }

    .calculator-form {
      transition:
        gap var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease);
    }

    #results {
      transition:
        max-height 980ms var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        opacity 420ms ease,
        transform 980ms var(--layout-ease);
    }

    /* The reopened input view needs a little more natural breathing
       room than the first view because the percentile preview is also
       visible underneath it. */
    #app.has-results:not(.is-input-collapsed) {
      min-height: min(100dvh, 560px);
    }

    #app.has-results:not(.is-input-collapsed) .calculator-form {
      align-content: start;
      gap: 10px;
    }

    #app.has-results:not(.is-input-collapsed) .calculator-form > .field {
      flex: 0 0 auto;
    }

    #app.has-results:not(.is-input-collapsed) #results {
      margin-top: 2px;
    }

    #app.is-layout-transitioning .input-summary {
      pointer-events: none;
    }

    @media (max-width: 430px) {
      #app.has-results:not(.is-input-collapsed) {
        min-height: min(100dvh, 550px);
      }

      #app.has-results:not(.is-input-collapsed) .calculator-form {
        gap: 9px;
      }
    }

  
  </style>

<body>
  <div id="fit">
    <div id="app" class="box">

      <button
        id="inputSummaryButton"
        class="input-summary"
        type="button"
        aria-expanded="true"
        aria-controls="calculatorInputArea"
      >
        <span class="input-summary-values">
          <span id="summaryYears">Experience</span>
          <span class="input-summary-separator" aria-hidden="true">·</span>
          <span id="summaryMmm">MMM</span>
        </span>

        <span class="input-summary-edit">Edit</span>
      </button>

      <aside class="calculator-notice" role="note">
        <p>Shows what locums charge</p>
        <p id="modelMeta" aria-live="polite">Loading model…</p>
      </aside>

      <main id="calculatorInputArea" class="calculator-form">

        <div class="field">
          <label for="years">
            Years since graduating
          </label>
          <input
            id="years"
            type="number"
            inputmode="decimal"
            enterkeyhint="next"
            min="0"
            max="50"
            step="0.5"
            required
          >
        </div>

        <div class="field">
          <label for="mmm">
            Rurality of practice (MMM)
            <small>
              <a
                href="https://www.health.gov.au/resources/apps-and-tools/health-workforce-locator/health-workforce-locator"
                target="_blank"
                rel="noopener"
              >Find my MMM</a>
            </small>
          </label>

          <select id="mmm" required>
            <option value="" selected disabled>Select MMM…</option>
            <option value="1">MM1 (Metropolitan areas)</option>
            <option value="2">MM2 (Regional centres)</option>
            <option value="3">MM3 (Large rural towns)</option>
            <option value="4">MM4 (Medium rural towns)</option>
            <option value="5">MM5 (Small rural towns)</option>
            <option value="6">MM6 (Remote communities)</option>
            <option value="7">MM7 (Very remote communities)</option>
          </select>
        </div>

        <button id="estimateBtn" type="button">Calculate</button>

        <div id="out" aria-live="polite"></div>

        <section id="results" aria-live="polite">
          <div id="resultsStatus" aria-live="polite"></div>

          <div class="results-content">
            <div class="results-primary">
              <div class="results-section-label">
                Estimated hourly weekday rate
              </div>

              <div id="pctScale" class="scale">
                <div class="track"></div>

                <div class="tick t5">
                  <span class="value" id="p05v">–</span>
                  <span class="stem"></span>
                  <span class="label">5<sup>th</sup></span>
                </div>

                <div class="tick t20">
                  <span class="value" id="p20v">–</span>
                  <span class="stem"></span>
                  <span class="label">20<sup>th</sup></span>
                </div>

                <div class="tick t50">
                  <span class="value" id="p50v">–</span>
                  <span class="stem"></span>
                  <span class="label">Median</span>
                </div>

                <div class="tick t80">
                  <span class="value" id="p80v">–</span>
                  <span class="stem"></span>
                  <span class="label">80<sup>th</sup></span>
                </div>

                <div class="tick t95">
                  <span class="value" id="p95v">–</span>
                  <span class="stem"></span>
                  <span class="label">95<sup>th</sup></span>
                </div>
              </div>

              <div class="caption">
                Prediction percentiles
              </div>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script>
    const SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbyJKRhC3WEDrX9j323MOwEccI3Iv1_O-pEb7PJhPBpQHKFvAqPwrz3il7t-xPFv8D7htg/exec';

    const out = document.getElementById('out');
    const estimateBtn = document.getElementById('estimateBtn');
    const resultsStatus = document.getElementById('resultsStatus');
    const appElement = document.getElementById('app');
    const inputSummaryButton =
      document.getElementById('inputSummaryButton');
    const summaryYears = document.getElementById('summaryYears');
    const summaryMmm = document.getElementById('summaryMmm');

    const AUFMT = new Intl.NumberFormat('en-AU');

    let hasPreviousResults = false;
    let numberAnimationToken = 0;
    let layoutTransitionTimer = null;

    const NUMBER_ANIMATION_MS = 1000;
    const LAYOUT_TRANSITION_MS = 980;

    function round0(x) {
      if (x === null || x === undefined || isNaN(x)) return '–';
      return AUFMT.format(Math.round(Number(x)));
    }

    function fmtDollarsInt(x) {
      if (x === null || x === undefined || isNaN(x)) return '–';
      return '$' + AUFMT.format(Math.round(Number(x)));
    }

    function cleanErrorMessage(message) {
      return String(message || 'Request failed')
        .trim()
        .replace(/\.+$/, '');
    }

    function setInlineMessage(
      element,
      message = '',
      isError = false
    ) {
      element.textContent = message;

      element.classList.toggle(
        'is-error',
        isError && Boolean(message)
      );
    }

    function setFormMessage(
      message = '',
      isError = false
    ) {
      setInlineMessage(out, message, isError);
      scheduleApplyScale();
    }

    function setResultsMessage(
      message = '',
      isError = false
    ) {
      const resultsEl = document.getElementById('results');

      setInlineMessage(
        resultsStatus,
        message,
        isError
      );

      resultsEl.classList.toggle(
        'show-status',
        Boolean(message)
      );

      scheduleApplyScale();
    }

    function updateInputSummary() {
      const yearsValue =
        document.getElementById('years').value.trim();

      const mmmElement =
        document.getElementById('mmm');

      const mmmValue =
        mmmElement.value.trim();

      const mmmLabel =
        mmmElement.selectedOptions?.[0]
          ?.textContent
          ?.trim() || '';

      summaryYears.textContent =
        yearsValue === ''
          ? 'Experience'
          : `${yearsValue} yr${Number(yearsValue) === 1 ? '' : 's'} experience`;

      summaryMmm.textContent =
        mmmValue === ''
          ? 'MMM'
          : mmmLabel || `MM${mmmValue}`;

      inputSummaryButton.setAttribute(
        'aria-label',
        `Edit calculator inputs: ${summaryYears.textContent}, ${summaryMmm.textContent}`
      );
    }

    function setInputPanelCollapsed(collapsed) {
      const shouldCollapse =
        Boolean(
          collapsed &&
          hasPreviousResults
        );

      const isCurrentlyCollapsed =
        appElement.classList.contains(
          'is-input-collapsed'
        );

      if (shouldCollapse === isCurrentlyCollapsed) {
        return;
      }

      appElement.classList.add(
        'is-layout-transitioning'
      );

      appElement.classList.toggle(
        'is-input-collapsed',
        shouldCollapse
      );

      inputSummaryButton.setAttribute(
        'aria-expanded',
        String(!shouldCollapse)
      );

      window.clearTimeout(
        layoutTransitionTimer
      );

      layoutTransitionTimer =
        window.setTimeout(
          () => {
            appElement.classList.remove(
              'is-layout-transitioning'
            );
          },
          LAYOUT_TRANSITION_MS
        );

      scheduleApplyScale();
    }

    function clearFormErrorOnEdit() {
      if (out.classList.contains('is-error')) {
        setFormMessage();
      }

      if (resultsStatus.classList.contains('is-error')) {
        setResultsMessage();
      }
    }

    function callEstimatorBackend(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName =
          `locumEstimatorCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

        const script = document.createElement('script');

        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error('Request timed out.'));
        }, 30000);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = response => {
          cleanup();

          if (!response || !response.ok) {
            reject(
              new Error(
                response?.message ||
                'Unable to load model.'
              )
            );
            return;
          }

          resolve(response);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('Network error.'));
        };

        const query = new URLSearchParams({
          callback: callbackName,
          action,
          ...params
        });

        script.src =
          `${SCRIPT_URL}?${query.toString()}`;

        document.body.appendChild(script);
      });
    }

    function animateNumber(
      elementId,
      targetValue,
      formatter,
      animate,
      token
    ) {
      const element = document.getElementById(elementId);
      const target = Number(targetValue);

      if (!Number.isFinite(target)) {
        element.textContent = '–';
        delete element.dataset.numericValue;
        return;
      }

      const start =
        Number(element.dataset.numericValue);

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      const shouldAnimate =
        animate &&
        Number.isFinite(start) &&
        start !== target &&
        !reduceMotion;

      if (!shouldAnimate) {
        element.textContent = formatter(target);
        element.dataset.numericValue = String(target);
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        if (token !== numberAnimationToken) return;

        const progress = Math.min(
          (now - startedAt) / NUMBER_ANIMATION_MS,
          1
        );

        const eased =
          1 - Math.pow(1 - progress, 3);

        const current =
          start + (target - start) * eased;

        element.textContent = formatter(current);
        element.dataset.numericValue = String(current);

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          element.textContent = formatter(target);
          element.dataset.numericValue = String(target);
        }
      }

      requestAnimationFrame(frame);
    }

    function renderPercentileScale(
      res,
      animateNumbers = false
    ) {
      const [p05, p20, p50, p80, p95] =
        [
          res.p05,
          res.p20,
          res.p50,
          res.p80,
          res.p95
        ].map(Number);

      const P_MIN = 5;
      const P_MAX = 95;
      const P_SPAN = P_MAX - P_MIN;

      const posPct = p =>
        ((p - P_MIN) / P_SPAN) * 100;

      const token = ++numberAnimationToken;

      document.querySelector('.t5').style.left =
        posPct(5) + '%';

      document.querySelector('.t20').style.left =
        posPct(20) + '%';

      document.querySelector('.t50').style.left =
        posPct(50) + '%';

      document.querySelector('.t80').style.left =
        posPct(80) + '%';

      document.querySelector('.t95').style.left =
        posPct(95) + '%';

      animateNumber(
        'p05v',
        p05,
        round0,
        animateNumbers,
        token
      );

      animateNumber(
        'p20v',
        p20,
        round0,
        animateNumbers,
        token
      );

      animateNumber(
        'p50v',
        p50,
        fmtDollarsInt,
        animateNumbers,
        token
      );

      animateNumber(
        'p80v',
        p80,
        round0,
        animateNumbers,
        token
      );

      animateNumber(
        'p95v',
        p95,
        round0,
        animateNumbers,
        token
      );
    }

    async function loadModel() {
      const modelMeta =
        document.getElementById('modelMeta');

      try {
        await callEstimatorBackend('summary');

        modelMeta.textContent =
          'LIVE MLR (OLS) model loaded';

        modelMeta.classList.add(
          'is-live'
        );
      } catch (err) {
        modelMeta.classList.remove(
          'is-live'
        );

        modelMeta.innerHTML =
          '<span class="warn">Model error: ' +
          cleanErrorMessage(err?.message) +
          '</span>';
      }

      scheduleApplyScale();
    }

    async function estimate() {
      const years = parseFloat(
        document.getElementById('years').value
      );

      const mmm = parseInt(
        document.getElementById('mmm').value,
        10
      );

      const resultsEl =
        document.getElementById('results');

      const hadPreviousResults =
        hasPreviousResults;

      function showInputError(message) {
        if (hadPreviousResults) {
          setFormMessage();
          setResultsMessage(message, true);
        } else {
          setFormMessage(message, true);
        }
      }

      if (
        !Number.isFinite(years) ||
        years < 0 ||
        !Number.isFinite(mmm) ||
        mmm < 1 ||
        mmm > 7
      ) {
        showInputError(
          '⚠ Please complete all fields'
        );
        return;
      }

      if (!hadPreviousResults) {
        resultsEl.style.display = 'none';
        setFormMessage();
        estimateBtn.textContent = 'Calculating...';
      } else {
        setFormMessage();
        setResultsMessage();
        estimateBtn.textContent = 'Recalculating...';
      }

      estimateBtn.disabled = true;
      scheduleApplyScale();

      try {
        const res = await callEstimatorBackend(
          'predict',
          {
            years: String(years),
            mmm: String(mmm)
          }
        );

        setResultsMessage();
        setFormMessage();

        resultsEl.style.display = 'block';

        renderPercentileScale(
          res,
          hadPreviousResults
        );

        hasPreviousResults = true;

        updateInputSummary();

        appElement.classList.add(
          'has-results'
        );

        setInputPanelCollapsed(
          true
        );

        estimateBtn.disabled = false;
        estimateBtn.textContent = 'Recalculate';
      } catch (err) {
        const message =
          '⚠ ' + cleanErrorMessage(err?.message);

        if (hadPreviousResults) {
          setFormMessage();
          setResultsMessage(message, true);
        } else {
          setFormMessage(message, true);
        }

        estimateBtn.disabled = false;
        estimateBtn.textContent = hadPreviousResults
          ? 'Recalculate'
          : 'Calculate';
      }
    }

    document
      .querySelector('.calculator-form')
      .addEventListener(
        'input',
        clearFormErrorOnEdit
      );

    document
      .querySelector('.calculator-form')
      .addEventListener(
        'change',
        clearFormErrorOnEdit
      );

    inputSummaryButton.addEventListener(
      'click',
      () => {
        setInputPanelCollapsed(false);
      }
    );

    [
      'years',
      'mmm'
    ].forEach(elementId => {
      const element =
        document.getElementById(elementId);

      element.addEventListener(
        'input',
        updateInputSummary
      );

      element.addEventListener(
        'change',
        updateInputSummary
      );
    });

    estimateBtn.addEventListener(
      'click',
      estimate
    );

    updateInputSummary();
    loadModel();
  </script>
</body>
</html>
