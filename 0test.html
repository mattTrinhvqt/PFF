<!DOCTYPE html>

  <style>
    /*
     * Base chart layout, loader, tabs, data-source indicator and
     * chart-shell styling come from PFF Core. Only this graph's
     * re-aggregate control and heading spacing stay local.
     */

    .chart-heading-row {
      display: block;
      position: relative;
      width: 100%;
      height: 30px;
      min-height: 30px;
      margin: 0;
    }

    .chart-heading {
      display: block;
      width: auto;
      min-width: 0;
      margin: 0;
      padding: 4px 112px 0 0;
      overflow: visible;
      font-size: 15px;
      line-height: 22px;
      white-space: nowrap;
      opacity: 1;
      will-change: opacity;
    }

    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;
      display: inline-flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      color: var(--pff-muted);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease,
        visibility 0s linear;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--pff-ink);
      border-color: var(--pff-ink);
      box-shadow:
        inset 0 0 0 1px
        rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: none;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--pff-purple);
      font-size: 15px;
      line-height: 1;
    }

    @media (max-width: 430px) {
      .chart-heading {
        padding-top: 4px;
        padding-right: 105px;
        font-size: 14px;
        line-height: 21px;
      }

      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 97px;
        font-size: 13px;
      }

      .reaggregate-button {
        font-size: 9px;
      }
    }
  </style>
</head>

    let tabsController =

    /************************************************************
     * EMPLOYER NAMES AND COLOURS
     ************************************************************/

    const EMPLOYERS =
      PFF.employers;


    function normaliseEmployerName(
      value
    ) {
      return String(
        value || ''
      )
        .toLowerCase()
        .normalize('NFKD')
        .replace(
          /[’‘]/g,
          "'"
        )
        .replace(
          /&/g,
          ' and '
        )
        .replace(
          /[^a-z0-9]+/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }


    const EMPLOYER_ALIAS_MAP =
      new Map();


    EMPLOYERS.forEach(
      employer => {
        [
          employer.label,
          employer.fullName,
          ...employer.aliases
        ].forEach(
          alias => {
            EMPLOYER_ALIAS_MAP.set(
              normaliseEmployerName(
                alias
              ),
              employer
            );
          }
        );
      }
    );


    function getEmployerAppearance(
      employerName
    ) {
      const original =
        String(
          employerName || ''
        ).trim();

      const normalised =
        normaliseEmployerName(
          original
        );

      const knownEmployer =
        EMPLOYER_ALIAS_MAP.get(
          normalised
        );

      if (
        knownEmployer
      ) {
        return knownEmployer;
      }

      const fallbackKey =
        normalised ||
        `unknown-${original}`;

      if (
        original.length <=
        10
      ) {
        return {
          key:
            fallbackKey,

          label:
            original || '—',

          fullName:
            original ||
            'Unknown employer',

          colour:
            '#777777'
        };
      }

      const initials =
        original
          .split(/\s+/)
          .filter(Boolean)
          .map(
            word =>
              word.charAt(0)
          )
          .join('')
          .slice(0, 6);

      return {
        key:
          fallbackKey,

        label:
          initials ||
          original.slice(
            0,
            10
          ),

        fullName:
          original,

        colour:
          '#777777'
      };
    }


    /************************************************************
     * BASIC HELPERS
     ************************************************************/

    function hideLoadingState() {
      PFF.hideLoadingState(
        app
      );

      loadingState
        ?.setAttribute(
          'aria-hidden',
          'true'
        );

      responsiveController
        ?.refresh();
    }


    function setStatus(
      message = ''
    ) {
      PFF.setStatus(
        message,
        statusElement
      );
    }


    function setLoadedSourceIndicator(
      loaded
    ) {
      const source =
        loaded?.source;

      const remote =
        Boolean(
          loaded?.remote
        );

      if (
        source ===
        'live'
      ) {
        PFF.setDataSourceIndicator(
          'live',
          {
            indicator:
              dataSourceIndicator,

            text:
              dataSourceText
          }
        );

        return;
      }

      if (
        source ===
        'cached'
      ) {
        PFF.setDataSourceIndicator(
          'cached',
          {
            indicator:
              dataSourceIndicator,

            text:
              dataSourceText
          }
        );

        if (dataSourceText) {
          dataSourceText.textContent =
            remote
              ? 'BACKEND cache'
              : 'BROWSER cache';
        }

        dataSourceIndicator
          ?.setAttribute(
            'aria-label',
            remote
              ? 'Backend cached data'
              : 'Browser cached data'
          );

        return;
      }

      PFF.setDataSourceIndicator(
        'unavailable',
        {
          indicator:
            dataSourceIndicator,

          text:
            dataSourceText
        }
      );
    }


    function getBaseBubbleRadius(
      respondents
    ) {
      const calculated =
        BUBBLE_OFFSET +
        (
          Math.pow(
            respondents,
            BUBBLE_EXPONENT
          ) *
          BUBBLE_MULTIPLIER
        );

      return clamp(
        calculated,
        MIN_RADIUS,
        MAX_RADIUS
      );
    }


    function getDisplayedBubbleRadius(
      chart,
      raw
    ) {
      const baseRadius =
        Number(
          raw?.baseRadius
        );

      if (
        !Number.isFinite(
          baseRadius
        ) ||
        baseRadius <= 0
      ) {
        return 0;
      }

      const chartWidth =
        Number(
          chart?.width
        );

      const chartHeight =
        Number(
          chart?.height
        );

      const safeChartWidth =
        Number.isFinite(
          chartWidth
        ) &&
        chartWidth > 0
          ? chartWidth
          : 520;

      const safeChartHeight =
        Number.isFinite(
          chartHeight
        ) &&
        chartHeight > 0
          ? chartHeight
          : 585;

      const widthScale =
        clamp(
          safeChartWidth / 520,
          0.72,
          1
        );

      const heightScale =
        clamp(
          safeChartHeight / 585,
          0.58,
          1
        );

      const responsiveScale =
        Math.min(
          widthScale,
          heightScale
        );

      return (
        baseRadius *
        responsiveScale
      );
    }

    /************************************************************
     * LIVE → BACKEND → BROWSER FALLBACK
     ************************************************************/

    function normaliseSourceRows(
      sourceRows
    ) {
      return (
        Array.isArray(
          sourceRows
        )
          ? sourceRows
          : []
      )
        .map(
          row => [
            row?.[0] ??
              '',

            cleanText(
              row?.[1]
            ),

            row?.[2] ??
              '',

            row?.[3] ??
              ''
          ]
        )
        .filter(
          row => {
            const employer =
              cleanText(
                row?.[1]
              );

            const score =
              toNumber(
                row?.[2]
              );

            return (
              Boolean(
                employer
              ) &&
              Number.isFinite(
                score
              ) &&
              score >= 0 &&
              score <= 10
            );
          }
        );
    }


    function liveRowsForBrowserCache(
      table
    ) {
      const sourceRows =
        (
          table?.rows ||
          []
        )
          .map(
            rawRow => {
              const cells =
                rawRow?.c ||
                [];

              return [
                getCellValue(
                  cells[0]
                ),

                getCellValue(
                  cells[1]
                ),

                getCellValue(
                  cells[2]
                ),

                getCellValue(
                  cells[3]
                )
              ];
            }
          );

      return normaliseSourceRows(
        sourceRows
      );
    }


    function remoteRowsForBrowserCache(
      payload
    ) {
      if (
        !payload?.cachedAt ||
        Number.isNaN(
          Date.parse(
            payload.cachedAt
          )
        )
      ) {
        throw new Error(
          'The backend cache has no valid timestamp'
        );
      }

      return normaliseSourceRows(
        payload?.data?.rows
      );
    }


    async function loadRawEmployerDataWithFallback_() {
      let liveError =
        null;

      let remoteError =
        null;

      const loaded =
        await PFFCharts
          .loadLiveCacheFallback({
            forceCached:
              FORCE_CACHED_DATA,

            cacheKey:
              LOCAL_CACHE_KEY,

            minRows:
              MINIMUM_ROWS,

            loadLive:
              () =>
                PFFCharts
                  .loadGVizSheet({
                    sheetId:
                      SHEET_ID,

                    sheetName:
                      SHEET_NAME,

                    range:
                      SHEET_RANGE,

                    headers:
                      '1',

                    query:
                      RAW_QUERY,

                    timeoutMs:
                      LIVE_FETCH_TIMEOUT_MS
                  }),

            parseLive:
              liveRowsForBrowserCache,

            loadRemoteCache:
              () =>
                PFFCharts
                  .loadAppsScriptCache({
                    url:
                      CACHE_WEB_APP_URL,

                    appKey:
                      CACHE_APP_KEY,

                    timeoutMs:
                      CACHE_FETCH_TIMEOUT_MS
                  }),

            parseRemoteCache:
              remoteRowsForBrowserCache,

            onLiveError(
              error
            ) {
              liveError =
                error;

              console.warn(
                'Live Google Sheets data could not be used',
                error
              );
            },

            onRemoteCacheError(
              error
            ) {
              remoteError =
                error;

              console.warn(
                'Workplace Promoter backend cache could not be used',
                error
              );
            }
          })
          .catch(
            error => {
              PFF.setDataSourceIndicator(
                'unavailable',
                {
                  indicator:
                    dataSourceIndicator,

                  text:
                    dataSourceText
                }
              );

              console.error(
                'All Workplace Promoter data sources failed',
                {
                  liveError,
                  remoteError,
                  finalError:
                    error
                }
              );

              throw new Error(
                'Live, backend and browser cached data are currently unavailable'
              );
            }
          );

      setLoadedSourceIndicator(
        loaded
      );

      const employerData =
        normaliseRawRows(
          loaded.rows
        );

      if (!employerData.size) {
        throw new Error(
          'No valid raw survey rows found in columns A to D'
        );
      }

      if (
        loaded.source ===
          'cached' &&
        !loaded.remote &&
        liveError &&
        remoteError
      ) {
        console.warn(
          'Using browser cache after both live and backend cache failed.'
        );
      }

      return employerData;
    }


    /************************************************************
     * NORMALISE RAW SURVEY DATA
     ************************************************************/

    function normaliseFactorText(
      value
    ) {
      return String(
        value || ''
      )
        .toLowerCase()
        .normalize(
          'NFKD'
        )
        .replace(
          /[’‘]/g,
          "'"
        )
        .replace(
          /&/g,
          ' and '
        )
        .replace(
          /[^a-z0-9]+/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }


    function getFactorKey(
      value
    ) {
      const text =
        normaliseFactorText(
          value
        );


      if (
        !text ||
        text === 'none' ||
        text === 'nil' ||
        text === 'no factors' ||
        text === 'no factor' ||
        text === 'nothing'
      ) {
        return null;
      }


      if (
        text.includes(
          'pay'
        ) ||
        text.includes(
          'bonus'
        ) ||
        text.includes(
          'remuneration'
        )
      ) {
        return 'pay';
      }


      if (
        text.includes(
          'work life'
        ) ||
        text.includes(
          'worklife'
        ) ||
        text.includes(
          'flexib'
        )
      ) {
        return 'worklife';
      }


      if (
        text.includes(
          'autonomy'
        ) ||
        text.includes(
          'professional growth'
        ) ||
        text.includes(
          'professional development'
        )
      ) {
        return 'autonomy';
      }


      if (
        text.includes(
          'support'
        ) ||
        (
          text.includes(
            'team'
          ) &&
          text.includes(
            'management'
          )
        )
      ) {
        return 'support';
      }


      if (
        text.includes(
          'staffing'
        ) ||
        text.includes(
          'workload'
        )
      ) {
        return 'workload';
      }


      if (
        text.includes(
          'equipment'
        ) ||
        text.includes(
          'technology'
        ) ||
        text === 'tech'
      ) {
        return 'tech';
      }


      return null;
    }


    function getEndorsedFactorKeys(
      value
    ) {
      const factorKeys =
        new Set();

      const rawText =
        String(
          value || ''
        ).trim();


      if (
        !rawText
      ) {
        return factorKeys;
      }


      rawText
        .split(
          /[;,|\n]+/
        )
        .forEach(
          factor => {
            const factorKey =
              getFactorKey(
                factor
              );


            if (
              factorKey
            ) {
              factorKeys.add(
                factorKey
              );
            }
          }
        );


      /*
       * If a future response uses an unexpected separator, scan
       * the complete answer as a fallback. A Set ensures that one
       * response can endorse each factor only once.
       */
      if (
        !factorKeys.size
      ) {
        const wholeAnswerKey =
          getFactorKey(
            rawText
          );


        if (
          wholeAnswerKey
        ) {
          factorKeys.add(
            wholeAnswerKey
          );
        }
      }


      return factorKeys;
    }


    function normaliseRawRows(
      rows
    ) {
      const employerMap =
        new Map();


      rows.forEach(
        row => {
          const timestamp =
            row?.[0] ??
            '';

          const employerName =
            cleanText(
              row?.[1]
            );

          const score =
            toNumber(
              row?.[2]
            );

          const boostingFactors =
            row?.[3] ??
            '';


          if (
            !employerName ||
            !Number.isFinite(
              score
            ) ||
            score < 0 ||
            score > 10
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          if (
            !employerMap.has(
              appearance.key
            )
          ) {
            employerMap.set(
              appearance.key,
              {
                canonicalKey:
                  appearance.key,

                sourceName:
                  employerName,

                label:
                  appearance.label,

                fullName:
                  appearance.fullName,

                colour:
                  appearance.colour,

                scores:
                  [],

                timestamps:
                  [],

                factorCounts: {
                  pay:
                    0,

                  worklife:
                    0,

                  autonomy:
                    0,

                  support:
                    0,

                  workload:
                    0,

                  tech:
                    0
                }
              }
            );
          }


          const employer =
            employerMap.get(
              appearance.key
            );


          employer.scores.push(
            score
          );

          employer.timestamps.push(
            timestamp
          );


          getEndorsedFactorKeys(
            boostingFactors
          ).forEach(
            factorKey => {
              employer.factorCounts[
                factorKey
              ] +=
                1;
            }
          );
        }
      );


      employerMap.forEach(
        employer => {
          employer.statistics =
            calculateScoreStatistics(
              employer.scores
            );
        }
      );


      return employerMap;
    }


    function buildAggregateItemsFromRawData(
      employerMap
    ) {
      return [
        ...employerMap.values()
      ]
        .map(
          employer => ({
            canonicalKey:
              employer.canonicalKey,

            sourceName:
              employer.sourceName,

            score:
              employer.statistics
                ?.median,

            respondents:
              employer.statistics
                ?.count,

            label:
              employer.label,

            fullName:
              employer.fullName,

            colour:
              employer.colour
          })
        )
        .filter(
          item =>
            Number.isFinite(
              item.score
            ) &&
            item.score >= 0 &&
            item.score <= 10 &&
            Number.isFinite(
              item.respondents
            ) &&
            item.respondents > 0
        );
    }


    function buildEndorsementItemsFromRawData(
      employerMap,
      factorKey
    ) {
      return [
        ...employerMap.values()
      ]
        .map(
          employer => {
            const respondents =
              employer.statistics
                ?.count ??
              0;

            const endorsements =
              employer.factorCounts
                ?.[factorKey] ??
              0;

            const percentage =
              respondents > 0
                ? (
                    endorsements /
                    respondents
                  ) *
                  100
                : NaN;


            return {
              canonicalKey:
                employer.canonicalKey,

              sourceName:
                employer.sourceName,

              score:
                percentage,

              respondents,

              label:
                employer.label,

              fullName:
                employer.fullName,

              colour:
                employer.colour
            };
          }
        )
        .filter(
          item =>
            Number.isFinite(
              item.score
            ) &&
            item.score >= 0 &&
            item.score <= 100 &&
            Number.isFinite(
              item.respondents
            ) &&
            item.respondents > 0
        );
    }


    /************************************************************
     * FIXED AGGREGATE POSITIONS
     ************************************************************/

    function buildAggregatePositions(
      items
    ) {
      const groups =
        new Map();


      items.forEach(
        item => {
          const scoreKey =
            String(
              Number(
                item.score
              )
            );

          if (
            !groups.has(
              scoreKey
            )
          ) {
            groups.set(
              scoreKey,
              []
            );
          }

          groups
            .get(
              scoreKey
            )
            .push(
              item
            );
        }
      );


      const maximumGroupSize =
        Math.max(
          1,
          ...[
            ...groups.values()
          ].map(
            group =>
              group.length
          )
        );


      /*
       * Extra internal padding prevents large circles from
       * excessively crossing the y-axis or right chart boundary.
       */
      const leftPosition =
        20;

      const rightPosition =
        82;


      const sharedPositions =
        maximumGroupSize ===
          1
          ? [
              leftPosition
            ]
          : Array.from(
              {
                length:
                  maximumGroupSize
              },
              (
                _,
                index
              ) =>
                leftPosition +
                (
                  index /
                  (
                    maximumGroupSize -
                    1
                  )
                ) *
                (
                  rightPosition -
                  leftPosition
                )
            );


      const positions =
        new Map();


      groups.forEach(
        group => {
          group
            .slice()
            .sort(
              (
                first,
                second
              ) =>
                second.respondents -
                  first.respondents ||
                first.fullName.localeCompare(
                  second.fullName
                )
            )
            .forEach(
              (
                item,
                index
              ) => {
                positions.set(
                  item.canonicalKey,
                  sharedPositions[
                    index
                  ]
                );
              }
            );
        }
      );


      return positions;
    }

    /*
     * Assign nearby endorsement values to separate horizontal
     * lanes. Values separated by 5 percentage points or less
     * cannot occupy the same lane.
     */
    function buildProximityPositions(
      items,
      proximityThreshold =
        5
    ) {
      const sortedItems =
        items
          .slice()
          .sort(
            (
              first,
              second
            ) =>
              first.score -
                second.score ||
              second.respondents -
                first.respondents ||
              first.fullName.localeCompare(
                second.fullName
              )
          );

      /*
       * Each entry stores the most recent percentage occupying
       * that horizontal lane.
       */
      const laneLastScores =
        [];

      const laneAssignments =
        new Map();


      sortedItems.forEach(
        item => {
          let laneIndex =
            laneLastScores.findIndex(
              previousScore =>
                (
                  item.score -
                  previousScore
                ) >
                proximityThreshold
            );


          /*
           * Every existing lane contains another value within
           * five percentage points, so create a lane to the right.
           */
          if (
            laneIndex ===
            -1
          ) {
            laneIndex =
              laneLastScores.length;

            laneLastScores.push(
              item.score
            );
          } else {
            laneLastScores[
              laneIndex
            ] =
              item.score;
          }


          laneAssignments.set(
            item.canonicalKey,
            laneIndex
          );
        }
      );


      const laneCount =
        Math.max(
          1,
          laneLastScores.length
        );

      /*
       * Retain at least five possible positions so a second
       * nearby value moves only one position to the right rather
       * than jumping across the whole chart.
       */
      const positionCount =
        Math.max(
          5,
          laneCount
        );

      const leftPosition =
        20;

      const rightPosition =
        82;

      const sharedPositions =
        Array.from(
          {
            length:
              positionCount
          },
          (
            _,
            index
          ) =>
            leftPosition +
            (
              index /
              (
                positionCount -
                1
              )
            ) *
            (
              rightPosition -
              leftPosition
            )
        );

      const positions =
        new Map();


      laneAssignments.forEach(
        (
          laneIndex,
          employerKey
        ) => {
          positions.set(
            employerKey,
            sharedPositions[
              laneIndex
            ]
          );
        }
      );


      return positions;
    }
    
    function buildAggregatePoints(
      items
    ) {
      return items
        .map(
          item => {
            const metrics =
              {};


            VIEW_KEYS.forEach(
              viewKey => {
                if (
                  viewKey ===
                  'overall'
                ) {
                  metrics[
                    viewKey
                  ] = {
                    value:
                      item.score,

                    respondents:
                      item.respondents
                  };

                  return;
                }


                const viewItem =
                  viewEmployerData
                    .get(
                      viewKey
                    )
                    ?.get(
                      item.canonicalKey
                    );


                /*
                 * Preserve the existing fallback behaviour when a
                 * percentage row is unexpectedly missing.
                 */
                metrics[
                  viewKey
                ] = {
                  value:
                    clamp(
                      viewItem
                        ?.score ??
                      item.score *
                        10,
                      0,
                      100
                    ),

                  respondents:
                    viewItem
                      ?.respondents ??
                    item.respondents
                };
              }
            );


            return {
              kind:
                'aggregate',

              x:
                aggregatePositions.get(
                  item.canonicalKey
                ) ??
                20,

              y:
                0,

              targetY:
                item.score *
                10,

              metrics,

              currentMetricValue:
                item.score,

              currentRespondents:
                item.respondents,

              baseRadius:
                getBaseBubbleRadius(
                  item.respondents
                ),

              canonicalKey:
                item.canonicalKey,

              shortLabel:
                item.label,

              fullName:
                item.fullName,

              respondents:
                item.respondents,

              colour:
                item.colour,

              canSplit:
                Boolean(
                  rawEmployerData
                    .get(
                      item.canonicalKey
                    )
                    ?.scores
                    ?.length
                )
            };
          }
        )
        .sort(
          (
            first,
            second
          ) => {
            if (
              first.targetY !==
              second.targetY
            ) {
              return (
                second.targetY -
                first.targetY
              );
            }

            return (
              second.baseRadius -
              first.baseRadius
            );
          }
        );
    }
    function getAggregatePoint(
      employerKey
    ) {
      return aggregatePoints.find(
        point =>
          point.canonicalKey ===
          employerKey
      );
    }


    /************************************************************
     * RAW SCORE POINTS
     ************************************************************/

    function createRawEmployerPoints(
      aggregateItem,
      rawEmployer
    ) {
      const aggregateX =
        aggregatePositions.get(
          aggregateItem.canonicalKey
        ) ??
        20;

      const aggregateY =
        aggregateItem.score *
        10;

      const scoreGroups =
        new Map();


      rawEmployer.scores.forEach(
        score => {
          const scoreKey =
            String(
              score
            );

          if (
            !scoreGroups.has(
              scoreKey
            )
          ) {
            scoreGroups.set(
              scoreKey,
              []
            );
          }

          scoreGroups
            .get(
              scoreKey
            )
            .push(
              score
            );
        }
      );


      const points =
        [];


      scoreGroups.forEach(
        (
          scores,
          scoreKey
        ) => {
          const score =
            Number(
              scoreKey
            );

          const pointCount =
            scores.length;

          /*
           * Limit the horizontal spread equally on both sides of
           * the original aggregate position. This keeps every row
           * centred on the aggregate bubble's vertical axis.
           */
          const maximumHalfSpan =
            Math.max(
              0,
              Math.min(
                aggregateX -
                  14,
                88 -
                  aggregateX
              )
            );

          const span =
            Math.min(
              21,
              Math.max(
                0,
                (
                  pointCount -
                  1
                ) *
                2.35
              ),
              maximumHalfSpan *
                2
            );

          const startX =
            aggregateX -
            span /
              2;


          scores.forEach(
            (
              _,
              index
            ) => {
              const targetX =
                pointCount ===
                  1
                  ? aggregateX
                  : startX +
                    (
                      index /
                      (
                        pointCount -
                        1
                      )
                    ) *
                    span;


              points.push({
                kind:
                  'raw',

                x:
                  aggregateX,

                y:
                  aggregateY,

                targetX:
                  targetX,
                targetY:
                  score *
                  10,

                baseRadius:
                  RAW_POINT_RADIUS,

                canonicalKey:
                  aggregateItem.canonicalKey,

                fullName:
                  aggregateItem.fullName,

                colour:
                  aggregateItem.colour,

                rawScore:
                  score,

                scoreCount:
                  rawEmployer.statistics.count,

                median:
                  rawEmployer.statistics.median,

                q1:
                  rawEmployer.statistics.q1,

                q3:
                  rawEmployer.statistics.q3
              });
            }
          );
        }
      );


      return points;
    }


    /************************************************************
     * AGGREGATE VISIBILITY
     ************************************************************/

    function getAggregateVisibility(
      employerKey
    ) {
      if (
        splitProgress.has(
          employerKey
        )
      ) {
        return (
          1 -
          splitProgress.get(
            employerKey
          )
        );
      }

      if (
        mergingEmployers.has(
          employerKey
        )
      ) {
        return mergeProgress;
      }

      if (
        splitEmployers.has(
          employerKey
        )
      ) {
        return 0;
      }

      return 1;
    }


    function getAggregateRadius(
      chart,
      raw
    ) {
      if (
        !raw
      ) {
        return 0;
      }

      const visibility =
        getAggregateVisibility(
          raw.canonicalKey
        );

      if (
        visibility <=
        0.001
      ) {
        return 0;
      }

      return getDisplayedBubbleRadius(
        chart,
        raw
      );
    }
