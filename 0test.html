<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./assets/pff_chart_core.js"></script>

  <style>
    html,
    body {
      width: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      color: var(--pff-ink);
    }

    #fit {
      display: block;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      display: block;
      width: 100%;
      max-width: 520px;
      min-height: 0;
      margin: 0 auto;
      padding: 14px 2px;
      background: transparent;
      text-align: center;
    }

    .response-summary {
      position: relative;
      width: 100%;
      padding: 0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      align-items: start;
    }

    .summary-item {
      min-width: 0;
      padding: 0 10px;
    }

    .summary-item:first-child .response-label,
    .summary-item:first-child .response-value {
      transform: translateX(8px);
    }

    .summary-item:last-child .response-label,
    .summary-item:last-child .response-value {
      transform: translateX(-8px);
    }

    .summary-item:first-child {
      border-right: 1px solid rgba(105, 113, 138, 0.16);
    }

    .response-label {
      color: var(--pff-muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 31px;
      margin-top: 2px;
      align-items: center;
      justify-content: center;
    }

    .response-value {
      margin-top: 2px;
      color: var(--pff-ink);
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 400;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .response-value.is-loading {
      display: inline-flex;
      min-width: 64px;
      min-height: 31px;
      align-items: center;
      justify-content: center;
    }

    .response-value.is-error {
      color: var(--pff-muted);
      font-size: 14px;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      margin: 0;
      visibility: hidden;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .live-data.is-visible {
      visibility: visible;
      opacity: 1;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: 5px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--pff-purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 1px;
      }

      .summary-item {
        padding: 0 6px;
      }

      .response-label {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app">
      <section
        class="response-summary"
        aria-live="polite"
      >
        <div class="summary-grid">
          <div class="summary-item">
            <div class="response-label">
              Reports
            </div>

            <div class="response-value-row">
              <div
                id="reportsValue"
                class="response-value is-loading"
                role="status"
                aria-label="Loading report count"
              >
                <span
                  class="pff-value-loader"
                  aria-hidden="true"
                >
                  <span class="cone blue"></span>
                  <span class="cone green"></span>
                  <span class="cone red"></span>
                </span>
              </div>
            </div>
          </div>

          <div class="summary-item">
            <div class="response-label">
              Supporting documents
            </div>

            <div class="response-value-row">
              <div
                id="documentsValue"
                class="response-value is-loading"
                role="status"
                aria-label="Loading supporting document count"
              >
                <span
                  class="pff-value-loader"
                  aria-hidden="true"
                >
                  <span class="cone blue"></span>
                  <span class="cone green"></span>
                  <span class="cone red"></span>
                </span>
              </div>

              <div
                id="dataSourceIndicator"
                class="live-data"
                aria-label="Live data"
              >
                <span
                  class="live-data-dot"
                  aria-hidden="true"
                ></span>

                <span id="dataSourceText">
                  LIVE data
                </span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
  (() => {
    'use strict';

    const CONFIG = Object.freeze({
      spreadsheetId:
        '1hMjeY-Cg3ZJWYWrfx0Brxb1QvhDYpiDq6OR4F4g8zCE',

      sheetGid:
        '0',

      liveRange:
        'B1:C1',

      cacheWebAppUrl:
        'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec',

      cacheAppKey:
        'pff-report-summary',

      browserCacheKey:
        'pff-report-summary:counts:v1',

      fetchTimeoutMs:
        10000,

      minRows:
        1,

      refreshMs:
        60000,

      forceCached:
        false
    });

    const reportsValue =
      document.getElementById(
        'reportsValue'
      );

    const documentsValue =
      document.getElementById(
        'documentsValue'
      );

    const dataSourceIndicator =
      document.getElementById(
        'dataSourceIndicator'
      );

    const dataSourceText =
      document.getElementById(
        'dataSourceText'
      );


    function makeCountRows(
      reportsValue,
      documentsValue
    ) {
      const reports =
        PFF.toNumber(
          reportsValue
        );

      const documents =
        PFF.toNumber(
          documentsValue
        );

      if (
        !Number.isFinite(
          reports
        ) ||
        reports < 0 ||
        !Number.isFinite(
          documents
        ) ||
        documents < 0
      ) {
        throw new Error(
          'Report summary counts are unavailable'
        );
      }

      return [[
        Math.round(
          reports
        ),

        Math.round(
          documents
        )
      ]];
    }


    function parseLiveRows(
      table
    ) {
      const row =
        table?.rows?.[0];

      const cells =
        row?.c ||
        [];

      return makeCountRows(
        PFF.cellValue(
          cells[0]
        ),

        PFF.cellValue(
          cells[1]
        )
      );
    }


    function parseRemoteRows(
      response
    ) {
      if (
        !response?.cachedAt ||
        Number.isNaN(
          Date.parse(
            response.cachedAt
          )
        )
      ) {
        throw new Error(
          'The cached report summary has no valid timestamp'
        );
      }

      return makeCountRows(
        response?.data?.reports,
        response?.data?.documents
      );
    }


    function normaliseCounts(
      rows
    ) {
      const row =
        Array.isArray(
          rows?.[0]
        )
          ? rows[0]
          : [];

      return {
        reports:
          row[0],

        documents:
          row[1]
      };
    }


    function showValue(
      element,
      value,
      isError =
        false
    ) {
      element.classList.remove(
        'is-loading'
      );

      element.classList.toggle(
        'is-error',
        isError
      );

      element.textContent =
        Number.isFinite(
          value
        )
          ? PFF.formatInteger(
              value
            )
          : '—';
    }


    function setDataSource(
      source
    ) {
      PFF.setDataSourceIndicator(
        source,
        {
          indicator:
            dataSourceIndicator,

          text:
            dataSourceText
        }
      );

      dataSourceIndicator.classList.add(
        'is-visible'
      );
    }


    async function loadDashboardData() {
      try {
        const loaded =
          await PFF.loadLiveCacheFallback({
            loadLive:
              () =>
                PFF.loadGVizSheet({
                  sheetId:
                    CONFIG.spreadsheetId,

                  gid:
                    CONFIG.sheetGid,

                  range:
                    CONFIG.liveRange,

                  headers:
                    0,

                  timeoutMs:
                    CONFIG.fetchTimeoutMs
                }),

            parseLive:
              parseLiveRows,

            loadRemoteCache:
              () =>
                PFF.loadAppsScriptCache({
                  url:
                    CONFIG.cacheWebAppUrl,

                  appKey:
                    CONFIG.cacheAppKey,

                  timeoutMs:
                    CONFIG.fetchTimeoutMs
                }),

            parseRemoteCache:
              parseRemoteRows,

            cacheKey:
              CONFIG.browserCacheKey,

            minRows:
              CONFIG.minRows,

            forceCached:
              CONFIG.forceCached,

            onSource:
              setDataSource,

            onLiveError:
              error =>
                console.warn(
                  'Live report summary could not be used',
                  error
                ),

            onRemoteCacheError:
              error =>
                console.warn(
                  'Cached report summary could not be used',
                  error
                )
          });

        const counts =
          normaliseCounts(
            loaded.rows
          );

        showValue(
          reportsValue,
          counts.reports
        );

        showValue(
          documentsValue,
          counts.documents
        );
      } catch (
        error
      ) {
        console.error(
          error
        );

        showValue(
          reportsValue,
          NaN,
          true
        );

        showValue(
          documentsValue,
          NaN,
          true
        );

        setDataSource(
          'unavailable'
        );
      }
    }


    loadDashboardData();

    window.setInterval(
      loadDashboardData,
      CONFIG.refreshMs
    );
  })();
  </script>
</body>
</html>
