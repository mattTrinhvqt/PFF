<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Permanent Salary Summary</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --trend-yellow: #f1c232;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    #fit {
      width: 100%;
      overflow: hidden;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 14px 2px 14px;
      text-align: center;
    }

    #app.is-loading .response-summary,
    #app.is-loading .salary-section {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      filter: none;
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }

    /* ---------- Response count ---------- */

    .response-summary {
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: 5px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 31px;
      margin-top: 2px;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    /* ---------- Compact salary trend ---------- */

    .salary-trend {
      width: calc(100% - 12px);
      margin: 10px auto 3px;
      padding: 0 2px;
    }

    .salary-trend-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 14px;
      margin: 0 1px 2px;
    }

    .salary-trend-title {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-align: left;
      white-space: nowrap;
    }

    .salary-trend-legend {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      color: var(--muted);
      font-size: 8px;
      line-height: 1;
      white-space: nowrap;
    }

    .salary-trend-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .salary-trend-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(102, 0, 255, 0.42);
    }

    .salary-trend-line {
      width: 15px;
      height: 2px;
      border-radius: 999px;
      background: var(--trend-yellow);
    }

    .salary-trend-canvas-wrap {
      position: relative;
      width: 100%;
      height: 64px;
      overflow: hidden;
      border-top: 1px solid rgba(105, 113, 138, 0.10);
      border-bottom: 1px solid rgba(105, 113, 138, 0.10);
    }

    #salary-trend-canvas {
      display: block;
      width: 100%;
      height: 64px;
    }

    .salary-trend-status {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.88);
      font-size: 9px;
      line-height: 1.25;
      text-align: center;
    }

    .salary-trend-status.is-visible {
      display: flex;
    }

    .salary-trend-dates {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 2px 1px 0;
      color: var(--muted);
      font-size: 8px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Salary table ---------- */

    .salary-section {
      width: 100%;
      margin-top: 6px;
    }

    .percentile-help {
      display: none;
      width: calc(100% - 14px);
      min-height: 22px;
      margin: 3px auto 5px;
      padding: 4px 7px;
      color: var(--muted);
      background: rgba(102, 0, 255, 0.035);
      border: 1px solid rgba(102, 0, 255, 0.12);
      border-radius: 4px;
      font-size: 9px;
      line-height: 1.3;
      text-align: center;
    }

    .percentile-help.is-visible {
      display: block;
    }

    .salary-table-wrap {
      position: relative;
      width: 100%;
    }

    .salary-table-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 24%;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .salary-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .salary-table th,
    .salary-table td {
      position: relative;
      padding: 8px 6px;
      line-height: 1.2;
      text-align: center;
      vertical-align: middle;
    }

    .salary-table th {
      color: var(--muted);
      font-size: clamp(10px, 3.1vw, 14px);
      font-weight: 700;
      white-space: nowrap;
    }

    .salary-table td {
      color: var(--ink);
      font-size: clamp(12px, 3.6vw, 15px);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .salary-table th + th,
    .salary-table td + td {
      border-left: 1px solid var(--track);
    }

    .salary-table th:nth-child(2),
    .salary-table td:nth-child(2) {
      border-left: 0;
    }

    .salary-table .table-major-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--ink);
    }

    .salary-table .table-empty-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--track);
    }

    .salary-table sup {
      font-size: 0.7em;
      line-height: 0;
      vertical-align: super;
    }

    .salary-table th:first-child,
    .salary-table td:first-child {
      width: 24%;
    }

    .salary-table td:first-child {
      font-weight: 700;
      white-space: nowrap;
    }

    .percentile-header-button {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      max-width: 100%;
      margin: 0;
      padding: 1px 1px;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: 3px;
      font: inherit;
      font-weight: inherit;
      line-height: inherit;
      white-space: nowrap;
      cursor: help;
    }

    .percentile-header-button:hover,
    .percentile-header-button:focus-visible,
    .percentile-header-button.is-open {
      color: var(--purple);
      background: rgba(102, 0, 255, 0.06);
    }

    .percentile-header-button:focus-visible {
      outline: 1px solid rgba(102, 0, 255, 0.35);
      outline-offset: 1px;
    }

    .cell-value {
      display: block;
      white-space: nowrap;
    }


    .salary-footnote {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: left;
    }

    .error {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 1px 12px;
      }

      .salary-table th,
      .salary-table td {
        padding: 7px 2px;
      }

      .salary-table th {
        font-size: clamp(8px, 2.8vw, 11px);
      }

      .salary-table td {
        font-size: clamp(10px, 3.1vw, 12px);
      }

      .salary-table th:first-child,
      .salary-table td:first-child {
        width: 24%;
      }

      .salary-table td:first-child {
        font-size: clamp(9px, 3vw, 12px);
      }

      .salary-footnote {
        font-size: 10px;
      }

      .app-loading {
        min-height: 175px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }

    @media (max-width: 350px) {
      .salary-table th {
        font-size: 8px;
      }

      .salary-table td {
        font-size: 10px;
      }

      .salary-table td:first-child {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading">
      <div id="loading-state" class="app-loading" role="status" aria-label="Loading">
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading...</div>
      </div>

      <section class="response-summary" aria-live="polite">
        <div class="response-label">No. of responses</div>

        <div class="response-value-row">
          <div id="response-count" class="response-value"></div>
          <div id="dataSourceIndicator" class="live-data" aria-label="Live data">
            <span class="live-data-dot" aria-hidden="true"></span>
            <span id="dataSourceText">LIVE data</span>
          </div>
        </div>
      </section>

      <section class="salary-section" aria-label="Permanent salary summary">
        <div class="salary-trend" aria-label="FTE salary data points and smoothed trend over time">
          <div class="salary-trend-topline">
            <span class="salary-trend-title">FTE salary over time</span>

            <span class="salary-trend-legend" aria-hidden="true">
              <span class="salary-trend-legend-item">
                <span class="salary-trend-dot"></span>
                <span>Salary</span>
              </span>

              <span class="salary-trend-legend-item">
                <span class="salary-trend-line"></span>
                <span>Smoothed trend</span>
              </span>
            </span>
          </div>

          <div class="salary-trend-canvas-wrap">
            <canvas id="salary-trend-canvas" aria-label="FTE salary over time"></canvas>
            <div id="salary-trend-status" class="salary-trend-status"></div>
          </div>

          <div class="salary-trend-dates" aria-hidden="true">
            <span id="salary-trend-start">—</span>
            <span id="salary-trend-end">—</span>
          </div>
        </div>

        <div id="percentile-help" class="percentile-help" role="status" aria-live="polite"></div>

        <div class="salary-table-wrap">
          <table id="salary-table" class="salary-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <div id="salary-footnote" class="salary-footnote">
          Salary (FTE) excl. super, incl. location and weekend/night loadings<br>
          * unloaded FTE: removes assumed Sat 1.5× (8h), Sun 1.5× (6h) and late-night 1.15× (8h) loadings
        </div>
      </section>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID =
      '1D4EoCMnH_RbwbuzFtw92NOwnvR_r9zQV7dAaXtfnnd0';

    const SHEET_GID = '0';
    const SHEET_NAME = 'Data';

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'permanent-salary-summary';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Testing switch only.
     * Leave false in normal use.
     * Set true temporarily to verify the existing cached-summary fallback.
     * The current cached summary does not contain the raw roster fields needed
     * for the new late-night unloading calculation or the salary trend chart.
     */
    const FORCE_CACHED_DATA =
      false;

    /*
     * Live calculations use the raw/derived fields in Data:
     * A  = submission timestamp
     * M  = mode full-time weekly hours (M2; normally 38)
     * AM = hours worked per week
     * AN = rostered Saturdays / 4 weeks
     * AO = rostered Sundays / 4 weeks
     * AP = rostered late nights / 4 weeks
     * AY = FTE salary
     * BE = FTE bonuses
     *
     * AZ/BF are deliberately not used: the frontend now recalculates the
     * unloaded values itself so late-night loading can also be removed.
     */
    const RAW_DATA_RANGE = 'A:BE';

    const RAW_COLUMNS = Object.freeze({
      date: 0,
      modeFteHours: 12,
      hoursPerWeek: 38,
      saturdays: 39,
      sundays: 40,
      lateNights: 41,
      salary: 50,
      bonuses: 56
    });

    const EXPECTED_SALARY_COLS = 6;
    const EXPECTED_SALARY_DATA_ROWS = 12;

    const DAY_MS = 86400000;

    /*
     * These reproduce the existing spreadsheet weekend adjustment assumptions
     * and extend them to late nights.
     */
    const LOADING_REFERENCE_WEEKLY_HOURS = 40;
    const SATURDAY_SHIFT_HOURS = 8;
    const SUNDAY_SHIFT_HOURS = 6;
    const LATE_NIGHT_SHIFT_HOURS = 8;
    const SATURDAY_LOADING = 0.50;
    const SUNDAY_LOADING = 0.50;
    const LATE_NIGHT_LOADING = 0.15;

    const PERCENTILES = [
      {
        label: '5th',
        probability: 0.05,
        help: '5% of values are at or below this amount.'
      },
      {
        label: '20th',
        probability: 0.20,
        help: '20% of values are at or below this amount.'
      },
      {
        label: 'Median',
        probability: 0.50,
        help: 'Half of values are at or below this amount.'
      },
      {
        label: '80th',
        probability: 0.80,
        help: '80% of values are at or below this amount.'
      },
      {
        label: '95th',
        probability: 0.95,
        help: '95% of values are at or below this amount.'
      }
    ];

    const app =
      document.getElementById('app');

    const responseCount =
      document.getElementById('response-count');

    const salaryTable =
      document.getElementById('salary-table');

    const loadingState =
      document.getElementById('loading-state');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const percentileHelp =
      document.getElementById('percentile-help');

    const salaryTrendCanvas =
      document.getElementById('salary-trend-canvas');

    const salaryTrendStatus =
      document.getElementById('salary-trend-status');

    const salaryTrendStart =
      document.getElementById('salary-trend-start');

    const salaryTrendEnd =
      document.getElementById('salary-trend-end');

    const salaryFootnote =
      document.getElementById('salary-footnote');

    let rawRows = [];
    let fteWeeklyHours = 38;
    let usingLiveRawData = false;

    function hideLoadingState() {
      app.classList.remove('is-loading');
      loadingState.setAttribute('aria-hidden', 'true');

      if (usingLiveRawData && rawRows.length) {
        requestAnimationFrame(() => {
          renderSalaryTrend(rawRows);
        });
      }
    }

    function setDataSource(source) {
      const isCached =
        source === 'cached';

      dataSourceIndicator?.classList.toggle(
        'is-cached',
        isCached
      );

      if (source === 'live') {
        dataSourceIndicator?.setAttribute(
          'aria-label',
          'Live data'
        );

        if (dataSourceText) {
          dataSourceText.textContent =
            'LIVE data';
        }

        return;
      }

      if (isCached) {
        dataSourceIndicator?.setAttribute(
          'aria-label',
          'Cached data'
        );

        if (dataSourceText) {
          dataSourceText.textContent =
            'CACHED data';
        }

        return;
      }

      dataSourceIndicator?.setAttribute(
        'aria-label',
        'Data unavailable'
      );

      if (dataSourceText) {
        dataSourceText.textContent =
          'DATA unavailable';
      }
    }

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function toNumber(value) {
      const cleaned = cleanText(value)
        .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number = Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function getCellValue(cell) {
      return cell?.v ?? cell?.f ?? '';
    }

    function parseDate(value) {
      if (
        value instanceof Date &&
        !Number.isNaN(value.getTime())
      ) {
        return Date.UTC(
          value.getFullYear(),
          value.getMonth(),
          value.getDate()
        );
      }

      if (
        typeof value === 'number' &&
        value > 20000 &&
        value < 80000
      ) {
        return (
          Date.UTC(1899, 11, 30) +
          value * DAY_MS
        );
      }

      const text =
        cleanText(value);

      if (!text) {
        return null;
      }

      const googleDate = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/
      );

      if (googleDate) {
        return Date.UTC(
          Number(googleDate[1]),
          Number(googleDate[2]),
          Number(googleDate[3])
        );
      }

      const auDate = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})/
      );

      if (auDate) {
        let year =
          Number(auDate[3]);

        if (year < 100) {
          year += 2000;
        }

        return Date.UTC(
          year,
          Number(auDate[2]) - 1,
          Number(auDate[1])
        );
      }

      const isoDate = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
      );

      if (isoDate) {
        return Date.UTC(
          Number(isoDate[1]),
          Number(isoDate[2]) - 1,
          Number(isoDate[3])
        );
      }

      const parsed =
        new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          );
    }

    function formatTrendDate(timestamp) {
      if (!Number.isFinite(timestamp)) {
        return '—';
      }

      return new Intl.DateTimeFormat(
        'en-AU',
        {
          month: 'short',
          year: '2-digit',
          timeZone: 'UTC'
        }
      ).format(
        new Date(timestamp)
      );
    }

    function percentile(sortedValues, probability) {
      if (!sortedValues.length) {
        return NaN;
      }

      const index =
        (sortedValues.length - 1) *
        probability;

      const lowerIndex =
        Math.floor(index);

      const upperIndex =
        Math.ceil(index);

      if (lowerIndex === upperIndex) {
        return sortedValues[lowerIndex];
      }

      return (
        sortedValues[lowerIndex] +
        (
          sortedValues[upperIndex] -
          sortedValues[lowerIndex]
        ) *
        (index - lowerIndex)
      );
    }

    function calculatePercentiles(values) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      return PERCENTILES.map(
        item =>
          percentile(
            sorted,
            item.probability
          )
      );
    }

    function formatSalaryCurrency(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      if (number === 0) {
        return '$0';
      }

      if (Math.abs(number) >= 1000) {
        return `$${new Intl.NumberFormat('en-AU', {
          maximumFractionDigits: 0
        }).format(Math.round(number / 1000))}k`;
      }

      return `$${new Intl.NumberFormat('en-AU', {
        maximumFractionDigits: 0
      }).format(Math.round(number))}`;
    }

    function formatBonusCurrency(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      if (number === 0) {
        return '$0';
      }

      if (Math.abs(number) >= 1000) {
        const scaled =
          number / 1000;

        return `$${new Intl.NumberFormat('en-AU', {
          maximumFractionDigits:
            Math.abs(scaled - Math.round(scaled)) < 0.05
              ? 0
              : 1
        }).format(scaled)}k`;
      }

      return `$${new Intl.NumberFormat('en-AU', {
        maximumFractionDigits: 0
      }).format(Math.round(number))}`;
    }

    function formatHourly(value) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? `$${new Intl.NumberFormat('en-AU', {
            maximumFractionDigits: 0
          }).format(number)}`
        : '—';
    }

    function formatPlainNumber(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      return new Intl.NumberFormat(
        'en-AU',
        {
          maximumFractionDigits:
            Math.abs(number - Math.round(number)) < 0.05
              ? 0
              : 1
        }
      ).format(number);
    }

    function formatMetricValue(metricKey, value) {
      if (
        metricKey === 'salary' ||
        metricKey === 'unloadedSalary'
      ) {
        return formatSalaryCurrency(value);
      }

      if (
        metricKey === 'bonuses' ||
        metricKey === 'unloadedBonuses'
      ) {
        return formatBonusCurrency(value);
      }

      if (
        metricKey === 'hourly' ||
        metricKey === 'unloadedHourly'
      ) {
        return formatHourly(value);
      }

      return formatPlainNumber(value);
    }

    function calculateLoessTrend(points, sampleCount = 72, span = 0.42) {
      if (points.length < 3) {
        return [];
      }

      const sorted =
        points
          .slice()
          .sort(
            (first, second) =>
              first.x - second.x
          );

      const minimumX =
        sorted[0].x;

      const maximumX =
        sorted[sorted.length - 1].x;

      const xSpan =
        Math.max(
          1,
          maximumX - minimumX
        );

      const normalised =
        sorted.map(point => ({
          x:
            (point.x - minimumX) /
            xSpan,
          y: point.y
        }));

      const neighbourCount =
        Math.max(
          5,
          Math.min(
            normalised.length,
            Math.ceil(
              normalised.length * span
            )
          )
        );

      const result = [];

      for (
        let sampleIndex = 0;
        sampleIndex < sampleCount;
        sampleIndex += 1
      ) {
        const targetX =
          sampleCount === 1
            ? 0
            : sampleIndex /
              (sampleCount - 1);

        const distances =
          normalised
            .map(point =>
              Math.abs(
                point.x - targetX
              )
            )
            .sort(
              (first, second) =>
                first - second
            );

        const bandwidth =
          Math.max(
            1e-9,
            distances[
              neighbourCount - 1
            ] ||
            distances[
              distances.length - 1
            ] ||
            1
          );

        let sumWeight = 0;
        let sumX = 0;
        let sumY = 0;
        let sumXX = 0;
        let sumXY = 0;

        normalised.forEach(point => {
          const ratio =
            Math.abs(
              point.x - targetX
            ) /
            bandwidth;

          if (ratio >= 1) {
            return;
          }

          const weight =
            Math.pow(
              1 - Math.pow(ratio, 3),
              3
            );

          sumWeight += weight;
          sumX += weight * point.x;
          sumY += weight * point.y;
          sumXX += weight * point.x * point.x;
          sumXY += weight * point.x * point.y;
        });

        if (sumWeight <= 0) {
          continue;
        }

        const denominator =
          sumWeight * sumXX -
          sumX * sumX;

        let estimate;

        if (Math.abs(denominator) < 1e-12) {
          estimate =
            sumY /
            sumWeight;
        } else {
          const slope =
            (
              sumWeight * sumXY -
              sumX * sumY
            ) /
            denominator;

          const intercept =
            (
              sumY -
              slope * sumX
            ) /
            sumWeight;

          estimate =
            intercept +
            slope * targetX;
        }

        if (Number.isFinite(estimate)) {
          result.push({
            x:
              minimumX +
              targetX * xSpan,
            y: estimate
          });
        }
      }

      return result;
    }

    function renderSalaryTrend(rows) {
      if (!salaryTrendCanvas) {
        return;
      }

      const points =
        rows
          .filter(
            row =>
              Number.isFinite(row.date) &&
              validSalary(row.salary)
          )
          .map(row => ({
            x: row.date,
            y: row.salary
          }));

      if (points.length < 2) {
        setTrendStatus(
          'Salary trend unavailable'
        );

        salaryTrendStart.textContent = '—';
        salaryTrendEnd.textContent = '—';
        return;
      }

      setTrendStatus();

      const minimumX =
        Math.min(
          ...points.map(point => point.x)
        );

      const maximumX =
        Math.max(
          ...points.map(point => point.x)
        );

      salaryTrendStart.textContent =
        formatTrendDate(minimumX);

      salaryTrendEnd.textContent =
        formatTrendDate(maximumX);

      const sortedSalaries =
        points
          .map(point => point.y)
          .sort(
            (first, second) =>
              first - second
          );

      let minimumY =
        Math.min(...sortedSalaries);

      let maximumY =
        Math.max(...sortedSalaries);

      if (maximumY <= minimumY) {
        minimumY -= 1;
        maximumY += 1;
      } else {
        const yPadding =
          (maximumY - minimumY) *
          0.05;

        minimumY -= yPadding;
        maximumY += yPadding;
      }

      const cssWidth =
        Math.max(
          1,
          salaryTrendCanvas.clientWidth
        );

      const cssHeight =
        Math.max(
          1,
          salaryTrendCanvas.clientHeight
        );

      const pixelRatio =
        Math.min(
          window.devicePixelRatio || 1,
          3
        );

      salaryTrendCanvas.width =
        Math.round(
          cssWidth * pixelRatio
        );

      salaryTrendCanvas.height =
        Math.round(
          cssHeight * pixelRatio
        );

      const context =
        salaryTrendCanvas.getContext('2d');

      context.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
      );

      context.clearRect(
        0,
        0,
        cssWidth,
        cssHeight
      );

      const padding = {
        top: 5,
        right: 5,
        bottom: 5,
        left: 5
      };

      const plotWidth =
        Math.max(
          1,
          cssWidth -
          padding.left -
          padding.right
        );

      const plotHeight =
        Math.max(
          1,
          cssHeight -
          padding.top -
          padding.bottom
        );

      const xToPixel = value =>
        padding.left +
        (
          (value - minimumX) /
          Math.max(
            1,
            maximumX - minimumX
          )
        ) *
        plotWidth;

      const yToPixel = value => {
        const clamped =
          Math.max(
            minimumY,
            Math.min(
              maximumY,
              value
            )
          );

        return (
          padding.top +
          (
            1 -
            (
              (clamped - minimumY) /
              (maximumY - minimumY)
            )
          ) *
          plotHeight
        );
      };

      context.save();
      context.fillStyle =
        'rgba(102, 0, 255, 0.25)';

      points.forEach(point => {
        context.beginPath();
        context.arc(
          xToPixel(point.x),
          yToPixel(point.y),
          1.45,
          0,
          Math.PI * 2
        );
        context.fill();
      });
      context.restore();

      const trend =
        calculateLoessTrend(
          points
        );

      if (trend.length > 1) {
        context.save();
        context.beginPath();
        context.strokeStyle =
          '#f1c232';
        context.lineWidth = 2;
        context.lineCap = 'round';
        context.lineJoin = 'round';

        trend.forEach(
          (point, index) => {
            const x =
              xToPixel(point.x);

            const y =
              yToPixel(point.y);

            if (index === 0) {
              context.moveTo(x, y);
            } else {
              context.lineTo(x, y);
            }
          }
        );

        context.stroke();
        context.restore();
      }
    }

    function normaliseRawRows(response) {
      const sourceRows =
        response?.table?.rows || [];

      const result = [];
      const fteHourCandidates = [];

      sourceRows.forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const date =
            parseDate(
              getCellValue(
                cells[
                  RAW_COLUMNS.date
                ]
              )
            );

          const modeHours =
            toNumber(
              getCellValue(
                cells[
                  RAW_COLUMNS.modeFteHours
                ]
              )
            );

          if (
            Number.isFinite(modeHours) &&
            modeHours > 0
          ) {
            fteHourCandidates.push(
              modeHours
            );
          }

          if (!Number.isFinite(date)) {
            return;
          }

          const row = {
            date,
            salary:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.salary
                  ]
                )
              ),
            bonuses:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.bonuses
                  ]
                )
              ),
            hoursPerWeek:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.hoursPerWeek
                  ]
                )
              ),
            saturdays:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.saturdays
                  ]
                )
              ),
            sundays:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.sundays
                  ]
                )
              ),
            lateNights:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.lateNights
                  ]
                )
              )
          };

          const unloadFactor =
            calculateUnloadFactor(
              row
            );

          row.unloadedSalary =
            validSalary(row.salary)
              ? row.salary * unloadFactor
              : NaN;

          row.unloadedBonuses =
            validBonus(row.bonuses)
              ? row.bonuses * unloadFactor
              : NaN;

          result.push(row);
        }
      );

      if (fteHourCandidates.length) {
        fteWeeklyHours =
          fteHourCandidates[0];
      }

      return result;
    }

    function validSalary(value) {
      return (
        Number.isFinite(value) &&
        value >= 30000 &&
        value <= 500000
      );
    }

    function validBonus(value) {
      return (
        Number.isFinite(value) &&
        value >= 0
      );
    }

    function validHours(value) {
      return (
        Number.isFinite(value) &&
        value > 0 &&
        value <= 100
      );
    }

    function validShiftCount(value) {
      return (
        Number.isFinite(value) &&
        value >= 0 &&
        value <= 31
      );
    }

    function calculateUnloadFactor(row) {
      const saturdays =
        validShiftCount(row?.saturdays)
          ? row.saturdays
          : 0;

      const sundays =
        validShiftCount(row?.sundays)
          ? row.sundays
          : 0;

      const lateNights =
        validShiftCount(row?.lateNights)
          ? row.lateNights
          : 0;

      const loadingHoursPerFourWeeks =
        saturdays *
          SATURDAY_SHIFT_HOURS *
          SATURDAY_LOADING +
        sundays *
          SUNDAY_SHIFT_HOURS *
          SUNDAY_LOADING +
        lateNights *
          LATE_NIGHT_SHIFT_HOURS *
          LATE_NIGHT_LOADING;

      const referenceHoursPerFourWeeks =
        LOADING_REFERENCE_WEEKLY_HOURS *
        4;

      return Math.max(
        0,
        1 -
        loadingHoursPerFourWeeks /
        referenceHoursPerFourWeeks
      );
    }

    function valuesForMetric(rows, key) {
      if (key === 'salary') {
        return rows
          .map(row => row.salary)
          .filter(validSalary);
      }

      if (key === 'hourly') {
        return rows
          .map(
            row =>
              validSalary(row.salary)
                ? row.salary /
                  52 /
                  fteWeeklyHours
                : NaN
          )
          .filter(Number.isFinite);
      }

      if (key === 'bonuses') {
        return rows
          .map(row => row.bonuses)
          .filter(validBonus);
      }

      if (key === 'unloadedSalary') {
        return rows
          .map(row => row.unloadedSalary)
          .filter(validSalary);
      }

      if (key === 'unloadedHourly') {
        return rows
          .map(
            row =>
              validSalary(row.unloadedSalary)
                ? row.unloadedSalary /
                  52 /
                  fteWeeklyHours
                : NaN
          )
          .filter(Number.isFinite);
      }

      if (key === 'unloadedBonuses') {
        return rows
          .map(row => row.unloadedBonuses)
          .filter(validBonus);
      }

      if (key === 'hoursPerWeek') {
        return rows
          .map(row => row.hoursPerWeek)
          .filter(validHours);
      }

      if (key === 'saturdays') {
        return rows
          .map(row => row.saturdays)
          .filter(validShiftCount);
      }

      if (key === 'sundays') {
        return rows
          .map(row => row.sundays)
          .filter(validShiftCount);
      }

      if (key === 'lateNights') {
        return rows
          .map(row => row.lateNights)
          .filter(validShiftCount);
      }

      return [];
    }

    function calculateSummary(rows) {
      const metricKeys = [
        'salary',
        'hourly',
        'bonuses',
        'unloadedSalary',
        'unloadedHourly',
        'unloadedBonuses',
        'hoursPerWeek',
        'saturdays',
        'sundays',
        'lateNights'
      ];

      const metrics = {};

      metricKeys.forEach(
        key => {
          metrics[key] =
            calculatePercentiles(
              valuesForMetric(
                rows,
                key
              )
            );
        }
      );

      return {
        metrics
      };
    }

    function renderLiveSummary() {
      const summary =
        calculateSummary(
          rawRows
        );

      responseCount.textContent =
        String(
          rawRows.length
        );

      responseCount.classList.remove(
        'error'
      );

      renderCalculatedSalaryTable(
        summary
      );

      percentileHelp.textContent = '';
      percentileHelp.classList.remove(
        'is-visible'
      );
    }

    function showError(error) {
      console.error(error);

      responseCount.textContent = '—';
      responseCount.classList.add('error');

      salaryTable.querySelector('thead').textContent = '';
      salaryTable.querySelector('tbody').textContent = '';

      setTrendStatus(
        'Salary trend unavailable'
      );

      salaryTrendStart.textContent = '—';
      salaryTrendEnd.textContent = '—';
      hideLoadingState();
    }

    function getCellDisplayValue(cell) {
      if (!cell) return '';
      return String(
        cell.f ?? cell.v ?? ''
      ).trim();
    }

    function loadGvizRange(
      range,
      headers = 0,
      sheetName = ''
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `permSalarySummaryCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

          const script =
            document.createElement('script');

          const timeout =
            window.setTimeout(
              () => {
                cleanup();
                reject(
                  new Error(
                    'Could not load data'
                  )
                );
              },
              15000
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (error) {
              window[
                callbackName
              ] = undefined;
            }

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          window[callbackName] =
            response => {
              cleanup();

              if (
                response?.status ===
                'error'
              ) {
                reject(
                  new Error(
                    response?.errors?.[0]?.detailed_message ||
                    'Could not load Google Sheet data'
                  )
                );

                return;
              }

              resolve(response);
            };

          script.onerror =
            () => {
              cleanup();
              reject(
                new Error(
                  'Could not load data'
                )
              );
            };

          const params =
            new URLSearchParams({
              gid: SHEET_GID,
              range,
              headers:
                String(headers),
              tqx:
                `responseHandler:${callbackName}`
            });

          if (sheetName) {
            params.set(
              'sheet',
              sheetName
            );
          }

          script.src =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function validateCachedDashboardData(data) {
      const cachedResponseCount =
        String(
          data?.responseCount ??
          ''
        ).trim();

      const salaryTableValues =
        Array.isArray(
          data?.salaryTableValues
        )
          ? data.salaryTableValues
          : [];

      if (
        !cachedResponseCount ||
        cachedResponseCount === '—' ||
        salaryTableValues.length !==
          EXPECTED_SALARY_DATA_ROWS + 1 ||
        salaryTableValues.some(
          row =>
            !Array.isArray(row) ||
            row.length <
              EXPECTED_SALARY_COLS
        )
      ) {
        throw new Error(
          'The cached permanent salary summary is incomplete'
        );
      }

      return {
        responseCount:
          cachedResponseCount,
        salaryTableValues:
          salaryTableValues.map(
            row =>
              row
                .slice(
                  0,
                  EXPECTED_SALARY_COLS
                )
                .map(
                  value =>
                    String(
                      value ?? ''
                    ).trim()
                )
          )
      };
    }

    function loadCachedDashboardData() {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `permSalarySummaryCache_${Date.now()}_${Math.floor(Math.random() * 1000000)}`;

          const script =
            document.createElement('script');

          let settled = false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'The cached-data request timed out'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          function finish(
            error,
            data
          ) {
            if (settled) {
              return;
            }

            settled = true;
            cleanup();

            if (error) {
              reject(error);
              return;
            }

            resolve(data);
          }

          window[callbackName] =
            response => {
              if (
                !response ||
                response.ok !== true
              ) {
                finish(
                  new Error(
                    response?.error ||
                    'The cached-data service did not return a snapshot'
                  )
                );

                return;
              }

              if (
                response.appKey !==
                CACHE_APP_KEY
              ) {
                finish(
                  new Error(
                    'The cached-data response belongs to a different app'
                  )
                );

                return;
              }

              if (
                !response.cachedAt ||
                Number.isNaN(
                  Date.parse(
                    response.cachedAt
                  )
                )
              ) {
                finish(
                  new Error(
                    'The cached-data response has no valid timestamp'
                  )
                );

                return;
              }

              try {
                finish(
                  null,
                  validateCachedDashboardData(
                    response.data
                  )
                );
              } catch (error) {
                finish(error);
              }
            };

          script.onerror =
            () => {
              finish(
                new Error(
                  'Could not load the cached-data service'
                )
              );
            };

          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,
              callback:
                callbackName,
              _:
                String(
                  Date.now()
                )
            });

          const separator =
            CACHE_WEB_APP_URL.includes('?')
              ? '&'
              : '?';

          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function renderCachedDashboardData(data) {
      usingLiveRawData = false;

      responseCount.textContent =
        data.responseCount;

      responseCount.classList.remove(
        'error'
      );

      renderCachedSalaryTable(
        data.salaryTableValues
      );

      setTrendStatus(
        'Trend unavailable in cached snapshot'
      );

      salaryTrendStart.textContent = '—';
      salaryTrendEnd.textContent = '—';

      if (salaryFootnote) {
        salaryFootnote.innerHTML =
          'Salary (FTE) excl. super, incl. location and weekend/night loadings<br>' +
          '* cached fallback uses the previous weekend-only adjustment; live data includes late-night unloading';
      }

      hideLoadingState();
    }

    async function loadLiveDashboardData() {
      const response =
        await loadGvizRange(
          RAW_DATA_RANGE,
          1,
          SHEET_NAME
        );

      const rows =
        normaliseRawRows(
          response
        );

      if (!rows.length) {
        throw new Error(
          'Live permanent salary raw data are incomplete'
        );
      }

      rawRows = rows;
      usingLiveRawData = true;

      if (salaryFootnote) {
        salaryFootnote.innerHTML =
          'Salary (FTE) excl. super, incl. location and weekend/night loadings<br>' +
          '* unloaded FTE: removes assumed Sat 1.5× (8h), Sun 1.5× (6h) and late-night 1.15× (8h) loadings';
      }

      renderLiveSummary();
    }

    async function loadDashboardData() {
      let liveError = null;

      if (!FORCE_CACHED_DATA) {
        try {
          await loadLiveDashboardData();

          setDataSource('live');
          hideLoadingState();
          return;
        } catch (error) {
          liveError = error;

          console.warn(
            'Live Google Sheets data could not be used',
            error
          );
        }
      } else {
        liveError =
          new Error(
            'Live data bypassed for cached-data test'
          );
      }

      try {
        const cachedData =
          await loadCachedDashboardData();

        setDataSource('cached');

        console.warn(
          'Using cached permanent salary summary data',
          liveError?.message
        );

        renderCachedDashboardData(
          cachedData
        );
      } catch (cachedError) {
        setDataSource('none');

        console.error(
          'Live Google Sheets data error',
          liveError
        );

        console.error(
          'Cached Apps Script data error',
          cachedError
        );

        showError(
          new Error(
            'Live and cached data are currently unavailable'
          )
        );
      }
    }

    document.addEventListener(

      'pointerdown',
      event => {
        if (
          event.target.closest(
            '.percentile-header-button'
          ) ||
          event.target.closest(
            '#percentile-help'
          )
        ) {
          return;
        }

        salaryTable
          .querySelectorAll(
            '.percentile-header-button'
          )
          .forEach(
            button =>
              button.classList.remove(
                'is-open'
              )
          );

        percentileHelp.textContent = '';
        percentileHelp.classList.remove(
          'is-visible'
        );
      }
    );

    let salaryTrendResizeFrame = null;

    window.addEventListener(
      'resize',
      () => {
        if (
          !usingLiveRawData ||
          !rawRows.length
        ) {
          return;
        }

        if (salaryTrendResizeFrame !== null) {
          cancelAnimationFrame(
            salaryTrendResizeFrame
          );
        }

        salaryTrendResizeFrame =
          requestAnimationFrame(() => {
            salaryTrendResizeFrame = null;
            renderSalaryTrend(rawRows);
          });
      },
      {
        passive: true
      }
    );

    loadDashboardData();
  </script>
</body>
</html>
