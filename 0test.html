<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Job Tracker</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;

      /* Lighter ordinary table separators. */
      --track: #f0f2f5;
      --row-line: #f8f9fa;

      /* Darker separator between Monday-starting weeks. */
      --week-line: #cdd2da;

      --repeat-red: #7a1111;
      --delisted-grey: #989da6;
      --soft: #f7f7f9;

      --seek-pink: #e5007d;
      --indeed-blue: #2557a7;
      --essilux-blue: #49b7e8;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --corporate: #8dc4af;
      --independent: #c3bce9;
      --ophthal: #ffe9b8;
      --other: #eaebec;

      --state-nsw: #5bb4f0;
      --state-qld: #6b1436;
      --state-act: #7561f4;
      --state-vic: #2f3a89;
      --state-sa: #dd4b4c;
      --state-nt: #b36324;
      --state-wa: #000000;
      --state-tas: #4fa171;

      --first-column-width: 150px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 16px 4px 22px;
    }

    #app.is-loading .content {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    .content {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 8px 12px;
    }

    .heading-group {
      min-width: 0;
      text-align: left;
    }

    .heading-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(20px, 3vw, 27px);
      font-weight: 700;
      line-height: 1.2;
    }

    .live-data-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #e53935;
    }

    .table-status {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
    }

    /*
     * Cleaner filter styling:
     * rectangular borders, minimal rounding and no pill backgrounds.
     */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .filter-control {
      position: relative;
    }

    .filter-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 10px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        background 140ms ease;
    }

    .filter-button:hover,
    .filter-button[aria-expanded="true"] {
      border-color: var(--ink);
    }

    .filter-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .filter-label {
      color: inherit;
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
    }

    .filter-value {
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.025em;
      line-height: 1;
      white-space: nowrap;
    }

    .binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .boolean-button.is-on .binary-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .boolean-button.is-on .binary-indicator::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .boolean-button:not(.is-on) .filter-value {
      color: var(--muted);
    }

    .menu-arrow {
      width: 0;
      height: 0;
      margin-left: 1px;
      border-top: 4px solid var(--muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .filter-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    .filter-menu {
      position: absolute;
      z-index: 50;
      top: calc(100% + 4px);
      right: 0;
      display: none;
      min-width: 190px;
      padding: 5px 0;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
      text-align: left;
    }

    .filter-menu.is-open {
      display: block;
    }

    .filter-menu-title {
      margin: 0;
      padding: 6px 10px 7px;
      color: var(--muted);
      border-bottom: 1px solid var(--track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 10px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.25;
      cursor: pointer;
      user-select: none;
    }

    .filter-option:hover {
      background: var(--soft);
    }

    .filter-option input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--purple);
      cursor: pointer;
    }

    .filter-option-all {
      border-bottom: 1px solid var(--track);
      font-weight: 700;
    }

    .state-option-code {
      min-width: 28px;
      font-weight: 700;
    }

    .state-option-nsw {
      color: var(--state-nsw);
    }

    .state-option-qld {
      color: var(--state-qld);
    }

    .state-option-act {
      color: var(--state-act);
    }

    .state-option-vic {
      color: var(--state-vic);
    }

    .state-option-sa {
      color: var(--state-sa);
    }

    .state-option-nt {
      color: var(--state-nt);
    }

    .state-option-wa {
      color: var(--state-wa);
    }

    .state-option-tas {
      color: var(--state-tas);
    }

    .table-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
      border-top: 1px solid var(--track);
      border-bottom: 1px solid var(--track);
      border-radius: 0;
      box-shadow: none;
      isolation: isolate;
    }

    /*
     * Gradient black divider after the sticky first column,
     * matching the summary-table styling.
     */
    .table-shell::after {
      content: "";
      position: absolute;
      z-index: 9;
      top: 0;
      bottom: 0;
      left: var(--first-column-width);
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .table-scroll {
      width: 100%;
      max-height: calc(100vh - 145px);
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .data-table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: auto;
    }

    .data-table thead {
      position: sticky;
      z-index: 5;
      top: 0;
      background: #fff;
    }

    /*
     * Gradient black divider below the header row,
     * matching the summary-table header separator.
     */
    .data-table thead::after {
      content: "";
      position: absolute;
      z-index: 8;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      pointer-events: none;
      background: linear-gradient(
        to right,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 8%,
        var(--ink) 18%,
        var(--ink) 82%,
        rgba(21, 21, 21, 0.16) 92%,
        #fff 100%
      );
    }

    .data-table th,
    .data-table td {
      position: relative;
      min-width: 120px;
      max-width: 300px;
      padding: 8px 7px;
      border-right: 1px solid var(--track);
      border-bottom: 1px solid var(--row-line);
      line-height: 1.2;
      text-align: center;
      vertical-align: middle;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .data-table th {
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: normal;
    }

    .data-table td {
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      font-weight: 400;
    }

    .data-table th:first-child,
    .data-table td:first-child {
      position: sticky;
      left: 0;
      width: var(--first-column-width);
      min-width: var(--first-column-width);
      max-width: var(--first-column-width);
    }

    .data-table th:first-child {
      z-index: 7;
    }

    .data-table td:first-child {
      z-index: 2;
      font-weight: 700;
      white-space: nowrap;
    }

    .data-table th:last-child,
    .data-table td:last-child {
      border-right: 0;
    }

    .data-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .data-table tbody tr:hover td {
      filter: brightness(0.988);
    }

    /*
     * Slightly darker separator after the last visible row
     * in each Monday-starting week.
     */
    .data-table tbody tr.week-divider td {
      border-bottom: 1px solid var(--week-line);
      box-shadow: inset 0 -1px 0 var(--week-line);
    }

    .data-table a {
      color: var(--purple);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    .data-table a:hover {
      text-decoration-thickness: 2px;
    }

    /*
     * Brand hyperlink colours are declared after repeat-row colours
     * so they take priority for repeat advertisements.
     */
    .data-table a.link-seek,
    .data-table tr.repeat-row td a.link-seek {
      color: var(--seek-pink);
    }

    .data-table a.link-indeed,
    .data-table tr.repeat-row td a.link-indeed {
      color: var(--indeed-blue);
    }

    .data-table a.link-essilux,
    .data-table tr.repeat-row td a.link-essilux {
      color: var(--essilux-blue);
    }

    .data-table td.category-corporate {
      background: var(--corporate);
    }

    .data-table td.category-independent {
      background: var(--independent);
    }

    .data-table td.category-ophthal {
      background: var(--ophthal);
    }

    .data-table td.category-other {
      background: var(--other);
    }

    .data-table td.state-nsw {
      color: var(--state-nsw);
      background: rgba(91, 180, 240, 0.16);
      font-weight: 700;
    }

    .data-table td.state-qld {
      color: var(--state-qld);
      background: rgba(107, 20, 54, 0.12);
      font-weight: 700;
    }

    .data-table td.state-act {
      color: var(--state-act);
      background: rgba(117, 97, 244, 0.14);
      font-weight: 700;
    }

    .data-table td.state-vic {
      color: var(--state-vic);
      background: rgba(47, 58, 137, 0.12);
      font-weight: 700;
    }

    .data-table td.state-sa {
      color: var(--state-sa);
      background: rgba(221, 75, 76, 0.12);
      font-weight: 700;
    }

    .data-table td.state-nt {
      color: var(--state-nt);
      background: rgba(179, 99, 36, 0.13);
      font-weight: 700;
    }

    .data-table td.state-wa {
      color: var(--state-wa);
      background: rgba(0, 0, 0, 0.07);
      font-weight: 700;
    }

    .data-table td.state-tas {
      color: var(--state-tas);
      background: rgba(79, 161, 113, 0.14);
      font-weight: 700;
    }

    /*
     * Repeat advertisements use dark-red text,
     * but hyperlink colours above remain branded.
     */
    .data-table tr.repeat-row td {
      color: var(--repeat-red);
    }

    /*
     * Delisted rows take final priority:
     * every piece of text in the row is grey.
     */
    .data-table tr.delisted-row td,
    .data-table tr.delisted-row td a,
    .data-table tr.delisted-row td a.link-seek,
    .data-table tr.delisted-row td a.link-indeed,
    .data-table tr.delisted-row td a.link-essilux {
      color: var(--delisted-grey) !important;
    }

    .data-table tr.is-hidden {
      display: none;
    }

    .empty-state {
      display: none;
      padding: 42px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .empty-state.is-visible {
      display: block;
    }

    .error-state {
      display: none;
      max-width: 720px;
      margin: 20px auto;
      padding: 18px;
      color: var(--muted);
      background: var(--soft);
      border-top: 1px solid var(--track);
      border-bottom: 1px solid var(--track);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .error-state.is-visible {
      display: block;
    }

    @media (max-width: 900px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .controls {
        justify-content: flex-start;
      }

      .filter-menu {
        right: auto;
        left: 0;
      }

      .table-scroll {
        max-height: calc(100vh - 220px);
      }
    }

    @media (max-width: 520px) {
      :root {
        --first-column-width: 128px;
      }

      #app {
        padding: 12px 1px 18px;
      }

      .topbar {
        margin-right: 4px;
        margin-left: 4px;
      }

      .filter-button {
        min-height: 34px;
        padding: 0 8px;
        gap: 6px;
      }

      .filter-label {
        font-size: 11px;
      }

      .filter-value {
        font-size: 9px;
      }

      .filter-menu {
        min-width: 180px;
      }

      .table-scroll {
        max-height: calc(100vh - 270px);
      }

      .data-table th,
      .data-table td {
        min-width: 105px;
        max-width: 225px;
        padding: 7px 4px;
        font-size: 11px;
      }

      .data-table th:first-child,
      .data-table td:first-child {
        width: var(--first-column-width);
        min-width: var(--first-column-width);
        max-width: var(--first-column-width);
      }

      .app-loading {
        min-height: 180px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <main id="app" class="is-loading">
    <div
      id="loading-state"
      class="app-loading"
      role="status"
      aria-label="Loading job tracker"
    >
      <div class="cone-loader">
        <div class="cone blue" aria-hidden="true"></div>
        <div class="cone green" aria-hidden="true"></div>
        <div class="cone red" aria-hidden="true"></div>
      </div>

      <div class="loader-text">Loading jobs...</div>
    </div>

    <section class="content" aria-label="PFF job tracker">
      <div class="topbar">
        <div class="heading-group">
          <div class="heading-row">
            <h1>Optometry job tracker</h1>

            <span class="live-data-inline" aria-label="Live data">
              <span class="live-data-dot" aria-hidden="true"></span>
              <span>LIVE data</span>
            </span>
          </div>

          <p
            id="table-status"
            class="table-status"
            aria-live="polite"
          >
            Loading jobs...
          </p>
        </div>

        <div class="controls" aria-label="Table filters">
          <div class="filter-control">
            <button
              id="repeat-toggle"
              class="filter-button boolean-button"
              type="button"
              role="switch"
              aria-label="Include job ad repeats"
            >
              <span class="binary-indicator" aria-hidden="true"></span>
              <span class="filter-label">Job ad repeats</span>
              <span class="filter-value">ON</span>
            </button>
          </div>

          <div class="filter-control">
            <button
              id="corporate-toggle"
              class="filter-button boolean-button"
              type="button"
              role="switch"
              aria-label="Include corporate jobs"
            >
              <span class="binary-indicator" aria-hidden="true"></span>
              <span class="filter-label">Corporates</span>
              <span class="filter-value">ON</span>
            </button>
          </div>

          <div class="filter-control">
            <button
              id="rurality-button"
              class="filter-button multi-filter-button"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="rurality-menu"
            >
              <span class="filter-label">Rurality</span>
              <span class="filter-value">ALL</span>
              <span class="menu-arrow" aria-hidden="true"></span>
            </button>

            <div
              id="rurality-menu"
              class="filter-menu"
              role="group"
              aria-label="Rurality filters"
            >
              <p class="filter-menu-title">Show rurality</p>

              <label class="filter-option filter-option-all">
                <input
                  id="rurality-all"
                  type="checkbox"
                >
                <span>All ruralities</span>
              </label>

              <label class="filter-option">
                <input
                  class="rurality-checkbox"
