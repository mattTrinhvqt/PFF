<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <title>PFF Workplace Promoter Score</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #fff;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    .module {
      width: min(100%, 1000px);
      margin: 0 auto;
      padding: 8px 8px 6px;
      background: #fff;
      border-radius: 16px;
    }

    .header {
      margin: 0 0 2px;
      padding: 0;
    }

    .header h2 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(23px, 4vw, 31px);
      line-height: 1.12;
      font-weight: 700;
    }

    .live-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      color: #5d6e95;
      font-size: 14px;
      line-height: 1.35;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .chart-shell {
      position: relative;
      width: 100%;
      height: 610px;
      margin-top: 4px;
    }

    .status {
      width: 100%;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      text-align: left;
    }

    .status:empty {
      display: none;
    }

    .status.is-error {
      color: var(--error);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--track);
      color: #5d6e95;
      font-size: 14px;
      line-height: 1.35;
    }

    .meta-row strong {
      color: var(--ink);
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .chart-shell {
        height: 540px;
      }
    }

    @media (max-width: 430px) {
      .module {
        padding: 6px 4px 4px;
      }

      .header h2 {
        font-size: 21px;
      }

      .live-inline,
      .meta-row,
      .status {
        font-size: 13px;
      }

      .chart-shell {
        height: 470px;
      }
    }
  </style>
</head>
<body>
  <main class="module">
    <header class="header">
      <h2>Overall promoter score</h2>

      <div class="live-inline" aria-label="Live data">
        <span class="live-dot" aria-hidden="true"></span>
        <span>LIVE data</span>
      </div>
    </header>

    <div class="chart-shell">
      <canvas id="promoterChart"></canvas>
    </div>

    <div id="status" class="status"></div>

    <div class="meta-row">
      <div>Total respondents: <strong id="respondentTotal">—</strong></div>
    </div>
  </main>

  <script>
    /************************************************************
     * CONFIG
     ************************************************************/
    const SHEET_ID = '1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ';
    const SHEET_NAME = 'Data';
    const QUERY = 'select AM, AN, AO where AM is not null and AN is not null and AO is not null';

    /*
     * Bigger bubbles and more dramatic scaling.
     */
    const MIN_RADIUS = 10;
    const MAX_RADIUS = 62;

    let promoterChart = null;

    const statusEl = document.getElementById('status');
    const respondentTotalEl = document.getElementById('respondentTotal');

    /************************************************************
     * HELPERS
     ************************************************************/
    function setStatus(message = '', isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('is-error', isError && Boolean(message));
    }

    function formatNumber(value) {
      return new Intl.NumberFormat('en-AU').format(value);
    }

    function getCellValue(cell) {
      if (!cell) return '';
      return cell.v ?? cell.f ?? '';
    }

    function toNumber(value) {
      const n = typeof value === 'number'
        ? value
        : parseFloat(String(value).replace(/[^\d.-]/g, ''));
      return Number.isFinite(n) ? n : NaN;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getTextColor(bgHex) {
      const hex = bgHex.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
      return luminance < 160 ? '#ffffff' : '#3f3f3f';
    }

    /************************************************************
     * EMPLOYER LABELS + COLOURS
     ************************************************************/
    const EMPLOYER_LOOKUP = {
      'the optical superstore': { short: 'TOSS', color: '#ff2401' },
      'toss': { short: 'TOSS', color: '#ff2401' },

      'teachers health': { short: 'THF', color: '#007781' },
      'teachers health fund': { short: 'THF', color: '#007781' },
      'thf': { short: 'THF', color: '#007781' },

      'costco optical': { short: 'Costco', color: '#e32a36' },
      'costco': { short: 'Costco', color: '#e32a36' },

      'oscar wylee': { short: 'OW', color: '#f16c20' },
      'ow': { short: 'OW', color: '#f16c20' },

      'bailey nelson': { short: 'BN', color: '#002e5a' },
      'bn': { short: 'BN', color: '#002e5a' },

      '1001 optometry': { short: '1001', color: '#000000' },
      '1001': { short: '1001', color: '#000000' },

      'chemist warehouse optometry': { short: 'CW', color: '#ea0f0f' },
      'cw': { short: 'CW', color: '#ea0f0f' },

      'independent': { short: 'Indie', color: '#5a3be7' },
      'indie': { short: 'Indie', color: '#5a3be7' },

      'hcf eyecare': { short: 'HCF', color: '#da1c5c' },
      'hcf': { short: 'HCF', color: '#da1c5c' },

      'ophthalmologist': { short: 'Ophthal', color: '#ffb000' },
      'ophthal': { short: 'Ophthal', color: '#ffb000' },

      'the optical company (incl. nib)': { short: 'NIB', color: '#13543c' },
      'nib': { short: 'NIB', color: '#13543c' },

      'specsavers': { short: 'SS', color: '#009552' },
      'ss': { short: 'SS', color: '#009552' },

      'bupa optical': { short: 'Bupa', color: '#0075c2' },
      'bupa': { short: 'Bupa', color: '#0075c2' },

      'other': { short: 'Other', color: '#bfc3c7' },

      'opsm': { short: 'OPSM', color: '#6fb0d4' },
      'opsm (incl. l&p, eyeq)': { short: 'OPSM', color: '#6fb0d4' },

      'dresden vision': { short: 'Dresden', color: '#999999' },
      'dresden': { short: 'Dresden', color: '#999999' },

      'optical by national pharmacies': { short: 'ObNP', color: '#2cb4a6' },
      'obnp': { short: 'ObNP', color: '#2cb4a6' },

      'george & matilda eyecare': { short: 'G&M', color: '#3c3c3c' },
      'george & matilda': { short: 'G&M', color: '#3c3c3c' },
      'g&m': { short: 'G&M', color: '#3c3c3c' }
    };

    function employerMeta(name) {
      const cleaned = String(name || '').trim();
      const key = cleaned.toLowerCase();

      if (EMPLOYER_LOOKUP[key]) {
        return EMPLOYER_LOOKUP[key];
      }

      if (cleaned.length <= 10) {
        return {
          short: cleaned,
          color: '#666666'
        };
      }

      const initials = cleaned
        .split(/\s+/)
        .filter(Boolean)
        .map(part => part[0])
        .join('')
        .slice(0, 6);

      return {
        short: initials || cleaned.slice(0, 10),
        color: '#666666'
      };
    }

    /************************************************************
     * GOOGLE SHEETS JSONP
     ************************************************************/
    function loadSheetRows() {
      return new Promise((resolve, reject) => {
        const callbackName =
          'pffPromoterCallback_' +
          Date.now() +
          '_' +
          Math.floor(Math.random() * 1000000);

        const script = document.createElement('script');

        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error('Could not load Google Sheet data.'));
        }, 20000);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = response => {
          cleanup();

          if (!response || response.status === 'error') {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                'Could not load Google Sheet data.'
              )
            );
            return;
          }

          resolve(response.table?.rows || []);
        };

        const params = new URLSearchParams({
          sheet: SHEET_NAME,
          headers: '1',
          tq: QUERY,
          tqx: `responseHandler:${callbackName}`
        });

        script.onerror = () => {
          cleanup();
          reject(new Error('Network error loading Google Sheet data.'));
        };

        script.src =
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

        document.body.appendChild(script);
      });
    }

    /************************************************************
     * DATA NORMALISATION
     ************************************************************/
    function normaliseRows(rows) {
      return rows
        .map(row => {
          const employer = String(getCellValue(row.c?.[0]) || '').trim();
          const score = toNumber(getCellValue(row.c?.[1]));
          const respondents = toNumber(getCellValue(row.c?.[2]));

          return { employer, score, respondents };
        })
        .filter(item =>
          item.employer &&
          Number.isFinite(item.score) &&
          Number.isFinite(item.respondents) &&
          item.respondents > 0
        );
    }

    /************************************************************
     * BUBBLE SIZE SCALING
     *
     * More dramatic than before:
     * use near-linear scaling across the observed range.
     ************************************************************/
    function radiusFromRespondents(value, minValue, maxValue) {
      if (!Number.isFinite(value) || !Number.isFinite(minValue) || !Number.isFinite(maxValue)) {
        return MIN_RADIUS;
      }

      if (maxValue === minValue) {
        return (MIN_RADIUS + MAX_RADIUS) / 2;
      }

      const t = (value - minValue) / (maxValue - minValue);
      return MIN_RADIUS + t * (MAX_RADIUS - MIN_RADIUS);
    }

    /************************************************************
     * LAYOUT
     *
     * x-axis has no meaning.
     * Bubbles are placed left-to-right within each score row.
     * Larger respondent groups appear first (further left).
     ************************************************************/
    function buildChartPoints(items) {
      const respondentValues = items.map(item => item.respondents);
      const minRespondents = Math.min(...respondentValues);
      const maxRespondents = Math.max(...respondentValues);

      const groups = new Map();

      items.forEach(item => {
        const key = String(item.score);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      });

      const sortedScores = [...groups.keys()]
        .map(Number)
        .sort((a, b) => b - a);

      const points = [];

      sortedScores.forEach(score => {
        const group = groups.get(String(score))
          .slice()
          .sort((a, b) =>
            b.respondents - a.respondents ||
            a.employer.localeCompare(b.employer)
          );

        const startX = 11;
        const stepX = 8.5;

        group.forEach((item, index) => {
          const meta = employerMeta(item.employer);
          const radius = radiusFromRespondents(
            item.respondents,
            minRespondents,
            maxRespondents
          );

          points.push({
            x: startX + (index * stepX),
            y: item.score,
            r: radius,
            employer: item.employer,
            shortLabel: meta.short,
            respondents: item.respondents,
            backgroundColor: meta.color,
            labelColor: getTextColor(meta.color)
          });
        });
      });

      /*
       * Draw larger bubbles first so smaller ones remain visible on top.
       */
      points.sort((a, b) => b.respondents - a.respondents);

      return points;
    }

    /************************************************************
     * PLUGINS
     ************************************************************/
    const bubbleLabelPlugin = {
      id: 'bubbleLabelPlugin',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const dataset = chart.data.datasets[0];
        const meta = chart.getDatasetMeta(0);

        meta.data.forEach((element, index) => {
          const raw = dataset.data[index];
          if (!raw || !raw.shortLabel) return;

          const x = element.x;
          const y = element.y;
          const radius = raw.r || 10;

          const fontSize = clamp(radius * 0.45, 10, 17);

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = `700 ${fontSize}px Lato, sans-serif`;
          ctx.lineJoin = 'round';
          ctx.lineWidth = Math.max(2.4, fontSize * 0.18);
          ctx.strokeStyle = 'rgba(255,255,255,0.92)';
          ctx.fillStyle = raw.labelColor || '#3f3f3f';

          ctx.strokeText(raw.shortLabel, x, y);
          ctx.fillText(raw.shortLabel, x, y);
          ctx.restore();
        });
      }
    };

    const yGuidePlugin = {
      id: 'yGuidePlugin',
      afterDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        const y = scales.y;
        if (!y) return;

        ctx.save();

        /*
         * Horizontal axis heading
         */
        ctx.fillStyle = '#151515';
        ctx.font = '700 13px Lato, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(
          'Likelihood of recommending workplace',
          10,
          chartArea.top - 10
        );

        /*
         * Descriptors next to 0, 5, 10
         */
        ctx.fillStyle = '#69718a';
        ctx.font = '12px Lato, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        const labelX = y.left - 12;

        [
          [0, 'not at all'],
          [5, 'unsure'],
          [10, 'extremely']
        ].forEach(([value, label]) => {
          const py = y.getPixelForValue(value);
          ctx.fillText(label, labelX, py);
        });

        ctx.restore();
      }
    };

    /************************************************************
     * RENDER CHART
     ************************************************************/
    function renderChart(points) {
      const ctx = document.getElementById('promoterChart').getContext('2d');

      if (promoterChart) {
        promoterChart.destroy();
      }

      promoterChart = new Chart(ctx, {
        type: 'scatter',
        data: {
          datasets: [{
            label: 'Employer scores',
            data: points,
            showLine: false,

            pointRadius: context => context.raw?.r || 10,
            pointHoverRadius: context => (context.raw?.r || 10) + 2,

            pointBackgroundColor: context => context.raw?.backgroundColor || '#6600ff',
            pointBorderColor: 'rgba(190,190,190,0.95)',
            pointBorderWidth: 1.4,
            pointHoverBorderColor: '#8b8b8b',
            pointHoverBorderWidth: 1.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: {
            duration: 700,
            easing: 'easeOutCubic'
          },
          layout: {
            padding: {
              top: 28,
              right: 8,
              bottom: 2,
              left: 88
            }
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              callbacks: {
                title(context) {
                  return context[0]?.raw?.employer || '';
                },
                label(context) {
                  const raw = context.raw;
                  return [
                    `Score: ${raw.y}`,
                    `Respondents: ${formatNumber(raw.respondents)}`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              type: 'linear',
              min: 0,
              max: 100,
              display: false,
              grid: {
                display: false,
                drawBorder: false
              },
              border: {
                display: false
              }
            },
            y: {
              min: 0,
              max: 10,
              ticks: {
                stepSize: 1,
                color: '#151515',
                font: {
                  family: 'Lato',
                  size: 13
                }
              },
              title: {
                display: false
              },
              grid: {
                color: '#e1e4ea',
                lineWidth: 1,
                drawBorder: false
              },
              border: {
                color: '#151515',
                width: 1.5
              }
            }
          }
        },
        plugins: [bubbleLabelPlugin, yGuidePlugin]
      });
    }

    /************************************************************
     * LOAD + RENDER
     ************************************************************/
    async function loadPromoterChart() {
      try {
        setStatus('Loading live data…');

        const rows = await loadSheetRows();
        const items = normaliseRows(rows);

        if (!items.length) {
          throw new Error('No valid rows found in columns AM:AO.');
        }

        const points = buildChartPoints(items);
        renderChart(points);

        const totalRespondents = items.reduce(
          (sum, item) => sum + item.respondents,
          0
        );

        respondentTotalEl.textContent = formatNumber(totalRespondents);

        /*
         * Clear status text after successful load.
         */
        setStatus('');
      } catch (error) {
        console.error(error);
        respondentTotalEl.textContent = '—';
        setStatus(
          '⚠ ' + String(error?.message || 'Unable to load chart.'),
          true
        );
      }
    }

    loadPromoterChart();
    window.setInterval(loadPromoterChart, 60000);
  </script>
</body>
</html>
