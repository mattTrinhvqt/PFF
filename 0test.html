<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Australia and State Population Coverage Trends</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js"></script>

  <style>
    :root {
      --pff-saturated: #ff00ff;
      --pff-sufficient: #20c9d7;
    }

    .module-title {
      position: relative;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--pff-purple);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .module-title::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: var(--pff-purple);
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .chart-shell {
      margin: -3px 0 0;
    }

    .benchmark-legend {
      position: absolute;
      top: 8px;
      right: 5px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 4px 6px;
      color: var(--pff-muted);
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(105, 113, 138, 0.14);
      border-radius: 4px;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .benchmark-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .benchmark-legend-line {
      width: 17px;
      height: 0;
      flex: 0 0 17px;
      border-top: 2px dotted var(--pff-saturated);
    }

    .benchmark-legend-line.is-sufficient {
      border-top-color: var(--pff-sufficient);
    }

    .benchmark-legend-line.is-saturated {
      border-top-color: var(--pff-saturated);
    }

    @media (max-width: 430px) {
      .module-title {
        font-size: 12px;
      }

      .benchmark-legend {
        top: 7px;
        right: 3px;
        font-size: 8px;
      }
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        class="app-loading"
        role="status"
        aria-live="polite"
        aria-label="Loading Australia and state population coverage data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading population coverage data…</p>
      </div>

      <div class="module-top">
        <h1 class="module-title">Population coverage</h1>

        <div id="liveData" class="live-data" aria-label="Live data" aria-live="polite">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="liveDataText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">Population coverage trends</h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3-year trend"
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>
        </div>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >‹</button>

          <div id="legendViewport" class="legend-viewport">
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Population coverage chart legend"
            ></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >›</button>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <div class="benchmark-legend" aria-label="Coverage benchmarks">
          <span class="benchmark-legend-item">
            <span class="benchmark-legend-line is-sufficient" aria-hidden="true"></span>
            <span>Sufficient · 1 / 10k</span>
          </span>

          <span class="benchmark-legend-item">
            <span class="benchmark-legend-line is-saturated" aria-hidden="true"></span>
            <span>Saturated · 1 / 5k</span>
          </span>
        </div>

        <canvas
          id="coverageChart"
          aria-label="Australia and state people per FTE clinician trends over time"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      sheetId:
        '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE',

      clinicianSheet:
        'OptomsbyPHN',

      clinicianRange:
        'A30:CQ',

      populationSheet:
        'Auspopnbystate',

      populationRange:
        'A30:J',

      localCacheKey:
        'pff-australia-state-population-coverage-trends-fte-phn-v4'
    });

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CLINICIAN_CACHE_APP_KEY =
      'pff-phn-population-coverage-trends-v1';

    const POPULATION_CACHE_APP_KEY =
      'pff-australian-population-trends';

    const LIVE_CLINICIAN_FIRST_INDEX =
      64; // BM

    const REMOTE_CLINICIAN_FIRST_INDEX =
      1;

    const PHN_SERIES_COUNT =
      31;

    const SATURATED_BENCHMARK =
      5000;

    const SUFFICIENT_BENCHMARK =
      10000;

    const SATURATED_COLOUR =
      '#ff00ff';

    const SUFFICIENT_COLOUR =
      '#20c9d7';

    const AUSTRALIA_COLOUR =
      '#0b5d1e';

    const STATE_COLOURS = {
      NSW: '#2db7f5',
      VIC: '#2d3a8c',
      QLD: '#7a0036',
      SA: '#f03a47',
      WA: '#000000',
      TAS: '#22a36b',
      NT: '#c25e00',
      ACT: '#7b61ff'
    };

    const FTE_STATE_CODES = [
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'VIC', 'VIC', 'VIC', 'VIC', 'VIC', 'VIC',
      'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD',
      'SA', 'SA',
      'WA', 'WA', 'WA',
      'TAS',
      'NT',
      'ACT'
    ];

    const STATE_CODES = [
      'NSW',
      'VIC',
      'QLD',
      'SA',
      'WA',
      'TAS',
      'NT',
      'ACT'
    ];

    const SERIES = [
      {
        code:
          'AUS',
        label:
          'Australia',
        colour:
          AUSTRALIA_COLOUR,
        width:
          3
      },
      ...STATE_CODES.map(
        code => ({
          code,
          label:
            code,
          colour:
            STATE_COLOURS[code],
          width:
            3
        })
      )
    ];

    const app =
      document.getElementById('app');

    const statusEl =
      document.getElementById('status');

    const liveData =
      document.getElementById('liveData');

    const liveDataText =
      document.getElementById('liveDataText');

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartShell =
      document.getElementById('chartShell');

    const chartCanvas =
      document.getElementById('coverageChart');

    const state = {
      rows: [],
      clinicianByYear: {},
      populationByYear: {},
      years: [],
      hiddenSeries: new Set(),
      scale: {
        min: 0,
        max: 12000,
        step: 2000,
        intervals: 6
      }
    };

    let chart =
      null;

    let chartSummary =
      null;

    let headingScroller =
      null;

    let legendController =
      null;

    let trendController =
      null;

    let interactionsController =
      null;

    let responsiveController =
      null;

    let unifiedYAxis =
      null;

    function dataNumber(value) {
      if (
        value &&
        typeof value === 'object' &&
        (
          Object.prototype.hasOwnProperty.call(value, 'v') ||
          Object.prototype.hasOwnProperty.call(value, 'f')
        )
      ) {
        const direct =
          PFFCharts.numericCell(value);

        return Number.isFinite(direct)
          ? direct
          : null;
      }

      if (
        value === null ||
        value === undefined ||
        (
          typeof value === 'string' &&
          !value.trim()
        )
      ) {
        return null;
      }

      const cleaned =
        PFF.cleanText(value)
          .replace(/,/g, '')
          .replace(/[^0-9.+-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return null;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : null;
    }

    function yearValue(value) {
      const numeric =
        dataNumber(value);

      if (!Number.isFinite(numeric)) {
        return null;
      }

      const year =
        Math.round(numeric);

      return year >= 1900 && year <= 2200
        ? year
        : null;
    }

    function normaliseMetricObject(values) {
      if (
        !values ||
        typeof values !== 'object'
      ) {
        return null;
      }

      const normalised = {};

      SERIES.forEach(
        item => {
          const raw =
            values[item.code];

          if (
            raw === null ||
            raw === undefined ||
            (
              typeof raw === 'string' &&
              !raw.trim()
            )
          ) {
            normalised[item.code] =
              null;

            return;
          }

          const number =
            Number(raw);

          normalised[item.code] =
            Number.isFinite(number)
              ? number
              : null;
        }
      );

      return Object.values(
        normalised
      ).some(Number.isFinite)
        ? normalised
        : null;
    }

    function aggregateClinicianValues(
      values
    ) {
      const expectedByState =
        FTE_STATE_CODES.reduce(
          (counts, code) => {
            counts[code] =
              (counts[code] || 0) + 1;

            return counts;
          },
          {}
        );

      const totals =
        Object.fromEntries(
          STATE_CODES.map(
            code => [code, 0]
          )
        );

      const validCounts =
        Object.fromEntries(
          STATE_CODES.map(
            code => [code, 0]
          )
        );

      let nationalTotal =
        0;

      let nationalValid =
        0;

      FTE_STATE_CODES.forEach(
        (code, index) => {
          const value =
            dataNumber(
              values?.[index]
            );

          if (
            !Number.isFinite(value) ||
            value < 0
          ) {
            return;
          }

          totals[code] +=
            value;

          validCounts[code] +=
            1;

          nationalTotal +=
            value;

          nationalValid +=
            1;
        }
      );

      const result = {};

      STATE_CODES.forEach(
        code => {
          result[code] =
            validCounts[code] ===
              expectedByState[code]
              ? totals[code]
              : null;
        }
      );

      result.AUS =
        nationalValid ===
          PHN_SERIES_COUNT
          ? nationalTotal
          : null;

      return result;
    }

    function parseLiveClinicianTable(
      table
    ) {
      const result = {};

      (table?.rows || []).forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const year =
            yearValue(
              cells[0]
            );

          if (!year) {
            return;
          }

          const values =
            Array.from(
              {
                length:
                  PHN_SERIES_COUNT
              },
              (_, index) =>
                dataNumber(
                  cells[
                    LIVE_CLINICIAN_FIRST_INDEX +
                      index
                  ]
                )
            );

          const aggregated =
            aggregateClinicianValues(
              values
            );

          if (
            Object.values(
              aggregated
            ).some(Number.isFinite)
          ) {
            result[year] =
              aggregated;
          }
        }
      );

      return result;
    }

    function parseRemoteClinicianRows(
      sourceRows
    ) {
      const result = {};

      (
        Array.isArray(sourceRows)
          ? sourceRows
          : []
      ).forEach(
        row => {
          const year =
            yearValue(
              row?.[0]
            );

          if (!year) {
            return;
          }

          const values =
            Array.from(
              {
                length:
                  PHN_SERIES_COUNT
              },
              (_, index) =>
                dataNumber(
                  row?.[
                    REMOTE_CLINICIAN_FIRST_INDEX +
                      index
                  ]
                )
            );

          const aggregated =
            aggregateClinicianValues(
              values
            );

          if (
            Object.values(
              aggregated
            ).some(Number.isFinite)
          ) {
            result[year] =
              aggregated;
          }
        }
      );

      return result;
    }

    function parseLivePopulationTable(
      table
    ) {
      const result = {};

      (table?.rows || []).forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const year =
            yearValue(
              cells[0]
            );

          if (!year) {
            return;
          }

          const values = {
            NSW:
              dataNumber(cells[1]),
            VIC:
              dataNumber(cells[2]),
            QLD:
              dataNumber(cells[3]),
            SA:
              dataNumber(cells[4]),
            WA:
              dataNumber(cells[5]),
            TAS:
              dataNumber(cells[6]),
            NT:
              dataNumber(cells[7]),
            ACT:
              dataNumber(cells[8]),
            AUS:
              dataNumber(cells[9])
          };

          if (
            Object.values(
              values
            ).some(Number.isFinite)
          ) {
            result[year] =
              values;
          }
        }
      );

      return result;
    }

    function parseRemotePopulationSnapshot(
      snapshot
    ) {
      const result = {};

      (
        Array.isArray(
          snapshot?.data?.stateRows
        )
          ? snapshot.data.stateRows
          : []
      ).forEach(
        row => {
          const year =
            yearValue(
              row?.[0]
            );

          if (!year) {
            return;
          }

          result[year] = {
            NSW:
              dataNumber(row?.[1]),
            VIC:
              dataNumber(row?.[2]),
            QLD:
              dataNumber(row?.[3]),
            SA:
              dataNumber(row?.[4]),
            WA:
              dataNumber(row?.[5]),
            TAS:
              dataNumber(row?.[6]),
            NT:
              dataNumber(row?.[7]),
            ACT:
              dataNumber(row?.[8]),
            AUS:
              null
          };
        }
      );

      (
        Array.isArray(
          snapshot?.data?.rows
        )
          ? snapshot.data.rows
          : []
      ).forEach(
        row => {
          const year =
            yearValue(
              row?.[0]
            );

          if (!year) {
            return;
          }

          result[year] =
            result[year] || {
              NSW: null,
              VIC: null,
              QLD: null,
              SA: null,
              WA: null,
              TAS: null,
              NT: null,
              ACT: null,
              AUS: null
            };

          result[year].AUS =
            dataNumber(
              row?.[1]
            );
        }
      );

      return result;
    }

    function combineYearMaps(
      clinicianByYear,
      populationByYear
    ) {
      const years =
        Array.from(
          new Set([
            ...Object.keys(
              clinicianByYear || {}
            ).map(Number),

            ...Object.keys(
              populationByYear || {}
            ).map(Number)
          ])
        )
          .filter(Number.isFinite)
          .sort(
            (first, second) =>
              first - second
          );

      return years.map(
        year => ({
          year,
          clinician:
            normaliseMetricObject(
              clinicianByYear?.[
                year
              ]
            ),
          population:
            normaliseMetricObject(
              populationByYear?.[
                year
              ]
            )
        })
      );
    }

    function validateCombinedRows(
      sourceRows
    ) {
      const rows =
        (
          Array.isArray(sourceRows)
            ? sourceRows
            : []
        )
          .map(
            row => {
              const year =
                Number(
                  row?.year
                );

              if (
                !Number.isFinite(year) ||
                year < 1900 ||
                year > 2200
              ) {
                return null;
              }

              const clinician =
                normaliseMetricObject(
                  row?.clinician
                );

              const population =
                normaliseMetricObject(
                  row?.population
                );

              if (
                !clinician &&
                !population
              ) {
                return null;
              }

              return {
                year:
                  Math.round(year),
                clinician,
                population
              };
            }
          )
          .filter(Boolean)
          .sort(
            (first, second) =>
              first.year -
              second.year
          );

      if (
        !rows.some(
          row => row.clinician
        ) ||
        !rows.some(
          row => row.population
        ) ||
        !rows.some(
          row =>
            row.clinician &&
            row.population
        )
      ) {
        throw new Error(
          'Australia/state population coverage data were incomplete.'
        );
      }

      return rows;
    }

    function parseLiveData(
      raw
    ) {
      return validateCombinedRows(
        combineYearMaps(
          parseLiveClinicianTable(
            raw?.clinicianTable
          ),
          parseLivePopulationTable(
            raw?.populationTable
          )
        )
      );
    }

    function parseRemoteCache(
      raw
    ) {
      return validateCombinedRows(
        combineYearMaps(
          parseRemoteClinicianRows(
            raw?.clinicianSnapshot
              ?.data
              ?.clinicianRows
          ),
          parseRemotePopulationSnapshot(
            raw?.populationSnapshot
          )
        )
      );
    }

    function applyLoadedRows(
      sourceRows
    ) {
      const rows =
        validateCombinedRows(
          sourceRows
        );

      state.rows =
        rows;

      state.clinicianByYear = {};
      state.populationByYear = {};

      rows.forEach(
        row => {
          if (row.clinician) {
            state.clinicianByYear[
              row.year
            ] = {
              ...row.clinician
            };
          }

          if (row.population) {
            state.populationByYear[
              row.year
            ] = {
              ...row.population
            };
          }
        }
      );

      state.years =
        commonYears();

      if (!state.years.length) {
        throw new Error(
          'No annual years were common to OptomsbyPHN and Auspopnbystate.'
        );
      }

      state.scale =
        deriveScale();
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(
            raw
          );

        if (
          Array.isArray(
            parsed?.rows
          )
        ) {
          return;
        }

        if (
          parsed?.clinicianByYear &&
          parsed?.populationByYear
        ) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            validateCombinedRows(
              combineYearMaps(
                parsed.clinicianByYear,
                parsed.populationByYear
              )
            )
          );
        }
      } catch (_) {
        // Browser cache is optional.
      }
    }

    function sortedYears(
      object
    ) {
      return Object.keys(
        object || {}
      )
        .map(Number)
        .filter(Number.isFinite)
        .sort(
          (first, second) =>
            first - second
        );
    }

    function commonYears() {
      const clinicianYears =
        new Set(
          sortedYears(
            state.clinicianByYear
          )
        );

      return sortedYears(
        state.populationByYear
      ).filter(
        year =>
          clinicianYears.has(
            year
          )
      );
    }

    function safeNumber(
      value
    ) {
      if (
        value === null ||
        value === undefined ||
        (
          typeof value === 'string' &&
          !value.trim()
        )
      ) {
        return null;
      }

      const number =
        Number(
          value
        );

      return Number.isFinite(number)
        ? number
        : null;
    }

    function coverageFor(
      year,
      code
    ) {
      const population =
        safeNumber(
          state.populationByYear?.[
            year
          ]?.[
            code
          ]
        );

      const clinicians =
        safeNumber(
          state.clinicianByYear?.[
            year
          ]?.[
            code
          ]
        );

      if (
        population === null ||
        clinicians === null ||
        population <= 0 ||
        clinicians <= 0
      ) {
        return null;
      }

      const coverage =
        population /
        clinicians;

      return Number.isFinite(coverage) &&
        coverage > 0
          ? coverage
          : null;
    }

    function latestTrendFor(
      code
    ) {
      const windowSize =
        trendController?.windowSize ||
        0;

      if (windowSize < 2) {
        return NaN;
      }

      const trendRows =
        state.years.map(
          year => ({
            year
          })
        );

      return PFFCharts.latestConsecutiveTrend(
        trendRows,
        row =>
          coverageFor(
            row.year,
            code
          ),
        windowSize
      );
    }

    function niceStep(
      rawStep
    ) {
      if (
        !Number.isFinite(rawStep) ||
        rawStep <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(
            rawStep
          )
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        rawStep /
        magnitude;

      let niceFraction;

      if (fraction <= 1) {
        niceFraction =
          1;
      } else if (fraction <= 2) {
        niceFraction =
          2;
      } else if (fraction <= 2.5) {
        niceFraction =
          2.5;
      } else if (fraction <= 5) {
        niceFraction =
          5;
      } else {
        niceFraction =
          10;
      }

      return niceFraction *
        magnitude;
    }

    function nextNiceStep(
      step
    ) {
      const value =
        Math.max(
          1e-9,
          Number(step) || 1
        );

      const exponent =
        Math.floor(
          Math.log10(
            value
          )
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        value /
        magnitude;

      if (fraction < 1.5) {
        return 2 *
          magnitude;
      }

      if (fraction < 2.25) {
        return 2.5 *
          magnitude;
      }

      if (fraction < 3.75) {
        return 5 *
          magnitude;
      }

      if (fraction < 7.5) {
        return 10 *
          magnitude;
      }

      return 20 *
        magnitude;
    }

    function deriveScale() {
      const values = [
        SATURATED_BENCHMARK,
        SUFFICIENT_BENCHMARK
      ];

      SERIES.forEach(
        item => {
          state.years.forEach(
            year => {
              const value =
                coverageFor(
                  year,
                  item.code
                );

              if (
                Number.isFinite(value)
              ) {
                values.push(
                  value
                );
              }
            }
          );
        }
      );

      const finite =
        values.filter(
          value =>
            Number.isFinite(value) &&
            value >= 0
        );

      if (!finite.length) {
        return {
          min:
            0,
          max:
            12000,
          step:
            2000,
          intervals:
            6
        };
      }

      const highest =
        Math.max(
          ...finite
        );

      let step =
        niceStep(
          Math.max(
            1,
            highest / 6
          )
        );

      let maximum =
        Math.ceil(
          highest /
            step
        ) *
        step;

      if (
        maximum -
          highest <
        step * 0.35
      ) {
        maximum +=
          step;
      }

      let intervals =
        Math.round(
          maximum /
            step
        );

      while (
        intervals > 8
      ) {
        step =
          nextNiceStep(
            step
          );

        maximum =
          Math.ceil(
            highest /
              step
          ) *
          step;

        if (
          maximum -
            highest <
          step * 0.35
        ) {
          maximum +=
            step;
        }

        intervals =
          Math.round(
            maximum /
              step
          );
      }

      return {
        min:
          0,
        max:
          maximum,
        step,
        intervals:
          Math.max(
            1,
            intervals
          )
      };
    }

    function datasetFor(
      item
    ) {
      const hidden =
        state.hiddenSeries.has(
          item.code
        );

      return PFFCharts.lineDataset({
        label:
          item.label,

        data:
          state.years.map(
            year =>
              coverageFor(
                year,
                item.code
              )
          ),

        borderColor:
          item.colour,

        backgroundColor:
          item.colour,

        pointBackgroundColor:
          item.colour,

        pointBorderColor:
          '#ffffff',

        pointBorderWidth:
          1,

        borderWidth:
          item.width,

        cubicInterpolationMode:
          'monotone',

        hidden,

        _code:
          item.code,

        _seriesLabel:
          item.label,

        _activeSeries:
          !hidden
      });
    }

    function buildDatasets() {
      return SERIES.map(
        datasetFor
      );
    }

    const coverageBenchmarksPlugin = {
      id:
        'australiaStateCoverageBenchmarks',

      beforeDatasetsDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea,
          scales
        } =
          chartInstance;

        if (
          !chartArea ||
          !scales?.y
        ) {
          return;
        }

        const benchmarks = [
          {
            value:
              SUFFICIENT_BENCHMARK,
            colour:
              SUFFICIENT_COLOUR
          },
          {
            value:
              SATURATED_BENCHMARK,
            colour:
              SATURATED_COLOUR
          }
        ];

        ctx.save();
        ctx.lineCap =
          'round';
        ctx.lineWidth =
          2.2;
        ctx.setLineDash(
          [1, 4]
        );

        benchmarks.forEach(
          benchmark => {
            const y =
              scales.y
                .getPixelForValue(
                  benchmark.value
                );

            if (
              !Number.isFinite(y) ||
              y < chartArea.top - 1 ||
              y > chartArea.bottom + 1
            ) {
              return;
            }

            ctx.strokeStyle =
              benchmark.colour;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              y
            );
            ctx.lineTo(
              chartArea.right,
              y
            );
            ctx.stroke();
          }
        );

        ctx.restore();
      }
    };

    const yearTickMarksPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'australiaStateCoverageYearTicks'
      });

    const coverageTrendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'australiaStateCoverageTrendLabels',

        enabled() {
          return (
            trendController?.mode !==
            'off'
          );
        },

        isActive({
          chart:
            chartInstance,
          dataset,
          datasetIndex,
          meta
        }) {
          return (
            dataset._activeSeries !==
              false &&
            !meta?.hidden &&
            (
              chartInstance
                .isDatasetVisible
                ? chartInstance
                    .isDatasetVisible(
                      datasetIndex
                    )
                : true
            )
          );
        },

        getTrendValue({
          dataset
        }) {
          return latestTrendFor(
            dataset._code
          );
        },

        getSeriesColour({
          dataset
        }) {
          return (
            dataset.borderColor ||
            '#69718a'
          );
        }
      });

    function tooltipLabel(
      context
    ) {
      const code =
        context.dataset._code;

      const year =
        Number(
          state.years[
            context.dataIndex
          ]
        );

      const population =
        safeNumber(
          state.populationByYear?.[
            year
          ]?.[
            code
          ]
        );

      const clinicians =
        safeNumber(
          state.clinicianByYear?.[
            year
          ]?.[
            code
          ]
        );

      const coverage =
        coverageFor(
          year,
          code
        );

      const label =
        code === 'AUS'
          ? 'Australia'
          : code;

      const lines = [
        `${label}: ${PFF.formatInteger(coverage)} people per FTE clinician`
      ];

      if (
        clinicians !== null &&
        population !== null
      ) {
        lines.push(
          `${PFF.formatOneDecimal(clinicians)} active FTE clinicians · ${PFF.formatInteger(population)} people`
        );
      }

      const windowSize =
        trendController?.windowSize ||
        0;

      if (windowSize >= 2) {
        const trend =
          latestTrendFor(
            code
          );

        if (
          Number.isFinite(trend)
        ) {
          const arrow =
            trend > 0.05
              ? '↑'
              : trend < -0.05
                ? '↓'
                : '';

          lines.push(
            `Latest ${windowSize}-year trend: ${arrow}${PFFCharts.formatTrendValue(trend)}`
          );
        }
      }

      return lines;
    }

    function chartOptions() {
      const scale =
        state.scale;

      const duration =
        PFFCharts.chartAnimationDuration();

      return PFFCharts.baseChartOptions({
        normalized:
          true,

        animation: {
          duration,
          easing:
            'easeInOutCubic'
        },

        animations: {
          x: {
            duration:
              0
          },

          y: {
            duration,
            easing:
              'easeInOutCubic'
          },

          colors: {
            duration:
              0
          }
        },

        transitions:
          PFFCharts.seriesVisibilityTransitionOptions(
            260
          ),

        layout: {
          autoPadding:
            true,
          padding: {
            top:
              PFF.mobileLayout()
                ? 8
                : 9,
            right:
              3,
            bottom:
              0,
            left:
              0
          }
        },

        plugins: {
          tooltip: {
            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      items[0].label
                    )
                  : '';
              },

              label:
                tooltipLabel
            }
          }
        },

        scales: {
          x:
            PFFCharts.xYearScaleOptions(),

          y:
            PFFCharts.yScaleOptions(
              scale,
              {
                ticks: {
                  display:
                    false,
                  stepSize:
                    scale.step
                },
                title: {
                  display:
                    false
                }
              }
            )
        }
      });
    }

    function createChart() {
      unifiedYAxis =
        PFFCharts.createUnifiedYAxis({
          id:
            'australiaStateCoverageUnifiedYAxis',

          getChart() {
            return chart;
          },

          getScale() {
            return state.scale;
          },

          getDecimals() {
            return 0;
          },

          getTitle() {
            return 'People per FTE clinician';
          },

          formatValue(
            value
          ) {
            return PFF.formatInteger(
              value
            );
          }
        });

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type:
              'line',

            data: {
              labels:
                state.years,
              datasets:
                buildDatasets()
            },

            options:
              chartOptions(),

            plugins: [
              unifiedYAxis.plugin,
              coverageBenchmarksPlugin,
              yearTickMarksPlugin,
              coverageTrendLabelsPlugin
            ]
          }
        );

      unifiedYAxis.setImmediately(
        state.scale,
        0
      );
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const visible =
        SERIES
          .filter(
            item =>
              !state.hiddenSeries.has(
                item.code
              )
          )
          .map(
            item =>
              item.label
          );

      const trendText =
        trendController?.mode !== 'off'
          ? ` ${trendController.windowSize}-year trend labels are on.`
          : ' Trend labels are off.';

      PFFCharts.updateChartSummary(
        `Australia and state population coverage trends from ${state.years[0] ?? 'unavailable'} to ${state.years[state.years.length - 1] ?? 'unavailable'}. Visible series: ${visible.length ? visible.join(', ') : 'none'}.${trendText}`,
        chartSummary
      );
    }

    function setupControls() {
      headingScroller =
        PFF.setupScrollableRegion({
          scroller:
            headingScrollViewport,
          leftButton:
            headingScrollLeft,
          rightButton:
            headingScrollRight
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,
          initialMode:
            '3yr',
          onChange() {
            chart?.draw();
            updateAccessibleSummary();
          }
        });

      /*
       * Keep the shared document-level tooltip-dismiss handler from
       * performing a full Chart.js relayout when this trend button is used.
       * Clear any visible tooltip locally, then redraw without layout.
       */
      yoyTrendToggle.addEventListener(
        'pointerdown',
        event => {
          event.stopPropagation();

          if (!chart?.tooltip) {
            return;
          }

          chart.tooltip.setActiveElements(
            [],
            {
              x: 0,
              y: 0
            }
          );

          chart.draw();
        }
      );

      legendController =
        PFFCharts.setupLegend({
          legend:
            chartLegend,

          leftButton:
            legendScrollLeft,

          rightButton:
            legendScrollRight,

          getChart() {
            return chart;
          },

          getItems() {
            return SERIES.map(
              (
                item,
                datasetIndex
              ) => ({
                datasetIndex,
                label:
                  item.label,
                colour:
                  item.colour,
                active:
                  !state.hiddenSeries.has(
                    item.code
                  ),
                code:
                  item.code
              })
            );
          },

          onToggle({
            dataset,
            visible,
            item
          }) {
            const code =
              item.code ||
              dataset?._code;

            if (code) {
              if (visible) {
                state.hiddenSeries.delete(
                  code
                );
              } else {
                state.hiddenSeries.add(
                  code
                );
              }
            }

            if (dataset) {
              dataset._activeSeries =
                visible;
            }

            updateAccessibleSummary();
          }
        });
    }

    function setupResponsiveBehaviour() {
      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },

          observe: [
            app,
            chartShell,
            chartLegend
          ],

          afterResize() {
            unifiedYAxis
              ?.setImmediately(
                state.scale,
                0
              );

            chart?.draw();
          },

          onRefresh() {
            headingScroller?.update();
            legendController?.update();
          }
        });
    }

    migrateLegacyLocalCache();
    setupControls();

    PFF.initialiseApp({
      app,
      status:
        statusEl,

      async loadLive() {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.clinicianSheet,
              range:
                CONFIG.clinicianRange,
              headers:
                '1'
            }),

            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.populationSheet,
              range:
                CONFIG.populationRange,
              headers:
                '1'
            })
          ]);

        return {
          clinicianTable,
          populationTable
        };
      },

      parseLive:
        parseLiveData,

      async loadRemoteCache() {
        const [
          clinicianSnapshot,
          populationSnapshot
        ] =
          await Promise.all([
            PFFCharts.loadAppsScriptCache({
              url:
                CACHE_WEB_APP_URL,
              appKey:
                CLINICIAN_CACHE_APP_KEY
            }),

            PFFCharts.loadAppsScriptCache({
              url:
                CACHE_WEB_APP_URL,
              appKey:
                POPULATION_CACHE_APP_KEY
            })
          ]);

        return {
          clinicianSnapshot,
          populationSnapshot,
          cachedAt:
            clinicianSnapshot?.cachedAt ||
            populationSnapshot?.cachedAt ||
            null
        };
      },

      parseRemoteCache,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        1,

      onLiveError(
        error
      ) {
        console.warn(
          'Live Australia/state population coverage data unavailable; trying Apps Script caches.',
          error
        );
      },

      onRemoteCacheError(
        error
      ) {
        console.warn(
          'Apps Script Australia/state population coverage caches unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          liveData,
        text:
          liveDataText
      },

      render(
        loaded
      ) {
        applyLoadedRows(
          loaded.rows
        );

        createChart();

        chartSummary =
          PFFCharts.ensureChartSummary({
            id:
              'australiaStateCoverageChartSummary',
            parent:
              app
          });

        chartCanvas.setAttribute(
          'aria-describedby',
          chartSummary.id
        );

        updateAccessibleSummary();

        interactionsController =
          PFFCharts.setupChartInteractions({
            canvas:
              chartCanvas,

            getChart() {
              return chart;
            }
          });

        setupResponsiveBehaviour();

        legendController?.update();
        headingScroller?.update();

        requestAnimationFrame(
          () => {
            unifiedYAxis
              ?.setImmediately(
                state.scale,
                0
              );

            chart?.draw();
            legendController?.update();
            headingScroller?.update();
          }
        );

        return chart;
      },

      onError() {
        liveData.style.visibility =
          'hidden';
      },

      errorMessage:
        'Australia and state population coverage data unavailable.'
    });
  </script>
</body>
</html>
