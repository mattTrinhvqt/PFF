<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF PHN coverage extremes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --sufficient: #20c9d7;

      --nsw: #2db7f5;
      --vic: #2d3a8c;
      --qld: #7a0036;
      --sa: #f03a47;
      --wa: #000000;
      --tas: #22a36b;
      --nt: #c25e00;
      --act: #7b61ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      color: var(--ink);
      font-family: 'Lato', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body { padding: 6px; }

    button, input { font: inherit; }

    #app {
      width: min(100%, 820px);
      margin: 0 auto;
      background: #fff;
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    .title-wrap { min-width: 0; }

    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.3;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.cached .live-dot { background: var(--cached-amber); }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 7px 0 5px;
      padding-top: 6px;
      border-top: 1px solid var(--track);
    }

    .mode-toggle {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 176px;
      height: 29px;
      padding: 1px;
      background: rgba(232, 234, 240, 0.58);
      border-radius: 4px;
    }

    .mode-toggle button {
      position: relative;
      z-index: 1;
      padding: 0 6px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-toggle button.active {
      background: #fff;
      color: var(--purple);
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.08);
    }

    details.state-control {
      position: relative;
      z-index: 20;
      flex: 0 0 auto;
    }

    details.state-control > summary {
      min-width: 100px;
      min-height: 29px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 7px;
      list-style: none;
      border: 1px solid var(--track);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font-size: 10px;
      cursor: pointer;
      user-select: none;
    }

    details.state-control > summary::-webkit-details-marker { display: none; }

    .summary-value {
      color: var(--purple);
      font-weight: 700;
      margin-left: auto;
    }

    .summary-arrow {
      width: 0;
      height: 0;
      border-top: 4px solid var(--muted);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      transition: transform 140ms ease;
    }

    details[open] .summary-arrow { transform: rotate(180deg); }

    .state-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      width: 205px;
      padding: 5px 0;
      border: 1px solid var(--track);
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(21, 21, 21, 0.13);
    }

    .state-menu-title {
      padding: 5px 9px 7px;
      color: var(--muted);
      border-bottom: 1px solid var(--track);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .state-option {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 29px;
      padding: 4px 9px;
      font-size: 11px;
      cursor: pointer;
    }

    .state-option:hover { background: rgba(232, 234, 240, 0.45); }
    .state-option.all { border-bottom: 1px solid var(--track); font-weight: 700; }
    .state-option input { accent-color: var(--purple); }

    .style-key {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 11px;
      min-height: 20px;
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 9.5px;
    }

    .style-key-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .line-sample {
      width: 23px;
      height: 0;
      border-top: 2px solid var(--ink);
    }

    .line-sample.dense { border-top-style: dashed; }

    .line-sample.benchmark {
      border-top-color: var(--sufficient);
      border-top-style: dotted;
    }

    .state-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      min-height: 18px;
      margin-bottom: 2px;
      color: var(--ink);
      font-size: 9px;
      line-height: 1.2;
    }

    .state-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .legend-swatch {
      width: 10px;
      height: 3px;
      border-radius: 2px;
    }

    .chart-shell {
      position: relative;
      width: 100%;
      height: clamp(330px, 54vw, 500px);
      min-height: 0;
    }

    #coverageChart {
      width: 100% !important;
      height: 100% !important;
    }

    #status {
      margin: 5px 0 0;
      color: var(--error);
      font-size: 11px;
      line-height: 1.35;
    }

    #status:empty { display: none; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 260px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 520px) {
      body { padding: 4px; }
      h2 { font-size: 14px; }
      .subtitle { font-size: 9.5px; }
      .controls { gap: 5px; }
      .mode-toggle { width: 157px; }
      .mode-toggle button { font-size: 8.5px; padding: 0 3px; }
      details.state-control > summary { min-width: 91px; padding-inline: 5px; font-size: 9px; }
      .state-menu { width: 190px; }
      .chart-shell { height: 360px; }
      .style-key { gap: 8px; font-size: 8.8px; }
      .state-legend { gap: 3px 8px; font-size: 8.5px; }
    }
  </style>
</head>

<body>
  <main id="app">
    <div class="top-row">
      <div class="title-wrap">
        <h2>Population coverage extremes by state/territory</h2>
        <p class="subtitle">Higher people per FTE = sparser clinician coverage</p>
      </div>

      <div id="liveData" class="live-data" aria-label="Data source status">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="liveText">Loading…</span>
      </div>
    </div>

    <div class="controls">
      <div id="modeToggle" class="mode-toggle" role="group" aria-label="Coverage lines to show">
        <button type="button" data-mode="both" class="active">Both</button>
        <button type="button" data-mode="sparse">Sparsest</button>
        <button type="button" data-mode="dense">Densest</button>
      </div>

      <details id="stateControl" class="state-control">
        <summary>
          <span>States</span>
          <span id="stateSummary" class="summary-value">All</span>
          <span class="summary-arrow" aria-hidden="true"></span>
        </summary>

        <div class="state-menu">
          <div class="state-menu-title">Show states/territories</div>
          <label class="state-option all">
            <input id="stateAll" type="checkbox" checked>
            <span>All states/territories</span>
          </label>
          <div id="stateOptions"></div>
        </div>
      </details>
    </div>

    <div class="style-key" aria-hidden="true">
      <span class="style-key-item"><span class="line-sample"></span>Sparsest</span>
      <span class="style-key-item"><span class="line-sample dense"></span>Densest</span>
      <span class="style-key-item"><span class="line-sample benchmark"></span>Sufficient: 1 FTE / 10,000</span>
    </div>

    <div id="stateLegend" class="state-legend"></div>

    <div class="chart-shell">
      <div id="loading" class="loading">Loading PHN workforce data…</div>
      <canvas id="coverageChart" aria-label="Population coverage extremes over time" role="img"></canvas>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    'use strict';

    // ============================================================
    // DATA SOURCE — copied from the existing PFF PHN workforce app
    // ============================================================

    const SHEET_ID = '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';
    const CLINICIAN_SHEET = 'OptomsbyPHN';
    const POPULATION_SHEET = 'AuspopnbyPHN';
    const CLINICIAN_RANGE = 'A30:CQ';
    const POPULATION_RANGE = 'A30:AF';
    const CLINICIAN_FIRST_INDEX = 64; // BM, when A = index 0
    const POPULATION_FIRST_INDEX = 1; // B, when A = index 0
    const CACHE_KEY = 'pff_phn_coverage_extremes_v1';

    /*
      Which PHN should represent each state's "sparsest" and "densest" line?

      'latest-year' = choose the sparsest/densest PHN in the latest common year,
                      then plot THAT SAME PHN backwards through time.
                      This is the default because it gives each line a consistent
                      named PHN, like your existing Google Sheets charts.

      'per-year'    = re-select the sparsest/densest PHN separately every year.
                      This tracks the state extreme itself, but the PHN represented
                      by a line can change between years.
    */
    const EXTREME_SELECTION_MODE = 'latest-year';

    const SUFFICIENT_BENCHMARK = 10000;

    const PHNS = [
      'Central and Eastern Sydney',
      'Northern Sydney',
      'Western Sydney',
      'Nepean Blue Mountains',
      'South Western Sydney',
      'South Eastern NSW',
      'Western NSW',
      'Hunter New England and Central Coast',
      'North Coast',
      'Murrumbidgee',
      'North Western Melbourne',
      'Eastern Melbourne',
      'South Eastern Melbourne',
      'Gippsland',
      'Murray',
      'Western Victoria',
      'Brisbane North',
      'Brisbane South',
      'Gold Coast',
      'Darling Downs and West Moreton',
      'Western Queensland',
      'Central Queensland',
      'Northern Queensland',
      'Adelaide',
      'Country SA',
      'Perth North',
      'Perth South',
      'Country WA',
      'Tasmania',
      'Northern Territory',
      'Australian Capital Territory'
    ];

    const STATE_CODES = [
      'NSW','NSW','NSW','NSW','NSW','NSW','NSW','NSW','NSW','NSW',
      'VIC','VIC','VIC','VIC','VIC','VIC',
      'QLD','QLD','QLD','QLD','QLD','QLD','QLD',
      'SA','SA',
      'WA','WA','WA',
      'TAS','NT','ACT'
    ];

    const ALL_STATES = ['NSW','VIC','QLD','SA','WA','TAS','NT','ACT'];

    const STATE_NAMES = {
      NSW: 'New South Wales',
      VIC: 'Victoria',
      QLD: 'Queensland',
      SA: 'South Australia',
      WA: 'Western Australia',
      TAS: 'Tasmania',
      NT: 'Northern Territory',
      ACT: 'Australian Capital Territory'
    };

    const STATE_COLOURS = {
      NSW: '#2db7f5',
      VIC: '#2d3a8c',
      QLD: '#7a0036',
      SA: '#f03a47',
      WA: '#000000',
      TAS: '#22a36b',
      NT: '#c25e00',
      ACT: '#7b61ff'
    };

    // ============================================================
    // APP STATE
    // ============================================================

    const state = {
      clinicianByYear: {},
      populationByYear: {},
      years: [],
      selectedStates: new Set(ALL_STATES),
      displayMode: 'both',
      sourceState: 'live',
      savedAt: null,
      fixedExtremes: {}
    };

    let chart = null;

    // ============================================================
    // DOM
    // ============================================================

    const canvas = document.getElementById('coverageChart');
    const loading = document.getElementById('loading');
    const statusEl = document.getElementById('status');
    const liveData = document.getElementById('liveData');
    const liveText = document.getElementById('liveText');
    const stateOptions = document.getElementById('stateOptions');
    const stateAll = document.getElementById('stateAll');
    const stateSummary = document.getElementById('stateSummary');
    const stateLegend = document.getElementById('stateLegend');
    const modeButtons = Array.from(document.querySelectorAll('#modeToggle button'));

    // ============================================================
    // GOOGLE SHEETS JSONP
    // ============================================================

    function loadGVizSheet(sheetName, range) {
      return new Promise((resolve, reject) => {
        const callbackName = `__pff_extreme_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement('script');
        let finished = false;

        const cleanup = () => {
          if (script.parentNode) script.parentNode.removeChild(script);
          try { delete window[callbackName]; }
          catch (_) { window[callbackName] = undefined; }
        };

        const timer = setTimeout(() => {
          if (finished) return;
          finished = true;
          cleanup();
          reject(new Error(`Timed out loading ${sheetName}.`));
        }, 15000);

        window[callbackName] = response => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          cleanup();

          if (!response || response.status === 'error') {
            const message =
              response?.errors?.[0]?.detailed_message ||
              response?.errors?.[0]?.message ||
              `Could not load ${sheetName}.`;
            reject(new Error(message));
            return;
          }

          resolve(response.table);
        };

        script.onerror = () => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          cleanup();
          reject(new Error(`Could not connect to ${sheetName}.`));
        };

        const params = new URLSearchParams({
          sheet: sheetName,
          range,
          headers: '1',
          tqx: `out:json;responseHandler:${callbackName}`
        });

        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;
        script.async = true;
        document.head.appendChild(script);
      });
    }

    function numericCell(cell) {
      if (!cell || cell.v === null || cell.v === undefined || cell.v === '') return null;
      if (typeof cell.v === 'number') return Number.isFinite(cell.v) ? cell.v : null;

      const cleaned = String(cell.v)
        .replace(/,/g, '')
        .replace(/[^0-9.+-]/g, '');

      if (!cleaned) return null;
      const value = Number(cleaned);
      return Number.isFinite(value) ? value : null;
    }

    function yearCell(cell) {
      const value = numericCell(cell);
      if (value === null) return null;
      const year = Math.round(value);
      return year >= 1900 && year <= 2200 ? year : null;
    }

    function parseTable(table, firstDataIndex) {
      const result = {};

      for (const row of table?.rows || []) {
        const cells = row?.c || [];
        const year = yearCell(cells[0]);
        if (!year) continue;

        const values = PHNS.map((_, index) =>
          numericCell(cells[firstDataIndex + index])
        );

        if (values.some(Number.isFinite)) result[year] = values;
      }

      return result;
    }

    function saveCache() {
      try {
        const savedAt = Date.now();
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          savedAt,
          clinicianByYear: state.clinicianByYear,
          populationByYear: state.populationByYear
        }));
        state.savedAt = savedAt;
      } catch (_) {}
    }

    function loadCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return false;
        const cached = JSON.parse(raw);
        if (!cached?.clinicianByYear || !cached?.populationByYear) return false;

        state.clinicianByYear = cached.clinicianByYear;
        state.populationByYear = cached.populationByYear;
        state.savedAt = cached.savedAt || null;
        return true;
      } catch (_) {
        return false;
      }
    }

    async function loadData() {
      try {
        const [clinicianTable, populationTable] = await Promise.all([
          loadGVizSheet(CLINICIAN_SHEET, CLINICIAN_RANGE),
          loadGVizSheet(POPULATION_SHEET, POPULATION_RANGE)
        ]);

        state.clinicianByYear = parseTable(clinicianTable, CLINICIAN_FIRST_INDEX);
        state.populationByYear = parseTable(populationTable, POPULATION_FIRST_INDEX);

        if (!Object.keys(state.clinicianByYear).length) {
          throw new Error('No clinician data were found.');
        }
        if (!Object.keys(state.populationByYear).length) {
          throw new Error('No population data were found.');
        }

        state.sourceState = 'live';
        saveCache();
      } catch (error) {
        if (loadCache()) {
          state.sourceState = 'cached';
          return;
        }
        throw error;
      }
    }

    // ============================================================
    // COVERAGE + EXTREMES
    // ============================================================

    function sortedYears(object) {
      return Object.keys(object)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function commonYears() {
      const clinicianYears = new Set(sortedYears(state.clinicianByYear));
      return sortedYears(state.populationByYear).filter(year => clinicianYears.has(year));
    }

    function coverageForPHN(year, index) {
      const c = Number(state.clinicianByYear[year]?.[index]);
      const p = Number(state.populationByYear[year]?.[index]);

      if (!Number.isFinite(c) || !Number.isFinite(p) || c <= 0) return null;
      return p / c;
    }

    function indicesForState(stateCode) {
      return STATE_CODES
        .map((code, index) => code === stateCode ? index : -1)
        .filter(index => index >= 0);
    }

    function extremeAtYear(stateCode, year, kind) {
      const candidates = indicesForState(stateCode)
        .map(index => ({
          index,
          value: coverageForPHN(year, index)
        }))
        .filter(item => Number.isFinite(item.value));

      if (!candidates.length) return null;

      candidates.sort((a, b) => a.value - b.value);
      return kind === 'dense'
        ? candidates[0]
        : candidates[candidates.length - 1];
    }

    function buildFixedExtremes() {
      state.fixedExtremes = {};
      if (!state.years.length) return;

      // Work backwards if the absolute latest common year has missing values
      // for a particular state.
      for (const stateCode of ALL_STATES) {
        let sparse = null;
        let dense = null;

        for (let i = state.years.length - 1; i >= 0; i -= 1) {
          const year = state.years[i];
          sparse = sparse || extremeAtYear(stateCode, year, 'sparse');
          dense = dense || extremeAtYear(stateCode, year, 'dense');
          if (sparse && dense) break;
        }

        state.fixedExtremes[stateCode] = {
          sparseIndex: sparse?.index ?? null,
          denseIndex: dense?.index ?? null
        };
      }
    }

    function pointSeriesFor(stateCode, kind) {
      if (EXTREME_SELECTION_MODE === 'per-year') {
        const phnByPoint = [];
        const data = state.years.map(year => {
          const extreme = extremeAtYear(stateCode, year, kind);
          phnByPoint.push(extreme ? PHNS[extreme.index] : '');
          return extreme ? Math.round(extreme.value) : null;
        });
        return { data, phnByPoint };
      }

      const index = state.fixedExtremes[stateCode]?.[`${kind}Index`];
      if (!Number.isInteger(index)) {
        return {
          data: state.years.map(() => null),
          phnByPoint: state.years.map(() => '')
        };
      }

      return {
        data: state.years.map(year => {
          const value = coverageForPHN(year, index);
          return Number.isFinite(value) ? Math.round(value) : null;
        }),
        phnByPoint: state.years.map(() => PHNS[index])
      };
    }

    function isSinglePHNState(stateCode) {
      return indicesForState(stateCode).length === 1;
    }

    // ============================================================
    // DATASETS + LEGEND
    // ============================================================

    function datasetFor(stateCode, kind) {
      const colour = STATE_COLOURS[stateCode];
      const series = pointSeriesFor(stateCode, kind);
      const single = isSinglePHNState(stateCode);

      return {
        label: `${stateCode} — ${single ? 'only PHN' : kind === 'sparse' ? 'sparsest' : 'densest'}`,
        data: series.data,
        _stateCode: stateCode,
        _kind: single ? 'only' : kind,
        _phnByPoint: series.phnByPoint,
        borderColor: colour,
        backgroundColor: colour,
        borderWidth: kind === 'sparse' ? 2.6 : 2.2,
        borderDash: kind === 'dense' && !single ? [7, 4] : [],
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHitRadius: 10,
        pointBackgroundColor: colour,
        pointBorderColor: '#fff',
        pointBorderWidth: 1,
        tension: 0.28,
        cubicInterpolationMode: 'monotone',
        spanGaps: true
      };
    }

    function buildDatasets() {
      const datasets = [];

      for (const stateCode of ALL_STATES) {
        if (!state.selectedStates.has(stateCode)) continue;

        const single = isSinglePHNState(stateCode);

        if (single) {
          // TAS, NT and ACT each have one PHN, so sparsest = densest.
          datasets.push(datasetFor(stateCode, 'sparse'));
          continue;
        }

        if (state.displayMode === 'both' || state.displayMode === 'sparse') {
          datasets.push(datasetFor(stateCode, 'sparse'));
        }
        if (state.displayMode === 'both' || state.displayMode === 'dense') {
          datasets.push(datasetFor(stateCode, 'dense'));
        }
      }

      return datasets;
    }

    function updateStateLegend() {
      stateLegend.textContent = '';

      for (const stateCode of ALL_STATES) {
        if (!state.selectedStates.has(stateCode)) continue;

        const item = document.createElement('span');
        item.className = 'state-legend-item';

        const swatch = document.createElement('span');
        swatch.className = 'legend-swatch';
        swatch.style.background = STATE_COLOURS[stateCode];

        const text = document.createElement('span');
        text.textContent = stateCode;

        item.append(swatch, text);
        stateLegend.appendChild(item);
      }
    }

    // ============================================================
    // BENCHMARK PLUGIN
    // ============================================================

    const benchmarkPlugin = {
      id: 'pffCoverageBenchmark',
      afterDraw(chartInstance) {
        const { ctx, chartArea, scales } = chartInstance;
        if (!chartArea || !scales?.y) return;

        const y = scales.y.getPixelForValue(SUFFICIENT_BENCHMARK);
        if (!Number.isFinite(y) || y < chartArea.top || y > chartArea.bottom) return;

        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([2, 3]);
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = '#20c9d7';
        ctx.moveTo(chartArea.left, y);
        ctx.lineTo(chartArea.right, y);
        ctx.stroke();
        ctx.restore();
      }
    };

    Chart.register(benchmarkPlugin);

    // ============================================================
    // CHART
    // ============================================================

    function formatNumber(value) {
      return Math.round(Number(value)).toLocaleString('en-AU');
    }

    function chartOptions() {
      const mobile = window.innerWidth <= 520;

      return {
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 80,
        animation: {
          duration: 550,
          easing: 'easeOutQuart'
        },
        interaction: {
          mode: 'nearest',
          intersect: false
        },
        layout: {
          padding: { top: 3, right: 5, bottom: 0, left: 0 }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            displayColors: true,
            backgroundColor: 'rgba(21, 21, 21, 0.95)',
            titleColor: '#fff',
            bodyColor: '#fff',
            borderColor: 'rgba(255,255,255,0.10)',
            borderWidth: 1,
            padding: 9,
            cornerRadius: 4,
            titleFont: { family: 'Lato', size: 11, weight: '700' },
            bodyFont: { family: 'Lato', size: 10.5, weight: '400' },
            callbacks: {
              title(items) {
                return items?.length ? String(items[0].label) : '';
              },
              label(context) {
                const ds = context.dataset;
                const stateCode = ds._stateCode || '';
                const kind = ds._kind === 'only'
                  ? 'Only PHN'
                  : ds._kind === 'sparse'
                    ? 'Sparsest'
                    : 'Densest';
                const phn = ds._phnByPoint?.[context.dataIndex] || '';
                const value = Number(context.raw);

                return [
                  `${stateCode} — ${kind}`,
                  phn,
                  `${formatNumber(value)} people per FTE`
                ];
              }
            }
          }
        },
        scales: {
          x: {
            grid: {
              color: 'rgba(105,113,138,0.10)',
              drawTicks: true
            },
            border: { color: '#151515', width: 1 },
            ticks: {
              color: '#151515',
              font: { family: 'Lato', size: mobile ? 9 : 10 },
              maxRotation: 0,
              autoSkip: true,
              maxTicksLimit: mobile ? 6 : 10
            },
            title: {
              display: true,
              text: 'Year',
              color: '#151515',
              font: { family: 'Lato', size: 10, weight: '700' },
              padding: { top: 4 }
            }
          },
          y: {
            beginAtZero: true,
            suggestedMax: 25000,
            grid: { color: 'rgba(105,113,138,0.13)' },
            border: { color: '#151515', width: 1 },
            ticks: {
              color: '#151515',
              font: { family: 'Lato', size: mobile ? 9 : 10 },
              callback(value) { return formatNumber(value); }
            },
            title: {
              display: true,
              text: 'People per FTE clinician',
              color: '#151515',
              font: { family: 'Lato', size: mobile ? 9.5 : 10.5, weight: '700' },
              padding: { bottom: 4 }
            }
          }
        }
      };
    }

    function createChart() {
      chart = new Chart(canvas, {
        type: 'line',
        data: {
          labels: state.years,
          datasets: buildDatasets()
        },
        options: chartOptions()
      });
    }

    function refreshChart() {
      updateStateLegend();
      updateStateSummary();

      if (!chart) {
        createChart();
        return;
      }

      chart.data.labels = state.years;
      chart.data.datasets = buildDatasets();
      chart.options = chartOptions();
      chart.update();
    }

    // ============================================================
    // CONTROLS
    // ============================================================

    function updateStateSummary() {
      const count = state.selectedStates.size;
      stateSummary.textContent = count === ALL_STATES.length ? 'All' : String(count);
      stateAll.checked = count === ALL_STATES.length;
      stateAll.indeterminate = count > 0 && count < ALL_STATES.length;
    }

    function buildStateControls() {
      stateOptions.textContent = '';

      for (const stateCode of ALL_STATES) {
        const label = document.createElement('label');
        label.className = 'state-option';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.dataset.state = stateCode;

        const text = document.createElement('span');
        text.textContent = `${stateCode} — ${STATE_NAMES[stateCode]}`;

        checkbox.addEventListener('change', () => {
          if (checkbox.checked) state.selectedStates.add(stateCode);
          else state.selectedStates.delete(stateCode);

          // Never allow an accidentally empty graph.
          if (state.selectedStates.size === 0) {
            checkbox.checked = true;
            state.selectedStates.add(stateCode);
          }

          refreshChart();
        });

        label.append(checkbox, text);
        stateOptions.appendChild(label);
      }

      stateAll.addEventListener('change', () => {
        const checkboxes = Array.from(stateOptions.querySelectorAll('input[data-state]'));

        if (stateAll.checked) {
          state.selectedStates = new Set(ALL_STATES);
          checkboxes.forEach(box => { box.checked = true; });
        } else {
          // Keep all selected rather than showing an empty chart.
          stateAll.checked = true;
          state.selectedStates = new Set(ALL_STATES);
          checkboxes.forEach(box => { box.checked = true; });
        }

        refreshChart();
      });

      modeButtons.forEach(button => {
        button.addEventListener('click', () => {
          const mode = button.dataset.mode;
          if (!mode || mode === state.displayMode) return;

          state.displayMode = mode;
          modeButtons.forEach(item => item.classList.toggle('active', item === button));
          refreshChart();
        });
      });
    }

    // Close the state menu when clicking elsewhere.
    document.addEventListener('click', event => {
      const details = document.getElementById('stateControl');
      if (details.open && !details.contains(event.target)) details.open = false;
    });

    window.addEventListener('resize', () => {
      if (!chart) return;
      chart.options = chartOptions();
      chart.update('none');
    });

    // ============================================================
    // STATUS
    // ============================================================

    function updateSourceStatus() {
      if (state.sourceState === 'cached') {
        liveData.classList.add('cached');
        const when = state.savedAt
          ? new Date(state.savedAt).toLocaleString('en-AU', {
              day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'
            })
          : '';
        liveText.textContent = when ? `CACHED data · ${when}` : 'CACHED data';
      } else {
        liveData.classList.remove('cached');
        liveText.textContent = 'LIVE data';
      }
    }

    // ============================================================
    // START
    // ============================================================

    async function init() {
      buildStateControls();

      try {
        await loadData();
        state.years = commonYears();

        if (!state.years.length) {
          throw new Error('No years were common to the clinician and population sheets.');
        }

        buildFixedExtremes();
        updateSourceStatus();
        loading.style.display = 'none';
        refreshChart();
      } catch (error) {
        loading.style.display = 'none';
        updateSourceStatus();
        statusEl.textContent = error?.message || 'Could not load PHN workforce data.';
      }
    }

    init();
  </script>
</body>
</html>
