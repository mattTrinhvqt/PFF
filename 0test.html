/************************************************************
 * APPLY FINAL DATASET STATE
 ************************************************************/

function applyDescriptor(
  dataset,
  descriptor
) {
  dataset.datasetRole =
    descriptor.role;


  dataset.label =
    descriptor.label;


  dataset.groupLabel =
    descriptor.groupLabel;


  dataset.data =
    descriptor.data.map(
      point => ({
        ...point
      })
    );


  dataset._hexColour =
    descriptor.colour;


  dataset._opacity =
    descriptor.opacity;


  dataset._pointHexColours =
    descriptor
      .pointColours
      ?.slice() ||
    [];


  dataset._pointOpacities =
    descriptor
      .pointOpacities
      ?.slice() ||
    [];


  dataset._metadata = {
    ...descriptor.metadata
  };


  if (
    descriptor.kind ===
    'point'
  ) {
    const hasPerPointColours =
      dataset
        ._pointHexColours
        .length ===
      dataset.data.length;


    const hasPerPointOpacities =
      dataset
        ._pointOpacities
        .length ===
      dataset.data.length;


    if (
      hasPerPointColours &&
      hasPerPointOpacities
    ) {
      dataset.pointBackgroundColor =
        dataset
          ._pointHexColours
          .map(
            (
              colour,
              index
            ) =>
              rgba(
                colour,
                dataset
                  ._pointOpacities[
                    index
                  ]
              )
          );


      dataset.pointHoverBackgroundColor =
        dataset
          ._pointHexColours
          .map(
            (
              colour,
              index
            ) =>
              rgba(
                colour,

                dataset
                  ._pointOpacities[
                    index
                  ] >
                  0
                  ? CONFIG.pointHoverOpacity
                  : 0
              )
          );


      dataset.pointBorderColor =
        dataset
          ._pointHexColours
          .map(
            (
              colour,
              index
            ) =>
              rgba(
                colour,

                dataset
                  ._pointOpacities[
                    index
                  ] >
                  0
                  ? 0.34
                  : 0
              )
          );


      dataset.pointHoverBorderColor =
        dataset
          ._pointHexColours
          .slice();


      dataset.pointRadius =
        dataset
          ._pointOpacities
          .map(
            opacity =>
              opacity >
                0
                ? CONFIG.pointRadius
                : 0
          );


      dataset.pointHoverRadius =
        dataset
          ._pointOpacities
          .map(
            opacity =>
              opacity >
                0
                ? CONFIG.pointHoverRadius
                : 0
          );


      dataset.pointHitRadius =
        dataset
          ._pointOpacities
          .map(
            opacity =>
              opacity >
                0
                ? 4
                : 0
          );
    } else {
      dataset.pointBackgroundColor =
        rgba(
          descriptor.colour,
          descriptor.opacity
        );


      dataset.pointHoverBackgroundColor =
        rgba(
          descriptor.colour,
          CONFIG.pointHoverOpacity
        );


      dataset.pointBorderColor =
        rgba(
          descriptor.colour,
          descriptor.opacity >
            0
            ? 0.34
            : 0
        );


      dataset.pointHoverBorderColor =
        descriptor.colour;


      dataset.pointRadius =
        descriptor.role ===
          'empty'
          ? 0
          : CONFIG.pointRadius;


      dataset.pointHoverRadius =
        descriptor.role ===
          'empty'
          ? 0
          : CONFIG.pointHoverRadius;


      dataset.pointHitRadius =
        descriptor.role ===
          'empty'
          ? 0
          : 4;
    }


    return;
  }


  dataset.borderColor =
    rgba(
      descriptor.colour,
      descriptor.opacity
    );


  dataset.backgroundColor =
    rgba(
      descriptor.colour,
      descriptor.opacity
    );


  dataset.borderWidth =
    descriptor.lineWidth;


  dataset.pointHitRadius =
    descriptor.role ===
      'empty'
      ? 0
      : (
          descriptor.role ===
            'regression'
            ? CONFIG.regressionHitRadius
            : CONFIG.trendHitRadius
        );


  dataset.tension =
    (
      descriptor.role ===
        'countTrend' ||
      descriptor.role ===
        'proportionTrend'
    )
      ? 0.22
      : 0;
}


/************************************************************
 * AXIS VALUES
 ************************************************************/

function getAxisValue(
  axisMode,
  majorIndex
) {
  if (
    axisMode ===
    'pay'
  ) {
    return (
      CONFIG.yMin +
      CONFIG.majorYStep *
      majorIndex
    );
  }


  if (
    axisMode ===
    'proportion'
  ) {
    return (
      100 /
      6 *
      majorIndex
    );
  }


  const axis =
    axisMode ===
      'countFte'
      ? countAxes.fte
      : countAxes.raw;


  return (
    axis.majorStep *
    majorIndex
  );
}


function getAxisTitle(
  axisMode
) {
  if (
    axisMode ===
    'pay'
  ) {
    return (
      'Advertised salary ($)'
    );
  }


  if (
    axisMode ===
    'proportion'
  ) {
    return fteAdjusted
      ? 'Proportion of FTE-adjusted job ads (%)'
      : 'Proportion of job ads (%)';
  }


  if (
    axisMode ===
    'countFte'
  ) {
    return (
      'FTE-adjusted job ads per month'
    );
  }


  return (
    'Job ads per month'
  );
}


function getAnimatedAxisValue(
  majorIndex
) {
  const fromValue =
    getAxisValue(
      axisTransition.fromView,
      majorIndex
    );


  const toValue =
    getAxisValue(
      axisTransition.toView,
      majorIndex
    );


  return (
    fromValue +
    (
      toValue -
      fromValue
    ) *
    axisTransition.progress
  );
}


/************************************************************
 * DATASET MATCHING
 ************************************************************/

function getVisiblePool(
  kind,
  datasets
) {
  return datasets
    .filter(
      dataset =>
        dataset.kind ===
          kind &&
        dataset.datasetRole !==
          'empty' &&
        dataset.data.length
    )
    .flatMap(
      dataset =>
        dataset.data
    )
    .filter(
      point =>
        Number.isFinite(
          point?.x
        ) &&
        Number.isFinite(
          point?.y
        )
    );
}


function samplePoint(
  source,
  index,
  length
) {
  if (
    !source.length
  ) {
    return {
      x:
        axisBounds.xMin,

      y:
        0.5
    };
  }


  if (
    length <=
    1
  ) {
    return source[0];
  }


  const sourceIndex =
    Math.round(
      index *
      (
        source.length -
        1
      ) /
      (
        length -
        1
      )
    );


  return source[
    sourceIndex
  ];
}


function getFallbackVisual(
  kind,
  datasets,
  targets
) {
  const current =
    datasets.find(
      dataset =>
        dataset.kind ===
          kind &&
        dataset.datasetRole !==
          'empty' &&
        dataset.data.length
    );


  const target =
    targets.find(
      descriptor =>
        descriptor.kind ===
          kind &&
        descriptor.role !==
          'empty' &&
        descriptor.data.length
    );


  return {
    currentColour:
      current
        ?._hexColour ||
      target
        ?.colour ||
      '#777777',

    targetColour:
      target
        ?.colour ||
      current
        ?._hexColour ||
      '#777777'
  };
}


function getDatasetGeometryScore(
  dataset,
  target
) {
  const currentData =
    dataset.data.filter(
      point =>
        Number.isFinite(
          point?.x
        ) &&
        Number.isFinite(
          point?.y
        )
    );


  const targetData =
    target.data.filter(
      point =>
        Number.isFinite(
          point?.x
        ) &&
        Number.isFinite(
          point?.y
        )
    );


  if (
    !currentData.length &&
    !targetData.length
  ) {
    return 0;
  }


  if (
    !currentData.length ||
    !targetData.length
  ) {
    return 100000;
  }


  const currentByX =
    new Map();


  currentData.forEach(
    point => {
      if (
        !currentByX.has(
          point.x
        )
      ) {
        currentByX.set(
          point.x,
          []
        );
      }


      currentByX
        .get(
          point.x
        )
        .push(
          point.y
        );
    }
  );


  let exactCoordinates =
    0;


  let matchingX =
    0;


  let yDifference =
    0;


  targetData.forEach(
    point => {
      const yValues =
        currentByX.get(
          point.x
        );


      if (
        !yValues
          ?.length
      ) {
        return;
      }


      matchingX++;


      const nearestDifference =
        Math.min(
          ...yValues.map(
            y =>
              Math.abs(
                y -
                point.y
              )
          )
        );


      yDifference +=
        nearestDifference;


      if (
        nearestDifference <
        1e-12
      ) {
        exactCoordinates++;
      }
    }
  );


  const maximumLength =
    Math.max(
      currentData.length,
      targetData.length,
      1
    );


  return (
    Math.abs(
      currentData.length -
      targetData.length
    ) *
    5 +

    (
      maximumLength -
      matchingX
    ) *
    10 +

    (
      maximumLength -
      exactCoordinates
    ) *
    2 +

    yDifference *
    100
  );
}


function getDatasetTargetScore(
  dataset,
  target
) {
  let score =
    getDatasetGeometryScore(
      dataset,
      target
    );


  if (
    dataset.datasetRole ===
    target.role
  ) {
    score -=
      5000;
  }


  if (
    dataset.groupLabel &&
    target.groupLabel &&
    dataset.groupLabel ===
      target.groupLabel
  ) {
    score -=
      3500;
  }


  if (
    dataset.datasetRole ===
      'salaryPoints' &&
    target.role ===
      'salaryPoints'
  ) {
    score -=
      10000;
  }


  if (
    dataset.datasetRole ===
    'empty'
  ) {
    score +=
      2000;
  }


  return score;
}


function alignTargetsToCurrentDatasets(
  targets
) {
  const aligned =
    Array(
      chart.data.datasets.length
    );


  [
    'point',
    'line'
  ].forEach(
    kind => {
      const datasetIndexes =
        chart.data.datasets
          .map(
            (
              dataset,
              index
            ) => ({
              dataset,
              index
            })
          )
          .filter(
            item =>
              item.dataset.kind ===
              kind
          );


      const nonEmptyTargets =
        targets.filter(
          target =>
            target.kind ===
              kind &&
            target.role !==
              'empty' &&
            target.data.some(
              point =>
                Number.isFinite(
                  point?.x
                ) &&
                Number.isFinite(
                  point?.y
                )
            )
        );


      const unusedIndexes =
        new Set(
          datasetIndexes.map(
            item =>
              item.index
          )
        );


      nonEmptyTargets.forEach(
        target => {
          let bestIndex =
            null;


          let bestScore =
            Infinity;


          unusedIndexes.forEach(
            index => {
              const dataset =
                chart
                  .data
                  .datasets[
                    index
                  ];


              const score =
                getDatasetTargetScore(
                  dataset,
                  target
                );


              if (
                score <
                bestScore
              ) {
                bestScore =
                  score;

                bestIndex =
                  index;
              }
            }
          );


          if (
            bestIndex !==
            null
          ) {
            aligned[
              bestIndex
            ] =
              target;


            unusedIndexes.delete(
              bestIndex
            );
          }
        }
      );


      unusedIndexes.forEach(
        index => {
          aligned[
            index
          ] =
            createEmptyDescriptor(
              kind
            );
        }
      );
    }
  );


  return aligned;
}


function getNearestPointIndex(
  source,
  target,
  usedIndexes
) {
  let exactIndex =
    -1;


  let sameXIndex =
    -1;


  let sameXDistance =
    Infinity;


  let nearestIndex =
    -1;


  let nearestDistance =
    Infinity;


  source.forEach(
    (
      point,
      index
    ) => {
      if (
        usedIndexes.has(
          index
        )
      ) {
        return;
      }


      const xDifference =
        Math.abs(
          point.x -
          target.x
        );


      const yDifference =
        Math.abs(
          point.y -
          target.y
        );


      if (
        xDifference <
          1e-9 &&
        yDifference <
          1e-12
      ) {
        exactIndex =
          index;

        return;
      }


      if (
        xDifference <
          1e-9 &&
        yDifference <
          sameXDistance
      ) {
        sameXDistance =
          yDifference;

        sameXIndex =
          index;
      }


      const distance =
        xDifference /
        Math.max(
          axisBounds.xMax -
          axisBounds.xMin,
          1
        ) +
        yDifference;


      if (
        distance <
        nearestDistance
      ) {
        nearestDistance =
          distance;

        nearestIndex =
          index;
      }
    }
  );


  if (
    exactIndex >=
    0
  ) {
    return exactIndex;
  }


  if (
    sameXIndex >=
    0
  ) {
    return sameXIndex;
  }


  return nearestIndex;
}


function buildMinimalPointPairs(
  startData,
  endData,
  startFallback,
  endFallback
) {
  const cleanStart =
    startData.filter(
      point =>
        Number.isFinite(
          point?.x
        ) &&
        Number.isFinite(
          point?.y
        )
    );


  const cleanEnd =
    endData.filter(
      point =>
        Number.isFinite(
          point?.x
        ) &&
        Number.isFinite(
          point?.y
        )
    );


  if (
    !cleanStart.length &&
    !cleanEnd.length
  ) {
    return {
      start:
        [],

      end:
        []
    };
  }


  const fallbackStart =
    cleanStart.length
      ? cleanStart
      : (
          startFallback.length
            ? startFallback
            : cleanEnd
        );


  const fallbackEnd =
    cleanEnd.length
      ? cleanEnd
      : (
          endFallback.length
            ? endFallback
            : cleanStart
        );


  const usedStartIndexes =
    new Set();


  const start =
    [];


  const end =
    [];


  cleanEnd.forEach(
    (
      targetPoint,
      targetIndex
    ) => {
      let startPoint =
        null;


      if (
        cleanStart.length
      ) {
        const sourceIndex =
          getNearestPointIndex(
            cleanStart,
            targetPoint,
            usedStartIndexes
          );


        if (
          sourceIndex >=
          0
        ) {
          usedStartIndexes.add(
            sourceIndex
          );


          startPoint =
            cleanStart[
              sourceIndex
            ];
        }
      }


      if (
        !startPoint
      ) {
        startPoint =
          samplePoint(
            fallbackStart,
            targetIndex,
            Math.max(
              cleanEnd.length,
              1
            )
          );
      }


      start.push(
        startPoint
      );


      end.push(
        targetPoint
      );
    }
  );


  if (
    !cleanEnd.length
  ) {
    cleanStart.forEach(
      (
        sourcePoint,
        index
      ) => {
        start.push(
          sourcePoint
        );


        end.push(
          samplePoint(
            fallbackEnd,
            index,
            Math.max(
              cleanStart.length,
              1
            )
          )
        );
      }
    );
  }


  return {
    start,
    end
  };
}


/************************************************************
 * CUSTOM MORPH ANIMATION
 ************************************************************/

function animateToTargets(
  targets,
  nextView,
  animate =
    true
) {
  if (
    !chart
  ) {
    return;
  }


  if (
    activeAnimationFrame
  ) {
    cancelAnimationFrame(
      activeAnimationFrame
    );


    activeAnimationFrame =
      null;
  }


  const reduceMotion =
    window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;


  const currentDatasets =
    chart.data.datasets;


  const alignedTargets =
    alignTargetsToCurrentDatasets(
      targets
    );


  const startPointPool =
    getVisiblePool(
      'point',
      currentDatasets
    );


  const startLinePool =
    getVisiblePool(
      'line',
      currentDatasets
    );


  const endPointPool =
    getVisiblePool(
      'point',

      alignedTargets.map(
        target => ({
          kind:
            target.kind,

          datasetRole:
            target.role,

          data:
            target.data
        })
      )
    );


  const endLinePool =
    getVisiblePool(
      'line',

      alignedTargets.map(
        target => ({
          kind:
            target.kind,

          datasetRole:
            target.role,

          data:
            target.data
        })
      )
    );


  const pointFallbackVisual =
    getFallbackVisual(
      'point',
      currentDatasets,
      alignedTargets
    );


  const lineFallbackVisual =
    getFallbackVisual(
      'line',
      currentDatasets,
      alignedTargets
    );


  const plans =
    currentDatasets.map(
      (
        dataset,
        index
      ) => {
        const target =
          alignedTargets[
            index
          ];


        const currentData =
          dataset.data.filter(
            point =>
              Number.isFinite(
                point?.x
              ) &&
              Number.isFinite(
                point?.y
              )
          );


        const targetData =
          target.data.filter(
            point =>
              Number.isFinite(
                point?.x
              ) &&
              Number.isFinite(
                point?.y
              )
          );


        /*
         * Salary points represent the same job rows regardless
         * of grouping. Keep their geometry fixed and change only
         * their colours and visibility.
         */
        const preserveSalaryGeometry =
          dataset.kind ===
            'point' &&
          target.role ===
            'salaryPoints' &&
          currentData.length ===
            targetData.length &&
          currentData.every(
            (
              point,
              pointIndex
            ) =>
              point.x ===
                targetData[
                  pointIndex
                ]?.x &&
              Math.abs(
                point.y -
                targetData[
                  pointIndex
                ]?.y
              ) <
                1e-12
          );


        const pairs =
          preserveSalaryGeometry
            ? {
                start:
                  currentData.map(
                    point => ({
                      ...point
                    })
                  ),

                end:
                  targetData.map(
                    point => ({
                      ...point
                    })
                  )
              }
            : buildMinimalPointPairs(
                currentData,
                targetData,

                dataset.kind ===
                  'point'
                  ? startPointPool
                  : startLinePool,

                dataset.kind ===
                  'point'
                  ? endPointPool
                  : endLinePool
              );


        const hasCurrent =
          dataset.datasetRole !==
            'empty' &&
          currentData.length;


        const hasTarget =
          target.role !==
            'empty' &&
          targetData.length;


        const fallbackVisual =
          dataset.kind ===
            'point'
            ? pointFallbackVisual
            : lineFallbackVisual;


        const startColour =
          hasCurrent
            ? dataset._hexColour
            : fallbackVisual.currentColour;


        const endColour =
          hasTarget
            ? target.colour
            : fallbackVisual.targetColour;


        const startOpacity =
          hasCurrent
            ? dataset._opacity
            : 0;


        const endOpacity =
          hasTarget
            ? target.opacity
            : 0;


        let startPointColours =
          [];


        let endPointColours =
          [];


        let startPointOpacities =
          [];


        let endPointOpacities =
          [];


        if (
          preserveSalaryGeometry
        ) {
          startPointColours =
            dataset
              ._pointHexColours
              .length ===
              currentData.length
              ? dataset
                  ._pointHexColours
                  .slice()
              : currentData.map(
                  () =>
                    dataset._hexColour
                );


          endPointColours =
            target
              .pointColours
              ?.length ===
              targetData.length
              ? target
                  .pointColours
                  .slice()
              : targetData.map(
                  () =>
                    target.colour
                );


          startPointOpacities =
            dataset
              ._pointOpacities
              .length ===
              currentData.length
              ? dataset
                  ._pointOpacities
                  .slice()
              : currentData.map(
                  () =>
                    dataset._opacity
                );


          endPointOpacities =
            target
              .pointOpacities
              ?.length ===
              targetData.length
              ? target
                  .pointOpacities
                  .slice()
              : targetData.map(
                  () =>
                    target.opacity
                );
        }


        return {
          dataset,

          target,

          start:
            pairs.start,

          end:
            pairs.end,

          preserveSalaryGeometry,

          startPointColours,

          endPointColours,

          startPointOpacities,

          endPointOpacities,

          startColour,

          endColour,

          startOpacity,

          endOpacity,

          startWidth:
            dataset.kind ===
              'line'
              ? (
                  Number(
                    dataset.borderWidth
                  ) ||
                  0
                )
              : 0,

          endWidth:
            target.kind ===
              'line'
              ? target.lineWidth
              : 0
        };
      }
    );


  const previousAxisMode =
    axisTransition.toView;


  const nextAxisMode =
    getAxisMode(
      nextView
    );


  axisTransition.fromView =
    previousAxisMode;


  axisTransition.toView =
    nextAxisMode;


  axisTransition.progress =
    previousAxisMode ===
      nextAxisMode
      ? 1
      : 0;


  interactionLocked =
    true;


  chart.tooltip
    .setActiveElements(
      [],
      {
        x:
          0,

        y:
          0
      }
    );


  function complete() {
    plans.forEach(
      plan => {
        applyDescriptor(
          plan.dataset,
          plan.target
        );
      }
    );


    axisTransition.fromView =
      nextAxisMode;


    axisTransition.toView =
      nextAxisMode;


    axisTransition.progress =
      1;


    chart.options
      .scales
      .y
      .title
      .text =
        getAxisTitle(
          nextAxisMode
        );


    chart.options
      .scales
      .y
      .title
      .color =
        '#151515';


    chart.update(
      'none'
    );


    interactionLocked =
      false;
  }


  if (
    !animate ||
    reduceMotion ||
    CONFIG.transitionMs <=
      0
  ) {
    complete();

    return;
  }


  const startedAt =
    performance.now();


  function frame(
    now
  ) {
    const rawProgress =
      Math.min(
        (
          now -
          startedAt
        ) /
        CONFIG.transitionMs,
        1
      );


    const progress =
      easeInOutCubic(
        rawProgress
      );


    axisTransition.progress =
      previousAxisMode ===
        nextAxisMode
        ? 1
        : progress;


    plans.forEach(
      plan => {
        const length =
          Math.max(
            plan.start.length,
            plan.end.length
          );


        const animatedData =
          [];


        for (
          let index =
            0;
          index <
            length;
          index++
        ) {
          const startPoint =
            plan.start[
              index
            ];


          const endPoint =
            plan.end[
              index
            ];


          animatedData.push({
            x:
              startPoint.x +
              (
                endPoint.x -
                startPoint.x
              ) *
              progress,

            y:
              startPoint.y +
              (
                endPoint.y -
                startPoint.y
              ) *
              progress
          });
        }


        plan.dataset.datasetRole =
          'transition';


        plan.dataset.data =
          animatedData;


        if (
          plan.dataset.kind ===
            'point' &&
          plan.preserveSalaryGeometry
        ) {
          const backgrounds =
            [];


          const hoverBackgrounds =
            [];


          const borders =
            [];


          const hoverBorders =
            [];


          const radii =
            [];


          const hoverRadii =
            [];


          const hitRadii =
            [];


          for (
            let index =
              0;
            index <
              animatedData.length;
            index++
          ) {
            const startColour =
              plan
                .startPointColours[
                  index
                ];


            const endColour =
              plan
                .endPointColours[
                  index
                ];


            const startOpacity =
              plan
                .startPointOpacities[
                  index
                ];


            const endOpacity =
              plan
                .endPointOpacities[
                  index
                ];


            const opacity =
              startOpacity +
              (
                endOpacity -
                startOpacity
              ) *
              progress;


            const colour =
              interpolateColour(
                startColour,
                endColour,
                progress
              );


            backgrounds.push(
              interpolateRgba(
                startColour,
                endColour,
                startOpacity,
                endOpacity,
                progress
              )
            );


            hoverBackgrounds.push(
              rgba(
                colour,

                opacity >
                  0.001
                  ? CONFIG.pointHoverOpacity
                  : 0
              )
            );


            borders.push(
              rgba(
                colour,

                opacity >
                  0.001
                  ? 0.34
                  : 0
              )
            );


            hoverBorders.push(
              colour
            );


            radii.push(
              opacity >
                0.001
                ? CONFIG.pointRadius
                : 0
            );


            hoverRadii.push(
              opacity >
                0.001
                ? CONFIG.pointHoverRadius
                : 0
            );


            hitRadii.push(
              0
            );
          }


          plan.dataset
            .pointBackgroundColor =
              backgrounds;


          plan.dataset
            .pointHoverBackgroundColor =
              hoverBackgrounds;


          plan.dataset
            .pointBorderColor =
              borders;


          plan.dataset
            .pointHoverBorderColor =
              hoverBorders;


          plan.dataset
            .pointRadius =
              radii;


          plan.dataset
            .pointHoverRadius =
              hoverRadii;


          plan.dataset
            .pointHitRadius =
              hitRadii;


          return;
        }


        const colour =
          interpolateColour(
            plan.startColour,
            plan.endColour,
            progress
          );


        const opacity =
          plan.startOpacity +
          (
            plan.endOpacity -
            plan.startOpacity
          ) *
          progress;


        if (
          plan.dataset.kind ===
          'point'
        ) {
          plan.dataset
            .pointBackgroundColor =
              interpolateRgba(
                plan.startColour,
                plan.endColour,
                plan.startOpacity,
                plan.endOpacity,
                progress
              );


          plan.dataset
            .pointHoverBackgroundColor =
              rgba(
                colour,

                opacity >
                  0.001
                  ? CONFIG.pointHoverOpacity
                  : 0
              );


          plan.dataset
            .pointBorderColor =
              rgba(
                colour,

                opacity >
                  0.001
                  ? 0.34
                  : 0
              );


          plan.dataset
            .pointHoverBorderColor =
              colour;


          plan.dataset
            .pointRadius =
              opacity >
                0.001
                ? CONFIG.pointRadius
                : 0;


          plan.dataset
            .pointHoverRadius =
              opacity >
                0.001
                ? CONFIG.pointHoverRadius
                : 0;


          plan.dataset
            .pointHitRadius =
              0;
        } else {
          /*
           * The line always interpolates from its current colour
           * directly to the target colour. No neutral grey stage
           * is inserted.
           */
          plan.dataset
            .borderColor =
              rgba(
                colour,
                opacity
              );


          plan.dataset
            .backgroundColor =
              rgba(
                colour,
                opacity
              );


          plan.dataset
            .borderWidth =
              plan.startWidth +
              (
                plan.endWidth -
                plan.startWidth
              ) *
              progress;


          plan.dataset
            .pointHitRadius =
              0;


          plan.dataset
            .tension =
              0.16;
        }
      }
    );


    const isAxisChange =
      previousAxisMode !==
      nextAxisMode;


    const axisTitleOpacity =
      isAxisChange
        ? Math.abs(
            progress *
            2 -
            1
          )
        : 1;


    chart.options
      .scales
      .y
      .title
      .text =
        progress <
          0.5
          ? getAxisTitle(
              previousAxisMode
            )
          : getAxisTitle(
              nextAxisMode
            );


    chart.options
      .scales
      .y
      .title
      .color =
        (
          `rgba(21, 21, 21, ` +
          `${axisTitleOpacity})`
        );


    chart.update(
      'none'
    );


    if (
      rawProgress <
      1
    ) {
      activeAnimationFrame =
        requestAnimationFrame(
          frame
        );
    } else {
      activeAnimationFrame =
        null;


      complete();
    }
  }


  activeAnimationFrame =
    requestAnimationFrame(
      frame
    );
}


/************************************************************
 * LEGEND
 ************************************************************/

function appendLegendItem(
  colour,
  label,
  markerType =
    'line'
) {
  const item =
    document.createElement(
      'span'
    );


  item.className =
    'legend-item';


  const marker =
    document.createElement(
      'span'
    );


  marker.className =
    markerType ===
      'square'
      ? 'legend-square'
      : 'legend-line';


  marker.style.background =
    colour;


  if (
    markerType ===
    'square'
  ) {
    marker.style.borderColor =
      colour;
  }


  const text =
    document.createElement(
      'span'
    );


  text.textContent =
    label;


  item.appendChild(
    marker
  );


  item.appendChild(
    text
  );


  chartLegend.appendChild(
    item
  );
}


function getLegendModel(
  view,
  mode
) {
  const excludedGroupCount =
    getExcludedGroupCount(
      view,
      mode
    );


  const note =
    (
      mode !==
        'none' &&
      excludedGroupCount >
        0
    )
      ? (
          view ===
            'pay'
            ? 'Groups with fewer than 20 salary points excluded'
            : 'Groups with fewer than 20 job ads excluded'
        )
      : '';


  const items =
    [];


  if (
    mode ===
    'none'
  ) {
    items.push({
      colour:
        rgba(
          '#6600ff',
          CONFIG.pointOpacity
        ),

      label:
        view ===
          'count'
          ? (
              fteAdjusted
                ? 'Monthly FTE-adjusted job ads'
                : 'Monthly job ads'
            )
          : (
              view ===
                'proportion'
                ? (
                    fteAdjusted
                      ? 'Monthly FTE-adjusted proportion'
                      : 'Monthly proportion'
                  )
                : 'Advertised salary'
            ),

      markerType:
        'square'
    });


    items.push({
      colour:
        '#f1c232',

      label:
        view ===
          'pay'
          ? 'Linear regression'
          : '13-week trailing average',

      markerType:
        'line'
    });
  } else {
    getGroupedRows(
      view,
      mode
    ).forEach(
      group => {
        items.push({
          colour:
            group.colour,

          label:
            group.label,

          markerType:
            'square'
        });
      }
    );
  }


  return {
    items,

    note,

    signature:
      JSON.stringify(
        items
      )
  };
}


function renderLegendItems(
  items
) {
  chartLegend.textContent =
    '';


  items.forEach(
    item => {
      appendLegendItem(
        item.colour,
        item.label,
        item.markerType
      );
    }
  );
}


function updateLegendNote(
  note
) {
  legendNote.textContent =
    note;


  legendNote
    .classList
    .toggle(
      'is-hidden',
      !note
    );
}


function updateLegend(
  view,
  mode,
  animate =
    true
) {
  const model =
    getLegendModel(
      view,
      mode
    );


  updateLegendNote(
    model.note
  );


  /*
   * A matching signature means the text, marker type and colours
   * are already identical. Keep the existing legend in place.
   */
  if (
    model.signature ===
    currentLegendSignature
  ) {
    return;
  }


  const token =
    ++legendAnimationToken;


  chartLegend
    .getAnimations()
    .forEach(
      animation =>
        animation.cancel()
    );


  const reduceMotion =
    window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;


  if (
    !animate ||
    reduceMotion ||
    !chartLegend.animate
  ) {
    renderLegendItems(
      model.items
    );


    currentLegendSignature =
      model.signature;


    chartLegend.style.opacity =
      '';


    return;
  }


  const fadeOut =
    chartLegend.animate(
      [
        {
          opacity:
            1
        },

        {
          opacity:
            0
        }
      ],

      {
        duration:
          170,

        easing:
          'ease-out',

        fill:
          'forwards'
      }
    );


  fadeOut.finished
    .then(
      () => {
        if (
          token !==
          legendAnimationToken
        ) {
          return;
        }


        fadeOut.cancel();


        renderLegendItems(
          model.items
        );


        currentLegendSignature =
          model.signature;


        const fadeIn =
          chartLegend.animate(
            [
              {
                opacity:
                  0
              },

              {
                opacity:
                  1
              }
            ],

            {
              duration:
                270,

              easing:
                'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );


        fadeIn.finished
          .then(
            () =>
              fadeIn.cancel()
          )
          .catch(
            () => {}
          );
      }
    )
    .catch(
      () => {
        if (
          token !==
          legendAnimationToken
        ) {
          return;
        }


        renderLegendItems(
          model.items
        );


        currentLegendSignature =
          model.signature;
      }
    );
}


/************************************************************
 * GROUPING
 ************************************************************/

function applyGrouping(
  mode,
  animate =
    true
) {
  if (
    interactionLocked
  ) {
    return;
  }


  const previousView =
    activeView;


  currentGroup =
    mode;


  syncActiveView();


  updateMetricToggles();


  fadeTextChange(
    groupValue,
    GROUP_LABELS[
      mode
    ]
  );


  if (
    previousView !==
    activeView
  ) {
    fadeTextChange(
      chartHeading,
      getHeadingText(
        activeView
      )
    );
  }


  groupOptions.forEach(
    option => {
      option.checked =
        option.value ===
        mode;
    }
  );


  updateLegend(
    activeView,
    mode,
    animate
  );


  animateToTargets(
    buildTargetDescriptors(
      activeView,
      mode
    ),

    activeView,

    animate
  );
}


/************************************************************
 * INTERACTION
 ************************************************************/

function findInteractiveElement(
  elements
) {
  return elements.find(
    element => {
      const role =
        chart
          .data
          .datasets[
            element.datasetIndex
          ]
          ?.datasetRole;


      return (
        role ===
          'countPoints' ||
        role ===
          'countTrend' ||
        role ===
          'proportionPoints' ||
        role ===
          'proportionTrend' ||
        role ===
          'salaryPoints' ||
        role ===
          'regression'
      );
    }
  );
}


function handleChartHover(
  event,
  elements
) {
  if (
    interactionLocked
  ) {
    chart.canvas.style.cursor =
      'default';


    return;
  }


  chart.canvas.style.cursor =
    findInteractiveElement(
      elements
    )
      ? 'pointer'
      : 'default';
}


function handleChartClick(
  event,
  elements
) {
  if (
    interactionLocked
  ) {
    return;
  }


  if (
    event
      ?.native
      ?.preventDefault
  ) {
    event
      .native
      .preventDefault();
  }


  window
    .getSelection
    ?.()
    ?.removeAllRanges
    ?.();


  chart.canvas.blur();


  const interactiveElement =
    findInteractiveElement(
      elements
    );


  if (
    !interactiveElement
  ) {
    chart.tooltip
      .setActiveElements(
        [],
        {
          x:
            0,

          y:
            0
        }
      );


    chart.update(
      'none'
    );


    return;
  }


  const renderedElement =
    chart
      .getDatasetMeta(
        interactiveElement
          .datasetIndex
      )
      ?.data
      ?.[
        interactiveElement
          .index
      ];


  chart.tooltip
    .setActiveElements(
      [
        {
          datasetIndex:
            interactiveElement
              .datasetIndex,

          index:
            interactiveElement
              .index
        }
      ],

      {
        x:
          Number.isFinite(
            event.x
          )
            ? event.x
            : (
                renderedElement
                  ?.x ??
                0
              ),

        y:
          Number.isFinite(
            event.y
          )
            ? event.y
            : (
                renderedElement
                  ?.y ??
                0
              )
      }
    );


  chart.update(
    'none'
  );
}

const sourceMilestonePlugin = {
  id:
    'sourceMilestonePlugin',


  afterDatasetsDraw(
    activeChart
  ) {
    const xScale =
      activeChart.scales.x;


    const area =
      activeChart.chartArea;


    if (
      !xScale ||
      !area
    ) {
      return;
    }


    const context =
      activeChart.ctx;


    const events = [
      {
        date:
          Date.UTC(
            2025,
            11,
            1
          ),

        label:
          'EssiLux jobs added'
      },

      {
        date:
          Date.UTC(
            2026,
            6,
            1
          ),

        label:
          'Indeed jobs added'
      }
    ];


    context.save();


    context.fillStyle =
      'rgba(105, 113, 138, 0.76)';


    context.font =
      '400 9px Lato, sans-serif';


    context.textAlign =
      'left';


    context.textBaseline =
      'top';


    context.fillText(
      'SEEK jobs only',
      area.left +
        4,
      area.top +
        5
    );


    events.forEach(
      event => {
        const x =
          xScale.getPixelForValue(
            event.date
          );


        if (
          x <
            area.left ||
          x >
            area.right
        ) {
          return;
        }


        context.save();


        context.beginPath();


        context.setLineDash(
          [
            4,
            4
          ]
        );


        context.strokeStyle =
          'rgba(105, 113, 138, 0.26)';


        context.lineWidth =
          1;


        context.moveTo(
          x,
          area.top
        );


        context.lineTo(
          x,
          area.bottom
        );


        context.stroke();


        context.setLineDash(
          []
        );


        context.translate(
          x +
            5,
          area.top +
            100
        );


        context.rotate(
          -Math.PI /
          2
        );


        context.fillStyle =
          'rgba(105, 113, 138, 0.58)';


        context.font =
          '400 9px Lato, sans-serif';


        context.textAlign =
          'left';


        context.textBaseline =
          'middle';


        context.fillText(
          event.label,
          0,
          0
        );


        context.restore();
      }
    );


    context.restore();
  }
};

                color(
                  context
                ) {
                  const index =
                    context.index ??
                    0;


                  return index %
                    2 ===
                    0
                      ? 'rgba(105, 113, 138, 0.075)'
                      : 'rgba(105, 113, 138, 0.035)';
                },


                lineWidth(
                  context
                ) {
                  const index =
                    context.index ??
                    0;


                  return index %
                    2 ===
                    0
                      ? 1
                      : 0.7;
                },


                drawTicks:
                  true,


                tickLength(
                  context
                ) {
                  const index =
                    context.index ??
                    0;


                  return index %
                    2 ===
                    0
                      ? 5
                      : 1.5;
                },


                tickColor:
                  '#151515',


                tickWidth:
                  1.1
              },


              border: {
                display:
                  true,

                color:
                  '#151515',

                width:
                  1.1
              }
            }
          }
        },


        plugins: [
          sourceMilestonePlugin
        ]
      }
    );


  const initialTargets =
    buildTargetDescriptors(
      activeView,
      currentGroup
    );


  chart.data.datasets
    .forEach(
      (
        dataset,
        index
      ) => {
        applyDescriptor(
          dataset,
          initialTargets[
            index
          ]
        );
      }
    );


  chart.update(
    'none'
  );
}


/************************************************************
 * TEXT AND TAB ANIMATIONS
 ************************************************************/

function updateTabIndicator(
  animate =
    true
) {
  const activeTab =
    chartTabs.find(
      tab =>
        tab.dataset.view ===
        selectedTab
    );


  if (
    !tabList ||
    !activeTab
  ) {
    return;
  }


  if (
    !animate
  ) {
    tabList.classList.add(
      'is-positioning'
    );
  }


  tabList.style.setProperty(
    '--tab-indicator-x',
    `${activeTab.offsetLeft}px`
  );


  tabList.style.setProperty(
    '--tab-indicator-width',
    `${activeTab.offsetWidth}px`
  );


  if (
    !animate
  ) {
    requestAnimationFrame(
      () => {
        tabList.classList.remove(
          'is-positioning'
        );
      }
    );
  }
}


function fadeTextChange(
  element,
  nextText
) {
  if (
    !element ||
    element.textContent ===
      nextText
  ) {
    return;
  }


  const reduceMotion =
    window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;


  if (
    reduceMotion ||
    !element.animate
  ) {
    element.textContent =
      nextText;


    return;
  }


  const fadeOut =
    element.animate(
      [
        {
          opacity:
            1
        },

        {
          opacity:
            0
        }
      ],

      {
        duration:
          170,

        easing:
          'ease-out',

        fill:
          'forwards'
      }
    );


  fadeOut.finished
    .then(
      () => {
        fadeOut.cancel();


        element.textContent =
          nextText;


        const fadeIn =
          element.animate(
            [
              {
                opacity:
                  0
              },

              {
                opacity:
                  1
              }
            ],

            {
              duration:
                260,

              easing:
                'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );


        fadeIn.finished
          .then(
            () =>
              fadeIn.cancel()
          )
          .catch(
            () => {}
          );
      }
    )
    .catch(
      () => {
        element.textContent =
          nextText;
      }
    );
}


/************************************************************
 * MENU AND VIEW SWITCHING
 ************************************************************/

function setGroupMenuOpen(
  isOpen
) {
  groupMenu
    .classList
    .toggle(
      'is-open',
      isOpen
    );


  groupButton.setAttribute(
    'aria-expanded',
    String(
      isOpen
    )
  );
}


function switchView(
  nextView
) {
  if (
    nextView ===
      selectedTab ||
    interactionLocked
  ) {
    return;
  }


  selectedTab =
    nextView;


  syncActiveView();


  chartTabs.forEach(
    tab => {
      const isActive =
        tab.dataset.view ===
        selectedTab;


      tab.classList.toggle(
        'is-active',
        isActive
      );


      tab.setAttribute(
        'aria-selected',
        String(
          isActive
        )
      );
    }
  );


  fadeTextChange(
    chartHeading,
    getHeadingText(
      activeView
    )
  );


  fadeTextChange(
    groupMenuTitle,
    getGroupMenuText()
  );


  updateMetricToggles();


  updateTabIndicator(
    true
  );


  updateLegend(
    activeView,
    currentGroup,
    true
  );


  setGroupMenuOpen(
    false
  );


  animateToTargets(
    buildTargetDescriptors(
      activeView,
      currentGroup
    ),

    activeView,

    true
  );
}


/************************************************************
 * CONTROL EVENTS
 ************************************************************/

fteToggle.addEventListener(

    ) {

      )

    );

      ),

      true
    );
  }

proportionToggle.addEventListener(
  'click',
  () => {
    if (
      interactionLocked ||
      selectedTab !==
        'count' ||
      currentGroup ===
        'none'
    ) {
      return;
    }


    countAsProportion =
      !countAsProportion;


    syncActiveView();


    updateMetricToggles();


    fadeTextChange(
      chartHeading,
      getHeadingText(
        activeView
      )
    );


    updateLegend(
      activeView,
      currentGroup,
      true
    );


    animateToTargets(
      buildTargetDescriptors(
        activeView,
        currentGroup
      ),

      activeView,

      true
    );
  }
);


chartTabs.forEach(
  tab => {
    tab.addEventListener(
      'click',
      () => {
        switchView(
          tab.dataset.view
        );
      }
    );
  }
);


groupButton.addEventListener(
  'click',
  event => {
    event.stopPropagation();


    setGroupMenuOpen(
      !groupMenu
        .classList
        .contains(
          'is-open'
        )
    );
  }
);


groupMenu.addEventListener(
  'click',
  event => {
    event.stopPropagation();
  }
);


groupOptions.forEach(
  option => {
    option.addEventListener(
      'change',
      () => {
        if (
          !option.checked
        ) {
          return;
        }


        applyGrouping(
          option.value,
          true
        );


        setGroupMenuOpen(
          false
        );
      }
    );
  }
);


document.addEventListener(
  'pointerdown',
  event => {
    if (
      !event.target.closest(
        '.group-control'
      )
    ) {
      setGroupMenuOpen(
        false
      );
    }
  }
);


document.addEventListener(
  'keydown',
  event => {
    if (
      event.key ===
      'Escape'
    ) {
      setGroupMenuOpen(
        false
      );
    }
  }
);


chartCanvas.addEventListener(
  'contextmenu',
  event => {
    event.preventDefault();
  }
);


chartCanvas.addEventListener(
  'selectstart',
  event => {
    event.preventDefault();
  }
);


/************************************************************
 * LOAD
 ************************************************************/

async function loadCharts() {
  setStatus();


  let lastError =
    null;


  for (
    let attempt =
      1;
    attempt <=
      CONFIG.fetchAttempts;
    attempt++
  ) {
    try {
      const sourceRows =
        await loadSheetRows();


      rows =
        normaliseRows(
          sourceRows
        );


      if (
        !rows.length
      ) {
        throw new Error(
          'No valid non-repeat job ads were found'
        );
      }


      saveCache(
        rows
      );


      prepareChart();


      hideLoadingState();


      setStatus();


      return;
    } catch (
      error
    ) {
      lastError =
        error;


      if (
        attempt <
        CONFIG.fetchAttempts
      ) {
        await new Promise(
          resolve => {
            window.setTimeout(
              resolve,
              CONFIG.retryDelayMs
            );
          }
        );
      }
    }
  }


  const cachedRows =
    loadCache();


  if (
    cachedRows.length
  ) {
    rows =
      cachedRows;


    prepareChart();


    hideLoadingState();


    setStatus(
      'Live data could not be refreshed; showing the most recently saved data'
    );


    return;
  }


  console.error(
    lastError
  );


  hideLoadingState();


  setStatus(
    '⚠ ' +
    String(
      lastError?.message ||
      'Unable to load job ad data'
    ).replace(
      /\.+$/,
      ''
    )
  );
}


function prepareChart() {
  salaryRows =
    rows.filter(
      row =>
        Number.isFinite(
          row.salary
        ) &&
        row.salary >
          0
    );


  axisBounds =
    calculateAxisBounds(
      rows
    );


  countAxes = {
    raw:
      calculateCountAxis(
        false
      ),

    fte:
      calculateCountAxis(
        true
      )
  };


  syncActiveView();


  updateMetricToggles();


  axisTransition.fromView =
    getAxisMode(
      activeView
    );


  axisTransition.toView =
    getAxisMode(
      activeView
    );


  axisTransition.progress =
    1;


  createChart();


  updateLegend(
    activeView,
    currentGroup,
    false
  );
}


/************************************************************
 * INITIALISE
 ************************************************************/

syncActiveView();


updateMetricToggles();


updateLegend(
  activeView,
  currentGroup,
  false
);


updateTabIndicator(
  false
);


if (
  document.fonts
    ?.ready
) {
  document.fonts.ready
    .then(
      () => {
        updateTabIndicator(
          false
        );
      }
    );
}


window.addEventListener(
  'resize',
  () => {
    updateTabIndicator(
      false
    );
  }
);


loadCharts();
</script>
