      position: absolute;

        max-width: min(220px, calc(100% - 62px));

    }

    let rows = [];
    let chart = null;
    let activeView = 'patients';
    let currentLegendSignature = '';
    let legendAnimationToken = 0;
    let axisFadeFrame = null;
    let axisFadeOpacity = 1;
    let spineTransitionFrame = null;
    let viewSwitchLocked = false;
    let chartNoteDismissed = false;
    let tabsController = null;
    let legendScrollController = null;
    let chartInteractionController = null;
    let responsiveController = null;

    const spineTransitionState = {
      active: false,
      left: NaN,
      right: NaN,
      top: NaN,
      bottom: NaN
    };

    const patientsDistributionState = {
      median: NaN,
      q1: NaN,
      q3: NaN,
      count: 0
    };

    function animateAxisOpacity(
      from,
      to,
      duration,
      onComplete
    ) {
      if (axisFadeFrame !== null) {
        cancelAnimationFrame(
          axisFadeFrame
        );

        axisFadeFrame = null;
      }

      const reduceMotion =
        PFF.reducedMotion();

      if (
        reduceMotion ||
        duration <= 0
      ) {
        axisFadeOpacity = to;
        chart?.draw();
        onComplete?.();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        const progress =
          Math.min(
            (
              now -
              startedAt
            ) /
            duration,
            1
          );

        const eased =
          PFFCharts
            .easeOutCubic(
              progress
            );

        axisFadeOpacity =
          from +
          (
            to - from
          ) *
          eased;

        chart?.draw();

        if (progress < 1) {
          axisFadeFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          axisFadeFrame = null;
          axisFadeOpacity = to;
          chart?.draw();
          onComplete?.();
        }
      }

      axisFadeFrame =
        requestAnimationFrame(
          frame
        );
    }

    function copyChartArea(
      area
    ) {
      if (!area) {
        return null;
      }

      const copy = {
        left:
          Number(area.left),

        right:
          Number(area.right),

        top:
          Number(area.top),

        bottom:
          Number(area.bottom)
      };

      return Object.values(copy).every(
        Number.isFinite
      )
        ? copy
        : null;
    }

    function setSpineGeometry(
      area
    ) {
      const geometry =
        copyChartArea(
          area
        );

      if (!geometry) {
        return;
      }

      spineTransitionState.left =
        geometry.left;

      spineTransitionState.right =
        geometry.right;

      spineTransitionState.top =
        geometry.top;

      spineTransitionState.bottom =
        geometry.bottom;
    }

    function animateSpineGeometry(
      fromArea,
      toArea,
      duration,
      onComplete
    ) {
      if (
        spineTransitionFrame !==
        null
      ) {
        cancelAnimationFrame(
          spineTransitionFrame
        );

        spineTransitionFrame =
          null;
      }

      const from =
        copyChartArea(
          fromArea
        );

      const to =
        copyChartArea(
          toArea
        );

      if (!from || !to) {
        spineTransitionState.active =
          false;

        setSpineGeometry(
          to ||
          from
        );

        chart?.draw();
        onComplete?.();
        return;
      }

      const reduceMotion =
        PFF.reducedMotion();

      spineTransitionState.active =
        true;

      setSpineGeometry(
        from
      );

      if (
        reduceMotion ||
        duration <= 0
      ) {
        setSpineGeometry(
          to
        );

        spineTransitionState.active =
          false;

        chart?.draw();
        onComplete?.();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        const progress =
          Math.min(
            (
              now -
              startedAt
            ) /
            duration,
            1
          );

        const eased =
          PFFCharts
            .easeInOutCubic(
              progress
            );

        spineTransitionState.left =
          from.left +
          (
            to.left -
            from.left
          ) *
          eased;

        spineTransitionState.right =
          from.right +
          (
            to.right -
            from.right
          ) *
          eased;

        spineTransitionState.top =
          from.top +
          (
            to.top -
            from.top
          ) *
          eased;

        spineTransitionState.bottom =
          from.bottom +
          (
            to.bottom -
            from.bottom
          ) *
          eased;

        chart?.draw();

        if (progress < 1) {
          spineTransitionFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          spineTransitionFrame =
            null;

          setSpineGeometry(
            to
          );

          spineTransitionState.active =
            false;

          chart?.draw();
          onComplete?.();
        }
      }

      spineTransitionFrame =
        requestAnimationFrame(
          frame
        );
    }

    function formatPercentage(
      value,
      maximumFractionDigits = 1
    ) {
      return Number.isFinite(
        Number(value)
      )
        ? (
            formatNumber(
              value,
              maximumFractionDigits
            ) +
            '%'
          )
        : '—';
    }

    function titleCaseSpecialty(
      value
    ) {
      return cleanText(value)
        .split(' ')
        .map(
          word =>
            word
              ? (
                  word.charAt(0)
                    .toUpperCase() +
                  word
                    .slice(1)
                    .toLowerCase()
                )
              : ''
        )
        .join(' ');
    }

    function canonicalSpecialty(
      value
    ) {
      const original =
        cleanText(value);

      const text =
        normaliseText(value)
          .replace(/\s*\/\s*/g, ' / ')
          .replace(/\s*-\s*/g, '-')
          .replace(/\s+/g, ' ')
          .trim();

      if (!text) {
        return null;
      }

      if (
        text.includes(
          'none'
        ) ||
        text.includes(
          'routine eye exam'
        ) ||
        text ===
          'routine'
      ) {
        return (
          'None – routine eye exams'
        );
      }

      if (
        text ===
          'multiple' ||
        text.includes(
          'multiple specialties'
        )
      ) {
        return null;
      }

      if (
        text.includes(
          'myopia'
        )
      ) {
        return 'Myopia control';
      }

      if (
        text.includes(
          'advanced contact'
        ) ||
        text.includes(
          'specialty contact'
        ) ||
        text.includes(
          'speciality contact'
        )
      ) {
        return (
          'Advanced contact lenses'
        );
      }

      if (
        text.includes(
          'behaviour'
        ) ||
        text.includes(
          'behavior'
        ) ||
        text.includes(
          'paediatric'
        ) ||
        text.includes(
          'pediatric'
        )
      ) {
        return (
          'Behavioural / paediatric'
        );
      }

      if (
        text.includes(
          'low-vision'
        ) ||
        text.includes(
          'low vision'
        )
      ) {
        return 'Low-vision';
      }

      if (
        text.includes(
          'dry-eye'
        ) ||
        text.includes(
          'dry eye'
        ) ||
        text.includes(
          'dryeye'
        )
      ) {
        return 'Dry-eye';
      }

      return titleCaseSpecialty(
        original
      );
    }

    function parseSpecialtyServices(
      value
    ) {
      const text =
        cleanText(value);

      const normalised =
        normaliseText(value);

      const missingResponseValues =
        new Set([
          '',
          'x',
          'xx',
          'xxx',
          'n/a',
          'na',
          'not collected',
          'not asked',
          'unspecified'
        ]);

      if (
        !text ||
        missingResponseValues.has(
          normalised
        )
      ) {
        return {
          hasResponse: false,
          services: [],
          multiple: false,
          none: false
        };
      }

      const parts =
        text
          .split(
            /\s*(?:;|\||\n|\r)\s*/
          )
          .map(
            canonicalSpecialty
          )
          .filter(Boolean);

      const unique =
        [
          ...new Set(parts)
        ];

      const nonRoutine =
        unique.filter(
          service =>
            service !==
            'None – routine eye exams'
        );

      const hasRoutineOnly =
        nonRoutine.length === 0 &&
        unique.includes(
          'None – routine eye exams'
        );

      return {
        hasResponse: true,

        services:
          hasRoutineOnly
            ? [
                'None – routine eye exams'
              ]
            : nonRoutine,

        multiple:
          nonRoutine.length > 1,

        none:
          hasRoutineOnly
      };
    }

    function buildHistogram(
      values
    ) {
      if (!values.length) {
        return {
          bins: [],
          minimum: -0.5,
          maximum: 2.5,
          finalTick: 2
        };
      }

      const maximumObserved =
        Math.max(...values);

      let finalTick =
        Math.max(
          2,
          Math.ceil(
            maximumObserved
          )
        );

      if (finalTick % 2 !== 0) {
        finalTick += 1;
      }

      const bins =
        Array.from(
          {
            length:
              finalTick + 1
          },
          (
            _,
            value
          ) => ({
            x: value,
            count: 0
          })
        );

      values.forEach(value => {
        const roundedValue =
          clamp(
            Math.round(value),
            0,
            finalTick
          );

        bins[
          roundedValue
        ].count += 1;
      });

      return {
        bins,
        minimum: -0.5,
        maximum:
          finalTick + 0.5,
        finalTick
      };
    }

    function liveRowsForBrowserCache(
      table
    ) {
      return (
        table?.rows ||
        []
      )
        .map(
          rawRow => {
            const cells =
              rawRow?.c ||
              [];

            return [
              getCellValue(
                cells[0]
              ),
              getCellValue(
                cells[1]
              ),
              getCellValue(
                cells[2]
              )
            ];
          }
        )
        .filter(
          row =>
            Boolean(
              cleanText(
                row?.[0]
              )
            )
        );
    }

    function remoteRowsForBrowserCache(
      payload
    ) {
      return (
        Array.isArray(
          payload?.data?.rows
        )
          ? payload.data.rows
          : []
      )
        .map(
          row => [
            row?.[0] ??
              '',
            row?.[1] ??
              '',
            row?.[2] ??
              ''
          ]
        )
        .filter(
          row =>
            Boolean(
              cleanText(
                row?.[0]
              )
            )
        );
    }

    function normaliseRows(
      sourceRows
    ) {
      return (
        Array.isArray(
          sourceRows
        )
          ? sourceRows
          : []
      )
        .map(
          (
            sourceRow,
            sourceIndex
          ) => {
            const responseKey =
              cleanText(
                sourceRow?.[0]
              );

            return {
              sourceIndex,
              responseKey,

              patientsPerDay:
                toNumber(
                  sourceRow?.[1]
                ),

              specialtyText:
                cleanText(
                  sourceRow?.[2]
                )
            };
          }
        )
        .filter(
          row =>
            Boolean(
              row.responseKey
            )
        );
    }

    function setLoadedSourceIndicator(
      loaded
    ) {
      const source =
        loaded?.source;

      const remote =
        Boolean(
          loaded?.remote
        );

      if (
        source ===
        'live'
      ) {
        PFF.setDataSourceIndicator(
          'live',
          {
            indicator:
              dataSourceIndicator,

            text:
              dataSourceText
          }
        );

        return;
      }

      if (
        source ===
        'cached'
      ) {
        PFF.setDataSourceIndicator(
          'cached',
          {
            indicator:
              dataSourceIndicator,

            text:
              dataSourceText
          }
        );

        if (dataSourceText) {
          dataSourceText.textContent =
            remote
              ? 'BACKEND cache'
              : 'BROWSER cache';
        }

        dataSourceIndicator
          ?.setAttribute(
            'aria-label',
            remote
              ? 'Backend cached data'
              : 'Browser cached data'
          );

        return;
      }

      PFF.setDataSourceIndicator(
        'unavailable',
        {
          indicator:
            dataSourceIndicator,

          text:
            dataSourceText
        }
      );
    }

    async function loadRowsWithFallback() {
      let liveError =
        null;

      let remoteError =
        null;

      const loaded =
        await PFFCharts
          .loadLiveCacheFallback({
            forceCached:
              FORCE_CACHED_DATA,

            cacheKey:
              CONFIG
                .localCacheKey,

            minRows:
              CONFIG
                .minimumRows,

            loadLive:
              () =>
                PFFCharts
                  .loadGVizSheet({
                    sheetId:
                      CONFIG
                        .sheetId,

                    sheetName:
                      CONFIG
                        .sheetName,

                    range:
                      CONFIG
                        .range,

                    headers:
                      '1',

                    query:
                      'select A,D,F where A is not null',

                    timeoutMs:
                      CONFIG
                        .fetchTimeoutMs
                  }),

            parseLive:
              liveRowsForBrowserCache,

            loadRemoteCache:
              () =>
                PFFCharts
                  .loadAppsScriptCache({
                    url:
                      CACHE_WEB_APP_URL,

                    appKey:
                      CACHE_APP_KEY,

                    timeoutMs:
                      CACHE_FETCH_TIMEOUT_MS
                  }),

            parseRemoteCache:
              remoteRowsForBrowserCache,

            onLiveError(
              error
            ) {
              liveError =
                error;

              console.warn(
                'Live Google Sheets data could not be used',
                error
              );
            },

            onRemoteCacheError(
              error
            ) {
              remoteError =
                error;

              console.warn(
                'Permanent Legacy backend cache could not be used',
                error
              );
            }
          });

      const restoredRows =
        normaliseRows(
          loaded.rows
        );

      if (
        restoredRows.length <
        CONFIG.minimumRows
      ) {
        throw new Error(
          'No permanent optometrist rows were found in columns A, D and F'
        );
      }

      if (
        loaded.source ===
          'cached' &&
        !loaded.remote &&
        liveError &&
        remoteError
      ) {
        console.warn(
          'Using browser cache after both live and backend cache failed.'
        );
      }

      return {
        ...loaded,
        rows:
          restoredRows
      };
    }

    function createPatientsView() {
      const values =
        rows
          .map(
            row =>
              row.patientsPerDay
          )
          .filter(
            value =>
              Number.isFinite(
                value
              ) &&
              value >=
                CONFIG.minimumPatientsPerDay &&
              value <=
                CONFIG.maximumPatientsPerDay
          );

      const statistics =
        calculateStatistics(
          values
        );

      patientsDistributionState.median =
        statistics.median;

      patientsDistributionState.q1 =

    function createSpecialtyView() {
      const specialtyResponses =
        rows
          .map(row => ({
            row,

            parsed:
              parseSpecialtyServices(
                row.specialtyText
              )
          }))
          .filter(
            response =>
              response
                .parsed
                .hasResponse
          );

      const totalSpecialtyResponses =
        specialtyResponses.length;

      const counts =
        new Map();

      specialtyResponses.forEach(
        response => {
          const parsed =
            response.parsed;

          parsed.services.forEach(
            service => {
              counts.set(
                service,
                (
                  counts.get(
                    service
                  ) ||
                  0
                ) +
                1
              );
            }
          );

          if (parsed.multiple) {
            counts.set(
              'Multiple',
              (
                counts.get(
                  'Multiple'
                ) ||
                0
              ) +
              1
            );
          }
        }
      );

      const denominator =
        Math.max(
          1,
          totalSpecialtyResponses
        );

      const categoryItems =
        [
          ...counts.entries()
        ]
          .map(
            (
              [
                label,
                count
              ]
            ) => ({
              label,
              count,

              percentage:
                count /
                denominator *
                100
            })
          );

      const descendingSpecialties =
        categoryItems
          .filter(
            item =>
              item.label !==
                'Multiple' &&
              item.label !==
                'None – routine eye exams'

          .sort(
            (
              first,
              second

              second.percentage -

    function drawLegacyAxisTicks(
      context,
      scale,
      axis,
      isMajorTick
    ) {
      if (!scale) {
        return;
      }

      const ticks =
        scale.ticks ||
        [];

      if (!ticks.length) {
        return;
      }

      context.save();
      context.globalAlpha =
        clamp(
          axisFadeOpacity,
          0,
          1
        );
      context.lineCap =
        'butt';
      context.strokeStyle =
        COLOURS.ink;

      ticks.forEach(
        (
          tick,
          index
        ) => {
          const value =
            Number(
              tick.value
            );

          const pixel =
            scale.getPixelForTick(
              index
            );

          if (
            !Number.isFinite(
              value
            ) ||
            !Number.isFinite(
              pixel
            )
          ) {
            return;
          }

          const major =
            isMajorTick(
              value
            );

          const tickLength =
            major
              ? 6
              : 2;

          context.beginPath();
          context.lineWidth =
            major
              ? 1
              : 0.7;

          if (axis === 'x') {
            context.moveTo(
              pixel,
              scale.top
            );

            context.lineTo(
              pixel,
              scale.top +
              tickLength
            );
          } else {
            context.moveTo(
              scale.right,
              pixel
            );

            context.lineTo(
              scale.right -
              tickLength,
              pixel
            );
          }

          context.stroke();
        }
      );

      context.restore();
    }

    /*
     * Fade Chart.js-rendered axis labels, titles and grid lines
     * without changing their configured colours. The canvas state
     * is restored before datasets are drawn, so bars, lines, the
     * IQR band and specialty value labels remain fully opaque.
     */
    const axisScaleFadePlugin = {
      id:
        'axisScaleFadePlugin',

      beforeDraw(
        activeChart
      ) {
        const context =
          activeChart.ctx;

        context.save();

        context.globalAlpha =
          clamp(
            axisFadeOpacity,
            0,
            1
          );

        activeChart
          .$axisScaleFadeContextSaved =
          true;
      },

      beforeDatasetsDraw(
        activeChart
      ) {
        if (
          !activeChart
            .$axisScaleFadeContextSaved
        ) {
          return;
        }

        activeChart.ctx.restore();

        activeChart
          .$axisScaleFadeContextSaved =
          false;
      },

      /*
       * Safety restoration in case Chart.js exits the normal
       * drawing sequence before beforeDatasetsDraw is called.
       */
      afterDraw(
        activeChart
      ) {
        if (
          !activeChart
            .$axisScaleFadeContextSaved
        ) {
          return;
        }

        activeChart.ctx.restore();

        activeChart
          .$axisScaleFadeContextSaved =
          false;
      }
    };

    const constantSpinePlugin = {
      id:
        'constantSpinePlugin',

      afterDatasetsDraw(
        activeChart
      ) {
        const area =
          activeChart.chartArea;

        if (!area) {
          return;
        }

        const left =
          spineTransitionState.active &&
          Number.isFinite(
            spineTransitionState.left
          )
            ? spineTransitionState.left
            : area.left;

        const right =
          spineTransitionState.active &&
          Number.isFinite(
            spineTransitionState.right
          )
            ? spineTransitionState.right
            : area.right;

        const top =
          spineTransitionState.active &&
          Number.isFinite(
            spineTransitionState.top
          )
            ? spineTransitionState.top
            : area.top;

        const bottom =
          spineTransitionState.active &&
          Number.isFinite(
            spineTransitionState.bottom
          )
            ? spineTransitionState.bottom
            : area.bottom;

        const context =
          activeChart.ctx;

        context.save();
        context.globalAlpha = 1;
        context.strokeStyle =
          COLOURS.ink;
        context.lineWidth = 1;
        context.lineCap = 'butt';

        context.beginPath();
        context.moveTo(
          left,
          bottom
        );
        context.lineTo(
          right,
          bottom
        );
        context.stroke();

        context.beginPath();
        context.moveTo(
          left,
          top
        );
        context.lineTo(
          left,
          bottom
        );
        context.stroke();

        context.restore();
      }
    };

    const legacyAxisTickPlugin = {
      id:
        'legacyAxisTickPlugin',

      afterDatasetsDraw(
        activeChart
      ) {
        if (

          'patients'

          drawLegacyAxisTicks(

        }

        if (

    const patientsDistributionPlugin = {

        if (

        const xScale =
          activeChart.scales.x;

        const area =
          activeChart.chartArea;

        if (
          !xScale ||
          !area
        ) {
          return;
        }

        const q1X =
          xScale.getPixelForValue(
            patientsDistributionState.q1
          );

        const q3X =
          xScale.getPixelForValue(
            patientsDistributionState.q3
          );

        const context =
          activeChart.ctx;

        context.save();

        context.fillStyle =
          rgba(
            COLOURS.purple,
            0.08
          );

        context.strokeStyle =
          rgba(
            COLOURS.purple,
            0.24
          );

        context.lineWidth =
          1;

        const left =
          Math.min(
            q1X,
            q3X
          );

        const width =
          Math.abs(
            q3X -
            q1X
          );

        context.fillRect(
          left,
          area.top,
          width,
          area.bottom -
          area.top
        );

        context.strokeRect(
          left,
          area.top,
          width,
          area.bottom -
          area.top
        );

        context.restore();
      }
    };

    const specialtyValueLabelPlugin = {

      afterDatasetsDraw(

        if (

        const context =
          activeChart.ctx;

        const area =
          activeChart.chartArea;

        context.save();

        context.font =
          '700 10px Lato, sans-serif';

        context.textBaseline =
          'middle';

        metadata.data.forEach(
          (
            element,
            index
          ) => {
            const raw =
              dataset.data[index];

            const label =
              formatPercentage(
                raw?.percentage,
                1
              );

            const textWidth =
              context.measureText(
                label
              ).width;

            const preferredX =
              element.x +
              5;

            const fitsOutside =
              preferredX +
              textWidth <=
              area.right +
              40;

            if (fitsOutside) {
              context.textAlign =
                'left';

              context.fillStyle =
                COLOURS.ink;

              context.fillText(
                label,
                preferredX,
                element.y
              );
            } else {
              context.textAlign =
                'right';

              context.fillStyle =
                '#ffffff';

              context.fillText(
                label,
                element.x -
                5,
                element.y
              );
            }
          }
        );

        context.restore();
      }
    };

    function getInteractiveElement(
      elements,
      activeChart
    ) {
      return (
        elements ||
        []
      ).find(element => {
        const role =
          activeChart
            ?.data
            ?.datasets
            ?.[
              element.datasetIndex
            ]
            ?.datasetRole;

        return (
          role ===
            'patientsHistogram' ||
          role ===
            'patientsMedian' ||
          role ===
            'specialtyBars'
        );
      });
    }

    function findNearestPatientsMedian(
      event,
      activeChart,
      maximumDistance = 10
    ) {
      if (
        activeView !==
          'patients' ||
        !activeChart?.chartArea
      ) {
        return null;
      }

      const datasetIndex =
        activeChart.data.datasets.findIndex(
          dataset =>
            dataset.datasetRole ===
            'patientsMedian'
        );

      if (datasetIndex < 0) {
        return null;
      }

      const renderedPoints =
        activeChart
          .getDatasetMeta(
            datasetIndex
          )
          ?.data ||
        [];

      if (!renderedPoints.length) {
        return null;
      }

      const eventX =
        Number(event?.x);

      const eventY =
        Number(event?.y);

      const area =
        activeChart.chartArea;

      if (
        !Number.isFinite(eventX) ||
        !Number.isFinite(eventY) ||
        eventY < area.top ||
        eventY > area.bottom
      ) {
        return null;
      }

      const lineX =
        Number(
          renderedPoints[0]?.x
        );

      if (
        !Number.isFinite(lineX) ||
        Math.abs(
          eventX -
          lineX
        ) >
          maximumDistance
      ) {
        return null;
      }

      let nearestIndex =
        0;

      let nearestDistance =
        Infinity;

      renderedPoints.forEach(
        (
          point,
          index
        ) => {
          const distance =
            Math.abs(
              eventY -
              Number(point?.y)
            );

          if (
            Number.isFinite(distance) &&
            distance <
              nearestDistance
          ) {
            nearestDistance =
              distance;

            nearestIndex =
              index;
          }
        }
      );

      return {
        datasetIndex,
        index:
          nearestIndex
      };
    }

    function resolveInteractiveElement(
      event,
      elements,
      activeChart
    ) {
      return (
        findNearestPatientsMedian(
          event,
          activeChart
        ) ||
        getInteractiveElement(
          elements,
          activeChart
        )
      );
    }

    function setActiveTooltip(
      event,
      selectedElement,
      activeChart
    ) {
      if (
        !selectedElement ||
        !activeChart?.tooltip
      ) {
        activeChart?.tooltip
          ?.setActiveElements(
            [],
            {
              x: 0,
              y: 0
            }
          );

        activeChart?.update(
          'none'
        );

        return;
      }

      const renderedElement =
        activeChart
          .getDatasetMeta(
            selectedElement.datasetIndex
          )
          ?.data
          ?.[
            selectedElement.index
          ];

      activeChart.tooltip
        .setActiveElements(
          [
            {
              datasetIndex:
                selectedElement.datasetIndex,

              index:
                selectedElement.index
            }
          ],
          {
            x:
              Number.isFinite(
                Number(event?.x)
              )
                ? Number(event.x)
                : renderedElement?.x ||
                  0,

            y:
              Number.isFinite(
                Number(event?.y)
              )
                ? Number(event.y)
                : renderedElement?.y ||
                  0
          }
        );

      activeChart.update(
        'none'
      );
    }

    function handleChartHover(
      event,
      elements,
      activeChart
    ) {
      if (
        !activeChart ||
        viewSwitchLocked
      ) {
        if (activeChart) {
          activeChart.canvas.style.cursor =
            'default';
        }

        return;
      }

      const selectedElement =
        resolveInteractiveElement(
          event,
          elements,
          activeChart
        );

      activeChart.canvas.style.cursor =
        selectedElement
          ? 'pointer'
          : 'default';

      setActiveTooltip(
        event,
        selectedElement,
        activeChart
      );
    }

    function handleChartClick(
      event,
      elements,
      activeChart
    ) {
      if (
        !activeChart ||
        viewSwitchLocked
      ) {
        return;
      }

      event?.native
        ?.preventDefault?.();

      const selectedElement =
        resolveInteractiveElement(
          event,
          elements,
          activeChart
        );

      setActiveTooltip(
        event,
        selectedElement,
        activeChart
      );
    }

    function createChartOptions(
      model
    ) {
      const options =
        PFFCharts
          .baseChartOptions({
            animation: {
              duration:
                CONFIG
                  .transitionMs,

              easing:
                'easeOutCubic'
            },

            transitions: {
              resize: {
                animation: {
                  duration:
                    0
                }
              },

              active: {
                animation: {
                  duration:
                    PFF.reducedMotion()
                      ? 0
                      : PFF
                          .defaults
                          .hoverAnimationMs,

                  easing:
                    'easeOutCubic'
                }
              }
            },

            interaction: {
              mode:
                'nearest',

              axis:
                'xy',

              intersect:
                true,

              includeInvisible:
                false
            },

            onHover:
              handleChartHover,

            onClick:
              handleChartClick,

            plugins: {
              legend: {
                display:
                  false
              },

              tooltip:
                PFFCharts
                  .tooltipOptions({
                    filter:
                      model
                        .options
                        .plugins
                        .tooltip
                        .filter,

                    callbacks:
                      model
                        .options
                        .plugins
                        .tooltip
                        .callbacks
                  })
            },

            layout:
              model
                .options
                .layout,

            indexAxis:
              model
                .options
                .indexAxis,

            scales:
              model
                .options
                .scales
          });

      /*
       * PFF Core's base options define per-property x/y animations for the
       * line-chart apps. This legacy module changes chart types between a
       * histogram and horizontal bars, so keep its existing single Chart.js
       * animation block rather than layering those extra animations on top.
       */
      delete options.animations;

      return options;
    }

    function createChart() {
      const model =
        buildViewModel(
          activeView
        );

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type:
              model.type,

            data:
              model.data,

            options:
              createChartOptions(
                model
              ),

            plugins: [
              axisScaleFadePlugin,
              constantSpinePlugin,
              legacyAxisTickPlugin,
              patientsDistributionPlugin,
              specialtyValueLabelPlugin
            ]
          }
        );

      setSpineGeometry(
        chart.chartArea
      );

      updateLegend(
        model.legendItems,
        false
      );

      updateChartNote(
        model.note
      );
    }

    function commitView(
      nextView,
      animateData = true
    ) {
      activeView =
        nextView;

      const model =
        buildViewModel(
          activeView
        );

      PFF.animateTextChange(
        chartHeadingText,
        VIEW_CONFIG[
          activeView
        ],
        {
          fadeOutMs:
            170,

          fadeInMs:
            260
        }
      );

      tabsController
        ?.set(
          activeView,
          {
            animate:
              animateData,

            notify:
              false
          }
        );

      updateLegend(
        model.legendItems,
        animateData
      );

      updateChartNote(
        model.note
      );

      chart.config.type =
        model.type;

      chart.data =
        model.data;

      chart.options =
        createChartOptions(
          model
        );

      chart.update(
        animateData
          ? undefined
          : 'none'
      );
    }

    function applyView(
      nextView,
      animate = true
    ) {
      if (
        !chart ||
        viewSwitchLocked ||
        !VIEW_CONFIG[
          nextView
        ] ||
        nextView ===
          activeView
      ) {
        return;
      }

      const reduceMotion =
        PFF.reducedMotion();

      if (
        !animate ||
        reduceMotion
      ) {
        axisFadeOpacity = 1;
        spineTransitionState.active =
          false;

        commitView(
          nextView,
          false
        );

        setSpineGeometry(
          chart.chartArea
        );

        return;
      }

      viewSwitchLocked = true;

      chart.tooltip
        ?.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

      const previousArea =
        copyChartArea(
          chart.chartArea
        );

      spineTransitionState.active =
        true;

      setSpineGeometry(
        previousArea
      );

      animateAxisOpacity(
        axisFadeOpacity,
        0,
        170,
        () => {
          commitView(
            nextView,
            true
          );

          const nextArea =
            copyChartArea(
              chart.chartArea
            );

          let completedAnimations =
            0;

          function finishViewSwitch() {
            completedAnimations +=
              1;

            if (
              completedAnimations >=
              2
            ) {
              viewSwitchLocked =
                false;
            }
          }

          animateSpineGeometry(
            previousArea,
            nextArea,
            CONFIG.spineTransitionMs,
            finishViewSwitch
          );

          animateAxisOpacity(
            0,
            1,
            300,
            finishViewSwitch
          );
        }
      );
    }

    function appendLegendItem(
      itemData
    ) {
      const item =
        document.createElement(
          'span'
        );

      item.className =
        'legend-item';

      const marker =
        document.createElement(
          'span'
        );

      marker.className =
        itemData.markerType ===
          'line'
          ? 'legend-line'
          : itemData.markerType ===
              'band'
            ? 'legend-band'
            : 'legend-square';

      marker.style.background =
        itemData.colour;

      if (
        itemData.markerType ===
          'square' ||
        itemData.markerType ===
          'band'
      ) {
        marker.style.borderColor =
          itemData.borderColour ||
          itemData.colour;
      }

      const text =
        document.createElement(
          'span'
        );

      text.textContent =
        itemData.label;

      item.appendChild(
        marker
      );

      item.appendChild(
        text
      );

      chartLegend.appendChild(
        item
      );
    }

    function renderLegendItems(
      items
    ) {
      chartLegend.textContent =
        '';

      chartLegend.scrollLeft =
        0;

      items.forEach(
        appendLegendItem
      );

      requestAnimationFrame(
        () =>
          legendScrollController
            ?.update()
      );
    }

    function updateLegend(
      items,
      animate = true
    ) {
      const signature =
        JSON.stringify(
          items
        );

      if (
        signature ===
        currentLegendSignature
      ) {
        return;
      }

      const token =
        ++legendAnimationToken;

      const reduceMotion =
        PFF.reducedMotion();

      if (
        !animate ||
        reduceMotion ||
        !chartLegend.animate
      ) {
        renderLegendItems(
          items
        );

        currentLegendSignature =
          signature;

        chartLegend.style.opacity =
          '';

        return;
      }

      const fadeOut =
        chartLegend.animate(
          [
            {
              opacity:
                1
            },

            {
              opacity:
                0
            }
          ],
          {
            duration:
              170,

            easing:
              'ease-out',

            fill:
              'forwards'
          }
        );

      fadeOut.finished
        .then(
          () => {
            if (
              token !==
              legendAnimationToken
            ) {
              return;
            }

            fadeOut.cancel();

            renderLegendItems(
              items
            );

            currentLegendSignature =
              signature;

            const fadeIn =
              chartLegend.animate(
                [
                  {
                    opacity:
                      0
                  },

                  {
                    opacity:
                      1
                  }
                ],
                {
                  duration:
                    270,

                  easing:
                    'cubic-bezier(0.22, 1, 0.36, 1)'
                }
              );

            fadeIn.finished
              .then(
                () =>
                  fadeIn.cancel()
              )
              .catch(
                () => {}
              );
          }
        )
        .catch(
          () => {
            if (
              token !==
              legendAnimationToken
            ) {
              return;
            }

            renderLegendItems(
              items
            );

            currentLegendSignature =
              signature;
          }
        );
    }

    function updateChartNote(
      note
    ) {
      const shouldShow =
        Boolean(note) &&
        !chartNoteDismissed;

      chartNote.textContent =
        shouldShow
          ? note
          : '';

      chartNote
        .classList
        .toggle(
          'is-hidden',
          !shouldShow
        );
    }

    document.addEventListener(
      'pointerdown',
      event => {
        if (
          chartNote.classList.contains(
            'is-hidden'
          ) ||
          chartNote.contains(
            event.target
          )
        ) {
          return;
        }

        chartNoteDismissed = true;

        updateChartNote(
          ''
        );
      }
    );

    tabsController =
      PFF.setupTabs({
        tabList,
        tabs:
          chartTabs,
        valueAttribute:
          'view',
        initialValue:
          activeView,
        controlled:
          true,

        onRequest(
          nextView
        ) {
          applyView(
            nextView,
            true
          );
        }
      });

    legendScrollController =
      PFF.setupScrollableRegion({
        scroller:
          chartLegend,

        leftButton:
          legendScrollLeft,

        rightButton:
          legendScrollRight
      });

    chartInteractionController =
      PFFCharts
        .setupChartInteractions({
          canvas:
            chartCanvas,

          getChart:
            () =>
              chart
        });

    chartCanvas.addEventListener(
      'mouseleave',
      () => {
        if (!chart) {
          return;
        }

        chart.canvas.style.cursor =
          'default';

        chart.tooltip
          ?.setActiveElements(
            [],
            {
              x: 0,
              y: 0
            }
          );

        chart.update(
          'none'
        );
      }
    );

    responsiveController =
      PFFCharts
        .createResponsiveController({
          getChart:
            () =>
              chart,

          observe: [
            app,
            chartShell
          ],

          applyResponsiveChartOptions:
            false,

          beforeResize(
            activeChart
          ) {
            const model =
              buildViewModel(
                activeView
              );

            activeChart.config.type =
              model.type;

            activeChart.data =
              model.data;

            activeChart.options =
              createChartOptions(
                model
              );
          },

          afterResize(
            activeChart
          ) {
            activeChart.update(
              'none'
            );
          },

          onRefresh() {
            if (chart) {
              const model =
                buildViewModel(
                  activeView
                );

              updateLegend(
                model.legendItems,
                false
              );

              updateChartNote(
                model.note
              );
            }

            tabsController
              ?.update();

            legendScrollController
              ?.update();
          }
        });

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      load:
        loadRowsWithFallback,

      render(
        loaded
      ) {
        rows =
          loaded.rows;

        if (!rows.length) {
          throw new Error(
            'No permanent optometrist rows were found in columns A, D and F'
          );
        }

        setLoadedSourceIndicator(
          loaded
        );

        /*
         * Reveal the chart before constructing Chart.js so its axes are
         * measured against the real visible iframe dimensions.
         */
        PFF.hideLoadingState(
          app
        );

        createChart();

        tabsController
          ?.set(
            activeView,
            {
              animate:
                false,

              notify:
                false
            }
          );

        requestAnimationFrame(
          () => {
            if (!chart) {
              return;
            }

            chart.resize();

            chart.update(
              'none'
            );

            responsiveController
              ?.refresh();
          }
        );
      },

      onError(
        error
      ) {
        setLoadedSourceIndicator({
          source:
            'unavailable'
        });

        PFF.setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load permanent legacy results'
          ).replace(
            /\.+$/,
            ''
          ),
          statusElement
        );
      }
    });
  </script>
</body>
</html>
