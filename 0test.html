      width: 100%;
    }

      width: min(calc(100% - 12px), 520px);
      max-width: 100%;
      min-width: 0;
      margin-inline: auto;
      padding: 8px 6px 2px;
      overflow: hidden;
      background: #fff;
    }

    /* ---------- Tab and live status ---------- */

    .module-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 3px;
      border-bottom: 1px solid var(--track);
    }

    .tab-list {
      display: flex;
      align-items: flex-end;
      min-width: 0;
    }

    .chart-tab {
      min-height: 30px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--purple);
      background: #fff;
      border: 0;
      border-bottom: 2px solid var(--purple);
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;

      color: var(--muted);

      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ---------- Chart heading ---------- */

    .chart-heading-row {
      position: relative;
      width: 100%;
      min-height: 28px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 2px 112px 2px 0;
      color: var(--ink);
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.18;
      text-align: left;
    }

    /*
     * The button is positioned independently from the document
     * flow, so its appearance never changes the chart position.
     */
    .reaggregate-button {
      position: absolute;
      top: 0;
      right: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;

      min-height: 28px;
      padding: 0 6px;

      color: var(--muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;

      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;

      cursor: pointer;

      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        visibility 0s linear;
    }

    .reaggregate-button:hover {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow:

    }

    .reaggregate-button:focus-visible {
      outline: none;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--purple);
      font-size: 15px;
      line-height: 1;
    }

    /* ---------- Fixed-size chart ---------- */

    .chart-shell {
      position: relative;
      width: 100%;
      height: 454px;
      min-height: 454px;
      max-height: 454px;
      margin: -1px 0 0;
      overflow: hidden;

    function normaliseEmployerName(
      value
    ) {
      return String(
        value || ''
      )
        .toLowerCase()
        .normalize('NFKD')
        .replace(
          /[’‘]/g,
          "'"
        )
        .replace(
          /&/g,
          ' and '
        )
        .replace(
          /[^a-z0-9]+/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }

          ...employer.aliases

            EMPLOYER_ALIAS_MAP.set(
              normaliseEmployerName(
                alias
              ),
              employer
            );
          }
        );
      }
    );


    function getEmployerAppearance(
      employerName

      const original =

      const normalised =

      const knownEmployer =
        EMPLOYER_ALIAS_MAP.get(
          normalised
        );

      if (
        knownEmployer
      ) {
        return knownEmployer;
      }

      const fallbackKey =
        normalised ||
        `unknown-${original}`;

      if (
        original.length <= 10

        return {
          key:
            fallbackKey,

          label:
            original || '—',

          fullName:
            original ||
            'Unknown employer',

          colour:
            '#777777'
        };
      }

      const initials =
        original
          .split(/\s+/)
          .filter(Boolean)
          .map(
            word =>
              word.charAt(0)
          )
          .join('')
          .slice(0, 6);

      return {

        label:
          initials ||
          original.slice(
            0,
            10
          ),

        fullName:
          original,

        colour:
          '#777777'
      };
    }

    function formatStatistic(

      ) {

      if (

    function toNumber(

        typeof value === 'number'
          ? value
          : parseFloat(
              String(
                value
              ).replace(

                ''
              )
            );

      return Number.isFinite(

        ? number
        : NaN;
    }


    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.max(
        minimum,
        Math.min(
          maximum,
          value
        )
      );
    }


    function hexToRgba(
      hex,
      opacity
    ) {
      const cleaned =
        String(
          hex
        )
          .replace(
            '#',
            ''
          )
          .trim();

      if (
        !/^[0-9a-f]{6}$/i.test(
          cleaned
        )
      ) {
        return (
          `rgba(119, 119, 119, ${opacity})`
        );
      }

      const red =
        parseInt(
          cleaned.slice(
            0,
            2
          ),
          16
        );

      const green =
        parseInt(
          cleaned.slice(
            2,
            4
          ),
          16
        );

      const blue =
        parseInt(
          cleaned.slice(
            4,
            6
          ),
          16
        );

      return (
        `rgba(${red}, ${green}, ${blue}, ${opacity})`
      );
    }


    function getBaseBubbleRadius(
      respondents
    ) {
      const calculated =
        BUBBLE_OFFSET +
        (
          Math.pow(
            respondents,
            BUBBLE_EXPONENT
          ) *
          BUBBLE_MULTIPLIER
        );

      return clamp(
        calculated,
        MIN_RADIUS,
        MAX_RADIUS
      );
    }


    function getDisplayedBubbleRadius(
      chart,
      raw
    ) {
      const baseRadius =
        Number(
          raw?.baseRadius
        );

      if (
        !Number.isFinite(
          baseRadius
        ) ||
        baseRadius <= 0
      ) {
        return 0;
      }

      const chartWidth =
        Number(
          chart?.width
        );

      const safeChartWidth =
        Number.isFinite(
          chartWidth
        ) &&
        chartWidth > 0
          ? chartWidth
          : 520;

      const widthScale =
        clamp(
          safeChartWidth / 520,
          0.72,
          1
        );

      return (
        baseRadius *
        widthScale
      );
    }


    function percentile(
      sortedValues,
      probability
    ) {
      if (
        !sortedValues.length
      ) {
        return NaN;
      }

      if (
        sortedValues.length === 1
      ) {
        return sortedValues[0];
      }

      const index =
        (
          sortedValues.length -
          1
        ) *
        probability;

      const lowerIndex =
        Math.floor(
          index
        );

      const upperIndex =
        Math.ceil(
          index
        );

      if (
        lowerIndex ===
        upperIndex
      ) {
        return sortedValues[
          lowerIndex
        ];
      }

      const fraction =
        index -
        lowerIndex;

      return (
        sortedValues[
          lowerIndex
        ] +
        (
          sortedValues[
            upperIndex
          ] -
          sortedValues[
            lowerIndex
          ]
        ) *
        fraction
      );
    }


    function calculateScoreStatistics(
      scores
    ) {
      const sorted =
        scores
          .filter(
            Number.isFinite
          )
          .slice()
          .sort(
            (
              first,
              second
            ) =>
              first - second
          );

      return {
        count:
          sorted.length,

        median:
          percentile(
            sorted,
            0.50
          ),

        q1:
          percentile(
            sorted,
            0.25
          ),

        q3:
          percentile(
            sorted,
            0.75
          )
      };
    }

    function loadSheetQuery(
      query
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            'pffPromoterCallback_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() *
              1000000
            );

          const script =
            document.createElement(
              'script'
            );

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'Could not load Google Sheet data'
                  )
                );
              },
              20000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response => {
            cleanup();

            if (
              !response ||
              response.status ===
                'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          };


          script.onerror =
            () => {
              cleanup();

              reject(
                new Error(
                  'Network error loading Google Sheet data'
                )
              );
            };


          const params =
            new URLSearchParams({
              sheet:
                SHEET_NAME,

              headers:
                '1',

              tq:
                query,

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(
                  Date.now()
                )
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
            params.toString();


          document.body
            .appendChild(
              script
            );
        }
      );
    }

        new Map();


      rows.forEach(
        row => {
          const employerName =
            String(
              getCellValue(
                row?.c?.[0]
              ) || ''
            ).trim();

          const score =
            toNumber(
              getCellValue(
                row?.c?.[1]
              )
            );

          const respondents =
            toNumber(
              getCellValue(
                row?.c?.[2]
              )
            );


          if (
            !employerName ||
            !Number.isFinite(
              score
            ) ||
            score < 0 ||
            score > 10 ||
            !Number.isFinite(
              respondents
            ) ||
            respondents <= 0
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          employers.set(
            appearance.key,
            {
              canonicalKey:
                appearance.key,

              sourceName:
                employerName,

              score,

              respondents,

              label:
                appearance.label,

              fullName:
                appearance.fullName,

              colour:
                appearance.colour
            }
          );
        }
      );


      return [
        ...employers.values()
      ];
    }


    /************************************************************
     * NORMALISE RAW DATA
     ************************************************************/

    function normaliseRawRows(
      rows
    ) {
      const employerMap =
        new Map();


      rows.forEach(
        row => {
          const employerName =
            String(
              getCellValue(
                row?.c?.[0]
              ) || ''
            ).trim();

          const score =
            toNumber(
              getCellValue(
                row?.c?.[1]
              )
            );


          if (
            !employerName ||
            !Number.isFinite(
              score
            ) ||
            score < 0 ||
            score > 10
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          if (
            !employerMap.has(
              appearance.key
            )
          ) {
            employerMap.set(
              appearance.key,
              {
                canonicalKey:
                  appearance.key,

                label:
                  appearance.label,

                fullName:
                  appearance.fullName,

                colour:
                  appearance.colour,

                scores:
                  []
              }
            );
          }


          employerMap
            .get(
              appearance.key
            )
            .scores
            .push(
              score
            );
        }
      );


      employerMap.forEach(
        employer => {
          employer.statistics =
            calculateScoreStatistics(
              employer.scores
            );
        }
      );


      return employerMap;
    }


    /************************************************************
     * FIXED AGGREGATE POSITIONS
     ************************************************************/

    function buildAggregatePositions(
      items
    ) {
      const groups =
        new Map();


      items.forEach(
        item => {
          const scoreKey =
            String(
              Number(
                item.score
              )
            );

          if (
            !groups.has(
              scoreKey
            )
          ) {
            groups.set(
              scoreKey,
              []
            );
          }

          groups
            .get(
              scoreKey
            )
            .push(
              item
            );
        }
      );


      const maximumGroupSize =
        Math.max(
          1,
          ...[
            ...groups.values()
          ].map(
            group =>
              group.length
          )
        );


      /*
       * Keep all aggregate bubbles further inside the chart.
       */
      const leftPosition =
        18;

      const rightPosition =
        85;


      const sharedPositions =
        maximumGroupSize === 1
          ? [
              leftPosition
            ]
          : Array.from(
              {
                length:
                  maximumGroupSize
              },
              (
                _,
                index
              ) =>
                leftPosition +
                (
                  index /
                  (
                    maximumGroupSize -
                    1
                  )
                ) *
                (
                  rightPosition -
                  leftPosition
                )
            );


      const positions =
        new Map();


      groups.forEach(
        group => {
          group
            .slice()
            .sort(
              (
                first,
                second
              ) =>
                second.respondents -
                  first.respondents ||
                first.fullName.localeCompare(
                  second.fullName
                )
            )
            .forEach(
              (
                item,
                index
              ) => {
                positions.set(
                  item.canonicalKey,
                  sharedPositions[
                    index
                  ]
                );
              }
            );
        }
      );


      return positions;
    }


    function buildAggregatePoints(
      items
    ) {
      return items
        .map(
          item => ({
            kind:
              'aggregate',

            x:
              aggregatePositions.get(
                item.canonicalKey
              ) ??
              18,

            y:
              item.score,

            baseRadius:
              getBaseBubbleRadius(
                item.respondents
              ),

            canonicalKey:
              item.canonicalKey,

            shortLabel:
              item.label,

            fullName:
              item.fullName,

            respondents:
              item.respondents,

            colour:
              item.colour,

            canSplit:
              Boolean(
                rawEmployerData
                  .get(
                    item.canonicalKey
                  )
                  ?.scores
                  ?.length
              )
          })
        )
        .sort(
          (
            first,
            second
          ) => {
            /*
             * Higher scores are drawn first.
             * Lower scores appear over higher scores.
             */
            if (
              first.y !==
              second.y
            ) {
              return (
                second.y -
                first.y
              );
            }

            /*
             * Smaller tied bubbles appear over larger tied bubbles.
             */
            return (
              second.baseRadius -
              first.baseRadius
            );
          }
        );
    }


    /************************************************************
     * RAW SCORE POSITIONS
     ************************************************************/

    function buildRawEmployerPoints(
      aggregateItem,
      rawEmployer,
      startAtAggregate = false
    ) {
      const aggregateX =
        aggregatePositions.get(
          aggregateItem.canonicalKey
        ) ??
        18;

      const aggregateY =
        aggregateItem.score;

      const scoreGroups =
        new Map();


      rawEmployer.scores.forEach(
        score => {
          const scoreKey =
            String(
              score
            );

          if (
            !scoreGroups.has(
              scoreKey
            )
          ) {
            scoreGroups.set(
              scoreKey,
              []
            );
          }

          scoreGroups
            .get(
              scoreKey
            )
            .push(
              score
            );
        }
      );


      const points =
        [];


      scoreGroups.forEach(
        (
          scores,
          scoreKey
        ) => {
          const score =
            Number(
              scoreKey
            );

          const pointCount =
            scores.length;

          const span =
            Math.min(
              22,
              Math.max(
                0,
                (
                  pointCount -
                  1
                ) *
                2.4
              )
            );


          let startX =
            aggregateX -
            span / 2;


          startX =
            clamp(
              startX,
              11,
              90 -
              span
            );


          scores.forEach(
            (
              _,
              index
            ) => {
              const finalX =
                pointCount === 1
                  ? aggregateX
                  : startX +
                    (
                      index /
                      (
                        pointCount -
                        1
                      )
                    ) *
                    span;


              points.push({
                kind:
                  'raw',

                x:
                  startAtAggregate
                    ? aggregateX
                    : clamp(
                        finalX,
                        11,
                        90
                      ),

                y:
                  startAtAggregate
                    ? aggregateY
                    : score,

                targetX:
                  clamp(
                    finalX,
                    11,
                    90
                  ),

                targetY:
                  score,

                baseRadius:
                  RAW_POINT_RADIUS,

                canonicalKey:
                  aggregateItem.canonicalKey,

                fullName:
                  aggregateItem.fullName,

                colour:
                  aggregateItem.colour,

                rawScore:
                  score,

                scoreCount:
                  rawEmployer.statistics.count,

                median:
                  rawEmployer.statistics.median,

                q1:
                  rawEmployer.statistics.q1,

                q3:
                  rawEmployer.statistics.q3
              });
            }
          );
        }
      );


      return points;
    }


    function getSplitEmployerKeys(
      additionalEmployerKey = ''
    ) {
      const keys = [
        ...splitEmployers
      ];


      if (
        additionalEmployerKey &&
        !keys.includes(
          additionalEmployerKey
        )
      ) {
        keys.push(
          additionalEmployerKey
        );
      }


      return keys;
    }


    function buildRawPoints({
      additionalEmployerKey = '',
      startAdditionalAtAggregate = false
    } = {}) {
      const points =
        [];


      getSplitEmployerKeys(
        additionalEmployerKey
      ).forEach(
        employerKey => {
          const aggregateItem =
            aggregateItems.find(
              item =>
                item.canonicalKey ===
                employerKey
            );

          const rawEmployer =
            rawEmployerData.get(
              employerKey
            );


          if (
            !aggregateItem ||
            !rawEmployer
              ?.scores
              ?.length
          ) {
            return;
          }


          points.push(
            ...buildRawEmployerPoints(
              aggregateItem,
              rawEmployer,
              (
                employerKey ===
                  additionalEmployerKey &&
                startAdditionalAtAggregate
              )
            )
          );
        }
      );


      /*
       * Employer insertion order is preserved, keeping existing
       * split bubbles fixed when another employer is opened.
       */
      return points;
    }


    /************************************************************
     * RE-AGGREGATE BUTTON
     ************************************************************/

    function updateReaggregateButton() {
      const shouldShow =
        splitEmployers.size > 0;


      reaggregateButton
        .classList
        .toggle(
          'is-hidden',
          !shouldShow
        );


      reaggregateButton.setAttribute(
        'aria-hidden',
        String(
          !shouldShow
        )
      );


      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;
    }


    /************************************************************
     * INITIAL ANIMATION FLAG
     ************************************************************/

    const initialAnimationPlugin = {
      id:
        'initialAnimationPlugin',


      beforeInit(
        chart
      ) {
        chart.$isInitialLoad =
          true;
      },


      afterRender(
        chart
      ) {
        chart.$isInitialLoad =
          false;
      }
    };


    /************************************************************
     * AGGREGATE LABELS
     *
     * Labels are drawn immediately after the aggregate dataset.
     * The raw dataset then renders afterwards and remains above
     * both aggregate bubbles and their labels.
     ************************************************************/

    const bubbleLabelPlugin = {
      id:
        'bubbleLabelPlugin',


      afterDatasetDraw(
        chart,
        args
      ) {
        if (
          args.index !== 0
        ) {
          return;
        }


        const context =
          chart.ctx;

        const dataset =
          chart.data
            .datasets[0];

        const metadata =
          chart.getDatasetMeta(
            0
          );


        metadata.data.forEach(
          (
            element,
            index
          ) => {
            const raw =
              dataset.data[
                index
              ];


            if (
              raw?.kind !==
                'aggregate' ||
              !raw.shortLabel ||
              splitEmployers.has(
                raw.canonicalKey
              )
            ) {
              return;
            }


            const radius =
              getDisplayedBubbleRadius(
                chart,
                raw
              );


            if (
              radius <= 0
            ) {
              return;
            }


            const fontSize =
              clamp(
                radius *
                  0.43,
                9,
                15
              );


            context.save();

            context.textAlign =
              'center';

            context.textBaseline =
              'middle';

            context.font =
              `700 ${fontSize}px Lato, sans-serif`;

            context.lineJoin =
              'round';

            context.lineWidth =
              Math.max(
                1.4,
                fontSize *
                  0.12
              );

            context.strokeStyle =
              'rgba(255, 255, 255, 0.94)';

            context.fillStyle =
              '#151515';


            context.strokeText(
              raw.shortLabel,
              element.x,
              element.y
            );

            context.fillText(
              raw.shortLabel,
              element.x,
              element.y
            );


            context.restore();
          }
        );
      }
    };


    /************************************************************
     * SPLIT ANIMATION
     ************************************************************/

    function animateEmployerSplit(
      employerKey
    ) {
      if (
        splitAnimationActive ||
        splitEmployers.has(
          employerKey
        ) ||
        !promoterChart
      ) {
        return;
      }


      splitAnimationActive =
        true;


      /*
       * Insert the new raw bubbles at the selected aggregate
       * bubble's exact location.
       */
      promoterChart
        .data
        .datasets[1]
        .data =
          buildRawPoints({
            additionalEmployerKey:
              employerKey,

            startAdditionalAtAggregate:
              true
          });


      promoterChart.update(
        'none'
      );


      /*
       * Two animation frames ensure Chart.js records the starting
       * coordinates before receiving the final coordinates.
       */
      window.requestAnimationFrame(
        () => {
          window.requestAnimationFrame(
            () => {
              splitEmployers.add(
                employerKey
              );


              promoterChart
                .data
                .datasets[1]
                .data =
                  buildRawPoints();


              /*
               * The selected aggregate bubble shrinks away while
               * its raw bubbles travel smoothly to their scores.
               */
              promoterChart.update();


              updateReaggregateButton();


              window.setTimeout(
                () => {
                  splitAnimationActive =
                    false;
                },
                SPLIT_UNLOCK_DELAY_MS
              );
            }
          );
        }
      );
    }


    /************************************************************
     * CREATE CHART
     ************************************************************/

    function createChart() {
      const canvas =
        document.getElementById(
          'promoterChart'
        );

      const context =
        canvas.getContext(
          '2d'
        );


      promoterChart =
        new Chart(
          context,
          {
            type:
              'scatter',


            data: {
              datasets: [
                {
                  label:
                    'Aggregated employer scores',

                  /*
                   * Higher order values draw first.
                   */
                  order:
                    2,

                  data:
                    aggregatePoints,

                  parsing:
                    false,

                  showLine:
                    false,

                  clip:
                    false,


                  pointRadius(
                    chartContext
                  ) {
                    const raw =
                      chartContext.raw;


                    if (
                      !raw ||
                      splitEmployers.has(
                        raw.canonicalKey
                      )
                    ) {
                      return 0;
                    }


                    return getDisplayedBubbleRadius(
                      chartContext.chart,
                      raw
                    );
                  },


                  pointHoverRadius(
                    chartContext
                  ) {
                    const raw =
                      chartContext.raw;


                    if (
                      !raw ||
                      splitEmployers.has(
                        raw.canonicalKey
                      )
                    ) {
                      return 0;
                    }


                    const radius =
                      getDisplayedBubbleRadius(
                        chartContext.chart,
                        raw
                      );


                    return radius > 0
                      ? radius + 1.5
                      : 0;
                  },


                  pointHitRadius(
                    chartContext
                  ) {
                    const raw =
                      chartContext.raw;


                    if (
                      !raw ||
                      splitEmployers.has(
                        raw.canonicalKey
                      )
                    ) {
                      return 0;
                    }


                    return 5;
                  },


                  pointBackgroundColor(
                    chartContext
                  ) {
                    return hexToRgba(
                      chartContext
                        .raw
                        ?.colour ||
                        '#777777',

                      BUBBLE_OPACITY
                    );
                  },


                  pointHoverBackgroundColor(
                    chartContext
                  ) {
                    return hexToRgba(
                      chartContext
                        .raw
                        ?.colour ||
                        '#777777',

                      BUBBLE_HOVER_OPACITY
                    );
                  },


                  pointBorderWidth:
                    0,

                  pointHoverBorderWidth:
                    0
                },


                {
                  label:
                    'Raw employer scores',

                  /*
                   * Lower order values draw afterwards and therefore
                   * appear over all aggregate bubbles.
                   */
                  order:
                    1,

                  data:
                    [],

                  parsing:
                    false,

                  showLine:
                    false,

                  clip:
                    false,


                  pointRadius(
                    chartContext
                  ) {
                    return getDisplayedBubbleRadius(
                      chartContext.chart,
                      chartContext.raw
                    );
                  },


                  pointHoverRadius(
                    chartContext
                  ) {
                    const radius =
                      getDisplayedBubbleRadius(
                        chartContext.chart,
                        chartContext.raw
                      );


                    return radius > 0
                      ? radius + 2
                      : 0;
                  },


                  pointHitRadius(
                    chartContext
                  ) {
                    return chartContext.raw
                      ? 5
                      : 0;
                  },


                  pointBackgroundColor(
                    chartContext
                  ) {
                    return hexToRgba(
                      chartContext
                        .raw
                        ?.colour ||
                        '#777777',

                      BUBBLE_OPACITY
                    );
                  },


                  pointHoverBackgroundColor(
                    chartContext
                  ) {
                    return hexToRgba(
                      chartContext
                        .raw
                        ?.colour ||
                        '#777777',

                      BUBBLE_HOVER_OPACITY
                    );
                  },


                  pointBorderWidth:
                    0,

                  pointHoverBorderWidth:
                    0
                }
              ]
            },


            options: {
              responsive:
                true,

              maintainAspectRatio:
                false,


              animation: {
                duration:
                  POINT_ANIMATION_MS,

                easing:
                  'easeOutQuart'
              },


              animations: {
                x: {
                  duration:
                    POINT_ANIMATION_MS,

                  easing:
                    'easeOutQuart'
                },


                y: {
                  duration:
                    POINT_ANIMATION_MS,

                  easing:
                    'easeOutQuart',


                  /*
                   * On initial load, bubbles rise from the bottom.
                   * Later updates animate from their current position.
                   */
                  from(
                    animationContext
                  ) {
                    const chart =
                      animationContext.chart;


                    if (
                      !chart
                        ?.$isInitialLoad
                    ) {
                      return undefined;
                    }


                    return (
                      chart
                        .scales
                        ?.y
                        ?.bottom ??
                      chart.height
                    );
                  }
                },


                radius: {
                  duration:
                    RADIUS_ANIMATION_MS,

                  easing:
                    'easeOutCubic',


                  from(
                    animationContext
                  ) {
                    return animationContext
                      .chart
                      ?.$isInitialLoad
                        ? 0
                        : undefined;
                  }
                }
              },


              interaction: {
                mode:
                  'nearest',

                intersect:
                  true
              },


              layout: {
                padding: {
                  top:
                    0,

                  right:
                    1,

                  bottom:
                    0,

                  left:
                    0
                }
              },


              onHover(
                event,
                elements,
                chart
              ) {
                if (
                  !elements.length
                ) {
                  chart.canvas.style.cursor =
                    'default';

                  return;
                }


                const selectedElement =
                  elements[0];


                const point =
                  chart
                    .data
                    .datasets[
                      selectedElement
                        .datasetIndex
                    ]
                    ?.data
                    ?.[
                      selectedElement
                        .index
                    ];


                chart.canvas.style.cursor =
                  selectedElement
                    .datasetIndex === 0 &&
                  point?.kind ===
                    'aggregate' &&
                  point.canSplit &&
                  !splitEmployers.has(
                    point.canonicalKey
                  ) &&
                  !splitAnimationActive
                    ? 'pointer'
                    : 'default';
              },


              onClick(
                event,
                elements,
                chart
              ) {
                if (
                  !elements.length ||
                  splitAnimationActive
                ) {
                  return;
                }


                const selectedElement =
                  elements[0];


                /*
                 * Raw bubbles are hoverable but not clickable.
                 */
                if (
                  selectedElement
                    .datasetIndex !== 0
                ) {
                  return;
                }


                const point =
                  chart
                    .data
                    .datasets[0]
                    ?.data
                    ?.[
                      selectedElement
                        .index
                    ];


                if (
                  point?.kind !==
                    'aggregate' ||
                  !point.canSplit ||
                  splitEmployers.has(
                    point.canonicalKey
                  )
                ) {
                  return;
                }


                animateEmployerSplit(
                  point.canonicalKey
                );
              },


              plugins: {
                legend: {
                  display:
                    false
                },


                tooltip: {
                  displayColors:
                    false,

                  backgroundColor:
                    '#ffffff',

                  titleColor:
                    '#151515',

                  bodyColor:
                    '#69718a',

                  borderColor:
                    '#e8eaf0',

                  borderWidth:
                    1,

                  cornerRadius:
                    4,

                  padding:
                    9,


                  titleFont: {
                    family:
                      'Lato',

                    size:
                      12,

                    weight:
                      '700'
                  },


                  bodyFont: {
                    family:
                      'Lato',

                    size:
                      11,

                    weight:
                      '400'
                  },


                  callbacks: {
                    title(
                      tooltipItems
                    ) {
                      return (
                        tooltipItems
                          ?.[0]
                          ?.raw
                          ?.fullName ||
                        ''
                      );
                    },


                    label(
                      tooltipItem
                    ) {
                      const raw =
                        tooltipItem.raw;


                      if (
                        raw?.kind ===
                        'raw'
                      ) {
                        return [
                          `Raw score: ${formatStatistic(raw.rawScore)}`,
                          `Respondents: ${formatNumber(raw.scoreCount)}`,
                          (
                            'Median [IQR]: ' +
                            `${formatStatistic(raw.median)} ` +
                            `[${formatStatistic(raw.q1)}–${formatStatistic(raw.q3)}]`
                          )
                        ];
                      }


                      return [
                        `Median score: ${formatStatistic(raw?.y)}`,
                        `Respondents: ${formatNumber(raw?.respondents ?? 0)}`,
                        raw?.canSplit
                          ? 'Click to show raw scores'
                          : ''
                      ].filter(
                        Boolean
                      );
                    }
                  }
                }
              },


              scales: {
                x: {
                  type:
                    'linear',

                  min:
                    0,

                  max:
                    100,

                  display:
                    false,

                  grid: {
                    display:
                      false
                  },

                  border: {
                    display:
                      false
                  }
                },


                y: {
                  min:
                    0,

                  max:
                    10,


                  title: {
                    display:
                      true,

                    text:
                      'Score',

                    color:
                      '#151515',

                    font: {
                      family:
                        'Lato',

                      size:
                        13,

                      weight:
                        '700'
                    },

                    padding: {
                      bottom:
                        4
                    }
                  },


                  ticks: {
                    stepSize:
                      1,

                    color:
                      '#151515',

                    padding:
                      5,

                    autoSkip:
                      false,

                    maxRotation:
                      0,

                    minRotation:
                      0,

                    font: {
                      family:
                        'Lato',

                      size:
                        12,

                      weight:
                        '400'
                    },


                    /*
                     * Descriptions appear to the left of each number
                     * because y-axis tick text is right-aligned.
                     */
                    callback(
                      value
                    ) {
                      const number =
                        Number(
                          value
                        );


                      if (
                        number === 0
                      ) {
                        return (
                          '(not at all) 0'
                        );
                      }


                      if (
                        number === 5
                      ) {
                        return (
                          '(unsure) 5'
                        );
                      }


                      if (
                        number === 10
                      ) {
                        return (
                          '(extremely) 10'
                        );
                      }


                      return String(
                        number
                      );
                    }
                  },


                  grid: {
                    color:
                      'rgba(105, 113, 138, 0.075)',

                    lineWidth:
                      1,

                    drawTicks:
                      true,

                    tickLength:
                      7,

                    tickColor:
                      '#151515',

                    tickWidth:
                      1.2
                  },


                  border: {
                    display:
                      true,

                    color:
                      '#151515',

                    width:
                      1.1
                  }
                }
              }
            },


            plugins: [
              initialAnimationPlugin,
              bubbleLabelPlugin
            ]
          }
        );
    }


    /************************************************************
     * RE-AGGREGATE
     ************************************************************/

    reaggregateButton.addEventListener(
      'click',
      () => {
        if (
          splitAnimationActive ||
          !promoterChart
        ) {
          return;
        }


        splitAnimationActive =
          true;


        splitEmployers.clear();


        promoterChart
          .data
          .datasets[1]
          .data =
            [];


        promoterChart.update();


        updateReaggregateButton();


        window.setTimeout(
          () => {
            splitAnimationActive =
              false;
          },
          SPLIT_UNLOCK_DELAY_MS
        );
      }
    );


    /************************************************************
     * LOAD ONCE
     *
     * Data reloads only when the page itself is refreshed.
     ************************************************************/

    async function loadPromoterChart() {
      try {
        setStatus();


        const [
          aggregateRows,
          rawRows
        ] =
          await Promise.all([
            loadSheetQuery(
              AGGREGATE_QUERY
            ),

            loadSheetQuery(
              RAW_QUERY
            )
          ]);


        aggregateItems =
          normaliseAggregateRows(
            aggregateRows
          );


        rawEmployerData =
          normaliseRawRows(
            rawRows
          );


        if (
          !aggregateItems.length
        ) {
          throw new Error(
            'No valid aggregate rows found in columns AM to AO'
          );
        }


        aggregatePositions =
          buildAggregatePositions(
            aggregateItems
          );


        aggregatePoints =
          buildAggregatePoints(
            aggregateItems
          );


        createChart();

        updateReaggregateButton();

        setStatus();

      } catch (
        error
      ) {
        console.error(
          error
        );


        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load chart'
          ).replace(
            /\.+$/,
            ''
          )
        );
      }
    }


    loadPromoterChart();
  </script>
</body>
</html>
