<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Job Summary</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --cached-amber: #c27c00;

      --corporate-text: #00b26f;
      --independent-text: #5a3be7;
      --ophthal-text: #ffb000;
      --other-text: #bfc3c7;

      --state-nsw: #2db7f5;
      --state-qld: #7a0036;
      --state-vic: #2d3a8c;
      --state-act: #7b61ff;
      --state-sa: #f03a47;
      --state-nt: #c25e00;
      --state-wa: #000000;
      --state-tas: #22a36b;

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    #fit {
      width: 100%;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 12px 4px 12px;
      text-align: center;
    }

    #app.is-loading .table-section {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    /* ==========================================================
       LOADING
       ========================================================== */

    .app-loading {
      width: 100%;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation:
        blueConeCycle
        2.7s
        infinite
        cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation:
        greenConeCycle
        2.7s
        infinite
        cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation:
        redConeCycle
        2.7s
        infinite
        cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation:
        loadingTextPulse
        2.7s
        infinite
        cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    /* ==========================================================
       MAIN SECTION
       ========================================================== */

    .table-section {
      width: 100%;
      margin: 0;
    }

    .table-lead {
      margin: 0 0 3px;
      color: var(--ink);
      text-align: center;
    }

    .table-lead-secondary {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
    }

    /* ==========================================================
       PERIOD SLIDER
       ========================================================== */

    .timeline-section {
      width: 100%;
      min-width: 0;
      margin: 0 0 8px;
    }

    .timeline-topline {
      display: flex;
      width: 100%;
      min-height: 15px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 1px;
    }

    .timeline-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }

    .timeline-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .period-value {
      min-width: 42px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .period-slider-wrap {
      --slider-progress: 100%;

      position: relative;
      width: 100%;
      min-height: 22px;
      margin: 0;
    }

    .period-slider-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 1;
      height: 4px;
      transform: translateY(-50%);

      background:
        linear-gradient(
          to right,
          rgba(21, 21, 21, 0.72) 0,
          rgba(21, 21, 21, 0.72) var(--slider-progress),
          var(--track) var(--slider-progress),
          var(--track) 100%
        );

      border-radius: 999px;
      pointer-events: none;
    }

    .period-ticks {
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 2;
      height: 10px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .period-tick {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 6px;
      transform: translate(-50%, -50%);
      background: var(--muted);
      opacity: 0.38;
    }

    .period-tick.is-major {
      height: 10px;
      opacity: 0.58;
    }

    .period-range {
      position: relative;
      z-index: 4;
      display: block;
      width: 100%;
      height: 22px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    .period-range::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
      border-radius: 999px;
    }

    .period-range::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -4px;
      appearance: none;
      -webkit-appearance: none;
      background: var(--ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .period-range::-moz-range-track,
    .period-range::-moz-range-progress {
      height: 4px;
      background: transparent;
      border: 0;
      border-radius: 999px;
    }

    .period-range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .period-range:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.20);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .slider-drag-cue {
      position: absolute;
      top: -8px;
      left: calc(var(--slider-progress) - 23px);
      z-index: 5;
      display: inline-block;
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;

      animation:
        sliderDragCue
        1.7s
        var(--motion-ease)
        infinite;
    }

    .period-slider-wrap.has-been-dragged .slider-drag-cue,
    .period-slider-wrap.only-one-period .slider-drag-cue {
      display: none;
    }

    @keyframes sliderDragCue {
      0%,
      12%,
      100% {
        opacity: 0;
        transform: translateX(0);
      }

      28% {
        opacity: 0.78;
        transform: translateX(0);
      }

      54% {
        opacity: 0.88;
        transform: translateX(-6px);
      }

      72% {
        opacity: 0.42;
        transform: translateX(-8px);
      }
    }

    /* ==========================================================
       TABLE
       ========================================================== */

    .table-wrap {
      position: relative;
      width: 100%;
    }

    /*
     * Stronger divider after Employer Type.
     */
    .table-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 20%;
      width: 1px;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          #fff 0%,
          rgba(21, 21, 21, 0.16) 10%,
          var(--ink) 18%,
          rgba(21, 21, 21, 0.16) 82%,
          #fff 100%
        );
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .data-table th,
    .data-table td {
      position: relative;
      padding: 8px 2px;
      line-height: 1.15;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .data-table th {
      color: var(--muted);
      font-size: clamp(8px, 2.5vw, 12px);
      font-weight: 700;
      white-space: nowrap;
    }

    .data-table td {
      color: var(--ink);
      font-size: clamp(11px, 3.1vw, 14px);
      font-weight: 400;
    }

    .data-table th:first-child,
    .data-table td:first-child {
      width: 20%;
    }

    .data-table th + th,
    .data-table td + td {
      border-left: 1px solid var(--track);
    }

    /*
     * Prevent double line beside the first column because
     * .table-wrap::after draws the stronger divider there.
     */
    .data-table th:nth-child(2),
    .data-table td:nth-child(2) {
      border-left: 0;
    }

    .data-table .table-major-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      border-top: 1px solid var(--ink);
    }

    /* ---------- Employer Type text ---------- */

    .data-table td.category-corporate {
      color: var(--corporate-text);
      font-weight: 700;
    }

    .data-table td.category-independent {
      color: var(--independent-text);
      font-weight: 700;
    }

    .data-table td.category-ophthal {
      color: var(--ophthal-text);
      font-weight: 700;
    }

    .data-table td.category-other {
      color: var(--other-text);
      font-weight: 700;
    }

    /* ---------- State headers ---------- */

    .data-table th.state-nsw {
      color: var(--state-nsw);
      font-weight: 700;
    }

    .data-table th.state-qld {
      color: var(--state-qld);
      font-weight: 700;
    }

    .data-table th.state-vic {
      color: var(--state-vic);
      font-weight: 700;
    }

    .data-table th.state-act {
      color: var(--state-act);
      font-weight: 700;
    }

    .data-table th.state-sa {
      color: var(--state-sa);
      font-weight: 700;
    }

    .data-table th.state-nt {
      color: var(--state-nt);
      font-weight: 700;
    }

    .data-table th.state-wa {
      color: var(--state-wa);
      font-weight: 700;
    }

    .data-table th.state-tas {
      color: var(--state-tas);
      font-weight: 700;
    }

    /* ---------- Totals ---------- */

    .data-table .total-column {
      color: var(--ink);
      font-weight: 700;
      border-left: 1px solid var(--ink);
    }

    .data-table tr.total-row td {
      color: var(--ink);
      font-weight: 700;
      border-top: 1px solid var(--ink);
    }

    .data-table tr.total-row td:first-child {
      color: var(--ink);
      font-weight: 700;
    }

    /* ==========================================================
       LIVE / CACHED STATUS
       ========================================================== */

    .live-data-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      column-gap: 4px;
      row-gap: 2px;
      width: 100%;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .live-data-last-updated {
      flex: 0 0 100%;
      width: 100%;
      min-width: 0;
      font-size: clamp(6px, 1.7vw, 8px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #e53935;
    }

    .live-data-inline.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    .live-data-inline.is-unavailable .live-data-dot {
      background: var(--muted);
    }

    /* ==========================================================
       ERROR
       ========================================================== */

    .error-message {
      padding: 16px 8px !important;
      color: var(--muted) !important;
      font-size: 12px !important;
      font-weight: 400 !important;
      text-align: center !important;
    }

    /* ==========================================================
       MOBILE
       ========================================================== */

    @media (max-width: 430px) {
      #app {
        padding: 10px 2px 10px;
      }

      .table-lead-secondary {
        font-size: 12px;
      }

      .data-table th,
      .data-table td {
        padding: 7px 1px;
      }

      .data-table th {
        font-size: clamp(7px, 2.25vw, 10px);
      }

      .data-table td {
        font-size: clamp(10px, 2.8vw, 12px);
      }

      .data-table th:first-child,
      .data-table td:first-child {
        width: 20%;
      }

      .timeline-label,
      .period-value {
        font-size: 9px;
      }

      .app-loading {
        min-height: 170px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading">

      <div
        id="loading-state"
        class="app-loading"
        role="status"
        aria-label="Loading"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading...</div>
      </div>

      <section
        class="table-section"
        aria-label="Clinical optometry job summary"
      >
        <div class="table-lead">
          <p class="table-lead-secondary">
            New jobs in the last:
          </p>
        </div>

        <div
          id="timeline-section"
          class="timeline-section"
        >
          <div class="timeline-topline">
            <span class="timeline-label">
              <span
                class="timeline-symbol"
                aria-hidden="true"
              >◷</span>

              <span>Period</span>
            </span>

            <span
              id="period-value"
              class="period-value"
            >—</span>
          </div>

          <div
            id="period-slider-wrap"
            class="period-slider-wrap"
          >
            <div
              id="period-ticks"
              class="period-ticks"
              aria-hidden="true"
            ></div>

            <span
              class="slider-drag-cue"
              aria-hidden="true"
            >←</span>

            <input
              id="period-slider"
              class="period-range"
              type="range"
              min="1"
              max="1"
              step="1"
              value="1"
              aria-label="Job summary period"
            >
          </div>
        </div>

        <div class="table-wrap">
          <table
            id="data-table"
            class="data-table"
          >
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    'use strict';

    /* ============================================================
       DATA SOURCE
       ============================================================ */

    const SPREADSHEET_ID =
      '1ZcZrPHvux_ckk2cJqRYu1oz9uT4brcRmcJ80bP-v--4';

    const SHEET_NAME =
      'Mirror table';

    /*
     * Mirror table:
     *
     * B = Repeat first instance
     * C = Repeat
     * D = Result
     * E = Date
     * F = Job Title
     * G = Employer
     * H = Employer Type
     * I = State
     */
    const RAW_RANGE =
      'B2:I';

    const NON_DUPLICATE_VALUE =
      'No';

    const MAX_MONTHS_BACK =
      3;

    const FETCH_TIMEOUT_MS =
      15000;

    const FETCH_MAX_ATTEMPTS =
      2;

    const FETCH_RETRY_DELAY_MS =
      1000;

    const MILLISECONDS_PER_DAY =
      24 * 60 * 60 * 1000;

    const MILLISECONDS_PER_WEEK =
      7 * MILLISECONDS_PER_DAY;

    /*
     * Save RAW data rather than the finished table.
     *
     * This is necessary because the slider needs to recalculate
     * the table for different periods.
     */
    const RAW_STORAGE_KEY =
      'pff-clinical-optom-summary-raw-state-slider-v1';

    /*
     * Full Job Tracker cache.
     *
     * The old summary cache contained only the pre-calculated
     * 5 x 3 table, so it cannot support state or time filtering.
     */
    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbx4E4fZUhs1RDLFfsMAhJCSHQIWHcNg-PjZOSif93hKSOq6o0gv1OD8wcLjsa3ssy4mDQ/exec';

    const CACHE_APP_KEY =
      'pff-clinical-optometry-job-tracker';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Set true temporarily if you want to test the cache path.
     */
    const FORCE_CACHED_DATA =
      false;

    /* ============================================================
       TABLE STRUCTURE
       ============================================================ */

    const SUMMARY_CATEGORIES = [
      'Corporate',
      'Independent',
      'Ophthal',
      'Other'
    ];

    /*
     * Same state order as the main Job Tracker.
     */
    const STATE_CODES = [
      'NSW',
      'QLD',
      'VIC',
      'ACT',
      'SA',
      'NT',
      'WA',
      'TAS'
    ];

    /* ============================================================
       STATE
       ============================================================ */

    const state = {
      rawData: null,

      source:
        'live',

      lastUpdatedDate:
        '—',

      latestRealJobDate:
        null,

      anchorWeekStart:
        null,

      anchorWeekEnd:
        null,

      maxWeeks:
        1,

      weeksToShow:
        1
    };

    /* ============================================================
       ELEMENTS
       ============================================================ */

    const app =
      document.getElementById(
        'app'
      );

    const loadingState =
      document.getElementById(
        'loading-state'
      );

    const dataTable =
      document.getElementById(
        'data-table'
      );

    const timelineSection =
      document.getElementById(
        'timeline-section'
      );

    const periodValue =
      document.getElementById(
        'period-value'
      );

    const periodSliderWrap =
      document.getElementById(
        'period-slider-wrap'
      );

    const periodSlider =
      document.getElementById(
        'period-slider'
      );

    const periodTicks =
      document.getElementById(
        'period-ticks'
      );

    /* ============================================================
       BASIC HELPERS
       ============================================================ */

    function normaliseText(
      value
    ) {
      return String(
        value ??
        ''
      )
        .replace(
          /\u00A0/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        )
        .toLowerCase();
    }

    function cleanText(
      value
    ) {
      return String(
        value ??
        ''
      )
        .replace(
          /\u00A0/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }

    function findHeaderIndex(
      headers,
      wantedHeader
    ) {
      const wanted =
        normaliseText(
          wantedHeader
        );

      return headers.findIndex(
        header =>
          normaliseText(
            header
          ) === wanted
      );
    }

    function addDays(
      dateUtc,
      days
    ) {
      return dateUtc +
        (
          days *
          MILLISECONDS_PER_DAY
        );
    }

    /* ============================================================
       DATE HELPERS
       ============================================================ */

    function parseSheetDate(
      value
    ) {
      const text =
        cleanText(
          value
        );

      if (
        !text
      ) {
        return null;
      }

      let match =
        text.match(
          /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

      if (
        match
      ) {
        return Date.UTC(
          Number(match[3]),
          Number(match[2]) - 1,
          Number(match[1])
        );
      }

      match =
        text.match(
          /^(?:Date|new Date)\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/
        );

      if (
        match
      ) {
        return Date.UTC(
          Number(match[1]),
          Number(match[2]),
          Number(match[3])
        );
      }

      return null;
    }

    /*
     * Monday belonging to dateUtc.
     */
    function getMondayForDate(
      dateUtc
    ) {
      const date =
        new Date(
          dateUtc
        );

      const dayOfWeek =
        date.getUTCDay();

      const daysSinceMonday =
        (
          dayOfWeek +
          6
        ) % 7;

      return dateUtc -
        (
          daysSinceMonday *
          MILLISECONDS_PER_DAY
        );
    }

    /*
     * First Monday ON or AFTER dateUtc.
     *
     * This prevents the slider from going earlier than the
     * three-calendar-month cutoff.
     */
    function getMondayOnOrAfter(
      dateUtc
    ) {
      const monday =
        getMondayForDate(
          dateUtc
        );

      if (
        monday <
        dateUtc
      ) {
        return addDays(
          monday,
          7
        );
      }

      return monday;
    }

    /*
     * Calendar-month subtraction with end-of-month clamping.
     */
    function subtractCalendarMonths(
      dateUtc,
      months
    ) {
      const date =
        new Date(
          dateUtc
        );

      const originalYear =
        date.getUTCFullYear();

      const originalMonth =
        date.getUTCMonth();

      const originalDay =
        date.getUTCDate();

      const targetMonthIndex =
        originalMonth -
        months;

      const targetFirst =
        new Date(
          Date.UTC(
            originalYear,
            targetMonthIndex,
            1
          )
        );

      const targetYear =
        targetFirst.getUTCFullYear();

      const targetMonth =
        targetFirst.getUTCMonth();

      const daysInTargetMonth =
        new Date(
          Date.UTC(
            targetYear,
            targetMonth + 1,
            0
          )
        ).getUTCDate();

      const targetDay =
        Math.min(
          originalDay,
          daysInTargetMonth
        );

      return Date.UTC(
        targetYear,
        targetMonth,
        targetDay
      );
    }

    function formatFullDate(
      dateUtc
    ) {
      if (
        dateUtc === null ||
        dateUtc === undefined
      ) {
        return '—';
      }

      const date =
        new Date(
          dateUtc
        );

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return '—';
      }

      const day =
        String(
          date.getUTCDate()
        ).padStart(
          2,
          '0'
        );

      const month =
        String(
          date.getUTCMonth() + 1
        ).padStart(
          2,
          '0'
        );

      return `${day}/${month}`;
    }

    /* ============================================================
       EMPLOYER TYPE
       ============================================================ */

    /*
     * Same rules as the existing summary:
     *
     * Corporate       -> Corporate
     * Independent     -> Independent
     * Ophthalmologist -> Ophthal
     *
     * blank / xxx / x -> excluded
     *
     * Any other non-blank employer type -> Other
     */
    function mapEmployerCategory(
      value
    ) {
      const type =
        normaliseText(
          value
        );

      if (
        !type ||
        type === 'xxx' ||
        type === 'x'
      ) {
        return null;
      }

      if (
        type === 'corporate'
      ) {
        return 'Corporate';
      }

      if (
        type === 'independent'
      ) {
        return 'Independent';
      }

      if (
        type === 'ophthalmologist' ||
        type === 'ophthalmology' ||
        type === 'ophthal' ||
        type === 'ophthal practice' ||
        type === 'opthal practice'
      ) {
        return 'Ophthal';
      }

      return 'Other';
    }

    /* ============================================================
       STATE
       ============================================================ */

    function getStateCodes(
      value
    ) {
      const text =
        cleanText(
          value
        ).toUpperCase();

      const matches =
        text.match(
          /\b(?:NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/g
        ) || [];

      return [
        ...new Set(
          matches
        )
      ];
    }

    /*
     * The summary is a true matrix, so each job is assigned
     * to one state only.
     *
     * Normal job-tracker rows contain one state.
     * If a cell happens to contain multiple state codes,
     * use the first recognised code so row/column totals
     * remain additive.
     */
    function getSummaryState(
      value
    ) {
      return getStateCodes(
        value
      )[0] || null;
    }

    /* ============================================================
       LATEST JOB / LAST UPDATED
       ============================================================ */

    /*
     * Find latest genuine job.
     *
     * Result must contain data so a date-only helper row cannot
     * advance the displayed week.
     */
    function findLatestRealJobDate(
      rows,
      resultIndex,
      dateIndex
    ) {
      let latestDate =
        null;

      rows.forEach(
        row => {
          const resultValue =
            cleanText(
              row?.[
                resultIndex
              ]
            );

          if (
            !resultValue
          ) {
            return;
          }

          const jobDate =
            parseSheetDate(
              row?.[
                dateIndex
              ]
            );

          if (
            jobDate === null
          ) {
            return;
          }

          if (
            latestDate === null ||
            jobDate >
            latestDate
          ) {
            latestDate =
              jobDate;
          }
        }
      );

      return latestDate;
    }

    /*
     * Same "last updated" logic as the existing summary:
     * sort all valid raw dates newest to oldest and use
     * the second-most-recent entry.
     */
    function getSecondMostRecentRawDate(
      rawData
    ) {
      const headers =
        rawData?.headers ??
        [];

      const rows =
        rawData?.rows ??
        [];

      const dateIndex =
        findHeaderIndex(
          headers,
          'Date'
        );

      if (
        dateIndex <
        0
      ) {
        return '—';
      }

      const dates =
        rows
          .map(
            row =>
              parseSheetDate(
                row?.[
                  dateIndex
                ]
              )
          )
          .filter(
            value =>
              value !== null
          )
          .sort(
            (
              a,
              b
            ) =>
              b - a
          );

      return dates.length >= 2
        ? formatFullDate(
            dates[1]
          )
        : '—';
    }

    /* ============================================================
       DATA VALIDATION
       ============================================================ */

    function validateRawData(
      rawData
    ) {
      const headers =
        Array.isArray(
          rawData?.headers
        )
          ? rawData.headers
          : [];

      const rows =
        Array.isArray(
          rawData?.rows
        )
          ? rawData.rows
          : [];

      const requiredHeaders = [
        'Repeat',
        'Result',
        'Date',
        'Employer Type',
        'State'
      ];

      const missing =
        requiredHeaders.filter(
          header =>
            findHeaderIndex(
              headers,
              header
            ) <
            0
        );

      if (
        missing.length
      ) {
        throw new Error(
          `Required columns were not found: ${missing.join(', ')}`
        );
      }

      if (
        !rows.length
      ) {
        throw new Error(
          'No job tracker rows were found.'
        );
      }

      return {
        headers:
          headers.map(
            value =>
              String(
                value ??
                ''
              )
          ),

        rows:
          rows.map(
            row =>
              Array.isArray(row)
                ? row.map(
                    value =>
                      String(
                        value ??
                        ''
                      )
                  )
                : []
          )
      };
    }

    /* ============================================================
       PERIOD SETUP
       ============================================================ */

    function configurePeriodFromRawData(
      rawData
    ) {
      const headers =
        rawData.headers;

      const rows =
        rawData.rows;

      const resultIndex =
        findHeaderIndex(
          headers,
          'Result'
        );

      const dateIndex =
        findHeaderIndex(
          headers,
          'Date'
        );

      const latestRealJobDate =
        findLatestRealJobDate(
          rows,
          resultIndex,
          dateIndex
        );

      if (
        latestRealJobDate ===
        null
      ) {
        throw new Error(
          'No valid job dates were found.'
        );
      }

      /*
       * Preserve existing behaviour:
       *
       * Current period = Monday-Sunday week containing the
       * newest genuine job in the data.
       */
      const anchorWeekStart =
        getMondayForDate(
          latestRealJobDate
        );

      const anchorWeekEnd =
        addDays(
          anchorWeekStart,
          6
        );

      /*
       * Maximum lookback:
       * three calendar months before the latest genuine job.
       *
       * Because slider positions are Monday-based, use the
       * first Monday on or after that cutoff.
       */
      const threeMonthCutoff =
        subtractCalendarMonths(
          latestRealJobDate,
          MAX_MONTHS_BACK
        );

      let oldestMonday =
        getMondayOnOrAfter(
          threeMonthCutoff
        );

      if (
        oldestMonday >
        anchorWeekStart
      ) {
        oldestMonday =
          anchorWeekStart;
      }

      const weekDifference =
        Math.round(
          (
            anchorWeekStart -
            oldestMonday
          ) /
          MILLISECONDS_PER_WEEK
        );

      const maxWeeks =
        Math.max(
          1,
          weekDifference + 1
        );

      state.latestRealJobDate =
        latestRealJobDate;

      state.anchorWeekStart =
        anchorWeekStart;

      state.anchorWeekEnd =
        anchorWeekEnd;

      state.maxWeeks =
        maxWeeks;

      state.weeksToShow =
        1;

      /*
       * Default thumb at far right = one week.
       *
       * Moving left increases the inclusive number of weeks.
       */
      periodSlider.min =
        '1';

      periodSlider.max =
        String(
          maxWeeks
        );

      periodSlider.step =
        '1';

      periodSlider.value =
        String(
          maxWeeks
        );

      periodSliderWrap.classList.remove(
        'has-been-dragged'
      );

      periodSliderWrap.classList.toggle(
        'only-one-period',
        maxWeeks <= 1
      );

      renderPeriodTicks();

      updatePeriodSliderUi();
    }

    function weeksFromSliderValue() {
      const sliderValue =
        Number(
          periodSlider.value
        );

      return Math.max(
        1,
        state.maxWeeks -
        sliderValue +
        1
      );
    }

    function currentPeriodStart() {
      return state.anchorWeekStart -
        (
          (
            state.weeksToShow -
            1
          ) *
          MILLISECONDS_PER_WEEK
        );
    }

    function currentPeriodEnd() {
      return state.anchorWeekEnd;
    }

    function formatPeriodValue() {
      const weeks =
        state.weeksToShow;

      const unit =
        weeks === 1
          ? 'wk'
          : 'wks';

      return `${
        weeks
      } ${
        unit
      } · ${
        formatFullDate(
          currentPeriodStart()
        )
      }–${
        formatFullDate(
          currentPeriodEnd()
        )
      }`;
    }

    function renderPeriodTicks() {
      periodTicks.textContent =
        '';

      const count =
        state.maxWeeks;

      if (
        count <= 1
      ) {
        return;
      }

      for (
        let index = 0;
        index < count;
        index += 1
      ) {
        const tick =
          document.createElement(
            'span'
          );

        tick.className =
          'period-tick';

        const percentage =
          (
            index /
            (
              count -
              1
            )
          ) *
          100;

        tick.style.left =
          `${percentage}%`;

        /*
         * Stronger ticks:
         * endpoints plus approximately every 4 weeks.
         */
        if (
          index === 0 ||
          index ===
            count - 1 ||
          (
            (
              count -
              1 -
              index
            ) %
            4
          ) ===
            0
        ) {
          tick.classList.add(
            'is-major'
          );
        }

        periodTicks.appendChild(
          tick
        );
      }
    }

    function updateSliderProgress() {
      const min =
        Number(
          periodSlider.min
        );

      const max =
        Number(
          periodSlider.max
        );

      const value =
        Number(
          periodSlider.value
        );

      const progress =
        max === min
          ? 100
          : (
              (
                value -
                min
              ) /
              (
                max -
                min
              )
            ) *
            100;

      periodSliderWrap.style.setProperty(
        '--slider-progress',
        `${progress}%`
      );
    }

    function updatePeriodSliderUi() {
      state.weeksToShow =
        weeksFromSliderValue();

      updateSliderProgress();

      periodValue.textContent =
        formatPeriodValue();

      periodSlider.setAttribute(
        'aria-valuetext',
        formatPeriodValue()
      );
    }

    /* ============================================================
       BUILD SUMMARY
       ============================================================ */

    function buildSummaryTable(
      rawData
    ) {
      const headers =
        rawData.headers;

      const rows =
        rawData.rows;

      const repeatIndex =
        findHeaderIndex(
          headers,
          'Repeat'
        );

      const resultIndex =
        findHeaderIndex(
          headers,
          'Result'
        );

      const dateIndex =
        findHeaderIndex(
          headers,
          'Date'
        );

      const employerTypeIndex =
        findHeaderIndex(
          headers,
          'Employer Type'
        );

      const stateIndex =
        findHeaderIndex(
          headers,
          'State'
        );

      const periodStart =
        currentPeriodStart();

      const periodEnd =
        currentPeriodEnd();

      /*
       * Matrix:
       *
       * Employer Type x State.
       */
      const counts = {};

      SUMMARY_CATEGORIES.forEach(
        category => {
          counts[
            category
          ] = {};

          STATE_CODES.forEach(
            stateCode => {
              counts[
                category
              ][
                stateCode
              ] = 0;
            }
          );

          counts[
            category
          ].Total = 0;
        }
      );

      const stateTotals = {};

      STATE_CODES.forEach(
        stateCode => {
          stateTotals[
            stateCode
          ] = 0;
        }
      );

      let grandTotal =
        0;

      rows.forEach(
        row => {
          /*
           * Count only non-duplicate ads.
           */
          const repeatValue =
            normaliseText(
              row?.[
                repeatIndex
              ]
            );

          if (
            repeatValue !==
            normaliseText(
              NON_DUPLICATE_VALUE
            )
          ) {
            return;
          }

          /*
           * Must be a genuine job row.
           */
          const resultValue =
            cleanText(
              row?.[
                resultIndex
              ]
            );

          if (
            !resultValue
          ) {
            return;
          }

          const jobDate =
            parseSheetDate(
              row?.[
                dateIndex
              ]
            );

          if (
            jobDate === null
          ) {
            return;
          }

          /*
           * Current cumulative slider period.
           */
          if (
            jobDate <
              periodStart ||
            jobDate >
              periodEnd
          ) {
            return;
          }

          const category =
            mapEmployerCategory(
              row?.[
                employerTypeIndex
              ]
            );

          if (
            category ===
            null
          ) {
            return;
          }

          const stateCode =
            getSummaryState(
              row?.[
                stateIndex
              ]
            );

          /*
           * State table needs a recognised Australian
           * state / territory.
           */
          if (
            !stateCode
          ) {
            return;
          }

          counts[
            category
          ][
            stateCode
          ] += 1;

          counts[
            category
          ].Total += 1;

          stateTotals[
            stateCode
          ] += 1;

          grandTotal += 1;
        }
      );

      const values = [
        [
          '',
          ...STATE_CODES,
          'Total'
        ]
      ];

      SUMMARY_CATEGORIES.forEach(
        category => {
          values.push(
            [
              category,

              ...STATE_CODES.map(
                stateCode =>
                  counts[
                    category
                  ][
                    stateCode
                  ]
              ),

              counts[
                category
              ].Total
            ]
          );
        }
      );

      values.push(
        [
          'Total',

          ...STATE_CODES.map(
            stateCode =>
              stateTotals[
                stateCode
              ]
          ),

          grandTotal
        ]
      );

      return values;
    }

    /* ============================================================
       TABLE RENDERING
       ============================================================ */

    function getCategoryClass(
      value
    ) {
      const text =
        normaliseText(
          value
        );

      switch (
        text
      ) {
        case 'corporate':
          return 'category-corporate';

        case 'independent':
          return 'category-independent';

        case 'ophthal':
          return 'category-ophthal';

        case 'other':
          return 'category-other';

        default:
          return '';
      }
    }

    function getStateHeaderClass(
      value
    ) {
      const stateCode =
        cleanText(
          value
        ).toUpperCase();

      if (
        !STATE_CODES.includes(
          stateCode
        )
      ) {
        return '';
      }

      return `state-${stateCode.toLowerCase()}`;
    }

    function appendLiveDataCell(
      cell,
      source = 'live',
      lastUpdatedDate = '—'
    ) {
      const liveData =
        document.createElement(
          'span'
        );

      liveData.className =
        'live-data-inline';

      if (
        source === 'cached'
      ) {
        liveData.classList.add(
          'is-cached'
        );
      }

      if (
        source === 'unavailable'
      ) {
        liveData.classList.add(
          'is-unavailable'
        );
      }

      const dot =
        document.createElement(
          'span'
        );

      dot.className =
        'live-data-dot';

      dot.setAttribute(
        'aria-hidden',
        'true'
      );

      const text =
        document.createElement(
          'span'
        );

      if (
        source === 'cached'
      ) {
        text.textContent =
          'CACHED data';

        liveData.setAttribute(
          'aria-label',
          'Cached data'
        );
      } else if (
        source === 'unavailable'
      ) {
        text.textContent =
          'DATA unavailable';

        liveData.setAttribute(
          'aria-label',
          'Data unavailable'
        );
      } else {
        text.textContent =
          'LIVE data';

        liveData.setAttribute(
          'aria-label',
          `Live data, last updated ${lastUpdatedDate}`
        );
      }

      liveData.appendChild(
        dot
      );

      liveData.appendChild(
        text
      );

      if (
        source === 'live'
      ) {
        const lastUpdated =
          document.createElement(
            'span'
          );

        lastUpdated.className =
          'live-data-last-updated';

        lastUpdated.textContent =
          `(last updated ${lastUpdatedDate})`;

        liveData.appendChild(
          lastUpdated
        );
      }

      cell.appendChild(
        liveData
      );
    }

    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );
    }

    function renderCurrentTable() {
      if (
        !state.rawData
      ) {
        return;
      }

      const values =
        buildSummaryTable(
          state.rawData
        );

      renderTable(
        values,
        state.source,
        state.lastUpdatedDate
      );
    }

    function renderTable(
      values,
      source = 'live',
      lastUpdatedDate = '—'
    ) {
      hideLoadingState();

      timelineSection.style.display =
        '';

      const thead =
        dataTable.querySelector(
          'thead'
        );

      const tbody =
        dataTable.querySelector(
          'tbody'
        );

      thead.textContent =
        '';

      tbody.textContent =
        '';

      const headers =
        values?.[0] ??
        [];

      const dataRows =
        values?.slice(1) ??
        [];

      /* ---------- Header ---------- */

      const headerRow =
        document.createElement(
          'tr'
        );

      headers.forEach(
        (
          value,
          index
        ) => {
          const th =
            document.createElement(
              'th'
            );

          th.scope =
            'col';

          if (
            index === 0
          ) {
            appendLiveDataCell(
              th,
              source,
              lastUpdatedDate
            );
          } else {
            th.textContent =
              String(
                value ??
                ''
              );

            const stateClass =
              getStateHeaderClass(
                value
              );

            if (
              stateClass
            ) {
              th.classList.add(
                stateClass
              );
            }

            if (
              normaliseText(
                value
              ) === 'total'
            ) {
              th.classList.add(
                'total-column'
              );
            }
          }

          headerRow.appendChild(
            th
          );
        }
      );

      thead.appendChild(
        headerRow
      );

      const separatorRow =
        document.createElement(
          'tr'
        );

      separatorRow.className =
        'table-major-separator';

      const separatorCell =
        document.createElement(
          'td'
        );

      separatorCell.colSpan =
        Math.max(
          headers.length,
          1
        );

      separatorRow.appendChild(
        separatorCell
      );

      thead.appendChild(
        separatorRow
      );

      /* ---------- Data ---------- */

      dataRows.forEach(
        row => {
          const tr =
            document.createElement(
              'tr'
            );

          const isTotalRow =
            normaliseText(
              row?.[0]
            ) === 'total';

          if (
            isTotalRow
          ) {
            tr.classList.add(
              'total-row'
            );
          }

          headers.forEach(
            (
              _,
              index
            ) => {
              const td =
                document.createElement(
                  'td'
                );

              const rawValue =
                row?.[
                  index
                ] ??
                '';

              /*
               * Numeric 0 must remain visible.
               */
              td.textContent =
                rawValue === 0 ||
                rawValue === '0'
                  ? '0'
                  : String(
                      rawValue ??
                      ''
                    ).trim() ||
                    '—';

              if (
                index === 0 &&
                !isTotalRow
              ) {
                const categoryClass =
                  getCategoryClass(
                    rawValue
                  );

                if (
                  categoryClass
                ) {
                  td.classList.add(
                    categoryClass
                  );
                }
              }

              if (
                index ===
                headers.length - 1
              ) {
                td.classList.add(
                  'total-column'
                );
              }

              tr.appendChild(
                td
              );
            }
          );

          tbody.appendChild(
            tr
          );
        }
      );
    }

    /* ============================================================
       ERROR DISPLAY
       ============================================================ */

    function showError(
      error
    ) {
      console.error(
        error
      );

      hideLoadingState();

      timelineSection.style.display =
        'none';

      const thead =
        dataTable.querySelector(
          'thead'
        );

      const tbody =
        dataTable.querySelector(
          'tbody'
        );

      thead.textContent =
        '';

      tbody.textContent =
        '';

      const headerRow =
        document.createElement(
          'tr'
        );

      const headers = [
        '',
        ...STATE_CODES,
        'Total'
      ];

      headers.forEach(
        (
          value,
          index
        ) => {
          const th =
            document.createElement(
              'th'
            );

          if (
            index === 0
          ) {
            appendLiveDataCell(
              th,
              'unavailable'
            );
          } else {
            th.textContent =
              value;

            const stateClass =
              getStateHeaderClass(
                value
              );

            if (
              stateClass
            ) {
              th.classList.add(
                stateClass
              );
            }

            if (
              value === 'Total'
            ) {
              th.classList.add(
                'total-column'
              );
            }
          }

          headerRow.appendChild(
            th
          );
        }
      );

      thead.appendChild(
        headerRow
      );

      const row =
        document.createElement(
          'tr'
        );

      const cell =
        document.createElement(
          'td'
        );

      cell.colSpan =
        headers.length;

      cell.className =
        'error-message';

      cell.textContent =
        error?.message ||
        'Could not load data';

      row.appendChild(
        cell
      );

      tbody.appendChild(
        row
      );
    }

    /* ============================================================
       GOOGLE GVIZ NORMALISATION
       ============================================================ */

    function getCellDisplayValue(
      cell
    ) {
      if (
        !cell
      ) {
        return '';
      }

      return String(
        cell.f ??
        cell.v ??
        ''
      ).trim();
    }

    function normaliseGvizRawData(
      response
    ) {
      if (
        response?.status ===
        'error'
      ) {
        throw new Error(
          response?.errors?.[0]
            ?.detailed_message ||
          'Could not load Google Sheet data'
        );
      }

      const cols =
        response?.table?.cols ??
        [];

      const rows =
        response?.table?.rows ??
        [];

      const headers =
        cols.map(
          column =>
            String(
              column?.label ??
              ''
            ).trim()
        );

      const values =
        rows.map(
          row =>
            cols.map(
              (
                _,
                index
              ) =>
                getCellDisplayValue(
                  row?.c?.[
                    index
                  ]
                )
            )
        );

      return validateRawData({
        headers,
        rows:
          values
      });
    }

    /* ============================================================
       LOCAL RAW CACHE
       ============================================================ */

    function saveStoredRawData(
      rawData
    ) {
      try {
        localStorage.setItem(
          RAW_STORAGE_KEY,
          JSON.stringify(
            rawData
          )
        );
      } catch (
        error
      ) {
        console.warn(
          'Raw summary data could not be stored.',
          error
        );
      }
    }

    function loadStoredRawData() {
      try {
        const rawData =
          JSON.parse(
            localStorage.getItem(
              RAW_STORAGE_KEY
            ) ??
            'null'
          );

        if (
          !rawData
        ) {
          return null;
        }

        return validateRawData(
          rawData
        );
      } catch (
        error
      ) {
        console.warn(
          'Stored raw summary data could not be read.',
          error
        );

        return null;
      }
    }

    /* ============================================================
       APPS SCRIPT FULL TRACKER CACHE
       ============================================================ */

    function validateCachedTrackerData(
      data
    ) {
      const headerLabels =
        Array.isArray(
          data?.headerLabels
        )
          ? data.headerLabels
          : [];

      const rows =
        Array.isArray(
          data?.rows
        )
          ? data.rows
          : [];

      if (
        !headerLabels.length ||
        !rows.length
      ) {
        throw new Error(
          'Cached clinical job tracker data are incomplete.'
        );
      }

      return validateRawData({
        headers:
          headerLabels.map(
            value =>
              String(
                value ??
                ''
              )
          ),

        rows:
          rows.map(
            row =>
              Array.isArray(row)
                ? row.map(
                    value =>
                      String(
                        value ??
                        ''
                      )
                  )
                : []
          )
      });
    }

    function loadCachedTrackerSnapshot() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffClinicalSummaryCache_${
              Date.now()
            }_${
              Math.floor(
                Math.random() *
                100000
              )
            }`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Cached job tracker data timed out.'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] =
                undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          function finish(
            error,
            snapshot
          ) {
            if (
              settled
            ) {
              return;
            }

            settled =
              true;

            cleanup();

            if (
              error
            ) {
              reject(
                error
              );
            } else {
              resolve(
                snapshot
              );
            }
          }

          window[
            callbackName
          ] =
            snapshot => {
              if (
                !snapshot ||
                snapshot.ok !==
                  true ||
                snapshot.appKey !==
                  CACHE_APP_KEY
              ) {
                finish(
                  new Error(
                    snapshot?.error ||
                    'Cached job tracker data are unavailable.'
                  )
                );

                return;
              }

              try {
                snapshot.data =
                  validateCachedTrackerData(
                    snapshot.data
                  );
              } catch (
                error
              ) {
                finish(
                  error
                );

                return;
              }

              finish(
                null,
                snapshot
              );
            };

          script.onerror =
            () => {
              finish(
                new Error(
                  'Cached job tracker data could not be loaded.'
                )
              );
            };

          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `${
              CACHE_WEB_APP_URL
            }?${
              params.toString()
            }`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    /* ============================================================
       LIVE GOOGLE SHEET JSONP
       ============================================================ */

    function fetchLiveRawDataOnce() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffJobSummaryRaw_${
              Date.now()
            }_${
              Math.floor(
                Math.random() *
                100000
              )
            }`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Could not load data'
                  )
                );
              },
              FETCH_TIMEOUT_MS
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] =
                undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          function finish(
            error,
            response
          ) {
            if (
              settled
            ) {
              return;
            }

            settled =
              true;

            cleanup();

            if (
              error
            ) {
              reject(
                error
              );

              return;
            }

            try {
              resolve(
                normaliseGvizRawData(
                  response
                )
              );
            } catch (
              processingError
            ) {
              reject(
                processingError
              );
            }
          }

          window[
            callbackName
          ] =
            response => {
              finish(
                null,
                response
              );
            };

          script.onerror =
            () => {
              finish(
                new Error(
                  'Could not load data'
                )
              );
            };

          const params =
            new URLSearchParams({
              sheet:
                SHEET_NAME,

              range:
                RAW_RANGE,

              headers:
                '1',

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${
              SPREADSHEET_ID
            }/gviz/tq?${
              params.toString()
            }`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function delay(
      milliseconds
    ) {
      return new Promise(
        resolve => {
          window.setTimeout(
            resolve,
            milliseconds
          );
        }
      );
    }

    async function fetchLiveRawData() {
      let lastError =
        null;

      for (
        let attempt = 1;
        attempt <=
          FETCH_MAX_ATTEMPTS;
        attempt += 1
      ) {
        try {
          return await
            fetchLiveRawDataOnce();
        } catch (
          error
        ) {
          lastError =
            error;

          if (
            attempt <
            FETCH_MAX_ATTEMPTS
          ) {
            await delay(
              FETCH_RETRY_DELAY_MS
            );
          }
        }
      }

      throw (
        lastError ||
        new Error(
          'Could not load data'
        )
      );
    }

    /* ============================================================
       APPLY DATA
       ============================================================ */

    function applyRawData(
      rawData,
      source
    ) {
      const validated =
        validateRawData(
          rawData
        );

      state.rawData =
        validated;

      state.source =
        source;

      state.lastUpdatedDate =
        getSecondMostRecentRawDate(
          validated
        );

      configurePeriodFromRawData(
        validated
      );

      renderCurrentTable();
    }

    /* ============================================================
       FALLBACK
       ============================================================ */

    async function loadCachedFallback(
      originalError
    ) {
      /*
       * First try the central full Job Tracker cache.
       */
      try {
        const snapshot =
          await loadCachedTrackerSnapshot();

        const rawData =
          snapshot.data;

        saveStoredRawData(
          rawData
        );

        applyRawData(
          rawData,
          'cached'
        );

        return;
      } catch (
        cacheError
      ) {
        console.error(
          'Central cached tracker data failed',
          cacheError
        );
      }

      /*
       * Then use the most recent raw data saved in this browser.
       */
      const storedRawData =
        loadStoredRawData();

      if (
        storedRawData
      ) {
        applyRawData(
          storedRawData,
          'cached'
        );

        return;
      }

      showError(
        originalError
      );
    }

    /* ============================================================
       SLIDER EVENT
       ============================================================ */

    periodSlider.addEventListener(
      'input',
      () => {
        periodSliderWrap.classList.add(
          'has-been-dragged'
        );

        updatePeriodSliderUi();

        renderCurrentTable();
      }
    );

    /* ============================================================
       INITIALISE
       ============================================================ */

    async function initialise() {
      if (
        FORCE_CACHED_DATA
      ) {
        await loadCachedFallback(
          new Error(
            'Live data skipped for cache testing.'
          )
        );

        return;
      }

      try {
        const rawData =
          await fetchLiveRawData();

        saveStoredRawData(
          rawData
        );

        applyRawData(
          rawData,
          'live'
        );
      } catch (
        liveError
      ) {
        console.error(
          'Live job summary data failed',
          liveError
        );

        await loadCachedFallback(
          liveError
        );
      }
    }

    initialise();
  </script>
</body>
