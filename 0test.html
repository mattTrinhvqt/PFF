<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Permanent Salary Summary</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --increase: #16803c;
      --decrease: #c62828;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    #fit {
      width: 100%;
      overflow: hidden;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 14px 2px 14px;
      text-align: center;
    }

    #app.is-loading .response-summary,
    #app.is-loading .period-module,
    #app.is-loading .salary-section {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      filter: none;
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }

    /* ---------- Response count ---------- */

    .response-summary {
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: 5px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 31px;
      margin-top: 2px;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    /* ---------- Data period ---------- */

    .period-module {
      width: 100%;
      margin: 9px 0 0;
      padding: 0 5px;
    }

    .period-topline {
      display: flex;
      width: 100%;
      min-height: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 1px;
    }

    .period-label {
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .period-value {
      min-width: 120px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .period-slider-wrap {
      --period-progress: 100%;
      position: relative;
      width: 100%;
      min-height: 22px;
      margin: 0;
    }

    .period-slider-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 1;
      height: 4px;
      transform: translateY(-50%);
      background: linear-gradient(
        to right,
        rgba(21, 21, 21, 0.72) 0,
        rgba(21, 21, 21, 0.72) var(--period-progress),
        var(--track) var(--period-progress),
        var(--track) 100%
      );
      border-radius: 999px;
      pointer-events: none;
    }

    .period-range {
      position: relative;
      z-index: 3;
      display: block;
      width: 100%;
      height: 22px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    .period-range:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .period-range::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
      border-radius: 999px;
    }

    .period-range::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -4px;
      appearance: none;
      -webkit-appearance: none;
      background: var(--ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .period-range::-moz-range-track,
    .period-range::-moz-range-progress {
      height: 4px;
      background: transparent;
      border: 0;
      border-radius: 999px;
    }

    .period-range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .period-range:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.20);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .period-labels {
      position: relative;
      width: calc(100% - 12px);
      height: 12px;
      margin: -2px 6px 0;
      color: var(--muted);
      font-size: clamp(7px, 1.9vw, 9px);
      font-weight: 400;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .period-tick-label {
      position: absolute;
      top: 0;
      white-space: nowrap;
    }

    .period-tick-label:nth-child(1) {
      left: 0;
    }

    .period-tick-label:nth-child(2) {
      left: 33.333%;
      transform: translateX(-50%);
    }

    .period-tick-label:nth-child(3) {
      left: 66.667%;
      transform: translateX(-50%);
    }

    .period-tick-label:nth-child(4) {
      right: 0;
    }

    /* ---------- Compact salary distribution ---------- */

    .salary-distribution {
      width: calc(100% - 16px);
      margin: 13px auto 2px;
      padding: 0 2px;
    }

    .salary-distribution-title {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-align: left;
    }

    .distribution-track-wrap {
      position: relative;
      height: 19px;
      margin: 0 7px;
    }

    .distribution-track {
      position: absolute;
      top: 8px;
      right: 0;
      left: 0;
      height: 3px;
      background: var(--track);
      border-radius: 999px;
    }

    .distribution-range {
      position: absolute;
      top: 8px;
      right: 0;
      left: 0;
      height: 3px;
      background: rgba(102, 0, 255, 0.40);
      border-radius: 999px;
    }

    .distribution-marker {
      position: absolute;
      top: 4px;
      width: 3px;
      height: 11px;
      transform: translateX(-50%);
      background: var(--purple);
      border-radius: 999px;
    }

    .distribution-marker-low {
      left: 0%;
    }

    .distribution-marker-high {
      left: 100%;
    }

    .distribution-marker-median {
      left: var(--median-position, 50%);
      width: 5px;
      height: 13px;
      top: 3px;
      background: var(--ink);
    }

    .distribution-values {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 3px;
      margin-top: -1px;
      color: var(--muted);
      font-size: 8.5px;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .distribution-values span:nth-child(1) {
      text-align: left;
    }

    .distribution-values span:nth-child(2) {
      color: var(--ink);
      font-weight: 700;
      text-align: center;
    }

    .distribution-values span:nth-child(3) {
      text-align: right;
    }

    /* ---------- Salary table ---------- */

    .salary-section {
      width: 100%;
      margin-top: 6px;
    }

    .percentile-help {
      display: none;
      width: calc(100% - 14px);
      min-height: 22px;
      margin: 3px auto 5px;
      padding: 4px 7px;
      color: var(--muted);
      background: rgba(102, 0, 255, 0.035);
      border: 1px solid rgba(102, 0, 255, 0.12);
      border-radius: 4px;
      font-size: 9px;
      line-height: 1.3;
      text-align: center;
    }

    .percentile-help.is-visible {
      display: block;
    }

    .salary-table-wrap {
      position: relative;
      width: 100%;
    }

    .salary-table-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 24%;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .salary-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .salary-table th,
    .salary-table td {
      position: relative;
      padding: 8px 6px;
      line-height: 1.2;
      text-align: center;
      vertical-align: middle;
    }

    .salary-table th {
      color: var(--muted);
      font-size: clamp(10px, 3.1vw, 14px);
      font-weight: 700;
      white-space: nowrap;
    }

    .salary-table td {
      color: var(--ink);
      font-size: clamp(12px, 3.6vw, 15px);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .salary-table th + th,
    .salary-table td + td {
      border-left: 1px solid var(--track);
    }

    .salary-table th:nth-child(2),
    .salary-table td:nth-child(2) {
      border-left: 0;
    }

    .salary-table .table-major-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--ink);
    }

    .salary-table .table-empty-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--track);
    }

    .salary-table sup {
      font-size: 0.7em;
      line-height: 0;
      vertical-align: super;
    }

    .salary-table th:first-child,
    .salary-table td:first-child {
      width: 24%;
    }

    .salary-table td:first-child {
      font-weight: 700;
      white-space: nowrap;
    }

    .percentile-header-button {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      max-width: 100%;
      margin: 0;
      padding: 1px 1px;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: 3px;
      font: inherit;
      font-weight: inherit;
      line-height: inherit;
      white-space: nowrap;
      cursor: help;
    }

    .percentile-header-button:hover,
    .percentile-header-button:focus-visible,
    .percentile-header-button.is-open {
      color: var(--purple);
      background: rgba(102, 0, 255, 0.06);
    }

    .percentile-header-button:focus-visible {
      outline: 1px solid rgba(102, 0, 255, 0.35);
      outline-offset: 1px;
    }

    .cell-value {
      display: block;
      white-space: nowrap;
    }

    .cell-change {
      display: block;
      margin-top: 1px;
      font-size: 7.5px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .cell-change.is-increase {
      color: var(--increase);
    }

    .cell-change.is-decrease {
      color: var(--decrease);
    }

    .cell-change.is-neutral {
      color: var(--muted);
    }

    .salary-footnote {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: left;
    }

    .error {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 1px 12px;
      }

      .period-module {
        padding-right: 3px;
        padding-left: 3px;
      }

      .period-label,
      .period-value {
        font-size: 9px;
      }

      .salary-table th,
      .salary-table td {
        padding: 7px 2px;
      }

      .salary-table th {
        font-size: clamp(8px, 2.8vw, 11px);
      }

      .salary-table td {
        font-size: clamp(10px, 3.1vw, 12px);
      }

      .salary-table th:first-child,
      .salary-table td:first-child {
        width: 24%;
      }

      .salary-table td:first-child {
        font-size: clamp(9px, 3vw, 12px);
      }

      .cell-change {
        font-size: 7px;
      }

      .salary-footnote {
        font-size: 10px;
      }

      .app-loading {
        min-height: 175px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }

    @media (max-width: 350px) {
      .salary-table th {
        font-size: 8px;
      }

      .salary-table td {
        font-size: 10px;
      }

      .salary-table td:first-child {
        font-size: 9px;
      }

      .period-value {
        min-width: 105px;
        font-size: 8px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading">
      <div id="loading-state" class="app-loading" role="status" aria-label="Loading">
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading...</div>
      </div>

      <section class="response-summary" aria-live="polite">
        <div class="response-label">No. of responses</div>

        <div class="response-value-row">
          <div id="response-count" class="response-value"></div>
          <div id="dataSourceIndicator" class="live-data" aria-label="Live data">
            <span class="live-data-dot" aria-hidden="true"></span>
            <span id="dataSourceText">LIVE data</span>
          </div>
        </div>
      </section>

      <section class="period-module" aria-label="Data period">
        <div class="period-topline">
          <span class="period-label">Data period</span>
          <span id="period-value" class="period-value">12 mths</span>
        </div>

        <div id="period-slider-wrap" class="period-slider-wrap">
          <input
            id="period-slider"
            class="period-range"
            type="range"
            min="0"
            max="3"
            step="1"
            value="3"
            aria-label="Data period"
          >
        </div>

        <div class="period-labels" aria-hidden="true">
          <span class="period-tick-label">All</span>
          <span class="period-tick-label">24m</span>
          <span class="period-tick-label">18m</span>
          <span class="period-tick-label">12m</span>
        </div>
      </section>

      <section class="salary-section" aria-label="Permanent salary summary">
        <div id="salary-distribution" class="salary-distribution" aria-label="Salary distribution from 5th to 95th percentile">
          <div class="salary-distribution-title">Salary distribution · 5th–95th</div>

          <div id="distribution-track-wrap" class="distribution-track-wrap">
            <div class="distribution-track"></div>
            <div class="distribution-range"></div>
            <span class="distribution-marker distribution-marker-low" aria-hidden="true"></span>
            <span id="distribution-median-marker" class="distribution-marker distribution-marker-median" aria-hidden="true"></span>
            <span class="distribution-marker distribution-marker-high" aria-hidden="true"></span>
          </div>

          <div class="distribution-values">
            <span id="distribution-low">—</span>
            <span id="distribution-median">—</span>
            <span id="distribution-high">—</span>
          </div>
        </div>

        <div id="percentile-help" class="percentile-help" role="status" aria-live="polite"></div>

        <div class="salary-table-wrap">
          <table id="salary-table" class="salary-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="salary-footnote">
          Salary (FTE) excl. super, incl. location and weekend/night loadings<br>
          * adjusted to weekday FTE (i.e., no Sat/Sun)<br>
          <span id="change-footnote">Median change compares with the immediately preceding equivalent period.</span>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID =
      '1D4EoCMnH_RbwbuzFtw92NOwnvR_r9zQV7dAaXtfnnd0';

    const SHEET_GID = '0';
    const SHEET_NAME = 'Data';

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'permanent-salary-summary';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Testing switch only.
     * Leave false in normal use.
     * Set true temporarily to verify the existing cached-summary fallback.
     * The cached fallback is the all-time summary because the current cache
     * does not contain all raw fields required for time-filtered recalculation.
     */
    const FORCE_CACHED_DATA =
      false;

    /*
     * Live calculations use the raw/derived fields already present in Data:
     * A  = submission timestamp
     * M  = mode full-time weekly hours (M2; normally 38)
     * AM = hours worked per week
     * AN = rostered Saturdays / 4 weeks
     * AO = rostered Sundays / 4 weeks
     * AP = rostered late nights / 4 weeks
     * AY = FTE salary
     * AZ = FTE salary adjusted to weekday FTE
     * BE = FTE bonuses
     * BF = FTE bonuses adjusted to weekday FTE
     */
    const RAW_DATA_RANGE = 'A:BF';

    const RAW_COLUMNS = Object.freeze({
      date: 0,
      modeFteHours: 12,
      hoursPerWeek: 38,
      saturdays: 39,
      sundays: 40,
      lateNights: 41,
      salary: 50,
      adjustedSalary: 51,
      bonuses: 56,
      adjustedBonuses: 57
    });

    const EXPECTED_SALARY_COLS = 6;
    const EXPECTED_SALARY_DATA_ROWS = 12;

    const DAY_MS = 86400000;

    const PERIODS = [
      {
        sliderLabel: 'All',
        displayLabel: 'All',
        months: null
      },
      {
        sliderLabel: '24m',
        displayLabel: '24 mths',
        months: 24

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function toNumber(value) {
      const cleaned = cleanText(value)
        .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number = Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function getCellValue(cell) {
      return cell?.v ?? cell?.f ?? '';
    }

    function parseDate(value) {
      if (
        value instanceof Date &&
        !Number.isNaN(value.getTime())
      ) {
        return Date.UTC(
          value.getFullYear(),
          value.getMonth(),
          value.getDate()
        );
      }

      if (
        typeof value === 'number' &&
        value > 20000 &&
        value < 80000
      ) {
        return (
          Date.UTC(1899, 11, 30) +
          value * DAY_MS
        );
      }

      const text =
        cleanText(value);

      if (!text) {
        return null;
      }

      const googleDate = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/
      );

      if (googleDate) {
        return Date.UTC(
          Number(googleDate[1]),
          Number(googleDate[2]),
          Number(googleDate[3])
        );
      }

      const auDate = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})/
      );

      if (auDate) {
        let year =
          Number(auDate[3]);

        if (year < 100) {
          year += 2000;
        }

        return Date.UTC(
          year,
          Number(auDate[2]) - 1,
          Number(auDate[1])
        );
      }

      const isoDate = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
      );

      if (isoDate) {
        return Date.UTC(
          Number(isoDate[1]),
          Number(isoDate[2]) - 1,
          Number(isoDate[3])
        );
      }

      const parsed =
        new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          );
    }

    function subtractUtcMonths(timestamp, months) {
      const date =
        new Date(timestamp);

      const originalDay =
        date.getUTCDate();

      const target =
        new Date(
          Date.UTC(
            date.getUTCFullYear(),
            date.getUTCMonth() - months,
            1
          )
        );

      const lastDay =
        new Date(
          Date.UTC(
            target.getUTCFullYear(),
            target.getUTCMonth() + 1,
            0
          )
        ).getUTCDate();

      target.setUTCDate(
        Math.min(
          originalDay,
          lastDay
        )
      );

      return target.getTime();
    }

    function formatMonthYear(timestamp) {

      return new Intl.DateTimeFormat(

        }
      ).format(

      );
    }

    function percentile(sortedValues, probability) {
      if (!sortedValues.length) {
        return NaN;
      }

      const index =
        (sortedValues.length - 1) *
        probability;

      const lowerIndex =
        Math.floor(index);

      const upperIndex =
        Math.ceil(index);

      if (lowerIndex === upperIndex) {
        return sortedValues[lowerIndex];
      }

      return (
        sortedValues[lowerIndex] +
        (
          sortedValues[upperIndex] -
          sortedValues[lowerIndex]
        ) *
        (index - lowerIndex)
      );
    }

    function calculatePercentiles(values) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      return PERCENTILES.map(
        item =>
          percentile(
            sorted,
            item.probability
          )
      );
    }

    function formatCompactCurrency(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      if (number === 0) {
        return '$0';
      }

      const absolute =
        Math.abs(number);

      if (absolute >= 1000000) {
        const scaled =
          number / 1000000;

        return `$${new Intl.NumberFormat('en-AU', {
          maximumFractionDigits: 1
        }).format(scaled)}m`;
      }

      if (absolute >= 1000) {
        const scaled =
          number / 1000;

        return `$${new Intl.NumberFormat('en-AU', {
          maximumFractionDigits:
            Math.abs(scaled - Math.round(scaled)) < 0.05
              ? 0
              : 1
        }).format(scaled)}k`;
      }

      return `$${new Intl.NumberFormat('en-AU', {
        maximumFractionDigits: 0
      }).format(number)}`;
    }

    function formatHourly(value) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? `$${new Intl.NumberFormat('en-AU', {
            maximumFractionDigits: 0
          }).format(number)}`
        : '—';
    }

    function formatPlainNumber(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      return new Intl.NumberFormat(
        'en-AU',
        {
          maximumFractionDigits:
            Math.abs(number - Math.round(number)) < 0.05
              ? 0
              : 1
        }
      ).format(number);
    }

    function formatMetricValue(metricKey, value) {
      if (
        metricKey === 'salary' ||
        metricKey === 'bonuses' ||
        metricKey === 'adjustedSalary' ||
        metricKey === 'adjustedBonuses'
      ) {
        return formatCompactCurrency(value);
      }

      if (
        metricKey === 'hourly' ||
        metricKey === 'adjustedHourly'
      ) {
        return formatHourly(value);
      }

      return formatPlainNumber(value);
    }

    function percentChange(current, previous) {
      if (
        !Number.isFinite(current) ||
        !Number.isFinite(previous) ||
        previous === 0
      ) {
        return null;
      }

      return (
        (current - previous) /
        Math.abs(previous) *
        100
      );
    }

    function formatChange(value) {
      if (!Number.isFinite(value)) {
        return '';
      }

      if (Math.abs(value) < 0.05) {
        return '0.0%';
      }

      const arrow =
        value > 0
          ? '▲'
          : '▼';

      return `${arrow}${Math.abs(value).toFixed(1)}%`;
    }

    function changeClass(value) {
      if (!Number.isFinite(value)) {

      if (Math.abs(value) < 0.05) {
        return 'is-neutral';

      return value > 0
        ? 'is-increase'
        : 'is-decrease';
    }

        cleanText(label)
          .toLowerCase();

        return 'salary';

      if (
        text.includes('hrly') &&
        text.includes('*')
      ) {
        return 'adjustedHourly';
      }

      if (text.includes('hrly')) {
        return 'hourly';
      }

      if (
        text === 'bonuses*'
      ) {
        return 'adjustedBonuses';
      }

      if (text === 'bonuses') {
        return 'bonuses';
      }

      if (text === 'salary*') {
        return 'adjustedSalary';
      }

      return 'plain';
    }

    function updateDistribution(values) {

        Number(values?.[0]);

      const high =
        Number(values?.[4]);

      distributionLow.textContent =
        formatCompactCurrency(low);

      distributionMedian.textContent =
        formatCompactCurrency(median);

      distributionHigh.textContent =
        formatCompactCurrency(high);

      let position = 50;

      if (
        Number.isFinite(low) &&
        Number.isFinite(median) &&
        Number.isFinite(high) &&
        high > low
      ) {
        position =
          Math.max(
            0,
            Math.min(
              100,
              (
                (median - low) /
                (high - low)
              ) *
              100
            )
          );
      }

      distributionMedianMarker.style.left =
        `${position}%`;
    }

    function normaliseRawRows(response) {
      const sourceRows =
        response?.table?.rows || [];

      const result = [];
      const fteHourCandidates = [];

      sourceRows.forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const date =
            parseDate(
              getCellValue(
                cells[
                  RAW_COLUMNS.date
                ]
              )
            );

          const modeHours =
            toNumber(
              getCellValue(
                cells[
                  RAW_COLUMNS.modeFteHours
                ]
              )
            );

          if (
            Number.isFinite(modeHours) &&
            modeHours > 0
          ) {
            fteHourCandidates.push(
              modeHours
            );
          }

          if (!Number.isFinite(date)) {
            return;
          }

          const row = {
            date,
            salary:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.salary
                  ]
                )
              ),
            adjustedSalary:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.adjustedSalary
                  ]
                )
              ),
            bonuses:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.bonuses
                  ]
                )
              ),
            adjustedBonuses:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.adjustedBonuses
                  ]
                )
              ),
            hoursPerWeek:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.hoursPerWeek
                  ]
                )
              ),
            saturdays:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.saturdays
                  ]
                )
              ),
            sundays:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.sundays
                  ]
                )
              ),
            lateNights:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.lateNights
                  ]
                )
              )
          };

          result.push(row);
        }
      );

      if (fteHourCandidates.length) {
        fteWeeklyHours =
          fteHourCandidates[0];
      }

      return result;
    }

    function validSalary(value) {
      return (
        Number.isFinite(value) &&
        value >= 30000 &&
        value <= 500000
      );
    }

    function validBonus(value) {
      return (
        Number.isFinite(value) &&
        value >= 0
      );
    }

    function validHours(value) {
      return (
        Number.isFinite(value) &&
        value > 0 &&
        value <= 100
      );
    }

    function validShiftCount(value) {
      return (
        Number.isFinite(value) &&
        value >= 0 &&
        value <= 31
      );
    }

    function valuesForMetric(rows, key) {
      if (key === 'salary') {
        return rows
          .map(row => row.salary)
          .filter(validSalary);
      }

      if (key === 'hourly') {
        return rows
          .map(
            row =>
              validSalary(row.salary)
                ? row.salary /
                  52 /
                  fteWeeklyHours
                : NaN
          )
          .filter(Number.isFinite);
      }

      if (key === 'bonuses') {
        return rows
          .map(row => row.bonuses)
          .filter(validBonus);
      }

      if (key === 'adjustedSalary') {
        return rows
          .map(row => row.adjustedSalary)
          .filter(validSalary);
      }

      if (key === 'adjustedHourly') {
        return rows
          .map(
            row =>
              validSalary(row.adjustedSalary)
                ? row.adjustedSalary /
                  52 /
                  fteWeeklyHours
                : NaN
          )
          .filter(Number.isFinite);
      }

      if (key === 'adjustedBonuses') {
        return rows
          .map(row => row.adjustedBonuses)
          .filter(validBonus);
      }

      if (key === 'hoursPerWeek') {
        return rows
          .map(row => row.hoursPerWeek)
          .filter(validHours);
      }

      if (key === 'saturdays') {
        return rows
          .map(row => row.saturdays)
          .filter(validShiftCount);
      }

      if (key === 'sundays') {
        return rows
          .map(row => row.sundays)
          .filter(validShiftCount);
      }

      if (key === 'lateNights') {
        return rows
          .map(row => row.lateNights)
          .filter(validShiftCount);
      }

      return [];
    }

    function calculateSummary(rows) {
      const metricKeys = [
        'salary',
        'hourly',
        'bonuses',
        'adjustedSalary',
        'adjustedHourly',
        'adjustedBonuses',
        'hoursPerWeek',
        'saturdays',
        'sundays',
        'lateNights'
      ];

      const metrics = {};

      metricKeys.forEach(
        key => {
          metrics[key] =
            calculatePercentiles(
              valuesForMetric(
                rows,
                key
              )
            );
        }
      );

      return {
        metrics,
        changes: {
          salary: null,
          hourly: null
        }
      };
    }

    function currentPeriod() {
      const index =
        Number(periodSlider.value);

      return (
        PERIODS[index] ||
        PERIODS[PERIODS.length - 1]
      );
    }

    function selectedPeriodBounds(period) {
      if (
        !Number.isFinite(latestDate) ||
        !Number.isFinite(earliestDate)
      ) {
        return null;
      }

      if (period.months === null) {
        return {
          start: earliestDate,
          end: latestDate
        };
      }

      return {
        start:
          subtractUtcMonths(
            latestDate,
            period.months
          ),
        end:
          latestDate
      };
    }

    function previousPeriodBounds(period, currentBounds) {
      if (
        period.months === null ||
        !currentBounds
      ) {
        return null;
      }

      const end =
        currentBounds.start -
        DAY_MS;

      return {
        start:
          subtractUtcMonths(
            currentBounds.start,
            period.months
          ),
        end
      };
    }

    function rowsWithin(bounds) {
      if (!bounds) {
        return [];
      }

      return rawRows.filter(
        row =>
          row.date >= bounds.start &&
          row.date <= bounds.end
      );
    }

    function updatePeriodProgress() {
      const minimum =
        Number(periodSlider.min);

      const maximum =
        Number(periodSlider.max);

      const value =
        Number(periodSlider.value);

      const progress =
        maximum === minimum
          ? 100
          : (
              (value - minimum) /
              (maximum - minimum)
            ) *
            100;

      periodSliderWrap.style.setProperty(
        '--period-progress',
        `${progress}%`
      );
    }

    function renderLivePeriod() {
      const period =
        currentPeriod();

      const currentBounds =
        selectedPeriodBounds(
          period
        );

      const previousBounds =
        previousPeriodBounds(
          period,
          currentBounds
        );

      const selectedRows =
        rowsWithin(
          currentBounds
        );

      const previousRows =
        rowsWithin(
          previousBounds
        );

      const summary =
        calculateSummary(
          selectedRows
        );

      const previousSummary =
        calculateSummary(
          previousRows
        );

      summary.changes.salary =
        percentChange(
          summary.metrics.salary?.[2],
          previousSummary.metrics.salary?.[2]
        );

      summary.changes.hourly =
        percentChange(
          summary.metrics.hourly?.[2],
          previousSummary.metrics.hourly?.[2]
        );

      responseCount.textContent =
        String(
          selectedRows.length
        );

      responseCount.classList.remove(
        'error'
      );

      const rangeText =
        currentBounds
          ? `${formatMonthYear(currentBounds.start)}–${formatMonthYear(currentBounds.end)}`
          : '—';

      periodValue.textContent =
        `${period.displayLabel} · ${rangeText}`;

      periodSlider.setAttribute(
        'aria-valuetext',
        periodValue.textContent
      );

      changeFootnote.style.display =
        period.months === null
          ? 'none'
          : '';

      renderCalculatedSalaryTable(
        summary
      );

      updateDistribution(
        summary.metrics.salary
      );

      percentileHelp.textContent = '';
      percentileHelp.classList.remove(
        'is-visible'
      );

      updatePeriodProgress();
    }

    function showError(error) {
      console.error(error);

      responseCount.textContent = '—';
      responseCount.classList.add('error');

      salaryTable.querySelector('thead').textContent = '';
      salaryTable.querySelector('tbody').textContent = '';

      periodValue.textContent =
        'Data unavailable';

      periodSlider.disabled = true;

      updateDistribution([]);
      hideLoadingState();
    }

    function getCellDisplayValue(cell) {
      if (!cell) return '';
      return String(
        cell.f ?? cell.v ?? ''
      ).trim();
    }

    function loadGvizRange(
      range,
      headers = 0,
      sheetName = ''
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `permSalarySummaryCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

          const script =
            document.createElement('script');

          const timeout =
            window.setTimeout(
              () => {
                cleanup();
                reject(
                  new Error(
                    'Could not load data'
                  )
                );
              },
              15000
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (error) {
              window[
                callbackName
              ] = undefined;
            }

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          window[callbackName] =
            response => {
              cleanup();

              if (
                response?.status ===
                'error'
              ) {
                reject(
                  new Error(
                    response?.errors?.[0]?.detailed_message ||
                    'Could not load Google Sheet data'
                  )
                );

                return;
              }

              resolve(response);
            };

          script.onerror =
            () => {
              cleanup();
              reject(
                new Error(
                  'Could not load data'
                )
              );
            };

          const params =
            new URLSearchParams({
              gid: SHEET_GID,
              range,
              headers:
                String(headers),
              tqx:
                `responseHandler:${callbackName}`
            });

          if (sheetName) {
            params.set(
              'sheet',
              sheetName
            );
          }

          script.src =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function validateCachedDashboardData(data) {
      const cachedResponseCount =
        String(
          data?.responseCount ??
          ''
        ).trim();

      const salaryTableValues =
        Array.isArray(
          data?.salaryTableValues
        )
          ? data.salaryTableValues
          : [];

      if (
        !cachedResponseCount ||
        cachedResponseCount === '—' ||
        salaryTableValues.length !==
          EXPECTED_SALARY_DATA_ROWS + 1 ||
        salaryTableValues.some(
          row =>
            !Array.isArray(row) ||
            row.length <
              EXPECTED_SALARY_COLS
        )
      ) {
        throw new Error(
          'The cached permanent salary summary is incomplete'
        );
      }

      return {
        responseCount:
          cachedResponseCount,
        salaryTableValues:
          salaryTableValues.map(
            row =>
              row
                .slice(
                  0,
                  EXPECTED_SALARY_COLS
                )
                .map(
                  value =>
                    String(
                      value ?? ''
                    ).trim()
                )
          )
      };
    }

    function loadCachedDashboardData() {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `permSalarySummaryCache_${Date.now()}_${Math.floor(Math.random() * 1000000)}`;

          const script =
            document.createElement('script');

          let settled = false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'The cached-data request timed out'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          function finish(
            error,
            data
          ) {
            if (settled) {
              return;
            }

            settled = true;
            cleanup();

            if (error) {
              reject(error);
              return;
            }

            resolve(data);
          }

          window[callbackName] =
            response => {
              if (
                !response ||
                response.ok !== true
              ) {
                finish(
                  new Error(
                    response?.error ||
                    'The cached-data service did not return a snapshot'
                  )
                );

                return;
              }

              if (
                response.appKey !==
                CACHE_APP_KEY
              ) {
                finish(
                  new Error(
                    'The cached-data response belongs to a different app'
                  )
                );

                return;
              }

              if (
                !response.cachedAt ||
                Number.isNaN(
                  Date.parse(
                    response.cachedAt
                  )
                )
              ) {
                finish(
                  new Error(
                    'The cached-data response has no valid timestamp'
                  )
                );

                return;
              }

              try {
                finish(
                  null,
                  validateCachedDashboardData(
                    response.data
                  )
                );
              } catch (error) {
                finish(error);
              }
            };

          script.onerror =
            () => {
              finish(
                new Error(
                  'Could not load the cached-data service'
                )
              );
            };

          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,
              callback:
                callbackName,
              _:
                String(
                  Date.now()
                )
            });

          const separator =
            CACHE_WEB_APP_URL.includes('?')
              ? '&'
              : '?';

          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function renderCachedDashboardData(data) {
      usingLiveRawData = false;

      responseCount.textContent =
        data.responseCount;

      responseCount.classList.remove(
        'error'
      );

      periodSlider.value = '0';
      periodSlider.disabled = true;

      periodValue.textContent =
        'All · cached snapshot';

      updatePeriodProgress();

      renderCachedSalaryTable(
        data.salaryTableValues
      );

      const salaryRow =
        data.salaryTableValues.find(
          row =>
            cleanText(row?.[0])
              .toLowerCase() ===
            'salary'
        );

      if (salaryRow) {
        updateDistribution(
          [
            toNumber(salaryRow[1]),
            toNumber(salaryRow[2]),
            toNumber(salaryRow[3]),
            toNumber(salaryRow[4]),
            toNumber(salaryRow[5])
          ]
        );
      } else {
        updateDistribution([]);
      }

      changeFootnote.style.display =
        'none';

      hideLoadingState();
    }

    async function loadLiveDashboardData() {
      const response =
        await loadGvizRange(
          RAW_DATA_RANGE,
          1,
          SHEET_NAME
        );

      const rows =
        normaliseRawRows(
          response
        );

      if (!rows.length) {
        throw new Error(
          'Live permanent salary raw data are incomplete'
        );
      }

      const dates =
        rows
          .map(row => row.date)
          .filter(Number.isFinite);

      if (!dates.length) {
        throw new Error(
          'No valid salary submission dates were found'
        );
      }

      rawRows = rows;
      earliestDate =
        Math.min(...dates);
      latestDate =
        Math.max(...dates);

      usingLiveRawData = true;

      periodSlider.disabled = false;
      periodSlider.value = '3';

      renderLivePeriod();
    }

    async function loadDashboardData() {
      let liveError = null;

      if (!FORCE_CACHED_DATA) {
        try {
          await loadLiveDashboardData();

          setDataSource('live');
          hideLoadingState();
          return;
        } catch (error) {
          liveError = error;

          console.warn(
            'Live Google Sheets data could not be used',
            error
          );
        }
      } else {
        liveError =
          new Error(
            'Live data bypassed for cached-data test'
          );
      }

      try {
        const cachedData =
          await loadCachedDashboardData();

        setDataSource('cached');

        console.warn(
          'Using cached permanent salary summary data',
          liveError?.message
        );

        renderCachedDashboardData(
          cachedData
        );
      } catch (cachedError) {
        setDataSource('none');

        console.error(
          'Live Google Sheets data error',
          liveError
        );

        console.error(
          'Cached Apps Script data error',
          cachedError
        );

        showError(
          new Error(
            'Live and cached data are currently unavailable'
          )
        );
      }
    }

    periodSlider.addEventListener(
      'input',
      () => {
        if (!usingLiveRawData) {
          return;
        }

        renderLivePeriod();
      }
    );

    document.addEventListener(
      'pointerdown',
      event => {
        if (
          event.target.closest(
            '.percentile-header-button'
          ) ||
          event.target.closest(
            '#percentile-help'
          )
        ) {
          return;
        }

        salaryTable
          .querySelectorAll(
            '.percentile-header-button'
          )
          .forEach(
            button =>
              button.classList.remove(
                'is-open'
              )
          );

        percentileHelp.textContent = '';
        percentileHelp.classList.remove(
          'is-visible'
        );
      }
    );

    updatePeriodProgress();
    loadDashboardData();
  </script>
</body>
</html>
