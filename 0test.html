<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Locum Rates Data</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js?v=1.2.0-20260910c"></script>

  <style>
    /* Locum Rates-specific components only. Shared PFF chart styling lives in pff_chart_core.js. */

    .chart-heading-row {
      position: relative;
      display: block;
      width: 100%;
      height: 30px;
      min-width: 0;
      min-height: 30px;
      flex: 0 0 auto;
      margin: 0;
    }

    .chart-heading {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 4px 116px 0 0;
      overflow: visible;
      color: var(--pff-ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
      will-change: opacity;
    }

    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;
      display: inline-flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      color: var(--pff-muted);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--pff-ink);
      border-color: var(--pff-ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--pff-purple);
      font-size: 15px;
      line-height: 1;
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .chart-options-row .legend-nav {
      min-width: 54px;
      flex: 1 1 auto;
    }

    .chart-note {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      max-width: min(230px, calc(100% - 80px));
      padding: 5px 7px;
      color: var(--pff-muted);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(105, 113, 138, 0.16);
      border-radius: 4px;
      font-size: 8.5px;
      line-height: 1.3;
      pointer-events: none;
    }

    .chart-note.is-hidden {
      display: none;
    }

    @media (max-width: 430px) {
      .chart-heading-row {
        height: 29px;
        min-height: 29px;
      }

      .chart-heading {
        padding-top: 4px;
        padding-right: 108px;
        font-size: 14px;
        line-height: 21px;
      }

      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .chart-note {
        max-width: min(205px, calc(100% - 68px));
        font-size: 8px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 100px;
        font-size: 13px;
      }

      .reaggregate-button {
        font-size: 9px;
      }
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading locum rate data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading locum rate data…</div>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll locum rate tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Locum rate views"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-view="experience"
              aria-selected="true"
            >
              Experience
            </button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="rurality"
              aria-selected="false"
            >
              Rurality
            </button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="location"
              aria-selected="false"
            >
              State
            </button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="structure"
              aria-selected="false"
            >
              Business
            </button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="date"
              aria-selected="false"
            >
              Time
            </button>
          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"
            type="button"
            aria-label="Scroll locum rate tabs right"
          >›</button>
        </div>

        <div id="dataSourceIndicator" class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 id="chartHeading" class="chart-heading">
          <span class="chart-heading-fixed">Locum rates</span><span id="chartHeadingDetail" class="chart-heading-detail">by experience</span>
        </h2>

        <button
          id="reaggregateButton"
          class="reaggregate-button is-hidden"
          type="button"
          aria-hidden="true"
          tabindex="-1"
        >
          <span>Re-aggregate</span>
          <span class="reset-icon" aria-hidden="true">↻</span>
        </button>
      </div>

      <div class="chart-options-row">
        <div id="legendNav" class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >
            &#8249;
          </button>

          <div id="legendViewport" class="legend-viewport">
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Chart legend"
            ></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >
            &#8250;
          </button>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <aside id="chartNote" class="chart-note is-hidden" role="note"></aside>

        <canvas
          id="locumChart"
          aria-label="Locum rate chart"
          tabindex="-1"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    const CONFIG = {
      sheetId: '1wmrmNS4cz-_aPKnyBVg7-SShbhs6czMNh07UjyLo04s',
      sheetName: 'Data',
      range: 'A:J',
      fetchTimeoutMs: 20000,
      localCacheKey: 'pff-locum-rates-data-v1',

      transitionMs: PFF.defaults.viewTransitionMs,
      splitAnimationMs: 820,
      mergeAnimationMs: 820,
      doubleActivationMs: 420,

      pointRadius: 2.7,
      pointHoverRadius: 4.4,
      regressionWidth: 3.6,

      pointOpacity: 0.20,
      pointHoverOpacity: 0.68,
      categoryPointOpacity: 0.20,
      categoryPointHoverOpacity: 0.68,

      aggregateOpacity: 0.91,
      aggregateHoverOpacity: 0.98,
      dimmedAggregateOpacity: 0.48,
      dimmedAggregateHoverOpacity: 0.60,
      rawPointRadius: 4,

      minimumHourlyRate: 0,
      maximumHourlyRate: 500
    };

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'locum-rates-data';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Testing switch only.
     * Leave false in normal use.
     * Set true temporarily to verify the cached-data fallback.
     */
    const FORCE_CACHED_DATA =
      false;

    const VIEW_CONFIG = {
      experience: {
        headingDetail: 'by experience'
      },
      rurality: {
        headingDetail: 'by rurality'
      },
      structure: {
        headingDetail: 'by business structure'
      },
      location: {
        headingDetail: 'by state'
      },
      date: {
        headingDetail: 'over time'
      }
    };

    const STATE_ORDER = [
      'NSW',
      'QLD',
      'VIC',
      'ACT',
      'SA',
      'NT',
      'WA',
      'TAS'
    ];

    const STATE_COLOURS =
      PFF.stateColours;

    const RURALITY_ORDER = [
      'MM1',
      'MM2',
      'MM3',
      'MM4',
      'MM5',
      'MM6',
      'MM7'
    ];

    const RURALITY_COLOURS =
      PFF.mmmColours;

    const STRUCTURE_ORDER = [
      'Unspecified',
      'Sole trader',
      'Company/trust'
    ];

    const STRUCTURE_COLOURS = {
      Unspecified: '#bfc3c7',
      'Sole trader': '#5a3be7',
      'Company/trust': '#00b26f'
    };

    const YEAR_MS =
      365.2425 * 86400000;

    const app =
      document.getElementById('app');

    const statusElement =
      document.getElementById('status');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const reaggregateButton =
      document.getElementById('reaggregateButton');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartTabs =
      [...document.querySelectorAll('.chart-tab')];

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartNote =
      document.getElementById('chartNote');

    const chartShell =
      document.getElementById('chartShell');

    const chartCanvas =
      document.getElementById('locumChart');

    let chart = null;
    let rows = [];
    let activeView = 'experience';
    let interactionLocked = false;
    let viewMorphInProgress = false;
    let currentXAxisOptions = null;
    let tabsController = null;
    let legendController = null;
    let responsiveController = null;
    let interactionsController = null;

    const animationController =
      PFFCharts.createAnimationController();


    const yAxisModel = {
      minimum: 40,
      maximum: 160,
      majorStep: 10,
      minorStep: 5
    };

    const xAxisFade = {
      active: false,
      progress: 1,
      from: null,
      changes: {
        ticks: false,
        labels: false,
        title: false,
        border: false
      }
    };

    function getXAxisChangeMap(
      previousOptions,
      nextOptions
    ) {
      const previousView =
        previousOptions?.pffTickView || '';

      const nextView =
        nextOptions?.pffTickView || '';

      const previousAxisVisible =
        previousOptions?.display !== false;

      const nextAxisVisible =
        nextOptions?.display !== false;

      const previousTicksVisible =
        previousAxisVisible &&
        previousOptions?.grid?.drawTicks !== false &&
        previousView !== 'hidden';

      const nextTicksVisible =
        nextAxisVisible &&
        nextOptions?.grid?.drawTicks !== false &&
        nextView !== 'hidden';

      const previousLabelsVisible =
        previousAxisVisible &&
        previousOptions?.ticks?.display !== false &&
        previousView !== 'hidden';

      const nextLabelsVisible =
        nextAxisVisible &&
        nextOptions?.ticks?.display !== false &&
        nextView !== 'hidden';

      const previousTitleText =
        previousOptions?.title?.text;

      const nextTitleText =
        nextOptions?.title?.text;

      const previousTitleHasText =
        Array.isArray(previousTitleText)
          ? previousTitleText.some(Boolean)
          : Boolean(previousTitleText);

      const nextTitleHasText =
        Array.isArray(nextTitleText)
          ? nextTitleText.some(Boolean)
          : Boolean(nextTitleText);

      const previousTitleVisible =
        previousAxisVisible &&
        previousOptions?.title?.display !== false &&
        previousTitleHasText;

      const nextTitleVisible =
        nextAxisVisible &&
        nextOptions?.title?.display !== false &&
        nextTitleHasText;

      const previousBorderVisible =
        previousAxisVisible &&
        previousOptions?.border?.display !== false;

      const nextBorderVisible =
        nextAxisVisible &&
        nextOptions?.border?.display !== false;

      const previousTickSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        tickLength: previousOptions?.grid?.tickLength
      });

      const nextTickSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        tickLength: nextOptions?.grid?.tickLength
      });

      const previousLabelSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        colour: previousOptions?.ticks?.color,
        font: previousOptions?.ticks?.font || {}
      });

      const nextLabelSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        colour: nextOptions?.ticks?.color,
        font: nextOptions?.ticks?.font || {}
      });

      const previousTitleSignature = JSON.stringify({
        text: previousTitleText,
        colour: previousOptions?.title?.color,
        font: previousOptions?.title?.font || {},
        padding: previousOptions?.title?.padding || {}
      });

      const nextTitleSignature = JSON.stringify({
        text: nextTitleText,
        colour: nextOptions?.title?.color,
        font: nextOptions?.title?.font || {},
        padding: nextOptions?.title?.padding || {}
      });

      const previousBorderSignature = JSON.stringify({
        colour: previousOptions?.border?.color,
        width: previousOptions?.border?.width
      });

      const nextBorderSignature = JSON.stringify({
        colour: nextOptions?.border?.color,
        width: nextOptions?.border?.width
      });

      return {
        ticks:
          previousTicksVisible !== nextTicksVisible ||
          (
            previousTicksVisible &&
            nextTicksVisible &&
            previousTickSignature !== nextTickSignature
          ),

        labels:
          previousLabelsVisible !== nextLabelsVisible ||
          (
            previousLabelsVisible &&
            nextLabelsVisible &&
            previousLabelSignature !== nextLabelSignature
          ),

        title:
          previousTitleVisible !== nextTitleVisible ||
          (
            previousTitleVisible &&
            nextTitleVisible &&
            previousTitleSignature !== nextTitleSignature
          ),

        border:
          previousBorderVisible !== nextBorderVisible ||
          (
            previousBorderVisible &&
            nextBorderVisible &&
            previousBorderSignature !== nextBorderSignature
          )
      };
    }

    function isMajorXAxisTick(value, view) {
      if (!Number.isFinite(value)) {
        return false;
      }

      if (view === 'experience') {
        return value % 5 === 0;
      }

      if (view === 'date') {
        const month =
          new Date(value).getUTCMonth();

        return [0, 3, 6, 9].includes(month);
      }

      return false;
    }

    function isMajorYAxisTick(value) {
      if (!Number.isFinite(value)) {
        return false;
      }

      return (
        (value - yAxisModel.minimum) %
        yAxisModel.majorStep === 0
      );
    }

    function drawVariableAxisTicks(
      context,
      scale,
      axis,
      view
    ) {
      if (!scale) {
        return;
      }

      const ticks =
        scale.ticks || [];

      if (!ticks.length) {
        return;
      }

      const tickColour =
        axis === 'x'
          ? fadeCssColour(
              '#151515',
              getIncomingXAxisOpacity('ticks')
            )
          : '#151515';

      context.save();
      context.lineCap = 'butt';

      ticks.forEach((tick, index) => {
        const value =
          Number(tick.value);

        const pixel =
          scale.getPixelForTick(index);

        if (!Number.isFinite(pixel)) {
          return;
        }

        const isMajor =
          axis === 'x'
            ? isMajorXAxisTick(value, view)
            : isMajorYAxisTick(value);

        const tickLength =
          axis === 'x'
            ? isMajor
              ? 6
              : 2
            : isMajor
              ? 5
              : 2;

        const tickWidth =
          isMajor
            ? 1.1
            : 0.7;

        context.beginPath();
        context.strokeStyle = tickColour;
        context.lineWidth = tickWidth;

        if (axis === 'x') {
          context.moveTo(
            pixel,
            scale.top
          );

          context.lineTo(
            pixel,
            scale.top + tickLength
          );
        } else {
          context.moveTo(
            scale.right,
            pixel
          );

          context.lineTo(
            scale.right - tickLength,
            pixel
          );
        }

        context.stroke();
      });

      context.restore();
    }

    function resolveAxisValue(
      value,
      context,
      fallback
    ) {
      try {
        return typeof value === 'function'
          ? value(context)
          : value ?? fallback;
      } catch (_) {
        return fallback;
      }
    }

    function normaliseAxisPadding(value) {
      const numericValue =
        typeof value === 'number' ||
        typeof value === 'string'
          ? Number(value)
          : NaN;

      if (Number.isFinite(numericValue)) {
        return {
          top: numericValue,
          right: numericValue,
          bottom: numericValue,
          left: numericValue
        };
      }

      return {
        top: Number(value?.top) || 0,
        right: Number(value?.right) || 0,
        bottom: Number(value?.bottom) || 0,
        left: Number(value?.left) || 0
      };
    }

    function getAxisFont(
      fontOptions,
      fallbackSize = 10,
      fallbackWeight = '400'
    ) {
      const family =
        fontOptions?.family ||
        Chart.defaults.font.family ||
        "'Lato', sans-serif";

      const size =
        Number(fontOptions?.size) ||
        fallbackSize;

      const weight =
        fontOptions?.weight ||
        fallbackWeight;

      const style =
        fontOptions?.style
          ? `${fontOptions.style} `
          : '';

      const configuredLineHeight =
        fontOptions?.lineHeight;

      let lineHeight =
        size * 1.2;

      if (typeof configuredLineHeight === 'string') {
        const text =
          configuredLineHeight.trim();

        const numericValue =
          parseFloat(text);

        if (Number.isFinite(numericValue)) {
          if (text.endsWith('px')) {
            lineHeight =
              numericValue;
          } else if (text.endsWith('%')) {
            lineHeight =
              size * numericValue / 100;
          } else {
            lineHeight =
              size * numericValue;
          }
        }
      } else if (
        Number.isFinite(
          Number(configuredLineHeight)
        )
      ) {
        lineHeight =
          size *
          Number(configuredLineHeight);
      }

      return {
        css:
          `${style}${weight} ${size}px ${family}`,

        lineHeight
      };
    }

    function captureXAxisSnapshot(
      scale,
      styleOptions = scale?.options
    ) {
      if (!scale || !styleOptions) {
        return null;
      }

      const tickOptions =
        styleOptions.ticks || {};

      const gridOptions =
        styleOptions.grid || {};

      const titleOptions =
        styleOptions.title || {};

      const borderOptions =
        styleOptions.border || {};

      const tickPadding =
        Number(tickOptions.padding) || 0;

      const ticks =
        (scale.ticks || []).map((tick, index) => {
          const context =
            typeof scale.getContext === 'function'
              ? scale.getContext(index)
              : {
                  chart,
                  scale,
                  tick,
                  index,
                  type: 'tick'
                };

          let label =
            tick.label;

          if (
            label === undefined &&
            typeof tickOptions.callback === 'function'
          ) {
            try {
              label =
                tickOptions.callback.call(
                  scale,
                  tick.value,
                  index,
                  scale.ticks
                );
            } catch (_) {
              label =
                tick.value;
            }
          }

          const labelLines =
            Array.isArray(label)
              ? label.map(
                  line => String(line ?? '')
                )
              : [String(label ?? '')];

          const fontOptions =
            resolveAxisValue(
              tickOptions.font,
              context,
              tickOptions.font || {}
            );

          const font =
            getAxisFont(
              fontOptions,
              10,
              '400'
            );

          const tickValue =
            Number(tick.value);

          const isMajor =
            isMajorXAxisTick(
              tickValue,
              styleOptions.pffTickView
            );

          const tickLength =
            isMajor
              ? 6
              : 2;

          const tickWidth =
            isMajor
              ? 1.1
              : 0.7;

          const configuredLayoutTickLength =
            Number(gridOptions.tickLength);

          const layoutTickLength =
            Number.isFinite(
              configuredLayoutTickLength
            )
              ? configuredLayoutTickLength
              : tickLength;

          return {
            x:
              scale.getPixelForTick(index),

            axisY:
              scale.top,

            labelY:
              scale.top +
              layoutTickLength +
              tickPadding +
              font.lineHeight / 2,

            labelLines,
            font,
            tickLength,
            tickWidth,

            showTick:
              styleOptions.display !== false &&
              gridOptions.drawTicks !== false,

            showLabel:
              styleOptions.display !== false &&
              tickOptions.display !== false,

            tickColour:
              '#151515',

            labelColour:
              resolveAxisValue(
                tickOptions.color,
                context,
                '#151515'
              )
          };
        });

      const titlePadding =
        normaliseAxisPadding(
          titleOptions.padding
        );

      const titleContext = {
        chart,
        scale,
        type: 'scale'
      };

      const titleFontOptions =
        resolveAxisValue(
          titleOptions.font,
          titleContext,
          titleOptions.font || {}
        );

      const titleFont =
        getAxisFont(
          titleFontOptions,
          13,
          '700'
        );

      const titleLines =
        Array.isArray(titleOptions.text)
          ? titleOptions.text.map(
              line => String(line ?? '')
            )
          : [String(titleOptions.text ?? '')];

      const borderContext = {
        chart,
        scale,
        type: 'scale'
      };

      const resolvedBorderWidth =
        Number(
          resolveAxisValue(
            borderOptions.width,
            borderContext,
            1
          )
        );

      return {
        ticks,

        title: {
          show:
            styleOptions.display !== false &&
            titleOptions.display !== false &&
            titleLines.some(Boolean),

          x:
            (scale.left + scale.right) / 2,

          y:
            scale.bottom -
            titlePadding.bottom -
            titleFont.lineHeight / 2,

          lines:
            titleLines,

          font:
            titleFont,

          colour:
            resolveAxisValue(
              titleOptions.color,
              titleContext,
              '#151515'
            )
        },

        border: {
          show:
            styleOptions.display !== false &&
            borderOptions.display !== false,

    function drawXAxisSnapshot(
      context,
      snapshot,
      opacities,
      offsetX = 0
    ) {
      if (!snapshot) {
        return;
      }

      const tickOpacity =
        clamp(
          Number(opacities?.ticks) || 0,
          0,
          1
        );

      const labelOpacity =
        clamp(
          Number(opacities?.labels) || 0,
          0,
          1
        );

      const titleOpacity =
        clamp(
          Number(opacities?.title) || 0,
          0,
          1
        );

      const borderOpacity =
        clamp(
          Number(opacities?.border) || 0,
          0,
          1
        );

      if (
        tickOpacity <= 0.001 &&
        labelOpacity <= 0.001 &&
        titleOpacity <= 0.001 &&
        borderOpacity <= 0.001
      ) {
        return;
      }

      context.save();
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.lineCap = 'butt';

      if (
        snapshot.border?.show &&
        borderOpacity > 0.001
      ) {
        context.globalAlpha =
          borderOpacity;

        context.beginPath();
        context.strokeStyle =
          snapshot.border.colour;

        context.lineWidth =
          snapshot.border.width;

        context.moveTo(
          snapshot.border.left + offsetX,
          snapshot.border.y
        );

        context.lineTo(
          snapshot.border.right + offsetX,
          snapshot.border.y
        );

        context.stroke();
      }

      snapshot.ticks.forEach(tick => {
        const x =
          tick.x + offsetX;

        if (
          tick.showTick &&
          tick.tickLength > 0 &&
          tickOpacity > 0.001
        ) {
          context.globalAlpha =
            tickOpacity;

          context.beginPath();
          context.strokeStyle =
            tick.tickColour;

          context.lineWidth =
            tick.tickWidth;

          context.moveTo(
            x,
            tick.axisY
          );

          context.lineTo(
            x,
            tick.axisY + tick.tickLength
          );

          context.stroke();
        }

        if (
          !tick.showLabel ||
          !tick.labelLines.some(Boolean) ||
          labelOpacity <= 0.001
        ) {
          return;
        }

        context.globalAlpha =
          labelOpacity;

        context.font =
          tick.font.css;

        context.fillStyle =
          tick.labelColour;

        const firstLineY =
          tick.labelY -
          (
            tick.labelLines.length - 1
          ) *
          tick.font.lineHeight / 2;

        tick.labelLines.forEach(
          (line, lineIndex) => {
            if (!line) {
              return;
            }

            context.fillText(
              line,
              x,
              firstLineY +
              lineIndex * tick.font.lineHeight
            );
          }
        );
      });

      if (
        snapshot.title.show &&
        titleOpacity > 0.001
      ) {
        context.globalAlpha =
          titleOpacity;

        context.font =
          snapshot.title.font.css;

        context.fillStyle =
          snapshot.title.colour;

        const firstLineY =
          snapshot.title.y -
          (
            snapshot.title.lines.length - 1
          ) *
          snapshot.title.font.lineHeight / 2;

        snapshot.title.lines.forEach(
          (line, lineIndex) => {
            if (!line) {
              return;
            }

            context.fillText(
              line,
              snapshot.title.x + offsetX,
              firstLineY +
              lineIndex *
              snapshot.title.font.lineHeight
            );
          }
        );
      }

      context.restore();
    }

    function buildContinuousView({
      sourceRows,

    }) {
      const points =
        sourceRows

            y:
              row.hourlyRate,

            kind:
              'continuousPoint',

            ...row
          }))
          .filter(point =>
            Number.isFinite(point.x)
          );

      const transformX =
        regressionType === 'logarithmic'
          ? value =>
              Math.log1p(

          : value => value;

      const regression =
        calculateRegression(
          points,
          transformX
        );

      const datasets = [
        {
          type:
            'scatter',

          datasetRole:
            'continuousPoints',

            0.45,

          pointHoverBorderWidth:
            1,

          showLine:
            false,

          clip:
            false
        }
      ];

      if (regression) {
        const sampleCount = 96;

        const span =
          regression.maximumX -
          regression.minimumX;

        datasets.push({
          type:
            'line',

          datasetRole:
            'regression',

          order:
            -10,

          label:
            regressionType === 'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',

          data:
            Array.from(
              {
                length:
                  sampleCount
              },
              (_, index) => {
                const proportion =
                  sampleCount === 1
                    ? 0
                    : index /
                      (sampleCount - 1);

                const x =
                  regression.minimumX +
                  span * proportion;

                return {
                  x,
                  y:
                    regression.predict(x)
                };
              }
            ),

          parsing:
            false,

          showLine:
            true,

          pointRadius:
            0,

          pointHoverRadius:
            0,

          pointHitRadius:

          tension:

          clip:
            false,

          metadata: {
            regressionType,

            slope:
              regression.slope,

            pValue:
              regression.pValue,

            slopeLabel,
            slopeMultiplier
          }
        });
      }

      return {
        datasets,

        xScale:

    function getBaseLocationRadius(
      respondents
    ) {
      return clamp(
        11 +
        Math.pow(
          respondents,
          0.78
        ) *
        3.15,
        18,
        66
      );
    }

    function buildLocationPositions(
      items
    ) {
      const sortedItems =
        items
          .slice()
          .sort(
            (first, second) =>
              first.y -
                second.y ||
              second.statistics.count -
                first.statistics.count ||
              first.state.localeCompare(
                second.state
              )
          );

      const laneLastValues = [];
      const laneAssignments =
        new Map();

      sortedItems.forEach(item => {
        let laneIndex =
          laneLastValues.findIndex(
            previousValue =>
              item.y -
              previousValue >
              10
          );

        if (laneIndex === -1) {
          laneIndex =
            laneLastValues.length;

          laneLastValues.push(
            item.y
          );
        } else {
          laneLastValues[
            laneIndex
          ] =
            item.y;
        }

        laneAssignments.set(
          item.state,
          laneIndex
        );
      });

      const positionCount =
        Math.max(
          5,
          laneLastValues.length
        );

      return new Map(
        [...laneAssignments.entries()]
          .map(([state, laneIndex]) => [
            state,

            21 +
            laneIndex /
            Math.max(
              1,
              positionCount - 1
            ) *
            63
          ])
      );
    }

    function rebuildLocationData() {
      locationCategories =
        STATE_ORDER.filter(

              row =>

      const items =
        locationCategories.map(state => {
          const stateRows =
            rows.filter(
              row =>

          const statistics =
            calculateStatistics(
              stateRows.map(
                row => row.hourlyRate

          locationRawRows.set(
            state,
            stateRows
          );

          return {
            kind:
              'locationAggregate',

            state,

            x:
              21,

            y:
              statistics.median,

            baseRadius:
              getBaseLocationRadius(
                statistics.count
              ),

            colour:
              STATE_COLOURS[state],

            statistics
          };
        });

      const positions =
        buildLocationPositions(
          items
        );

      locationAggregatePoints =
        items
          .map(item => ({
            ...item,

            x:
              positions.get(item.state) ??
              21
          }))
          .sort(
            (first, second) =>
              second.y -
                first.y ||
              second.baseRadius -
                first.baseRadius
          );

    function getLocationAggregateVisibility(
      state
    ) {
      if (splitProgress.has(state)) {
        return (
          1 -
          splitProgress.get(state)
        );
      }

      if (mergingStates.has(state)) {
        return mergeProgress;
      }

      return splitStates.has(state)
        ? 0
        : 1;
    }

    function getDisplayedLocationRadius(
      activeChart,
      raw
    ) {
      const baseRadius =
        Number(raw?.baseRadius);

      if (
        !Number.isFinite(baseRadius) ||
        baseRadius <= 0
      ) {
        return 0;
      }

      const widthScale =
        clamp(
          (
            Number(activeChart?.width) ||
            520
          ) /
          520,
          0.78,
          1.05
        );

      const heightScale =
        clamp(
          (
            Number(activeChart?.height) ||
            585
          ) /
          585,
          0.68,
          1.04
        );

      return (
        baseRadius *
        Math.min(
          widthScale,
          heightScale
        )
      );
    }

    function getLocationAggregateRadius(
      activeChart,
      raw
    ) {
      if (!raw) {
        return 0;
      }

      const visibility =
        getLocationAggregateVisibility(
          raw.state
        );

      if (visibility <= 0.001) {
        return 0;
      }

      return getDisplayedLocationRadius(
        activeChart,
        raw
      );
    }

    function distanceToSegment(
      px,
      py,
      ax,
      ay,
      bx,
      by
    ) {
      const dx =
        bx - ax;

      const dy =
        by - ay;

      if (
        dx === 0 &&
        dy === 0
      ) {
        return Math.hypot(
          px - ax,
          py - ay
        );
      }

      const proportion =
        clamp(
          (
            (px - ax) * dx +
            (py - ay) * dy
          ) /
          (
            dx * dx +
            dy * dy
          ),
          0,
          1
        );

      const closestX =
        ax + proportion * dx;

      const closestY =
        ay + proportion * dy;

      return Math.hypot(
        px - closestX,
        py - closestY
      );
    }

    function findNearestInteractiveLine(
      event,
      maximumDistance = 10
    ) {
      if (!chart?.chartArea) {
        return null;
      }

      const x =
        Number(event?.x);

      const y =
        Number(event?.y);

      const area =
        chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let bestMatch = null;

      chart.data.datasets.forEach(
        (dataset, datasetIndex) => {
          if (
            dataset.datasetRole !==
              'regression' &&
            dataset.datasetRole !==
              'categoryMedian'
          ) {
            return;
          }

          const renderedPoints =
            chart
              .getDatasetMeta(
                datasetIndex
              )
              ?.data || [];

          for (
            let index = 0;
            index <
              renderedPoints.length - 1;
            index += 1
          ) {
            const first =
              renderedPoints[index];

            const second =
              renderedPoints[index + 1];

            if (
              !Number.isFinite(first?.x) ||
              !Number.isFinite(first?.y) ||
              !Number.isFinite(second?.x) ||
              !Number.isFinite(second?.y)
            ) {
              continue;
            }

            const distance =
              distanceToSegment(
                x,
                y,
                first.x,
                first.y,
                second.x,
                second.y
              );

            if (
              distance >
              maximumDistance
            ) {
              continue;
            }

            const firstDistance =
              Math.hypot(
                x - first.x,
                y - first.y
              );

            const secondDistance =
              Math.hypot(
                x - second.x,
                y - second.y
              );

            const nearestIndex =
              firstDistance <=
                secondDistance
                ? index
                : index + 1;

            if (
              !bestMatch ||
              distance <
                bestMatch.distance
            ) {
              bestMatch = {
                datasetIndex,
                index:
                  nearestIndex,
                distance
              };
            }
          }
        }
      );

      return bestMatch;
    }
    function findRawLocationElement(event) {

      let nearestRawPoint =
        null;

      chart.data.datasets.forEach(

              'locationRaw'

            return;
          }

          const renderedPoints =
            chart

          renderedPoints.forEach(
            (element, index) => {
              if (

                typeof element.inRange !==

                !element.inRange(

                )
              ) {

              const distance =
                Math.hypot(
                  x - element.x,

              if (
                !nearestRawPoint ||
                distance <
                  nearestRawPoint.distance
              ) {
                nearestRawPoint = {
                  datasetIndex,
                  index,
                  distance
                };
              }
            }
          );
        }
      );

      return nearestRawPoint;
    }
