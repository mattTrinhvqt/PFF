<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Advertised Pay</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --trend-yellow: #f1c232;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;

      --state-nsw: #2db7f5;
      --state-qld: #7a0036;
      --state-act: #7b61ff;
      --state-vic: #2d3a8c;
      --state-sa: #f03a47;
      --state-nt: #c25e00;
      --state-wa: #000000;
      --state-tas: #22a36b;

      --rurality-metro: #3f4851;
      --rurality-nonmetro: #9f6545;

      --corporate: #00b26f;
      --independent: #5a3be7;
      --ophthal: #ffb000;
      --other: #bfc3c7;
      --unknown: #777777;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    #app {
      position: relative;
      width: min(calc(100% - 12px), 520px);
      max-width: 100%;
      min-width: 0;
      margin-inline: auto;
      padding: 7px 6px 0;
      overflow: visible;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      min-height: 210px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0%,
      100% {
        opacity: 0;
      }

      12%,
      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0%,
      20%,
      100% {
        opacity: 0;
      }

      32%,
      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0%,
      40%,
      100% {
        opacity: 0;
      }

      52%,
      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0%,
      87%,
      100% {
        opacity: 0.45;
      }

      52%,
      76% {
        opacity: 0.78;
      }
    }

    .module-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-list {
      display: flex;
      align-items: flex-end;
      min-width: 0;
    }

    .chart-tab {
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--purple);
      background: #fff;
      border: 0;
      border-bottom: 2px solid var(--purple);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: none;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    .chart-heading-row {
      position: relative;
      width: 100%;
      height: 31px;
      min-height: 31px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 4px 165px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .group-control {
      position: absolute;
      top: 2px;
      right: 0;
      z-index: 30;
    }

    .group-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 154px;
      min-height: 27px;
      padding: 0 6px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease;
    }

    .group-button:hover,
    .group-button[aria-expanded="true"] {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .group-button:focus-visible {
      outline: none;
    }

    .group-value {
      display: inline-block;
      min-width: 70px;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }

    .menu-arrow {
      width: 0;
      height: 0;
      flex: 0 0 auto;
      border-top: 4px solid var(--muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .group-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    .group-menu {
      position: absolute;
      z-index: 50;
      top: calc(100% + 4px);
      right: 0;
      display: none;
      min-width: 180px;
      padding: 5px 0;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
      text-align: left;
    }

    .group-menu.is-open {
      display: block;
    }

    .group-menu-title {
      margin: 0;
      padding: 6px 10px 7px;
      color: var(--muted);
      background: #fff;
      border-bottom: 1px solid var(--track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .group-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 10px;
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      line-height: 1.25;
      cursor: pointer;
      user-select: none;
    }

    .group-option:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .group-option input {
      width: 14px;
      height: 14px;
      min-width: 14px;
      max-width: 14px;
      flex: 0 0 14px;
      margin: 0;
      accent-color: var(--purple);
      cursor: pointer;
    }

    .group-option-all {
      border-bottom: 1px solid var(--track);
      font-weight: 700;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-height: 28px;
      align-items: center;
      gap: 12px;
      padding: 1px 1px 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
    }

    .legend-square {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border: 1px solid transparent;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
    }

    .legend-regression-note {
      color: var(--muted);
      font-size: 9px;
    }

    .chart-shell {
      position: relative;
      display: block;
      width: 100%;
      height: 585px;
      min-height: 585px;
      max-height: 585px;
      margin: -2px 0 0;
      overflow: hidden;
      contain: strict;
    }

    #salaryChart {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 0;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        height: 30px;
        min-height: 30px;
      }

      .chart-heading {
        padding-top: 4px;
        padding-right: 157px;
        font-size: 14px;
        line-height: 21px;
      }

      .group-button {
        min-width: 149px;
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .group-value {
        min-width: 66px;
        font-size: 9px;
      }

      .group-menu {
        min-width: 176px;
      }

      .chart-shell {
        height: 450px;
        min-height: 450px;
        max-height: 450px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 147px;
        font-size: 12px;
      }

      .group-button {
        min-width: 141px;
        font-size: 9px;
      }

      .group-value {
        min-width: 60px;
      }

      .group-menu {
        min-width: 170px;
      }

      .chart-shell {
        height: 420px;
        min-height: 420px;
        max-height: 420px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading advertised salary data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">
          Loading advertised salary data...
        </div>
      </div>

      <div class="module-top">
        <div class="tab-list" role="tablist" aria-label="Job data views">
          <button
            class="chart-tab"
            type="button"
            role="tab"
            aria-selected="true"
          >
            Advertised pay
          </button>
        </div>

        <div class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span>LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 class="chart-heading">
          Advertised salaries over time
        </h2>

        <div class="group-control">
          <button
            id="groupButton"
            class="group-button"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="groupMenu"
          >
            <span>Group by:</span>
            <span id="groupValue" class="group-value">None</span>
            <span class="menu-arrow" aria-hidden="true"></span>
          </button>

          <div
            id="groupMenu"
            class="group-menu"
            role="group"
            aria-label="Group salary data"
          >
            <p class="group-menu-title">Group salary data</p>

            <label class="group-option group-option-all">
              <input
                class="group-option-input"
                type="radio"
                name="salary-group-mode"
                value="none"
                checked
              >
              <span>None</span>
            </label>

            <label class="group-option">
              <input
                class="group-option-input"
                type="radio"
                name="salary-group-mode"
                value="state"
              >
              <span>State</span>
            </label>

            <label class="group-option">
              <input
                class="group-option-input"
                type="radio"
                name="salary-group-mode"
                value="rurality"
              >
              <span>Rurality</span>
            </label>

            <label class="group-option">
              <input
                class="group-option-input"
                type="radio"
                name="salary-group-mode"
                value="employerType"
              >
              <span>Employer Type</span>
            </label>
          </div>
        </div>
      </div>

      <div
        id="chartLegend"
        class="chart-legend"
        aria-label="Chart legend"
      ></div>

      <div class="chart-shell">
        <canvas
          id="salaryChart"
          aria-label="Advertised salaries over time chart"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    Chart.defaults.font.family =
      "'Lato', sans-serif";

    Chart.defaults.color =
      '#151515';

    const CONFIG = {
      sheetId:
        '1gdLoeP2VKwv6ctpLsmXKZiMWybCgc987ucFgTIU4jEc',

      sheetName:
        'Clinical optom jobs',

      /*
       * Starts at row 3, so row 1 notes and row 2 headers are
       * excluded. There is no three-month or visible-row filter.
       */
      range:
        'A3:V',

      fetchTimeoutMs:
        20000,

      fetchAttempts:
        2,

      retryDelayMs:
        1200,

      cacheKey:
        'pff-advertised-salary-chart-v2',

      yMin:
        60000,

      yMax:
        200000,

      columns: {
        date: 3,
        employerType: 6,
        state: 8,
        rurality: 10,
        salary: 21
      }
    };

    const GROUP_LABELS = {
      none: 'None',
      state: 'State',
      rurality: 'Rurality',
      employerType: 'Employer Type'
    };

    const STATE_COLOURS = {
      NSW: '#2db7f5',
      QLD: '#7a0036',
      VIC: '#2d3a8c',
      ACT: '#7b61ff',
      SA: '#f03a47',
      NT: '#c25e00',
      WA: '#000000',
      TAS: '#22a36b',
      Unknown: '#777777'
    };

    const RURALITY_COLOURS = {
      Metro: '#3f4851',
      'Non-metro': '#9f6545',
      Unknown: '#777777'
    };

    const EMPLOYER_TYPE_COLOURS = {
      Corporate: '#00b26f',
      Independent: '#5a3be7',
      Ophthal: '#ffb000',
      Other: '#bfc3c7',
      Unknown: '#777777'
    };

    const GROUP_ORDER = {
      state: [
        'NSW',
        'QLD',
        'VIC',
        'ACT',
        'SA',
        'NT',
        'WA',
        'TAS',
        'Unknown'
      ],

      rurality: [
        'Metro',
        'Non-metro',
        'Unknown'
      ],

      employerType: [
        'Corporate',
        'Independent',
        'Ophthal',
        'Other',
        'Unknown'
      ]
    };

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById('loadingState');

    const statusElement =
      document.getElementById('status');

    const groupButton =
      document.getElementById('groupButton');

    const groupValue =
      document.getElementById('groupValue');

    const groupMenu =
      document.getElementById('groupMenu');

    const groupOptions = [
      ...document.querySelectorAll(
        '.group-option-input'
      )
    ];

    const chartLegend =
      document.getElementById('chartLegend');

    let chart = null;
    let rows = [];
    let axisBounds = null;
    let currentGroup = 'none';

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function normaliseText(value) {
      return cleanText(value).toLowerCase();
    }

    function getCellText(cell) {
      return cleanText(
        cell?.f ??
        cell?.v ??
        ''
      );
    }

    function parseDateValue(value) {
      if (
        value instanceof Date &&
        !Number.isNaN(value.getTime())
      ) {
        return new Date(
          Date.UTC(
            value.getFullYear(),
            value.getMonth(),
            value.getDate()
          )
        );
      }

      if (
        typeof value === 'number' &&
        Number.isFinite(value) &&
        value > 20000 &&
        value < 80000
      ) {
        return new Date(
          Date.UTC(1899, 11, 30) +
          value * 86400000
        );
      }

      const text = cleanText(value);

      if (!text) {
        return null;
      }

      let match = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/i
      );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]),
            Number(match[3])
          )
        );
      }

      match = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
      );

      if (match) {
        let year = Number(match[3]);

        if (year < 100) {
          year += 2000;
        }

        return new Date(
          Date.UTC(
            year,
            Number(match[2]) - 1,
            Number(match[1])
          )
        );
      }

      match = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})$/
      );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
          )
        );
      }

      const parsed = new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : new Date(
            Date.UTC(
              parsed.getFullYear(),
              parsed.getMonth(),
              parsed.getDate()
            )
          );
    }

    function parseDateCell(cell) {
      return (
        parseDateValue(cell?.v) ||
        parseDateValue(cell?.f)
      );
    }

    function parseSalaryValue(value) {
      if (
        typeof value === 'number' &&
        Number.isFinite(value)
      ) {
        return value > 0
          ? value
          : NaN;
      }

      const text = cleanText(value);

      if (
        !text ||
        normaliseText(text) === 'xxx'
      ) {
        return NaN;
      }

      const values = [];
      const expression =
        /(?:\$|aud\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k)?/gi;

      let match;

      while (
        (match = expression.exec(text))
      ) {
        let number = Number(
          match[1].replace(/,/g, '')
        );

        if (match[2]) {
          number *= 1000;
        }

        if (
          Number.isFinite(number) &&
          number > 0
        ) {
          values.push(number);
        }
      }

      if (!values.length) {
        return NaN;
      }

      /*
       * Use the midpoint when a salary range is advertised.
       */
      return values.reduce(
        (total, number) => total + number,
        0
      ) / values.length;
    }

    function getState(value) {
      const matches =
        cleanText(value)
          .toUpperCase()
          .match(
            /\b(?:NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/g
          ) || [];

      return matches[0] || 'Unknown';
    }

    function getRurality(value) {
      const matches = [
        ...cleanText(value)
          .toUpperCase()
          .matchAll(/\bMM\s*([1-7])\b/g)
      ];

      if (!matches.length) {
        return 'Unknown';
      }

      return matches.some(
        match => Number(match[1]) === 1
      )
        ? 'Metro'
        : 'Non-metro';
    }

    function getEmployerType(value) {
      const text = normaliseText(value);

      if (!text || text === 'xxx') {
        return 'Unknown';
      }

      if (
        text === 'corporate' ||
        text.startsWith('corporate ') ||
        text.startsWith('corporate(')
      ) {
        return 'Corporate';
      }

      if (
        text === 'independent' ||
        text.startsWith('independent ') ||
        text.startsWith('independent(')
      ) {
        return 'Independent';
      }

      if (
        text.includes('ophthal') ||
        text.includes('opthal')
      ) {
        return 'Ophthal';
      }

      return 'Other';
    }

    function rgba(hex, opacity) {
      const cleaned = String(hex)
        .replace('#', '')
        .trim();

      if (!/^[0-9a-f]{6}$/i.test(cleaned)) {
        return `rgba(119, 119, 119, ${opacity})`;
      }

      const red = parseInt(cleaned.slice(0, 2), 16);
      const green = parseInt(cleaned.slice(2, 4), 16);
      const blue = parseInt(cleaned.slice(4, 6), 16);

      return `rgba(${red}, ${green}, ${blue}, ${opacity})`;
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat(
        'en-AU',
        {
          style: 'currency',
          currency: 'AUD',
          maximumFractionDigits: 0
        }
      ).format(value);
    }

    function formatAxisCurrency(value) {
      return '$' +
        new Intl.NumberFormat(
          'en-AU',
          {
            maximumFractionDigits: 0
          }
        ).format(value);
    }

    function formatTooltipDate(timestamp) {
      return new Intl.DateTimeFormat(
        'en-AU',
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          timeZone: 'UTC'
        }
      ).format(new Date(timestamp));
    }

    function startOfUtcMonth(date) {
      return new Date(
        Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth(),
          1
        )
      );
    }

    function addUtcMonths(date, months) {
      return new Date(
        Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth() + months,
          1
        )
      );
    }

    function buildMonthTicks(
      minimum,
      maximumDataMonth
    ) {
      const ticks = [];
      let month = startOfUtcMonth(
        new Date(minimum)
      );

      const finalMonth = startOfUtcMonth(
        new Date(maximumDataMonth)
      );

      while (month <= finalMonth) {
        ticks.push({
          value: month.getTime()
        });

        month = addUtcMonths(
          month,
          1
        );
      }

      return ticks;
    }

    function formatMonthTick(timestamp) {
      const date = new Date(timestamp);

      const month = new Intl.DateTimeFormat(
        'en-AU',
        {
          month: 'short',
          timeZone: 'UTC'
        }
      ).format(date);

      return date.getUTCMonth() === 0
        ? [
            month,
            String(date.getUTCFullYear())
          ]
        : month;
    }

    function hideLoadingState() {
      app.classList.remove('is-loading');

      app.setAttribute(
        'aria-busy',
        'false'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );
    }

    function setStatus(message = '') {
      statusElement.textContent = message;
    }

    function loadSheetRows() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffSalaryCallback_${Date.now()}_${Math.floor(Math.random() * 1000000)}`;

          const script =
            document.createElement('script');

          let settled = false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Could not load Google Sheet data'
                  )
                );
              },
              CONFIG.fetchTimeoutMs
            );

          function cleanup() {
            window.clearTimeout(timeout);

            try {
              delete window[callbackName];
            } catch (error) {
              window[callbackName] =
                undefined;
            }

            script.remove();
          }

          function finish(
            error,
            response
          ) {
            if (settled) {
              return;
            }

            settled = true;
            cleanup();

            if (error) {
              reject(error);
              return;
            }

            if (
              !response ||
              response.status === 'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          }

          window[callbackName] =
            response => {
              finish(
                null,
                response
              );
            };

          script.onerror =
            () => {
              finish(
                new Error(
                  'Network error loading Google Sheet data'
                )
              );
            };

          const params =
            new URLSearchParams({
              sheet:
                CONFIG.sheetName,

              range:
                CONFIG.range,

              headers:
                '0',

              /*
               * Explicitly requests every row in A3:V.
               * There is no where, limit, offset or date clause.
               */
              tq:
                'select *',

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(Date.now())
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?${params.toString()}`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function normaliseRows(sourceRows) {
      const result = [];

      sourceRows.forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const date =
            parseDateCell(
              cells[
                CONFIG.columns.date
              ]
            );

          const salary =
            parseSalaryValue(
              cells[
                CONFIG.columns.salary
              ]?.v ??
              cells[
                CONFIG.columns.salary
              ]?.f ??
              ''
            );

          if (
            !date ||
            !Number.isFinite(salary) ||
            salary <= 0
          ) {
            return;
          }

          result.push({
            x:
              date.getTime(),

            y:
              salary,

            state:
              getState(
                getCellText(
                  cells[
                    CONFIG.columns.state
                  ]
                )
              ),

            rurality:
              getRurality(
                getCellText(
                  cells[
                    CONFIG.columns.rurality
                  ]
                )
              ),

            employerType:
              getEmployerType(
                getCellText(
                  cells[
                    CONFIG
                      .columns
                      .employerType
                  ]
                )
              )
          });
        }
      );

      return result.sort(
        (
          first,
          second
        ) =>
          first.x -
          second.x
      );
    }

    function saveCache(data) {
      try {
        localStorage.setItem(
          CONFIG.cacheKey,
          JSON.stringify(data)
        );
      } catch (error) {
        /*
         * Ignore unavailable local storage.
         */
      }
    }

    function loadCache() {
      try {
        const cached =
          JSON.parse(
            localStorage.getItem(
              CONFIG.cacheKey
            ) ||
            'null'
          );

        return Array.isArray(cached)
          ? cached.filter(
              row =>
                Number.isFinite(row?.x) &&
                Number.isFinite(row?.y)
            )
          : [];
      } catch (error) {
        return [];
      }
    }

    function calculateAxisBounds(data) {
      const xValues =
        data.map(
          row => row.x
        );

      const minimumDate =
        new Date(
          Math.min(...xValues)
        );

      const maximumDate =
        new Date(
          Math.max(...xValues)
        );

      const firstMonth =
        startOfUtcMonth(
          minimumDate
        );

      const lastDataMonth =
        startOfUtcMonth(
          maximumDate
        );

      /*
       * End at the start of the following month so points in
       * the final month retain space to the right.
       */
      const monthAfterLast =
        addUtcMonths(
          lastDataMonth,
          1
        );

      return {
        xMin:
          firstMonth.getTime(),

        xMax:
          monthAfterLast.getTime(),

        lastDataMonth:
          lastDataMonth.getTime(),

        yMin:
          CONFIG.yMin,

        yMax:
          CONFIG.yMax
      };
    }

    function calculateRegression(data) {
      if (data.length < 2) {
        return null;
      }

      const meanX =
        data.reduce(
          (
            total,
            row
          ) =>
            total +
            row.x,
          0
        ) /
        data.length;

      const meanY =
        data.reduce(
          (
            total,
            row
          ) =>
            total +
            row.y,
          0
        ) /
        data.length;

      let numerator = 0;
      let denominator = 0;

      data.forEach(
        row => {
          const centredX =
            row.x -
            meanX;

          numerator +=
            centredX *
            (
              row.y -
              meanY
            );

          denominator +=
            centredX *
            centredX;
        }
      );

      if (denominator === 0) {
        return null;
      }

      const slope =
        numerator /
        denominator;

      const minimumX =
        Math.min(
          ...data.map(
            row => row.x
          )
        );

      const maximumX =
        Math.max(
          ...data.map(
            row => row.x
          )
        );

      return {
        minimumX,
        maximumX,

        minimumY:
          meanY +
          slope *
          (
            minimumX -
            meanX
          ),

        maximumY:
          meanY +
          slope *
          (
            maximumX -
            meanX
          )
      };
    }

    function getGroupColour(
      mode,
      label
    ) {
      if (mode === 'state') {
        return (
          STATE_COLOURS[label] ||
          '#777777'
        );
      }

      if (mode === 'rurality') {
        return (
          RURALITY_COLOURS[label] ||
          '#777777'
        );
      }

      if (mode === 'employerType') {
        return (
          EMPLOYER_TYPE_COLOURS[label] ||
          '#777777'
        );
      }

      return '#6600ff';
    }

    function groupRows(mode) {
      if (mode === 'none') {
        return [
          {
            label:
              'Advertised salary',

            colour:
              '#6600ff',

            rows
          }
        ];
      }

      const grouped =
        new Map();

      rows.forEach(
        row => {
          const label =
            row[mode] ||
            'Unknown';

          if (!grouped.has(label)) {
            grouped.set(
              label,
              []
            );
          }

          grouped
            .get(label)
            .push(row);
        }
      );

      return GROUP_ORDER[mode]
        .filter(
          label =>
            grouped.has(label)
        )
        .map(
          label => ({
            label,

            colour:
              getGroupColour(
                mode,
                label
              ),

            rows:
              grouped.get(label)
          })
        );
    }

    function buildDatasets(mode) {
      const pointDatasets = [];
      const regressionDatasets = [];

      groupRows(mode).forEach(
        group => {
          pointDatasets.push({
            type:
              'scatter',

            datasetRole:
              'points',

            groupLabel:
              group.label,

            label:
              group.label,

            data:
              group.rows.map(
                row => ({
                  x:
                    row.x,

                  y:
                    row.y,

                  groupLabel:
                    group.label
                })
              ),

            parsing:
              false,

            showLine:
              false,

            order:
              1,

            pointStyle:
              'rect',

            pointRadius:
              3.1,

            pointHoverRadius:
              4.4,

            pointHitRadius:
              3,

            pointBackgroundColor:
              rgba(
                group.colour,
                0.26
              ),

            pointHoverBackgroundColor:
              rgba(
                group.colour,
                0.58
              ),

            pointBorderColor:
              rgba(
                group.colour,
                0.42
              ),

            pointHoverBorderColor:
              group.colour,

            pointBorderWidth:
              0.5,

            pointHoverBorderWidth:
              1
          });

          const regression =
            calculateRegression(
              group.rows
            );

          if (!regression) {
            return;
          }

          const regressionColour =
            mode === 'none'
              ? '#f1c232'
              : group.colour;

          regressionDatasets.push({
            type:
              'line',

            datasetRole:
              'regression',

            groupLabel:
              group.label,

            label:
              `${group.label} linear regression`,

            data: [
              {
                x:
                  regression.minimumX,

                y:
                  regression.minimumY
              },

              {
                x:
                  regression.maximumX,

                y:
                  regression.maximumY
              }
            ],

            parsing:
              false,

            showLine:
              true,

            fill:
              false,

            order:
              10,

            borderColor:
              regressionColour,

            backgroundColor:
              regressionColour,

            borderWidth:
              3.2,

            borderCapStyle:
              'round',

            borderJoinStyle:
              'round',

            pointRadius:
              0,

            pointHoverRadius:
              0,

            pointHitRadius:
              0,

            tension:
              0
          });
        }
      );

      return [
        ...regressionDatasets,
        ...pointDatasets
      ];
    }

    function appendLegendItem(
      colour,
      label,
      isLine = false
    ) {
      const item =
        document.createElement(
          'span'
        );

      item.className =
        'legend-item';

      const marker =
        document.createElement(
          'span'
        );

      marker.className =
        isLine
          ? 'legend-line'
          : 'legend-square';

      if (isLine) {
        marker.style.background =
          colour;
      } else {
        marker.style.background =
          rgba(
            colour,
            0.26
          );

        marker.style.borderColor =
          rgba(
            colour,
            0.55
          );
      }

      const text =
        document.createElement(
          'span'
        );

      text.textContent =
        label;

      item.appendChild(
        marker
      );

      item.appendChild(
        text
      );

      chartLegend.appendChild(
        item
      );
    }

    function updateLegend(mode) {
      chartLegend.textContent = '';

      if (mode === 'none') {
        appendLegendItem(
          '#6600ff',
          'Advertised salary'
        );

        appendLegendItem(
          '#f1c232',
          'Linear regression',
          true
        );

        return;
      }

      groupRows(mode).forEach(
        group => {
          appendLegendItem(
            group.colour,
            group.label
          );
        }
      );

      const note =
        document.createElement(
          'span'
        );

      note.className =
        'legend-item legend-regression-note';

      note.textContent =
        'Solid line = linear regression';

      chartLegend.appendChild(
        note
      );
    }

    function createChart() {
      const context =
        document
          .getElementById(
            'salaryChart'
          )
          .getContext('2d');

      chart =
        new Chart(
          context,
          {
            type:
              'scatter',

            data: {
              datasets:
                buildDatasets(
                  currentGroup
                )
            },

            options: {
              responsive:
                true,

              maintainAspectRatio:
                false,

              devicePixelRatio:
                Math.min(
                  window.devicePixelRatio ||
                  1,
                  3
                ),

              animation: {
                duration:
                  520,

                easing:
                  'easeOutCubic'
              },

              interaction: {
                mode:
                  'nearest',

                axis:
                  'xy',

                intersect:
                  true
              },

              layout: {
                padding: {
                  top:
                    4,

                  right:
                    4,

                  bottom:
                    0,

                  left:
                    0
                }
              },

              plugins: {
                legend: {
                  display:
                    false
                },

                tooltip: {
                  enabled:
                    true,

                  mode:
                    'nearest',

                  intersect:
                    true,

                  displayColors:
                    false,

                  backgroundColor:
                    '#ffffff',

                  titleColor:
                    '#151515',

                  bodyColor:
                    '#69718a',

                  borderColor:
                    '#e8eaf0',

                  borderWidth:
                    1,

                  cornerRadius:
                    4,

                  padding:
                    9,

                  titleFont: {
                    family:
                      'Lato',

                    size:
                      12,

                    weight:
                      '700'
                  },

                  bodyFont: {
                    family:
                      'Lato',

                    size:
                      11,

                    weight:
                      '400'
                  },

                  filter(
                    tooltipItem
                  ) {
                    return (
                      tooltipItem
                        .dataset
                        .datasetRole ===
                      'points'
                    );
                  },

                  callbacks: {
                    title(
                      tooltipItems
                    ) {
                      const xValue =
                        tooltipItems
                          ?.[0]
                          ?.parsed
                          ?.x;

                      return Number.isFinite(
                        xValue
                      )
                        ? formatTooltipDate(
                            xValue
                          )
                        : '';
                    },

                    label(
                      tooltipItem
                    ) {
                      const lines = [
                        'Advertised salary: ' +
                        formatCurrency(
                          tooltipItem
                            .parsed
                            .y
                        )
                      ];

                      if (
                        currentGroup !==
                        'none'
                      ) {
                        lines.push(
                          `${GROUP_LABELS[currentGroup]}: ${tooltipItem.raw.groupLabel}`
                        );
                      }

                      return lines;
                    }
                  }
                }
              },

              scales: {
                x: {
                  type:
                    'linear',

                  min:
                    axisBounds.xMin,

                  max:
                    axisBounds.xMax,

                  bounds:
                    'data',

                  title: {
                    display:
                      true,

                    text:
                      'Date advertised',

                    color:
                      '#151515',

                    font: {
                      family:
                        'Lato',

                      size:
                        13,

                      weight:
                        '700'
                    },

                    padding: {
                      top:
                        7
                    }
                  },

                  /*
                   * Force one tick at the beginning of every
                   * calendar month.
                   */
                  afterBuildTicks(
                    scale
                  ) {
                    scale.ticks =
                      buildMonthTicks(
                        axisBounds.xMin,
                        axisBounds
                          .lastDataMonth
                      );
                  },

                  ticks: {
                    color:
                      '#151515',

                    autoSkip:
                      false,

                    maxRotation:
                      0,

                    minRotation:
                      0,

                    padding:
                      3,

                    font: {
                      family:
                        'Lato',

                      size:
                        window.matchMedia(
                          '(max-width: 430px)'
                        ).matches
                          ? 9
                          : 10,

                      weight:
                        '400'
                    },

                    /*
                     * January is displayed across two lines:
                     *
                     * Jan
                     * 2026
                     */
                    callback(
                      value
                    ) {
                      return formatMonthTick(
                        Number(value)
                      );
                    }
                  },

                  grid: {
                    color:
                      'rgba(105, 113, 138, 0.075)',

                    lineWidth:
                      1
                  },

                  border: {
                    display:
                      true,

                    color:
                      '#151515',

                    width:
                      1.1
                  }
                },

                y: {
                  min:
                    CONFIG.yMin,

                  max:
                    CONFIG.yMax,

                  title: {
                    display:
                      true,

                    text:
                      'Advertised salary ($)',

                    color:
                      '#151515',

                    font: {
                      family:
                        'Lato',

                      size:
                        13,

                      weight:
                        '700'
                    }
                  },

                  ticks: {
                    color:
                      '#151515',

                    stepSize:
                      20000,

                    maxTicksLimit:
                      8,

                    padding:
                      3,

                    font: {
                      family:
                        'Lato',

                      size:
                        11,

                      weight:
                        '400'
                    },

                    callback(
                      value
                    ) {
                      return formatAxisCurrency(
                        Number(value)
                      );
                    }
                  },

                  grid: {
                    color:
                      'rgba(105, 113, 138, 0.075)',

                    lineWidth:
                      1,

                    drawTicks:
                      true,

                    tickLength:
                      6,

                    tickColor:
                      '#151515',

                    tickWidth:
                      1.1
                  },

                  border: {
                    display:
                      true,

                    color:
                      '#151515',

                    width:
                      1.1
                  }
                }
              }
            }
          }
        );
    }

    function updateGrouping(mode) {
      currentGroup =
        mode;

      groupValue.textContent =
        GROUP_LABELS[mode];

      groupOptions.forEach(
        option => {
          option.checked =
            option.value ===
            mode;
        }
      );

      updateLegend(mode);

      if (!chart) {
        return;
      }

      /*
       * Only datasets change. Both axes remain fixed.
       */
      chart.data.datasets =
        buildDatasets(mode);

      chart.update();
    }

    function setGroupMenuOpen(
      isOpen
    ) {
      groupMenu.classList.toggle(
        'is-open',
        isOpen
      );

      groupButton.setAttribute(
        'aria-expanded',
        String(isOpen)
      );
    }

    groupButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        setGroupMenuOpen(
          !groupMenu
            .classList
            .contains(
              'is-open'
            )
        );
      }
    );

    groupMenu.addEventListener(
      'click',
      event => {
        event.stopPropagation();
      }
    );

    groupOptions.forEach(
      option => {
        option.addEventListener(
          'change',
          () => {
            if (!option.checked) {
              return;
            }

            updateGrouping(
              option.value
            );

            setGroupMenuOpen(
              false
            );
          }
        );
      }
    );

    document.addEventListener(
      'pointerdown',
      event => {
        if (
          !event.target.closest(
            '.group-control'
          )
        ) {
          setGroupMenuOpen(
            false
          );
        }
      }
    );

    document.addEventListener(
      'keydown',
      event => {
        if (
          event.key ===
          'Escape'
        ) {
          setGroupMenuOpen(
            false
          );
        }
      }
    );

    async function loadChart() {
      setStatus();

      let lastError =
        null;

      for (
        let attempt = 1;
        attempt <=
          CONFIG.fetchAttempts;
        attempt++
      ) {
        try {
          const sourceRows =
            await loadSheetRows();

          rows =
            normaliseRows(
              sourceRows
            );

          if (!rows.length) {
            throw new Error(
              'No valid advertised salary rows were found in columns D and V'
            );
          }

          saveCache(rows);

          axisBounds =
            calculateAxisBounds(
              rows
            );

          updateLegend(
            currentGroup
          );

          createChart();
          hideLoadingState();
          setStatus();

          return;

        } catch (error) {
          lastError =
            error;

          if (
            attempt <
            CONFIG.fetchAttempts
          ) {
            await new Promise(
              resolve => {
                window.setTimeout(
                  resolve,
                  CONFIG.retryDelayMs
                );
              }
            );
          }
        }
      }

      const cachedRows =
        loadCache();

      if (cachedRows.length) {
        rows =
          cachedRows;

        axisBounds =
          calculateAxisBounds(
            rows
          );

        updateLegend(
          currentGroup
        );

        createChart();
        hideLoadingState();

        setStatus(
          'Live data could not be refreshed; showing the most recently saved data'
        );

        return;
      }

      console.error(
        lastError
      );

      hideLoadingState();

      setStatus(
        '⚠ ' +
        String(
          lastError?.message ||
          'Unable to load advertised salary data'
        ).replace(
          /\.+$/,
          ''
        )
      );
    }

    updateGrouping(
      'none'
    );

    loadChart();
  </script>
