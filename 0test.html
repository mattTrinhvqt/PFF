<!DOCTYPE html>
<html lang="en-AU">
<head>
  <script>
    /* --- Visual scale toggle (set true/false) --- */
    const ENABLE_SCALE = false;

    let scaleTimer = null;
    let stageHeightTimer = null;

    function scheduleApplyScale() {
      if (!ENABLE_SCALE) return;

      clearTimeout(scaleTimer);

      scaleTimer = setTimeout(() => {
        requestAnimationFrame(applyScale);
      }, 80);
    }

    function applyScale() {
      const app = document.getElementById('app');
      const fit = document.getElementById('fit');

      if (!app || !fit) return;

      if (!ENABLE_SCALE) {
        app.style.transform = 'none';
        fit.style.minHeight = '0';
        fit.style.width = '100%';
        return;
      }

      const previousTransform = app.style.transform;
      app.style.transform = 'none';

      let sizer = document.getElementById('appSizer');

      if (!sizer) {
        sizer = app.cloneNode(true);
        sizer.id = 'appSizer';
        document.body.appendChild(sizer);
      } else {
        sizer.innerHTML = app.innerHTML;
      }

      Object.assign(sizer.style, {
        position: 'absolute',
        left: '-99999px',
        top: '0',
        width: getComputedStyle(app).width,
        display: 'block',
        visibility: 'hidden',
        pointerEvents: 'none',
        transform: 'none'
      });

      const sizerResults = sizer.querySelector('#results');
      const sizerOutput = sizer.querySelector('#out');

      if (sizerResults) {
        sizerResults.style.display = 'block';
      }

      if (sizerOutput) {
        sizerOutput.textContent = 'Calculating...';
      }

      const naturalWidth =
        sizer.offsetWidth ||
        app.offsetWidth ||
        1;

      const naturalHeight =
        sizer.offsetHeight ||
        app.offsetHeight ||
        1;

      app.style.transform = previousTransform;

      const viewportWidth =
        document.documentElement.clientWidth ||
        window.innerWidth;

      const viewportHeight = window.innerHeight;

      const scale = Math.min(
        viewportWidth / naturalWidth,
        viewportHeight / naturalHeight,
        1
      );

      app.style.transform = `scale(${scale})`;
      fit.style.width = '100%';
      fit.style.minHeight =
        Math.max(
          Math.ceil(naturalHeight * scale),
          viewportHeight
        ) + 'px';
    }

    /*
     * Measure the natural height of the open-input view with
     * results visible. All calculator states use this stage height.
     */
    function scheduleStageHeightMeasurement() {
      clearTimeout(stageHeightTimer);

      stageHeightTimer = setTimeout(() => {
        requestAnimationFrame(measureExpandedStageHeight);
      }, 80);
    }

    function measureExpandedStageHeight() {
      const app = document.getElementById('app');

      if (!app || !document.body) return;

      const measuringClone = app.cloneNode(true);

      measuringClone.classList.add('has-results');
      measuringClone.classList.remove(
        'is-input-collapsed',
        'is-layout-transitioning'
      );

      Object.assign(measuringClone.style, {
        position: 'absolute',
        left: '-99999px',
        top: '0',
        width: getComputedStyle(app).width,
        height: 'auto',
        minHeight: '0',
        maxHeight: 'none',
        display: 'flex',
        visibility: 'hidden',
        pointerEvents: 'none',
        transform: 'none',
        transition: 'none'
      });

      const measuringResults =
        measuringClone.querySelector('#results');

      const measuringOutput =
        measuringClone.querySelector('#out');

      if (measuringResults) {
        measuringResults.style.display = 'block';
      }

      if (measuringOutput) {
        measuringOutput.textContent = '';
      }

      document.body.appendChild(measuringClone);

      const measuredHeight = Math.ceil(
        measuringClone.getBoundingClientRect().height
      );

      measuringClone.remove();

      if (
        Number.isFinite(measuredHeight) &&
        measuredHeight > 0
      ) {
        document.documentElement.style.setProperty(
          '--stage-height',
          `${measuredHeight}px`
        );
      }
    }

    function refreshCalculatorLayout() {
      scheduleStageHeightMeasurement();
      scheduleApplyScale();
    }

    window.addEventListener('load', refreshCalculatorLayout);
    window.addEventListener('resize', refreshCalculatorLayout);
    window.addEventListener('orientationchange', refreshCalculatorLayout);
    window.addEventListener('pageshow', refreshCalculatorLayout);

    if (document.fonts?.ready) {
      document.fonts.ready.then(refreshCalculatorLayout);
    }
  </script>

  <meta charset="utf-8">
  <title>Locum Optom Income Estimator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error-red: #b42318;
      --stage-height: 520px;
      --layout-duration: 920ms;
      --layout-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      min-height: 0;
    }

    .box {
      display: flex;
      width: min(calc(100% - 16px), 520px);
      max-width: 100%;
      min-width: 0;
      min-height: min(100dvh, var(--stage-height));
      margin-inline: auto;
      padding: 9px 10px 12px;
      flex-direction: column;
      text-align: center;
    }

    #app {
      overflow: visible;
      transform-origin: top center;
      will-change: transform;
      transition:
        min-height var(--layout-duration) var(--layout-ease);
    }

    .input-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      width: 100%;
      max-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      background: #fff;
      border: 0;
      border-bottom: 0 solid var(--track);
      border-radius: 0;
      font: inherit;
      text-align: left;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      pointer-events: none;
      cursor: pointer;
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 360ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear var(--layout-duration);
    }

    .input-summary:hover .input-summary-edit {
      color: var(--ink);
    }

    .input-summary:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .input-summary-values {
      display: flex;
      min-width: 0;
      padding: 1px 0 2px;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .input-summary-values::-webkit-scrollbar {
      display: none;
    }

    .input-summary-separator {
      flex: 0 0 auto;
      color: var(--track);
    }

    .input-summary-edit {
      flex: 0 0 auto;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      text-transform: uppercase;
      transition: color 140ms ease;
    }

    .calculator-notice {
      width: 100%;
      max-height: 80px;
      margin: 0 0 4px;
      padding: 0 0 8px;
      overflow: hidden;
      border-bottom: 2px solid var(--track);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 320ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s;
    }

    .calculator-notice p {
      margin: 0;
    }

    .calculator-notice p + p {
      margin-top: 1px;
    }

    #modelMeta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    #modelMeta.is-live::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #e53935;
    }

    .calculator-form {
      display: grid;
      grid-template-columns: 1fr;
      flex: 1 1 auto;
      min-height: 0;
      align-content: start;
      gap: 8px;
      margin-top: 14px;
      text-align: left;
      transition:
        gap var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease);
    }

    .field {
      max-height: 100px;
      margin: 0;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 320ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s;
    }

    .field label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 0;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.15;
      text-align: center;
    }

    .field label small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.2;
    }

    .field label small a {
      color: var(--purple);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: underline;
    }

    .field input[type="number"],
    .field select {
      display: block;
      width: 100%;
      height: 32px;
      margin: 3px auto 0;
      padding: 0 4px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--track);
      border-radius: 0;
      font: inherit;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      outline: none;
      transition:
        border-color 140ms ease,
        box-shadow 140ms ease;
    }

    .field input[type="number"]:hover,
    .field select:hover {
      border-bottom-color: var(--muted);
    }

    .field input[type="number"]:focus-visible,
    .field select:focus-visible {
      border-bottom-color: var(--purple);
      box-shadow: none;
    }

    select {
      text-align-last: center;
      -moz-text-align-last: center;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    #estimateBtn {
      display: block;
      width: 100%;
      min-height: 34px;
      max-height: 34px;
      margin: 1px auto 0;
      padding: 0 12px;
      overflow: hidden;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink);
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
      font-weight: 400;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      cursor: pointer;
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 320ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s,
        color 140ms ease,
        background-color 140ms ease;
    }

    #estimateBtn:hover {
      color: #fff;
      background: var(--ink);
    }

    #estimateBtn:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #out {
      min-height: 0;
      max-height: 70px;
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      text-align: left;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 320ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s;
    }

    #out:empty {
      display: none;
    }

    #out.is-error,
    #resultsStatus.is-error {
      color: var(--error-red);
    }

    #results {
      position: relative;
      display: none;
      grid-column: 1 / -1;
      min-width: 0;
      min-height: 0;
      max-height: 0;
      margin-top: 6px;
      padding-top: 18px;
      overflow: hidden;
      border-top: 1px solid var(--track);
      text-align: left;
      opacity: 0;
      transform: translateY(12px);
      transition:
        max-height 980ms var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        opacity 420ms ease,
        transform 980ms var(--layout-ease);
    }

    #resultsStatus {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      z-index: 5;
      min-height: 18px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      line-height: 1.25;
      text-align: left;
    }

    #results.show-status {
      padding-top: 24px;
      border-top-color: transparent;
    }

    #results.show-status #resultsStatus {
      display: block;
    }

    .results-content,
    .results-primary,
    .scale {
      min-width: 0;
    }

    .results-content {
      width: 100%;
    }

    .results-primary {
      flex: 0 0 auto;
    }

    .results-section-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.2;
      text-align: center;
      text-transform: uppercase;
    }

    .scale {
      --trackY: 48px;
      --barH: 4px;
      --gapValue: 6px;
      --gapLabel: 7px;

      position: relative;
      margin: 14px 28px 0;
      padding: 54px 0 48px;
    }

    .scale .track {
      position: absolute;
      top: var(--trackY);
      right: 0;
      left: 0;
      height: var(--barH);
      background: var(--track);
      border-radius: 0;
    }

    .scale .tick {
      --stemUp: 20px;
      --stemDown: 18px;

      position: absolute;
      top: calc(var(--trackY) + var(--barH) / 2);
      z-index: 2;
      transform: translateX(-50%);
      text-align: center;
    }

    .scale .t20,
    .scale .t80 {
      --stemUp: 17px;
      --stemDown: 16px;
    }

    .scale .t5,
    .scale .t95 {
      --stemUp: 14px;
      --stemDown: 14px;
    }

    .scale .tick .stem {
      position: absolute;
      top: calc(-1 * var(--stemUp));
      left: 50%;
      width: 0;
      height: calc(var(--stemUp) + var(--stemDown));
      transform: translateX(-50%);
      border-left: 2px solid var(--muted);
    }

    .scale .t50 .stem {
      border-left-width: 3px;
      border-left-color: var(--purple);
    }

    .scale .t5 .stem,
    .scale .t95 .stem {
      border-left-width: 1px;
    }

    .scale .tick .value {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(
        -50%,
        calc(-100% - var(--stemUp) - var(--gapValue))
      );
      color: var(--ink);
      font-size: 13px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    .scale .tick .label {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(
        -50%,
        calc(var(--stemDown) + var(--gapLabel))
      );
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
    }

    .scale .t50 .value,
    .scale .t50 .label {
      color: var(--purple);
      font-size: 16px;
      font-weight: 700;
    }

    .scale .t20 .value,
    .scale .t80 .value {
      font-size: 12px;
    }

    .scale .t5 .value,
    .scale .t95 .value {
      font-size: 11px;
    }

    .caption {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
    }

    .warn {
      color: var(--error-red);
    }

    /* Results exist, but inputs are still open after selecting Edit. */
    #app.has-results #results {
      display: block;
      max-height: 190px;
      opacity: 1;
      transform: translateY(0);
    }

    #app.has-results:not(.is-input-collapsed) .calculator-form {
      align-content: start;
      gap: 8px;
      margin-top: 14px;
    }

    #app.has-results:not(.is-input-collapsed) #results {
      margin-top: 2px;
      padding-bottom: 0;
    }

    /* Before the first calculation, remove the results section fully. */
    #app:not(.has-results) #results {
      display: none !important;
      max-height: 0 !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border-width: 0 !important;
      opacity: 0 !important;
      visibility: hidden !important;
      transform: none !important;
      pointer-events: none !important;
    }

    /* Successful calculation: collapse inputs into the summary bar. */
    #app.is-input-collapsed .input-summary {
      max-height: 46px;
      padding: 9px 2px;
      border-bottom-width: 2px;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 420ms ease 120ms,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 0s;
    }

    #app.is-input-collapsed .calculator-notice,
    #app.is-input-collapsed .calculator-form > .field,
    #app.is-input-collapsed #estimateBtn,
    #app.is-input-collapsed #out {
      max-height: 0;
      min-height: 0;
      margin-top: 0;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-9px);
      pointer-events: none;
      transition:
        max-height var(--layout-duration) var(--layout-ease),
        min-height var(--layout-duration) var(--layout-ease),
        margin var(--layout-duration) var(--layout-ease),
        padding var(--layout-duration) var(--layout-ease),
        border-width var(--layout-duration) var(--layout-ease),
        opacity 280ms ease,
        transform var(--layout-duration) var(--layout-ease),
        visibility 0s linear 360ms;
    }

    #app.is-input-collapsed .calculator-form {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      flex-direction: column;
      gap: 0;
      margin-top: 0;
    }

    #app.is-input-collapsed #results {
      display: flex !important;
      flex: 1 1 auto;
      min-height: 0;
      max-height: 1000px;
      flex-direction: column;
      justify-content: center;
      margin-top: 0;
      padding-top: 18px;
      padding-bottom: 4px;
      overflow: visible;
    }

    #app.is-input-collapsed #results.show-status {
      padding-top: 24px;
    }

    #app.is-input-collapsed .results-content {
      margin-top: auto;
      margin-bottom: auto;
    }

    #app.is-layout-transitioning .input-summary {
      pointer-events: none;
    }

    #app,
    #app.has-results:not(.is-input-collapsed),
    #app.is-input-collapsed {
      min-height: min(100dvh, var(--stage-height));
    }

    @media (max-width: 430px) {
      :root {
        --stage-height: 550px;
      }

      .box {
        width: calc(100% - 12px);
        padding: 8px 6px 10px;
      }

      .calculator-form,
      #app.has-results:not(.is-input-collapsed) .calculator-form {
        gap: 7px;
        margin-top: 12px;
      }

      .field input[type="number"],
      .field select {
        height: 31px;
        margin-top: 3px;
        padding-right: 8px;
        padding-left: 8px;
        font-size: 14px;
      }

      #app.is-input-collapsed .input-summary {
        max-height: 96px;
        padding-top: 8px;
        padding-bottom: 8px;
        align-items: center;
      }

      .input-summary-values {
        display: block;
        padding-top: 1px;
        padding-bottom: 3px;
        overflow: visible;
        font-size: 10px;
        line-height: 1.4;
        white-space: normal;
      }

      .input-summary-values > span {
        display: inline;
      }

      .input-summary-separator {
        margin-right: 3px;
        margin-left: 3px;
      }

      .input-summary-edit {
        font-size: 9px;
      }

      .scale {
        margin-right: 24px;
        margin-left: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app,
      .input-summary,
      .calculator-notice,
      .calculator-form,
      .calculator-form > .field,
      #estimateBtn,
      #out,
      #results {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <div id="app" class="box">
      <button
        id="inputSummaryButton"
        class="input-summary"
        type="button"
        aria-expanded="true"
        aria-controls="calculatorInputArea"
      >
        <span class="input-summary-values">
          <span id="summaryYears">Experience</span>
          <span
            class="input-summary-separator"
            aria-hidden="true"
          >·</span>
          <span id="summaryMmm">MMM</span>
        </span>

        <span class="input-summary-edit">Edit</span>
      </button>

      <aside class="calculator-notice" role="note">
        <p>Shows what locums charge</p>
        <p id="modelMeta" aria-live="polite">Loading model...</p>
      </aside>

      <main id="calculatorInputArea" class="calculator-form">
        <div class="field">
          <label for="years">Years since graduating</label>
          <input
            id="years"
            type="number"
            inputmode="decimal"
            enterkeyhint="next"
            min="0"
            max="50"
            step="0.5"
            required
          >
        </div>

        <div class="field">
          <label for="mmm">
            Rurality of practice (MMM)
            <small>
              <a
                href="https://www.health.gov.au/resources/apps-and-tools/health-workforce-locator/health-workforce-locator"
                target="_blank"
                rel="noopener"
              >Find my MMM</a>
            </small>
          </label>

          <select id="mmm" required>
            <option value="" selected disabled>Select MMM...</option>
            <option value="1">MM1 (Metropolitan areas)</option>
            <option value="2">MM2 (Regional centres)</option>
            <option value="3">MM3 (Large rural towns)</option>
            <option value="4">MM4 (Medium rural towns)</option>
            <option value="5">MM5 (Small rural towns)</option>
            <option value="6">MM6 (Remote communities)</option>
            <option value="7">MM7 (Very remote communities)</option>
          </select>
        </div>

        <button id="estimateBtn" type="button">Calculate</button>

        <div id="out" aria-live="polite"></div>

        <section id="results" aria-live="polite">
          <div id="resultsStatus" aria-live="polite"></div>

          <div class="results-content">
            <div class="results-primary">
              <div class="results-section-label">
                Estimated hourly weekday rate
              </div>

              <div id="pctScale" class="scale">
                <div class="track"></div>

                <div class="tick t5">
                  <span class="value" id="p05v">–</span>
                  <span class="stem"></span>
                  <span class="label">5<sup>th</sup></span>
                </div>

                <div class="tick t20">
                  <span class="value" id="p20v">–</span>
                  <span class="stem"></span>
                  <span class="label">20<sup>th</sup></span>
                </div>

                <div class="tick t50">
                  <span class="value" id="p50v">–</span>
                  <span class="stem"></span>
                  <span class="label">Median</span>
                </div>

                <div class="tick t80">
                  <span class="value" id="p80v">–</span>
                  <span class="stem"></span>
                  <span class="label">80<sup>th</sup></span>
                </div>

                <div class="tick t95">
                  <span class="value" id="p95v">–</span>
                  <span class="stem"></span>
                  <span class="label">95<sup>th</sup></span>
                </div>
              </div>

              <div class="caption">Prediction percentiles</div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    /**********************
     * CONFIG
     **********************/
    const SPREADSHEET_ID =
      '1wmrmNS4cz-_aPKnyBVg7-SShbhs6czMNh07UjyLo04s';

    const SHEET_NAME = 'Data';

    const MMM_TREAT_AS_CATEGORICAL = false;

    const MS_PER_YEAR =
      365.25 * 24 * 60 * 60 * 1000;

    const Z_TWO_SIDED_95 = 1.96;

    const Z_P05 = -1.64485;
    const Z_P20 = -0.84162;
    const Z_P50 = 0.00000;
    const Z_P80 = 0.84162;
    const Z_P95 = 1.64485;

    const out = document.getElementById('out');
    const estimateBtn = document.getElementById('estimateBtn');
    const resultsStatus = document.getElementById('resultsStatus');
    const appElement = document.getElementById('app');

    const inputSummaryButton =
      document.getElementById('inputSummaryButton');

    const summaryYears =
      document.getElementById('summaryYears');

    const summaryMmm =
      document.getElementById('summaryMmm');

    let hasPreviousResults = false;
    let numberAnimationToken = 0;
    let layoutTransitionTimer = null;

    const NUMBER_ANIMATION_MS = 1700;
    const LAYOUT_TRANSITION_MS = 980;

    function updateInputSummary() {
      const yearsValue =
        document.getElementById('years').value.trim();

      const mmmElement =
        document.getElementById('mmm');

      const mmmValue =
        mmmElement.value.trim();

      const mmmLabel =
        mmmElement.selectedOptions?.[0]
          ?.textContent
          ?.trim() || '';

      summaryYears.textContent =
        yearsValue === ''
          ? 'Experience'
          : `${yearsValue} yr${Number(yearsValue) === 1 ? '' : 's'} experience`;

      summaryMmm.textContent =
        mmmValue === ''
          ? 'MMM'
          : mmmLabel || `MM${mmmValue}`;

      inputSummaryButton.setAttribute(
        'aria-label',
        `Edit calculator inputs: ${summaryYears.textContent}, ${summaryMmm.textContent}`
      );
    }

    function setInputPanelCollapsed(collapsed) {
      const shouldCollapse = Boolean(
        collapsed &&
        hasPreviousResults
      );

      const isCurrentlyCollapsed =
        appElement.classList.contains('is-input-collapsed');

      if (shouldCollapse === isCurrentlyCollapsed) {
        return;
      }

      appElement.classList.add('is-layout-transitioning');

      appElement.classList.toggle(
        'is-input-collapsed',
        shouldCollapse
      );

      inputSummaryButton.setAttribute(
        'aria-expanded',
        String(!shouldCollapse)
      );

      window.clearTimeout(layoutTransitionTimer);

      layoutTransitionTimer = window.setTimeout(() => {
        appElement.classList.remove('is-layout-transitioning');
      }, LAYOUT_TRANSITION_MS);

      scheduleApplyScale();
    }

    inputSummaryButton.addEventListener('click', () => {
      setInputPanelCollapsed(false);
    });

    [
      'years',
      'mmm'
    ].forEach(elementId => {
      const element = document.getElementById(elementId);

      element.addEventListener('input', updateInputSummary);
      element.addEventListener('change', updateInputSummary);
    });

    updateInputSummary();

    /*
     * Shows a normal grey message or a red error message.
     */
    function setInlineMessage(
      element,
      message = '',
      isError = false
    ) {
      element.textContent = message;

      element.classList.toggle(
        'is-error',
        isError && Boolean(message)
      );
    }

    /*
     * Shows a message below the Calculate button.
     */
    function setFormMessage(
      message = '',
      isError = false
    ) {
      setInlineMessage(out, message, isError);
      scheduleApplyScale();
    }

    /*
     * Shows a message above existing results, where the divider
     * normally appears.
     */
    function setResultsMessage(
      message = '',
      isError = false
    ) {
      const resultsEl =
        document.getElementById('results');

      setInlineMessage(
        resultsStatus,
        message,
        isError
      );

      resultsEl.classList.toggle(
        'show-status',
        Boolean(message)
      );

      scheduleApplyScale();
    }

    function cleanErrorMessage(message) {
      return String(message || 'Request failed')
        .trim()
        .replace(/\.+$/, '');
    }

    function clearFormErrorOnEdit() {
      if (out.classList.contains('is-error')) {
        setFormMessage();
      }

      if (resultsStatus.classList.contains('is-error')) {
        setResultsMessage();
      }
    }

    document
      .querySelector('.calculator-form')
      .addEventListener('input', clearFormErrorOnEdit);

    document
      .querySelector('.calculator-form')
      .addEventListener('change', clearFormErrorOnEdit);

    const AUFMT = new Intl.NumberFormat('en-AU');

    function round0(x) {
      if (
        x === null ||
        x === undefined ||
        isNaN(x)
      ) {
        return '–';
      }

      return AUFMT.format(Math.round(Number(x)));
    }

    function fmtDollarsInt(x) {
      if (
        x === null ||
        x === undefined ||
        isNaN(x)
      ) {
        return '–';
      }

      return '$' + AUFMT.format(Math.round(Number(x)));
    }

    function animateNumber(
      elementId,
      targetValue,
      formatter,
      animate,
      token
    ) {
      const element =
        document.getElementById(elementId);

      const target = Number(targetValue);

      if (!Number.isFinite(target)) {
        element.textContent = '–';
        delete element.dataset.numericValue;
        return;
      }

      const storedStart = Number(
        element.dataset.numericValue
      );

      const start = Number.isFinite(storedStart)
        ? storedStart
        : 0;

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      const shouldAnimate =
        animate &&
        start !== target &&
        !reduceMotion;

      if (!shouldAnimate) {
        element.textContent = formatter(target);
        element.dataset.numericValue = String(target);
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        if (token !== numberAnimationToken) return;

        const progress = Math.min(
          (now - startedAt) / NUMBER_ANIMATION_MS,
          1
        );

        const eased = 1 - Math.pow(1 - progress, 3);
        const current = start + (target - start) * eased;

        element.textContent = formatter(current);
        element.dataset.numericValue = String(current);

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          element.textContent = formatter(target);
          element.dataset.numericValue = String(target);
        }
      }

      requestAnimationFrame(frame);
    }

    function renderPercentileScale(
      res,
      animateNumbers = false
    ) {
      const [p05, p20, p50, p80, p95] =
        [
          res.p05,
          res.p20,
          res.p50,
          res.p80,
          res.p95
        ].map(Number);

      const P_MIN = 5;
      const P_MAX = 95;
      const P_SPAN = P_MAX - P_MIN;

      const posPct = p =>
        ((p - P_MIN) / P_SPAN) * 100;

      const token = ++numberAnimationToken;

      document.querySelector('.t5').style.left =
        posPct(5) + '%';

      document.querySelector('.t20').style.left =
        posPct(20) + '%';

      document.querySelector('.t50').style.left =
        posPct(50) + '%';

      document.querySelector('.t80').style.left =
        posPct(80) + '%';

      document.querySelector('.t95').style.left =
        posPct(95) + '%';

      animateNumber(
        'p05v',
        p05,
        round0,
        animateNumbers,
        token
      );

      animateNumber(
        'p20v',
        p20,
        round0,
        animateNumbers,
        token
      );

      animateNumber(
        'p50v',
        p50,
        fmtDollarsInt,
        animateNumbers,
        token
      );

      animateNumber(
        'p80v',
        p80,
        round0,
        animateNumbers,
        token
      );

      animateNumber(
        'p95v',
        p95,
        round0,
        animateNumbers,
        token
      );
    }

    function loadGvizData() {
      return new Promise((resolve, reject) => {
        const callbackName =
          `locumEstimatorSheetCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

        const script = document.createElement('script');

        const timeout = window.setTimeout(() => {
          cleanup();
          reject(
            new Error('Could not load Google Sheet data')
          );
        }, 30000);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = response => {
          cleanup();

          if (
            !response ||
            response.status === 'error'
          ) {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                'Could not load Google Sheet data'
              )
            );
            return;
          }

          resolve(response);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('Network error'));
        };

        /*
         * Pull only the needed columns:
         * A = timestamp
         * B = rate
         * C = years
         * E = MMM
         */
        const tq =
          'select A,B,C,E where B is not null';

        const params = new URLSearchParams({
          sheet: SHEET_NAME,
          headers: '1',
          tq,
          tqx: `responseHandler:${callbackName}`
        });

        script.src =
          `https://docs.google.com/spreadsheets/d/` +
          `${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

        document.body.appendChild(script);
      });
    }

    function getCellRawValue(cell) {
      if (!cell) return '';

      return cell.v ?? cell.f ?? '';
    }

    function getDateMsFromCell(cell) {
      const rawMs = toDateMs(cell?.v);

      if (Number.isFinite(rawMs)) {
        return rawMs;
      }

      return toDateMs(cell?.f);
    }

    function normaliseRowsFromGviz(response) {
      const rows = response?.table?.rows || [];

      return rows.map(row => {
        const cells = row?.c || [];

        return {
          timestampMs: getDateMsFromCell(cells[0]),
          rate: toNum(getCellRawValue(cells[1])),
          yearsRaw: toNum(getCellRawValue(cells[2])),
          mmm: toInt(getCellRawValue(cells[3]))
        };
      });
    }

    function loadLocumModel() {
      return loadGvizData().then(response => {
        const rawRows =
          normaliseRowsFromGviz(response);

        return buildModel(rawRows);
      });
    }

    function loadModel() {
      const modelMeta =
        document.getElementById('modelMeta');

      modelMeta.classList.remove('is-live');
      modelMeta.textContent = 'Loading model...';

      loadLocumModel()
        .then(() => {
          modelMeta.textContent =
            'LIVE MLR (OLS) model loaded';

          modelMeta.classList.add('is-live');
          scheduleApplyScale();
        })
        .catch(err => {
          modelMeta.classList.remove('is-live');

          modelMeta.innerHTML =
            '<span class="warn">Model error: ' +
            cleanErrorMessage(err?.message) +
            '</span>';

          scheduleApplyScale();
        });
    }

    async function estimate() {
      const years = parseFloat(
        document.getElementById('years').value
      );

      const mmm = parseInt(
        document.getElementById('mmm').value,
        10
      );

      const resultsEl =
        document.getElementById('results');

      const hadPreviousResults =
        hasPreviousResults;

      function showInputError(message) {
        if (hadPreviousResults) {
          setFormMessage();
          setResultsMessage(message, true);
        } else {
          setFormMessage(message, true);
        }
      }

      if (
        !isFinite(years) ||
        years < 0 ||
        !isFinite(mmm) ||
        mmm < 1 ||
        mmm > 7
      ) {
        showInputError('⚠ Please complete all fields');
        return;
      }

      if (!hadPreviousResults) {
        resultsEl.style.display = 'none';
        setFormMessage();
        estimateBtn.textContent = 'Calculating...';
      } else {
        setFormMessage();
        setResultsMessage();
        estimateBtn.textContent = 'Recalculating...';
      }

      estimateBtn.disabled = true;
      scheduleApplyScale();

      try {
        /*
         * Allow the button status to render before the request begins.
         */
        await new Promise(resolve => {
          requestAnimationFrame(() => {
            requestAnimationFrame(resolve);
          });
        });

        /*
         * Re-read the Google Sheet and refit on every calculation,
         * preserving the original locum-calculator behaviour.
         */
        const model = await loadLocumModel();

        const res = predict(
          {
            years,
            mmm
          },
          model
        );

        setResultsMessage();
        setFormMessage();

        resultsEl.style.display = 'block';

        renderPercentileScale(
          res,
          true
        );

        hasPreviousResults = true;
        updateInputSummary();

        appElement.classList.add('has-results');
        setInputPanelCollapsed(true);

        scheduleApplyScale();

        estimateBtn.disabled = false;
        estimateBtn.textContent = 'Recalculate';
      } catch (err) {
        const message =
          '⚠ ' + cleanErrorMessage(err?.message);

        if (hadPreviousResults) {
          setFormMessage();
          setResultsMessage(message, true);
        } else {
          setFormMessage(message, true);
        }

        estimateBtn.disabled = false;

        estimateBtn.textContent = hadPreviousResults
          ? 'Recalculate'
          : 'Calculate';
      }
    }

    /**********************
     * MODEL
     **********************/
    function buildModel(rawRows) {
      const rows = [];

      rawRows.forEach(r => {
        const timestampMs =
          toDateMs(r.timestampMs);

        const rate = toNum(r.rate);
        const yearsRaw = toNum(r.yearsRaw);

        const yearsLog =
          Number.isFinite(yearsRaw) &&
          yearsRaw >= 0
            ? Math.log(1 + yearsRaw)
            : NaN;

        const mmm = toInt(r.mmm);

        const numericOk =
          [
            timestampMs,
            rate,
            yearsLog,
            mmm
          ].every(Number.isFinite) &&
          mmm >= 1 &&
          mmm <= 7;

        if (numericOk) {
          rows.push({
            timestampMs,
            rate,
            years: yearsLog,
            mmm
          });
        }
      });

      if (rows.length < 10) {
        throw new Error(
          'Not enough valid rows (need ≥10).'
        );
      }

      const timeOriginMs =
        rows.reduce(
          (sum, row) =>
            sum + row.timestampMs,
          0
        ) / rows.length;

      rows.forEach(row => {
        row.timeYears =
          (
            row.timestampMs -
            timeOriginMs
          ) / MS_PER_YEAR;
      });

      const designInfo =
        makeDesignInfo(timeOriginMs);

      const X = [];
      const y = [];

      rows.forEach(r => {
        y.push(r.rate);
        X.push(buildXRow(r, designInfo));
      });

      const n = y.length;
      const p = X[0].length;

      if (n <= p) {
        throw new Error(
          `Insufficient data (n=${n}, p=${p}).`
        );
      }

      const Xt = transpose(X);
      const XtX = multiply(Xt, X);
      const XtX_inv = invert(XtX);
      const Xty = multiplyVec(Xt, y);
      const beta = multiplyMatVec(XtX_inv, Xty);

      const yhat = X.map(row => dot(row, beta));
      const resid = y.map((v, i) => v - yhat[i]);

      const sse = dot(resid, resid);

      const ybar =
        y.reduce((a, b) => a + b, 0) / n;

      const sst = y.reduce(
        (acc, v) =>
          acc + Math.pow(v - ybar, 2),
        0
      );

      const r2 = 1 - (sse / sst);
      const df = n - p;
      const s2 = sse / df;

      return {
        beta,
        XtX_inv,
        s2,
        r2,
        n,
        p,
        df,
        designInfo
      };
    }

    function predict(input, model) {
      const x0 = buildX0(
        input,
        model.designInfo
      );

      const yhat = dot(x0, model.beta);

      const h = quadForm(
        model.XtX_inv,
        x0
      );

      const se_pred = Math.sqrt(
        model.s2 * (1 + h)
      );

      const p05 = yhat + Z_P05 * se_pred;
      const p20 = yhat + Z_P20 * se_pred;
      const p50 = yhat + Z_P50 * se_pred;
      const p80 = yhat + Z_P80 * se_pred;
      const p95 = yhat + Z_P95 * se_pred;

      const predLo =
        yhat - Z_TWO_SIDED_95 * se_pred;

      const predHi =
        yhat + Z_TWO_SIDED_95 * se_pred;

      return {
        yhat,
        p05,
        p20,
        p50,
        p80,
        p95,
        predLo,
        predHi,
        n: model.n,
        r2: model.r2
      };
    }

    function makeDesignInfo(timeOriginMs) {
      const terms = [
        'Intercept',
        'logYears',
        'timeYears'
      ];

      if (MMM_TREAT_AS_CATEGORICAL) {
        for (let k = 2; k <= 7; k++) {
          terms.push(`MM${k}`);
        }
      } else {
        terms.push('MM_ordinal');
      }

      return {
        terms,
        timeOriginMs,
        mmmCategorical:
          MMM_TREAT_AS_CATEGORICAL
      };
    }

    function buildXRow(r, designInfo) {
      const row = [
        1,
        r.years,
        r.timeYears
      ];

      if (designInfo.mmmCategorical) {
        for (let k = 2; k <= 7; k++) {
          row.push(r.mmm === k ? 1 : 0);
        }
      } else {
        row.push(r.mmm);
      }

      return row;
    }

    function buildX0(input, designInfo) {
      const yearsRaw = toNum(input.years);

      const yearsLog =
        Number.isFinite(yearsRaw) &&
        yearsRaw >= 0
          ? Math.log(1 + yearsRaw)
          : NaN;

      const mmm = Math.max(
        1,
        Math.min(
          7,
          Math.round(toNum(input.mmm))
        )
      );

      const predictionTimestampMs = Date.now();

      const timeYears =
        (
          predictionTimestampMs -
          designInfo.timeOriginMs
        ) / MS_PER_YEAR;

      const row = [
        1,
        yearsLog,
        timeYears
      ];

      if (designInfo.mmmCategorical) {
        for (let k = 2; k <= 7; k++) {
          row.push(mmm === k ? 1 : 0);
        }
      } else {
        row.push(mmm);
      }

      return row;
    }

    /**********************
     * HELPERS
     **********************/
    function toNum(v) {
      const n =
        typeof v === 'string'
          ? parseFloat(v)
          : Number(v);

      return Number.isFinite(n) ? n : NaN;
    }

    function toInt(v) {
      const n =
        typeof v === 'string'
          ? parseInt(v, 10)
          : Math.floor(Number(v));

      return Number.isFinite(n) ? n : NaN;
    }

    function toDateMs(v) {
      if (v instanceof Date) {
        const ms = v.getTime();
        return Number.isFinite(ms) ? ms : NaN;
      }

      if (
        typeof v === 'number' &&
        Number.isFinite(v)
      ) {
        if (v > 100000000000) {
          return v;
        }

        if (v > 0) {
          return (
            Date.UTC(1899, 11, 30) +
            v * 24 * 60 * 60 * 1000
          );
        }

        return NaN;
      }

      const text = String(v ?? '').trim();

      if (!text) return NaN;

      const googleDateMatch = text.match(
        /^Date\((\d{4}),(\d{1,2}),(\d{1,2})(?:,(\d{1,2}),(\d{1,2}),(\d{1,2}))?\)$/
      );

      if (googleDateMatch) {
        return Date.UTC(
          Number(googleDateMatch[1]),
          Number(googleDateMatch[2]),
          Number(googleDateMatch[3]),
          Number(googleDateMatch[4] || 0),
          Number(googleDateMatch[5] || 0),
          Number(googleDateMatch[6] || 0)
        );
      }

      const australianDateMatch = text.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
      );

      if (australianDateMatch) {
        const day = Number(australianDateMatch[1]);
        const month = Number(australianDateMatch[2]);
        const year = Number(australianDateMatch[3]);
        const hour = Number(australianDateMatch[4] || 0);
        const minute = Number(australianDateMatch[5] || 0);
        const second = Number(australianDateMatch[6] || 0);

        const ms = Date.UTC(
          year,
          month - 1,
          day,
          hour,
          minute,
          second
        );

        const parsed = new Date(ms);

        const valid =
          parsed.getUTCFullYear() === year &&
          parsed.getUTCMonth() === month - 1 &&
          parsed.getUTCDate() === day &&
          parsed.getUTCHours() === hour &&
          parsed.getUTCMinutes() === minute &&
          parsed.getUTCSeconds() === second;

        return valid ? ms : NaN;
      }

      const parsedMs = Date.parse(text);

      return Number.isFinite(parsedMs)
        ? parsedMs
        : NaN;
    }

    function transpose(A) {
      return A[0].map(
        (_, i) => A.map(r => r[i])
      );
    }

    function multiply(A, B) {
      const r = A.length;
      const c = B[0].length;
      const m = B.length;

      const result = Array.from(
        { length: r },
        () => Array(c).fill(0)
      );

      for (let i = 0; i < r; i++) {
        for (let k = 0; k < m; k++) {
          const aik = A[i][k];

          for (let j = 0; j < c; j++) {
            result[i][j] += aik * B[k][j];
          }
        }
      }

      return result;
    }

    function multiplyVec(A, v) {
      const r = A.length;
      const c = A[0].length;
      const result = Array(r).fill(0);

      for (let i = 0; i < r; i++) {
        let sum = 0;

        for (let j = 0; j < c; j++) {
          sum += A[i][j] * v[j];
        }

        result[i] = sum;
      }

      return result;
    }

    function multiplyMatVec(A, v) {
      return multiplyVec(A, v);
    }

    function dot(a, b) {
      let sum = 0;

      for (let i = 0; i < a.length; i++) {
        sum += a[i] * b[i];
      }

      return sum;
    }

    function identity(n) {
      const matrix = Array.from(
        { length: n },
        () => Array(n).fill(0)
      );

      for (let i = 0; i < n; i++) {
        matrix[i][i] = 1;
      }

      return matrix;
    }

    function invert(A) {
      const n = A.length;
      const matrix = A.map(r => r.slice());
      const inverse = identity(n);

      for (let c = 0; c < n; c++) {
        let pivot = c;
        let maxAbs = Math.abs(matrix[c][c]);

        for (let r = c + 1; r < n; r++) {
          const value = Math.abs(matrix[r][c]);

          if (value > maxAbs) {
            maxAbs = value;
            pivot = r;
          }
        }

        if (maxAbs === 0) {
          throw new Error(
            'Design matrix is singular (perfect multicollinearity).'
          );
        }

        if (pivot !== c) {
          [matrix[c], matrix[pivot]] =
            [matrix[pivot], matrix[c]];

          [inverse[c], inverse[pivot]] =
            [inverse[pivot], inverse[c]];
        }

        const diagonal = matrix[c][c];

        for (let j = 0; j < n; j++) {
          matrix[c][j] /= diagonal;
          inverse[c][j] /= diagonal;
        }

        for (let r = 0; r < n; r++) {
          if (r !== c) {
            const factor = matrix[r][c];

            for (let j = 0; j < n; j++) {
              matrix[r][j] -= factor * matrix[c][j];
              inverse[r][j] -= factor * inverse[c][j];
            }
          }
        }
      }

      return inverse;
    }

    function quadForm(invXtX, x) {
      const temporary =
        multiplyMatVec(invXtX, x);

      return dot(x, temporary);
    }

    document
      .getElementById('estimateBtn')
      .addEventListener('click', estimate);

    loadModel();
  </script>
</body>
