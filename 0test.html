    function appendLegendItem(
      colour,
      label,
      markerType = 'square'
    ) {
      const item =
        document.createElement(
          'span'
        );

      item.className =
        'legend-item';

      const marker =
        document.createElement(
          'span'
        );

      marker.className =
        markerType ===
          'line'
          ? 'legend-line'
          : markerType ===
              'bubble'
            ? 'legend-bubble'
            : 'legend-square';

      marker.style.background =
        colour;

      if (
        markerType ===
        'square'
      ) {
        marker.style.borderColor =
          colour;
      }

      const text =
        document.createElement(
          'span'
        );

      text.textContent =
        label;

      item.appendChild(
        marker
      );

      item.appendChild(
        text
      );

      chartLegend.appendChild(
        item
      );
    }

    function updateLegendScrollControls() {
      const hasOverflow =
        chartLegend.scrollWidth -
        chartLegend.clientWidth >
        2;

      const maximumScroll =
        Math.max(
          0,
          chartLegend.scrollWidth -
          chartLegend.clientWidth
        );

      legendScrollLeft
        .classList
        .toggle(
          'is-hidden',
          !hasOverflow ||
          chartLegend.scrollLeft <=
            2
        );

      legendScrollRight
        .classList
        .toggle(
          'is-hidden',
          !hasOverflow ||
          chartLegend.scrollLeft >=
            maximumScroll -
            2
        );
    }

    function renderLegendItems(
      items
    ) {
      chartLegend.textContent =
        '';

      chartLegend.scrollLeft =
        0;

      items.forEach(
        item => {
          appendLegendItem(
            item.colour,
            item.label,
            item.markerType
          );
        }
      );

      requestAnimationFrame(
        updateLegendScrollControls
      );
    }

    function updateLegend(
      items,
      animate = true
    ) {
      const signature =
        JSON.stringify(
          items
        );

      if (
        signature ===
        currentLegendSignature
      ) {
        return;
      }

      const token =
        ++legendAnimationToken;

      chartLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        !animate ||
        reduceMotion ||
        !chartLegend.animate
      ) {
        renderLegendItems(
          items
        );

        currentLegendSignature =
          signature;

        chartLegend.style.opacity =
          '';

        return;
      }

      const fadeOut =
        chartLegend.animate(
          [
            {
              opacity:
                1
            },

            {
              opacity:
                0
            }
          ],
          {
            duration:
              170,

            easing:
              'ease-out',

            fill:
              'forwards'
          }
        );

      fadeOut.finished
        .then(
          () => {
            if (
              token !==
              legendAnimationToken
            ) {
              return;
            }

            fadeOut.cancel();

            renderLegendItems(
              items
            );

            currentLegendSignature =
              signature;

            const fadeIn =
              chartLegend.animate(
                [
                  {
                    opacity:
                      0
                  },

                  {
                    opacity:
                      1
                  }
                ],
                {
                  duration:
                    270,

                  easing:
                    'cubic-bezier(0.22, 1, 0.36, 1)'
                }
              );

            fadeIn.finished
              .then(
                () =>
                  fadeIn.cancel()
              )
              .catch(
                () => {}
              );
          }
        )
        .catch(
          () => {
            if (
              token !==
              legendAnimationToken
            ) {
              return;
            }

            renderLegendItems(
              items
            );

            currentLegendSignature =
              signature;
          }
        );
    }

    function updateChartNote(
      note
    ) {
      chartNote.textContent =
        note ||
        '';

      chartNote
        .classList
        .toggle(
          'is-hidden',
          !note
        );
    }

    function updateTabScrollHints() {
      if (
        !tabList ||
        !tabScrollShell
      ) {
        return;
      }

      const maximumScrollLeft =
        Math.max(
          0,
          tabList.scrollWidth -
          tabList.clientWidth
        );

      const tolerance =
        2;

      tabScrollShell
        .classList
        .toggle(
          'can-scroll-left',
          tabList.scrollLeft >
          tolerance
        );

      tabScrollShell
        .classList
        .toggle(
          'can-scroll-right',
          tabList.scrollLeft <
          maximumScrollLeft -
          tolerance
        );
    }

    function updateTabIndicator(
      animate = true
    ) {
      const selectedTab =
        tabByView.get(
          activeView
        );

      if (
        !tabList ||
        !selectedTab
      ) {
        return;
      }

      if (!animate) {
        tabList.classList.add(
          'is-positioning'
        );
      }

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${selectedTab.offsetLeft}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${selectedTab.offsetWidth}px`
      );

      if (animate) {
        const targetScrollLeft =
          selectedTab.offsetLeft -
          (
            tabList.clientWidth -
            selectedTab.offsetWidth
          ) /
          2;

        tabList.scrollTo({
          left:
            Math.max(
              0,
              targetScrollLeft
            ),

          behavior:
            'smooth'
        });
      } else {
        requestAnimationFrame(
          () => {
            tabList.classList.remove(
              'is-positioning'
            );
          }
        );
      }

      requestAnimationFrame(
        updateTabScrollHints
      );
    }

    function updateActiveTab() {
      chartTabs.forEach(
        tab => {
          const isActive =
            tab.dataset.view ===
            activeView;

          tab.classList.toggle(
            'is-active',
            isActive
          );

          tab.setAttribute(
            'aria-selected',
            String(
              isActive
            )
          );
        }
      );

      updateTabIndicator(
        true
      );
    }

    function fadeTextChange(
      element,
      nextText
    ) {
      if (
        !element ||
        element.textContent ===
          nextText
      ) {
        return;
      }

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        reduceMotion ||
        !element.animate
      ) {
        element.textContent =
          nextText;

        return;
      }

      const fadeOut =
        element.animate(
          [
            {
              opacity:
                1
            },

            {
              opacity:
                0
            }
          ],
          {
            duration:
              170,

            easing:
              'ease-out',

            fill:
              'forwards'
          }
        );

      fadeOut.finished
        .then(
          () => {
            fadeOut.cancel();

            element.textContent =
              nextText;

            const fadeIn =
              element.animate(
                [
                  {
                    opacity:
                      0
                  },

                  {
                    opacity:
                      1
                  }
                ],
                {
                  duration:
                    260,

                  easing:
                    'cubic-bezier(0.22, 1, 0.36, 1)'
                }
              );

            fadeIn.finished
              .then(
                () =>
                  fadeIn.cancel()
              )
              .catch(
                () => {}
              );
          }
        )
        .catch(
          () => {
            element.textContent =
              nextText;
          }
        );
    }

    function updateReaggregateButton() {
      const shouldShow =
        splitStates.size >
          0 ||
        mergingStates.size >
          0;

      reaggregateButton
        .classList
        .toggle(
          'is-hidden',
          !shouldShow
        );

      reaggregateButton.setAttribute(
        'aria-hidden',
        String(
          !shouldShow
        )
      );

      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;

      reaggregateButton.disabled =
        interactionLocked;
    }

    function isLineDataset(
      dataset
    ) {
      return (
        dataset
          ?.datasetRole ===
          'regression' ||
        dataset
          ?.datasetRole ===
          'categoryMedian' ||
        (
          dataset?.type ===
            'line' &&
          dataset?.showLine !==
            false
        )
      );
    }

    function resolveScriptableValue(
      value,
      context,
      fallback
    ) {
      try {
        if (
          typeof value ===
          'function'
        ) {
          return value(
            context
          );
        }

        if (
          Array.isArray(
            value
          )
        ) {
          return (
            value[
              context.dataIndex
            ] ??
            fallback
          );
        }

        return (
          value ??
          fallback
        );
      } catch (_) {
        return fallback;
      }
    }

    function getTargetPointStyle(
      dataset,
      raw,
      index
    ) {
      const context = {
        chart,
        raw,

        dataIndex:
          index,

        dataset,

        datasetIndex:
          0,

        type:
          'data'
      };

      const backgroundColour =
        resolveScriptableValue(
          dataset.pointBackgroundColor,
          context,
          raw?.colour
            ? rgba(
                raw.colour,
                CONFIG.aggregateOpacity
              )
            : 'rgba(102, 0, 255, 0.20)'
        );

      const borderColour =
        resolveScriptableValue(
          dataset.pointBorderColor,
          context,
          backgroundColour
        );

      const radius =
        Number(
          resolveScriptableValue(
            dataset.pointRadius,
            context,
            CONFIG.pointRadius
          )
        );

      return {
        backgroundColour,
        borderColour,

        radius:
          Number.isFinite(
            radius
          )
            ? radius
            : CONFIG.pointRadius,

        pointStyle:
          resolveScriptableValue(
            dataset.pointStyle,
            context,
            'circle'
          )
      };
    }

    function captureRenderedGeometry() {
      const pointPixels = [];
      const lineGroups = [];

      if (!chart) {
        return {
          pointPixels,
          lineGroups
        };
      }

      chart.data.datasets.forEach(
        (
          dataset,
          datasetIndex
        ) => {
          const metadata =
            chart.getDatasetMeta(
              datasetIndex
            );

          const renderedElements =
            metadata?.data ||
            [];

          const data =
            dataset.data ||
            [];

          const pixels =
            renderedElements
              .map(
                (
                  element,
                  index
                ) => {
                  if (
                    !Number.isFinite(
                      element?.x
                    ) ||
                    !Number.isFinite(
                      element?.y
                    )
                  ) {
                    return null;
                  }

                  return {
                    x:
                      element.x,

                    y:
                      element.y,

                    raw:
                      data[
                        index
                      ] ||
                      {},

                    role:
                      dataset.datasetRole,

                    datasetMetadata:
                      dataset.metadata ||
                      {},

                    style: {
                      backgroundColour:
                        element.options
                          ?.backgroundColor ||
                        element.options
                          ?.borderColor ||
                        'rgba(119, 119, 119, 0.35)',

                      borderColour:
                        element.options
                          ?.borderColor ||
                        element.options
                          ?.backgroundColor ||
                        'rgba(119, 119, 119, 0.35)',

                      radius:
                        Number(
                          element.options
                            ?.radius
                        ) ||
                        CONFIG.pointRadius,

                      pointStyle:
                        element.options
                          ?.pointStyle ||
                        'circle'
                    }
                  };
                }
              )
              .filter(
                Boolean
              );

          if (
            !pixels.length
          ) {
            return;
          }

          if (
            isLineDataset(
              dataset
            ) &&
            pixels.length >
              1
          ) {
            lineGroups.push({
              role:
                dataset.datasetRole,

              pixels,

              metadata:
                dataset.metadata ||
                {},

              style: {
                borderColour:
                  metadata
                    ?.dataset
                    ?.options
                    ?.borderColor ||
                  dataset.borderColor ||
                  '#777777',

                borderWidth:
                  Number(
                    metadata
                      ?.dataset
                      ?.options
                      ?.borderWidth
                  ) ||
                  Number(
                    dataset.borderWidth
                  ) ||
                  1
              }
            });
          } else {
            pointPixels.push(
              ...pixels
            );
          }
        }
      );

      return {
        pointPixels,
        lineGroups
      };
    }

    function samplePixel(
      sourcePixels,
      index,
      targetLength
    ) {
      if (
        !sourcePixels.length
      ) {
        return null;
      }

      if (
        targetLength <=
        1
      ) {
        return sourcePixels[
          0
        ];
      }

      const sourceIndex =
        Math.round(
          index *
          (
            sourcePixels.length -
            1
          ) /
          Math.max(
            1,
            targetLength -
            1
          )
        );

      return sourcePixels[
        sourceIndex
      ];
    }

    function findNearestPixel(
      targetPixel,
      candidates
    ) {
      if (
        !candidates.length
      ) {
        return null;
      }

      let nearest =
        candidates[0];

      let nearestDistance =
        Infinity;

      candidates.forEach(
        candidate => {
          const distance =
            Math.hypot(
              targetPixel.x -
                candidate.x,
              targetPixel.y -
                candidate.y
            );

          if (
            distance <
            nearestDistance
          ) {
            nearest =
              candidate;

            nearestDistance =
              distance;
          }
        }
      );

      return nearest;
    }

    function choosePointStartPixel(
      targetRaw,
      targetPixel,
      geometry
    ) {
      const allPointPixels =
        geometry.pointPixels;

      if (
        !allPointPixels.length
      ) {
        const linePixels =
          geometry.lineGroups.flatMap(
            group =>
              group.pixels
          );

        return findNearestPixel(
          targetPixel,
          linePixels
        );
      }

      if (
        Number.isInteger(
          targetRaw?.sourceIndex
        )
      ) {
        const exactSource =
          allPointPixels.find(
            pixel =>
              pixel.raw
                ?.sourceIndex ===
              targetRaw.sourceIndex
          );

        if (
          exactSource
        ) {
          return exactSource;
        }
      }

      if (
        targetRaw?.state
      ) {
        const sameState =
          allPointPixels.filter(
            pixel =>
              pixel.raw
                ?.state ===
              targetRaw.state
          );

        if (
          sameState.length
        ) {
          return findNearestPixel(
            targetPixel,
            sameState
          );
        }
      }

      if (
        targetRaw?.category
      ) {
        const sameCategory =
          allPointPixels.filter(
            pixel =>
              pixel.raw
                ?.category ===
              targetRaw.category
          );

        if (
          sameCategory.length
        ) {
          return findNearestPixel(
            targetPixel,
            sameCategory
          );
        }
      }

      return findNearestPixel(
        targetPixel,
        allPointPixels
      );
    }

    function chooseLineSourceGroup(
      targetDataset,
      geometry
    ) {
      const sameRoleGroups =
        geometry.lineGroups.filter(
          group =>
            group.role ===
            targetDataset.datasetRole
        );

      if (
        sameRoleGroups.length
      ) {
        const targetCategory =
          targetDataset.metadata
            ?.category;

        const exactCategory =
          sameRoleGroups.find(
            group =>
              targetCategory &&
              group.metadata
                ?.category ===
              targetCategory
          );

        if (
          exactCategory
        ) {
          return exactCategory;
        }

        const targetMedian =
          Number(
            targetDataset.metadata
              ?.statistics
              ?.median
          );

        if (
          Number.isFinite(
            targetMedian
          )
        ) {
          return sameRoleGroups
            .slice()
            .sort(
              (
                first,
                second
              ) =>
                Math.abs(
                  Number(
                    first.metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                ) -
                Math.abs(
                  Number(
                    second.metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                )
            )[0];
        }

        return sameRoleGroups[
          0
        ];
      }

      return {
        role:
          'points',

        pixels:
          geometry.pointPixels,

        metadata:
          {},

        style: {
          borderColour:
            'rgba(119, 119, 119, 0)',

          borderWidth:
            0
        }
      };
    }

    function createTransitionPlans(
      targetDatasets,
      geometry
    ) {
      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return targetDatasets.map(
        targetDataset => {
          const targetData =
            (
              targetDataset.data ||
              []
            ).map(
              point => ({
                ...point
              })
            );

          const targetIsLine =
            isLineDataset(
              targetDataset
            );

          const lineSourceGroup =
            targetIsLine
              ? chooseLineSourceGroup(
                  targetDataset,
                  geometry
                )
              : null;

          const sourcePixels =
            [];

          const startData =
            targetData.map(
              (
                targetPoint,
                index
              ) => {
                const targetPixel = {
                  x:
                    xScale.getPixelForValue(
                      targetPoint.x
                    ),

                  y:
                    yScale.getPixelForValue(
                      targetPoint.y
                    )
                };

                const sourcePixel =
                  targetIsLine
                    ? samplePixel(
                        lineSourceGroup
                          ?.pixels ||
                        [],
                        index,
                        targetData.length
                      )
                    : choosePointStartPixel(
                        targetPoint,
                        targetPixel,
                        geometry
                      );

                sourcePixels.push(
                  sourcePixel
                );

                if (
                  !sourcePixel
                ) {
                  return {
                    ...targetPoint
                  };
                }

                return {
                  ...targetPoint,

                  x:
                    xScale.getValueForPixel(
                      sourcePixel.x
                    ),

                  y:
                    yScale.getValueForPixel(
                      sourcePixel.y
                    )
                };
              }
            );

          if (
            targetIsLine
          ) {
            const targetColour =
              String(
                targetDataset.borderColor ||
                '#777777'
              );

            const targetWidth =
              Number(
                targetDataset.borderWidth
              ) ||
              1;

            const startColour =
              lineSourceGroup
                ?.style
                ?.borderColour ||
              fadeCssColour(
                targetColour,
                0
              );

            const startWidth =
              Number(
                lineSourceGroup
                  ?.style
                  ?.borderWidth
              ) ||
              0;

            return {
              kind:
                'line',

              transitionDataset: {
                ...targetDataset,

                data:
                  startData,

                borderColor:
                  startColour,

                backgroundColor:
                  startColour,

                borderWidth:
                  startWidth,

                pointHitRadius:
                  0
              },

              targetDataset,
              startData,
              targetData,
              startColour,
              targetColour,
              startWidth,
              targetWidth
            };
          }

          const targetStyles =
            targetData.map(
              (
                point,
                index
              ) =>
                getTargetPointStyle(
                  targetDataset,
                  point,
                  index
                )
            );

          const startStyles =
            targetStyles.map(
              (
                targetStyle,
                index
              ) => {
                const sourceStyle =
                  sourcePixels[
                    index
                  ]?.style;

                if (
                  sourceStyle
                ) {
                  return sourceStyle;
                }

                return {
                  backgroundColour:
                    fadeCssColour(
                      targetStyle.backgroundColour,
                      0
                    ),

                  borderColour:
                    fadeCssColour(
                      targetStyle.borderColour,
                      0
                    ),

                  radius:
                    0,

                  pointStyle:
                    targetStyle.pointStyle
                };
              }
            );

          return {
            kind:
              'point',

            transitionDataset: {
              ...targetDataset,

              data:
                startData,

              pointBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointHoverBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointHoverBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHoverRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHitRadius:
                0,

              pointStyle:
                targetDataset.pointStyle ||
                'circle'
            },

            targetDataset,
            startData,
            targetData,
            startStyles,
            targetStyles
          };
        }
      );
    }

    function createDepartingLinePlans(
      geometry,
      targetDatasets
    ) {
      const targetRoles =
        new Set(
          targetDatasets
            .filter(
              isLineDataset
            )
            .map(
              dataset =>
                dataset.datasetRole
            )
        );

      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return geometry.lineGroups
        .filter(
          group =>
            !targetRoles.has(
              group.role
            )
        )
        .map(
          group => {
            const data =
              group.pixels.map(
                pixel => ({
                  x:
                    xScale.getValueForPixel(
                      pixel.x
                    ),

                  y:
                    yScale.getValueForPixel(
                      pixel.y
                    )
                })
              );

            const colour =
              group.style.borderColour ||
              '#777777';

            const width =
              Number(
                group.style.borderWidth
              ) ||
              1;

            return {
              dataset: {
                type:
                  'line',

                datasetRole:
                  'transitionGhost',

                data,

                parsing:
                  false,

                showLine:
                  true,

                clip:
                  false,

                fill:
                  false,

                order:
                  20,

                borderColor:
                  colour,

                backgroundColor:
                  colour,

                borderWidth:
                  width,

                borderCapStyle:
                  'round',

                borderJoinStyle:
                  'round',

                pointRadius:
                  0,

                pointHoverRadius:
                  0,

                pointHitRadius:
                  0,

                tension:
                  0
              },

              colour,
              width
            };
          }
        );
    }

    function animateViewMorph(
      model,
      duration
    ) {
      const geometry =
        captureRenderedGeometry();

      const previousXAxis =
        safeCaptureXAxisSnapshot(
          chart.scales.x,
          currentXAxisOptions
        );
      interactionLocked =
        true;

      chart.tooltip
        .setActiveElements(
          [],
          {
            x:
              0,

            y:
              0
          }
        );

      chart.options
        .animation
        .duration =
          0;

      chart.options
        .scales
        .x =
          createHiddenXAxisOptions(
            model.xScale
          );

      chart.options
        .scales
        .y =
          createYAxisOptions();

      chart.data.datasets =
        [];

      chart.update(
        'none'
      );

      xAxisSlide.from =
        previousXAxis;

      xAxisSlide.to =
        safeCaptureXAxisSnapshot(
          chart.scales.x,
          model.xScale
        );

      xAxisSlide.progress =
        0;

      xAxisSlide.active =
        Boolean(
          xAxisSlide.from ||
          xAxisSlide.to
        );

      const plans =
        createTransitionPlans(
          model.datasets,
          geometry
        );

      const departingLinePlans =
        createDepartingLinePlans(
          geometry,
          model.datasets
        );

      chart.data.datasets = [
        ...plans.map(
          plan =>
            plan.transitionDataset
        ),

        ...departingLinePlans.map(
          plan =>
            plan.dataset
        )
      ];

      chart.update(
        'none'
      );

      runAnimation({
        duration,

        easing:
          easeInOutCubic,

        onFrame(
          progress
        ) {
          xAxisSlide.progress =
            progress;

          plans.forEach(
            (
              plan,
              datasetIndex
            ) => {
              const dataset =
                chart.data.datasets[
                  datasetIndex
                ];

              dataset.data =
                plan.targetData.map(
                  (
                    targetPoint,
                    pointIndex
                  ) => {
                    const startPoint =
                      plan.startData[
                        pointIndex
                      ] ||
                      targetPoint;

                    return {
                      ...targetPoint,

                      x:
                        startPoint.x +
                        (
                          targetPoint.x -
                          startPoint.x
                        ) *
                        progress,

                      y:
                        startPoint.y +
                        (
                          targetPoint.y -
                          startPoint.y
                        ) *
                        progress
                    };
                  }
                );

              if (
                plan.kind ===
                'line'
              ) {
                dataset.borderColor =
                  interpolateCssColour(
                    plan.startColour,
                    plan.targetColour,
                    progress
                  );

                dataset.backgroundColor =
                  dataset.borderColor;

                dataset.borderWidth =
                  plan.startWidth +
                  (
                    plan.targetWidth -
                    plan.startWidth
                  ) *
                  progress;

                return;
              }

              dataset.pointBackgroundColor =
                plan.startStyles.map(
                  (
                    startStyle,
                    pointIndex
                  ) =>
                    interpolateCssColour(
                      startStyle.backgroundColour,
                      plan.targetStyles[
                        pointIndex
                      ].backgroundColour,
                      progress
                    )
                );

              dataset.pointHoverBackgroundColor =
                dataset.pointBackgroundColor;

              dataset.pointBorderColor =
                plan.startStyles.map(
                  (
                    startStyle,
                    pointIndex
                  ) =>
                    interpolateCssColour(
                      startStyle.borderColour,
                      plan.targetStyles[
                        pointIndex
                      ].borderColour,
                      progress
                    )
                );

              dataset.pointHoverBorderColor =
                dataset.pointBorderColor;

              dataset.pointRadius =
                plan.startStyles.map(
                  (
                    startStyle,
                    pointIndex
                  ) =>
                    startStyle.radius +
                    (
                      plan.targetStyles[
                        pointIndex
                      ].radius -
                      startStyle.radius
                    ) *
                    progress
                );

              dataset.pointHoverRadius =
                dataset.pointRadius;
            }
          );

          departingLinePlans.forEach(
            (
              plan,
              ghostIndex
            ) => {
              const datasetIndex =
                plans.length +
                ghostIndex;

              const dataset =
                chart.data.datasets[
                  datasetIndex
                ];

              dataset.borderColor =
                fadeCssColour(
                  plan.colour,
                  1 -
                  progress
                );

              dataset.backgroundColor =
                dataset.borderColor;

              dataset.borderWidth =
                plan.width *
                (
                  1 -
                  progress
                );
            }
          );

          chart.update(
            'none'
          );
        },

        onComplete() {
          xAxisSlide.active =
            false;

          xAxisSlide.progress =
            1;

          xAxisSlide.from =
            null;

          xAxisSlide.to =
            null;

          currentXAxisOptions =
            model.xScale;

          chart.options
            .scales
            .x =
              model.xScale;

          chart.data.datasets =
            model.datasets;

          interactionLocked =
            false;

          chart.update(
            'none'
          );

          updateReaggregateButton();
        }
      });
    }

    function applyView(
      nextView,
      animate = true
    ) {
      if (
        !chart ||
        !VIEW_CONFIG[
          nextView
        ]
      ) {
        return;
      }

      activeView =
        nextView;

      lastAggregateClickKey =
        null;

      lastAggregateClickTime =
        0;

      const model =
        buildViewModel(
          activeView
        );

      fadeTextChange(
        chartHeadingDetail,
        VIEW_CONFIG[
          activeView
        ].headingDetail
      );

      updateActiveTab();

      updateLegend(
        model.legendItems,
        animate
      );

      updateChartNote(
        model.note
      );

      updateReaggregateButton();

      if (!animate) {
        currentXAxisOptions =
          model.xScale;

        chart.options
          .animation
          .duration =
            0;

        chart.data.datasets =
          model.datasets;

        chart.options
          .scales
          .x =
            model.xScale;

        chart.options
          .scales
          .y =
            createYAxisOptions();

        chart.update(
          'none'
        );

        return;
      }

      animateViewMorph(
        model,
        CONFIG.transitionMs
      );
    }

    function requestViewSwitch(
      nextView
    ) {
      if (
        nextView ===
          activeView ||
        interactionLocked ||
        !VIEW_CONFIG[
          nextView
        ]
      ) {
        return;
      }

      if (
        activeView ===
          'location' &&
        splitStates.size >
          0
      ) {
        animateReaggregation(
          () => {
            applyView(
              nextView,
              true
            );
          }
        );

        return;
      }

      applyView(
        nextView,
        true
      );
    }

    function createRawStatePoints(
      state
    ) {
      const aggregatePoint =
        locationAggregatePoints.find(
          point =>
            point.state ===
            state
        );

      const stateRows =
        locationRawRows.get(
          state
        ) ||
        [];

      if (
        !aggregatePoint ||
        !stateRows.length
      ) {
        return [];
      }

      const statistics =
        aggregatePoint.statistics;

      const rateGroups =
        new Map();

      stateRows.forEach(
        row => {
          const key =
            String(
              row.hourlyRate
            );

          if (
            !rateGroups.has(
              key
            )
          ) {
            rateGroups.set(
              key,
              []
            );
          }

          rateGroups
            .get(
              key
            )
            .push(
              row
            );
        }
      );

      const points =
        [];

      rateGroups.forEach(
        groupRows => {
          const pointCount =
            groupRows.length;

          const availableHalfSpan =
            Math.max(
              0,
              Math.min(
                aggregatePoint.x -
                  5,
                95 -
                  aggregatePoint.x
              )
            );

          const halfSpan =
            Math.min(
              9,
              Math.max(
                0,
                (
                  pointCount -
                  1
                ) *
                0.8
              ),
              availableHalfSpan
            );

          groupRows.forEach(
            (
              row,
              index
            ) => {
              const targetX =
                pointCount ===
                  1
                  ? aggregatePoint.x
                  : aggregatePoint.x -
                    halfSpan +
                    index /
                    (
                      pointCount -
                      1
                    ) *
                    halfSpan *
                    2;

              points.push({
                kind:
                  'locationRaw',

                sourceIndex:
                  row.sourceIndex,

                state,

                x:
                  aggregatePoint.x,

                y:
                  aggregatePoint.y,

                targetX,

                targetY:
                  row.hourlyRate,

                hourlyRate:
                  row.hourlyRate,

                experience:
                  row.experience,

                rurality:
                  row.rurality,

                structure:
                  row.structure,

                date:
                  row.date,

                colour:
                  aggregatePoint.colour,

                statistics
              });
            }
          );
        }
      );

      return points;
    }

    function animateStateSplit(
      state
    ) {
      if (
        activeView !==
          'location' ||
        interactionLocked ||
        splitStates.has(
          state
        ) ||
        !chart
      ) {
        return;
      }

      const newPoints =
        createRawStatePoints(
          state
        );

      if (
        !newPoints.length
      ) {
        return;
      }

      const shouldDim =
        splitStates.size ===
        0;

      interactionLocked =
        true;

      splitStates.add(
        state
      );

      splitProgress.set(
        state,
        0
      );

      newPoints.forEach(
        point => {
          point.startX =
            point.x;

          point.startY =
            point.y;
        }
      );

      locationRawDisplayPoints.push(
        ...newPoints
      );

      chart.data
        .datasets[1]
        .data =
          locationRawDisplayPoints;

      chart.update(
        'none'
      );

      updateReaggregateButton();

      runAnimation({
        duration:
          CONFIG.splitAnimationMs,

        easing:
          easeOutCubic,

        onFrame(
          progress
        ) {
          splitProgress.set(
            state,
            progress
          );

          if (
            shouldDim
          ) {
            aggregateDimProgress =
              progress;
          }

          newPoints.forEach(
            point => {
              point.x =
                point.startX +
                (
                  point.targetX -
                  point.startX
                ) *
                progress;

              point.y =
                point.startY +
                (
                  point.targetY -
                  point.startY
                ) *
                progress;
            }
          );

          chart.update(
            'none'
          );
        },

        onComplete() {
          newPoints.forEach(
            point => {
              point.x =
                point.targetX;

              point.y =
                point.targetY;
            }
          );

          splitProgress.delete(
            state
          );

          if (
            shouldDim
          ) {
            aggregateDimProgress =
              1;
          }

          interactionLocked =
            false;

          chart.update(
            'none'
          );

          updateReaggregateButton();
        }
      });
    }

    function animateReaggregation(
      onCompleteCallback =
        null
    ) {
      if (
        activeView !==
          'location' ||
        interactionLocked ||
        !chart ||
        splitStates.size ===
          0
      ) {
        return;
      }

      interactionLocked =
        true;

      mergeProgress =
        0;

      splitStates.forEach(
        state => {
          mergingStates.add(
            state
          );
        }
      );

      locationRawDisplayPoints.forEach(
        point => {
          const aggregatePoint =
            locationAggregatePoints.find(
              item =>
                item.state ===
                point.state
            );

          point.mergeStartX =
            point.x;

          point.mergeStartY =
            point.y;

          point.mergeTargetX =
            aggregatePoint?.x ??
            point.x;

          point.mergeTargetY =
            aggregatePoint?.y ??
            point.y;
        }
      );

      chart.update(
        'none'
      );

      updateReaggregateButton();

      runAnimation({
        duration:
          CONFIG.mergeAnimationMs,

        easing:
          easeInOutCubic,

        onFrame(
          progress
        ) {
          mergeProgress =
            progress;

          aggregateDimProgress =
            1 -
            progress;

          locationRawDisplayPoints.forEach(
            point => {
              point.x =
                point.mergeStartX +
                (
                  point.mergeTargetX -
                  point.mergeStartX
                ) *
                progress;

              point.y =
                point.mergeStartY +
                (
                  point.mergeTargetY -
                  point.mergeStartY
                ) *
                progress;
            }
          );

          chart.update(
            'none'
          );
        },

        onComplete() {
          locationRawDisplayPoints =
            [];

          chart.data
            .datasets[1]
            .data =
              locationRawDisplayPoints;

          splitStates.clear();
          splitProgress.clear();
          mergingStates.clear();

          mergeProgress =
            0;

          aggregateDimProgress =
            0;

          interactionLocked =
            false;

          chart.update(
            'none'
          );

          updateReaggregateButton();

          onCompleteCallback?.();
        }
      });
    }

    reaggregateButton.addEventListener(
      'click',
      () => {
        animateReaggregation();
      }
    );

    chartTabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => {
            requestViewSwitch(
              tab.dataset.view
            );
          }
        );
      }
    );

    tabList.addEventListener(
      'scroll',
      updateTabScrollHints,
      {
        passive:
          true
      }
    );

    legendScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            -Math.max(
              110,
              legendViewport.clientWidth *
              0.72
            ),

          behavior:
            'smooth'
        });
      }
    );

    legendScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            Math.max(
              110,
              legendViewport.clientWidth *
              0.72
            ),

          behavior:
            'smooth'
        });
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive:
          true
      }
    );

    chartCanvas.addEventListener(
      'contextmenu',
      event => {
        event.preventDefault();
      }
    );

    chartCanvas.addEventListener(
      'selectstart',
      event => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      'pointerdown',
      event => {
        if (
          !event.target.closest(
            '#locumChart'
          ) &&
          chart
        ) {
          chart.tooltip
            .setActiveElements(
              [],
              {
                x:
                  0,

                y:
                  0
              }
            );

          chart.update(
            'none'
          );
        }
      }
    );

    function refreshResponsiveLayout() {
      if (
        responsiveLayoutFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveLayoutFrame
        );
      }

      responsiveLayoutFrame =
        requestAnimationFrame(
          () => {
            responsiveLayoutFrame =
              null;

            chart?.resize();

            updateTabIndicator(
              false
            );

            updateTabScrollHints();

            updateLegendScrollControls();
          }
        );
    }

    let layoutResizeObserver =
      null;

    if (
      'ResizeObserver' in
      window
    ) {
      layoutResizeObserver =
        new ResizeObserver(
          entries => {
            const hasUsableSize =
              entries.some(
                entry =>
                  entry.contentRect.width >
                    1 &&
                  entry.contentRect.height >
                    1
              );

            if (
              hasUsableSize
            ) {
              refreshResponsiveLayout();
            }
          }
        );

      layoutResizeObserver.observe(
        app
      );

      layoutResizeObserver.observe(
        chartShell
      );
    }

    window.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive:
          true
      }
    );

    window.visualViewport
      ?.addEventListener(
        'resize',
        refreshResponsiveLayout,
        {
          passive:
            true
        }
      );

    window.addEventListener(
      'pageshow',
      refreshResponsiveLayout
    );

    document.addEventListener(
      'visibilitychange',
      () => {
        if (
          !document.hidden
        ) {
          refreshResponsiveLayout();
        }
      }
    );

    if (
      document.fonts
        ?.ready
    ) {
      document.fonts.ready.then(
        refreshResponsiveLayout
      );
    }

    async function loadDashboard() {
      try {
        setStatus();

        const sourceRows =
          await loadSheetRows();

        rows =
          normaliseRows(
            sourceRows
          );

        if (
          !rows.length
        ) {
          throw new Error(
            'No valid hourly rate rows were found in columns A to J'
          );
        }

        rebuildLocationData();

        createChart();

        updateTabIndicator(
          false
        );

        hideLoadingState();

        setStatus();
      } catch (
        error
      ) {
        console.error(
          error
        );

        hideLoadingState();

        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load locum rate data'
          ).replace(
            /\.+$/,
            ''
          )
        );
      }
    }

    updateTabIndicator(
      false
    );

    loadDashboard();
  </script>
</body>
