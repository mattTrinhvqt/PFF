<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFF Job Ads Data</title>
<link
href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
rel="stylesheet"
>
<script
src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
></script>
<style>
:root {
--purple: #6600ff;
--trend-yellow: #f1c232;
--ink: #151515;
--muted: #69718a;
--track: #e8eaf0;
--error: #b42318;
--live-red: #e53935;
--state-nsw: #2db7f5;
--state-qld: #7a0036;
--state-act: #7b61ff;
--state-vic: #2d3a8c;
--state-sa: #f03a47;
--state-nt: #c25e00;
--state-wa: #000000;
--state-tas: #22a36b;
--rurality-metro: #3f4851;
--rurality-nonmetro: #9f6545;
--corporate: #00b26f;
--independent: #5a3be7;
--ophthal: #ffb000;
--other: #bfc3c7;
--blue-cone: rgba(74, 86, 255, 0.82);
--green-cone: rgba(36, 210, 116, 0.78);
--red-cone: rgba(255, 92, 48, 0.76);
}

* {
box-sizing: border-box;
}

html,
body {
width: 100%;
min-height: 100%;
margin: 0;
padding: 0;
background: #fff;
-webkit-tap-highlight-color: transparent;
}

body {
color: var(--ink);
background: #fff;
font-family: 'Lato', sans-serif;
overflow-x: hidden;
-webkit-tap-highlight-color: transparent;
-webkit-touch-callout: none;
}

button,
input {
font: inherit;
}

button {
-webkit-tap-highlight-color: transparent;
}

#fit {
display: flex;
justify-content: center;
align-items: flex-start;
width: 100%;
}

#app {
position: relative;
width: min(calc(100% - 12px), 520px);
max-width: 100%;
min-width: 0;
margin-inline: auto;
padding: 7px 6px 0;
overflow: visible;
background: #fff;
}

#app.is-loading > :not(.app-loading) {
visibility: hidden;
}

#app:not(.is-loading) .app-loading {
display: none;
}

.app-loading {
position: absolute;
inset: 0;
z-index: 100;
display: flex;
min-height: 210px;
flex-direction: column;
align-items: center;
justify-content: center;
background: #fff;
}

.cone-loader {
position: relative;
width: 176px;
height: 78px;
margin: 0 auto;
overflow: visible;
isolation: isolate;
}

.cone {
position: absolute;
bottom: 8px;
width: 58px;
height: 68px;
opacity: 0;
clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
-webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
transform: translateZ(0);
will-change: opacity;
}

.cone.blue {
left: 33px;
background: var(--blue-cone);
animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
}

.cone.green {
left: 69px;
background: var(--green-cone);
animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
}

.cone.red {
left: 85px;
background: var(--red-cone);
animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
}

.loader-text {
margin: 2px 0 0;
color: var(--muted);
font-size: 11px;
font-weight: 400;
line-height: 1.35;
text-align: center;
animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
}

@keyframes blueConeCycle {
0% { opacity: 0; }
12% { opacity: 1; }
76% { opacity: 1; }
87% { opacity: 0; }
100% { opacity: 0; }
}

@keyframes greenConeCycle {
0% { opacity: 0; }
20% { opacity: 0; }
32% { opacity: 1; }
76% { opacity: 1; }
87% { opacity: 0; }
100% { opacity: 0; }
}

@keyframes redConeCycle {
0% { opacity: 0; }
40% { opacity: 0; }
52% { opacity: 1; }
76% { opacity: 1; }
87% { opacity: 0; }
100% { opacity: 0; }
}

@keyframes loadingTextPulse {
0% { opacity: 0.45; }
52% { opacity: 0.78; }
76% { opacity: 0.78; }
87% { opacity: 0.45; }
100% { opacity: 0.45; }
}

.module-top {
display: flex;
align-items: flex-end;
justify-content: space-between;
gap: 10px;
width: 100%;
margin: 0 0 4px;
border-bottom: 1px solid var(--track);
}

.tab-list {
position: relative;
display: flex;
align-items: flex-end;
min-width: 0;
overflow-x: auto;
overflow-y: hidden;
scrollbar-width: none;
}

.tab-list::-webkit-scrollbar {
display: none;
}

.tab-list::after {
content: '';
position: absolute;
right: auto;
bottom: 0;
left: 0;
z-index: 2;
width: var(--tab-indicator-width, 0px);
height: 2px;
background: var(--purple);
pointer-events: none;
transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
transition:
transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
width 420ms cubic-bezier(0.22, 1, 0.36, 1);
will-change: transform, width;
}

.tab-list.is-positioning::after {
transition: none;
}

.chart-tab {
flex: 0 0 auto;
min-height: 29px;
margin: 0;
padding: 0 9px 6px;
color: var(--muted);
background: #fff;
border: 0;
border-bottom: 2px solid transparent;
font-size: 13px;
font-weight: 700;
line-height: 1;
cursor: pointer;
transition:
color 180ms ease,
border-color 180ms ease;
}

.chart-tab.is-active {
color: var(--purple);
border-bottom-color: transparent;
cursor: default;
}

.chart-tab:focus-visible {
outline: none;
}

.live-data {
display: inline-flex;
flex: 0 0 auto;
align-items: center;
gap: 4px;
margin: 0 1px 8px 0;
color: var(--muted);
font-size: 9px;
font-weight: 700;
letter-spacing: 0.05em;
line-height: 1;
white-space: nowrap;
}

.live-data-dot {
width: 6px;
height: 6px;
flex: 0 0 6px;
border-radius: 50%;
background: var(--live-red);
}

#status {
width: 100%;
margin: 3px 0 0;
color: var(--error);
font-size: 12px;
line-height: 1.35;
text-align: left;
}

#status:empty {
display: none;
}

.chart-heading-row {
position: relative;
width: 100%;
height: 31px;
min-height: 31px;
margin: 0;
}

.chart-heading {
margin: 0;
padding: 4px 165px 0 0;
color: var(--ink);
font-size: 15px;
font-weight: 700;
line-height: 22px;
text-align: left;
white-space: nowrap;
will-change: opacity;
}

.group-control {
position: absolute;
top: 2px;
right: 0;
z-index: 30;
}

.group-button {
display: grid;
grid-template-columns: max-content minmax(70px, 1fr) 8px;
align-items: center;
justify-content: stretch;
gap: 5px;
min-width: 154px;
min-height: 27px;
padding: 0 6px;
color: var(--muted);
background: #fff;
border: 1px solid var(--track);
border-radius: 4px;
box-shadow: none;
font-size: 11px;
font-weight: 400;
line-height: 1;
text-align: left;
white-space: nowrap;
cursor: pointer;
transition:
color 140ms ease,
border-color 140ms ease,
box-shadow 140ms ease;
}

.group-button > span:first-child {
text-align: left;
}

.group-button:hover,
.group-button[aria-expanded="true"] {
color: var(--ink);
border-color: var(--ink);
box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
}

.group-button:focus-visible {
outline: 2px solid rgba(102, 0, 255, 0.22);
outline-offset: 2px;
}

.group-value {
display: inline-block;
min-width: 70px;
color: var(--purple);
font-size: 10px;
font-weight: 700;
letter-spacing: 0.02em;
line-height: 1;
text-align: right;
white-space: nowrap;
}

.menu-arrow {
width: 0;
height: 0;
flex: 0 0 auto;
border-top: 4px solid var(--muted);
border-right: 4px solid transparent;
border-left: 4px solid transparent;
transition: transform 140ms ease;
}

.group-button[aria-expanded="true"] .menu-arrow {
transform: rotate(180deg);
}

.group-menu {
position: absolute;
z-index: 50;
top: calc(100% + 4px);
right: 0;
display: none;
min-width: 180px;
padding: 5px 0;
color: var(--ink);
background: #fff;
border: 1px solid var(--track);
border-radius: 3px;
box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
text-align: left;
}

.group-menu.is-open {
display: block;
}

.group-menu-title {
margin: 0;
padding: 6px 10px 7px;
color: var(--muted);
background: #fff;
border-bottom: 1px solid var(--track);
font-size: 10px;
font-weight: 700;
letter-spacing: 0.04em;
line-height: 1.2;
text-transform: uppercase;
will-change: opacity;
}

.group-option {
position: relative;
display: flex;
align-items: center;
gap: 8px;
min-height: 32px;
padding: 5px 10px;
color: var(--ink);
background: #fff;
font-size: 12px;
font-weight: 700;
line-height: 1.25;
cursor: pointer;
user-select: none;
}

.group-option:hover {
text-decoration: underline;
text-underline-offset: 2px;
}

.group-option input {
position: absolute;
width: 1px;
height: 1px;
opacity: 0;
pointer-events: none;
}

.group-option-box {
position: relative;
width: 15px;
height: 15px;
min-width: 15px;
max-width: 15px;
flex: 0 0 15px;
border: 1px solid var(--muted);
border-radius: 2px;
background: #fff;
}

.group-option input:checked + .group-option-box {
border-color: var(--purple);
background: var(--purple);
}

.group-option input:checked + .group-option-box::after {
content: "";
position: absolute;
top: 2px;
left: 4px;
width: 4px;
height: 7px;
border-right: 2px solid #fff;
border-bottom: 2px solid #fff;
transform: rotate(45deg);
}

.group-option input:focus-visible + .group-option-box {
outline: 2px solid rgba(102, 0, 255, 0.22);
outline-offset: 2px;
}

.group-option-all {
border-bottom: 1px solid var(--track);
}

.legend-row {
display: flex;
width: 100%;
min-width: 0;
min-height: 28px;
align-items: center;
gap: 8px;
}

.chart-legend {
display: flex;
flex: 1 1 auto;
width: auto;
min-width: 0;
min-height: 28px;
align-items: center;
gap: 12px;
padding: 1px 1px 4px;
overflow-x: auto;
overflow-y: hidden;
scrollbar-width: none;
white-space: nowrap;
}

.chart-legend::-webkit-scrollbar {
display: none;
}

.legend-item {
display: inline-flex;
flex: 0 0 auto;
align-items: center;
gap: 5px;
color: var(--muted);
font-size: 10px;
font-weight: 700;
line-height: 1;
}

.legend-square {
width: 7px;
height: 7px;
flex: 0 0 7px;
border: 1px solid transparent;
}

.legend-line {
width: 17px;
height: 3px;
flex: 0 0 17px;
border-radius: 2px;
}

.legend-note {
flex: 0 0 auto;
color: var(--muted);
font-size: 8px;
font-weight: 400;
line-height: 1.2;
text-align: right;
white-space: nowrap;
}

.legend-note.is-hidden {
display: none;
}

.chart-shell {
position: relative;
display: block;
width: 100%;
height: 585px;
min-height: 585px;
max-height: 585px;
margin: -2px 0 0;
overflow: hidden;
contain: strict;
-webkit-tap-highlight-color: transparent;
-webkit-touch-callout: none;
-webkit-user-select: none;
user-select: none;
}

#jobChart {
display: block;
width: 100% !important;
height: 100% !important;
touch-action: manipulation;
-webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
-webkit-touch-callout: none;
-webkit-user-select: none;
user-select: none;
outline: none !important;
}

#jobChart::selection {
background: transparent;
}

@media (max-width: 430px) {
#app {
width: calc(100% - 6px);
padding: 6px 2px 0;
}

.chart-tab {
padding-right: 7px;
padding-left: 7px;
font-size: 12px;
}

.live-data {
margin-right: 3px;
font-size: 8px;
}

.chart-heading-row {
height: 30px;
min-height: 30px;
}

.chart-heading {
padding-top: 4px;
padding-right: 157px;
font-size: 14px;
line-height: 21px;
}

.group-button {
min-width: 149px;
min-height: 26px;
padding-right: 5px;
padding-left: 5px;
font-size: 10px;
}

.group-value {
min-width: 66px;
font-size: 9px;
}

.group-menu {
min-width: 176px;
}

.legend-note {
font-size: 7px;
}

.chart-shell {
height: 450px;
min-height: 450px;
max-height: 450px;
}
}

@media (max-width: 350px) {
.chart-heading {
padding-right: 147px;
font-size: 12px;
}

.group-button {
min-width: 141px;
font-size: 9px;
}

.group-value {
min-width: 60px;
}

.group-menu {
min-width: 170px;
}

.chart-shell {
height: 420px;
min-height: 420px;
max-height: 420px;
}
}

@media (prefers-reduced-motion: reduce) {
*,
*::before,
*::after {
scroll-behavior: auto !important;
transition-duration: 0.01ms !important;
}

.cone.blue,
.cone.green,
.cone.red {
animation: none;
opacity: 1;
}

.loader-text {
animation: none;
opacity: 0.72;
}
}
</style>
</head>
<body>
<div id="fit">
<main id="app" class="is-loading" aria-busy="true">
<div
id="loadingState"
class="app-loading"
role="status"
aria-label="Loading job ad data"
>
<div class="cone-loader">
<div class="cone blue" aria-hidden="true"></div>
<div class="cone green" aria-hidden="true"></div>
<div class="cone red" aria-hidden="true"></div>
</div>
<div class="loader-text">Loading job ad data...</div>
</div>

<div class="module-top">
<div class="tab-list" role="tablist" aria-label="Job data views">
<button
class="chart-tab is-active"
type="button"
role="tab"
data-view="count"
aria-selected="true"
>
Job ad count
</button>
<button
class="chart-tab"
type="button"
role="tab"
data-view="pay"
aria-selected="false"
>
Advertised pay
</button>
</div>

<div class="live-data" aria-label="Live data">
<span class="live-data-dot" aria-hidden="true"></span>
<span>LIVE data</span>
</div>
</div>

<div id="status" role="alert" aria-live="polite"></div>

<div class="chart-heading-row">
<h2 id="chartHeading" class="chart-heading">Job ads over time</h2>

<div class="group-control">
<button
id="groupButton"
class="group-button"
type="button"
aria-haspopup="true"
aria-expanded="false"
aria-controls="groupMenu"
>
<span>Group by:</span>
<span id="groupValue" class="group-value">None</span>
<span class="menu-arrow" aria-hidden="true"></span>
</button>

<div
id="groupMenu"
class="group-menu"
role="group"
aria-label="Group chart data"
>
<p id="groupMenuTitle" class="group-menu-title">Group job ad count</p>

<label class="group-option group-option-all">
<input
class="group-option-input"
type="radio"
name="chart-group-mode"
value="none"
checked
>
<span class="group-option-box" aria-hidden="true"></span>
<span>None</span>
</label>

<label class="group-option">
<input
class="group-option-input"
type="radio"
name="chart-group-mode"
value="state"
>
<span class="group-option-box" aria-hidden="true"></span>
<span>State</span>
</label>

<label class="group-option">
<input
class="group-option-input"
type="radio"
name="chart-group-mode"
value="rurality"
>
<span class="group-option-box" aria-hidden="true"></span>
<span>Rurality</span>
</label>

<label class="group-option">
<input
class="group-option-input"
type="radio"
name="chart-group-mode"
value="employerType"
>
<span class="group-option-box" aria-hidden="true"></span>
<span>Employer Type</span>
</label>
</div>
</div>
</div>

<div class="legend-row">
<div
id="chartLegend"
class="chart-legend"
aria-label="Chart legend"
></div>
<div id="legendNote" class="legend-note is-hidden"></div>
</div>

<div class="chart-shell">
<canvas
id="jobChart"
aria-label="Job ads data chart"
tabindex="-1"
></canvas>
</div>
</main>
</div>

<script>
Chart.defaults.font.family = "'Lato', sans-serif";
Chart.defaults.color = '#151515';

const CONFIG = {
sheetId: '1ZcZrPHvux_ckk2cJqRYu1oz9uT4brcRmcJ80bP-v--4',
sheetGid: '1641593359',
sheetName: 'Mirror table',
range: 'B3:V',
fetchTimeoutMs: 20000,
fetchAttempts: 2,
retryDelayMs: 1200,
cacheKey: 'pff-job-ads-count-pay-v3',
yMin: 60000,
yMax: 180000,
majorYStep: 20000,
pointRadius: 2.7,
pointHoverRadius: 4.4,
pointOpacity: 0.20,
pointHoverOpacity: 0.68,
regressionWidth: 3.6,
regressionSamples: 72,
regressionHitRadius: 8,
trendWidth: 3.6,
trendHitRadius: 8,
minimumGroupSize: 20,
maxGroups: 8,
trailingWeeks: 13,
transitionMs: 1050,
columns: {
repeatFlag: 0,
date: 2,
employer: 4,
employerType: 5,
suburb: 6,
state: 7,
rurality: 9,
salary: 20
}
};

const GROUP_LABELS = {
none: 'None',
state: 'State',
rurality: 'Rurality',
employerType: 'Employer Type'
};

const STATE_COLOURS = {
NSW: '#2db7f5',
QLD: '#7a0036',
VIC: '#2d3a8c',
ACT: '#7b61ff',
SA: '#f03a47',
NT: '#c25e00',
WA: '#000000',
TAS: '#22a36b'
};

const RURALITY_COLOURS = {
Metro: '#3f4851',
'Non-metro': '#9f6545'
};

const EMPLOYER_TYPE_COLOURS = {
Corporate: '#00b26f',
Independent: '#5a3be7',
Ophthal: '#ffb000',
Other: '#bfc3c7'
};

const GROUP_ORDER = {
state: ['NSW', 'QLD', 'VIC', 'ACT', 'SA', 'NT', 'WA', 'TAS'],
rurality: ['Metro', 'Non-metro'],
employerType: ['Corporate', 'Independent', 'Ophthal', 'Other']
};

const DAY_MS = 24 * 60 * 60 * 1000;
const YEAR_MS = 365.2425 * DAY_MS;
const AVERAGE_MONTH_DAYS = 365.2425 / 12;
const TRAILING_WINDOW_MS = CONFIG.trailingWeeks * 7 * DAY_MS;
const POINT_SLOT_COUNT = CONFIG.maxGroups;

const app = document.getElementById('app');
const loadingState = document.getElementById('loadingState');
const statusElement = document.getElementById('status');
const chartHeading = document.getElementById('chartHeading');
const groupButton = document.getElementById('groupButton');
const groupValue = document.getElementById('groupValue');
const groupMenu = document.getElementById('groupMenu');
const groupMenuTitle = document.getElementById('groupMenuTitle');
const groupOptions = [
...document.querySelectorAll('.group-option-input')
];
const tabList = document.querySelector('.tab-list');
const chartTabs = [
...document.querySelectorAll('.chart-tab')
];
const chartLegend = document.getElementById('chartLegend');
const legendNote = document.getElementById('legendNote');
const chartCanvas = document.getElementById('jobChart');

let chart = null;
let rows = [];
let salaryRows = [];
let axisBounds = null;
let countAxis = null;
let activeView = 'count';
let currentGroup = 'none';
let interactionLocked = false;
let activeAnimationFrame = null;

const axisTransition = {
fromView: 'count',
toView: 'count',
progress: 1
};

function cleanText(value) {
return String(value ?? '')
.replace(/\u00a0/g, ' ')
.trim()
.replace(/\s+/g, ' ');
}

function normaliseText(value) {
return cleanText(value).toLowerCase();
}

function displayText(value) {
const text = cleanText(value);
return !text || normaliseText(text) === 'xxx' ? '—' : text;
}

function getCellText(cell) {
return cleanText(cell?.f ?? cell?.v ?? '');
}

function parseDateValue(value) {
if (value instanceof Date && !Number.isNaN(value.getTime())) {
return new Date(Date.UTC(
value.getFullYear(),
value.getMonth(),
value.getDate()
));
}

if (
typeof value === 'number' &&
Number.isFinite(value) &&
value > 20000 &&
value < 80000
) {
return new Date(Date.UTC(1899, 11, 30) + value * DAY_MS);
}

const text = cleanText(value);
if (!text) return null;

let match = text.match(
/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/i
);

if (match) {
return new Date(Date.UTC(
Number(match[1]),
Number(match[2]),
Number(match[3])
));
}

match = text.match(
/^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
);

if (match) {
let year = Number(match[3]);
if (year < 100) year += 2000;

return new Date(Date.UTC(
year,
Number(match[2]) - 1,
Number(match[1])
));
}

match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

if (match) {
return new Date(Date.UTC(
Number(match[1]),
Number(match[2]) - 1,
Number(match[3])
));
}

const parsed = new Date(text);

return Number.isNaN(parsed.getTime())
? null
: new Date(Date.UTC(
parsed.getFullYear(),
parsed.getMonth(),
parsed.getDate()
));
}

function parseDateCell(cell) {
return parseDateValue(cell?.v) || parseDateValue(cell?.f);
}

function parseSalaryValue(value) {
if (typeof value === 'number' && Number.isFinite(value)) {
return value > 0 ? value : NaN;
}

const text = cleanText(value);

if (!text || normaliseText(text) === 'xxx') {
return NaN;
}

const values = [];
const expression = /(?:\$|aud\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k)?/gi;
let match;

while ((match = expression.exec(text))) {
let number = Number(match[1].replace(/,/g, ''));
if (match[2]) number *= 1000;

if (Number.isFinite(number) && number > 0) {
values.push(number);
}
}

if (!values.length) return NaN;

return values.reduce((total, number) => total + number, 0) /
values.length;
}

function getStateGroup(value) {

.toUpperCase()
.match(/\b(?:NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/g) || [];

return matches[0] || null;
}

function getRuralityGroup(value) {
const matches = [
...cleanText(value).toUpperCase().matchAll(/\bMM\s*([1-7])\b/g)
];

if (!matches.length) return null;

return matches.some(match => Number(match[1]) === 1)
? 'Metro'
: 'Non-metro';
}

function getEmployerTypeGroup(value) {

if (!text || text === 'xxx') return null;

if (

) {
return 'Corporate';
}

if (

text.startsWith('independent ') ||
text.startsWith('independent(')
) {

}

if (text.includes('ophthal') || text.includes('opthal')) {

}

return 'Other';
}

function rgba(hex, opacity) {
const cleaned = String(hex).replace('#', '').trim();

if (!/^[0-9a-f]{6}$/i.test(cleaned)) {
return `rgba(119, 119, 119, ${opacity})`;
}

const red = parseInt(cleaned.slice(0, 2), 16);
const green = parseInt(cleaned.slice(2, 4), 16);
const blue = parseInt(cleaned.slice(4, 6), 16);

return `rgba(${red}, ${green}, ${blue}, ${opacity})`;
}

function hexToRgb(hex) {
const cleaned = String(hex).replace('#', '').trim();

if (!/^[0-9a-f]{6}$/i.test(cleaned)) {
return { red: 119, green: 119, blue: 119 };
}

return {
red: parseInt(cleaned.slice(0, 2), 16),
green: parseInt(cleaned.slice(2, 4), 16),
blue: parseInt(cleaned.slice(4, 6), 16)
};
}

function interpolateColour(firstHex, secondHex, progress) {
const first = hexToRgb(firstHex);
const second = hexToRgb(secondHex);
const red = Math.round(first.red + (second.red - first.red) * progress);
const green = Math.round(first.green + (second.green - first.green) * progress);
const blue = Math.round(first.blue + (second.blue - first.blue) * progress);
return `rgb(${red}, ${green}, ${blue})`;
}

function interpolateRgba(
firstHex,
secondHex,
firstOpacity,
secondOpacity,
progress
) {
const first = hexToRgb(firstHex);
const second = hexToRgb(secondHex);
const red = Math.round(first.red + (second.red - first.red) * progress);
const green = Math.round(first.green + (second.green - first.green) * progress);
const blue = Math.round(first.blue + (second.blue - first.blue) * progress);
const opacity = firstOpacity + (secondOpacity - firstOpacity) * progress;

return `rgba(${red}, ${green}, ${blue}, ${opacity})`;
}

function clamp(value, minimum, maximum) {
return Math.max(minimum, Math.min(maximum, value));
}

function easeInOutCubic(progress) {
return progress < 0.5
? 4 * progress * progress * progress
: 1 - Math.pow(-2 * progress + 2, 3) / 2;
}

function loadSheetRows() {
return new Promise((resolve, reject) => {
const callbackName =
`pffJobDataCallback_${Date.now()}_${Math.floor(Math.random() * 1000000)}`;
const script = document.createElement('script');
let settled = false;

const timeout = window.setTimeout(() => {
finish(new Error('Could not load Google Sheet data'));
}, CONFIG.fetchTimeoutMs);

function cleanup() {
window.clearTimeout(timeout);

try {
delete window[callbackName];
} catch (error) {
window[callbackName] = undefined;
}

if (script.parentNode) {
script.parentNode.removeChild(script);
}
}

function finish(error, response) {
if (settled) return;
settled = true;
cleanup();

if (error) {
reject(error);
return;
}

if (!response || response.status === 'error') {
reject(new Error(
response?.errors?.[0]?.detailed_message ||
'Could not load Google Sheet data'
));
return;
}

resolve(response?.table?.rows || []);
}

window[callbackName] = response => finish(null, response);

script.onerror = () => finish(
new Error('Network error loading Google Sheet data')
);

const params = new URLSearchParams({
gid: CONFIG.sheetGid,
sheet: CONFIG.sheetName,
range: CONFIG.range,
headers: '0',
tq: 'select *',
tqx: `responseHandler:${callbackName}`,
_: String(Date.now())
});

script.src =
`https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?${params.toString()}`;

document.body.appendChild(script);
});
}

function logGamma(value) {
const coefficients = [
676.5203681218851,
-1259.1392167224028,
771.3234287776531,
-176.6150291621406,
12.507343278686905,
-0.13857109526572012,
9.984369578019572e-6,
1.5056327351493116e-7
];

if (value < 0.5) {
return Math.log(Math.PI) -
Math.log(Math.sin(Math.PI * value)) -
logGamma(1 - value);
}

const shifted = value - 1;
let series = 0.9999999999998099;

coefficients.forEach((coefficient, index) => {
series += coefficient / (shifted + index + 1);
});

const total = shifted + coefficients.length - 0.5;

return 0.5 * Math.log(2 * Math.PI) +
(shifted + 0.5) * Math.log(total) -
total +
Math.log(series);
}

function betaContinuedFraction(a, b, x) {
const maximumIterations = 200;
const epsilon = 3e-14;
const minimumValue = 1e-300;
const qab = a + b;
const qap = a + 1;
const qam = a - 1;
let c = 1;
let d = 1 - qab * x / qap;

if (Math.abs(d) < minimumValue) d = minimumValue;

d = 1 / d;

let result = d;

for (
let iteration = 1;
iteration <= maximumIterations;
iteration++
) {
const doubledIteration = 2 * iteration;

let coefficient =
iteration * (b - iteration) * x /
((qam + doubledIteration) * (a + doubledIteration));

d = 1 + coefficient * d;

if (Math.abs(d) < minimumValue) {
d = minimumValue;
}

c = 1 + coefficient / c;

if (Math.abs(c) < minimumValue) {
c = minimumValue;
}

d = 1 / d;
result *= d * c;

coefficient =
-(a + iteration) * (qab + iteration) * x /
((a + doubledIteration) * (qap + doubledIteration));

d = 1 + coefficient * d;

if (Math.abs(d) < minimumValue) {
d = minimumValue;
}

c = 1 + coefficient / c;

if (Math.abs(c) < minimumValue) {
c = minimumValue;
}

d = 1 / d;

const change = d * c;
result *= change;

if (Math.abs(change - 1) < epsilon) {
break;
}
}

return result;
}

function regularizedIncompleteBeta(x, a, b) {
if (x <= 0) return 0;
if (x >= 1) return 1;

const betaTerm = Math.exp(
logGamma(a + b) -
logGamma(a) -
logGamma(b) +
a * Math.log(x) +
b * Math.log1p(-x)
);

if (x < (a + 1) / (a + b + 2)) {
return betaTerm *
betaContinuedFraction(a, b, x) /
a;
}

return 1 -
betaTerm *
betaContinuedFraction(b, a, 1 - x) /
b;
}

function calculateTwoSidedTTestPValue(
tStatistic,
degreesOfFreedom
) {
if (
!Number.isFinite(tStatistic) ||
!Number.isFinite(degreesOfFreedom) ||
degreesOfFreedom <= 0
) {
return NaN;
}

const absoluteT = Math.abs(tStatistic);

const betaInput =
degreesOfFreedom /
(degreesOfFreedom + absoluteT * absoluteT);

return Math.max(
0,
Math.min(
1,
regularizedIncompleteBeta(
betaInput,
degreesOfFreedom / 2,
0.5
)
)
);
}

function calculateRegression(data) {
if (data.length < 2) return null;

const meanX =
data.reduce(
(total, row) =>
total + row.x,
0
) /
data.length;

const meanY =
data.reduce(
(total, row) =>
total + row.salary,
0
) /
data.length;

let numerator = 0;
let denominator = 0;

data.forEach(row => {
const centredXYears =
(row.x - meanX) /
YEAR_MS;

numerator +=
centredXYears *
(row.salary - meanY);

denominator +=
centredXYears *
centredXYears;
});

if (denominator === 0) {
return null;
}

const slopePerYear =
numerator /
denominator;

const minimumX =
Math.min(
...data.map(row => row.x)
);

const maximumX =
Math.max(
...data.map(row => row.x)
);

const predict =
timestamp =>
meanY +
slopePerYear *
(
(timestamp - meanX) /
YEAR_MS
);

let pValue = NaN;

if (data.length > 2) {
const residualSumOfSquares =
data.reduce(
(total, row) => {
const residual =
row.salary -
predict(row.x);

return total +
residual * residual;
},
0
);

const degreesOfFreedom =
data.length - 2;

const residualVariance =
residualSumOfSquares /
degreesOfFreedom;

const slopeStandardError =
Math.sqrt(
residualVariance /
denominator
);

if (slopeStandardError === 0) {
pValue =
slopePerYear === 0
? 1
: 0;
} else if (
Number.isFinite(
slopeStandardError
)
) {
pValue =
calculateTwoSidedTTestPValue(
slopePerYear /
slopeStandardError,
degreesOfFreedom
);
}
}

return {
minimumX,
maximumX,
meanX,
meanY,
slopePerYear,
pValue
};
}

function buildRegressionLinePoints(regression) {
const sampleCount =
Math.max(
2,
CONFIG.regressionSamples
);

const span =
regression.maximumX -
regression.minimumX;

return Array.from(
{
length:
sampleCount
},
(
_,
index
) => {
const proportion =
index /
(sampleCount - 1);

const x =
regression.minimumX +
span * proportion;

const salary =
regression.meanY +
regression.slopePerYear *
(
(x - regression.meanX) /
YEAR_MS
);

return {
x,
y:
normaliseSalaryValue(
salary
),
value:
salary
};
}
);
}

.forEach(month => {

);

getMonthTimestamp(

counts.get(month) + 1
);
}
});

...counts.entries()
]
.map(

x,
value

shouldNormalise
? normaliseCountValue(value)

);

function buildTrailingAverageSeries(
data,
shouldNormalise = true
) {
const now =
Date.now();

return buildMonthSequence()
.map(monthTimestamp => {
const monthStart =
new Date(
monthTimestamp
);

const monthEnd =
addUtcMonths(
monthStart,
1
).getTime();

const effectiveEnd =
Math.min(
monthEnd,
now
);

const windowStart =
effectiveEnd -
TRAILING_WINDOW_MS;

if (
windowStart <
axisBounds.firstDataTime
) {
return {
x:
monthTimestamp,
y:
null,
value:
null,
quarterLabel:
formatQuarterRange(
monthTimestamp
)
};
}

const windowCount =
data.reduce(
(
total,
row
) =>
total +
(
row.x >= windowStart &&
row.x < effectiveEnd
? 1
: 0
),
0
);

const value =
windowCount *
AVERAGE_MONTH_DAYS /
(
CONFIG.trailingWeeks *
7
);

return {
x:
monthTimestamp,
y:
shouldNormalise
? normaliseCountValue(value)
: value,
value,
quarterLabel:
formatQuarterRange(
monthTimestamp
)
};
});
}

function samplePoint(
source,
index,
length
) {
if (!source.length) {
return {

axisBounds.xMin,
y:
0.5
};
}

if (length <= 1) {
return source[0];
}

const sourceIndex =
Math.round(
index *

);

return source[sourceIndex];
}

function buildPointPairs(
startData,
endData,
startFallback,
endFallback
) {
const usableStart =
startData.length
? startData
: startFallback.length
? startFallback
: endData;

const usableEnd =
endData.length
? endData
: endFallback.length
? endFallback
: startData;

const length =
Math.max(
startData.length,
endData.length,
usableStart.length
? 1
: 0,
usableEnd.length
? 1
: 0
);

if (!length) {
return {
start:
[],
end:
[]
};
}

const start = [];
const end = [];

for (
let index = 0;
index < length;
index++
) {
start.push(
samplePoint(
usableStart,
index,
length
)
);

end.push(
samplePoint(
usableEnd,
index,
length
)
);
}

return {
start,
end
};
}

'Lato',
size:
11,
weight:
'400'
},

filter(tooltipItem) {
if (interactionLocked) {
return false;
}

const role =
tooltipItem
.dataset
.datasetRole;

return (
role === 'countPoints' ||
role === 'countTrend' ||
role === 'salaryPoints' ||
role === 'regression'
);
},

callbacks: {
title(tooltipItems) {
const item =
tooltipItems?.[0];

const role =
item
?.dataset
?.datasetRole;

if (
role === 'countPoints' ||
role === 'countTrend'
) {
return (
item.dataset.groupLabel ||
'Job ads'
);
}

if (role === 'regression') {
return (
item.dataset.groupLabel ||
'Regression'
);
}

return Number.isFinite(
item?.raw?.x
)
? formatTooltipDate(
item.raw.x
)
: '';
},

label(tooltipItem) {
const role =
tooltipItem
.dataset
.datasetRole;

const raw =
tooltipItem.raw;

if (role === 'countTrend') {
return (
`${raw.quarterLabel}: ` +
`${Number(raw.value).toFixed(1)} ads/month`
);
}

if (role === 'countPoints') {
return (
`${raw.monthLabel}: ` +
`${Math.round(raw.value)} ads`
);
}

if (role === 'regression') {
return [
`Slope: ${formatSlopePerYear(
tooltipItem
.dataset
._metadata
.slopePerYear
)}`,
formatPValue(
tooltipItem
.dataset
._metadata
.pValue
)
];
}

return [
`Employer: ${displayText(raw.employer)}`,
`Suburb: ${displayText(raw.suburb)}`,
`State: ${displayText(raw.stateText)}`
];
}
}
}
},

type:

min:

axisBounds.xMax,

bounds:

tickColor:

},

title: {

}

afterBuildTicks(scale) {

) => ({

);

const initialTargets =
buildTargetDescriptors(
activeView,

);

chart.data.datasets
.forEach(
(
dataset,
index
) => {
applyDescriptor(
dataset,

);

chart.update(

);
}

function updateTabIndicator(
animate = true
) {
const activeTab =
chartTabs.find(
tab =>
tab.dataset.view ===
activeView
);

if (
!tabList ||
!activeTab
) {
return;
}

if (!animate) {
tabList.classList.add(
'is-positioning'
);
}

tabList.style.setProperty(
'--tab-indicator-x',
`${activeTab.offsetLeft}px`
);

tabList.style.setProperty(
'--tab-indicator-width',
`${activeTab.offsetWidth}px`
);

if (!animate) {
requestAnimationFrame(
() => {
tabList.classList.remove(
'is-positioning'
);
}
);
}
}

function fadeTextChange(
element,
nextText
) {
if (
!element ||
element.textContent === nextText
) {
return;
}

const reduceMotion =
window.matchMedia(
'(prefers-reduced-motion: reduce)'
).matches;

if (
reduceMotion ||
!element.animate
) {
element.textContent =
nextText;

return;
}

const fadeOut =
element.animate(
[
{
opacity:
1
},
{
opacity:
0
}
],
{
duration:
170,
easing:
'ease-out',
fill:
'forwards'
}
);

fadeOut.finished
.then(
() => {
fadeOut.cancel();

element.textContent =
nextText;

const fadeIn =
element.animate(
[
{
opacity:
0
},
{
opacity:
1
}
],
{
duration:
260,
easing:
'cubic-bezier(0.22, 1, 0.36, 1)'
}
);

fadeIn.finished
.then(
() =>
fadeIn.cancel()
)
.catch(
() => {}
);
}
)
.catch(
() => {
element.textContent =
nextText;
}
);
}

function setGroupMenuOpen(isOpen) {
groupMenu.classList.toggle(
'is-open',
isOpen
);

groupButton.setAttribute(
'aria-expanded',
String(isOpen)
);
}

function switchView(nextView) {
if (
nextView === activeView ||
interactionLocked
) {
return;
}

activeView =
nextView;

chartTabs.forEach(
tab => {
const isActive =
tab.dataset.view ===
activeView;

tab.classList.toggle(
'is-active',
isActive
);

tab.setAttribute(
'aria-selected',
String(isActive)
);
}
);

fadeTextChange(
chartHeading,
activeView === 'count'
? 'Job ads over time'
: 'Advertised salaries over time'
);

fadeTextChange(
groupMenuTitle,
activeView === 'count'
? 'Group job ad count'
: 'Group salary data'
);

updateTabIndicator(
true
);

updateLegend(
activeView,
currentGroup
);

setGroupMenuOpen(
false
);

animateToTargets(
buildTargetDescriptors(
activeView,
currentGroup
),
activeView,
true
);
}

chartTabs.forEach(
tab => {
tab.addEventListener(
'click',
() => {
switchView(
tab.dataset.view
);
}
);
}
);

groupButton.addEventListener(
'click',
event => {
event.stopPropagation();

setGroupMenuOpen(
!groupMenu
.classList
.contains(
'is-open'
)
);
}
);

groupMenu.addEventListener(
'click',
event => {
event.stopPropagation();
}
);

groupOptions.forEach(
option => {
option.addEventListener(
'change',
() => {
if (!option.checked) {
return;
}

applyGrouping(
option.value,
true
);

setGroupMenuOpen(
false
);
}
);
}
);

document.addEventListener(
'pointerdown',
event => {
if (
!event.target.closest(
'.group-control'
)
) {
setGroupMenuOpen(
false
);
}
}
);

document.addEventListener(
'keydown',
event => {
if (event.key === 'Escape') {
setGroupMenuOpen(
false
);
}
}
);

chartCanvas.addEventListener(
'contextmenu',
event => {
event.preventDefault();
}
);

chartCanvas.addEventListener(
'selectstart',
event => {
event.preventDefault();
}
);

async function loadCharts() {
setStatus();

let lastError =
null;

for (
let attempt = 1;
attempt <=
CONFIG.fetchAttempts;
attempt++
) {
try {
const sourceRows =
await loadSheetRows();

rows =
normaliseRows(
sourceRows
);

if (!rows.length) {
throw new Error(
'No valid non-repeat job ads were found'
);
}

saveCache(
rows
);

prepareChart();

hideLoadingState();

setStatus();

return;
} catch (error) {
lastError =
error;

if (
attempt <
CONFIG.fetchAttempts
) {
await new Promise(
resolve => {
window.setTimeout(
resolve,
CONFIG.retryDelayMs
);
}
);
}
}
}

const cachedRows =
loadCache();

if (cachedRows.length) {
rows =
cachedRows;

prepareChart();

hideLoadingState();

setStatus(
'Live data could not be refreshed; showing the most recently saved data'
);

return;
}

console.error(
lastError
);

hideLoadingState();

setStatus(
'⚠ ' +
String(
lastError?.message ||
'Unable to load job ad data'
).replace(
/\.+$/,
''
)
);
}

function prepareChart() {
salaryRows =
rows.filter(
row =>
Number.isFinite(
row.salary
) &&
row.salary > 0
);

axisBounds =
calculateAxisBounds(
rows
);

countAxis =
calculateCountAxis();

axisTransition.fromView =
activeView;

axisTransition.toView =
activeView;

axisTransition.progress =
1;

createChart();

updateLegend(
activeView,
currentGroup
);
}

updateLegend(
activeView,
currentGroup
);

updateTabIndicator(
false
);

if (
document.fonts?.ready
) {
document.fonts.ready.then(
() => {
updateTabIndicator(
false
);
}
);
}

window.addEventListener(
'resize',
() => {
updateTabIndicator(
false
);
}
);

loadCharts();
</script>
