    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    #app {
      width: min(calc(100% - 16px), 520px);
      max-width: 100%;
      min-width: 0;
      margin-inline: auto;
      padding: 14px 14px 16px;
      background: #fff;
    }

    /* ---------- Tab and live-data summary ---------- */

    .module-top {
      width: 100%;
      margin: 0 0 8px;
      padding: 0 0 9px;
      border-bottom: 1px solid var(--track);
    }

    .tab-list {
      display: flex;
      align-items: flex-end;
      width: 100%;
      min-width: 0;
    }

    .chart-tab {
      min-height: 32px;
      margin: 0;
      padding: 0 10px 7px;
      color: var(--purple);
      background: #fff;
      border: 0;
      border-bottom: 2px solid var(--purple);
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: default;
    }

    .live-summary {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      margin-top: 9px;
    }

    .live-data {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      color: var(--muted);
      font-family: 'Lato', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .respondent-total {
      margin-top: 6px;
      color: var(--muted);
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.2;
      white-space: nowrap;
    }

    .respondent-total strong {
      color: var(--ink);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #status {
      width: 100%;
      margin: 5px 0 0;
      color: var(--error);
      font-family: 'Lato', sans-serif;
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ---------- Chart ---------- */

    .chart-shell {
      position: relative;
      width: 100%;
      height: 520px;
      margin: 0;
    }

    #promoterChart {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 12px);
        padding: 12px 8px 14px;
      }

      .chart-tab {
        padding-right: 8px;
        padding-left: 8px;
        font-size: 12px;
      }

      .respondent-total {
        font-size: 10px;
      }

      .chart-shell {
        height: 490px;
      }
    }

    @media (max-width: 350px) {
      .chart-shell {
        height: 460px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    function getEmployerAppearance(
      employer
    ) {
      const original =
        String(
          employer || ''
        ).trim();

      const key =
        original
          .toLowerCase()
          .replace(/\s+/g, ' ');

      if (
        EMPLOYER_LOOKUP[key]
      ) {
        return EMPLOYER_LOOKUP[key];
      }

      if (
        original.length <= 10
      ) {
        return {
          label:
            original || '—',

          fullName:
            original || 'Unknown employer',

          colour:
            '#777777'
        };
      }

      const initials =
        original
          .split(/\s+/)
          .filter(Boolean)
          .map(
            word =>
              word.charAt(0)
          )
          .join('')
          .slice(0, 6);

      return {
        label:
          initials ||
          original.slice(
            0,
            10
          ),

        fullName:
          original,

        colour:
          '#777777'
      };
    }

    function formatNumber(
      value
    ) {
      return new Intl.NumberFormat(
        'en-AU'
      ).format(
        value
      );
    }


    function getCellValue(
      cell
    ) {
      if (!cell) {
        return '';
      }

      return (
        cell.v ??
        cell.f ??
        ''
      );
    }


    function toNumber(
      value
    ) {
      const number =
        typeof value === 'number'
          ? value
          : parseFloat(
              String(value)
                .replace(
                  /[^\d.-]/g,
                  ''
                )
            );

      return Number.isFinite(
        number
      )
        ? number
        : NaN;
    }


    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.max(
        minimum,
        Math.min(
          maximum,
          value
        )
      );
    }


    function hexToRgba(
      hex,
      opacity
    ) {
      const cleaned =
        String(hex)
          .replace('#', '')
          .trim();

      if (
        !/^[0-9a-f]{6}$/i.test(
          cleaned
        )
      ) {
        return (
          `rgba(119, 119, 119, ${opacity})`
        );
      }

      const red =
        parseInt(
          cleaned.slice(0, 2),
          16
        );

      const green =
        parseInt(
          cleaned.slice(2, 4),
          16
        );

      const blue =
        parseInt(
          cleaned.slice(4, 6),
          16
        );

      return (
        `rgba(${red}, ${green}, ${blue}, ${opacity})`
      );
    }


    function getBaseBubbleRadius(
      respondents
    ) {
      const calculated =
        BUBBLE_OFFSET +
        (
          Math.pow(
            respondents,
            BUBBLE_EXPONENT
          ) *
          BUBBLE_MULTIPLIER
        );

      return clamp(
        calculated,
        MIN_RADIUS,
        MAX_RADIUS
      );
    }


    function getDisplayedBubbleRadius(
      chart,
      raw
    ) {
      const widthScale =
        clamp(
          chart.width / 520,
          0.72,
          1
        );

      return (
        raw.baseRadius *
        widthScale
      );
    }


    /************************************************************
     * GOOGLE SHEETS JSONP
     ************************************************************/

    function loadSheetRows() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            'pffPromoterCallback_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() *
              1000000
            );

          const script =
            document.createElement(
              'script'
            );

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'Could not load Google Sheet data'
                  )
                );
              },
              20000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response => {
            cleanup();

            if (
              !response ||
              response.status ===
                'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          };


          script.onerror =
            () => {
              cleanup();

              reject(
                new Error(
                  'Network error loading Google Sheet data'
                )
              );
            };


          const params =
            new URLSearchParams({
              sheet:
                SHEET_NAME,

              headers:
                '1',

              tq:
                QUERY,

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(Date.now())
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
            params.toString();


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    /************************************************************
     * NORMALISE DATA
     ************************************************************/

    function normaliseRows(
      rows
    ) {
      return rows
        .map(
          row => {
            const employer =
              String(
                getCellValue(
                  row?.c?.[0]
                ) || ''
              ).trim();

            const score =
              toNumber(
                getCellValue(
                  row?.c?.[1]
                )
              );

            const respondents =
              toNumber(
                getCellValue(
                  row?.c?.[2]
                )
              );

            return {
              employer,
              score,
              respondents
            };
          }
        )
        .filter(
          item =>
            item.employer &&
            Number.isFinite(
              item.score
            ) &&
            item.score >= 0 &&
            item.score <= 10 &&
            Number.isFinite(
              item.respondents
            ) &&
            item.respondents > 0
        );
    }


    /************************************************************
     * BUBBLE LAYOUT
     *
     * The x-axis has no statistical meaning.
     *
     * Employers at the same score are distributed horizontally.
     * The largest bubble remains on the left and progressively
     * smaller bubbles are moved further right.
     ************************************************************/

    function buildChartPoints(
      items
    ) {
      const groups =
        new Map();


      items.forEach(
        item => {
          const scoreKey =
            String(
              Number(
                item.score
              )
            );

          if (
            !groups.has(
              scoreKey
            )
          ) {
            groups.set(
              scoreKey,
              []
            );
          }

          groups
            .get(
              scoreKey
            )
            .push(
              item
            );
        }
      );


      const scores = [
        ...groups.keys()
      ]
        .map(Number)
        .sort(
          (
            first,
            second
          ) =>
            second - first
        );


      const points =
        [];


      scores.forEach(
        score => {
          const group =
            groups
              .get(
                String(score)
              )
              .slice()
              .sort(
                (
                  first,
                  second
                ) =>
                  second.respondents -
                    first.respondents ||
                  first.employer.localeCompare(
                    second.employer
                  )
              );


          const leftX =
            13;

          const rightX =
            89;

          const denominator =
            Math.max(
              group.length - 1,
              1
            );


          group.forEach(
            (
              item,
              index
            ) => {
              const appearance =
                getEmployerAppearance(
                  item.employer
                );


              const xPosition =
                group.length === 1
                  ? leftX
                  : leftX +
                    (
                      index /
                      denominator
                    ) *
                    (
                      rightX -
                      leftX
                    );


              points.push({
                x:
                  xPosition,

                y:
                  item.score,

                baseRadius:
                  getBaseBubbleRadius(
                    item.respondents
                  ),

                employer:
                  item.employer,

                fullName:
                  appearance.fullName,

                shortLabel:
                  appearance.label,

                respondents:
                  item.respondents,

                backgroundColour:
                  appearance.colour
              });
            }
          );
        }
      );


      /*
       * Larger bubbles are drawn first so smaller bubbles
       * remain visible above them.
       */
      points.sort(
        (
          first,
          second
        ) =>
          second.respondents -
          first.respondents
      );


      return points;
    }


    /************************************************************

    const bubbleLabelPlugin = {
      id:
        'bubbleLabelPlugin',

      afterDatasetsDraw(
        chart
      ) {
        const context =
          chart.ctx;

        const dataset =
          chart.data
            .datasets[0];

        const metadata =
          chart.getDatasetMeta(
            0
          );


        metadata.data.forEach(
          (
            element,
            index
          ) => {
            const raw =
              dataset.data[
                index
              ];

            if (
              !raw ||
              !raw.shortLabel
            ) {
              return;
            }


            const radius =
              getDisplayedBubbleRadius(
                chart,
                raw
              );


            const fontSize =
              clamp(
                radius * 0.43,
                9,
                15
              );


            context.save();

            context.textAlign =
              'center';

            context.textBaseline =
              'middle';

            context.font =
              `700 ${fontSize}px Lato, sans-serif`;

            context.lineJoin =
              'round';

            context.lineWidth =
              Math.max(
                1.6,
                fontSize * 0.13
              );

            context.strokeStyle =
              'rgba(255, 255, 255, 0.94)';

            context.fillStyle =
              '#151515';


            context.strokeText(
              raw.shortLabel,
              element.x,
              element.y
            );

            context.fillText(
              raw.shortLabel,
              element.x,
              element.y
            );

            context.restore();
          }
        );
      }
    };

          '400 10px Lato, sans-serif';

        context.textAlign =

        context.textBaseline =

        const descriptorX =

        [

          {
            value: 5,

          },
          {
            value: 10,
            label: 'extremely'
          }
        ].forEach(
          item => {
            context.fillText(
              item.label,
              descriptorX,
              yScale.getPixelForValue(
                item.value
              )
            );
          }
        );


        context.restore();
      }
    };


    /************************************************************
     * RENDER CHART
     ************************************************************/

    function renderChart(
      points
    ) {
      const canvas =
        document.getElementById(
          'promoterChart'
        );

      const context =
        canvas.getContext(
          '2d'
        );


      if (
        promoterChart
      ) {
        promoterChart.destroy();
      }


      promoterChart =
        new Chart(
          context,
          {
            type:
              'scatter',

            data: {
              datasets: [
                {
                  label:
                    'Employer scores',

                  data:
                    points,

                  parsing:
                    false,

                  showLine:
                    false,


                  pointRadius:
                    chartContext =>
                      getDisplayedBubbleRadius(
                        chartContext.chart,
                        chartContext.raw
                      ),


                  pointHoverRadius:
                    chartContext =>
                      getDisplayedBubbleRadius(
                        chartContext.chart,
                        chartContext.raw
                      ) + 2,


                  pointHitRadius:
                    5,


                  pointBackgroundColor:
                    chartContext =>
                      hexToRgba(
                        chartContext
                          .raw
                          ?.backgroundColour ||
                          '#777777',

                        BUBBLE_OPACITY
                      ),


                  pointHoverBackgroundColor:
                    chartContext =>
                      hexToRgba(
                        chartContext
                          .raw
                          ?.backgroundColour ||
                          '#777777',

                        BUBBLE_HOVER_OPACITY
                      ),


                  pointBorderColor:
                    'rgba(21, 21, 21, 0.16)',

                  pointBorderWidth:
                    1,

                  pointHoverBorderColor:
                    'rgba(21, 21, 21, 0.30)',

                  pointHoverBorderWidth:
                    1.2
                }
              ]
            },


            options: {
              responsive:
                true,

              maintainAspectRatio:
                false,


              animation: {
                duration:
                  650,

                easing:
                  'easeOutCubic'
              },


              interaction: {
                mode:
                  'nearest',

                intersect:
                  true
              },


              layout: {
                padding: {
                  top:
                    31,

                  right:
                    5,

                  bottom:
                    4,

                  left:
                    76
                }
              },


              plugins: {
                legend: {
                  display:
                    false
                },


                tooltip: {
                  displayColors:
                    false,

                  backgroundColor:
                    '#ffffff',

                  titleColor:
                    '#151515',

                  bodyColor:
                    '#69718a',

                  borderColor:
                    '#e8eaf0',

                  borderWidth:
                    1,

                  cornerRadius:
                    4,

                  padding:
                    9,

                  titleFont: {
                    family:
                      'Lato',

                    size:
                      12,

                    weight:
                      '700'
                  },

                  bodyFont: {
                    family:
                      'Lato',

                    size:
                      11,

                    weight:
                      '400'
                  },

                  callbacks: {
                    title(
                      tooltipItems
                    ) {
                      return (
                        tooltipItems
                          ?.[0]
                          ?.raw
                          ?.fullName ||
                        ''
                      );
                    },


                    label(
                      tooltipItem
                    ) {
                      const raw =
                        tooltipItem.raw;

                      return [
                        `Score: ${raw.y}`,
                        `Respondents: ${formatNumber(raw.respondents)}`
                      ];
                    }
                  }
                }
              },


              scales: {
                x: {
                  type:
                    'linear',

                  min:
                    0,

                  max:
                    100,

                  display:
                    false,

                  grid: {
                    display:
                      false
                  },

                  border: {
                    display:
                      false
                  }
                },


                y: {
                  min:
                    0,

                  max:
                    10,


                  ticks: {
                    stepSize:
                      1,

                    color:
                      '#151515',

                    padding:
                      6,

                    font: {
                      family:
                        'Lato',

                      size:
                        11,

                      weight:
                        '400'
                    }
                  },


                  title: {
                    display:
                      false
                  },


                  grid: {
                    color:
                      'rgba(105, 113, 138, 0.10)',

                    lineWidth:
                      1,

                    drawTicks:
                      true,

                    tickLength:
                      6,

                    tickColor:
                      '#151515'
                  },


                  border: {
                    display:
                      true,

                    color:
                      '#151515',

                    width:
                      1.1
                  }
                }
              }
            },


            plugins: [
              bubbleLabelPlugin,
              yGuidePlugin
            ]
          }
        );
    }


    /************************************************************
     * LOAD ONCE
     *
     * Data is loaded when the page opens. It is not automatically
     * refreshed while the page remains open.
     ************************************************************/

    async function loadPromoterChart() {
      try {
        setStatus();


        const rows =
          await loadSheetRows();


        const items =
          normaliseRows(
            rows
          );


        if (
          !items.length
        ) {
          throw new Error(
            'No valid rows found in columns AM to AO'
          );
        }


        renderChart(
          buildChartPoints(
            items
          )
        );


        const totalRespondents =
          items.reduce(
            (
              total,
              item
            ) =>
              total +
              item.respondents,
            0
          );


        respondentTotalElement.textContent =
          formatNumber(
            totalRespondents
          );


        setStatus();

      } catch (
        error
      ) {
        console.error(
          error
        );


        respondentTotalElement.textContent =
          '—';


        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load chart'
          ).replace(
            /\.+$/,
            ''
          )
        );
      }
    }


    loadPromoterChart();
  </script>
</body>
