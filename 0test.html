<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      /* --- Visual scale toggle (set true/false) --- */
      const ENABLE_SCALE = false;

      let scaleTimer = null;

      function scheduleApplyScale() {
        if (!ENABLE_SCALE) return;
        clearTimeout(scaleTimer);

        scaleTimer = setTimeout(() => {
          requestAnimationFrame(applyScale);
        }, 80);
      }

      function applyScale() {
        const app = document.getElementById('app');
        const fit = document.getElementById('fit');

        if (!app || !fit) return;

        if (!ENABLE_SCALE) {
          app.style.transform = 'none';
          fit.style.minHeight = '100vh';
          fit.style.width = '100%';
          return;
        }

        const prevTransform = app.style.transform;
        app.style.transform = 'none';

        let sizer = document.getElementById('appSizer');

        if (!sizer) {
          sizer = app.cloneNode(true);
          sizer.id = 'appSizer';
          document.body.appendChild(sizer);
        } else {
          sizer.innerHTML = app.innerHTML;
        }

        Object.assign(sizer.style, {
          position: 'absolute',
          left: '-99999px',
          top: '0',
          transform: 'none',
          visibility: 'hidden',
          pointerEvents: 'none',
          display: 'block',
          width: getComputedStyle(app).width
        });

        const sResults = sizer.querySelector('#results');
        const sOut = sizer.querySelector('#out');

        if (sResults) sResults.style.display = 'block';
        if (sOut) sOut.textContent = 'Calculating…';

        const NAT_W = sizer.offsetWidth || app.offsetWidth || 1;
        const NAT_H = sizer.offsetHeight || app.offsetHeight || 1;

        app.style.transform = prevTransform;

        const vw =
          document.documentElement.clientWidth ||
          window.innerWidth;

        const vh = window.innerHeight;

        const scale = Math.min(
          vw / NAT_W,
          vh / NAT_H,
          1
        );

        app.style.transform = `scale(${scale})`;
        fit.style.width = '100%';

        fit.style.minHeight =
          Math.max(
            Math.ceil(NAT_H * scale),
            vh
          ) + 'px';
      }

      window.addEventListener(
        'load',
        scheduleApplyScale
      );

      window.addEventListener(
        'resize',
        scheduleApplyScale
      );

      window.addEventListener(
        'orientationchange',
        scheduleApplyScale
      );

      window.addEventListener(
        'pageshow',
        scheduleApplyScale
      );
    </script>

    <meta charset="utf-8">

    <title>Casual & Locum Optom Income Estimator</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >

    <meta
      name="theme-color"
      content="#ffffff"
    >

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    >

    <style>
      :root {
        --purple: #6600ff;
        --purple-dark: #5200cc;
        --purple-soft: #f4efff;

        --ink: #151515;
        --ink-soft: #303030;

        --muted: #69718a;
        --muted-light: #969cab;

        --surface: #ffffff;
        --surface-soft: #fafafa;
        --page: #f6f6f7;

        --border: #e4e4e8;
        --border-dark: #c9c9d0;
        --track: #e8e8ed;

        --error-red: #b42318;
        --error-soft: #fff4f2;

        --radius-large: 18px;
        --radius-medium: 12px;
        --radius-small: 9px;

        --shadow:
          0 18px 50px rgba(20, 20, 25, 0.07),
          0 3px 10px rgba(20, 20, 25, 0.035);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      html {
        background: var(--page);
      }

      body {
        color: var(--ink);
        background:
          linear-gradient(
            180deg,
            #fbfbfc 0%,
            var(--page) 100%
          );
        font-family: 'Lato', sans-serif;
        overflow-x: hidden;
        overflow-y: auto;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      input,
      select,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      #fit {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        padding: 32px 12px;
      }

      #app {
        transform-origin: top center;
        will-change: transform;
      }

      .box {
        width: min(100%, 520px);
        min-width: 0;
        margin-inline: auto;
        padding: 0;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-large);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .calculator-notice {
        width: 100%;
        margin: 0;
        padding: 22px 22px 19px;
        color: var(--muted);
        background:
          linear-gradient(
            180deg,
            #ffffff 0%,
            #fcfcfd 100%
          );
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        line-height: 1.45;
        text-align: center;
      }

      .calculator-notice p {
        margin: 0;
      }

      .calculator-notice p:first-child {
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .calculator-notice p + p {
        margin-top: 5px;
      }

      #modelMeta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .calculator-form {
        display: grid;
        grid-template-columns: 1fr;
        gap: 19px;
        padding: 23px 22px 25px;
        text-align: left;
      }

      .field {
        margin: 0;
      }

      .field label {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 8px;
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
        text-align: left;
      }

      .field label small {
        display: block;
        flex: 0 0 auto;
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
        line-height: 1.3;
        text-align: right;
      }

      .field label small a {
        color: var(--purple);
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.3;
        text-decoration: none;
        text-underline-offset: 2px;
      }

      .field label small a:hover {
        text-decoration: underline;
      }

      .control-wrap {
        position: relative;
      }

      .field input[type="number"],
      .field select {
        display: block;
        width: 100%;
        height: 48px;
        margin: 0;
        padding: 0 14px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--border-dark);
        border-radius: var(--radius-small);
        box-shadow:
          0 1px 2px rgba(20, 20, 25, 0.025);
        font-size: 15px;
        font-weight: 400;
        line-height: 1;
        text-align: left;
        outline: none;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease,
          background-color 150ms ease;
      }

      .field input[type="number"]::placeholder {
        color: var(--muted-light);
      }

      .field select {
        padding-right: 44px;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
      }

      .select-arrow {
        position: absolute;
        top: 50%;
        right: 14px;
        display: block;
        width: 16px;
        height: 16px;
        color: var(--muted);
        transform: translateY(-50%);
        pointer-events: none;
      }

      .select-arrow svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .field input[type="number"]:hover,
      .field select:hover {
        border-color: #aaaab2;
      }

      .field input[type="number"]:focus,
      .field select:focus {
        background: #fff;
        border-color: var(--purple);
        box-shadow:
          0 0 0 3px rgba(102, 0, 255, 0.10);
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        margin: 0;
        -webkit-appearance: none;
      }

      #estimateBtn {
        display: block;
        width: 100%;
        min-height: 48px;
        margin: 2px auto 0;
        padding: 0 16px;
        color: #fff;
        background: var(--ink);
        border: 1px solid var(--ink);
        border-radius: var(--radius-small);
        box-shadow:
          0 5px 13px rgba(21, 21, 21, 0.14);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          color 150ms ease,
          background-color 150ms ease,
          border-color 150ms ease,
          box-shadow 150ms ease,
          transform 150ms ease,
          opacity 150ms ease;
      }

      #estimateBtn:hover:not(:disabled) {
        background: var(--purple);
        border-color: var(--purple);
        box-shadow:
          0 7px 16px rgba(102, 0, 255, 0.20);
        transform: translateY(-1px);
      }

      #estimateBtn:active:not(:disabled) {
        box-shadow:
          0 3px 8px rgba(21, 21, 21, 0.12);
        transform: translateY(1px);
      }

      #estimateBtn:focus-visible {
        outline: 3px solid rgba(102, 0, 255, 0.16);
        outline-offset: 3px;
      }

      #estimateBtn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      #out {
        min-height: 0;
        margin: -4px 1px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        text-align: left;
      }

      #out:empty {
        display: none;
      }

      #out.is-error,
      #resultsStatus.is-error {
        color: var(--error-red);
      }

      #results {
        position: relative;
        display: none;
        margin-top: 3px;
        padding-top: 23px;
        border-top: 1px solid var(--border);
        text-align: left;
      }

      #resultsStatus {
        display: none;
        position: absolute;
        top: -11px;
        right: 0;
        left: 0;
        width: fit-content;
        max-width: 100%;
        padding-right: 10px;
        color: var(--muted);
        background: var(--surface);
        font-size: 13px;
        line-height: 1.45;
        text-align: left;
      }

      #results.show-status {
        border-top-color: transparent;
      }

      #results.show-status #resultsStatus {
        display: block;
      }

      .results-section-label {
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.35;
        text-align: center;
      }

      .results-panel {
        margin-top: 15px;
        padding: 17px 15px 13px;
        background:
          linear-gradient(
            180deg,
            #fbfbfc 0%,
            #f8f8fa 100%
          );
        border: 1px solid var(--border);
        border-radius: var(--radius-medium);
      }

      .scale {
        --trackY: 35px;
        --barH: 6px;
        --gapValue: 7px;
        --gapLabel: 8px;

        position: relative;
        width: calc(100% - 32px);
        margin: 0 16px;
        padding: 44px 0 47px;
      }

      .scale .track {
        position: absolute;
        top: var(--trackY);
        right: 0;
        left: 0;
        height: var(--barH);
        background:
          linear-gradient(
            90deg,
            var(--track) 0%,
            #ddd6ea 42%,
            #cdb8ed 50%,
            #ddd6ea 58%,
            var(--track) 100%
          );
        border-radius: 999px;
      }

      .scale .tick {
        --stemUp: 20px;
        --stemDown: 18px;

        position: absolute;
        top: calc(
          var(--trackY) +
          var(--barH) / 2
        );
        transform: translateX(-50%);
        text-align: center;
      }

      .scale .t20,
      .scale .t80 {
        --stemUp: 17px;
        --stemDown: 16px;
      }

      .scale .t5,
      .scale .t95 {
        --stemUp: 14px;
        --stemDown: 14px;
      }

      .scale .tick .stem {
        position: absolute;
        top: calc(-1 * var(--stemUp));
        left: 50%;
        width: 2px;
        height: calc(
          var(--stemUp) +
          var(--stemDown)
        );
        background: var(--muted);
        border-radius: 999px;
        transform: translateX(-50%);
      }

      .scale .t50 .stem {
        width: 4px;
        background: var(--purple);
        box-shadow:
          0 0 0 3px rgba(102, 0, 255, 0.08);
      }

      .scale .t5 .stem,
      .scale .t95 .stem {
        width: 1px;
        background: var(--muted-light);
      }

      .scale .tick .value {
        position: absolute;
        top: 0;
        left: 50%;
        color: var(--ink);
        font-size: 12px;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        white-space: nowrap;
        transform:
          translate(
            -50%,
            calc(
              -100% -
              var(--stemUp) -
              var(--gapValue)
            )
          );
      }

      .scale .tick .label {
        position: absolute;
        top: 0;
        left: 50%;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
        transform:
          translate(
            -50%,
            calc(
              var(--stemDown) +
              var(--gapLabel)
            )
          );
      }

      .scale .t50 .value {
        padding: 6px 9px;
        color: #fff;
        background: var(--purple);
        border-radius: 7px;
        box-shadow:
          0 5px 12px rgba(102, 0, 255, 0.18);
        font-size: 15px;
        font-weight: 700;
      }

      .scale .t50 .label {
        color: var(--purple);
        font-size: 13px;
        font-weight: 700;
      }

      .scale .t20 .value,
      .scale .t80 .value {
        font-size: 11px;
      }

      .scale .t5 .value,
      .scale .t95 .value {
        color: var(--muted);
        font-size: 10px;
      }

      .caption {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
      }

      .warn {
        color: var(--error-red);
      }

      @media (max-width: 430px) {
        #fit {
          padding: 18px 10px;
        }

        .box {
          border-radius: 15px;
        }

        .calculator-notice {
          padding: 19px 17px 17px;
        }

        .calculator-form {
          gap: 17px;
          padding: 20px 16px 22px;
        }

        .field label {
          font-size: 12px;
        }

        .field label small a {
          font-size: 10px;
        }

        .field input[type="number"],
        .field select {
          height: 46px;
          font-size: 14px;
        }

        #estimateBtn {
          min-height: 46px;
        }

        .results-panel {
          padding-right: 10px;
          padding-left: 10px;
        }

        .scale {
          width: calc(100% - 26px);
          margin-right: 13px;
          margin-left: 13px;
        }
      }

      @media (max-width: 350px) {
        .field label {
          align-items: flex-start;
          flex-direction: column;
          gap: 4px;
        }

        .field label small {
          text-align: left;
        }

        .scale {
          width: calc(100% - 18px);
          margin-right: 9px;
          margin-left: 9px;
        }

        .scale .tick .value {
          font-size: 10px;
        }

        .scale .t50 .value {
          font-size: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="fit">
      <div id="app" class="box">
        <aside
          class="calculator-notice"
          role="note"
        >
          <p>Shows what locums charge</p>

          <p
            id="modelMeta"
            aria-live="polite"
          >
            Loading model…
          </p>
        </aside>

        <main class="calculator-form">
          <div class="field">
            <label for="years">
              Years since graduating
            </label>

            <div class="control-wrap">
              <input
                id="years"
                type="number"
                inputmode="decimal"
                enterkeyhint="next"
                min="0"
                max="50"
                step="0.5"
                placeholder="Enter number of years"
                required
              >
            </div>
          </div>

          <div class="field">
            <label for="mmm">
              <span>
                Rurality of practice (MMM)
              </span>

              <small>
                <a
                  href="https://www.health.gov.au/resources/apps-and-tools/health-workforce-locator/health-workforce-locator"
                  target="_blank"
                  rel="noopener"
                >
                  Find my MMM
                </a>
              </small>
            </label>

            <div class="control-wrap">
              <select id="mmm" required>
                <option
                  value=""
                  selected
                  disabled
                >
                  Select MMM…
                </option>

                <option value="1">
                  MM1 (Metropolitan areas)
                </option>

                <option value="2">
                  MM2 (Regional centres)
                </option>

                <option value="3">
                  MM3 (Large rural towns)
                </option>

                <option value="4">
                  MM4 (Medium rural towns)
                </option>

                <option value="5">
                  MM5 (Small rural towns)
                </option>

                <option value="6">
                  MM6 (Remote communities)
                </option>

                <option value="7">
                  MM7 (Very remote communities)
                </option>
              </select>

              <span
                class="select-arrow"
                aria-hidden="true"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m7 10 5 5 5-5"></path>
                </svg>
              </span>
            </div>
          </div>

          <button
            id="estimateBtn"
            type="button"
          >
            Calculate
          </button>

          <div
            id="out"
            aria-live="polite"
          ></div>

          <section
            id="results"
            aria-live="polite"
          >
            <div
              id="resultsStatus"
              aria-live="polite"
            ></div>

            <div class="results-section-label">
              Estimated hourly weekday rate
            </div>

            <div class="results-panel">
              <div
                id="pctScale"
                class="scale"
              >
                <div class="track"></div>

                <div class="tick t5">
                  <span
                    class="value"
                    id="p05v"
                  >
                    –
                  </span>

                  <span class="stem"></span>

                  <span class="label">
                    5<sup>th</sup>
                  </span>
                </div>

                <div class="tick t20">
                  <span
                    class="value"
                    id="p20v"
                  >
                    –
                  </span>

                  <span class="stem"></span>

                  <span class="label">
                    20<sup>th</sup>
                  </span>
                </div>

                <div class="tick t50">
                  <span
                    class="value"
                    id="p50v"
                  >
                    –
                  </span>

                  <span class="stem"></span>

                  <span class="label">
                    Median
                  </span>
                </div>

                <div class="tick t80">
                  <span
                    class="value"
                    id="p80v"
                  >
                    –
                  </span>

                  <span class="stem"></span>

                  <span class="label">
                    80<sup>th</sup>
                  </span>
                </div>

                <div class="tick t95">
                  <span
                    class="value"
                    id="p95v"
                  >
                    –
                  </span>

                  <span class="stem"></span>

                  <span class="label">
                    95<sup>th</sup>
                  </span>
                </div>
              </div>

              <div class="caption">
                Prediction percentiles
              </div>
            </div>
          </section>
        </main>
      </
