<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Table</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow: hidden;
    }

    #fit {
      width: 100%;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 14px 2px 14px;
      text-align: center;
    }

    #app.is-loading .table-section {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      filter: none;
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }

    .table-section {
      width: 100%;
      margin-top: 0;
    }

    .table-lead {
      margin: 0 0 10px;
      color: var(--ink);
      text-align: center;
    }

    .table-lead-primary,
    .table-lead-secondary {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
    }

    .table-lead-secondary {
      margin-top: 2px;
    }

    .table-wrap {
      position: relative;
      width: 100%;
    }

    .table-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 24%;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .data-table th,
    .data-table td {
      position: relative;
      padding: 8px 6px;
      line-height: 1.2;
      text-align: center;
    }

    .data-table th {
      color: var(--muted);
      font-size: clamp(11px, 3.4vw, 14px);
      font-weight: 700;
      white-space: nowrap;
    }

    .data-table td {
      color: var(--ink);
      font-size: clamp(12px, 3.6vw, 15px);
      font-weight: 400;
    }

    .data-table th + th,
    .data-table td + td {
      border-left: 1px solid var(--track);
    }

    .data-table th:nth-child(2),
    .data-table td:nth-child(2) {
      border-left: 0;
    }

    .data-table .table-major-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--ink);
    }

    .data-table .table-empty-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--track);
    }

    .data-table sup {
      font-size: 0.7em;
      line-height: 0;
      vertical-align: super;
    }

    .live-data-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data-inline.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    .live-data-inline.is-unavailable .live-data-dot {
      background: var(--muted);
    }

    .data-table th:first-child,
    .data-table td:first-child {
      width: 24%;
    }

    .data-table td:first-child {
      font-weight: 700;
      white-space: nowrap;
    }

    .error {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 1px 12px;
      }

      .data-table th,
      .data-table td {
        padding: 7px 3px;
      }

      .data-table th {
        font-size: 11px;
      }

      .data-table td {
        font-size: 12px;
      }

      .app-loading {
        min-height: 155px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue { left: 30px; }
      .cone.green { left: 64px; }
      .cone.red { left: 78px; }

      .loader-text {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading">
      <div id="loading-state" class="app-loading" role="status" aria-label="Loading">
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading...</div>
      </div>

      <section class="table-section" aria-label="PFF table">
        <div class="table-lead">
          <p class="table-lead-primary">For roles outside optometry practice</p>
          <p class="table-lead-secondary">New jobs in the last...:</p>
        </div>

        <div class="table-wrap">
          <table id="data-table" class="data-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID =
      '12kFzZpUBE8J4WZygnK2EbFIEFC2MN2MWNuCselrFZ6s';

    const SHEET_NAME =
      'Mirror table2';

    /*
     * Mirror table2:
     * A = Repeat first instance
     * B = Repeat
     * C = Result
     * D = Date
     * E = Job Title
     * F = Employer
     * G = Suburb
     * H = State
     *
     * Row 2 contains the field headers.
     */
    const RAW_RANGE =
      'A2:H';

    const NON_DUPLICATE_VALUE =
      'No';

    /*
     * Header + two visible summary rows:
     * Optom-related = all eligible non-duplicate jobs.
     * Orthoptist = eligible non-duplicate jobs where
     * Job Title contains "orthoptist".
     */
    const EXPECTED_DATA_ROWS =
      2;

    const EXPECTED_ROWS =
      EXPECTED_DATA_ROWS +
      1;

    const EXPECTED_COLS =
      3;

    const FETCH_TIMEOUT_MS =
      15000;

    const FETCH_MAX_ATTEMPTS =
      2;

    const FETCH_RETRY_DELAY_MS =
      1000;

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'pff-optom-related-jobs-summary';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    const TABLE_STORAGE_KEY =
      'pff-optom-related-jobs-summary-raw-week-v2';

    /*
     * Testing switch only.
     * Leave false in normal use.
     */
    const FORCE_CACHED_DATA =
      true;

    const MILLISECONDS_PER_DAY =
      24 *
      60 *
      60 *
      1000;

    const app =
      document.getElementById(
        'app'
      );

    const dataTable =
      document.getElementById(
        'data-table'
      );

    const loadingState =
      document.getElementById(
        'loading-state'
      );

    function appendLiveDataCell(
      cell,
      source = 'live',
      lastUpdatedDate = '—'
    ) {
      const liveData =
        document.createElement(
          'span'
        );

      liveData.className =
        'live-data-inline';

      if (
        source ===
        'cached'
      ) {
        liveData.classList.add(
          'is-cached'
        );
      }

      if (
        source ===
        'unavailable'
      ) {
        liveData.classList.add(
          'is-unavailable'
        );
      }

      const dot =
        document.createElement(
          'span'
        );

      dot.className =
        'live-data-dot';

      dot.setAttribute(
        'aria-hidden',
        'true'
      );

      const text =
        document.createElement(
          'span'
        );

      if (
        source ===
        'cached'
      ) {
        text.textContent =
          'CACHED data';

        liveData.setAttribute(
          'aria-label',
          'Cached data'
        );
      } else if (
        source ===
        'unavailable'
      ) {
        text.textContent =
          'DATA unavailable';

        liveData.setAttribute(
          'aria-label',
          'Data unavailable'
        );
      } else {
        text.textContent =
          'LIVE data';

        liveData.setAttribute(
          'aria-label',
          `Live data, last updated ${lastUpdatedDate}`
        );
      }

      liveData.appendChild(
        dot
      );

      liveData.appendChild(
        text
      );

      if (
        source ===
        'live'
      ) {
        const lastUpdated =
          document.createElement(
            'span'
          );

        lastUpdated.textContent =
          ` (last updated ${lastUpdatedDate})`;

        liveData.appendChild(
          lastUpdated
        );
      }

      cell.appendChild(
        liveData
      );
    }

    function appendHeaderText(
      cell,
      value
    ) {
      const text =
        String(
          value ??
          '—'
        );

      const suffixMatch =
        text.match(
          /^(.*?)(th)$/i
        );

      if (
        !suffixMatch
      ) {
        cell.textContent =
          text;

        return;
      }

      cell.appendChild(
        document.createTextNode(
          suffixMatch[1]
        )
      );

      const superscript =
        document.createElement(
          'sup'
        );

      superscript.textContent =
        suffixMatch[2];

      cell.appendChild(
        superscript
      );
    }

    function normaliseText(
      value
    ) {
      return String(
        value ??
        ''
      )
        .replace(
          /\u00A0/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        )
        .toLowerCase();
    }

    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );
    }

    function formatCellText(
      value
    ) {
      if (
        value ===
          0 ||
        value ===
          '0'
      ) {
        return '0';
      }

      const text =
        String(
          value ??
          ''
        )
          .replace(
            /\u00A0/g,
            ' '
          )
          .trim()
          .replace(
            /\s+/g,
            ' '
          );

      if (
        text.toLowerCase() ===
        'optom-related'
      ) {
        return 'Opt-related';
      }

      return text ||
        '—';
    }

    function renderTable(
      values,
      source = 'live',
      lastUpdatedDate = '—'
    ) {
      hideLoadingState();

      dataTable.classList.remove(
        'error'
      );

      const thead =
        dataTable.querySelector(
          'thead'
        );

      const tbody =
        dataTable.querySelector(
          'tbody'
        );

      thead.textContent =
        '';

      tbody.textContent =
        '';

      const headers =
        values?.[0] ??
        [];

      const dataRows =
        values?.slice(
          1
        ) ??
        [];

      const headerRow =
        document.createElement(
          'tr'
        );

      headers.forEach(
        (
          value,
          index
        ) => {
          const th =
            document.createElement(
              'th'
            );

          th.scope =
            'col';

          if (
            index ===
            0
          ) {
            appendLiveDataCell(
              th,
              source,
              lastUpdatedDate
            );
          } else {
            appendHeaderText(
              th,
              value
            );
          }

          headerRow.appendChild(
            th
          );
        }
      );

      thead.appendChild(
        headerRow
      );

      const separatorRow =
        document.createElement(
          'tr'
        );

      separatorRow.className =
        'table-major-separator';

      const separatorCell =
        document.createElement(
          'td'
        );

      separatorCell.colSpan =
        Math.max(
          headers.length,
          1
        );

      separatorRow.appendChild(
        separatorCell
      );

      thead.appendChild(
        separatorRow
      );

      dataRows.forEach(
        row => {
          const isBlankRow =
            headers.every(
              (
                _,
                index
              ) =>
                String(
                  row?.[
                    index
                  ] ??
                  ''
                ).trim() ===
                ''
            );

          if (
            isBlankRow
          ) {
            const blankSeparatorRow =
              document.createElement(
                'tr'
              );

            blankSeparatorRow.className =
              'table-empty-separator';

            const blankSeparatorCell =
              document.createElement(
                'td'
              );

            blankSeparatorCell.colSpan =
              Math.max(
                headers.length,
                1
              );

            blankSeparatorRow.appendChild(
              blankSeparatorCell
            );

            tbody.appendChild(
              blankSeparatorRow
            );

            return;
          }

          const tr =
            document.createElement(
              'tr'
            );

          headers.forEach(
            (
              _,
              index
            ) => {
              const td =
                document.createElement(
                  'td'
                );

              const rawValue =
                row?.[
                  index
                ] ??
                '';

              td.textContent =
                formatCellText(
                  rawValue
                );

              tr.appendChild(
                td
              );
            }
          );

          tbody.appendChild(
            tr
          );
        }
      );
    }

    function showError(
      error
    ) {
      console.error(
        error
      );

      renderTable(
        [
          [
            'ERROR',
            '—',
            '—'
          ],
          [
            error?.message ??
              'Could not load data',
            '—',
            '—'
          ],
          [
            '',
            '',
            ''
          ]
        ],
        'unavailable'
      );

      dataTable.classList.add(
        'error'
      );
    }

    function getCellDisplayValue(
      cell
    ) {
      if (
        !cell
      ) {
        return '';
      }

      return String(
        cell.f ??
        cell.v ??
        ''
      ).trim();
    }

    function normaliseGvizRawData(
      response
    ) {
      if (
        response?.status ===
        'error'
      ) {
        throw new Error(
          response?.errors?.[0]
            ?.detailed_message ??
          'Could not load Google Sheet data'
        );
      }

      const cols =
        response?.table?.cols ??
        [];

      const rows =
        response?.table?.rows ??
        [];

      const headers =
        cols.map(
          column =>
            String(
              column?.label ??
              ''
            ).trim()
        );

      const values =
        rows.map(
          row =>
            cols.map(
              (
                _,
                index
              ) =>
                getCellDisplayValue(
                  row?.c?.[
                    index
                  ]
                )
            )
        );

      return {
        headers,
        rows:
          values
      };
    }

    function findHeaderIndex(
      headers,
      wantedHeader
    ) {
      const wanted =
        normaliseText(
          wantedHeader
        );

      return headers.findIndex(
        header =>
          normaliseText(
            header
          ) ===
          wanted
      );
    }

    function parseSheetDate(
      value
    ) {
      const text =
        String(
          value ??
          ''
        ).trim();

      if (
        !text
      ) {
        return null;
      }

      let match =
        text.match(
          /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

      if (
        match
      ) {
        return Date.UTC(
          Number(
            match[3]
          ),
          Number(
            match[2]
          ) -
            1,
          Number(
            match[1]
          )
        );
      }

      match =
        text.match(
          /^(?:Date|new Date)\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/
        );

      if (
        match
      ) {
        return Date.UTC(
          Number(
            match[1]
          ),
          Number(
            match[2]
          ),
          Number(
            match[3]
          )
        );
      }

      return null;
    }

    function getMondayForDate(
      dateUtc
    ) {
      const dayOfWeek =
        new Date(
          dateUtc
        ).getUTCDay();

      const daysSinceMonday =
        (
          dayOfWeek +
          6
        ) %
        7;

      return (
        dateUtc -
        (
          daysSinceMonday *
          MILLISECONDS_PER_DAY
        )
      );
    }

    function addDays(
      dateUtc,
      days
    ) {
      return (
        dateUtc +
        (
          days *
          MILLISECONDS_PER_DAY
        )
      );
    }

    function formatShortDate(
      dateUtc
    ) {
      if (
        dateUtc ===
          null ||
        dateUtc ===
          undefined
      ) {
        return '—';
      }

      const date =
        new Date(
          dateUtc
        );

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return '—';
      }

      const day =
        String(
          date.getUTCDate()
        ).padStart(
          2,
          '0'
        );

      const month =
        String(
          date.getUTCMonth() +
          1
        ).padStart(
          2,
          '0'
        );

      return `${day}/${month}`;
    }

    function getSecondMostRecentRawDate(
      rawData
    ) {
      const headers =
        rawData?.headers ??
        [];

      const rows =
        rawData?.rows ??
        [];

      const dateIndex =
        findHeaderIndex(
          headers,
          'Date'
        );

      if (
        dateIndex <
        0
      ) {
        return '—';
      }

      const dates =
        rows
          .map(
            row =>
              parseSheetDate(
                row?.[
                  dateIndex
                ]
              )
          )
          .filter(
            value =>
              value !==
              null
          )
          .sort(
            (
              a,
              b
            ) =>
              b -
              a
          );

      return dates.length >=
        2
          ? formatShortDate(
              dates[1]
            )
          : '—';
    }

    function findLatestRealJobDate(
      rows,
      resultIndex,
      dateIndex
    ) {
      let latestDate =
        null;

      rows.forEach(
        row => {
          const resultValue =
            String(
              row?.[
                resultIndex
              ] ??
              ''
            ).trim();

          if (
            !resultValue
          ) {
            return;
          }

          const jobDate =
            parseSheetDate(
              row?.[
                dateIndex
              ]
            );

          if (
            jobDate ===
            null
          ) {
            return;
          }

          if (
            latestDate ===
              null ||
            jobDate >
              latestDate
          ) {
            latestDate =
              jobDate;
          }
        }
      );

      return latestDate;
    }

    function buildSummaryTable(
      rawData
    ) {
      const headers =
        rawData?.headers ??
        [];

      const rows =
        rawData?.rows ??
        [];

      const repeatIndex =
        findHeaderIndex(
          headers,
          'Repeat'
        );

      const resultIndex =
        findHeaderIndex(
          headers,
          'Result'
        );

      const dateIndex =
        findHeaderIndex(
          headers,
          'Date'
        );

      const jobTitleIndex =
        findHeaderIndex(
          headers,
          'Job Title'
        );

      if (
        repeatIndex <
          0 ||
        resultIndex <
          0 ||
        dateIndex <
          0 ||
        jobTitleIndex <
          0
      ) {
        throw new Error(
          'Required Mirror table2 columns were not found.'
        );
      }

      const latestRealJobDate =
        findLatestRealJobDate(
          rows,
          resultIndex,
          dateIndex
        );

      if (
        latestRealJobDate ===
        null
      ) {
        throw new Error(
          'No valid job dates were found.'
        );
      }

      const weekStart =
        getMondayForDate(
          latestRealJobDate
        );

      const weekEnd =
        addDays(
          weekStart,
          6
        );

      const fourWeekStart =
        addDays(
          weekStart,
          -21
        );

      const fourWeekEnd =
        weekEnd;

      let weekCount =
        0;

      let fourWeekCount =
        0;

      let orthoptistWeekCount =
        0;

      let orthoptistFourWeekCount =
        0;

      rows.forEach(
        row => {
          const repeatValue =
            normaliseText(
              row?.[
                repeatIndex
              ]
            );

          if (
            repeatValue !==
            normaliseText(
              NON_DUPLICATE_VALUE
            )
          ) {
            return;
          }

          const resultValue =
            String(
              row?.[
                resultIndex
              ] ??
              ''
            ).trim();

          if (
            !resultValue
          ) {
            return;
          }

          const jobDate =
            parseSheetDate(
              row?.[
                dateIndex
              ]
            );

          if (
            jobDate ===
            null
          ) {
            return;
          }

          const isOrthoptist =
            normaliseText(
              row?.[
                jobTitleIndex
              ]
            ).includes(
              'orthoptist'
            );

          if (
            jobDate >=
              weekStart &&
            jobDate <=
              weekEnd
          ) {
            weekCount +=
              1;

            if (
              isOrthoptist
            ) {
              orthoptistWeekCount +=
                1;
            }
          }

          if (
            jobDate >=
              fourWeekStart &&
            jobDate <=
              fourWeekEnd
          ) {
            fourWeekCount +=
              1;

            if (
              isOrthoptist
            ) {
              orthoptistFourWeekCount +=
                1;
            }
          }
        }
      );

      const weekHeader =
        `Week (${formatShortDate(
          weekStart
        )}–)`;

      const fourWeekHeader =
        `4-weeks (${formatShortDate(
          fourWeekStart
        )}–)`;

      return [
        [
          '',
          weekHeader,
          fourWeekHeader
        ],
        [
          'Orthoptist',
          orthoptistWeekCount,
          orthoptistFourWeekCount
        ],
        [
          'Optom-related',
          weekCount,
          fourWeekCount
        ]
      ];
    }

    function saveStoredTable(
      values
    ) {
      try {
        localStorage.setItem(
          TABLE_STORAGE_KEY,
          JSON.stringify(
            values
          )
        );
      } catch (
        error
      ) {
        console.warn(
          'The latest table could not be stored.',
          error
        );
      }
    }

    function loadStoredTable() {
      try {
        const values =
          JSON.parse(
            localStorage.getItem(
              TABLE_STORAGE_KEY
            ) ??
            'null'
          );

        const isValid =
          Array.isArray(
            values
          ) &&
          values.length ===
            EXPECTED_ROWS &&
          values.every(
            row =>
              Array.isArray(
                row
              ) &&
              row.length ===
                EXPECTED_COLS
          );

        return isValid
          ? values
          : null;
      } catch (
        error
      ) {
        console.warn(
          'The stored table could not be read.',
          error
        );

        return null;
      }
    }

    function validateCachedSummaryData(
      data
    ) {
      const values =
        Array.isArray(
          data?.tableValues
        )
          ? data.tableValues
          : [];

      const isValid =
        values.length ===
          EXPECTED_ROWS &&
        values.every(
          row =>
            Array.isArray(
              row
            ) &&
            row.length >=
              EXPECTED_COLS
        );

      if (
        !isValid
      ) {
        throw new Error(
          'Cached summary data are incomplete.'
        );
      }

      return {
        tableValues:
          values.map(
            row =>
              row
                .slice(
                  0,
                  EXPECTED_COLS
                )
                .map(
                  value =>
                    String(
                      value ??
                      ''
                    ).trim()
                )
          )
      };
    }

    function loadCachedSummarySnapshot() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffOptomRelatedJobsSummaryCache_${
              Date.now()
            }_${
              Math.floor(
                Math.random() *
                100000
              )
            }`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Cached summary data timed out.'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] =
                undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          function finish(
            error,
            snapshot
          ) {
            if (
              settled
            ) {
              return;
            }

            settled =
              true;

            cleanup();

            if (
              error
            ) {
              reject(
                error
              );

              return;
            }

            resolve(
              snapshot
            );
          }

          window[
            callbackName
          ] =
            snapshot => {
              if (
                !snapshot ||
                snapshot.ok !==
                  true ||
                snapshot.appKey !==
                  CACHE_APP_KEY
              ) {
                finish(
                  new Error(
                    snapshot?.error ||
                    'Cached summary data are unavailable.'
                  )
                );

                return;
              }

              try {
                snapshot.data =
                  validateCachedSummaryData(
                    snapshot.data
                  );
              } catch (
                error
              ) {
                finish(
                  error
                );

                return;
              }

              finish(
                null,
                snapshot
              );
            };

          script.onerror =
            () => {
              finish(
                new Error(
                  'Cached summary data could not be loaded.'
                )
              );
            };

          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `${CACHE_WEB_APP_URL}?${params.toString()}`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function loadCachedTableOrStoredTable(
      liveError
    ) {
      loadCachedSummarySnapshot()
        .then(
          snapshot => {
            const values =
              snapshot
                .data
                .tableValues;

            saveStoredTable(
              values
            );

            renderTable(
              values,
              'cached'
            );
          }
        )
        .catch(
          cacheError => {
            console.error(
              'Apps Script cached Job Tracker 2 summary load failed',
              cacheError
            );

            const storedValues =
              loadStoredTable();

            if (
              storedValues
            ) {
              renderTable(
                storedValues,
                'cached'
              );

              return;
            }

            showError(
              liveError
            );
          }
        );
    }

    function loadForcedCachedData() {
      loadCachedSummarySnapshot()
        .then(
          snapshot => {
            const values =
              snapshot
                .data
                .tableValues;

            saveStoredTable(
              values
            );

            renderTable(
              values,
              'cached'
            );
          }
        )
        .catch(
          cacheError => {
            console.error(
              'Forced Apps Script Job Tracker 2 cache test failed',
              cacheError
            );

            const storedValues =
              loadStoredTable();

            if (
              storedValues
            ) {
              renderTable(
                storedValues,
                'cached'
              );

              return;
            }

            showError(
              cacheError
            );
          }
        );
    }

    function loadTableData(
      attempt = 1
    ) {
      const callbackName =
        `pffJobTracker2RawCallback_${
          Date.now()
        }_${
          Math.floor(
            Math.random() *
            100000
          )
        }`;

      const script =
        document.createElement(
          'script'
        );

      let settled =
        false;

      const timeout =
        window.setTimeout(
          () => {
            finish(
              new Error(
                'Could not load data'
              )
            );
          },
          FETCH_TIMEOUT_MS
        );

      function cleanup() {
        window.clearTimeout(
          timeout
        );

        try {
          delete window[
            callbackName
          ];
        } catch (
          error
        ) {
          window[
            callbackName
          ] =
            undefined;
        }

        if (
          script.parentNode
        ) {
          script.parentNode.removeChild(
            script
          );
        }
      }

      function retryOrUseCachedTable(
        error
      ) {
        if (
          attempt <
          FETCH_MAX_ATTEMPTS
        ) {
          window.setTimeout(
            () => {
              loadTableData(
                attempt +
                1
              );
            },
            FETCH_RETRY_DELAY_MS
          );

          return;
        }

        loadCachedTableOrStoredTable(
          error
        );
      }

      function finish(
        error,
        response
      ) {
        if (
          settled
        ) {
          return;
        }

        settled =
          true;

        cleanup();

        if (
          error
        ) {
          retryOrUseCachedTable(
            error
          );

          return;
        }

        try {
          const rawData =
            normaliseGvizRawData(
              response
            );

          const values =
            buildSummaryTable(
              rawData
            );

          const lastUpdatedDate =
            getSecondMostRecentRawDate(
              rawData
            );

          saveStoredTable(
            values
          );

          renderTable(
            values,
            'live',
            lastUpdatedDate
          );
        } catch (
          processingError
        ) {
          retryOrUseCachedTable(
            processingError
          );
        }
      }

      window[
        callbackName
      ] =
        response => {
          finish(
            null,
            response
          );
        };

      script.onerror =
        () => {
          finish(
            new Error(
              'Could not load data'
            )
          );
        };

      const params =
        new URLSearchParams({
          sheet:
            SHEET_NAME,

          range:
            RAW_RANGE,

          headers:
            '1',

          tqx:
            `responseHandler:${callbackName}`,

          _:
            String(
              Date.now()
            )
        });

      script.src =
        `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

      document.body.appendChild(
        script
      );
    }

    if (
      FORCE_CACHED_DATA
    ) {
      loadForcedCachedData();
    } else {
      loadTableData();
    }
  </script>
