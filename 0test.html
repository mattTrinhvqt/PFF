<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Permanent Salary Summary</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --trend-yellow: #f1c232;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    #fit {
      width: 100%;
      overflow: hidden;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 14px 2px 14px;
      text-align: center;
    }

    #app.is-loading .response-summary,
    #app.is-loading .salary-section {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      filter: none;
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }

    /* ---------- Response count ---------- */

    .response-summary {
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: 5px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 31px;
      margin-top: 2px;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    /* ---------- Compact salary distribution ---------- */

    .salary-distribution {
      width: calc(100% - 12px);
      margin: 10px auto 3px;
      padding: 0 2px;
    }

    .salary-distribution-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 14px;
      margin: 0 1px 2px;
    }

    .salary-distribution-title {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-align: left;
      white-space: nowrap;
    }

    .salary-distribution-legend {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      color: var(--muted);
      font-size: 8px;
      line-height: 1;
      white-space: nowrap;
    }

    .salary-distribution-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .salary-distribution-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(102, 0, 255, 0.42);
    }

    .salary-distribution-line {
      width: 15px;
      height: 2px;
      border-radius: 999px;
      background: var(--trend-yellow);
    }

    .salary-distribution-canvas-wrap {
      position: relative;
      width: 100%;
      height: 78px;
      overflow: hidden;
      border-top: 1px solid rgba(105, 113, 138, 0.10);
    }

    #salary-distribution-canvas {
      display: block;
      width: 100%;
      height: 78px;
    }

    .salary-distribution-status {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.88);
      font-size: 9px;
      line-height: 1.25;
      text-align: center;
    }

    .salary-distribution-status.is-visible {
      display: flex;
    }


    /* ---------- Salary table ---------- */

    .salary-section {
      width: 100%;
      margin-top: 6px;
    }


    .salary-table-wrap {
      position: relative;
      width: 100%;
    }

    .salary-table-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 24%;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .salary-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .salary-table th,
    .salary-table td {
      position: relative;
      padding: 8px 6px;
      line-height: 1.2;
      text-align: center;
      vertical-align: middle;
    }

    .salary-table th {
      color: var(--muted);
      font-size: clamp(10px, 3.1vw, 14px);
      font-weight: 700;
      white-space: nowrap;
    }

    .salary-table td {
      color: var(--ink);
      font-size: clamp(12px, 3.6vw, 15px);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .salary-table th + th,
    .salary-table td + td {
      border-left: 1px solid var(--track);
    }

    .salary-table th:nth-child(2),
    .salary-table td:nth-child(2) {
      border-left: 0;
    }

    .salary-table .table-major-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--ink);
    }

    .salary-table .table-empty-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--track);
    }

    .salary-table sup {
      position: relative;
      top: -0.08em;
      font-size: 0.7em;
      line-height: 0;
      vertical-align: super;
    }

    .salary-table th:first-child,
    .salary-table td:first-child {
      width: 24%;
    }

    .salary-table td:first-child {
      font-weight: 700;
      white-space: nowrap;
    }


    .cell-value {
      display: block;
      white-space: nowrap;
    }


    .salary-footnote {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: left;
    }

    .error {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 1px 12px;
      }

      .salary-table th,
      .salary-table td {
        padding: 7px 2px;
      }

      .salary-table th {
        font-size: clamp(8px, 2.8vw, 11px);
      }

      .salary-table td {
        font-size: clamp(10px, 3.1vw, 12px);
      }

      .salary-table th:first-child,
      .salary-table td:first-child {
        width: 24%;
      }

      .salary-table td:first-child {
        font-size: clamp(9px, 3vw, 12px);
      }

      .salary-footnote {
        font-size: 10px;
      }

      .app-loading {
        min-height: 175px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }

    @media (max-width: 350px) {
      .salary-table th {
        font-size: 8px;
      }

      .salary-table td {
        font-size: 10px;
      }

      .salary-table td:first-child {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading">
      <div id="loading-state" class="app-loading" role="status" aria-label="Loading">
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading...</div>
      </div>

      <section class="response-summary" aria-live="polite">
        <div class="response-label">No. of responses</div>

        <div class="response-value-row">
          <div id="response-count" class="response-value"></div>
          <div id="dataSourceIndicator" class="live-data" aria-label="Live data">
            <span class="live-data-dot" aria-hidden="true"></span>
            <span id="dataSourceText">LIVE data</span>
          </div>
        </div>
      </section>

      <section class="salary-section" aria-label="Permanent salary summary">
        <div class="salary-distribution" aria-label="FTE salary distribution with individual salaries and smoothed density curve">
          <div class="salary-distribution-topline">
            <span class="salary-distribution-title">FTE salary distribution</span>

            <span class="salary-distribution-legend" aria-hidden="true">
              <span class="salary-distribution-legend-item">
                <span class="salary-distribution-dot"></span>
                <span>Salaries</span>
              </span>

              <span class="salary-distribution-legend-item">
                <span class="salary-distribution-line"></span>
                <span>Density</span>
              </span>
            </span>
          </div>

          <div class="salary-distribution-canvas-wrap">
            <canvas id="salary-distribution-canvas" aria-label="Distribution of FTE salaries"></canvas>
            <div id="salary-distribution-status" class="salary-distribution-status"></div>
          </div>

        </div>


        <div class="salary-table-wrap">
          <table id="salary-table" class="salary-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <div id="salary-footnote" class="salary-footnote">
          Salary (FTE) excl. super, incl. location and weekend/night loadings<br>
          * adjusted to 'unloaded' FTE (removes weekend and 6pm+ loadings)
        </div>
      </section>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID =
      '1D4EoCMnH_RbwbuzFtw92NOwnvR_r9zQV7dAaXtfnnd0';

    const SHEET_GID = '0';
    const SHEET_NAME = 'Data';

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'permanent-salary-summary';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Testing switch only.
     * Leave false in normal use.
     * Set true temporarily to verify the existing cached-summary fallback.
     * The current cached summary does not contain the raw roster fields needed
     * for the new late-night adjustment calculation or the salary distribution chart.
     */
    const FORCE_CACHED_DATA =
      false;

    /*
     * Live calculations use the raw/derived fields in Data:
     * A  = submission timestamp
     * M  = mode full-time weekly hours (M2; normally 38)
     * AM = hours worked per week
     * AN = rostered Saturdays / 4 weeks
     * AO = rostered Sundays / 4 weeks
     * AP = rostered late nights / 4 weeks
     * AY = FTE salary
     * BE = FTE bonuses
     *
     * AZ/BF are deliberately not used: the frontend now recalculates the
     * adjusted values itself so late-night loading can also be removed.
     */
    const RAW_DATA_RANGE = 'A:BE';

    const RAW_COLUMNS = Object.freeze({
      date: 0,
      modeFteHours: 12,
      hoursPerWeek: 38,
      saturdays: 39,
      sundays: 40,
      lateNights: 41,
      salary: 50,
      bonuses: 56
    });

    const EXPECTED_SALARY_COLS = 6;
    const EXPECTED_SALARY_DATA_ROWS = 12;

    const DAY_MS = 86400000;

    /*
     * These reproduce the existing spreadsheet weekend adjustment assumptions
     * and extend them to late nights.
     */
    const LOADING_REFERENCE_WEEKLY_HOURS = 40;
    const SATURDAY_SHIFT_HOURS = 8;
    const SUNDAY_SHIFT_HOURS = 6;
    const LATE_NIGHT_SHIFT_HOURS = 8;
    const SATURDAY_LOADING = 0.50;
    const SUNDAY_LOADING = 0.50;
    const LATE_NIGHT_LOADING = 0.15;

    const PERCENTILES = [
      {
        label: '5th',
        probability: 0.05
      },
      {
        label: '20th',
        probability: 0.20
      },
      {
        label: 'Median',
        probability: 0.50
      },
      {
        label: '80th',
        probability: 0.80
      },
      {
        label: '95th',
        probability: 0.95
      }
    ];

    const app =
      document.getElementById('app');

    const responseCount =
      document.getElementById('response-count');

    const salaryTable =
      document.getElementById('salary-table');

    const loadingState =
      document.getElementById('loading-state');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');


    const salaryDistributionCanvas =
      document.getElementById('salary-distribution-canvas');

    const salaryDistributionStatus =
      document.getElementById('salary-distribution-status');


    const salaryFootnote =
      document.getElementById('salary-footnote');

    let rawRows = [];
    let fteWeeklyHours = 38;
    let usingLiveRawData = false;

    function hideLoadingState() {
      app.classList.remove('is-loading');
      loadingState.setAttribute('aria-hidden', 'true');

      if (usingLiveRawData && rawRows.length) {
        requestAnimationFrame(() => {
          renderSalaryDistribution(rawRows);
        });
      }
    }

    function setDataSource(source) {
      const isCached =
        source === 'cached';

      dataSourceIndicator?.classList.toggle(
        'is-cached',
        isCached
      );

      if (source === 'live') {
        dataSourceIndicator?.setAttribute(
          'aria-label',
          'Live data'
        );

        if (dataSourceText) {
          dataSourceText.textContent =
            'LIVE data';
        }

        return;
      }

      if (isCached) {
        dataSourceIndicator?.setAttribute(
          'aria-label',
          'Cached data'
        );

        if (dataSourceText) {
          dataSourceText.textContent =
            'CACHED data';
        }

        return;
      }

      dataSourceIndicator?.setAttribute(
        'aria-label',
        'Data unavailable'
      );

      if (dataSourceText) {
        dataSourceText.textContent =
          'DATA unavailable';
      }
    }

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function toNumber(value) {
      const cleaned = cleanText(value)
        .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number = Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function getCellValue(cell) {
      return cell?.v ?? cell?.f ?? '';
    }

    function parseDate(value) {
      if (
        value instanceof Date &&
        !Number.isNaN(value.getTime())
      ) {
        return Date.UTC(
          value.getFullYear(),
          value.getMonth(),
          value.getDate()
        );
      }

      if (
        typeof value === 'number' &&
        value > 20000 &&
        value < 80000
      ) {
        return (
          Date.UTC(1899, 11, 30) +
          value * DAY_MS
        );
      }

      const text =
        cleanText(value);

      if (!text) {
        return null;
      }

      const googleDate = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/
      );

      if (googleDate) {
        return Date.UTC(
          Number(googleDate[1]),
          Number(googleDate[2]),
          Number(googleDate[3])
        );
      }

      const auDate = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})/
      );

      if (auDate) {
        let year =
          Number(auDate[3]);

        if (year < 100) {
          year += 2000;
        }

        return Date.UTC(
          year,
          Number(auDate[2]) - 1,
          Number(auDate[1])
        );
      }

      const isoDate = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
      );

      if (isoDate) {
        return Date.UTC(
          Number(isoDate[1]),
          Number(isoDate[2]) - 1,
          Number(isoDate[3])
        );
      }

      const parsed =
        new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          );
    }

    function percentile(sortedValues, probability) {
      if (!sortedValues.length) {
        return NaN;
      }

      const index =
        (sortedValues.length - 1) *
        probability;

      const lowerIndex =
        Math.floor(index);

      const upperIndex =
        Math.ceil(index);

      if (lowerIndex === upperIndex) {
        return sortedValues[lowerIndex];
      }

      return (
        sortedValues[lowerIndex] +
        (
          sortedValues[upperIndex] -
          sortedValues[lowerIndex]
        ) *
        (index - lowerIndex)
      );
    }

    function calculatePercentiles(values) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      return PERCENTILES.map(
        item =>
          percentile(
            sorted,
            item.probability
          )
      );
    }

    function formatSalaryCurrency(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      if (number === 0) {
        return '$0';
      }

      if (Math.abs(number) >= 1000) {
        return `$${new Intl.NumberFormat('en-AU', {
          maximumFractionDigits: 0
        }).format(Math.round(number / 1000))}k`;
      }

      return `$${new Intl.NumberFormat('en-AU', {
        maximumFractionDigits: 0
      }).format(Math.round(number))}`;
    }

    function formatBonusCurrency(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      if (number === 0) {
        return '$0';
      }

      if (Math.abs(number) >= 1000) {
        const scaled =
          number / 1000;

        return `$${new Intl.NumberFormat('en-AU', {
          maximumFractionDigits:
            Math.abs(scaled - Math.round(scaled)) < 0.05
              ? 0
              : 1
        }).format(scaled)}k`;
      }

      return `$${new Intl.NumberFormat('en-AU', {
        maximumFractionDigits: 0
      }).format(Math.round(number))}`;
    }

    function formatHourly(value) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? `$${new Intl.NumberFormat('en-AU', {
            maximumFractionDigits: 0
          }).format(number)}`
        : '—';
    }

    function formatPlainNumber(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      return new Intl.NumberFormat(
        'en-AU',
        {
          maximumFractionDigits:
            Math.abs(number - Math.round(number)) < 0.05
              ? 0
              : 1
        }
      ).format(number);
    }

    function formatMetricValue(metricKey, value) {
      if (
        metricKey === 'salary' ||
        metricKey === 'unloadedSalary'

        return formatSalaryCurrency(value);

      if (
        metricKey === 'bonuses' ||
        metricKey === 'unloadedBonuses'

      }

      if (
        metricKey === 'hourly' ||
        metricKey === 'unloadedHourly'
      ) {
        return formatHourly(value);
      }

      return formatPlainNumber(value);
    }

    function setDistributionStatus(message = '') {

      );

    function calculateKernelDensity(
      values,
      minimumX,
      maximumX,
      sampleCount = 120
    ) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      if (sorted.length < 2) {
        return [];
      }

      const count =
        sorted.length;

      const mean =
        sorted.reduce(
          (total, value) =>
            total + value,
          0
        ) /
        count;

      const variance =
        sorted.reduce(
          (total, value) =>
            total +
            Math.pow(
              value - mean,
              2
            ),
          0
        ) /
        Math.max(
          1,
          count - 1
        );

      const standardDeviation =
        Math.sqrt(
          Math.max(
            0,
            variance
          )
        );

      const q1 =
        percentile(
          sorted,
          0.25
        );

      const q3 =
        percentile(
          sorted,
          0.75
        );

      const robustSigma =
        Number.isFinite(q1) &&
        Number.isFinite(q3) &&
        q3 > q1
          ? (q3 - q1) / 1.34
          : NaN;

      const scaleCandidates = [
        standardDeviation,
        robustSigma
      ].filter(
        value =>
          Number.isFinite(value) &&
          value > 0
      );

      const fallbackScale =
        Math.max(
          1,
          (maximumX - minimumX) /
          6
        );

      const scale =
        scaleCandidates.length
          ? Math.min(
              ...scaleCandidates
            )
          : fallbackScale;

      const silvermanBandwidth =
        0.9 *
        scale *
        Math.pow(
          count,
          -0.2
        );

      const range =
        Math.max(
          1,
          maximumX - minimumX
        );

      const bandwidth =
        Math.max(
          3000,
          Math.min(
            range * 0.22,
            Number.isFinite(
              silvermanBandwidth
            ) &&
            silvermanBandwidth > 0
              ? silvermanBandwidth
              : range / 10
          )
        );

      const normalisingConstant =
        1 /
        (
          bandwidth *
          Math.sqrt(
            2 * Math.PI
          )
        );

      const result = [];

      for (
        let index = 0;
        index < sampleCount;
        index += 1
      ) {
        const proportion =
          sampleCount === 1
            ? 0
            : index /
              (sampleCount - 1);

        const x =
          minimumX +
          proportion *
          range;

        let density = 0;

        sorted.forEach(value => {
          const z =
            (x - value) /
            bandwidth;

          density +=
            Math.exp(
              -0.5 *
              z *
              z
            );
        });

        density =
          density *
          normalisingConstant /
          count;

        if (
          Number.isFinite(density)
        ) {
          result.push({
            x,
            y: density
          });
        }
      }

      return result;
    }

    function formatDistributionSalary(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      return `$${new Intl.NumberFormat('en-AU', {
        maximumFractionDigits: 0
      }).format(
        Math.round(
          number / 1000
        )
      )}k`;
    }

    function renderSalaryDistribution(rows) {
      if (!salaryDistributionCanvas) {
        return;
      }

      const salaries =
        rows
          .map(
            row => row.salary
          )
          .filter(
            validSalary
          )
          .sort(
            (first, second) =>
              first - second
          );

      if (salaries.length < 2) {
        setDistributionStatus(
          'Salary distribution unavailable'
        );

        return;
      }

      setDistributionStatus();


      const rawMedian =
        percentile(
          salaries,
          0.5
        );

      const minimumX = 60000;
      const maximumX = 180000;


      const density =
        calculateKernelDensity(
          salaries,
          minimumX,
          maximumX
        );

      if (density.length < 2) {
        setDistributionStatus(
          'Salary distribution unavailable'
        );
        return;
      }

      const maximumDensity =
        Math.max(
          ...density.map(
            point => point.y
          )
        );

      if (
        !Number.isFinite(
          maximumDensity
        ) ||
        maximumDensity <= 0
      ) {
        setDistributionStatus(
          'Salary distribution unavailable'
        );
        return;
      }

      const cssWidth =
        Math.max(
          1,
          salaryDistributionCanvas.clientWidth
        );

      const cssHeight =
        Math.max(
          1,
          salaryDistributionCanvas.clientHeight
        );

      const pixelRatio =
        Math.min(
          window.devicePixelRatio || 1,
          3
        );

      salaryDistributionCanvas.width =
        Math.round(
          cssWidth *
          pixelRatio
        );

      salaryDistributionCanvas.height =
        Math.round(
          cssHeight *
          pixelRatio
        );

      const context =
        salaryDistributionCanvas.getContext(
          '2d'
        );

      context.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
      );

      context.clearRect(
        0,
        0,
        cssWidth,
        cssHeight
      );

      const padding = {
        top: 4,
        right: 4,
        bottom: 27,
        left: 4
      };

      const plotWidth =
        Math.max(
          1,
          cssWidth -
          padding.left -
          padding.right
        );

      const plotHeight =
        Math.max(
          1,
          cssHeight -
          padding.top -
          padding.bottom
        );

      const baselineY =
        padding.top +
        plotHeight;

      const xToPixel = value => {
        const clampedValue =
          Math.min(
            maximumX,
            Math.max(
              minimumX,
              value
            )
          );

        return padding.left +
          (
            (clampedValue - minimumX) /
            Math.max(
              1,
              maximumX - minimumX
            )
          ) *
          plotWidth;
      };

      const densityToPixel = value =>
        baselineY -
        (
          value /
          maximumDensity
        ) *
        (
          plotHeight - 5
        );

      context.save();
      context.beginPath();

      density.forEach(
        (point, index) => {
          const x =
            xToPixel(
              point.x
            );

          const y =
            densityToPixel(
              point.y
            );

          if (index === 0) {
            context.moveTo(
              x,
              baselineY
            );
            context.lineTo(
              x,
              y
            );
          } else {
            context.lineTo(
              x,
              y
            );
          }
        }
      );

      context.lineTo(
        xToPixel(
          density[
            density.length - 1
          ].x
        ),
        baselineY
      );
      context.closePath();
      context.fillStyle =
        'rgba(241, 194, 50, 0.10)';
      context.fill();
      context.restore();

      context.save();
      context.beginPath();
      context.strokeStyle =
        '#f1c232';
      context.lineWidth = 2;
      context.lineCap = 'round';
      context.lineJoin = 'round';

      density.forEach(
        (point, index) => {
          const x =
            xToPixel(
              point.x
            );

          const y =
            densityToPixel(
              point.y
            );

          if (index === 0) {
            context.moveTo(x, y);
          } else {
            context.lineTo(x, y);
          }
        }
      );

      context.stroke();
      context.restore();

      const medianDensityPoint = (() => {
        for (
          let index = 1;
          index < density.length;
          index += 1
        ) {
          const previous = density[index - 1];
          const current = density[index];

          if (
            rawMedian >= previous.x &&
            rawMedian <= current.x
          ) {
            const span =
              current.x - previous.x;

            const proportion =
              span === 0
                ? 0
                : (rawMedian - previous.x) /
                  span;

            return {
              x: rawMedian,
              y:
                previous.y +
                (current.y - previous.y) *
                proportion
            };
          }
        }

        return density.reduce(
          (nearest, point) =>
            Math.abs(point.x - rawMedian) <
            Math.abs(nearest.x - rawMedian)
              ? point
              : nearest,
          density[0]
        );
      })();

      const medianX =
        xToPixel(rawMedian);

      const medianCurveY =
        densityToPixel(
          medianDensityPoint.y
        );

      context.save();
      context.beginPath();
      context.setLineDash([3, 3]);
      context.strokeStyle =
        '#f1c232';
      context.lineWidth = 1.1;
      context.moveTo(
        medianX,
        medianCurveY
      );
      context.lineTo(
        medianX,
        baselineY
      );
      context.stroke();
      context.restore();

      context.save();
      context.fillStyle =
        '#c59b13';
      context.font =
        `700 ${window.matchMedia('(max-width: 430px)').matches ? 7.4 : 8.2}px Lato, sans-serif`;
      context.textAlign = 'center';
      context.textBaseline = 'top';
      context.fillText(
        'Median',
        medianX,
        baselineY + 3
      );
      context.restore();

      const majorTicks = [];
      const minorTicks = [];

      for (
        let value = minimumX;
        value <= maximumX;
        value += 10000
      ) {
        if (value % 20000 === 0) {
          majorTicks.push(value);
        } else {
          minorTicks.push(value);
        }
      }

      context.save();
      context.strokeStyle =
        'rgba(105, 113, 138, 0.18)';
      context.lineWidth = 0.8;
      context.beginPath();
      context.moveTo(
        padding.left,
        baselineY + 0.5
      );
      context.lineTo(
        cssWidth - padding.right,
        baselineY + 0.5
      );
      context.stroke();
      context.restore();

      context.save();
      context.strokeStyle =
        'rgba(105, 113, 138, 0.22)';
      context.lineWidth = 0.7;

      minorTicks.forEach(value => {
        const x = xToPixel(value);
        context.beginPath();
        context.moveTo(
          x,
          baselineY
        );
        context.lineTo(
          x,
          baselineY + 3
        );
        context.stroke();
      });

      context.restore();

      context.save();
      context.strokeStyle =
        'rgba(21, 21, 21, 0.50)';
      context.fillStyle =
        'rgba(21, 21, 21, 0.78)';
      context.lineWidth = 0.9;
      context.font =
        `${window.matchMedia('(max-width: 430px)').matches ? 7.4 : 8.2}px Lato, sans-serif`;
      context.textAlign = 'center';
      context.textBaseline = 'top';

      majorTicks.forEach(value => {
        const x = xToPixel(value);

        context.beginPath();
        context.moveTo(
          x,
          baselineY
        );
        context.lineTo(
          x,
          baselineY + 5
        );
        context.stroke();

        context.fillText(
          formatDistributionSalary(value),
          x,
          baselineY + 16
        );
      });

      context.restore();

      context.save();
      context.fillStyle =
        'rgba(102, 0, 255, 0.28)';

      salaries.forEach(
        (salary, index) => {
          const yOffset =
            2 +
            (index % 3) *
            2.1;

          context.beginPath();
          context.arc(
            xToPixel(salary),
            baselineY - yOffset,
            1.35,
            0,
            Math.PI * 2
          );
          context.fill();
        }
      );
      context.restore();
    }

    function normaliseRawRows(response) {
      const sourceRows =
        response?.table?.rows || [];

      const result = [];
      const fteHourCandidates = [];

      sourceRows.forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const date =
            parseDate(
              getCellValue(
                cells[
                  RAW_COLUMNS.date
                ]
              )
            );

          const modeHours =
            toNumber(
              getCellValue(
                cells[
                  RAW_COLUMNS.modeFteHours
                ]
              )
            );

          if (
            Number.isFinite(modeHours) &&
            modeHours > 0
          ) {
            fteHourCandidates.push(
              modeHours
            );
          }

          if (!Number.isFinite(date)) {
            return;
          }

          const row = {
            date,
            salary:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.salary
                  ]
                )
              ),
            bonuses:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.bonuses
                  ]
                )
              ),
            hoursPerWeek:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.hoursPerWeek
                  ]
                )
              ),
            saturdays:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.saturdays
                  ]
                )
              ),
            sundays:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.sundays
                  ]
                )
              ),
            lateNights:
              toNumber(
                getCellValue(
                  cells[
                    RAW_COLUMNS.lateNights
                  ]
                )
              )
          };

          const unloadFactor =
            calculateUnloadFactor(
              row
            );

          row.unloadedSalary =
            validSalary(row.salary)
              ? row.salary * unloadFactor
              : NaN;

          row.unloadedBonuses =
            validBonus(row.bonuses)
              ? row.bonuses * unloadFactor
              : NaN;

          result.push(row);
        }
      );

      if (fteHourCandidates.length) {
        fteWeeklyHours =
          fteHourCandidates[0];
      }

      return result;
    }

    function validSalary(value) {
      return (
        Number.isFinite(value) &&
        value >= 30000 &&
        value <= 500000
      );
    }

    function validBonus(value) {
      return (
        Number.isFinite(value) &&
        value >= 0
      );
    }

    function validHours(value) {
      return (
        Number.isFinite(value) &&
        value > 0 &&
        value <= 100
      );
    }

    function validShiftCount(value) {
      return (
        Number.isFinite(value) &&
        value >= 0 &&
        value <= 31
      );
    }

    function calculateUnloadFactor(row) {
      const saturdays =
        validShiftCount(row?.saturdays)
          ? row.saturdays
          : 0;

      const sundays =
        validShiftCount(row?.sundays)
          ? row.sundays
          : 0;

      const lateNights =
        validShiftCount(row?.lateNights)
          ? row.lateNights
          : 0;

      const loadingHoursPerFourWeeks =
        saturdays *
          SATURDAY_SHIFT_HOURS *
          SATURDAY_LOADING +
        sundays *
          SUNDAY_SHIFT_HOURS *
          SUNDAY_LOADING +
        lateNights *
          LATE_NIGHT_SHIFT_HOURS *
          LATE_NIGHT_LOADING;

      const referenceHoursPerFourWeeks =
        LOADING_REFERENCE_WEEKLY_HOURS *
        4;

      return Math.max(
        0,
        1 -
        loadingHoursPerFourWeeks /
        referenceHoursPerFourWeeks
      );
    }

    function valuesForMetric(rows, key) {
      if (key === 'salary') {
        return rows
          .map(row => row.salary)
          .filter(validSalary);
      }

      if (key === 'hourly') {
        return rows
          .map(
            row =>
              validSalary(row.salary)
                ? row.salary /
                  52 /
                  fteWeeklyHours
                : NaN
          )
          .filter(Number.isFinite);
      }

      if (key === 'bonuses') {
        return rows
          .map(row => row.bonuses)
          .filter(validBonus);
      }

      if (key === 'unloadedSalary') {
        return rows
          .map(row => row.unloadedSalary)
          .filter(validSalary);
      }

      if (key === 'unloadedHourly') {
        return rows
          .map(
            row =>
              validSalary(row.unloadedSalary)
                ? row.unloadedSalary /
                  52 /
                  fteWeeklyHours
                : NaN
          )
          .filter(Number.isFinite);
      }

      if (key === 'unloadedBonuses') {
        return rows
          .map(row => row.unloadedBonuses)
          .filter(validBonus);
      }

      if (key === 'hoursPerWeek') {
        return rows
          .map(row => row.hoursPerWeek)
          .filter(validHours);
      }

      if (key === 'saturdays') {
        return rows
          .map(row => row.saturdays)
          .filter(validShiftCount);
      }

      if (key === 'sundays') {
        return rows
          .map(row => row.sundays)
          .filter(validShiftCount);
      }

      if (key === 'lateNights') {
        return rows
          .map(row => row.lateNights)
          .filter(validShiftCount);
      }

      return [];
    }

    function calculateSummary(rows) {
      const metricKeys = [
        'salary',
        'hourly',
        'bonuses',
        'unloadedSalary',
        'unloadedHourly',
        'unloadedBonuses',
        'hoursPerWeek',
        'saturdays',
        'sundays',
        'lateNights'
      ];

      const metrics = {};

      metricKeys.forEach(
        key => {
          metrics[key] =
            calculatePercentiles(
              valuesForMetric(
                rows,
                key
              )
            );
        }
      );

      return {
        metrics
      };
    }

    function renderLiveSummary() {
      const summary =
        calculateSummary(
          rawRows
        );

      responseCount.textContent =
        String(
          rawRows.length
        );

      responseCount.classList.remove(
        'error'
      );

      renderCalculatedSalaryTable(
        summary
      );

    }

    function showError(error) {
      console.error(error);

      responseCount.textContent = '—';
      responseCount.classList.add('error');

      salaryTable.querySelector('thead').textContent = '';
      salaryTable.querySelector('tbody').textContent = '';

      setDistributionStatus(
        'Salary distribution unavailable'
      );

      hideLoadingState();
    }

    function getCellDisplayValue(cell) {
      if (!cell) return '';
      return String(
        cell.f ?? cell.v ?? ''
      ).trim();
    }

    function loadGvizRange(
      range,
      headers = 0,
      sheetName = ''
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `permSalarySummaryCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

          const script =
            document.createElement('script');

          const timeout =
            window.setTimeout(
              () => {
                cleanup();
                reject(
                  new Error(
                    'Could not load data'
                  )
                );
              },
              15000
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (error) {
              window[
                callbackName
              ] = undefined;
            }

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          window[callbackName] =
            response => {
              cleanup();

              if (
                response?.status ===
                'error'
              ) {
                reject(
                  new Error(
                    response?.errors?.[0]?.detailed_message ||
                    'Could not load Google Sheet data'
                  )
                );

                return;
              }

              resolve(response);
            };

          script.onerror =
            () => {
              cleanup();
              reject(
                new Error(
                  'Could not load data'
                )
              );
            };

          const params =
            new URLSearchParams({
              gid: SHEET_GID,
              range,
              headers:
                String(headers),
              tqx:
                `responseHandler:${callbackName}`
            });

          if (sheetName) {
            params.set(
              'sheet',
              sheetName
            );
          }

          script.src =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function validateCachedDashboardData(data) {
      const cachedResponseCount =
        String(
          data?.responseCount ??
          ''
        ).trim();

      const salaryTableValues =
        Array.isArray(
          data?.salaryTableValues
        )
          ? data.salaryTableValues
          : [];

      if (
        !cachedResponseCount ||
        cachedResponseCount === '—' ||
        salaryTableValues.length !==
          EXPECTED_SALARY_DATA_ROWS + 1 ||
        salaryTableValues.some(
          row =>
            !Array.isArray(row) ||
            row.length <
              EXPECTED_SALARY_COLS
        )
      ) {
        throw new Error(
          'The cached permanent salary summary is incomplete'
        );
      }

      return {
        responseCount:
          cachedResponseCount,
        salaryTableValues:
          salaryTableValues.map(
            row =>
              row
                .slice(
                  0,
                  EXPECTED_SALARY_COLS
                )
                .map(
                  value =>
                    String(
                      value ?? ''
                    ).trim()
                )
          )
      };
    }

    function loadCachedDashboardData() {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `permSalarySummaryCache_${Date.now()}_${Math.floor(Math.random() * 1000000)}`;

          const script =
            document.createElement('script');

          let settled = false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'The cached-data request timed out'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          function finish(
            error,
            data
          ) {
            if (settled) {
              return;
            }

            settled = true;
            cleanup();

            if (error) {
              reject(error);
              return;
            }

            resolve(data);
          }

          window[callbackName] =
            response => {
              if (
                !response ||
                response.ok !== true
              ) {
                finish(
                  new Error(
                    response?.error ||
                    'The cached-data service did not return a snapshot'
                  )
                );

                return;
              }

              if (
                response.appKey !==
                CACHE_APP_KEY
              ) {
                finish(
                  new Error(
                    'The cached-data response belongs to a different app'
                  )
                );

                return;
              }

              if (
                !response.cachedAt ||
                Number.isNaN(
                  Date.parse(
                    response.cachedAt
                  )
                )
              ) {
                finish(
                  new Error(
                    'The cached-data response has no valid timestamp'
                  )
                );

                return;
              }

              try {
                finish(
                  null,
                  validateCachedDashboardData(
                    response.data
                  )
                );
              } catch (error) {
                finish(error);
              }
            };

          script.onerror =
            () => {
              finish(
                new Error(
                  'Could not load the cached-data service'
                )
              );
            };

          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,
              callback:
                callbackName,
              _:
                String(
                  Date.now()
                )
            });

          const separator =
            CACHE_WEB_APP_URL.includes('?')
              ? '&'
              : '?';

          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;

          document.body.appendChild(
            script
          );
        }
      );
    }

    function renderCachedDashboardData(data) {
      usingLiveRawData = false;

      responseCount.textContent =
        data.responseCount;

      responseCount.classList.remove(
        'error'
      );

      renderCachedSalaryTable(
        data.salaryTableValues
      );

      setDistributionStatus(
        'Distribution unavailable in cached snapshot'
      );


      if (salaryFootnote) {
        salaryFootnote.innerHTML =
          'Salary (FTE) excl. super, incl. location and weekend/night loadings<br>' +
          "* adjusted to 'unloaded' FTE; cached fallback uses the previous weekend-only adjustment";
      }

      hideLoadingState();
    }

    async function loadLiveDashboardData() {
      const response =
        await loadGvizRange(
          RAW_DATA_RANGE,
          1,
          SHEET_NAME
        );

      const rows =
        normaliseRawRows(
          response
        );

      if (!rows.length) {
        throw new Error(
          'Live permanent salary raw data are incomplete'
        );
      }

      rawRows = rows;
      usingLiveRawData = true;

      if (salaryFootnote) {
        salaryFootnote.innerHTML =
          'Salary (FTE) excl. super, incl. location and weekend/night loadings<br>' +
          "* adjusted to 'unloaded' FTE (removes weekend and 6pm+ loadings)";
      }

      renderLiveSummary();
    }

    async function loadDashboardData() {
      let liveError = null;

      if (!FORCE_CACHED_DATA) {
        try {
          await loadLiveDashboardData();

          setDataSource('live');
          hideLoadingState();
          return;
        } catch (error) {
          liveError = error;

          console.warn(
            'Live Google Sheets data could not be used',
            error
          );
        }
      } else {
        liveError =
          new Error(
            'Live data bypassed for cached-data test'
          );
      }

      try {
        const cachedData =
          await loadCachedDashboardData();

        setDataSource('cached');

        console.warn(
          'Using cached permanent salary summary data',
          liveError?.message
        );

        renderCachedDashboardData(
          cachedData
        );
      } catch (cachedError) {
        setDataSource('none');

        console.error(
          'Live Google Sheets data error',
          liveError
        );

        console.error(
          'Cached Apps Script data error',
          cachedError
        );

        showError(
          new Error(
            'Live and cached data are currently unavailable'
          )
        );
      }
    }

    let salaryDistributionResizeFrame = null;

    window.addEventListener(
      'resize',
      () => {
        if (
          !usingLiveRawData ||
          !rawRows.length
        ) {
          return;
        }

        if (salaryDistributionResizeFrame !== null) {
          cancelAnimationFrame(
            salaryDistributionResizeFrame
          );
        }

        salaryDistributionResizeFrame =
          requestAnimationFrame(() => {
            salaryDistributionResizeFrame = null;
            renderSalaryDistribution(rawRows);
          });
      },
      {
        passive: true
      }
    );

    loadDashboardData();
  </script>
</body>
