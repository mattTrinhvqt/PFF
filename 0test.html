<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Excess Clinicians</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_loader.js"></script>
  <script src="./assets/pff_chart_core.js"></script>
  <!-- Excess Clinicians pilot: opt-in approved presentation helpers. -->
  <script src="./assets/chart-styling-and-defaults.js"></script>
  <script src="./assets/chart-axes-and-ticks.js"></script>
  <script src="./assets/chart-animations-and-transitions.js"></script>
  <script src="./assets/chart-tooltips-and-hover.js"></script>
  <script src="./assets/chart-trends-and-labels.js"></script>
  <script src="./assets/chart-responsive-layouts-and-touch.js"></script>


  <style>

    .single-tab-shell .tab-list {
      min-width: 0;
    }

    .single-tab-shell .chart-tab {
      cursor: default;
    }

    .single-tab-shell .tab-list::after {
      display: none;
    }

    .single-tab-shell .chart-tab.is-active,
    .single-tab-shell .chart-tab[aria-selected='true'] {
      border-bottom-color: var(--pff-purple);
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .chart-heading-row .heading-controls {
      margin-left: auto;
      padding-left: 8px;
      flex: 0 0 auto;
    }

    /* The custom tooltip uses true columns, never approximated spaces. */
    .pff-excess-tooltip {
      position: absolute;
      z-index: 20;
      box-sizing: border-box;
      width: max-content;
      max-width: calc(100% - 12px);
      padding: 9px 10px;
      border: 1px solid #e8eaf0;
      border-radius: 4px;
      background: #fff;
      color: #151515;
      font-family: Lato, Arial, sans-serif;
      font-size: 11px;
      line-height: 1.3;
      box-shadow: 0 3px 12px rgba(21,21,21,0.10);
      pointer-events: none;
      white-space: nowrap;
    }
    .pff-excess-tooltip[hidden] { display: none !important; }
    .pff-excess-tooltip-year {
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 700;
    }
    .pff-excess-tooltip-grid {
      display: grid;
      grid-template-columns: max-content max-content max-content;
      column-gap: 12px;
      row-gap: 2px;
      align-items: baseline;
    }
    .pff-excess-tooltip-grid.is-off {
      grid-template-columns: max-content max-content;
    }
    .pff-excess-tooltip-name { color: #69718a; }
    .pff-excess-tooltip-value {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .pff-excess-tooltip-trend {
      text-align: left;
      color: #69718a;
      font-variant-numeric: tabular-nums;
    }

    .method-note {
      margin: 5px 3px 0;
      color: var(--pff-muted);
      font-size: 11.5px;
      line-height: 1.34;
      text-align: left;
    }

    .method-note-line {
      display: block;
    }

    .method-note-line + .method-note-line {
      margin-top: 2px;
    }

    @media (max-width: 430px) {
      .pff-excess-tooltip {
        padding: 7px 8px;
        font-size: 10px;
      }
      .pff-excess-tooltip-year { font-size: 11px; }
      .pff-excess-tooltip-grid { column-gap: 8px; }
      .method-note {
        font-size: 10.5px;
      }
    }
  </style>
</head>

  <script>
    'use strict';

    // These shared visual modules are opt-in. Keep all original Sheets,
    // Apps Script, cache, computation and state-series logic below intact.
    const sharedChart = Object.freeze({
      styling: window.PFFModules?.chartStyling,
      axes: window.PFFModules?.chartAxes,
      animations: window.PFFModules?.chartAnimations,
      tooltips: window.PFFModules?.chartTooltips,
      trends: window.PFFModules?.chartTrends,
      responsive: window.PFFModules?.chartResponsive
    });
    const missingSharedChartAssets = Object.entries(sharedChart)
      .filter(([, asset]) => !asset)
      .map(([name]) => name);
    if (missingSharedChartAssets.length) {
      throw new Error('Excess Clinicians pilot requires shared assets: ' +
        missingSharedChartAssets.join(', '));
    }
    sharedChart.styling.applyGlobalFontDefaults(window.Chart);

    // ============================================================
    // DATA SOURCE
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const MEDICARE_SHEET =
      'Medicareitems';

    const MEDICARE_DATA_RANGE =
      'C30:KE';

    const MEDICARE_ITEM_RANGE =
      'D29:KE29';

    const MEDICARE_HOURS_RANGE =
      'D28:KE28';

    const ACTIVE_CLINICIAN_SHEET =
      'Optomsbystate';

    // L = year; M:U = state/other active clinicians; V = Australia total.
    const ACTIVE_CLINICIAN_RANGE =
      'L30:V';

    const ACTIVE_CLINICIAN_TOTAL_INDEX = 10;

    const CLINICAL_HOURS_SHEET =
      'Optomhoursbystate';

    // A = year; B:I = state mean weekly clinical hours; J = Australia total.
    const CLINICAL_HOURS_RANGE =
      'A30:J';

    const CLINICAL_HOURS_TOTAL_INDEX = 9;
    const EXPECTED_ITEM_COUNT = 32;
    const FIXED_TREND_WINDOW = 10; // Original default, preserved at initial load.

    const WORKING_WEEKS_PER_YEAR = 46;
    const ADMIN_HOURS_PER_WEEK = 2.5;
    const ADMIN_WEEKS_PER_YEAR = 52;

    const FETCH_TIMEOUT_MS = 15000;
    const CACHE_FETCH_TIMEOUT_MS = 10000;

    const LOCAL_CACHE_KEY =
      'pff-excess-clinicians-state-trends-v2';

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    // Backend 1 stores Medicare rows plus state-level active clinician and
    // state-level clinical-hours tables used by this graph and the adjacent
    // Supply – Demand graph.
    const CACHE_APP_KEY =
      'pff-medicare-service-demand-v13';

    const AUSTRALIA_KEY = 'AUS';
    const AUSTRALIA_COLOUR = '#0b5d1e';

    const STATE_CODES = [
      'NSW',
      'VIC',
      'QLD',
      'SA',
      'WA',
      'TAS',
      'NT',
      'ACT'
    ];

    const STATE_COLOURS = Object.freeze({
      NSW: '#2db7f5',
      VIC: '#2d3a8c',
      QLD: '#7a0036',
      SA: '#f03a47',
      WA: '#000000',
      TAS: '#22a36b',
      NT: '#c25e00',
      ACT: '#7b61ff'
    });

    // Medicareitems repeats each item across NSW, VIC, QLD, SA, WA, TAS,
    // ACT, NT, Total. These offsets are relative to the year column.
    const MEDICARE_STATE_OFFSETS = Object.freeze({
      NSW: 1,
      VIC: 2,
      QLD: 3,
      SA: 4,
      WA: 5,
      TAS: 6,
      ACT: 7,
      NT: 8
    });

    // State-level table indices are relative to the selected ranges above.
    const ACTIVE_CLINICIAN_STATE_INDEX = Object.freeze({
      NSW: 1,
      VIC: 2,
      QLD: 3,
      SA: 4,
      WA: 5,
      TAS: 6,
      NT: 7,
      ACT: 8
    });

    const CLINICAL_HOURS_STATE_INDEX = Object.freeze({
      NSW: 1,
      VIC: 2,
      QLD: 3,
      SA: 4,
      WA: 5,
      TAS: 6,
      NT: 7,
      ACT: 8
    });

    const SERIES = Object.freeze([
      Object.freeze({
        key: AUSTRALIA_KEY,
        label: 'Total',
        colour: AUSTRALIA_COLOUR,
        width: 3.15
      }),
      ...STATE_CODES.map(code => Object.freeze({
        key: code,
        label: code,
        colour: STATE_COLOURS[code],
        width: 2.55
      }))
    ]);

    // ============================================================
    // DOM + STATE
    // ============================================================

    const app = document.getElementById('app');
    const loadingState = document.getElementById('loadingState');
    const loaderText = document.getElementById('loaderText');
    const statusElement = document.getElementById('status');
    const sourceIndicator = document.getElementById('sourceIndicator');
    const sourceText = document.getElementById('sourceText');
    const headingScrollViewport = document.getElementById('headingScrollViewport');
    const headingScrollLeft = document.getElementById('headingScrollLeft');
    const headingScrollRight = document.getElementById('headingScrollRight');
    const legend = document.getElementById('legend');
    const legendLeft = document.getElementById('legendLeft');
    const legendRight = document.getElementById('legendRight');
    const chartShell = document.getElementById('chartShell');
    const canvas = document.getElementById('excessChart');
    const yoyTrendToggle = document.getElementById('yoyTrendToggle');
    const trendMethodNote = document.getElementById('trendMethodNote');

    let sourceData = null;
    let rows = [];
    let chart = null;
    let yScale = null;
    let yAxisController = null;
    let headingScroller = null;
    let legendController = null;
    let responsiveController = null;
    let chartInteractions = null;
    let tooltipInteractionCleanup = null;
    let chartSummary = null;
    let trendController = null;
    let trendMode = '10yr';
    let pinnedYearIndex = null;
    let alignedTooltipElement = null;
    let lastTooltipKey = '';
    const trendValueCache = new Map();


    // ============================================================
    // DATA HELPERS
    // ============================================================

    function finiteNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function cellValue(cell) {
      if (!cell) return null;
      const raw = cell.v ?? cell.f ?? null;
      return raw === null || raw === '' ? null : raw;
    }

    function numericCell(cell) {
      const raw = cellValue(cell);
      if (raw === null || raw === undefined || raw === '') return null;
      const number = Number(
        typeof raw === 'string' ? raw.replace(/,/g, '') : raw
      );
      return Number.isFinite(number) ? number : null;
    }

    function itemNumberCell(cell) {
      const value = numericCell(cell);
      if (Number.isFinite(value)) return String(Math.round(value));
      const text = String(cell?.v ?? cell?.f ?? '').trim();
      return /^\d{5}$/.test(text) ? text : '';
    }

    // Keep a local adapter because Core v1.2.11 does not export this helper.
    function rowsToGVizTable(sourceRows) {
      return {
        rows: (Array.isArray(sourceRows) ? sourceRows : []).map(row => ({
          c: (Array.isArray(row) ? row : []).map(value => ({ v: value }))
        }))
      };
    }

    function parseMetadataRows(itemTable, hoursTable) {
      const itemCells = itemTable?.rows?.[0]?.c || [];
      const hourCells = hoursTable?.rows?.[0]?.c || [];
      const parsed = [];

      for (let start = 0; start + 8 < itemCells.length; start += 9) {
        const item = itemNumberCell(itemCells[start]);
        if (!/^\d{5}$/.test(item)) break;

        const repeated = Array.from(
          { length: 9 },
          (_, offset) => itemNumberCell(itemCells[start + offset])
        );

        if (!repeated.every(value => value === item)) break;

        const hours = numericCell(hourCells[start]);
        if (!Number.isFinite(hours) || hours <= 0) {
          throw new Error(`Medicare consultation time was missing for item ${item}.`);
        }

        parsed.push({ item, hours });
      }

      if (
        parsed.length !== EXPECTED_ITEM_COUNT ||
        new Set(parsed.map(item => item.item)).size !== EXPECTED_ITEM_COUNT
      ) {
        throw new Error('Medicare item metadata were incomplete.');
      }

      return parsed;
    }

    function parseMedicareDataTable(table, itemSchema) {
      const parsedRows = [];

      for (const sourceRow of table?.rows || []) {
        const cells = sourceRow?.c || [];
        const yearValue = numericCell(cells[0]);
        if (!Number.isFinite(yearValue)) continue;

        const year = Math.round(yearValue);
        if (year < 1900 || year > 2200) continue;

        const nationalTotals = itemSchema.map(
          (_, itemIndex) => numericCell(cells[9 + itemIndex * 9])
        );

        const stateTotals = {};
        STATE_CODES.forEach(code => {
          const stateOffset = MEDICARE_STATE_OFFSETS[code];
          stateTotals[code] = itemSchema.map(
            (_, itemIndex) => numericCell(cells[stateOffset + itemIndex * 9])
          );
        });

        const hasData = nationalTotals.some(Number.isFinite) ||
          STATE_CODES.some(code => stateTotals[code].some(Number.isFinite));

        if (hasData) {
          parsedRows.push({
            year,
            nationalTotals,
            stateTotals
          });
        }
      }

      parsedRows.sort((a, b) => a.year - b.year);

      return {
        items: itemSchema.map(item => ({ ...item })),
        rows: parsedRows
      };
    }

    function parseActiveClinicianTable(table) {
      const parsedRows = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells = sourceRow?.c || [];
        const yearValue = numericCell(cells[0]);
        if (!Number.isFinite(yearValue)) return;

        const year = Math.round(yearValue);
        if (year < 1900 || year > 2200) return;

        const stateValues = {};
        STATE_CODES.forEach(code => {
          stateValues[code] = numericCell(
            cells[ACTIVE_CLINICIAN_STATE_INDEX[code]]
          );
        });

        const total = numericCell(cells[ACTIVE_CLINICIAN_TOTAL_INDEX]);
        const hasData = Number.isFinite(total) ||
          STATE_CODES.some(code => Number.isFinite(stateValues[code]));

        if (hasData) {
          parsedRows.push({ year, total, stateValues });
        }
      });

      parsedRows.sort((a, b) => a.year - b.year);
      return parsedRows;
    }

    function parseClinicalHoursTable(table) {
      const parsedRows = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells = sourceRow?.c || [];
        const yearValue = numericCell(cells[0]);
        if (!Number.isFinite(yearValue)) return;

        const year = Math.round(yearValue);
        if (year < 1900 || year > 2200) return;

        const stateValues = {};
        STATE_CODES.forEach(code => {
          stateValues[code] = numericCell(
            cells[CLINICAL_HOURS_STATE_INDEX[code]]
          );
        });

        const total = numericCell(cells[CLINICAL_HOURS_TOTAL_INDEX]);
        const hasData = Number.isFinite(total) ||
          STATE_CODES.some(code => Number.isFinite(stateValues[code]));

        if (hasData) {
          parsedRows.push({ year, total, stateValues });
        }
      });

      parsedRows.sort((a, b) => a.year - b.year);
      return parsedRows;
    }

    function totalMedicareHours(totals, items) {
      let total = 0;
      let found = false;

      items.forEach((item, itemIndex) => {
        const count = finiteNumber(totals?.[itemIndex]);
        const hours = finiteNumber(item?.hours);

        if (Number.isFinite(count) && Number.isFinite(hours)) {
          total += count * hours;
          found = true;
        }
      });

      return found ? total : null;
    }

    function clinicianCapacity(activeCliniciansValue, weeklyClinicalHoursValue) {
      const activeClinicians = finiteNumber(activeCliniciansValue);
      const weeklyClinicalHours = finiteNumber(weeklyClinicalHoursValue);

      if (
        !Number.isFinite(activeClinicians) || activeClinicians <= 0 ||
        !Number.isFinite(weeklyClinicalHours) || weeklyClinicalHours <= 0
      ) {
        return null;
      }

      const averageAnnualClinicalHours = Math.max(
        0,
        weeklyClinicalHours * WORKING_WEEKS_PER_YEAR -
          ADMIN_HOURS_PER_WEEK * ADMIN_WEEKS_PER_YEAR
      );

      if (averageAnnualClinicalHours <= 0) return null;

      return {
        activeClinicians,
        weeklyClinicalHours,
        annualClinicalHours:
          activeClinicians * averageAnnualClinicalHours,
        averageAnnualClinicalHours
      };
    }

    function excessClinicians(capacity, medicareHours) {
      if (
        !capacity ||
        !Number.isFinite(capacity.averageAnnualClinicalHours) ||
        capacity.averageAnnualClinicalHours <= 0 ||
        !Number.isFinite(medicareHours)
      ) {
        return null;
      }

      return (
        capacity.annualClinicalHours - medicareHours
      ) / capacity.averageAnnualClinicalHours;
    }

    function combineSources(
      medicareData,
      activeClinicianRows,
      clinicalHoursRows
    ) {
      const activeByYear = new Map(
        (activeClinicianRows || []).map(row => [row.year, row])
      );
      const hoursByYear = new Map(
        (clinicalHoursRows || []).map(row => [row.year, row])
      );

      const combinedRows = medicareData.rows
        .map(medicareRow => {
          const activeRow = activeByYear.get(medicareRow.year);
          const hoursRow = hoursByYear.get(medicareRow.year);
          if (!activeRow || !hoursRow) return null;

          const values = {};
          const details = {};

          const australiaCapacity = clinicianCapacity(
            activeRow.total,
            hoursRow.total
          );

          const australiaMedicareHours = totalMedicareHours(
            medicareRow.nationalTotals,
            medicareData.items
          );

          const australiaExcess = excessClinicians(
            australiaCapacity,
            australiaMedicareHours
          );

          if (!Number.isFinite(australiaExcess)) return null;

          values[AUSTRALIA_KEY] = australiaExcess;
          details[AUSTRALIA_KEY] = {
            capacity: australiaCapacity,
            medicareHours: australiaMedicareHours
          };

          STATE_CODES.forEach(code => {
            const capacity = clinicianCapacity(
              activeRow.stateValues?.[code],
              hoursRow.stateValues?.[code]
            );

            const medicareHours = totalMedicareHours(
              medicareRow.stateTotals?.[code],
              medicareData.items
            );

            const excess = excessClinicians(capacity, medicareHours);
            values[code] = Number.isFinite(excess) ? excess : null;
            details[code] = { capacity, medicareHours };
          });

          return {
            year: medicareRow.year,
            values,
            details
          };
        })
        .filter(Boolean)
        .sort((a, b) => a.year - b.year);

      return {
        items: medicareData.items,
        rows: combinedRows
      };
    }

    function validSourceData(data) {
      if (
        !data ||
        !Array.isArray(data.items) ||
        data.items.length !== EXPECTED_ITEM_COUNT ||
        !Array.isArray(data.rows) ||
        data.rows.length < 3
      ) {
        return false;
      }

      if (
        new Set(data.items.map(item => String(item?.item || ''))).size !==
        EXPECTED_ITEM_COUNT
      ) {
        return false;
      }

      return data.rows.some(row =>
        SERIES.some(series => Number.isFinite(Number(row?.values?.[series.key])))
      );
    }

    function parseLiveTables(tables) {
      const [
        dataTable,
        itemTable,
        hoursTable,
        activeClinicianTable,
        clinicalHoursTable
      ] = tables;
      const itemSchema = parseMetadataRows(itemTable, hoursTable);
      const medicareData = parseMedicareDataTable(dataTable, itemSchema);
      const activeClinicianRows =
        parseActiveClinicianTable(activeClinicianTable);
      const clinicalHoursRows =
        parseClinicalHoursTable(clinicalHoursTable);
      const data = combineSources(
        medicareData,
        activeClinicianRows,
        clinicalHoursRows
      );

      if (!validSourceData(data)) {
        throw new Error('Live excess-clinician data were incomplete.');
      }

      return [data];
    }

    function parseRemoteSnapshot(snapshot) {
      const itemSchema = parseMetadataRows(
        rowsToGVizTable([snapshot.data?.itemRow]),
        rowsToGVizTable([snapshot.data?.hoursRow])
      );

      const medicareData = parseMedicareDataTable(
        rowsToGVizTable(snapshot.data?.dataRows),
        itemSchema
      );

      const activeClinicianRows = parseActiveClinicianTable(
        rowsToGVizTable(snapshot.data?.activeClinicianRows)
      );

      const clinicalHoursRows = parseClinicalHoursTable(
        rowsToGVizTable(snapshot.data?.clinicalHoursRows)
      );

      const data = combineSources(
        medicareData,
        activeClinicianRows,
        clinicalHoursRows
      );

      if (!validSourceData(data)) {
        throw new Error('Cached excess-clinician data were incomplete.');
      }

      return [data];
    }

    // ============================================================
    // SCALE + TREND
    // ============================================================

    function niceStep(value) {
      if (!Number.isFinite(value) || value <= 0) return 1;

      const exponent = Math.floor(Math.log10(value));
      const magnitude = 10 ** exponent;
      const fraction = value / magnitude;
      const niceFraction = fraction <= 1
        ? 1
        : fraction <= 2
          ? 2
          : fraction <= 2.5
            ? 2.5
            : fraction <= 5
              ? 5
              : 10;

      return niceFraction * magnitude;
    }

    function computeScale() {
      const values = rows.flatMap(row =>
        SERIES.map(series => Number(row?.values?.[series.key]))
          .filter(Number.isFinite)
      );

      if (!values.length) {
        yScale = {
          min: 0,
          max: 100,
          step: 20,
          intervals: 5
        };
        return;
      }

      const maximum = Math.max(...values, 0);
      const minimum = Math.min(...values, 0);
      const step = niceStep(maximum / 6 || 1);
      const max = Math.max(step, Math.ceil(maximum / step) * step);
      const min = minimum < 0
        ? Math.floor(minimum / step) * step
        : 0;

      yScale = {
        min,
        max,
        step,
        intervals: Math.round((max - min) / step)
      };
    }

    function trendWindowSize() {
      return trendMode === '3yr' ? 3
        : trendMode === '10yr' ? FIXED_TREND_WINDOW
          : 0;
    }

    function trendForSeries(seriesKey) {
      const windowSize = trendWindowSize();
      if (!windowSize) return NaN;
      const cacheKey = `${windowSize}:${seriesKey}`;
      if (trendValueCache.has(cacheKey)) return trendValueCache.get(cacheKey);
      const value = PFFCharts.latestConsecutiveTrend(
        rows,
        row => Number(row?.values?.[seriesKey]),
        windowSize
      );
      trendValueCache.set(cacheKey, value);
      return value;
    }

    // ============================================================
    // DATASETS + PLUGINS
    // ============================================================

    function datasetForSeries(series, seriesIndex) {
      return PFFCharts.lineDataset({
        label: series.label,
        _seriesLabel: series.label,
        _seriesKey: series.key,
        _activeSeries: true,
        data: rows.map(row => {
          const value = Number(row?.values?.[series.key]);
          return Number.isFinite(value) ? value : null;
        }),
        borderColor: series.colour,
        backgroundColor: series.colour,
        pointBackgroundColor: series.colour,
        pointBorderColor: '#ffffff',
        pointBorderWidth: 0,
        pointRadius: 0,
        pointHoverRadius: 0, // No floating hover dot over the selected year.
        pointHitRadius: sharedChart.responsive.getPointHitRadius(),
        borderWidth: series.width,
        cubicInterpolationMode: 'monotone',
        order: series.key === AUSTRALIA_KEY ? 1 : 2
      });
    }

    function buildDatasets() {
      return SERIES.map(datasetForSeries);
    }

    const yearTicksPlugin = sharedChart.axes.createLabelDrivenTicksPlugin({
      id: 'pffExcessCliniciansSharedYearTicks',
      axes: ['x'] // The original unified Y-axis draws its own ticks and grid.
    });

    const trendLabelsPlugin = sharedChart.trends.createTrendPillsPlugin({
      id: 'pffExcessCliniciansSharedTrendPills',
      enabled() { return trendMode !== 'off'; },
      isActive({ dataset }) { return Boolean(dataset?._activeSeries); },
      getTrendValue({ dataset }) { return trendForSeries(dataset?._seriesKey); },
      getSeriesColour({ dataset }) { return dataset?.borderColor || '#69718a'; }
    });

    // Pinning is performed by the existing nearest-point hit test. On pointer
    // motion, do not let Chart.js replace the pinned year's tooltip.
    const pinnedYearPlugin = {
      id: 'pffExcessCliniciansPinnedYear',
      beforeEvent(_chart, args) {
        if (pinnedYearIndex !== null &&
            (args?.event?.type === 'mousemove' || args?.event?.type === 'mouseout')) {
          return false;
        }
      }
    };

    // ============================================================
    // CHART
    // ============================================================

    function leftScaleOptions() {
      return PFFCharts.yScaleOptions(yScale, {
        ticks: {
          stepSize: yScale.step
        },
        afterFit(axis) {
          axis.width = PFFCharts.mobileLayout() ? 61 : 69;
        }
      });
    }

    function tooltipElement() {
      if (alignedTooltipElement) return alignedTooltipElement;
      const element = document.createElement('div');
      element.className = 'pff-excess-tooltip';
      element.hidden = true;
      element.setAttribute('role', 'tooltip');
      element.setAttribute('aria-hidden', 'true');
      chartShell.appendChild(element);
      alignedTooltipElement = element;
      return element;
    }

    function hideAlignedTooltip() {
      if (!alignedTooltipElement) return;
      alignedTooltipElement.hidden = true;
      alignedTooltipElement.setAttribute('aria-hidden', 'true');
      lastTooltipKey = '';
    }

    function formatTooltipTrend(value) {
      if (!Number.isFinite(value)) return '';
      const sign = value < 0 ? '−' : '+';
      return `${sign}${Math.abs(value).toFixed(1)}% p.a. (${trendWindowSize()}yr)`;
    }

    function buildTooltipContents(element, index) {
      element.replaceChildren();
      const heading = document.createElement('div');
      heading.className = 'pff-excess-tooltip-year';
      heading.textContent = String(rows[index]?.year ?? '');
      element.appendChild(heading);
      const grid = document.createElement('div');
      grid.className = 'pff-excess-tooltip-grid';
      grid.classList.toggle('is-off', trendMode === 'off');
      SERIES.forEach(series => {
        const rowValue = Number(rows[index]?.values?.[series.key]);
        if (!Number.isFinite(rowValue)) return;
        const name = document.createElement('span');
        name.className = 'pff-excess-tooltip-name';
        name.textContent = `${series.label}:`;
        const value = document.createElement('span');
        value.className = 'pff-excess-tooltip-value';
        value.textContent = PFFCharts.formatInteger(Math.round(rowValue));
        grid.append(name, value);
        if (trendMode !== 'off') {
          const trend = document.createElement('span');
          trend.className = 'pff-excess-tooltip-trend';
          trend.textContent = formatTooltipTrend(trendForSeries(series.key));
          grid.appendChild(trend);
        }
      });
      element.appendChild(grid);
    }

    function positionAlignedTooltip(element, chartInstance, tooltip) {
      const shellRect = chartShell.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const canvasWidth = Number(chartInstance.width) || canvasRect.width;
      const canvasHeight = Number(chartInstance.height) || canvasRect.height;
      const anchorX = canvasRect.left - shellRect.left +
        Number(tooltip.caretX || 0) * canvasRect.width / canvasWidth;
      const anchorY = canvasRect.top - shellRect.top +
        Number(tooltip.caretY || 0) * canvasRect.height / canvasHeight;
      const width = element.offsetWidth;
      const height = element.offsetHeight;
      const availableWidth = shellRect.width || canvasRect.width;
      const availableHeight = shellRect.height || canvasRect.height;
      const x = anchorX + 12 + width > availableWidth - 6
        ? anchorX - width - 12 : anchorX + 12;
      const y = anchorY + 8 + height > availableHeight - 6
        ? anchorY - height - 8 : anchorY + 8;
      element.style.left = `${Math.max(6, Math.min(x, availableWidth - width - 6))}px`;
      element.style.top = `${Math.max(6, Math.min(y, availableHeight - height - 6))}px`;
    }

    function renderAlignedTooltip({ chart: chartInstance, tooltip }) {
      if (!chartInstance || !tooltip || !(Number(tooltip.opacity) > 0) ||
          !tooltip.dataPoints?.length) {
        hideAlignedTooltip();
        return;
      }
      const index = tooltip.dataPoints[0]?.dataIndex;
      if (!Number.isInteger(index) || !rows[index]) {
        hideAlignedTooltip();
        return;
      }
      const element = tooltipElement();
      const key = `${index}|${trendMode}`;
      if (key !== lastTooltipKey) {
        buildTooltipContents(element, index);
        lastTooltipKey = key;
      }
      element.hidden = false;
      element.setAttribute('aria-hidden', 'false');
      positionAlignedTooltip(element, chartInstance, tooltip);
    }

    function refreshAlignedTooltip() {
      lastTooltipKey = '';
      if (chart?.tooltip) renderAlignedTooltip({chart, tooltip: chart.tooltip});
    }

    function tooltipOptions() {
      return sharedChart.tooltips.tooltipOptions({
        enabled: false, // External Lato grid: accurate columns, no swatch/dot.
        displayColors: false,
        mode: 'index',
        intersect: true,
        external: renderAlignedTooltip,
        callbacks: {
          title(items) {
            const index = items?.[0]?.dataIndex;
            return Number.isInteger(index)
              ? String(rows[index]?.year ?? '') : '';
          }
        }
      });
    }

    function chartOptions() {
      const options = PFFCharts.baseChartOptions({
        transitions:
          PFFCharts.seriesVisibilityTransitionOptions(240),

        events: [
          'mousemove',
          'mouseout'
        ],

        interaction: {
          mode: 'index',
          intersect: true,
          axis: 'xy'
        },

        plugins: {
          tooltip: tooltipOptions()
        },

        scales: {
          x: PFFCharts.xYearScaleOptions({
            ticks: {
              callback(value, index) {
                const year = Number(rows[index]?.year);
                return Number.isFinite(year) && year % 2 === 0
                  ? String(year)
                  : '';
              }
            }
          }),
          y: leftScaleOptions()
        }
      });
      options.scales.x = sharedChart.axes.withXAxisTickMarks(
        options.scales.x,
        { yearMode: 'even' }
      );
      const timed = sharedChart.animations.withChartJsTiming(options);
      if (PFF.reducedMotion()) {
        timed.animation = false;
        if (timed.transitions?.active?.animation) {
          timed.transitions.active.animation.duration = 0;
        }
      }
      return timed;
    }

    function legendItems() {
      return SERIES.map(series => ({
        label: series.label,
        colour: series.colour,
        markerType: 'line'
      }));
    }

    function createChart() {
      computeScale();

      yAxisController = PFFCharts.createUnifiedYAxis({
        id: 'pffExcessCliniciansStateAxis',
        getChart() {
          return chart;
        },
        getScale() {
          return yScale;
        },
        getDecimals() {
          return 0;
        },
        getTitle() {
          return 'Excess clinicians';
        },
        formatValue(value) {
          return PFFCharts.formatInteger(Math.round(value));
        }
      });

      yAxisController.setImmediately(yScale, 0);
      yAxisController.setTitleImmediately('Excess clinicians');

      chart = new Chart(
        canvas.getContext('2d'),
        {
          type: 'line',
          data: {
            labels: rows.map(row => String(row.year)),
            datasets: buildDatasets()
          },
          options: chartOptions(),
          plugins: [
            yAxisController.plugin,
            yearTicksPlugin,
            trendLabelsPlugin,
            pinnedYearPlugin
          ]
        }
      );

      legendController?.update(legendItems(), false);
      setupTooltipTapInteractions();
      updateAccessibleSummary();
    }

    function updateAccessibleSummary() {
      if (!chartSummary || !rows.length) return;

      const latest = rows[rows.length - 1];
      const values = SERIES.map(series => {
        const value = Number(latest?.values?.[series.key]);
        return Number.isFinite(value)
          ? `${series.label} ${PFFCharts.formatInteger(Math.round(value))}`
          : `${series.label} unavailable`;
      }).join(', ');

      const trendDescription = trendMode === 'off'
        ? 'Trend annotations are off.'
        : `${trendWindowSize()}-year log-linear annual trends are shown where defined; trends are omitted for non-positive series.`;

      PFFCharts.updateChartSummary(
        `Excess clinicians. Latest year ${latest.year}: ${values}. ${trendDescription}`,
        chartSummary
      );
    }

    // ============================================================
    // TOOLTIP TAP / DISMISS INTERACTION
    // ============================================================

    function clearChartTooltip() {
      pinnedYearIndex = null;
      hideAlignedTooltip();
      if (!chart) return;
      chart.setActiveElements([]);
      chart.tooltip?.setActiveElements([], {x: 0, y: 0});
      chart.draw();
    }

    function activateTooltipIndex(index, anchorElement) {
      if (!chart || !Number.isInteger(index)) return;
      const active = chart.data.datasets
        .map((dataset, datasetIndex) => {
          const value = Number(dataset?.data?.[index]);
          return Number.isFinite(value) ? {datasetIndex, index} : null;
        })
        .filter(Boolean);
      if (!active.length) {
        clearChartTooltip();
        return;
      }
      pinnedYearIndex = index;
      const x = Number(anchorElement?.x);
      const y = Number(anchorElement?.y);
      // Do not add a floating data-point dot when a tooltip is pinned.
      chart.setActiveElements([]);
      chart.tooltip?.setActiveElements(active, {
        x: Number.isFinite(x) ? x : chart.chartArea.left,
        y: Number.isFinite(y) ? y : chart.chartArea.top
      });
      chart.draw();
    }

    function isTooltipPress(event) {
      if (!alignedTooltipElement || alignedTooltipElement.hidden) return false;
      const rect = alignedTooltipElement.getBoundingClientRect();
      const x = Number(event?.clientX);
      const y = Number(event?.clientY);
      return Number.isFinite(x) && Number.isFinite(y) &&
        x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
    }

    function getPressedPoint(event, chartInstance) {
      if (!chartInstance) return null;
      try {
        const hits = chartInstance.getElementsAtEventForMode(event,
          'nearest', {intersect: true, axis: 'xy', includeInvisible: false}, false);
        return hits[0] || null;
      } catch (_) {
        return null;
      }
    }

    function setupTooltipTapInteractions() {
      tooltipInteractionCleanup?.();
      const handleCanvasPress = event => {
        if (!chart || isTooltipPress(event)) return;
        const hit = getPressedPoint(event, chart);
        if (!hit) {
          clearChartTooltip();
          return;
        }
        const anchor = chart.getDatasetMeta(hit.datasetIndex)?.data?.[hit.index];
        activateTooltipIndex(hit.index, anchor);
      };
      canvas.addEventListener('pointerdown', handleCanvasPress, {passive: true});
      tooltipInteractionCleanup = () => {
        canvas.removeEventListener('pointerdown', handleCanvasPress);
      };
    }

    // ============================================================
    // SHARED CONTROLS
    // ============================================================

    function setupControls() {
      headingScroller = PFFCharts.setupScrollableRegion({
        scroller: headingScrollViewport,
        leftButton: headingScrollLeft,
        rightButton: headingScrollRight
      });

      legendController = PFFCharts.setupDisplayLegend({
        legend,
        leftButton: legendLeft,
        rightButton: legendRight
      });

      legendController.update(legendItems(), false);

      trendController = PFFCharts.setupTrendToggle({
        button: yoyTrendToggle,
        initialMode: trendMode,
        onChange(mode) {
          trendMode = mode;
          trendMethodNote.innerHTML = trendMode === 'off'
            ? '<strong>Trends:</strong> off'
            : `<strong>Trends:</strong> pills show the latest ${trendWindowSize()}-year log-linear annual trends`;
          chart?.draw();
          refreshAlignedTooltip();
          updateAccessibleSummary();
        }
      });

      chartInteractions = sharedChart.tooltips.bindDismissOnOutside({
        canvas,
        getChart: () => chart,
        keepTooltipPress: false,
        isDataPress(event, chartInstance) {
          return isTooltipPress(event) || !!getPressedPoint(event, chartInstance);
        },
        onDismiss() {
          pinnedYearIndex = null;
          hideAlignedTooltip();
        }
      });
      sharedChart.responsive.suppressTapFlash(canvas);

      responsiveController = PFFCharts.createResponsiveController({
        getChart() {
          return chart;
        },
        observe: [app, chartShell],
        beforeResize(chartInstance) {
          chartInstance.data.datasets.forEach(dataset => {
            dataset.pointHitRadius = sharedChart.responsive.getPointHitRadius();
          });
        },
        onRefresh() {
          headingScroller?.update();
          legendController?.update();
          if (alignedTooltipElement && !alignedTooltipElement.hidden) {
            refreshAlignedTooltip();
          }
        }
      });

      chartSummary = PFFCharts.ensureChartSummary({ parent: app });
    }

    // ============================================================
    // STARTUP
    // ============================================================

    setupControls();

    PFF.initialiseApp({
      app,
      status: statusElement,

      loadLive() {
        loaderText.textContent = 'Loading live supply and Medicare data…';

        return Promise.all([
          PFFCharts.loadGVizSheet({
            sheetId: SHEET_ID,
            sheetName: MEDICARE_SHEET,
            range: MEDICARE_DATA_RANGE,
            headers: '1',
            timeoutMs: FETCH_TIMEOUT_MS,
            query: 'select *'
          }),
          PFFCharts.loadGVizSheet({
            sheetId: SHEET_ID,
            sheetName: MEDICARE_SHEET,
            range: MEDICARE_ITEM_RANGE,
            headers: '0',
            timeoutMs: FETCH_TIMEOUT_MS,
            query: 'select *'
          }),
          PFFCharts.loadGVizSheet({
            sheetId: SHEET_ID,
            sheetName: MEDICARE_SHEET,
            range: MEDICARE_HOURS_RANGE,
            headers: '0',
            timeoutMs: FETCH_TIMEOUT_MS,
            query: 'select *'
          }),
          PFFCharts.loadGVizSheet({
            sheetId: SHEET_ID,
            sheetName: ACTIVE_CLINICIAN_SHEET,
            range: ACTIVE_CLINICIAN_RANGE,
            headers: '1',
            timeoutMs: FETCH_TIMEOUT_MS,
            query: 'select *'
          }),
          PFFCharts.loadGVizSheet({
            sheetId: SHEET_ID,
            sheetName: CLINICAL_HOURS_SHEET,
            range: CLINICAL_HOURS_RANGE,
            headers: '1',
            timeoutMs: FETCH_TIMEOUT_MS,
            query: 'select *'
          })
        ]);
      },

      parseLive: parseLiveTables,

      loadRemoteCache() {
        loaderText.textContent = 'Loading cached PFF data…';
        return PFFCharts.loadAppsScriptCache({
          url: CACHE_WEB_APP_URL,
          appKey: CACHE_APP_KEY,
          timeoutMs: CACHE_FETCH_TIMEOUT_MS
        });
      },

      parseRemoteCache: parseRemoteSnapshot,

      cacheKey: LOCAL_CACHE_KEY,
      minRows: 1,

      dataSourceOptions: {
        indicator: sourceIndicator,
        text: sourceText
      },

      onLiveError(error) {
        console.warn(
          'Live Medicare/supply data unavailable; trying Apps Script cache.',
          error
        );
        loaderText.textContent = 'Live data unavailable. Loading cached PFF data…';
      },

      onRemoteCacheError(error) {
        console.warn(
          'Apps Script Medicare/supply cache unavailable; trying browser cache.',
          error
        );
        loaderText.textContent = 'Backend cache unavailable. Checking browser cache…';
      },

      render(loaded) {
        const data = loaded.rows?.[0];

        if (!validSourceData(data)) {
          throw new Error('Unable to read excess-clinician data.');
        }

        sourceData = data;
        rows = sourceData.rows
          .map(row => ({
            year: Number(row.year),
            values: { ...row.values },
            details: { ...row.details }
          }))
          .filter(row =>
            Number.isFinite(row.year) &&
            SERIES.some(series =>
              Number.isFinite(Number(row?.values?.[series.key]))
            )
          )
          .sort((a, b) => a.year - b.year);

        if (rows.length < 3) {
          throw new Error('There were not enough overlapping supply and Medicare years to plot.');
        }

        trendValueCache.clear();
        createChart();
        legendController?.update(legendItems(), false);
        responsiveController?.refresh();

        return chart;
      },

      onReady() {
        app.setAttribute('aria-busy', 'false');
        loadingState.setAttribute('aria-hidden', 'true');
        updateAccessibleSummary();
      },

      errorMessage: 'Excess clinician trends unavailable.'
    });
  </script>
</body>
</html>
