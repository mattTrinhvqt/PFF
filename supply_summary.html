<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Optometry Supply Trends</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --general: #6600ff;
      --active: #f1b916;
      --entrants: #df2f2f;
      --exits: #2f8138;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 0 4px;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    /* ============================================================
     * TOP TABS + LIVE STATUS
     * ============================================================ */

    .module-top {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 300ms var(--motion-ease),
        width 300ms var(--motion-ease);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition:
        color 180ms ease,
        border-color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: none;
    }

    .tab-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .tab-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .tab-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }
    .tab-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .tab-scroll-left { left: 0; }
    .tab-scroll-right { right: 0; }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
      transition: background-color 220ms ease;
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      position: absolute;
      inset: 0;
      z-index: 101;
      display: flex;
      width: 100%;
      margin: 0;
      padding: 0 8px;
      align-items: center;
      justify-content: center;
      color: var(--error);
      background: #fff;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    #status:empty {
      display: none;
    }

    /* ============================================================
     * HEADING + YOY CONTROL
     * ============================================================ */

    .chart-heading-row {
      position: relative;
      z-index: 30;
      display: flex;
      width: 100%;
      height: 30px;
      min-width: 0;
      min-height: 30px;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
      margin: 0;
    }

    .heading-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .heading-scroll-viewport {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .heading-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    .heading-scroll-button {
      position: absolute;
      top: 4px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .heading-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .heading-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .heading-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .heading-scroll-left { left: 0; }
    .heading-scroll-right { right: 0; }

    .chart-heading {
      display: inline-block;
      width: max-content;
      min-width: max-content;
      margin: 0;
      padding: 4px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
      will-change: opacity;
    }

    .heading-controls {
      display: flex;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-start;
      gap: 5px;
    }

    .yoy-trend-toggle {
      display: grid;
      width: 78px;
      height: 27px;
      flex: 0 0 78px;
      grid-template-columns: 15px max-content 1fr;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .yoy-trend-toggle > * {
      pointer-events: none;
    }

    .yoy-trend-toggle:hover {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .yoy-trend-toggle.is-on {
      border-color: var(--purple);
    }

    .yoy-trend-toggle:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .yoy-binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .yoy-toggle-label,
    .yoy-toggle-value {
      font-size: 8.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .yoy-toggle-label { color: var(--ink); }

    .yoy-toggle-value {
      display: block;
      width: 100%;
      min-width: 0;
      color: var(--muted);
      letter-spacing: 0.025em;
      text-align: center;
    }

    .yoy-trend-toggle.is-on .yoy-toggle-value {
      color: var(--purple);
    }

    /* ============================================================
     * LEGEND
     * ============================================================ */

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left { left: 0; }
    .legend-scroll-right { right: 0; }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 1;
      transition:
        opacity 160ms ease,
        color 160ms ease;
    }

    .legend-item:hover {
      color: var(--ink);
    }

    .legend-item.is-hidden-series {
      opacity: 0.36;
    }

    .legend-item:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
      background: var(--ink);
    }

    /* ============================================================
     * CHART
     * ============================================================ */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -3px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #trendChart {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 0 3px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        height: 29px;
        min-height: 29px;
      }

      .chart-heading {
        font-size: 14px;
      }

      .heading-controls {
        gap: 4px;
      }

      .yoy-trend-toggle {
        width: 74px;
        flex-basis: 74px;
        grid-template-columns: 15px max-content 1fr;
        padding-right: 4px;
        padding-left: 4px;
      }

      .yoy-toggle-label,
      .yoy-toggle-value {
        font-size: 8px;
      }

      .yoy-toggle-value {
        width: 100%;
        min-width: 0;
      }

      .legend-item {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div id="loadingState" class="app-loading" role="status" aria-label="Loading optometry supply data">
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading optometry supply data…</p>
      </div>

      <div class="module-top">
        <div id="tabScrollShell" class="tab-scroll-shell">
          <button id="tabScrollLeft" class="tab-scroll-button tab-scroll-left is-hidden" type="button" aria-label="Scroll tabs left">‹</button>

          <div id="tabList" class="tab-list" role="tablist" aria-label="Optometry supply charts">
            <button class="chart-tab is-active" type="button" role="tab" aria-selected="true" data-view="optoms">Optometrists</button>
            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-view="flows">Entrants/exits</button>
          </div>

          <button id="tabScrollRight" class="tab-scroll-button tab-scroll-right is-hidden" type="button" aria-label="Scroll tabs right">›</button>
        </div>

        <div id="dataSourceIndicator" class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button id="headingScrollLeft" class="heading-scroll-button heading-scroll-left is-hidden" type="button" aria-label="Scroll graph title left">‹</button>
          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">Optometrists</h2>
          </div>
          <button id="headingScrollRight" class="heading-scroll-button heading-scroll-right is-hidden" type="button" aria-label="Scroll graph title right">›</button>
        </div>

        <div class="heading-controls">
          <button id="yoyTrendToggle" class="yoy-trend-toggle is-on" type="button" aria-pressed="true" aria-label="Trend labels on">
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">Trend</span>
            <span id="yoyToggleValue" class="yoy-toggle-value">ON</span>
          </button>
        </div>
      </div>

      <div class="chart-options-row">
        <div id="legendNav" class="legend-nav">
          <button id="legendScrollLeft" class="legend-scroll-button legend-scroll-left is-hidden" type="button" aria-label="Scroll legend left">‹</button>
          <div class="legend-viewport">
            <div id="chartLegend" class="chart-legend" aria-label="Chart legend"></div>
          </div>
          <button id="legendScrollRight" class="legend-scroll-button legend-scroll-right is-hidden" type="button" aria-label="Scroll legend right">›</button>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas id="trendChart" aria-label="Australian optometry supply trend chart" role="img"></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    // ============================================================
    // DATA SOURCE
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const OPTOM_SHEET =
      'Optomsbystate';

    const FLOW_SHEET =
      'Miscellaneous';

    // Optomsbystate: L = Year, V = Active clinicians, W = General registration.
    const OPTOM_RANGE =
      'L31:W';

    // Miscellaneous entrant/exit table:

    const DATA_SLOT_COUNT =

    // ============================================================
    // HELPERS
    // ============================================================

    function reducedMotion() {
      return window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function easeOutQuart(value) {
      return 1 - Math.pow(1 - value, 4);
    }

    function easeInOutCubic(value) {
      return value < 0.5
        ? 4 * value * value * value
        : 1 - Math.pow(-2 * value + 2, 3) / 2;
    }

    function rgba(hex, alpha) {
      const cleaned =
        String(hex || '#151515').replace('#', '').trim();

      const value =
        Number.parseInt(cleaned, 16);

      if (!Number.isFinite(value)) {
        return `rgba(21,21,21,${alpha})`;
      }

      const red = (value >> 16) & 255;
      const green = (value >> 8) & 255;
      const blue = value & 255;

      return `rgba(${red},${green},${blue},${alpha})`;
    }

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function numericCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      if (
        typeof cell.v === 'number' &&
        Number.isFinite(cell.v)
      ) {
        return cell.v;
      }

      const cleaned =
        cleanText(cell.f ?? cell.v)
          .replace(/,/g, '')
          .replace(/[^\d.-]/g, '');

      if (!cleaned || !/\d/.test(cleaned)) {
        return NaN;
      }

      const number = Number(cleaned);
      return Number.isFinite(number) ? number : NaN;
    }

    function formatInteger(value) {
      const number = Number(value);
      return Number.isFinite(number)
        ? Math.round(number).toLocaleString('en-AU')
        : '—';
    }

    function currentConfig() {
      return VIEW_CONFIG[activeView];
    }

    function currentRows() {
      return sourceData[activeView] || [];
    }

    function hiddenSeriesSet(view = activeView) {
      if (!hiddenSeriesByView.has(view)) {
        hiddenSeriesByView.set(view, new Set());
      }
      return hiddenSeriesByView.get(view);
    }

    function rowsForView(view) {
      return sourceData[view] || [];
    }

    function viewScale(view = activeView) {
      return {...VIEW_CONFIG[view].scale};
    }

    function scaleValues(scale) {
      const count =
        Math.round((scale.max - scale.min) / scale.step);

      return Array.from(
        {length: count + 1},
        (_, index) => scale.min + scale.step * index
      );
    }

    function latestAnnualisedGrowth(rows, seriesIndex) {
      const recent =
        rows
          .filter(row => Number.isFinite(row.values?.[seriesIndex]))
          .slice(-3);

      if (recent.length < 2) {
        return NaN;
      }

      const points = recent
        .map((row, index) => ({
          x: index,
          y: row.values[seriesIndex] > 0
            ? Math.log(row.values[seriesIndex])
            : NaN
        }))
        .filter(point => Number.isFinite(point.y));

      if (points.length < 2) {
        return NaN;
      }

      const meanX =
        points.reduce((sum, point) => sum + point.x, 0) /
        points.length;

      const meanY =
        points.reduce((sum, point) => sum + point.y, 0) /
        points.length;

      let numerator = 0;
      let denominator = 0;

      points.forEach(point => {
        const dx = point.x - meanX;
        numerator += dx * (point.y - meanY);
        denominator += dx * dx;
      });

      if (denominator <= 0) {
        return NaN;
      }

      const slope = numerator / denominator;
      return (Math.exp(slope) - 1) * 100;
    }

    function viewYearRatio(view, year) {
      const rows = rowsForView(view);
      if (!rows.length) return NaN;

      const first = rows[0].year;
      const last = rows[rows.length - 1].year;

      return last > first
        ? (year - first) / (last - first)
        : 0.5;
    }

    function buildDatasetData(view, seriesIndex) {
      const rows = rowsForView(view);

      if (!rows.length) {
        return Array.from(
          {length: DATA_SLOT_COUNT},
          () => ({x: 1, y: null, year: null})
        );
      }

      const firstYear = rows[0].year;
      const lastYear = rows[rows.length - 1].year;

      const points = rows.map(row => {
        const value = row?.values?.[seriesIndex];
        const x = lastYear > firstYear
          ? (row.year - firstYear) / (lastYear - firstYear)
          : 0.5;

        return {
          x,
          y: Number.isFinite(value) ? value : null,
          year: row.year
        };
      });

      while (points.length < DATA_SLOT_COUNT) {
        points.push({
          x: 1,
          y: null,
          year: null
        });
      }

      return points.slice(0, DATA_SLOT_COUNT);
    }

    function buildDatasets(view = activeView) {
      const config = VIEW_CONFIG[view];
      const hidden = hiddenSeriesSet(view);

      return config.labels.map((label, seriesIndex) => ({
        label,
        data: buildDatasetData(view, seriesIndex),
        parsing: false,
        borderColor: config.colours[seriesIndex],
        backgroundColor: config.colours[seriesIndex],
        pointBackgroundColor: config.colours[seriesIndex],
        pointBorderColor: '#ffffff',
        borderWidth: 3,
        borderCapStyle: 'round',
        borderJoinStyle: 'round',
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHitRadius: 5,
        pointBorderWidth: 1,
        tension: 0.28,
        cubicInterpolationMode: 'monotone',
        spanGaps: false,
        fill: false,
        hidden: hidden.has(label)
      }));
    }

    function hideLoadingState() {
      app.classList.remove('is-loading');
      app.setAttribute('aria-busy', 'false');
      loadingState.setAttribute('aria-hidden', 'true');
      refreshResponsiveLayout();
    }

    function setDataSource(source) {
      const cached = source !== 'live';

      dataSourceIndicator.classList.toggle('is-cached', cached);
      dataSourceIndicator.setAttribute(
        'aria-label',
        cached ? 'Cached data' : 'Live data'
      );
      dataSourceText.textContent =
        cached ? 'CACHED data' : 'LIVE data';
    }

    // ============================================================
    // GOOGLE SHEETS JSONP + CACHE
    // ============================================================

    function loadGVizSheet(sheetName, range) {
      return new Promise((resolve, reject) => {
        const callbackName =
          `__pff_supply_${Date.now()}_${Math.random().toString(36).slice(2)}`;

        const script = document.createElement('script');
        let completed = false;

        const cleanup = () => {
          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }
        };

        const timer = window.setTimeout(() => {
          if (completed) return;
          completed = true;
          cleanup();
          reject(new Error(`Timed out loading ${sheetName}.`));
        }, FETCH_TIMEOUT_MS);

        window[callbackName] = response => {
          if (completed) return;

          completed = true;
          window.clearTimeout(timer);
          cleanup();

          if (!response || response.status === 'error') {
            const message =
              response?.errors?.[0]?.detailed_message ||
              response?.errors?.[0]?.message ||
              `Could not load ${sheetName}.`;
            reject(new Error(message));
            return;
          }

          resolve(response.table);
        };

        script.onerror = () => {
          if (completed) return;
          completed = true;
          window.clearTimeout(timer);
          cleanup();
          reject(new Error(`Could not connect to ${sheetName}.`));
        };

        const params = new URLSearchParams({
          sheet: sheetName,
          range,
          headers: '1',
          tqx: `out:json;responseHandler:${callbackName}`
        });

        script.src =
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;
        script.async = true;
        document.head.appendChild(script);
      });
    }

    function parseOptomTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells = sourceRow?.c || [];
        const year = numericCell(cells[0]);
        const active = numericCell(cells[10]);
        const general = numericCell(cells[11]);

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          !Number.isFinite(active) ||
          !Number.isFinite(general)
        ) {
          return;
        }

        parsed.push({
          year: Math.round(year),
          values: [general, active]
        });
      });

      return parsed.sort((a, b) => a.year - b.year);
    }

    function parseFlowTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells = sourceRow?.c || [];
        const year = numericCell(cells[0]);
        const entrants = numericCell(cells[1]);
        const exits = numericCell(cells[2]);

        if (
          !Number.isFinite(year) ||
          year < 2000 ||
          year > 2100 ||
          !Number.isFinite(entrants) ||
          !Number.isFinite(exits)
        ) {
          return;
        }

        parsed.push({
          year: Math.round(year),
          values: [entrants, exits]
        });
      });

      return parsed.sort((a, b) => a.year - b.year);
    }

    function validSourceData(data) {
      return Boolean(
        data &&
        Array.isArray(data.optoms) &&
        Array.isArray(data.flows) &&
        data.optoms.length >= 3 &&
        data.flows.length >= 3
      );
    }

    function saveLocalCache(data) {
      try {
        localStorage.setItem(
          LOCAL_CACHE_KEY,
          JSON.stringify({savedAt: Date.now(), data})
        );
      } catch (_) {
        // Cache is optional.
      }
    }

    function readLocalCache() {
      try {
        const raw = localStorage.getItem(LOCAL_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return validSourceData(parsed?.data) ? parsed.data : null;
      } catch (_) {
        return null;
      }
    }

    function clonedFallback() {
      return {
        optoms: EMBEDDED_FALLBACK.optoms.map(row => ({
          year: row.year,
          values: [...row.values]
        })),
        flows: EMBEDDED_FALLBACK.flows.map(row => ({
          year: row.year,
          values: [...row.values]
        }))
      };
    }

    async function loadData() {
      try {
        const [optomTable, flowTable] = await Promise.all([
          loadGVizSheet(OPTOM_SHEET, OPTOM_RANGE),
          loadGVizSheet(FLOW_SHEET, FLOW_RANGE)
        ]);

        const liveData = {
          optoms: parseOptomTable(optomTable),
          flows: parseFlowTable(flowTable)
        };

        if (!validSourceData(liveData)) {
          throw new Error('Live sheet data were incomplete.');
        }

        saveLocalCache(liveData);
        setDataSource('live');
        return liveData;
      } catch (error) {
        const cached = readLocalCache();
        setDataSource('cached');

        if (validSourceData(cached)) {
          return cached;
        }

        return clonedFallback();
      }
    }

    // ============================================================
    // TEXT / CONTROLS / SCROLLERS
    // ============================================================

    function fadeTextChange(element, nextText, duration = 240) {
      if (!element || element.textContent === nextText) {
        return;
      }

      if (reducedMotion() || !element.animate) {
        element.textContent = nextText;
        return;
      }

      const token = Symbol('text');
      element._pffToken = token;

      const fadeOut = element.animate(
        [{opacity:1}, {opacity:0}],
        {
          duration: Math.round(duration * 0.42),
          easing: 'ease-out',
          fill: 'forwards'
        }
      );

      fadeOut.finished
        .then(() => {
          if (element._pffToken !== token) return;
          element.textContent = nextText;
          return element.animate(
            [{opacity:0}, {opacity:1}],
            {
              duration: Math.round(duration * 0.58),
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
              fill: 'forwards'
            }
          ).finished;
        })
        .catch(() => {});
    }

    function updateHeading() {
      fadeTextChange(chartHeading, currentConfig().heading);
      requestAnimationFrame(updateHeadingScrollControls);
    }

    function updateYoyToggle() {
      yoyTrendToggle.classList.toggle('is-on', yoyTrendOn);
      yoyTrendToggle.setAttribute('aria-pressed', String(yoyTrendOn));
      yoyTrendToggle.setAttribute(
        'aria-label',
        `Trend labels ${yoyTrendOn ? 'on' : 'off'}`
      );
      yoyToggleValue.textContent = yoyTrendOn ? 'ON' : 'OFF';
    }

    function positionTabIndicator(animate = true) {
      const activeTab = chartTabs.find(
        tab => tab.dataset.view === activeView
      );

      if (!activeTab) return;

      if (!animate) {
        tabList.classList.add('is-positioning');
      }

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${activeTab.offsetLeft}px`
      );
      tabList.style.setProperty(
        '--tab-indicator-width',
        `${activeTab.offsetWidth}px`
      );

      if (!animate) {
        requestAnimationFrame(() => {
          tabList.classList.remove('is-positioning');
        });
      }
    }

    function updateTabs() {
      chartTabs.forEach(tab => {
        const active = tab.dataset.view === activeView;
        tab.classList.toggle('is-active', active);
        tab.setAttribute('aria-selected', String(active));
      });
      positionTabIndicator(true);
      requestAnimationFrame(updateTabScrollControls);
    }

    function scrollByAmount(element, direction) {
      element.scrollBy({
        left: direction * Math.max(80, element.clientWidth * 0.72),
        behavior: 'smooth'
      });
    }

    function updateOverflowButtons(scroller, leftButton, rightButton) {
      const maximum = Math.max(0, scroller.scrollWidth - scroller.clientWidth);
      const hasOverflow = maximum > 2;

      leftButton.classList.toggle(
        'is-hidden',
        !hasOverflow || scroller.scrollLeft <= 2
      );
      rightButton.classList.toggle(
        'is-hidden',
        !hasOverflow || scroller.scrollLeft >= maximum - 2
      );
    }

    function updateTabScrollControls() {
      updateOverflowButtons(tabList, tabScrollLeft, tabScrollRight);
    }

    function updateLegendScrollControls() {
      updateOverflowButtons(chartLegend, legendScrollLeft, legendScrollRight);
    }

    function updateHeadingScrollControls() {
      updateOverflowButtons(
        headingScrollViewport,
        headingScrollLeft,
        headingScrollRight
      );

    // ============================================================
    // LEGEND
    // ============================================================

    function renderLegendItems() {
      const config = currentConfig();
      const hidden = hiddenSeriesSet();

      chartLegend.replaceChildren();

      config.labels.forEach((label, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'legend-item';
        button.classList.toggle('is-hidden-series', hidden.has(label));
        button.setAttribute('aria-pressed', String(!hidden.has(label)));
        button.dataset.series = label;

        const swatch = document.createElement('span');
        swatch.className = 'legend-line';
        swatch.style.background = config.colours[index];

        const text = document.createElement('span');
        text.textContent = label;

        button.append(swatch, text);

        button.addEventListener('click', () => {
          const currentHidden = hiddenSeriesSet();
          if (currentHidden.has(label)) {
            currentHidden.delete(label);
          } else {
            currentHidden.add(label);
          }

          button.classList.toggle(
            'is-hidden-series',
            currentHidden.has(label)
          );
          button.setAttribute(
            'aria-pressed',
            String(!currentHidden.has(label))
          );

          syncChartDatasets(activeView);
          chart.options.animation.duration = 0;
          chart.update('none');
        });

        chartLegend.appendChild(button);
      });

      requestAnimationFrame(updateLegendScrollControls);
    }

    function updateLegend(previousView, nextView) {
      if (
        previousView === nextView &&
        chartLegend.children.length
      ) {
        return;
      }

      const token = ++legendAnimationToken;

      if (
        reducedMotion() ||
        !chartLegend.animate ||
        !chartLegend.children.length
      ) {
        renderLegendItems();
        return;
      }

      const fadeOut = chartLegend.animate(
        [{opacity:1}, {opacity:0}],
        {duration:140, easing:'ease-out', fill:'forwards'}
      );

      fadeOut.finished
        .then(() => {
          if (token !== legendAnimationToken) return;
          renderLegendItems();
          chartLegend.scrollLeft = 0;
          return chartLegend.animate(
            [{opacity:0}, {opacity:1}],
            {
              duration:260,
              easing:'cubic-bezier(0.22, 1, 0.36, 1)',
              fill:'forwards'
            }
          ).finished;
        })
        .catch(() => {
          renderLegendItems();
        });
    }

    // ============================================================
    // AXIS TRANSITIONS
    // ============================================================

    function copyRows(rows) {
      return (rows || []).map(row => ({
        year: row.year,
        values: [...row.values]
      }));
    }

    function currentYAxisTracks() {
      const fromScale = yAxisTransition.from || viewScale();
      const toScale = yAxisTransition.to || viewScale();
      const progress = clamp(yAxisTransition.progress, 0, 1);
      const eased = easeInOutCubic(progress);

      const fromValues = scaleValues(fromScale);
      const toValues = scaleValues(toScale);
      const count = Math.max(fromValues.length, toValues.length);

      return Array.from({length: count}, (_, index) => {
        const fromValue = fromValues[index] ?? fromValues[fromValues.length - 1];
        const toValue = toValues[index] ?? toValues[toValues.length - 1];
        return {
          ratio: count > 1 ? index / (count - 1) : 0,
          value: fromValue + (toValue - fromValue) * eased
        };
      });
    }

    function startYAxisTransition(fromScale, toScale, duration = VIEW_TRANSITION_MS) {
      if (yAxisTransition.raf) {
        cancelAnimationFrame(yAxisTransition.raf);
      }

      const token = ++yAxisTransition.token;
      yAxisTransition.from = {...fromScale};
      yAxisTransition.to = {...toScale};
      yAxisTransition.progress = 0;

      if (reducedMotion() || duration <= 0) {
        yAxisTransition.progress = 1;
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      const step = now => {
        if (token !== yAxisTransition.token) return;

        yAxisTransition.progress = clamp(
          (now - startedAt) / duration,
          0,
          1
        );

        chart?.draw();

        if (yAxisTransition.progress < 1) {
          yAxisTransition.raf = requestAnimationFrame(step);
        } else {
          yAxisTransition.raf = null;
          yAxisTransition.from = {...toScale};
          yAxisTransition.to = {...toScale};
        }
      };

      yAxisTransition.raf = requestAnimationFrame(step);
    }

    function rowRatioMap(rows) {
      const result = new Map();
      if (!rows?.length) return result;

      const first = rows[0].year;
      const last = rows[rows.length - 1].year;
      rows.forEach(row => {
        const ratio = last > first
          ? (row.year - first) / (last - first)
          : 0.5;
        result.set(row.year, ratio);
      });
      return result;
    }

    function isCompactYearRange(rows) {
      if (!rows?.length) return false;

      const first = Number(rows[0].year);
      const last = Number(rows[rows.length - 1].year);

      return (
        Number.isFinite(first) &&
        Number.isFinite(last) &&
        last - first <= 5
      );
    }

    function shouldLabelYear(year, rows) {
      if (!rows?.length) return false;

      // Match the established PFF long-range trend style: labelled
      // major ticks are the even years only. For a short annual series
      // such as Entrants/exits (2019–2023), label every observed year so
      // no year such as 2021 disappears from the axis.
      if (isCompactYearRange(rows)) {
        return true;
      }

      return (
        Number.isFinite(Number(year)) &&
        Number(year) % 2 === 0
      );
    }

    function shouldMajorYear(year) {
      return (
        Number.isFinite(Number(year)) &&
        Number(year) % 2 === 0
      );
    }

    function currentXAxisTracks() {
      const fromRows = xAxisTransition.fromRows.length
        ? xAxisTransition.fromRows
        : currentRows();
      const toRows = xAxisTransition.toRows.length
        ? xAxisTransition.toRows
        : currentRows();

      const progress = clamp(xAxisTransition.progress, 0, 1);
      const eased = easeInOutCubic(progress);
      const fromMap = rowRatioMap(fromRows);
      const toMap = rowRatioMap(toRows);
      const years = Array.from(
        new Set([
          ...fromRows.map(row => row.year),
          ...toRows.map(row => row.year)
        ])
      ).sort((a, b) => a - b);

      return years.map(year => {
        const hasFrom = fromMap.has(year);
        const hasTo = toMap.has(year);
        const fromRatio = hasFrom
          ? fromMap.get(year)
          : toMap.get(year);
        const toRatio = hasTo
          ? toMap.get(year)
          : fromMap.get(year);

        const alpha = hasFrom && hasTo
          ? 1
          : hasTo
            ? eased
            : 1 - eased;

        const fromLabel = hasFrom && shouldLabelYear(year, fromRows) ? 1 : 0;
        const toLabel = hasTo && shouldLabelYear(year, toRows) ? 1 : 0;
        const fromMajor =
          hasFrom && shouldMajorYear(year, fromRows) ? 1 : 0;
        const toMajor =
          hasTo && shouldMajorYear(year, toRows) ? 1 : 0;

        return {
          year,
          ratio: fromRatio + (toRatio - fromRatio) * eased,
          alpha,
          labelAlpha: fromLabel + (toLabel - fromLabel) * eased,
          majorAlpha: fromMajor + (toMajor - fromMajor) * eased
        };
      });
    }

    function startXAxisTransition(fromRows, toRows, duration = VIEW_TRANSITION_MS) {
      if (xAxisTransition.raf) {
        cancelAnimationFrame(xAxisTransition.raf);
      }

      const token = ++xAxisTransition.token;
      xAxisTransition.fromRows = copyRows(fromRows);
      xAxisTransition.toRows = copyRows(toRows);
      xAxisTransition.progress = 0;

      if (reducedMotion() || duration <= 0) {
        xAxisTransition.progress = 1;
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      const step = now => {
        if (token !== xAxisTransition.token) return;

        xAxisTransition.progress = clamp(
          (now - startedAt) / duration,
          0,
          1
        );

        chart?.draw();

        if (xAxisTransition.progress < 1) {
          xAxisTransition.raf = requestAnimationFrame(step);
        } else {
          xAxisTransition.raf = null;
          xAxisTransition.fromRows = copyRows(toRows);
          xAxisTransition.toRows = copyRows(toRows);
        }
      };

      xAxisTransition.raf = requestAnimationFrame(step);
    }

    // ============================================================
    // CUSTOM CHART PLUGINS
    // ============================================================

    const pffAxesPlugin = {
      id: 'pffAxesPlugin',

      beforeDatasetsDraw(chartInstance) {
        const {ctx, chartArea} = chartInstance;
        if (!chartArea) return;

        const yTracks = currentYAxisTracks();

        ctx.save();

        // Major horizontal guides.
        yTracks.forEach(track => {
          if (track.ratio <= 0.001) return;
          const y = chartArea.bottom - chartArea.height * track.ratio;
          ctx.beginPath();
          ctx.moveTo(chartArea.left, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.right, Math.round(y) + 0.5);
          ctx.strokeStyle = 'rgba(105, 113, 138, 0.075)';
          ctx.lineWidth = 1;
          ctx.stroke();
        });

        // Minor horizontal guides exactly halfway between major tracks.
        for (let index = 0; index < yTracks.length - 1; index += 1) {
          const ratio = (yTracks[index].ratio + yTracks[index + 1].ratio) / 2;
          const y = chartArea.bottom - chartArea.height * ratio;
          ctx.beginPath();
          ctx.moveTo(chartArea.left, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.right, Math.round(y) + 0.5);
          ctx.strokeStyle = 'rgba(105, 113, 138, 0.035)';
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(chartInstance) {
        const {ctx, chartArea} = chartInstance;
        if (!chartArea) return;

        const mobile = window.innerWidth <= 430;
        const yTracks = currentYAxisTracks();
        const xTracks = currentXAxisTracks();

        ctx.save();
        ctx.lineCap = 'butt';

        // Y-axis major ticks and animated numbers.
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#151515';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font = '12px Lato, sans-serif';

        yTracks.forEach(track => {
          const y = chartArea.bottom - chartArea.height * track.ratio;
          ctx.beginPath();
          ctx.moveTo(chartArea.left, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.left - 5, Math.round(y) + 0.5);
          ctx.stroke();
          ctx.fillText(formatInteger(track.value), chartArea.left - 8, y);
        });

        // Y-axis minor tick marks.
        ctx.strokeStyle = '#69718a';
        ctx.globalAlpha = 0.60;
        ctx.lineWidth = 0.7;

        for (let index = 0; index < yTracks.length - 1; index += 1) {
          const ratio = (yTracks[index].ratio + yTracks[index + 1].ratio) / 2;
          const y = chartArea.bottom - chartArea.height * ratio;
          ctx.beginPath();
          ctx.moveTo(chartArea.left, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.left - 2, Math.round(y) + 0.5);
          ctx.stroke();
        }

        // X-axis year ticks follow the shared PFF hierarchy:
        // even years use the 5 px black major tick; odd years use the
        // 2 px muted minor tick. Compact ranges can still label every year.
        xTracks.forEach(track => {
          if (track.alpha <= 0.01) return;

          const x = chartArea.left + chartArea.width * track.ratio;
          const major = track.majorAlpha > 0.5;

          ctx.save();
          ctx.globalAlpha = clamp(track.alpha, 0, 1);
          ctx.strokeStyle = major ? '#151515' : '#69718a';
          ctx.lineWidth = major ? 1 : 0.7;
          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.lineTo(
            Math.round(x) + 0.5,
            chartArea.bottom + (major ? 5 : 2)
          );
          ctx.stroke();

          if (track.labelAlpha > 0.02) {
            ctx.globalAlpha = clamp(track.labelAlpha, 0, 1);
            ctx.fillStyle = '#151515';
            ctx.font = `${mobile ? 9 : 10}px Lato, sans-serif`;
            ctx.textBaseline = 'top';

            let labelX = x;

            if (track.ratio <= 0.001) {
              ctx.textAlign = 'left';
              labelX = x + 2;
            } else if (track.ratio >= 0.999) {
              ctx.textAlign = 'right';
              labelX = x - 2;
            } else {
              ctx.textAlign = 'center';
            }

            ctx.fillText(
              String(track.year),
              labelX,
              chartArea.bottom + 8
            );
          }
          ctx.restore();
        });

        ctx.restore();
      }
    };

    const axisSpinesPlugin = {
      id: 'axisSpinesPlugin',

      afterDraw(chartInstance) {
        const {ctx, chartArea} = chartInstance;
        if (!chartArea) return;

        ctx.save();
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1.1;

        ctx.beginPath();
        ctx.moveTo(Math.round(chartArea.left) + 0.5, chartArea.top);
        ctx.lineTo(Math.round(chartArea.left) + 0.5, chartArea.bottom);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(chartArea.left, Math.round(chartArea.bottom) + 0.5);
        ctx.lineTo(chartArea.right, Math.round(chartArea.bottom) + 0.5);
        ctx.stroke();

        ctx.restore();
      }
    };

    const paTrendLabelsPlugin = {
      id: 'paTrendLabelsPlugin',

      afterDatasetsDraw(chartInstance) {
        if (!yoyTrendOn) return;

        const rows = currentRows();
        if (rows.length < 2) return;

        const {ctx, chartArea} = chartInstance;
        const config = currentConfig();
        const hidden = hiddenSeriesSet();
        const mobile = window.innerWidth <= 430;
        const fontSize = mobile ? 8.2 : 9.1;
        const labelHeight = mobile ? 14 : 15;
        const paddingX = mobile ? 4 : 5;
        const arrowGap = mobile ? 2.5 : 3;
        const items = [];

        function seriesTint(
          hex,
          strength = 0.20,
          alpha = 0.84
        ) {
          const cleaned =
            String(hex || '#69718a')
              .replace('#', '')
              .trim();

          const value =
            Number.parseInt(cleaned, 16);

          if (!Number.isFinite(value)) {
            return `rgba(239, 240, 244, ${alpha})`;
          }

          const red = (value >> 16) & 255;
          const green = (value >> 8) & 255;
          const blue = value & 255;

          const mix = channel =>
            Math.round(
              255 +
              (channel - 255) * strength
            );

          return `rgba(${mix(red)},${mix(green)},${mix(blue)},${alpha})`;
        }

        ctx.save();
        ctx.font = `700 ${fontSize}px Lato, sans-serif`;
        ctx.textBaseline = 'middle';

        config.labels.forEach((label, seriesIndex) => {
          if (hidden.has(label)) return;

          const growth = latestAnnualisedGrowth(rows, seriesIndex);
          if (!Number.isFinite(growth)) return;

          const dataset = chartInstance.data.datasets[seriesIndex];
          const meta = chartInstance.getDatasetMeta(seriesIndex);
          if (!dataset || !meta?.data?.length || meta.hidden) return;

          let anchorIndex = -1;

          for (
            let index = dataset.data.length - 1;
            index >= 0;
            index -= 1
          ) {
            if (
              Number.isFinite(dataset.data[index]?.y) &&
              Number.isFinite(meta.data[index]?.x) &&
              Number.isFinite(meta.data[index]?.y)
            ) {
              anchorIndex = index;
              break;
            }
          }

          if (anchorIndex < 0) return;

          const point = meta.data[anchorIndex];
          const isIncrease = growth > 0.05;
          const isDecrease = growth < -0.05;
          const arrow =
            isIncrease
              ? '↑'
              : isDecrease
                ? '↓'
                : '';

          const valueText =
            `${Math.abs(growth).toFixed(1)}% p.a.`;

          const arrowWidth =
            arrow
              ? ctx.measureText(arrow).width
              : 0;

          const valueWidth =
            ctx.measureText(valueText).width;

          const labelWidth =
            paddingX * 2 +
            arrowWidth +
            (arrow ? arrowGap : 0) +
            valueWidth;

          items.push({
            seriesIndex,
            seriesColour: config.colours[seriesIndex],
            growth,
            isIncrease,
            isDecrease,
            arrow,
            valueText,
            arrowWidth,
            labelWidth,
            anchorX: point.x,
            anchorY: point.y
          });
        });

        if (!items.length) {
          ctx.restore();
          return;
        }

        const placed = [];

        function overlaps(rectangle) {
          const padding = 6;

          return placed.some(existing => !(
            rectangle.right + padding < existing.left ||
            rectangle.left - padding > existing.right ||
            rectangle.bottom + padding < existing.top ||
            rectangle.top - padding > existing.bottom
          ));
        }

        items
          .sort((a, b) => a.anchorY - b.anchorY)
          .forEach((item, itemIndex) => {
            const horizontalOffsets = [0, -68, -136, -34, -102];
            const verticalOffsets = [0, -2, 2, -4, 4, -6, 6];
            let chosen = null;

            for (const horizontalOffset of horizontalOffsets) {
              for (const verticalOffset of verticalOffsets) {
                const proposedRight = clamp(
                  chartArea.right - 4 + horizontalOffset,
                  chartArea.left + item.labelWidth + 5,
                  chartArea.right - 4
                );

                const proposedLeft =
                  proposedRight -
                  item.labelWidth;

                const proposedY = clamp(
                  item.anchorY + verticalOffset,
                  chartArea.top + labelHeight / 2,
                  chartArea.bottom - labelHeight / 2
                );

                const rectangle = {
                  left: proposedLeft,
                  right: proposedRight,
                  top: proposedY - labelHeight / 2,
                  bottom: proposedY + labelHeight / 2,
                  y: proposedY
                };

                if (!overlaps(rectangle)) {
                  chosen = rectangle;
                  break;
                }
              }

              if (chosen) break;
            }

            if (!chosen) {
              const right = clamp(
                chartArea.right - 4 - itemIndex * 74,
                chartArea.left + item.labelWidth + 5,
                chartArea.right - 4
              );

              const y = clamp(
                item.anchorY + (itemIndex % 2 === 0 ? -6 : 6),
                chartArea.top + labelHeight / 2,
                chartArea.bottom - labelHeight / 2
              );

              chosen = {
                left: right - item.labelWidth,
                right,
                top: y - labelHeight / 2,
                bottom: y + labelHeight / 2,
                y
              };
            }

            item.labelLeft = chosen.left;
            item.labelRight = chosen.right;
            item.labelY = chosen.y;
            placed.push(chosen);
          });

        // Draw connectors first so they remain behind the label pills.
        items.forEach(item => {
          const targetX =
            item.anchorX < item.labelLeft
              ? item.labelLeft
              : item.anchorX > item.labelRight
                ? item.labelRight
                : clamp(
                    item.anchorX,
                    item.labelLeft,
                    item.labelRight
                  );

          const displaced =
            Math.abs(targetX - item.anchorX) > 7 ||
            Math.abs(item.labelY - item.anchorY) > 2 ||
            item.labelLeft < item.anchorX - 4;

          if (!displaced) return;

          ctx.beginPath();
          ctx.moveTo(item.anchorX, item.anchorY);
          ctx.lineTo(targetX, item.labelY);
          ctx.strokeStyle = 'rgba(105, 113, 138, 0.58)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        });

        items.forEach(item => {
          const fillColour =
            seriesTint(
              item.seriesColour,
              0.20,
              0.84
            );

          const directionColour =
            item.isIncrease
              ? '#14823b'
              : item.isDecrease
                ? '#b42318'
                : '#69718a';

          const radius = 3;
          const top =
            item.labelY -
            labelHeight / 2;
          const bottom =
            item.labelY +
            labelHeight / 2;

          ctx.beginPath();
          ctx.moveTo(item.labelLeft + radius, top);
          ctx.lineTo(item.labelRight - radius, top);
          ctx.quadraticCurveTo(item.labelRight, top, item.labelRight, top + radius);
          ctx.lineTo(item.labelRight, bottom - radius);
          ctx.quadraticCurveTo(item.labelRight, bottom, item.labelRight - radius, bottom);
          ctx.lineTo(item.labelLeft + radius, bottom);
          ctx.quadraticCurveTo(item.labelLeft, bottom, item.labelLeft, bottom - radius);
          ctx.lineTo(item.labelLeft, top + radius);
          ctx.quadraticCurveTo(item.labelLeft, top, item.labelLeft + radius, top);
          ctx.closePath();

          ctx.fillStyle = fillColour;
          ctx.fill();

          ctx.strokeStyle =
            rgba(
              item.seriesColour,
              0.42
            );
          ctx.lineWidth = 0.65;
          ctx.stroke();

          let textX =
            item.labelLeft +
            paddingX;

          ctx.textAlign = 'left';
          ctx.fillStyle = directionColour;

          if (item.arrow) {
            ctx.fillText(
              item.arrow,
              textX,
              item.labelY - 0.2
            );

            textX +=
              item.arrowWidth +
              arrowGap;
          }

          ctx.fillText(
            item.valueText,
            textX,
            item.labelY
          );
        });

        ctx.restore();
      }
    };

    Chart.register(
      pffAxesPlugin,
      axisSpinesPlugin,
      paTrendLabelsPlugin
    );

    // ============================================================
    // CHART
    // ============================================================

    function baseChartOptions() {
      const mobile = window.innerWidth <= 430;
      const scale = viewScale();

      return {
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 0,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 3),

        animation: {
          duration: VIEW_TRANSITION_MS,
          easing: 'easeInOutCubic'
        },

        animations: {
          x: {
            duration: VIEW_TRANSITION_MS,
            easing: 'easeInOutCubic'
          },
          y: {
            duration: VIEW_TRANSITION_MS,
            easing: 'easeInOutCubic'
          },
          // Switch series colours immediately when the tab changes.
          // Only the line geometry morphs. This avoids the previous state
          // where the new values could temporarily retain the old tab's
          // colours (or vice versa) during rapid tab changes.
          borderColor: {
            duration: 0
          },
          backgroundColor: {
            duration: 0
          }
        },

        transitions: {
          active: {
            animation: {
              duration: HOVER_ANIMATION_MS,
              easing: 'easeOutCubic'
            }
          },
          resize: {
            animation: {duration: 0}
          }
        },

        interaction: {
          mode: 'nearest',
          intersect: true,
          axis: 'xy'
        },

        layout: {
          autoPadding: false,
          padding: {
            top: mobile ? 8 : 9,
            right: 4,
            bottom: 0,
            left: 0
          }
        },

        plugins: {
          legend: {display: false},
          tooltip: {
            enabled: true,
            mode: 'nearest',
            intersect: true,
            displayColors: false,
            backgroundColor: '#ffffff',
            titleColor: '#151515',
            bodyColor: '#69718a',
            borderColor: '#e8eaf0',
            borderWidth: 1,
            cornerRadius: 4,
            padding: 9,
            titleFont: {
              family: 'Lato',
              size: 12,
              weight: '700'
            },
            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },
            callbacks: {
              title(items) {
                const year = items?.[0]?.raw?.year;
                return Number.isFinite(Number(year)) ? String(year) : '';
              },
              label(context) {
                const valueText =
                  `${context.dataset.label}: ${formatInteger(context.raw?.y)}`;

                if (!yoyTrendOn) {
                  return valueText;
                }

                const growth =
                  latestAnnualisedGrowth(
                    currentRows(),
                    context.datasetIndex
                  );

                if (!Number.isFinite(growth)) {
                  return valueText;
                }

                const sign =
                  growth > 0
                    ? '+'
                    : growth < 0
                      ? '−'
                      : '';

                return `${valueText} · ${sign}${Math.abs(growth).toFixed(1)}% p.a.`;
              }
            }
          }
        },

        scales: {
          x: {
            type: 'linear',
            min: 0,
            max: 1,
            afterFit(scaleObject) {
              scaleObject.height = mobile ? 43 : 46;
            },
            border: {display: false},
            grid: {display: false, drawTicks: false},
            ticks: {display: false},
            title: {
              display: true,
              text: 'Year',
              color: '#151515',
              padding: {top: mobile ? 21 : 22},
              font: {
                family: 'Lato',
                size: mobile ? 12 : 13,
                weight: '700'
              }
            }
          },

          y: {
            min: scale.min,
            max: scale.max,
            afterFit(scaleObject) {
              scaleObject.width = mobile ? 61 : 69;
            },
            border: {display: false},
            grid: {display: false, drawTicks: false},
            ticks: {display: false},
            title: {
              display: true,
              text: 'Count',
              color: '#151515',
              padding: {bottom: 4},
              font: {
                family: 'Lato',
                size: mobile ? 12 : 13,
                weight: '700'
              }
            }
          }
        }
      };
    }

    function createChart() {
      yAxisTransition.from = viewScale();
      yAxisTransition.to = viewScale();
      yAxisTransition.progress = 1;
      xAxisTransition.fromRows = copyRows(currentRows());
      xAxisTransition.toRows = copyRows(currentRows());
      xAxisTransition.progress = 1;

      chart = new Chart(
        trendCanvas.getContext('2d'),
        {
          type: 'line',
          data: {
            datasets: buildDatasets()
          },
          options: baseChartOptions()
        }
      );
    }

    function syncChartDatasets(view = activeView) {
      if (!chart) return;

      const nextDatasets = buildDatasets(view);

      nextDatasets.forEach((nextDataset, index) => {
        const current = chart.data.datasets[index];
        if (!current) {
          chart.data.datasets[index] = nextDataset;
          return;
        }
        Object.assign(current, nextDataset);
      });

      chart.data.datasets.length = nextDatasets.length;
    }

    function syncChartScale(view = activeView) {
      if (!chart) return;
      const scale = viewScale(view);
      chart.options.scales.y.min = scale.min;
      chart.options.scales.y.max = scale.max;
    }

    function renderViewChange(previousView, nextView) {
      if (!chart) return;

      const duration = reducedMotion() ? 0 : VIEW_TRANSITION_MS;
      const previousScale = viewScale(previousView);
      const nextScale = viewScale(nextView);
      const previousRows = rowsForView(previousView);
      const nextRows = rowsForView(nextView);

      syncChartScale(nextView);
      syncChartDatasets(nextView);

      chart.options.animation.duration = duration;
      chart.options.animations.x.duration = duration;
      chart.options.animations.y.duration = duration;
      chart.update();

      startYAxisTransition(previousScale, nextScale, duration);
      startXAxisTransition(previousRows, nextRows, duration);
    }

    // ============================================================
    // RESPONSIVE / TOOLTIP DISMISSAL
    // ============================================================

    function refreshResponsiveLayout() {
      if (!chart) {
        requestAnimationFrame(() => {
          positionTabIndicator(false);
          updateTabScrollControls();
          updateLegendScrollControls();
          updateHeadingScrollControls();
        });
        return;
      }

      const mobile = window.innerWidth <= 430;
      chart.options.scales.y.afterFit = scaleObject => {
        scaleObject.width = mobile ? 61 : 69;
      };
      chart.options.scales.x.afterFit = scaleObject => {
        scaleObject.height = mobile ? 43 : 46;
      };
      chart.options.scales.x.title.font.size = mobile ? 12 : 13;
      chart.options.scales.y.title.font.size = mobile ? 12 : 13;
      chart.options.scales.x.title.padding.top = mobile ? 21 : 22;
      chart.resize();
      chart.draw();

      requestAnimationFrame(() => {
        positionTabIndicator(false);
        updateTabScrollControls();
        updateLegendScrollControls();
        updateHeadingScrollControls();
      });
    }

    const resizeObserver = 'ResizeObserver' in window
      ? new ResizeObserver(() => refreshResponsiveLayout())
      : null;

    if (resizeObserver) {
      resizeObserver.observe(app);
    } else {
      window.addEventListener('resize', refreshResponsiveLayout);
    }

    document.addEventListener('pointerdown', event => {
      if (!chart || event.target === trendCanvas) return;
      chart.setActiveElements([]);
      chart.tooltip?.setActiveElements([], {x:0,y:0});
      chart.update('none');
    });

    // ============================================================
    // EVENTS
    // ============================================================

    chartTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const nextView = tab.dataset.view;
        if (!nextView || nextView === activeView) return;

        const previousView = activeView;
        activeView = nextView;

        updateTabs();
        updateHeading();
        updateLegend(previousView, nextView);
        renderViewChange(previousView, nextView);
      });
    });

    yoyTrendToggle.addEventListener('click', () => {
      yoyTrendOn = !yoyTrendOn;
      updateYoyToggle();
      chart?.draw();
    });

    tabScrollLeft.addEventListener('click', () => scrollByAmount(tabList, -1));
    tabScrollRight.addEventListener('click', () => scrollByAmount(tabList, 1));
    tabList.addEventListener('scroll', updateTabScrollControls, {passive:true});

    legendScrollLeft.addEventListener('click', () => scrollByAmount(chartLegend, -1));
    legendScrollRight.addEventListener('click', () => scrollByAmount(chartLegend, 1));
    chartLegend.addEventListener('scroll', updateLegendScrollControls, {passive:true});

    headingScrollLeft.addEventListener('click', () => scrollByAmount(headingScrollViewport, -1));
    headingScrollRight.addEventListener('click', () => scrollByAmount(headingScrollViewport, 1));
    headingScrollViewport.addEventListener('scroll', updateHeadingScrollControls, {passive:true});

    // ============================================================
    // STARTUP
    // ============================================================

    async function initialise() {
      try {
        sourceData = await loadData();

        if (!validSourceData(sourceData)) {
          throw new Error('No valid workforce supply data were available.');
        }

        updateYoyToggle();
        updateTabs();
        updateHeading();
        renderLegendItems();
        createChart();
        hideLoadingState();

        requestAnimationFrame(() => {
          positionTabIndicator(false);
          updateTabScrollControls();
          updateLegendScrollControls();
          updateHeadingScrollControls();
        });
      } catch (error) {
        statusElement.textContent =
          'Workforce supply data could not be loaded.';
        app.classList.remove('is-loading');
        app.setAttribute('aria-busy', 'false');
        console.error(error);
      }
    }

    initialise();
  </script>
</body>
