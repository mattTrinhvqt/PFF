<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Practice Ownership</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js?v=1.2.11-20260917"></script>

  <style>
    /* Practice-ownership-specific components only. Shared PFF chart styling lives in pff_chart_core.js. */

    :root {
      --practice-corporate: #00b26f;
      --practice-independent: #5a3be7;
      --practice-other: #8b9099;
    }

    .chart-heading-row {
      align-items: flex-start;
    }

    .chart-heading {
      min-width: 0;
      max-width: calc(100% - 92px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
    }

    .chart-heading-detail:empty {
      margin-left: 0;
    }

    .heading-controls {
      margin-left: auto;
      padding-top: 2px;
    }

    .heading-controls.is-hidden {
      display: none;
    }

    .dimension-button {
      min-width: 98px;
      grid-template-columns: max-content minmax(30px, 1fr) 8px;
    }

    .dimension-menu {
      min-width: 176px;
    }

    .dimension-menu.is-phn {
      width: min(310px, calc(100vw - 24px));
      max-height: min(430px, calc(100vh - 92px));
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 113, 138, 0.34) transparent;
    }

    .dimension-option-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dimension-option-state {
      min-width: 28px;
      margin-left: auto;
      font-size: 9px;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .chart-options-row .legend-nav {
      min-width: 54px;
      flex: 1 1 auto;
    }

    .chart-scroll {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .chart-stage {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 100%;
    }

    .chart-shell canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      opacity: 1;
      will-change: opacity;
    }

    @media (max-width: 430px) {
      .chart-heading {
        max-width: calc(100% - 86px);
      }

      .dimension-button {
        min-width: 84px;
      }

      .dimension-menu.is-phn {
        width: min(282px, calc(100vw - 14px));
        max-height: min(390px, calc(100vh - 82px));
      }
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading practice ownership data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading practice ownership data…</div>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll practice ownership tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"

          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-view="all"

            >All</button>

            <button
              class="chart-tab"

              data-view="state"

            <button
              class="chart-tab"
              type="button"
              role="tab"

            >Rurality</button>

            <button
              class="chart-tab"

          </div>

          <button

            aria-label="Scroll practice ownership tabs right"

        </div>

        <div

        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>

      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 id="chartHeading" class="chart-heading">
          <span class="chart-heading-fixed">Practice ownership</span>
          <span id="chartHeadingDetail" class="chart-heading-detail"></span>
        </h2>

        <div id="headingControls" class="heading-controls is-hidden">
          <div id="dimensionControl" class="state-control">
            <button
              id="dimensionButton"
              class="state-button dimension-button"

              aria-expanded="false"

            >
              <span id="dimensionButtonLabel">States</span>
              <span id="dimensionButtonValue" class="state-button-value">All</span>
              <span class="menu-arrow" aria-hidden="true"></span>
            </button>

            <div id="dimensionMenu" class="state-menu dimension-menu" role="menu">
              <div id="dimensionMenuTitle" class="state-menu-title">Show states</div>

              <label class="state-option state-option-all">
                <input id="dimensionAll" type="checkbox" checked>
                <span class="state-option-box" aria-hidden="true"></span>
                <span id="dimensionAllLabel">All states</span>

              <div id="dimensionOptions"></div>

      <div class="chart-options-row">
        <div id="legendNav" class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll ownership legend left"
          >&#8249;</button>

          <div id="legendViewport" class="legend-viewport">
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Practice ownership legend"
            ></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll ownership legend right"
          >&#8250;</button>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <div id="chartScroll" class="chart-scroll is-pie">
          <div id="chartStage" class="chart-stage">
            <canvas

              aria-label="Practice ownership chart"
              tabindex="-1"
            ></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      spreadsheetId: '1v6nHeJDkbYF-Pan7OEDLLBhYLghuGxFVBoRX4ibuWSE',
      sheetName: '2026 Optom practice directory',
      sheetGid: '1196929681',
      sourceRange: 'B32:X',
      sourceColumnCount: 23,
      fetchTimeoutMs: 25000,
      spineTransitionMs: 220,
      columns: Object.freeze({
        practiceName: 0,
        state: 3,
        employerType: 10,
        rurality: 11,
        phn: 22
      })
    });

    const EMPLOYER_TYPES = Object.freeze([
      'Corporate',
      'Independent',
      'Other'
    ]);

    const EMPLOYER_COLOURS = Object.freeze({
      Corporate: '#00b26f',
      Independent: '#5a3be7',
      Other: '#8b9099'
    });

    const STATE_ORDER = Object.freeze([
      'NSW',
      'VIC',
      'QLD',
      'SA',
      'WA',
      'TAS',
      'NT',
      'ACT'
    ]);

    const STATE_NAMES = Object.freeze({
      NSW: 'New South Wales',
      VIC: 'Victoria',
      QLD: 'Queensland',
      SA: 'South Australia',
      WA: 'Western Australia',
      TAS: 'Tasmania',
      NT: 'Northern Territory',
      ACT: 'Australian Capital Territory'
    });

    const MMM_ORDER = Object.freeze([
      'MM1',
      'MM2',
      'MM3',
      'MM4',
      'MM5',
      'MM6',
      'MM7'
    ]);

    const PHN_ORDER = Object.freeze([
      'Central and Eastern Sydney',
      'Northern Sydney',
      'Western Sydney',
      'Nepean Blue Mountains',
      'South Western Sydney',
      'South Eastern NSW',
      'Western NSW',
      'Hunter New England and Central Coast',
      'North Coast',
      'Murrumbidgee',
      'North Western Melbourne',
      'Eastern Melbourne',
      'South Eastern Melbourne',
      'Gippsland',
      'Murray',
      'Western Victoria',
      'Brisbane North',
      'Brisbane South',
      'Gold Coast',
      'Darling Downs and West Moreton',
      'Western Queensland',
      'Central Queensland',
      'Northern Queensland',
      'Adelaide',
      'Country SA',
      'Perth North',
      'Perth South',
      'Country WA',
      'Tasmania',
      'Northern Territory',
      'Australian Capital Territory'
    ]);

    const PHN_STATE_CODES = Object.freeze([
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'VIC', 'VIC', 'VIC', 'VIC', 'VIC', 'VIC',
      'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD',
      'SA', 'SA',
      'WA', 'WA', 'WA',
      'TAS',
      'NT',
      'ACT'
    ]);

    const PHN_STATE_BY_NAME = Object.freeze(
      Object.fromEntries(
        PHN_ORDER.map((name, index) => [
          name,
          PHN_STATE_CODES[index]
        ])
      )
    );

    const LEGEND_ITEMS = Object.freeze(
      EMPLOYER_TYPES.map(type => ({
        label: type,
        colour: EMPLOYER_COLOURS[type],
        markerType: 'square'
      }))
    );

    const app = document.getElementById('app');
    const loadingState = document.getElementById('loadingState');
    const statusElement = document.getElementById('status');
    const dataSourceIndicator = document.getElementById('dataSourceIndicator');
    const dataSourceText = document.getElementById('dataSourceText');
    const tabList = document.getElementById('tabList');
    const tabScrollLeft = document.getElementById('tabScrollLeft');
    const tabScrollRight = document.getElementById('tabScrollRight');
    const chartHeading = document.getElementById('chartHeading');
    const chartHeadingDetail = document.getElementById('chartHeadingDetail');
    const headingControls = document.getElementById('headingControls');
    const dimensionControl = document.getElementById('dimensionControl');
    const dimensionButton = document.getElementById('dimensionButton');
    const dimensionButtonLabel = document.getElementById('dimensionButtonLabel');
    const dimensionButtonValue = document.getElementById('dimensionButtonValue');
    const dimensionMenu = document.getElementById('dimensionMenu');
    const dimensionMenuTitle = document.getElementById('dimensionMenuTitle');
    const dimensionAll = document.getElementById('dimensionAll');
    const dimensionAllLabel = document.getElementById('dimensionAllLabel');
    const dimensionOptions = document.getElementById('dimensionOptions');
    const chartShell = document.getElementById('chartShell');
    const chartScroll = document.getElementById('chartScroll');
    const chartStage = document.getElementById('chartStage');
    const chartCanvas = document.getElementById('practiceChart');
    const chartLegend = document.getElementById('chartLegend');
    const legendScrollLeft = document.getElementById('legendScrollLeft');
    const legendScrollRight = document.getElementById('legendScrollRight');

    let sourceRows = [];
    let chart = null;
    let activeView = 'all';
    let activeModel = null;
    let tabsController = null;
    let dimensionMenuController = null;
    let legendController = null;
    let responsiveController = null;
    let chartSummary = null;
    let spineTransitionFrame = null;

    const spineTransitionState = {
      active: false,
      left: NaN,
      right: NaN,
      top: NaN,
      bottom: NaN
    };

    const selectedByView = {
      state: new Set(),
      rurality: new Set(),
      phn: new Set()
    };

    const chartTransitionController =
      PFFCharts.createAnimationController();

    function normaliseEmployerType(value) {
      const text = PFF.cleanText(value).toLowerCase();

      if (!text) {
        return null;
      }

      if (
        text === 'corporate' ||
        text.startsWith('corporate ')
      ) {
        return 'Corporate';
      }

      if (
        text === 'independent' ||
        text.startsWith('independent ')
      ) {
        return 'Independent';
      }

      return 'Other';
    }

    function normaliseRurality(value) {
      const text = PFF.cleanText(value).toUpperCase();

      if (!text) {
        return null;
      }

      const mmmMatch = text.match(/\bM{2,3}\s*([1-7])\b/);

      if (mmmMatch) {
        return `MM${mmmMatch[1]}`;
      }

      const normalised = PFF.normaliseMMM?.(text);
      const fallbackMatch = String(normalised || '')
        .toUpperCase()
        .match(/\bM{2,3}\s*([1-7])\b/);

      return fallbackMatch
        ? `MM${fallbackMatch[1]}`
        : null;
    }

    function phnLookupKey(value) {
      return PFF.cleanText(value)
        .toLowerCase()
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    const PHN_CANONICAL_LOOKUP = new Map(
      PHN_ORDER.map(name => [
        phnLookupKey(name),
        name
      ])
    );

    function normalisePhn(value) {
      const text = PFF.cleanText(value);

      if (!text) {
        return null;
      }

      return PHN_CANONICAL_LOOKUP.get(
        phnLookupKey(text)
      ) || text;
    }

    function parseRows(table) {
      return (table?.rows || [])
        .map((rawRow, sourceIndex) => {
          const cells = rawRow?.c || [];
          const values = Array.from(
            { length: CONFIG.sourceColumnCount },
            (_, index) => PFF.cellValue(cells[index])
          );

          const practiceName = PFF.cleanText(
            values[CONFIG.columns.practiceName]
          );

          if (!practiceName) {
            return null;
          }

          return {
            sourceIndex,
            practiceName,
            state: PFF.normaliseState(
              values[CONFIG.columns.state]
            ),
            employerType: normaliseEmployerType(
              values[CONFIG.columns.employerType]
            ),
            rurality: normaliseRurality(
              values[CONFIG.columns.rurality]
            ),
            phn: normalisePhn(
              values[CONFIG.columns.phn]
            )
          };
        })
        .filter(Boolean);
    }

    function emptyCounts() {
      return {
        Corporate: 0,
        Independent: 0,
        Other: 0
      };
    }

    function groupKey(row, view) {
      if (view === 'all') {
        return 'All practices';
      }

      if (view === 'state') {
        return row.state;
      }

      if (view === 'rurality') {
        return row.rurality;
      }

      if (view === 'phn') {
        return row.phn;
      }

      return null;
    }

    function dominantState(rows) {
      const counts = new Map();

      rows.forEach(row => {
        if (!row.state) {
          return;
        }

        counts.set(
          row.state,
          (counts.get(row.state) || 0) + 1
        );
      });

      return [...counts.entries()]
        .sort((first, second) =>
          second[1] - first[1] ||
          first[0].localeCompare(second[0])
        )[0]?.[0] || null;
    }

    function phnStateCode(key, rows) {
      return PHN_STATE_BY_NAME[key] || dominantState(rows);
    }

    function groupOutlineColour(view, key, rows) {
      if (view === 'state') {
        return PFF.stateColours?.[key] || '#69718a';
      }

      if (view === 'rurality') {
        return PFF.mmmColours?.[key] || '#69718a';
      }

      if (view === 'phn') {
        const stateCode = phnStateCode(key, rows);
        return PFF.stateColours?.[stateCode] || '#6600ff';
      }

      return '#6600ff';
    }

    function availableValues(view) {
      const values = new Set();

      sourceRows.forEach(row => {
        if (!row.employerType) {
          return;
        }

        const key = groupKey(row, view);

        if (key) {
          values.add(key);
        }
      });

      if (view === 'state') {
        return STATE_ORDER.filter(value => values.has(value));
      }

      if (view === 'rurality') {
        return MMM_ORDER.filter(value => values.has(value));
      }

      if (view === 'phn') {
        const known = PHN_ORDER.filter(value => values.has(value));
        const knownSet = new Set(known);
        const unknown = [...values]
          .filter(value => !knownSet.has(value))
          .sort((first, second) =>
            first.localeCompare(second, 'en-AU', {
              sensitivity: 'base',
              numeric: true
            })
          );

        return [...known, ...unknown];
      }

      return [];
    }

    function initialiseSelections() {
      ['state', 'rurality', 'phn'].forEach(view => {
        selectedByView[view] = new Set(
          availableValues(view)
        );
      });
    }

    function buildModel(view = activeView) {
      const classifiedRows = sourceRows.filter(
        row => row.employerType
      );

      const groups = new Map();

      classifiedRows.forEach(row => {
        const key = groupKey(row, view);

        if (!key) {
          return;
        }

        if (
          view !== 'all' &&
          !selectedByView[view]?.has(key)
        ) {
          return;
        }

        if (!groups.has(key)) {
          groups.set(key, {
            key,
            rows: [],
            counts: emptyCounts()
          });
        }

        const group = groups.get(key);
        group.rows.push(row);
        group.counts[row.employerType] += 1;
      });

      let orderedGroups = [...groups.values()];

      orderedGroups.forEach(group => {
        group.total = EMPLOYER_TYPES.reduce(
          (sum, type) => sum + group.counts[type],
          0
        );

        group.proportions = Object.fromEntries(
          EMPLOYER_TYPES.map(type => [
            type,
            group.total > 0
              ? group.counts[type] / group.total * 100
              : 0
          ])
        );

        group.stateCode = view === 'phn'
          ? phnStateCode(group.key, group.rows)
          : view === 'state'
            ? group.key
            : null;

        group.outlineColour = groupOutlineColour(
          view,
          group.key,
          group.rows
        );
      });

      if (view === 'all') {
        orderedGroups = orderedGroups.filter(
          group => group.key === 'All practices'
        );
      } else if (view === 'state') {
        const order = new Map(
          STATE_ORDER.map((value, index) => [value, index])
        );

        orderedGroups.sort((first, second) =>
          (order.get(first.key) ?? 999) -
          (order.get(second.key) ?? 999)
        );
      } else if (view === 'rurality') {
        const order = new Map(
          MMM_ORDER.map((value, index) => [value, index])
        );

        orderedGroups.sort((first, second) =>
          (order.get(first.key) ?? 999) -
          (order.get(second.key) ?? 999)
        );
      } else if (view === 'phn') {
        const order = new Map(
          PHN_ORDER.map((value, index) => [value, index])
        );

        orderedGroups.sort((first, second) => {
          const firstOrder = order.get(first.key);
          const secondOrder = order.get(second.key);

          if (
            Number.isFinite(firstOrder) ||
            Number.isFinite(secondOrder)
          ) {
            return (
              (firstOrder ?? 9999) -
              (secondOrder ?? 9999)
            );
          }

          return first.key.localeCompare(
            second.key,
            'en-AU',
            {
              sensitivity: 'base',
              numeric: true
            }
          );
        });
      }

      return {
        view,
        groups: orderedGroups,
        labels: orderedGroups.map(group => group.key),
        totals: orderedGroups.map(group => group.total),
        outlineColours: orderedGroups.map(
          group => group.outlineColour
        )
      };
    }

    function formatPercent(value) {
      const numeric = Number(value);

      if (!Number.isFinite(numeric)) {
        return '—';
      }

      const rounded = Math.round(numeric * 10) / 10;
      const text = Number.isInteger(rounded)
        ? String(Math.round(rounded))
        : rounded.toFixed(1).replace(/\.0$/, '');

      return `${text}%`;
    }

    function headingDetailForView(view) {
      if (view === 'state') {
        return 'by state';
      }

      if (view === 'rurality') {
        return 'by rurality';
      }

      if (view === 'phn') {
        return 'by PHN';
      }

      return '';
    }

    function headingForView(view) {
      const detail = headingDetailForView(view);
      return detail
        ? `Practice ownership ${detail}`
        : 'Practice ownership';
    }

    function selectionLabels(view) {
      if (view === 'state') {
        return {
          button: 'States',
          title: 'Show states',
          all: 'All states'
        };
      }

      if (view === 'rurality') {
        return {
          button: 'MMM',
          title: 'Show rurality',
          all: 'All MMM'
        };
      }

      return {
        button: 'PHNs',
        title: 'Show PHNs',
        all: 'All PHNs'
      };
    }

    function selectedSummary(view) {
      const available = availableValues(view);
      const selected = available.filter(
        value => selectedByView[view]?.has(value)
      );

      if (selected.length === available.length) {
        return 'All';
      }

      if (selected.length === 0) {
        return 'None';
      }

      if (selected.length === 1) {
        if (view === 'phn') {
          return '1';
        }

        return selected[0];
      }

      return String(selected.length);
    }

    function optionColour(view, value) {
      if (view === 'state') {
        return PFF.stateColours?.[value] || '#151515';
      }

      if (view === 'rurality') {
        return PFF.mmmColours?.[value] || '#151515';
      }

      const stateCode = PHN_STATE_BY_NAME[value];
      return PFF.stateColours?.[stateCode] || '#151515';
    }

    function buildDimensionMenu() {
      const visible = activeView !== 'all';
      headingControls.classList.toggle('is-hidden', !visible);

      if (!visible) {
        dimensionMenuController?.closeMenu?.();
        return;
      }

      const labels = selectionLabels(activeView);
      const available = availableValues(activeView);
      const selected = selectedByView[activeView];

      dimensionButtonLabel.textContent = labels.button;
      dimensionMenuTitle.textContent = labels.title;
      dimensionAllLabel.textContent = labels.all;
      dimensionMenu.classList.toggle(
        'is-phn',
        activeView === 'phn'
      );

      dimensionOptions.textContent = '';

      available.forEach(value => {
        const label = document.createElement('label');
        label.className = 'state-option';

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = selected.has(value);
        input.dataset.dimensionValue = value;

        const box = document.createElement('span');
        box.className = 'state-option-box';
        box.setAttribute('aria-hidden', 'true');

        const text = document.createElement('span');
        text.className = activeView === 'phn'
          ? 'dimension-option-text'
          : 'state-option-code';
        text.textContent = value;
        text.style.color = activeView === 'phn'
          ? '#151515'
          : optionColour(activeView, value);

        if (activeView === 'state') {
          text.title = STATE_NAMES[value] || value;
        }

        label.append(input, box, text);

        if (activeView === 'phn') {
          const stateCode =
            PHN_STATE_BY_NAME[value] ||
            dominantState(
              sourceRows.filter(row => row.phn === value)
            );

          if (stateCode) {
            const stateText = document.createElement('span');
            stateText.className = 'dimension-option-state';
            stateText.textContent = stateCode;
            stateText.style.color =
              PFF.stateColours?.[stateCode] || '#69718a';
            label.appendChild(stateText);
          }
        }

        dimensionOptions.appendChild(label);
      });

      syncDimensionMenuUi(false);
    }

    function syncDimensionMenuUi(animate = true) {
      if (activeView === 'all') {
        return;
      }

      const available = availableValues(activeView);
      const selected = selectedByView[activeView];
      const selectedCount = available.filter(
        value => selected.has(value)
      ).length;

      dimensionAll.checked =
        selectedCount === available.length;
      dimensionAll.indeterminate =
        selectedCount > 0 &&
        selectedCount < available.length;

      dimensionOptions
        .querySelectorAll('input[data-dimension-value]')
        .forEach(input => {
          input.checked = selected.has(
            input.dataset.dimensionValue
          );
        });

      const nextValue = selectedSummary(activeView);

      if (!animate) {
        dimensionButtonValue.textContent = nextValue;
        return;
      }

      PFF.animateHeading({
        fixed: dimensionButtonValue,
        fixedText: nextValue,
        duration: 180
      });
    }

    function updateStageGeometry(model) {
      const pie = model.view === 'all';
      chartScroll.classList.toggle('is-pie', pie);

      // Keep every tab within the same chart-shell height. PHN labels and
      // bars scale to fit rather than creating an internal vertical scroll.
      chartStage.style.height = '100%';
      chartStage.style.minHeight = '100%';
      chartScroll.scrollTop = 0;
    }

    function labelTextColour(type) {
      return type === 'Other'
        ? '#151515'
        : '#ffffff';
    }

    function renderedBarBounds(chartInstance, index) {
      let left = Number.POSITIVE_INFINITY;
      let right = Number.NEGATIVE_INFINITY;
      let y = NaN;
      let height = 0;

      chartInstance.data.datasets.forEach((dataset, datasetIndex) => {
        const meta = chartInstance.getDatasetMeta(datasetIndex);
        const element = meta?.data?.[index];

        if (!element || element.skip) {
          return;
        }

        const properties = element.getProps(
          ['x', 'base', 'y', 'height'],
          true
        );

        if (
          !Number.isFinite(properties.x) ||
          !Number.isFinite(properties.base) ||
          !Number.isFinite(properties.y)
        ) {
          return;
        }

        left = Math.min(left, properties.x, properties.base);
        right = Math.max(right, properties.x, properties.base);
        y = properties.y;
        height = Math.max(
          height,
          Number(properties.height) || 0
        );
      });

      if (
        !Number.isFinite(left) ||
        !Number.isFinite(right) ||
        !Number.isFinite(y) ||
        height <= 0
      ) {
        return null;
      }

      return {
        left,
        right,
        y,
        height
      };
    }

    const barOutlinePlugin = {
      id: 'pffPracticeGroupOutline',

      afterDatasetsDraw(chartInstance) {
        if (
          activeView === 'all' ||
          !activeModel?.groups?.length ||
          !chartInstance.chartArea
        ) {
          return;
        }

        const context = chartInstance.ctx;

        context.save();
        context.lineWidth = 1.05;
        context.lineJoin = 'round';

        activeModel.groups.forEach((group, index) => {
          const bounds = renderedBarBounds(
            chartInstance,
            index
          );

          if (!bounds) {
            return;
          }

          const top = bounds.y - bounds.height / 2;
          const width = Math.max(
            0,
            bounds.right - bounds.left
          );
          const height = Math.max(0, bounds.height);
          const radius = Math.min(2, height / 2);

          context.beginPath();

          if (typeof context.roundRect === 'function') {
            context.roundRect(
              bounds.left + 0.5,
              top + 0.5,
              Math.max(0, width - 1),
              Math.max(0, height - 1),
              radius
            );
          } else {
            context.rect(
              bounds.left + 0.5,
              top + 0.5,
              Math.max(0, width - 1),
              Math.max(0, height - 1)
            );
          }

          context.strokeStyle =
            group.outlineColour || '#69718a';

          context.stroke();
        });

        context.restore();
      }
    };

    function copyChartArea(area) {
      if (!area) {
        return null;
      }

      const copy = {
        left: Number(area.left),
        right: Number(area.right),
        top: Number(area.top),
        bottom: Number(area.bottom)
      };

      return Object.values(copy).every(Number.isFinite)
        ? copy
        : null;
    }

    function setSpineGeometry(area) {
      const geometry = copyChartArea(area);

      if (!geometry) {
        return;
      }

      spineTransitionState.left = geometry.left;
      spineTransitionState.right = geometry.right;
      spineTransitionState.top = geometry.top;
      spineTransitionState.bottom = geometry.bottom;
    }

    function animateSpineGeometry(
      fromArea,
      toArea,
      duration = CONFIG.spineTransitionMs
    ) {
      if (spineTransitionFrame !== null) {
        cancelAnimationFrame(spineTransitionFrame);
        spineTransitionFrame = null;
      }

      const from = copyChartArea(fromArea);
      const to = copyChartArea(toArea);

      if (!from || !to) {
        spineTransitionState.active = false;
        setSpineGeometry(to || from);
        chart?.draw();
        return;
      }

      spineTransitionState.active = true;
      setSpineGeometry(from);

      if (PFF.reducedMotion() || duration <= 0) {
        setSpineGeometry(to);
        spineTransitionState.active = false;
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );
        const eased = PFFCharts.easeInOutCubic(progress);

        spineTransitionState.left =
          from.left + (to.left - from.left) * eased;
        spineTransitionState.right =
          from.right + (to.right - from.right) * eased;
        spineTransitionState.top =
          from.top + (to.top - from.top) * eased;
        spineTransitionState.bottom =
          from.bottom + (to.bottom - from.bottom) * eased;

        chart?.draw();

        if (progress < 1) {
          spineTransitionFrame = requestAnimationFrame(frame);
        } else {
          spineTransitionFrame = null;
          setSpineGeometry(to);
          spineTransitionState.active = false;
          chart?.draw();
        }
      }

      spineTransitionFrame = requestAnimationFrame(frame);
    }

    const constantSpinePlugin = {
      id: 'pffPracticeConstantSpines',

      afterDatasetsDraw(chartInstance) {
        if (activeView === 'all') {
          return;
        }

        const area = chartInstance.chartArea;

        if (!area) {
          return;
        }

        const left =
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.left)
            ? spineTransitionState.left
            : area.left;

        const right =
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.right)
            ? spineTransitionState.right
            : area.right;

        const top =
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.top)
            ? spineTransitionState.top
            : area.top;

        const bottom =
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.bottom)
            ? spineTransitionState.bottom
            : area.bottom;

        const context = chartInstance.ctx;

        context.save();
        context.strokeStyle = '#151515';
        context.lineWidth = 1;
        context.lineCap = 'butt';

        context.beginPath();
        context.moveTo(left, bottom);
        context.lineTo(right, bottom);
        context.stroke();

        context.beginPath();
        context.moveTo(left, top);
        context.lineTo(left, bottom);
        context.stroke();

        context.restore();
      }
    };

    function currentAxisGeometry(chartInstance) {
      const area = chartInstance?.chartArea;

      if (!area) {
        return null;
      }

      return {
        left:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.left)
            ? spineTransitionState.left
            : area.left,
        right:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.right)
            ? spineTransitionState.right
            : area.right,
        top:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.top)
            ? spineTransitionState.top
            : area.top,
        bottom:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.bottom)
            ? spineTransitionState.bottom
            : area.bottom
      };
    }

    function xAxisPixel(geometry, value) {
      return geometry.left +
        (geometry.right - geometry.left) *
        (Number(value) / 100);
    }

    const barAxisPresentationPlugin = {
      id: 'pffPracticeBarAxisPresentation',

      beforeDatasetsDraw(chartInstance) {
        if (activeView === 'all') {
          return;
        }

        const geometry = currentAxisGeometry(chartInstance);

        if (!geometry) {
          return;
        }

        const context = chartInstance.ctx;

        context.save();
        context.lineCap = 'butt';

        for (let value = 0; value <= 100; value += 10) {
          const x = xAxisPixel(geometry, value);
          const major = value % 20 === 0;

          context.strokeStyle = major
            ? 'rgba(105, 113, 138, 0.075)'
            : 'rgba(105, 113, 138, 0.035)';
          context.lineWidth = major ? 1 : 0.7;

          context.beginPath();
          context.moveTo(Math.round(x) + 0.5, geometry.top);
          context.lineTo(Math.round(x) + 0.5, geometry.bottom);
          context.stroke();
        }

        context.restore();
      },

      afterDraw(chartInstance) {
        if (activeView === 'all') {
          return;
        }

        const geometry = currentAxisGeometry(chartInstance);

        if (!geometry) {
          return;
        }

        const context = chartInstance.ctx;
        const mobile = PFF.mobileLayout();
        const tickFontSize = mobile ? 9 : 10;
        const titleFontSize = mobile ? 12 : 13;

        context.save();
        context.lineCap = 'butt';
        context.strokeStyle = '#151515';

        const firstDatasetMeta = chartInstance.getDatasetMeta(0);
        const yLabelPadding = activeView === 'phn' ? 3 : 5;

        context.fillStyle = '#151515';
        context.textAlign = 'right';
        context.textBaseline = 'middle';

        (activeModel?.labels || []).forEach((label, index) => {
          const bar = firstDatasetMeta?.data?.[index];

          if (!Number.isFinite(bar?.y)) {
            return;
          }

          let fontSize;

          if (activeView === 'phn') {
            fontSize = fittedPhnFontSize(
              String(label || ''),
              phnAxisBaseFontSize()
            );
          } else {
            fontSize = PFF.mobileLayout() ? 9 : 10;
          }

          context.font = `400 ${fontSize}px Lato, sans-serif`;
          context.fillText(
            String(label || ''),
            geometry.left - yLabelPadding,
            bar.y
          );
        });

        for (let value = 0; value <= 100; value += 10) {
          const x = xAxisPixel(geometry, value);
          const major = value % 20 === 0;
          const tickLength = major ? 6 : 2;

          context.beginPath();
          context.lineWidth = major ? 1 : 0.7;
          context.moveTo(Math.round(x) + 0.5, geometry.bottom);
          context.lineTo(
            Math.round(x) + 0.5,
            geometry.bottom + tickLength
          );
          context.stroke();
        }

        context.fillStyle = '#151515';
        context.font = `400 ${tickFontSize}px Lato, sans-serif`;
        context.textBaseline = 'top';

        for (let value = 0; value <= 100; value += 20) {
          const x = xAxisPixel(geometry, value);

          context.textAlign = value === 0
            ? 'left'
            : value === 100
              ? 'right'
              : 'center';

          context.fillText(
            `${value}%`,
            x,
            geometry.bottom + 9
          );
        }

        context.font = `700 ${titleFontSize}px Lato, sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'alphabetic';
        context.fillText(
          'Proportion of practices (%)',
          geometry.left + (geometry.right - geometry.left) / 2,
          geometry.bottom + 42
        );

        context.restore();
      }
    };

    const phnStateSeparatorsPlugin = {
      id: 'pffPracticePhnStateSeparators',

      beforeDatasetsDraw(chartInstance) {
        if (
          activeView !== 'phn' ||
          !activeModel?.groups?.length
        ) {
          return;
        }

        const meta = chartInstance.getDatasetMeta(0);

        if (!meta?.data || meta.data.length < 2) {
          return;
        }

        const context = chartInstance.ctx;
        const area = chartInstance.chartArea;

        context.save();
        context.strokeStyle = 'rgba(105, 113, 138, 0.075)';
        context.lineWidth = 1;
        context.setLineDash([2, 3]);

        for (
          let index = 0;
          index < activeModel.groups.length - 1;
          index += 1
        ) {
          const currentState = activeModel.groups[index]?.stateCode;
          const nextState = activeModel.groups[index + 1]?.stateCode;

          if (!currentState || currentState === nextState) {
            continue;
          }

          const firstBar = meta.data[index];
          const secondBar = meta.data[index + 1];

          if (
            !Number.isFinite(firstBar?.y) ||
            !Number.isFinite(secondBar?.y)
          ) {
            continue;
          }

          const y = (firstBar.y + secondBar.y) / 2;

          context.beginPath();
          context.moveTo(0, Math.round(y) + 0.5);
          context.lineTo(area.right, Math.round(y) + 0.5);
          context.stroke();
        }

        context.restore();
      }
    };

    function fitFontSize(
      context,
      text,
      maximumWidth,
      preferredSize,
      minimumSize
    ) {
      if (
        !text ||
        !Number.isFinite(maximumWidth) ||
        maximumWidth <= 0
      ) {
        return minimumSize;
      }

      context.font = `700 ${preferredSize}px Lato, sans-serif`;
      const measured = context.measureText(text).width;

      if (!Number.isFinite(measured) || measured <= maximumWidth) {
        return preferredSize;
      }

      return Math.max(
        minimumSize,
        preferredSize * maximumWidth / measured
      );
    }

    const valueLabelsPlugin = {
      id: 'pffPracticeValueLabels',

      afterDatasetsDraw(chartInstance) {
        if (!activeModel?.groups?.length) {
          return;
        }

        const context = chartInstance.ctx;
        const mobile = PFF.mobileLayout();

        context.save();
        context.textAlign = 'center';
        context.textBaseline = 'middle';

        if (activeView === 'all') {
          const group = activeModel.groups[0];
          const meta = chartInstance.getDatasetMeta(0);

          meta.data.forEach((arc, index) => {
            const type = EMPLOYER_TYPES[index];
            const targetCount = group?.counts?.[type] || 0;
            const targetProportion = group?.proportions?.[type] || 0;

            if (!targetCount || !arc) {
              return;
            }

            const properties = arc.getProps(
              [
                'x',
                'y',
                'startAngle',
                'endAngle',
                'innerRadius',
                'outerRadius'
              ],
              true
            );

            const angle =
              (properties.startAngle + properties.endAngle) / 2;
            const span = Math.max(
              0,
              properties.endAngle - properties.startAngle
            );
            const currentProportion =
              span / (Math.PI * 2) * 100;
            const progress = targetProportion > 0
              ? Math.min(1, currentProportion / targetProportion)
              : 1;
            const currentCount = Math.round(
              targetCount * progress
            );
            const radius =
              properties.innerRadius +
              (properties.outerRadius - properties.innerRadius) * 0.62;
            const x = properties.x + Math.cos(angle) * radius;
            const y = properties.y + Math.sin(angle) * radius;
            const mainText = formatPercent(currentProportion);
            const countText = `(${PFF.formatInteger(currentCount)})`;
            const mainSize = mobile ? 12 : 15;
            const countSize = mobile ? 8.5 : 10.5;

            context.fillStyle = labelTextColour(type);
            context.font = `700 ${mainSize}px Lato, sans-serif`;
            context.fillText(
              mainText,
              x,
              y - countSize * 0.55
            );

            context.font = `400 ${countSize}px Lato, sans-serif`;
            context.fillText(
              countText,
              x,
              y + mainSize * 0.53
            );
          });

          context.restore();
          return;
        }

        const xScale = chartInstance.scales.x;

        chartInstance.data.datasets.forEach((dataset, datasetIndex) => {
          const meta = chartInstance.getDatasetMeta(datasetIndex);
          const type = dataset.employerType;

          meta.data.forEach((bar, dataIndex) => {
            const group = activeModel.groups[dataIndex];
            const targetCount = group?.counts?.[type] || 0;
            const targetProportion = group?.proportions?.[type] || 0;

            if (!targetCount || !bar) {
              return;
            }

            const properties = bar.getProps(
              ['x', 'base', 'y', 'height'],
              true
            );

            if (
              !Number.isFinite(properties.x) ||
              !Number.isFinite(properties.base) ||
              !Number.isFinite(properties.y)
            ) {
              return;
            }

            const centreX =
              (properties.x + properties.base) / 2;
            const width = Math.abs(
              properties.x - properties.base
            );
            const currentProportion = Math.abs(
              xScale.getValueForPixel(properties.x) -
              xScale.getValueForPixel(properties.base)
            );
            const progress = targetProportion > 0
              ? Math.min(1, currentProportion / targetProportion)
              : 1;
            const currentCount = Math.round(
              targetCount * progress
            );
            const mainText = formatPercent(currentProportion);
            const countText = `(${PFF.formatInteger(currentCount)})`;

            context.fillStyle = labelTextColour(type);

            if (activeView === 'phn') {
              const combinedText = `${mainText} ${countText}`;
              const combinedSize = fitFontSize(
                context,
                combinedText,
                Math.max(1, width - 3),
                mobile ? 7.0 : 7.8,
                4.4
              );

              context.font = `700 ${combinedSize}px Lato, sans-serif`;
              context.fillText(
                combinedText,
                centreX,
                properties.y
              );

              return;
            }

            const preferredMain = mobile ? 8.2 : 9.3;
            const preferredCount = mobile ? 6.4 : 7.2;
            const mainSize = fitFontSize(
              context,
              mainText,
              Math.max(1, width - 4),
              preferredMain,
              4.8
            );
            const countSize = fitFontSize(
              context,
              countText,
              Math.max(1, width - 4),
              preferredCount,
              4.6
            );
            const lineGap = Math.max(
              3.2,
              Math.min(
                Number(properties.height) * 0.24,
                4.4
              )
            );

            context.font = `700 ${mainSize}px Lato, sans-serif`;
            context.fillText(
              mainText,
              centreX,
              properties.y - lineGap
            );

            context.font = `400 ${countSize}px Lato, sans-serif`;
            context.fillText(
              countText,
              centreX,
              properties.y + lineGap
            );
          });
        });

        context.restore();
      }
    };

    function pieDataset(model) {

      };

        ),

        ),

          group => group.counts[type]
        ),

      }));

        footerFont: {

          weight: '400'
        },

            return items?.[0]?.label || '';

    function barTooltipOptions(model) {
      return PFFCharts.tooltipOptions({
        mode: 'index',
        axis: 'y',
        intersect: false,
        position: 'nearest',
        padding: 9,
        bodySpacing: 0,
        footerColor: '#69718a',
        footerMarginTop: 4,

          family: 'Lato',

          weight: '400'
        },

        },

        callbacks: {
          title(items) {
            const index = items?.[0]?.dataIndex;
            return model.groups?.[index]?.key || '';
          },

          label(item) {
            const group = model.groups?.[item.dataIndex];

            if (!group) {

              );

              }
            });

            return lines;
          },

          footer(items) {
            const index = items?.[0]?.dataIndex;
            const total = model.groups?.[index]?.total || 0;

    function phnAxisWidth() {
      if (!PFF.mobileLayout()) {
        return 186;
      }

      return Math.round(
        Math.max(
          84,
          Math.min(
            140,
            window.innerWidth / 3
          )
        )
      );
    }

    function phnAxisBaseFontSize() {
      const rows = Math.max(
        1,
        activeModel?.groups?.length || 1
      );
      const height = Math.max(
        220,
        chartCanvas.clientHeight || 420
      );
      const rowSpacing = Math.max(
        1,
        (height - 42) / rows
      );
      const cap = PFF.mobileLayout() ? 9.2 : 10.2;

      return Math.max(
        5.8,
        Math.min(cap, rowSpacing * 0.76)
      );
    }

    function fittedPhnFontSize(label, baseSize) {
      const text = String(label || '');

      if (!text) {
        return baseSize;
      }

      const availableWidth = Math.max(
        1,
        phnAxisWidth() - 10
      );
      const context = chartCanvas.getContext('2d');

      context.save();
      context.font = `400 ${baseSize}px Lato, sans-serif`;
      const measuredWidth = context.measureText(text).width;
      context.restore();

      if (
        !Number.isFinite(measuredWidth) ||
        measuredWidth <= availableWidth
      ) {
        return baseSize;
      }

      return Math.max(
        5.1,
        Math.min(
          baseSize,
          baseSize * availableWidth / measuredWidth
        )
      );
    }

    function handleChartClick(event, _elements, activeChart) {
      if (!activeChart?.tooltip) {
        return;
      }

      const nativeEvent = event?.native || event;
      const isPie = activeView === 'all';
      const mode = isPie ? 'nearest' : 'index';
      const axis = isPie ? 'xy' : 'y';

      const activeElements = activeChart.getElementsAtEventForMode(
        nativeEvent,
        mode,
        {
          axis,
          intersect: true
        },
        false
      );

      if (!activeElements.length) {
        activeChart.tooltip.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

        activeChart.update('none');
        return;
      }

      activeChart.tooltip.setActiveElements(
        activeElements,
        {
          x: Number.isFinite(event?.x) ? event.x : 0,
          y: Number.isFinite(event?.y) ? event.y : 0
        }
      );

      activeChart.update('none');
    }

    function pieOptions(model) {
      return PFFCharts.baseChartOptions({
        interaction: {
          mode: 'nearest',
          intersect: true
        },
        onClick: handleChartClick,
        layout: {
          autoPadding: false,
          padding: {
            top: 8,
            right: 10,
            bottom: 8,
            left: 10
          }
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: overallTooltipOptions(model)
        }
      });
    }

    function barOptions(model) {
      return PFFCharts.baseChartOptions({
        indexAxis: 'y',
        interaction: {
          mode: 'index',
          axis: 'y',
          intersect: true,
          includeInvisible: false
        },
        onClick: handleChartClick,
        layout: {
          autoPadding: false,
          padding: {
            top: activeView === 'phn' ? 2 : 6,
            right: 7,
            bottom: 0,
            left: 0
          }
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: barTooltipOptions(model)
        },
        scales: {
          x: {
            type: 'linear',
            stacked: true,
            beginAtZero: true,
            min: 0,
            max: 100,
            afterFit(scale) {
              scale.height = PFF.mobileLayout() ? 50 : 48;
            },
            afterBuildTicks(scale) {
              scale.ticks = Array.from(
                { length: 11 },
                (_, index) => ({
                  value: index * 10
                })
              );
            },
            title: {
              display: false
            },
            ticks: {
              display: false,
              autoSkip: false
            },
            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },
            border: {
              display: false
            }
          },
          y: {
            stacked: true,
            offset: true,
            afterFit(scale) {
              if (activeView === 'phn') {
                scale.width = phnAxisWidth();
                return;
              }

              scale.width = PFF.mobileLayout() ? 60 : 72;
            },
            ticks: {
              display: false,
              color: '#151515',
              autoSkip: false,
              padding: activeView === 'phn' ? 3 : 5,
              font(context) {
                if (activeView !== 'phn') {
                  return {
                    family: 'Lato',
                    size: PFF.mobileLayout() ? 9 : 10,
                    weight: '400',
                    lineHeight: 1
                  };
                }

                const rawLabel = context?.tick?.label;
                const label = Array.isArray(rawLabel)
                  ? rawLabel.join(' ')
                  : String(rawLabel ?? '');
                const baseSize = phnAxisBaseFontSize();

                return {
                  family: 'Lato',
                  size: fittedPhnFontSize(label, baseSize),
                  weight: '400',
                  lineHeight: 1
                };
              }
            },
            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },
            border: {
              display: false
            }
          }
        }
      });
    }

    function createChart(model, animate = true) {
      activeModel = model;
      updateStageGeometry(model);

      const isPie = model.view === 'all';

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: isPie ? 'pie' : 'bar',
          data: isPie
            ? {
                labels: EMPLOYER_TYPES,
                datasets: [pieDataset(model)]
              }
            : {
                labels: model.labels,
                datasets: barDatasets(model)
              },
          options: isPie
            ? pieOptions(model)
            : barOptions(model),
          plugins: isPie
            ? [valueLabelsPlugin]
            : [
                phnStateSeparatorsPlugin,
                barOutlinePlugin,
                valueLabelsPlugin,
                constantSpinePlugin,
                barAxisPresentationPlugin
              ]
        }
      );

      if (!isPie) {
        setSpineGeometry(chart.chartArea);
      }

      if (!animate || PFF.reducedMotion()) {
        chartCanvas.style.opacity = '1';
      }
    }

    function updateBarChart(model, animate = true) {
      const previousArea = copyChartArea(chart?.chartArea);

      if (previousArea) {
        spineTransitionState.active =
          animate && !PFF.reducedMotion();
        setSpineGeometry(previousArea);
      }

      activeModel = model;
      updateStageGeometry(model);

      chart.data.labels = model.labels;

      chart.data.datasets.forEach((dataset, index) => {
        const type = EMPLOYER_TYPES[index];

        dataset.data = model.groups.map(
          group => group.proportions[type]
        );

        dataset._counts = model.groups.map(
          group => group.counts[type]
        );

        dataset._proportions = model.groups.map(
          group => group.proportions[type]
        );

        dataset.barPercentage = activeView === 'phn'
          ? 0.92
          : 0.78;

        dataset.categoryPercentage = activeView === 'phn'
          ? 0.94
          : 0.82;
      });

      chart.options.layout.padding.top =
        activeView === 'phn' ? 2 : 6;

      chart.options.scales.y.afterFit = scale => {
        if (activeView === 'phn') {
          scale.width = phnAxisWidth();
          return;
        }

        scale.width = PFF.mobileLayout() ? 60 : 72;
      };

      chart.options.scales.y.ticks.padding =
        activeView === 'phn' ? 3 : 5;

      chart.options.scales.y.ticks.font = context => {
        if (activeView !== 'phn') {
          return {
            family: 'Lato',
            size: PFF.mobileLayout() ? 9 : 10,
            weight: '400',
            lineHeight: 1
          };
        }

        const rawLabel = context?.tick?.label;
        const label = Array.isArray(rawLabel)
          ? rawLabel.join(' ')
          : String(rawLabel ?? '');
        const baseSize = phnAxisBaseFontSize();

        return {
          family: 'Lato',
          size: fittedPhnFontSize(label, baseSize),
          weight: '400',
          lineHeight: 1
        };
      };

      chart.options.plugins.tooltip =
        barTooltipOptions(model);

      chart.update(
        animate && !PFF.reducedMotion()
          ? undefined
          : 'none'
      );

      const nextArea = copyChartArea(chart.chartArea);

      if (
        animate &&
        !PFF.reducedMotion() &&
        previousArea &&
        nextArea
      ) {
        animateSpineGeometry(
          previousArea,
          nextArea,
          CONFIG.spineTransitionMs
        );
      } else {
        spineTransitionState.active = false;
        setSpineGeometry(nextArea || previousArea);
        chart.draw();
      }
    }

    function updatePieChart(model) {
      activeModel = model;
      updateStageGeometry(model);

      const dataset = chart.data.datasets[0];
      const nextDataset = pieDataset(model);

      dataset.data = nextDataset.data;
      dataset._counts = nextDataset._counts;
      dataset._proportions = nextDataset._proportions;

      chart.options.plugins.tooltip =
        overallTooltipOptions(model);

      chart.update();
    }

    function replaceChart(model) {
      const finishCreate = () => {
        chart?.destroy();
        chart = null;
        createChart(model, true);

        chartCanvas.style.opacity = '0';

        chartTransitionController.run({
          duration: PFF.defaults.microTransitionMs,
          easing: PFFCharts.easeOutCubic,
          onFrame(progress) {
            chartCanvas.style.opacity = String(progress);
          },
          onComplete() {
            chartCanvas.style.opacity = '1';
          }
        });
      };

      if (
        !chart ||
        PFF.reducedMotion()
      ) {
        finishCreate();
        return;
      }

      chartTransitionController.run({
        duration: PFF.defaults.microTransitionMs,
        easing: PFFCharts.easeInOutCubic,
        onFrame(progress) {
          chartCanvas.style.opacity = String(1 - progress);
        },
        onComplete: finishCreate
      });
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const model = activeModel;

      if (!model) {
        return;
      }

      const totalShown = model.groups.reduce(
        (sum, group) => sum + group.total,
        0
      );

      PFFCharts.updateChartSummary(
        `${headingForView(activeView)}. ${model.groups.length} groups shown, containing ${PFF.formatInteger(totalShown)} classified practice rows.`,
        chartSummary
      );
    }

    function renderView({ animate = true } = {}) {
      const model = buildModel(activeView);
      const desiredType = activeView === 'all'
        ? 'pie'
        : 'bar';
      const currentType = chart?.config?.type || null;

      const nextHeadingDetail = headingDetailForView(activeView);

      if (!animate || PFF.reducedMotion()) {
        chartHeadingDetail.textContent = nextHeadingDetail;
      } else {
        PFF.animateTextChange(
          chartHeadingDetail,
          nextHeadingDetail,
          {
            fadeOutMs: 170,
            fadeInMs: 260
          }
        );
      }

      buildDimensionMenu();

      if (!chart) {
        createChart(model, false);
        updateAccessibleSummary();
        return;
      }

      if (currentType !== desiredType) {
        replaceChart(model);
        window.setTimeout(
          updateAccessibleSummary,
          PFF.defaults.microTransitionMs + 20
        );
        return;
      }

      if (desiredType === 'pie') {
        updatePieChart(model);
        updateAccessibleSummary();
        return;
      }

      updateBarChart(model, animate);
      updateAccessibleSummary();
    }

    function configureControls() {
      tabsController = PFF.setupTabs({
        tabList,
        tabs: tabList.querySelectorAll('.chart-tab'),
        valueAttribute: 'view',
        initialValue: activeView,
        leftButton: tabScrollLeft,
        rightButton: tabScrollRight,
        onChange(value) {
          activeView = value;
          dimensionMenuController?.closeMenu?.();
          renderView({ animate: true });
        }
      });

      dimensionMenuController = PFF.setupMenu({
        menu: dimensionControl,
        button: dimensionButton,
        panel: dimensionMenu,
        focusOnOpen: false
      });

      dimensionAll.addEventListener('change', () => {
        if (activeView === 'all') {
          return;
        }

        const available = availableValues(activeView);
        selectedByView[activeView] = dimensionAll.checked
          ? new Set(available)
          : new Set();

        syncDimensionMenuUi(true);
        renderView({ animate: true });
      });

      dimensionOptions.addEventListener('change', event => {
        const input = event.target.closest(
          'input[data-dimension-value]'
        );

        if (!input || activeView === 'all') {
          return;
        }

        const value = input.dataset.dimensionValue;
        const selected = selectedByView[activeView];

        if (input.checked) {
          selected.add(value);
        } else {
          selected.delete(value);
        }

        syncDimensionMenuUi(true);
        renderView({ animate: true });
      });

      legendController = PFFCharts.setupDisplayLegend({
        legend: chartLegend,
        leftButton: legendScrollLeft,
        rightButton: legendScrollRight
      });

      legendController.update(
        LEGEND_ITEMS,
        false
      );

      responsiveController = PFFCharts.createResponsiveController({
        getChart: () => chart,
        observe: [app, chartShell],
        applyResponsiveChartOptions: false,
        onRefresh() {
          if (!chart || !activeModel) {
            return;
          }

          updateStageGeometry(activeModel);

          if (activeView !== 'all') {
            chart.options.scales.y.afterFit = scale => {
              if (activeView === 'phn') {
                scale.width = phnAxisWidth();
                return;
              }

              scale.width = PFF.mobileLayout() ? 60 : 72;
            };

            requestAnimationFrame(() => {
              setSpineGeometry(chart?.chartArea);
              chart?.draw();
            });
          }

          tabsController?.update?.();
          legendController?.update?.(
            LEGEND_ITEMS,
            false
          );
        }
      });
    }

    async function initialise() {
      PFF.setStatus('', statusElement);

      try {
        const table = await PFFCharts.loadGVizSheet({
          sheetId: CONFIG.spreadsheetId,
          sheetName: CONFIG.sheetName,
          gid: CONFIG.sheetGid,
          range: CONFIG.sourceRange,
          headers: '1',
          timeoutMs: CONFIG.fetchTimeoutMs
        });

        sourceRows = parseRows(table);

        if (!sourceRows.length) {
          throw new Error(
            'No usable practice rows were returned from the practice directory.'
          );
        }

        initialiseSelections();

        PFF.setDataSourceIndicator('live', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        dataSourceText.textContent = 'LIVE data';

        configureControls();
        renderView({ animate: false });

        chartSummary = PFFCharts.ensureChartSummary({
          id: 'practiceOwnershipChartSummary',
          parent: app
        });

        chartCanvas.setAttribute(
          'aria-describedby',
          chartSummary.id
        );

        updateAccessibleSummary();
        PFF.hideLoadingState(app);
      } catch (error) {
        console.error(error);

        PFF.setDataSourceIndicator('unavailable', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        PFF.setStatus(
          error?.message ||
          'Unable to load practice ownership data.',
          statusElement
        );

        PFF.hideLoadingState(app);
      } finally {
        app.setAttribute('aria-busy', 'false');
      }
    }

    initialise();
  </script>
</body>
</html>
