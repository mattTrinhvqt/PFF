<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF State MMM workforce</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --nsw: #2db7f5;
      --vic: #2d3a8c;
      --qld: #7a0036;
      --sa: #f03a47;
      --wa: #000000;
      --tas: #22a36b;
      --nt: #c25e00;
      --act: #7b61ff;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      -webkit-touch-callout: none;
    }

    button,
    input {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 4px;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    /* ==========================================================
     * TOP TABS + LIVE STATUS
     * ========================================================== */

    .module-top {
      display: flex;
      width: 100%;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms var(--motion-ease),
        width 420ms var(--motion-ease);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ==========================================================
     * GRAPH TITLE + CONTROLS
     * ========================================================== */

    .chart-heading-row {
      position: relative;
      z-index: 30;
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 31px;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
      margin: 0;
    }

    /*
     * Reusable PFF overflow-text scroller.
     * If text is wider than the space available to it, subtle
     * translucent scroll arrows appear automatically.
     */
    .overflow-text-shell {
      position: relative;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }

    .overflow-text-viewport {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .overflow-text-viewport::-webkit-scrollbar {
      display: none;
    }

    .overflow-text-scroll-button {
      position: absolute;
      top: 4px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.72;
      transition:
        opacity 160ms ease;
    }

    .overflow-text-scroll-button:hover {
      opacity: 1;
    }

    .overflow-text-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .overflow-text-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overflow-text-scroll-left {
      left: 0;
    }

    .overflow-text-scroll-right {
      right: 0;
    }

    .chart-heading {
      display: inline-flex;
      width: max-content;
      min-width: max-content;
      flex: 0 0 auto;
      align-items: baseline;
      gap: 0.28em;
      margin: 0;
      padding: 4px 0 0;
      overflow: visible;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-part,
    .chart-heading-year-wrap,
    .chart-heading-year {
      display: inline-block;
      flex: 0 0 auto;
    }

    .chart-heading-year-wrap {
      will-change: transform;
    }

    .chart-heading-part {
      min-width: 0;
      overflow: visible;
      text-overflow: clip;
    }

    .chart-heading-part,
    .chart-heading-year,
    .projection-year,
    .state-button-value {
      font-variant-numeric: tabular-nums;
      will-change: opacity;
    }

    .heading-controls {
      display: flex;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 5px;
      padding-top: 2px;
    }

    /* ---------- State selector: matches the PFF filter/menu language ---------- */

    .state-control {
      position: relative;
      z-index: 45;
      flex: 0 0 auto;
    }

    .state-button {
      display: grid;
      grid-template-columns: max-content minmax(30px, 1fr) 8px;
      min-width: 84px;
      min-height: 27px;
      align-items: center;
      gap: 4px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 10px;
      font-weight: 400;
      line-height: 1;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease;
    }

    .state-button:hover,
    .state-button[aria-expanded="true"] {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .state-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .state-button-value {
      display: inline-block;
      min-width: 30px;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }

    .menu-arrow {
      width: 0;
      height: 0;
      flex: 0 0 auto;
      border-top: 4px solid var(--muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .state-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    .state-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 70;
      display: none;
      min-width: 164px;
      padding: 5px 0;
      overflow: visible;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
      text-align: left;
    }

    .state-menu.is-open {
      display: block;
    }

    .state-menu-title {
      margin: 0;
      padding: 6px 10px 7px;
      color: var(--muted);
      background: #fff;
      border-bottom: 1px solid var(--track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .state-option {
      position: relative;
      display: flex;
      min-height: 32px;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      cursor: pointer;
      user-select: none;
    }

    .state-option:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .state-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .state-option-box {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      flex: 0 0 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .state-option input:checked + .state-option-box {
      border-color: var(--purple);
      background: var(--purple);
    }

    .state-option input:checked + .state-option-box::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .state-option input:focus-visible + .state-option-box {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .state-option-all {
      border-bottom: 1px solid var(--track);
      font-weight: 700;
    }

    .state-code {
      min-width: 30px;
      font-weight: 700;
    }

    /* ---------- Benchmark segmented toggle ---------- */

    .benchmark-control {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 180ms ease,
        visibility 0s linear 0s;
    }

    .benchmark-control.is-hidden {
      display: none;
    }

    .benchmark-mode-toggle {
      position: relative;
      display: grid;
      width: 96px;
      height: 27px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      padding: 1px;
      overflow: hidden;
      background: rgba(232, 234, 240, 0.55);
      border-radius: 4px;
      isolation: isolate;
    }

    .benchmark-mode-toggle::before {
      content: '';
      position: absolute;
      top: 1px;
      bottom: 1px;
      left: 1px;
      z-index: 0;
      width: calc((100% - 2px) / 2);
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.08);
      transform: translateX(0);
      transition: transform 300ms var(--motion-ease);
    }

    /* 1/5k is the left option; default 1/10k sits on the right. */
    .benchmark-mode-toggle.is-ten-k-selected::before {
      transform: translateX(100%);
    }

    .benchmark-mode-button {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 25px;
      padding: 0 3px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 3px;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition:
        color 220ms ease,
        transform 300ms var(--motion-ease);
    }

    .benchmark-mode-button.is-active {
      color: var(--purple);
      background: transparent;
      box-shadow: none;
    }

    .benchmark-mode-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -1px;
    }

    /* ---------- Full-width PFF timeline ---------- */

    .controls-row {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 41px;
      flex: 0 0 auto;
      padding: 0 0 2px;
    }

    .timeline-section {
      width: 100%;
      min-width: 0;
    }

    .timeline-topline {
      display: flex;
      width: 100%;
      min-height: 15px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 1px;
    }

    .timeline-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }

    .timeline-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .projection-year {
      min-width: 42px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      text-align: right;
    }

    .year-slider-wrap {
      --slider-progress: 100%;
      position: relative;
      width: 100%;
      min-height: 22px;
      margin: 0;
    }

    .year-slider-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 1;
      height: 4px;
      transform: translateY(-50%);
      background:
        linear-gradient(
          to right,
          rgba(21, 21, 21, 0.72) 0,
          rgba(21, 21, 21, 0.72) var(--slider-progress),
          var(--track) var(--slider-progress),
          var(--track) 100%
        );
      border-radius: 999px;
      pointer-events: none;
    }

    .year-ticks {
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 2;
      height: 10px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .year-tick {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 6px;
      transform: translate(-50%, -50%);
      background: var(--muted);
      opacity: 0.38;
    }

    .year-tick.is-major {
      height: 10px;
      opacity: 0.58;
    }

    .year-range {
      position: relative;
      z-index: 4;
      display: block;
      width: 100%;
      height: 22px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    .year-range::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
      border-radius: 999px;
    }

    .year-range::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -4px;
      appearance: none;
      -webkit-appearance: none;
      background: var(--ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .year-range::-moz-range-track,
    .year-range::-moz-range-progress {
      height: 4px;
      background: transparent;
      border: 0;
      border-radius: 999px;
    }

    .year-range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .year-range:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.20);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .slider-drag-cue {
      position: absolute;
      top: -8px;
      left: calc(var(--slider-progress) - 23px);
      z-index: 5;
      display: inline-block;
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      animation: sliderDragCue 1.7s var(--motion-ease) infinite;
    }

    .year-slider-wrap.has-been-dragged .slider-drag-cue,
    .year-slider-wrap.only-one-year .slider-drag-cue {
      display: none;
    }

    @keyframes sliderDragCue {
      0%, 12%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      28% {
        opacity: 0.78;
        transform: translateX(0);
      }

      54% {
        opacity: 0.88;
        transform: translateX(-6px);
      }

      72% {
        opacity: 0.42;
        transform: translateX(-8px);
      }
    }

    /* ==========================================================
     * CHART
     * ========================================================== */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
    }

    #phnChart {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    @media (max-width: 430px) {
      #app {
        width: min(calc(100% - 8px), 520px);
        padding-right: 4px;
        padding-left: 4px;
      }

      .chart-tab {
        padding-right: 8px;
        padding-left: 8px;
        font-size: 12px;
      }

      .chart-heading {
        font-size: 14px;
      }

      .heading-controls {
        gap: 4px;
      }

      .state-button {
        min-width: 80px;
        padding-right: 4px;
        padding-left: 4px;
        font-size: 9px;
      }

      .benchmark-mode-toggle {
        width: 90px;
      }

      .benchmark-mode-button {
        padding-right: 2px;
        padding-left: 2px;
        font-size: 8px;
      }

      .timeline-label,
      .projection-year {
        font-size: 9px;
      }
    }

  <script>
    'use strict';

    // ============================================================
    // DATA SOURCE
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const CLINICIAN_SHEET =
      'OptomsbystatebyMMM';

    const POPULATION_SHEET =
      'AuspopnbystatebyMMM';

    /*
      Both source tabs have two header rows:
      row 29 = measure/state headers
      row 30 = year/MMM headers
      row 31 onward = data

      Raw clinician sheet:
      A       = year
      B:AO    = active clinical optometrist counts, 40 state × MMM cells
      AP:CC   = average weekly clinical hours, same 40 cells

      Raw population sheet:
      A       = year
      B:AO    = population, same 40 state × MMM cells

      The HTML calculates FTE directly from the raw clinician inputs:
        FTE = clinician count × average weekly clinical hours / 38

      It then calculates:
        Coverage   = population / FTE
        Oversupply = FTE - (population / selected benchmark)

      The calculated FTE / coverage columns in Google Sheets are not used.
    */
    const CLINICIAN_RANGE =
      'A29:CC';

    const POPULATION_RANGE =
      'A29:AO';

    const COUNT_FIRST_INDEX =
      1;   // B

    const HOURS_FIRST_INDEX =
      41;  // AP

    const POPULATION_FIRST_INDEX =
      1;   // B

    const FULL_TIME_HOURS =
      38;

    const CACHE_KEY =
      'pff_state_mmm_workforce_raw_v1';

    const DEFAULT_MODE =
      'oversupply';

    // ============================================================
    // STATE × MMM ORDER + STATE COLOURS
    // ============================================================

    /*
      This is the exact raw column order in B:AO for both source tabs.
      MMMs that do not occur in a state are deliberately absent rather
      than represented by empty placeholder columns.
    */
    const SERIES_SCHEMA = [
      { state: 'NSW', mmm: 1 },
      { state: 'NSW', mmm: 2 },
      { state: 'NSW', mmm: 3 },
      { state: 'NSW', mmm: 4 },
      { state: 'NSW', mmm: 5 },
      { state: 'NSW', mmm: 6 },
      { state: 'NSW', mmm: 7 },

      { state: 'VIC', mmm: 1 },
      { state: 'VIC', mmm: 2 },
      { state: 'VIC', mmm: 3 },
      { state: 'VIC', mmm: 4 },
      { state: 'VIC', mmm: 5 },

      { state: 'QLD', mmm: 1 },
      { state: 'QLD', mmm: 2 },
      { state: 'QLD', mmm: 3 },
      { state: 'QLD', mmm: 4 },
      { state: 'QLD', mmm: 5 },
      { state: 'QLD', mmm: 6 },
      { state: 'QLD', mmm: 7 },

      { state: 'SA', mmm: 1 },
      { state: 'SA', mmm: 2 },
      { state: 'SA', mmm: 3 },
      { state: 'SA', mmm: 4 },
      { state: 'SA', mmm: 5 },
      { state: 'SA', mmm: 6 },

      { state: 'WA', mmm: 1 },
      { state: 'WA', mmm: 2 },
      { state: 'WA', mmm: 3 },

      { state: 'WA', mmm: 5 },

    /*
      PHNS is retained as the internal category array name so the chart
      mechanics remain identical to the supplied PFF PHN app. Here each
      item is an MMM category rather than a PHN.
    */
    const PHNS =
      SERIES_SCHEMA.map(
        item => `MM${item.mmm}`
      );

    const MMM_NUMBERS =

    const STATE_COLOURS = {

      SA: '#f03a47',
      WA: '#000000',

    const STATE_NAMES = {

    /*

    // ============================================================

    const app =
