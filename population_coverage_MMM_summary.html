<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF State MMM workforce</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js"></script>

  <style>
    .chart-heading {
      gap: 0.28em;
    }

    .chart-heading-part,
    .chart-heading-year-wrap,
    .chart-heading-year,
    .projection-year,
    .state-button-value {
      display: inline-block;
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
    }

    .heading-controls {
      justify-content: flex-end;
      padding-top: 2px;
    }

    .state-control {
      position: relative;
      z-index: 45;
      flex: 0 0 auto;
    }

    .state-button {
      display: grid;
      grid-template-columns: max-content minmax(30px, 1fr) 8px;
      min-width: 84px;
      min-height: 27px;
      align-items: center;
      gap: 4px;
      padding: 0 5px;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 10px;
      font-weight: 400;
      line-height: 1;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
      transition: color 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .state-button:hover,
    .state-button[aria-expanded='true'] {
      border-color: var(--pff-ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .state-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .state-button-value {
      min-width: 30px;
      color: var(--pff-purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
      will-change: opacity;
    }

    .menu-arrow {
      width: 0;
      height: 0;
      flex: 0 0 auto;
      border-top: 4px solid var(--pff-muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .state-button[aria-expanded='true'] .menu-arrow {
      transform: rotate(180deg);
    }

    .state-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 70;
      display: none;
      min-width: 164px;
      padding: 5px 0;
      overflow: visible;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
      text-align: left;
    }

    .state-menu.is-open {
      display: block;
    }

    .state-menu-title {
      margin: 0;
      padding: 6px 10px 7px;
      color: var(--pff-muted);
      border-bottom: 1px solid var(--pff-track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .state-option {
      position: relative;
      display: flex;
      min-height: 32px;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      color: var(--pff-ink);
      background: var(--pff-white);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      cursor: pointer;
      user-select: none;
    }

    .state-option:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .state-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .state-option-box {
      position: relative;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      border: 1px solid var(--pff-muted);
      border-radius: 2px;
      background: var(--pff-white);
    }

    .state-option input:checked + .state-option-box {
      border-color: var(--pff-purple);
      background: var(--pff-purple);
    }

    .state-option input:checked + .state-option-box::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid var(--pff-white);
      border-bottom: 2px solid var(--pff-white);
      transform: rotate(45deg);
    }

    .state-option input:focus-visible + .state-option-box {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .state-option-all {
      border-bottom: 1px solid var(--pff-track);
      font-weight: 700;
    }

    .state-code {
      min-width: 30px;
      font-weight: 700;
    }

    .benchmark-control {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
    }

    .benchmark-control.is-hidden {
      display: none;
    }

    .benchmark-mode-toggle {
      width: 96px;
    }

    .benchmark-mode-button {
      padding-right: 3px;
      padding-left: 3px;
      font-size: 8.5px;
    }

    .controls-row {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 41px;
      flex: 0 0 auto;
      padding: 0 0 2px;
    }

    .timeline-section {
      width: 100%;
      min-width: 0;
    }

    .timeline-topline {
      display: flex;
      width: 100%;
      min-height: 15px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 1px;
    }

    .timeline-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--pff-muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }

    .timeline-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--pff-muted);
      font-size: 12px;
      line-height: 1;
    }

    .projection-year {
      min-width: 42px;
      color: var(--pff-muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      text-align: right;
      will-change: opacity;
    }

    .year-slider-wrap {
      --slider-progress: 100%;
      position: relative;
      width: 100%;
      min-height: 22px;
      margin: 0;
    }

    .year-slider-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 1;
      height: 4px;
      transform: translateY(-50%);
      background: linear-gradient(
        to right,
        rgba(21, 21, 21, 0.72) 0,
        rgba(21, 21, 21, 0.72) var(--slider-progress),
        var(--pff-track) var(--slider-progress),
        var(--pff-track) 100%
      );
      border-radius: 999px;
      pointer-events: none;
    }

    .year-ticks {
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 2;
      height: 10px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .year-tick {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 6px;
      transform: translate(-50%, -50%);
      background: var(--pff-muted);
      opacity: 0.38;
    }

    .year-tick.is-major {
      height: 10px;
      opacity: 0.58;
    }

    .year-range {
      position: relative;
      z-index: 4;
      display: block;
      width: 100%;
      height: 22px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    .year-range::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
      border-radius: 999px;
    }

    .year-range::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -4px;
      appearance: none;
      -webkit-appearance: none;
      background: var(--pff-ink);
      border: 0;
      border-radius: 50%;
    }

    .year-range::-moz-range-track,
    .year-range::-moz-range-progress {
      height: 4px;
      background: transparent;
      border: 0;
      border-radius: 999px;
    }

    .year-range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--pff-ink);
      border: 0;
      border-radius: 50%;
    }

    .year-range:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.20);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .slider-drag-cue {
      position: absolute;
      top: -8px;
      left: calc(var(--slider-progress) - 23px);
      z-index: 5;
      display: inline-block;
      color: var(--pff-muted);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      animation: sliderDragCue 1.7s var(--pff-motion-ease) infinite;
    }

    .year-slider-wrap.has-been-dragged .slider-drag-cue,
    .year-slider-wrap.only-one-year .slider-drag-cue {
      display: none;
    }

    @keyframes sliderDragCue {
      0%, 12%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      28% {
        opacity: 0.78;
        transform: translateX(0);
      }

      54% {
        opacity: 0.88;
        transform: translateX(-6px);
      }

      72% {
        opacity: 0.42;
        transform: translateX(-8px);
      }
    }

    .chart-shell {
      margin: -3px 0 0;
    }

    @media (max-width: 430px) {
      .chart-heading-row {
        height: 29px;
        min-height: 29px;
        gap: 4px;
      }

      .chart-heading {
        font-size: 14px;
      }

      .heading-controls {
        gap: 3px;
      }

      .state-button {
        min-width: 80px;
        padding-right: 4px;
        padding-left: 4px;
        font-size: 9px;
      }

      .benchmark-mode-toggle {
        width: 90px;
      }

      .benchmark-mode-button {
        padding-right: 2px;
        padding-left: 2px;
        font-size: 8px;
      }

      .timeline-label,
      .projection-year {
        font-size: 9px;
      }
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"

        aria-label="Loading state MMM workforce data"

            <button class="chart-tab" type="button" role="tab" aria-selected="false" data-mode="coverage">Coverage</button>

        <div id="liveData" class="live-data" aria-label="Live data" aria-live="polite">

        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 class="chart-heading">
              <span id="headingMetric" class="chart-heading-fixed chart-heading-part">FTE clinician oversupply</span>
              <span id="headingYearWrap" class="chart-heading-detail chart-heading-year-wrap">(<span id="headingYear" class="chart-heading-year">—</span>)</span>
            </h2>
          </div>

          <button
            id="headingScrollRight"

            type="button"
            aria-label="Scroll graph title right"

        </div>

        <div class="heading-controls">
          <div id="benchmarkControl" class="benchmark-control">
            <div
              id="benchmarkModeToggle"
              class="metric-switch benchmark-mode-toggle"
              role="group"
              aria-label="Oversupply benchmark"
            >
              <button
                id="benchmark5k"
                class="metric-button benchmark-mode-button"
                type="button"
                aria-pressed="false"
                data-benchmark="5000"
              >1 / 5k</button>

              <button
                id="benchmark10k"
                class="metric-button benchmark-mode-button is-active"
                type="button"
                aria-pressed="true"
                data-benchmark="10000"
              >1 / 10k</button>
            </div>
          </div>

          <div id="stateControl" class="state-control">
            <button
              id="stateButton"
              class="state-button"
              type="button"
              aria-expanded="false"
              aria-controls="stateMenu"
            >
              <span>States</span>
              <span id="stateButtonValue" class="state-button-value">All</span>
              <span class="menu-arrow" aria-hidden="true"></span>
            </button>

            <div id="stateMenu" class="state-menu" role="menu">
              <div class="state-menu-title">Show states</div>

              <label class="state-option state-option-all">
                <input id="stateAll" type="checkbox" checked>
                <span class="state-option-box" aria-hidden="true"></span>
                <span>All states</span>
              </label>

              <div id="stateOptions"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="controls-row">
        <div class="timeline-section">
          <div class="timeline-topline">
            <span class="timeline-label">
              <span class="timeline-symbol" aria-hidden="true">◷</span>
              <span>Year</span>

            <input

              type="range"

              step="1"
              value="0"

          </div>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="phnChart"
          aria-label="State MMM workforce chart"
          role="img"
        ></canvas>
      </div>
    </main>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      sheetId:
        '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE',

      clinicianSheet:
        'OptomsbystatebyMMM',

      clinicianRange:
        'A29:CC',

      populationSheet:
        'AuspopnbystatebyMMM',

      populationRange:
        'A29:AO',

      localCacheKey:

    });

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'pff-state-mmm-workforce-v1';

    const COUNT_FIRST_INDEX =
      1;   // B

    const HOURS_FIRST_INDEX =
      41;  // AP

    const POPULATION_FIRST_INDEX =
      1;   // B

    const FULL_TIME_HOURS =
      38;

    const DEFAULT_MODE =
      'oversupply';

    /*
      This is the exact raw column order in B:AO for both source tabs.
      MMMs that do not occur in a state are deliberately absent rather
      than represented by empty placeholder columns.
    */
    const SERIES_SCHEMA = [
      { state: 'NSW', mmm: 1 },
      { state: 'NSW', mmm: 2 },
      { state: 'NSW', mmm: 3 },
      { state: 'NSW', mmm: 4 },
      { state: 'NSW', mmm: 5 },
      { state: 'NSW', mmm: 6 },
      { state: 'NSW', mmm: 7 },

      { state: 'VIC', mmm: 1 },
      { state: 'VIC', mmm: 2 },
      { state: 'VIC', mmm: 3 },
      { state: 'VIC', mmm: 4 },
      { state: 'VIC', mmm: 5 },

      { state: 'QLD', mmm: 1 },
      { state: 'QLD', mmm: 2 },
      { state: 'QLD', mmm: 3 },
      { state: 'QLD', mmm: 4 },
      { state: 'QLD', mmm: 5 },
      { state: 'QLD', mmm: 6 },
      { state: 'QLD', mmm: 7 },

      { state: 'SA', mmm: 1 },
      { state: 'SA', mmm: 2 },
      { state: 'SA', mmm: 3 },
      { state: 'SA', mmm: 4 },
      { state: 'SA', mmm: 5 },
      { state: 'SA', mmm: 6 },
      { state: 'SA', mmm: 7 },

      { state: 'WA', mmm: 1 },
      { state: 'WA', mmm: 2 },
      { state: 'WA', mmm: 3 },
      { state: 'WA', mmm: 4 },
      { state: 'WA', mmm: 5 },
      { state: 'WA', mmm: 6 },
      { state: 'WA', mmm: 7 },

      { state: 'TAS', mmm: 2 },
      { state: 'TAS', mmm: 3 },
      { state: 'TAS', mmm: 5 },

      { state: 'NT', mmm: 2 },
      { state: 'NT', mmm: 6 },
      { state: 'NT', mmm: 7 },

      { state: 'ACT', mmm: 1 }
    ];

    /*
      PHNS is retained as the internal category array name so the chart
      mechanics remain identical to the supplied PFF PHN app. Here each
      item is an MMM category rather than a PHN.
    */
    const PHNS =
      SERIES_SCHEMA.map(
        item => `MM${item.mmm}`
      );

    const MMM_NUMBERS =
      SERIES_SCHEMA.map(
        item => item.mmm
      );

    const STATE_CODES =
      SERIES_SCHEMA.map(
        item => item.state
      );

    const STATE_COLOURS = {
      NSW: '#2db7f5',
      VIC: '#2d3a8c',
      QLD: '#7a0036',
      SA: '#f03a47',
      WA: '#000000',
      TAS: '#22a36b',
      NT: '#c25e00',
      ACT: '#7b61ff'
    };

    const ALL_STATES = [
      'NSW', 'VIC', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT'
    ];

    const STATE_NAMES = {
      NSW: 'New South Wales',
      VIC: 'Victoria',
      QLD: 'Queensland',
      SA: 'South Australia',
      WA: 'Western Australia',
      TAS: 'Tasmania',
      NT: 'Northern Territory',
      ACT: 'Australian Capital Territory'
    };

    /*
      Every MMM within a state uses that state's standard PFF colour.
      There is intentionally no separate MM1–MM7 colour palette.
    */
    const BAR_COLOURS =
      STATE_CODES.map(
        code => STATE_COLOURS[code]

    const app =

    const tabs =

        document.querySelectorAll('.chart-tab')
      );

    const liveData =
      document.getElementById('liveData');

    const liveDataText =
      document.getElementById('liveDataText');

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const headingMetric =
      document.getElementById('headingMetric');

    const headingYear =
      document.getElementById('headingYear');

    const headingYearWrap =
      document.getElementById('headingYearWrap');

    const projectionYear =

    const yearSliderWrap =
      document.getElementById('yearSliderWrap');

    const yearTicks =
      document.getElementById('yearTicks');

    const yearSlider =

    const stateControl =

    const stateButtonValue =

    const stateMenu =

    const stateAll =

    const benchmarkControl =

    const benchmarkModeToggle =

    const benchmark10k =
      document.getElementById('benchmark10k');

    const benchmark5k =
      document.getElementById('benchmark5k');

    const chartShell =
      document.getElementById('chartShell');

    const chartCanvas =
      document.getElementById('phnChart');

    const state = {
      mode: DEFAULT_MODE,
      year: null,
      benchmarkPopulation: 10000,
      benchmarkTitleDisplay: 10000,
      selectedStates: new Set(ALL_STATES),
      clinicianByYear: {},
      populationByYear: {},
      activeYears: [],
      scaleCache: {},
      lastRenderedMode: null
    };

    let chart =
      null;

    let chartSummary =
      null;

    let tabsController =
      null;

    let headingScroller =
      null;

    let benchmarkController =
      null;

    let stateMenuController =
      null;

    let interactionsController =
      null;

    let responsiveController =
      null;

    let benchmarkTitleAnimationToken =
      0;

    function dataNumber(value) {
      if (
        value &&
        typeof value === 'object' &&
        (
          Object.prototype.hasOwnProperty.call(value, 'v') ||
          Object.prototype.hasOwnProperty.call(value, 'f')
        )
      ) {
        const direct =
          PFFCharts.numericCell(value);

        return Number.isFinite(direct)
          ? direct
          : null;
      }

      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {
        return null;
      }

      const cleaned =
        PFF.cleanText(value)
          .replace(/,/g, '')
          .replace(/[^0-9.+-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return null;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : null;
    }

    function yearValue(value) {
      const numeric =
        dataNumber(value);

      if (!Number.isFinite(numeric)) {
        return null;
      }

      const year =
        Math.round(numeric);

      return year >= 1900 && year <= 2200
        ? year
        : null;
    }

    function clinicianValues(getValue) {
      return PHNS.map(
        (_, index) => {
          const count =
            dataNumber(
              getValue(
                COUNT_FIRST_INDEX +
                index
              )
            );

          const hours =
            dataNumber(
              getValue(
                HOURS_FIRST_INDEX +
                index
              )
            );

          if (count === 0) {
            return 0;
          }

          if (
            !Number.isFinite(count) ||
            !Number.isFinite(hours) ||
            count < 0 ||
            hours <= 0
          ) {
            return null;
          }

          const fte =
            count *
            hours /
            FULL_TIME_HOURS;

          return Number.isFinite(fte)
            ? fte
            : null;
        }
      );
    }

    function populationValues(getValue) {
      return PHNS.map(
        (_, index) =>
          dataNumber(
            getValue(
              POPULATION_FIRST_INDEX +
              index
            )
          )
      );
    }

    function parseClinicianTable(table) {
      const result = {};

      (table?.rows || []).forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const year =
            yearValue(cells[0]);

          if (!year) {
            return;
          }

          const values =
            clinicianValues(
              index => cells[index]
            );

          if (values.some(Number.isFinite)) {
            result[year] = values;
          }
        }
      );

      return result;
    }

    function parsePopulationTable(table) {
      const result = {};

      (table?.rows || []).forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const year =
            yearValue(cells[0]);

          if (!year) {
            return;
          }

          const values =
            populationValues(
              index => cells[index]
            );

          if (values.some(Number.isFinite)) {
            result[year] = values;
          }
        }
      );

      return result;
    }

    function parseRemoteClinicianRows(sourceRows) {
      const result = {};

      (Array.isArray(sourceRows) ? sourceRows : [])
        .forEach(row => {
          const year =
            yearValue(row?.[0]);

          if (!year) {
            return;
          }

          const values =
            clinicianValues(
              index => row?.[index]
            );

          if (values.some(Number.isFinite)) {
            result[year] = values;
          }
        });

      return result;
    }

    function parseRemotePopulationRows(sourceRows) {
      const result = {};

      (Array.isArray(sourceRows) ? sourceRows : [])
        .forEach(row => {
          const year =
            yearValue(row?.[0]);

          if (!year) {
            return;
          }

          const values =
            populationValues(
              index => row?.[index]
            );

          if (values.some(Number.isFinite)) {
            result[year] = values;
          }
        });

      return result;
    }

    function normaliseSeries(values) {
      if (
        !Array.isArray(values) ||
        values.length < PHNS.length
      ) {
        return null;
      }

      const normalised =
        values
          .slice(0, PHNS.length)
          .map(value => {
            if (
              value === null ||
              value === undefined ||
              value === ''
            ) {
              return null;
            }

            const number =
              Number(value);

            return Number.isFinite(number)
              ? number
              : null;
          });

      return normalised.some(Number.isFinite)
        ? normalised
        : null;
    }

    function combineYearMaps(
      clinicianByYear,
      populationByYear
    ) {
      const years =
        Array.from(
          new Set([
            ...Object.keys(clinicianByYear || {}).map(Number),
            ...Object.keys(populationByYear || {}).map(Number)
          ])
        )
          .filter(Number.isFinite)
          .sort((a, b) => a - b);

      return years.map(year => ({
        year,
        clinician:
          normaliseSeries(
            clinicianByYear?.[year]
          ),
        population:
          normaliseSeries(
            populationByYear?.[year]
          )
      }));
    }

    function validateCombinedRows(sourceRows) {
      const rows =
        (Array.isArray(sourceRows) ? sourceRows : [])
          .map(row => {
            const year =
              Number(row?.year);

            if (
              !Number.isFinite(year) ||
              year < 1900 ||
              year > 2200
            ) {
              return null;
            }

            const clinician =
              normaliseSeries(
                row?.clinician
              );

            const population =
              normaliseSeries(
                row?.population
              );

            if (!clinician && !population) {
              return null;
            }

            return {
              year:
                Math.round(year),
              clinician,
              population
            };
          })
          .filter(Boolean)
          .sort(
            (first, second) =>
              first.year -
              second.year
          );

      if (
        !rows.some(row => row.clinician) ||
        !rows.some(row => row.population) ||
        !rows.some(
          row =>
            row.clinician &&
            row.population
        )
      ) {
        throw new Error(
          'State MMM workforce data were incomplete.'
        );
      }

      return rows;
    }

    function parseLiveData(raw) {
      return validateCombinedRows(
        combineYearMaps(
          parseClinicianTable(
            raw?.clinicianTable
          ),
          parsePopulationTable(
            raw?.populationTable
          )
        )
      );
    }

    function parseRemoteCache(snapshot) {
      return validateCombinedRows(
        combineYearMaps(
          parseRemoteClinicianRows(
            snapshot?.data?.clinicianRows
          ),
          parseRemotePopulationRows(
            snapshot?.data?.populationRows
          )
        )
      );
    }

    function applyLoadedRows(sourceRows) {
      const rows =
        validateCombinedRows(sourceRows);

      state.clinicianByYear = {};
      state.populationByYear = {};

      rows.forEach(row => {
        if (row.clinician) {
          state.clinicianByYear[
            row.year
          ] = [...row.clinician];
        }

        if (row.population) {
          state.populationByYear[
            row.year
          ] = [...row.population];
        }
      });
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(raw);

        if (
          Array.isArray(
            parsed?.rows
          )
        ) {
          return;
        }

        if (
          parsed?.clinicianByYear &&
          parsed?.populationByYear
        ) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            validateCombinedRows(
              combineYearMaps(
                parsed.clinicianByYear,
                parsed.populationByYear
              )
            )
          );
        }
      } catch (_) {
        // Browser cache is optional.
      }
    }

    function sortedYears(object) {
      return Object.keys(object)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function commonYears() {
      const clinicianYears =
        new Set(
          sortedYears(state.clinicianByYear)

      return sortedYears(
        state.populationByYear

        year => clinicianYears.has(year)

    function yearsForMode(mode) {
      if (mode === 'clinicians') {
        return sortedYears(
          state.clinicianByYear
        );
      }

      if (mode === 'population') {

        );
      }

      return commonYears();

    function buildYearTicks(years) {
      yearTicks.textContent = '';

      if (!years.length) {
        return;

      const lastIndex =
        Math.max(0, years.length - 1);

      const majorStride =
        Math.max(
          1,
          Math.ceil(
            lastIndex / 4
          )
        );

      years.forEach(
        (_, index) => {
          const tick =
            document.createElement('span');

          const pct =
            lastIndex > 0
              ? (index / lastIndex) * 100
              : 50;

          tick.className = 'year-tick';
          tick.style.left = `${pct}%`;

          if (
            index === 0 ||
            index === lastIndex ||
            index % majorStride === 0
          ) {
            tick.classList.add('is-major');
          }

          yearTicks.appendChild(tick);
        }
      );
    }

    function updateSliderProgress() {
      const min = Number(yearSlider.min);
      const max = Number(yearSlider.max);
      const value = Number(yearSlider.value);

      const percentage =
        max > min
          ? ((value - min) / (max - min)) * 100

    function safeNumber(value) {
      const numeric = Number(value);

      return Number.isFinite(numeric)
        ? numeric
        : null;
    }

    function metricValuesFor(
      mode,
      year,
      benchmarkPopulation = state.benchmarkPopulation
    ) {
      const clinicians =
        state.clinicianByYear[year] || [];

      const population =
        state.populationByYear[year] || [];

      if (mode === 'clinicians') {
        return PHNS.map(
          (_, index) => {
            const value =
              safeNumber(clinicians[index]);

            return value;
          }
        );
      }

      if (mode === 'population') {
        return PHNS.map(
          (_, index) => {
            const value =
              safeNumber(population[index]);

            return value === null
              ? null
              : Math.round(value);
          }
        );
      }

      if (mode === 'coverage') {
        return PHNS.map(
          (_, index) => {
            const c = safeNumber(clinicians[index]);
            const p = safeNumber(population[index]);

            if (
              c === null ||
              p === null ||
              c <= 0
            ) {
              return null;
            }

            return Math.round(p / c);
          }
        );
      }

      return PHNS.map(
        (_, index) => {
          const c = safeNumber(clinicians[index]);
          const p = safeNumber(population[index]);

          if (
            c === null ||
            p === null
          ) {
            return null;
          }

          return c -
            (p / benchmarkPopulation);
        }
      );
    }

    function visibleIndices() {

    function visibleColours() {

    function metricValues() {
      if (!state.year) {
        return [];
      }

      const allValues = metricValuesFor(
        state.mode,
        state.year,
        state.benchmarkPopulation

      return visibleIndices().map(index => allValues[index]);

    function flattenFinite(arrays) {
      return arrays
        .flat()
        .filter(Number.isFinite);
    }

    function niceStep(rawStep) {
      if (
        !Number.isFinite(rawStep) ||
        rawStep <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(rawStep)
        );

      const magnitude =
        Math.pow(10, exponent);

      const fraction =
        rawStep / magnitude;

      let niceFraction;

      if (fraction <= 1) {
        niceFraction = 1;
      } else if (fraction <= 2) {
        niceFraction = 2;
      } else if (fraction <= 2.5) {
        niceFraction = 2.5;
      } else if (fraction <= 5) {
        niceFraction = 5;
      } else {
        niceFraction = 10;
      }

      return Math.max(1, niceFraction * magnitude);
    }

    const AXIS_MAJOR_INTERVALS = 6;
    const AXIS_MAJOR_TICK_COUNT = AXIS_MAJOR_INTERVALS + 1;

    function nextNiceStep(step) {
      const value = Math.max(1e-9, Number(step) || 1);
      const exponent = Math.floor(Math.log10(value));
      const magnitude = Math.pow(10, exponent);
      const fraction = value / magnitude;

      if (fraction < 1.5) return 2 * magnitude;
      if (fraction < 2.25) return 2.5 * magnitude;
      if (fraction < 3.75) return 5 * magnitude;
      if (fraction < 7.5) return 10 * magnitude;
      return 20 * magnitude;
    }

    function deriveConstantScale(
      values,
      allowNegative
    ) {
      const finite =
        values.filter(Number.isFinite);

      if (!finite.length) {
        return {
          min: 0,
          max: AXIS_MAJOR_INTERVALS,
          step: 1,
          minorStep: 0.5
        };
      }

      const rawMin =
        Math.min(...finite);

      const rawMax =
        Math.max(...finite);

      if (!allowNegative) {
        const paddedMax =
          Math.max(1, rawMax) * 1.14;

        let step =
          niceStep(
            paddedMax / AXIS_MAJOR_INTERVALS
          );

        while (
          step * AXIS_MAJOR_INTERVALS < paddedMax
        ) {
          step = nextNiceStep(step);
        }

        return {
          min: 0,
          max: step * AXIS_MAJOR_INTERVALS,
          step,
          minorStep: step / 2
        };
      }

      const rawSpan =
        Math.max(
          rawMax - rawMin,
          Math.abs(rawMax),
          Math.abs(rawMin),
          1
        );

      const lowerNeed =
        Math.max(0, -Math.min(0, rawMin) + rawSpan * 0.10);

      const upperNeed =
        Math.max(0, Math.max(0, rawMax) + rawSpan * 0.12);

      let step =
        niceStep(
          (lowerNeed + upperNeed) / AXIS_MAJOR_INTERVALS
        );

      let negativeIntervals;
      let positiveIntervals;

      while (true) {
        negativeIntervals =
          lowerNeed > 0
            ? Math.ceil(lowerNeed / step - 1e-10)
            : 0;

        positiveIntervals =
          upperNeed > 0
            ? Math.ceil(upperNeed / step - 1e-10)
            : 0;

        if (
          negativeIntervals + positiveIntervals <=
          AXIS_MAJOR_INTERVALS
        ) {
          break;
        }

        step = nextNiceStep(step);
      }

      while (
        negativeIntervals + positiveIntervals <
        AXIS_MAJOR_INTERVALS
      ) {
        const lowerFill =
          negativeIntervals > 0
            ? lowerNeed / (negativeIntervals * step)
            : 0;

        const upperFill =
          positiveIntervals > 0
            ? upperNeed / (positiveIntervals * step)
            : 0;

        if (
          lowerNeed > 0 &&
          (upperNeed <= 0 || lowerFill >= upperFill)
        ) {
          negativeIntervals += 1;
        } else {
          positiveIntervals += 1;
        }
      }

      return {
        min: -negativeIntervals * step,
        max: positiveIntervals * step,
        step,
        minorStep: step / 2
      };
    }

    function buildScaleCache() {
      const clinicianYears =
        yearsForMode('clinicians');

      const populationYears =
        yearsForMode('population');

      const sharedYears =
        commonYears();

      const clinicianValues =
        flattenFinite(
          clinicianYears.map(
            year => metricValuesFor('clinicians', year)
          )
        );

      const populationValues =
        flattenFinite(
          populationYears.map(
            year => metricValuesFor('population', year)
          )
        );

      const coverageValues =
        flattenFinite(
          sharedYears.map(
            year => metricValuesFor('coverage', year)
          )
        );

      const oversupplyValues =
        flattenFinite(
          sharedYears.flatMap(
            year => [
              metricValuesFor('oversupply', year, 10000),
              metricValuesFor('oversupply', year, 5000)
            ]
          )
        );

      state.scaleCache = {
        clinicians:
          deriveConstantScale(
            clinicianValues,
            false
          ),

        population:
          deriveConstantScale(
            populationValues,
            false
          ),

        coverage:
          deriveConstantScale(
            coverageValues,
            false
          ),

        oversupply:
          deriveConstantScale(
            oversupplyValues,
            true
          )
      };
    }

    function formatYear(value) {
      const year =
        Math.round(
          Number(value)
        );

      return Number.isFinite(year)
        ? String(year)
        : '—';
    }

    function formatDisplayValue(
      value,
      mode = state.mode,
      includePlus = false
    ) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      const rounded =
        Math.round(value * 10) / 10;

      const prefix =
        includePlus && rounded > 0
          ? '+'
          : '';

      const formatted =
        mode === 'clinicians' ||
        mode === 'oversupply'
          ? PFF.formatOneDecimal(rounded)
          : PFF.formatInteger(rounded);

      return `${prefix}${formatted}`;
    }

    function formatAxisValue(value) {
      const numeric =
        Number(value);

      if (!Number.isFinite(numeric)) {
        return '';
      }

      const absolute =
        Math.abs(numeric);

      if (absolute >= 1000000) {
        const scaled =
          numeric / 1000000;

        const rounded =
          Math.abs(scaled - Math.round(scaled)) < 0.000001
            ? Math.round(scaled).toString()
            : scaled.toFixed(1).replace(/\.0$/, '');

        return `${rounded}m`;
      }

      if (absolute >= 1000) {
        const scaled =
          numeric / 1000;

        const rounded =
          Math.abs(scaled - Math.round(scaled)) < 0.000001
            ? Math.round(scaled).toString()
            : scaled.toFixed(1).replace(/\.0$/, '');

        return `${rounded}k`;
      }

      return Math.abs(
        numeric - Math.round(numeric)
      ) < 0.000001
        ? PFF.formatInteger(numeric)
        : PFF.formatOneDecimal(numeric);
    }

    function animateIntegerText(
      element,
      targetValue,
      duration = 260
    ) {
      if (!element) return;

      const target =
        Number(targetValue);

      if (!Number.isFinite(target)) {
        element.textContent = '—';
        delete element.dataset.numericValue;
        return;
      }

      const stored =
        Number(element.dataset.numericValue);

      const parsed =
        Number(
          String(element.textContent)
            .replace(/[^0-9.-]/g, '')
        );

      const start =
        Number.isFinite(stored)
          ? stored
          : Number.isFinite(parsed)
            ? parsed
            : target;

      const token =
        (Number(element.dataset.animationToken) || 0) + 1;

      element.dataset.animationToken =
        String(token);

      if (
        PFF.reducedMotion() ||
        start === target ||
        duration <= 0
      ) {
        element.textContent =
          PFF.formatInteger(target);

        element.dataset.numericValue =
          String(target);

        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (
          Number(element.dataset.animationToken) !== token
        ) {
          return;
        }

        const progress =
          Math.min(
            (now - startedAt) / duration,
            1
          );

        const eased =
          PFFCharts.easeOutCubic(progress);

        const current =
          start +
          (target - start) * eased;

        element.textContent =
          PFF.formatInteger(current);

        element.dataset.numericValue =
          String(current);

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          element.textContent =
            PFF.formatInteger(target);

          element.dataset.numericValue =
            String(target);
        }
      }

      requestAnimationFrame(frame);
    }

    function setYearText(
      yearText,
      animate = false
    ) {
      const year =
        Number(yearText);

      if (animate && Number.isFinite(year)) {
        animateYearText(
          headingYear,
          year,
          220
        );

        animateYearText(
          projectionYear,
          year,
          220
        );
      } else {
        const text =
          Number.isFinite(year)
            ? formatYear(year)
            : '—';

        headingYear.textContent = text;
        projectionYear.textContent = text;

        if (Number.isFinite(year)) {
          headingYear.dataset.numericValue =
            String(year);

          projectionYear.dataset.numericValue =
            String(year);
        }
      }

      headingScroller?.update();
    }

    function animateBenchmarkTitleNumber(
      fromValue,
      toValue,
      duration = 420
    ) {
      const start =
        Number(fromValue);

      const target =
        Number(toValue);

      const token =
        ++benchmarkTitleAnimationToken;

      if (
        !Number.isFinite(start) ||
        !Number.isFinite(target) ||
        PFF.reducedMotion() ||
        duration <= 0 ||
        start === target
      ) {
        state.benchmarkTitleDisplay = target;
        chart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (
          token !== benchmarkTitleAnimationToken
        ) {
          return;
        }

        const progress =
          Math.min(
            (now - startedAt) / duration,
            1
          );

        const eased =
          PFFCharts.easeOutCubic(progress);

        state.benchmarkTitleDisplay =
          Math.round(
            start +
            (target - start) * eased
          );

        if (
          chart &&
          state.mode === 'oversupply'
        ) {
          chart.draw();
        }

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          state.benchmarkTitleDisplay = target;
          chart?.draw();
        }
      }

      requestAnimationFrame(frame);
    }

    const axisTickAnimation = {
      values: [],
      token: 0,
      raf: null
    };

    function axisTickTargets(mode = state.mode) {
      const scaleDef = state.scaleCache[mode];

      if (!scaleDef) {
        return Array.from(
          { length: AXIS_MAJOR_TICK_COUNT },
          (_, index) => index
        );
      }

      return Array.from(
        { length: AXIS_MAJOR_TICK_COUNT },
        (_, index) =>
          scaleDef.min + scaleDef.step * index
      );
    }

    function setAxisTickValuesImmediately(mode = state.mode) {
      axisTickAnimation.values = axisTickTargets(mode);
    }

    function animateAxisTickValues(
      targets,
      duration = PFFCharts.chartAnimationDuration()
    ) {
      const targetValues =
        Array.from(targets || []);

      if (!targetValues.length) return;

      if (axisTickAnimation.raf) {
        cancelAnimationFrame(axisTickAnimation.raf);
        axisTickAnimation.raf = null;
      }

      const token = ++axisTickAnimation.token;
      const startValues =
        axisTickAnimation.values.length === targetValues.length
          ? [...axisTickAnimation.values]
          : [...targetValues];

      if (
        PFF.reducedMotion() ||
        duration <= 0
      ) {
        axisTickAnimation.values = [...targetValues];
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        if (token !== axisTickAnimation.token) return;

        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );

        const eased =
          PFFCharts.easeInOutCubic(progress);

        axisTickAnimation.values =
          targetValues.map(
            (target, index) => {
              const start = Number(startValues[index]);
              return Number.isFinite(start)
                ? start + (target - start) * eased
                : target;
            }
          );

        chart?.draw();

        if (progress < 1) {
          axisTickAnimation.raf =
            requestAnimationFrame(frame);
        } else {
          axisTickAnimation.raf = null;
          axisTickAnimation.values = [...targetValues];
          chart?.draw();
        }
      }

      axisTickAnimation.raf =
        requestAnimationFrame(frame);
    }

    const zeroLineState = {
      x: null,
      opacity: 0,
      raf: null,
      token: 0
    };

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 -
          Math.pow(-2 * t + 2, 3) /
          2;
    }

    function animateZeroLine(
      targetX,
      targetOpacity,
      duration = 1500,
      onFinish = null
    ) {
      if (!chart?.chartArea) {
        return;
      }

      if (zeroLineState.raf) {
        cancelAnimationFrame(zeroLineState.raf);
      }

      const token =
        ++zeroLineState.token;

      const startX =
        Number.isFinite(zeroLineState.x)
          ? zeroLineState.x
          : targetX;

      const startOpacity =
        Number.isFinite(zeroLineState.opacity)
          ? zeroLineState.opacity
          : 0;

      if (
        PFF.reducedMotion() ||
        duration <= 0 ||
        (
          Math.abs(startX - targetX) < 0.2 &&
          Math.abs(startOpacity - targetOpacity) < 0.01
        )
      ) {
        zeroLineState.x = targetX;
        zeroLineState.opacity = targetOpacity;
        chart.draw();
        onFinish?.();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (token !== zeroLineState.token) {
          return;
        }

        const progress =
          Math.min(
            (now - startedAt) / duration,
            1
          );

        const eased =
          PFFCharts.easeInOutCubic(progress);

        zeroLineState.x =
          startX +
          (targetX - startX) * eased;

        zeroLineState.opacity =
          startOpacity +
          (targetOpacity - startOpacity) * eased;

        chart.draw();

        if (progress < 1) {
          zeroLineState.raf =
            requestAnimationFrame(frame);
        } else {
          zeroLineState.raf = null;
          onFinish?.();
        }
      }

      zeroLineState.raf =
        requestAnimationFrame(frame);
    }

    function zeroTargetPixel() {
      if (!chart?.scales?.x) {
        return null;
      }

      const scale =
        state.scaleCache[state.mode];

      if (
        !scale ||
        !(scale.min < 0 && scale.max > 0)
      ) {
        return null;
      }

      return chart.scales.x.getPixelForValue(0);
    }

    function syncZeroLine(
      animate = true
    ) {
      if (!chart?.chartArea) {
        return;
      }

      const target =
        zeroTargetPixel();

      const left =
        chart.chartArea.left;

      if (Number.isFinite(target)) {
        if (!Number.isFinite(zeroLineState.x)) {
          zeroLineState.x = left;
          zeroLineState.opacity = 0;
        }

        animateZeroLine(
          target,
          1,
          animate ? PFFCharts.chartAnimationDuration() : 0
        );

        return;
      }

      if (Number.isFinite(zeroLineState.x)) {
        animateZeroLine(
          left,
          0,
          animate ? 480 : 0,
          () => {
            zeroLineState.x = null;
            zeroLineState.opacity = 0;
          }
        );
      }
    }

    const zeroLinePlugin = {
      id: 'zeroLinePlugin',

      beforeDatasetsDraw(chartInstance) {
        const x = zeroLineState.x;
        const opacity = zeroLineState.opacity;

        if (
          !Number.isFinite(x) ||
          opacity <= 0.001
        ) {
          return;
        }

        const { ctx, chartArea } =
          chartInstance;

        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(
          Math.round(x) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(x) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();
        ctx.restore();
      }
    };

    const axisSpinesPlugin =
      PFFCharts.createAxisSpinesPlugin({
        id:
          'stateMmmAxisSpines',
        lineWidth:
          1
      });

    const fixedXAxisGridPlugin = {
      id: 'fixedXAxisGridPlugin',

      beforeDatasetsDraw(chartInstance) {
        const { ctx, chartArea } = chartInstance;
        const targetValues = axisTickTargets(state.mode);
        const intervals = AXIS_MAJOR_INTERVALS;

        if (!chartArea || intervals <= 0) return;

        ctx.save();

        // Minor vertical grid lines: one exactly halfway between each
        // pair of major markers. Their pixel positions never change.
        ctx.strokeStyle = 'rgba(105, 113, 138, 0.035)';
        ctx.lineWidth = 0.7;

        for (let index = 0; index < intervals; index += 1) {
          const ratio = (index + 0.5) / intervals;
          const x = chartArea.left + chartArea.width * ratio;

          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.top);
          ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.stroke();
        }

        // Major vertical grid lines: seven fixed pixel positions.
        ctx.strokeStyle = 'rgba(105, 113, 138, 0.075)';
        ctx.lineWidth = 1;

        for (let index = 0; index <= intervals; index += 1) {
          const ratio = index / intervals;
          const x = chartArea.left + chartArea.width * ratio;
          const targetValue = Number(targetValues[index]);

          // The animated black zero line owns the zero position.
          if (
            state.mode === 'oversupply' &&
            Number.isFinite(targetValue) &&
            Math.abs(targetValue) < 0.000001
          ) {
            continue;
          }

          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.top);
          ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(chartInstance) {
        const { ctx, chartArea } = chartInstance;
        const intervals = AXIS_MAJOR_INTERVALS;

        if (!chartArea || intervals <= 0) return;

        ctx.save();

        // Major and minor tick marks use exactly the same fixed positions
        // as the grid lines above.
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;

        for (let index = 0; index <= intervals; index += 1) {
          const ratio = index / intervals;
          const x = chartArea.left + chartArea.width * ratio;

          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom + 5);
          ctx.stroke();
        }

        ctx.strokeStyle = '#69718a';
        ctx.globalAlpha = 0.60;
        ctx.lineWidth = 0.7;

        for (let index = 0; index < intervals; index += 1) {
          const ratio = (index + 0.5) / intervals;
          const x = chartArea.left + chartArea.width * ratio;

          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom + 2);
          ctx.stroke();
        }

        // Tick labels are drawn manually so they stay horizontal and their
        // positions remain perfectly fixed while only their numbers count.
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#151515';
        ctx.textBaseline = 'top';
        ctx.font = '12px Lato, sans-serif';

        const values =
          axisTickAnimation.values.length === AXIS_MAJOR_TICK_COUNT
            ? axisTickAnimation.values
            : axisTickTargets(state.mode);

        for (let index = 0; index <= intervals; index += 1) {
          const ratio = index / intervals;
          const x = chartArea.left + chartArea.width * ratio;
          const value = Number(values[index]);
          const text = formatAxisValue(value);

          if (index === 0) {
            ctx.textAlign = 'left';
          } else if (index === intervals) {
            ctx.textAlign = 'right';
          } else {
            ctx.textAlign = 'center';
          }

          ctx.fillText(text, x, chartArea.bottom + 8);
        }

        ctx.restore();
      }
    };

    const stateGroupSeparatorsPlugin = {
      id: 'stateGroupSeparatorsPlugin',

      beforeDatasetsDraw(chartInstance) {
        const meta = chartInstance.getDatasetMeta(0);
        const stateCodes =
          chartInstance.data.datasets[0]?._stateCodes || [];

        if (
          !meta?.data ||
          meta.data.length < 2 ||
          stateCodes.length < 2
        ) {
          return;
        }

        const { ctx, chartArea } = chartInstance;

        ctx.save();
        ctx.strokeStyle = 'rgba(105, 113, 138, 0.075)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 3]);

        for (let index = 0; index < meta.data.length - 1; index += 1) {
          if (stateCodes[index] === stateCodes[index + 1]) {
            continue;
          }

          const firstBar = meta.data[index];
          const secondBar = meta.data[index + 1];

          if (
            !Number.isFinite(firstBar?.y) ||
            !Number.isFinite(secondBar?.y)
          ) {
            continue;
          }

          const y = (firstBar.y + secondBar.y) / 2;

          // Start at the very left of the canvas so the separator continues
          // through the y-axis label area as well as across the plot.
          ctx.beginPath();
          ctx.moveTo(0, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.right, Math.round(y) + 0.5);
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    const xAxisTitlePlugin = {
      id: 'xAxisTitlePlugin',

      afterDraw(chartInstance) {
        const { ctx, chartArea } = chartInstance;
        const parts = xAxisTitleParts(state.mode);
        const centreX =
          chartArea.left + chartArea.width / 2;
        const mobile = window.innerWidth <= 430;

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#151515';

        // Matches the 13 px bold axis-title treatment used in the other
        // PFF graphs. It sits lower than the counting tick labels above.
        ctx.font = `700 ${mobile ? 12 : 13}px Lato, sans-serif`;
        ctx.fillText(
          parts.main,
          centreX,
          chartArea.bottom + 42
        );

        if (parts.secondary) {
          ctx.fillStyle = '#69718a';
          ctx.font = `400 ${mobile ? 8.5 : 9}px Lato, sans-serif`;

          const benchmarkMatch = parts.secondary.match(
            /^(.+benchmark;)(\s*)(.+)$/
          );

          const needsTwoLines =
            mobile ||
            ctx.measureText(parts.secondary).width > chartArea.width - 4;

          if (needsTwoLines && benchmarkMatch) {
            ctx.fillText(
              benchmarkMatch[1],
              centreX,
              chartArea.bottom + 57
            );
            ctx.fillText(
              benchmarkMatch[3],
              centreX,
              chartArea.bottom + 69
            );
          } else {
            ctx.fillText(
              parts.secondary,
              centreX,
              chartArea.bottom + 58
            );
          }
        }

        ctx.restore();
      }
    };

    const barValueLabelsPlugin = {
      id: 'barValueLabelsPlugin',

      afterDatasetsDraw(chartInstance) {
        const { ctx, chartArea } =
          chartInstance;

        const meta =
          chartInstance.getDatasetMeta(0);

        const targetValues =
          chartInstance.data.datasets[0].data;

        const colours =
          chartInstance.data.datasets[0].backgroundColor;

        const xScale =
          chartInstance.scales.x;

        if (!meta?.data || !xScale) {
          return;
        }

        ctx.save();
        ctx.font =
          `${window.innerWidth <= 430 ? 8.8 : 9.8}px Lato, sans-serif`;
        ctx.textBaseline = 'middle';

        meta.data.forEach(
          (bar, index) => {
            const target =
              Number(targetValues[index]);

            if (!Number.isFinite(target)) {
              return;
            }

            // Convert the CURRENT animated bar end back into a data value.
            // This makes the label count smoothly while the bar morphs.
            let currentValue =
              xScale.getValueForPixel(bar.x);

            if (!Number.isFinite(currentValue)) {
              currentValue = target;
            }

            // Avoid a tiny signed value at the start of an animation.
            if (Math.abs(currentValue) < 0.000001) {
              currentValue = 0;
            }

            const text =
              formatDisplayValue(
                currentValue,
                state.mode,
                state.mode === 'oversupply'
              );

            const textWidth =
              ctx.measureText(text).width;

            const negative =
              currentValue < 0;

            let x =
              negative
                ? bar.x - 6
                : bar.x + 6;

            let align =
              negative
                ? 'right'
                : 'left';

            if (
              !negative &&
              x + textWidth > chartArea.right - 1
            ) {
              x = chartArea.right - 1;
              align = 'right';
            }

            if (
              negative &&
              x - textWidth < chartArea.left + 1
            ) {
              x = chartArea.left + 1;
              align = 'left';
            }

            ctx.fillStyle =
              Array.isArray(colours)
                ? colours[index]
                : colours;

            ctx.textAlign = align;
            ctx.fillText(text, x, bar.y);
          }
        );

        ctx.restore();
      }
    };

    function appChartAnimationDuration(reason) {
      if (PFF.reducedMotion()) {
        return 0;
      }

      return (
        reason === 'tab' ||
        reason === 'initial'
      )
        ? PFFCharts.chartAnimationDuration()
        : 520;
    }

    function chartAnimationEasing(reason) {
      return (
        reason === 'tab' ||
        reason === 'initial'

        ? 'easeInOutCubic'
        : 'easeOutCubic';
    }

    function tooltipLabel(context) {
      const value =
        Number(context.raw);

      const stateCode =
        context.dataset._stateCodes?.[
          context.dataIndex
        ] || '';

      if (state.mode === 'oversupply') {
        return `${stateCode}: ${formatDisplayValue(value, 'oversupply', true)} FTE`;
      }

      if (state.mode === 'clinicians') {
        return `${stateCode}: ${formatDisplayValue(value)} FTE`;
      }

      if (state.mode === 'population') {
        return `${stateCode}: ${formatDisplayValue(value)} people`;
      }

      return `${stateCode}: ${formatDisplayValue(value)} people per FTE`;
    }

    function chartOptions() {
      const scaleDef =
        state.scaleCache[state.mode];

      const duration =
        PFFCharts.chartAnimationDuration();

      return PFFCharts.baseChartOptions({
        indexAxis:
          'y',

        normalized:
          true,

        animation: {
          duration,
          easing:
            'easeInOutCubic'
        },

        animations: {
          x: {
            duration,
            easing:
              'easeInOutCubic'
          },

          y: {

          },

          width: {
            duration:

            duration:

          },

                return {

                    yAxisLabelFontSize(

    function yAxisWidth() {
      const labels =
        visibleLabels();
    
      const baseSize =
        yAxisFontSize();
    
      const context =
        chartCanvas.getContext('2d');
    
      context.save();
    
      context.font =
        `400 ${baseSize}px Lato, sans-serif`;
    
      let widestLabel = 0;
    
      labels.forEach(
        label => {
          const width =
            context.measureText(
              String(label || '')
            ).width;
    
          if (Number.isFinite(width)) {
            widestLabel =
              Math.max(
                widestLabel,
                width
              );
          }
        }
      );
    
      context.restore();
    
      /*
       * Space for:
       * - label itself
       * - 3 px tick
       * - 3 px tick-label padding
       * - small safety margin
       */
      const requiredWidth =
        widestLabel + 11;
    
      return Math.round(
        Math.max(
          30,
          Math.min(
            window.innerWidth <= 430
              ? 140
              : 205,
            requiredWidth
          )
        )
      );
    }

    function yAxisFontSize() {
      const rows =
        Math.max(
          1,
          visibleIndices().length
        );

      const height =
        Math.max(
          260,
          chartCanvas.clientHeight || 520
        );

      const rowSpacing =
        Math.max(
          1,
          (height - 80) / rows
        );

      const cap =
        window.innerWidth <= 430
          ? 10
          : 11;

      /*
       * Keep the normal PHN font as large as vertical spacing allows.
       * Horizontal fitting is handled separately for each label below.
       */
      return Math.max(
        7.2,
        Math.min(
          cap,
          rowSpacing * 0.82
        )
      );
    }

    function yAxisTickLabel(context) {
      const tickLabel =
        context?.tick?.label;

      if (Array.isArray(tickLabel)) {
        return tickLabel.join(' ');
      }

      if (
        tickLabel !== undefined &&
        tickLabel !== null &&
        tickLabel !== ''
      ) {
        return String(tickLabel);
      }

      const index =
        Number(
          context?.tick?.value
        );

      if (!Number.isInteger(index)) {
        return '';
      }

      return (
        visibleLabels()[index] ||
        ''
      );
    }

    function yAxisLabelFontSize(
      label,
      baseSize
    ) {
      /*
       * Desktop keeps the existing behaviour.
       */
      if (window.innerWidth > 430) {
        return baseSize;
      }

      const text =
        String(label || '');

      if (!text) {
        return baseSize;
      }

      /*
       * Leave room inside the y-axis for:
       * - 3 px tick
       * - 3 px tick-label padding
       * - a small safety margin
       */
      const availableWidth =
        Math.max(
          1,
          yAxisWidth() - 10
        );

      const context =
        chartCanvas.getContext('2d');

      context.save();
      context.font =
        `400 ${baseSize}px Lato, sans-serif`;

      const measuredWidth =
        context.measureText(text).width;

      context.restore();

      if (
        !Number.isFinite(measuredWidth) ||
        measuredWidth <= availableWidth
      ) {
        return baseSize;
      }

      /*
       * Only shrink labels that actually exceed the available
       * mobile width. Other MMM labels retain the normal size.
       */
      const fittedSize =
        baseSize *
        (
          availableWidth /
          measuredWidth
        );

      return Math.max(
        5.2,
        Math.min(
          baseSize,
          fittedSize
        )
      );
    }

    function syncVisibleDataset() {
      if (!chart) return;

      const stateCodes = visibleStateCodes();

      chart.data.labels = visibleLabels();
      chart.data.datasets[0].data = metricValues();
      chart.data.datasets[0].backgroundColor = visibleColours();
      chart.data.datasets[0].borderColor = visibleColours();
      chart.data.datasets[0]._stateCodes = stateCodes;
    }

    function createChart() {
      const stateCodes =
        visibleStateCodes();

      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type:
              'bar',

            data: {
              labels:
                visibleLabels(),

              datasets: [
                {
                  data:
                    metricValues(),
                  backgroundColor:
                    visibleColours(),
                  borderColor:
                    visibleColours(),
                  borderWidth:
                    0,
                  borderRadius:
                    2,
                  borderSkipped:
                    false,
                  categoryPercentage:
                    0.78,
                  barPercentage:
                    0.80,
                  _stateCodes:
                    stateCodes
                }
              ]
            },

            options:
              chartOptions(),

            plugins: [
              fixedXAxisGridPlugin,
              stateGroupSeparatorsPlugin,
              zeroLinePlugin,
              axisSpinesPlugin,
              xAxisTitlePlugin,
              barValueLabelsPlugin
            ]
          }
        );
    }

    function syncChartScale() {
      const scaleDef = state.scaleCache[state.mode];
      const x = chart.options.scales.x;

      x.min = scaleDef.min;
      x.max = scaleDef.max;

    }

    function renderChart(
      reason = 'year',
      animateText = true
    ) {
      if (!state.year) return;

      const modeChanged = state.lastRenderedMode !== state.mode;

      animateHeadingMetricChange(
        metricTitle(state.mode),
        animateText && modeChanged
      );

      setYearText(
        String(state.year),
        animateText && (reason === 'year' || reason === 'tab')
      );

      benchmarkControl.classList.toggle(
        'is-hidden',
        state.mode !== 'oversupply'
      );

      if (!chart) {
        setAxisTickValuesImmediately(state.mode);
        createChart();
        state.lastRenderedMode = state.mode;
        headingScroller?.update();
        updateAccessibleSummary();

        requestAnimationFrame(
          () => syncZeroLine(true)
        );

        return;
      }

      const nextAxisTargets = axisTickTargets(state.mode);

      syncVisibleDataset();
      syncChartScale();

      const duration =
        appChartAnimationDuration(reason);

      const easing =
        chartAnimationEasing(reason);

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        easing;

      chart.options.animations.x.duration =
        duration;

      chart.options.animations.x.easing =
        easing;

      chart.options.animations.y.duration =
        reason === 'filter'
          ? 260
          : 0;

      chart.options.animations.y.easing =
        'easeOutCubic';

      chart.update();

      if (reason === 'tab') {
        animateAxisTickValues(
          nextAxisTargets,
          duration
        );
      } else {
        axisTickAnimation.values = [...nextAxisTargets];
      }

      requestAnimationFrame(
        () => syncZeroLine(reason === 'tab')
      );

      state.lastRenderedMode = state.mode;
      headingScroller?.update();
      updateAccessibleSummary();
    }

    function setActiveMode(mode) {
      if (
        ![
          'oversupply',
          'coverage',
          'population',
          'clinicians'
        ].includes(mode) ||
        mode === state.mode
      ) {
        return;
      }

      state.mode = mode;

      if (mode === 'oversupply') {
        benchmarkTitleAnimationToken += 1;
        state.benchmarkTitleDisplay =
          state.benchmarkPopulation;
      }

      configureYearSlider(
        true,
        false
      );

      renderChart(
        'tab',
        true
      );
    }

    function setBenchmarkPopulation(nextValue) {
      const next =
        Number(nextValue);

      if (
        ![5000, 10000].includes(next) ||
        next === state.benchmarkPopulation
      ) {
        return;
      }

      const oldValue =
        state.benchmarkPopulation;

      const fromDisplay =
        Number.isFinite(
          Number(
            state.benchmarkTitleDisplay
          )
        )
          ? Number(
              state.benchmarkTitleDisplay
            )
          : oldValue;

      state.benchmarkPopulation =
        next;

      if (state.mode === 'oversupply') {
        state.benchmarkTitleDisplay =
          fromDisplay;

        renderChart(
          'benchmark',
          false
        );

        animateBenchmarkTitleNumber(
          fromDisplay,
          next,
          420
        );
      } else {
        state.benchmarkTitleDisplay =
          next;
      }
    }

    function buildStateOptions() {
      stateOptions.innerHTML = '';

      ALL_STATES.forEach(code => {
        const label = document.createElement('label');
        label.className = 'state-option';

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = code;
        input.checked = state.selectedStates.has(code);
        input.dataset.stateCode = code;

        const box = document.createElement('span');
        box.className = 'state-option-box';
        box.setAttribute('aria-hidden', 'true');

        const text = document.createElement('span');
        text.className = 'state-code';
        text.textContent = code;
        text.style.color = STATE_COLOURS[code];
        text.title = STATE_NAMES[code];

        label.append(input, box, text);
        stateOptions.appendChild(label);
      });
    }

    function selectedStateSummary() {
      const selected = ALL_STATES.filter(
        code => state.selectedStates.has(code)
      );

      if (selected.length === ALL_STATES.length) return 'All';
      if (selected.length === 0) return 'None';
      if (selected.length === 1) return selected[0];
      return `${selected.length}`;
    }

    function syncStateFilterUi() {
      const selectedCount = state.selectedStates.size;
      stateAll.checked = selectedCount === ALL_STATES.length;
      stateAll.indeterminate = selectedCount > 0 && selectedCount < ALL_STATES.length;

      stateOptions
        .querySelectorAll('input[data-state-code]')
        .forEach(input => {
          input.checked = state.selectedStates.has(input.dataset.stateCode);
        });

      PFF.animateHeading({
        fixed:
          stateButtonValue,
        fixedText:
          selectedStateSummary(),
        duration:
          180
      });
    }

    function applyStateFilter() {
      syncStateFilterUi();
      renderChart('filter', false);
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const visibleStates =
        ALL_STATES.filter(
          code =>
            state.selectedStates.has(code)
        );

      PFFCharts.updateChartSummary(
        `${metricTitle(state.mode)}, year ${state.year ?? 'unavailable'}. Visible states: ${visibleStates.length ? visibleStates.join(', ') : 'none'}.`,
        chartSummary
      );
    }

    function setupControls() {
      buildStateOptions();
      syncStateFilterUi();

      tabsController =
        PFF.setupTabs({
          tabList,
          tabs,
          valueAttribute:
            'mode',
          initialValue:
            state.mode,
          leftButton:
            tabScrollLeft,
          rightButton:
            tabScrollRight,
          onChange(value) {
            setActiveMode(value);
          }
        });

      headingScroller =
        PFF.setupScrollableRegion({
          scroller:
            headingScrollViewport,
          leftButton:
            headingScrollLeft,
          rightButton:
            headingScrollRight
        });

      benchmarkController =
        PFF.setupMetricSwitch({
          element:
            benchmarkModeToggle,
          buttons: [
            benchmark5k,
            benchmark10k
          ],
          valueAttribute:
            'benchmark',
          initialValue:
            String(
              state.benchmarkPopulation
            ),
          onChange(value) {
            setBenchmarkPopulation(
              value
            );
          }
        });

      stateMenuController =
        PFF.setupMenu({
          menu:
            stateControl,
          button:
            stateButton,
          panel:
            stateMenu
        });

      yearSlider.addEventListener(
        'input',
        () => {
          yearSliderWrap.classList.add(
            'has-been-dragged'
          );

          const index =
            Number(
              yearSlider.value
            );

          const year =
            state.activeYears[index];

          if (!Number.isFinite(year)) {
            return;
          }

          if (year === state.year) {
            updateSliderProgress();
            return;
          }

          state.year = year;
          updateSliderProgress();
          renderChart(
            'year',
            true
          );
        }
      );

      stateAll.addEventListener(
        'change',
        () => {
          state.selectedStates =
            stateAll.checked
              ? new Set(ALL_STATES)
              : new Set();

          applyStateFilter();
        }
      );

      stateOptions.addEventListener(
        'change',
        event => {
          const input =
            event.target.closest(
              'input[data-state-code]'
            );

          if (!input) {
            return;
          }

          const code =
            input.dataset.stateCode;

          if (input.checked) {
            state.selectedStates.add(code);
          } else {
            state.selectedStates.delete(code);
          }

          applyStateFilter();
        }
      );
    }

    function setupResponsiveBehaviour() {
      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },

          observe: [
            app,
            chartShell
          ],

          beforeResize(chartInstance) {
            chartInstance.options.interaction = {
              mode:
                'nearest',
              axis:
                'y',
              intersect:
                true
            };

            chartInstance.options.layout.padding.top =
              1;

            chartInstance.options.layout.padding.right =
              1;

            chartInstance.options.scales.y.afterFit =
              scale => {
                scale.width =
                  yAxisWidth();
              };
          },

          afterResize() {
            requestAnimationFrame(
              () => {
                const target =
                  zeroTargetPixel();

                if (Number.isFinite(target)) {
                  zeroLineState.x = target;
                  zeroLineState.opacity = 1;
                } else {
                  zeroLineState.x = null;
                  zeroLineState.opacity = 0;
                }

                chart?.draw();
              }
            );
          },

          onRefresh() {
            tabsController?.update();
            headingScroller?.update();
            updateSliderProgress();
          }
        });
    }

    migrateLegacyLocalCache();
    setupControls();

    PFF.initialiseApp({
      app,
      status:
        statusEl,

      async loadLive() {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.clinicianSheet,
              range:
                CONFIG.clinicianRange,
              headers:
                '2'
            }),

            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.populationSheet,
              range:
                CONFIG.populationRange,
              headers:
                '2'
            })
          ]);

        return {
          clinicianTable,
          populationTable
        };
      },

      parseLive:
        parseLiveData,

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,
          appKey:
            CACHE_APP_KEY
        });
      },

      parseRemoteCache,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        1,

      onLiveError(error) {
        console.warn(
          'Live State MMM workforce data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(error) {
        console.warn(
          'Apps Script State MMM workforce cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          liveData,
        text:
          liveDataText
      },

      render(loaded) {
        applyLoadedRows(
          loaded.rows
        );

        buildScaleCache();

        configureYearSlider(
          false,
          false
        );

        renderChart(
          'initial',
          false
        );

        chartSummary =
          PFFCharts.ensureChartSummary({
            id:
              'stateMmmWorkforceChartSummary',
            parent:
              app
          });

        chartCanvas.setAttribute(
          'aria-describedby',
          chartSummary.id
        );

        updateAccessibleSummary();

        interactionsController =
          PFFCharts.setupChartInteractions({
            canvas:
              chartCanvas,
            getChart() {
              return chart;
            }
          });

        setupResponsiveBehaviour();

        requestAnimationFrame(
          () => {
            tabsController?.update();
            headingScroller?.update();
            syncZeroLine(true);
          }
        );

        return chart;
      },

      onError() {
        liveData.style.visibility =
          'hidden';
      },

      errorMessage:
        'State MMM workforce data unavailable.'
    });
  </script>
</body>
</html>
