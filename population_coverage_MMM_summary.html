    // ============================================================
    // REUSABLE OVERFLOW-TEXT SCROLLERS
    // ============================================================

    function setupOverflowTextScroller(shell) {
      if (!shell) {
        return null;
      }

      const viewport =
        shell.querySelector(
          '.overflow-text-viewport'
        );

      const content =
        viewport?.firstElementChild;

      const leftButton =
        shell.querySelector(
          '.overflow-text-scroll-left'
        );

      const rightButton =
        shell.querySelector(
          '.overflow-text-scroll-right'
        );

      if (
        !viewport ||
        !content ||
        !leftButton ||
        !rightButton
      ) {
        return null;
      }

      let updateFrame =
        null;

      function update() {
        if (updateFrame !== null) {
          cancelAnimationFrame(
            updateFrame
          );
        }

        updateFrame =
          requestAnimationFrame(
            () => {
              updateFrame = null;

              const maximumScroll =
                Math.max(
                  0,
                  viewport.scrollWidth -
                    viewport.clientWidth
                );

              const hasOverflow =
                maximumScroll > 2;

              leftButton.classList.toggle(
                'is-hidden',
                !hasOverflow ||
                  viewport.scrollLeft <= 2
              );

              rightButton.classList.toggle(
                'is-hidden',
                !hasOverflow ||
                  viewport.scrollLeft >=
                    maximumScroll - 2
              );
            }
          );
      }

      function scrollAmount() {
        return Math.max(
          80,
          viewport.clientWidth * 0.72
        );
      }

      leftButton.addEventListener(
        'click',
        event => {
          event.stopPropagation();

          viewport.scrollBy({
            left: -scrollAmount(),
            behavior: 'smooth'
          });
        }
      );

      rightButton.addEventListener(
        'click',
        event => {
          event.stopPropagation();

          viewport.scrollBy({
            left: scrollAmount(),
            behavior: 'smooth'
          });
        }
      );

      viewport.addEventListener(
        'scroll',
        update,
        {
          passive: true
        }
      );

      /*
       * Detect changes in the available width, including when
       * benchmark controls appear/disappear or mobile width changes.
       */
      if ('ResizeObserver' in window) {
        const resizeObserver =
          new ResizeObserver(
            update
          );

        resizeObserver.observe(shell);
        resizeObserver.observe(viewport);
        resizeObserver.observe(content);
      }

      /*
       * Detect title/text changes as tabs switch.
       */
      if ('MutationObserver' in window) {
        const mutationObserver =
          new MutationObserver(
            update
          );

        mutationObserver.observe(
          content,
          {
            childList: true,
            subtree: true,
            characterData: true
          }
        );
      }

      requestAnimationFrame(
        update
      );

      return update;
    }

    const overflowTextScrollUpdates =
      Array.from(
        document.querySelectorAll(
          '.overflow-text-shell'
        )
      )
        .map(
          setupOverflowTextScroller
        )
        .filter(Boolean);
    // ============================================================
    // APP STATE
    // ============================================================

    const state = {
      mode: DEFAULT_MODE,
      year: null,
      benchmarkPopulation: 10000,
      benchmarkTitleDisplay: 10000,
      selectedStates: new Set(ALL_STATES),
      clinicianByYear: {},
      populationByYear: {},
      activeYears: [],
      scaleCache: {},
      sourceState: 'live',
      lastRenderedMode: null
    };

    let chart =
      null;

    let benchmarkTitleAnimationToken =
      0;

    // ============================================================
    // GOOGLE SHEETS JSONP
    // ============================================================

    function loadGVizSheet(
      sheetName,
      range
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `__pff_gviz_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement('script');

          let completed =
            false;

          const cleanup = () => {
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }

            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] = undefined;
            }
          };

          const timer =
            window.setTimeout(
              () => {
                if (completed) {
                  return;
                }

                completed = true;
                cleanup();

                reject(
                  new Error(
                    `Timed out loading ${sheetName}.`
                  )
                );
              },
              15000
            );

          window[callbackName] =
            response => {
              if (completed) {
                return;
              }

              completed = true;
              window.clearTimeout(timer);
              cleanup();

              if (
                !response ||
                response.status === 'error'
              ) {
                const message =
                  response?.errors?.[0]?.detailed_message ||
                  response?.errors?.[0]?.message ||
                  `Could not load ${sheetName}.`;

                reject(
                  new Error(message)
                );

                return;
              }

              resolve(response.table);
            };

          script.onerror = () => {
            if (completed) {
              return;
            }

            completed = true;
            window.clearTimeout(timer);
            cleanup();

            reject(
              new Error(
                `Could not connect to ${sheetName}.`
              )
            );
          };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              headers: '1',
              tqx: `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async = true;
          document.head.appendChild(script);
        }
      );
    }

    function numericCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return null;
      }

      if (
        typeof cell.v === 'number'
      ) {
        return Number.isFinite(cell.v)
          ? cell.v
          : null;
      }

      const cleaned =
        String(cell.v)
          .replace(/,/g, '')
          .replace(/[^0-9.+-]/g, '');

      if (!cleaned) {
        return null;
      }

      const value =
        Number(cleaned);

      return Number.isFinite(value)
        ? value
        : null;
    }

    function yearCell(cell) {
      const value =
        numericCell(cell);

      if (value === null) {
        return null;
      }

      const year =
        Math.round(value);

      return (
        year >= 1900 &&
        year <= 2200
      )
        ? year
        : null;
    }

    function parseTable(
      table,
      firstDataIndex
    ) {
      const result = {};
      const rows = table?.rows || [];

      for (const row of rows) {
        const cells = row?.c || [];
        const year = yearCell(cells[0]);

        if (!year) {
          continue;
        }

        const values =
          PHNS.map(
            (_, index) =>
              numericCell(
                cells[firstDataIndex + index]
              )
          );

        if (
          values.some(Number.isFinite)
        ) {
          result[year] = values;
        }
      }

      return result;
    }

    function parseClinicianTable(table) {
      const result = {};
      const rows = table?.rows || [];

      for (const row of rows) {
        const cells = row?.c || [];
        const year = yearCell(cells[0]);

        if (!year) {
          continue;
        }

        const values =
          PHNS.map(
            (_, index) => {
              const count =
                numericCell(
                  cells[
                    COUNT_FIRST_INDEX +
                    index
                  ]
                );

              const hours =
                numericCell(
                  cells[
                    HOURS_FIRST_INDEX +
                    index
                  ]
                );

              /*
                A genuine zero clinician count is retained as 0 FTE so
                Oversupply can correctly show the resulting shortage.
                Positive clinician counts require a valid positive
                weekly-hours value before an FTE can be calculated.
              */
              if (count === 0) {
                return 0;
              }

              if (
                !Number.isFinite(count) ||
                !Number.isFinite(hours) ||
                count < 0 ||
                hours <= 0
              ) {
                return null;
              }

              const fte =
                count *
                hours /
                FULL_TIME_HOURS;

              return Number.isFinite(fte)
                ? fte
                : null;
            }
          );

        if (
          values.some(Number.isFinite)
        ) {
          result[year] = values;
        }
      }

      return result;
    }

    // ============================================================
    // CACHE
    // ============================================================

    function saveCache() {
      try {
        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            savedAt: Date.now(),
            clinicianByYear: state.clinicianByYear,
            populationByYear: state.populationByYear
          })
        );
      } catch (_) {
        // Cache is optional.
      }
    }

    function loadCache() {
      try {
        const raw =
          localStorage.getItem(CACHE_KEY);

        if (!raw) {
          return false;
        }

        const cached =
          JSON.parse(raw);

        if (
          !cached?.clinicianByYear ||
          !cached?.populationByYear
        ) {
          return false;
        }

        state.clinicianByYear =
          cached.clinicianByYear;

        state.populationByYear =
          cached.populationByYear;

        return true;
      } catch (_) {
        return false;
      }
    }

    async function loadData() {
      try {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            loadGVizSheet(
              CLINICIAN_SHEET,
              CLINICIAN_RANGE
            ),
            loadGVizSheet(
              POPULATION_SHEET,
              POPULATION_RANGE
            )
          ]);

        state.clinicianByYear =
          parseClinicianTable(
            clinicianTable
          );

        state.populationByYear =
          parseTable(
            populationTable,
            POPULATION_FIRST_INDEX
          );

        if (
          !Object.keys(state.clinicianByYear).length
        ) {
          throw new Error(
            'No raw clinician data were found from row 31 onward.'
          );
        }

        if (
          !Object.keys(state.populationByYear).length
        ) {
          throw new Error(
            'No raw population data were found from row 31 onward.'
          );
        }

        state.sourceState = 'live';
        saveCache();
      } catch (error) {
        if (loadCache()) {
          state.sourceState = 'cached';
          return;
        }

        throw error;
      }
    }

    // ============================================================
    // YEARS
    // ============================================================

    function sortedYears(object) {
      return Object.keys(object)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function commonYears() {
      const clinicianYears =
        new Set(
          sortedYears(state.clinicianByYear)
        );

      return sortedYears(
        state.populationByYear
      ).filter(
        year => clinicianYears.has(year)
      );
    }

    function yearsForMode(mode) {
      if (mode === 'clinicians') {
        return sortedYears(
          state.clinicianByYear
        );
      }

      if (mode === 'population') {
        return sortedYears(
          state.populationByYear
        );
      }

      return commonYears();
    }

    function buildYearTicks(years) {
      yearTicks.textContent = '';

      if (!years.length) {
        return;
      }

      const lastIndex =
        Math.max(0, years.length - 1);

      const majorStride =
        Math.max(
          1,
          Math.ceil(
            lastIndex / 4
          )
        );

      years.forEach(
        (_, index) => {
          const tick =
            document.createElement('span');

          const pct =
            lastIndex > 0
              ? (index / lastIndex) * 100
              : 50;

          tick.className = 'year-tick';
          tick.style.left = `${pct}%`;

          if (
            index === 0 ||
            index === lastIndex ||
            index % majorStride === 0
          ) {
            tick.classList.add('is-major');
          }

          yearTicks.appendChild(tick);
        }
      );
    }

    function configureYearSlider(
      keepYear = true,
      animateText = false
    ) {
      const years =
        yearsForMode(state.mode);

      state.activeYears = years;

      if (!years.length) {
        state.year = null;
        yearSlider.min = '0';
        yearSlider.max = '0';
        yearSlider.value = '0';
        yearSlider.disabled = true;
        yearSliderWrap.classList.add('only-one-year');
        buildYearTicks([]);
        setYearText('—', animateText);
        updateSliderProgress();
        return;
      }

      yearSlider.disabled = false;

      if (
        !keepYear ||
        !years.includes(state.year)
      ) {
        state.year =
          years[years.length - 1];
      }

      const index =
        Math.max(
          0,
          years.indexOf(state.year)
        );

      yearSlider.min = '0';
      yearSlider.max = String(years.length - 1);
      yearSlider.step = '1';
      yearSlider.value = String(index);

      yearSliderWrap.classList.toggle(
        'only-one-year',
        years.length <= 1
      );

      buildYearTicks(years);
      setYearText(String(state.year), animateText);
      updateSliderProgress();
    }

    function updateSliderProgress() {
      const min = Number(yearSlider.min);
      const max = Number(yearSlider.max);
      const value = Number(yearSlider.value);

      const percentage =
        max > min
          ? ((value - min) / (max - min)) * 100
          : 100;

      yearSliderWrap.style.setProperty(
        '--slider-progress',
        `${percentage}%`
      );
    }

    // ============================================================
    // METRICS
    // ============================================================

    function safeNumber(value) {
      const numeric = Number(value);

      return Number.isFinite(numeric)
        ? numeric
        : null;
    }

    function metricValuesFor(
      mode,
      year,
      benchmarkPopulation = state.benchmarkPopulation
    ) {
      const clinicians =
        state.clinicianByYear[year] || [];

      const population =
        state.populationByYear[year] || [];

      if (mode === 'clinicians') {
        return PHNS.map(
          (_, index) => {
            const value =
              safeNumber(clinicians[index]);

            return value === null
              ? null
              : Math.round(value);
          }
        );
      }

      if (mode === 'population') {
        return PHNS.map(
          (_, index) => {
            const value =
              safeNumber(population[index]);

            return value === null
              ? null
              : Math.round(value);
          }
        );
      }

      if (mode === 'coverage') {
        return PHNS.map(
          (_, index) => {
            const c = safeNumber(clinicians[index]);
            const p = safeNumber(population[index]);

            if (
              c === null ||
              p === null ||
              c <= 0
            ) {
              return null;
            }

            return Math.round(p / c);
          }
        );
      }

      return PHNS.map(
        (_, index) => {
          const c = safeNumber(clinicians[index]);
          const p = safeNumber(population[index]);

          if (
            c === null ||
            p === null
          ) {
            return null;
          }

          return Math.round(
            c - (p / benchmarkPopulation)
          );
        }
      );
    }

    function visibleIndices() {
      return PHNS
        .map((_, index) => index)
        .filter(
          index => state.selectedStates.has(STATE_CODES[index])
        );
    }

    function visibleLabels() {
      const indices =
        visibleIndices();

      const visibleStates =
        new Set(
          indices.map(
            index => STATE_CODES[index]
          )
        );

      const includeStateCode =
        visibleStates.size > 1;

      return indices.map(
        index =>
          includeStateCode
            ? `${STATE_CODES[index]} · MM${MMM_NUMBERS[index]}`
            : `MM${MMM_NUMBERS[index]}`
      );
    }

    function visibleStateCodes() {
      return visibleIndices().map(index => STATE_CODES[index]);
    }

    function visibleColours() {
      return visibleStateCodes().map(code => STATE_COLOURS[code]);
    }

    function metricValues() {
      if (!state.year) {
        return [];
      }

      const allValues = metricValuesFor(
        state.mode,
        state.year,
        state.benchmarkPopulation
      );

      return visibleIndices().map(index => allValues[index]);
    }

    function metricTitle(mode) {
      switch (mode) {
        case 'clinicians':
          return 'FTE clinicians';

        case 'population':
          return 'Population';

        case 'coverage':
          return 'People per FTE clinician';

        case 'oversupply':
        default:
          return 'FTE clinician oversupply';
      }
    }

    function xAxisTitleParts(mode) {
      switch (mode) {
        case 'clinicians':
          return {
            main: 'FTE clinicians',
            secondary: ''
          };

        case 'population':
          return {
            main: 'Population',
            secondary: ''
          };

        case 'coverage':
          return {
            main: 'People per FTE clinician',
            secondary: ''
          };

        case 'oversupply':
        default: {
          const benchmark = formatInteger(
            state.benchmarkTitleDisplay
          );

          return {
            main: 'Excess FTE clinicians',
            secondary:
              `(1 FTE per ${benchmark} people benchmark; +ve = oversupply, –ve = shortage)`
          };
        }
      }
    }


    // ============================================================
    // CONSTANT PER-TAB X SCALES
    //
    // Each tab gets one scale calculated from every available year.
    // Oversupply additionally considers BOTH 1/10k and 1/5k values.
    // The scale therefore does not jump when the year slider or benchmark
    // toggle changes, but it is allowed to change when switching tabs.
    // ============================================================

    function flattenFinite(arrays) {
      return arrays
        .flat()
        .filter(Number.isFinite);
    }

    function niceStep(rawStep) {
      if (
        !Number.isFinite(rawStep) ||
        rawStep <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(rawStep)
        );

      const magnitude =
        Math.pow(10, exponent);

      const fraction =
        rawStep / magnitude;

      let niceFraction;

      if (fraction <= 1) {
        niceFraction = 1;
      } else if (fraction <= 2) {
        niceFraction = 2;
      } else if (fraction <= 5) {
        niceFraction = 5;
      } else {
        niceFraction = 10;
      }

      return Math.max(1, niceFraction * magnitude);
    }

    const AXIS_MAJOR_INTERVALS = 6;
    const AXIS_MAJOR_TICK_COUNT = AXIS_MAJOR_INTERVALS + 1;

    function nextNiceStep(step) {
      const value = Math.max(1e-9, Number(step) || 1);
      const exponent = Math.floor(Math.log10(value));
      const magnitude = Math.pow(10, exponent);
      const fraction = value / magnitude;

      if (fraction < 1.5) return 2 * magnitude;
      if (fraction < 3.5) return 5 * magnitude;
      if (fraction < 7.5) return 10 * magnitude;
      return 20 * magnitude;
    }

    function deriveConstantScale(
      values,
      allowNegative
    ) {
      const finite =
        values.filter(Number.isFinite);

      if (!finite.length) {
        return {
          min: 0,
          max: AXIS_MAJOR_INTERVALS,
          step: 1,
          minorStep: 0.5
        };
      }

      const rawMin =
        Math.min(...finite);

      const rawMax =
        Math.max(...finite);

      if (!allowNegative) {
        const paddedMax =
          Math.max(1, rawMax) * 1.14;

        let step =
          niceStep(
            paddedMax / AXIS_MAJOR_INTERVALS
          );

        while (
          step * AXIS_MAJOR_INTERVALS < paddedMax
        ) {
          step = nextNiceStep(step);
        }

        return {
          min: 0,
          max: step * AXIS_MAJOR_INTERVALS,
          step,
          minorStep: step / 2
        };
      }

      const rawSpan =
        Math.max(
          rawMax - rawMin,
          Math.abs(rawMax),
          Math.abs(rawMin),
          1
        );

      const lowerNeed =
        Math.max(0, -Math.min(0, rawMin) + rawSpan * 0.10);

      const upperNeed =
        Math.max(0, Math.max(0, rawMax) + rawSpan * 0.12);

      let step =
        niceStep(
          (lowerNeed + upperNeed) / AXIS_MAJOR_INTERVALS
        );

      let negativeIntervals;
      let positiveIntervals;

      while (true) {
        negativeIntervals =
          lowerNeed > 0
            ? Math.ceil(lowerNeed / step - 1e-10)
            : 0;

        positiveIntervals =
          upperNeed > 0
            ? Math.ceil(upperNeed / step - 1e-10)
            : 0;

        if (
          negativeIntervals + positiveIntervals <=
          AXIS_MAJOR_INTERVALS
        ) {
          break;
        }

        step = nextNiceStep(step);
      }

      while (
        negativeIntervals + positiveIntervals <
        AXIS_MAJOR_INTERVALS
      ) {
        const lowerFill =
          negativeIntervals > 0
            ? lowerNeed / (negativeIntervals * step)
            : 0;

        const upperFill =
          positiveIntervals > 0
            ? upperNeed / (positiveIntervals * step)
            : 0;

        if (
          lowerNeed > 0 &&
          (upperNeed <= 0 || lowerFill >= upperFill)
        ) {
          negativeIntervals += 1;
        } else {
          positiveIntervals += 1;
        }
      }

      return {
        min: -negativeIntervals * step,
        max: positiveIntervals * step,
        step,
        minorStep: step / 2
      };
    }

    function buildScaleCache() {
      const clinicianYears =
        yearsForMode('clinicians');

      const populationYears =
        yearsForMode('population');

      const sharedYears =
        commonYears();

      const clinicianValues =
        flattenFinite(
          clinicianYears.map(
            year => metricValuesFor('clinicians', year)
          )
        );

      const populationValues =
        flattenFinite(
          populationYears.map(
            year => metricValuesFor('population', year)
          )
        );

      const coverageValues =
        flattenFinite(
          sharedYears.map(
            year => metricValuesFor('coverage', year)
          )
        );

      const oversupplyValues =
        flattenFinite(
          sharedYears.flatMap(
            year => [
              metricValuesFor('oversupply', year, 10000),
              metricValuesFor('oversupply', year, 5000)
            ]
          )
        );

      state.scaleCache = {
        clinicians:
          deriveConstantScale(
            clinicianValues,
            false
          ),

        population:
          deriveConstantScale(
            populationValues,
            false
          ),

        coverage:
          deriveConstantScale(
            coverageValues,
            false
          ),

        oversupply:
          deriveConstantScale(
            oversupplyValues,
            true
          )
      };
    }

    // ============================================================
    // FORMATTERS
    // ============================================================

    function formatInteger(value) {
      return Math.round(value)
        .toLocaleString('en-AU');
    }

    function formatYear(value) {
      const year = Math.round(Number(value));
      return Number.isFinite(year)
        ? String(year)
        : '—';
    }

    function formatDisplayValue(
      value,
      mode = state.mode,
      includePlus = false
    ) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      const rounded = Math.round(value);
      const prefix =
        includePlus && rounded > 0
          ? '+'
          : '';

      return `${prefix}${formatInteger(rounded)}`;
    }

    function formatAxisValue(value) {
      const numeric = Number(value);

      if (!Number.isFinite(numeric)) {
        return '';
      }

      const absolute =
        Math.abs(numeric);

      if (absolute >= 1000000) {
        const scaled =
          numeric / 1000000;

        const rounded =
          Math.abs(scaled - Math.round(scaled)) < 0.000001
            ? Math.round(scaled).toString()
            : scaled.toFixed(1).replace(/\.0$/, '');

        return `${rounded}m`;
      }

      if (absolute >= 1000) {
        const scaled =
          numeric / 1000;

        const rounded =
          Math.abs(scaled - Math.round(scaled)) < 0.000001
            ? Math.round(scaled).toString()
            : scaled.toFixed(1).replace(/\.0$/, '');

        return `${rounded}k`;
      }

      return formatInteger(numeric);
    }

    // ============================================================
    // SMALL TEXT ANIMATIONS
    // Only the text that actually changes moves/fades.
    // ============================================================

    function reducedMotion() {
      return window
        .matchMedia(
          '(prefers-reduced-motion: reduce)'
        )
        .matches;
    }

    function fadeTextChange(
      element,
      nextText,
      animate = true
    ) {
      if (!element) {
        return;
      }

      const text = String(nextText);

      if (element.textContent === text) {
        return;
      }

      if (
        !animate ||
        reducedMotion() ||
        typeof element.animate !== 'function'
      ) {
        element.textContent = text;
        return;
      }

      const token =
        (Number(element.dataset.textAnimationToken) || 0) + 1;
      element.dataset.textAnimationToken = String(token);

      const fadeOut = element.animate(
        [
          { opacity: 1 },
          { opacity: 0 }
        ],
        {
          duration: 150,
          easing: 'ease-out',
          fill: 'forwards'
        }
      );

      fadeOut.finished
        .then(() => {
          if (Number(element.dataset.textAnimationToken) !== token) return;
          fadeOut.cancel();
          element.textContent = text;

          const fadeIn = element.animate(
            [
              { opacity: 0 },
              { opacity: 1 }
            ],
            {
              duration: 230,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );

          fadeIn.finished
            .then(() => fadeIn.cancel())
            .catch(() => {});
        })
        .catch(() => {
          element.textContent = text;
        });
    }

    function animateHeadingMetricChange(
      nextText,
      animate = true
    ) {
      if (!headingMetric) return;

      const text = String(nextText);

      if (headingMetric.textContent === text) {
        return;
      }

      if (
        !animate ||
        reducedMotion() ||
        typeof headingMetric.animate !== 'function' ||
        !headingYearWrap
      ) {
        headingMetric.textContent = text;
        return;
      }

      const token =
        (Number(headingMetric.dataset.headingAnimationToken) || 0) + 1;

      headingMetric.dataset.headingAnimationToken = String(token);

      headingMetric.getAnimations?.().forEach(animation => animation.cancel());
      headingYearWrap.getAnimations?.().forEach(animation => animation.cancel());

      const oldYearLeft =
        headingYearWrap.getBoundingClientRect().left;

      const fadeOut = headingMetric.animate(
        [
          { opacity: 1 },
          { opacity: 0 }
        ],
        {
          duration: 150,
          easing: 'ease-out',
          fill: 'forwards'
        }
      );

      fadeOut.finished
        .then(() => {
          if (
            Number(headingMetric.dataset.headingAnimationToken) !== token
          ) {
            return;
          }

          fadeOut.cancel();
          headingMetric.textContent = text;

          const newYearLeft =
            headingYearWrap.getBoundingClientRect().left;

          const deltaX =
            oldYearLeft - newYearLeft;

          if (Math.abs(deltaX) > 0.25) {
            headingYearWrap.animate(
              [
                { transform: `translateX(${deltaX}px)` },
                { transform: 'translateX(0)' }
              ],
              {
                duration: 420,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );
          }

          const fadeIn = headingMetric.animate(
            [
              { opacity: 0 },
              { opacity: 1 }
            ],
            {
              duration: 230,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );

          fadeIn.finished
            .then(() => fadeIn.cancel())
            .catch(() => {});
        })
        .catch(() => {
          headingMetric.textContent = text;
        });
    }

    function animateIntegerText(
      element,
      targetValue,
      duration = 260
    ) {
      if (!element) return;

      const target = Number(targetValue);

      if (!Number.isFinite(target)) {
        element.textContent = '—';
        delete element.dataset.numericValue;
        return;
      }

      const stored = Number(element.dataset.numericValue);
      const parsed = Number(String(element.textContent).replace(/[^0-9.-]/g, ''));
      const start = Number.isFinite(stored)
        ? stored
        : Number.isFinite(parsed)
          ? parsed
          : target;

      const token =
        (Number(element.dataset.animationToken) || 0) + 1;
      element.dataset.animationToken = String(token);

      if (
        reducedMotion() ||
        start === target ||
        duration <= 0
      ) {
        element.textContent = formatInteger(target);
        element.dataset.numericValue = String(target);
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        if (Number(element.dataset.animationToken) !== token) return;

        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );

        const eased = 1 - Math.pow(1 - progress, 3);
        const current = start + (target - start) * eased;

        element.textContent = formatInteger(current);
        element.dataset.numericValue = String(current);

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          element.textContent = formatInteger(target);
          element.dataset.numericValue = String(target);
        }
      }

      requestAnimationFrame(frame);
    }

    function animateYearText(
      element,
      targetYear,
      duration = 220
    ) {
      if (!element) return;

      const target = Math.round(Number(targetYear));

      if (!Number.isFinite(target)) {
        element.textContent = '—';
        delete element.dataset.numericValue;
        return;
      }

      const stored = Number(element.dataset.numericValue);
      const parsed = Number(String(element.textContent).replace(/[^0-9.-]/g, ''));
      const start = Number.isFinite(stored)
        ? stored
        : Number.isFinite(parsed)
          ? parsed
          : target;

      const token =
        (Number(element.dataset.animationToken) || 0) + 1;
      element.dataset.animationToken = String(token);

      if (
        reducedMotion() ||
        start === target ||
        duration <= 0
      ) {
        element.textContent = formatYear(target);
        element.dataset.numericValue = String(target);
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        if (Number(element.dataset.animationToken) !== token) return;

        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );

        const eased = 1 - Math.pow(1 - progress, 3);
        const current = start + (target - start) * eased;

        element.textContent = formatYear(current);
        element.dataset.numericValue = String(current);

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          element.textContent = formatYear(target);
          element.dataset.numericValue = String(target);
        }
      }

      requestAnimationFrame(frame);
    }

    function setYearText(yearText, animate) {
      const year = Number(yearText);

      if (!Number.isFinite(year)) {
        headingYear.textContent = '—';
        projectionYear.textContent = '—';
        return;
      }

      if (animate) {
        animateYearText(headingYear, year, 220);
        animateYearText(projectionYear, year, 220);
      } else {
        headingYear.textContent = formatYear(year);
        projectionYear.textContent = formatYear(year);
        headingYear.dataset.numericValue = String(year);
        projectionYear.dataset.numericValue = String(year);
      }
    }

    function animateBenchmarkTitleNumber(
      fromValue,
      toValue,
      duration = 420
    ) {
      const start = Number(fromValue);
      const target = Number(toValue);
      const token = ++benchmarkTitleAnimationToken;

      if (
        !Number.isFinite(start) ||
        !Number.isFinite(target) ||
        reducedMotion() ||
        duration <= 0 ||
        start === target
      ) {
        state.benchmarkTitleDisplay = target;
        if (chart) {
          chart.draw();
        }
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        if (token !== benchmarkTitleAnimationToken) return;

        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );
        const eased = 1 - Math.pow(1 - progress, 3);

        state.benchmarkTitleDisplay = Math.round(
          start + (target - start) * eased
        );

        if (chart && state.mode === 'oversupply') {
          chart.draw();
        }

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          state.benchmarkTitleDisplay = target;
          if (chart && state.mode === 'oversupply') {
            chart.draw();
          }
        }
      }

      requestAnimationFrame(frame);
    }

    // ============================================================
    // FIXED X-TICK POSITIONS + COUNTING LABELS BETWEEN TABS
    // ============================================================

    const axisTickAnimation = {
      values: [],
      token: 0,
      raf: null
    };

    function axisTickTargets(mode = state.mode) {
      const scaleDef = state.scaleCache[mode];

      if (!scaleDef) {
        return Array.from(
          { length: AXIS_MAJOR_TICK_COUNT },
          (_, index) => index
        );
      }

      return Array.from(
        { length: AXIS_MAJOR_TICK_COUNT },
        (_, index) =>
          scaleDef.min + scaleDef.step * index
      );
    }

    function setAxisTickValuesImmediately(mode = state.mode) {
      axisTickAnimation.values = axisTickTargets(mode);
    }

    function animateAxisTickValues(
      targets,
      duration = 420
    ) {
      const targetValues =
        Array.from(targets || []);

      if (!targetValues.length) return;

      if (axisTickAnimation.raf) {
        cancelAnimationFrame(axisTickAnimation.raf);
        axisTickAnimation.raf = null;
      }

      const token = ++axisTickAnimation.token;
      const startValues =
        axisTickAnimation.values.length === targetValues.length
          ? [...axisTickAnimation.values]
          : [...targetValues];

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        axisTickAnimation.values = [...targetValues];
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        if (token !== axisTickAnimation.token) return;

        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );

        const eased = 1 - Math.pow(1 - progress, 3);

        axisTickAnimation.values =
          targetValues.map(
            (target, index) => {
              const start = Number(startValues[index]);
              return Number.isFinite(start)
                ? start + (target - start) * eased
                : target;
            }
          );

        chart?.draw();

        if (progress < 1) {
          axisTickAnimation.raf =
            requestAnimationFrame(frame);
        } else {
          axisTickAnimation.raf = null;
          axisTickAnimation.values = [...targetValues];
          chart?.draw();
        }
      }

      axisTickAnimation.raf =
        requestAnimationFrame(frame);
    }

    // ============================================================
    // ZERO LINE ANIMATION
    // ============================================================

    const zeroLineState = {
      x: null,
      opacity: 0,
      raf: null,
      token: 0
    };

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function animateZeroLine(
      targetX,
      targetOpacity,
      duration = 620,
      onFinish = null
    ) {
      if (!chart?.chartArea) {
        return;
      }

      if (zeroLineState.raf) {
        cancelAnimationFrame(zeroLineState.raf);
      }

      const token =
        ++zeroLineState.token;

      const startX =
        Number.isFinite(zeroLineState.x)
          ? zeroLineState.x
          : targetX;

      const startOpacity =
        Number.isFinite(zeroLineState.opacity)
          ? zeroLineState.opacity
          : 0;

      if (
        reducedMotion() ||
        duration <= 0 ||
        (
          Math.abs(startX - targetX) < 0.2 &&
          Math.abs(startOpacity - targetOpacity) < 0.01
        )
      ) {
        zeroLineState.x = targetX;
        zeroLineState.opacity = targetOpacity;
        chart.draw();
        onFinish?.();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (token !== zeroLineState.token) {
          return;
        }

        const progress =
          Math.min(
            (now - startedAt) / duration,
            1
          );

        const eased =
          easeOutCubic(progress);

        zeroLineState.x =
          startX +
          (targetX - startX) * eased;

        zeroLineState.opacity =
          startOpacity +
          (targetOpacity - startOpacity) * eased;

        chart.draw();

        if (progress < 1) {
          zeroLineState.raf =
            requestAnimationFrame(frame);
        } else {
          zeroLineState.raf = null;
          onFinish?.();
        }
      }

      zeroLineState.raf =
        requestAnimationFrame(frame);
    }

    function zeroTargetPixel() {
      if (!chart?.scales?.x) {
        return null;
      }

      const scale =
        state.scaleCache[state.mode];

      if (
        !scale ||
        !(scale.min < 0 && scale.max > 0)
      ) {
        return null;
      }

      return chart.scales.x.getPixelForValue(0);
    }

    function syncZeroLine(
      animate = true
    ) {
      if (!chart?.chartArea) {
        return;
      }

      const target =
        zeroTargetPixel();

      const left =
        chart.chartArea.left;

      if (Number.isFinite(target)) {
        if (!Number.isFinite(zeroLineState.x)) {
          zeroLineState.x = left;
          zeroLineState.opacity = 0;
        }

        animateZeroLine(
          target,
          1,
          animate ? 620 : 0
        );

        return;
      }

      if (Number.isFinite(zeroLineState.x)) {
        animateZeroLine(
          left,
          0,
          animate ? 480 : 0,
          () => {
            zeroLineState.x = null;
            zeroLineState.opacity = 0;
          }
        );
      }
    }

    // ============================================================
    // CHART PLUGINS
    // ============================================================

    const zeroLinePlugin = {
      id: 'zeroLinePlugin',

      beforeDatasetsDraw(chartInstance) {
        const x = zeroLineState.x;
        const opacity = zeroLineState.opacity;

        if (
          !Number.isFinite(x) ||
          opacity <= 0.001
        ) {
          return;
        }

        const { ctx, chartArea } =
          chartInstance;

        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(
          Math.round(x) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(x) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();
        ctx.restore();
      }
    };

    const axisSpinesPlugin = {
      id: 'axisSpinesPlugin',

      afterDraw(chartInstance) {
        const { ctx, chartArea } =
          chartInstance;

        ctx.save();
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;

        // Fixed left y-axis spine.
        ctx.beginPath();
        ctx.moveTo(
          Math.round(chartArea.left) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(chartArea.left) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();

        // Fixed bottom x-axis spine.
        ctx.beginPath();
        ctx.moveTo(
          chartArea.left,
          Math.round(chartArea.bottom) + 0.5
        );
        ctx.lineTo(
          chartArea.right,
          Math.round(chartArea.bottom) + 0.5
        );
        ctx.stroke();

        ctx.restore();
      }
    };

    const fixedXAxisGridPlugin = {
      id: 'fixedXAxisGridPlugin',

      beforeDatasetsDraw(chartInstance) {
        const { ctx, chartArea } = chartInstance;
        const targetValues = axisTickTargets(state.mode);
        const intervals = AXIS_MAJOR_INTERVALS;

        if (!chartArea || intervals <= 0) return;

        ctx.save();

        // Minor vertical grid lines: one exactly halfway between each
        // pair of major markers. Their pixel positions never change.
        ctx.strokeStyle = 'rgba(105, 113, 138, 0.035)';
        ctx.lineWidth = 0.7;

        for (let index = 0; index < intervals; index += 1) {
          const ratio = (index + 0.5) / intervals;
          const x = chartArea.left + chartArea.width * ratio;

          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.top);
          ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.stroke();
        }

        // Major vertical grid lines: seven fixed pixel positions.
        ctx.strokeStyle = 'rgba(105, 113, 138, 0.075)';
        ctx.lineWidth = 1;

        for (let index = 0; index <= intervals; index += 1) {
          const ratio = index / intervals;
          const x = chartArea.left + chartArea.width * ratio;
          const targetValue = Number(targetValues[index]);

          // The animated black zero line owns the zero position.
          if (
            state.mode === 'oversupply' &&
            Number.isFinite(targetValue) &&
            Math.abs(targetValue) < 0.000001
          ) {
            continue;
          }

          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.top);
          ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(chartInstance) {
        const { ctx, chartArea } = chartInstance;
        const intervals = AXIS_MAJOR_INTERVALS;

        if (!chartArea || intervals <= 0) return;

        ctx.save();

        // Major and minor tick marks use exactly the same fixed positions
        // as the grid lines above.
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;

        for (let index = 0; index <= intervals; index += 1) {
          const ratio = index / intervals;
          const x = chartArea.left + chartArea.width * ratio;

          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom + 5);
          ctx.stroke();
        }

        ctx.strokeStyle = '#69718a';
        ctx.globalAlpha = 0.60;

        for (let index = 0; index < intervals; index += 1) {
          const ratio = (index + 0.5) / intervals;
          const x = chartArea.left + chartArea.width * ratio;

          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom + 2);
          ctx.stroke();
        }

        // Tick labels are drawn manually so they stay horizontal and their
        // positions remain perfectly fixed while only their numbers count.
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#151515';
        ctx.textBaseline = 'top';
        ctx.font = `${window.innerWidth <= 430 ? 9 : 10}px Lato, sans-serif`;

        const values =
          axisTickAnimation.values.length === AXIS_MAJOR_TICK_COUNT
            ? axisTickAnimation.values
            : axisTickTargets(state.mode);

        for (let index = 0; index <= intervals; index += 1) {
          const ratio = index / intervals;
          const x = chartArea.left + chartArea.width * ratio;
          const value = Number(values[index]);
          const text = formatAxisValue(value);

          if (index === 0) {
            ctx.textAlign = 'left';
          } else if (index === intervals) {
            ctx.textAlign = 'right';
          } else {
            ctx.textAlign = 'center';
          }

          ctx.fillText(text, x, chartArea.bottom + 8);
        }

        ctx.restore();
      }
    };

    const stateGroupSeparatorsPlugin = {
      id: 'stateGroupSeparatorsPlugin',

      beforeDatasetsDraw(chartInstance) {
        const meta = chartInstance.getDatasetMeta(0);
        const stateCodes =
          chartInstance.data.datasets[0]?._stateCodes || [];

        if (
          !meta?.data ||
          meta.data.length < 2 ||
          stateCodes.length < 2
        ) {
          return;
        }

        const { ctx, chartArea } = chartInstance;

        ctx.save();
        ctx.strokeStyle = 'rgba(105, 113, 138, 0.075)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 3]);

        for (let index = 0; index < meta.data.length - 1; index += 1) {
          if (stateCodes[index] === stateCodes[index + 1]) {
            continue;
          }

          const firstBar = meta.data[index];
          const secondBar = meta.data[index + 1];

          if (
            !Number.isFinite(firstBar?.y) ||
            !Number.isFinite(secondBar?.y)
          ) {
            continue;
          }

          const y = (firstBar.y + secondBar.y) / 2;

          // Start at the very left of the canvas so the separator continues
          // through the y-axis label area as well as across the plot.
          ctx.beginPath();
          ctx.moveTo(0, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.right, Math.round(y) + 0.5);
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    const xAxisTitlePlugin = {
      id: 'xAxisTitlePlugin',

      afterDraw(chartInstance) {
        const { ctx, chartArea } = chartInstance;
        const parts = xAxisTitleParts(state.mode);
        const centreX =
          chartArea.left + chartArea.width / 2;
        const mobile = window.innerWidth <= 430;

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#151515';

        // Matches the 13 px bold axis-title treatment used in the other
        // PFF graphs. It sits lower than the counting tick labels above.
        ctx.font = '700 13px Lato, sans-serif';
        ctx.fillText(
          parts.main,
          centreX,
          chartArea.bottom + 42
        );

        if (parts.secondary) {
          ctx.fillStyle = '#69718a';
          ctx.font = `400 ${mobile ? 8.5 : 9}px Lato, sans-serif`;

          const benchmarkMatch = parts.secondary.match(
            /^(.+benchmark;)(\s*)(.+)$/
          );

          const needsTwoLines =
            mobile ||
            ctx.measureText(parts.secondary).width > chartArea.width - 4;

          if (needsTwoLines && benchmarkMatch) {
            ctx.fillText(
              benchmarkMatch[1],
              centreX,
              chartArea.bottom + 57
            );
            ctx.fillText(
              benchmarkMatch[3],
              centreX,
              chartArea.bottom + 69
            );
          } else {
            ctx.fillText(
              parts.secondary,
              centreX,
              chartArea.bottom + 58
            );
          }
        }

        ctx.restore();
      }
    };

    const barValueLabelsPlugin = {
      id: 'barValueLabelsPlugin',

      afterDatasetsDraw(chartInstance) {
        const { ctx, chartArea } =
          chartInstance;

        const meta =
          chartInstance.getDatasetMeta(0);

        const targetValues =
          chartInstance.data.datasets[0].data;

        const colours =
          chartInstance.data.datasets[0].backgroundColor;

        const xScale =
          chartInstance.scales.x;

        if (!meta?.data || !xScale) {
          return;
        }

        ctx.save();
        ctx.font =
          `${window.innerWidth <= 430 ? 8.8 : 9.8}px Lato, sans-serif`;
        ctx.textBaseline = 'middle';

        meta.data.forEach(
          (bar, index) => {
            const target =
              Number(targetValues[index]);

            if (!Number.isFinite(target)) {
              return;
            }

            // Convert the CURRENT animated bar end back into a data value.
            // This makes the label count smoothly while the bar morphs.
            let currentValue =
              xScale.getValueForPixel(bar.x);

            if (!Number.isFinite(currentValue)) {
              currentValue = target;
            }

            // Avoid a tiny signed value at the start of an animation.
            if (Math.abs(currentValue) < 0.000001) {
              currentValue = 0;
            }

            const text =
              formatDisplayValue(
                currentValue,
                state.mode,
                state.mode === 'oversupply'
              );

            const textWidth =
              ctx.measureText(text).width;

            const negative =
              currentValue < 0;

            let x =
              negative
                ? bar.x - 6
                : bar.x + 6;

            let align =
              negative
                ? 'right'
                : 'left';

            if (
              !negative &&
              x + textWidth > chartArea.right - 1
            ) {
              x = chartArea.right - 1;
              align = 'right';
            }

            if (
              negative &&
              x - textWidth < chartArea.left + 1
            ) {
              x = chartArea.left + 1;
              align = 'left';
            }

            ctx.fillStyle =
              Array.isArray(colours)
                ? colours[index]
                : colours;

            ctx.textAlign = align;
            ctx.fillText(text, x, bar.y);
          }
        );

        ctx.restore();
      }
    };

    Chart.register(
      fixedXAxisGridPlugin,
      stateGroupSeparatorsPlugin,
      zeroLinePlugin,
      axisSpinesPlugin,
      xAxisTitlePlugin,
      barValueLabelsPlugin
    );

    // ============================================================
    // CHART CONFIGURATION
    // ============================================================

    function chartAnimationDuration(reason) {
      if (reducedMotion()) {
        return 0;
      }

      switch (reason) {
        case 'tab':
          return 680;

        case 'benchmark':
          return 520;

        case 'year':
          return 420;

        case 'filter':
          return 480;

        case 'initial':
          return 760;

        default:
          return 520;
      }
    }

    function tooltipLabel(context) {
      const value = Number(context.raw);
      const stateCode =
        context.dataset._stateCodes?.[context.dataIndex] || '';

      if (state.mode === 'oversupply') {
        return `${stateCode}: ${formatDisplayValue(value, 'oversupply', true)} FTE`;
      }

      if (state.mode === 'clinicians') {
        return `${stateCode}: ${formatDisplayValue(value)} FTE`;
      }

      if (state.mode === 'population') {
        return `${stateCode}: ${formatDisplayValue(value)} people`;
      }

      return `${stateCode}: ${formatDisplayValue(value)} people per FTE`;
    }

    function baseChartOptions() {
      const mobile =
        window.innerWidth <= 430;

      const scaleDef =
        state.scaleCache[state.mode];

      return {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 80,

        animation: {
          duration: 900,
          easing: 'easeOutQuart'
        },

        animations: {
          x: {
            duration: 900,
            easing: 'easeOutQuart'
          },
          y: {
            duration: 0
          },
          base: {
            duration: 0
          },
          width: {
            duration: 0
          },
          height: {
            duration: 0
          }
        },

        transitions: {
          active: {
            animation: {
              duration: 180
            }
          }
        },

        interaction: {
          mode: 'nearest',
          axis: 'y',
          intersect: true
        },

        layout: {
          autoPadding: false,
          padding: {
            top: 1,
            right: 1,
            bottom: 0,
            left: 0
          }
        },

        plugins: {
          legend: {
            display: false
          },

          tooltip: {
            displayColors: true,
            backgroundColor: 'rgba(21, 21, 21, 0.94)',
            titleColor: '#ffffff',
            bodyColor: '#ffffff',
            borderColor: 'rgba(255,255,255,0.10)',
            borderWidth: 1,
            padding: 9,
            cornerRadius: 4,

            titleFont: {
              family: 'Lato',
              size: 11,
              weight: '700'
            },

            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },

            callbacks: {
              title(items) {
                return items?.[0]?.label || '';
              },

              label(context) {
                return tooltipLabel(context);
              }
            }
          }
        },

        scales: {
          x: {
            type: 'linear',
            min: scaleDef.min,
            max: scaleDef.max,

            afterFit(scale) {
              // One identical reserved height for every tab keeps chartArea
              // and every x-axis marker at the same pixel coordinates.
              scale.height = 80;
            },

            afterBuildTicks(scale) {
              const def = state.scaleCache[state.mode];
              scale.ticks = Array.from(
                { length: AXIS_MAJOR_TICK_COUNT },
                (_, index) => ({
                  value: def.min + def.step * index
                })
              );
            },

            border: {
              display: false
            },

            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },

            title: {
              display: false
            },

            ticks: {
              display: false,
              autoSkip: false,
              maxRotation: 0,
              minRotation: 0
            }
          },

          y: {
            position: 'left',

            afterFit(scale) {
              scale.width = yAxisWidth();
            },

            border: {
              display: false
            },

            grid: {
              display: false,
              drawTicks: true,
              tickLength: 3,
              tickWidth: 1,
              tickColor: '#151515'
            },

            ticks: {
              autoSkip: false,
              color: '#151515',
              padding: 3,

              font(context) {
                const baseSize =
                  yAxisFontSize();

                const label =
                  yAxisTickLabel(context);

                return {
                  family: 'Lato',
                  size: yAxisLabelFontSize(
                    label,
                    baseSize
                  ),
                  weight: '400',
                  lineHeight: 1
                };
              }
            }
          }
        }
      };
    }

    function yAxisWidth() {
      if (window.innerWidth > 430) {
        return 205;
      }

      /*
       * On mobile, keep the PHN-label area to about one quarter
       * of the viewport so most of the width remains for the graph.
       */
      return Math.round(
        Math.max(
          84,
          Math.min(
            140,
            window.innerWidth / 3
          )
        )
      );
    }

    function yAxisFontSize() {
      const rows =
        Math.max(
          1,
          visibleIndices().length
        );

      const height =
        Math.max(
          260,
          chartCanvas.clientHeight || 520
        );

      const rowSpacing =
        Math.max(
          1,
          (height - 80) / rows
        );

      const cap =
        window.innerWidth <= 430
          ? 10
          : 11;

      /*
       * Keep the normal PHN font as large as vertical spacing allows.
       * Horizontal fitting is handled separately for each label below.
       */
      return Math.max(
        7.2,
        Math.min(
          cap,
          rowSpacing * 0.82
        )
      );
    }

    function yAxisTickLabel(context) {
      const tickLabel =
        context?.tick?.label;

      if (Array.isArray(tickLabel)) {
        return tickLabel.join(' ');
      }

      if (
        tickLabel !== undefined &&
        tickLabel !== null &&
        tickLabel !== ''
      ) {
        return String(tickLabel);
      }

      const index =
        Number(
          context?.tick?.value
        );

      if (!Number.isInteger(index)) {
        return '';
      }

      return (
        visibleLabels()[index] ||
        ''
      );
    }

    function yAxisLabelFontSize(
      label,
      baseSize
    ) {
      /*
       * Desktop keeps the existing behaviour.
       */
      if (window.innerWidth > 430) {
        return baseSize;
      }

      const text =
        String(label || '');

      if (!text) {
        return baseSize;
      }

      /*
       * Leave room inside the y-axis for:
       * - 3 px tick
       * - 3 px tick-label padding
       * - a small safety margin
       */
      const availableWidth =
        Math.max(
          1,
          yAxisWidth() - 10
        );

      const context =
        chartCanvas.getContext('2d');

      context.save();
      context.font =
        `400 ${baseSize}px Lato, sans-serif`;

      const measuredWidth =
        context.measureText(text).width;

      context.restore();

      if (
        !Number.isFinite(measuredWidth) ||
        measuredWidth <= availableWidth
      ) {
        return baseSize;
      }

      /*
       * Only shrink labels that actually exceed the available
       * mobile width. Other MMM labels retain the normal size.
       */
      const fittedSize =
        baseSize *
        (
          availableWidth /
          measuredWidth
        );

      return Math.max(
        5.2,
        Math.min(
          baseSize,
          fittedSize
        )
      );
    }

    function syncVisibleDataset() {
      if (!chart) return;

      const stateCodes = visibleStateCodes();

      chart.data.labels = visibleLabels();
      chart.data.datasets[0].data = metricValues();
      chart.data.datasets[0].backgroundColor = visibleColours();
      chart.data.datasets[0].borderColor = visibleColours();
      chart.data.datasets[0]._stateCodes = stateCodes;
    }

    function createChart() {
      const stateCodes = visibleStateCodes();

      chart = new Chart(
        chartCanvas,
        {
          type: 'bar',

          data: {
            labels: visibleLabels(),
            datasets: [
              {
                data: metricValues(),
                backgroundColor: visibleColours(),
                borderColor: visibleColours(),
                borderWidth: 0,
                borderRadius: 2,
                borderSkipped: false,
                categoryPercentage: 0.78,
                barPercentage: 0.80,
                _stateCodes: stateCodes
              }
            ]
          },

          options: baseChartOptions()
        }
      );
    }

    function syncChartScale() {
      const scaleDef = state.scaleCache[state.mode];
      const x = chart.options.scales.x;

      x.min = scaleDef.min;
      x.max = scaleDef.max;

      chart.options.scales.y.ticks.font.size = yAxisFontSize();
    }

    function renderChart(
      reason = 'year',
      animateText = true
    ) {
      if (!state.year) return;

      const modeChanged = state.lastRenderedMode !== state.mode;

      animateHeadingMetricChange(
        metricTitle(state.mode),
        animateText && modeChanged
      );

      setYearText(
        String(state.year),
        animateText && (reason === 'year' || reason === 'tab')
      );

      benchmarkControl.classList.toggle(
        'is-hidden',
        state.mode !== 'oversupply'
      );

      if (!chart) {
        setAxisTickValuesImmediately(state.mode);
        createChart();
        state.lastRenderedMode = state.mode;

        requestAnimationFrame(
          () => syncZeroLine(true)
        );

        return;
      }

      const nextAxisTargets = axisTickTargets(state.mode);

      syncVisibleDataset();
      syncChartScale();

      const duration = chartAnimationDuration(reason);
      chart.options.animation.duration = duration;
      chart.options.animations.x.duration = duration;
      chart.options.animations.y.duration = reason === 'filter' ? 260 : 0;

      chart.update();

      if (reason === 'tab') {
        animateAxisTickValues(nextAxisTargets, 420);
      } else {
        axisTickAnimation.values = [...nextAxisTargets];
      }

      requestAnimationFrame(
        () => syncZeroLine(reason === 'tab')
      );

      state.lastRenderedMode = state.mode;
    }

    // ============================================================
    // TABS
    // ============================================================

    function positionTabIndicator(
      animate = true
    ) {
      const activeTab =
        tabs.find(
          tab => tab.classList.contains('is-active')
        );

      if (!activeTab) {
        return;
      }

      if (!animate) {
        tabList.classList.add('is-positioning');
      }

      const listRect =
        tabList.getBoundingClientRect();

      const tabRect =
        activeTab.getBoundingClientRect();

      const x =
        tabRect.left -
        listRect.left +
        tabList.scrollLeft;

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${x}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${tabRect.width}px`
      );

      if (!animate) {
        requestAnimationFrame(
          () => {
            requestAnimationFrame(
              () => {
                tabList.classList.remove('is-positioning');
              }
            );
          }
        );
      }
    }

    function setActiveTab(mode) {
      if (mode === state.mode) {
        return;
      }

      state.mode = mode;

      if (mode === 'oversupply') {
        benchmarkTitleAnimationToken += 1;
        state.benchmarkTitleDisplay = state.benchmarkPopulation;
      }

      tabs.forEach(
        tab => {
          const active =
            tab.dataset.mode === mode;

          tab.classList.toggle(
            'is-active',
            active
          );

          tab.setAttribute(
            'aria-selected',
            active ? 'true' : 'false'
          );
        }
      );

      const activeTab =
        tabs.find(
          tab => tab.dataset.mode === mode
        );

      activeTab?.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest',
        inline: 'nearest'
      });

      configureYearSlider(
        true,
        false
      );

      positionTabIndicator(true);
      renderChart('tab', true);
    }

    // ============================================================
    // BENCHMARK TOGGLE
    // ============================================================

    function syncBenchmarkToggle() {
      const tenK = state.benchmarkPopulation === 10000;

      benchmarkModeToggle.classList.toggle(
        'is-ten-k-selected',
        tenK
      );

      benchmark5k.classList.toggle(
        'is-active',
        !tenK
      );

      benchmark10k.classList.toggle(
        'is-active',
        tenK
      );

      benchmark5k.setAttribute(
        'aria-pressed',
        String(!tenK)
      );

      benchmark10k.setAttribute(
        'aria-pressed',
        String(tenK)
      );
    }

    function toggleBenchmark() {
      const oldValue = state.benchmarkPopulation;
      const fromDisplay =
        Number.isFinite(Number(state.benchmarkTitleDisplay))
          ? Number(state.benchmarkTitleDisplay)
          : oldValue;

      const next =
        oldValue === 10000
          ? 5000
          : 10000;

      state.benchmarkPopulation = next;
      syncBenchmarkToggle();

      if (state.mode === 'oversupply') {
        // Bars switch to the newly selected benchmark immediately while the
        // benchmark number in the x-axis annotation counts to the same target.
        state.benchmarkTitleDisplay = fromDisplay;
        renderChart('benchmark', false);
        animateBenchmarkTitleNumber(fromDisplay, next, 420);
      } else {
        state.benchmarkTitleDisplay = next;
      }
    }

    // ============================================================
    // STATE FILTER
    // ============================================================

    function buildStateOptions() {
      stateOptions.innerHTML = '';

      ALL_STATES.forEach(code => {
        const label = document.createElement('label');
        label.className = 'state-option';

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = code;
        input.checked = state.selectedStates.has(code);
        input.dataset.stateCode = code;

        const box = document.createElement('span');
        box.className = 'state-option-box';
        box.setAttribute('aria-hidden', 'true');

        const text = document.createElement('span');
        text.className = 'state-code';
        text.textContent = code;
        text.style.color = STATE_COLOURS[code];
        text.title = STATE_NAMES[code];

        label.append(input, box, text);
        stateOptions.appendChild(label);
      });
    }

    function selectedStateSummary() {
      const selected = ALL_STATES.filter(
        code => state.selectedStates.has(code)
      );

      if (selected.length === ALL_STATES.length) return 'All';
      if (selected.length === 0) return 'None';
      if (selected.length === 1) return selected[0];
      return `${selected.length}`;
    }

    function syncStateFilterUi() {
      const selectedCount = state.selectedStates.size;
      stateAll.checked = selectedCount === ALL_STATES.length;
      stateAll.indeterminate = selectedCount > 0 && selectedCount < ALL_STATES.length;

      stateOptions
        .querySelectorAll('input[data-state-code]')
        .forEach(input => {
          input.checked = state.selectedStates.has(input.dataset.stateCode);
        });

      fadeTextChange(
        stateButtonValue,
        selectedStateSummary(),
        true
      );
    }

    function setStateMenuOpen(isOpen) {
      stateMenu.classList.toggle('is-open', isOpen);
      stateButton.setAttribute('aria-expanded', String(isOpen));
    }

    function applyStateFilter() {
      syncStateFilterUi();
      renderChart('filter', false);
    }

    // ============================================================
    // EVENTS
    // ============================================================

    tabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => setActiveTab(tab.dataset.mode)
        );
      }
    );

    yearSlider.addEventListener(
      'input',
      () => {
        yearSliderWrap.classList.add('has-been-dragged');

        const index =
          Number(yearSlider.value);

        const year =
          state.activeYears[index];

        if (!Number.isFinite(year)) {
          return;
        }

        if (year === state.year) {
          updateSliderProgress();
          return;
        }

        state.year = year;
        updateSliderProgress();
        renderChart('year', true);
      }
    );

    benchmark5k.addEventListener(
      'click',
      toggleBenchmark
    );

    benchmark10k.addEventListener(
      'click',
      toggleBenchmark
    );

    stateButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();
        setStateMenuOpen(
          stateButton.getAttribute('aria-expanded') !== 'true'
        );
      }
    );

    stateMenu.addEventListener(
      'click',
      event => event.stopPropagation()
    );

    stateAll.addEventListener(
      'change',
      () => {
        if (stateAll.checked) {
          state.selectedStates = new Set(ALL_STATES);
        } else {
          state.selectedStates = new Set();
        }
        applyStateFilter();
      }
    );

    stateOptions.addEventListener(
      'change',
      event => {
        const input = event.target.closest('input[data-state-code]');
        if (!input) return;

        const code = input.dataset.stateCode;

        if (input.checked) {
          state.selectedStates.add(code);
        } else {
          state.selectedStates.delete(code);
        }

        applyStateFilter();
      }
    );

    document.addEventListener(
      'click',
      event => {
        if (!stateControl.contains(event.target)) {
          setStateMenuOpen(false);
        }
      }
    );

    document.addEventListener(
      'keydown',
      event => {
        if (event.key === 'Escape') {
          setStateMenuOpen(false);
          stateButton.focus();
        }
      }
    );

    window.addEventListener(
      'resize',
      () => {
        positionTabIndicator(false);
        updateSliderProgress();

        if (chart) {
          chart.options.scales.y.ticks.font.size =
            yAxisFontSize();

          chart.resize();

          requestAnimationFrame(
            () => {
              const target = zeroTargetPixel();

              if (Number.isFinite(target)) {
                zeroLineState.x = target;
                zeroLineState.opacity = 1;
              } else {
                zeroLineState.x = null;
                zeroLineState.opacity = 0;
              }

              chart.draw();
            }
          );
        }
      }
    );

    // ============================================================
    // DATA STATUS
    // ============================================================

    function updateSourceStatus() {
      const cached =
        state.sourceState === 'cached';

      liveData.classList.toggle(
        'is-cached',
        cached
      );

      liveDataText.textContent =
        cached ? 'CACHED data' : 'LIVE data';

      liveData.setAttribute(
        'aria-label',
        cached ? 'Cached data' : 'Live data'
      );
    }

    // ============================================================
    // INITIALISE
    // ============================================================

    async function initialise() {
      try {
        await loadData();

        buildScaleCache();
        updateSourceStatus();
        buildStateOptions();
        syncStateFilterUi();
        syncBenchmarkToggle();

        // Default to the most recent year available for the default tab.
        configureYearSlider(false, false);

        renderChart('initial', false);

        app.classList.remove('is-loading');

        requestAnimationFrame(
          () => {
            positionTabIndicator(false);
            syncZeroLine(true);
          }
        );
      } catch (error) {
        app.classList.remove('is-loading');
        liveData.style.visibility = 'hidden';

        statusEl.textContent =
          `${error.message || 'Could not load the Google Sheet.'} Make sure the spreadsheet is viewable without signing in.`;
      }
    }

    initialise();
  </script>
</body>
</html>
