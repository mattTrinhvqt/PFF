<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Locum Rate Summary</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="./assets/pff_chart_core.js?v=1.2.2-20260915a"></script>

  <style>
    /*
     * Shared font, colours, loader, source indicator, reduced-motion
     * handling and responsive infrastructure come from PFF Core.
     * Only Locum Rate Summary-specific layout remains here.
     */
    html,
    body {
      height: auto;
      min-height: 0;
      overflow: hidden;
    }

    #fit {
      display: block;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      display: block;
      width: 100%;
      min-height: 0;
      margin: 0;
      padding: 14px 2px 14px;
      text-align: center;
    }

    #app.is-loading .response-summary,
    #app.is-loading .percentile-section {
      display: none;
    }

    .app-loading {
      position: static;
      inset: auto;
      width: 100%;
      height: auto;
      min-height: 190px;
      background: transparent;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      margin: 0;
      padding: 0;
      font-size: 9px;
    }

    .response-summary {
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: 5px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--pff-purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--pff-muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 31px;
      margin-top: 2px;
    }

    .response-value {
      margin-top: 2px;
      color: var(--pff-ink);
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }


    /* ---------- Compact rate distribution ---------- */

    .rate-distribution {
      width: 100%;
      margin: 2px 0 0;
      padding: 0;
    }

    .rate-distribution-canvas-wrap {
      position: relative;
      width: 100%;
      height: 55px;
      overflow: hidden;
    }

    #rate-distribution-canvas {
      display: block;
      width: 100%;
      height: 55px;
    }

    .rate-distribution-status {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: var(--pff-muted);
      background: rgba(255, 255, 255, 0.88);
      font-size: 9px;
      line-height: 1.25;
      text-align: center;
    }

    .rate-distribution-status.is-visible {
      display: flex;
    }


    /* ---------- Percentile table ---------- */

    .percentile-section {
      width: 100%;
      margin-top: 6px;
      padding-top: 0;
    }

    .percentile-table-wrap {
      position: relative;
      width: 100%;
    }

    .percentile-table-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 24%;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--pff-ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .percentile-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .percentile-table th,
    .percentile-table td {
      position: relative;
      padding: 8px 6px;
      line-height: 1.2;
      text-align: center;
      vertical-align: middle;
    }

    .percentile-table th {
      color: var(--pff-muted);
      font-size: clamp(11px, 3.4vw, 14px);
      font-weight: 700;
      white-space: nowrap;
    }

    .percentile-table td {
      color: var(--pff-ink);
      font-size: clamp(12px, 3.6vw, 15px);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .percentile-table th + th,
    .percentile-table td + td {
      border-left: 1px solid var(--pff-track);
    }

    .percentile-table th:nth-child(2),
    .percentile-table td:nth-child(2) {
      border-left: 0;
    }

    .percentile-table .table-major-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--pff-ink);
    }

    .percentile-table sup {
      position: relative;
      top: -0.08em;
      font-size: 0.7em;
      line-height: 0;
      vertical-align: super;
    }

    .percentile-table th:first-child,
    .percentile-table td:first-child {
      width: 24%;
    }

    .percentile-table td:first-child {
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .error {
      color: var(--pff-muted);
      font-size: 14px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 1px 12px;
      }

      .percentile-table th,
      .percentile-table td {
        padding: 7px 1px;
      }

      .percentile-table th {
        font-size: 11px;
      }

      .percentile-table td {
        font-size: 12px;
      }

      .percentile-table th:first-child,
      .percentile-table td:first-child {
        width: 27%;
      }

      .percentile-table td:first-child {
        font-size: 11px;
      }

      .percentile-table-wrap::after {
        left: 27%;
      }

      .app-loading {
        min-height: 175px;
      }
    }

    @media (max-width: 350px) {
      .percentile-table th {
        font-size: 10px;
      }

      .percentile-table td {
        font-size: 11px;
      }

      .percentile-table td:first-child {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main
      id="app"
      class="pff-app is-loading"
      aria-busy="true"
    >
      <div
        id="loading-state"
        class="app-loading"
        role="status"
        aria-label="Loading locum rate summary"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading...</div>
      </div>

      <section class="response-summary" aria-live="polite">

        <div class="response-value-row">

          <div
            id="data-source-indicator"

            aria-label="Live data"
          >
            <span class="live-data-dot" aria-hidden="true"></span>
            <span id="data-source-text">LIVE data</span>
          </div>
        </div>
      </section>

      <section
        class="percentile-section"
        aria-label="Hourly rate percentiles"

        <div

          <div class="rate-distribution-canvas-wrap">

              id="rate-distribution-canvas"
              aria-label="Distribution of locum hourly rates"
            ></canvas>

            ></div>
          </div>
        </div>

        <div class="percentile-table-wrap">
          <table
            id="percentile-table"

          >
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const CONFIG = Object.freeze({
      sheetId:
        '1wmrmNS4cz-_aPKnyBVg7-SShbhs6czMNh07UjyLo04s',

      sheetName:
        'Data',

      responseCell:
        'H2',

      percentileHeaderRange:
        'AC1:AH1',

      percentileValueRange:
        'AC2:AH2',

      rawDataRange:
        'A:J',

      cacheWebAppUrl:
        'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec',

      summaryCacheAppKey:
        'locum-rate-summary',

      ratesCacheAppKey:
        'locum-rates-data',

      summaryLocalCacheKey:
        'pff-locum-rate-summary-v1',

      ratesLocalCacheKey:
        'pff-locum-summary-rates-v1',

      fetchTimeoutMs:
        10000,

      cacheFetchTimeoutMs:
        10000,

      forceCached:
        false,

      expectedPercentileCols:
        6
    });

    const {
      cleanText,
      toNumber
    } = PFF;

    const {
      percentile
    } = PFFStats;

    const app =
      document.getElementById(
        'app'
      );

    const responseCount =
      document.getElementById(
        'response-count'
      );

    const percentileTable =
      document.getElementById(
        'percentile-table'
      );

    const dataSourceIndicator =
      document.getElementById(
        'data-source-indicator'
      );

    const dataSourceText =
      document.getElementById(
        'data-source-text'
      );

    const rateDistributionCanvas =
      document.getElementById(
        'rate-distribution-canvas'
      );

    const rateDistributionStatus =
      document.getElementById(
        'rate-distribution-status'
      );

    let distributionRates =
      [];

function renderPercentileTable(values) {
      const thead = percentileTable.querySelector('thead');
      const tbody = percentileTable.querySelector('tbody');

      thead.textContent = '';
      tbody.textContent = '';

      const headers = values?.[0] || [];
      const rowValues = values?.[1] || [];

      const headerRow = document.createElement('tr');

      headers.forEach(value => {
        const th = document.createElement('th');
        const headerText = String(value || '—');

        th.scope = 'col';

        const suffixMatch = headerText.match(/^(.*?)(th)$/i);

        if (suffixMatch) {
          th.appendChild(document.createTextNode(suffixMatch[1]));

          const superscript = document.createElement('sup');
          superscript.textContent = suffixMatch[2];
          th.appendChild(superscript);
        } else {
          th.textContent = headerText;
        }

        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);

      const separatorRow = document.createElement('tr');
      separatorRow.className = 'table-major-separator';

      const separatorCell = document.createElement('td');
      separatorCell.colSpan = Math.max(headers.length, 1);

      separatorRow.appendChild(separatorCell);
      thead.appendChild(separatorRow);

      const dataRow = document.createElement('tr');

      rowValues.forEach((value, index) => {
        const td = document.createElement('td');
        const text =
          String(value || '—').trim();

        if (index === 0) {
          td.textContent =
            text
              .replace(/\s*\(\$\)\s*$/i, '')
              .replace(/\s*\$\s*$/i, '')
              .trim() ||
            'Rate';
        } else {
          td.textContent =
            text === '—' ||
            text.startsWith('$')
              ? text
              : `$${text}`;
        }

        dataRow.appendChild(td);
      });

      tbody.appendChild(dataRow);
    }

function getCellDisplayValue(cell) {
      if (!cell) return '';
      return String(cell.f ?? cell.v ?? '').trim();
    }

function setDistributionStatus(message = '') {
      if (!rateDistributionStatus) {
        return;
      }

      rateDistributionStatus.textContent =
        message;

      rateDistributionStatus.classList.toggle(
        'is-visible',
        Boolean(message)
      );
    }

function calculateKernelDensity(
      values,
      minimumX,
      maximumX,
      sampleCount = 120
    ) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      if (sorted.length < 2) {
        return [];
      }

      const count =
        sorted.length;

      const mean =
        sorted.reduce(
          (total, value) =>
            total + value,
          0
        ) /
        count;

      const variance =
        sorted.reduce(
          (total, value) =>
            total +
            Math.pow(
              value - mean,
              2
            ),
          0
        ) /
        Math.max(
          1,
          count - 1
        );

      const standardDeviation =
        Math.sqrt(
          Math.max(
            0,
            variance
          )
        );

      const q1 =
        percentile(
          sorted,
          0.25
        );

      const q3 =
        percentile(
          sorted,
          0.75
        );

      const robustSigma =
        Number.isFinite(q1) &&
        Number.isFinite(q3) &&
        q3 > q1
          ? (q3 - q1) / 1.34
          : NaN;

      const scaleCandidates = [
        standardDeviation,
        robustSigma
      ].filter(
        value =>
          Number.isFinite(value) &&
          value > 0
      );

      const fallbackScale =
        Math.max(
          1,
          (maximumX - minimumX) /
          6
        );

      const scale =
        scaleCandidates.length
          ? Math.min(
              ...scaleCandidates
            )
          : fallbackScale;

      const silvermanBandwidth =
        0.9 *
        scale *
        Math.pow(
          count,
          -0.2
        );

      const range =
        Math.max(
          1,
          maximumX - minimumX
        );

      const bandwidth =
        Math.max(
          2,
          Math.min(
            range * 0.22,
            Number.isFinite(
              silvermanBandwidth
            ) &&
            silvermanBandwidth > 0
              ? silvermanBandwidth
              : range / 10
          )
        );

      const normalisingConstant =
        1 /
        (
          bandwidth *
          Math.sqrt(
            2 * Math.PI
          )
        );

      const result = [];

      for (
        let index = 0;
        index < sampleCount;
        index += 1
      ) {
        const proportion =
          sampleCount === 1
            ? 0
            : index /
              (sampleCount - 1);

        const x =
          minimumX +
          proportion *
          range;

        let density = 0;

        sorted.forEach(value => {
          const z =
            (x - value) /
            bandwidth;

          density +=
            Math.exp(
              -0.5 *
              z *
              z
            );
        });

        density =
          density *
          normalisingConstant /
          count;

        if (
          Number.isFinite(density)
        ) {
          result.push({
            x,
            y: density
          });
        }
      }

      return result;
    }

function renderRateDistribution(rates) {
      if (!rateDistributionCanvas) {
        return;
      }

      const validRates = rates
        .filter(
          rate =>
            Number.isFinite(rate) &&
            rate > 0 &&
            rate <= 500
        )
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      if (validRates.length < 2) {
        setDistributionStatus(
          'Rate distribution unavailable'
        );

        return;
      }

      setDistributionStatus();

      const distributionPercentiles = [
        {
          key: 'p05',
          probability: 0.05,
          strokeStyle: 'rgba(105, 113, 138, 0.55)',
          dash: [3, 3]
        },
        {
          key: 'p20',
          probability: 0.20,
          strokeStyle: 'rgba(105, 113, 138, 0.55)',
          dash: [3, 3]
        },
        {
          key: 'median',
          probability: 0.50,
          strokeStyle: '#f1c232',
          dash: [3, 3]
        },
        {
          key: 'p80',
          probability: 0.80,
          strokeStyle: 'rgba(105, 113, 138, 0.55)',
          dash: [3, 3]
        },
        {
          key: 'p95',
          probability: 0.95,
          strokeStyle: 'rgba(105, 113, 138, 0.55)',
          dash: [3, 3]
        }
      ].map(item => ({
        ...item,
        value: percentile(
          validRates,
          item.probability
        )
      }));

      const p05 =
        distributionPercentiles[0].value;

      const p95 =
        distributionPercentiles[4].value;

      const minimumX =
        Math.min(
          40,
          Math.floor(
            (p05 - 5) / 5
          ) * 5
        );

      const maximumX =
        Math.max(
          100,
          Math.ceil(
            (p95 + 5) / 5
          ) * 5
        );

      const density =
        calculateKernelDensity(
          validRates,
          minimumX,
          maximumX
        );

      if (density.length < 2) {
        setDistributionStatus(
          'Rate distribution unavailable'
        );
        return;
      }

      const maximumDensity =
        Math.max(
          ...density.map(
            point => point.y
          )
        );

      if (
        !Number.isFinite(
          maximumDensity
        ) ||
        maximumDensity <= 0
      ) {
        setDistributionStatus(
          'Rate distribution unavailable'
        );
        return;
      }

      const cssWidth =
        Math.max(
          1,
          rateDistributionCanvas.clientWidth
        );

      const cssHeight =
        Math.max(
          1,
          rateDistributionCanvas.clientHeight
        );

      const pixelRatio =
        Math.min(
          window.devicePixelRatio || 1,
          PFF.defaults.maxDevicePixelRatio
        );

      rateDistributionCanvas.width =
        Math.round(
          cssWidth *
          pixelRatio
        );

      rateDistributionCanvas.height =
        Math.round(
          cssHeight *
          pixelRatio
        );

      const context =
        rateDistributionCanvas.getContext(
          '2d'
        );

      context.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
      );

      context.clearRect(
        0,
        0,
        cssWidth,
        cssHeight
      );

      const padding = {
        top: 4,
        right: 5,
        bottom: 0.5,
        left: 5
      };

      const plotHeight =
        Math.max(
          1,
          cssHeight -
          padding.top -
          padding.bottom
        );

      const baselineY =
        padding.top +
        plotHeight;

      const canvasRect =
        rateDistributionCanvas.getBoundingClientRect();

      const headerCells = [
        ...percentileTable.querySelectorAll(
          'thead tr:first-child th'
        )
      ];

      const fallbackFirstColumnFraction =
        PFF.mobileLayout()
          ? 0.27
          : 0.24;

      const fallbackValueColumnFraction =
        (1 - fallbackFirstColumnFraction) / 5;

      const fallbackTargetForIndex = index =>
        cssWidth *
        (
          fallbackFirstColumnFraction +
          fallbackValueColumnFraction *
          (index + 0.5)
        );

      const targetForColumn = index => {
        const cell =
          headerCells[index + 1];

        if (!cell) {
          return fallbackTargetForIndex(index);
        }

        const rect =
          cell.getBoundingClientRect();

        return Math.max(
          padding.left,
          Math.min(
            cssWidth - padding.right,
            rect.left +
            rect.width / 2 -
            canvasRect.left
          )
        );
      };

      const percentileAnchors =
        distributionPercentiles.map(
          (item, index) => ({
            ...item,
            targetX:
              targetForColumn(index)
          })
        );

      const firstValueRect =
        headerCells[1]?.getBoundingClientRect();

      const lastValueRect =
        headerCells[5]?.getBoundingClientRect();

      const numericPlotLeft =
        firstValueRect
          ? Math.max(
              padding.left,
              firstValueRect.left -
              canvasRect.left +
              2
            )
          : Math.max(
              padding.left,
              cssWidth *
              fallbackFirstColumnFraction +
              2
            );

      const numericPlotRight =
        lastValueRect
          ? Math.min(
              cssWidth - padding.right,
              lastValueRect.right -
              canvasRect.left -
              3
            )
          : cssWidth - padding.right;

      const xAnchors = [
        {
          value: minimumX,
          pixel: numericPlotLeft
        },
        ...percentileAnchors.map(
          item => ({
            value: item.value,
            pixel: item.targetX
          })
        ),
        {
          value: maximumX,
          pixel: numericPlotRight
        }
      ]
        .filter(
          anchor =>
            Number.isFinite(anchor.value) &&
            Number.isFinite(anchor.pixel)
        )
        .sort(
          (first, second) =>
            first.value - second.value
        );

      const uniqueXAnchors = [];

      xAnchors.forEach(anchor => {
        const previous =
          uniqueXAnchors[
            uniqueXAnchors.length - 1
          ];

        if (
          previous &&
          Math.abs(
            previous.value -
            anchor.value
          ) < 1e-8
        ) {
          previous.pixel =
            Math.max(
              previous.pixel,
              anchor.pixel
            );
          return;
        }

        uniqueXAnchors.push({
          ...anchor
        });
      });

      for (
        let index = 1;
        index < uniqueXAnchors.length;
        index += 1
      ) {
        uniqueXAnchors[index].pixel =
          Math.max(
            uniqueXAnchors[index].pixel,
            uniqueXAnchors[index - 1].pixel +
            0.25
          );
      }

      const xToPixel = value => {
        const clampedValue =
          Math.min(
            maximumX,
            Math.max(
              minimumX,
              value
            )
          );

        for (
          let index = 1;
          index < uniqueXAnchors.length;
          index += 1
        ) {
          const previous =
            uniqueXAnchors[index - 1];

          const current =
            uniqueXAnchors[index];

          if (
            clampedValue <= current.value
          ) {
            const span =
              current.value -
              previous.value;

            const proportion =
              span === 0
                ? 0
                : (
                    clampedValue -
                    previous.value
                  ) /
                  span;

            return previous.pixel +
              (
                current.pixel -
                previous.pixel
              ) *
              proportion;
          }
        }

        return uniqueXAnchors[
          uniqueXAnchors.length - 1
        ].pixel;
      };

      const densityToPixel = value =>
        baselineY -
        (
          value /
          maximumDensity
        ) *
        (
          plotHeight - 5
        );

      const findDensityPoint = value => {
        for (
          let index = 1;
          index < density.length;
          index += 1
        ) {
          const previous = density[index - 1];
          const current = density[index];

          if (
            value >= previous.x &&
            value <= current.x
          ) {
            const span =
              current.x - previous.x;

            const proportion =
              span === 0
                ? 0
                : (value - previous.x) /
                  span;

            return {
              x: value,
              y:
                previous.y +
                (current.y - previous.y) *
                proportion
            };
          }
        }

        return density.reduce(
          (nearest, point) =>
            Math.abs(point.x - value) <
            Math.abs(nearest.x - value)
              ? point
              : nearest,
          density[0]
        );
      };

      context.save();
      context.beginPath();

      density.forEach(
        (point, index) => {
          const x =
            xToPixel(
              point.x
            );

          const y =
            densityToPixel(
              point.y
            );

          if (index === 0) {
            context.moveTo(
              x,
              baselineY
            );
            context.lineTo(
              x,
              y
            );
          } else {
            context.lineTo(
              x,
              y
            );
          }
        }
      );

      context.lineTo(
        xToPixel(
          density[
            density.length - 1
          ].x
        ),
        baselineY
      );
      context.closePath();
      context.fillStyle =
        'rgba(241, 194, 50, 0.10)';
      context.fill();
      context.restore();

      context.save();
      context.fillStyle =
        'rgba(102, 0, 255, 0.28)';

      validRates.forEach(
        (rate, index) => {
          const yOffset =
            2 +
            (index % 3) *
            2.1;

          context.beginPath();
          context.arc(
            xToPixel(rate),
            baselineY - yOffset,
            1.35,
            0,
            Math.PI * 2
          );
          context.fill();
        }
      );
      context.restore();

      context.save();
      context.beginPath();
      context.strokeStyle =
        '#f1c232';
      context.lineWidth = 2;
      context.lineCap = 'round';
      context.lineJoin = 'round';

      density.forEach(
        (point, index) => {
          const x =
            xToPixel(
              point.x
            );

          const y =
            densityToPixel(
              point.y
            );

          if (index === 0) {
            context.moveTo(x, y);
          } else {
            context.lineTo(x, y);
          }
        }
      );

      context.stroke();
      context.restore();

      const labels =
        percentileAnchors.map(item => {
          const curvePoint =
            findDensityPoint(
              item.value
            );

          return {
            ...item,
            x:
              xToPixel(
                item.value
              ),
            curveY:
              densityToPixel(
                curvePoint.y
              )
          };
        });

      labels.forEach(label => {
        context.save();
        context.beginPath();
        context.setLineDash(
          label.dash
        );
        context.strokeStyle =
          label.strokeStyle;
        context.lineWidth =
          label.key === 'median'
            ? 1.1
            : 1;
        context.moveTo(
          label.x,
          label.curveY
        );
        context.lineTo(
          label.x,
          baselineY
        );
        context.stroke();
        context.restore();
      });
    }

    function normaliseLiveRateRows(table) {
      return (
        table?.rows || []
      )
        .map(
          row =>
            toNumber(
              getCellDisplayValue(
                row?.c?.[1]
              )
            )
        )
        .filter(
          rate =>
            Number.isFinite(rate) &&
            rate > 0 &&
            rate <= 500
        );
    }

function validateCachedRateData(data) {
      const rows =
        Array.isArray(
          data?.rows
        )
          ? data.rows
          : [];

      if (!rows.length) {
        throw new Error(
          'Cached locum rate data has no rows'
        );
      }

      const rates = rows
        .map(
          (
            row,
            rowIndex
          ) => {
            if (
              !Array.isArray(row) ||
              row.length < 6
            ) {
              throw new Error(
                `Cached locum rate row ${rowIndex + 1} is malformed`
              );
            }

            return toNumber(
              row[1]
            );
          }
        )
        .filter(
          rate =>
            Number.isFinite(rate) &&
            rate > 0 &&
            rate <= 500
        );

      if (rates.length < 2) {
        throw new Error(
          'Cached locum rate data has insufficient rates'
        );
      }

      return rates;
    }

    function normaliseResponseCount(table) {
      const cell =
        table?.rows?.[0]?.c?.[0];

      return (
        getCellDisplayValue(
          cell
        ) ||
        '—'
      );
    }

    function normalisePercentileTable(
      headerTable,
      valueTable
    ) {
      const headerCols =
        headerTable?.cols || [];

      const valueCells =
        valueTable?.rows?.[0]?.c || [];

      const headerRow =
        [];

      const valueRow =
        [];

      for (
        let columnIndex = 0;
        columnIndex <
          CONFIG.expectedPercentileCols;
        columnIndex += 1
      ) {
        headerRow.push(
          cleanText(
            headerCols?.[
              columnIndex
            ]?.label
          ) ||
          '—'
        );

        valueRow.push(
          getCellDisplayValue(
            valueCells?.[
              columnIndex
            ]
          ) ||
          '—'
        );
      }

      return [
        headerRow,
        valueRow
      ];
    }

function validateDashboardData(data) {
      const cachedResponseCount =
        String(data?.responseCount ?? '').trim();

      const percentileValues =
        Array.isArray(data?.percentileTable)
          ? data.percentileTable
          : [];

      if (
        !cachedResponseCount ||
        cachedResponseCount === '—' ||
        percentileValues.length !== 2
      ) {
        throw new Error(
          'Locum Rate Summary data are incomplete'
        );
      }

      const normalisedTable =
        percentileValues.map((row, rowIndex) => {
          if (
            !Array.isArray(row) ||
            row.length < CONFIG.expectedPercentileCols
          ) {
            throw new Error(
              `Locum Rate Summary row ${rowIndex + 1} is incomplete`
            );
          }

          return row
            .slice(0, CONFIG.expectedPercentileCols)
            .map(value =>
              String(value ?? '').trim() || '—'
            );
        });

      return {
        responseCount: cachedResponseCount,
        percentileTable: normalisedTable
      };
    }

    function setLoadedSourceIndicator(
      loaded
    ) {
      if (
        loaded?.source ===
        'live'
      ) {
        PFF.setDataSourceIndicator(
          'live',
          {
            indicator:
              dataSourceIndicator,

            text:
              dataSourceText
          }
        );

        return;
      }

      if (
        loaded?.source ===
        'cached'
      ) {
        PFF.setDataSourceIndicator(
          'cached',
          {
            indicator:
              dataSourceIndicator,

            text:
              dataSourceText
          }
        );

        if (
          dataSourceText
        ) {
          dataSourceText.textContent =
            loaded.remote
              ? 'BACKEND cache'
              : 'BROWSER cache';
        }

        dataSourceIndicator
          ?.setAttribute(
            'aria-label',
            loaded.remote
              ? 'Backend cached data'
              : 'Browser cached data'
          );

        return;
      }

      PFF.setDataSourceIndicator(
        'unavailable',
        {
          indicator:
            dataSourceIndicator,

          text:
            dataSourceText
        }
      );
    }

    async function loadSummaryWithFallback() {
      let liveError =
        null;

      let remoteError =
        null;

      return PFFCharts
        .loadLiveCacheFallback({
          forceCached:
            CONFIG.forceCached,

          cacheKey:
            CONFIG.summaryLocalCacheKey,

          minRows:
            1,

          loadLive:
            () =>
              Promise.all([
                PFFCharts
                  .loadGVizSheet({
                    sheetId:
                      CONFIG.sheetId,

                    sheetName:
                      CONFIG.sheetName,

                    range:
                      CONFIG.responseCell,

                    headers:
                      '0',

                    timeoutMs:
                      CONFIG.fetchTimeoutMs
                  }),

                PFFCharts
                  .loadGVizSheet({
                    sheetId:
                      CONFIG.sheetId,

                    sheetName:
                      CONFIG.sheetName,

                    range:
                      CONFIG.percentileHeaderRange,

                    headers:
                      '1',

                    timeoutMs:
                      CONFIG.fetchTimeoutMs
                  }),

                PFFCharts
                  .loadGVizSheet({
                    sheetId:
                      CONFIG.sheetId,

                    sheetName:
                      CONFIG.sheetName,

                    range:
                      CONFIG.percentileValueRange,

                    headers:
                      '0',

                    timeoutMs:
                      CONFIG.fetchTimeoutMs
                  })
              ]),

          parseLive(
            tables
          ) {
            const [
              responseTable,
              headerTable,
              valueTable
            ] = tables;

            return [
              validateDashboardData({
                responseCount:
                  normaliseResponseCount(
                    responseTable
                  ),

                percentileTable:
                  normalisePercentileTable(
                    headerTable,
                    valueTable
                  )
              })
            ];
          },

          loadRemoteCache:
            () =>
              PFFCharts
                .loadAppsScriptCache({
                  url:
                    CONFIG.cacheWebAppUrl,

                  appKey:
                    CONFIG.summaryCacheAppKey,

                  timeoutMs:
                    CONFIG.cacheFetchTimeoutMs
                }),

          parseRemoteCache(
            response
          ) {
            return [
              validateDashboardData(
                response?.data
              )
            ];
          },

          onLiveError(
            error
          ) {
            liveError =
              error;

            console.warn(
              'Live Locum Rate Summary data could not be used',
              error
            );
          },

          onRemoteCacheError(
            error
          ) {
            remoteError =
              error;

            console.warn(
              'Backend 1 Locum Rate Summary data could not be used',
              error
            );
          }
        })
        .catch(
          error => {
            console.error(
              'All Locum Rate Summary data sources failed',
              {
                liveError,
                remoteError,
                finalError:
                  error
              }
            );

            throw new Error(
              'Live, backend and browser cached summary data are currently unavailable'
            );
          }
        );
    }

    async function loadRateDistributionWithFallback() {
      let liveError =
        null;

      let remoteError =
        null;

      return PFFCharts
        .loadLiveCacheFallback({
          forceCached:
            CONFIG.forceCached,

          cacheKey:
            CONFIG.ratesLocalCacheKey,

          minRows:
            2,

          loadLive:
            () =>
              PFFCharts
                .loadGVizSheet({
                  sheetId:
                    CONFIG.sheetId,

                  sheetName:
                    CONFIG.sheetName,

                  range:
                    CONFIG.rawDataRange,

                  headers:
                    '1',

                  query:
                    'select *',

                  timeoutMs:
                    CONFIG.fetchTimeoutMs
                }),

          parseLive(
            table
          ) {
            const rates =
              normaliseLiveRateRows(
                table
              );

            if (
              rates.length < 2
            ) {
              throw new Error(
                'Live locum rate data have insufficient rates'
              );
            }

            return rates;
          },

          loadRemoteCache:
            () =>
              PFFCharts
                .loadAppsScriptCache({
                  url:
                    CONFIG.cacheWebAppUrl,

                  appKey:
                    CONFIG.ratesCacheAppKey,

                  timeoutMs:
                    CONFIG.cacheFetchTimeoutMs
                }),

          parseRemoteCache(
            response
          ) {
            return validateCachedRateData(
              response?.data
            );
          },

          onLiveError(
            error
          ) {
            liveError =
              error;

            console.warn(
              'Live locum rate distribution data could not be used',
              error
            );
          },

          onRemoteCacheError(
            error
          ) {
            remoteError =
              error;

            console.warn(
              'Backend 1 locum rate distribution data could not be used',
              error
            );
          }
        })
        .catch(
          error => {
            console.error(
              'All locum rate distribution data sources failed',
              {
                liveError,
                remoteError,
                finalError:
                  error
              }
            );

            throw new Error(
              'Live, backend and browser cached rate distribution data are currently unavailable'
            );
          }
        );
    }

    function renderLoadedSummary(
      loaded
    ) {
      const data =
        validateDashboardData(
          loaded?.rows?.[0]
        );

      setLoadedSourceIndicator(
        loaded
      );

      responseCount.textContent =
        data.responseCount;

      responseCount.classList.remove(
        'error'
      );

      renderPercentileTable(
        data.percentileTable
      );

      return data;
    }

    function showSummaryError(
      error
    ) {
      console.error(
        error
      );

      responseCount.textContent =
        '—';

      responseCount.classList.add(
        'error'
      );

      renderPercentileTable([
        [
          '—',
          '—',
          '—',
          '—',
          '—',
          '—'
        ],
        [
          '—',
          '—',
          '—',
          '—',
          '—',
          '—'
        ]
      ]);
    }

    async function loadAndRenderDistribution() {
      try {
        const loaded =
          await loadRateDistributionWithFallback();

        distributionRates =
          Array.isArray(
            loaded?.rows
          )
            ? loaded.rows
            : [];

        if (
          distributionRates.length <
          2
        ) {
          throw new Error(
            'Locum rate distribution is unavailable'
          );
        }

        requestAnimationFrame(
          () => {
            renderRateDistribution(
              distributionRates
            );
          }
        );
      } catch (
        error
      ) {
        console.error(
          'Locum rate distribution unavailable',
          error
        );

        distributionRates =
          [];

        setDistributionStatus(
          'Rate distribution unavailable'
        );
      }
    }

    const responsiveController =
      PFFCharts
        .createResponsiveController({
          observe: [
            app,
            rateDistributionCanvas
              ?.parentElement
          ],

          applyResponsiveChartOptions:
            false,

          onRefresh() {
            if (
              !distributionRates.length ||
              app.classList.contains(
                'is-loading'
              )
            ) {
              return;
            }

            renderRateDistribution(
              distributionRates
            );
          }
        });

    async function initialiseDashboard() {
      await PFF.initialiseApp({
        app,

        load:
          loadSummaryWithFallback,

        render:
          renderLoadedSummary,

        onError(
          error
        ) {
          PFF.setDataSourceIndicator(
            'unavailable',
            {
              indicator:
                dataSourceIndicator,

              text:
                dataSourceText
            }
          );

          showSummaryError(
            error
          );
        }
      });

      await loadAndRenderDistribution();
    }

    initialiseDashboard();
  </script>
</body>
