<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Precision Rounding</title>

<style>
*{box-sizing:border-box}

:root{
  --ink:#172033;
  --muted:#6f7890;
  --line:#e3e7f0;
  --blue:#5667ff;
  --purple:#8d5cff;
  --pink:#ff5f8f;
  --aqua:#29c8c8;
  --yellow:#ffd45c;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
}

body{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  background:
    radial-gradient(circle at 10% 10%,#dff8ff 0,transparent 30%),
    radial-gradient(circle at 90% 15%,#f1e5ff 0,transparent 34%),
    radial-gradient(circle at 15% 90%,#fff0d3 0,transparent 35%),
    #f7f8fc;
}

.app{
  width:min(620px,100%);
  max-height:calc(100svh - 20px);
  overflow:auto;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(255,255,255,.8);
  border-radius:26px;
  box-shadow:0 20px 60px rgba(72,80,125,.16);
}

.top{
  padding:14px 16px 9px;
  text-align:center;
}

.kicker{
  font-size:9px;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--purple);
}

h1{
  margin:3px 0 0;
  font-size:clamp(28px,8vw,42px);
  line-height:1;
  letter-spacing:-.05em;
}

h1 span{
  background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));
  -webkit-background-clip:text;
  color:transparent;
}

.sub{
  margin:7px 0 0;
  font-size:11px;
  color:var(--muted);
}

.content{
  padding:8px 12px 12px;
}

.inputs{
  display:grid;
  gap:8px;
}

.eye{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  box-shadow:0 5px 18px rgba(60,70,110,.05);
}

.eye.od{
  border-top:4px solid var(--blue);
}

.eye.os{
  border-top:4px solid var(--pink);
}

.eyehead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:7px;
}

.eye-name{
  font-size:11px;
  font-weight:900;
  letter-spacing:.1em;
}

.precision{
  font-size:8px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.1em;
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr .8fr;
  gap:7px;
}

label{
  display:block;
  margin:0 0 4px;
  font-size:8px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

input{
  width:100%;
  min-width:0;
  padding:10px 6px;
  border:1px solid #dde2ec;
  border-radius:11px;
  background:#f9faff;
  color:var(--ink);
  font-size:16px;
  font-weight:800;
  text-align:center;
  outline:none;
}

input:focus{
  background:#fff;
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(86,103,255,.09);
}

button{
  width:100%;
  margin-top:9px;
  padding:13px 12px;
  border:0;
  border-radius:14px;
  cursor:pointer;
  color:#fff;
  font-size:11px;
  font-weight:900;
  letter-spacing:.09em;
  text-transform:uppercase;
  background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));
  box-shadow:0 8px 24px rgba(104,85,225,.24);
}

button:active{
  transform:scale(.985);
}

.process{
  display:none;
  min-height:225px;
  border:1px solid var(--line);
  border-radius:20px;
  background:
    radial-gradient(circle at 20% 20%,rgba(41,200,200,.13),transparent 32%),
    radial-gradient(circle at 85% 15%,rgba(141,92,255,.13),transparent 35%),
    #fff;
  padding:15px;
  position:relative;
  overflow:hidden;
}

.process.show{
  display:block;
}

.scanner{
  position:absolute;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--aqua),var(--purple),transparent);
  box-shadow:0 0 16px rgba(86,103,255,.65);
  animation:scan 1s ease-in-out infinite;
}

@keyframes scan{
  0%{top:8%}
  50%{top:90%}
  100%{top:8%}
}

.status{
  text-align:center;
  padding-top:15px;
}

.statusTitle{
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
  line-height:1.15;
}

.percent{
  margin-top:6px;
  font-size:36px;
  font-weight:950;
  letter-spacing:-.05em;
  background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));
  -webkit-background-clip:text;
  color:transparent;
}

.bar{
  width:100%;
  height:8px;
  margin:12px 0;
  border-radius:999px;
  background:#edf0f6;
  overflow:hidden;
}

.fill{
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--aqua),var(--blue),var(--pink),var(--yellow));
}

.telemetry{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.metric{
  padding:8px 4px;
  border-radius:11px;
  background:rgba(247,248,252,.85);
  border:1px solid #eaedf3;
  text-align:center;
}

.metric b{
  display:block;
  font-size:12px;
}

.metric span{
  display:block;
  margin-top:2px;
  font-size:7px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.07em;
}

.result{
  display:none;
  text-align:center;
  animation:pop .65s cubic-bezier(.2,.8,.2,1);
}

.result.show{
  display:block;
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.92);
    filter:blur(5px);
  }
  to{
    opacity:1;
    transform:none;
    filter:none;
  }
}

.result-label{
  font-size:9px;
  font-weight:900;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--pink);
}

.result h2{
  margin:5px 0 4px;
  font-size:26px;
  letter-spacing:-.04em;
}

.punchline{
  margin:0 0 11px;
  font-size:11px;
  color:var(--muted);
}

.rx-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.rx{
  padding:12px 7px;
  border-radius:15px;
  background:#fff;
  border:1px solid var(--line);
}

.rx.od{
  box-shadow:inset 0 4px 0 var(--blue);
}

.rx.os{
  box-shadow:inset 0 4px 0 var(--pink);
}

.rx small{
  display:block;
  margin-bottom:5px;
  font-size:8px;
  font-weight:900;
  color:var(--muted);
}

.rx strong{
  display:block;
  font-size:18px;
  letter-spacing:-.03em;
}

.again{
  margin-top:10px;
  padding:10px;
  background:#f1f3f8;
  color:var(--ink);
  box-shadow:none;
}

.flash{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  background:#fff;
  opacity:0;
}

.flash.go{
  animation:flash .4s;
}

@keyframes flash{
  0%{opacity:0}
  18%{opacity:.9}
  100%{opacity:0}
}

.footer{
  padding:0 0 2px;
  text-align:center;
  font-size:8px;
  color:#9ba2b2;
}

@media(max-width:420px){

  body{
    padding:6px;
  }

  .app{
    max-height:calc(100svh - 12px);
    border-radius:20px;
  }

  .top{
    padding:11px 12px 6px;
  }

  h1{
    font-size:30px;
  }

  .sub{
    font-size:10px;
  }

  .content{
    padding:6px 8px 8px;
  }

  .eye{
    padding:8px;
  }

  .fields{
    gap:5px;
  }

  input{
    padding:8px 3px;
    font-size:15px;
  }

  button{
    margin-top:7px;
    padding:11px 8px;
    font-size:10px;
  }

  .process{
    min-height:205px;
    padding:11px;
  }

  .statusTitle{
    min-height:37px;
    font-size:16px;
  }

  .percent{
    font-size:31px;
  }

  .rx strong{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<main class="app">

  <div class="top">
    <div class="kicker">Ultra-precision converter</div>
    <h1><span>0.01 D</span> → 0.25 D</h1>
    <div class="sub">All that precision. Gone in seconds.</div>
  </div>

  <div class="content">

    <div id="inputPanel" class="inputs">

      <div class="eye od">
        <div class="eyehead">
          <div class="eye-name">OD · RIGHT</div>
          <div class="precision">0.01 D precision</div>
        </div>

        <div class="fields">
          <div>
            <label>Sphere</label>
            <input id="ods" type="number" step="0.01" value="-1.13">
          </div>

          <div>
            <label>Cylinder</label>
            <input id="odc" type="number" step="0.01" value="-0.62">
          </div>

          <div>
            <label>Axis</label>
            <input id="oda" type="number" step="1" value="92">
          </div>
        </div>
      </div>

      <div class="eye os">
        <div class="eyehead">
          <div class="eye-name">OS · LEFT</div>
          <div class="precision">0.01 D precision</div>
        </div>

        <div class="fields">
          <div>
            <label>Sphere</label>
            <input id="oss" type="number" step="0.01" value="-0.87">
          </div>

          <div>
            <label>Cylinder</label>
            <input id="osc" type="number" step="0.01" value="-0.38">
          </div>

          <div>
            <label>Axis</label>
            <input id="osa" type="number" step="1" value="88">
          </div>
        </div>
      </div>

      <button id="go">
        Destroy Precision
      </button>

    </div>


    <div class="process" id="process">

      <div class="scanner" id="scanner"></div>

      <div id="processing">

        <div class="status">

          <div class="statusTitle" id="statusTitle">
            Calibrating decimals…
          </div>

          <div class="percent" id="percent">
            0%
          </div>

        </div>

        <div class="bar">
          <div class="fill" id="fill"></div>
        </div>

        <div class="telemetry">

          <div class="metric">
            <b id="samples">0</b>
            <span>Samples</span>
          </div>

          <div class="metric">
            <b id="confidence">0%</b>
            <span>Confidence</span>
          </div>

          <div class="metric">
            <b id="inevitable">0%</b>
            <span>Inevitable</span>
          </div>

        </div>

      </div>


      <div class="result" id="result">

        <div class="result-label">
          Precision destroyed
        </div>

        <h2>0.25 D wins.</h2>

        <div class="punchline">
          18,472 calculations later.
        </div>

        <div class="rx-grid">

          <div class="rx od">
            <small>OD</small>
            <strong id="odout"></strong>
          </div>

          <div class="rx os">
            <small>OS</small>
            <strong id="osout"></strong>
          </div>

        </div>

        <button class="again" id="again">
          Waste More Precision
        </button>

      </div>

    </div>

  </div>

  <div class="footer">
    No quantum optics were harmed.
  </div>

</main>


<script>
const $ = id => document.getElementById(id);

function roundQuarter(value){
  return Math.round((Number(value) + Number.EPSILON) * 4) / 4;
}

function formatD(value){
  const n = Number(value);
  return (n > 0 ? "+" : "") + n.toFixed(2);
}

function formatAxis(value){
  let n = Math.round(Number(value) || 0);
  n = Math.max(0,Math.min(180,n));
  return String(n).padStart(3,"0");
}

const stages = [
  [0,15,"Calibrating decimals…"],
  [15,32,"Mapping refractive hyperspace…"],
  [32,50,"Protecting significant figures…"],
  [50,69,"Running advanced optics…"],
  [69,85,"Detecting 0.25 D attractor…"],
  [85,97,"Compressing precision…"],
  [97,100,"Accepting reality…"]
];

$("go").onclick = () => {

  const odSphere = +$("ods").value;
  const odCyl = +$("odc").value;
  const odAxis = +$("oda").value;

  const osSphere = +$("oss").value;
  const osCyl = +$("osc").value;
  const osAxis = +$("osa").value;

  $("odout").textContent =
    `${formatD(roundQuarter(odSphere))} / ${formatD(roundQuarter(odCyl))} × ${formatAxis(odAxis)}`;

  $("osout").textContent =
    `${formatD(roundQuarter(osSphere))} / ${formatD(roundQuarter(osCyl))} × ${formatAxis(osAxis)}`;

  $("inputPanel").style.display = "none";
  $("process").classList.add("show");

  $("processing").style.display = "block";
  $("result").classList.remove("show");
  $("scanner").style.display = "block";

  const duration = 4300;
  const start = performance.now();

  function animate(now){

    const t = Math.min(1,(now-start)/duration);
    const eased = 1-Math.pow(1-t,2.15);

    let p = Math.floor(eased*100);

    if(t>.78 && t<.9){
      p=Math.min(p,96);
    }

    if(t>.9 && t<.97){
      p=Math.min(p,99);
    }

    $("percent").textContent = p+"%";
    $("fill").style.width = p+"%";

    $("samples").textContent =
      Math.floor(18472*eased).toLocaleString();

    $("confidence").textContent =
      (99.997*eased).toFixed(1)+"%";

    $("inevitable").textContent =
      Math.min(100,Math.floor(108*eased))+"%";

    const stage =
      stages.find(x=>p>=x[0] && p<=x[1])
      || stages[stages.length-1];

    $("statusTitle").textContent = stage[2];

    if(t<1){
      requestAnimationFrame(animate);
    }else{
      finish();
    }
  }

  requestAnimationFrame(animate);
};


function finish(){

  $("scanner").style.display = "none";

  $("percent").textContent = "100%";
  $("fill").style.width = "100%";

  $("statusTitle").textContent =
    "Precision successfully destroyed.";

  $("flash").classList.remove("go");

  void $("flash").offsetWidth;

  $("flash").classList.add("go");

  setTimeout(()=>{
    $("processing").style.display = "none";
    $("result").classList.add("show");
  },220);
}


$("again").onclick = () => {

  $("process").classList.remove("show");

  $("inputPanel").style.display = "grid";

  $("fill").style.width = "0%";

  $("percent").textContent = "0%";

};
</script>

</body>
</html>
