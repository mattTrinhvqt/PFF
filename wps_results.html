    /************************************************************
     * FIXED AGGREGATE POSITIONS
     ************************************************************/

    function buildAggregatePositions(
      items
    ) {
      const groups =
        new Map();


      items.forEach(
        item =&gt; {
          const scoreKey =
            String(
              Number(
                item.score
              )
            );

          if (
            !groups.has(
              scoreKey
            )
          ) {
            groups.set(
              scoreKey,
              []
            );
          }

          groups
            .get(
              scoreKey
            )
            .push(
              item
            );
        }
      );


      const maximumGroupSize =
        Math.max(
          1,
          ...[
            ...groups.values()
          ].map(
            group =&gt;
              group.length
          )
        );


      /*
       * Extra internal padding prevents large circles from
       * excessively crossing the y-axis or right chart boundary.
       */
      const leftPosition =
        20;

      const rightPosition =
        82;


      const sharedPositions =
        maximumGroupSize ===
          1
          ? [
              leftPosition
            ]
          : Array.from(
              {
                length:
                  maximumGroupSize
              },
              (
                _,
                index
              ) =&gt;
                leftPosition +
                (
                  index /
                  (
                    maximumGroupSize -
                    1
                  )
                ) *
                (
                  rightPosition -
                  leftPosition
                )
            );


      const positions =
        new Map();


      groups.forEach(
        group =&gt; {
          group
            .slice()
            .sort(
              (
                first,
                second
              ) =&gt;
                second.respondents -
                  first.respondents ||
                first.fullName.localeCompare(
                  second.fullName
                )
            )
            .forEach(
              (
                item,
                index
              ) =&gt; {
                positions.set(
                  item.canonicalKey,
                  sharedPositions[
                    index
                  ]
                );
              }
            );
        }
      );


      return positions;
    }

    /*
     * Assign nearby endorsement values to separate horizontal
     * lanes. Values separated by 5 percentage points or less
     * cannot occupy the same lane.
     */
    function buildProximityPositions(
      items,
      proximityThreshold =
        5
    ) {
      const sortedItems =
        items
          .slice()
          .sort(
            (
              first,
              second
            ) =&gt;
              first.score -
                second.score ||
              second.respondents -
                first.respondents ||
              first.fullName.localeCompare(
                second.fullName
              )
          );

      /*
       * Each entry stores the most recent percentage occupying
       * that horizontal lane.
       */
      const laneLastScores =
        [];

      const laneAssignments =
        new Map();


      sortedItems.forEach(
        item =&gt; {
          let laneIndex =
            laneLastScores.findIndex(
              previousScore =&gt;
                (
                  item.score -
                  previousScore
                ) &gt;
                proximityThreshold
            );


          /*
           * Every existing lane contains another value within
           * five percentage points, so create a lane to the right.
           */
          if (
            laneIndex ===
            -1
          ) {
            laneIndex =
              laneLastScores.length;

            laneLastScores.push(
              item.score
            );
          } else {
            laneLastScores[
              laneIndex
            ] =
              item.score;
          }


          laneAssignments.set(
            item.canonicalKey,
            laneIndex
          );
        }
      );


      const laneCount =
        Math.max(
          1,
          laneLastScores.length
        );

      /*
       * Retain at least five possible positions so a second
       * nearby value moves only one position to the right rather
       * than jumping across the whole chart.
       */
      const positionCount =
        Math.max(
          5,
          laneCount
        );

      const leftPosition =
        20;

      const rightPosition =
        82;

      const sharedPositions =
        Array.from(
          {
            length:
              positionCount
          },
          (
            _,
            index
          ) =&gt;
            leftPosition +
            (
              index /
              (
                positionCount -
                1
              )
            ) *
            (
              rightPosition -
              leftPosition
            )
        );

      const positions =
        new Map();


      laneAssignments.forEach(
        (
          laneIndex,
          employerKey
        ) =&gt; {
          positions.set(
            employerKey,
            sharedPositions[
              laneIndex
            ]
          );
        }
      );


      return positions;
    }
    
    function buildAggregatePoints(
      items
    ) {
      return items
        .map(
          item =&gt; {
            const metrics =
              {};


            VIEW_KEYS.forEach(
              viewKey =&gt; {
                if (
                  viewKey ===
                  &#x27;overall&#x27;
                ) {
                  metrics[
                    viewKey
                  ] = {
                    value:
                      item.score,

                    respondents:
                      item.respondents
                  };

                  return;
                }


                const viewItem =
                  viewEmployerData
                    .get(
                      viewKey
                    )
                    ?.get(
                      item.canonicalKey
                    );


                /*
                 * Preserve the existing fallback behaviour when a
                 * percentage row is unexpectedly missing.
                 */
                metrics[
                  viewKey
                ] = {
                  value:
                    clamp(
                      viewItem
                        ?.score ??
                      item.score *
                        10,
                      0,
                      100
                    ),

                  respondents:
                    viewItem
                      ?.respondents ??
                    item.respondents
                };
              }
            );


            return {
              kind:
                &#x27;aggregate&#x27;,

              x:
                aggregatePositions.get(
                  item.canonicalKey
                ) ??
                20,

              y:
                0,

              targetY:
                item.score *
                10,

              metrics,

              currentMetricValue:
                item.score,

              currentRespondents:
                item.respondents,

              baseRadius:
                getBaseBubbleRadius(
                  item.respondents
                ),

              canonicalKey:
                item.canonicalKey,

              shortLabel:
                item.label,

              fullName:
                item.fullName,

              respondents:
                item.respondents,

              colour:
                item.colour,

              canSplit:
                Boolean(
                  rawEmployerData
                    .get(
                      item.canonicalKey
                    )
                    ?.scores
                    ?.length
                )
            };
          }
        )
        .sort(
          (
            first,
            second
          ) =&gt; {
            if (
              first.targetY !==
              second.targetY
            ) {
              return (
                second.targetY -
                first.targetY
              );
            }

            return (
              second.baseRadius -
              first.baseRadius
            );
          }
        );
    }
    function getAggregatePoint(
      employerKey
    ) {
      return aggregatePoints.find(
        point =&gt;
          point.canonicalKey ===
          employerKey
      );
    }


    /************************************************************
     * RAW SCORE POINTS
     ************************************************************/

    function createRawEmployerPoints(
      aggregateItem,
      rawEmployer
    ) {
      const aggregateX =
        aggregatePositions.get(
          aggregateItem.canonicalKey
        ) ??
        20;

      const aggregateY =
        aggregateItem.score *
        10;

      const scoreGroups =
        new Map();


      rawEmployer.scores.forEach(
        score =&gt; {
          const scoreKey =
            String(
              score
            );

          if (
            !scoreGroups.has(
              scoreKey
            )
          ) {
            scoreGroups.set(
              scoreKey,
              []
            );
          }

          scoreGroups
            .get(
              scoreKey
            )
            .push(
              score
            );
        }
      );


      const points =
        [];


      scoreGroups.forEach(
        (
          scores,
          scoreKey
        ) =&gt; {
          const score =
            Number(
              scoreKey
            );

          const pointCount =
            scores.length;

          /*
           * Limit the horizontal spread equally on both sides of
           * the original aggregate position. This keeps every row
           * centred on the aggregate bubble&#x27;s vertical axis.
           */
          const maximumHalfSpan =
            Math.max(
              0,
              Math.min(
                aggregateX -
                  14,
                88 -
                  aggregateX
              )
            );

          const span =
            Math.min(
              21,
              Math.max(
                0,
                (
                  pointCount -
                  1
                ) *
                2.35
              ),
              maximumHalfSpan *
                2
            );

          const startX =
            aggregateX -
            span /
              2;


          scores.forEach(
            (
              _,
              index
            ) =&gt; {
              const targetX =
                pointCount ===
                  1
                  ? aggregateX
                  : startX +
                    (
                      index /
                      (
                        pointCount -
                        1
                      )
                    ) *
                    span;


              points.push({
                kind:
                  &#x27;raw&#x27;,

                x:
                  aggregateX,

                y:
                  aggregateY,

                targetX:
                  targetX,
                targetY:
                  score *
                  10,

                baseRadius:
                  RAW_POINT_RADIUS,

                canonicalKey:
                  aggregateItem.canonicalKey,

                fullName:
                  aggregateItem.fullName,

                colour:
                  aggregateItem.colour,

                rawScore:
                  score,

                scoreCount:
                  rawEmployer.statistics.count,

                median:
                  rawEmployer.statistics.median,

                q1:
                  rawEmployer.statistics.q1,

                q3:
                  rawEmployer.statistics.q3
              });
            }
          );
        }
      );


      return points;
    }


    /************************************************************
     * AGGREGATE VISIBILITY
     ************************************************************/

    function getAggregateVisibility(
      employerKey
    ) {
      if (
        splitProgress.has(
          employerKey
        )
      ) {
        return (
          1 -
          splitProgress.get(
            employerKey
          )
        );
      }

      if (
        mergingEmployers.has(
          employerKey
        )
      ) {
        return mergeProgress;
      }

      if (
        splitEmployers.has(
          employerKey
        )
      ) {
        return 0;
      }

      return 1;
    }


    function getAggregateRadius(
      chart,
      raw
    ) {
      if (
        !raw
      ) {
        return 0;
      }

      const visibility =
        getAggregateVisibility(
          raw.canonicalKey
        );

      if (
        visibility &lt;=
        0.001
      ) {
        return 0;
      }

      return getDisplayedBubbleRadius(
        chart,
        raw
      );
    }


    /************************************************************
     * BUTTON STATE
     ************************************************************/

    function updateReaggregateButton() {
      const shouldShow =
        splitEmployers.size &gt; 0 ||
        mergingEmployers.size &gt; 0;


      reaggregateButton
        .classList
        .toggle(
          &#x27;is-hidden&#x27;,
          !shouldShow
        );


      reaggregateButton.setAttribute(
        &#x27;aria-hidden&#x27;,
        String(
          !shouldShow
        )
      );


      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;


      reaggregateButton.disabled =
        interactionLocked;
    }


    /************************************************************
     * Y-AXIS DESCRIPTIONS
     ************************************************************/

    const axisDescriptionPlugin = {
      id:
        &#x27;axisDescriptionPlugin&#x27;,


      afterDatasetsDraw(
        chart
      ) {
        const yScale =
          chart.scales.y;


        if (
          !yScale
        ) {
          return;
        }


        const context =
          chart.ctx;

        const tickLength =
          Number(
            yScale.options
              .grid
              ?.tickLength ??
            0
          );

        const tickPadding =
          Number(
            yScale.options
              .ticks
              ?.padding ??
            0
          );


        /*
         * Position the descriptions against the same right edge
         * as the normal numerical tick labels.
         */
        const textX =
          yScale.right -
          tickLength -
          tickPadding +
          1;


        const descriptions = [
          {
            value:
              0,

            text:
              &#x27;(not at all)&#x27;,

            offsetY:
              -13
          },

          {
            value:
              50,

            text:
              &#x27;(unsure)&#x27;,

            offsetY:
              13
          },

          {
            value:
              100,

            text:
              &#x27;(extremely)&#x27;,

            offsetY:
              13
          }
        ];


        context.save();

        /*
         * Fade these labels out on Pay and back in on Overall.
         */
        context.globalAlpha =
          axisDescriptionOpacity;

        context.font =
          &#x27;400 10px Lato, sans-serif&#x27;;

        context.fillStyle =
          &#x27;#69718a&#x27;;

        context.textAlign =
          &#x27;right&#x27;;

        context.textBaseline =
          &#x27;middle&#x27;;


        descriptions.forEach(
          description =&gt; {
            context.fillText(
              description.text,
              textX,
              yScale.getPixelForValue(
                description.value
              ) +
              description.offsetY
            );
          }
        );


        context.restore();
      }
    };


    /************************************************************
     * BUBBLE LABELS
     ************************************************************/

    const bubbleLabelPlugin = {
      id:
        &#x27;bubbleLabelPlugin&#x27;,


      afterDatasetDraw(
        chart,
        args
      ) {
        /*
         * Aggregate labels are drawn immediately after aggregate
         * circles. The raw dataset is then rendered over both.
         */
        if (
          args.index !== 0
        ) {
          return;
        }


        const context =
          chart.ctx;

        const dataset =
          chart.data
            .datasets[0];

        const metadata =
          chart.getDatasetMeta(
            0
          );


        metadata.data.forEach(
          (
            element,
            index
          ) =&gt; {
            const raw =
              dataset.data[
                index
              ];


            if (
              !raw ||
              !raw.shortLabel
            ) {
              return;
            }


            const visibility =
              getAggregateVisibility(
                raw.canonicalKey
              );

            /*
             * Gradually fade all remaining aggregate labels while
             * raw scores are displayed, then restore them during
             * re-aggregation.
             */
            const labelOpacity =
              1 +
              (
                DIMMED_AGGREGATE_LABEL_OPACITY -
                1
              ) *
              aggregateDimProgress;


            if (
              visibility &lt;=
              0.02
            ) {
              return;
            }


            const radius =
              getDisplayedBubbleRadius(
                chart,
                raw
              );


            if (
              radius &lt;=
              0
            ) {
              return;
            }


            /*
             * Keep every employer label the same readable size,
             * even when the text is larger than its bubble.
             */
            const fontSize =
              13;


            context.save();

            context.globalAlpha =
              visibility *
              labelOpacity;

            context.textAlign =
              &#x27;center&#x27;;

            context.textBaseline =
              &#x27;middle&#x27;;

            context.font =
              `700 ${fontSize}px Lato, sans-serif`;

            context.lineJoin =
              &#x27;round&#x27;;

            context.lineWidth =
              Math.max(
                1.8,
                fontSize *
                  0.15
              );

            context.strokeStyle =
              &#x27;rgba(255, 255, 255, 0.94)&#x27;;

            context.fillStyle =
              &#x27;#151515&#x27;;


            context.strokeText(
              raw.shortLabel,
              element.x,
              element.y
            );

            context.fillText(
              raw.shortLabel,
              element.x,
              element.y
            );


            context.restore();
          }
        );
      }
    };

    /************************************************************
     * VIEW SWITCHING
     ************************************************************/

    function getViewTargets(
      point,
      view
    ) {
      const isOverall =
        view ===
        &#x27;overall&#x27;;

      const metric =
        point.metrics
          ?.[view] ??
        point.metrics
          ?.overall;

      const positions =
        viewPositions.get(
          view
        ) ??
        aggregatePositions;

      const metricValue =
        metric
          ?.value ??
        0;

      const respondents =
        metric
          ?.respondents ??
        0;


      return {
        x:
          positions.get(
            point.canonicalKey
          ) ??
          aggregatePositions.get(
            point.canonicalKey
          ) ??
          point.x,

        y:
          isOverall
            ? metricValue *
              10
            : metricValue,

        radius:
          getBaseBubbleRadius(
            respondents
          ),

        metricValue,

        respondents
      };
    }

    function updateTabScrollHints() {
      if (
        !tabList ||
        !tabScrollShell
      ) {
        return;
      }

      const maximumScrollLeft =
        Math.max(
          0,
          tabList.scrollWidth -
            tabList.clientWidth
        );

      const tolerance =
        2;

      tabScrollShell.classList.toggle(
        &#x27;can-scroll-left&#x27;,
        tabList.scrollLeft &gt;
          tolerance
      );

      tabScrollShell.classList.toggle(
        &#x27;can-scroll-right&#x27;,
        tabList.scrollLeft &lt;
          maximumScrollLeft -
            tolerance
      );
    }


    function updateTabIndicator(
      animate =
        true
    ) {
      const selectedTab =
        tabByView.get(
          activeView
        );


      if (
        !tabList ||
        !selectedTab
      ) {
        return;
      }


      if (
        !animate
      ) {
        tabList.classList.add(
          &#x27;is-positioning&#x27;
        );
      }


      tabList.style.setProperty(
        &#x27;--tab-indicator-x&#x27;,
        `${selectedTab.offsetLeft}px`
      );

      tabList.style.setProperty(
        &#x27;--tab-indicator-width&#x27;,
        `${selectedTab.offsetWidth}px`
      );


      if (
        animate
      ) {
        const targetScrollLeft =
          selectedTab.offsetLeft -
          (
            tabList.clientWidth -
            selectedTab.offsetWidth
          ) /
          2;


        tabList.scrollTo({
          left:
            Math.max(
              0,
              targetScrollLeft
            ),

          behavior:
            &#x27;smooth&#x27;
        });
      } else {
        requestAnimationFrame(
          () =&gt; {
            tabList.classList.remove(
              &#x27;is-positioning&#x27;
            );
          }
        );
      }

      requestAnimationFrame(
        updateTabScrollHints
      );
    }


    function updateActiveTab() {
      viewTabs.forEach(
        tab =&gt; {
          const isActive =
            tab.dataset.view ===
            activeView;

          tab.classList.toggle(
            &#x27;is-active&#x27;,
            isActive
          );

          tab.setAttribute(
            &#x27;aria-selected&#x27;,
            String(
              isActive
            )
          );
        }
      );


      updateTabIndicator(
        true
      );
    }


    function animateViewSwitch(
      nextView
    ) {
      if (
        !promoterChart ||
        interactionLocked ||
        nextView ===
          activeView ||
        !VIEW_CONFIG[
          nextView
        ]
      ) {
        return;
      }


      const nextConfig =
        VIEW_CONFIG[
          nextView
        ];

      const startingDescriptionOpacity =
        axisDescriptionOpacity;

      const targetDescriptionOpacity =
        nextView ===
          &#x27;overall&#x27;
          ? 1
          : 0;

      const startingAxisTickMultiplier =
        axisTickMultiplier;

      const targetAxisTickMultiplier =
        nextView ===
          &#x27;overall&#x27;
          ? 0.1
          : 1;


      aggregatePoints.forEach(
        point =&gt; {
          const targets =
            getViewTargets(
              point,
              nextView
            );

          point.viewStartX =
            point.x;

          point.viewStartY =
            point.y;

          point.viewStartRadius =
            point.baseRadius;

          point.viewTargetX =
            targets.x;

          point.viewTargetY =
            targets.y;

          point.viewTargetRadius =
            targets.radius;

          point.viewTargetMetricValue =
            targets.metricValue;

          point.viewTargetRespondents =
            targets.respondents;
        }
      );


      interactionLocked =
        true;

      lastAggregateClickKey =
        null;

      lastAggregateClickTime =
        0;

      activeView =
        nextView;


      const nextHeadingText =
        nextConfig.heading;

      const nextAxisTitleText =
        nextConfig.axisTitle;

      /*
       * The y-axis title changes only when moving between Overall
       * and an endorsement view. It remains fully visible when
       * switching between two endorsement views.
       */
      const currentAxisTitleText =
        promoterChart.options
          .scales
          .y
          .title
          .text;

      const shouldFadeAxisTitle =
        currentAxisTitleText !==
        nextAxisTitleText;

      let viewTextSwitched =
        false;


      updateActiveTab();


      runAnimation({
        duration:
          VIEW_TRANSITION_MS,

        easing:
          easeInOutCubic,

        onFrame(
          progress
        ) {
          aggregatePoints.forEach(
            point =&gt; {
              point.x =
                point.viewStartX +
                (
                  point.viewTargetX -
                  point.viewStartX
                ) *
                progress;

              point.y =
                point.viewStartY +
                (
                  point.viewTargetY -
                  point.viewStartY
                ) *
                progress;

              point.baseRadius =
                point.viewStartRadius +
                (
                  point.viewTargetRadius -
                  point.viewStartRadius
                ) *
                progress;
            }
          );


          axisDescriptionOpacity =
            startingDescriptionOpacity +
            (
              targetDescriptionOpacity -
              startingDescriptionOpacity
            ) *
            progress;


          axisTickMultiplier =
            startingAxisTickMultiplier +
            (
              targetAxisTickMultiplier -
              startingAxisTickMultiplier
            ) *
            progress;


          const titleOpacity =
            Math.abs(
              progress *
                2 -
              1
            );


          if (
            !viewTextSwitched &amp;&amp;
            progress &gt;=
              0.5
          ) {
            chartHeading.textContent =
              nextHeadingText;

            promoterChart.options
              .scales
              .y
              .title
              .text =
                nextAxisTitleText;

            viewTextSwitched =
              true;
          }


          chartHeading.style.opacity =
            String(
              titleOpacity
            );

          promoterChart.options
            .scales
            .y
            .title
            .color =
              `rgba(21, 21, 21, ${
                shouldFadeAxisTitle
                  ? titleOpacity
                  : 1
              })`;


          promoterChart.update(
            &#x27;none&#x27;
          );
        },

        onComplete() {
          aggregatePoints.forEach(
            point =&gt; {
              point.x =
                point.viewTargetX;

              point.y =
                point.viewTargetY;

              point.targetY =
                point.viewTargetY;

              point.baseRadius =
                point.viewTargetRadius;

              point.currentMetricValue =
                point.viewTargetMetricValue;

              point.currentRespondents =
                point.viewTargetRespondents;

              point.respondents =
                point.viewTargetRespondents;
            }
          );


          /*
           * Lower values are rendered later and therefore remain
           * on top. At the same value, smaller bubbles stay on top.
           */
          aggregatePoints.sort(
            (
              first,
              second
            ) =&gt;
              second.y -
                first.y ||
              second.baseRadius -
                first.baseRadius
          );


          axisDescriptionOpacity =
            targetDescriptionOpacity;

          axisTickMultiplier =
            targetAxisTickMultiplier;

          chartHeading.textContent =
            nextHeadingText;

          chartHeading.style.opacity =
            &#x27;1&#x27;;

          promoterChart.options
            .scales
            .y
            .title
            .text =
              nextAxisTitleText;

          promoterChart.options
            .scales
            .y
            .title
            .color =
              &#x27;#151515&#x27;;


          promoterChart.update(
            &#x27;none&#x27;
          );

          interactionLocked =
            false;

          updateReaggregateButton();
        }
      });
    }


    function requestViewSwitch(
      nextView
    ) {
      if (
        nextView ===
          activeView ||
        interactionLocked ||
        !VIEW_CONFIG[
          nextView
        ]
      ) {
        return;
      }


      /*
       * Raw Overall points are re-aggregated before switching to
       * any other workplace survey view.
       */
      if (
        splitEmployers.size &gt;
        0
      ) {
        animateReaggregation(
          () =&gt; {
            animateViewSwitch(
              nextView
            );
          }
        );

        return;
      }


      animateViewSwitch(
        nextView
      );
    }
    /************************************************************
     * INITIAL RISE
     *
     * This runs once only. Later split and merge actions never
     * move unrelated aggregate bubbles.
     ************************************************************/

    function animateInitialRise() {
      if (
        !promoterChart
      ) {
        return;
      }


      initialLoadActive =
        true;

      interactionLocked =
        true;

      updateReaggregateButton();


      runAnimation({
        duration:
          INITIAL_RISE_MS,

        easing:
          easeOutCubic,

        onFrame(
          progress
        ) {
          aggregatePoints.forEach(
            point =&gt; {
              point.y =
                point.targetY *
                progress;
            }
          );


          promoterChart.update(
            &#x27;none&#x27;
          );
        },

        onComplete() {
          aggregatePoints.forEach(
            point =&gt; {
              point.y =
                point.targetY;
            }
          );


          promoterChart.update(
            &#x27;none&#x27;
          );


          initialLoadActive =
            false;

          interactionLocked =
            false;

          updateReaggregateButton();
        }
      });
    }


    /************************************************************
     * SPLIT ONE EMPLOYER
     *
     * Only the selected employer&#x27;s raw points move.
     * Existing aggregate and split points remain stationary.
     ************************************************************/

    function animateEmployerSplit(
      employerKey
    ) {
      if (
        interactionLocked ||
        splitEmployers.has(
          employerKey
        ) ||
        !promoterChart
      ) {
        return;
      }


      const aggregateItem =
        aggregateItems.find(
          item =&gt;
            item.canonicalKey ===
            employerKey
        );

      const rawEmployer =
        rawEmployerData.get(
          employerKey
        );


      if (
        !aggregateItem ||
        !rawEmployer
          ?.scores
          ?.length
      ) {
        return;
      }


      /*
       * Only the first split needs to dim all aggregate bubbles.
       * Additional splits begin while they are already dimmed.
       */
      const shouldAnimateAggregateDimming =
        splitEmployers.size ===
        0;

      interactionLocked =
        true;

      splitEmployers.add(
        employerKey
      );

      splitProgress.set(
        employerKey,
        0
      );


      const newPoints =
        createRawEmployerPoints(
          aggregateItem,
          rawEmployer
        );


      newPoints.forEach(
        point =&gt; {
          point.startX =
            point.x;

          point.startY =
            point.y;
        }
      );


      rawDisplayPoints.push(
        ...newPoints
      );


      promoterChart
        .data
        .datasets[1]
        .data =
          rawDisplayPoints;


      promoterChart.update(
        &#x27;none&#x27;
      );


      updateReaggregateButton();


      runAnimation({
        duration:
          SPLIT_ANIMATION_MS,

        easing:
          easeOutCubic,

        onFrame(
          progress
        ) {
          splitProgress.set(
            employerKey,
            progress
          );

          if (
            shouldAnimateAggregateDimming
          ) {
            aggregateDimProgress =
              progress;
          }


          newPoints.forEach(
            point =&gt; {
              point.x =
                point.startX +
                (
                  point.targetX -
                  point.startX
                ) *
                progress;

              point.y =
                point.startY +
                (
                  point.targetY -
                  point.startY
                ) *
                progress;
            }
          );


          promoterChart.update(
            &#x27;none&#x27;
          );
        },

        onComplete() {
          newPoints.forEach(
            point =&gt; {
              point.x =
                point.targetX;

              point.y =
                point.targetY;
            }
          );


          splitProgress.delete(
            employerKey
          );

          if (
            shouldAnimateAggregateDimming
          ) {
            aggregateDimProgress =
              1;
          }


          promoterChart.update(
            &#x27;none&#x27;
          );


          interactionLocked =
            false;

          updateReaggregateButton();
        }
      });
    }


    /************************************************************
     * REVERSE ALL SPLITS
     *
     * Aggregate bubbles fade back in at their existing full size.
     * Raw points move back into them and are then removed.
     ************************************************************/

    function animateReaggregation(
      onCompleteCallback =
        null
    ) {
      if (
        interactionLocked ||
        !promoterChart ||
        splitEmployers.size ===
          0
      ) {
        return;
      }


      interactionLocked =
        true;

      mergeProgress =
        0;


      splitEmployers.forEach(
        employerKey =&gt; {
          mergingEmployers.add(
            employerKey
          );
        }
      );


      rawDisplayPoints.forEach(
        point =&gt; {
          const aggregatePoint =
            getAggregatePoint(
              point.canonicalKey
            );


          point.mergeStartX =
            point.x;

          point.mergeStartY =
            point.y;

          point.mergeTargetX =
            aggregatePoint?.x ??
            point.x;

          point.mergeTargetY =
            aggregatePoint?.targetY ??
            point.y;
        }
      );


      promoterChart.update(
        &#x27;none&#x27;
      );


      updateReaggregateButton();


      runAnimation({
        duration:
          MERGE_ANIMATION_MS,

        easing:
          easeInOutCubic,

        onFrame(
          progress
        ) {
          mergeProgress =
            progress;

          /*
           * Gradually return aggregate bubbles to normal opacity.
           */
          aggregateDimProgress =
            1 -
            progress;


          rawDisplayPoints.forEach(
            point =&gt; {
              point.x =
                point.mergeStartX +
                (
                  point.mergeTargetX -
                  point.mergeStartX
                ) *
                progress;

              point.y =
                point.mergeStartY +
                (
                  point.mergeTargetY -
                  point.mergeStartY
                ) *
                progress;
            }
          );


          promoterChart.update(
            &#x27;none&#x27;
          );
        },

        onComplete() {
          mergeProgress =
            1;


          rawDisplayPoints =
            [];


          promoterChart
            .data
            .datasets[1]
            .data =
              rawDisplayPoints;


          splitEmployers.clear();
          splittingCleanup();
          mergingEmployers.clear();

          mergeProgress =
            0;

          aggregateDimProgress =
            0;


          promoterChart.update(
            &#x27;none&#x27;
          );


          interactionLocked =
            false;

          updateReaggregateButton();

          if (
            typeof onCompleteCallback ===
            &#x27;function&#x27;
          ) {
            onCompleteCallback();
          }
        }
      });
    }


    function splittingCleanup() {
      splitProgress.clear();
    }


    /************************************************************
     * CREATE CHART
     ************************************************************/

    function createChart() {
      const context =
        chartCanvas.getContext(
          &#x27;2d&#x27;
        );


      promoterChart =
        new Chart(
          context,
          {

    async function loadPromoterChart() {
      try {
        setStatus();


        rawEmployerData =
          await loadRawEmployerDataWithFallback_();


        viewItems.clear();
        viewEmployerData.clear();
        viewPositions.clear();


        VIEW_KEYS.forEach(
          viewKey =&gt; {
            /*
             * Overall is calculated as the median 0–10 recommendation
             * score for each employer. Every other view is calculated
             * as the percentage of that employer&#x27;s raw responses whose
             * column D answer endorsed the relevant factor.
             */
            const items =
              viewKey ===
                &#x27;overall&#x27;
                ? buildAggregateItemsFromRawData(
                    rawEmployerData
                  )
                : buildEndorsementItemsFromRawData(
                    rawEmployerData,
                    VIEW_CONFIG[
                      viewKey
                    ].factorKey

            viewItems.set(
              viewKey,
              items
            );


            viewEmployerData.set(
              viewKey,
              new Map(
                items.map(
                  item =&gt; [
                    item.canonicalKey,
                    item

            viewPositions.set(
              viewKey,
              viewKey ===
                &#x27;overall&#x27;
                ? buildAggregatePositions(
                    items

                    items,
                    5

            &#x27;overall&#x27;

          [];

          !aggregateItems.length

            &#x27;No valid raw survey rows found in columns A to D&#x27;

          viewPositions.get(

  &lt;div id=&quot;fit&quot;&gt;

      &lt;div class=&quot;top-row&quot;&gt;
