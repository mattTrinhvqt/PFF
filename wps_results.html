  &lt;div id=&quot;tooltip&quot; class=&quot;tooltip&quot; role=&quot;tooltip&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    /************************************************************
     * DATA SETTINGS
     ************************************************************/

    const SHEET_ID =
      &#x27;1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ&#x27;;

    const SHEET_NAME =
      &#x27;Data&#x27;;

    const CACHE_WEB_APP_URL =
      &#x27;https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec&#x27;;

    const CACHE_APP_KEY =
      &#x27;workplace-promoter-score-graph&#x27;;

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    const FORCE_CACHED_DATA =
      false;

    /*
     * Raw survey columns:
     * A = timestamp
     * B = employer
     * C = 0-10 recommendation score
     * D = endorsed positive influences
     */
    const RAW_QUERY =
      &#x27;select A, B, C, D &#x27; +
      &#x27;where B is not null &#x27; +
      &#x27;and C is not null&#x27;;

    const FACTORS = [
      {
        key: &#x27;pay&#x27;,
        label: &#x27;Pay/bonuses&#x27;
      },
      {
        key: &#x27;worklife&#x27;,
        label: &#x27;Work-life flexibility&#x27;
      },
      {
        key: &#x27;autonomy&#x27;,
        label: &#x27;Clinical autonomy &amp; professional growth&#x27;
      },
      {
        key: &#x27;support&#x27;,
        label: &#x27;Supportive team &amp; management&#x27;
      },
      {
        key: &#x27;workload&#x27;,
        label: &#x27;Staffing &amp; sustainable workload&#x27;
      },
      {
        key: &#x27;tech&#x27;,
        label: &#x27;Quality equipment &amp; technology&#x27;
      }
    ];

    /************************************************************
     * ELEMENTS
     ************************************************************/

    const app =
      document.getElementById(&#x27;app&#x27;);

    const resultsElement =
      document.getElementById(&#x27;results&#x27;);

    const introScrollShell =
      document.querySelector(&#x27;.intro-scroll-shell&#x27;);

    const introScroll =
      document.getElementById(&#x27;introScroll&#x27;);


    const statusElement =
      document.getElementById(&#x27;status&#x27;);

    const tooltip =
      document.getElementById(&#x27;tooltip&#x27;);

    const dataSourceIndicator =
      document.getElementById(&#x27;dataSourceIndicator&#x27;);

    const dataSourceText =
      document.getElementById(&#x27;dataSourceText&#x27;);

    let activeTooltipTrigger =
      null;

    /************************************************************
     * BASIC HELPERS
     ************************************************************/

    function hideLoadingState() {
      app.classList.remove(&#x27;is-loading&#x27;);
      app.setAttribute(&#x27;aria-busy&#x27;, &#x27;false&#x27;);
    }

    function setStatus(message = &#x27;&#x27;) {
      statusElement.textContent = message;
    }

    function setDataSource(source) {
      const isLive =
        source === &#x27;live&#x27;;

      const isCached =
        source === &#x27;cached&#x27;;

      const visible =
        isLive || isCached;

      dataSourceIndicator.hidden =
        !visible;

      if (!visible) {
        return;
      }

      dataSourceIndicator.classList.toggle(
        &#x27;is-cached&#x27;,
        isCached
      );

      dataSourceIndicator.setAttribute(
        &#x27;aria-label&#x27;,
        isCached ? &#x27;Cached data&#x27; : &#x27;Live data&#x27;
      );

      dataSourceText.textContent =
        isCached ? &#x27;CACHED data&#x27; : &#x27;LIVE data&#x27;;

      requestAnimationFrame(
        updateIntroScrollCues
      );
    }

    function getCellValue(cell) {
      if (!cell) {
        return null;
      }

      if (cell.v !== undefined &amp;&amp; cell.v !== null) {
        return cell.v;
      }

      if (cell.f !== undefined &amp;&amp; cell.f !== null) {
        return cell.f;
      }

      return null;
    }

    function toNumber(value) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function clamp(value, min, max) {
      return Math.max(
        min,
        Math.min(max, value)
      );
    }

    function formatTrimmed(value, digits = 2) {
      if (!Number.isFinite(value)) {
        return &#x27;—&#x27;;
      }

      const rounded =
        Number(value.toFixed(digits));

      if (Object.is(rounded, -0) || rounded === 0) {
        return &#x27;0&#x27;;
      }

      return String(rounded);
    }

    function formatSigned(value, digits = 2) {
      if (!Number.isFinite(value)) {
        return &#x27;—&#x27;;
      }

      const rounded =
        Number(value.toFixed(digits));

      if (Object.is(rounded, -0) || rounded === 0) {
        return &#x27;0&#x27;;
      }

      return `${rounded &gt; 0 ? &#x27;+&#x27; : &#x27;−&#x27;}${formatTrimmed(Math.abs(rounded), digits)}`;
    }

    function formatCIBound(value, digits = 2) {
      return formatTrimmed(value, digits);
    }

    function formatPValue(p) {
      if (!Number.isFinite(p)) {
        return &#x27;p = —&#x27;;
      }

      if (p &lt; 0.0001) {
        return &#x27;p &lt; 0.0001&#x27;;
      }

      if (p &lt; 0.001) {
        return &#x27;p &lt; 0.001&#x27;;
      }

      if (p &lt; 0.01) {
        return &#x27;p &lt; 0.01&#x27;;
      }

      if (p &lt; 0.05) {
        return &#x27;p &lt; 0.05&#x27;;
      }

      return `p = ${formatTrimmed(p, 2)}`;
    }

    function formatDiagnosticP(p) {
      if (!Number.isFinite(p)) {
        return &#x27;—&#x27;;
      }

      if (p &lt; 0.001) {
        return &#x27;&lt;0.001&#x27;;
      }

      return p.toFixed(3);
    }

    /************************************************************
     * GOOGLE SHEETS JSONP + CACHE FALLBACK
     ************************************************************/

    function loadSheetQuery(query) {
      return new Promise((resolve, reject) =&gt; {
        const callbackName =
          &#x27;pffRegressionCallback_&#x27; +
          Date.now() +
          &#x27;_&#x27; +
          Math.floor(Math.random() * 1000000);

        const script =
          document.createElement(&#x27;script&#x27;);

        const timeout =
          window.setTimeout(() =&gt; {
            cleanup();
            reject(new Error(&#x27;Could not load Google Sheet data&#x27;));
          }, 20000);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = response =&gt; {
          cleanup();

          if (!response || response.status === &#x27;error&#x27;) {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                &#x27;Could not load Google Sheet data&#x27;
              )
            );
            return;
          }

          resolve(response?.table?.rows || []);
        };

        script.onerror = () =&gt; {
          cleanup();
          reject(new Error(&#x27;Network error loading Google Sheet data&#x27;));
        };

        const params =
          new URLSearchParams({
            sheet: SHEET_NAME,
            headers: &#x27;1&#x27;,
            tq: query,
            tqx: `responseHandler:${callbackName}`,
            _: String(Date.now())
          });

        script.src =
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
          params.toString();

        document.body.appendChild(script);
      });
    }

    function loadCachedRawRows() {
      return new Promise((resolve, reject) =&gt; {
        if (!CACHE_WEB_APP_URL) {
          reject(new Error(&#x27;Cached-data service is not configured&#x27;));
          return;
        }

        const callbackName =
          &#x27;pffRegressionCacheCallback_&#x27; +
          Date.now() +
          &#x27;_&#x27; +
          Math.floor(Math.random() * 1000000);

        const script =
          document.createElement(&#x27;script&#x27;);

        let finished =
          false;

        const timer =
          window.setTimeout(() =&gt; {
            finish(new Error(&#x27;Cached-data service timed out&#x27;));
          }, CACHE_FETCH_TIMEOUT_MS);

        function cleanup() {
          window.clearTimeout(timer);

          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        function finish(error, value) {
          if (finished) {
            return;
          }

          finished = true;
          cleanup();

          if (error) {
            reject(error);
          } else {
            resolve(value);
          }
        }

        window[callbackName] = response =&gt; {
          if (!response || response.ok === false) {
            finish(
              new Error(
                response?.message ||
                &#x27;Cached-data service returned an error&#x27;
              )
            );
            return;
          }

          if (
            !Array.isArray(response.data?.rows) ||
            !response.data.rows.length
          ) {
            finish(new Error(&#x27;The cached-data response has no survey rows&#x27;));
            return;
          }

          const rows =
            response.data.rows.map(row =&gt; ({
              c: [
                { v: row?.[0] ?? &#x27;&#x27; },
                { v: row?.[1] ?? &#x27;&#x27; },
                { v: row?.[2] ?? &#x27;&#x27; },
                { v: row?.[3] ?? &#x27;&#x27; }
              ]
            }));

          finish(null, rows);
        };

        script.onerror = () =&gt; {
          finish(new Error(&#x27;Could not load the cached-data service&#x27;));
        };

        const params =
          new URLSearchParams({
            appKey: CACHE_APP_KEY,
            callback: callbackName,
            _: String(Date.now())
          });

        const separator =
          CACHE_WEB_APP_URL.includes(&#x27;?&#x27;)
            ? &#x27;&amp;&#x27;
            : &#x27;?&#x27;;

        script.src =
          `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;

        document.body.appendChild(script);
      });
    }

    async function loadRawRowsWithFallback() {
      let liveError =
        null;

      if (!FORCE_CACHED_DATA) {
        try {
          const rows =
            await loadSheetQuery(RAW_QUERY);

          if (!rows.length) {
            throw new Error(&#x27;No valid live survey rows found&#x27;);
          }

          setDataSource(&#x27;live&#x27;);
          return rows;
        } catch (error) {
          liveError = error;
          console.warn(&#x27;Live workplace data could not be used&#x27;, error);
        }
      }

      try {
        const rows =
          await loadCachedRawRows();

        if (!rows.length) {
          throw new Error(&#x27;No valid cached survey rows found&#x27;);
        }

        setDataSource(&#x27;cached&#x27;);
        console.warn(
          &#x27;Using cached workplace survey data&#x27;,
          liveError?.message
        );

        return rows;
      } catch (cachedError) {
        setDataSource(&#x27;none&#x27;);
        console.error(&#x27;Live data error&#x27;, liveError);
        console.error(&#x27;Cached data error&#x27;, cachedError);
        throw new Error(&#x27;Live and cached workplace data are currently unavailable&#x27;);
      }
    }

    /************************************************************
     * FACTOR NORMALISATION
     ************************************************************/

    function normaliseFactorText(value) {
      return String(value || &#x27;&#x27;)
        .toLowerCase()
        .normalize(&#x27;NFKD&#x27;)
        .replace(/[’‘]/g, &quot;&#x27;&quot;)
        .replace(/&amp;/g, &#x27; and &#x27;)
        .replace(/[^a-z0-9]+/g, &#x27; &#x27;)
        .trim()
        .replace(/\s+/g, &#x27; &#x27;);
    }

    function getFactorKey(value) {
      const text =
        normaliseFactorText(value);

      if (
        !text ||
        text === &#x27;none&#x27; ||
        text === &#x27;nil&#x27; ||
        text === &#x27;no factors&#x27; ||
        text === &#x27;no factor&#x27; ||
        text === &#x27;nothing&#x27;
      ) {
        return null;
      }

      if (
        text.includes(&#x27;pay&#x27;) ||
        text.includes(&#x27;bonus&#x27;) ||
        text.includes(&#x27;remuneration&#x27;)
      ) {
        return &#x27;pay&#x27;;
      }

      if (
        text.includes(&#x27;work life&#x27;) ||
        text.includes(&#x27;worklife&#x27;) ||
        text.includes(&#x27;flexib&#x27;)
      ) {
        return &#x27;worklife&#x27;;
      }

      if (
        text.includes(&#x27;autonomy&#x27;) ||
        text.includes(&#x27;professional growth&#x27;) ||
        text.includes(&#x27;professional development&#x27;)
      ) {
        return &#x27;autonomy&#x27;;
      }

      if (
        text.includes(&#x27;support&#x27;) ||
        (text.includes(&#x27;team&#x27;) &amp;&amp; text.includes(&#x27;management&#x27;))
      ) {
        return &#x27;support&#x27;;
      }

      if (
        text.includes(&#x27;staffing&#x27;) ||
        text.includes(&#x27;workload&#x27;)
      ) {
        return &#x27;workload&#x27;;
      }

      if (
        text.includes(&#x27;equipment&#x27;) ||
        text.includes(&#x27;technology&#x27;) ||
        text === &#x27;tech&#x27;
      ) {
        return &#x27;tech&#x27;;
      }

      return null;
    }

    function getEndorsedFactorKeys(value) {
      const factorKeys =
        new Set();

      const rawText =
        String(value || &#x27;&#x27;).trim();

      if (!rawText) {
        return factorKeys;
      }

      rawText
        .split(/[;,|\n]+/)
        .forEach(factor =&gt; {
          const factorKey =
            getFactorKey(factor);

          if (factorKey) {
            factorKeys.add(factorKey);
          }
        });

      if (!factorKeys.size) {
        FACTORS.forEach(factor =&gt; {
          const normalisedLabel =
            normaliseFactorText(factor.label);

          const normalisedWhole =
            normaliseFactorText(rawText);

          if (
            normalisedWhole.includes(normalisedLabel) ||
            getFactorKey(rawText) === factor.key
          ) {
            factorKeys.add(factor.key);
          }
        });
      }

      return factorKeys;
    }

    function normaliseObservations(rows) {
      const observations =
        [];

      rows.forEach(row =&gt; {
        const timestamp =
          getCellValue(row?.c?.[0]);

        const employer =
          String(getCellValue(row?.c?.[1]) || &#x27;&#x27;).trim();

        const score =
          toNumber(getCellValue(row?.c?.[2]));

        const rawFactors =
          getCellValue(row?.c?.[3]);

        if (
          !employer ||
          !Number.isFinite(score) ||
          score &lt; 0 ||
          score &gt; 10
        ) {
          return;
        }

        const endorsed =
          getEndorsedFactorKeys(rawFactors);

        const predictors =
          FACTORS.map(factor =&gt;
            endorsed.has(factor.key) ? 1 : 0
          );

        observations.push({
          timestamp,
          employer,
          score,
          predictors
        });
      });

      return observations;
    }

    /************************************************************
     * MATRIX HELPERS
     ************************************************************/

    function zeros(rows, cols) {
      return Array.from(
        { length: rows },
        () =&gt; Array(cols).fill(0)
      );
    }

    function transpose(matrix) {
      if (!matrix.length) {
        return [];
      }

      return matrix[0].map(
        (_, columnIndex) =&gt;
          matrix.map(row =&gt; row[columnIndex])
      );
    }

    function matrixMultiply(a, b) {
      const rows =
        a.length;

      const inner =
        b.length;

      const cols =
        b[0].length;

      const out =
        zeros(rows, cols);

      for (let i = 0; i &lt; rows; i++) {
        for (let k = 0; k &lt; inner; k++) {
          const aik = a[i][k];

          for (let j = 0; j &lt; cols; j++) {
            out[i][j] += aik * b[k][j];
          }
        }
      }

      return out;
    }

    function matrixVectorMultiply(matrix, vector) {
      return matrix.map(row =&gt;
        row.reduce(
          (sum, value, index) =&gt;
            sum + value * vector[index],
          0
        )
      );
    }

    function dot(a, b) {
      let sum = 0;

      for (let i = 0; i &lt; a.length; i++) {
        sum += a[i] * b[i];
      }

      return sum;
    }

    function invertMatrix(matrix) {
      const n =
        matrix.length;

      if (!n || matrix.some(row =&gt; row.length !== n)) {
        throw new Error(&#x27;Matrix must be square&#x27;);
      }

      const augmented =
        matrix.map((row, i) =&gt; [
          ...row.map(value =&gt; Number(value)),
          ...Array.from(
            { length: n },
            (_, j) =&gt; i === j ? 1 : 0
          )
        ]);

      for (let column = 0; column &lt; n; column++) {
        let pivotRow =
          column;

        let pivotMagnitude =
          Math.abs(augmented[column][column]);

        for (let row = column + 1; row &lt; n; row++) {
          const magnitude =
            Math.abs(augmented[row][column]);

          if (magnitude &gt; pivotMagnitude) {
            pivotMagnitude = magnitude;
            pivotRow = row;
          }
        }

        if (pivotMagnitude &lt; 1e-11) {
          throw new Error(&#x27;Predictors are perfectly collinear or lack variation&#x27;);
        }

        if (pivotRow !== column) {
          [augmented[column], augmented[pivotRow]] =
            [augmented[pivotRow], augmented[column]];
        }

        const pivot =
          augmented[column][column];

        for (let j = 0; j &lt; 2 * n; j++) {
          augmented[column][j] /= pivot;
        }

        for (let row = 0; row &lt; n; row++) {
          if (row === column) {
            continue;
          }

          const factor =
            augmented[row][column];

          if (Math.abs(factor) &lt; 1e-18) {
            continue;
          }

          for (let j = 0; j &lt; 2 * n; j++) {
            augmented[row][j] -= factor * augmented[column][j];
          }
        }
      }

      return augmented.map(row =&gt; row.slice(n));
    }

    function mean(values) {
      return values.reduce((sum, value) =&gt; sum + value, 0) /
        values.length;
    }

    /************************************************************
     * DISTRIBUTION FUNCTIONS
     ************************************************************/

    function logGamma(z) {
      const coefficients = [
        676.5203681218851,
        -1259.1392167224028,
        771.32342877765313,
        -176.61502916214059,
        12.507343278686905,
        -0.13857109526572012,
        9.9843695780195716e-6,
        1.5056327351493116e-7
      ];

      if (z &lt; 0.5) {
        return Math.log(Math.PI) -
          Math.log(Math.sin(Math.PI * z)) -
          logGamma(1 - z);
      }

      let x =
        0.99999999999980993;

      z -= 1;

      for (let i = 0; i &lt; coefficients.length; i++) {
        x += coefficients[i] / (z + i + 1);
      }

      const t =
        z + coefficients.length - 0.5;

      return 0.5 * Math.log(2 * Math.PI) +
        (z + 0.5) * Math.log(t) -
        t +
        Math.log(x);
    }

    function betaContinuedFraction(a, b, x) {
      const maxIterations = 200;
      const epsilon = 3e-14;
      const fpMin = 1e-300;

      const qab = a + b;
      const qap = a + 1;
      const qam = a - 1;

      let c = 1;
      let d = 1 - qab * x / qap;

      if (Math.abs(d) &lt; fpMin) {
        d = fpMin;
      }

      d = 1 / d;
      let h = d;

      for (let m = 1; m &lt;= maxIterations; m++) {
        const m2 = 2 * m;

        let aa =
          m * (b - m) * x /
          ((qam + m2) * (a + m2));

        d = 1 + aa * d;
        if (Math.abs(d) &lt; fpMin) d = fpMin;

        c = 1 + aa / c;
        if (Math.abs(c) &lt; fpMin) c = fpMin;

        d = 1 / d;
        h *= d * c;

        aa =
          -(a + m) * (qab + m) * x /
          ((a + m2) * (qap + m2));

        d = 1 + aa * d;
        if (Math.abs(d) &lt; fpMin) d = fpMin;

        c = 1 + aa / c;
        if (Math.abs(c) &lt; fpMin) c = fpMin;

        d = 1 / d;

        const delta =
          d * c;

        h *= delta;

        if (Math.abs(delta - 1) &lt; epsilon) {
          break;
        }
      }

      return h;
    }

    function regularizedIncompleteBeta(x, a, b) {
      if (x &lt;= 0) return 0;
      if (x &gt;= 1) return 1;

      const logTerm =
        logGamma(a + b) -
        logGamma(a) -
        logGamma(b) +
        a * Math.log(x) +
        b * Math.log(1 - x);

      const bt =
        Math.exp(logTerm);

      if (x &lt; (a + 1) / (a + b + 2)) {
        return bt * betaContinuedFraction(a, b, x) / a;
      }

      return 1 -
        bt * betaContinuedFraction(b, a, 1 - x) / b;
    }

    function studentTCdf(t, degreesOfFreedom) {
      if (!Number.isFinite(t)) {
        return t &lt; 0 ? 0 : 1;
      }

      const df =
        degreesOfFreedom;

      const x =
        df / (df + t * t);

      const ibeta =
        regularizedIncompleteBeta(
          x,
          df / 2,
          0.5
        );

      if (t &gt;= 0) {
        return 1 - 0.5 * ibeta;
      }

      return 0.5 * ibeta;
    }

    function twoSidedTPValue(t, degreesOfFreedom) {
      const cdf =
        studentTCdf(
          Math.abs(t),
          degreesOfFreedom
        );

      return clamp(
        2 * (1 - cdf),
        0,
        1
      );
    }

    function studentTCritical975(degreesOfFreedom) {
      let low = 0;
      let high = 20;

      for (let i = 0; i &lt; 80; i++) {
        const mid =
          (low + high) / 2;

        if (studentTCdf(mid, degreesOfFreedom) &lt; 0.975) {
          low = mid;
        } else {
          high = mid;
        }
      }

      return (low + high) / 2;
    }

    function regularizedGammaQ(a, x) {
      if (x &lt; 0 || a &lt;= 0) {
        return NaN;
      }

      if (x === 0) {
        return 1;
      }

      const epsilon =
        1e-14;

      const fpMin =
        1e-300;

      if (x &lt; a + 1) {
        let sum =
          1 / a;

        let term =
          sum;

        let ap =
          a;

        for (let n = 1; n &lt;= 200; n++) {
          ap += 1;
          term *= x / ap;
          sum += term;

          if (Math.abs(term) &lt; Math.abs(sum) * epsilon) {
            break;
          }
        }

        const p =
          sum *
          Math.exp(
            -x +
            a * Math.log(x) -
            logGamma(a)
          );

        return clamp(1 - p, 0, 1);
      }

      let b =
        x + 1 - a;

      let c =
        1 / fpMin;

      let d =
        1 / b;

      let h =
        d;

      for (let i = 1; i &lt;= 200; i++) {
        const an =
          -i * (i - a);

        b += 2;
        d = an * d + b;

        if (Math.abs(d) &lt; fpMin) {
          d = fpMin;
        }

        c = b + an / c;

        if (Math.abs(c) &lt; fpMin) {
          c = fpMin;
        }

        d = 1 / d;

        const delta =
          d * c;

        h *= delta;

        if (Math.abs(delta - 1) &lt; epsilon) {
          break;
        }
      }

      return clamp(
        Math.exp(
          -x +
          a * Math.log(x) -
          logGamma(a)
        ) * h,
        0,
        1
      );
    }

    function chiSquareSurvival(statistic, degreesOfFreedom) {
      if (!Number.isFinite(statistic) || statistic &lt; 0) {
        return NaN;
      }

      return regularizedGammaQ(
        degreesOfFreedom / 2,
        statistic / 2
      );
    }

    /************************************************************
     * OLS + HC3 ROBUST INFERENCE
     ************************************************************/

    function fitOls(X, y) {
      const n =
        X.length;

      const k =
        X[0].length;

      const Xt =
        transpose(X);

      const XtX =
        matrixMultiply(Xt, X);

      const XtXInverse =
        invertMatrix(XtX);

      const Xty =
        Xt.map(column =&gt; dot(column, y));

      const beta =
        matrixVectorMultiply(XtXInverse, Xty);

      const fitted =
        X.map(row =&gt; dot(row, beta));

      const residuals =
        y.map((value, i) =&gt; value - fitted[i]);

      const yMean =
        mean(y);

      const sse =
        residuals.reduce(
          (sum, residual) =&gt; sum + residual * residual,
          0
        );

      const sst =
        y.reduce(
          (sum, value) =&gt; {
            const delta = value - yMean;
            return sum + delta * delta;
          },
          0
        );

      const r2 =
        sst &gt; 0
          ? 1 - sse / sst
          : 0;

      const leverage =
        X.map(row =&gt; {
          const transformed =
            matrixVectorMultiply(XtXInverse, row);

          return clamp(
            dot(row, transformed),
            0,
            0.999999999
          );
        });

      return {
        n,
        k,
        beta,
        fitted,
        residuals,
        sse,
        r2,
        leverage,
        XtXInverse
      };
    }

    function calculateHc3Covariance(model, X) {
      const k =
        model.k;

      const meat =
        zeros(k, k);

      for (let i = 0; i &lt; model.n; i++) {
        const denominator =
          Math.max(
            1e-8,
            1 - model.leverage[i]
          );

        const adjustedResidual =
          model.residuals[i] / denominator;

        const weight =
          adjustedResidual * adjustedResidual;

        for (let a = 0; a &lt; k; a++) {
          for (let b = 0; b &lt; k; b++) {
            meat[a][b] +=
              X[i][a] * X[i][b] * weight;
          }
        }
      }

      return matrixMultiply(
        matrixMultiply(
          model.XtXInverse,
          meat
        ),
        model.XtXInverse
      );
    }

    function calculateInference(model, X) {
      const covariance =
        calculateHc3Covariance(model, X);

      const df =
        model.n - model.k;

      const critical =
        studentTCritical975(df);

      return model.beta.map((coefficient, index) =&gt; {
        const variance =
          Math.max(
            0,
            covariance[index][index]
          );

        const se =
          Math.sqrt(variance);

        const t =
          se &gt; 0
            ? coefficient / se
            : coefficient === 0
              ? 0
              : coefficient &gt; 0
                ? Infinity
                : -Infinity;

        const p =
          twoSidedTPValue(t, df);

        return {
          coefficient,
          se,
          t,
          p,
          lower: coefficient - critical * se,
          upper: coefficient + critical * se
        };
      });
    }

    /************************************************************
     * MODEL CHECKS
     ************************************************************/

    function calculateVifs(X) {
      const predictorCount =
        X[0].length - 1;

      const vifs =
        [];

      for (let target = 1; target &lt;= predictorCount; target++) {
        const y =
          X.map(row =&gt; row[target]);

        const targetMean =
          mean(y);

        const targetSst =
          y.reduce((sum, value) =&gt; {
            const delta = value - targetMean;
            return sum + delta * delta;
          }, 0);

        if (targetSst &lt; 1e-12) {
          vifs.push(Infinity);
          continue;
        }

        const auxX =
          X.map(row =&gt; [
            1,
            ...row
              .slice(1)
              .filter((_, index) =&gt; index !== target - 1)
          ]);

        try {
          const model =
            fitOls(auxX, y);

          const denominator =
            Math.max(
              1e-12,
              1 - model.r2
            );

          vifs.push(1 / denominator);
        } catch (_) {
          vifs.push(Infinity);
        }
      }

      return vifs;
    }

    function breuschPaganTest(model, X) {
      const squaredResiduals =
        model.residuals.map(value =&gt; value * value);

      try {
        const auxiliary =
          fitOls(X, squaredResiduals);

        const statistic =
          model.n * Math.max(0, auxiliary.r2);

        const degreesOfFreedom =
          X[0].length - 1;

        return {
          statistic,
          degreesOfFreedom,
          p: chiSquareSurvival(
            statistic,
            degreesOfFreedom
          )
        };
      } catch (_) {
        return {
          statistic: NaN,
          degreesOfFreedom: X[0].length - 1,
          p: NaN
        };
      }
    }

    function jarqueBeraTest(residuals) {
      const n =
        residuals.length;

      const residualMean =
        mean(residuals);

      let m2 = 0;
      let m3 = 0;
      let m4 = 0;

      residuals.forEach(value =&gt; {
        const delta =
          value - residualMean;

        const delta2 =
          delta * delta;

        m2 += delta2;
        m3 += delta2 * delta;
        m4 += delta2 * delta2;
      });

      m2 /= n;
      m3 /= n;
      m4 /= n;

      if (m2 &lt; 1e-15) {
        return {
          statistic: 0,
          p: 1
        };
      }

      const skewness =
        m3 / Math.pow(m2, 1.5);

      const kurtosis =
        m4 / (m2 * m2);

      const statistic =
        n / 6 *
        (
          skewness * skewness +
          Math.pow(kurtosis - 3, 2) / 4
        );

      return {
        statistic,
        p: chiSquareSurvival(statistic, 2)
      };
    }

    function calculateInfluence(model) {
      const mse =
        model.sse /
        Math.max(1, model.n - model.k);

      const cookThreshold =
        4 / model.n;

      let influentialCount =
        0;

      if (mse &lt;= 0) {
        return {
          cookThreshold,
          influentialCount
        };
      }

      for (let i = 0; i &lt; model.n; i++) {
        const h =
          model.leverage[i];

        const denominator =
          Math.max(
            1e-10,
            (1 - h) * (1 - h)
          );

        const cooksDistance =
          (
            model.residuals[i] * model.residuals[i] /
            (model.k * mse)
          ) *
          (h / denominator);

        if (cooksDistance &gt; cookThreshold) {
          influentialCount += 1;
        }
      }

      return {
        cookThreshold,
        influentialCount
      };
    }

    function runModelChecks(model, X) {
      const vifs =
        calculateVifs(X);

      const maxVif =
        Math.max(...vifs);

      const bp =
        breuschPaganTest(model, X);

      const jb =
        jarqueBeraTest(model.residuals);

      const influence =
        calculateInfluence(model);

      const issues =
        [];

      if (!Number.isFinite(maxVif) || maxVif &gt;= 10) {
        issues.push(&#x27;high collinearity&#x27;);
      } else if (maxVif &gt;= 5) {
        issues.push(&#x27;moderate collinearity&#x27;);
      }

      /*
       * Heteroskedasticity and residual non-normality are reported
       * in the diagnostic tooltip but do not automatically make the
       * public summary look problematic: displayed inference already
       * uses HC3 robust standard errors.
       */
      if (
        influence.influentialCount &gt;
        Math.max(3, Math.ceil(model.n * 0.10))
      ) {
        issues.push(&#x27;many potential influential observations&#x27;);
      }

      return {
        vifs,
        maxVif,
        bp,
        jb,
        influence,
        issues
      };
    }

    /************************************************************
     * MODEL ASSEMBLY
     ************************************************************/

    function buildDesignMatrix(observations) {
      const X =
        observations.map(observation =&gt; [
          1,
          ...observation.predictors
        ]);

      const y =
        observations.map(observation =&gt; observation.score);

      return { X, y };
    }

    function validatePredictorVariation(observations) {
      const missingVariation =
        [];

      FACTORS.forEach((factor, index) =&gt; {
        const values =
          observations.map(
            observation =&gt; observation.predictors[index]
          );

        const hasZero =
          values.some(value =&gt; value === 0);

        const hasOne =
          values.some(value =&gt; value === 1);

        if (!hasZero || !hasOne) {
          missingVariation.push(factor.label);
        }
      });

      return missingVariation;
    }

    function analyseObservations(observations) {
      const parameterCount =
        FACTORS.length + 1;

      if (observations.length &lt;= parameterCount + 2) {
        throw new Error(
          `Not enough usable responses to fit the adjusted model yet (n=${observations.length}).`
        );
      }

      const missingVariation =
        validatePredictorVariation(observations);

      if (missingVariation.length) {
        throw new Error(
          &#x27;The adjusted model cannot be estimated yet because these factors do not have both endorsed and non-endorsed responses: &#x27; +
          missingVariation.join(&#x27;, &#x27;)
        );
      }

      const { X, y } =
        buildDesignMatrix(observations);

      const model =
        fitOls(X, y);

      const inference =
        calculateInference(model, X);

      const checks =
        runModelChecks(model, X);

      const effects =
        FACTORS.map((factor, index) =&gt; ({
          ...factor,
          ...inference[index + 1]
        }));

      return {
        model,
        inference,
        checks,
        effects
      };
    }

    function updateIntroScrollCues() {
      if (!introScrollShell || !introScroll) {
        return;
      }

      const maxScroll =
        Math.max(0, introScroll.scrollWidth - introScroll.clientWidth);

      const tolerance =
        2;

      introScrollShell.classList.toggle(
        &#x27;can-scroll-left&#x27;,
        introScroll.scrollLeft &gt; tolerance
      );

      introScrollShell.classList.toggle(
        &#x27;can-scroll-right&#x27;,
        introScroll.scrollLeft &lt; maxScroll - tolerance
      );
    }


    /************************************************************
     * DISPLAY
     ************************************************************/

    function effectDisplayText(effect) {
      if (!(effect.p &lt; 0.05)) {
        return &#x27;Not significant&#x27;;
      }

      const magnitude =
        formatTrimmed(
          Math.abs(effect.coefficient),
          2
        );

      if (effect.coefficient &gt; 0) {
        return `+${magnitude} points`;
      }

      if (effect.coefficient &lt; 0) {
        return `−${magnitude} points lower`;
      }

      return &#x27;0 points&#x27;;
    }

    function effectTooltipText(effect) {
      return (
        `${formatSigned(effect.coefficient)} ` +
        `(95% CI; ${formatCIBound(effect.lower)}, ${formatCIBound(effect.upper)}), ` +
        formatPValue(effect.p)
      );
    }

    function renderResults(analysis) {
      resultsElement.innerHTML = &#x27;&#x27;;

      const sortedEffects =
        [...analysis.effects].sort(
          (a, b) =&gt; b.coefficient - a.coefficient
        );

      sortedEffects.forEach((effect, index) =&gt; {
        const row =
          document.createElement(&#x27;li&#x27;);

        row.className =
          &#x27;result-row&#x27;;

        const rank =
          document.createElement(&#x27;span&#x27;);

        rank.className =
          &#x27;factor-rank&#x27;;

        rank.textContent =
          `${index + 1})`;

        const label =
          document.createElement(&#x27;span&#x27;);

        label.className =
          &#x27;factor-name&#x27;;

        label.textContent =
          effect.label;

        const trigger =
          document.createElement(&#x27;button&#x27;);

        trigger.type =
          &#x27;button&#x27;;

        trigger.className =
          &#x27;effect-trigger&#x27;;

        trigger.textContent =
          effectDisplayText(effect);

        trigger.dataset.tooltip =
          effectTooltipText(effect);

        trigger.setAttribute(
          &#x27;aria-label&#x27;,
          `${effect.label}: ${trigger.textContent}. ${trigger.dataset.tooltip}`
        );

        row.appendChild(rank);
        row.appendChild(label);
        row.appendChild(trigger);
        resultsElement.appendChild(row);
      });

    }

    /************************************************************
     * TOOLTIP INTERACTION
     ************************************************************/

    function positionTooltip(trigger) {
      const margin =
        8;

      const gap =
        7;

      const triggerRect =
        trigger.getBoundingClientRect();

      const tooltipRect =
        tooltip.getBoundingClientRect();

      let left =
        triggerRect.left +
        triggerRect.width / 2 -
        tooltipRect.width / 2;

      left =
        clamp(
          left,
          margin,
          window.innerWidth - tooltipRect.width - margin
        );

      let top =
        triggerRect.top - tooltipRect.height - gap;

      if (top &lt; margin) {
        top =
          triggerRect.bottom + gap;
      }

      top =
        clamp(
          top,
          margin,
          window.innerHeight - tooltipRect.height - margin
        );

      tooltip.style.left =
        `${left}px`;

      tooltip.style.top =
        `${top}px`;
    }

    function showTooltip(trigger) {
      const text =
        trigger?.dataset?.tooltip;

      if (!text) {
        return;
      }

      if (
        activeTooltipTrigger &amp;&amp;
        activeTooltipTrigger !== trigger
      ) {
        activeTooltipTrigger.classList.remove(&#x27;is-open&#x27;);
      }

      activeTooltipTrigger =
        trigger;

      trigger.classList.add(&#x27;is-open&#x27;);

      tooltip.textContent =
        text;

      tooltip.classList.add(&#x27;is-visible&#x27;);

      requestAnimationFrame(() =&gt; {
        positionTooltip(trigger);
      });
    }

    function hideTooltip() {
      if (activeTooltipTrigger) {
        activeTooltipTrigger.classList.remove(&#x27;is-open&#x27;);
      }

      activeTooltipTrigger =
        null;

      tooltip.classList.remove(&#x27;is-visible&#x27;);
    }

    document.addEventListener(&#x27;pointerover&#x27;, event =&gt; {
      if (event.pointerType === &#x27;touch&#x27;) {
        return;
      }

      const trigger =
        event.target.closest(&#x27;[data-tooltip]&#x27;);

      if (trigger) {
        showTooltip(trigger);
      }
    });

    document.addEventListener(&#x27;pointerout&#x27;, event =&gt; {
      if (event.pointerType === &#x27;touch&#x27;) {
        return;
      }

      const trigger =
        event.target.closest(&#x27;[data-tooltip]&#x27;);

      if (
        trigger &amp;&amp;
        !trigger.contains(event.relatedTarget)
      ) {
        hideTooltip();
      }
    });

    document.addEventListener(&#x27;focusin&#x27;, event =&gt; {
      const trigger =
        event.target.closest(&#x27;[data-tooltip]&#x27;);

      if (trigger) {
        showTooltip(trigger);
      }
    });

    document.addEventListener(&#x27;focusout&#x27;, event =&gt; {
      const trigger =
        event.target.closest(&#x27;[data-tooltip]&#x27;);

      if (trigger) {
        hideTooltip();
      }
    });

    document.addEventListener(&#x27;click&#x27;, event =&gt; {
      const trigger =
        event.target.closest(&#x27;[data-tooltip]&#x27;);

      if (!trigger) {
        hideTooltip();
        return;
      }

      if (
        activeTooltipTrigger === trigger &amp;&amp;
        tooltip.classList.contains(&#x27;is-visible&#x27;)
      ) {
        hideTooltip();
      } else {
        showTooltip(trigger);
      }
    });

    window.addEventListener(&#x27;resize&#x27;, () =&gt; {
      if (activeTooltipTrigger) {
        positionTooltip(activeTooltipTrigger);
      }
    });

    if (introScroll) {
      introScroll.addEventListener(
        &#x27;scroll&#x27;,
        updateIntroScrollCues,
        { passive: true }
      );
    }

    window.addEventListener(
      &#x27;resize&#x27;,
      updateIntroScrollCues
    );

    requestAnimationFrame(
      updateIntroScrollCues
    );


    window.addEventListener(&#x27;scroll&#x27;, () =&gt; {
      if (activeTooltipTrigger) {
        positionTooltip(activeTooltipTrigger);
      }
    }, true);

    /************************************************************
     * START
     ************************************************************/

    async function initialise() {
      try {
        setStatus(&#x27;&#x27;);

        const rawRows =
          await loadRawRowsWithFallback();

        const observations =
          normaliseObservations(rawRows);

        if (!observations.length) {
          throw new Error(&#x27;No usable workplace survey responses were found&#x27;);
        }

        const analysis =
          analyseObservations(observations);

        renderResults(analysis);
      } catch (error) {
        console.error(error);
        setStatus(
          error?.message ||
          &#x27;Unable to analyse workplace survey data right now&#x27;
        );
      } finally {
        hideLoadingState();
      }
    }

    initialise();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"
    ></iframe>
  </main>
