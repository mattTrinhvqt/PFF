<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Workplace Results</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      overflow-x: hidden;
    }

    .pff-app-stack {
      display: flex;
      width: 100%;
      flex-direction: column;
      gap: 24px;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .pff-app-frame {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #fff;
      overflow: hidden;
    }

    .pff-app-frame--podium {
      height: 280px;
    }

    .pff-app-frame--graph {
      height: 520px;
    }

    .pff-app-frame--regression {
      height: 270px;
    }

    @media (max-width: 430px) {
      .pff-app-stack {
        gap: 20px;
      }

      .pff-app-frame--podium {
        height: 260px;
      }

      .pff-app-frame--graph {
        height: 500px;
      }

      .pff-app-frame--regression {
        height: 310px;
      }
    }
  </style>
</head>

      class="pff-app-frame pff-app-frame--podium"
      title="Best optometry workplaces"

&lt;html&gt;
&lt;head&gt;
  &lt;meta charset=&quot;utf-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;

  &lt;title&gt;Best Optometry Workplaces&lt;/title&gt;

  &lt;link

  &lt;style&gt;
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;

      /*
       * Each Gold/Silver/Bronze box is permanently the same height.
       * 44px comfortably fits two employer lines at the normal 14px
       * desktop font size.
       */
      --podium-row-height: 44px;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --track: #e8eaf0;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --gold-bg: #fff7d9;
      --gold-border: #ead58a;
      --gold-ink: #78600a;

      --silver-bg: #f3f5f8;
      --silver-border: #d9dee6;
      --silver-ink: #657084;

      --bronze-bg: #faeee5;
      --bronze-border: #e8c9af;
      --bronze-ink: #8b5635;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: &#x27;Lato&#x27;, sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      max-width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      margin: 0 auto;
      padding:
        clamp(6px, 2.5vh, 14px)
        4px
        2px;
      overflow: hidden;
      background: #fff;
      text-align: center;
    }

    #app.is-loading &gt; :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      -webkit-clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation:
        blueConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation:
        greenConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation:
        redConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation:
        loadingTextPulse
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    .response-summary {
      flex: 0 0 auto;
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: &quot;&quot;;
      display: block;
      width: 100%;
      height: 1px;
      margin-top: clamp(2px, 1vh, 5px);
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      width: 100%;
      min-height: clamp(23px, 6vh, 31px);
      margin-top: 2px;
      align-items: center;
      justify-content: center;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      min-width: 6px;
      min-height: 6px;
      flex: 0 0 6px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    h1 {
      flex: 0 0 auto;
      margin:
        12px
        12px
        clamp(5px, 2.5vh, 14px);
      color: var(--ink);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.2;
    }

    /*
     * This area takes all remaining embed height.
     * JavaScript changes the three row proportions according
     * to the number of employers in each box.
     */
    .podium-list {
      display: grid;
      flex: 0 0 auto;
      grid-template-rows: repeat(
        3,
        var(--podium-row-height)
      );
      gap: clamp(4px, 1.4vh, 8px);
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: visible;
    }

    .podium-row {
      display: grid;
      grid-template-columns:
        clamp(
          54px,
          16vw,
          78px
        )
        minmax(
          0,
          1fr
        );
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--track);
      border-radius: clamp(4px, 1.4vh, 7px);
      text-align: left;
    }

    .medal {
      display: flex;
      min-width: 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
      padding: clamp(3px, 1.5vh, 8px);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .result {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      padding:
        4px
        clamp(6px, 2.7vw, 14px);
      overflow: hidden;
      color: var(--ink);
      background: #fff;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.2;
    }

    /*
     * Every employer remains on one line.
     * One shared font size is applied to every employer.
     */
    .employer-line {
      display: block;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      line-height: 1.2;
      text-align: left;
      white-space: nowrap;
    }

    .gold {
      border-color: var(--gold-border);
    }

    .gold .medal {
      color: var(--gold-ink);
      background: var(--gold-bg);
    }

    .silver {
      border-color: var(--silver-border);
    }

    .silver .medal {
      color: var(--silver-ink);
      background: var(--silver-bg);
    }

    .bronze {
      border-color: var(--bronze-border);
    }

    .bronze .medal {
      color: var(--bronze-ink);
      background: var(--bronze-bg);
    }

    #status {
      flex: 0 0 auto;
      max-height: 42px;
      margin: 6px 8px 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    #status[hidden] {
      display: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding-right: 3px;
        padding-left: 3px;
      }

      .response-value {
        font-size: 24px;
      }

      .live-data {
        font-size: 8px;
      }

      h1 {
        margin-top: 10px;
        font-size: 18px;
      }

      .medal {
        font-size: 10px;
      }

      .result {
        font-size: 12px;
      }

      .podium-row {
        grid-template-columns:
          clamp(
            52px,
            18vw,
            70px
          )
          minmax(
            0,
            1fr
          );
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }

    @media (max-width: 350px) {
      h1 {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }

    function normaliseEmployerName(
      value
    ) {
      return String(
        value ||
        &#x27;&#x27;
      )
        .toLowerCase()
        .normalize(
          &#x27;NFKD&#x27;
        )
        .replace(
          /[’‘]/g,
          &quot;&#x27;&quot;
        )
        .replace(
          /&amp;/g,
          &#x27; and &#x27;
        )
        .replace(
          /[^a-z0-9]+/g,
          &#x27; &#x27;
        )
        .trim()
        .replace(
          /\s+/g,
          &#x27; &#x27;
        );
    }


    const EMPLOYER_ALIAS_MAP =
      new Map();


    EMPLOYERS.forEach(
      (
        employer,
        employerIndex
      ) =&gt; {
        [
          employer.fullName,
          ...employer.aliases
        ].forEach(
          alias =&gt; {
            EMPLOYER_ALIAS_MAP.set(
              normaliseEmployerName(
                alias
              ),
              {
                fullName:
                  employer.fullName,

                order:
                  employerIndex
              }
            );
          }
        );
      }
    );


    function getEmployerAppearance(
      employerName
    ) {
      const original =
        String(
          employerName ||
          &#x27;&#x27;
        ).trim();


      const normalised =
        normaliseEmployerName(
          original
        );


      const knownEmployer =
        EMPLOYER_ALIAS_MAP.get(
          normalised
        );


      if (
        knownEmployer
      ) {
        return {
          key:
            normaliseEmployerName(
              knownEmployer.fullName
            ),

          fullName:
            knownEmployer.fullName,

          order:
            knownEmployer.order
        };
      }


      return {
        key:
          normalised ||
          original,

        fullName:
          original ||
          &#x27;Unknown employer&#x27;,

        order:
          Number.MAX_SAFE_INTEGER
      };
    }


    const EMPLOYER_SEPARATOR =
      &#x27;\u001F&#x27;;


    function formatWorkplaceEmployers(
      value
    ) {
      const text =

          value ||
          &#x27;&#x27;
        )
          .trim()
          .replace(
            /^#(?:1|2|3)\s*/,
            &#x27;&#x27;
          );


      const employers =
        text
          .split(
            EMPLOYER_SEPARATOR
          )
          .map(
            employer =&gt;
              employer.trim()
          )
          .filter(
            Boolean
          );


      return employers.length
        ? employers

    function renderWorkplaceResult(
      target,
      value
    ) {
      const employers =
        formatWorkplaceEmployers(

      employers.forEach(

        }

      target.replaceChildren(

    /*
     * Gold, Silver and Bronze always remain the same fixed height.
     * The employer font is reduced separately if more than two
     * employer lines need to fit inside a box.
     */
    function updatePodiumRowProportions() {
      podiumList.style.gridTemplateRows =
        &#x27;repeat(3, var(--podium-row-height))&#x27;;
    }


    /*
     * Each Gold/Silver/Bronze box normally uses a 14px
     * employer font on desktop and 12px on mobile.
     *
     * If the employers in one box do not fit vertically
     * or horizontally, only that box&#x27;s employer font is
     * reduced. The other boxes remain at the normal size
     * unless they independently need to shrink as well.
     */
    function fitSharedEmployerFontSize() {
      const results =
        Array.from(
          document.querySelectorAll(
            &#x27;.result&#x27;
          )
        );

      const baseFontSize =
        window.matchMedia(
          &#x27;(max-width: 430px)&#x27;
        ).matches
          ? 12
          : 14;


      results.forEach(
        result =&gt; {
          const lines =
            Array.from(
              result.querySelectorAll(
                &#x27;.employer-line&#x27;
              )
            );


          if (
            !lines.length
          ) {
            return;
          }


          /*
           * Always begin this box at the normal responsive size.
           */
          lines.forEach(
            line =&gt; {
              line.style.fontSize =
                `${baseFontSize}px`;
            }
          );


          let boxFontSize =
            baseFontSize;


          /*
           * Horizontal limit:
           * if an employer name is too long for this particular
           * box, reduce this box only enough to keep it on one line.
           */
          lines.forEach(
            line =&gt; {
              if (
                line.clientWidth &lt;=
                  1 ||
                line.scrollWidth &lt;=
                  0
              ) {
                return;
              }


              const widthScale =
                line.clientWidth /
                line.scrollWidth;


              boxFontSize =
                Math.min(
                  boxFontSize,
                  baseFontSize *
                  widthScale
                );
            }
          );


          /*
           * Vertical limit:
           * a 40px box comfortably fits up to two employer
           * lines at 11px. If there are more lines, reduce
           * this box&#x27;s font only as much as necessary.
           */
          const styles =
            window.getComputedStyle(
              result
            );

          const paddingTop =
            parseFloat(
              styles.paddingTop
            ) || 0;

          const paddingBottom =
            parseFloat(
              styles.paddingBottom
            ) || 0;

          const gap =
            parseFloat(
              styles.rowGap ||
              styles.gap
            ) || 0;

          const computedLineHeight =
            parseFloat(
              window
                .getComputedStyle(
                  lines[0]
                )
                .lineHeight
            ) ||
            baseFontSize *
              1.2;

          const lineHeightRatio =
            computedLineHeight /
            baseFontSize;

          const availableHeight =
            Math.max(
              1,
              result.clientHeight -
              paddingTop -
              paddingBottom -
              gap *
              Math.max(
                0,
                lines.length -
                1
              )
            );

          const verticalFontLimit =
            availableHeight /
            (
              lines.length *
              lineHeightRatio
            );


          boxFontSize =
            Math.min(
              boxFontSize,
              verticalFontLimit
            );


          boxFontSize =
            Math.max(
              1,
              Math.floor(
                boxFontSize *
                10
              ) /
              10
            );


          lines.forEach(
            line =&gt; {
              line.style.fontSize =
                `${boxFontSize}px`;
            }
          );


          /*
           * Final small correction for browser rounding,
           * again affecting this box only.
           */
          const finalWidthScale =
            Math.min(
              1,
              ...lines.map(
                line =&gt; {
                  if (
                    line.clientWidth &lt;=
                      1 ||
                    line.scrollWidth &lt;=
                      0
                  ) {
                    return 1;
                  }


                  return (
                    line.clientWidth /
                    line.scrollWidth
                  );
                }
              )
            );


          if (
            finalWidthScale &lt;
            1
          ) {
            boxFontSize =
              Math.max(
                1,
                boxFontSize *
                finalWidthScale *
                0.995
              );


            lines.forEach(
              line =&gt; {
                line.style.fontSize =
                  `${boxFontSize}px`;
              }
            );
          }
        }
      );
    }
    let responsiveLayoutFrame =
      null;


    function refreshPodiumLayout() {
      if (
        responsiveLayoutFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveLayoutFrame
        );
      }


      responsiveLayoutFrame =
        requestAnimationFrame(
          () =&gt; {
            responsiveLayoutFrame =
              null;

            updatePodiumRowProportions();


            /*
             * Allow the new grid row proportions to be applied
             * before measuring the available line height.
             */
            requestAnimationFrame(
              fitSharedEmployerFontSize
            );
          }
        );
    }

    function getCellDisplayValue(
      cell
    ) {
      if (
        !cell
      ) {
        return &#x27;&#x27;;
      }


      return String(
        cell.f ??
        cell.v ??

    function loadGvizRange(
      range
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) =&gt; {
          const callbackName =
            `bestWorkplacesCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              &#x27;script&#x27;
            );

          const timeout =
            window.setTimeout(
              () =&gt; {
                cleanup();

                reject(
                  new Error(
                    &#x27;Could not load data&#x27;
                  )
                );
              },
              10000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response =&gt; {
            cleanup();


            if (
              response?.status ===
              &#x27;error&#x27;
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  &#x27;Could not load Google Sheet data&#x27;
                )
              );

              return;
            }


            resolve(
              response
            );
          };


          script.onerror =
            () =&gt; {
              cleanup();

              reject(
                new Error(
                  &#x27;Could not load data&#x27;
                )
              );
            };


          const params =
            new URLSearchParams({
              gid:
                SHEET_GID,

              range,

              headers:
                &#x27;0&#x27;,

              tqx:
                `responseHandler:${callbackName}`
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function loadCachedDashboard() {
      return new Promise(
        (
          resolve,
          reject
        ) =&gt; {
          if (
            !CACHE_WEB_APP_URL ||
            CACHE_WEB_APP_URL.includes(
              &#x27;PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE&#x27;
            )
          ) {
            reject(
              new Error(
                &#x27;The cached-data web app URL has not been configured&#x27;
              )
            );

            return;
          }


          const callbackName =
            `bestWorkplacesCacheCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              &#x27;script&#x27;
            );

          let settled =
            false;


          const timeout =
            window.setTimeout(
              () =&gt; {
                finish(
                  new Error(
                    &#x27;The cached-data request timed out&#x27;
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          function finish(
            error,
            response
          ) {
            if (
              settled
            ) {
              return;
            }


            settled =
              true;

            cleanup();


            if (
              error
            ) {
              reject(
                error
              );

              return;
            }


            resolve(
              response
            );
          }


          window[
            callbackName
          ] = response =&gt; {
            if (
              !response ||
              typeof response !==
                &#x27;object&#x27;
            ) {
              finish(
                new Error(
                  &#x27;The cached-data response was malformed&#x27;
                )
              );

              return;
            }


            finish(
              null,
              response
            );
          };


          script.onerror =
            () =&gt; {
              finish(
                new Error(
                  &#x27;Could not load the cached-data service&#x27;
                )
              );
            };


          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });


          const separator =
            CACHE_WEB_APP_URL.includes(
              &#x27;?&#x27;
            )
              ? &#x27;&amp;&#x27;
              : &#x27;?&#x27;;


          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function calculateMedian(
      values
    ) {
      const sorted =
        values
          .filter(
            Number.isFinite
          )
          .slice()
          .sort(
            (
              first,
              second
            ) =&gt;
              first -
              second
          );


      if (
        !sorted.length
      ) {
        return NaN;
      }


      const middle =
        Math.floor(
          sorted.length /
          2
        );


      if (
        sorted.length %
          2 ===
        1
      ) {
        return sorted[
          middle
        ];
      }


      return (
        sorted[
          middle - 1
        ] +
        sorted[
          middle
        ]
      ) /
      2;
    }


    function buildDashboardFromRawData(
      response
    ) {
      const rows =
        response
          ?.table
          ?.rows ||
        [];


      let totalResponses =
        0;


      const employerScores =
        new Map();


      rows.forEach(
        row =&gt; {
          const cells =
            row?.c ||
            [];


          const timestamp =
            getCellDisplayValue(
              cells[0]
            );


          /*
           * Equivalent to:
           * =COUNTA(A2:A)
           */
          if (
            timestamp !==
            &#x27;&#x27;
          ) {
            totalResponses++;
          }


          const employerName =
            getCellDisplayValue(
              cells[1]
            );


          const scoreText =
            getCellDisplayValue(
              cells[2]
            );


          if (
            !employerName ||
            scoreText ===
              &#x27;&#x27;
          ) {
            return;
          }


          const score =
            Number(
              scoreText
            );


          if (
            !Number.isFinite(
              score
            )
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          if (
            !employerScores.has(
              appearance.key
            )
          ) {
            employerScores.set(
              appearance.key,
              {
                fullName:
                  appearance.fullName,

                order:
                  appearance.order,

                scores:
                  []
              }
            );
          }


          employerScores
            .get(
              appearance.key
            )
            .scores
            .push(
              score
            );
        }
      );


      const employers =
        [
          ...employerScores.values()
        ]
          .map(
            employer =&gt; ({
              fullName:
                employer.fullName,

              order:
                employer.order,

              median:
                calculateMedian(
                  employer.scores
                )
            })
          )
          .filter(
            employer =&gt;
              Number.isFinite(
                employer.median
              )
          );


      const distinctMedians =
        [
          ...new Set(
            employers.map(
              employer =&gt;
                employer.median
            )
          )
        ]
          .sort(
            (
              first,
              second
            ) =&gt;
              second -
              first
          );


      function buildRankText(
        rankIndex
      ) {
        const targetMedian =
          distinctMedians[
            rankIndex
          ];


        if (
          !Number.isFinite(
            targetMedian
          )
        ) {
          return &#x27;&#x27;;
        }


        const matchingEmployers =
          employers
            .filter(
              employer =&gt;
                employer.median ===
                targetMedian
            )
            .sort(
              (
                first,
                second
              ) =&gt;
                first.order -
                  second.order ||
                first.fullName.localeCompare(
                  second.fullName
                )
            )
            .map(
              employer =&gt;
                employer.fullName
            );


        if (
          !matchingEmployers.length
        ) {
          return &#x27;&#x27;;
        }


        return (
          `#${rankIndex + 1} ` +
          matchingEmployers.join(
            EMPLOYER_SEPARATOR
          )
        );
      }


      return {
        responseCount:
          String(
            totalResponses
          ),

        gold:
          buildRankText(
            0
          ),

        silver:
          buildRankText(
            1
          ),

        bronze:
          buildRankText(
            2
          )
      };
    }

    function isUsableDashboardText(
      value
    ) {
      const text =
        String(
          value ??
          &#x27;&#x27;
        ).trim();


      return Boolean(
        text &amp;&amp;
        text !==
          &#x27;—&#x27;
      );
    }


    function validateDashboardData(
      data
    ) {
      const requiredFields = [
        &#x27;responseCount&#x27;,
        &#x27;gold&#x27;,
        &#x27;silver&#x27;,
        &#x27;bronze&#x27;
      ];


      const missingField =
        requiredFields.find(
          field =&gt;
            !isUsableDashboardText(
              data?.[
                field
              ]
            )
        );


      if (
        missingField
      ) {
        throw new Error(
          `Dashboard data is missing a usable ${missingField} value`
        );
      }


      return {
        responseCount:
          String(
            data.responseCount
          ).trim(),

        gold:
          String(
            data.gold
          ).trim(),

        silver:
          String(
            data.silver
          ).trim(),

        bronze:
          String(
            data.bronze
          ).trim()
      };
    }


    function normaliseCachedDashboard(
      response
    ) {
      if (
        response?.ok !==
        true
      ) {
        throw new Error(
          response?.error ||
          response?.message ||
          &#x27;The cached-data service did not return a snapshot&#x27;
        );
      }


      if (
        response.appKey !==
        CACHE_APP_KEY
      ) {
        throw new Error(
          &#x27;The cached-data response belongs to a different app&#x27;
        );
      }


      if (
        !response.cachedAt ||
        Number.isNaN(
          Date.parse(
            response.cachedAt
          )
        )
      ) {
        throw new Error(
          &#x27;The cached-data response has no valid timestamp&#x27;
        );
      }


      if (
        !Array.isArray(
          response.data?.rows
        ) ||
        !response.data.rows.length
      ) {
        throw new Error(
          &#x27;The cached-data response has no survey rows&#x27;
        );
      }


      const rawResponse = {
        table: {
          rows:
            response.data.rows.map(
              row =&gt; ({
                c: [
                  {
                    v:
                      row?.[0] ??
                      &#x27;&#x27;
                  },

                  {
                    v:
                      row?.[1] ??
                      &#x27;&#x27;
                  },

                  {
                    v:
                      row?.[2] ??
                      &#x27;&#x27;
                  }
                ]
              })
            )
        }
      };


      return validateDashboardData(
        buildDashboardFromRawData(
          rawResponse
        )
      );
    }


    function renderDashboard(
      data
    ) {
      status.hidden =
        true;

      status.textContent =
        &#x27;&#x27;;


      responseCount.textContent =
        data.responseCount ||
        &#x27;—&#x27;;

            );


          renderWorkplaceResult(

            ]
          );
        }
      );


      hideLoadingState();
    }

    async function loadDashboard() {
      let liveError =
        null;


      if (
        !FORCE_CACHED_DATA
      ) {
        try {
          const rawData =
            await loadGvizRange(
              RAW_DATA_RANGE
            );


          const liveDashboard =
            validateDashboardData(
              buildDashboardFromRawData(
                rawData
              )
            );


          setDataSource(
            &#x27;live&#x27;
          );


          renderDashboard(
            liveDashboard
          );

          return;
        } catch (
          error
        ) {
          liveError =
            error;


          console.warn(
            &#x27;Live Google Sheets data could not be used&#x27;,
            error
          );
        }
      } else {
        liveError =
          new Error(
            &#x27;Live data bypassed for cached-data test&#x27;
          );
      }


      try {
        const cachedResponse =
          await loadCachedDashboard();


        const cachedDashboard =
          normaliseCachedDashboard(
            cachedResponse
          );


        setDataSource(
          &#x27;cached&#x27;
        );


        renderDashboard(
          cachedDashboard
        );
      } catch (
        cachedError
      ) {
        console.error(
          &#x27;Live Google Sheets data error&#x27;,
          liveError
        );


        console.error(
          &#x27;Cached Apps Script data error&#x27;,
          cachedError

      if (

    function toPercentage(
      value

      const number =

      if (
        !Number.isFinite(

        return NaN;

      /*
       * Google Sheets percentage cells commonly return 0–1
       * even when displayed as 0%–100%.
       */
      return number &gt;= 0 &amp;&amp;
        number &lt;= 1
          ? number * 100
          : number;
    }
    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.max(
        minimum,
        Math.min(
          maximum,

        )
      );
    }


    function hexToRgba(
      hex,
      opacity
    ) {
      const cleaned =
        String(
          hex
        )
          .replace(
            &#x27;#&#x27;,
            &#x27;&#x27;
          )
          .trim();

      if (
        !/^[0-9a-f]{6}$/i.test(
          cleaned
        )
      ) {
        return (
          `rgba(119, 119, 119, ${opacity})`
        );
      }

      const red =
        parseInt(
          cleaned.slice(
            0,
            2
          ),
          16
        );

      const green =
        parseInt(
          cleaned.slice(
            2,
            4
          ),
          16
        );

      const blue =
        parseInt(
          cleaned.slice(
            4,
            6
          ),
          16
        );

      return (
        `rgba(${red}, ${green}, ${blue}, ${opacity})`
      );
    }


    function getBaseBubbleRadius(
      respondents
    ) {
      const calculated =
        BUBBLE_OFFSET +
        (
          Math.pow(
            respondents,
            BUBBLE_EXPONENT
          ) *
          BUBBLE_MULTIPLIER
        );

      return clamp(
        calculated,
        MIN_RADIUS,
        MAX_RADIUS
      );
    }


    function getDisplayedBubbleRadius(
      chart,
      raw
    ) {
      const baseRadius =
        Number(
          raw?.baseRadius
        );

      if (
        !Number.isFinite(
          baseRadius
        ) ||
        baseRadius &lt;= 0
      ) {
        return 0;
      }

      const chartWidth =
        Number(
          chart?.width
        );

      const chartHeight =
        Number(
          chart?.height
        );

      const safeChartWidth =
        Number.isFinite(
          chartWidth
        ) &amp;&amp;
        chartWidth &gt; 0
          ? chartWidth
          : 520;

      const safeChartHeight =
        Number.isFinite(
          chartHeight
        ) &amp;&amp;
        chartHeight &gt; 0
          ? chartHeight
          : 585;

      const widthScale =
        clamp(
          safeChartWidth / 520,
          0.72,
          1
        );

      const heightScale =
        clamp(
          safeChartHeight / 585,
          0.58,
          1
        );

      const responsiveScale =
        Math.min(
          widthScale,
          heightScale
        );

      return (
        baseRadius *
        responsiveScale
      );
    }

    function percentile(
      sortedValues,
      probability
    ) {
      if (
        !sortedValues.length
      ) {
        return NaN;
      }

      if (
        sortedValues.length ===
        1
      ) {
        return sortedValues[0];
      }

      const index =
        (
          sortedValues.length -
          1
        ) *
        probability;

      const lowerIndex =
        Math.floor(
          index
        );

      const upperIndex =
        Math.ceil(
          index
        );

      if (
        lowerIndex ===
        upperIndex
      ) {
        return sortedValues[
          lowerIndex
        ];
      }

      const fraction =
        index -
        lowerIndex;

      return (
        sortedValues[
          lowerIndex
        ] +
        (
          sortedValues[
            upperIndex
          ] -
          sortedValues[
            lowerIndex
          ]
        ) *
        fraction
      );
    }


    function calculateScoreStatistics(
      scores
    ) {
      const sorted =
        scores
          .filter(
            Number.isFinite
          )
          .slice()
          .sort(
            (
              first,
              second
            ) =&gt;
              first -
              second
          );

      return {
        count:
          sorted.length,

        median:
          percentile(
            sorted,
            0.50
          ),

        q1:
          percentile(
            sorted,
            0.25
          ),

        q3:
          percentile(
            sorted,
            0.75
          )
      };
    }


    function easeOutCubic(
      progress
    ) {
      return (
        1 -
        Math.pow(
          1 - progress,
          3
        )
      );
    }


    function easeInOutCubic(
      progress
    ) {
      return progress &lt; 0.5
        ? 4 *
          progress *
          progress *
          progress
        : 1 -
          Math.pow(
            -2 *
            progress +
            2,
            3
          ) /
          2;
    }


    function runAnimation({
      duration,
      easing,
      onFrame,
      onComplete
    }) {
      if (
        activeAnimationFrame
      ) {
        cancelAnimationFrame(
          activeAnimationFrame
        );
      }

      const reduceMotion =
        window.matchMedia(
          &#x27;(prefers-reduced-motion: reduce)&#x27;
        ).matches;

      if (
        reduceMotion ||
        duration &lt;= 0
      ) {
        onFrame(1);

        if (
          onComplete
        ) {
          onComplete();
        }

        return;
      }

      const startedAt =
        performance.now();


      function frame(
        now
      ) {
        const progress =
          Math.min(
            (
              now -
              startedAt
            ) /
            duration,
            1
          );

        const eased =
          easing(
            progress
          );

        onFrame(
          eased
        );

        if (
          progress &lt;
          1
        ) {
          activeAnimationFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          activeAnimationFrame =
            null;

          if (
            onComplete
          ) {
            onComplete();
          }
        }
      }


      activeAnimationFrame =
        requestAnimationFrame(
          frame
        );
    }

    function loadSheetQuery(
      query
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) =&gt; {
          const callbackName =
            &#x27;pffPromoterCallback_&#x27; +
            Date.now() +
            &#x27;_&#x27; +
            Math.floor(
              Math.random() *
              1000000
            );

          const script =
            document.createElement(
              &#x27;script&#x27;
            );

          const timeout =
            window.setTimeout(
              () =&gt; {
                cleanup();

                reject(
                  new Error(
                    &#x27;Could not load Google Sheet data&#x27;
                  )
                );
              },
              20000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response =&gt; {
            cleanup();

            if (
              !response ||
              response.status ===
                &#x27;error&#x27;
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  &#x27;Could not load Google Sheet data&#x27;
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          };


          script.onerror =
            () =&gt; {
              cleanup();

              reject(
                new Error(
                  &#x27;Network error loading Google Sheet data&#x27;
                )
              );
            };


          const params =
            new URLSearchParams({
              sheet:
                SHEET_NAME,

              headers:
                &#x27;1&#x27;,

              tq:
                query,

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(
                  Date.now()
                )
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
            params.toString();


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function loadCachedRawRows() {
      return new Promise(
        (
          resolve,
          reject
        ) =&gt; {
          if (
            !CACHE_WEB_APP_URL ||
            CACHE_WEB_APP_URL.includes(
              &#x27;PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE&#x27;
            )
          ) {
            reject(
              new Error(
                &#x27;The cached-data web app URL has not been configured&#x27;
              )
            );

            return;
          }


          const callbackName =
            &#x27;pffPromoterCacheCallback_&#x27; +
            Date.now() +
            &#x27;_&#x27; +
            Math.floor(
              Math.random() *
              1000000
            );

          const script =
            document.createElement(
              &#x27;script&#x27;
            );

          let settled =
            false;


          const timeout =
            window.setTimeout(
              () =&gt; {
                finish(
                  new Error(
                    &#x27;The cached-data request timed out&#x27;
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          function finish(
            error,
            response
          ) {
            if (
              settled
            ) {
              return;
            }

            settled =
              true;

            cleanup();

            if (
              error
            ) {
              reject(
                error
              );

              return;
            }

            resolve(
              response
            );
          }


          window[
            callbackName
          ] = response =&gt; {
            if (
              !response ||
              response.ok !==
                true
            ) {
              finish(
                new Error(
                  response?.message ||
                  &#x27;The cached-data service did not return a snapshot&#x27;
                )
              );

              return;
            }

            if (
              response.appKey !==
                &#x27;workplace-promoter-score-graph&#x27;
            ) {
              finish(
                new Error(
                  &#x27;The cached-data response belongs to a different app&#x27;
                )
              );

              return;
            }

            if (
              !response.cachedAt ||
              Number.isNaN(
                Date.parse(
                  response.cachedAt
                )
              )
            ) {
              finish(
                new Error(
                  &#x27;The cached-data response has no valid timestamp&#x27;
                )
              );

              return;
            }

            if (
              !Array.isArray(
                response.data?.rows
              ) ||
              !response.data.rows.length
            ) {
              finish(
                new Error(
                  &#x27;The cached-data response has no survey rows&#x27;
                )
              );

              return;
            }

            const rows =
              response.data.rows.map(
                row =&gt; ({
                  c: [
                    {
                      v:
                        row?.[0] ??
                        &#x27;&#x27;
                    },
                    {
                      v:
                        row?.[1] ??
                        &#x27;&#x27;
                    },
                    {
                      v:
                        row?.[2] ??
                        &#x27;&#x27;
                    },
                    {
                      v:
                        row?.[3] ??
                        &#x27;&#x27;
                    }
                  ]
                })
              );

            finish(
              null,
              rows
            );
          };


          script.onerror =
            () =&gt; {
              finish(
                new Error(
                  &#x27;Could not load the cached-data service&#x27;
                )
              );
            };


          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });


          const separator =
            CACHE_WEB_APP_URL.includes(
              &#x27;?&#x27;
            )
              ? &#x27;&amp;&#x27;
              : &#x27;?&#x27;;


          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;

          document.body
            .appendChild(
              script
            );
        }
      );
    }

    function normaliseFactorText(
      value
    ) {
      return String(
        value || &#x27;&#x27;
      )
        .toLowerCase()
        .normalize(
          &#x27;NFKD&#x27;
        )
        .replace(
          /[’‘]/g,
          &quot;&#x27;&quot;
        )
        .replace(
          /&amp;/g,
          &#x27; and &#x27;
        )
        .replace(
          /[^a-z0-9]+/g,
          &#x27; &#x27;
        )
        .trim()
        .replace(
          /\s+/g,
          &#x27; &#x27;
        );
    }


    function getFactorKey(
      value
    ) {
      const text =
        normaliseFactorText(
          value
        );


      if (
        !text ||
        text === &#x27;none&#x27; ||
        text === &#x27;nil&#x27; ||
        text === &#x27;no factors&#x27; ||
        text === &#x27;no factor&#x27; ||
        text === &#x27;nothing&#x27;
      ) {
        return null;
      }


      if (
        text.includes(
          &#x27;pay&#x27;
        ) ||
        text.includes(
          &#x27;bonus&#x27;
        ) ||
        text.includes(
          &#x27;remuneration&#x27;
        )
      ) {
        return &#x27;pay&#x27;;
      }


      if (
        text.includes(
          &#x27;work life&#x27;
        ) ||
        text.includes(
          &#x27;worklife&#x27;
        ) ||
        text.includes(
          &#x27;flexib&#x27;
        )
      ) {
        return &#x27;worklife&#x27;;
      }


      if (
        text.includes(
          &#x27;autonomy&#x27;
        ) ||
        text.includes(
          &#x27;professional growth&#x27;
        ) ||
        text.includes(
          &#x27;professional development&#x27;
        )
      ) {
        return &#x27;autonomy&#x27;;
      }


      if (
        text.includes(
          &#x27;support&#x27;
        ) ||
        (
          text.includes(
            &#x27;team&#x27;
          ) &amp;&amp;
          text.includes(
            &#x27;management&#x27;
          )
        )
      ) {
        return &#x27;support&#x27;;
      }


      if (
        text.includes(
          &#x27;staffing&#x27;
        ) ||
        text.includes(
          &#x27;workload&#x27;
        )
      ) {
        return &#x27;workload&#x27;;
      }


      if (
        text.includes(
          &#x27;equipment&#x27;
        ) ||
        text.includes(
          &#x27;technology&#x27;
        ) ||
        text === &#x27;tech&#x27;
      ) {
        return &#x27;tech&#x27;;
      }


      return null;
    }


    function getEndorsedFactorKeys(
      value
    ) {
      const factorKeys =
        new Set();

      const rawText =
        String(
          value || &#x27;&#x27;
        ).trim();


      if (
        !rawText
      ) {
        return factorKeys;
      }


      rawText
        .split(
          /[;,|\n]+/
        )
        .forEach(
          factor =&gt; {
            const factorKey =
              getFactorKey(
                factor
              );


            if (
              factorKey
            ) {
              factorKeys.add(
                factorKey
              );
            }
          }
        );


      /*
       * If a future response uses an unexpected separator, scan
       * the complete answer as a fallback. A Set ensures that one
       * response can endorse each factor only once.
       */
      if (
        !factorKeys.size
      ) {
        const wholeAnswerKey =
          getFactorKey(
            rawText
          );


        if (
          wholeAnswerKey
        ) {
          factorKeys.add(
            wholeAnswerKey
          );
        }
      }


      return factorKeys;
    }


    function normaliseRawRows(
      rows
    ) {
      const employerMap =
        new Map();


      rows.forEach(
        row =&gt; {
          const timestamp =
            getCellValue(

            );

          const employerName =
            String(
              getCellValue(
                row?.c?.[1]
              ) || &#x27;&#x27;
            ).trim();

          const score =
            toNumber(
              getCellValue(
                row?.c?.[2]
              )
            );

          const boostingFactors =
            getCellValue(
              row?.c?.[3]
            );


          if (
            !employerName ||
            !Number.isFinite(
              score
            ) ||
            score &lt; 0 ||
            score &gt; 10
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          if (
            !employerMap.has(
              appearance.key
            )
          ) {
            employerMap.set(
              appearance.key,
              {
                canonicalKey:
                  appearance.key,

                sourceName:
                  employerName,

                label:
                  appearance.label,

                fullName:
                  appearance.fullName,

                colour:
                  appearance.colour,

                scores:
                  [],

                timestamps:
                  [],

                factorCounts: {
                  pay:
                    0,

                  worklife:
                    0,

                  autonomy:
                    0,

                  support:
                    0,

                  workload:
                    0,

                  tech:
                    0
                }
              }
            );
          }


          const employer =
            employerMap.get(
              appearance.key
            );


          employer.scores.push(
            score
          );

          employer.timestamps.push(
            timestamp
          );


          getEndorsedFactorKeys(
            boostingFactors
          ).forEach(
            factorKey =&gt; {
              employer.factorCounts[
                factorKey
              ] +=
                1;
            }
          );
        }
      );


      employerMap.forEach(

          employer.statistics =
            calculateScoreStatistics(
              employer.scores

      );


      return employerMap;

    function buildEndorsementItemsFromRawData(
      employerMap,
      factorKey
    ) {
      return [
        ...employerMap.values()
      ]
        .map(
          employer =&gt; {
            const respondents =
              employer.statistics
                ?.count ??
              0;

            const endorsements =

              0;

            const percentage =
              respondents &gt; 0
                ? (
                    endorsements /
                    respondents
                  ) *
                  100

            return {
              canonicalKey:
                employer.canonicalKey,

              sourceName:
                employer.sourceName,

              score:
                percentage,

              respondents,

              label:
                employer.label,

              fullName:
                employer.fullName,

              colour:
                employer.colour
            };
          }
        )
        .filter(
          item =&gt;
            Number.isFinite(
              item.score
            ) &amp;&amp;
            item.score &gt;= 0 &amp;&amp;
            item.score &lt;= 100 &amp;&amp;
            Number.isFinite(
              item.respondents
            ) &amp;&amp;
            item.respondents &gt; 0
        );
