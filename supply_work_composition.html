<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Country of Qualification Trends</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --purple:#6600ff; --ink:#151515; --muted:#69718a; --track:#e8eaf0;
      --error:#b42318; --live-red:#e53935; --cached-amber:#c27c00;
      --blue-cone:rgba(74,86,255,.82); --green-cone:rgba(36,210,116,.78);
      --red-cone:rgba(255,92,48,.76); --motion-ease:cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing:border-box; }
    html,body {
      width:100%; height:100%; min-height:0; margin:0; padding:0; overflow:hidden;
      background:#fff; -webkit-tap-highlight-color:transparent;
    }
    body {
      color:var(--ink); font-family:'Lato',sans-serif; -webkit-touch-callout:none;
    }
    button { font:inherit; -webkit-tap-highlight-color:transparent; }
    #fit {
      display:flex; width:100%; height:100%; min-height:0; align-items:flex-start;
      justify-content:center; overflow:hidden;
    }
    #app {
      position:relative; display:flex; flex-direction:column;
      width:min(calc(100% - 12px),520px); height:100%; max-width:100%;
      min-width:0; min-height:0; margin-inline:auto; padding:7px 6px 0;
      overflow:hidden; background:#fff;
    }
    #app.is-loading > :not(.app-loading) { visibility:hidden; }
    #app:not(.is-loading) .app-loading { display:none; }
    .app-loading {
      position:absolute; inset:0; z-index:100; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:#fff;
    }
    .cone-loader { position:relative; width:176px; height:78px; overflow:visible; isolation:isolate; }
    .cone {
      position:absolute; bottom:8px; width:58px; height:68px; opacity:0;
      clip-path:polygon(50% 0%,100% 100%,0% 100%);
      -webkit-clip-path:polygon(50% 0%,100% 100%,0% 100%);
    }
    .cone.blue { left:33px; background:var(--blue-cone); animation:blueCone 2.7s infinite cubic-bezier(.45,0,.25,1); }
    .cone.green { left:69px; background:var(--green-cone); animation:greenCone 2.7s infinite cubic-bezier(.45,0,.25,1); }
    .cone.red { left:85px; background:var(--red-cone); animation:redCone 2.7s infinite cubic-bezier(.45,0,.25,1); }
    .loader-text {
      margin:2px 0 0; color:var(--muted); font-size:11px; line-height:1.35;
      animation:loaderPulse 2.7s infinite cubic-bezier(.45,0,.25,1);
    }
    @keyframes blueCone { 0%{opacity:0} 12%,76%{opacity:1} 87%,100%{opacity:0} }
    @keyframes greenCone { 0%,20%{opacity:0} 32%,76%{opacity:1} 87%,100%{opacity:0} }
    @keyframes redCone { 0%,40%{opacity:0} 52%,76%{opacity:1} 87%,100%{opacity:0} }
    @keyframes loaderPulse { 0%,87%,100%{opacity:.45} 52%,76%{opacity:.78} }

    .module-top {
      display:flex; width:100%; min-width:0; flex:0 0 auto; align-items:flex-end;
      justify-content:space-between; gap:10px; margin:0 0 4px;
      border-bottom:1px solid var(--track);
    }
    .module-title {
      position:relative; min-height:29px; margin:0; padding:0 9px 6px;
      color:var(--purple); font-size:13px; font-weight:700; line-height:1;
      white-space:nowrap;
    }
    .module-title::after {
      content:''; position:absolute; right:0; bottom:0; left:0; height:2px;
      background:var(--purple);
    }
    .live-data {
      display:inline-flex; flex:0 0 auto; align-items:center; gap:4px;
      margin:0 1px 8px 0; color:var(--muted); font-size:9px; font-weight:700;
      letter-spacing:.05em; line-height:1; white-space:nowrap;
    }
    .live-data-dot { width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:var(--live-red); }
    .live-data.is-cached .live-data-dot { background:var(--cached-amber); }
    #status { margin:3px 0 0; color:var(--error); font-size:12px; line-height:1.35; }
    #status:empty { display:none; }

    .chart-heading-row {
      position:relative; z-index:35; display:flex; width:100%; min-width:0;
      min-height:31px; flex:0 0 auto; align-items:flex-start;
      justify-content:space-between; gap:7px; margin:0;
    }
    .chart-heading {
      min-width:0; flex:1 1 auto; margin:0; padding:4px 0 0; overflow:hidden;
      color:var(--ink); font-size:15px; font-weight:700; line-height:22px;
      text-overflow:ellipsis; white-space:nowrap;
    }
    .chart-heading-fixed,.chart-heading-detail { display:inline-block; }
    .chart-heading-detail { will-change:opacity; }

    .metric-switch {
      position:relative; display:grid; width:92px; height:27px; flex:0 0 92px;
      grid-template-columns:repeat(2,minmax(0,1fr)); align-items:center;
      margin-top:2px; padding:1px; overflow:hidden;
      background:rgba(232,234,240,.55); border-radius:4px; isolation:isolate;
    }
    .metric-switch::before {
      content:''; position:absolute; top:1px; bottom:1px; left:1px; z-index:0;
      width:calc((100% - 2px)/2); background:#fff; border-radius:3px;
      box-shadow:0 1px 3px rgba(21,21,21,.08);
      transform:translateX(0); transition:transform 300ms var(--motion-ease);
    }
    .metric-switch.is-percent-selected::before { transform:translateX(100%); }
    .metric-button {
      position:relative; z-index:1; min-width:0; min-height:25px; padding:0 4px;
      color:var(--muted); background:transparent; border:0; border-radius:3px;
      font-size:9px; font-weight:700; line-height:1; cursor:pointer;
      transition:color 220ms ease;
    }
    .metric-button.is-active { color:var(--purple); }
    .metric-button:focus-visible { outline:2px solid rgba(102,0,255,.22); outline-offset:-1px; }

    .chart-options-row {
      display:flex; width:100%; min-width:0; min-height:28px; flex:0 0 auto;
      align-items:center; padding:0 0 2px;
    }
    .legend-nav { position:relative; flex:1 1 auto; min-width:54px; height:28px; overflow:hidden; }
    .legend-viewport { width:100%; height:100%; overflow:hidden; }
    .chart-legend {
      display:flex; width:100%; min-width:0; min-height:28px; align-items:center;
      gap:10px; padding:1px 0 4px; overflow-x:auto; overflow-y:hidden;
      scroll-behavior:smooth; scrollbar-width:none; white-space:nowrap;
    }
    .chart-legend::-webkit-scrollbar { display:none; }
    .legend-scroll-button {
      position:absolute; top:3px; z-index:3; display:inline-flex; width:20px;
      height:20px; align-items:center; justify-content:center; padding:0 0 2px;
      color:var(--muted); background:rgba(255,255,255,.92); border:0;
      border-radius:50%; font-size:18px; font-weight:700; line-height:1;
      cursor:pointer; opacity:.72; transition:opacity 160ms ease;
    }
    .legend-scroll-button:hover { opacity:1; }
    .legend-scroll-button.is-hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .legend-scroll-left { left:0; } .legend-scroll-right { right:0; }
    .legend-item {
      display:inline-flex; flex:0 0 auto; align-items:center; gap:5px; padding:0;
      color:var(--muted); background:transparent; border:0; font-size:10px;
      font-weight:700; line-height:1; cursor:pointer; opacity:1;
      transition:opacity 160ms ease;
    }
    .legend-item.is-hidden-series { opacity:.36; }
    .legend-line { width:17px; height:3px; flex:0 0 17px; border-radius:2px; }

    .chart-shell {
      position:relative; flex:1 1 0; width:100%; min-width:0; min-height:0;
      margin:-2px 0 0; overflow:hidden; contain:layout paint; isolation:isolate;
      -webkit-user-select:none; user-select:none;
    }
    #countryChart {
      position:absolute; inset:0; display:block; width:100%!important;
      height:100%!important; touch-action:manipulation; outline:none;
      -webkit-user-select:none; user-select:none;
    }

    @media (max-width:430px) {
      #app { width:calc(100% - 6px); padding:6px 2px 0; }
      .module-title { padding-right:7px; padding-left:7px; font-size:12px; }
      .live-data { margin-right:3px; font-size:8px; }
      .chart-heading { font-size:14px; }
      .metric-switch { width:86px; flex-basis:86px; }
      .metric-button { padding-right:3px; padding-left:3px; font-size:8.5px; }
      .legend-item { font-size:9px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        scroll-behavior:auto!important; animation-duration:.01ms!important;
        animation-iteration-count:1!important; transition-duration:.01ms!important;
      }
    }
  </style>
</head>
<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div class="app-loading" role="status" aria-label="Loading country of qualification data">
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span><span class="cone green"></span><span class="cone red"></span>
        </div>
        <p class="loader-text">Loading country of qualification data…</p>
      </div>

      <div class="module-top">
        <div class="module-title">Country</div>
        <div id="sourceIndicator" class="live-data" aria-live="polite">
          <span class="live-data-dot" aria-hidden="true"></span><span id="sourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 class="chart-heading">
          <span class="chart-heading-fixed">Country of qualification</span> <span id="headingDetail" class="chart-heading-detail"></span>
        </h2>
        <div id="metricSwitch" class="metric-switch" role="group" aria-label="Country of qualification display">
          <button type="button" class="metric-button is-active" data-metric="count" aria-pressed="true">Count</button>
          <button type="button" class="metric-button" data-metric="percent" aria-pressed="false">%</button>
        </div>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <div class="legend-viewport"><div id="legend" class="chart-legend" aria-label="Chart legend"></div></div>
          <button id="legendLeft" class="legend-scroll-button legend-scroll-left is-hidden" type="button" aria-label="Scroll legend left">‹</button>
          <button id="legendRight" class="legend-scroll-button legend-scroll-right is-hidden" type="button" aria-label="Scroll legend right">›</button>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas id="countryChart" aria-label="Australian optometrist country of qualification trends" role="img"></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    Chart.defaults.font.family="'Lato', sans-serif";
    Chart.defaults.color='#151515';

    const SHEET_ID='1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';
    const SHEET_NAME='Miscellaneous';
    const DATA_RANGE='U31:AE';
    const CACHE_KEY='pff-country-qualification-trends-v1';
    const TIMEOUT=15000;

    const LABELS=['AUS','NZ','Other','Not stated'];
    const COLOURS=['#0b5d1e','#151515','#ff7f0e','#b9b9b9'];

    const EMBEDDED=[
      {year:2013,count:[3278,226,348,171],percent:[81.48148148,5.617698235,8.650260999,4.250559284]},
      {year:2014,count:[3381,242,379,122],percent:[81.98351115,5.868089234,9.190106693,2.958292919]},
      {year:2015,count:[3520,251,391,187],percent:[80.9381467,5.771441711,8.990572545,4.299839043]},
      {year:2016,count:[3739,275,388,109],percent:[82.88627799,6.096209266,8.601197074,2.416315673]},
      {year:2017,count:[3861,270,385,93],percent:[83.77088305,5.85810371,8.353221957,2.017791278]},
      {year:2018,count:[3999,288,387,142],percent:[83.03571429,5.980066445,8.035714286,2.948504983]},
      {year:2019,count:[4216,298,384,187],percent:[82.91052114,5.860373648,7.551622419,3.677482793]},
      {year:2020,count:[4329,297,366,178],percent:[83.73307544,5.744680851,7.079303675,3.442940039]},
      {year:2021,count:[4521,290,381,185],percent:[84.0803422,5.393342012,7.08573554,3.440580249]},
      {year:2022,count:[4793,293,357,271],percent:[83.88169408,5.127756388,6.247812391,4.742737137]},
      {year:2023,count:[5033,308,369,269],percent:[84.17795618,5.151363104,6.171600602,4.499080114]},
      {year:2024,count:[5221,324,370,295],percent:[84.07407407,5.217391304,5.958132045,4.750402576]}
    ];

    const app=document.getElementById('app');
    const statusEl=document.getElementById('status');
    const switchEl=document.getElementById('metricSwitch');
    const buttons=[...document.querySelectorAll('.metric-button')];
    const headingDetail=document.getElementById('headingDetail');
    const legend=document.getElementById('legend');
    const legendLeft=document.getElementById('legendLeft');
    const legendRight=document.getElementById('legendRight');
    const sourceIndicator=document.getElementById('sourceIndicator');
    const sourceText=document.getElementById('sourceText');
    const chartShell=document.getElementById('chartShell');
    const canvas=document.getElementById('countryChart');

    let rows=[], chart=null, metric='count', lastConfig=null, resizeFrame=null;
    const hidden=new Set();

    const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
    const easeOutCubic=v=>1-Math.pow(1-clamp(v,0,1),3);
    const num=c=>{
      if(!c||c.v===null||c.v===undefined||c.v==='') return NaN;
      const v=Number(c.v); return Number.isFinite(v)?v:NaN;
    };

    function normalise(source){
      const map=new Map();
      (source||[]).forEach(r=>{
        const year=Math.round(Number(r?.year));
        if(!Number.isFinite(year)) return;
        const fix=a=>Array.from({length:4},(_,i)=>{
          const v=Number(a?.[i]); return Number.isFinite(v)?v:null;
        });
        const record={year,count:fix(r.count),percent:fix(r.percent)};
        if([...record.count,...record.percent].some(Number.isFinite)) map.set(year,record);
      });
      return [...map.values()].sort((a,b)=>a.year-b.year);
    }

    function niceStep(v){
      if(!Number.isFinite(v)||v<=0) return 1;
      const e=Math.floor(Math.log10(v)), m=10**e, f=v/m;
      const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;
      return n*m;
    }

    function countScale(){
      const max=Math.max(0,...rows.flatMap(r=>r.count.filter(Number.isFinite)));
      const step=niceStep(max/4);
      return {min:0,max:step*4,step,intervals:4};
    }

    function config(){
      return metric==='percent'
        ? {metric:'percent',detail:'(%)',yTitle:'% of all countries',
           scale:{min:0,max:100,step:25,intervals:4},axisDecimals:0,tipDecimals:1,suffix:'%'}
        : {metric:'count',detail:'',yTitle:'Optometrists',
           scale:countScale(),axisDecimals:0,tipDecimals:0,suffix:''};
    }

    const valuesFor=(row,cfg)=>cfg.metric==='percent'?row.percent:row.count;
    const sameScale=(a,b)=>!!a&&!!b&&a.min===b.min&&a.max===b.max&&a.step===b.step&&a.intervals===b.intervals;
    const ticksFor=cfg=>Array.from({length:cfg.scale.intervals+1},(_,i)=>cfg.scale.min+cfg.scale.step*i);

    function formatAxis(v,cfg){
      if(!Number.isFinite(v)) return '';
      return new Intl.NumberFormat('en-AU',{
        minimumFractionDigits:cfg.axisDecimals, maximumFractionDigits:cfg.axisDecimals
      }).format(v);
    }
    function formatTip(v,cfg){
      if(!Number.isFinite(v)) return '—';
      return new Intl.NumberFormat('en-AU',{
        minimumFractionDigits:cfg.tipDecimals, maximumFractionDigits:cfg.tipDecimals
      }).format(v)+(cfg.suffix||'');
    }

    function loadGViz(sheet,range){
      return new Promise((resolve,reject)=>{
        const cb=`__pff_gviz_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script=document.createElement('script');
        let done=false;
        const cleanup=()=>{
          if(script.parentNode) script.parentNode.removeChild(script);
          try{delete window[cb]}catch(_){window[cb]=undefined}
        };
        const timer=setTimeout(()=>{
          if(done)return; done=true; cleanup(); reject(new Error(`Timed out loading ${sheet}.`));
        },TIMEOUT);
        window[cb]=response=>{
          if(done)return; done=true; clearTimeout(timer); cleanup();
          if(!response||response.status==='error'){
            reject(new Error(response?.errors?.[0]?.detailed_message||response?.errors?.[0]?.message||`Could not load ${sheet}.`));
            return;
          }
          resolve(response.table);
        };
        script.onerror=()=>{
          if(done)return; done=true; clearTimeout(timer); cleanup();
          reject(new Error(`Could not connect to ${sheet}.`));
        };
        const params=new URLSearchParams({sheet,range,headers:'1',tqx:`out:json;responseHandler:${cb}`});
        script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;
        script.async=true; document.head.appendChild(script);
      });
    }

    function parseTable(table){
      const out=[];
      (table?.rows||[]).forEach(r=>{
        const c=r?.c||[], y1=num(c[0]), y2=num(c[6]);
        const year=Number.isFinite(y1)?Math.round(y1):Number.isFinite(y2)?Math.round(y2):NaN;
        if(!Number.isFinite(year)) return;
        out.push({
          year,
          count:[num(c[1]),num(c[2]),num(c[3]),num(c[4])],
          percent:[num(c[7]),num(c[8]),num(c[9]),num(c[10])]
        });
      });
      return normalise(out);
    }

    function saveCache(data){
      try{localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),rows:data}))}catch(_){}
    }
    function readCache(){
      try{
        const raw=localStorage.getItem(CACHE_KEY);
        return raw?normalise(JSON.parse(raw)?.rows||[]):[];
      }catch(_){return[]}
    }
    function setSource(kind){
      const cached=kind!=='live';
      sourceIndicator.classList.toggle('is-cached',cached);
      sourceText.textContent=cached?'CACHED data':'LIVE data';
    }
    async function loadData(){
      try{
        const table=await loadGViz(SHEET_NAME,DATA_RANGE);
        const live=parseTable(table);
        if(!live.length) throw new Error('No usable live rows.');
        rows=live; saveCache(rows); setSource('live');
      }catch(_){
        const cached=readCache();
        rows=cached.length?cached:normalise(EMBEDDED);
        setSource(cached.length?'cached':'embedded');
      }
    }

    const tickAnim={values:[],token:0,raf:null};
    function setTicksNow(cfg=config()){tickAnim.values=ticksFor(cfg)}
    function animateTicks(targets,duration){
      if(tickAnim.raf) cancelAnimationFrame(tickAnim.raf);
      const token=++tickAnim.token, from=[...tickAnim.values];
      const start=targets.map((_,i)=>Number.isFinite(from[i])?from[i]:targets[i]);
      if(reduceMotion()||duration<=0){tickAnim.values=[...targets]; chart?.draw(); return}
      const t0=performance.now();
      const frame=now=>{
        if(token!==tickAnim.token)return;
        const p=clamp((now-t0)/duration,0,1), e=easeOutCubic(p);
        tickAnim.values=targets.map((v,i)=>start[i]+(v-start[i])*e);
        chart?.draw();
        if(p<1) tickAnim.raf=requestAnimationFrame(frame);
        else {tickAnim.raf=null; tickAnim.values=[...targets]; chart?.draw()}
      };
      tickAnim.raf=requestAnimationFrame(frame);
    }

    const titleAnim={from:'',to:'',progress:1,token:0,raf:null};
    function setTitleNow(text){titleAnim.from=titleAnim.to=String(text||''); titleAnim.progress=1}
    function animateTitle(text,duration=420){
      const target=String(text||''), current=titleAnim.progress<.5?titleAnim.from:titleAnim.to;
      if(current===target){setTitleNow(target);return}
      if(titleAnim.raf) cancelAnimationFrame(titleAnim.raf);
      const token=++titleAnim.token; titleAnim.from=current; titleAnim.to=target; titleAnim.progress=0;
      if(reduceMotion()||duration<=0){setTitleNow(target);chart?.draw();return}
      const t0=performance.now();
      const frame=now=>{
        if(token!==titleAnim.token)return;
        const p=clamp((now-t0)/duration,0,1); titleAnim.progress=easeOutCubic(p); chart?.draw();
        if(p<1) titleAnim.raf=requestAnimationFrame(frame);
        else {titleAnim.raf=null;setTitleNow(target);chart?.draw()}
      };
      titleAnim.raf=requestAnimationFrame(frame);
    }

    let textToken=0;
    function fadeDetail(text){
      const target=String(text||'');
      if(headingDetail.textContent===target)return;
      const token=++textToken;
      if(reduceMotion()||!headingDetail.animate){headingDetail.textContent=target;return}
      const out=headingDetail.animate([{opacity:1},{opacity:0}],{
        duration:150,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'
      });
      out.finished.then(()=>{
        if(token!==textToken)return;
        headingDetail.textContent=target;
        return headingDetail.animate([{opacity:0},{opacity:1}],{
          duration:240,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'
        }).finished;
      }).catch(()=>{headingDetail.textContent=target});
    }

    function legendArrows(){
      const max=Math.max(0,legend.scrollWidth-legend.clientWidth), tol=2;
      legendLeft.classList.toggle('is-hidden',legend.scrollLeft<=tol);
      legendRight.classList.toggle('is-hidden',legend.scrollLeft>=max-tol);
    }
    function renderLegend(){
      legend.innerHTML='';
      LABELS.forEach((label,i)=>{
        const b=document.createElement('button');
        b.type='button'; b.className='legend-item';
        b.classList.toggle('is-hidden-series',hidden.has(i));
        b.setAttribute('aria-pressed',String(!hidden.has(i)));
        const sw=document.createElement('span'); sw.className='legend-line'; sw.style.background=COLOURS[i];
        const tx=document.createElement('span'); tx.textContent=label;
        b.append(sw,tx);
        b.addEventListener('click',()=>{
          hidden.has(i)?hidden.delete(i):hidden.add(i);
          b.classList.toggle('is-hidden-series',hidden.has(i));
          b.setAttribute('aria-pressed',String(!hidden.has(i)));
          if(chart){chart.setDatasetVisibility(i,!hidden.has(i));chart.update('none')}
        });
        legend.appendChild(b);
      });
      requestAnimationFrame(legendArrows);
    }
    legendLeft.onclick=e=>{e.stopPropagation();legend.scrollBy({left:-Math.max(110,legend.clientWidth*.72),behavior:'smooth'})};
    legendRight.onclick=e=>{e.stopPropagation();legend.scrollBy({left:Math.max(110,legend.clientWidth*.72),behavior:'smooth'})};
    legend.addEventListener('scroll',legendArrows,{passive:true});

    function dataset(i,cfg){
      const colour=COLOURS[i];
      return {
        label:LABELS[i], _seriesLabel:LABELS[i],
        data:rows.map(r=>{const v=Number(valuesFor(r,cfg)[i]);return Number.isFinite(v)?v:null}),
        borderColor:colour, backgroundColor:colour, borderWidth:3, fill:false,
        pointRadius:0, pointHoverRadius:4, pointHitRadius:10,
        pointBackgroundColor:colour, pointBorderColor:'#fff', pointBorderWidth:1,
        tension:.28, cubicInterpolationMode:'monotone', spanGaps:false
      };
    }
    const buildDatasets=cfg=>LABELS.map((_,i)=>dataset(i,cfg));
    function syncDatasets(cfg){
      buildDatasets(cfg).forEach((n,i)=>{
        const d=chart.data.datasets[i];
        d.label=n.label; d._seriesLabel=n._seriesLabel; d.data=n.data;
        d.borderColor=n.borderColor; d.backgroundColor=n.backgroundColor;
        d.pointBackgroundColor=n.pointBackgroundColor; d.pointBorderColor=n.pointBorderColor;
        d.pointBorderWidth=n.pointBorderWidth; d.pointHoverRadius=n.pointHoverRadius;
        d.pointHitRadius=n.pointHitRadius; d.borderWidth=n.borderWidth;
        d.tension=n.tension; d.cubicInterpolationMode=n.cubicInterpolationMode; d.spanGaps=false; d.fill=false;
      });
    }

    function drawYTitle(ctx,area){
      const mobile=innerWidth<=430, p=clamp(titleAnim.progress,0,1);
      const out=clamp(1-p*2.2,0,1), inc=clamp((p-.32)/.68,0,1);
      const x=area.left-(mobile?48:54), y=area.top+area.height/2;
      const draw=(text,alpha)=>{
        if(!text||alpha<=0)return;
        ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(-Math.PI/2);
        ctx.fillStyle='#151515';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.font=`700 ${mobile?12:13}px Lato, sans-serif`;ctx.fillText(text,0,0);ctx.restore();
      };
      if(titleAnim.from===titleAnim.to||p>=1) draw(titleAnim.to,1);
      else {draw(titleAnim.from,out);draw(titleAnim.to,inc)}
    }

    const axesPlugin={
      id:'pffCountryAxes',
      beforeDatasetsDraw(c){
        const {ctx,chartArea:a}=c;if(!a)return;
        const cfg=config(), n=cfg.scale.intervals;ctx.save();
        ctx.strokeStyle='rgba(105,113,138,.035)';ctx.lineWidth=.7;
        for(let i=0;i<n;i++){
          const y=a.bottom-a.height*((i+.5)/n);
          ctx.beginPath();ctx.moveTo(a.left,Math.round(y)+.5);ctx.lineTo(a.right,Math.round(y)+.5);ctx.stroke();
        }
        ctx.strokeStyle='rgba(105,113,138,.075)';ctx.lineWidth=1;
        for(let i=0;i<=n;i++){
          const y=a.bottom-a.height*(i/n);
          ctx.beginPath();ctx.moveTo(a.left,Math.round(y)+.5);ctx.lineTo(a.right,Math.round(y)+.5);ctx.stroke();
        }
        ctx.restore();
      },
      afterDraw(c){
        const {ctx,chartArea:a,scales}=c, xScale=scales?.x;if(!a||!xScale)return;
        const cfg=config(), n=cfg.scale.intervals, mobile=innerWidth<=430;
        const vals=tickAnim.values.length===n+1?tickAnim.values:ticksFor(cfg);
        ctx.save();ctx.lineCap='butt';ctx.strokeStyle='#151515';ctx.lineWidth=1;
        ctx.fillStyle='#151515';ctx.textAlign='right';ctx.textBaseline='middle';
        ctx.font=`${mobile?9:10}px Lato, sans-serif`;
        for(let i=0;i<=n;i++){
          const y=a.bottom-a.height*(i/n);
          ctx.beginPath();ctx.moveTo(a.left,Math.round(y)+.5);ctx.lineTo(a.left-5,Math.round(y)+.5);ctx.stroke();
          ctx.fillText(formatAxis(Number(vals[i]),cfg),a.left-8,y);
        }
        ctx.strokeStyle='#69718a';ctx.globalAlpha=.6;ctx.lineWidth=1;
        for(let i=0;i<n;i++){
          const y=a.bottom-a.height*((i+.5)/n);
          ctx.beginPath();ctx.moveTo(a.left,Math.round(y)+.5);ctx.lineTo(a.left-2,Math.round(y)+.5);ctx.stroke();
        }
        ctx.globalAlpha=1;
        rows.forEach((r,i)=>{
          const x=xScale.getPixelForTick(i);if(!Number.isFinite(x))return;
          const major=r.year%2===0;
          ctx.strokeStyle=major?'#151515':'#69718a';ctx.globalAlpha=major?1:.6;ctx.lineWidth=major?1:.7;
          ctx.beginPath();ctx.moveTo(Math.round(x)+.5,a.bottom);ctx.lineTo(Math.round(x)+.5,a.bottom+(major?5:2));ctx.stroke();
        });
        ctx.restore();drawYTitle(ctx,a);
      }
    };
    const spinesPlugin={
      id:'pffCountrySpines',
      afterDraw(c){
        const {ctx,chartArea:a}=c;if(!a)return;
        ctx.save();ctx.strokeStyle='#151515';ctx.lineWidth=1.1;
        ctx.beginPath();ctx.moveTo(Math.round(a.left)+.5,a.top);ctx.lineTo(Math.round(a.left)+.5,a.bottom);ctx.stroke();
        ctx.beginPath();ctx.moveTo(a.left,Math.round(a.bottom)+.5);ctx.lineTo(a.right,Math.round(a.bottom)+.5);ctx.stroke();
        ctx.restore();
      }
    };
    Chart.register(axesPlugin,spinesPlugin);

    function options(cfg){
      const mobile=innerWidth<=430;
      return {
        responsive:true, maintainAspectRatio:false, resizeDelay:0,
        devicePixelRatio:Math.min(devicePixelRatio||1,2),
        animation:{duration:760,easing:'easeOutQuart'},
        animations:{
          x:{duration:760,easing:'easeOutQuart'},
          y:{duration:760,easing:'easeOutQuart'},
          colors:{type:'color',properties:['borderColor','backgroundColor','pointBackgroundColor'],duration:760,easing:'easeOutQuart'}
        },
        transitions:{active:{animation:{duration:180}}},
        interaction:{mode:'nearest',intersect:false,axis:'xy'},
        layout:{autoPadding:true,padding:{top:mobile?8:9,right:3,bottom:0,left:0}},
        plugins:{
          legend:{display:false},
          tooltip:{
            displayColors:true,backgroundColor:'rgba(21,21,21,.94)',titleColor:'#fff',bodyColor:'#fff',
            borderColor:'rgba(255,255,255,.10)',borderWidth:1,padding:9,cornerRadius:4,
            titleFont:{family:'Lato',size:11,weight:'700'},bodyFont:{family:'Lato',size:11,weight:'400'},
            callbacks:{
              title:items=>items?.length?String(items[0].label):'',
              label:ctx=>`${ctx.dataset._seriesLabel}: ${formatTip(Number(ctx.raw),config())}`
            }
          }
        },
        scales:{
          x:{
            type:'category',offset:false,grid:{drawOnChartArea:false,drawTicks:false},border:{display:false},
            ticks:{
              color:'#151515',padding:7,maxRotation:0,minRotation:0,autoSkip:false,
              font:{family:'Lato',size:mobile?9:10,weight:'400'},
              callback:(v,i)=>Number(rows[i]?.year)%2===0?String(rows[i].year):''
            },
            title:{display:true,text:'Year',color:'#151515',padding:{top:3},font:{family:'Lato',size:mobile?12:13,weight:'700'}}
          },
          y:{
            min:cfg.scale.min,max:cfg.scale.max,
            afterFit:s=>{s.width=mobile?58:64},
            grid:{display:false,drawTicks:false},border:{display:false},
            ticks:{display:false,stepSize:cfg.scale.step,maxTicksLimit:cfg.scale.intervals+1},
            title:{display:false}
          }
        }
      };
    }

    function createChart(cfg){
      setTicksNow(cfg);setTitleNow(cfg.yTitle);headingDetail.textContent=cfg.detail;
      chart=new Chart(canvas.getContext('2d'),{
        type:'line',
        data:{labels:rows.map(r=>String(r.year)),datasets:buildDatasets(cfg)},
        options:options(cfg)
      });
      LABELS.forEach((_,i)=>chart.setDatasetVisibility(i,!hidden.has(i)));
      renderLegend();
      lastConfig={detail:cfg.detail,yTitle:cfg.yTitle,scale:{...cfg.scale}};
    }

    function syncScale(cfg){
      const y=chart.options.scales.y;
      y.min=cfg.scale.min;y.max=cfg.scale.max;y.ticks.stepSize=cfg.scale.step;y.ticks.maxTicksLimit=cfg.scale.intervals+1;
    }

    function updateChart(){
      const cfg=config(), prev=lastConfig;
      if(!chart){createChart(cfg);return}
      chart.tooltip.setActiveElements([],{x:0,y:0});
      const scaleChanged=!prev||!sameScale(prev.scale,cfg.scale);
      const titleChanged=!prev||prev.yTitle!==cfg.yTitle;
      const detailChanged=!prev||prev.detail!==cfg.detail;
      syncDatasets(cfg);syncScale(cfg);
      const duration=reduceMotion()?0:720;
      chart.options.animation.duration=duration;
      chart.options.animations.x.duration=duration;
      chart.options.animations.y.duration=duration;
      chart.options.animations.colors.duration=duration;
      chart.update();
      if(scaleChanged)animateTicks(ticksFor(cfg),duration);else setTicksNow(cfg);
      if(titleChanged)animateTitle(cfg.yTitle,Math.min(duration,420));
      if(detailChanged)fadeDetail(cfg.detail);
      // Legend stays completely fixed because labels/colours do not change between modes.
      lastConfig={detail:cfg.detail,yTitle:cfg.yTitle,scale:{...cfg.scale}};
    }

    function syncSwitch(){
      switchEl.classList.toggle('is-percent-selected',metric==='percent');
      buttons.forEach(b=>{
        const active=b.dataset.metric===metric;
        b.classList.toggle('is-active',active);b.setAttribute('aria-pressed',String(active));
      });
    }
    buttons.forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.metric===metric)return;
      metric=b.dataset.metric;syncSwitch();updateChart();
    }));

    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    canvas.addEventListener('selectstart',e=>e.preventDefault());
    document.addEventListener('pointerdown',e=>{
      if(!e.target.closest('#countryChart')&&chart){
        chart.tooltip.setActiveElements([],{x:0,y:0});chart.update('none');
      }
    });

    function responsive(){
      if(resizeFrame!==null)cancelAnimationFrame(resizeFrame);
      resizeFrame=requestAnimationFrame(()=>{resizeFrame=null;chart?.resize();legendArrows()});
    }
    if('ResizeObserver'in window){
      const ro=new ResizeObserver(entries=>{
        if(entries.some(e=>e.contentRect.width>1&&e.contentRect.height>1))responsive();
      });
      ro.observe(app);ro.observe(chartShell);
    }
    addEventListener('resize',responsive,{passive:true});
    visualViewport?.addEventListener('resize',responsive,{passive:true});

    async function init(){
      try{
        if(!window.Chart)throw new Error('Chart library unavailable.');
        await loadData();
        if(!rows.length)throw new Error('No country of qualification data are available.');
        syncSwitch();createChart(config());statusEl.textContent='';
      }catch(err){
        statusEl.textContent=err?.message||'Country of qualification data unavailable.';
      }finally{
        app.classList.remove('is-loading');app.setAttribute('aria-busy','false');
        requestAnimationFrame(responsive);
      }
    }
    init();
  </script>
</body>
</html>
