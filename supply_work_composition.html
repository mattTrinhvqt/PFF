<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Country of Qualification Trends</title>

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>
  <script src="./assets/pff_chart_core.js"></script>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading country of qualification data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading country of qualification data…</p>
      </div>

      <div class="module-top">
        <div class="tab-list" aria-label="Country of qualification module">
          <div
            class="chart-tab is-active"
            style="border-bottom-color: var(--pff-purple);"
          >Country</div>
        </div>

        <div
          id="sourceIndicator"
          class="live-data"
          aria-label="Live data"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="sourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 class="chart-heading">
              <span class="chart-heading-fixed">Country of qualification</span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3-year trend. Press to switch to 10-year trend."
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>

          <div
            id="metricSwitch"
            class="metric-switch"
            role="group"
            aria-label="Country of qualification display"
          >
            <button
              type="button"
              class="metric-button is-active"
              data-metric="count"
              aria-pressed="true"
            >Count</button>

            <button
              type="button"
              class="metric-button"
              data-metric="percent"
              aria-pressed="false"
            >%</button>
          </div>
        </div>
      </div>

      <div id="legendNav" class="legend-nav">
        <button
          id="legendLeft"
          class="legend-scroll-button legend-scroll-left is-hidden"
          type="button"
          aria-label="Scroll legend left"
        >‹</button>

        <div class="legend-viewport">
          <div
            id="legend"
            class="chart-legend"
            aria-label="Chart legend"
          ></div>
        </div>

        <button
          id="legendRight"
          class="legend-scroll-button legend-scroll-right is-hidden"
          type="button"
          aria-label="Scroll legend right"
        >›</button>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="countryChart"
          aria-label="Australian optometrist country of qualification trends"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    // ============================================================
    // DATA SOURCE + APP-SPECIFIC SERIES
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const SHEET_NAME =
      'Miscellaneous';

    const DATA_RANGE =
      'U31:AE';

    const CACHE_KEY =
      'pff-country-qualification-trends-v1';
    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      CACHE_KEY;

    const CACHE_FETCH_TIMEOUT_MS =
      10000;
    const TIMEOUT =
      15000;

    const LABELS = [
      'Australia',
      'New Zealand',
      'Other',
      'Not stated'
    ];

    const COLOURS = [
      '#0b5d1e',
      '#151515',
      '#ff7f0e',
      '#b9b9b9'
    ];


    // ============================================================
    // DOM + STATE
    // ============================================================

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById('loadingState');

    const statusElement =
      document.getElementById('status');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const metricSwitch =
      document.getElementById('metricSwitch');

    const metricButtons =
      Array.from(
        document.querySelectorAll('.metric-button')
      );

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const legend =
      document.getElementById('legend');

    const legendLeft =
      document.getElementById('legendLeft');

    const legendRight =
      document.getElementById('legendRight');

    const sourceIndicator =
      document.getElementById('sourceIndicator');

    const sourceText =
      document.getElementById('sourceText');

    const chartShell =
      document.getElementById('chartShell');

    const canvas =
      document.getElementById('countryChart');

    let rows = [];
    let chart = null;
    let metric = 'count';
    let trendMode = '3yr';
    let lastConfig = null;

    let yAxisController = null;
    let metricController = null;
    let trendController = null;
    let headingScroller = null;
    let legendController = null;
    let responsiveController = null;
    let chartInteractions = null;
    let chartSummary = null;

    const hidden =
      new Set();

    // ============================================================
    // DATA PARSING + VIEW CONFIGURATION
    // ============================================================

    function numericCountryCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      return PFFCharts.numericCell(
        cell,
        NaN
      );
    }

    function normalise(source) {
      const map =
        new Map();

      (source || []).forEach(row => {
        const year =
          Math.round(
            Number(row?.year)
          );

        if (!Number.isFinite(year)) {
          return;
        }

        const fix =
          values =>
            Array.from(
              { length: 4 },
              (_, index) => {
                const value =
                  Number(values?.[index]);

                return Number.isFinite(value)
                  ? value
                  : null;
              }
            );

        const record = {
          year,
          count: fix(row.count),
          percent: fix(row.percent)
        };

        if (
          [
            ...record.count,
            ...record.percent
          ].some(Number.isFinite)
        ) {
          map.set(
            year,
            record
          );
        }
      });

      return Array.from(
        map.values()
      ).sort(
        (first, second) =>
          first.year -
          second.year
      );
    }

    function niceStep(value) {
      if (
        !Number.isFinite(value) ||
        value <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(value)
        );

      const magnitude =
        10 ** exponent;

      const fraction =
        value /
        magnitude;

      const niceFraction =
        fraction <= 1
          ? 1
          : fraction <= 2
            ? 2
            : fraction <= 2.5
              ? 2.5
              : fraction <= 5
                ? 5
                : 10;

      return niceFraction *
        magnitude;
    }

    function countScale() {
      const maximum =
        Math.max(
          0,
          ...rows.flatMap(
            row =>
              row.count.filter(
                Number.isFinite
              )
          )
        );

      const step =
        niceStep(
          maximum / 4
        );

      return {
        min: 0,
        max: step * 4,
        step,
        intervals: 4
      };
    }

    function currentConfig() {
      if (metric === 'percent') {
        return {
          metric: 'percent',
          yTitle: '% of optometrists',
          scale: {
            min: 0,
            max: 100,
            step: 25,
            intervals: 4
          },
          axisDecimals: 0,
          tipDecimals: 1,
          suffix: '%'
        };
      }

      return {
        metric: 'count',
        yTitle: 'Optometrists',
        scale: countScale(),
        axisDecimals: 0,
        tipDecimals: 0,
        suffix: ''
      };
    }

    function valuesFor(
      row,
      config
    ) {
      return config.metric === 'percent'
        ? row.percent
        : row.count;
    }

    function activeTrendWindow() {
      return trendMode === '10yr'
        ? 10
        : trendMode === '3yr'
          ? 3
          : 0;
    }

    function trendForSeries(
      seriesIndex
    ) {
      const windowSize =
        activeTrendWindow();

      if (windowSize < 2) {
        return NaN;
      }

      const config =
        currentConfig();

      return PFFCharts.latestConsecutiveTrend(
        rows,
        row => {
          const value =
            Number(
              valuesFor(
                row,
                config
              )[seriesIndex]
            );

          return Number.isFinite(value)
            ? value
            : NaN;
        },
        windowSize
      );
    }

    function formatTooltipValue(
      value,
      config
    ) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      return new Intl.NumberFormat(
        'en-AU',
        {
          minimumFractionDigits:
            config.tipDecimals,
          maximumFractionDigits:
            config.tipDecimals
        }
      ).format(value) +
        (config.suffix || '');
    }

    function parseTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const countYear =
          numericCountryCell(
            cells[0]
          );

        const percentYear =
          numericCountryCell(
            cells[6]
          );

        const year =
          Number.isFinite(countYear)
            ? Math.round(countYear)
            : Number.isFinite(percentYear)
              ? Math.round(percentYear)
              : NaN;

        if (!Number.isFinite(year)) {
          return;
        }

        parsed.push({
          year,
          count: [
            numericCountryCell(cells[1]),
            numericCountryCell(cells[2]),
            numericCountryCell(cells[3]),
            numericCountryCell(cells[4])
          ],
          percent: [
            numericCountryCell(cells[7]),
            numericCountryCell(cells[8]),
            numericCountryCell(cells[9]),
            numericCountryCell(cells[10])
          ]
        });
      });

      return normalise(parsed);
    }

    // ============================================================
    // DATASETS + SHARED PFF CHART PLUGINS
    // ============================================================

    function datasetForSeries(
      seriesIndex,
      config
    ) {
      const colour =
        COLOURS[seriesIndex];

      return PFFCharts.lineDataset({
        label:
          LABELS[seriesIndex],

        _seriesLabel:
          LABELS[seriesIndex],

        _activeSeries:
          !hidden.has(seriesIndex),

        data:
          rows.map(row => {
            const value =
              Number(
                valuesFor(
                  row,
                  config
                )[seriesIndex]
              );

            return Number.isFinite(value)
              ? value
              : null;
          }),

        borderColor:
          colour,

        backgroundColor:
          colour,

        pointBackgroundColor:
          colour,

        pointBorderColor:
          '#ffffff',

        pointBorderWidth:
          1,

        cubicInterpolationMode:
          'monotone'
      });
    }

    function buildDatasets(config) {
      return LABELS.map(
        (_, seriesIndex) =>
          datasetForSeries(
            seriesIndex,
            config
          )
      );
    }

    function syncDatasets(config) {
      if (!chart) {
        return;
      }

      buildDatasets(config).forEach(
        (nextDataset, index) => {
          const current =
            chart.data.datasets[index];

          if (!current) {
            chart.data.datasets[index] =
              nextDataset;
          } else {
            Object.assign(
              current,
              nextDataset
            );
          }

          if (
            typeof chart.setDatasetVisibility ===
            'function'
          ) {
            chart.setDatasetVisibility(
              index,
              !hidden.has(index)
            );
          }
        }
      );
    }

    const yearTicksPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'pffCountryQualificationYearTicks',

        getValue({ index }) {
          return rows[index]?.year;
        }
      });

    const trendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'pffCountryQualificationTrendLabels',

        enabled() {
          return (
            trendMode !==
              'off'
          );
        },

        isActive({
          dataset
        }) {
          return Boolean(
            dataset?._activeSeries
          );
        },

        getTrendValue({
          datasetIndex
        }) {
          return trendForSeries(
            datasetIndex
          );
        },

        getSeriesColour({
          datasetIndex
        }) {
          return COLOURS[
            datasetIndex
          ] ||
            '#69718a';
        }
      });

    // ============================================================
    // CHART
    // ============================================================

    function baseChartOptions(config) {
      return PFFCharts.baseChartOptions({
        transitions:
          PFFCharts.seriesVisibilityTransitionOptions(
            240
          ),

        plugins: {
          tooltip: {
            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      items[0].label
                    )
                  : '';
              },

              label(context) {
                const value =
                  Number(context.raw);

                const base =
                  `${context.dataset._seriesLabel}: ${formatTooltipValue(
                    value,
                    currentConfig()
                  )}`;

                if (
                  trendMode ===
                    'off'
                ) {
                  return base;
                }

                const trend =
                  trendForSeries(
                    context.datasetIndex
                  );

                return Number.isFinite(
                  trend
                )
                  ? `${base} · ${trend >= 0 ? '+' : '−'}${Math.abs(
                      trend
                    ).toFixed(1)}% p.a.`
                  : base;
              }
            }
          }
        },

        scales: {
          x:
            PFFCharts.xYearScaleOptions({
              ticks: {
                callback(
                  value,
                  index
                ) {
                  const year =
                    Number(
                      rows[index]?.year
                    );

                  return Number.isFinite(year) &&
                    year % 2 === 0
                    ? String(year)
                    : '';
                }
              }
            }),

          y:
            PFFCharts.yScaleOptions(
              config.scale,
              {
                ticks: {
                  stepSize:
                    config.scale.step
                }
              }
            )
        }
      });
    }

    function syncScale(config) {
      if (!chart) {
        return;
      }

      const y =
        chart.options.scales.y;

      y.min =
        config.scale.min;

      y.max =
        config.scale.max;

      y.ticks.stepSize =
        config.scale.step;
    }

    function legendItems() {
      return LABELS.map(
        (
          label,
          datasetIndex
        ) => ({
          datasetIndex,
          label,
          colour:
            COLOURS[datasetIndex],
          active:
            !hidden.has(datasetIndex)
        })
      );
    }

    function updateAccessibleSummary() {
      if (
        !chartSummary ||
        !rows.length
      ) {
        return;
      }

      const config =
        currentConfig();

      const latest =
        rows[rows.length - 1];

      const values =
        LABELS.map(
          (
            label,
            index
          ) => {
            const value =
              Number(
                valuesFor(
                  latest,
                  config
                )[index]
              );

            return `${label} ${formatTooltipValue(
              value,
              config
            )}`;
          }
        ).join(', ');

      const trendDescription =
        trendMode ===
          'off'
          ? 'Trend annotations are off.'
          : `${activeTrendWindow()}-year trend annotations are on.`;

      PFFCharts.updateChartSummary(
        `Country of qualification. Latest data ${latest.year}: ${values}. ${trendDescription}`,
        chartSummary
      );
    }

    function createChart(config) {
      yAxisController =
        PFFCharts.createUnifiedYAxis({
          id:
            'pffCountryQualificationAxes',

          getChart() {
            return chart;
          },

          getScale() {
            return currentConfig()
              .scale;
          },

          getDecimals() {
            return currentConfig()
              .axisDecimals;
          },

          getTitle() {
            return currentConfig()
              .yTitle;
          }
        });

      yAxisController.setImmediately(
        config.scale,
        config.axisDecimals
      );

      yAxisController.setTitleImmediately(
        config.yTitle
      );

      chart =
        new Chart(
          canvas.getContext('2d'),
          {
            type: 'line',

            data: {
              labels:
                rows.map(
                  row =>
                    String(row.year)
                ),

              datasets:
                buildDatasets(config)
            },

            options:
              baseChartOptions(config),

            plugins: [
              yAxisController.plugin,
              yearTicksPlugin,
              trendLabelsPlugin
            ]
          }
        );

      LABELS.forEach(
        (_, index) =>
          chart.setDatasetVisibility(
            index,
            !hidden.has(index)
          )
      );

      lastConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      legendController?.render();
      updateAccessibleSummary();
    }

    function updateChart(
      reason = 'option'
    ) {
      const config =
        currentConfig();

      const previousConfig =
        lastConfig;

      if (!chart) {
        createChart(config);
        return;
      }

      chart.tooltip.setActiveElements(
        [],
        {
          x: 0,
          y: 0
        }
      );

      const previousVisibleScale =
        yAxisController.currentScale();

      const previousAxisDecimals =
        yAxisController.currentDecimals();

      const scaleChanged =
        !previousConfig ||
        !PFFCharts.scalesMatch(
          previousConfig.scale,
          config.scale
        ) ||
        previousConfig.axisDecimals !==
          config.axisDecimals;

      const yTitleChanged =
        !previousConfig ||
        previousConfig.yTitle !==
          config.yTitle;

      syncDatasets(config);
      syncScale(config);

      const duration =
        reason === 'initial'
          ? 0
          : PFFCharts
              .chartAnimationDuration();

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeInOutCubic';

      chart.options.animations.x.duration =
        duration;

      chart.options.animations.x.easing =
        'easeInOutCubic';

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeInOutCubic';

      chart.options.animations.colors.duration =
        0;

      chart.update();

      if (scaleChanged) {
        yAxisController.animate(
          previousVisibleScale,
          config.scale,
          {
            duration,
            fromDecimals:
              previousAxisDecimals,
            toDecimals:
              config.axisDecimals
          }
        );
      } else {
        yAxisController.setImmediately(
          config.scale,
          config.axisDecimals
        );
      }

      if (yTitleChanged) {
        yAxisController.animateTitle(
          previousConfig?.yTitle ??
            config.yTitle,
          config.yTitle,
          duration
        );
      } else {
        yAxisController.setTitleImmediately(
          config.yTitle
        );
      }

      legendController?.render();

      lastConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      updateAccessibleSummary();
    }

    // ============================================================
    // SHARED CONTROLS
    // ============================================================

    function setupControls() {
      headingScroller =
        PFFCharts.setupScrollableRegion({
          scroller:
            headingScrollViewport,

          leftButton:
            headingScrollLeft,

          rightButton:
            headingScrollRight
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,

          initialMode:
            trendMode,

          onChange(mode) {
            trendMode =
              mode;

            updateAccessibleSummary();
            chart?.draw();
          }
        });

      metricController =
        PFFCharts.setupMetricSwitch({
          element:
            metricSwitch,

          buttons:
            metricButtons,

          valueAttribute:
            'metric',

          initialValue:
            metric,

          onChange(nextMetric) {
            if (
              nextMetric === metric
            ) {
              return;
            }

            metric =
              nextMetric;

            updateChart(
              'option'
            );
          }
        });

      legendController =
        PFFCharts.setupLegend({
          legend,

          leftButton:
            legendLeft,

          rightButton:
            legendRight,

          getChart() {
            return chart;
          },

          getItems:
            legendItems,

          onToggle({
            datasetIndex,
            visible
          }) {
            if (visible) {
              hidden.delete(
                datasetIndex
              );
            } else {
              hidden.add(
                datasetIndex
              );
            }

            const dataset =
              chart?.data?.datasets?.[
                datasetIndex
              ];

            if (dataset) {
              dataset._activeSeries =
                visible;
            }

            const visibilityDuration =
              PFFCharts.reducedMotion()
                ? 0
                : 240;

            chart.options.animation.duration =
              visibilityDuration;

            chart.options.animations.x.duration =
              visibilityDuration;

            chart.options.animations.y.duration =
              visibilityDuration;

            chart.options.animations.colors.duration =
              visibilityDuration;

            updateAccessibleSummary();
          }
        });

      chartInteractions =
        PFFCharts.setupChartInteractions({
          canvas,

          getChart() {
            return chart;
          }
        });

      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },

          observe: [
            app,
            chartShell
          ],

          beforeResize(
            chartInstance
          ) {
            chartInstance
              .data
              .datasets
              .forEach(
                dataset => {
                  dataset.pointHitRadius =
                    dataset._activeSeries
                      ? (
                          PFFCharts.mobileLayout()
                            ? 9
                            : 5
                        )
                      : 0;
                }
              );
          },

          onRefresh() {
            headingScroller?.update();
            legendController?.update();
          }
        });

      chartSummary =
        PFFCharts.ensureChartSummary({
          parent:
            app
        });
    }

    // ============================================================
    // STARTUP
    // ============================================================

    setupControls();

    PFF.initialiseApp({
      app,

      status:
        statusElement,

      loadLive() {
        return PFFCharts.loadGVizSheet({
          sheetId:
            SHEET_ID,

          sheetName:
            SHEET_NAME,

          range:
            DATA_RANGE,

          timeoutMs:
            TIMEOUT,

          headers:
            '1'
        });
      },

      parseLive:
        parseTable,

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,

          appKey:
            CACHE_APP_KEY,

          timeoutMs:
            CACHE_FETCH_TIMEOUT_MS
        });
      },

      parseRemoteCache(snapshot) {
        return parseTable(
          PFFCharts.rowsToGVizTable(
            snapshot.data?.rows
          )
        );
      },

      cacheKey:
        CACHE_KEY,

      minRows:
        1,

      dataSourceOptions: {
        indicator:
          sourceIndicator,

        text:
          sourceText
      },
      onRemoteCacheError(error) {
        console.warn(
          'Apps Script cached data unavailable; trying browser cache.',
          error
        );
      },
      onLiveError(error) {
        console.warn(
          'Live country of qualification data unavailable; using cached data.',
          error
        );
      },

      render(loaded) {
        rows =
          normalise(
            loaded.rows || []
          );

        if (!rows.length) {
          throw new Error(
            'No country of qualification data are available.'
          );
        }

        const config =
          currentConfig();

        createChart(config);

        metricController?.set(
          metric,
          false
        );

        trendController?.set(
          trendMode,
          false
        );

        legendController?.render();
        responsiveController?.refresh();

        return chart;
      },

      onReady() {
        loadingState.setAttribute(
          'aria-hidden',
          'true'
        );

        updateAccessibleSummary();
      },

      errorMessage:
        'Country of qualification data unavailable.'
    });
  </script>
</body>
</html>
