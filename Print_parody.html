<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectacle Rx Printer</title>

<style>
  :root{
    --bg:#f3f5f8;
    --card:#ffffff;
    --ink:#172033;
    --muted:#6b7280;
    --line:#d9dee7;
    --accent:#1769ff;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:24px;
  }

  #editorView{
    min-height:calc(100vh - 48px);
    display:grid;
    place-items:center;
  }

  .wrap{
    width:min(760px,100%);
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 16px 50px rgba(20,35,60,.08);
    padding:24px;
  }

  h1{
    margin:0 0 6px;
    font-size:26px;
  }

  .sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:22px;
  }

  .rx{
    display:grid;
    grid-template-columns:70px repeat(4,1fr);
    gap:9px;
    align-items:center;
  }

  .hdr{
    text-align:center;
    font-size:11px;
    font-weight:800;
    color:var(--muted);
  }

  .eye{
    font-weight:900;
    font-size:15px;
  }

  input{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 10px;
    font-size:15px;
    text-align:center;
    outline:none;
  }

  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(23,105,255,.12);
  }

  .details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }

  .field label{
    display:block;
    font-size:11px;
    font-weight:800;
    color:var(--muted);
    margin-bottom:5px;
  }

  .print-btn{
    margin-top:26px;
    width:100%;
    min-height:180px;
    border:0;
    border-radius:24px;
    background:var(--accent);
    color:white;
    font-weight:1000;
    font-size:clamp(46px,10vw,92px);
    line-height:1;
    letter-spacing:.02em;
    cursor:pointer;
    box-shadow:0 18px 35px rgba(23,105,255,.28);
    transition:transform .08s ease,box-shadow .08s ease;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .print-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 22px 40px rgba(23,105,255,.34);
  }

  .print-btn:active{
    transform:translateY(1px) scale(.995);
  }

  .note{
    text-align:center;
    margin-top:11px;
    font-size:11px;
    color:var(--muted);
  }


  /* PRINT PAGE */

  #printView{
    display:none;
    max-width:900px;
    margin:0 auto;
  }

  .print-paper{
    background:white;
    padding:32px;
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 16px 50px rgba(20,35,60,.08);
  }

  .print-paper h2{
    margin:0 0 8px;
    font-size:28px;
  }

  .meta{
    margin:0 0 22px;
    line-height:1.7;
    font-size:14px;
  }

  .print-table{
    width:100%;
    border-collapse:collapse;
    font-size:16px;
  }

  .print-table th,
  .print-table td{
    border:1px solid #8a8a8a;
    padding:14px 10px;
    text-align:center;
  }

  .print-table th:first-child,
  .print-table td:first-child{
    text-align:left;
    font-weight:800;
  }

  .signature{
    margin-top:34px;
    font-size:14px;
  }

  .print-actions{
    margin:18px auto 0;
    max-width:900px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
  }

  .actually-print{
    border:0;
    border-radius:18px;
    background:var(--accent);
    color:white;
    min-height:110px;
    font-size:clamp(34px,8vw,64px);
    font-weight:1000;
    cursor:pointer;
  }

  .back-btn{
    border:1px solid var(--line);
    border-radius:18px;
    background:white;
    padding:0 24px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
  }


  @media(max-width:620px){

    body{
      padding:14px;
    }

    #editorView{
      min-height:calc(100vh - 28px);
    }

    .rx{
      grid-template-columns:52px repeat(4,minmax(50px,1fr));
      gap:6px;
    }

    input{
      padding:10px 6px;
      font-size:13px;
    }

    .card{
      padding:16px;
    }

    .print-btn{
      min-height:150px;
    }

    .print-paper{
      padding:20px 14px;
    }

    .print-table{
      font-size:13px;
    }

    .print-table th,
    .print-table td{
      padding:11px 5px;
    }

    .print-actions{
      grid-template-columns:1fr;
    }

    .back-btn{
      min-height:52px;
    }

  }


  @media print{

    body{
      background:white;
      padding:0;
    }

    #editorView,
    .print-actions{
      display:none !important;
    }

    #printView{
      display:block !important;
      max-width:none;
      margin:0;
    }

    .print-paper{
      border:0;
      box-shadow:none;
      border-radius:0;
      padding:20mm;
    }

    .print-paper h2{
      font-size:20pt;
      margin-bottom:4mm;
    }

    .meta{
      margin-bottom:8mm;
      font-size:10pt;
    }

    .print-table{
      font-size:12pt;
    }

    .print-table th,
    .print-table td{
      border:1px solid #000;
      padding:4mm 3mm;
    }

    .signature{
      margin-top:12mm;
      font-size:10pt;
    }

  }
</style>
</head>

<body>


<!-- MAIN EMBEDDED VIEW -->

<div id="editorView">

  <div class="wrap">

    <div class="card">

      <h1>Spectacle Rx Printer</h1>

      <div class="sub">
        A revolutionary feature: the prescription can be printed.
      </div>


      <div class="rx">

        <div></div>

        <div class="hdr">Sphere</div>
        <div class="hdr">Cylinder</div>
        <div class="hdr">Axis</div>
        <div class="hdr">Add</div>


        <div class="eye">OD</div>

        <input
          id="odSphere"
          placeholder="-2.00"
        >

        <input
          id="odCyl"
          placeholder="-0.50"
        >

        <input
          id="odAxis"
          placeholder="180"
        >

        <input
          id="odAdd"
          placeholder="+1.50"
        >


        <div class="eye">OS</div>

        <input
          id="osSphere"
          placeholder="-1.75"
        >

        <input
          id="osCyl"
          placeholder="-0.25"
        >

        <input
          id="osAxis"
          placeholder="010"
        >

        <input
          id="osAdd"
          placeholder="+1.50"
        >

      </div>


      <div class="details">

        <div class="field">

          <label>Patient</label>

          <input
            id="patient"
            placeholder="Patient name"
            style="text-align:left"
          >

        </div>


        <div class="field">

          <label>PD</label>

          <input
            id="pd"
            placeholder="63 mm"
          >

        </div>

      </div>


      <!--
        This is intentionally a REAL LINK.

        It opens the prescription outside the
        Google Sites iframe.
      -->

      <a
        class="print-btn"
        id="printLink"
        href="#"
        target="_blank"
        rel="noopener"
      >
        PRINT
      </a>


      <div class="note">
        Yes, it really prints.
      </div>

    </div>

  </div>

</div>



<!-- PRINTABLE VIEW -->

<div id="printView">

  <div class="print-paper">

    <h2>
      Spectacle Prescription
    </h2>


    <div class="meta">

      <strong>Patient:</strong>

      <span id="pPatient">
        —
      </span>

      <br>


      <strong>Date:</strong>

      <span id="pDate">
        —
      </span>

      <br>


      <strong>PD:</strong>

      <span id="pPd">
        —
      </span>

    </div>


    <table class="print-table">

      <thead>

        <tr>

          <th>
            Eye
          </th>

          <th>
            Sphere
          </th>

          <th>
            Cylinder
          </th>

          <th>
            Axis
          </th>

          <th>
            Add
          </th>

        </tr>

      </thead>


      <tbody>

        <tr>

          <td>
            OD
          </td>

          <td id="pOdSphere">
            —
          </td>

          <td id="pOdCyl">
            —
          </td>

          <td id="pOdAxis">
            —
          </td>

          <td id="pOdAdd">
            —
          </td>

        </tr>


        <tr>

          <td>
            OS
          </td>

          <td id="pOsSphere">
            —
          </td>

          <td id="pOsCyl">
            —
          </td>

          <td id="pOsAxis">
            —
          </td>

          <td id="pOsAdd">
            —
          </td>

        </tr>

      </tbody>

    </table>


    <div class="signature">

      Optometrist:

      ______________________________

    </div>

  </div>


  <div class="print-actions">

    <button
      class="actually-print"
      id="actuallyPrint"
      type="button"
    >
      PRINT
    </button>


    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >
      Edit Rx
    </button>

  </div>

</div>



<script>

  const fieldIds = [

    "patient",
    "pd",

    "odSphere",
    "odCyl",
    "odAxis",
    "odAdd",

    "osSphere",
    "osCyl",
    "osAxis",
    "osAdd"

  ];



  function value(id){

    const element =
      document.getElementById(id);

    return element
      ? element.value.trim()
      : "";

  }



  function basePageUrl(){

    /*
      This will automatically resolve to:

      https://matttrinhvqt.github.io/PFF/Print_parody.html

      when hosted on your GitHub Pages site.
    */

    return (
      window.location.origin +
      window.location.pathname
    );

  }



  function updatePrintLink(){

    const params =
      new URLSearchParams();


    params.set(
      "print",
      "1"
    );


    fieldIds.forEach(id => {

      const currentValue =
        value(id);


      if(currentValue){

        params.set(
          id,
          currentValue
        );

      }

    });


    document
      .getElementById("printLink")
      .href =

      basePageUrl() +
      "?" +
      params.toString();

  }



  function fillPrintView(params){

    const mappings = {

      patient:
        "pPatient",

      pd:
        "pPd",

      odSphere:
        "pOdSphere",

      odCyl:
        "pOdCyl",

      odAxis:
        "pOdAxis",

      odAdd:
        "pOdAdd",

      osSphere:
        "pOsSphere",

      osCyl:
        "pOsCyl",

      osAxis:
        "pOsAxis",

      osAdd:
        "pOsAdd"

    };


    Object
      .entries(mappings)
      .forEach(
        ([parameter, outputId]) => {

          const result =
            params.get(parameter)
            || "—";


          document
            .getElementById(outputId)
            .textContent =
            result;

        }
      );


    document
      .getElementById("pDate")
      .textContent =

      new Date()
        .toLocaleDateString(
          "en-AU"
        );

  }



  function enterPrintMode(){

    const params =
      new URLSearchParams(
        window.location.search
      );


    if(
      params.get("print")
      !==
      "1"
    ){

      return;

    }


    document
      .getElementById("editorView")
      .style.display =
      "none";


    document
      .getElementById("printView")
      .style.display =
      "block";


    fillPrintView(
      params
    );


    /*
      This page is now outside the Google Sites iframe.

      Try opening the print dialog automatically.

      If the browser doesn't allow that,
      the giant PRINT button remains visible.
    */

    setTimeout(() => {

      try{

        window.print();

      }

      catch(error){

        console.log(
          "Automatic printing unavailable:",
          error
        );

      }

    },450);

  }



  /*
    Keep the link updated
    whenever the Rx changes.
  */

  fieldIds.forEach(id => {

    document
      .getElementById(id)
      .addEventListener(
        "input",
        updatePrintLink
      );

  });



  /*
    Also update immediately
    before opening the new tab.
  */

  document
    .getElementById("printLink")
    .addEventListener(
      "click",
      updatePrintLink
    );



  /*
    Fallback print button
    on the standalone page.
  */

  document
    .getElementById("actuallyPrint")
    .addEventListener(
      "click",
      () => {

        window.print();

      }
    );



  document
    .getElementById("backBtn")
    .addEventListener(
      "click",
      () => {

        window.location.href =
          basePageUrl();

      }
    );



  updatePrintLink();

  enterPrintMode();

</script>

</body>
</html>
