<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectacle Rx Printer</title>

<style>
  :root{
    --bg:#f3f5f8;
    --card:#ffffff;
    --ink:#172033;
    --muted:#6b7280;
    --line:#d9dee7;
    --accent:#1769ff;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:var(--bg);
    color:var(--ink);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:24px;
  }

  .wrap{
    width:min(760px,100%);
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 16px 50px rgba(20,35,60,.08);
    padding:24px;
  }

  h1{
    margin:0 0 6px;
    font-size:26px;
  }

  .sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:22px;
  }

  .rx{
    display:grid;
    grid-template-columns:70px repeat(4,1fr);
    gap:9px;
    align-items:center;
  }

  .hdr{
    text-align:center;
    font-size:11px;
    font-weight:800;
    color:var(--muted);
  }

  .eye{
    font-weight:900;
    font-size:15px;
  }

  input{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 10px;
    font-size:15px;
    text-align:center;
    outline:none;
  }

  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(23,105,255,.12);
  }

  .details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }

  .field label{
    display:block;
    font-size:11px;
    font-weight:800;
    color:var(--muted);
    margin-bottom:5px;
  }

  .print-btn{
    margin-top:26px;
    width:100%;
    min-height:180px;
    border:0;
    border-radius:24px;
    background:var(--accent);
    color:white;
    font-weight:1000;
    font-size:clamp(46px,10vw,92px);
    line-height:1;
    letter-spacing:.02em;
    cursor:pointer;
    box-shadow:0 18px 35px rgba(23,105,255,.28);
    transition:transform .08s ease, box-shadow .08s ease;
  }

  .print-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 22px 40px rgba(23,105,255,.34);
  }

  .print-btn:active{
    transform:translateY(1px) scale(.995);
  }

  .note{
    text-align:center;
    margin-top:11px;
    font-size:11px;
    color:var(--muted);
  }

  .print-sheet{
    display:none;
  }

  @media(max-width:620px){
    .rx{
      grid-template-columns:52px repeat(4,minmax(50px,1fr));
      gap:6px;
    }

    input{
      padding:10px 6px;
      font-size:13px;
    }

    .card{
      padding:16px;
    }

    .print-btn{
      min-height:150px;
    }
  }

  @media print{
    body{
      display:block;
      background:white;
      padding:0;
    }

    .wrap{
      display:none;
    }

    .print-sheet{
      display:block;
      padding:24mm 20mm;
      font-family:Arial,sans-serif;
      color:#000;
    }

    .print-sheet h2{
      margin:0 0 4mm;
      font-size:20pt;
    }

    .print-sheet .meta{
      margin-bottom:8mm;
      font-size:10pt;
    }

    .print-table{
      width:100%;
      border-collapse:collapse;
      margin-top:4mm;
      font-size:12pt;
    }

    .print-table th,
    .print-table td{
      border:1px solid #000;
      padding:4mm 3mm;
      text-align:center;
    }

    .print-table th:first-child,
    .print-table td:first-child{
      text-align:left;
      font-weight:bold;
    }

    .footer{
      margin-top:12mm;
      font-size:10pt;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>Spectacle Rx Printer</h1>

    <div class="sub">
      A revolutionary feature: the prescription can be printed.
    </div>

    <div class="rx">

      <div></div>

      <div class="hdr">Sphere</div>
      <div class="hdr">Cylinder</div>
      <div class="hdr">Axis</div>
      <div class="hdr">Add</div>

      <div class="eye">OD</div>

      <input id="odSphere" placeholder="-2.00">
      <input id="odCyl" placeholder="-0.50">
      <input id="odAxis" placeholder="180">
      <input id="odAdd" placeholder="+1.50">

      <div class="eye">OS</div>

      <input id="osSphere" placeholder="-1.75">
      <input id="osCyl" placeholder="-0.25">
      <input id="osAxis" placeholder="010">
      <input id="osAdd" placeholder="+1.50">

    </div>

    <div class="details">

      <div class="field">

        <label>Patient</label>

        <input
          id="patient"
          placeholder="Patient name"
          style="text-align:left"
        >

      </div>

      <div class="field">

        <label>PD</label>

        <input
          id="pd"
          placeholder="63 mm"
        >

      </div>

    </div>

    <button
      class="print-btn"
      id="printBtn"
      type="button"
    >
      PRINT
    </button>

    <div class="note">
      Yes, it really prints.
    </div>

  </div>

</div>


<!-- Printed prescription -->

<section class="print-sheet">

  <h2>Spectacle Prescription</h2>

  <div class="meta">

    <strong>Patient:</strong>
    <span id="pPatient">—</span>

    <br>

    <strong>Date:</strong>
    <span id="pDate"></span>

    <br>

    <strong>PD:</strong>
    <span id="pPd">—</span>

  </div>

  <table class="print-table">

    <thead>

      <tr>

        <th>Eye</th>
        <th>Sphere</th>
        <th>Cylinder</th>
        <th>Axis</th>
        <th>Add</th>

      </tr>

    </thead>

    <tbody>

      <tr>

        <td>OD</td>

        <td id="pOdSphere">—</td>
        <td id="pOdCyl">—</td>
        <td id="pOdAxis">—</td>
        <td id="pOdAdd">—</td>

      </tr>

      <tr>

        <td>OS</td>

        <td id="pOsSphere">—</td>
        <td id="pOsCyl">—</td>
        <td id="pOsAxis">—</td>
        <td id="pOsAdd">—</td>

      </tr>

    </tbody>

  </table>

  <div class="footer">

    Optometrist:
    ______________________________

  </div>

</section>


<script>

  const ids = [
    "odSphere",
    "odCyl",
    "odAxis",
    "odAdd",
    "osSphere",
    "osCyl",
    "osAxis",
    "osAdd"
  ];


  function safeValue(id){

    return document
      .getElementById(id)
      .value
      .trim() || "—";

  }


  document
    .getElementById("printBtn")
    .addEventListener("click", () => {

      document.getElementById("pPatient").textContent =
        document.getElementById("patient").value.trim()
        || "—";


      document.getElementById("pPd").textContent =
        document.getElementById("pd").value.trim()
        || "—";


      document.getElementById("pDate").textContent =
        new Date().toLocaleDateString("en-AU");


      ids.forEach(id => {

        const printId =
          "p" +
          id.charAt(0).toUpperCase() +
          id.slice(1);

        document.getElementById(printId).textContent =
          safeValue(id);

      });


      window.print();

    });

</script>

</body>
</html>
