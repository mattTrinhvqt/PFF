      srcdoc="&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;meta charset=&quot;utf-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;

  &lt;title&gt;Best Optometry Workplaces&lt;/title&gt;

  &lt;link
    href=&quot;https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=swap&quot;
    rel=&quot;stylesheet&quot;
  &gt;

  &lt;style&gt;
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: &#x27;Lato&#x27;, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-touch-callout: none;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      max-width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      margin: 0 auto;
      padding:
        clamp(6px, 2.5vh, 14px)
        4px
        2px;
      overflow: hidden;
      background: #fff;
      text-align: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      -webkit-clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation:
        blueConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation:
        greenConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation:
        redConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation:
        loadingTextPulse
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    .response-summary {
      flex: 0 0 auto;
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: &quot;&quot;;
      display: block;
      width: 100%;
      height: 1px;
      margin-top: clamp(2px, 1vh, 5px);
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .response-value.is-loading {
      display: flex;
      min-width: 64px;
      min-height: 31px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .response-value.is-loading .cone-loader {
      width: 64px;
      height: 22px;
      margin: 0 auto;
    }

    .response-value.is-loading .cone {

      width: 20px;
      height: 22px;
    }

    .response-value.is-loading .cone.blue {
      left: 14px;
    }

    .response-value.is-loading .cone.green {
      left: 27px;
    }

    .response-value.is-loading .cone.red {
      left: 33px;
    }

    .response-value.is-loading .loader-text {
      margin: -1px 0 0;
      font-size: 7.5px;
      line-height: 1;
    }

    .response-value-row {
      position: relative;
      display: flex;
      width: 100%;
      min-height: clamp(23px, 6vh, 31px);
      margin-top: 2px;
      align-items: center;
      justify-content: center;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      min-width: 6px;
      min-height: 6px;
      flex: 0 0 6px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      flex: 0 0 auto;
      max-height: 42px;
      margin: 6px 8px 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    #status[hidden] {
      display: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding-right: 3px;
        padding-left: 3px;
      }

      .response-value {
        font-size: 24px;
      }

      .response-value.is-loading {
        min-width: 64px;
        min-height: 31px;
      }

      .response-value.is-loading .cone-loader {
        width: 64px;
        height: 22px;
      }

      .response-value.is-loading .cone {
        width: 20px;
        height: 22px;
      }

      .response-value.is-loading .cone.blue {
        left: 14px;
      }

      .response-value.is-loading .cone.green {
        left: 27px;
      }

      .response-value.is-loading .cone.red {
        left: 33px;
      }

      .response-value.is-loading .loader-text {
        font-size: 7.5px;
      }

      .live-data {
        font-size: 8px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }

&lt;/style&gt;

&lt;body&gt;
  &lt;div id=&quot;fit&quot;&gt;
    &lt;main
      id=&quot;app&quot;
      aria-busy=&quot;true&quot;
    &gt;
      &lt;section
        class=&quot;response-summary&quot;
        aria-live=&quot;polite&quot;
      &gt;
        &lt;div class=&quot;response-label&quot;&gt;
          No. of responses
        &lt;/div&gt;

        &lt;div class=&quot;response-value-row&quot;&gt;
          &lt;div
            id=&quot;response-count&quot;
            class=&quot;response-value is-loading&quot;
            role=&quot;status&quot;
            aria-label=&quot;Counting responses&quot;
          &gt;1&lt;/div&gt;

          &lt;div
            id=&quot;data-source-indicator&quot;
            class=&quot;live-data&quot;
            aria-label=&quot;Live data&quot;
            hidden
          &gt;
            &lt;span
              class=&quot;live-data-dot&quot;
              aria-hidden=&quot;true&quot;
            &gt;&lt;/span&gt;

            &lt;span id=&quot;data-source-text&quot;&gt;LIVE data&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;p
        id=&quot;status&quot;
        role=&quot;alert&quot;
        hidden
      &gt;&lt;/p&gt;
    &lt;/main&gt;
  &lt;/div&gt;

  &lt;script&gt;
    const SPREADSHEET_ID =
      &#x27;1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ&#x27;;

    const SHEET_GID =
      &#x27;0&#x27;;

    const RAW_DATA_RANGE =
      &#x27;A2:C&#x27;;

    const CACHE_WEB_APP_URL =
      &#x27;https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec&#x27;;

    /*
     * Reuse the existing Workplace Promoter Score raw-data cache.
     * It already stores raw A:D, so this summary needs no
     * separate summary-cell cache.
     */
    const CACHE_APP_KEY =
      &#x27;workplace-promoter-score-graph&#x27;;

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Testing switch only.
     * Leave false in normal use.
     */
    const FORCE_CACHED_DATA =
      false;


    const app =
      document.getElementById(
        &#x27;app&#x27;
      );

    const responseCount =
      document.getElementById(
        &#x27;response-count&#x27;
      );

    const dataSourceIndicator =
      document.getElementById(
        &#x27;data-source-indicator&#x27;
      );

    const dataSourceText =
      document.getElementById(
        &#x27;data-source-text&#x27;
      );

    const status =
      document.getElementById(
        &#x27;status&#x27;
      );


    let randomCountTimer =
      null;

    let countUpAnimationFrame =
      null;

    const RANDOM_COUNT_INTERVAL_MS =
      85;

    const COUNT_UP_DURATION_MS =
      900;


    function startRandomCount() {
      if (
        randomCountTimer !==
        null
      ) {
        return;
      }


      const updateRandomCount =
        () =&gt; {
          responseCount.textContent =
            String(
              Math.floor(
                Math.random() *
                999
              ) +
              1
            );
        };


      updateRandomCount();

      randomCountTimer =
        window.setInterval(
          updateRandomCount,
          RANDOM_COUNT_INTERVAL_MS
        );
    }


    function stopRandomCount() {
      if (
        randomCountTimer ===
        null
      ) {
        return;
      }


      window.clearInterval(
        randomCountTimer
      );

      randomCountTimer =
        null;
    }


    function animateFinalCount(
      value
    ) {
      stopRandomCount();


      if (
        countUpAnimationFrame !==
        null
      ) {
        cancelAnimationFrame(
          countUpAnimationFrame
        );

        countUpAnimationFrame =
          null;
      }


      const target =
        Number(
          String(
            value ??
            &#x27;&#x27;
          ).replace(
            /,/g,
            &#x27;&#x27;
          )
        );


      if (
        !Number.isFinite(
          target
        ) ||
        target &lt;
        0
      ) {
        responseCount.textContent =
          value ||
          &#x27;—&#x27;;

        hideLoadingState();

        return;
      }


      const roundedTarget =
        Math.round(
          target
        );

      const startValue =
        roundedTarget &gt;
        0
          ? 1
          : 0;

      const startTime =
        performance.now();


      function drawCount(
        now
      ) {
        const progress =
          Math.min(
            (
              now -
              startTime
            ) /
            COUNT_UP_DURATION_MS,
            1
          );

        const eased =
          1 -
          Math.pow(
            1 -
            progress,
            3
          );

        const current =
          Math.round(
            startValue +
            (
              roundedTarget -
              startValue
            ) *
            eased
          );

        responseCount.textContent =
          current.toLocaleString(
            &#x27;en-AU&#x27;
          );


        if (
          progress &lt;
          1
        ) {
          countUpAnimationFrame =
            requestAnimationFrame(
              drawCount
            );

          return;
        }


        responseCount.textContent =
          roundedTarget.toLocaleString(
            &#x27;en-AU&#x27;
          );

        countUpAnimationFrame =
          null;

        hideLoadingState();
      }


      countUpAnimationFrame =
        requestAnimationFrame(
          drawCount
        );
    }


    function setDataSource(
      source
    ) {
      const isCached =
        source ===
        &#x27;cached&#x27;;


      dataSourceIndicator.hidden =
        false;


      dataSourceIndicator
        .classList
        .toggle(
          &#x27;is-cached&#x27;,
          isCached
        );


      dataSourceIndicator
        .setAttribute(
          &#x27;aria-label&#x27;,
          isCached
            ? &#x27;Cached data&#x27;
            : &#x27;Live data&#x27;
        );


      dataSourceText.textContent =
        isCached
          ? &#x27;CACHED data&#x27;
          : &#x27;LIVE data&#x27;;
    }


    function hideLoadingState() {
      responseCount.classList.remove(
        &#x27;is-loading&#x27;
      );

      app.setAttribute(
        &#x27;aria-busy&#x27;,
        &#x27;false&#x27;
      );
    }


    function getCellDisplayValue(
      cell
    ) {
      if (
        !cell
      ) {
        return &#x27;&#x27;;
      }


      return String(
        cell.f ??
        cell.v ??
        &#x27;&#x27;
      ).trim();
    }


    function loadGvizRange(
      range
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) =&gt; {
          const callbackName =
            `bestWorkplacesCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              &#x27;script&#x27;
            );

          const timeout =
            window.setTimeout(
              () =&gt; {
                cleanup();

                reject(
                  new Error(
                    &#x27;Could not load data&#x27;
                  )
                );
              },
              10000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response =&gt; {
            cleanup();


            if (
              response?.status ===
              &#x27;error&#x27;
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  &#x27;Could not load Google Sheet data&#x27;
                )
              );

              return;
            }


            resolve(
              response
            );
          };


          script.onerror =
            () =&gt; {
              cleanup();

              reject(
                new Error(
                  &#x27;Could not load data&#x27;
                )
              );
            };


          const params =
            new URLSearchParams({
              gid:
                SHEET_GID,

              range,

              headers:
                &#x27;0&#x27;,

              tqx:
                `responseHandler:${callbackName}`
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function loadCachedDashboard() {
      return new Promise(
        (
          resolve,
          reject
        ) =&gt; {
          if (
            !CACHE_WEB_APP_URL ||
            CACHE_WEB_APP_URL.includes(
              &#x27;PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE&#x27;
            )
          ) {
            reject(
              new Error(
                &#x27;The cached-data web app URL has not been configured&#x27;
              )
            );

            return;
          }


          const callbackName =
            `bestWorkplacesCacheCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              &#x27;script&#x27;
            );

          let settled =
            false;


          const timeout =
            window.setTimeout(
              () =&gt; {
                finish(
                  new Error(
                    &#x27;The cached-data request timed out&#x27;
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          function finish(
            error,
            response
          ) {
            if (
              settled
            ) {
              return;
            }


            settled =
              true;

            cleanup();


            if (
              error
            ) {
              reject(
                error
              );

              return;
            }


            resolve(
              response
            );
          }


          window[
            callbackName
          ] = response =&gt; {
            if (
              !response ||
              typeof response !==
                &#x27;object&#x27;
            ) {
              finish(
                new Error(
                  &#x27;The cached-data response was malformed&#x27;
                )
              );

              return;
            }


            finish(
              null,
              response
            );
          };


          script.onerror =
            () =&gt; {
              finish(
                new Error(
                  &#x27;Could not load the cached-data service&#x27;
                )
              );
            };


          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });


          const separator =
            CACHE_WEB_APP_URL.includes(
              &#x27;?&#x27;
            )
              ? &#x27;&amp;&#x27;
              : &#x27;?&#x27;;


          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function buildDashboardFromRawData(
      response
    ) {
      const rows =
        response
          ?.table
          ?.rows ||
        [];


      let totalResponses =
        0;


      rows.forEach(
        row =&gt; {
          const cells =
            row?.c ||
            [];


          const timestamp =
            getCellDisplayValue(
              cells[0]
            );


          /*
           * Equivalent to:
           * =COUNTA(A2:A)
           */
          if (
            timestamp !==
            &#x27;&#x27;
          ) {
            totalResponses++;
          }
        }
      );


      return {
        responseCount:
          String(
            totalResponses
          )
      };
    }


    function isUsableDashboardText(
      value
    ) {
      const text =
        String(
          value ??
          &#x27;&#x27;
        ).trim();


      return Boolean(
        text &amp;&amp;
        text !==
          &#x27;—&#x27;
      );
    }


    function validateDashboardData(
      data
    ) {
      if (
        !isUsableDashboardText(
          data?.responseCount
        )
      ) {
        throw new Error(
          &#x27;Dashboard data is missing a usable responseCount value&#x27;
        );
      }


      return {
        responseCount:
          String(
            data.responseCount
          ).trim()
      };
    }


    function normaliseCachedDashboard(
      response
    ) {
      if (
        response?.ok !==
        true
      ) {
        throw new Error(
          response?.error ||
          response?.message ||
          &#x27;The cached-data service did not return a snapshot&#x27;
        );
      }


      if (
        response.appKey !==
        CACHE_APP_KEY
      ) {
        throw new Error(
          &#x27;The cached-data response belongs to a different app&#x27;
        );
      }


      if (
        !response.cachedAt ||
        Number.isNaN(
          Date.parse(
            response.cachedAt
          )
        )
      ) {
        throw new Error(
          &#x27;The cached-data response has no valid timestamp&#x27;
        );
      }


      if (
        !Array.isArray(
          response.data?.rows
        ) ||
        !response.data.rows.length
      ) {
        throw new Error(
          &#x27;The cached-data response has no survey rows&#x27;
        );
      }


      const rawResponse = {
        table: {
          rows:
            response.data.rows.map(
              row =&gt; ({
                c: [
                  {
                    v:
                      row?.[0] ??
                      &#x27;&#x27;
                  },

                  {
                    v:
                      row?.[1] ??
                      &#x27;&#x27;
                  },

                  {
                    v:
                      row?.[2] ??
                      &#x27;&#x27;
                  }
                ]
              })
            )
        }
      };


      return validateDashboardData(
        buildDashboardFromRawData(
          rawResponse
        )
      );
    }


    function renderDashboard(
      data
    ) {
      status.hidden =
        true;

      status.textContent =
        &#x27;&#x27;;


      animateFinalCount(
        data.responseCount ||
        &#x27;—&#x27;
      );
    }


    function showError(
      error
    ) {
      console.error(
        error
      );


      dataSourceIndicator.hidden =
        true;


      stopRandomCount();

      responseCount.textContent =
        &#x27;—&#x27;;


      status.hidden =
        false;

      status.textContent =
        `Unable to load results: ${
          error.message ||
          error
        }`;


      hideLoadingState();
    }


    async function loadDashboard() {
      let liveError =
        null;


      if (
        !FORCE_CACHED_DATA
      ) {
        try {
          const rawData =
            await loadGvizRange(
              RAW_DATA_RANGE
            );


          const liveDashboard =
            validateDashboardData(
              buildDashboardFromRawData(
                rawData
              )
            );


          setDataSource(
            &#x27;live&#x27;
          );


          renderDashboard(
            liveDashboard
          );

          return;
        } catch (
          error
        ) {
          liveError =
            error;


          console.warn(
            &#x27;Live Google Sheets data could not be used&#x27;,
            error
          );
        }
      } else {
        liveError =
          new Error(
            &#x27;Live data bypassed for cached-data test&#x27;
          );
      }


      try {
        const cachedResponse =
          await loadCachedDashboard();


        const cachedDashboard =
          normaliseCachedDashboard(
            cachedResponse
          );


        setDataSource(
          &#x27;cached&#x27;
        );


        renderDashboard(
          cachedDashboard
        );
      } catch (
        cachedError
      ) {
        console.error(
          &#x27;Live Google Sheets data error&#x27;,
          liveError
        );


        console.error(
          &#x27;Cached Apps Script data error&#x27;,
          cachedError
        );


        showError(
          new Error(
            &#x27;Live and cached data are currently unavailable&#x27;
          )
        );
      }
    }


    startRandomCount();

    document.addEventListener(
      &#x27;DOMContentLoaded&#x27;,
      loadDashboard
    );

          &#x27;Eye Concepts&#x27;,
          &#x27;EyeConcepts&#x27;
        ]
      },

      {
        fullName:
          &#x27;iContact&#x27;,

        aliases: [
          &#x27;iContact&#x27;,
          &#x27;IContact&#x27;,
          &#x27;i Contact&#x27;
        ]
      }
    ];


    function normaliseEmployerName(
      value
    ) {
      return String(
        value ||
        &#x27;&#x27;
      )
        .toLowerCase()
        .normalize(
          &#x27;NFKD&#x27;
        )
        .replace(
          /[’‘]/g,
          &quot;&#x27;&quot;
        )
        .replace(
          /&amp;/g,
          &#x27; and &#x27;
        )
        .replace(
          /[^a-z0-9]+/g,
          &#x27; &#x27;
        )
        .trim()
        .replace(
          /\s+/g,
          &#x27; &#x27;
        );
    }


    const EMPLOYER_ALIAS_MAP =
      new Map();


    EMPLOYERS.forEach(
      (
        employer,
        employerIndex
      ) =&gt; {
        [
          employer.fullName,
          ...employer.aliases
        ].forEach(
          alias =&gt; {
            EMPLOYER_ALIAS_MAP.set(
              normaliseEmployerName(
                alias
              ),
              {
                fullName:
                  employer.fullName,

                order:
                  employerIndex
              }
            );
          }
        );
      }
    );


    function getEmployerAppearance(
      employerName
    ) {
      const original =
        String(
          employerName ||
          &#x27;&#x27;
        ).trim();


      const normalised =
        normaliseEmployerName(
          original
        );


      const knownEmployer =
        EMPLOYER_ALIAS_MAP.get(
          normalised
        );


      if (
        knownEmployer
      ) {
        return {
          key:
            normaliseEmployerName(
              knownEmployer.fullName
            ),

          fullName:
            knownEmployer.fullName,

          order:
            knownEmployer.order
        };
      }


      return {
        key:
          normalised ||
          original,

        fullName:
          original ||
          &#x27;Unknown employer&#x27;,

        order:
          Number.MAX_SAFE_INTEGER
      };
    }


    const EMPLOYER_SEPARATOR =
      &#x27;\u001F&#x27;;


    function formatWorkplaceEmployers(
      value
    ) {
      const text =
        String(
          value ||
          &#x27;&#x27;
        )
          .trim()
          .replace(
            /^#(?:1|2|3)\s*/,
            &#x27;&#x27;
          );


      const employers =
        text
          .split(
            EMPLOYER_SEPARATOR
          )
          .map(
            employer =&gt;
              employer.trim()
          )
          .filter(
            Boolean
          );


      return employers.length
        ? employers
        : [
            &#x27;No result available&#x27;
          ];
    }

    function renderWorkplaceResult(
      target,
      value
    ) {
      const employers =
        formatWorkplaceEmployers(
          value
        );

      const fragment =
        document.createDocumentFragment();


      employers.forEach(
        (
          employer,
          index
        ) =&gt; {
          const line =
            document.createElement(
              &#x27;span&#x27;
            );

          line.className =
            &#x27;employer-line&#x27;;

          line.textContent =
            index &lt;
            employers.length - 1
              ? `${employer};`
              : employer;

          fragment.appendChild(
            line
          );
        }
      );


      target.replaceChildren(
        fragment
      );
    }


    /*
     * Gold, Silver and Bronze always remain the same fixed height.
     * The employer font is reduced separately if more than two
     * employer lines need to fit inside a box.
     */
    function updatePodiumRowProportions() {
      podiumList.style.gridTemplateRows =
        &#x27;repeat(3, var(--podium-row-height))&#x27;;
    }


    /*
     * Each Gold/Silver/Bronze box normally uses a 14px
     * employer font on desktop and 12px on mobile.
     *
     * If the employers in one box do not fit vertically
     * or horizontally, only that box&#x27;s employer font is
     * reduced. The other boxes remain at the normal size
     * unless they independently need to shrink as well.
     */
    function fitSharedEmployerFontSize() {
      const results =
        Array.from(
          document.querySelectorAll(
            &#x27;.result&#x27;
          )
        );

      const baseFontSize =
        window.matchMedia(
          &#x27;(max-width: 430px)&#x27;
        ).matches
          ? 12
          : 14;


      results.forEach(
        result =&gt; {
          const lines =
            Array.from(
              result.querySelectorAll(
                &#x27;.employer-line&#x27;
              )
            );


          if (
            !lines.length
          ) {
            return;
          }


          /*
           * Always begin this box at the normal responsive size.
           */
          lines.forEach(
            line =&gt; {
              line.style.fontSize =
                `${baseFontSize}px`;
            }
          );


          let boxFontSize =
            baseFontSize;


          /*
           * Horizontal limit:
           * if an employer name is too long for this particular
           * box, reduce this box only enough to keep it on one line.
           */
          lines.forEach(
            line =&gt; {
              if (
                line.clientWidth &lt;=
                  1 ||
                line.scrollWidth &lt;=
                  0
              ) {
                return;
              }


              const widthScale =
                line.clientWidth /
                line.scrollWidth;


              boxFontSize =
                Math.min(
                  boxFontSize,
                  baseFontSize *
                  widthScale
                );
            }
          );


          /*
           * Vertical limit:
           * a 40px box comfortably fits up to two employer
           * lines at 11px. If there are more lines, reduce
           * this box&#x27;s font only as much as necessary.
           */
          const styles =
            window.getComputedStyle(
              result
            );

          const paddingTop =
            parseFloat(
              styles.paddingTop
            ) || 0;

          const paddingBottom =
            parseFloat(
              styles.paddingBottom
            ) || 0;

          const gap =
            parseFloat(
              styles.rowGap ||
              styles.gap
            ) || 0;

          const computedLineHeight =
            parseFloat(
              window
                .getComputedStyle(
                  lines[0]
                )
                .lineHeight
            ) ||
            baseFontSize *
              1.2;

          const lineHeightRatio =
            computedLineHeight /
            baseFontSize;

          const availableHeight =
            Math.max(
              1,
              result.clientHeight -
              paddingTop -
              paddingBottom -
              gap *
              Math.max(
                0,
                lines.length -
                1
              )
            );

          const verticalFontLimit =
            availableHeight /
            (
              lines.length *
              lineHeightRatio
            );


          boxFontSize =
            Math.min(
              boxFontSize,
              verticalFontLimit
            );


          boxFontSize =
            Math.max(
              1,
              Math.floor(
                boxFontSize *
                10
              ) /
              10
            );


          lines.forEach(
            line =&gt; {
              line.style.fontSize =
                `${boxFontSize}px`;
            }
          );


          /*
           * Final small correction for browser rounding,
           * again affecting this box only.
           */
          const finalWidthScale =
            Math.min(
              1,
              ...lines.map(
                line =&gt; {
                  if (
                    line.clientWidth &lt;=
                      1 ||
                    line.scrollWidth &lt;=
                      0
                  ) {
                    return 1;
                  }


                  return (
                    line.clientWidth /
                    line.scrollWidth
                  );
                }
              )
            );


          if (
            finalWidthScale &lt;
            1
          ) {
            boxFontSize =
              Math.max(
                1,
                boxFontSize *
                finalWidthScale *
                0.995
              );


            lines.forEach(
              line =&gt; {
                line.style.fontSize =
                  `${boxFontSize}px`;
              }
            );
          }
        }
      );
    }
    let responsiveLayoutFrame =
      null;


    function refreshPodiumLayout() {
      if (
        responsiveLayoutFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveLayoutFrame
        );
      }


      responsiveLayoutFrame =
        requestAnimationFrame(
          () =&gt; {
            responsiveLayoutFrame =
              null;

            updatePodiumRowProportions();


            /*
             * Allow the new grid row proportions to be applied
             * before measuring the available line height.
             */
            requestAnimationFrame(
              fitSharedEmployerFontSize
            );
          }
        );
    }

        &#x27;is-loading&#x27;
      );

      app.setAttribute(

    function getCellDisplayValue(
      cell
    ) {
      if (
        !cell
      ) {
        return &#x27;&#x27;;
      }


      return String(
        cell.f ??
        cell.v ??
        &#x27;&#x27;
      ).trim();

    function loadGvizRange(
      range
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) =&gt; {
          const callbackName =
            `bestWorkplacesCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              &#x27;script&#x27;
            );

          const timeout =
            window.setTimeout(
              () =&gt; {
                cleanup();

                reject(
                  new Error(
                    &#x27;Could not load data&#x27;
                  )
                );
              },
              10000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response =&gt; {
            cleanup();


            if (
              response?.status ===
              &#x27;error&#x27;
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  &#x27;Could not load Google Sheet data&#x27;
                )
              );

              return;
            }


            resolve(
              response
            );
          };


          script.onerror =
            () =&gt; {
              cleanup();

              reject(
                new Error(
                  &#x27;Could not load data&#x27;
                )
              );
            };


          const params =
            new URLSearchParams({
              gid:
                SHEET_GID,

              range,

              headers:
                &#x27;0&#x27;,

              tqx:
                `responseHandler:${callbackName}`
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function loadCachedDashboard() {
      return new Promise(
        (
          resolve,
          reject
        ) =&gt; {
          if (
            !CACHE_WEB_APP_URL ||
            CACHE_WEB_APP_URL.includes(
              &#x27;PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE&#x27;
            )
          ) {
            reject(
              new Error(
                &#x27;The cached-data web app URL has not been configured&#x27;
              )
            );

            return;
          }


          const callbackName =
            `bestWorkplacesCacheCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              &#x27;script&#x27;
            );

          let settled =
            false;


          const timeout =
            window.setTimeout(
              () =&gt; {
                finish(
                  new Error(
                    &#x27;The cached-data request timed out&#x27;
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          function finish(
            error,
            response
          ) {
            if (
              settled
            ) {
              return;
            }


            settled =
              true;

            cleanup();


            if (
              error
            ) {
              reject(
                error
              );

              return;
            }


            resolve(
              response
            );
          }


          window[
            callbackName
          ] = response =&gt; {
            if (
              !response ||
              typeof response !==
                &#x27;object&#x27;
            ) {
              finish(
                new Error(
                  &#x27;The cached-data response was malformed&#x27;
                )
              );

              return;
            }


            finish(
              null,
              response
            );
          };


          script.onerror =
            () =&gt; {
              finish(
                new Error(
                  &#x27;Could not load the cached-data service&#x27;
                )
              );
            };


          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });


          const separator =
            CACHE_WEB_APP_URL.includes(
              &#x27;?&#x27;
            )
              ? &#x27;&amp;&#x27;
              : &#x27;?&#x27;;


          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function calculateMedian(
      values
    ) {
      const sorted =
        values
          .filter(
            Number.isFinite
          )
          .slice()
          .sort(
            (
              first,
              second
            ) =&gt;
              first -
              second
          );


      if (
        !sorted.length
      ) {
        return NaN;
      }


      const middle =
        Math.floor(
          sorted.length /
          2
        );


      if (
        sorted.length %
          2 ===
        1
      ) {
        return sorted[
          middle
        ];
      }


      return (
        sorted[
          middle - 1
        ] +
        sorted[
          middle
        ]
      ) /
      2;
    }


    function buildDashboardFromRawData(
      response
    ) {
      const rows =
        response
          ?.table
          ?.rows ||
        [];


      const employerScores =
        new Map();


      rows.forEach(
        row =&gt; {
          const cells =
            row?.c ||
            [];


          const employerName =
            getCellDisplayValue(
              cells[1]
            );


          const scoreText =
            getCellDisplayValue(
              cells[2]
            );


          if (
            !employerName ||
            scoreText ===
              &#x27;&#x27;
          ) {
            return;
          }


          const score =
            Number(
              scoreText
            );


          if (
            !Number.isFinite(
              score
            )
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          if (
            !employerScores.has(
              appearance.key
            )
          ) {
            employerScores.set(
              appearance.key,
              {
                fullName:
                  appearance.fullName,

                order:
                  appearance.order,

                scores:
                  []
              }
            );
          }


          employerScores
            .get(
              appearance.key
            )
            .scores
            .push(
              score
            );
        }
      );


      const employers =
        [
          ...employerScores.values()
        ]
          .map(
            employer =&gt; ({
              fullName:
                employer.fullName,

              order:
                employer.order,

              median:
                calculateMedian(
                  employer.scores
                )
            })
          )
          .filter(
            employer =&gt;
              Number.isFinite(
                employer.median
              )
          );


      const distinctMedians =
        [
          ...new Set(
            employers.map(
              employer =&gt;
                employer.median
            )
          )
        ]
          .sort(
            (
              first,
              second
            ) =&gt;
              second -
              first
          );


      function buildRankText(
        rankIndex
      ) {
        const targetMedian =
          distinctMedians[
            rankIndex
          ];


        if (
          !Number.isFinite(
            targetMedian
          )
        ) {
          return &#x27;&#x27;;
        }


        const matchingEmployers =
          employers
            .filter(
              employer =&gt;
                employer.median ===
                targetMedian
            )
            .sort(
              (
                first,
                second
              ) =&gt;
                first.order -
                  second.order ||
                first.fullName.localeCompare(
                  second.fullName
                )
            )
            .map(
              employer =&gt;
                employer.fullName
            );


        if (
          !matchingEmployers.length
        ) {
          return &#x27;&#x27;;
        }


        return (
          `#${rankIndex + 1} ` +
          matchingEmployers.join(
            EMPLOYER_SEPARATOR
          )
        );
      }


      return {

        gold:
          buildRankText(
            0
          ),

        silver:
          buildRankText(
            1
          ),

        bronze:
          buildRankText(
            2
          )
      };
    }

    function isUsableDashboardText(
      value
    ) {
      const text =
        String(
          value ??
          &#x27;&#x27;
        ).trim();


      return Boolean(
        text &amp;&amp;
        text !==
          &#x27;—&#x27;
      );
    }


    function validateDashboardData(
      data
    ) {
      const requiredFields = [
        &#x27;gold&#x27;,
        &#x27;silver&#x27;,
        &#x27;bronze&#x27;
      ];


      const missingField =
        requiredFields.find(
          field =&gt;
            !isUsableDashboardText(
              data?.[
                field
              ]
            )
        );


      if (
        missingField
      ) {
        throw new Error(
          `Dashboard data is missing a usable ${missingField} value`
        );
      }


      return {
        gold:
          String(
            data.gold
          ).trim(),

        silver:
          String(
            data.silver
          ).trim(),

        bronze:
          String(
            data.bronze
          ).trim()
      };
    }


    function normaliseCachedDashboard(
      response
    ) {
      if (
        response?.ok !==
        true
      ) {
        throw new Error(
          response?.error ||
          response?.message ||
          &#x27;The cached-data service did not return a snapshot&#x27;
        );
      }


      if (
        response.appKey !==
        CACHE_APP_KEY
      ) {
        throw new Error(
          &#x27;The cached-data response belongs to a different app&#x27;
        );
      }


      if (
        !response.cachedAt ||
        Number.isNaN(
          Date.parse(
            response.cachedAt
          )
        )
      ) {
        throw new Error(
          &#x27;The cached-data response has no valid timestamp&#x27;
        );
      }


      if (
        !Array.isArray(
          response.data?.rows
        ) ||
        !response.data.rows.length
      ) {
        throw new Error(
          &#x27;The cached-data response has no survey rows&#x27;
        );
      }


      const rawResponse = {
        table: {
          rows:
            response.data.rows.map(
              row =&gt; ({
                c: [
                  {
                    v:
                      row?.[0] ??
                      &#x27;&#x27;
                  },

                  {
                    v:
                      row?.[1] ??
                      &#x27;&#x27;
                  },

                  {
                    v:
                      row?.[2] ??
                      &#x27;&#x27;
                  }
                ]
              })
            )
        }
      };


      return validateDashboardData(
        buildDashboardFromRawData(
          rawResponse
        )
      );
    }


    function renderDashboard(
      data
    ) {
      status.hidden =
        true;

      status.textContent =
        &#x27;&#x27;;


      podiumRows.forEach(
        (
          {
            key
          }
        ) =&gt; {
          const target =
            document.getElementById(
              `${key}-text`
            );


          renderWorkplaceResult(
            target,
            data[
              key
            ]
          );
        }
      );


      hideLoadingState();
    }


    function showError(
      error
    ) {
      console.error(
        error
      );


      podiumRows.forEach(
        (
          {
            key
          }
        ) =&gt; {
          const target =
            document.getElementById(
              `${key}-text`
            );


          renderWorkplaceResult(
            target,
            &#x27;—&#x27;
          );
        }
      );


      status.hidden =
        false;

      status.textContent =
        `Unable to load results: ${
          error.message ||
          error
        }`;


      hideLoadingState();
    }


    async function loadDashboard() {
      let liveError =
        null;


      if (
        !FORCE_CACHED_DATA
      ) {
        try {
          const rawData =
            await loadGvizRange(
              RAW_DATA_RANGE
            );


          const liveDashboard =
            validateDashboardData(
              buildDashboardFromRawData(
                rawData
              )
            );


          renderDashboard(
            liveDashboard
          );

          return;
        } catch (
          error
        ) {
          liveError =
            error;


          console.warn(
            &#x27;Live Google Sheets data could not be used&#x27;,
            error
          );
        }
      } else {
        liveError =
          new Error(
            &#x27;Live data bypassed for cached-data test&#x27;
          );
      }


      try {
        const cachedResponse =
          await loadCachedDashboard();


        const cachedDashboard =
          normaliseCachedDashboard(
            cachedResponse
          );


        renderDashboard(
          cachedDashboard
        );
      } catch (
        cachedError
      ) {
        console.error(
          &#x27;Live Google Sheets data error&#x27;,
          liveError
        );


        console.error(
          &#x27;Cached Apps Script data error&#x27;,
          cachedError
        );


        showError(
          new Error(
            &#x27;Live and cached data are currently unavailable&#x27;
          )
        );
      }
    }


    let lastObservedWidth =
      0;

    let lastObservedHeight =
      0;

    let layoutResizeObserver =
      null;


    if (
      &#x27;ResizeObserver&#x27; in
      window
    ) {
      layoutResizeObserver =
        new ResizeObserver(
          entries =&gt; {
            const appEntry =
              entries.find(
                entry =&gt;
                  entry.target ===
                  app
              );


            if (
              !appEntry
            ) {
              return;
            }


            const currentWidth =
              appEntry.contentRect.width;

            const currentHeight =
              appEntry.contentRect.height;

            const widthChanged =
              Math.abs(
                currentWidth -
                lastObservedWidth
              ) &gt;
              0.5;

            const heightChanged =
              Math.abs(
                currentHeight -
                lastObservedHeight
              ) &gt;
              0.5;


            if (
              currentWidth &gt;
                1 &amp;&amp;
              currentHeight &gt;
                1 &amp;&amp;
              (
                widthChanged ||
                heightChanged
              )
            ) {
              lastObservedWidth =
                currentWidth;

              lastObservedHeight =
                currentHeight;

              refreshPodiumLayout();
            }
          }
        );


      layoutResizeObserver.observe(
        app
      );
    }


    window.addEventListener(
      &#x27;resize&#x27;,
      refreshPodiumLayout,
      {
        passive:
          true
      }
    );


    window.visualViewport
      ?.addEventListener(
        &#x27;resize&#x27;,
        refreshPodiumLayout,
        {
          passive:
            true
        }
      );


    window.addEventListener(
      &#x27;pageshow&#x27;,
      refreshPodiumLayout
    );


    document.addEventListener(
      &#x27;visibilitychange&#x27;,
      () =&gt; {
        if (
          !document.hidden
        ) {
          refreshPodiumLayout();
        }
      }
    );


    if (
      document.fonts
        ?.ready
    ) {
      document.fonts.ready.then(
        refreshPodiumLayout
      );
    }


    document.addEventListener(
      &#x27;DOMContentLoaded&#x27;,
      loadDashboard
    );
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"
    ></iframe>
  </div>

  <script>
    function fitFrameToContent(frame) {
      const frameDocument =
        frame.contentDocument;

      if (
        !frameDocument
      ) {
        return;
      }

      const updateHeight =
        () => {
          const bodyHeight =
            frameDocument.body
              ?.scrollHeight ||
            0;

          const documentHeight =
            frameDocument.documentElement
              ?.scrollHeight ||
            0;

          const contentHeight =
            Math.max(
              bodyHeight,
              documentHeight
            );

          if (
            contentHeight >
            0
          ) {
            frame.style.height =
              `${contentHeight}px`;
          }
        };

      updateHeight();

      if (
        'ResizeObserver' in
        window
      ) {
        const observer =
          new ResizeObserver(
            updateHeight
          );

        if (
          frameDocument.body
        ) {
          observer.observe(
            frameDocument.body
          );
        }

        if (
          frameDocument.documentElement
        ) {
          observer.observe(
            frameDocument.documentElement
          );
        }
      }

      frame.contentWindow
        ?.addEventListener(
          'resize',
          updateHeight,
          {
            passive:
              true
          }
        );
    }

    [
      document.getElementById(
        'responses-app'
      ),
      document.getElementById(
        'podium-app'
      )
    ].forEach(
      frame => {
        frame.addEventListener(
          'load',
          () => {
            fitFrameToContent(
              frame
            );
          }
        );
      }
    );
  </script>
