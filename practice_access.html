<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Geographic Access to Eyecare</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_loader.js?v=1.2.5-20261013a"></script>
  <script src="./assets/pff_chart_core.js?v=1.2.11-20260919a"></script>

  <style>
    :root {
      --access-australia: #0b5d1e;
    }

    /* App-specific components only. Shared PFF chart styling lives in pff_chart_core.js. */

    .chart-heading-row {
      align-items: flex-start;
      gap: 6px;
    }

    .chart-heading-row .heading-scroll-shell {
      min-width: 0;
      flex: 1 1 auto;
    }

    .chart-heading-row .heading-scroll-viewport {
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .chart-heading-row .heading-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    .chart-heading {
      width: max-content;
      min-width: max-content;
      max-width: none;
      margin: 0;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
    }

    .chart-heading-fixed:empty + .chart-heading-detail {
      margin-left: 0;
    }

    .heading-controls {
      margin-left: auto;
      padding-top: 2px;
      flex: 0 0 auto;
    }

    .area-button {
      min-width: 84px;
      grid-template-columns: max-content minmax(30px, 1fr) 8px;
      gap: 3px;
      padding-right: 4px;
      padding-left: 4px;
    }

    .area-menu {
      min-width: 178px;
      max-height: min(390px, calc(100vh - 92px));
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 113, 138, 0.34) transparent;
    }

    .area-option-name {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .view-controls-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 30px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 0 0 2px;
    }

    .view-controls-row.is-hidden {
      display: none;
    }

    .view-control-label {
      color: var(--pff-muted);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .access-metric-switch {
      width: 92px;
    }

    .access-summary {
      display: grid;
      width: 100%;
      min-width: 0;
      min-height: 48px;
      flex: 0 0 auto;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: stretch;
      margin: 0 0 2px;
      overflow: hidden;
      border-top: 1px solid rgba(232, 234, 240, 0.78);
      border-bottom: 1px solid rgba(232, 234, 240, 0.78);
    }

    .access-summary-item {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 5px 6px 4px;
      text-align: center;
    }

    .access-summary-item + .access-summary-item {
      border-left: 1px solid rgba(232, 234, 240, 0.78);
    }

    .access-summary-value {
      min-width: 0;
      color: var(--access-australia);
      font-size: 17px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    .access-summary-label {
      min-width: 0;
      color: var(--pff-muted);
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1.12;
      text-align: center;
    }

    .chart-shell {
      margin-top: -1px;
    }

    .chart-scroll {
      position: absolute;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 113, 138, 0.30) transparent;
    }

    .chart-scroll.is-scrollable {
      overflow-x: hidden;
      overflow-y: auto;
    }

    .chart-stage {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 100%;
    }

    .chart-stage canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      opacity: 1;
      will-change: opacity;
    }

    @media (max-width: 430px) {
      .area-button {
        min-width: 80px;
        padding-right: 4px;
        padding-left: 4px;
      }

      .area-menu {
        width: min(238px, calc(100vw - 14px));
      }

      .access-summary {
        min-height: 46px;
      }

      .access-summary-value {
        font-size: 15px;
      }

      .access-summary-label {
        font-size: 8px;
      }
    }

    @media (max-width: 350px) {
      .area-button {
        min-width: 78px;
      }

      .access-summary-value {
        font-size: 14px;
      }

      .access-summary-label {
        font-size: 7.5px;
      }
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading geographic access data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading geographic access data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll geographic access tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Geographic access views"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-view="access"
              aria-selected="true"

            <button
              class="chart-tab"

              role="tab"

              aria-selected="false"

          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"

            aria-label="Scroll geographic access tabs right"
          >›</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
          aria-live="polite"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll chart heading left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">
              <span id="chartHeadingFixed" class="chart-heading-fixed"></span>
              <span id="chartHeadingDetail" class="chart-heading-detail">Distance from postcode centroids to nearest eyecare practice</span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll chart heading right"
          >›</button>
        </div>

        <div class="heading-controls">
          <div id="areaControl" class="state-control">
            <button
              id="areaButton"
              class="state-button area-button"
              type="button"
              aria-expanded="false"
              aria-controls="areaMenu"
            >
              <span>Location</span>
              <span id="areaButtonValue" class="state-button-value">All</span>
              <span class="menu-arrow" aria-hidden="true"></span>
            </button>

            <div id="areaMenu" class="state-menu area-menu" role="menu">
              <div class="state-menu-title">Show locations</div>
              <label class="state-option">
                <input id="areaAll" type="checkbox" checked>
                <span class="state-option-box" aria-hidden="true"></span>
                <span class="area-option-name">All locations</span>

      </div>

      <div id="accessControls" class="view-controls-row">
        <span class="view-control-label">Display</span>
        <div
          id="accessMetricSwitch"
          class="metric-switch access-metric-switch"
          role="group"
          aria-label="Access display metric"
        >
          <button class="metric-button" type="button" data-metric="count" aria-pressed="false">Count</button>
          <button class="metric-button is-active" type="button" data-metric="share" aria-pressed="true">%</button>
        </div>
      </div>

      <div id="accessSummary" class="access-summary" aria-live="polite">
        <div class="access-summary-item">
          <span id="summaryValue1" class="access-summary-value">—</span>
          <span id="summaryLabel1" class="access-summary-label">Postcodes ≤100 km from a practice</span>
        </div>
        <div class="access-summary-item">
          <span id="summaryValue2" class="access-summary-value">—</span>
          <span id="summaryLabel2" class="access-summary-label">Postcodes &gt;100 km from a practice</span>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <div id="chartScroll" class="chart-scroll">
          <div id="chartStage" class="chart-stage">
            <canvas
              id="accessChart"
              aria-label="Australian geographic access to eyecare chart"
              role="img"
            ></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      spreadsheetId: '1v6nHeJDkbYF-Pan7OEDLLBhYLghuGxFVBoRX4ibuWSE',
      practiceSheetName: '2026 Optom EAT',
      practiceSheetGid: '884596310',
      practiceRange: 'B32:AJ',
      practiceColumnCount: 35,
      locationSheetName: 'Localities',
      locationRange: 'A4:J',
      locationColumnCount: 10,
      fetchTimeoutMs: 25000,
      jsonFallbackUrl: './assets/practice_directory_fallback.json',
      jsonFallbackVersion: 8,
      jsonFetchTimeoutMs: 15000,
      appKey: 'pff-optom-practice-directory',
      localCacheKey: 'pff-practice-access-v4',
      minimumPractices: 100,
      coordinateDecimals: 5,
      barTransitionMs: 700,
      reorderTransitionMs: 700
    });

    const STATE_ORDER = Object.freeze([
      'NSW', 'VIC', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT'
    ]);

    const STATE_NAMES = Object.freeze({
      NSW: 'New South Wales',
      VIC: 'Victoria',
      QLD: 'Queensland',
      SA: 'South Australia',
      WA: 'Western Australia',
      TAS: 'Tasmania',
      NT: 'Northern Territory',
      ACT: 'Australian Capital Territory'
    });

    const RURALITY_GROUPS = Object.freeze([
      Object.freeze({
        key: 'mm1-5',
        label: 'MM1–5',
        includes: Object.freeze(['MM1', 'MM2', 'MM3', 'MM4', 'MM5'])
      }),
      Object.freeze({
        key: 'mm6-7',
        label: 'MM6–7',
        includes: Object.freeze(['MM6', 'MM7'])
      })
    ]);

    /* Australian Government Department of Health, 2024–25 MMM population totals:
     * MM6 296,487 + MM7 205,951 = 502,438 people. */
    const MM67_POPULATION = 502438;
    const MM67_FTE_AT_10K = MM67_POPULATION / 10000;


    const app = document.getElementById('app');
    const statusElement = document.getElementById('status');
    const dataSourceIndicator = document.getElementById('dataSourceIndicator');
    const dataSourceText = document.getElementById('dataSourceText');
    const tabList = document.getElementById('tabList');
    const tabScrollLeft = document.getElementById('tabScrollLeft');
    const tabScrollRight = document.getElementById('tabScrollRight');
    const chartHeadingFixed = document.getElementById('chartHeadingFixed');
    const chartHeadingDetail = document.getElementById('chartHeadingDetail');
    const headingScrollViewport = document.getElementById('headingScrollViewport');
    const headingScrollLeft = document.getElementById('headingScrollLeft');
    const headingScrollRight = document.getElementById('headingScrollRight');
    const areaControl = document.getElementById('areaControl');
    const areaButton = document.getElementById('areaButton');
    const areaButtonValue = document.getElementById('areaButtonValue');
    const areaMenu = document.getElementById('areaMenu');
    const areaAll = document.getElementById('areaAll');
    const areaOptions = document.getElementById('areaOptions');
    const accessControls = document.getElementById('accessControls');
    const accessMetricSwitch = document.getElementById('accessMetricSwitch');
    const chartShell = document.getElementById('chartShell');
    const chartScroll = document.getElementById('chartScroll');
    const chartStage = document.getElementById('chartStage');
    const chartCanvas = document.getElementById('accessChart');
    const summaryValue1 = document.getElementById('summaryValue1');
    const summaryValue2 = document.getElementById('summaryValue2');
    const summaryLabel1 = document.getElementById('summaryLabel1');
    const summaryLabel2 = document.getElementById('summaryLabel2');

    let practiceRows = [];
    let rawLocationRows = [];
    let accessUnits = [];
    let practiceSpatialIndex = null;
    const nearestDistanceCache = new Map();

    let activeView = 'access';
    let accessMetric = 'share';
    let selectedAreas = new Set();
    let chart = null;
    let activeModel = null;
    let tabsController = null;
    let areaMenuController = null;
    let headingScroller = null;
    let chartInteractionController = null;
    let responsiveController = null;
    let chartSummary = null;

    const reorderAnimator = PFFCharts.createAnimationController();
    const metricAnimator = PFFCharts.createAnimationController();

    const reorderState = {
      active: false,
      progress: 1,
      fromYByKey: new Map()
    };

    const axisTransitionState = {
      active: false,
      progress: 1,
      fromAxis: null,
      toAxis: null,
      fromMetric: 'share',
      toMetric: 'share',
      fromView: 'access',
      toView: 'access'
    };

    const collator = new Intl.Collator('en-AU', {
      sensitivity: 'base',
      numeric: true
    });

    function cleanText(value) {
      return PFF.cleanText(value).replace(/\s+/g, ' ').trim();
    }

    function dataNumber(value) {
      const cleaned = String(value ?? '').replace(/,/g, '').trim();
      if (!cleaned) return NaN;
      const number = Number(cleaned);
      return Number.isFinite(number) ? number : NaN;
    }

    function modeText(values) {
      const counts = new Map();

      values
        .map(cleanText)
        .filter(Boolean)
        .forEach(value => {
          counts.set(value, (counts.get(value) || 0) + 1);
        });

      if (!counts.size) return '';

      return [...counts.entries()]
        .sort((a, b) => {
          const countDifference = b[1] - a[1];
          return countDifference || collator.compare(a[0], b[0]);
        })[0][0];
    }

    function formatPercent(value, decimals = 1) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '—';
      return `${number.toFixed(decimals)}%`;
    }

    function parsePracticeValues(values, sourceIndex) {
      if (!Array.isArray(values) || values.length < CONFIG.practiceColumnCount) {
        return null;
      }

      const practiceName = cleanText(values[0]);
      const state = PFF.normaliseState(values[3]);
      const latitudeNumber = dataNumber(values[5]);
      const longitudeNumber = dataNumber(values[6]);

      if (
        !practiceName ||
        !Number.isFinite(latitudeNumber) ||
        !Number.isFinite(longitudeNumber)
      ) {
        return null;
      }

      return {
        sourceIndex,
        practiceName,
        state,
        latitudeNumber,
        longitudeNumber
      };
    }

    function parseLocationValues(values, sourceIndex) {
      if (!Array.isArray(values) || values.length < CONFIG.locationColumnCount) {
        return null;
      }

      const postcode = cleanText(values[0]);
      const suburb = cleanText(values[1]);
      const latitudeNumber = dataNumber(values[2]);
      const longitudeNumber = dataNumber(values[3]);
      const mmm = cleanText(values[5]).toUpperCase();
      const stateCode = PFF.normaliseState(values[6]);

      if (
        !postcode ||
        !Number.isFinite(latitudeNumber) ||
        !Number.isFinite(longitudeNumber)
      ) {
        return null;
      }

      return {
        sourceIndex,
        postcode,
        suburb,
        latitudeNumber,
        longitudeNumber,
        mmm,
        stateCode
      };
    }

    function practiceRowsFromTable(table) {
      return (table?.rows || [])
        .map(rawRow => {
          const cells = rawRow?.c || [];
          return Array.from(
            { length: CONFIG.practiceColumnCount },
            (_, index) => PFF.cleanText(PFF.cellValue(cells[index]))
          );
        })
        .map((values, sourceIndex) => parsePracticeValues(values, sourceIndex))
        .filter(Boolean);
    }

    function locationRowsFromTable(table) {
      return (table?.rows || [])
        .map(rawRow => {
          const cells = rawRow?.c || [];
          return Array.from(
            { length: CONFIG.locationColumnCount },
            (_, index) => PFF.cleanText(PFF.cellValue(cells[index]))
          );
        })
        .map((values, sourceIndex) => parseLocationValues(values, sourceIndex))
        .filter(Boolean);
    }

    function practiceRowsFromRemoteCache(payload) {
      return (Array.isArray(payload?.data?.rows) ? payload.data.rows : [])
        .map((row, sourceIndex) => {
          if (!Array.isArray(row)) return null;
          const offset = row.length >= CONFIG.practiceColumnCount + 1 ? 1 : 0;
          if (row.length < CONFIG.practiceColumnCount + offset) return null;
          const values = Array.from(
            { length: CONFIG.practiceColumnCount },
            (_, index) => PFF.cleanText(row[index + offset])
          );
          return parsePracticeValues(values, sourceIndex);
        })
        .filter(Boolean);
    }

    function locationRowsFromRemoteCache(payload) {
      return (Array.isArray(payload?.data?.locationRows)
        ? payload.data.locationRows
        : [])
        .map((values, sourceIndex) => parseLocationValues(values, sourceIndex))
        .filter(Boolean);
    }

    function encodeCacheRows(practices, locations) {
      return [
        ...practices.map(row => [
          'P',
          row.practiceName,
          row.state,
          row.latitudeNumber,
          row.longitudeNumber
        ]),
        ...locations.map(row => [
          'L',
          row.postcode,
          row.suburb,
          row.latitudeNumber,
          row.longitudeNumber,
          row.mmm,
          row.stateCode
        ])
      ];
    }

    function decodeCacheRows(rows) {
      const practices = [];
      const locations = [];

      (Array.isArray(rows) ? rows : []).forEach(row => {
        if (!Array.isArray(row) || !row.length) return;

        if (row[0] === 'P') {
          const latitudeNumber = dataNumber(row[3]);
          const longitudeNumber = dataNumber(row[4]);

          if (!Number.isFinite(latitudeNumber) || !Number.isFinite(longitudeNumber)) {
            return;
          }

          practices.push({
            sourceIndex: practices.length,
            practiceName: cleanText(row[1]),
            state: PFF.normaliseState(row[2]),
            latitudeNumber,
            longitudeNumber
          });
          return;
        }

        if (row[0] === 'L') {
          const latitudeNumber = dataNumber(row[3]);
          const longitudeNumber = dataNumber(row[4]);

          if (!row[1] || !Number.isFinite(latitudeNumber) || !Number.isFinite(longitudeNumber)) {
            return;
          }

          locations.push({
            sourceIndex: locations.length,
            postcode: cleanText(row[1]),
            suburb: cleanText(row[2]),
            latitudeNumber,
            longitudeNumber,
            mmm: cleanText(row[5]).toUpperCase(),
            stateCode: PFF.normaliseState(row[6])
          });
        }
      });

      return { practices, locations };
    }

    async function loadJsonFallback() {
      const controller = new AbortController();
      const timeout = window.setTimeout(
        () => controller.abort(),
        CONFIG.jsonFetchTimeoutMs
      );

      try {
        const url = new URL(CONFIG.jsonFallbackUrl, window.location.href);
        url.searchParams.set('_', String(Date.now()));

        const response = await fetch(url.toString(), {
          cache: 'no-store',
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(`Static JSON fallback returned HTTP ${response.status}.`);
        }

        const payload = await response.json();

        if (!payload || payload.ok !== true || !payload.data) {
          throw new Error(payload?.error || 'Static JSON fallback is invalid.');
        }

        if (payload.appKey !== CONFIG.appKey) {
          throw new Error('Static JSON fallback has the wrong app key.');
        }

        if (Number(payload.version) !== CONFIG.jsonFallbackVersion) {
          throw new Error('Static JSON fallback has the wrong version.');
        }

        return payload;
      } catch (error) {
        if (error?.name === 'AbortError') {
          throw new Error('Timed out loading the static JSON fallback.');
        }
        throw error;
      } finally {
        window.clearTimeout(timeout);
      }
    }

    async function loadAccessRows() {
      return PFFCharts.loadLiveCacheFallback({
        cacheKey: CONFIG.localCacheKey,
        minRows: CONFIG.minimumPractices,

        loadLive: async () => {
          const [practiceTable, locationTable] = await Promise.all([
            PFFCharts.loadGVizSheet({
              sheetId: CONFIG.spreadsheetId,
              sheetName: CONFIG.practiceSheetName,
              gid: CONFIG.practiceSheetGid,
              range: CONFIG.practiceRange,
              headers: '1',
              timeoutMs: CONFIG.fetchTimeoutMs
            }),
            PFFCharts.loadGVizSheet({
              sheetId: CONFIG.spreadsheetId,
              sheetName: CONFIG.locationSheetName,
              range: CONFIG.locationRange,
              headers: '1',
              timeoutMs: CONFIG.fetchTimeoutMs
            })
          ]);

          return { practiceTable, locationTable };
        },

        parseLive(payload) {
          const practices = practiceRowsFromTable(payload?.practiceTable);
          const locations = locationRowsFromTable(payload?.locationTable);

          if (practices.length < CONFIG.minimumPractices) {
            throw new Error('Live practice data did not contain enough usable rows.');
          }

          if (!locations.length) {
            throw new Error('Live Localities data did not contain any usable rows.');
          }

          return encodeCacheRows(practices, locations);
        },

        loadRemoteCache: loadJsonFallback,

        parseRemoteCache(payload) {
          const practices = practiceRowsFromRemoteCache(payload);
          const locations = locationRowsFromRemoteCache(payload);

          if (practices.length < CONFIG.minimumPractices) {
            throw new Error('Static fallback practice data did not contain enough usable rows.');
          }

          if (!locations.length) {
            throw new Error('Static fallback Localities data did not contain any usable rows.');
          }

          return encodeCacheRows(practices, locations);
        },

        onLiveError(error) {
          console.warn('Live geographic-access data unavailable; trying static JSON fallback.', error);
        },

        onRemoteCacheError(error) {
          console.warn('Static geographic-access fallback unavailable; trying browser cache.', error);
        }
      });
    }

    function setLoadedSourceIndicator(loaded) {
      if (loaded?.source === 'live') {
        PFF.setDataSourceIndicator('live', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });
        dataSourceText.textContent = 'LIVE data';
        return;
      }

      if (loaded?.source === 'cached' && loaded?.remote) {
        PFF.setDataSourceIndicator('cached', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });
        dataSourceText.textContent = 'JSON cache';
        return;
      }

      if (loaded?.source === 'cached') {
        PFF.setDataSourceIndicator('cached', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });
        dataSourceText.textContent = 'BROWSER cache';
        return;
      }

      PFF.setDataSourceIndicator('unavailable', {
        indicator: dataSourceIndicator,
        text: dataSourceText
      });
    }

    function buildAccessUnits(rows) {
      const groups = new Map();
      const decimals = CONFIG.coordinateDecimals;

      rows.forEach(row => {
        const key = [
          row.postcode,
          row.latitudeNumber.toFixed(decimals),
          row.longitudeNumber.toFixed(decimals)
        ].join('|');

        if (!groups.has(key)) {
          groups.set(key, {
            key,
            postcode: row.postcode,
            latitudeNumber: row.latitudeNumber,
            longitudeNumber: row.longitudeNumber,
            suburbs: [],
            states: [],
            mmms: []
          });
        }

        const group = groups.get(key);
        group.suburbs.push(row.suburb);
        group.states.push(row.stateCode);
        group.mmms.push(row.mmm);
      });

      return [...groups.values()]
        .map((group, sourceIndex) => ({
          sourceIndex,
          key: group.key,
          postcode: group.postcode,
          suburb: modeText(group.suburbs),
          stateCode: PFF.normaliseState(modeText(group.states)),
          mmm: modeText(group.mmms).toUpperCase(),
          latitudeNumber: group.latitudeNumber,
          longitudeNumber: group.longitudeNumber,
          distanceKm: NaN
        }))
        .filter(unit =>
          unit.stateCode &&
          Number.isFinite(unit.latitudeNumber) &&
          Number.isFinite(unit.longitudeNumber)
        );
    }

    function haversineKm(latitude1, longitude1, latitude2, longitude2) {
      const lat1 = Number(latitude1);
      const lon1 = Number(longitude1);
      const lat2 = Number(latitude2);
      const lon2 = Number(longitude2);

      if (![lat1, lon1, lat2, lon2].every(Number.isFinite)) return NaN;

      const toRadians = degrees => degrees * Math.PI / 180;
      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);
      const firstLat = toRadians(lat1);
      const secondLat = toRadians(lat2);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(firstLat) * Math.cos(secondLat) * Math.sin(dLon / 2) ** 2;

      return 6371 * 2 * Math.asin(Math.sqrt(Math.min(1, a)));
    }

    function buildPracticeSpatialIndex(rows) {
      const cellDegrees = 1;
      const spatial = new Map();

      rows.forEach(row => {
        if (!Number.isFinite(row.latitudeNumber) || !Number.isFinite(row.longitudeNumber)) {
          return;
        }

        const latCell = Math.floor(row.latitudeNumber / cellDegrees);
        const lonCell = Math.floor(row.longitudeNumber / cellDegrees);
        const key = `${latCell}:${lonCell}`;

        if (!spatial.has(key)) spatial.set(key, []);
        spatial.get(key).push([row.latitudeNumber, row.longitudeNumber]);
      });

      return { spatial, cellDegrees };
    }

    function nearestPracticeDistanceKm(location) {
      if (
        !location ||
        !practiceSpatialIndex ||
        !Number.isFinite(location.latitudeNumber) ||
        !Number.isFinite(location.longitudeNumber)
      ) {
        return NaN;
      }

      const cacheKey = location.key || [
        location.sourceIndex,
        location.latitudeNumber,
        location.longitudeNumber
      ].join(':');

      if (nearestDistanceCache.has(cacheKey)) {
        return nearestDistanceCache.get(cacheKey);
      }

      const latitude = location.latitudeNumber;
      const longitude = location.longitudeNumber;
      const cellDegrees = practiceSpatialIndex.cellDegrees;
      const centerLatCell = Math.floor(latitude / cellDegrees);
      const centerLonCell = Math.floor(longitude / cellDegrees);
      let best = Infinity;
      const maximumRing = 60;

      const inspectCell = (latCell, lonCell) => {
        const bucket = practiceSpatialIndex.spatial.get(`${latCell}:${lonCell}`);
        if (!bucket) return;

        bucket.forEach(point => {
          const distance = haversineKm(
            latitude,
            longitude,
            point[0],
            point[1]
          );

          if (Number.isFinite(distance) && distance < best) best = distance;
        });
      };

      for (let ring = 0; ring <= maximumRing; ring += 1) {
        if (ring === 0) {
          inspectCell(centerLatCell, centerLonCell);
        } else {
          const minLat = centerLatCell - ring;
          const maxLat = centerLatCell + ring;
          const minLon = centerLonCell - ring;
          const maxLon = centerLonCell + ring;

          for (let lonCell = minLon; lonCell <= maxLon; lonCell += 1) {
            inspectCell(minLat, lonCell);
            inspectCell(maxLat, lonCell);
          }

          for (let latCell = minLat + 1; latCell < maxLat; latCell += 1) {
            inspectCell(latCell, minLon);
            inspectCell(latCell, maxLon);
          }
        }

        const outsideLowerBoundKm = Math.max(0, (ring - 1) * 70);
        if (Number.isFinite(best) && outsideLowerBoundKm > best) break;
      }

      const result = Number.isFinite(best) ? best : NaN;
      nearestDistanceCache.set(cacheKey, result);
      return result;
    }

    function prepareAccessDistances() {
      accessUnits.forEach(unit => {
        unit.distanceKm = nearestPracticeDistanceKm(unit);
      });
    }

    function availableStates() {
      const found = new Set(accessUnits.map(row => row.stateCode).filter(Boolean));
      return STATE_ORDER.filter(state => found.has(state));
    }

    function availableAreas() {
      return ['AUS', ...availableStates()];
    }

    function areaShortLabel(area) {
      return area === 'AUS' ? 'Australia' : area;
    }

    function areaLongLabel(area) {
      return area === 'AUS' ? 'Australia' : (STATE_NAMES[area] || area);
    }

    function areaColour(area) {
      return area === 'AUS'
        ? '#0b5d1e'
        : (PFF.stateColours?.[area] || '#69718a');
    }

    function unitsForArea(area) {
      const rows = accessUnits.filter(unit => Number.isFinite(unit.distanceKm));
      return area === 'AUS'
        ? rows
        : rows.filter(unit => unit.stateCode === area);
    }

    function visibleAreas() {
      return availableAreas().filter(area => selectedAreas.has(area));
    }

    function selectedAreaSummary() {
      const available = availableAreas();
      const selected = available.filter(area => selectedAreas.has(area));

      if (selected.length === available.length) return 'All';
      if (selected.length === 0) return 'None';
      if (selected.length === 1) return areaShortLabel(selected[0]);
      return String(selected.length);
    }

    function buildAreaMenu() {
      areaOptions.textContent = '';

      availableAreas().forEach(area => {
        const label = document.createElement('label');
        label.className = 'state-option';

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = selectedAreas.has(area);
        input.dataset.areaValue = area;

        const box = document.createElement('span');
        box.className = 'state-option-box';
        box.setAttribute('aria-hidden', 'true');

        const name = document.createElement('span');
        name.className = 'area-option-name';
        name.textContent = areaShortLabel(area);
        name.style.color = areaColour(area);
        name.title = areaLongLabel(area);

        label.append(input, box, name);
        areaOptions.appendChild(label);
      });

      syncAreaControl(false);
    }

    function syncAreaControl(animate = true) {
      const available = availableAreas();
      const selected = available.filter(area => selectedAreas.has(area));
      const next = selectedAreaSummary();

      areaAll.checked = selected.length === available.length;
      areaAll.indeterminate = selected.length > 0 && selected.length < available.length;

      areaOptions
        .querySelectorAll('input[data-area-value]')
        .forEach(input => {
          input.checked = selectedAreas.has(input.dataset.areaValue);
        });

      if (selected.length === 1) {
        areaButtonValue.style.color = areaColour(selected[0]);
      } else {
        areaButtonValue.style.color = '#69718a';
      }

      if (!animate || PFF.reducedMotion()) {
        areaButtonValue.textContent = next;
        return;
      }

      PFF.animateTextChange(areaButtonValue, next, {
        fadeOutMs: 130,
        fadeInMs: 200
      });
    }

    function niceAxisStep(roughStep) {
      const value = Math.max(Number(roughStep) || 1, 1);
      const magnitude = 10 ** Math.floor(Math.log10(value));
      const candidates = [1, 2, 5, 10].map(factor => factor * magnitude);

      return candidates.reduce((best, candidate) => {
        const bestDistance = Math.abs(Math.log(best / value));
        const candidateDistance = Math.abs(Math.log(candidate / value));
        return candidateDistance < bestDistance ? candidate : best;
      }, candidates[0]);
    }

    function countAxisSpec(values) {
      const maximum = values.length ? Math.max(...values) : 0;
      const paddedMaximum = Math.max(2, maximum * 1.14 + 1);
      const step = Math.max(1, Math.round(niceAxisStep(paddedMaximum / 5)));
      const max = Math.max(step, Math.ceil(paddedMaximum / step) * step);
      const ticks = [];

      for (let value = 0; value <= max + 1e-9; value += step) {
        ticks.push(value);
      }

      return { max, ticks };
    }

    function accessGroupsForAreas(areas) {
      return areas.map(area => {
        const units = unitsForArea(area);
        const total = units.length;
        const withinCount = units.filter(unit => unit.distanceKm <= 100).length;

        return {
          key: `access:${area}:within-100`,
          area,
          label: areaShortLabel(area),
          bandLabel: '≤100 km',
          count: withinCount,
          share: total > 0 ? withinCount / total * 100 : 0,
          total,
          colour: areaColour(area)
        };
      });
    }

    function buildAccessModel() {
      const groups = accessGroupsForAreas(visibleAreas());
      const allGroups = accessGroupsForAreas(availableAreas());
      const values = groups.map(group =>
        accessMetric === 'share' ? group.share : group.count
      );
      const axis = accessMetric === 'share'
        ? { max: 100, ticks: [0, 20, 40, 60, 80, 100] }
        : countAxisSpec(allGroups.map(group => group.count));

      return {
        view: 'access',
        groups,
        values,
        axis,
        metric: accessMetric
      };
    }

    function buildMmmModel() {
      const groups = [];

      visibleAreas().forEach(area => {
        const areaUnits = unitsForArea(area);
        const colour = areaColour(area);

        RURALITY_GROUPS.forEach(rurality => {
          const rows = areaUnits.filter(unit =>
            rurality.includes.includes(unit.mmm)
          );

          if (!rows.length) return;

          const affected = rows.filter(unit => unit.distanceKm > 100).length;
          const share = affected / rows.length * 100;

          groups.push({
            key: `mmm:${area}:${rurality.key}`,
            area,
            mmm: rurality.label,
            ruralityKey: rurality.key,
            label: `${areaShortLabel(area)} · ${rurality.label}`,
            total: rows.length,
            affected,
            share,
            colour
          });
        });
      });

      return {
        view: 'mmm',
        groups,
        values: groups.map(group => group.share),
        axis: { max: 100, ticks: [0, 20, 40, 60, 80, 100] },
        metric: 'share'
      };
    }

    function buildModel() {
      return activeView === 'mmm'
        ? buildMmmModel()
        : buildAccessModel();
    }

    function headingText() {
      return activeView === 'mmm'
        ? 'Distance from postcode centroids to nearest eyecare practice by rurality'
        : 'Distance from postcode centroids to nearest eyecare practice';
    }

    function updateHeading(animate = true) {
      const next = headingText();
      chartHeadingFixed.textContent = '';

      if (!animate || PFF.reducedMotion()) {
        chartHeadingDetail.textContent = next;
        requestAnimationFrame(() => headingScroller?.update?.());
        return;
      }

      PFF.animateTextChange(chartHeadingDetail, next, {
        fadeOutMs: 150,
        fadeInMs: 220
      });

      window.setTimeout(() => headingScroller?.update?.(), 230);
    }

    function nationalAccessSummary() {
      const units = unitsForArea('AUS');
      const total = units.length;
      const within = units.filter(unit => unit.distanceKm <= 100).length;
      const beyond = units.filter(unit => unit.distanceKm > 100).length;

      return {
        total,
        within,
        beyond,
        withinShare: total ? within / total * 100 : 0,
        beyondShare: total ? beyond / total * 100 : 0
      };
    }

    function updateSummary() {
      summaryValue1.style.color = '#0b5d1e';
      summaryValue2.style.color = '#0b5d1e';

      if (activeView === 'mmm') {
        summaryValue1.textContent = PFF.formatInteger(MM67_POPULATION);
        summaryValue2.textContent = `${MM67_FTE_AT_10K.toFixed(1)} FTE`;
        summaryLabel1.textContent = 'People living in MM6–7 (2024–25)';
        summaryLabel2.textContent = 'Benchmark FTE at 1 per 10,000 people';
        return;
      }

      const summary = nationalAccessSummary();
      summaryValue1.textContent = formatPercent(summary.withinShare);
      summaryValue2.textContent = formatPercent(summary.beyondShare);
      summaryLabel1.textContent = 'Postcodes ≤100 km from a practice';
      summaryLabel2.textContent = 'Postcodes >100 km from a practice';
    }

    function updateControls() {
      accessControls.classList.toggle('is-hidden', activeView !== 'access');
    }

    function xAxisTitleFor(view, metric) {
      if (view === 'mmm') {
        return 'Postcode centroids >100 km from nearest practice (%)';
      }

      return metric === 'share'
        ? 'Postcode centroids within 100 km (%)'
        : 'Postcode centroids within 100 km';
    }

    function xAxisTitle() {
      return xAxisTitleFor(activeView, activeModel?.metric || accessMetric);
    }

    function formatAxisTickFor(value, view, metric) {
      if (view === 'mmm' || metric === 'share') {
        return `${Math.round(Number(value) || 0)}%`;
      }

      return PFFCharts.formatAxisValue(Number(value) || 0, 0);
    }

    function formatAxisTick(value) {
      return formatAxisTickFor(
        value,
        activeView,
        activeModel?.metric || accessMetric
      );
    }

    function axisTickLayers() {
      if (
        axisTransitionState.active &&
        axisTransitionState.fromAxis &&
        axisTransitionState.toAxis
      ) {
        const progress = Math.max(0, Math.min(1, axisTransitionState.progress));

        return [
          {
            axis: axisTransitionState.fromAxis,
            metric: axisTransitionState.fromMetric,
            view: axisTransitionState.fromView,
            alpha: 1 - progress
          },
          {
            axis: axisTransitionState.toAxis,
            metric: axisTransitionState.toMetric,
            view: axisTransitionState.toView,
            alpha: progress
          }
        ].filter(layer => layer.alpha > 0.001);
      }

      return [{
        axis: activeModel?.axis,
        metric: activeModel?.metric || accessMetric,
        view: activeModel?.view || activeView,
        alpha: 1
      }];
    }

    function tooltipCallbacks() {
      return {
        title(items) {
          const group = activeModel?.groups?.[items?.[0]?.dataIndex];
          if (!group) return '';

          if (activeView === 'mmm') {
            return `${areaLongLabel(group.area)} · ${group.mmm}`;
          }

          return areaLongLabel(group.area);
        },

        label(context) {
          const group = activeModel?.groups?.[context.dataIndex];
          if (!group) return '';

          if (activeView === 'mmm') {
            return `More than 100 km: ${formatPercent(group.share)} (${PFF.formatInteger(group.affected)} of ${PFF.formatInteger(group.total)})`;
          }

          return `Within 100 km: ${formatPercent(group.share)} (${PFF.formatInteger(group.count)} of ${PFF.formatInteger(group.total)} postcode centroids)`;
        }
      };
    }

    const axisPresentationPlugin = {
      id: 'pffPracticeAccessAxisPresentation',

      beforeDatasetsDraw(chartInstance) {
        const { ctx, chartArea, scales } = chartInstance;
        const xScale = scales?.x;
        if (!chartArea || !xScale || !activeModel?.axis) return;

        ctx.save();
        ctx.lineCap = 'butt';

        axisTickLayers().forEach(layer => {
          if (!layer.axis?.ticks?.length || !(layer.alpha > 0)) return;

          ctx.globalAlpha = layer.alpha;
          ctx.strokeStyle = 'rgba(105, 113, 138, 0.075)';
          ctx.lineWidth = 1;

          layer.axis.ticks.forEach(value => {
            const x = xScale.getPixelForValue(value);
            if (!Number.isFinite(x) || x < chartArea.left - 1 || x > chartArea.right + 1) return;
            ctx.beginPath();
            ctx.moveTo(Math.round(x) + 0.5, chartArea.top);
            ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom);
            ctx.stroke();
          });
        });

        ctx.globalAlpha = 1;
        ctx.restore();
      },

      afterDraw(chartInstance) {
        const { ctx, chartArea, scales } = chartInstance;
        const xScale = scales?.x;
        const meta = chartInstance.getDatasetMeta(0);
        if (!chartArea || !xScale || !meta || !activeModel?.axis) return;

        const mobile = PFF.mobileLayout();
        const tickFontSize = mobile ? 9 : 10;
        const titleFontSize = mobile ? 12 : 13;
        const labelBaseSize = mobile ? 9 : 10;
        const labelMinSize = mobile ? 6 : 7;
        const labelMaxWidth = Math.max(52, chartArea.left - 8);

        ctx.save();
        ctx.lineCap = 'butt';
        ctx.strokeStyle = '#151515';
        ctx.fillStyle = '#151515';
        ctx.lineWidth = 1;

        /* Constant left and bottom spines, matching the repository bar charts. */
        ctx.beginPath();
        ctx.moveTo(chartArea.left, chartArea.top);
        ctx.lineTo(chartArea.left, chartArea.bottom);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(chartArea.left, Math.round(chartArea.bottom) + 0.5);
        ctx.lineTo(chartArea.right, Math.round(chartArea.bottom) + 0.5);
        ctx.stroke();

        /* Y-axis labels are drawn against the animated bar geometry so they slide
         * with retained bars when the Location filter changes. */
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        activeModel.groups.forEach((group, index) => {
          const bar = meta.data[index];
          if (!group || !Number.isFinite(bar?.y)) return;

          const text = group.label || '';
          let fontSize = labelBaseSize;
          ctx.font = `400 ${fontSize}px Lato, sans-serif`;

          while (
            fontSize > labelMinSize &&
            ctx.measureText(text).width > labelMaxWidth
          ) {
            fontSize -= 0.5;
            ctx.font = `400 ${fontSize}px Lato, sans-serif`;
          }

          ctx.fillText(text, chartArea.left - 5, bar.y);
        });

        /* X-axis ticks and titles cross-fade while the scale itself interpolates. */
        axisTickLayers().forEach(layer => {
          if (!layer.axis?.ticks?.length || !(layer.alpha > 0)) return;

          ctx.globalAlpha = layer.alpha;
          ctx.strokeStyle = '#151515';
          ctx.fillStyle = '#151515';
          ctx.font = `400 ${tickFontSize}px Lato, sans-serif`;
          ctx.textBaseline = 'top';

          layer.axis.ticks.forEach((value, index) => {
            const x = xScale.getPixelForValue(value);
            if (!Number.isFinite(x) || x < chartArea.left - 1 || x > chartArea.right + 1) return;

            ctx.beginPath();
            ctx.moveTo(Math.round(x) + 0.5, chartArea.bottom);
            ctx.lineTo(Math.round(x) + 0.5, chartArea.bottom + 5);
            ctx.stroke();

            if (index === 0) ctx.textAlign = 'left';
            else if (index === layer.axis.ticks.length - 1) ctx.textAlign = 'right';
            else ctx.textAlign = 'center';

            ctx.fillText(
              formatAxisTickFor(value, layer.view, layer.metric),
              x,
              chartArea.bottom + 8
            );
          });

          ctx.font = `700 ${titleFontSize}px Lato, sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(
            xAxisTitleFor(layer.view, layer.metric),
            chartArea.left + chartArea.width / 2,
            chartArea.bottom + (mobile ? 27 : 28)
          );
        });

        ctx.globalAlpha = 1;
        ctx.restore();
      }
    };

    const valueLabelsPlugin = {
      id: 'pffPracticeAccessValueLabels',

      afterDatasetsDraw(chartInstance) {
        const { ctx, chartArea, scales } = chartInstance;
        const xScale = scales?.x;
        const meta = chartInstance.getDatasetMeta(0);
        if (!chartArea || !xScale || !meta || !activeModel?.groups?.length) return;

        const mobile = PFF.mobileLayout();
        ctx.save();
        ctx.font = `700 ${mobile ? 9 : 10}px Lato, sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#69718a';

        meta.data.forEach((bar, index) => {
          const group = activeModel.groups[index];
          if (!bar || !group) return;

          const props = bar.getProps(['x', 'y'], false);
          if (!Number.isFinite(props.x) || !Number.isFinite(props.y)) return;

          const currentValue = xScale.getValueForPixel(props.x);
          const targetValue = Number(activeModel.values[index]) || 0;
          const displayedValue = Number.isFinite(currentValue) ? currentValue : targetValue;
          const text = activeView === 'mmm' || accessMetric === 'share'
            ? formatPercent(displayedValue)
            : PFF.formatInteger(Math.round(displayedValue));

          const gap = mobile ? 4 : 5;
          let x = props.x + gap;
          ctx.textAlign = 'left';
          const width = ctx.measureText(text).width;

          if (x + width > chartArea.right - 1) {
            x = chartArea.right - 1;
            ctx.textAlign = 'right';
          }

          ctx.fillText(text, x, props.y);
        });

        ctx.restore();
      }
    };

    const groupSeparatorsPlugin = {
      id: 'pffPracticeAccessGroupSeparators',

      beforeDatasetsDraw(chartInstance) {
        const meta = chartInstance.getDatasetMeta(0);
        const groups = activeModel?.groups || [];

        if (
          activeView !== 'mmm' ||
          !meta?.data ||
          meta.data.length < 2 ||
          groups.length < 2
        ) return;

        const { ctx, chartArea } = chartInstance;
        ctx.save();
        ctx.strokeStyle = 'rgba(105, 113, 138, 0.10)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 3]);

        for (let index = 0; index < groups.length - 1; index += 1) {
          if (groups[index]?.area === groups[index + 1]?.area) continue;

          const first = meta.data[index];
          const second = meta.data[index + 1];
          if (!Number.isFinite(first?.y) || !Number.isFinite(second?.y)) continue;

          const y = (first.y + second.y) / 2;
          ctx.beginPath();
          ctx.moveTo(0, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.right, Math.round(y) + 0.5);
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    function capturePreviousYFractions(model) {
      const output = new Map();
      const area = chart?.chartArea;
      const elements = chart?.getDatasetMeta(0)?.data || [];

      if (!model?.groups?.length || !area || !(area.height > 0)) return output;

      model.groups.forEach((group, index) => {
        const y = elements[index]?.y;
        if (!group?.key || !Number.isFinite(y)) return;
        output.set(group.key, (y - area.top) / area.height);
      });

      return output;
    }

    function animatedGroupY(chartInstance, group, index) {
      const targetY = chartInstance?.scales?.y?.getPixelForValue(index);
      if (!Number.isFinite(targetY) || !reorderState.active) return targetY;

      const fromY = reorderState.fromYByKey.get(group?.key);
      if (!Number.isFinite(fromY)) return targetY;

      return fromY +
        (targetY - fromY) *
        Math.max(0, Math.min(reorderState.progress, 1));
    }

    const reorderGeometryPlugin = {
      id: 'pffPracticeAccessReorderGeometry',

      beforeDatasetsDraw(chartInstance) {
        if (!reorderState.active || !activeModel?.groups?.length) return;

        chartInstance.data.datasets.forEach((_dataset, datasetIndex) => {
          const elements = chartInstance.getDatasetMeta(datasetIndex)?.data || [];

          elements.forEach((element, index) => {
            const group = activeModel.groups[index];
            const y = animatedGroupY(chartInstance, group, index);
            if (Number.isFinite(y)) element.y = y;
          });
        });
      }
    };

    function chartData(model) {
      return {
        labels: model.groups.map(group => group.label),
        datasets: [{
          label: activeView === 'mmm'
            ? 'More than 100 km'
            : (accessMetric === 'share' ? 'Postcode centroids (%)' : 'Postcode centroids'),
          data: model.values,
          backgroundColor: model.groups.map(group => group.colour),
          hoverBackgroundColor: model.groups.map(group => group.colour),
          borderColor: model.groups.map(group => group.colour),
          hoverBorderColor: model.groups.map(group => group.colour),
          borderWidth: 0,
          borderRadius: 2,
          borderSkipped: false,
          categoryPercentage: activeView === 'mmm' ? 0.80 : 0.80,
          barPercentage: activeView === 'mmm' ? 0.66 : 0.68,
          minBarLength: 2
        }]
      };
    }

    function chartOptions(model, animate = true) {
      const duration = PFF.reducedMotion() || !animate
        ? 0
        : CONFIG.barTransitionMs;

      return PFFCharts.baseChartOptions({
        devicePixelRatio: Math.max(2, Math.min(window.devicePixelRatio || 1, 3)),

        animation: {
          duration,
          easing: 'easeInOutCubic'
        },

        animations: {
          x: { duration, easing: 'easeInOutCubic' },
          y: { duration, easing: 'easeInOutCubic' },
          base: { duration: 0 },
          width: { duration: 0 },
          height: { duration: 0 },
          colors: { duration: 0 }
        },

        indexAxis: 'y',
        normalized: true,

        interaction: {
          mode: 'nearest',
          axis: 'xy',
          intersect: true,
          includeInvisible: false
        },

        layout: {
          autoPadding: false,
          padding: {
            top: 3,
            right: PFF.mobileLayout() ? 30 : 38,
            bottom: 0,
            left: 0
          }
        },

        plugins: {
          legend: { display: false },
          tooltip: PFFCharts.tooltipOptions({
            callbacks: tooltipCallbacks()
          })
        },

        scales: {
          x: {
            type: 'linear',
            beginAtZero: true,
            min: 0,
            max: model.axis.max,

            afterFit(axis) {
              axis.height = PFF.mobileLayout() ? 49 : 51;
            },

            afterBuildTicks(axis) {
              axis.ticks = model.axis.ticks.map(value => ({ value }));
            },

            title: { display: false },

            ticks: {
              display: false,
              autoSkip: false,
              maxRotation: 0,
              minRotation: 0
            },

            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },

            border: { display: false }
          },

          y: {
            position: 'left',

            afterFit(axis) {
              axis.width = PFF.mobileLayout() ? 112 : 148;
            },

            grid: {
              display: false,
              drawTicks: false
            },

            border: { display: false },

            ticks: { display: false }
          }
        }
      });
    }

    function rowHeightForView() {
      if (activeView === 'mmm') {
        return PFF.mobileLayout() ? 19 : 21;
      }
      return PFF.mobileLayout() ? 22 : 24;
    }

    function updateStageGeometry(model, resetScroll = false) {
      const shellHeight = Math.max(chartShell.clientHeight || 0, 1);
      const minimum = PFF.mobileLayout() ? 310 : 340;
      const contentHeight =
        Math.max(
          minimum,
          model.groups.length * rowHeightForView() + (PFF.mobileLayout() ? 66 : 72)
        );
      const height = Math.max(shellHeight, contentHeight);
      const scrollable = height > shellHeight + 4;

      chartStage.style.height = `${height}px`;
      chartStage.style.minHeight = `${height}px`;
      chartScroll.classList.toggle('is-scrollable', scrollable);

      if (resetScroll) chartScroll.scrollTop = 0;
    }

    function groupKeysChanged(previousModel, nextModel) {
      if (!previousModel || previousModel.view !== nextModel.view) return false;
      if (previousModel.groups.length !== nextModel.groups.length) return true;

      return previousModel.groups.some(
        (group, index) => group.key !== nextModel.groups[index]?.key
      );
    }

    function renderChart(model, animate = true, previousModel = null) {
      const nextData = chartData(model);
      const nextOptions = chartOptions(model, animate);

      if (!chart) {
        updateStageGeometry(model, true);
        chart = new Chart(chartCanvas.getContext('2d'), {
          type: 'bar',
          data: nextData,
          options: nextOptions,
          plugins: [
            axisPresentationPlugin,
            groupSeparatorsPlugin,
            reorderGeometryPlugin,
            valueLabelsPlugin,
            {
              id: 'pffTooltipTopLayer',
              afterDraw(chartInstance) {
                const tooltip = chartInstance?.tooltip;
                if (!tooltip || !(Number(tooltip.opacity) > 0)) return;
                tooltip.draw(chartInstance.ctx);
              }
            }
          ]
        });
        return;
      }

      const sameView = Boolean(previousModel && previousModel.view === model.view);
      const keysChanged = sameView && groupKeysChanged(previousModel, model);
      const metricChanged = Boolean(
        animate &&
        !PFF.reducedMotion() &&
        previousModel &&
        previousModel.view === 'access' &&
        model.view === 'access' &&
        previousModel.metric !== model.metric &&
        !keysChanged
      );
      const shouldReorder = Boolean(
        animate &&
        !PFF.reducedMotion() &&
        sameView &&
        keysChanged
      );

      reorderAnimator.cancel();
      metricAnimator.cancel();
      reorderState.active = false;
      reorderState.progress = 1;
      reorderState.fromYByKey = new Map();
      axisTransitionState.active = false;
      axisTransitionState.progress = 1;

      if (metricChanged) {
        updateStageGeometry(model, false);

        const dataset = chart.data.datasets[0];
        const targetDataset = nextData.datasets[0];
        const startValues = (dataset.data || []).map(value => Number(value) || 0);
        const targetValues = model.values.map(value => Number(value) || 0);
        const startAxis = previousModel.axis;
        const targetAxis = model.axis;

        chart.data.labels = nextData.labels;
        Object.keys(targetDataset).forEach(key => {
          if (key !== 'data') dataset[key] = targetDataset[key];
        });
        dataset.data = startValues.slice();

        chart.options = chartOptions(model, false);
        chart.options.scales.x.max = startAxis.max;
        chart.tooltip?.setActiveElements([], { x: 0, y: 0 });
        chart.resize();
        chart.update('none');

        axisTransitionState.active = true;
        axisTransitionState.progress = 0;
        axisTransitionState.fromAxis = startAxis;
        axisTransitionState.toAxis = targetAxis;
        axisTransitionState.fromMetric = previousModel.metric;
        axisTransitionState.toMetric = model.metric;
        axisTransitionState.fromView = previousModel.view;
        axisTransitionState.toView = model.view;

        metricAnimator.run({
          duration: CONFIG.barTransitionMs,
          easing: PFFCharts.easeInOutCubic,

          onFrame(progress) {
            axisTransitionState.progress = progress;
            dataset.data = targetValues.map((target, index) => {
              const start = startValues[index] || 0;
              return start + (target - start) * progress;
            });

            chart.options.scales.x.max =
              startAxis.max + (targetAxis.max - startAxis.max) * progress;
            chart.update('none');
          },

          onComplete() {
            dataset.data = targetValues.slice();
            chart.options.scales.x.max = targetAxis.max;
            axisTransitionState.active = false;
            axisTransitionState.progress = 1;
            axisTransitionState.fromAxis = null;
            axisTransitionState.toAxis = null;
            chart.options = chartOptions(model, false);
            chart.update('none');
          }
        });

        return;
      }

      if (!shouldReorder) {
        updateStageGeometry(model, previousModel?.view !== model.view);
        chart.data.labels = nextData.labels;

        const dataset = chart.data.datasets[0];
        const targetDataset = nextData.datasets[0];
        Object.keys(targetDataset).forEach(key => {
          if (key !== 'data') dataset[key] = targetDataset[key];
        });
        dataset.data = targetDataset.data.slice();

        chart.options = nextOptions;
        chart.resize();
        chart.update(animate && !PFF.reducedMotion() ? undefined : 'none');
        return;
      }

      const previousFractions = capturePreviousYFractions(previousModel);
      const previousIndexByKey = new Map(
        previousModel.groups.map((group, index) => [group.key, index])
      );
      const previousValues = (chart.data.datasets?.[0]?.data || []).map(
        value => Number(value) || 0
      );
      const startValues = model.groups.map(group => {
        const oldIndex = previousIndexByKey.get(group.key);
        return oldIndex === undefined ? 0 : previousValues[oldIndex] || 0;
      });
      const targetValues = model.values.map(value => Number(value) || 0);

      updateStageGeometry(model, false);
      chart.data.labels = nextData.labels;

      const dataset = chart.data.datasets[0];
      const targetDataset = nextData.datasets[0];
      Object.keys(targetDataset).forEach(key => {
        if (key !== 'data') dataset[key] = targetDataset[key];
      });
      dataset.data = startValues.slice();

      chart.options = chartOptions(model, false);
      chart.tooltip?.setActiveElements([], { x: 0, y: 0 });
      chart.resize();
      chart.update('none');

      const targetArea = chart.chartArea;
      const fromYByKey = new Map();

      if (targetArea?.height > 0) {
        previousFractions.forEach((fraction, key) => {
          if (!Number.isFinite(fraction)) return;
          fromYByKey.set(
            key,
            targetArea.top + fraction * targetArea.height
          );
        });
      }

      reorderState.active = true;
      reorderState.progress = 0;
      reorderState.fromYByKey = fromYByKey;

      reorderAnimator.run({
        duration: CONFIG.reorderTransitionMs,
        easing: PFFCharts.easeInOutCubic,

        onFrame(progress) {
          reorderState.progress = progress;
          dataset.data = targetValues.map((target, index) => {
            const start = startValues[index] || 0;
            return start + (target - start) * progress;
          });
          chart.update('none');
        },

        onComplete() {
          dataset.data = targetValues.slice();
          reorderState.active = false;
          reorderState.progress = 1;
          reorderState.fromYByKey = new Map();
          chart.options = chartOptions(model, false);
          chart.update('none');
        }
      });
    }

    function updateAccessibleSummary() {
      if (!chartSummary || !activeModel) return;

      const national = nationalAccessSummary();
      const visible = visibleAreas();
      let text = `${formatPercent(national.withinShare)} of Australian postcode centroids are within 100 kilometres of an eyecare practice; ${formatPercent(national.beyondShare)} are more than 100 kilometres away.`;

      if (activeView === 'mmm') {
        text += ' Rurality view compares MM1–5 with MM6–7, showing the share more than 100 kilometres from the nearest practice. The 2024–25 MM6–7 population is 502,438, equivalent to 50.2 FTE at a one-per-10,000 benchmark.';
      }

      text += ` Visible locations: ${visible.length ? visible.map(areaShortLabel).join(', ') : 'none'}.`;
      PFFCharts.updateChartSummary(text, chartSummary);
    }

    function renderView({ animate = true } = {}) {
      const previousModel = activeModel;
      const nextModel = buildModel();
      activeModel = nextModel;

      updateHeading(animate);
      updateControls();
      updateSummary();
      syncAreaControl(animate);
      renderChart(nextModel, animate, previousModel);
      updateAccessibleSummary();
    }

    function configureControls() {
      headingScroller = PFF.setupScrollableRegion({
        scroller: headingScrollViewport,
        leftButton: headingScrollLeft,
        rightButton: headingScrollRight,
        tolerance: 2
      });

      tabsController = PFF.setupTabs({
        tabList,
        tabs: tabList.querySelectorAll('.chart-tab'),
        valueAttribute: 'view',
        initialValue: activeView,
        leftButton: tabScrollLeft,
        rightButton: tabScrollRight,
        onChange(value) {
          activeView = value;
          areaMenuController?.closeMenu?.();
          renderView({ animate: true });
        }
      });

      areaMenuController = PFF.setupMenu({
        menu: areaControl,
        button: areaButton,
        panel: areaMenu,
        focusOnOpen: false
      });

      areaAll.addEventListener('change', () => {
        selectedAreas = areaAll.checked
          ? new Set(availableAreas())
          : new Set();
        renderView({ animate: true });
      });

      areaOptions.addEventListener('change', event => {
        const input = event.target.closest('input[data-area-value]');
        if (!input) return;

        const area = input.dataset.areaValue;
        if (input.checked) selectedAreas.add(area);
        else selectedAreas.delete(area);

        renderView({ animate: true });
      });

      PFF.setupMetricSwitch({
        element: accessMetricSwitch,
        buttons: accessMetricSwitch.querySelectorAll('.metric-button'),
        valueAttribute: 'metric',
        initialValue: accessMetric,
        onChange(value) {
          accessMetric = value;
          renderView({ animate: true });
        }
      });

      chartInteractionController = PFFCharts.setupChartInteractions({
        canvas: chartCanvas,
        getChart: () => chart
      });

      responsiveController = PFFCharts.createResponsiveController({
        getChart: () => chart,
        observe: [app, chartShell],
        applyResponsiveChartOptions: false,
        onRefresh() {
          if (!chart || !activeModel) return;

          reorderAnimator.cancel();
          metricAnimator.cancel();
          axisTransitionState.active = false;
          axisTransitionState.progress = 1;
          axisTransitionState.fromAxis = null;
          axisTransitionState.toAxis = null;
          reorderState.active = false;
          reorderState.progress = 1;
          reorderState.fromYByKey = new Map();

          updateStageGeometry(activeModel, false);
          chart.options = chartOptions(activeModel, false);
          chart.resize();
          chart.update('none');
          tabsController?.update?.();
          headingScroller?.update?.();
        }
      });
    }

    PFF.initialiseApp({
      app,
      status: statusElement,
      load: loadAccessRows,

      render(loaded) {
        const decoded = decodeCacheRows(loaded.rows);
        practiceRows = decoded.practices;
        rawLocationRows = decoded.locations;

        if (practiceRows.length < CONFIG.minimumPractices) {
          throw new Error('No usable optometry practice rows were returned.');
        }

        if (!rawLocationRows.length) {
          throw new Error('No usable Localities rows were returned.');
        }

        accessUnits = buildAccessUnits(rawLocationRows);
        practiceSpatialIndex = buildPracticeSpatialIndex(practiceRows);
        nearestDistanceCache.clear();
        prepareAccessDistances();

        if (!accessUnits.some(unit => Number.isFinite(unit.distanceKm))) {
          throw new Error('No usable postcode-centroid access distances could be calculated.');
        }

        selectedAreas = new Set(availableAreas());

        setLoadedSourceIndicator(loaded);
        buildAreaMenu();
        configureControls();

        chartSummary = PFFCharts.ensureChartSummary({
          id: 'practiceAccessChartSummary',
          parent: app
        });

        chartCanvas.setAttribute('aria-describedby', chartSummary.id);
        renderView({ animate: false });
        return chart;
      },

      onError() {
        PFF.setDataSourceIndicator('unavailable', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });
      },

      errorMessage: 'Geographic access data unavailable.'
    });
  </script>
</body>
</html>
