<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best Optometry Workplaces</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --live-red: #e53935;
      --track: #e8eaf0;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --gold-bg: #fff7d9;
      --gold-border: #ead58a;
      --gold-ink: #78600a;

      --silver-bg: #f3f5f8;
      --silver-border: #d9dee6;
      --silver-ink: #657084;

      --bronze-bg: #faeee5;
      --bronze-border: #e8c9af;
      --bronze-ink: #8b5635;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow: hidden;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: clamp(6px, 2.5vh, 14px) 4px 2px;
      overflow: hidden;
      text-align: center;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      filter: none;
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }

    .response-summary {
      flex: 0 0 auto;
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: 5px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: clamp(11px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: clamp(18px, 6vw, 28px);
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: clamp(23px, 6vh, 31px);
      margin-top: 2px;
    }

    .live-data {
      position: absolute;
      bottom: 4px;
      right: 1px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: clamp(7px, 1.8vh, 9px);
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      text-transform: none;
      transform: none;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    h1 {
      flex: 0 0 auto;
      margin:
        clamp(7px, 4vh, 28px)
        12px
        clamp(5px, 2.5vh, 14px);
      color: var(--ink);
      font-size: clamp(13px, 3.8vw, 18px);
      font-weight: 700;
      line-height: 1.2;
    }

    /*
     * The podium area fills the remaining embed height.
     * JavaScript adjusts the row proportions according to the
     * number of employers in each box.
     */
    .podium-list {
      display: grid;
      flex: 1 1 0;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: clamp(4px, 1.4vh, 8px);
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .podium-row {
      display: grid;
      grid-template-columns:
        clamp(54px, 16vw, 78px)
        minmax(0, 1fr);
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--track);
      border-radius: clamp(4px, 1.4vh, 7px);
      text-align: left;
    }

    .medal {
      display: flex;
      min-width: 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
      padding: clamp(3px, 1.5vh, 8px);
      font-size: clamp(7px, 2.5vh, 12px);
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .result {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: clamp(0px, 0.4vh, 2px);
      padding:
        clamp(3px, 1.5vh, 10px)
        clamp(6px, 2.7vw, 14px);
      overflow: hidden;
      color: var(--ink);
      background: #fff;
      font-size: clamp(15px, 3.8vw, 18px);
      font-weight: 400;
      line-height: 1.18;
    }

    /*
     * Every employer remains on one line. Its font is reduced by
     * JavaScript only when the available box is too small.
     */
    .employer-line {
      display: block;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      line-height: 1.18;
      text-align: left;
      white-space: nowrap;
    }

    .gold {
      border-color: var(--gold-border);
    }

    .gold .medal {
      color: var(--gold-ink);
      background: var(--gold-bg);
    }

    .silver {
      border-color: var(--silver-border);
    }

    .silver .medal {
      color: var(--silver-ink);
      background: var(--silver-bg);
    }

    .bronze {
      border-color: var(--bronze-border);
    }

    .bronze .medal {
      color: var(--bronze-ink);
      background: var(--bronze-bg);
    }

    #status {
      flex: 0 0 auto;
      margin: 8px 8px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    #status[hidden] {
      display: none;
    }

    @media (max-width: 430px) {
      #app {
        padding-right: 3px;
        padding-left: 3px;
      }

      .podium-row {
        grid-template-columns:
          clamp(52px, 18vw, 70px)
          minmax(0, 1fr);
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loading-state"
        class="app-loading"
        role="status"
        aria-label="Loading"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading...</div>
      </div>

      <section class="response-summary" aria-live="polite">
        <div class="response-label">No. of responses</div>

        <div class="response-value-row">
          <div id="response-count" class="response-value"></div>

          <div class="live-data" aria-label="Live data">
            <span class="live-data-dot" aria-hidden="true"></span>
            <span>LIVE data</span>
          </div>
        </div>
      </section>

      <h1>Best optometry workplaces</h1>

      <div class="podium-list">
        <section class="podium-row gold">
          <div class="medal">Gold</div>
          <div id="gold-text" class="result"></div>
        </section>

        <section class="podium-row silver">
          <div class="medal">Silver</div>
          <div id="silver-text" class="result"></div>
        </section>

        <section class="podium-row bronze">
          <div class="medal">Bronze</div>
          <div id="bronze-text" class="result"></div>
        </section>
      </div>

      <p id="status" role="alert" hidden></p>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID = '1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ';
    const SHEET_GID = '0';
    const RESPONSE_CELL = 'BU2';
    const PODIUM_RANGE = 'AL64:AL66';

    const app = document.getElementById('app');
    const loadingState = document.getElementById('loading-state');
    const responseCount = document.getElementById('response-count');
    const podiumList = document.querySelector('.podium-list');

    const podiumRows = [
      { key: 'gold' },
      { key: 'silver' },
      { key: 'bronze' }
    ];

    function hideLoadingState() {
      app.classList.remove('is-loading');
      app.setAttribute('aria-busy', 'false');
      loadingState.setAttribute('aria-hidden', 'true');
      refreshPodiumLayout();
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function formatWorkplaceResult(value) {
      let text = (value || '').trim();

      text = text.replace(/^#(?:1|2|3)\s*/, '');

      const protectedNames = [
        ['George & Matilda', '__GEORGE_MATILDA__']
      ];

      protectedNames.forEach(([name, token]) => {
        text = text.replaceAll(name, token);
      });

      const employers = text
        .split(/\s+&\s+/)
        .map(name => name.trim())
        .filter(Boolean)
        .map(name => {
          protectedNames.forEach(([originalName, token]) => {
            name = name.replaceAll(token, originalName);
          });

          const visualNames = [
            ['Chemist/Optometrist Warehouse', 'Chemist Warehouse Optometry'],
            ['NIB (incl. the Optical Company)', 'The Optical Company (incl. NIB)'],
            ['Teacher’s Health Fund', 'Teachers Health'],
            ['Teachers Health Fund', 'Teachers Health'],
            ['George & Matilda', 'George & Matilda Eyecare'],
            ['1001', '1001 Optometry'],
            ['Bupa', 'Bupa Optical'],
            ['Costco', 'Costco Optical'],
            ['Dresden', 'Dresden Vision'],
            ['HCF', 'HCF Eyecare']
          ];

          visualNames.forEach(([storedName, displayName]) => {
            name = name.replace(
              new RegExp(escapeRegExp(storedName), 'g'),
              displayName
            );
          });

          return name;
        });

      return employers.length
        ? employers
        : ['No result available'];
    }

    function renderWorkplaceResult(target, value) {
      const employers = formatWorkplaceResult(value);

      const lines = employers.map((employer, index) => {
        const line = document.createElement('span');

        line.className = 'employer-line';
        line.textContent =
          index < employers.length - 1
            ? `${employer};`
            : employer;

        return line;
      });

      target.replaceChildren(...lines);
    }

    /*
     * Give boxes with more employers proportionally more height,
     * then reduce each employer line to fit its box.
     */
    function fitPodiumContents() {
      const results = [
        ...document.querySelectorAll('.result')
      ];

      const employerCounts = results.map(result =>
        Math.max(
          1,
          result.querySelectorAll('.employer-line').length
        )
      );

      podiumList.style.gridTemplateRows = employerCounts
        .map(count => `${count}fr`)
        .join(' ');

      requestAnimationFrame(() => {
        results.forEach(result => {
          const lines = [
            ...result.querySelectorAll('.employer-line')
          ];

          if (!lines.length) return;

          lines.forEach(line => {
            line.style.fontSize = '';
          });

          const styles = getComputedStyle(result);

          const paddingHeight =
            parseFloat(styles.paddingTop) +
            parseFloat(styles.paddingBottom);

          const gap =
            parseFloat(styles.rowGap || styles.gap) || 0;

          const availableHeight = Math.max(
            1,
            result.clientHeight -
            paddingHeight -
            gap * Math.max(0, lines.length - 1)
          );

          const normalFontSize =
            parseFloat(styles.fontSize) || 18;

          const maximumFontSize = Math.min(
            normalFontSize,
            availableHeight / (lines.length * 1.18)
          );

          lines.forEach(line => {
            let fontSize = Math.max(1, maximumFontSize);

            line.style.fontSize = `${fontSize}px`;

            if (
              line.clientWidth > 1 &&
              line.scrollWidth > line.clientWidth
            ) {
              fontSize *=
                line.clientWidth /
                line.scrollWidth;

              line.style.fontSize =
                `${Math.max(1, fontSize * 0.995)}px`;
            }
          });
        });
      });
    }

    let podiumLayoutFrame = null;

    function refreshPodiumLayout() {
      if (podiumLayoutFrame !== null) {
        cancelAnimationFrame(podiumLayoutFrame);
      }

      podiumLayoutFrame = requestAnimationFrame(() => {
        podiumLayoutFrame = null;
        fitPodiumContents();
      });
    }

    function getCellDisplayValue(cell) {
      if (!cell) return '';
      return String(cell.f ?? cell.v ?? '').trim();
    }

    function loadGvizRange(range) {
      return new Promise((resolve, reject) => {
        const callbackName =
          `bestWorkplacesCallback_${Date.now()}_${Math.floor(
            Math.random() * 100000
          )}`;

        const script = document.createElement('script');

        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error('Could not load data'));
        }, 10000);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = response => {
          cleanup();

          if (response?.status === 'error') {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                'Could not load Google Sheet data'
              )
            );

            return;
          }

          resolve(response);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('Could not load data'));
        };

        const params = new URLSearchParams({
          gid: SHEET_GID,
          range,
          headers: '0',
          tqx: `responseHandler:${callbackName}`
        });

        script.src =
          `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?` +
          params.toString();

        document.body.appendChild(script);
      });
    }

    function normaliseDashboard(responseData, podiumData) {
      const responseCell =
        responseData?.table?.rows?.[0]?.c?.[0];

      const resultRows =
        podiumData?.table?.rows || [];

      return {
        responseCount:
          getCellDisplayValue(responseCell) || '—',

        gold:
          getCellDisplayValue(resultRows?.[0]?.c?.[0]) || '',

        silver:
          getCellDisplayValue(resultRows?.[1]?.c?.[0]) || '',

        bronze:
          getCellDisplayValue(resultRows?.[2]?.c?.[0]) || ''
      };
    }

    function renderDashboard(data) {
      responseCount.textContent =
        data.responseCount || '—';

      podiumRows.forEach(({ key }) => {
        const target =
          document.getElementById(`${key}-text`);

        renderWorkplaceResult(
          target,
          data[key]
        );
      });

      hideLoadingState();
    }

    function showError(error) {
      console.error(error);

      responseCount.textContent = '—';

      podiumRows.forEach(({ key }) => {
        const target =
          document.getElementById(`${key}-text`);

        renderWorkplaceResult(
          target,
          '—'
        );
      });

      const status =
        document.getElementById('status');

      status.hidden = false;
      status.textContent =
        `Unable to load results: ${error.message || error}`;

      hideLoadingState();
    }

    async function loadDashboard() {
      try {
        const [responseData, podiumData] =
          await Promise.all([
            loadGvizRange(RESPONSE_CELL),
            loadGvizRange(PODIUM_RANGE)
          ]);

        renderDashboard(
          normaliseDashboard(
            responseData,
            podiumData
          )
        );
      } catch (error) {
        showError(error);
      }
    }

    if ('ResizeObserver' in window) {
      const podiumResizeObserver =
        new ResizeObserver(entries => {
          const hasUsableSize = entries.some(entry =>
            entry.contentRect.width > 1 &&
            entry.contentRect.height > 1
          );

          if (hasUsableSize) {
            refreshPodiumLayout();
          }
        });

      podiumResizeObserver.observe(app);
      podiumResizeObserver.observe(podiumList);
    }

    window.addEventListener(
      'resize',
      refreshPodiumLayout,
      { passive: true }
    );

    window.visualViewport?.addEventListener(
      'resize',
      refreshPodiumLayout,
      { passive: true }
    );

    window.addEventListener(
      'pageshow',
      refreshPodiumLayout
    );

    document.addEventListener(
      'visibilitychange',
      () => {
        if (!document.hidden) {
          refreshPodiumLayout();
        }
      }
    );

    if (document.fonts?.ready) {
      document.fonts.ready.then(
        refreshPodiumLayout
      );
    }

    document.addEventListener(
      'DOMContentLoaded',
      loadDashboard
    );
  </script>
</body>
</html>
