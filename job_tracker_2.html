<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optometry-Related Job Tracker</title>

  <script src="./assets/pff_chart_core.js?v=1.2.11-20260917"></script>

  <style>
    :root {
      --track: #f0f2f5;
      --row-line: #f8f9fa;
      --week-line: #cdd2da;

      --repeat-row: rgba(204, 0, 0, 0.08);
      --repeat-sticky: #fbebeb;
      --delisted: #989da6;

      --seek: #e5007d;
      --indeed: #2557a7;
      --essilux: #49b7e8;

      --metro: #3f4851;
      --nonmetro: #9f6545;

      --first-column-width: 58px;
    }

    body {
      -webkit-user-select: none;
      user-select: none;
    }

    input {
      font: inherit;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    #app {
      display: block;
      width: 100%;
      margin: 0;
      padding: 2px 4px;
    }

    #app.is-loading .content {
      display: none;
    }

    .app-loading {
      position: relative;
      inset: auto;
      z-index: auto;
      width: 100%;
      height: auto;
      min-height: 210px;
      background: transparent;
    }

    /* ==========================================================
     * CLICKABLE JOB SUMMARY
     * ========================================================== */

    .summary-module {
      width: 100%;
      margin: 0 0 10px;
      padding: 7px 5px 9px;
      background: #fff;
      border-bottom: 1px solid var(--track);
    }

    .summary-context {
      margin: 0 0 2px;
      color: var(--pff-ink);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      text-align: center;
    }

    .summary-lead {
      margin: 0 0 3px;
      color: var(--pff-ink);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      text-align: center;
    }

    .summary-timeline {
      width: 100%;
      min-width: 0;
      margin: 0 0 7px;
    }

    .summary-timeline-topline {
      display: flex;
      width: 100%;
      min-height: 15px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 1px;
    }

    .summary-timeline-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--pff-muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }

    .summary-timeline-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--pff-muted);
      font-size: 12px;
      line-height: 1;
    }

    .summary-period-value {
      min-width: 42px;
      color: var(--pff-muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .summary-slider-wrap {
      --summary-slider-progress: 100%;
      position: relative;
      width: 100%;
      min-height: 22px;
      margin: 0;
    }

    .summary-slider-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 1;
      height: 4px;
      transform: translateY(-50%);
      background:
        linear-gradient(
          to right,
          rgba(21, 21, 21, 0.72) 0,
          rgba(21, 21, 21, 0.72) var(--summary-slider-progress),
          var(--track) var(--summary-slider-progress),
          var(--track) 100%
        );
      border-radius: 999px;
      pointer-events: none;
    }

    .summary-slider-ticks {
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      z-index: 2;
      height: 10px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .summary-slider-tick {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 6px;
      transform: translate(-50%, -50%);
      background: var(--pff-muted);
      opacity: 0.38;
    }

    .summary-slider-tick.is-major {
      height: 10px;
      opacity: 0.58;
    }

    .summary-slider-labels {
      position: relative;
      width: calc(100% - 12px);
      height: 11px;
      margin: -2px 6px 0;
      color: var(--pff-muted);
      font-size: clamp(7px, 1.8vw, 9px);
      font-weight: 400;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .summary-slider-label {
      position: absolute;
      top: 0;
      white-space: nowrap;
    }

    .summary-slider-label:nth-child(1) {
      left: 0;
      transform: translateX(0);
      text-align: left;
    }

    .summary-slider-label:nth-child(2) {
      left: 33.333%;
      transform: translateX(-50%);
    }

    .summary-slider-label:nth-child(3) {
      left: 66.667%;
      transform: translateX(-50%);
    }

    .summary-slider-label:nth-child(4) {
      right: 0;
      text-align: right;
    }

    .summary-range {
      position: relative;
      z-index: 4;
      display: block;
      width: 100%;
      height: 22px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    .summary-range::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
      border-radius: 999px;
    }

    .summary-range::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -4px;
      appearance: none;
      -webkit-appearance: none;
      background: var(--pff-ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .summary-range::-moz-range-track,
    .summary-range::-moz-range-progress {
      height: 4px;
      background: transparent;
      border: 0;
      border-radius: 999px;
    }

    .summary-range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--pff-ink);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
    }

    .summary-range:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.20);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .summary-slider-drag-cue {
      position: absolute;
      top: -8px;
      left: calc(var(--summary-slider-progress) + 10px);
      z-index: 5;
      display: inline-block;
      color: var(--pff-muted);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      animation: summarySliderDragCue 1.7s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    .summary-slider-wrap.has-been-dragged .summary-slider-drag-cue,
    .summary-slider-wrap.only-one-period .summary-slider-drag-cue {
      display: none;
    }

    @keyframes summarySliderDragCue {
      0%, 12%, 100% {
        opacity: 0;
        transform: translateX(0);
      }

      28% {
        opacity: 0.78;
        transform: translateX(0);
      }

      54% {
        opacity: 0.88;
        transform: translateX(6px);
      }

      72% {
        opacity: 0.42;
        transform: translateX(8px);
      }
    }

    .summary-table-wrap {
      position: relative;
      width: 100%;
    }

    .summary-table-wrap::after {
      content: '';
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 20%;
      width: 1px;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          #fff 0%,
          rgba(21, 21, 21, 0.16) 10%,
          var(--pff-ink) 18%,
          rgba(21, 21, 21, 0.16) 82%,
          #fff 100%
        );
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .summary-table th,
    .summary-table td {
      position: relative;
      padding: 7px 2px;
      line-height: 1.15;
      text-align: center;
      vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }

    .summary-table th {
      color: var(--pff-muted);
      font-size: clamp(8px, 2.5vw, 12px);
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-table td {
      color: var(--pff-ink);
      font-size: clamp(11px, 3.1vw, 14px);
      font-weight: 400;
    }

    .summary-table th:first-child,
    .summary-table td:first-child {
      width: 20%;
    }

    .summary-table th + th,
    .summary-table td + td {
      border-left: 1px solid var(--track);
    }

    .summary-table th:nth-child(2),
    .summary-table td:nth-child(2) {
      border-left: 0;
    }

    .summary-table thead tr:last-child td {
      height: 0;
      padding: 0;
      line-height: 0;
      border-top: 1px solid var(--pff-ink);
    }

    .summary-table tbody tr:last-child td {
      border-top: 1px solid var(--pff-ink);
    }

    .summary-table .summary-row-label {
      color: var(--pff-ink);
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-table .summary-state-nsw { color: var(--pff-state-nsw); font-weight: 700; }
    .summary-table .summary-state-qld { color: var(--pff-state-qld); font-weight: 700; }
    .summary-table .summary-state-vic { color: var(--pff-state-vic); font-weight: 700; }
    .summary-table .summary-state-act { color: var(--pff-state-act); font-weight: 700; }
    .summary-table .summary-state-sa { color: var(--pff-state-sa); font-weight: 700; }
    .summary-table .summary-state-nt { color: var(--pff-state-nt); font-weight: 700; }
    .summary-table .summary-state-wa { color: var(--pff-state-wa); font-weight: 700; }
    .summary-table .summary-state-tas { color: var(--pff-state-tas); font-weight: 700; }

    .summary-table .summary-total-column {
      color: var(--pff-ink);
      font-weight: 700;
      border-left: 1px solid var(--pff-ink);
    }


    .summary-count-cell {
      padding: 2px !important;
    }

    .summary-count-button {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 4px 1px;
      color: var(--pff-ink);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      box-shadow: none;
      font: inherit;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        transform 150ms cubic-bezier(0.22, 1, 0.36, 1),
        background 150ms ease,
        border-color 150ms ease,
        box-shadow 150ms ease,
        color 150ms ease;
    }

    .summary-count-button:hover {
      z-index: 4;
      transform: translateY(-2px) scale(1.07);
      background: rgba(102, 0, 255, 0.07);
      border-color: rgba(102, 0, 255, 0.28);
      box-shadow: 0 4px 11px rgba(102, 0, 255, 0.13);
    }

    .summary-count-button:active {
      transform: translateY(0) scale(0.92);
      background: rgba(102, 0, 255, 0.14);
      box-shadow: 0 1px 3px rgba(102, 0, 255, 0.18);
      transition-duration: 70ms;
    }

    .summary-count-button:focus-visible {
      z-index: 4;
      outline: 2px solid rgba(102, 0, 255, 0.32);
      outline-offset: 1px;
    }

    .summary-count-button.is-selected {
      color: var(--pff-purple);
      background: rgba(102, 0, 255, 0.09);
      border-color: var(--pff-purple);
      box-shadow: inset 0 0 0 1px rgba(102, 0, 255, 0.10);
    }

    .summary-count-button.is-zero,
    .summary-count-button:disabled {
      color: #c5c9d0;
      font-weight: 400;
      cursor: default;
      pointer-events: none;
    }

    .summary-count-button.is-zero:hover,
    .summary-count-button.is-zero:focus-visible,
    .summary-count-button:disabled:hover,
    .summary-count-button:disabled:focus-visible {
      color: #c5c9d0;
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      transform: none;
      outline: none;
    }

    .summary-count-value {
      display: inline-block;
      min-width: 1ch;
      font-variant-numeric: tabular-nums;
    }

    .summary-source-inline {
      width: 100%;
      min-width: 0;
      justify-content: center;
      flex-wrap: wrap;
      column-gap: 4px;
      row-gap: 2px;
      margin: 0;
      font-size: clamp(6px, 1.8vw, 9px);
      letter-spacing: 0.04em;
    }

    .summary-source-last-updated {
      flex: 0 0 100%;
      width: 100%;
      min-width: 0;
      color: var(--pff-muted);
      font-size: clamp(5px, 1.35vw, 7px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.05;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .summary-source-last-updated[hidden] {
      display: none;
    }

    .summary-action-line {
      display: flex;
      min-height: 19px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin: 4px 0 0;
      color: var(--pff-muted);
      font-size: 9px;
      line-height: 1.2;
      text-align: center;
    }

    .summary-action-line.is-active {
      color: var(--pff-ink);
      font-weight: 700;
    }

    .summary-reset-button {
      display: none;
      min-height: 18px;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 1px 5px;
      color: var(--pff-muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      font-size: 8px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        transform 100ms ease;
    }

    .summary-action-line.is-active .summary-reset-button {
      display: inline-flex;
    }

    .summary-reset-button:hover {
      color: var(--pff-ink);
      border-color: var(--pff-ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.08);
    }

    .summary-reset-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .summary-reset-button:active {
      transform: scale(0.94);
    }

    .summary-reset-icon {
      display: inline-block;
      color: var(--pff-purple);
      font-size: 11px;
      line-height: 1;
    }

    @media (max-width: 520px) {
      .summary-module {
        padding-right: 2px;
        padding-left: 2px;
      }

      .summary-lead {
        font-size: 12px;
      }

      .summary-table th,
      .summary-table td {
        padding: 6px 1px;
      }

      .summary-table th {
        padding-right: 0;
        padding-left: 0;
        font-size: clamp(6px, 2.05vw, 10px);
        white-space: nowrap;
      }

      .summary-table td {
        font-size: clamp(9px, 2.8vw, 12px);
      }

      .summary-table .summary-row-label {
        padding-right: 1px;
        padding-left: 1px;
        font-size: clamp(8px, 2.55vw, 11px);
        white-space: nowrap;
      }

      .summary-count-cell {
        padding: 1px !important;
      }

      .summary-count-button {
        min-height: 27px;
        padding-right: 0;
        padding-left: 0;
        border-radius: 4px;
      }

      .summary-timeline-label,
      .summary-period-value {
        font-size: 9px;
      }
    }

    @media (max-width: 360px) {
      .summary-table th {
        font-size: 6px;
      }

      .summary-table .summary-row-label {
        font-size: 8px;
      }

      .summary-table th,
      .summary-table td {
        padding-right: 0;
        padding-left: 0;
      }
    }

    .content {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 6px 5px;
    }

    .status-group {
      min-width: 0;
    }

    .live-data-inline {
      margin: 0;
      font-size: 9px;
    }

    .last-updated-text {
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .table-status {
      margin: 5px 0 0;
      color: var(--pff-muted);
      font-size: 12px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .status-count {
      display: inline-block;
      width: 3ch;
      min-width: 3ch;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .repeat-count {
      display: inline-block;
      min-width: 1ch;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .controls-scroll-shell {
      position: relative;
      min-width: 0;
    }

    .controls-scroller {
      min-width: 0;
      overflow: visible;
    }

    .controls-scroll-arrow {
      top: 5px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }

    .filter-control {
      position: relative;
      flex: 0 0 auto;
    }

    .filter-button,
    .reset-button {
      flex: 0 0 auto;
    }

    .filter-button,
    .reset-button,
    .salary-control {
      height: 31px;
      min-height: 31px;
      box-sizing: border-box;
      padding: 0 3px;
      color: var(--pff-ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .filter-button,
    .reset-button {
      cursor: pointer;
    }

    .filter-button:hover,
    .filter-button[aria-expanded="true"],
    .reset-button:hover {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, .12);
    }

    .reset-button:hover {
      color: var(--pff-ink);
      border-color: var(--pff-ink);
    }

    .filter-button:focus-visible,
    .reset-button:focus-visible,
    .salary-input:focus-visible {
      outline: 2px solid rgba(102, 0, 255, .22);
      outline-offset: 2px;
    }

    .boolean-button {
      --filter-value-width: 23px;
      display: grid;
      grid-template-columns: 15px max-content var(--filter-value-width);
      width: max-content;
      min-width: 0;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-color: var(--track);
    }

    .boolean-button.is-on {
      border-color: var(--pff-purple);
    }

    .boolean-button:not(.is-on) .filter-value {
      color: var(--pff-muted);
    }

    #repeat-toggle.is-on {
      background: var(--repeat-row);
    }

    #delisted-toggle .filter-label {
      color: var(--delisted);
    }

    .binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      flex: 0 0 15px;
      border: 1px solid var(--pff-muted);
      border-radius: 2px;
      background: #fff;
    }

    .boolean-button.is-on .binary-indicator {
      border-color: var(--pff-purple);
      background: var(--pff-purple);
    }

    .boolean-button.is-on .binary-indicator::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .multi-button {
      --filter-value-width: 23px;
      display: grid;
      grid-template-columns: max-content var(--filter-value-width) 8px;
      width: max-content;
      min-width: 0;
      align-items: center;
      gap: 2px;
    }

    .filter-label-wrap {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 1px;
      text-align: left;
    }

    .filter-label {
      color: var(--pff-ink);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.05;
      white-space: nowrap;
    }

    .filter-subtext {
      color: var(--pff-muted);
      font-size: 8px;
      font-weight: 400;
      line-height: 1.05;
      white-space: nowrap;
    }

    .filter-value {
      display: inline-flex;
      width: var(--filter-value-width, 23px);
      min-width: var(--filter-value-width, 23px);
      align-items: center;
      justify-content: center;
      color: var(--pff-purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .025em;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .boolean-button .filter-value {
      width: var(--filter-value-width, 23px);
      min-width: var(--filter-value-width, 23px);
    }

    .menu-arrow {
      width: 0;
      height: 0;
      min-width: 0;
      flex: 0 0 auto;
      border-top: 4px solid var(--pff-muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .filter-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    #delisted-toggle,
    #repeat-toggle,
    #rurality-button,
    #state-button,
    #reset-button {
      min-width: 0;
      width: max-content;
    }

    .salary-control {
      min-width: 146px;
      display: grid;
      grid-template-columns: max-content auto;
      align-items: center;
      gap: 6px;
      cursor: text;
    }

    .salary-value {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      color: var(--pff-purple);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;

    .data-table .state-part-nsw {
      color: var(--pff-state-nsw);
    }

    .data-table .state-part-qld {
      color: var(--pff-state-qld);
    }

    .data-table .state-part-act {
      color: var(--pff-state-act);
    }

    .data-table .state-part-vic {
      color: var(--pff-state-vic);
    }

    .data-table .state-part-sa {
      color: var(--pff-state-sa);
    }

    .data-table .state-part-nt {
      color: var(--pff-state-nt);
    }

    .data-table .state-part-wa {
      color: var(--pff-state-wa);
    }

    .data-table .state-part-tas {
      color: var(--pff-state-tas);
    }

    .data-table tr.delisted-row .state-part {
      color: var(--delisted) !important;
    }
    .has-full-text {

    }

    .has-full-text:focus-visible {
      outline: 2px solid rgba(102, 0, 255, .22);
      outline-offset: -2px;
    }

    .full-text-popover {
      position: fixed;
      z-index: 200;
      display: none;
      max-width: min(320px, calc(100vw - 16px));
      padding: 7px 9px;
      color: var(--pff-ink);

    .full-text-popover.is-visible {

    .empty-state {

      padding: 42px 18px;

    }

    .error-state {

    @media (max-width: 900px) {
      .topbar {
        align-items: stretch;

      }

      .controls-scroller {

      .controls-scroller::-webkit-scrollbar {

      }

      .controls {

        min-width: 100%;
        flex-wrap: nowrap;

      }

      .filter-menu {
        position: fixed;
        right: auto;

        top: 8px;
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);

    }

    @media (max-width: 520px) {

        --first-column-width: 56px;

      .data-table th,

      .data-table th[data-column="A"],

      }

      .cone.green {

      }

      .cone.red {

      }      
    }

</head>

  <main id="app" class="is-loading">
    <div

          </div>

          <div class="summary-slider-labels" aria-hidden="true">
            <span class="summary-slider-label">3 mths</span>
            <span class="summary-slider-label">2 mths</span>
            <span class="summary-slider-label">1 mth</span>
            <span class="summary-slider-label">1 wk</span>
          </div>
        </div>

        <div class="summary-table-wrap">
          <table id="summary-table" class="summary-table">

      </section>

                  NT
                </label>

                    value="TAS"

                  TAS

                  class="salary-input"
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="6"
                  value="0"
                  aria-label="Minimum salary"
                  aria-invalid="false"
                >
              </span>
            </div>

            <button
              id="reset-button"
              class="reset-button"
              type="button"
              aria-label="Reset all filters"
            >
              <span>Reset filters</span>
              <span class="reset-icon" aria-hidden="true">↻</span>
            </button>
            </div>
          </div>

          <button
            class="heading-scroll-button heading-scroll-left controls-scroll-arrow controls-scroll-arrow-left is-hidden"
            type="button"
            aria-label="Scroll filters left"
          >‹</button>

          <button
            class="heading-scroll-button heading-scroll-right controls-scroll-arrow controls-scroll-arrow-right is-hidden"
            type="button"
            aria-label="Scroll filters right"
          >›</button>
        </div>
      </div>

      <div id="table-shell" class="table-shell">
        <div class="table-scroll">
          <table id="data-table" class="data-table">

    function sydneyToday() {
      const parts =
        new Intl.DateTimeFormat(
          'en-AU',
          {
            timeZone:
              'Australia/Sydney',

            year:
              'numeric',

            month:
              '2-digit',

            day:
              '2-digit'
          }
        ).formatToParts(
          new Date()
        );

      const values =
        Object.fromEntries(
          parts
            .filter(
              part =>
                part.type !==
                'literal'
            )
            .map(
              part => [
                part.type,
                Number(
                  part.value
                )
              ]
            )
        );

      return new Date(
        Date.UTC(
          values.year,
          values.month - 1,
          values.day
        )
      );
    }

    function subtractMonths(
      date,
      months
    ) {
      const first =
        new Date(
          Date.UTC(
            date.getUTCFullYear(),
            date.getUTCMonth() -
              months,
            1
          )
        );

      const lastDay =
        new Date(
          Date.UTC(
            first.getUTCFullYear(),
            first.getUTCMonth() + 1,
            0
          )
        ).getUTCDate();

      return new Date(
        Date.UTC(
          first.getUTCFullYear(),
          first.getUTCMonth(),

          Math.min(
            date.getUTCDate(),
            lastDay
          )
        )
      );
    }

    function parseDate(
      value
    ) {
      if (
        value instanceof Date &&
        !Number.isNaN(
          value.getTime()
        )
      ) {
        return new Date(
          Date.UTC(
            value.getFullYear(),
            value.getMonth(),
            value.getDate()
          )
        );
      }

      const text =
        clean(value);

      if (!text) {
        return null;
      }

      let match =
        text.match(
          /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/i
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]),
            Number(match[3])
          )
        );
      }

      match =
        text.match(
          /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
        );

      if (match) {
        let year =
          Number(
            match[3]
          );

        if (year < 100) {
          year += 2000;
        }

        return new Date(
          Date.UTC(
            year,
            Number(match[2]) - 1,
            Number(match[1])
          )
        );
      }

      match =
        text.match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );

      return match
        ? new Date(
            Date.UTC(
              Number(match[1]),
              Number(match[2]) - 1,
              Number(match[3])
            )
          )
        : null;
    }

    function dateFromCell(

    function formatDate(
      date,

      if (
        !date ||

      }

      const day =
        String(

          2,
          '0'
        );

      const month =
        String(
          date.getUTCMonth() + 1
        ).padStart(
          2,
          '0'
        );

      return includeYear
        ? `${
            day
          }/${
            month
          }/${
            date.getUTCFullYear()
          }`
        : `${day}/${month}`;
    }

    function mondayKey(
      date
    ) {
      const copy =
        new Date(
          date.getTime()
        );

      copy.setUTCDate(
        copy.getUTCDate() -
        (
          (
            copy.getUTCDay() +
            6
          ) %
          7
        )
      );

      return copy
        .toISOString()
        .slice(0, 10);
    }

    function cellText(

    function salaryValue(
      cell
    ) {
      if (
        typeof cell?.v ===
          'number' &&
        Number.isFinite(
          cell.v
        )
      ) {
        return cell.v;
      }

      const text =
        cellText(cell)
          .toLowerCase();

      if (
        !text ||
        text === 'xxx'
      ) {
        return null;
      }

      const values =
        [];

      const regex =
        /(?:\$|aud\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k)?/gi;

      let match;

      while (
        (
          match =
            regex.exec(text)
        )
      ) {
        let number =
          Number(
            match[1]
              .replace(
                /,/g,
                ''
              )
          );

        if (match[2]) {
          number *= 1000;
        }

        if (
          Number.isFinite(
            number
          )
        ) {
          values.push(
            number
          );
        }
      }

      return values.length
        ? Math.max(
            ...values
          )
        : null;
    }

    function buildLink(
      source,
      title,
      employer,
      suburb,
      stateCode
    ) {
      title =
        clean(title);

      employer =
        clean(employer);

      suburb =
        clean(suburb);

      stateCode =
        clean(stateCode);

      if (
        !title ||
        !employer

        return null;
      }

      const firstTitleWord =
        title.match(
          /^[A-Za-z0-9]+/
        )?.[0] ||
        '';

      const keywords =
        `"${firstTitleWord}" ${employer}`;

      const location =
        norm(suburb) === 'xxx'
          ? norm(stateCode) === 'xxx'
            ? 'All Australia'
            : stateCode
          : suburb
              .split(';')[0]
              .trim();

      const sourceText =
        norm(source);

      if (
        sourceText.endsWith(
          'indeed|'

        return {
          text:
            'Indeed',

          className:

          url:

            `&l=${
              encodeURIComponent(
                location
              )

            '&radius=0&sort=date'
        };
      }

      const employerKey =
        employer
          .replace(

            ''
          )
          .toLowerCase();

      if (
        /(opsm|eyeq|laubman&pank)/i

            '&optionsFacetsDD_customfield1=' +
            '&optionsFacetsDD_customfield2=' +
            '&optionsFacetsDD_customfield3=' +
            '&optionsFacetsDD_customfield4='

      }

      return {
        text:
          'SEEK',

        className:
          'link-seek',

        url:
          `https://www.seek.com.au/jobs?keywords=${
            encodeURIComponent(
              keywords
            )
          }` +
          `&where=${
            encodeURIComponent(
              location
            )
          }`
      };
    }

    /* ============================================================

    function summaryMonday(
      date
    ) {
      const result =
        new Date(
          Date.UTC(
            date.getUTCFullYear(),
            date.getUTCMonth(),
            date.getUTCDate()
          )
        );

      const daysSinceMonday =
        (
          result.getUTCDay() +
          6
        ) % 7;

      result.setUTCDate(
        result.getUTCDate() -
          daysSinceMonday
      );

      return result;
    }

    function summaryAddDays(
      date,
      days
    ) {
      const result =
        new Date(
          date.getTime()
        );

      result.setUTCDate(
        result.getUTCDate() +
          days
      );

      return result;
    }

    function summaryMondayOnOrAfter(
      date
    ) {
      const monday =
        summaryMonday(
          date
        );

      return monday.getTime() <
        date.getTime()
          ? summaryAddDays(
              monday,
              7
            )
          : monday;
    }

    function summaryFormatDayMonth(
      date
    ) {
      if (
        !(date instanceof Date) ||
        Number.isNaN(
          date.getTime()
        )
      ) {
        return '—';
      }

      const day =
        String(
          date.getUTCDate()
        ).padStart(
          2,
          '0'
        );

      const month =
        String(
          date.getUTCMonth() +
            1
        ).padStart(
          2,
          '0'
        );

      return `${day}/${month}`;
    }

    function summaryWeeksFromSlider() {

    function summaryPeriodStart() {

    function summaryPeriodEnd() {

    function summaryPeriodLabel() {

      return `${weeks} ${weeks === 1 ? 'wk' : 'wks'} · ${summaryFormatDayMonth(

    function rowMatchesSummaryPeriod(
      row
    ) {
      if (
        !(row.date instanceof Date) ||
        Number.isNaN(
          row.date.getTime()
        )
      ) {
        return false;
      }

      const start =
        summaryPeriodStart();

      const end =
        summaryPeriodEnd();

      return (
        row.date.getTime() >=
          start.getTime() &&
        row.date.getTime() <=
          end.getTime()
      );
    }

    function updateSummarySliderProgress() {
      const min =
        Number(
          summaryPeriodSlider.min
        );

      const max =
        Number(
          summaryPeriodSlider.max
        );

      const value =
        Number(
          summaryPeriodSlider.value
        );

      const progress =
        max === min
          ? 100
          : (
              (
                value -
                min
              ) /
              (
                max -
                min
              )
            ) * 100;

      summarySliderWrap.style.setProperty(
        '--summary-slider-progress',
        `${progress}%`
      );
    }

    function renderSummaryTicks() {
      summarySliderTicks.textContent =
        '';

      const count =
        state.summaryMaxWeeks;

      if (
        count <= 1
      ) {
        return;
      }

      for (
        let index = 0;
        index < count;
        index++
      ) {
        const tick =
          document.createElement(
            'span'
          );

        tick.className =
          'summary-slider-tick';

        tick.style.left =
          `${(
            index /
            (count - 1)
          ) * 100}%`;

        if (
          index === 0 ||
          index ===
            count - 1 ||
          (
            (
              count -
              1 -
              index
            ) % 4
          ) === 0
        ) {
          tick.classList.add(
            'is-major'
          );
        }

        summarySliderTicks.appendChild(
          tick
        );
      }
    }

    function prepareSummaryDataFromGviz(
      response
    ) {
      if (
        response?.status ===
        'error'
      ) {
        return;
      }

      const sourceRows =
        response?.table?.rows ||
        [];

      const summaryRows =
        [];

      const today =
        sydneyToday();

      let latestDate =
        null;

      sourceRows.forEach(
        sourceRow => {
          const cells =
            sourceRow?.c ||
            [];

          const resultValue =
            cellText(
              cells[0]
            );

          if (
            !resultValue
          ) {
            return;
          }

          const date =
            dateFromCell(
              cells[
                CONFIG
                  .columns
                  .date -
                1
              ]
            );

          if (
            !date ||
            date >
              today
          ) {
            return;
          }

          if (
            !latestDate ||
            date.getTime() >
              latestDate.getTime()
          ) {
            latestDate =
              date;
          }

          const repeatValue =
            cellText(
              cells[
                CONFIG
                  .columns
                  .repeat -
                1
              ]
            );

          const title =
            cellText(
              cells[
                CONFIG
                  .columns
                  .title -
                1
              ]
            );

          const stateValue =
            cellText(
              cells[
                CONFIG
                  .columns
                  .state -
                1
              ]
            );

          summaryRows.push({
            date,
            isNonDuplicate:
              norm(
                repeatValue
              ) ===
              'no',

            isOrthoptist:
              norm(
                title
              ).includes(
                'orthoptist'
              ),

            states:
              stateCodes(
                stateValue
              )
          });
        }
      );

      if (
        !latestDate
      ) {
        return;
      }

      state.summaryRows =
        summaryRows;

      state.summaryLatestDate =
        latestDate;

      state.summaryAnchorWeekStart =
        summaryMonday(
          latestDate
        );

      state.summaryAnchorWeekEnd =
        summaryAddDays(
          state.summaryAnchorWeekStart,
          6
        );

      const threeMonthCutoff =
        subtractMonths(
          latestDate,
          3
        );

      let oldestMonday =
        summaryMondayOnOrAfter(
          threeMonthCutoff
        );

      if (
        oldestMonday.getTime() >
        state.summaryAnchorWeekStart.getTime()
      ) {
        oldestMonday =
          state.summaryAnchorWeekStart;
      }

      const weekDifference =
        Math.round(
          (
            state.summaryAnchorWeekStart.getTime() -
            oldestMonday.getTime()
          ) /
          (
            7 *
            24 *
            60 *
            60 *
            1000
          )
        );

      state.summaryMaxWeeks =
        Math.max(
          1,
          weekDifference +
            1
        );

      state.summaryWeeksToShow =
        state.summaryMaxWeeks;

      state.summarySelection =
        null;

      summaryPeriodSlider.min =
        '1';

      summaryPeriodSlider.max =
        String(
          state.summaryMaxWeeks
        );

      summaryPeriodSlider.step =
        '1';

      summaryPeriodSlider.value =
        '1';

      summarySliderWrap.classList.toggle(
        'has-been-dragged',
        summarySliderHasBeenUsed
      );

      summarySliderWrap.classList.toggle(
        'only-one-period',
        state.summaryMaxWeeks <=
          1
      );

      renderSummaryTicks();
      renderSummaryCounts();
      updateSummaryActionLine();
    }

    function calculateSummaryCounts() {
      const counts = {};

      SUMMARY_ROW_TYPES.forEach(
        rowType => {
          counts[rowType] = {
            Total: 0
          };

          SUMMARY_STATE_CODES.forEach(
            stateCode => {
              counts[rowType][
                stateCode
              ] = 0;
            }
          );
        }
      );

      const start =
        summaryPeriodStart();

      const end =
        summaryPeriodEnd();

      state.summaryRows.forEach(
        row => {
          if (
            !row.isNonDuplicate
          ) {
            return;
          }

          if (
            row.date.getTime() <
              start.getTime() ||
            row.date.getTime() >
              end.getTime()
          ) {
            return;
          }

          /*
           * Total = every eligible non-duplicate job.
           */
          counts[
            'total'
          ].Total +=
            1;

          row.states.forEach(
            stateCode => {
              if (
                !SUMMARY_STATE_CODES.includes(
                  stateCode
                )
              ) {
                return;
              }

              counts[
                'total'
              ][
                stateCode
              ] +=
                1;
            }
          );

          /*
           * Every job also belongs to either
           * Orthoptist or Other.
           */
          const roleType =
            row.isOrthoptist
              ? 'orthoptist'
              : 'other';

          counts[
            roleType
          ].Total +=
            1;

          row.states.forEach(
            stateCode => {
              if (
                !SUMMARY_STATE_CODES.includes(
                  stateCode
                )
              ) {
                return;
              }

              counts[
                roleType
              ][
                stateCode
              ] +=
                1;
            }
          );
        }
      );

      return counts;
    }

      summaryTable

              null;

                ? counts[

            button.setAttribute(

            );
          }

      if (

    function updateSummarySelectedCell() {

      summaryTable

    function updateSummaryActionLine() {
      if (
        !state.summarySelection
      ) {
        summaryActionLine.classList.remove(
          'is-active'
        );

        summaryActionText.textContent =
          'Tap a number to filter jobs below';

        return;
      }

      const rowText =
        SUMMARY_ROW_LABELS[

        ];

    function setSummarySelection(
      rowType,
      stateCode
    ) {
      const nextKey =
        summarySelectionKey(
          rowType,
          stateCode
        );

      const currentKey =
        state.summarySelection
          ? summarySelectionKey(
              state.summarySelection.rowType,
              state.summarySelection.stateCode
            )
          : '';

      if (
        currentKey ===
        nextKey
      ) {
        clearSummarySelection(
          true
        );

        return;
      }

      state.summarySelection = {
        rowType,
        stateCode:
          stateCode ||
          null,
        startDate:
          summaryPeriodStart(),
        endDate:
          summaryPeriodEnd()
      };

      updateSummarySelectedCell();
      updateSummaryActionLine();
      applyFilters(
        true
      );
    }

    function clearSummarySelection(
      reapply =
        true
    ) {
      if (
        !state.summarySelection
      ) {
        return;
      }

      state.summarySelection =
        null;

      updateSummarySelectedCell();
      updateSummaryActionLine();

      if (
        reapply
      ) {
        applyFilters(
          true
        );
      }
    }

    function rowMatchesSummarySelection(
      row
    ) {
      const selection =
        state.summarySelection;

      if (
        !selection
      ) {
        return true;
      }

      if (
        !(row.date instanceof Date) ||
        Number.isNaN(
          row.date.getTime()
        )
      ) {
        return false;
      }

      if (
        row.date.getTime() <
          selection.startDate.getTime() ||
        row.date.getTime() >
          selection.endDate.getTime()
      ) {
        return false;
      }

      if (
        selection.rowType ===
          'orthoptist' &&
        !row.isOrthoptist
      ) {
        return false;
      }

      if (
        selection.rowType ===
          'other' &&
        row.isOrthoptist
      ) {
        return false;
      }

      if (
        selection.stateCode &&
        !row.states.includes(
          selection.stateCode
        )
      ) {
        return false;
      }

      return true;
    }

    function buildModel(
      response
    ) {
      if (
        response?.status ===
        'error'
      ) {
        throw new Error(
          response
            ?.errors?.[0]
            ?.detailed_message ||

          response
            ?.errors?.[0]
            ?.message ||

          'Google Sheets returned an error.'
        );
      }

      const columns =
        response
          ?.table
          ?.cols ||
        [];

      const rows =
        response
          ?.table
          ?.rows ||
        [];

      const retainedDateCutoff =
        state.summaryLatestDate instanceof Date &&
        !Number.isNaN(
          state.summaryLatestDate.getTime()
        )
          ? new Date(
              Math.min(
                state.cutoff.getTime(),
                subtractMonths(
                  state.summaryLatestDate,
                  3
                ).getTime()
              )
            )
          : state.cutoff;

      const shownColumns =
        visibleColumns();

      const headerNames = {
        4: 'Date',
        5: 'Job Title',
        6: 'Employer',
        7: 'Suburb',
        8: 'State',
        9: 'Postcode',
        10: 'Rurality',
        11: 'Employment Type',
        12: 'Days / Week',
        13: 'FTE Salary',
        14: 'Salary Includes Super'
      };

      const headers =
        shownColumns.map(
          column => ({
            column,

            text:
              headerNames[column] ||

              clean(
                columns[
                  column - 1
                ]?.label
              ) ||

              colLetter(
                column
              )
          })
        );

      const modelRows =
        [];

      rows.forEach(
        (
          sourceRow,
          index
        ) => {
          const cells =
            sourceRow?.c ||
            [];

          const sourceAText =
            cellText(
              cells[0]
            );

          if (!sourceAText) {
            return;
          }

          const date =
            dateFromCell(
              cells[
                CONFIG
                  .columns
                  .date -
                1
              ]
            );

          if (
            !date ||
            date <
              retainedDateCutoff
          ) {
            return;
          }

          const title =
            cellText(
              cells[
                CONFIG
                  .columns
                  .title -
                1
              ]
            );

          const employer =
            cellText(
              cells[
                CONFIG
                  .columns
                  .employer -
                1
              ]
            );

          const suburb =
            cellText(
              cells[
                CONFIG
                  .columns
                  .suburb -
                1
              ]
            );

          const stateValue =
            cellText(
              cells[
                CONFIG
                  .columns
                  .state -
                1
              ]
            );

          const rurality =
            cellText(
              cells[
                CONFIG
                  .columns
                  .rurality -
                1
              ]
            );

          const isDelisted =
            norm(
              sourceAText
            ).startsWith(
              'delisted'
            );

          const link =
            isDelisted
              ? null
              : buildLink(
                  cellText(
                    cells[
                      CONFIG
                        .columns
                        .source -
                      1
                    ]
                  ),

                  title,
                  employer,
                  suburb,
                  stateValue
                );

          const mms =
            mmCodes(
              rurality
            );

          modelRows.push({
            sourceRow:
              CONFIG.headerRow +
              1 +
              index,

            isRepeat:
              norm(
                cellText(
                  cells[
                    CONFIG
                      .columns
                      .repeat -
                    1
                  ]
                )
              ) === 'yes',

            date,

            isOrthoptist:
              norm(
                title
              ).includes(
                'orthoptist'
              ),

            isDelisted,

            states:
              stateCodes(
                stateValue
              ),

            hasMetro:
              mms.includes(
                'MM1'
              ),

            hasNonMetro:
              !mms.includes(
                'MM1'
              ) &&
              clean(rurality) !== '' &&
              norm(rurality) !== 'xxx',

            salary:
              salaryValue(
                cells[
                  CONFIG
                    .columns
                    .salary -
                  1
                ]
              ),

            week:
              mondayKey(
                date
              ),

            cells:
              shownColumns.map(
                column => {
                  if (
                    column === 1
                  ) {
                    return {
                      column,

                      text:
                        link?.text ||
                        sourceAText,

                      link:
                        link?.url ||
                        '',

                      linkClass:
                        link?.className ||
                        ''
                    };
                  }

                  let text =
                    column ===
                    CONFIG
                      .columns
                      .date
                      ? formatDate(
                          date,
                          false
                        )
                      : cellText(
                          cells[
                            column -
                            1
                          ]
                        );

                  if (
                    column ===
                    CONFIG
                      .columns
                      .employment
                  ) {
                    text =
                      employmentText(
                        text
                      );
                  } else {
                    text =
                      addSemicolonSpacing(
                        text
                      );
                  }

                  return {
                    column,
                    text,
                    link: '',
                    linkClass: ''
                  };
                }
              )
          });
        }
      );

      return {
        headers,
        rows:
          modelRows
      };
    }

      PFF.setDataSourceIndicator(

    function validateTrackerSnapshot(
      data
    ) {
      const headerLabels =
        Array.isArray(
          data?.headerLabels
        )
          ? data.headerLabels
          : [];

      const rows =
        Array.isArray(
          data?.rows
        )
          ? data.rows
          : [];

      if (
        headerLabels.length <
          CONFIG.lastColumn ||
        !rows.length
      ) {
        throw new Error(
          'Optometry-related job tracker data are incomplete.'
        );
      }

      return {
        headerLabels:
          headerLabels
            .slice(
              0,
              CONFIG.lastColumn
            )
            .map(
              value =>
                String(
                  value ??
                  ''
                )
            ),

        rows:
          rows.map(
            (
              row,
              rowIndex
            ) => {
              if (
                !Array.isArray(row) ||
                row.length <
                  CONFIG.lastColumn
              ) {
                throw new Error(
                  `Optometry-related job tracker row ${rowIndex + 1} is malformed.`
                );
              }

              return row
                .slice(
                  0,
                  CONFIG.lastColumn
                )
                .map(
                  value =>
                    String(
                      value ??
                      ''
                    )
                );
            }
          )
      };
    }

    function buildGvizResponseFromSnapshot(
      data
    ) {
      const validated =
        validateTrackerSnapshot(
          data
        );

      return {
        status:
          'ok',

        table: {
          cols:
            validated.headerLabels.map(
              label => ({
                label
              })
            ),

          rows:
            validated.rows.map(
              row => ({
                c:
                  row.map(
                    value => ({
                      v:
                        value
                    })
                  )
              })
            )
        }
      };

    function getLatestDateFromSnapshot(
      snapshot
    ) {
      const dateIndex =
        CONFIG.columns.date -
        1;

      const today =
        sydneyToday();

      const dates =
        snapshot.rows
          .map(
            row =>
              parseDate(
                row?.[dateIndex]
              )
          )
          .filter(
            date =>
              date &&
              date <= today
          )
          .sort(
            (a, b) =>
              b.getTime() -
              a.getTime()
          );

      return dates.length
        ? dates[0]
        : null;
    }

    function validSelection(
      value,
      allowed,
      fallback
    ) {
      return Array.isArray(
        value
      )
        ? [
            ...new Set(
              value.filter(
                item =>
                  allowed.includes(
                    item
                  )
              )
            )
          ]
        : [
            ...fallback
          ];
    }

    function normaliseSalary(
      value
    ) {
      const number =
        Number(value);

      return (
        Number.isFinite(
          number
        ) &&
        number >= 0
      )
        ? Math.min(
            Math.floor(
              number
            ),
            999999
          )
        : 0;
    }

    function updateMulti(
      name,
      selected,
      options,
      labels,
      empty
    ) {
      $$(
        `.${name}-checkbox`

        box => {
          box.checked =
            selected.includes(
              box.value

        }
      );

      const allBox =
        $(
          `#${name}-all`
        );

      allBox.checked =
        selected.length ===
        options.length;

        selected.length > 0 &&

        $(

      value.textContent =
        summary(
          selected,
          options,
          labels,
          empty
        );

      button
        .style

          selected.length === 0
            ? 'var(--track)'
            : selected.length === 1
              ? FILTER_OUTLINES[
                  name
                ][
                  selected[0]

              : 'var(--pff-purple)';

        .style
        .color =
          selected.length

    function positionMenu(
      button,
      menu
    ) {
      if (
        !matchMedia(
          '(max-width: 900px)'
        ).matches
      ) {
        menu.style.removeProperty(
          'left'
        );

        menu.style.removeProperty(
          'top'
        );

        return;
      }

      const buttonRect =
        button.getBoundingClientRect();

      const menuRect =
        menu.getBoundingClientRect();

      const margin =
        8;

      const left =
        Math.max(
          margin,

          Math.min(
            buttonRect.left,

            innerWidth -
            menuRect.width -
            margin
          )
        );

      let top =
        buttonRect.bottom +
        4;

      if (
        top +
        menuRect.height >
        innerHeight -
        margin
      ) {
        top =
          buttonRect.top -
          menuRect.height -
          4;
      }

      top =
        Math.max(
          margin,

          Math.min(
            top,

            innerHeight -
            menuRect.height -
            margin
          )
        );

      menu.style.left =
        `${
          Math.round(
            left
          )
        }px`;

      menu.style.top =
        `${
          Math.round(
            top
          )
        }px`;
    }

    function appendCell(
      td,
      cell
    ) {
      const full =
        displayText(
          cell.text
        );

      const shown =
        trimmed(
          cell.text
        );

      markFullText(
        td,
        full,
        shown
      );

      if (cell.link) {
        const anchor =
          document.createElement(
            'a'
          );

        anchor.href =
          cell.link;

        anchor.target =
          '_blank';

        anchor.rel =
          'noopener noreferrer';

        anchor.className =
          cell.linkClass;

        anchor.textContent =
          shown;

        anchor.setAttribute(
          'aria-label',

          `${
            full
          } — opens in a new tab`
        );

        if (
          full !== shown
        ) {
          anchor.title =
            full;
        }

        td.appendChild(
          anchor
        );
      } else {
        td.textContent =
          shown;
      }
    }

    function appendStateCell(
      td,
      cell
    ) {
      const full =
        displayText(
          cell.text
        );

      const shown =
        trimmed(
          cell.text
        );

      markFullText(
        td,
        full,
        shown
      );

      const statePattern =
        /\b(NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/gi;

      let lastIndex =
        0;

      let match;

      while (
        (
          match =
            statePattern.exec(
              shown
            )
        ) !== null
      ) {
        if (
          match.index >
            lastIndex
        ) {
          td.appendChild(
            document.createTextNode(
              shown.slice(
                lastIndex,
                match.index
              )
            )
          );
        }

        const code =
          match[0]
            .toUpperCase();

        const span =
          document.createElement(
            'span'
          );

        span.className =
          `state-part state-part-${code.toLowerCase()}`;

        span.textContent =
          match[0];

        td.appendChild(
          span
        );

        lastIndex =
          statePattern.lastIndex;
      }

      if (
        lastIndex ===
          0
      ) {
        td.textContent =
          shown;

        return;
      }

      if (
        lastIndex <
          shown.length
      ) {
        td.appendChild(
          document.createTextNode(
            shown.slice(
              lastIndex
            )
          )
        );
      }
    }

    function render(
      model
    ) {
      state.model =
        model;

      table.tHead.textContent =
        '';

      tbody.textContent =
        '';

      const headerRow =
        document.createElement(
          'tr'
        );

      model.headers.forEach(
        header => {
          const th =
            document.createElement(
              'th'
            );

          th.scope =
            'col';

          th.dataset.column =
            colLetter(
              header.column
            );

          const full =
            displayText(
              header.text
            );

          const shown =
            trimmed(
              header.text
            );

          th.textContent =
            shown;

          markFullText(
            th,
            full,
            shown
          );

          headerRow.appendChild(
            th
          );
        }
      );

      table.tHead.appendChild(
        headerRow
      );

      const fragment =
        document.createDocumentFragment();

      state.rows =
        model.rows.map(
          modelRow => {
            const tr =
              document.createElement(
                'tr'
              );

            if (
              modelRow.isRepeat
            ) {
              tr.classList.add(
                'repeat-row'
              );
            }

            if (
              modelRow.isDelisted
            ) {
              tr.classList.add(
                'delisted-row'
              );
            }

            tr.dataset.week =
              modelRow.week;

            modelRow.cells.forEach(
              cell => {
                const td =
                  document.createElement(
                    'td'
                  );

                td.dataset.column =
                  colLetter(
                    cell.column
                  );

                if (
                  cell.column ===
                  CONFIG
                    .columns
                    .state
                ) {
                  appendStateCell(
                    td,
                    cell
                  );
                } else {
                  appendCell(
                    td,
                    cell
                  );
                }

                if (
                  cell.column ===
                  CONFIG
                    .columns
                    .rurality
                ) {
                  const codes =
                    mmCodes(
                      cell.text
                    );

                  const ruralityValue =
                    clean(
                      cell.text
                    );

                  if (
                    codes.includes(
                      'MM1'
                    )
                  ) {
                    td.classList.add(
                      'rurality-metro'
                    );
                  } else if (
                    ruralityValue &&
                    norm(
                      ruralityValue
                    ) !== 'xxx'
                  ) {
                    td.classList.add(
                      'rurality-nonmetro'
                    );
                  }
                }

                tr.appendChild(
                  td
                );
              }
            );

            fragment.appendChild(
              tr
            );

            return {
              ...modelRow,
              element: tr,
              hidden: false
            };
          }
        );

      tbody.appendChild(
        fragment
      );

      sizeColumns(
        model
      );

      stickyHeaderController.sync();

      if (
        document.fonts?.ready
      ) {
        document.fonts.ready.then(
          () => {
            sizeColumns(
              model
            );

            stickyHeaderController.sync();
          }
        );
      }

      applyFilters(
        false
      );

      stickyHeaderController.update();
    }

    function sizeColumns(
      model
    ) {
      const colgroup =
        table.querySelector(
          'colgroup'
        );

      colgroup.textContent =
        '';

      const mobile =
        matchMedia(
          '(max-width: 520px)'
        ).matches;

      const canvas =
        document.createElement(
          'canvas'
        );

      const context =
        canvas.getContext(
          '2d'
        );

      let total =
        0;

      model.headers.forEach(
        (
          header,
          index
        ) => {
          context.font =
            mobile
              ? '700 11px Lato'
              : '700 12px Lato';

          let width =
            context.measureText(
              trimmed(
                header.text
              )
            ).width;

          context.font =
            mobile
              ? '400 11px Lato'
              : '400 12px Lato';

          model.rows.forEach(
            row => {
              width =
                Math.max(
                  width,

                  context.measureText(
                    trimmed(
                      row.cells[
                        index
                      ]?.text
                    )
                  ).width
                );
            }
          );

          width =
            Math.ceil(
              width +
              (
                mobile
                  ? 8
                  : 10
              )
            );

          if (
            header.column === 1
          ) {
            width =
              mobile
                ? 56
                : 58;
          } else if (
            header.column ===
            CONFIG
              .columns
              .date
          ) {
            width =
              mobile
                ? 60
                : 64;
          } else if (
            header.column ===
            CONFIG
              .columns
              .state
          ) {
            width =
              Math.min(
                width,

                mobile
                  ? 52
                  : 58
              );
          } else if (
            header.column ===
            CONFIG
              .columns
              .postcode
          ) {
            width =
              Math.max(
                mobile
                  ? 60
                  : 64,

                Math.min(
                  width,

                  mobile
                    ? 68
                    : 72
                )
              );
          } else if (
            header.column ===
            CONFIG
              .columns
              .rurality
          ) {
            width =
              Math.min(
                width,

                mobile
                  ? 86
                  : 94
              );
          } else {
            width =
              Math.max(
                mobile
                  ? 40
                  : 44,

                Math.min(
                  width,

                  mobile
                    ? 300
                    : 360
                )
              );
          }

          const col =
            document.createElement(
              'col'
            );

          col.style.width =
            `${width}px`;

          colgroup.appendChild(
            col
          );

          total +=
            width;

          if (
            header.column === 1
          ) {
            document.documentElement
              .style
              .setProperty(
                '--first-column-width',
                `${width}px`
              );
          }
        }
      );

      table.style.width =
        `${total}px`;

      table.style.minWidth =
        `${total}px`;
    }
