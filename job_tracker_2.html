    function matches(
      row
    ) {
      const filters =
        state.filters;

      const summaryActive =
        Boolean(
          state.summarySelection
        );

      if (
        !rowMatchesSummaryPeriod(
          row
        )
      ) {
        return false;
      }

      if (
        !filters.showDelisted &&
        row.isDelisted
      ) {
        return false;
      }

      if (
        !filters.showRepeats &&
        row.isRepeat
      ) {
        return false;
      }

      if (
        filters
          .rurality
          .length !==
        OPTIONS
          .rurality
          .length
      ) {
        const locationMatch =
          (
            filters
              .rurality
              .includes(
                'metro'
              ) &&
            row.hasMetro
          ) ||
          (
            filters
              .rurality
              .includes(
                'nonmetro'
              ) &&
            row.hasNonMetro
          );

        if (
          !locationMatch
        ) {
          return false;
        }
      }

      /*
       * A summary click temporarily replaces the normal State filter.
       * Other detailed-table filters remain active.
       */
      if (
        !summaryActive &&
        filters
          .states
          .length !==
          OPTIONS
            .state
            .length &&

        !row
          .states
          .some(
            code =>
              filters
                .states
                .includes(
                  code
                )
          )
      ) {
        return false;
      }

      if (
        !rowMatchesSummarySelection(
          row
        )
      ) {
        return false;
      }

      if (
        filters.salary > 0 &&

        !(
          Number.isFinite(
            row.salary
          ) &&

          row.salary >=
            filters.salary
        )
      ) {
        return false;
      }

      return true;
    }

    function calculateFilterResult() {
      let visibleCount =
        0;

      let visibleRepeatCount =
        0;

      const rows =
        state.rows.map(
          row => {
            const hidden =
              !matches(
                row
              );

            if (
              !hidden
            ) {
              visibleCount++;

              if (
                row.isRepeat
              ) {
                visibleRepeatCount++;
              }
            }

            return {
              row,
              hidden
            };
          }
        );

      const totalCount =
        state.rows.filter(
          row => {
            if (
              !rowMatchesSummaryPeriod(
                row
              )
            ) {
              return false;
            }

            if (
              state.summarySelection
            ) {
              return rowMatchesSummarySelection(
                row
              );
            }

            return true;
          }
        ).length;

      return {
        rows,
        visibleCount,
        visibleRepeatCount,
        totalCount
      };
    }

    function updateStatusCounts(
      visibleCountValue,
      visibleRepeatCount,
      totalCountValue
    ) {
      visibleCountCounter.set(
        visibleCountValue -
          visibleRepeatCount
      );

      repeatCountCounter.set(
        visibleRepeatCount
      );

      totalCountCounter.set(
        totalCountValue
      );

      tablePeriodLabel.textContent =
        tablePeriodText();
    }

    function commitFilterResult(
      result
    ) {
      result.rows.forEach(
        ({
          row,
          hidden
        }) => {
          row.hidden =
            hidden;

          row.element
            .classList.toggle(
              'is-hidden',
              hidden
            );
        }
      );

      refreshWeekDividers();

      emptyState
        .classList
        .toggle(
          'is-visible',
          result.visibleCount ===
            0
        );

      table.style.display =
        result.visibleCount
          ? ''
          : 'none';
    }

    function applyFilters(
      animate = true
    ) {
      const result =
        calculateFilterResult();

      /*
       * Update the displayed counts immediately so slider dragging
       * retargets X, repeats and Z at every intermediate week.
       */
      updateStatusCounts(
        result.visibleCount,
        result.visibleRepeatCount,
        result.totalCount
      );

      const reducedMotion =
        PFF.reducedMotion();

      const token =
        ++filterAnimationToken;

      tbody
        .getAnimations()
        .forEach(
          animation =>
            animation.cancel()
        );

      if (
        !animate ||
        reducedMotion ||
        !tbody.children.length
      ) {
        commitFilterResult(
          result
        );

        return;
      }

      const fadeOut =
        tbody.animate(
          [
            {
              opacity: 1,
              transform:
                'translateY(0)'
            },

            {
              opacity: 0.60,
              transform:
                'translateY(-2px)'
            }
          ],
          {
            duration: 180,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      fadeOut.onfinish =
        () => {
          if (
            token !==
            filterAnimationToken
          ) {
            return;
          }

          fadeOut.cancel();

          commitFilterResult(
            result
          );

          const fadeIn =
            tbody.animate(
              [
                {
                  opacity: 0.60,
                  transform:
                    'translateY(-2px)'
                },

                {
                  opacity: 1,
                  transform:
                    'translateY(0)'
                }
              ],
              {
                duration: 280,
                easing:
                  'cubic-bezier(0.2, 0.8, 0.2, 1)'
              }
            );

          fadeIn.onfinish =
            () => {
              fadeIn.cancel();
            };
        };
    }

    function refreshWeekDividers() {
      state.rows.forEach(
        row =>
          row.element
            .classList
            .remove(
              'week-divider'
            )
      );

      const rows =
        state.rows.filter(
          row =>
            !row.hidden
        );

      for (
        let index = 0;
        index <
          rows.length - 1;
        index++
      ) {
        if (
          rows[index].week &&

          rows[index + 1].week &&

          rows[index].week !==
          rows[index + 1].week
        ) {
          rows[index]
            .element
            .classList
            .add(
              'week-divider'
            );
        }
      }
    }

    

    

    

    function commitFilters() {
      saveFilters();
      updateControls();

      applyFilters(
        true
      );
    }

    function setSelection(
      name,
      value,
      checked
    ) {
      const selected =
        new Set(
          state.filters[
            name
          ]
        );

      checked
        ? selected.add(
            value
          )
        : selected.delete(
            value
          );

      const allowed =
        name === 'states'
          ? OPTIONS.state
          : OPTIONS[name];

      state.filters[name] =
        allowed.filter(
          item =>
            selected.has(
              item
            )
        );

      commitFilters();
    }

    

    

    function showError(
      error
    ) {
      console.error(
        error
      );

      setDataSource(
        'unavailable'
      );

      setLastUpdatedDate(
        null
      );

      hideLoadingState();

      tableShell.style.display =
        'none';

      document
        .getElementById(
          'table-status'
        )
        .textContent =
          '';

      errorState.textContent =
        'Please refresh the page';

      errorState.classList.add(
        'is-visible'
      );
    }

    async function loadTable() {
      let liveError =
        null;

      let remoteCacheError =
        null;

      if (
        !FORCE_CACHED_DATA
      ) {
        try {
          const snapshot =
            await PFF.retryAsync(
              () =>
                loadLiveTrackerSnapshot(),
              {
                attempts:
                  CONFIG.liveAttempts,
                delayMs:
                  CONFIG.liveRetryDelay,
                onAttemptError:
                  error => {
                    liveError =
                      error;
                  }
              }
            );

          saveBrowserTrackerSnapshot(
            snapshot,
            {
              source: 'live'
            }
          );

          renderTrackerSnapshot(
            snapshot,
            'live'
          );

          return;
        } catch (
          error
        ) {
          liveError =
            error;
        }
      }

      try {
        const remote =
          await loadRemoteTrackerSnapshot();

        saveBrowserTrackerSnapshot(
          remote.snapshot,
          {
            source:
              'remote-cache',
            remoteCachedAt:
              remote.cachedAt
          }
        );

        renderTrackerSnapshot(
          remote.snapshot,
          'cached'
        );

        return;
      } catch (
        error
      ) {
        remoteCacheError =
          error;
      }

      try {
        const browser =
          loadBrowserTrackerSnapshot();

        renderTrackerSnapshot(
          browser.snapshot,
          'cached'
        );

        return;
      } catch (
        browserCacheError
      ) {
        console.error(
          'Live optometry-related job tracker load failed',
          liveError
        );

        console.error(
          'Backend optometry-related job tracker cache load failed',
          remoteCacheError
        );

        console.error(
          'Browser optometry-related job tracker cache load failed',
          browserCacheError
        );

        showError(
          browserCacheError
        );
      }
    }

    

    ensureSummaryTableStructure();

    summaryPeriodSlider.addEventListener(
      'input',
      () => {
        summarySliderHasBeenUsed =
          true;

        summarySliderWrap.classList.add(
          'has-been-dragged'
        );

        renderSummaryCounts();
        applyFilters(
          true
        );
      }
    );

    summaryTable.addEventListener(
      'click',
      event => {
        const button =
          event.target.closest(
            '.summary-count-button'
          );

        if (
          !button ||
          button.disabled ||
          button.classList.contains(
            'is-zero'
          )
        ) {
          return;
        }

        setSummarySelection(
          button.dataset.rowType,
          button.dataset.stateCode ||
            null
        );
      }
    );

    summaryResetButton.addEventListener(
      'click',
      () => {
        clearSummarySelection(
          true
        );
      }
    );

    $('#delisted-toggle')
      .addEventListener(
        'click',

        () => {
          state.filters
            .showDelisted =
              !state.filters
                .showDelisted;

          commitFilters();
        }
      );

    $('#repeat-toggle')
      .addEventListener(
        'click',

        () => {
          state.filters
            .showRepeats =
              !state.filters
                .showRepeats;

          commitFilters();
        }
      );

    $('#rurality-all')
      .addEventListener(
        'change',

        event => {
          state.filters
            .rurality =
              event.target.checked
                ? [
                    ...OPTIONS.rurality
                  ]
                : [];

          commitFilters();
        }
      );

    $$('.rurality-checkbox')
      .forEach(
        box =>
          box.addEventListener(
            'change',

            () =>
              setSelection(
                'rurality',
                box.value,
                box.checked
              )
          )
      );

    $('#state-all')
      .addEventListener(
        'change',

        event => {
          clearSummarySelection(
            false
          );

          state.filters
            .states =
              event.target.checked
                ? [
                    ...OPTIONS.state
                  ]
                : [];

          commitFilters();
        }
      );

    $$('.state-checkbox')
      .forEach(
        box =>
          box.addEventListener(
            'change',

            () => {
              clearSummarySelection(
                false
              );

              setSelection(
                'states',
                box.value,
                box.checked
              );
            }
          )
      );

    salaryInput
      .addEventListener(
        'focus',

        () => {
          if (
            salaryInput.value ===
            '0'
          ) {
            salaryInput.select();
          }
        }
      );

    salaryInput
      .addEventListener(
        'click',

        () => {
          if (
            salaryInput.value ===
            '0'
          ) {
            salaryInput.select();
          }
        }
      );

    salaryInput
      .addEventListener(
        'input',

        () => {
          const digits =
            salaryInput.value
              .replace(
                /\D/g,
                ''
              )
              .slice(
                0,
                6
              )
              .replace(
                /^0+(?=\d)/,
                ''
              );

          salaryInput.value =
            digits;

          state.filters
            .salary =
              digits
                ? Number(
                    digits
                  )
                : 0;

          salaryControl
            .style
            .borderColor =
              state.filters
                .salary > 0
                ? 'var(--pff-purple)'
                : 'var(--track)';

          saveFilters();

          applyFilters(
            true
          );
        }
      );

    salaryInput
      .addEventListener(
        'blur',

        () => {
          if (
            !salaryInput.value
          ) {
            salaryInput.value =
              '0';

            state.filters
              .salary =
                0;

            salaryControl
              .style
              .borderColor =
                'var(--track)';

            saveFilters();

            applyFilters(
              true
            );
          }
        }
      );

    $('#reset-button')
      .addEventListener(
        'click',

        () => {
          clearSummarySelection(
            false
          );

          state.filters =
            structuredClone(
              DEFAULT_FILTERS
            );

          summarySliderHasBeenUsed =
            false;

          summaryPeriodSlider.value =
            '1';

          summarySliderWrap.classList.remove(
            'has-been-dragged'
          );

          renderSummaryCounts();

          closeMenus();
          fullTextPopoverController.close();
          commitFilters();
        }
      );

    controlsScroller
      .addEventListener(
        'scroll',

        () => {
          closeMenus();
        },

        {
          passive: true
        }
      );

    window.addEventListener(
      'resize',

      () => {
        closeMenus();
        scheduleColumnWidths();
      }
    );

    updateControls();
    loadTable();
  </script>
</body>
</html>
