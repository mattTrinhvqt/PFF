<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optometry-Related Job Tracker</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #f0f2f5;
      --row-line: #f8f9fa;
      --week-line: #cdd2da;

      --repeat-row: rgba(204, 0, 0, 0.08);
      --repeat-sticky: #fbebeb;
      --delisted: #989da6;

      --seek: #e5007d;
      --indeed: #2557a7;
      --essilux: #49b7e8;

      --metro: #3f4851;
      --nonmetro: #9f6545;

      --state-nsw: #2db7f5;
      --state-qld: #7a0036;
      --state-act: #7b61ff;
      --state-vic: #2d3a8c;
      --state-sa: #f03a47;
      --state-nt: #c25e00;
      --state-wa: #000000;
      --state-tas: #22a36b;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
      --cached-amber: #c27c00;

      --first-column-width: 58px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: "Lato", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button,
    input {
      font: inherit;
    }

    input {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    } 
    button {
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 2px 4px;
    }

    #app.is-loading .content {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .content {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 6px 5px;
    }

    .status-group {
      min-width: 0;
    }

    .live-data-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e53935;
    }

    .live-data-inline.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    .live-data-inline.is-unavailable .live-data-dot {
      background: var(--muted);
    }

    .table-status {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .status-count {
      display: inline-block;
      width: 3ch;
      min-width: 3ch;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .controls-scroll-shell {
      position: relative;
      min-width: 0;
    }

    .controls-scroller {
      min-width: 0;
      overflow: visible;
    }

    .controls-scroll-arrow {
      position: absolute;
      top: 5px;
      z-index: 3;

      display: none;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding-bottom: 2px;      

      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;

      font-size: 18px;
      font-weight: 700;
      line-height: 1;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 160ms ease;
    }

    .controls-scroll-arrow-left {
      left: 0;
    }

    .controls-scroll-arrow-right {
      right: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }

    .filter-control {
      position: relative;
      flex: 0 0 auto;
    }

    .filter-button,
    .reset-button,
    .salary-control {
      min-height: 31px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .filter-button,
    .reset-button {
      cursor: pointer;
    }

    .filter-button:hover,
    .filter-button[aria-expanded="true"],
    .reset-button:hover {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, .12);
    }

    .reset-button:hover {
      color: var(--ink);
      border-color: var(--ink);
    }

    .filter-button:focus-visible,
    .reset-button:focus-visible,
    .salary-input:focus-visible {
      outline: 2px solid rgba(102, 0, 255, .22);
      outline-offset: 2px;
    }

    .boolean-button {
      display: grid;
      grid-template-columns: 15px max-content 32px 8px;
      align-items: center;
      gap: 4px;
    }

    .boolean-button::after {
      content: "";
      width: 8px;
      height: 1px;
    }

    .boolean-button.is-on {
      border-color: var(--purple);
    }

    .boolean-button:not(.is-on) .filter-value {
      color: var(--muted);
    }

    #repeat-toggle.is-on {
      background: var(--repeat-row);
    }

    #delisted-toggle .filter-label {
      color: var(--delisted);
    }

    .binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .boolean-button.is-on .binary-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .boolean-button.is-on .binary-indicator::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .multi-button {
      display: grid;
      grid-template-columns: max-content 70px 8px;
      align-items: center;
      gap: 4px;
    }

    .filter-label-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 1px;
    }

    .filter-label {
      font-size: 11px;
      line-height: 1.05;
      white-space: nowrap;
    }

    .filter-subtext {
      color: var(--muted);
      font-size: 8px;
      line-height: 1.05;
      white-space: nowrap;
    }

    .filter-value {
      display: inline-block;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .025em;
      text-align: right;
      white-space: nowrap;
    }

    .boolean-button .filter-value {
      width: 32px;
      min-width: 32px;
    }

    .menu-arrow {
      width: 0;
      height: 0;
      border-top: 4px solid var(--muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .filter-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    #delisted-toggle {
      min-width: 130px;
    }

    #repeat-toggle {
      min-width: 194px;
    }

    #rurality-button {
      min-width: 206px;
      grid-template-columns: max-content 60px 8px;
    }

    #state-button {
      min-width: 124px;
      grid-template-columns: max-content 58px 8px;
    }

    .salary-control {
      min-width: 146px;
      display: grid;
      grid-template-columns: max-content auto;
      align-items: center;
      gap: 6px;
      cursor: text;
    }

    .salary-value {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .salary-input {
      width: 48px;
      min-width: 48px;
      height: 22px;
      padding: 0;
      color: var(--purple);
      background: #fff;
      border: 0;
      outline: 0;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      text-align: left;
      -moz-appearance: textfield;
    }

    .reset-button {
      min-width: 94px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .reset-icon {
      color: var(--purple);
      font-size: 15px;
    }

    .filter-menu {
      position: absolute;
      z-index: 50;
      top: calc(100% + 4px);
      right: 0;
      display: none;
      min-width: 164px;
      padding: 5px 0;
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, .12);
    }
    #rurality-menu {
      min-width: 190px;
    }
    .filter-menu.is-open {
      display: block;
    }

    .filter-menu-title {
      margin: 0;
      padding: 6px 10px 7px;
      color: var(--muted);
      border-bottom: 1px solid var(--track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .filter-option:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .filter-option input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--purple);
    }

    .filter-option-all {
      border-bottom: 1px solid var(--track);
      font-weight: 700;
    }

    .rurality-option-metro {
      color: var(--metro);
      font-weight: 700;
    }

    .rurality-option-nonmetro {
      color: var(--nonmetro);
      font-weight: 700;
    }

    .data-table td.rurality-metro {
      color: var(--metro) !important;
      font-weight: 700;
    }

    .data-table td.rurality-nonmetro {
      color: var(--nonmetro) !important;
      font-weight: 700;
    }

    .state-filter-nsw {
      color: var(--state-nsw);
      font-weight: 700;
    }

    .state-filter-qld {
      color: var(--state-qld);
      font-weight: 700;
    }

    .state-filter-act {
      color: var(--state-act);
      font-weight: 700;
    }

    .state-filter-vic {
      color: var(--state-vic);
      font-weight: 700;
    }

    .state-filter-sa {
      color: var(--state-sa);
      font-weight: 700;
    }

    .state-filter-nt {
      color: var(--state-nt);
      font-weight: 700;
    }

    .state-filter-wa {
      color: var(--state-wa);
      font-weight: 700;
    }

    .state-filter-tas {
      color: var(--state-tas);
      font-weight: 700;
    }

    .table-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
      border-bottom: 1px solid var(--track);
      isolation: isolate;
    }

    .table-shell::after {
      content: "";
      position: absolute;
      z-index: 12;
      top: 0;
      bottom: 0;
      left: var(--first-column-width);
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .table-scroll {
      width: 100%;
      max-height: calc(100vh - 94px);
      overflow: auto;
      overscroll-behavior-x: contain;
      overscroll-behavior-y: auto;
      scrollbar-gutter: stable;
    }

    .data-table {
      width: max-content;
      min-width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    .data-table thead {
      position: sticky;
      z-index: 7;
      top: 0;
      background: #fff;
    }

    .data-table thead::after {
      content: "";
      position: absolute;
      z-index: 13;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      pointer-events: none;
      background: var(--ink);
    }

    .data-table th,
    .data-table td {
      position: relative;
      padding: 6px;
      border-right: 1px solid var(--track);
      border-bottom: 1px solid var(--row-line);
      line-height: 1.2;
      text-align: left;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: clip;
      white-space: nowrap;
    }

    .data-table th {
      color: var(--muted);
      background: #fff;
      border-bottom: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .data-table td {
      color: var(--ink);
      background: #fff;
      font-size: 12px;
    }

    .data-table th:last-child,
    .data-table td:last-child {
      border-right: 0;
    }

    .data-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .data-table tbody tr:hover td {
      filter: brightness(0.988);
    }

    .data-table tr.week-divider td {
      border-bottom: 1px solid var(--week-line);
      box-shadow: inset 0 -1px 0 var(--week-line);
    }

    .data-table tr.repeat-row td {
      background: var(--repeat-row);
    }

    .data-table tr.repeat-row td[data-column="A"] {
      background: var(--repeat-sticky);
    }

    .data-table tr.delisted-row td,
    .data-table tr.delisted-row a {
      color: var(--delisted) !important;
    }

    .data-table tr.is-hidden {
      display: none;
    }

    .data-table a {
      color: var(--purple);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      -webkit-user-drag: none;
    }

    .data-table a:hover {
      text-decoration-thickness: 2px;
    }

    .data-table a.link-seek {
      color: var(--seek);
    }

    .data-table a.link-indeed {
      color: var(--indeed);
    }

    .data-table a.link-essilux {
      color: var(--essilux);
    }

    .data-table th[data-column="A"],
    .data-table td[data-column="A"] {
      position: sticky;
      left: 0;
      width: var(--first-column-width);
      min-width: var(--first-column-width);
      max-width: var(--first-column-width);
      padding-right: 4px;
      padding-left: 4px;
      overflow: hidden;
      background: #fff;
      background-clip: padding-box;
      text-overflow: clip;
      white-space: nowrap;
    }

    .data-table th[data-column="A"] {
      z-index: 11;
    }

    .data-table td[data-column="A"] {
      z-index: 5;
      font-weight: 700;
    }

    .data-table td.state-nsw {
      color: var(--state-nsw) !important;
      font-weight: 700;
    }

    .data-table td.state-qld {
      color: var(--state-qld) !important;
      font-weight: 700;
    }

    .data-table td.state-act {
      color: var(--state-act) !important;
      font-weight: 700;
    }

    .data-table td.state-vic {
      color: var(--state-vic) !important;
      font-weight: 700;
    }

    .data-table td.state-sa {
      color: var(--state-sa) !important;
      font-weight: 700;
    }

    .data-table td.state-nt {
      color: var(--state-nt) !important;
      font-weight: 700;
    }

    .data-table td.state-wa {
      color: var(--state-wa) !important;
      font-weight: 700;
    }

    .data-table td.state-tas {
      color: var(--state-tas) !important;
      font-weight: 700;
    }

    .has-full-text {
      cursor: help;
    }

    .has-full-text:focus-visible {
      outline: 2px solid rgba(102, 0, 255, .22);
      outline-offset: -2px;
    }

    .full-text-popover {
      position: fixed;
      z-index: 200;
      display: none;
      max-width: min(320px, calc(100vw - 16px));
      padding: 7px 9px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: 0 7px 20px rgba(21, 21, 21, .16);
      font-size: 12px;
      line-height: 1.35;
      white-space: normal;
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    .full-text-popover.is-visible {
      display: block;
    }

    .empty-state {
      display: none;
      padding: 42px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .empty-state.is-visible {
      display: block;
    }

    .error-state {
      display: none;
      max-width: 720px;
      margin: 20px auto;
      padding: 18px;
      color: var(--muted);
      background: #fff;
      border-top: 1px solid var(--track);
      border-bottom: 1px solid var(--track);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .error-state.is-visible {
      display: block;
    }
    @media (max-width: 900px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 4px;
      }
      .controls-scroll-shell {
        width: 100%;
      }

      .controls-scroll-arrow {
        display: inline-flex;
      }

      .controls-scroll-shell.can-scroll-left
        .controls-scroll-arrow-left {
        opacity: 0.72;
      }

      .controls-scroll-shell.can-scroll-right
        .controls-scroll-arrow-right {
        opacity: 0.72;
      }

      .controls-scroller {
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 2px;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .controls-scroller::-webkit-scrollbar {
        display: none;
      }

      .controls {
        width: max-content;
        min-width: 100%;
        flex-wrap: nowrap;
        justify-content: flex-start;
      }

      .filter-menu {
        position: fixed;
        right: auto;
        left: 8px;
        top: 8px;
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);
        overflow-y: auto;
      }

      .table-scroll {
        max-height: calc(100vh - 88px);
      }
    }

    @media (max-width: 520px) {
      :root {
        --first-column-width: 56px;
      }

      #app {
        padding: 2px 1px;
      }

      .topbar {
        margin-right: 4px;
        margin-left: 4px;
      }

      .filter-button,
      .reset-button,
      .salary-control {
        min-height: 29px;
      }

      #delisted-toggle {
        min-width: 126px;
      }

      #repeat-toggle {
        min-width: 190px;
      }

      #rurality-button {
        min-width: 202px;
      }

      #state-button {
        min-width: 120px;
      }

      .salary-control {

  <script>
    const CONFIG = {

    /*

    const CACHE_APP_KEY =

    const FILTER_OUTLINES = {

      state: {
        NSW: 'var(--state-nsw)',

    const DEFAULT_FILTERS = {

    };

    const app =

    const table =

      );

    const popover =

    const salaryInput =

    const salaryControl =
      document.getElementById('salary-control');

    const controlsScrollShell =
      document.querySelector(
        '.controls-scroll-shell'
      );

    const controlsScroller =
      document.querySelector(
        '.controls-scroller'
      );

    function updateControlsScrollHints() {
      if (
        !controlsScroller ||
        !controlsScrollShell
      ) {
        return;
      }

      const maximumScrollLeft =
        Math.max(
          0,
          controlsScroller.scrollWidth -
            controlsScroller.clientWidth
        );

      const tolerance =
        2;

      controlsScrollShell.classList.toggle(
        'can-scroll-left',
        controlsScroller.scrollLeft >
          tolerance
      );

      controlsScrollShell.classList.toggle(
        'can-scroll-right',
        controlsScroller.scrollLeft <
          maximumScrollLeft -
            tolerance
      );
    }

    const state = {
      filters:
        loadFilters(),

      rows: [],
      model: null,
      openMenu: null,
      popoverAnchor: null,

      cutoff:
        subtractMonths(
          sydneyToday(),
          3
        )
    };

    let columnResizeTimer =
      null;

    let currentDataSource =
      'live';

    let cachedTrackerData =
      null;

    const $ =
      selector =>
        document.querySelector(
          selector
        );

    const $$ =
      selector => [
        ...document.querySelectorAll(
          selector
        )
      ];

    const clean =
      value =>
        String(value ?? '')
          .replace(/\u00a0/g, ' ')
          .trim()
          .replace(/\s+/g, ' ');

    const norm =
      value =>
        clean(value)
          .toLowerCase();

    const colLetter =
      number => {
        let letters = '';

        while (number > 0) {
          letters =
            String.fromCharCode(
              65 +
              (
                (number - 1) %
                26
              )
            ) +
            letters;

          number =
            Math.floor(
              (number - 1) /
              26
            );
        }

        return letters;
      };

    function addSemicolonSpacing(
      value
    ) {
      return clean(value)
        .replace(
          /\s*;\s*/g,
          '; '
        );
    }

    function displayText(
      value
    ) {
      const text =
        addSemicolonSpacing(
          value
        );

      if (
        !text ||
        norm(text) === 'xxx'
      ) {
        return '—';
      }

      if (
        norm(text) === 'yes'
      ) {
        return '✓';
      }

      if (
        norm(text) === 'no'
      ) {
        return '×';
      }

      return text;
    }

    function employmentText(
      value
    ) {
      return addSemicolonSpacing(
        value
      ).replace(
        /\blocum\s*\/\s*temp\b/gi,
        'Temp'
      );
    }

    function trimmed(
      value
    ) {
      const text =
        displayText(
          value
        );

      return text.length >
        CONFIG.trimLength
        ? `${
            text.slice(
              0,
              CONFIG.trimLength
            )
          }...`
        : text;
    }

    function markFullText(
      element,
      full,
      shown
    ) {
      if (
        full === shown
      ) {
        return;
      }

      element.title =
        full;

      element.dataset.fullText =
        full;

      element.classList.add(
        'has-full-text'
      );

      element.tabIndex =
        0;

      element.setAttribute(
        'aria-label',
        full
      );
    }

    function sydneyToday() {
      const parts =
        new Intl.DateTimeFormat(
          'en-AU',
          {
            timeZone:
              'Australia/Sydney',

            year:
              'numeric',

            month:
              '2-digit',

            day:
              '2-digit'
          }
        ).formatToParts(
          new Date()
        );

      const values =
        Object.fromEntries(
          parts
            .filter(
              part =>
                part.type !==
                'literal'
            )
            .map(
              part => [
                part.type,
                Number(
                  part.value
                )
              ]
            )
        );

      return new Date(
        Date.UTC(
          values.year,
          values.month - 1,
          values.day
        )
      );
    }

    function subtractMonths(
      date,
      months
    ) {
      const first =
        new Date(
          Date.UTC(
            date.getUTCFullYear(),
            date.getUTCMonth() -
              months,
            1
          )
        );

      const lastDay =
        new Date(
          Date.UTC(
            first.getUTCFullYear(),
            first.getUTCMonth() + 1,
            0
          )
        ).getUTCDate();

      return new Date(
        Date.UTC(
          first.getUTCFullYear(),
          first.getUTCMonth(),

          Math.min(
            date.getUTCDate(),
            lastDay
          )
        )
      );
    }

    function parseDate(
      value
    ) {
      if (
        value instanceof Date &&
        !Number.isNaN(
          value.getTime()
        )
      ) {
        return new Date(
          Date.UTC(
            value.getFullYear(),
            value.getMonth(),
            value.getDate()
          )
        );
      }

      const text =
        clean(value);

      if (!text) {
        return null;
      }

      let match =
        text.match(
          /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/i
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]),
            Number(match[3])
          )
        );
      }

      match =
        text.match(
          /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
        );

      if (match) {
        let year =
          Number(
            match[3]
          );

        if (year < 100) {
          year += 2000;
        }

        return new Date(
          Date.UTC(
            year,
            Number(match[2]) - 1,
            Number(match[1])
          )
        );
      }

      match =
        text.match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );

      return match
        ? new Date(
            Date.UTC(
              Number(match[1]),
              Number(match[2]) - 1,
              Number(match[3])
            )
          )
        : null;
    }

    function dateFromCell(
      cell
    ) {
      return (
        parseDate(cell?.v) ||
        parseDate(cell?.f)
      );
    }

    function formatDate(
      date,
      includeYear = true
    ) {
      if (
        !date ||
        Number.isNaN(
          date.getTime()
        )
      ) {
        return '—';
      }

      const day =
        String(
          date.getUTCDate()
        ).padStart(
          2,
          '0'
        );

      const month =
        String(
          date.getUTCMonth() + 1
        ).padStart(
          2,
          '0'
        );

      return includeYear
        ? `${
            day
          }/${
            month
          }/${
            date.getUTCFullYear()
          }`
        : `${day}/${month}`;
    }

    function mondayKey(
      date
    ) {
      const copy =
        new Date(
          date.getTime()
        );

      copy.setUTCDate(
        copy.getUTCDate() -
        (
          (
            copy.getUTCDay() +
            6
          ) %
          7
        )
      );

      return copy
        .toISOString()
        .slice(0, 10);
    }

    function cellText(
      cell
    ) {
      return clean(
        cell?.f ??
        cell?.v ??
        ''
      );
    }

    function salaryValue(
      cell
    ) {
      if (
        typeof cell?.v ===
          'number' &&
        Number.isFinite(
          cell.v
        )
      ) {
        return cell.v;
      }

      const text =
        cellText(cell)
          .toLowerCase();

      if (
        !text ||
        text === 'xxx'
      ) {
        return null;
      }

      const values =
        [];

      const regex =
        /(?:\$|aud\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k)?/gi;

      let match;

      while (
        (
          match =
            regex.exec(text)
        )
      ) {
        let number =
          Number(
            match[1]
              .replace(
                /,/g,
                ''
              )
          );

        if (match[2]) {
          number *= 1000;
        }

        if (
          Number.isFinite(
            number
          )
        ) {
          values.push(
            number
          );
        }
      }

      return values.length
        ? Math.max(
            ...values
          )
        : null;
    }

    function stateCodes(
      value
    ) {
      return [
        ...new Set(
          addSemicolonSpacing(
            value
          )
            .toUpperCase()
            .match(
              /\b(?:NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/g
            ) ||
          []
        )
      ];
    }

    function mmCodes(
      value
    ) {
      return [
        ...new Set(
          [
            ...addSemicolonSpacing(
              value
            )
              .toUpperCase()
              .matchAll(
                /\bMM\s*([1-7])\b/g
              )
          ].map(
            match =>
              `MM${match[1]}`
          )
        )
      ];
    }

    function buildLink(
      source,
      title,
      employer,
      suburb,
      stateCode
    ) {
      title =
        clean(title);

      employer =
        clean(employer);

      suburb =
        clean(suburb);

      stateCode =
        clean(stateCode);

      if (
        !title ||
        !employer
      ) {
        return null;
      }

      const firstTitleWord =
        title.match(
          /^[A-Za-z0-9]+/
        )?.[0] ||
        '';

      const keywords =
        `"${firstTitleWord}" ${employer}`;

      const location =
        norm(suburb) === 'xxx'
          ? norm(stateCode) === 'xxx'
            ? 'All Australia'
            : stateCode
          : suburb
              .split(';')[0]
              .trim();

      const sourceText =
        norm(source);

      if (
        sourceText.endsWith(
          'indeed|'
        )
      ) {
        return {
          text:
            'Indeed',

          className:
            'link-indeed',

          url:
            `https://au.indeed.com/jobs?q=${
              encodeURIComponent(
                keywords
              )
            }` +
            `&l=${
              encodeURIComponent(
                location
              )
            }` +
            '&radius=0&sort=date'
        };
      }

      const employerKey =
        employer
          .replace(
            /\s+/g,
            ''
          )
          .toLowerCase();

      if (
        /(opsm|eyeq|laubman&pank)/i
          .test(
            employerKey
          )
      ) {
        return {
          text:
            'EssiLux',

          className:
            'link-essilux',

          url:
            'https://careers.essilorluxottica.com/search/' +
            '?createNewAlert=false' +
            `&q=${
              encodeURIComponent(
                firstTitleWord ||
                title
              )
            }` +
            '&optionsFacetsDD_country=AU' +
            '&optionsFacetsDD_city=' +
            '&optionsFacetsDD_customfield1=' +
            '&optionsFacetsDD_customfield2=' +
            '&optionsFacetsDD_customfield3=' +
            '&optionsFacetsDD_customfield4='
        };
      }

      return {
        text:
          'SEEK',

        className:
          'link-seek',

        url:
          `https://www.seek.com.au/jobs?keywords=${
            encodeURIComponent(
              keywords
            )
          }` +
          `&where=${
            encodeURIComponent(
              location
            )
          }`
      };
    }

    function visibleColumns() {
      return Array.from(
        {
          length:
            CONFIG.lastColumn
        },

        (
          _,
          index
        ) =>
          index + 1
      ).filter(
        column =>
          !CONFIG
            .hiddenColumns
            .has(
              column
            )
      );
    }

    function buildModel(
      response
    ) {
      if (
        response?.status ===
        'error'
      ) {
        throw new Error(
          response
            ?.errors?.[0]
            ?.detailed_message ||

          response
            ?.errors?.[0]
            ?.message ||

          'Google Sheets returned an error.'
        );
      }

      const columns =
        response
          ?.table
          ?.cols ||
        [];

      const rows =
        response
          ?.table
          ?.rows ||
        [];

      const shownColumns =
        visibleColumns();

      const headerNames = {
        4: 'Date',
        5: 'Job Title',
        6: 'Employer',
        7: 'Suburb',
        8: 'State',
        9: 'Postcode',
        10: 'Rurality',
        11: 'Employment Type',
        12: 'Days / Week',
        13: 'FTE Salary',
        14: 'Salary Includes Super'
      };

      const headers =
        shownColumns.map(
          column => ({
            column,

            text:
              headerNames[column] ||

              clean(
                columns[
                  column - 1
                ]?.label
              ) ||

              colLetter(
                column
              )
          })
        );

      const modelRows =
        [];

      rows.forEach(
        (
          sourceRow,
          index
        ) => {
          const cells =
            sourceRow?.c ||
            [];

          const sourceAText =
            cellText(
              cells[0]
            );

          if (!sourceAText) {
            return;
          }

          const date =
            dateFromCell(
              cells[
                CONFIG
                  .columns
                  .date -
                1
              ]
            );

          if (
            !date ||
            date <
              state.cutoff
          ) {
            return;
          }

          const title =
            cellText(
              cells[
                CONFIG
                  .columns
                  .title -
                1
              ]
            );

          const employer =
            cellText(
              cells[
                CONFIG
                  .columns
                  .employer -
                1
              ]
            );

          const suburb =
            cellText(
              cells[
                CONFIG
                  .columns
                  .suburb -
                1
              ]
            );

          const stateValue =
            cellText(
              cells[
                CONFIG
                  .columns
                  .state -
                1
              ]
            );

          const rurality =
            cellText(
              cells[
                CONFIG
                  .columns
                  .rurality -
                1
              ]
            );

          const isDelisted =
            norm(
              sourceAText
            ).startsWith(
              'delisted'
            );

          const link =
            isDelisted
              ? null
              : buildLink(
                  cellText(
                    cells[
                      CONFIG
                        .columns
                        .source -
                      1
                    ]
                  ),

                  title,
                  employer,
                  suburb,
                  stateValue
                );

          const mms =
            mmCodes(
              rurality
            );

          modelRows.push({
            sourceRow:
              CONFIG.headerRow +
              1 +
              index,

            isRepeat:
              norm(
                cellText(
                  cells[
                    CONFIG
                      .columns
                      .repeat -
                    1
                  ]
                )
              ) === 'yes',

            isDelisted,

            states:
              stateCodes(
                stateValue
              ),

            hasMetro:
              mms.includes(
                'MM1'
              ),

            hasNonMetro:
              !mms.includes(
                'MM1'
              ) &&
              clean(rurality) !== '' &&
              norm(rurality) !== 'xxx',

            salary:
              salaryValue(
                cells[
                  CONFIG
                    .columns
                    .salary -
                  1
                ]
              ),

            week:
              mondayKey(
                date
              ),

            cells:
              shownColumns.map(
                column => {
                  if (
                    column === 1
                  ) {
                    return {
                      column,

                      text:
                        link?.text ||
                        sourceAText,

                      link:
                        link?.url ||
                        '',

                      linkClass:
                        link?.className ||
                        ''
                    };
                  }

                  let text =
                    column ===
                    CONFIG
                      .columns
                      .date
                      ? formatDate(
                          date,
                          false
                        )
                      : cellText(
                          cells[
                            column -
                            1
                          ]
                        );

                  if (
                    column ===
                    CONFIG
                      .columns
                      .employment
                  ) {
                    text =
                      employmentText(
                        text
                      );
                  } else {
                    text =
                      addSemicolonSpacing(
                        text
                      );
                  }

                  return {
                    column,
                    text,
                    link: '',
                    linkClass: ''
                  };
                }
              )
          });
        }
      );

      return {
        headers,
        rows:
          modelRows
      };
    }

    function setDataSource(
      source
    ) {
      currentDataSource =
        source;

      dataSourceIndicator.classList.toggle(
        'is-cached',
        source === 'cached'
      );

      dataSourceIndicator.classList.toggle(
        'is-unavailable',
        source === 'unavailable'
      );

      if (
        source === 'cached'
      ) {
        dataSourceText.textContent =
          'CACHED data';

        dataSourceIndicator.setAttribute(
          'aria-label',
          'Cached data'
        );

        return;
      }

      if (
        source === 'unavailable'
      ) {
        dataSourceText.textContent =
          'DATA unavailable';

        dataSourceIndicator.setAttribute(
          'aria-label',
          'Data unavailable'
        );

        return;
      }

      dataSourceText.textContent =
        'LIVE data';

      dataSourceIndicator.setAttribute(
        'aria-label',
        'Live data'
      );

    function validateCachedTrackerData(
      data
    ) {
      const headerLabels =
        Array.isArray(
          data?.headerLabels
        )
          ? data.headerLabels
          : [];

      const rows =
        Array.isArray(
          data?.rows
        )
          ? data.rows
          : [];

      if (
        headerLabels.length <
          CONFIG.lastColumn ||
        !rows.length
      ) {
        throw new Error(
          'Cached job tracker data is incomplete.'
        );
      }

      return {
        headerLabels:
          headerLabels
            .slice(
              0,
              CONFIG.lastColumn
            )
            .map(
              value =>
                String(
                  value ??
                  ''
                )
            ),

        rows:
          rows.map(
            (
              row,
              rowIndex
            ) => {
              if (
                !Array.isArray(row) ||
                row.length <
                  CONFIG.lastColumn
              ) {
                throw new Error(
                  `Cached job tracker row ${rowIndex + 1} is malformed.`
                );
              }

              return row
                .slice(
                  0,
                  CONFIG.lastColumn
                )
                .map(
                  value =>
                    String(
                      value ??
                      ''
                    )
                );
            }
          )
      };
    }

    function buildCachedGvizResponse(
      data
    ) {
      const validated =
        validateCachedTrackerData(
          data
        );

      return {
        status:
          'ok',

        table: {
          cols:
            validated.headerLabels.map(
              label => ({
                label
              })
            ),

          rows:
            validated.rows.map(
              row => ({
                c:
                  row.map(
                    value => ({
                      v:
                        value
                    })
                  )
              })
            )
        }
      };
    }

    function loadCachedTrackerSnapshot() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callback =
            `pffTrackerCache_${
              Date.now()
            }_${
              Math.floor(
                Math.random() *
                100000
              )
            }`;

          const script =
            document.createElement(
              'script'
            );

          let finished =
            false;

          const timer =
            setTimeout(
              () =>
                finish(
                  new Error(
                    'The cached job tracker data timed out.'
                  )
                ),

              CACHE_FETCH_TIMEOUT_MS
            );

          function cleanup() {
            clearTimeout(
              timer
            );

            try {
              delete window[
                callback
              ];
            } catch {
              window[
                callback
              ] = undefined;
            }

            script.remove();
          }

          function finish(
            error,
            snapshot
          ) {
            if (finished) {
              return;
            }

            finished =
              true;

            cleanup();

            error
              ? reject(
                  error
                )
              : resolve(
                  snapshot
                );
          }

          window[callback] =
            snapshot => {
              if (
                !snapshot ||
                snapshot.ok !== true ||
                snapshot.appKey !==
                  CACHE_APP_KEY
              ) {
                finish(
                  new Error(
                    snapshot?.error ||
                    'Cached job tracker data is unavailable.'
                  )
                );

                return;
              }

              try {
                snapshot.data =
                  validateCachedTrackerData(
                    snapshot.data
                  );
              } catch (
                error
              ) {
                finish(
                  error
                );

                return;
              }

              finish(
                null,
                snapshot
              );
            };

          script.onerror =
            () =>
              finish(
                new Error(
                  'The cached job tracker data could not be loaded.'
                )
              );

          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `${
              CACHE_WEB_APP_URL
            }?${
              params
            }`;

          document.body
            .appendChild(
              script
            );
        }
      );
    }

    function loadGviz(
      range,
      headers = 1,
      timeout =
        CONFIG.fetchTimeout
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callback =
            `pffTracker_${
              Date.now()
            }_${
              Math.floor(
                Math.random() *
                100000
              )
            }`;

          const script =
            document.createElement(
              'script'
            );

          let finished =
            false;

          const timer =
            setTimeout(
              () =>
                finish(
                  new Error(
                    'The live Google Sheets feed timed out.'
                  )
                ),

              timeout
            );

          function cleanup() {
            clearTimeout(
              timer
            );

            try {
              delete window[
                callback
              ];
            } catch {
              window[
                callback
              ] = undefined;
            }

            script.remove();
          }

          function finish(
            error,
            response
          ) {
            if (finished) {
              return;
            }

            finished =
              true;

            cleanup();

            error
              ? reject(
                  error
                )
              : resolve(
                  response
                );
          }

          window[callback] =
            response =>
              finish(
                null,
                response
              );

          script.onerror =
            () =>
              finish(
                new Error(
                  'The live Google Sheets feed could not be loaded.'
                )
              );

          const params =
            new URLSearchParams({
              gid:
                CONFIG.sheetGid,

              range,

              headers:
                String(headers),

              tqx:
                `responseHandler:${callback}`,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${
              CONFIG.spreadsheetId
            }/gviz/tq?${
              params
            }`;

          document.body
            .appendChild(
              script
            );
        }
      );
    }

    function loadFilters() {
      try {
        const saved =
          JSON.parse(
            localStorage.getItem(
              CONFIG.storageKey
            ) ||
            '{}'
          );

        return {
          showDelisted:
            typeof saved
              .showDelisted ===
              'boolean'
              ? saved.showDelisted
              : true,

          showRepeats:
            typeof saved
              .showRepeats ===
              'boolean'
              ? saved.showRepeats
              : true,

          rurality:
            validSelection(
              saved.rurality,
              OPTIONS.rurality,
              OPTIONS.rurality
            ),

          states:
            validSelection(
              saved.states,
              OPTIONS.state,
              OPTIONS.state
            ),

          salary:
            normaliseSalary(
              saved.salary
            )
        };
      } catch {
        return structuredClone(
          DEFAULT_FILTERS
        );
      }
    }

    function validSelection(
      value,
      allowed,
      fallback
    ) {
      return Array.isArray(
        value
      )
        ? [
            ...new Set(
              value.filter(
                item =>
                  allowed.includes(
                    item
                  )
              )
            )
          ]
        : [
            ...fallback
          ];
    }

    function normaliseSalary(
      value
    ) {
      const number =
        Number(value);

      return (
        Number.isFinite(
          number
        ) &&
        number >= 0
      )
        ? Math.min(
            Math.floor(
              number
            ),
            999999
          )
        : 0;
    }

    function saveFilters() {
      try {
        localStorage.setItem(
          CONFIG.storageKey,

          JSON.stringify(
            state.filters
          )
        );
      } catch {
        /*
         * Ignore unavailable
         * local storage.
         */
      }
    }

    function setToggle(
      button,
      active
    ) {
      button.classList.toggle(
        'is-on',
        active
      );

      button.setAttribute(
        'aria-checked',
        String(active)
      );

      button
        .querySelector(
          '.filter-value'
        )
        .textContent =
          active
            ? 'ON'
            : 'OFF';
    }

    function summary(
      selected,
      all,
      labels = null,
      empty = 'NONE'
    ) {
      if (
        selected.length ===
        all.length
      ) {
        return 'ALL';
      }

      if (
        !selected.length
      ) {
        return empty;
      }

      if (
        selected.length === 1
      ) {
        return labels
          ? labels[
              selected[0]
            ]
          : selected[0];
      }

      if (
        all ===
          OPTIONS.state &&
        selected.length === 2
      ) {
        return selected.join(
          '+'
        );
      }

      return `${
        selected.length
      } SELECTED`;
    }

    function updateControls() {
      setToggle(
        $('#delisted-toggle'),
        state.filters
          .showDelisted
      );

      setToggle(
        $('#repeat-toggle'),
        state.filters
          .showRepeats
      );

      updateMulti(

        {

          nonmetro:

        },

      );

      updateMulti(

        state.filters

        OPTIONS.state,

      );

      salaryInput.value =

          )
        );
