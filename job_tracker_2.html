    function updateMulti(
      name,
      selected,
      options,
      labels,
      empty
    ) {
      $$(
        `.${name}-checkbox`
      ).forEach(
        box => {
          box.checked =
            selected.includes(
              box.value
            );
        }
      );

      const allBox =
        $(
          `#${name}-all`
        );

      allBox.checked =
        selected.length ===
        options.length;

      allBox.indeterminate =
        selected.length > 0 &&
        selected.length <
          options.length;

      const button =
        $(
          `#${name}-button`
        );

      const value =
        button.querySelector(
          '.filter-value'
        );

      value.textContent =
        summary(
          selected,
          options,
          labels,
          empty
        );

      button
        .style
        .borderColor =
          selected.length === 0
            ? 'var(--track)'
            : selected.length === 1
              ? FILTER_OUTLINES[
                  name
                ][
                  selected[0]
                ]
              : 'var(--purple)';

      value
        .style
        .color =
          selected.length
            ? 'var(--purple)'
            : 'var(--muted)';
    }

    function openMenu(
      name
    ) {
      const shouldOpen =
        state.openMenu !==
        name;

      closeMenus();

      if (!shouldOpen) {
        return;
      }

      const menu =
        $(
          `#${name}-menu`
        );

      const button =
        $(
          `#${name}-button`
        );

      menu.classList.add(
        'is-open'
      );

      button.setAttribute(
        'aria-expanded',
        'true'
      );

      state.openMenu =
        name;

      requestAnimationFrame(
        () =>
          positionMenu(
            button,
            menu
          )
      );
    }

    function closeMenus() {
      $$('.filter-menu')
        .forEach(
          menu =>
            menu.classList.remove(
              'is-open'
            )
        );

      $$('.multi-button')
        .forEach(
          button =>
            button.setAttribute(
              'aria-expanded',
              'false'
            )
        );

      state.openMenu =
        null;
    }

    function positionMenu(
      button,
      menu
    ) {
      if (
        !matchMedia(
          '(max-width: 900px)'
        ).matches
      ) {
        menu.style.removeProperty(
          'left'
        );

        menu.style.removeProperty(
          'top'
        );

        return;
      }

      const buttonRect =
        button.getBoundingClientRect();

      const menuRect =
        menu.getBoundingClientRect();

      const margin =
        8;

      const left =
        Math.max(
          margin,

          Math.min(
            buttonRect.left,

            innerWidth -
            menuRect.width -
            margin
          )
        );

      let top =
        buttonRect.bottom +
        4;

      if (
        top +
        menuRect.height >
        innerHeight -
        margin
      ) {
        top =
          buttonRect.top -
          menuRect.height -
          4;
      }

      top =
        Math.max(
          margin,

          Math.min(
            top,

            innerHeight -
            menuRect.height -
            margin
          )
        );

      menu.style.left =
        `${
          Math.round(
            left
          )
        }px`;

      menu.style.top =
        `${
          Math.round(
            top
          )
        }px`;
    }

    function appendCell(
      td,
      cell
    ) {
      const full =
        displayText(
          cell.text
        );

      const shown =
        trimmed(
          cell.text
        );

      markFullText(
        td,
        full,
        shown
      );

      if (cell.link) {
        const anchor =
          document.createElement(
            'a'
          );

        anchor.href =
          cell.link;

        anchor.target =
          '_blank';

        anchor.rel =
          'noopener noreferrer';

        anchor.className =
          cell.linkClass;

        anchor.textContent =
          shown;

        anchor.setAttribute(
          'aria-label',

          `${
            full
          } — opens in a new tab`
        );

        if (
          full !== shown
        ) {
          anchor.title =
            full;
        }

        td.appendChild(
          anchor
        );
      } else {
        td.textContent =
          shown;
      }
    }

    function render(
      model
    ) {
      state.model =
        model;

      table.tHead.textContent =
        '';

      tbody.textContent =
        '';

      const headerRow =
        document.createElement(
          'tr'
        );

      model.headers.forEach(
        header => {
          const th =
            document.createElement(
              'th'
            );

          th.scope =
            'col';

          th.dataset.column =
            colLetter(
              header.column
            );

          const full =
            displayText(
              header.text
            );

          const shown =
            trimmed(
              header.text
            );

          th.textContent =
            shown;

          markFullText(
            th,
            full,
            shown
          );

          headerRow.appendChild(
            th
          );
        }
      );

      table.tHead.appendChild(
        headerRow
      );

      const fragment =
        document.createDocumentFragment();

      state.rows =
        model.rows.map(
          modelRow => {
            const tr =
              document.createElement(
                'tr'
              );

            if (
              modelRow.isRepeat
            ) {
              tr.classList.add(
                'repeat-row'
              );
            }

            if (
              modelRow.isDelisted
            ) {
              tr.classList.add(
                'delisted-row'
              );
            }

            tr.dataset.week =
              modelRow.week;

            modelRow.cells.forEach(
              cell => {
                const td =
                  document.createElement(
                    'td'
                  );

                td.dataset.column =
                  colLetter(
                    cell.column
                  );

                appendCell(
                  td,
                  cell
                );

                if (
                  cell.column ===
                  CONFIG
                    .columns
                    .state
                ) {
                  const code =
                    stateCodes(
                      cell.text
                    )[0];

                  if (code) {
                    td.classList.add(
                      `state-${
                        code.toLowerCase()
                      }`
                    );
                  }
                }

                if (
                  cell.column ===
                  CONFIG
                    .columns
                    .rurality
                ) {
                  const codes =
                    mmCodes(
                      cell.text
                    );

                  const ruralityValue =
                    clean(
                      cell.text
                    );

                  if (
                    codes.includes(
                      'MM1'
                    )
                  ) {
                    td.classList.add(
                      'rurality-metro'
                    );
                  } else if (
                    ruralityValue &&
                    norm(
                      ruralityValue
                    ) !== 'xxx'
                  ) {
                    td.classList.add(
                      'rurality-nonmetro'
                    );
                  }
                }

                tr.appendChild(
                  td
                );
              }
            );

            fragment.appendChild(
              tr
            );

            return {
              ...modelRow,
              element: tr,
              hidden: false
            };
          }
        );

      tbody.appendChild(
        fragment
      );

      sizeColumns(
        model
      );

      if (
        document.fonts?.ready
      ) {
        document.fonts.ready.then(
          () => {
            sizeColumns(
              model
            );
          }
        );
      }

      applyFilters(
        false
      );
    }

    function sizeColumns(
      model
    ) {
      const colgroup =
        table.querySelector(
          'colgroup'
        );

      colgroup.textContent =
        '';

      const mobile =
        matchMedia(
          '(max-width: 520px)'
        ).matches;

      const canvas =
        document.createElement(
          'canvas'
        );

      const context =
        canvas.getContext(
          '2d'
        );

      let total =
        0;

      model.headers.forEach(
        (
          header,
          index
        ) => {
          context.font =
            mobile
              ? '700 11px Lato'
              : '700 12px Lato';

          let width =
            context.measureText(
              trimmed(
                header.text
              )
            ).width;

          context.font =
            mobile
              ? '400 11px Lato'
              : '400 12px Lato';

          model.rows.forEach(
            row => {
              width =
                Math.max(
                  width,

                  context.measureText(
                    trimmed(
                      row.cells[
                        index
                      ]?.text
                    )
                  ).width
                );
            }
          );

          width =
            Math.ceil(
              width +
              (
                mobile
                  ? 8
                  : 10
              )
            );

          if (
            header.column === 1
          ) {
            width =
              mobile
                ? 56
                : 58;
          } else if (
            header.column ===
            CONFIG
              .columns
              .date
          ) {
            width =
              mobile
                ? 60
                : 64;
          } else if (
            header.column ===
            CONFIG
              .columns
              .state
          ) {
            width =
              Math.min(
                width,

                mobile
                  ? 52
                  : 58
              );
          } else if (
            header.column ===
            CONFIG
              .columns
              .postcode
          ) {
            width =
              Math.max(
                mobile
                  ? 60
                  : 64,

                Math.min(
                  width,

                  mobile
                    ? 68
                    : 72
                )
              );
          } else if (
            header.column ===
            CONFIG
              .columns
              .rurality
          ) {
            width =
              Math.min(
                width,

                mobile
                  ? 86
                  : 94
              );
          } else {
            width =
              Math.max(
                mobile
                  ? 40
                  : 44,

                Math.min(
                  width,

                  mobile
                    ? 300
                    : 360
                )
              );
          }

          const col =
            document.createElement(
              'col'
            );

          col.style.width =
            `${width}px`;

          colgroup.appendChild(
            col
          );

          total +=
            width;

          if (
            header.column === 1
          ) {
            document.documentElement
              .style
              .setProperty(
                '--first-column-width',
                `${width}px`
              );
          }
        }
      );

      table.style.width =
        `${total}px`;

      table.style.minWidth =
        `${total}px`;
    }

    function scheduleColumnWidths() {
      window.clearTimeout(
        columnResizeTimer
      );

      columnResizeTimer =
        window.setTimeout(
          () => {
            if (
              state.model
            ) {
              sizeColumns(
                state.model
              );
            }
          },
          80
        );
    }

    function matches(
      row
    ) {
      const filters =
        state.filters;

      if (
        !filters.showDelisted &&
        row.isDelisted
      ) {
        return false;
      }

      if (
        !filters.showRepeats &&
        row.isRepeat
      ) {
        return false;
      }

      if (
        filters
          .rurality
          .length !==
        OPTIONS
          .rurality
          .length
      ) {
        const locationMatch =
          (
            filters
              .rurality
              .includes(
                'metro'
              ) &&
            row.hasMetro
          ) ||
          (
            filters
              .rurality
              .includes(
                'nonmetro'
              ) &&
            row.hasNonMetro
          );

        if (
          !locationMatch
        ) {
          return false;
        }
      }

      if (
        filters
          .states
          .length !==
          OPTIONS
            .state
            .length &&

        !row
          .states
          .some(
            code =>
              filters
                .states
                .includes(
                  code
                )
          )
      ) {
        return false;
      }

      if (
        filters.salary > 0 &&

        !(
          Number.isFinite(
            row.salary
          ) &&

          row.salary >=
            filters.salary
        )
      ) {
        return false;
      }

      return true;
    }

    function applyFilters(
      animate = true
    ) {
      const commit =
        () => {
          let shown =
            0;

          state.rows.forEach(
            row => {
              row.hidden =
                !matches(
                  row
                );

              row.element
                .classList
                .toggle(
                  'is-hidden',
                  row.hidden
                );

              if (
                !row.hidden
              ) {
                shown++;
              }
            }
          );

          refreshWeekDividers();

          animateCount(
            visibleCount,
            shown
          );

          animateCount(
            totalCount,
            state.rows.length
          );

          emptyState
            .classList
            .toggle(
              'is-visible',
              shown === 0
            );

          table.style.display =
            shown
              ? ''
              : 'none';
        };

      if (
        !animate ||

        matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches ||

        !tbody.children.length
      ) {
        commit();
        return;
      }

      const out =
        tbody.animate(
          [
            {
              opacity: 1
            },

            {
              opacity: .6,

              transform:
                'translateY(-2px)'
            }
          ],

          {
            duration: 180,
            easing: 'ease-out'
          }
        );

      out.onfinish =
        () => {
          out.cancel();
          commit();

          const inside =
            tbody.animate(
              [
                {
                  opacity: .6,

                  transform:
                    'translateY(-2px)'
                },

                {
                  opacity: 1,

                  transform:
                    'translateY(0)'
                }
              ],

              {
                duration: 280,

                easing:
                  'cubic-bezier(.2,.8,.2,1)'
              }
            );

          inside.onfinish =
            () =>
              inside.cancel();
        };
    }

    function refreshWeekDividers() {
      state.rows.forEach(
        row =>
          row.element
            .classList
            .remove(
              'week-divider'
            )
      );

      const rows =
        state.rows.filter(
          row =>
            !row.hidden
        );

      for (
        let index = 0;
        index <
          rows.length - 1;
        index++
      ) {
        if (
          rows[index].week &&

          rows[index + 1].week &&

          rows[index].week !==
          rows[index + 1].week
        ) {
          rows[index]
            .element
            .classList
            .add(
              'week-divider'
            );
        }
      }
    }

    function animateCount(
      element,
      target
    ) {
      if (
        element._frame
      ) {
        cancelAnimationFrame(
          element._frame
        );
      }

      const start =
        Number(
          element
            .dataset
            .current ??

          element.textContent
        ) ||
        0;

      if (
        start === target ||

        matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches
      ) {
        element.textContent =
          String(
            target
          );

        element.dataset.current =
          String(
            target
          );

        return;
      }

      const started =
        performance.now();

      const frame =
        now => {
          const progress =
            Math.min(
              (
                now -
                started
              ) /
              520,

              1
            );

          const value =
            Math.round(
              start +

              (
                target -
                start
              ) *

              (
                1 -
                Math.pow(
                  1 -
                  progress,

                  3
                )
              )
            );

          element.textContent =
            String(
              value
            );

          element.dataset.current =
            String(
              value
            );

          if (
            progress < 1
          ) {
            element._frame =
              requestAnimationFrame(
                frame
              );
          }
        };

      element._frame =
        requestAnimationFrame(
          frame
        );
    }

    function showPopover(
      element
    ) {
      const full =
        element
          .dataset
          .fullText;

      if (!full) {
        return;
      }

      if (
        state.popoverAnchor ===
          element &&

        popover
          .classList
          .contains(
            'is-visible'
          )
      ) {
        closePopover();
        return;
      }

      state.popoverAnchor =
        element;

      popover.textContent =
        full;

      popover.classList.add(
        'is-visible'
      );

      popover.setAttribute(
        'aria-hidden',
        'false'
      );

      popover.style.visibility =
        'hidden';

      const anchor =
        element.getBoundingClientRect();

      const box =
        popover.getBoundingClientRect();

      const margin =
        8;

      const left =
        Math.max(
          margin,

          Math.min(
            anchor.left,

            innerWidth -
            box.width -
            margin
          )
        );

      let top =
        anchor.bottom +
        5;

      if (
        top +
        box.height >
        innerHeight -
        margin
      ) {
        top =
          anchor.top -
          box.height -
          5;
      }

      top =
        Math.max(
          margin,

          Math.min(
            top,

            innerHeight -
            box.height -
            margin
          )
        );

      popover.style.left =
        `${
          Math.round(
            left
          )
        }px`;

      popover.style.top =
        `${
          Math.round(
            top
          )
        }px`;

      popover.style.visibility =
        '';
    }

    function closePopover() {
      popover.classList.remove(
        'is-visible'
      );

      popover.setAttribute(
        'aria-hidden',
        'true'
      );

      popover.textContent =
        '';

      state.popoverAnchor =
        null;
    }

    function commitFilters() {
      saveFilters();
      updateControls();

      applyFilters(
        true
      );
    }

    function setSelection(
      name,
      value,
      checked
    ) {
      const selected =
        new Set(
          state.filters[
            name
          ]
        );

      checked
        ? selected.add(
            value
          )
        : selected.delete(
            value
          );

      const allowed =
        name === 'states'
          ? OPTIONS.state
          : OPTIONS[name];

      state.filters[name] =
        allowed.filter(
          item =>
            selected.has(
              item
            )
        );

      commitFilters();
    }

    function getLatestDateFromResponse(
      response
    ) {
      const today =
        sydneyToday();

      const dates = [
        ...new Map(
          (
            response
              ?.table
              ?.rows ||
            []
          )
            .map(
              row =>
                dateFromCell(
                  row
                    ?.c
                    ?.[
                      CONFIG
                        .columns
                        .date -
                      1
                    ]
                )
            )
            .filter(
              date =>
                date &&
                date <= today
            )
            .map(
              date => [
                date
                  .toISOString()
                  .slice(
                    0,
                    10
                  ),

                date
              ]
            )
        ).values()
      ].sort(
        (
          a,
          b
        ) =>
          b - a
      );

      return dates.length
        ? dates[0]
        : null;
    }

    function setLastUpdatedFromCachedData() {
      if (
        !cachedTrackerData
      ) {
        lastUpdated.textContent =
          '—';

        return;
      }

      lastUpdated.textContent =
        formatDate(
          getLatestDateFromResponse(
            buildCachedGvizResponse(
              cachedTrackerData
            )
          )
        );
    }

    function showError(
      error
    ) {
      console.error(
        error
      );

      setDataSource(
        'unavailable'
      );

      app.classList.remove(
        'is-loading'
      );

      tableShell.style.display =
        'none';

      document
        .getElementById(
          'table-status'
        )
        .textContent =
          '';

      errorState.textContent =
        'Please refresh the page';

      errorState.classList.add(
        'is-visible'
      );
    }

    async function loadTable() {
      const maxAttempts =
        2;

      let liveError =
        null;

      if (
        !FORCE_CACHED_DATA
      ) {
        for (
          let attempt = 1;
          attempt <= maxAttempts;
          attempt++
        ) {
          try {
            const response =
              await loadGviz(
                `A${CONFIG.headerRow}:N`,
                1
              );

            render(
              buildModel(
                response
              )
            );

            setDataSource(
              'live'
            );

            app.classList.remove(
              'is-loading'
            );

            window.requestAnimationFrame(
              updateControlsScrollHints
            );

            return;

          } catch (error) {
            liveError =
              error;

            if (
              attempt <
              maxAttempts
            ) {
              await new Promise(
                resolve =>
                  setTimeout(
                    resolve,
                    1500
                  )
              );
            }
          }
        }
      }

      try {
        const snapshot =
          await loadCachedTrackerSnapshot();

        cachedTrackerData =
          snapshot.data;

        render(
          buildModel(
            buildCachedGvizResponse(
              cachedTrackerData
            )
          )
        );

        setDataSource(
          'cached'
        );

        setLastUpdatedFromCachedData();

        app.classList.remove(
          'is-loading'
        );

        window.requestAnimationFrame(
          updateControlsScrollHints
        );
      } catch (
        cacheError
      ) {
        console.error(
          'Live job tracker load failed',
          liveError
        );

        console.error(
          'Cached job tracker load failed',
          cacheError
        );

        showError(
          cacheError
        );
      }
    }

    async function loadLastUpdated() {
      if (
        currentDataSource ===
          'cached'
      ) {
        setLastUpdatedFromCachedData();
        return;
      }

      try {
        const response =
          await loadGviz(
            'D:D',
            0,
            10000
          );

        if (
          currentDataSource ===
            'cached'
        ) {
          setLastUpdatedFromCachedData();
          return;
        }

        const today =
          sydneyToday();

        const dates = [
          ...new Map(
            (
              response
                ?.table
                ?.rows ||
              []
            )
              .map(
                row =>
                  dateFromCell(
                    row
                      ?.c
                      ?.[0]
                  )
              )
              .filter(
                date =>
                  date &&
                  date <= today
              )
              .map(
                date => [
                  date
                    .toISOString()
                    .slice(
                      0,
                      10
                    ),

                  date
                ]
              )
          ).values()
        ].sort(
          (
            a,
            b
          ) =>
            b - a
        );

        lastUpdated.textContent =
          formatDate(
            dates.length
              ? dates[0]
              : null
          );
      } catch {
        if (
          currentDataSource ===
            'cached'
        ) {
          setLastUpdatedFromCachedData();
          return;
        }

        lastUpdated.textContent =
          '—';
      }
    }

    $('#delisted-toggle')
      .addEventListener(
        'click',

        () => {
          state.filters
            .showDelisted =
              !state.filters
                .showDelisted;

          commitFilters();
        }
      );

    $('#repeat-toggle')
      .addEventListener(
        'click',

        () => {
          state.filters
            .showRepeats =
              !state.filters
                .showRepeats;

          commitFilters();
        }
      );

    [
      'rurality',
      'state'
    ].forEach(
      name => {
        $(
          `#${name}-button`
        ).addEventListener(
          'click',

          event => {
            event.stopPropagation();

            openMenu(
              name
            );
          }
        );

        $(
          `#${name}-menu`
        ).addEventListener(
          'click',

          event =>
            event.stopPropagation()
        );
      }
    );

    $('#rurality-all')
      .addEventListener(
        'change',

        event => {
          state.filters
            .rurality =
              event.target.checked
                ? [
                    ...OPTIONS.rurality
                  ]
                : [];

          commitFilters();
        }
      );

    $$('.rurality-checkbox')
      .forEach(
        box =>
          box.addEventListener(
            'change',

            () =>
              setSelection(
                'rurality',
                box.value,
                box.checked
              )
          )
      );

    $('#state-all')
      .addEventListener(
        'change',

        event => {
          state.filters
            .states =
              event.target.checked
                ? [
                    ...OPTIONS.state
                  ]
                : [];

          commitFilters();
        }
      );

    $$('.state-checkbox')
      .forEach(
        box =>
          box.addEventListener(
            'change',

            () =>
              setSelection(
                'states',
                box.value,
                box.checked
              )
          )
      );

    salaryInput
      .addEventListener(
        'focus',

        () => {
          if (
            salaryInput.value ===
            '0'
          ) {
            salaryInput.select();
          }
        }
      );

    salaryInput
      .addEventListener(
        'click',

        () => {
          if (
            salaryInput.value ===
            '0'
          ) {
            salaryInput.select();
          }
        }
      );

    salaryInput
      .addEventListener(
        'input',

        () => {
          const digits =
            salaryInput.value
              .replace(
                /\D/g,
                ''
              )
              .slice(
                0,
                6
              )
              .replace(
                /^0+(?=\d)/,
                ''
              );

          salaryInput.value =
            digits;

          state.filters
            .salary =
              digits
                ? Number(
                    digits
                  )
                : 0;

          salaryControl
            .style
            .borderColor =
              state.filters
                .salary > 0
                ? 'var(--purple)'
                : 'var(--track)';

          saveFilters();

          applyFilters(
            true
          );
        }
      );

    salaryInput
      .addEventListener(
        'blur',

        () => {
          if (
            !salaryInput.value
          ) {
            salaryInput.value =
              '0';

            state.filters
              .salary =
                0;

            salaryControl
              .style
              .borderColor =
                'var(--track)';

            saveFilters();

            applyFilters(
              true
            );
          }
        }
      );

    $('#reset-button')
      .addEventListener(
        'click',

        () => {
          state.filters =
            structuredClone(
              DEFAULT_FILTERS
            );

          closeMenus();
          closePopover();
          commitFilters();
        }
      );

    document.addEventListener(
      'pointerdown',

      event => {
        if (
          !event.target.closest(
            '.filter-control'
          )
        ) {
          closeMenus();
        }

        if (
          !event.target.closest(
            '.has-full-text'
          )
        ) {
          closePopover();
        }
      }
    );

    table.addEventListener(
      'click',

      event => {
        const target =
          event.target.closest(
            '.has-full-text'
          );

        if (
          !target ||
          event.target.closest(
            'a'
          )
        ) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();

        showPopover(
          target
        );
      }
    );

    table.addEventListener(
      'keydown',

      event => {
        if (
          ![
            'Enter',
            ' '
          ].includes(
            event.key
          )
        ) {
          return;
        }

        const target =
          event.target.closest(
            '.has-full-text'
          );

        if (!target) {
          return;
        }

        event.preventDefault();

        showPopover(
          target
        );
      }
    );

    document.addEventListener(
      'keydown',

      event => {
        if (
          event.key ===
          'Escape'
        ) {
          closeMenus();
          closePopover();
        }
      }
    );

    controlsScroller
      .addEventListener(
        'scroll',

        () => {
          updateControlsScrollHints();
          closeMenus();
          closePopover();
        },

        {
          passive: true
        }
      );

    $('.table-scroll')
      .addEventListener(
        'scroll',

        closePopover,

        {
          passive: true
        }
      );

    window.addEventListener(
      'resize',

      () => {
        closeMenus();
        closePopover();
        scheduleColumnWidths();
        updateControlsScrollHints();
      }
    );

    updateControls();
    loadTable();
    loadLastUpdated();

    setInterval(
      loadLastUpdated,
      CONFIG.refreshLastUpdated
    );
  </script>
</body>
</html>
