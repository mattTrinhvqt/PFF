    }

    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.min(
        maximum,
        Math.max(
          minimum,
          value
        )
      );
    }

    function easeInOutCubic(value) {
      const clamped =
        clamp(
          value,
          0,
          1
        );

      return clamped < 0.5
        ? 4 * clamped * clamped * clamped
        : 1 -
          Math.pow(
            -2 * clamped + 2,
            3
          ) / 2;
    }

    // ============================================================
    // UNIFIED Y-AXIS TRANSITION
    //
    // One animation clock drives the Y-axis numbers, tick marks and
    // horizontal guides. When the scale changes, labels count while
    // the markings slide/fade to their new locations.
    // ============================================================

    function copyScale(scale) {
      const intervals =
        Math.max(
          1,
          Math.round(
            Number(scale?.intervals) || 1
          )
        );

      const minimum =
        Number(scale?.min);

      const maximum =
        Number(scale?.max);

      const min =
        Number.isFinite(minimum)
          ? minimum
          : 0;

      const max =
        Number.isFinite(maximum) &&
        maximum > min
          ? maximum
          : min + 1;

      return {
        min,
        max,
        intervals,
        step:
          (max - min) /
          intervals
      };
    }

    function scalesNearlyEqual(
      first,
      second,
      tolerance = 1e-9
    ) {
      if (!first || !second) {
        return false;
      }

      return (
        Math.abs(
          Number(first.min) -
          Number(second.min)
        ) <= tolerance &&
        Math.abs(
          Number(first.max) -
          Number(second.max)
        ) <= tolerance &&
        Math.round(
          Number(first.intervals)
        ) ===
          Math.round(
            Number(second.intervals)
          )
      );
    }

    function majorTickDefinitions(scale) {
      const current =
        copyScale(scale);

      return Array.from(
        {
          length:
            current.intervals + 1
        },
        (_, index) => ({
          value:
            current.min +
            current.step * index,
          ratio:
            index /
            current.intervals
        })
      );
    }

    function minorTickDefinitions(scale) {
      const current =
        copyScale(scale);

      return Array.from(
        {
          length:
            current.intervals
        },
        (_, index) => ({
          value:
            current.min +
            current.step *
              (index + 0.5),
          ratio:
            (index + 0.5) /
            current.intervals
        })
      );
    }

    function nearestDefinition(
      definitions,
      ratio
    ) {
      if (!definitions.length) {
        return {
          value: 0,
          ratio: 0
        };
      }

      let best =
        definitions[0];

      let bestDistance =
        Math.abs(
          best.ratio - ratio
        );

      for (
        let index = 1;
        index < definitions.length;
        index += 1
      ) {
        const candidate =
          definitions[index];

        const distance =
          Math.abs(
            candidate.ratio - ratio
          );

        if (distance < bestDistance) {
          best = candidate;
          bestDistance = distance;
        }
      }

      return best;
    }

    function buildAxisTracks(
      fromDefinitions,
      toDefinitions
    ) {
      const from =
        [...fromDefinitions];

      const to =
        [...toDefinitions];

      if (!from.length && !to.length) {
        return [];
      }

      if (!from.length) {
        return to.map(
          target => ({
            fromValue: target.value,
            toValue: target.value,
            fromRatio: target.ratio,
            toRatio: target.ratio,
            fromAlpha: 0,
            toAlpha: 1
          })
        );
      }

      if (!to.length) {
        return from.map(
          source => ({
            fromValue: source.value,
            toValue: source.value,
            fromRatio: source.ratio,
            toRatio: source.ratio,
            fromAlpha: 1,
            toAlpha: 0
          })
        );
      }

      const pairedCount =
        Math.min(
          from.length,
          to.length
        );

      const usedFrom =
        new Set();

      const usedTo =
        new Set();

      const tracks = [];

      for (
        let pairIndex = 0;
        pairIndex < pairedCount;
        pairIndex += 1
      ) {
        const fromIndex =
          pairedCount === 1
            ? 0
            : Math.round(
                pairIndex *
                (from.length - 1) /
                (pairedCount - 1)
              );

        const toIndex =
          pairedCount === 1
            ? 0
            : Math.round(
                pairIndex *
                (to.length - 1) /
                (pairedCount - 1)
              );

        if (
          usedFrom.has(fromIndex) ||
          usedTo.has(toIndex)
        ) {
          continue;
        }

        const source =
          from[fromIndex];

        const target =
          to[toIndex];

        usedFrom.add(fromIndex);
        usedTo.add(toIndex);

        tracks.push({
          fromValue: source.value,
          toValue: target.value,
          fromRatio: source.ratio,
          toRatio: target.ratio,
          fromAlpha: 1,
          toAlpha: 1
        });
      }

      from.forEach(
        (source, index) => {
          if (usedFrom.has(index)) {
            return;
          }

          const target =
            nearestDefinition(
              to,
              source.ratio
            );

          tracks.push({
            fromValue: source.value,
            toValue: target.value,
            fromRatio: source.ratio,
            toRatio: target.ratio,
            fromAlpha: 1,
            toAlpha: 0
          });
        }
      );

      to.forEach(
        (target, index) => {
          if (usedTo.has(index)) {
            return;
          }

          const source =
            nearestDefinition(
              from,
              target.ratio
            );

          tracks.push({
            fromValue: source.value,
            toValue: target.value,
            fromRatio: source.ratio,
            toRatio: target.ratio,
            fromAlpha: 0,
            toAlpha: 1
          });
        }
      );

      return tracks.sort(
        (first, second) =>
          first.toRatio -
          second.toRatio
      );
    }

    function interpolateAxisTrack(
      track,
      progress
    ) {
      return {
        value:
          track.fromValue +
          (
            track.toValue -
            track.fromValue
          ) * progress,
        ratio:
          track.fromRatio +
          (
            track.toRatio -
            track.fromRatio
          ) * progress,
        alpha:
          track.fromAlpha +
          (
            track.toAlpha -
            track.fromAlpha
          ) * progress
      };
    }

    const yAxisTransition = {
      raf: null,
      token: 0,
      progress: 1,
      fromScale: null,
      toScale: null,
      currentScale: null,
      fromAxisDecimals: 0,
      toAxisDecimals: 0,
      majorTracks: [],
      minorTracks: []
    };

    function cancelYAxisTransition() {
      if (yAxisTransition.raf) {
        cancelAnimationFrame(
          yAxisTransition.raf
        );

        yAxisTransition.raf =
          null;
      }

      ++yAxisTransition.token;
    }

    function setYAxisTransitionImmediately(
      scale = currentViewConfig().scale,
      axisDecimals =
        currentViewConfig().axisDecimals ?? 0
    ) {
      cancelYAxisTransition();

      const current =
        copyScale(scale);

      const decimals =
        Math.max(
          0,
          Math.round(
            Number(axisDecimals) || 0
          )
        );

      yAxisTransition.progress = 1;
      yAxisTransition.fromScale =
        current;
      yAxisTransition.toScale =
        current;
      yAxisTransition.currentScale =
        current;
      yAxisTransition.fromAxisDecimals =
        decimals;
      yAxisTransition.toAxisDecimals =
        decimals;
      yAxisTransition.majorTracks =
        buildAxisTracks(
          majorTickDefinitions(current),
          majorTickDefinitions(current)
        );
      yAxisTransition.minorTracks =
        buildAxisTracks(
          minorTickDefinitions(current),
          minorTickDefinitions(current)
        );
    }

    function currentYAxisScale() {
      return copyScale(
        yAxisTransition.currentScale ||
        currentViewConfig().scale
      );
    }

    function currentYAxisAxisDecimals() {
      const progress =
        clamp(
          yAxisTransition.progress,
          0,
          1
        );

      return progress < 0.5
        ? yAxisTransition.fromAxisDecimals
        : yAxisTransition.toAxisDecimals;
    }

    function currentMajorAxisTracks() {
      const progress =
        clamp(
          yAxisTransition.progress,
          0,
          1
        );

      const tracks =
        yAxisTransition.majorTracks.length
          ? yAxisTransition.majorTracks
          : buildAxisTracks(
              majorTickDefinitions(
                currentViewConfig().scale
              ),
              majorTickDefinitions(
                currentViewConfig().scale
              )
            );

      return tracks.map(
        track =>
          interpolateAxisTrack(
            track,
            progress
          )
      );
    }

    function currentMinorAxisTracks() {
      const progress =
        clamp(
          yAxisTransition.progress,
          0,
          1
        );

      const tracks =
        yAxisTransition.minorTracks.length
          ? yAxisTransition.minorTracks
          : buildAxisTracks(
              minorTickDefinitions(
                currentViewConfig().scale
              ),
              minorTickDefinitions(
                currentViewConfig().scale
              )
            );

      return tracks.map(
        track =>
          interpolateAxisTrack(
            track,
            progress
          )
      );
    }

    function animateYAxisTransition(
      fromScale,
      toScale,
      duration = VIEW_TRANSITION_MS,
      fromAxisDecimals =
        currentYAxisAxisDecimals(),
      toAxisDecimals =
        currentViewConfig().axisDecimals ?? 0
    ) {
      cancelYAxisTransition();

      const from =
        copyScale(fromScale);

      const to =
        copyScale(toScale);

      const startDecimals =
        Math.max(
          0,
          Math.round(
            Number(fromAxisDecimals) || 0
          )
        );

      const targetDecimals =
        Math.max(
          0,
          Math.round(
            Number(toAxisDecimals) || 0
          )
        );

      if (
        reducedMotion() ||
        duration <= 0 ||
        scalesNearlyEqual(from, to)
      ) {
        setYAxisTransitionImmediately(
          to,
          targetDecimals
        );
        chart?.draw();
        return;
      }

      const token =
        ++yAxisTransition.token;

      yAxisTransition.progress = 0;
      yAxisTransition.fromScale = from;
      yAxisTransition.toScale = to;
      yAxisTransition.currentScale = from;
      yAxisTransition.fromAxisDecimals =
        startDecimals;
      yAxisTransition.toAxisDecimals =
        targetDecimals;
      yAxisTransition.majorTracks =
        buildAxisTracks(
          majorTickDefinitions(from),
          majorTickDefinitions(to)
        );
      yAxisTransition.minorTracks =
        buildAxisTracks(
          minorTickDefinitions(from),
          minorTickDefinitions(to)
        );

      const startedAt =
        performance.now();

      const frame = now => {
        if (
          token !==
          yAxisTransition.token
        ) {
          return;
        }

        const raw =
          clamp(
            (now - startedAt) /
            duration,
            0,
            1
          );

        const progress =
          easeInOutCubic(raw);

        const min =
          from.min +
          (to.min - from.min) *
          progress;

        const max =
          from.max +
          (to.max - from.max) *
          progress;

        const intervals =
          progress < 0.5
            ? from.intervals
            : to.intervals;

        yAxisTransition.progress =
          progress;

        yAxisTransition.currentScale = {
          min,
          max,
          intervals,
          step:
            (max - min) /
            Math.max(1, intervals)
        };

        chart?.draw();

        if (raw < 1) {
          yAxisTransition.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          yAxisTransition.raf =
            null;
          yAxisTransition.progress =
            1;
          yAxisTransition.fromScale =
            to;
          yAxisTransition.toScale =
            to;
          yAxisTransition.currentScale =
            to;
          yAxisTransition.fromAxisDecimals =
            targetDecimals;
          yAxisTransition.toAxisDecimals =
            targetDecimals;
          yAxisTransition.majorTracks =
            buildAxisTracks(
              majorTickDefinitions(to),
              majorTickDefinitions(to)
            );
          yAxisTransition.minorTracks =
            buildAxisTracks(
              minorTickDefinitions(to),
              minorTickDefinitions(to)
            );

          chart?.draw();
        }
      };

      yAxisTransition.raf =
        requestAnimationFrame(
          frame
        );
    }

    // ============================================================
    // AXIS-TITLE FADE
    // ============================================================

    const yAxisTitleAnimation = {
      from: '',
      to: '',
      progress: 1,
      token: 0,
      raf: null
    };

    function setYAxisTitleImmediately(text) {
      const value =
        String(text || '');

      yAxisTitleAnimation.from =
        value;

      yAxisTitleAnimation.to =
        value;

      yAxisTitleAnimation.progress =
        1;
    }

    function animateYAxisTitle(
      nextText,
      duration = VIEW_TRANSITION_MS
    ) {
      const target =
        String(nextText || '');

      const current =
        yAxisTitleAnimation.progress < 0.5
          ? yAxisTitleAnimation.from
          : yAxisTitleAnimation.to;

      if (current === target) {
        setYAxisTitleImmediately(target);
        return;
      }

      if (yAxisTitleAnimation.raf) {
        cancelAnimationFrame(
          yAxisTitleAnimation.raf
        );

        yAxisTitleAnimation.raf =
          null;
      }

      const token =
        ++yAxisTitleAnimation.token;

      yAxisTitleAnimation.from =
        current;

      yAxisTitleAnimation.to =
        target;

      yAxisTitleAnimation.progress =
        0;

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        setYAxisTitleImmediately(target);
        chart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (
          token !==
          yAxisTitleAnimation.token
        ) {
          return;
        }

        const progress =
          clamp(
            (now - startedAt) /
              duration,
            0,
            1
          );

        yAxisTitleAnimation.progress =
          easeInOutCubic(progress);

        chart?.draw();

        if (progress < 1) {
          yAxisTitleAnimation.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          yAxisTitleAnimation.raf =
            null;

          setYAxisTitleImmediately(
            target
          );

          chart?.draw();
        }
      }

      yAxisTitleAnimation.raf =
        requestAnimationFrame(frame);
    }

    // ============================================================
    // SMALL TEXT + LEGEND ANIMATIONS
    // ============================================================

    function fadeTextChange(
      element,
      nextText,
      animate = true
    ) {
      if (!element) {
        return;
      }

      const text =
        String(nextText);

      if (
        element.textContent ===
        text
      ) {
        return;
      }

      if (
        !animate ||
        reducedMotion() ||
        typeof element.animate !==
          'function'
      ) {
        element.textContent =
          text;

        return;
      }

      const token =
        (
          Number(
            element.dataset
              .textAnimationToken
          ) || 0
        ) + 1;

      element.dataset.textAnimationToken =
        String(token);

      element
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const fadeOut =
        element.animate(
          [
            {
              opacity: 1
            },
            {
              opacity: 0
            }
          ],
          {
            duration: 150,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      fadeOut.finished
        .then(() => {
          if (
            Number(
              element.dataset
                .textAnimationToken
            ) !== token
          ) {
            return;
          }

          fadeOut.cancel();

          element.textContent =
            text;

          const fadeIn =
            element.animate(
              [
                {
                  opacity: 0
                },
                {
                  opacity: 1
                }
              ],
              {
                duration: 230,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );

          fadeIn.finished
            .then(
              () => fadeIn.cancel()
            )
            .catch(() => {});
        })
        .catch(() => {
          element.textContent =
            text;
        });
    }

    function scrollByAmount(element, direction) {
      element.scrollBy({
        left:
          direction *
          Math.max(
            80,
            element.clientWidth * 0.72
          ),
        behavior: 'smooth'
      });
    }

    function updateOverflowButtons(
      scroller,
      leftButton,
      rightButton
    ) {
      const maximum =
        Math.max(
          0,
          scroller.scrollWidth -
            scroller.clientWidth
        );

      const hasOverflow =
        maximum > 2;

      leftButton.classList.toggle(
        'is-hidden',
        !hasOverflow ||
          scroller.scrollLeft <= 2
      );

      rightButton.classList.toggle(
        'is-hidden',
        !hasOverflow ||
          scroller.scrollLeft >=
            maximum - 2
      );
    }

    function updateTabScrollControls() {
      updateOverflowButtons(
        tabList,
        tabScrollLeft,
        tabScrollRight
      );
    }

    function updateHeadingScrollControls() {
      updateOverflowButtons(
        headingScrollViewport,
        headingScrollLeft,
        headingScrollRight
      );
    }

    function updateHeading(
      previousConfig,
      nextConfig,
      animate = true
    ) {
      const previousFixed =
        previousConfig?.headingFixed ??
        chartHeadingFixed?.textContent ??
        '';

      const previousDetail =
        previousConfig?.headingDetail ??
        chartHeadingDetail?.textContent ??
        '';

      const fixedChanged =
        previousFixed !==
        nextConfig.headingFixed;

      const detailChanged =
        previousDetail !==
        nextConfig.headingDetail;

      if (fixedChanged) {
        fadeTextChange(
          chartHeadingFixed,
          nextConfig.headingFixed,
          animate
        );
      }

      if (detailChanged) {
        fadeTextChange(
          chartHeadingDetail,
          nextConfig.headingDetail,
          animate
        );
      }

      headingScrollViewport.scrollLeft = 0;

      requestAnimationFrame(
        updateHeadingScrollControls
      );

      window.setTimeout(
        updateHeadingScrollControls,
        animate ? 420 : 0
      );
    }

    function updateLegendScrollControls() {
      const maximumScrollLeft =
        Math.max(
          0,
          chartLegend.scrollWidth -
            chartLegend.clientWidth
        );

      const tolerance = 2;

      legendScrollLeft.classList.toggle(
        'is-hidden',
        maximumScrollLeft <= 2 ||
          chartLegend.scrollLeft <=
            tolerance
      );

      legendScrollRight.classList.toggle(
        'is-hidden',
        maximumScrollLeft <= 2 ||
          chartLegend.scrollLeft >=
            maximumScrollLeft -
            tolerance
      );
    }

    function renderLegendItems(config) {
      const hidden =
        hiddenSeriesByView.get(
          currentLegendKey()
        ) ||
        new Set();

      chartLegend.textContent = '';

      config.labels.forEach(
        (labelText, datasetIndex) => {
          const item =
            document.createElement(
              'button'
            );

          item.type =
            'button';

          item.className =
            'legend-item';

          const isVisible =
            !hidden.has(labelText);

          item.setAttribute(
            'aria-pressed',
            String(isVisible)
          );

          if (!isVisible) {
            item.classList.add(
              'is-hidden-series'
            );
          }

          const line =
            document.createElement(
              'span'
            );

          line.className =
            'legend-line';

          line.style.setProperty(
            '--legend-colour',
            config.colours[
              datasetIndex
            ]
          );

          const label =
            document.createElement(
              'span'
            );

          label.textContent =
            labelText;

          item.appendChild(line);
          item.appendChild(label);

          item.addEventListener(
            'click',
            () => {
              const viewKey =
                currentLegendKey();

              const currentHidden =
                new Set(
                  hiddenSeriesByView.get(
                    viewKey
                  ) ||
                  []
                );

              if (
                currentHidden.has(
                  labelText
                )
              ) {
                currentHidden.delete(
                  labelText
                );
              } else {
                currentHidden.add(
                  labelText
                );
              }

              hiddenSeriesByView.set(
                viewKey,
                currentHidden
              );

              const currentConfig =
                currentViewConfig();

              syncChartDatasets(
                currentConfig
              );

              if (chart) {
                chart.options.animation.duration =
                  reducedMotion()
                    ? 0
                    : 260;

                chart.options.animations.x.duration =
                  260;

                chart.options.animations.y.duration =
                  260;

                chart.options.animations.colors.duration =
                  260;

                chart.update();
              }

              renderLegendItems(
                currentConfig
              );
            }
          );

          chartLegend.appendChild(
            item
          );
        }
      );

      requestAnimationFrame(
        updateLegendScrollControls
      );
    }

    function animateLegendChange(config) {
      const token =
        ++legendAnimationToken;

      const drawLegend = () => {
        if (
          token !==
          legendAnimationToken
        ) {
          return;
        }

        renderLegendItems(config);
        chartLegend.scrollLeft = 0;
      };

      if (
        reducedMotion() ||
        typeof chartLegend.animate !==
          'function' ||
        !chartLegend.childElementCount
      ) {
        drawLegend();
        return;
      }

      chartLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const outgoing =
        chartLegend.animate(
          [
            {
              opacity: 1
            },
            {
              opacity: 0
            }
          ],
          {
            duration: 120,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      outgoing.finished
        .catch(() => {})
        .then(() => {
          drawLegend();

          if (
            token !==
            legendAnimationToken
          ) {
            return;
          }

          const incoming =
            chartLegend.animate(
              [
                {
                  opacity: 0
                },
                {
                  opacity: 1
                }
              ],
              {
                duration: 220,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'both'
              }
            );

          incoming.finished
            .then(
              () => incoming.cancel()
            )
            .catch(() => {});
        });
    }

    // ============================================================
    // DATASETS
    // ============================================================

    function slotSeriesIndex(
      slotIndex,
      config
    ) {
      if (!config.labels.length) {
        return 0;
      }

      return slotIndex <
        config.labels.length
        ? slotIndex
        : slotIndex %
            config.labels.length;
    }

    function datasetForSlot(
      slotIndex,
      config
    ) {
      const activeSeries =
        slotIndex <
        config.labels.length;

      const sourceIndex =
        slotSeriesIndex(
          slotIndex,
          config
        );

      const label =
        activeSeries
          ? config.labels[
              slotIndex
            ]
          : '';

      const hidden =
        hiddenSeriesByView.get(
          currentLegendKey()
        ) ||
        new Set();

      const userHidden =
        activeSeries &&
        hidden.has(label);

      const colour =
        activeSeries &&
        !userHidden
          ? config.colours[
              slotIndex
            ]
          : TRANSPARENT_COLOUR;

      return {
        label,

        data:
          rows.map(row => {
            const value =
              row[
                config.valueKey
              ]?.[
                sourceIndex
              ];

            return Number.isFinite(
              value
            )
              ? value
              : null;
          }),

        _activeSeries:
          activeSeries &&
          !userHidden,

        _seriesLabel:
          label,

        borderColor:
          colour,

        backgroundColor:
          colour,

        borderWidth: 3,
        fill: false,

        pointRadius: 0,

        pointHoverRadius:
          activeSeries &&
          !userHidden
            ? 4
            : 0,

        pointHitRadius:
          activeSeries &&
          !userHidden
            ? pointHitRadiusForViewport()
            : 0,

        pointBackgroundColor:
          colour,

        pointBorderColor:
          '#fff',

        pointBorderWidth:
          activeSeries &&
          !userHidden
            ? 1
            : 0,

        tension: 0.28,

        cubicInterpolationMode:
          'monotone',

        spanGaps: false
      };
    }

    function buildDatasets(config) {
      return Array.from(
        {
          length:
            SERIES_SLOT_COUNT
        },
        (_, slotIndex) =>
          datasetForSlot(
            slotIndex,
            config
          )
      );
    }

    function syncChartDatasets(config) {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets(config);

      nextDatasets.forEach(
        (nextDataset, index) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] = nextDataset;

            return;
          }

          current.label =
            nextDataset.label;

          current.data =
            nextDataset.data;

          current._activeSeries =
            nextDataset._activeSeries;

          current._seriesLabel =
            nextDataset._seriesLabel;

          current.borderColor =
            nextDataset.borderColor;

          current.backgroundColor =
            nextDataset.backgroundColor;

          current.pointBackgroundColor =
            nextDataset.pointBackgroundColor;

          current.pointBorderColor =
            nextDataset.pointBorderColor;

          current.pointBorderWidth =
            nextDataset.pointBorderWidth;

          current.pointHoverRadius =
            nextDataset.pointHoverRadius;

          current.pointHitRadius =
            nextDataset.pointHitRadius;

          current.borderWidth =
            nextDataset.borderWidth;

          current.tension =
            nextDataset.tension;

          current.cubicInterpolationMode =
            nextDataset.cubicInterpolationMode;

          current.spanGaps =
            nextDataset.spanGaps;

          current.fill =
            false;
        }
      );
    }

    // ============================================================
    // PFF AXES
    // ============================================================

    function drawYAxisTitle(
      context,
      chartArea
    ) {
      const mobile =
        window.innerWidth <= 430;

      const progress =
        clamp(
          yAxisTitleAnimation.progress,
          0,
          1
        );

      const outgoingOpacity =
        clamp(
          1 -
            progress * 2.2,
          0,
          1
        );

      const incomingOpacity =
        clamp(
          (
            progress - 0.32
          ) /
            0.68,
          0,
          1
        );

      const x =
        chartArea.left -
        (
          mobile
            ? 48
            : 54
        );

      const y =
        chartArea.top +
        chartArea.height / 2;

      const draw = (
        text,
        opacity
      ) => {
        if (
          !text ||
          opacity <= 0
        ) {
          return;
        }

        context.save();
        context.globalAlpha =
          opacity;
        context.translate(x, y);
        context.rotate(
          -Math.PI / 2
        );
        context.fillStyle =
          '#151515';
        context.textAlign =
          'center';
        context.textBaseline =
          'middle';
        context.font =
          `700 ${mobile ? 12 : 13}px Lato, sans-serif`;
        context.fillText(
          text,
          0,
          0
        );
        context.restore();
      };

      if (
        yAxisTitleAnimation.from ===
        yAxisTitleAnimation.to ||
        progress >= 1
      ) {
        draw(
          yAxisTitleAnimation.to,
          1
        );

        return;
      }

      draw(
        yAxisTitleAnimation.from,
        outgoingOpacity
      );

      draw(
        yAxisTitleAnimation.to,
        incomingOpacity
      );
    }

    const pffAxesPlugin = {
      id: 'pffDemographicsAxes',

      beforeDatasetsDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const majorTracks =
          currentMajorAxisTracks();

        const minorTracks =
          currentMinorAxisTracks();

        ctx.save();

        // Major horizontal guides slide with their Y-axis markings.
        for (
          const track of
          majorTracks
        ) {
          if (
            track.alpha <= 0.001 ||
            track.ratio <= 0.001
          ) {
            continue;
          }

          const y =
            chartArea.bottom -
            chartArea.height *
              track.ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );

          ctx.globalAlpha =
            clamp(
              track.alpha,
              0,
              1
            );

          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.075)';

          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // Minor guides use the same transition clock as the major ticks.
        for (
          const track of
          minorTracks
        ) {
          if (
            track.alpha <= 0.001
          ) {
            continue;
          }

          const y =
            chartArea.bottom -
            chartArea.height *
              track.ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );

          ctx.globalAlpha =
            clamp(
              track.alpha,
              0,
              1
            );

          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.035)';

          ctx.lineWidth = 0.7;
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea,
          scales
        } =
          chartInstance;

        const xScale =
          scales?.x;

        if (
          !chartArea ||
          !xScale
        ) {
          return;
        }

        const config =
          currentViewConfig();

        const majorTracks =
          currentMajorAxisTracks();

        const minorTracks =
          currentMinorAxisTracks();

        ctx.save();
        ctx.lineCap =
          'butt';

        ctx.strokeStyle =
          '#151515';

        ctx.lineWidth = 1;

        ctx.fillStyle =
          '#151515';

        ctx.textAlign =
          'right';

        ctx.textBaseline =
          'middle';

        ctx.font =
          '12px Lato, sans-serif';

        // Each major tick uses one interpolated position and value, so the
        // mark slides while its label counts in the same animation frame.
        for (
          const track of
          majorTracks
        ) {
          if (
            track.alpha <= 0.001
          ) {
            continue;
          }

          const y =
            chartArea.bottom -
            chartArea.height *
              track.ratio;

          ctx.globalAlpha =
            clamp(
              track.alpha,
              0,
              1
            );

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 5,
            Math.round(y) + 0.5
          );
          ctx.stroke();

          const baseAlpha =
            clamp(
              track.alpha,
              0,
              1
            );

          const fromDecimals =
            yAxisTransition.fromAxisDecimals;

          const toDecimals =
            yAxisTransition.toAxisDecimals;

          if (
            fromDecimals === toDecimals ||
            yAxisTransition.progress >= 1
          ) {
            ctx.globalAlpha =
              baseAlpha;

            ctx.fillText(
              formatAxisValueWithDecimals(
                track.value,
                toDecimals
              ),
              chartArea.left - 8,
              y
            );
          } else {
            const formatProgress =
              clamp(
                yAxisTransition.progress,
                0,
                1
              );

            const outgoingOpacity =
              clamp(
                1 - formatProgress * 2.2,
                0,
                1
              );

            const incomingOpacity =
              clamp(
                (
                  formatProgress - 0.32
                ) / 0.68,
                0,
                1
              );

            if (outgoingOpacity > 0) {
              ctx.globalAlpha =
                baseAlpha *
                outgoingOpacity;

              ctx.fillText(
                formatAxisValueWithDecimals(
                  track.value,
                  fromDecimals
                ),
                chartArea.left - 8,
                y
              );
            }

            if (incomingOpacity > 0) {
              ctx.globalAlpha =
                baseAlpha *
                incomingOpacity;

              ctx.fillText(
                formatAxisValueWithDecimals(
                  track.value,
                  toDecimals
                ),
                chartArea.left - 8,
                y
              );
            }
          }
        }

        // Minor Y ticks slide/fade with the same unified transition.
        ctx.strokeStyle =
          '#69718a';

        ctx.lineWidth = 0.7;

        for (
          const track of
          minorTracks
        ) {
          if (
            track.alpha <= 0.001
          ) {
            continue;
          }

          const y =
            chartArea.bottom -
            chartArea.height *
              track.ratio;

          ctx.globalAlpha =
            0.60 *
            clamp(
              track.alpha,
              0,
              1
            );

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 2,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        // X ticks: each year gets a tick; even years are major.
        ctx.globalAlpha =
          1;

        rows.forEach(
          (row, index) => {
            const year =
              Number(row.year);

            const x =
              xScale.getPixelForTick(
                index
              );

            if (!Number.isFinite(x)) {
              return;
            }

            const major =
              Number.isFinite(year) &&
              year % 2 === 0;

            ctx.strokeStyle =
              major
                ? '#151515'
                : '#69718a';

            ctx.globalAlpha =
              major
                ? 1
                : 0.60;

            ctx.lineWidth =
              major
                ? 1
                : 0.7;

            ctx.beginPath();
            ctx.moveTo(
              Math.round(x) + 0.5,
              chartArea.bottom
            );
            ctx.lineTo(
              Math.round(x) + 0.5,
              chartArea.bottom +
                (
                  major
                    ? 5
                    : 2
                )
            );
            ctx.stroke();
          }
        );

        ctx.restore();

        drawYAxisTitle(
          ctx,
          chartArea
        );
      }
    };

    const axisSpinesPlugin = {
      id: 'pffDemographicsAxisSpines',

      afterDraw(chartInstance) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        ctx.save();
        ctx.strokeStyle =
          '#151515';
        ctx.lineWidth =
          1.1;

        ctx.beginPath();
        ctx.moveTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(
          chartArea.left,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.lineTo(
          chartArea.right,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.stroke();

        ctx.restore();
      }
    };

    function trendSeriesTint(
      hex,
      strength = 0.20,
      alpha = 0.84
    ) {
      const cleaned =
        String(hex || '#69718a')
          .replace('#', '')
          .trim();

      if (!/^[0-9a-f]{6}$/i.test(cleaned)) {
        return `rgba(232, 234, 240, ${alpha})`;
      }

      const red =
        Number.parseInt(cleaned.slice(0, 2), 16);
      const green =
        Number.parseInt(cleaned.slice(2, 4), 16);
      const blue =
        Number.parseInt(cleaned.slice(4, 6), 16);

      const mix =
        channel =>
          Math.round(
            channel +
            (255 - channel) *
              (1 - strength)
          );

      return `rgba(${mix(red)}, ${mix(green)}, ${mix(blue)}, ${alpha})`;
    }

    function trendSeriesBorder(
      hex,
      alpha = 0.42
    ) {
      const cleaned =
        String(hex || '#69718a')
          .replace('#', '')
          .trim();

      if (!/^[0-9a-f]{6}$/i.test(cleaned)) {
        return `rgba(105, 113, 138, ${alpha})`;
      }

      const red =
        Number.parseInt(cleaned.slice(0, 2), 16);
      const green =
        Number.parseInt(cleaned.slice(2, 4), 16);
      const blue =
        Number.parseInt(cleaned.slice(4, 6), 16);

      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    const workforceTrendLabelsPlugin = {
      id: 'pffWorkforceTrendLabels',

      afterDatasetsDraw(chartInstance) {
        if (trendMode === 'off') {
          return;
        }

        const { ctx, chartArea } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const config =
          currentViewConfig();

        const mobile =
          window.innerWidth <= 430;

        const fontSize =
          mobile ? 8.2 : 9.1;

        const labelHeight =
          mobile ? 14 : 15;

        const paddingX =
          mobile ? 4 : 5;

        const arrowGap =
          mobile ? 2.5 : 3;

        const items = [];

        ctx.save();
        ctx.font =
          `700 ${fontSize}px Lato, sans-serif`;
        ctx.textBaseline =
          'middle';

        config.labels.forEach(
          (label, seriesIndex) => {
            const dataset =
              chartInstance.data.datasets[
                seriesIndex
              ];

            const meta =
              chartInstance.getDatasetMeta(
                seriesIndex
              );

            if (
              !dataset ||
              !dataset._activeSeries ||
              !meta ||
              meta.hidden ||
              !meta.data?.length
            ) {
              return;
            }

            const trend =
              latestWindowTrend(
                seriesIndex,
                activeTrendWindow(),
                config
              );

            if (!Number.isFinite(trend)) {
              return;
            }

            let anchorIndex = -1;

            for (
              let index =
                dataset.data.length - 1;
              index >= 0;
              index -= 1
            ) {
              if (
                Number.isFinite(
                  dataset.data[index]
                ) &&
                Number.isFinite(
                  meta.data[index]?.x
                ) &&
                Number.isFinite(
                  meta.data[index]?.y
                )
              ) {
                anchorIndex = index;
                break;
              }
            }

            if (anchorIndex < 0) {
              return;
            }

            const point =
              meta.data[anchorIndex];

            const isIncrease =
              trend > 0.05;

            const isDecrease =
              trend < -0.05;

            const arrow =
              isIncrease
                ? '↑'
                : isDecrease
                  ? '↓'
                  : '';

            const valueText =
              formatTrendValue(
                trend
              );

            const arrowWidth =
              arrow
                ? ctx.measureText(arrow).width
                : 0;

            const valueWidth =
              ctx.measureText(valueText).width;

            const labelWidth =
              paddingX * 2 +
              arrowWidth +
              (arrow ? arrowGap : 0) +
              valueWidth;

            items.push({
              label,
              seriesColour:
                config.colours[seriesIndex],
              isIncrease,
              isDecrease,
              arrow,
              valueText,
              arrowWidth,
              labelWidth,
              anchorX: point.x,
              anchorY: point.y
            });
          }
        );

        if (!items.length) {
          ctx.restore();
          return;
        }

        const placed = [];

        function overlaps(rectangle) {
          const padding = 5;

          return placed.some(
            existing =>
              !(
                rectangle.right + padding < existing.left ||
                rectangle.left - padding > existing.right ||
                rectangle.bottom + padding < existing.top ||
                rectangle.top - padding > existing.bottom
              )
          );
        }

        items
          .sort(
            (first, second) =>
              first.anchorY - second.anchorY
          )
          .forEach(
            (item, itemIndex) => {
              const horizontalOffsets =
                [0, -68, -136, -34, -102, -170];

              const verticalOffsets =
                [0, -2, 2, -4, 4, -6, 6, -8, 8];

              let chosen = null;

              for (
                const horizontalOffset
                of horizontalOffsets
              ) {
                for (
                  const verticalOffset
                  of verticalOffsets
                ) {
                  const proposedRight =
                    clamp(
                      chartArea.right -
                        4 +
                        horizontalOffset,
                      chartArea.left +
                        item.labelWidth +
                        5,
                      chartArea.right - 4
                    );

                  const proposedLeft =
                    proposedRight -
                    item.labelWidth;

                  const proposedY =
                    clamp(
                      item.anchorY +
                        verticalOffset,
                      chartArea.top +
                        labelHeight / 2,
                      chartArea.bottom -
                        labelHeight / 2
                    );

                  const rectangle = {
                    left: proposedLeft,
                    right: proposedRight,
                    top:
                      proposedY -
                      labelHeight / 2,
                    bottom:
                      proposedY +
                      labelHeight / 2,
                    y: proposedY
                  };

                  if (!overlaps(rectangle)) {
                    chosen = rectangle;
                    break;
                  }
                }

                if (chosen) {
                  break;
                }
              }

              if (!chosen) {
                const right =
                  clamp(
                    chartArea.right -
                      4 -
                      (itemIndex % 3) * 68,
                    chartArea.left +
                      item.labelWidth + 5,
                    chartArea.right - 4
                  );

                const y =
                  clamp(
                    item.anchorY +
                      (itemIndex % 2 === 0
                        ? -6
                        : 6),
                    chartArea.top +
                      labelHeight / 2,
                    chartArea.bottom -
                      labelHeight / 2
                  );

                chosen = {
                  left:
                    right - item.labelWidth,
                  right,
                  top:
                    y - labelHeight / 2,
                  bottom:
                    y + labelHeight / 2,
                  y
                };
              }

              item.labelLeft =
                chosen.left;
              item.labelRight =
                chosen.right;
              item.labelY =
                chosen.y;

              placed.push(chosen);
            }
          );

        items.forEach(item => {
          const targetX =
            item.anchorX < item.labelLeft
              ? item.labelLeft
              : item.anchorX > item.labelRight
                ? item.labelRight
                : clamp(
                    item.anchorX,
                    item.labelLeft,
                    item.labelRight
                  );

          const displaced =
            Math.abs(
              targetX - item.anchorX
            ) > 7 ||
            Math.abs(
              item.labelY - item.anchorY
            ) > 2 ||
            item.labelLeft <
              item.anchorX - 4;

          if (!displaced) {
            return;
          }

          ctx.beginPath();
          ctx.moveTo(
            item.anchorX,
            item.anchorY
          );
          ctx.lineTo(
            targetX,
            item.labelY
          );
          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.58)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        });

        items.forEach(item => {
          const fillColour =
            trendSeriesTint(
              item.seriesColour,
              0.20,
              0.84
            );

          const directionColour =
            item.isIncrease
              ? '#14823b'
              : item.isDecrease
                ? '#b42318'
                : '#69718a';

          const radius = 3;
          const top =
            item.labelY -
            labelHeight / 2;
          const bottom =
            item.labelY +
            labelHeight / 2;

          ctx.beginPath();
          ctx.moveTo(
            item.labelLeft + radius,
            top
          );
          ctx.lineTo(
            item.labelRight - radius,
            top
          );
          ctx.quadraticCurveTo(
            item.labelRight,
            top,
            item.labelRight,
            top + radius
          );
          ctx.lineTo(
            item.labelRight,
            bottom - radius
          );
          ctx.quadraticCurveTo(
            item.labelRight,
            bottom,
            item.labelRight - radius,
            bottom
          );
          ctx.lineTo(
            item.labelLeft + radius,
            bottom
          );
          ctx.quadraticCurveTo(
            item.labelLeft,
            bottom,
            item.labelLeft,
            bottom - radius
          );
          ctx.lineTo(
            item.labelLeft,
            top + radius
          );
          ctx.quadraticCurveTo(
            item.labelLeft,
            top,
            item.labelLeft + radius,
            top
          );
          ctx.closePath();

          ctx.fillStyle =
            fillColour;
          ctx.fill();

          ctx.strokeStyle =
            trendSeriesBorder(
              item.seriesColour,
              0.42
            );
          ctx.lineWidth = 0.65;
          ctx.stroke();

          let textX =
            item.labelLeft +
            paddingX;

          ctx.textAlign = 'left';
          ctx.fillStyle =
            directionColour;

          if (item.arrow) {
            ctx.fillText(
              item.arrow,
              textX,
              item.labelY - 0.2
            );

            textX +=
              item.arrowWidth +
              arrowGap;
          }

          ctx.fillText(
            item.valueText,
            textX,
            item.labelY
          );
        });

        ctx.restore();
      }
    };

    Chart.register(
      pffAxesPlugin,
      axisSpinesPlugin,
      workforceTrendLabelsPlugin
    );

    // ============================================================
    // CHART CONFIGURATION
    // ============================================================

    function chartAnimationDuration() {
      return reducedMotion()
        ? 0
        : VIEW_TRANSITION_MS;
    }

      const mobile =
        window.innerWidth <= 430;

      return {
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 0,

        devicePixelRatio:
          Math.min(
            window.devicePixelRatio || 1,
            3
          ),

        animation: {
          duration: VIEW_TRANSITION_MS,
          easing: 'easeInOutCubic'
        },

        animations: {
          x: {
            duration: VIEW_TRANSITION_MS,
            easing: 'easeInOutCubic'
          },

          y: {
            duration: VIEW_TRANSITION_MS,
            easing: 'easeInOutCubic'
          },

          colors: {
            type: 'color',
            properties: [
              'borderColor',
              'backgroundColor',
              'pointBackgroundColor'
            ],
            duration: 0
          }
        },

        transitions: {
          active: {
            animation: {
              duration: HOVER_ANIMATION_MS,

    function createChart(config) {
      setYAxisTransitionImmediately(
        config.scale,
        config.axisDecimals
      );

      setYAxisTitleImmediately(
        config.yTitle
      );

      if (chartHeadingFixed) {
        chartHeadingFixed.textContent =
          config.headingFixed;
      }

      if (chartHeadingDetail) {
        chartHeadingDetail.textContent =
          config.headingDetail;
      }

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type: 'line',

            data: {
              labels:
                rows.map(
                  row =>
                    String(row.year)
                ),

              datasets:
                buildDatasets(config)
            },

            options:
              baseChartOptions(config)
          }
        );

      renderLegendItems(config);
      lastRenderedConfig =
        cloneViewConfig(config);
    }

    function syncChartScale(config) {
      if (!chart) {
        return;
      }

      const y =
        chart.options.scales.y;

      y.min =
        config.scale.min;

      y.max =
        config.scale.max;

      y.ticks.stepSize =
        config.scale.step;
    }

    function updateChart(
      reason = 'option'
    ) {
      const config =
        currentViewConfig();

      const previousConfig =
        lastRenderedConfig;

      updateHeading(
        previousConfig,
        config,
        reason !== 'initial'
      );

      if (!chart) {
        createChart(config);
        return;
      }

      chart.tooltip.setActiveElements(
        [],
        {
          x: 0,
          y: 0
        }
      );

      const previousVisibleScale =
        currentYAxisScale();

      const previousVisibleAxisDecimals =
        currentYAxisAxisDecimals();

      const scaleChanged =
        !previousConfig ||
        !scalesMatch(
          previousConfig.scale,
          config.scale
        );

      const yTitleChanged =
        !previousConfig ||
        previousConfig.yTitle !==
          config.yTitle;

      const legendChanged =
        !previousConfig ||
        !arraysMatch(
          previousConfig.labels,
          config.labels
        ) ||
        !arraysMatch(
          previousConfig.colours,
          config.colours
        );

      syncChartDatasets(config);
      syncChartScale(config);

      const duration =
        chartAnimationDuration(reason);

      chart.options.animation.duration =
        duration;
      chart.options.animation.easing =
        'easeInOutCubic';

      chart.options.animations.x.duration =
        duration;
      chart.options.animations.x.easing =
        'easeInOutCubic';

      chart.options.animations.y.duration =
        duration;
      chart.options.animations.y.easing =
        'easeInOutCubic';

      chart.options.animations.colors.duration =
        0;

      chart.update();

      if (scaleChanged) {
        animateYAxisTransition(
          previousVisibleScale,
          config.scale,
          duration,
          previousVisibleAxisDecimals,
          config.axisDecimals
        );
      } else {
        setYAxisTransitionImmediately(
          config.scale,
          config.axisDecimals
        );
      }

      if (yTitleChanged) {
        animateYAxisTitle(
          config.yTitle,
          duration
        );
      }

      if (legendChanged) {
        animateLegendChange(config);
      }

      lastRenderedConfig =
        cloneViewConfig(config);
    }

    // ============================================================
    // TABS + METRIC CONTROL
    // ============================================================

    function updateTabIndicator(
      animate = true
    ) {
      const activeTab =
        chartTabs.find(
          tab =>
            tab.dataset.group ===
            activeGroup
        );

      if (!activeTab) {
        return;
      }

      if (!animate) {
        tabList.classList.add(
          'is-positioning'
        );
      }

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${activeTab.offsetLeft}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${activeTab.offsetWidth}px`
      );

      if (!animate) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            tabList.classList.remove(
              'is-positioning'
            );
          });
        });
      }
    }

    function syncMetricSwitch() {
      const isLocum =
        activeGroup === 'locums';

      metricSwitch.classList.toggle(
        'is-hidden',
        !isLocum
      );

      metricSwitch.setAttribute(
        'aria-hidden',
        String(!isLocum)
      );

      metricButtons.forEach(
        button => {
          button.tabIndex =
            isLocum
              ? 0
              : -1;
        }
      );

      metricSwitch.classList.toggle(
        'is-hours-selected',
        activeMetric === 'hours'
      );

      metricSwitch.classList.toggle(
        'is-clinicalshare-selected',
        activeMetric ===
          'clinicalshare'
      );

      metricButtons.forEach(button => {
        const active =
          button.dataset.metric ===
          activeMetric;

        button.classList.toggle(
          'is-active',
          active
        );

        button.setAttribute(
          'aria-pressed',
          String(active)
        );
      });
    }

    function updateTrendToggle() {
      const active =
        trendMode !== 'off';

      const label =
        trendMode === '10yr'
          ? '10yr Trend'
          : trendMode === '3yr'
            ? '3yr Trend'
            : 'Trend';

      yoyTrendToggle.classList.toggle(
        'is-on',
        active
      );

      yoyTrendToggle.setAttribute(
        'aria-pressed',
        String(active)
      );

      const labelElement =
        yoyTrendToggle.querySelector(
          '.yoy-toggle-label'
        );

      if (labelElement) {
        labelElement.textContent =
          label;
      }

      const nextMode =
        trendMode === '3yr'
          ? '10-year'
          : trendMode === '10yr'
            ? 'off'
            : '3-year';

      yoyTrendToggle.setAttribute(
        'aria-label',
        `${label}. Press to switch to ${nextMode} trend mode.`
      );
    }

    yoyTrendToggle.addEventListener(
      'click',
      () => {
        trendMode =
          trendMode === '3yr'
            ? '10yr'
            : trendMode === '10yr'
              ? 'off'
              : '3yr';

        updateTrendToggle();
        chart?.draw();
      }
    );

    function setGroup(group) {
      if (
        group === activeGroup
      ) {
        return;
      }

      activeGroup =
        group;

      chartTabs.forEach(tab => {
        const active =
          tab.dataset.group ===
          activeGroup;

        tab.classList.toggle(
          'is-active',
          active
        );

        tab.setAttribute(
          'aria-selected',
          String(active)
        );
      });

      syncMetricSwitch();
      updateTabIndicator(true);
      updateChart('tab');
    }

    function setMetric(metric) {
      if (
        metric === activeMetric
      ) {
        return;
      }

      activeMetric =
        metric;

      syncMetricSwitch();
      updateChart('option');
    }

    chartTabs.forEach(tab => {
      tab.addEventListener(
        'click',
        () => {
          setGroup(
            tab.dataset.group
          );
        }
      );
    });

    metricButtons.forEach(button => {
      button.addEventListener(
        'click',
        () => {
          const metricOrder = [
            'share',
            'hours',
            'clinicalshare'
          ];

          const currentIndex =
            metricOrder.indexOf(
              activeMetric
            );

          const nextMetric =
            button.dataset.metric ===
            activeMetric
              ? metricOrder[
                  (
                    currentIndex + 1
                  ) %
                  metricOrder.length
                ]
              : button.dataset.metric;

          setMetric(
            nextMetric
          );
        }
      );
    });

    // ============================================================
    // TAB / HEADING / LEGEND SCROLLING
    // ============================================================

    tabScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();
        scrollByAmount(
          tabList,
          -1
        );
      }
    );

    tabScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();
        scrollByAmount(
          tabList,
          1
        );
      }
    );

    tabList.addEventListener(
      'scroll',
      updateTabScrollControls,
      { passive: true }
    );

    headingScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();
        scrollByAmount(
          headingScrollViewport,
          -1
        );
      }
    );

    headingScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();
        scrollByAmount(
          headingScrollViewport,
          1
        );
      }
    );

    headingScrollViewport.addEventListener(
      'scroll',
      updateHeadingScrollControls,
      { passive: true }
    );

    legendScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            -Math.max(
              110,
              chartLegend.clientWidth *
                0.72
            ),

          behavior: 'smooth'
        });
      }
    );

    legendScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            Math.max(
              110,
              chartLegend.clientWidth *
                0.72
            ),

          behavior: 'smooth'
        });
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive: true
      }
    );

    // ============================================================
    // INTERACTION + RESPONSIVE LAYOUT
    // ============================================================

    chartCanvas.addEventListener(
      'contextmenu',
      event => {
        event.preventDefault();
      }
    );

    chartCanvas.addEventListener(
      'selectstart',
      event => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      'pointerdown',
      event => {
        if (
          !event.target.closest(
            '#workforceChart'
          ) &&
          chart
        ) {
          chart.tooltip.setActiveElements(
            [],
            {
              x: 0,
              y: 0
            }
          );

          chart.update('none');
        }
      }
    );

    function refreshResponsiveLayout() {
      if (
        responsiveFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveFrame
        );
      }

      responsiveFrame =
        requestAnimationFrame(() => {
          responsiveFrame =
            null;

          if (chart) {
            const mobile =
              mobileLayout();

            chart.options.interaction.intersect =
              mobile;

            chart.options.layout.padding.top =
              mobile ? 8 : 9;

            chart.options.scales.x.ticks.font.size =
              mobile ? 9 : 10;

            chart.options.scales.x.title.font.size =
              mobile ? 12 : 13;

            chart.options.scales.y.afterFit =
              scale => {
                scale.width =
                  mobile ? 61 : 69;
              };

            chart.data.datasets.forEach(
              dataset => {
                dataset.pointHitRadius =
                  dataset._activeSeries
                    ? pointHitRadiusForViewport()
                    : 0;
              }
            );

            chart.resize();
          }

          updateTabIndicator(false);
          updateTabScrollControls();
          updateHeadingScrollControls();
          updateLegendScrollControls();
        });
    }

    if ('ResizeObserver' in window) {
      const layoutResizeObserver =
        new ResizeObserver(entries => {
          const hasUsableSize =
            entries.some(
              entry =>
                entry.contentRect.width > 1 &&
                entry.contentRect.height > 1
            );

          if (hasUsableSize) {
            refreshResponsiveLayout();
          }
        });

      layoutResizeObserver.observe(app);
      layoutResizeObserver.observe(chartShell);
    }

    window.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive: true
      }
    );

    window.visualViewport?.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive: true
      }
    );

    window.addEventListener(
      'pageshow',
      refreshResponsiveLayout
    );

    if (document.fonts?.ready) {
      document.fonts.ready.then(
        refreshResponsiveLayout
      );
    }

    // ============================================================
    // STARTUP
    // ============================================================

    async function start() {
      statusElement.textContent = '';

      try {
        const table =
          await loadGVizSheet(
            SHEET_NAME,
            DATA_RANGE
          );

        rows =
          parseWorkforceTable(
            table
          );

        saveLocalCache(rows);
        setDataSource('live');
      } catch (liveError) {
        console.warn(
          'Live locum/non-clinician data unavailable; trying local cache.',
          liveError
        );

        const cached =
          loadLocalCache();

        if (cached) {
          rows =
            cached;
        } else {
          rows =
            EMBEDDED_FALLBACK;
        }

        setDataSource('cached');
      }

      try {
        const config =
          currentViewConfig();

        createChart(config);
        syncMetricSwitch();
        updateTrendToggle();
        updateTabIndicator(false);
        updateTabScrollControls();
        updateHeadingScrollControls();
        hideLoadingState();
      } catch (error) {
        console.error(error);

        statusElement.textContent =
          String(
            error?.message ||
            'Unable to render locum/non-clinician chart'
          )
            .replace(/\.+$/, '');

        hideLoadingState();
      }
    }

    start();
  </script>
</body>
