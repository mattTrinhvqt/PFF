<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Locum and Non-clinician Trends</title>

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <script src="./assets/pff_chart_core.js"></script>

  <style>
    :root {
      --pff-metric-columns: 3;
      --pff-metric-width: 196px;
      --pff-metric-width-mobile: 186px;
      --pff-metric-width-small: 174px;
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading workforce data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading workforce data…</div>
      </div>

      <div class="module-top">
        <div id="tabScrollShell" class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Workforce role view"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-group="locums"
              aria-selected="true"
            >Locums</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-group="nonclinician"
              aria-selected="false"
            >Non-clinician roles</button>
          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"
            type="button"
            aria-label="Scroll tabs right"
          >›</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll graph title left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">
              <span id="chartHeadingFixed" class="chart-heading-fixed">Locums</span><span id="chartHeadingDetail" class="chart-heading-detail"></span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll graph title right"
          >›</button>
        </div>

        <div class="heading-controls">
          <button
            id="yoyTrendToggle"
            class="yoy-trend-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="3yr Trend. Press to switch to 10-year trend mode."
          >
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">3yr Trend</span>
          </button>

          <div
            id="metricSwitch"
            class="metric-switch"
            role="group"
            aria-label="Locum metric"
          >
            <button
              id="shareButton"
              class="metric-button is-active"
              type="button"
              data-metric="share"
              aria-pressed="true"
            >Locum %</button>

            <button
              id="hoursButton"
              class="metric-button"
              type="button"
              data-metric="hours"
              aria-pressed="false"
            >Weekly hours</button>

            <button
              id="clinicalShareButton"
              class="metric-button"
              type="button"
              data-metric="clinicalshare"
              aria-pressed="false"
            >Clinical hours %</button>
          </div>
        </div>
      </div>

      <div id="legendNav" class="legend-nav">
        <button
          id="legendScrollLeft"
          class="legend-scroll-button legend-scroll-left is-hidden"
          type="button"
          aria-label="Scroll legend left"
        >‹</button>

        <div class="legend-viewport">
          <div
            id="chartLegend"
            class="chart-legend"
            aria-label="Chart legend"
          ></div>
        </div>

        <button
          id="legendScrollRight"
          class="legend-scroll-button legend-scroll-right is-hidden"
          type="button"
          aria-label="Scroll legend right"
        >›</button>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas
          id="workforceChart"
          aria-label="Australian optometry locum and non-clinician trends chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    // ============================================================
    // DATA SOURCE + APP-SPECIFIC SERIES
    // ============================================================

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const SHEET_NAME =
      'Miscellaneous';

    /*
      Row 31 contains the live headers for the two source areas used here.

      M:S  = Job role percentages
             M = Year
             O = Admin
             P = Teacher or Educator
             Q = Researcher
             R = Other
             S = Academic

      AJ:AQ = Locum measures
              AJ = Year, AK = locums as % of all clinicians
              AM = Year, AN = locum mean weekly clinical hours
              AP = Year, AQ = locum share of clinical hours

      One combined range is used so all views load in a single request.
      Row 31 is the GViz header row and row 32 onward is data.
    */
    const DATA_RANGE =
      'M31:AQ';

    const FETCH_TIMEOUT_MS =
      15000;

    const LOCAL_CACHE_KEY =
      'pff-locum-nonclinician-trends-v1';

    const LOCUM_LABELS = [
      'Locums'
    ];

    const NONCLINICIAN_LABELS = [
      'Academic',
      'Admin',
      'Other',
      'Researcher',
      'Teacher or educator'
    ];

    const LOCUM_COLOURS = [
      '#c7c7c7'
    ];

    const NONCLINICIAN_COLOURS = [
      '#59a14f',
      '#666666',
      '#ff7f0e',
      '#6a3d9a',
      '#247db8'
    ];

    const SERIES_SLOT_COUNT =
      NONCLINICIAN_LABELS.length;

    const EMBEDDED_FALLBACK = [
      {year:2013,locumShare:[9.151952251],locumHours:[28.7],locumClinicalShare:[7.771036379],nonClinician:[null,1.659160939,0.2133206921,1.374733349,1.398435648]},
      {year:2014,locumShare:[9.16585839],locumHours:[28],locumClinicalShare:[7.593018785],nonClinician:[null,1.457658491,0.3470615456,1.318833873,1.457658491]},
      {year:2015,locumShare:[9.448275862],locumHours:[27.8],locumClinicalShare:[7.817323481],nonClinician:[null,1.338599956,0.3949967084,1.492209787,1.338599956]},
      {year:2016,locumShare:[8.758314856],locumHours:[28],locumClinicalShare:[7.364348828],nonClinician:[null,1.499788762,0.5280946346,1.351922264,1.330798479]},
      {year:2017,locumShare:[8.74186551],locumHours:[27.8],locumClinicalShare:[7.319995818],nonClinician:[null,1.262417219,0.5794701987,1.36589404,1.407284768]},
      {year:2018,locumShare:[9.867054425],locumHours:[28.3],locumClinicalShare:[8.385514721],nonClinician:[null,1.541501976,0.4545454545,1.304347826,1.52173913]},
      {year:2019,locumShare:[10.22615536],locumHours:[28.3],locumClinicalShare:[8.743208358],nonClinician:[null,1.48217636,0.487804878,1.144465291,1.48217636]},
      {year:2020,locumShare:[8.547669696],locumHours:[24.4],locumClinicalShare:[6.538029486],nonClinician:[null,1.269082214,0.5701673717,1.232297223,1.839249586]},
      {year:2021,locumShare:[7.662265204],locumHours:[24.5],locumClinicalShare:[5.921939984],nonClinician:[1.107984523,1.741118537,0.3517411185,1.213506859,1.020049244]},
      {year:2022,locumShare:[9.012950648],locumHours:[26.8],locumClinicalShare:[7.319608405],nonClinician:[1.149616794,1.466177941,0.3332222592,1.016327891,0.8330556481]},
      {year:2023,locumShare:[9.332664325],locumHours:[26.3],locumClinicalShare:[7.552279131],nonClinician:[1.051792829,1.593625498,0.2390438247,0.9402390438,0.8924302789]},
      {year:2024,locumShare:[7.32689211],locumHours:[24.7],locumClinicalShare:[5.58562454],nonClinician:[1.088456232,1.609688793,0.2759466503,0.9658132761,0.8585006899]}
    ];

    const TRANSPARENT_COLOUR =
      'rgba(0, 0, 0, 0)';

    // ============================================================
    // DOM + STATE
    // ============================================================

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById('loadingState');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartTabs =
      Array.from(
        document.querySelectorAll('.chart-tab')
      );

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const metricSwitch =
      document.getElementById('metricSwitch');

    const metricButtons =
      Array.from(
        document.querySelectorAll('.metric-button')
      );

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const chartHeadingFixed =
      document.getElementById('chartHeadingFixed');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartShell =
      document.getElementById('chartShell');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const chartCanvas =
      document.getElementById('workforceChart');

    let rows = [];
    let chart = null;
    let activeGroup = 'locums';
    let activeMetric = 'share';
    let trendMode = '3yr';
    let lastRenderedConfig = null;

    let yAxisController = null;
    let tabsController = null;
    let metricController = null;
    let trendController = null;
    let headingScroller = null;
    let legendController = null;
    let responsiveController = null;
    let chartInteractions = null;
    let chartSummary = null;
    let legendAnimationToken = 0;

    const hiddenSeriesByView =
      new Map();

    // ============================================================
    // LOCUM / ROLE DATA
    // ============================================================

    function numericWorkforceCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      const direct =
        PFFCharts.numericCell(cell);

      if (Number.isFinite(direct)) {
        return direct;
      }

      const cleaned =
        PFF.cleanText(
          cell.f ?? cell.v
        )
          .replace(/[^\d.-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function parseWorkforceTable(table) {
      const sourceRows =
        table?.rows || [];

      const parsed = [];

      sourceRows.forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const roleYear =
          numericWorkforceCell(cells[0]);

        const locumYear =
          numericWorkforceCell(cells[23]);

        const year =
          Number.isFinite(roleYear)
            ? Math.round(roleYear)
            : Number.isFinite(locumYear)
              ? Math.round(locumYear)
              : NaN;

        if (!Number.isFinite(year)) {
          return;
        }

        const record = {
          year,

          nonClinician: [
            numericWorkforceCell(cells[6]),
            numericWorkforceCell(cells[2]),
            numericWorkforceCell(cells[5]),
            numericWorkforceCell(cells[4]),
            numericWorkforceCell(cells[3])
          ],

          locumShare: [
            numericWorkforceCell(cells[24])
          ],

          locumHours: [
            numericWorkforceCell(cells[27])
          ],

          locumClinicalShare: [
            numericWorkforceCell(cells[30])
          ]
        };

        const hasUsableValues =
          [
            ...record.nonClinician,
            ...record.locumShare,
            ...record.locumHours,
            ...record.locumClinicalShare
          ].some(
            Number.isFinite
          );

        if (hasUsableValues) {
          parsed.push(record);
        }
      });

      const uniqueByYear =
        new Map();

      parsed.forEach(row => {
        uniqueByYear.set(
          row.year,
          row
        );
      });

      const result =
        Array.from(
          uniqueByYear.values()
        )
          .sort(
            (first, second) =>
              first.year - second.year
          );

      if (result.length < 2) {
        throw new Error(
          'No usable locum or non-clinician trend rows were found.'
        );
      }

      return result;
    }

    // ============================================================
    // VIEW CONFIGURATION
    // ============================================================

    function currentLegendKey() {
      return activeGroup;
    }

    function currentViewConfig() {
      if (activeGroup === 'nonclinician') {
        return {
          headingFixed: 'Non-clinician roles',
          headingDetail: '',
          labels: NONCLINICIAN_LABELS,
          colours: NONCLINICIAN_COLOURS,
          valueKey: 'nonClinician',
          yTitle: '% of optometry roles',
          scale: {
            min: 0,
            max: 2,
            step: 0.5,
            intervals: 4
          },
          axisDecimals: 1,
          decimals: 1,
          tooltipSuffix: '%'
        };
      }

      if (activeMetric === 'hours') {
        return {
          headingFixed: 'Locums',
          headingDetail: '',
          labels: LOCUM_LABELS,
          colours: LOCUM_COLOURS,
          valueKey: 'locumHours',
          yTitle: 'Weekly hours',
          scale: {
            min: 0,
            max: 30,
            step: 10,
            intervals: 3
          },
          axisDecimals: 0,
          decimals: 1,
          tooltipSuffix: ' hrs'
        };
      }

      if (activeMetric === 'clinicalshare') {
        return {
          headingFixed: 'Locums',
          headingDetail: '',
          labels: LOCUM_LABELS,
          colours: LOCUM_COLOURS,
          valueKey: 'locumClinicalShare',
          yTitle: '% of clinical hours',
          scale: {
            min: 0,
            max: 10,
            step: 2,
            intervals: 5
          },
          axisDecimals: 0,
          decimals: 1,
          tooltipSuffix: '%'
        };
      }

      return {
        headingFixed: 'Locums',
        headingDetail: '',
        labels: LOCUM_LABELS,
        colours: LOCUM_COLOURS,
        valueKey: 'locumShare',
        yTitle: '% of clinicians',
        scale: {
          min: 0,
          max: 12,
          step: 2,
          intervals: 6
        },
        axisDecimals: 0,
        decimals: 1,
        tooltipSuffix: '%'
      };
    }

    function valueForRow(
      row,
      config,
      seriesIndex
    ) {
      const value =
        row?.[config.valueKey]?.[
          seriesIndex
        ];

      return Number.isFinite(value)
        ? value
        : NaN;
    }

    function formatTooltipValue(
      value,
      config
    ) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      return `${new Intl.NumberFormat(
        'en-AU',
        {
          minimumFractionDigits:
            config.decimals,

          maximumFractionDigits:
            config.decimals
        }
      ).format(value)}${config.tooltipSuffix}`;
    }

    function activeTrendWindow() {
      return trendMode === '10yr'
        ? 10
        : trendMode === '3yr'
          ? 3
          : 0;
    }

    function trendForSeries(
      seriesIndex,
      config = currentViewConfig()
    ) {
      const windowSize =
        activeTrendWindow();

      if (windowSize < 2) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        rows,
        row =>
          valueForRow(
            row,
            config,
            seriesIndex
          ),
        windowSize
      );
    }

    // ============================================================
    // DATASETS
    // ============================================================

    function slotSeriesIndex(
      slotIndex,
      config
    ) {
      if (!config.labels.length) {
        return 0;
      }

      return slotIndex <
        config.labels.length
        ? slotIndex
        : slotIndex %
            config.labels.length;
    }

    function datasetForSlot(
      slotIndex,
      config
    ) {
      const activeSeries =
        slotIndex <
        config.labels.length;

      const sourceIndex =
        slotSeriesIndex(
          slotIndex,
          config
        );

      const label =
        activeSeries
          ? config.labels[
              slotIndex
            ]
          : '';

      const hidden =
        hiddenSeriesByView.get(
          currentLegendKey()
        ) ||
        new Set();

      const userHidden =
        activeSeries &&
        hidden.has(label);

      const visible =
        activeSeries &&
        !userHidden;

      const colour =
        visible
          ? config.colours[
              slotIndex
            ]
          : TRANSPARENT_COLOUR;

      return PFFCharts.lineDataset({
        label,

        data:
          rows.map(row => {
            const value =
              valueForRow(
                row,
                config,
                sourceIndex
              );

            return Number.isFinite(
              value
            )
              ? value
              : null;
          }),

        _activeSeries:
          visible,

        _seriesLabel:
          label,

        borderColor:
          colour,

        backgroundColor:
          colour,

        pointBackgroundColor:
          colour,

        pointBorderColor:
          '#fff',

        pointBorderWidth:
          visible ? 1 : 0,

        pointHoverRadius:
          visible ? 4 : 0,

        pointHitRadius:
          visible
            ? (
                PFFCharts.mobileLayout()
                  ? 9
                  : 5
              )
            : 0,

        cubicInterpolationMode:
          'monotone'
      });
    }

    function buildDatasets(config) {
      return Array.from(
        {
          length:
            SERIES_SLOT_COUNT
        },
        (_, slotIndex) =>
          datasetForSlot(
            slotIndex,
            config
          )
      );
    }

    function syncChartDatasets(config) {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets(config);

      nextDatasets.forEach(
        (nextDataset, index) => {
          const current =
            chart.data.datasets[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] = nextDataset;
          } else {
            Object.assign(
              current,
              nextDataset
            );
          }

          const activeSeries =
            index <
            config.labels.length;

          const hidden =
            hiddenSeriesByView.get(
              currentLegendKey()
            ) ||
            new Set();

          const label =
            activeSeries
              ? config.labels[index]
              : '';

          const userHidden =
            activeSeries &&
            hidden.has(label);

          if (
            typeof chart.setDatasetVisibility ===
            'function'
          ) {
            chart.setDatasetVisibility(
              index,
              activeSeries
                ? !userHidden
                : true
            );
          }
        }
      );
    }

    // ============================================================
    // SHARED PFF PLUGINS
    // ============================================================

    const yearTicksPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'pffJobRolesYearTicks',

        getValue({
          index
        }) {
          return rows[index]?.year;
        }
      });

    const trendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'pffJobRoleTrendLabels',

        enabled() {
          return trendMode !==
            'off';
        },

        isActive({
          dataset
        }) {
          return Boolean(
            dataset?._activeSeries
          );
        },

        getTrendValue({
          datasetIndex
        }) {
          return trendForSeries(
            datasetIndex
          );
        },

        getSeriesColour({
          datasetIndex
        }) {
          return currentViewConfig()
            .colours[
              datasetIndex
            ] ||
            '#69718a';
        }
      });

    // ============================================================
    // CHART
    // ============================================================

    function baseChartOptions(config) {
      return PFFCharts.baseChartOptions({
        transitions:
          PFFCharts.seriesVisibilityTransitionOptions(
            240
          ),

        plugins: {
          tooltip: {
            filter(context) {
              return Boolean(
                context.dataset
                  ._activeSeries
              );
            },

            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      items[0].label
                    )
                  : '';
              },

              label(context) {
                return `${context.dataset._seriesLabel}: ${formatTooltipValue(
                  Number(
                    context.raw
                  ),
                  currentViewConfig()
                )}`;
              }
            }
          }
        },

        scales: {
          x:
            PFFCharts.xYearScaleOptions({
              ticks: {
                callback(
                  value,
                  index
                ) {
                  const year =
                    Number(
                      rows[index]?.year
                    );

                  return Number.isFinite(year) &&
                    year % 2 === 0
                    ? String(year)
                    : '';
                }
              }
            }),

          y:
            PFFCharts.yScaleOptions(
              config.scale,
              {
                ticks: {
                  stepSize:
                    config.scale.step
                }
              }
            )
        }
      });
    }

    function syncChartScale(config) {
      if (!chart) {
        return;
      }

      const y =
        chart.options.scales.y;

      y.min =
        config.scale.min;

      y.max =
        config.scale.max;

      y.ticks.stepSize =
        config.scale.step;
    }

    function updateHeading(
      previousConfig,
      nextConfig,
      animate = true
    ) {
      const changed =
        !previousConfig ||
        previousConfig.headingFixed !==
          nextConfig.headingFixed ||
        previousConfig.headingDetail !==
          nextConfig.headingDetail;

      if (changed) {
        if (animate) {
          PFFCharts.animateHeading({
            fixed:
              chartHeadingFixed,

            detail:
              chartHeadingDetail,

            fixedText:
              nextConfig.headingFixed,

            detailText:
              nextConfig.headingDetail,

            duration:
              PFFCharts.defaults
                .viewTransitionMs,

            onComplete() {
              headingScroller?.update();
            }
          });
        } else {
          chartHeadingFixed.textContent =
            nextConfig.headingFixed;

          chartHeadingDetail.textContent =
            nextConfig.headingDetail;
        }
      }

      headingScrollViewport.scrollLeft =
        0;

      requestAnimationFrame(
        () =>
          headingScroller?.update()
      );
    }

    function legendItems() {
      const config =
        currentViewConfig();

      const hidden =
        hiddenSeriesByView.get(
          currentLegendKey()
        ) ||
        new Set();

      return config.labels.map(
        (
          label,
          datasetIndex
        ) => ({
          datasetIndex,
          label,
          colour:
            config.colours[
              datasetIndex
            ],
          active:
            !hidden.has(label)
        })
      );
    }

    function renderLegend(
      animate = false
    ) {
      if (!legendController) {
        return;
      }

      const draw = () => {
        legendController.render();
        chartLegend.scrollLeft = 0;
      };

      if (
        !animate ||
        PFFCharts.reducedMotion() ||
        typeof chartLegend.animate !==
          'function' ||
        !chartLegend.childElementCount
      ) {
        draw();
        return;
      }

      const token =
        ++legendAnimationToken;

      chartLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const outgoing =
        chartLegend.animate(
          [
            { opacity: 1 },
            { opacity: 0 }
          ],
          {
            duration: 120,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      outgoing.finished
        .catch(() => {})
        .then(() => {
          if (
            token !==
            legendAnimationToken
          ) {
            return;
          }

          outgoing.cancel();
          draw();

          const incoming =
            chartLegend.animate(
              [
                { opacity: 0 },
                { opacity: 1 }
              ],
              {
                duration: 220,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'both'
              }
            );

          incoming.finished
            .then(
              () => incoming.cancel()
            )
            .catch(() => {});
        });
    }

    function syncMetricVisibility() {
      const isLocum =
        activeGroup === 'locums';

      metricSwitch.classList.toggle(
        'is-hidden',
        !isLocum
      );

      metricSwitch.setAttribute(
        'aria-hidden',
        String(!isLocum)
      );

      if (isLocum) {
        metricController?.set(
          activeMetric,
          false
        );
      } else {
        metricButtons.forEach(
          button => {
            button.tabIndex = -1;
          }
        );
      }
    }

    function updateAccessibleSummary() {
      if (
        !chartSummary ||
        !rows.length
      ) {
        return;
      }

      const config =
        currentViewConfig();

      const latest =
        rows[
          rows.length - 1
        ];

      const values =
        config.labels
          .map(
            (
              label,
              index
            ) => {
              const value =
                valueForRow(
                  latest,
                  config,
                  index
                );

              return `${label} ${formatTooltipValue(
                value,
                config
              )}`;
            }
          )
          .join(', ');

      const trendDescription =
        trendMode === 'off'
          ? 'Trend annotations are off.'
          : `${activeTrendWindow()}-year trend annotations are on.`;

      PFFCharts.updateChartSummary(
        `${config.headingFixed}. Latest data ${latest.year}: ${values}. ${trendDescription}`,
        chartSummary
      );
    }

    function createChart(config) {
      chartHeadingFixed.textContent =
        config.headingFixed;

      chartHeadingDetail.textContent =
        config.headingDetail;

      yAxisController =
        PFFCharts.createUnifiedYAxis({
          id:
            'pffJobRolesAxes',

          getChart() {
            return chart;
          },

          getScale() {
            return currentViewConfig()
              .scale;
          },

          getDecimals() {
            return currentViewConfig()
              .axisDecimals;
          },

          getTitle() {
            return currentViewConfig()
              .yTitle;
          }
        });

      yAxisController.setImmediately(
        config.scale,
        config.axisDecimals
      );

      yAxisController.setTitleImmediately(
        config.yTitle
      );

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            type: 'line',

            data: {
              labels:
                rows.map(
                  row =>
                    String(row.year)
                ),

              datasets:
                buildDatasets(config)
            },

            options:
              baseChartOptions(config),

            plugins: [
              yAxisController.plugin,
              yearTicksPlugin,
              trendLabelsPlugin
            ]
          }
        );

      syncChartDatasets(config);

      lastRenderedConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      updateAccessibleSummary();
    }

    function updateChart(
      reason = 'option'
    ) {
      const config =
        currentViewConfig();

      const previousConfig =
        lastRenderedConfig;

      updateHeading(
        previousConfig,
        config,
        reason !== 'initial'
      );

      if (!chart) {
        createChart(config);
        return;
      }

      chart.tooltip.setActiveElements(
        [],
        {
          x: 0,
          y: 0
        }
      );

      const previousVisibleScale =
        yAxisController.currentScale();

      const previousAxisDecimals =
        yAxisController.currentDecimals();

      const scaleChanged =
        !previousConfig ||
        !PFFCharts.scalesMatch(
          previousConfig.scale,
          config.scale
        ) ||
        previousConfig.axisDecimals !==
          config.axisDecimals;

      const yTitleChanged =
        !previousConfig ||
        previousConfig.yTitle !==
          config.yTitle;

      const legendChanged =
        !previousConfig ||
        !PFFCharts.arraysMatch(
          previousConfig.labels,
          config.labels
        ) ||
        !PFFCharts.arraysMatch(
          previousConfig.colours,
          config.colours
        );

      syncChartDatasets(config);
      syncChartScale(config);

      const duration =
        reason === 'initial'
          ? 0
          : PFFCharts
              .chartAnimationDuration();

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeInOutCubic';

      chart.options.animations.x.duration =
        duration;

      chart.options.animations.x.easing =
        'easeInOutCubic';

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeInOutCubic';

      chart.options.animations.colors.duration =
        0;

      chart.update();

      if (scaleChanged) {
        yAxisController.animate(
          previousVisibleScale,
          config.scale,
          {
            duration,
            fromDecimals:
              previousAxisDecimals,
            toDecimals:
              config.axisDecimals
          }
        );
      } else {
        yAxisController.setImmediately(
          config.scale,
          config.axisDecimals
        );
      }

      if (yTitleChanged) {
        yAxisController.animateTitle(
          previousConfig?.yTitle ??
            config.yTitle,
          config.yTitle,
          duration
        );
      } else {
        yAxisController.setTitleImmediately(
          config.yTitle
        );
      }

      if (legendChanged) {
        renderLegend(
          reason !== 'initial'
        );
      } else {
        legendController?.render();
      }

      lastRenderedConfig =
        PFFCharts.cloneViewConfig(
          config
        );

      updateAccessibleSummary();
    }

    // ============================================================
    // SHARED CONTROLS
    // ============================================================

    function setupControls() {
      headingScroller =
        PFFCharts.setupScrollableRegion({
          scroller:
            headingScrollViewport,

          leftButton:
            headingScrollLeft,

          rightButton:
            headingScrollRight
        });

      tabsController =
        PFFCharts.setupTabs({
          tabList,

          tabs:
            chartTabs,

          valueAttribute:
            'group',

          initialValue:
            activeGroup,

          leftButton:
            tabScrollLeft,

          rightButton:
            tabScrollRight,

          onChange(group) {
            if (
              group ===
              activeGroup
            ) {
              return;
            }

            activeGroup =
              group;

            syncMetricVisibility();

            updateChart(
              'tab'
            );
          }
        });

      metricController =
        PFFCharts.setupMetricSwitch({
          element:
            metricSwitch,

          buttons:
            metricButtons,

          valueAttribute:
            'metric',

          initialValue:
            activeMetric,

          onChange(metric) {
            if (
              metric ===
              activeMetric ||
              activeGroup !==
                'locums'
            ) {
              return;
            }

            activeMetric =
              metric;

            updateChart(
              'option'
            );
          }
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,

          initialMode:
            trendMode,

          onChange(mode) {
            trendMode =
              mode;

            updateAccessibleSummary();
            chart?.draw();
          }
        });

      legendController =
        PFFCharts.setupLegend({
          legend:
            chartLegend,

          leftButton:
            legendScrollLeft,

          rightButton:
            legendScrollRight,

          getChart() {
            return chart;
          },

          getItems:
            legendItems,

          onToggle({
            datasetIndex,
            visible,
            item
          }) {
            const key =
              currentLegendKey();

            const hidden =
              new Set(
                hiddenSeriesByView.get(
                  key
                ) ||
                []
              );

            if (visible) {
              hidden.delete(
                item.label
              );
            } else {
              hidden.add(
                item.label
              );
            }

            hiddenSeriesByView.set(
              key,
              hidden
            );

            const config =
              currentViewConfig();

            const dataset =
              chart?.data?.datasets?.[
                datasetIndex
              ];

            if (dataset) {
              dataset._activeSeries =
                visible;

              const colour =
                visible
                  ? config.colours[
                      datasetIndex
                    ]
                  : TRANSPARENT_COLOUR;

              dataset.borderColor =
                colour;

              dataset.backgroundColor =
                colour;

              dataset.pointBackgroundColor =
                colour;

              dataset.pointBorderWidth =
                visible ? 1 : 0;

              dataset.pointHoverRadius =
                visible ? 4 : 0;

              dataset.pointHitRadius =
                visible
                  ? (
                      PFFCharts.mobileLayout()
                        ? 9
                        : 5
                    )
                  : 0;
            }

            const visibilityDuration =
              PFFCharts.reducedMotion()
                ? 0
                : 240;

            chart.options.animation.duration =
              visibilityDuration;

            chart.options.animations.x.duration =
              visibilityDuration;

            chart.options.animations.y.duration =
              visibilityDuration;

            chart.options.animations.colors.duration =
              visibilityDuration;

            updateAccessibleSummary();
          }
        });

      chartInteractions =
        PFFCharts.setupChartInteractions({
          canvas:
            chartCanvas,

          getChart() {
            return chart;
          }
        });

      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },

          observe: [
            app,
            chartShell
          ],

          beforeResize(
            chartInstance
          ) {
            chartInstance
              .data
              .datasets
              .forEach(
                dataset => {
                  dataset.pointHitRadius =
                    dataset._activeSeries
                      ? (
                          PFFCharts.mobileLayout()
                            ? 9
                            : 5
                        )
                      : 0;
                }
              );
          },

          onRefresh() {
            tabsController?.update();
            headingScroller?.update();
            legendController?.update();
          }
        });

      chartSummary =
        PFFCharts.ensureChartSummary({
          parent:
            app
        });

      syncMetricVisibility();
    }

    // ============================================================
    // STARTUP
    // ============================================================

    setupControls();

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      loadLive() {
        return PFFCharts.loadGVizSheet({
          sheetId:
            SHEET_ID,

          sheetName:
            SHEET_NAME,

          range:
            DATA_RANGE,

          timeoutMs:
            FETCH_TIMEOUT_MS,

          headers:
            '1'
        });
      },

      parseLive:
        parseWorkforceTable,

      cacheKey:
        LOCAL_CACHE_KEY,

      fallback:
        EMBEDDED_FALLBACK,

      minRows:
        2,

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,

        text:
          dataSourceText
      },

      onLiveError(error) {
        console.warn(
          'Live locum/non-clinician data unavailable; using cached data.',
          error
        );
      },

      render(loaded) {
        rows =
          loaded.rows;

        const config =
          currentViewConfig();

        createChart(config);
        tabsController?.update();
        metricController?.set(
          activeMetric,
          false
        );
        syncMetricVisibility();
        trendController?.set(
          trendMode,
          false
        );
        legendController?.render();
        responsiveController?.refresh();

        return chart;
      },

      onReady() {
        loadingState.setAttribute(
          'aria-hidden',
          'true'
        );

        updateAccessibleSummary();
      },

      errorMessage:
        'Unable to render locum/non-clinician chart'
    });
  </script>
</body>
