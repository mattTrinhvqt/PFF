<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Locum and Non-clinician Trends</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 0 4px;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    /* ============================================================
     * TOP TABS + LIVE STATUS
     * ============================================================ */

    .module-top {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 300ms var(--motion-ease),
        width 300ms var(--motion-ease);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }


    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: none;
    }

    .tab-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .tab-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .tab-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .tab-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .tab-scroll-left { left: 0; }
    .tab-scroll-right { right: 0; }

    .metric-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -1px;
    }

    .legend-item:focus-visible,
    .legend-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
      transition: background-color 220ms ease;
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      position: absolute;
      inset: 0;
      z-index: 101;
      display: flex;
      width: 100%;
      margin: 0;
      padding: 0 8px;
      align-items: center;
      justify-content: center;
      color: var(--error);
      background: #fff;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    #status:empty {
      display: none;
    }

    /* ============================================================
     * HEADING + TREND + METRIC SWITCH
     * ============================================================ */

    .chart-heading-row {
      position: relative;
      z-index: 30;
      display: flex;
      width: 100%;
      height: 30px;
      min-width: 0;
      min-height: 30px;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin: 0;
    }

    .heading-scroll-shell {
      position: relative;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }

    .heading-scroll-viewport {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .heading-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    .heading-scroll-button {
      position: absolute;
      top: 4px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .heading-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .heading-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .heading-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .heading-scroll-left { left: 0; }
    .heading-scroll-right { right: 0; }

    .chart-heading {
      display: inline-flex;
      width: max-content;
      min-width: max-content;
      flex: 0 0 auto;
      align-items: baseline;
      margin: 0;
      padding: 4px 0 0;
      overflow: visible;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline;
      will-change: opacity;
    }

    .heading-controls {
      display: flex;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-start;
      gap: 4px;
    }

    .yoy-trend-toggle {
      display: grid;
      width: 64px;
      height: 27px;
      flex: 0 0 64px;
      grid-template-columns: 15px 1fr;
      align-items: center;
      gap: 3px;
      margin-top: 0;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .yoy-trend-toggle > * {
      pointer-events: none;
    }

    .yoy-trend-toggle:hover {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .yoy-trend-toggle.is-on {
      border-color: var(--purple);
    }

    .yoy-trend-toggle:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .yoy-binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .yoy-toggle-label {
      min-width: 0;
      color: var(--ink);
      font-size: 7.5px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .metric-switch {
      position: relative;
      display: grid;
      width: 196px;
      height: 27px;
      flex: 0 0 auto;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      margin-top: 0;
      padding: 1px;
      overflow: hidden;
      background: rgba(232, 234, 240, 0.55);
      border-radius: 4px;
      isolation: isolate;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 180ms ease,
        visibility 0s linear 0s;
    }

    .metric-switch.is-hidden {
      display: none;
    }

    .metric-switch::before {
      content: '';
      position: absolute;
      top: 1px;
      bottom: 1px;
      left: 1px;
      z-index: 0;
      width: calc((100% - 2px) / 3);
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.08);
      transform: translateX(0);
      transition: transform 300ms var(--motion-ease);
    }

    .metric-switch.is-hours-selected::before {
      transform: translateX(100%);
    }

    .metric-switch.is-clinicalshare-selected::before {
      transform: translateX(200%);
    }

    .metric-button {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 25px;
      padding: 0 3px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition:
        color 220ms ease,
        transform 300ms var(--motion-ease);
    }

    .metric-button:hover:not(.is-active) {
      color: var(--ink);
    }

    .metric-button.is-active {
      color: var(--purple);
    }

    /* ============================================================
     * LEGEND
     * ============================================================ */

    .legend-nav {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 1;
      transition:
        opacity 160ms ease,
        color 160ms ease;
    }

    .legend-item:hover {
      color: var(--ink);
    }

    .legend-item.is-hidden-series {
      opacity: 0.36;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
      background: var(--legend-colour);
    }

    /* ============================================================
     * CHART
     * ============================================================ */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -3px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #workforceChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 0 3px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        height: 29px;
        min-height: 29px;
        gap: 4px;
      }

      .chart-heading {
        padding-top: 4px;
        font-size: 14px;
        line-height: 21px;
      }

      .heading-controls {
        gap: 3px;
      }

      .yoy-trend-toggle {
        width: 61px;
        flex-basis: 61px;
        grid-template-columns: 15px 1fr;
        gap: 2px;
        padding-right: 4px;
        padding-left: 4px;
      }

      .yoy-toggle-label {
        font-size: 7px;
      }

      .metric-switch {
        width: 186px;
        height: 26px;
      }

      .metric-button {
        min-height: 24px;
        padding-right: 3px;
        padding-left: 3px;
        font-size: 8.5px;
      }

      .legend-item {
        font-size: 9px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        font-size: 13px;
      }

      .heading-controls {
        gap: 2px;
      }

      .yoy-trend-toggle {
        width: 60px;
        flex-basis: 60px;
        padding-right: 3px;
        padding-left: 3px;
      }

      .metric-switch {
        width: 174px;
      }

      .metric-button {
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading workforce data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading workforce data…</div>
      </div>

      <div class="module-top">
        <div id="tabScrollShell" class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Workforce role view"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-group="locums"
              aria-selected="true"
            >Locums</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-group="nonclinician"
              aria-selected="false"
            >Non-clinician roles</button>
          </div>

          <button
            id="tabScrollRight"

    function loadGVizSheet(
      sheetName,
      range
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `__pff_demographics_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement('script');

          let completed =
            false;

          const cleanup = () => {
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }

            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] = undefined;
            }
          };

          const timer =
            window.setTimeout(
              () => {
                if (completed) {
                  return;
                }

                completed = true;
                cleanup();

                reject(
                  new Error(
                    `Timed out loading ${sheetName}.`
                  )
                );
              },
              FETCH_TIMEOUT_MS
            );

          window[callbackName] =
            response => {
              if (completed) {
                return;
              }

              completed = true;
              window.clearTimeout(timer);
              cleanup();

              if (
                !response ||
                response.status === 'error'
              ) {
                const message =
                  response?.errors?.[0]?.detailed_message ||
                  response?.errors?.[0]?.message ||
                  `Could not load ${sheetName}.`;

                reject(
                  new Error(message)
                );

                return;
              }

              resolve(response.table);
            };

          script.onerror = () => {
            if (completed) {
              return;
            }

            completed = true;
            window.clearTimeout(timer);
            cleanup();

            reject(
              new Error(
                `Could not connect to ${sheetName}.`
              )
            );
          };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              headers: '1',
              tqx: `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async = true;
          document.head.appendChild(script);
        }
      );
    }

    function parseWorkforceTable(table) {
      const sourceRows =
        table?.rows || [];

      const parsed = [];

      sourceRows.forEach(sourceRow => {
        const cells =
          sourceRow?.c || [];

        const roleYear =
          numericCell(cells[0]);

        const locumYear =
          numericCell(cells[23]);

        const year =
          Number.isFinite(roleYear)
            ? Math.round(roleYear)
            : Number.isFinite(locumYear)
              ? Math.round(locumYear)
              : NaN;

        if (!Number.isFinite(year)) {
          return;
        }

        const record = {
          year,

          nonClinician: [
            numericCell(cells[6]),
            numericCell(cells[2]),
            numericCell(cells[5]),
            numericCell(cells[4]),
            numericCell(cells[3])
          ],

          locumShare: [
            numericCell(cells[24])
          ],

          locumHours: [
            numericCell(cells[27])
          ],

          locumClinicalShare: [
            numericCell(cells[30])
          ]
        };

        const hasUsableValues =
          [
            ...record.nonClinician,
            ...record.locumShare,
            ...record.locumHours,
            ...record.locumClinicalShare
          ].some(
            Number.isFinite
          );

        if (hasUsableValues) {
          parsed.push(record);
        }
      });

      const uniqueByYear =
        new Map();

      parsed.forEach(row => {
        uniqueByYear.set(
          row.year,
          row
        );
      });

      const result =
        Array.from(
          uniqueByYear.values()
        )
          .sort(
            (first, second) =>
              first.year - second.year
          );

      if (result.length < 2) {
        throw new Error(
          'No usable locum or non-clinician trend rows were found.'
        );
      }

      return result;
    }

        return parsed.rows;

    function valueForRow(
      row,

      const value =

    function linearSlopeForPoints(points) {
      if (!Array.isArray(points) || points.length < 2) {
        return NaN;
      }

      const meanX =
        points.reduce(
          (sum, point) => sum + point.x,
          0
        ) / points.length;

      const meanY =
        points.reduce(
          (sum, point) => sum + point.y,
          0
        ) / points.length;

      let numerator = 0;
      let denominator = 0;

      points.forEach(point => {
        const dx =
          point.x - meanX;

        numerator +=
          dx * (point.y - meanY);

        denominator +=
          dx * dx;
      });

      return denominator > 0
        ? numerator / denominator
        : NaN;
    }

    function latestWindowTrend(
      seriesIndex,
      windowSize,
      config = currentViewConfig()
    ) {
      const recent =
        rows
          .map(row => ({
            year: Number(row.year),
            value: valueForRow(
              row,
              config,
              seriesIndex
            )
          }))
          .filter(
            item =>
              Number.isFinite(item.year) &&
              Number.isFinite(item.value) &&
              item.value > 0
          )
          .slice(-windowSize);

      /*
       * A label must represent the requested window, not merely
       * whatever shorter history happens to be available.
       */
      if (recent.length < windowSize) {
        return NaN;
      }

      const firstYear =
        recent[0].year;

      const logSlope =
        linearSlopeForPoints(
          recent.map(item => ({
            x: item.year - firstYear,
            y: Math.log(item.value)
          }))
        );

      return Number.isFinite(logSlope)
        ? Math.expm1(logSlope) * 100
        : NaN;
    }

    function formatTooltipValue(

    function formatAxisValueWithDecimals(
      value,
      decimals = 0
    ) {
      if (!Number.isFinite(value)) {
        return '';
      }

      const places =
        Math.max(
          0,
          Math.round(
            Number(decimals) || 0
          )
        );

      return new Intl.NumberFormat(
        'en-AU',
        {
          minimumFractionDigits:
            places,
          maximumFractionDigits:
            places
        }

    }

    function formatAxisValue(

      return formatAxisValueWithDecimals(

        config?.axisDecimals ?? 0
