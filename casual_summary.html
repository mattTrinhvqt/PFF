<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casual Rate Summary</title>

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --trend-yellow: #f1c232;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow: hidden;
    }

    #fit {
      width: 100%;
      overflow: hidden;
    }

    #app {
      width: 100%;
      margin: 0;
      padding: 14px 2px 14px;
      text-align: center;
    }

    #app.is-loading .response-summary,
    #app.is-loading .percentile-section {
      display: none;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      width: 100%;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      filter: none;
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }

    /* ---------- Response count ---------- */

    .response-summary {
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: 5px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 31px;
      margin-top: 2px;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    /* ---------- Compact rate distribution ---------- */

    .rate-distribution {
      width: 100%;
      margin: 2px 0 0;
      padding: 0;
    }

    .rate-distribution-canvas-wrap {
      position: relative;
      width: 100%;
      height: 55px;
      overflow: hidden;
    }

    #rate-distribution-canvas {
      display: block;
      width: 100%;
      height: 55px;
    }

    .rate-distribution-status {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.88);
      font-size: 9px;
      line-height: 1.25;
      text-align: center;
    }

    .rate-distribution-status.is-visible {
      display: flex;
    }

    /* ---------- Percentile table ---------- */

    .percentile-section {
      width: 100%;
      margin-top: 6px;
      padding-top: 0;
    }

    .percentile-table-wrap {
      position: relative;
      width: 100%;
    }

    .percentile-table-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 24%;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .percentile-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .percentile-table th,
    .percentile-table td {
      padding: 8px 6px;
      line-height: 1.2;
      text-align: center;
      position: relative;
    }

    .percentile-table th {
      color: var(--muted);
      font-size: clamp(11px, 3.4vw, 14px);
      font-weight: 700;
      white-space: nowrap;
    }

    .percentile-table td {
      color: var(--ink);
      font-size: clamp(12px, 3.6vw, 15px);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .percentile-table th + th,
    .percentile-table td + td {
      border-left: 1px solid var(--track);
    }

    .percentile-table .table-major-separator td {
      height: 0;
      padding: 0;
      line-height: 0;
      background: transparent;
      border-top: 1px solid var(--ink);
    }

    .percentile-table th:nth-child(2),
    .percentile-table td:nth-child(2) {
      border-left: 0;
    }

    .percentile-table sup {
      font-size: 0.7em;
      line-height: 0;
      vertical-align: super;
    }

    .percentile-table th:first-child,
    .percentile-table td:first-child {
      width: 24%;
    }

    .percentile-table td:first-child {
      text-align: center;
      white-space: nowrap;
      font-weight: 700;
    }

    .error {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 430px) {
      #app {
        padding: 12px 1px 12px;
      }

      .percentile-table th,
      .percentile-table td {
        padding: 7px 1px;
      }

      .percentile-table th {
        font-size: 11px;
      }

      .percentile-table td {
        font-size: 12px;
      }

      .percentile-table th:first-child,
      .percentile-table td:first-child {
        width: 27%;
      }

      .percentile-table td:first-child {
        font-size: 11px;
      }

      .percentile-table-wrap::after {
        left: 27%;
      }

      .app-loading {
        min-height: 175px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }      
    }

    @media (max-width: 350px) {
      .percentile-table th {
        font-size: 10px;
      }

      .percentile-table td {
        font-size: 11px;
      }

      .percentile-table td:first-child {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading">
      <div id="loading-state" class="app-loading" role="status" aria-label="Loading">
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading...</div>
      </div>

      <section class="response-summary" aria-live="polite">
        <div class="response-label">No. of responses</div>

        <div class="response-value-row">
          <div id="response-count" class="response-value"></div>

          <div
            id="data-source-indicator"
            class="live-data"
            aria-label="Live data"
          >
            <span class="live-data-dot" aria-hidden="true"></span>
            <span id="data-source-text">LIVE data</span>
          </div>
        </div>
      </section>

      <section class="percentile-section" aria-label="Casual rate percentiles">
        <div class="rate-distribution" aria-label="Casual hourly rate distribution">
          <div class="rate-distribution-canvas-wrap">
            <canvas id="rate-distribution-canvas" aria-label="Distribution of casual hourly rates"></canvas>
            <div id="rate-distribution-status" class="rate-distribution-status"></div>
          </div>
        </div>

        <div class="percentile-table-wrap">
          <table id="percentile-table" class="percentile-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID = '1UZizMV2CNlyNbKytN4QCSc4HcsKCx-PxOrboJyMCN1E';
    const SHEET_GID = '0';

    const RESPONSE_CELL = 'H2';

    // Split the original AK1:AP2 range so the header row is preserved reliably.
    const PERCENTILE_HEADER_RANGE = 'AK1:AP1';
    const PERCENTILE_VALUE_RANGE = 'AK2:AP2';
    const EXPECTED_PERCENTILE_COLS = 6;

    const RAW_DATA_RANGE = 'A:J';

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbx4E4fZUhs1RDLFfsMAhJCSHQIWHcNg-PjZOSif93hKSOq6o0gv1OD8wcLjsa3ssy4mDQ/exec';

    const CACHE_APP_KEY =
      'pff-casual-rate-summary';

    const RAW_CACHE_APP_KEY =
      'pff-casual-rates-data';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    const LOCAL_CACHE_KEY =
      'pff-casual-rate-summary-v1';

    /*
     * Set true to skip the live Google Sheets feed
     * and test the Apps Script cache.
     */
    const FORCE_CACHED_DATA =
      false;

    const app = document.getElementById('app');
    const responseCount = document.getElementById('response-count');
    const percentileTable = document.getElementById('percentile-table');
    const loadingState = document.getElementById('loading-state');

    const rateDistributionCanvas =
      document.getElementById('rate-distribution-canvas');

    const rateDistributionStatus =
      document.getElementById('rate-distribution-status');

    let distributionRates = [];

    const dataSourceIndicator =
      document.getElementById(
        'data-source-indicator'
      );

    const dataSourceText =
      document.getElementById(
        'data-source-text'
      );

    function hideLoadingState() {
      app.classList.remove('is-loading');
      loadingState.setAttribute('aria-hidden', 'true');
    }

    function setDataSource(source) {
      dataSourceIndicator.classList.toggle(
        'is-cached',
        source === 'cached'
      );

      if (source === 'cached') {
        dataSourceIndicator.setAttribute(
          'aria-label',
          'Cached data'
        );

        dataSourceText.textContent =
          'CACHED data';

        return;
      }

      if (source === 'unavailable') {
        dataSourceIndicator.setAttribute(
          'aria-label',
          'Data unavailable'
        );

        dataSourceText.textContent =
          'DATA unavailable';

        return;
      }

      dataSourceIndicator.setAttribute(
        'aria-label',
        'Live data'
      );

      dataSourceText.textContent =
        'LIVE data';
    }

    function appendHeaderText(cell, value) {
      const headerText = String(value || '—');
      const suffixMatch = headerText.match(/^(.*?)(th)$/i);

      if (suffixMatch) {
        cell.appendChild(document.createTextNode(suffixMatch[1]));

        const superscript = document.createElement('sup');
        superscript.textContent = suffixMatch[2];
        cell.appendChild(superscript);
      } else {
        cell.textContent = headerText;
      }
    }

    function renderPercentileTable(values) {
      const thead = percentileTable.querySelector('thead');
      const tbody = percentileTable.querySelector('tbody');

      thead.textContent = '';
      tbody.textContent = '';

      const headers = values?.[0] || [];
      const rowValues = values?.[1] || [];

      const headerRow = document.createElement('tr');

      headers.forEach(value => {
        const th = document.createElement('th');
        th.scope = 'col';
        appendHeaderText(th, value);
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);

      const separatorRow = document.createElement('tr');
      separatorRow.className = 'table-major-separator';

      const separatorCell = document.createElement('td');
      separatorCell.colSpan = Math.max(headers.length, 1);

      separatorRow.appendChild(separatorCell);
      thead.appendChild(separatorRow);

      const dataRow = document.createElement('tr');

      rowValues.forEach(value => {
        const td = document.createElement('td');
        td.textContent = value || '—';
        dataRow.appendChild(td);
      });

      tbody.appendChild(dataRow);
    }

    function getCellDisplayValue(cell) {
      if (!cell) return '';
      return String(cell.f ?? cell.v ?? '').trim();
    }

    function toNumber(value) {
      const cleaned = String(value ?? '')
        .replace(/[^\d.-]/g, '')
        .trim();

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return NaN;
      }

      const number = Number(cleaned);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function percentile(sortedValues, probability) {
      if (!sortedValues.length) {
        return NaN;
      }

      const index =
        (sortedValues.length - 1) *
        probability;

      const lowerIndex =
        Math.floor(index);

      const upperIndex =
        Math.ceil(index);

      if (lowerIndex === upperIndex) {
        return sortedValues[lowerIndex];
      }

      return (
        sortedValues[lowerIndex] +
        (
          sortedValues[upperIndex] -
          sortedValues[lowerIndex]
        ) *
        (index - lowerIndex)
      );
    }

    function setDistributionStatus(message = '') {
      if (!rateDistributionStatus) {
        return;
      }

      rateDistributionStatus.textContent =
        message;

      rateDistributionStatus.classList.toggle(
        'is-visible',
        Boolean(message)
      );
    }

    function calculateKernelDensity(
      values,
      minimumX,
      maximumX,
      sampleCount = 120
    ) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      if (sorted.length < 2) {
        return [];
      }

      const count =
        sorted.length;

      const mean =
        sorted.reduce(
          (total, value) =>
            total + value,
          0
        ) /
        count;

      const variance =
        sorted.reduce(
          (total, value) =>
            total +
            Math.pow(
              value - mean,
              2
            ),
          0
        ) /
        Math.max(
          1,
          count - 1
        );

      const standardDeviation =
        Math.sqrt(
          Math.max(
            0,
            variance
          )
        );

      const q1 =
        percentile(
          sorted,
          0.25
        );

      const q3 =
        percentile(
          sorted,
          0.75
        );

      const robustSigma =
        Number.isFinite(q1) &&
        Number.isFinite(q3) &&
        q3 > q1
          ? (q3 - q1) / 1.34
          : NaN;

      const scaleCandidates = [
        standardDeviation,
        robustSigma
      ].filter(
        value =>
          Number.isFinite(value) &&
          value > 0
      );

      const fallbackScale =
        Math.max(
          1,
          (maximumX - minimumX) /
          6
        );

      const scale =
        scaleCandidates.length
          ? Math.min(
              ...scaleCandidates
            )
          : fallbackScale;

      const silvermanBandwidth =
        0.9 *
        scale *
        Math.pow(
          count,
          -0.2
        );

      const range =
        Math.max(
          1,
          maximumX - minimumX
        );

      const bandwidth =
        Math.max(
          2,
          Math.min(
            range * 0.22,
            Number.isFinite(
              silvermanBandwidth
            ) &&
            silvermanBandwidth > 0
              ? silvermanBandwidth
              : range / 10
          )
        );

      const normalisingConstant =
        1 /
        (
          bandwidth *
          Math.sqrt(
            2 * Math.PI
          )
        );

      const result = [];

      for (
        let index = 0;
        index < sampleCount;
        index += 1
      ) {
        const proportion =
          sampleCount === 1
            ? 0
            : index /
              (sampleCount - 1);

        const x =
          minimumX +
          proportion *
          range;

        let density = 0;

        sorted.forEach(value => {
          const z =
            (x - value) /
            bandwidth;

          density +=
            Math.exp(
              -0.5 *
              z *
              z
            );
        });

        density =
          density *
          normalisingConstant /
          count;

        if (
          Number.isFinite(density)
        ) {
          result.push({
            x,
            y: density
          });
        }
      }

      return result;
    }

    function renderRateDistribution(rates) {
      if (!rateDistributionCanvas) {
        return;
      }

      const validRates = rates
        .filter(
          rate =>
            Number.isFinite(rate) &&
            rate > 0 &&
            rate <= 500
        )
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      if (validRates.length < 2) {
        setDistributionStatus(
          'Rate distribution unavailable'
        );

        return;
      }

      setDistributionStatus();

      const distributionPercentiles = [
        {
          key: 'p05',
          probability: 0.05,
          strokeStyle: 'rgba(105, 113, 138, 0.55)',
          dash: [3, 3]
        },
        {
          key: 'p20',
          probability: 0.20,
          strokeStyle: 'rgba(105, 113, 138, 0.55)',
          dash: [3, 3]
        },
        {
          key: 'median',
          probability: 0.50,
          strokeStyle: '#f1c232',
          dash: [3, 3]
        },
        {
          key: 'p80',
          probability: 0.80,
          strokeStyle: 'rgba(105, 113, 138, 0.55)',
          dash: [3, 3]
        },
        {
          key: 'p95',
          probability: 0.95,
          strokeStyle: 'rgba(105, 113, 138, 0.55)',
          dash: [3, 3]
        }
      ].map(item => ({
        ...item,
        value: percentile(
          validRates,
          item.probability
        )
      }));

      const p05 =
        distributionPercentiles[0].value;

      const p95 =
        distributionPercentiles[4].value;

      const minimumX =
        Math.min(
          40,
          Math.floor(
            (p05 - 5) / 5
          ) * 5
        );

      const maximumX =
        Math.max(
          100,
          Math.ceil(
            (p95 + 5) / 5
          ) * 5
        );

      const density =
        calculateKernelDensity(
          validRates,
          minimumX,
          maximumX
        );

      if (density.length < 2) {
        setDistributionStatus(
          'Rate distribution unavailable'
        );
        return;
      }

      const maximumDensity =
        Math.max(
          ...density.map(
            point => point.y
          )
        );

      if (
        !Number.isFinite(
          maximumDensity
        ) ||
        maximumDensity <= 0
      ) {
        setDistributionStatus(
          'Rate distribution unavailable'
        );
        return;
      }

      const cssWidth =
        Math.max(
          1,
          rateDistributionCanvas.clientWidth
        );

      const cssHeight =
        Math.max(
          1,
          rateDistributionCanvas.clientHeight
        );

      const pixelRatio =
        Math.min(
          window.devicePixelRatio || 1,
          3
        );

      rateDistributionCanvas.width =
        Math.round(
          cssWidth *
          pixelRatio
        );

      rateDistributionCanvas.height =
        Math.round(
          cssHeight *
          pixelRatio
        );

      const context =
        rateDistributionCanvas.getContext(
          '2d'
        );

      context.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
      );

      context.clearRect(
        0,
        0,
        cssWidth,
        cssHeight
      );

      const padding = {
        top: 4,
        right: 5,
        bottom: 0.5,
        left: 5
      };

      const plotHeight =
        Math.max(
          1,
          cssHeight -
          padding.top -
          padding.bottom
        );

      const baselineY =
        padding.top +
        plotHeight;

      const canvasRect =
        rateDistributionCanvas.getBoundingClientRect();

      const headerCells = [
        ...percentileTable.querySelectorAll(
          'thead tr:first-child th'
        )
      ];

      const fallbackFirstColumnFraction =
        window.matchMedia(
          '(max-width: 430px)'
        ).matches
          ? 0.27
          : 0.24;

      const fallbackValueColumnFraction =
        (1 - fallbackFirstColumnFraction) / 5;

      const fallbackTargetForIndex = index =>
        cssWidth *
        (
          fallbackFirstColumnFraction +
          fallbackValueColumnFraction *
          (index + 0.5)
        );

      const targetForColumn = index => {
        const cell =
          headerCells[index + 1];

        if (!cell) {
          return fallbackTargetForIndex(index);
        }

        const rect =
          cell.getBoundingClientRect();

        return Math.max(
          padding.left,
          Math.min(
            cssWidth - padding.right,
            rect.left +
            rect.width / 2 -
            canvasRect.left
          )
        );
      };

      const percentileAnchors =
        distributionPercentiles.map(
          (item, index) => ({
            ...item,
            targetX:
              targetForColumn(index)
          })
        );

      const firstValueRect =
        headerCells[1]?.getBoundingClientRect();

      const lastValueRect =
        headerCells[5]?.getBoundingClientRect();

      const numericPlotLeft =
        firstValueRect
          ? Math.max(
              padding.left,
              firstValueRect.left -
              canvasRect.left +
              2
            )
          : Math.max(
              padding.left,
              cssWidth *
              fallbackFirstColumnFraction +
              2
            );

      const numericPlotRight =
        lastValueRect
          ? Math.min(
              cssWidth - padding.right,
              lastValueRect.right -
              canvasRect.left -
              3
            )
          : cssWidth - padding.right;

      const xAnchors = [
        {
          value: minimumX,
          pixel: numericPlotLeft
        },
        ...percentileAnchors.map(
          item => ({
            value: item.value,
            pixel: item.targetX
          })
        ),
        {
          value: maximumX,
          pixel: numericPlotRight
        }
      ]
        .filter(
          anchor =>
            Number.isFinite(anchor.value) &&
            Number.isFinite(anchor.pixel)
        )
        .sort(
          (first, second) =>
            first.value - second.value
        );

      const uniqueXAnchors = [];

      xAnchors.forEach(anchor => {
        const previous =
          uniqueXAnchors[
            uniqueXAnchors.length - 1
          ];

        if (
          previous &&
          Math.abs(
            previous.value -
            anchor.value
          ) < 1e-8
        ) {
          previous.pixel =
            Math.max(
              previous.pixel,
              anchor.pixel
            );
          return;
        }

        uniqueXAnchors.push({
          ...anchor
        });
      });

      for (
        let index = 1;
        index < uniqueXAnchors.length;
        index += 1
      ) {
        uniqueXAnchors[index].pixel =
          Math.max(
            uniqueXAnchors[index].pixel,
            uniqueXAnchors[index - 1].pixel +
            0.25
          );
      }

      const xToPixel = value => {
        const clampedValue =
          Math.min(
            maximumX,
            Math.max(
              minimumX,
              value
            )
          );

        for (
          let index = 1;
          index < uniqueXAnchors.length;
          index += 1
        ) {
          const previous =
            uniqueXAnchors[index - 1];

          const current =
            uniqueXAnchors[index];

          if (
            clampedValue <= current.value
          ) {
            const span =
              current.value -
              previous.value;

            const proportion =
              span === 0
                ? 0
                : (
                    clampedValue -
                    previous.value
                  ) /
                  span;

            return previous.pixel +
              (
                current.pixel -
                previous.pixel
              ) *
              proportion;
          }
        }

        return uniqueXAnchors[
          uniqueXAnchors.length - 1
        ].pixel;
      };

      const densityToPixel = value =>
        baselineY -
        (
          value /
          maximumDensity
        ) *
        (
          plotHeight - 5
        );

      const findDensityPoint = value => {
        for (
          let index = 1;
          index < density.length;
          index += 1
        ) {
          const previous = density[index - 1];
          const current = density[index];

          if (
            value >= previous.x &&
            value <= current.x
          ) {
            const span =
              current.x - previous.x;

            const proportion =
              span === 0
                ? 0
                : (value - previous.x) /
                  span;

            return {
              x: value,
              y:
                previous.y +
                (current.y - previous.y) *
                proportion
            };
          }
        }

        return density.reduce(
          (nearest, point) =>
            Math.abs(point.x - value) <
            Math.abs(nearest.x - value)
              ? point
              : nearest,
          density[0]
        );
      };

      context.save();
      context.beginPath();

      density.forEach(
        (point, index) => {
          const x =
            xToPixel(
              point.x
            );

          const y =
            densityToPixel(
              point.y
            );

          if (index === 0) {
            context.moveTo(
              x,
              baselineY
            );
            context.lineTo(
              x,
              y
            );
          } else {
            context.lineTo(
              x,
              y
            );
          }
        }
      );

      context.lineTo(
        xToPixel(
          density[
            density.length - 1
          ].x
        ),
        baselineY
      );
      context.closePath();
      context.fillStyle =
        'rgba(241, 194, 50, 0.10)';
      context.fill();
      context.restore();

      context.save();
      context.fillStyle =
        'rgba(102, 0, 255, 0.28)';

      validRates.forEach(
        (rate, index) => {
          const yOffset =
            2 +
            (index % 3) *
            2.1;

          context.beginPath();
          context.arc(
            xToPixel(rate),
            baselineY - yOffset,
            1.35,
            0,
            Math.PI * 2
          );
          context.fill();
        }
      );
      context.restore();

      context.save();
      context.beginPath();
      context.strokeStyle =
        '#f1c232';
      context.lineWidth = 2;
      context.lineCap = 'round';
      context.lineJoin = 'round';

      density.forEach(
        (point, index) => {
          const x =
            xToPixel(
              point.x
            );

          const y =
            densityToPixel(
              point.y
            );

          if (index === 0) {
            context.moveTo(x, y);
          } else {
            context.lineTo(x, y);
          }
        }
      );

      context.stroke();
      context.restore();

      const labels =
        percentileAnchors.map(item => {
          const curvePoint =
            findDensityPoint(
              item.value
            );

          return {
            ...item,
            x:
              xToPixel(
                item.value
              ),
            curveY:
              densityToPixel(
                curvePoint.y
              )
          };
        });

      labels.forEach(label => {
        context.save();
        context.beginPath();
        context.setLineDash(
          label.dash
        );
        context.strokeStyle =
          label.strokeStyle;
        context.lineWidth =
          label.key === 'median'
            ? 1.1
            : 1;
        context.moveTo(
          label.x,
          label.curveY
        );
        context.lineTo(
          label.x,
          baselineY
        );
        context.stroke();
        context.restore();
      });
    }

    function normaliseLiveRateRows(response) {
      return (
        response?.table?.rows || []
      )
        .map(
          row =>
            toNumber(
              getCellDisplayValue(
                row?.c?.[1]
              )
            )
        )
        .filter(
          rate =>
            Number.isFinite(rate) &&
            rate > 0 &&
            rate <= 500
        );
    }

    function validateCachedRateData(data) {
      const rows =
        Array.isArray(
          data?.rows
        )
          ? data.rows
          : [];

      if (!rows.length) {
        throw new Error(
          'Cached casual rate data has no rows'
        );
      }

      const rates = rows
        .map(
          (
            row,
            rowIndex
          ) => {
            if (
              !Array.isArray(row) ||
              row.length < 6
            ) {
              throw new Error(
                `Cached casual rate row ${rowIndex + 1} is malformed`
              );
            }

            return toNumber(
              row[1]
            );
          }
        )
        .filter(
          rate =>
            Number.isFinite(rate) &&
            rate > 0 &&
            rate <= 500
        );

      if (rates.length < 2) {
        throw new Error(
          'Cached casual rate data has insufficient rates'
        );
      }

      return rates;
    }

    function loadCachedRateData() {
      return new Promise((resolve, reject) => {
        const callbackName =
          `casualRateDistributionCache_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

        const script =
          document.createElement(
            'script'
          );

        let settled = false;

        const timeout =
          window.setTimeout(
            () => {
              finish(
                new Error(
                  'Could not load cached casual rate data'
                )
              );
            },
            CACHE_FETCH_TIMEOUT_MS
          );

        function cleanup() {
          window.clearTimeout(
            timeout
          );

          try {
            delete window[
              callbackName
            ];
          } catch (error) {
            window[
              callbackName
            ] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(
              script
            );
          }
        }

        function finish(
          error,
          data
        ) {
          if (settled) {
            return;
          }

          settled = true;
          cleanup();

          if (error) {
            reject(error);
            return;
          }

          resolve(data);
        }

        window[callbackName] =
          snapshot => {
            if (
              !snapshot ||
              snapshot.ok !== true ||
              snapshot.appKey !== RAW_CACHE_APP_KEY
            ) {
              finish(
                new Error(
                  snapshot?.error ||
                  'Cached casual rate data is invalid'
                )
              );

              return;
            }

            try {
              finish(
                null,
                validateCachedRateData(
                  snapshot.data
                )
              );
            } catch (error) {
              finish(error);
            }
          };

        script.onerror =
          () => {
            finish(
              new Error(
                'Network error loading cached casual rate data'
              )
            );
          };

        const params =
          new URLSearchParams({
            appKey:
              RAW_CACHE_APP_KEY,

            callback:
              callbackName,

            _:
              String(
                Date.now()
              )
          });

        script.src =
          `${CACHE_WEB_APP_URL}?${params.toString()}`;

        document.body.appendChild(
          script
        );
      });
    }

    async function loadRateDistributionData() {
      let liveError = null;

      if (!FORCE_CACHED_DATA) {
        try {
          const response =
            await loadGvizRange(
              RAW_DATA_RANGE,
              1
            );

          const rates =
            normaliseLiveRateRows(
              response
            );

          if (rates.length < 2) {
            throw new Error(
              'Live casual rate data has insufficient rates'
            );
          }

          return rates;
        } catch (error) {
          liveError = error;
        }
      }

      try {
        return await loadCachedRateData();
      } catch (cacheError) {
        console.error(
          'Live casual rate distribution load failed',
          liveError
        );

        console.error(
          'Cached casual rate distribution load failed',
          cacheError
        );

        throw (
          liveError ||
          cacheError
        );
      }
    }

    function validateDashboardData(data) {
      const responseCountValue =
        String(
          data?.responseCount ??
          ''
        ).trim();

      const percentileTableValue =
        Array.isArray(
          data?.percentileTable
        )
          ? data.percentileTable
          : [];

      const headers =
        Array.isArray(
          percentileTableValue[0]
        )
          ? percentileTableValue[0]
          : [];

      const values =
        Array.isArray(
          percentileTableValue[1]
        )
          ? percentileTableValue[1]
          : [];

      if (
        !responseCountValue ||
        headers.length !== EXPECTED_PERCENTILE_COLS ||
        values.length !== EXPECTED_PERCENTILE_COLS
      ) {
        throw new Error(
          'Casual rate summary data is invalid'
        );
      }

      return {
        responseCount:
          responseCountValue,

        percentileTable: [
          headers.map(value =>
            String(
              value ??
              ''
            ).trim() ||
            '—'
          ),

          values.map(value =>
            String(
              value ??
              ''
            ).trim() ||
            '—'
          )
        ]
      };
    }

    function saveLocalCachedData(data) {
      try {
        localStorage.setItem(
          LOCAL_CACHE_KEY,
          JSON.stringify(
            validateDashboardData(
              data
            )
          )
        );
      } catch (error) {
      }
    }

    function loadLocalCachedData() {
      try {
        const raw =
          localStorage.getItem(
            LOCAL_CACHE_KEY
          );

        if (!raw) {
          return null;
        }

        return validateDashboardData(
          JSON.parse(
            raw
          )
        );
      } catch (error) {
        return null;
      }
    }

    function loadGvizRange(range, headers = 0) {
      return new Promise((resolve, reject) => {
        const callbackName = `casualRateSummaryCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
        const script = document.createElement('script');

        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error('Could not load data'));
        }, 10000);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = response => {
          cleanup();

          if (response?.status === 'error') {
            reject(new Error(response?.errors?.[0]?.detailed_message || 'Could not load Google Sheet data'));
            return;
          }

          resolve(response);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('Could not load data'));
        };

        const params = new URLSearchParams({
          gid: SHEET_GID,
          range,
          headers: String(headers),
          tqx: `responseHandler:${callbackName}`,
          _: String(Date.now())
        });

        script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;
        document.body.appendChild(script);
      });
    }

    function loadCachedDashboardData() {
      return new Promise((resolve, reject) => {
        const callbackName =
          `casualRateSummaryCacheCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

        const script =
          document.createElement(
            'script'
          );

        let settled =
          false;

        const timeout =
          window.setTimeout(
            () => {
              finish(
                new Error(
                  'Could not load cached casual rate summary data'
                )
              );
            },
            CACHE_FETCH_TIMEOUT_MS
          );

        function cleanup() {
          window.clearTimeout(
            timeout
          );

          try {
            delete window[
              callbackName
            ];
          } catch (error) {
            window[
              callbackName
            ] = undefined;
          }

          if (
            script.parentNode
          ) {
            script.parentNode.removeChild(
              script
            );
          }
        }

        function finish(
          error,
          data
        ) {
          if (settled) {
            return;
          }

          settled =
            true;

          cleanup();

          if (error) {
            reject(
              error
            );

            return;
          }

          resolve(
            data
          );
        }

        window[callbackName] =
          snapshot => {
            if (
              !snapshot ||
              snapshot.ok !== true ||
              snapshot.appKey !== CACHE_APP_KEY
            ) {
              finish(
                new Error(
                  snapshot?.error ||
                  'Cached casual rate summary data is invalid'
                )
              );

              return;
            }

            try {
              finish(
                null,
                validateDashboardData(
                  snapshot.data
                )
              );
            } catch (error) {
              finish(
                error
              );
            }
          };

        script.onerror =
          () => {
            finish(
              new Error(
                'Network error loading cached casual rate summary data'
              )
            );
          };

        const params =
          new URLSearchParams({
            appKey:
              CACHE_APP_KEY,

            callback:
              callbackName,

            _:
              String(
                Date.now()
              )
          });

        script.src =
          `${CACHE_WEB_APP_URL}?${params.toString()}`;

        document.body.appendChild(
          script
        );
      });
    }

    function normaliseResponseCount(response) {
      const cell = response?.table?.rows?.[0]?.c?.[0];
      return getCellDisplayValue(cell) || '—';
    }

    function normalisePercentileTable(headerResponse, valueResponse) {
      const headerCols = headerResponse?.table?.cols || [];
      const valueCells = valueResponse?.table?.rows?.[0]?.c || [];

      const headerRow = [];
      const valueRow = [];

      for (let c = 0; c < EXPECTED_PERCENTILE_COLS; c++) {
        headerRow.push(String(headerCols?.[c]?.label ?? '').trim() || '—');
        valueRow.push(getCellDisplayValue(valueCells?.[c]) || '—');
      }

      return [headerRow, valueRow];
    }

    function renderDashboardData(data) {
      const validated =
        validateDashboardData(
          data
        );

      responseCount.classList.remove(
        'error'
      );

      responseCount.textContent =
        validated.responseCount;

      renderPercentileTable(
        validated.percentileTable
      );
    }

    function showError(error) {
      console.error(error);

      setDataSource(
        'unavailable'
      );

      responseCount.textContent = '—';
      responseCount.classList.add('error');

      renderPercentileTable([
        ['—', '—', '—', '—', '—', '—'],
        ['—', '—', '—', '—', '—', '—']
      ]);

      setDistributionStatus(
        'Rate distribution unavailable'
      );

      hideLoadingState();
    }

    async function loadDashboardData() {
      let liveError =
        null;

      if (
        !FORCE_CACHED_DATA
      ) {
        try {
          const [
            responseCountData,
            percentileHeaderData,
            percentileValueData
          ] = await Promise.all([
            loadGvizRange(RESPONSE_CELL, 0),
            loadGvizRange(PERCENTILE_HEADER_RANGE, 1),
            loadGvizRange(PERCENTILE_VALUE_RANGE, 0)
          ]);

          const liveData =
            validateDashboardData({
              responseCount:
                normaliseResponseCount(
                  responseCountData
                ),

              percentileTable:
                normalisePercentileTable(
                  percentileHeaderData,
                  percentileValueData
                )
            });

          saveLocalCachedData(
            liveData
          );

          renderDashboardData(
            liveData
          );

          setDataSource(
            'live'
          );

          hideLoadingState();

          return;
        } catch (error) {
          liveError =
            error;
        }
      }

      try {
        const cachedData =
          await loadCachedDashboardData();

        saveLocalCachedData(
          cachedData
        );

        renderDashboardData(
          cachedData
        );

        setDataSource(
          'cached'
        );

        hideLoadingState();

        return;
      } catch (cacheError) {
        console.error(
          'Live casual rate summary load failed',
          liveError
        );

        console.error(
          'Cached casual rate summary load failed',
          cacheError
        );
      }

      const localData =
        loadLocalCachedData();

      if (localData) {
        renderDashboardData(
          localData
        );

        setDataSource(
          'cached'
        );

        hideLoadingState();

        return;
      }

      showError(
        liveError ||
        new Error(
          'Casual rate summary data could not be loaded'
        )
      );
    }

    async function initialiseDashboard() {
      await loadDashboardData();

      try {
        distributionRates =
          await loadRateDistributionData();

        window.requestAnimationFrame(
          () => {
            renderRateDistribution(
              distributionRates
            );
          }
        );
      } catch (error) {
        console.error(
          'Casual rate distribution unavailable',
          error
        );

        setDistributionStatus(
          'Rate distribution unavailable'
        );
      }
    }

    window.addEventListener(
      'resize',
      () => {
        if (!distributionRates.length) {
          return;
        }

        window.requestAnimationFrame(
          () => {
            renderRateDistribution(
              distributionRates
            );
          }
        );
      }
    );

    initialiseDashboard();
  </script>
</body>
</html>
