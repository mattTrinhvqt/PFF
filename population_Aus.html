<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Australian Population Trends</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --australia: #0b5d1e;
      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 0 4px;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) { visibility: hidden; }
    #app:not(.is-loading) .app-loading { display: none; }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .module-top {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow: hidden;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--purple);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: default;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
      transition: background-color 220ms ease;
    }

    .live-data.is-cached .live-data-dot { background: var(--cached-amber); }

    #status {
      position: absolute;
      inset: 0;
      z-index: 101;
      display: flex;
      width: 100%;
      margin: 0;
      padding: 0 8px;
      align-items: center;
      justify-content: center;
      color: var(--error);
      background: #fff;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    #status:empty { display: none; }

    .chart-heading-row {
      position: relative;
      z-index: 30;
      display: flex;
      width: 100%;
      min-width: 0;
      height: 30px;
      min-height: 30px;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin: 0;
    }

    .heading-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .heading-scroll-viewport {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .heading-scroll-viewport::-webkit-scrollbar { display: none; }

    .heading-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition: opacity 160ms ease, background 160ms ease;
    }

    .heading-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .heading-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .heading-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .heading-scroll-left { left: 0; }
    .heading-scroll-right { right: 0; }

    .chart-heading {
      display: inline-block;
      width: max-content;
      min-width: max-content;
      margin: 0;
      padding: 4px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .heading-controls {
      display: flex;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-start;
      gap: 4px;
    }

    .yoy-trend-toggle {
      display: grid;
      width: 74px;
      height: 27px;
      flex: 0 0 74px;
      grid-template-columns: 15px max-content 1fr;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .yoy-trend-toggle > * { pointer-events: none; }
    .yoy-trend-toggle:hover { box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12); }
    .yoy-trend-toggle.is-on { border-color: var(--purple); }

    .yoy-trend-toggle:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .yoy-binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .yoy-toggle-label,
    .yoy-toggle-value {
      font-size: 8.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .yoy-toggle-label { color: var(--ink); }

    .yoy-toggle-value {
      display: block;
      width: 100%;
      min-width: 0;
      color: var(--muted);
      letter-spacing: 0.025em;
      text-align: center;
    }

    .yoy-trend-toggle.is-on .yoy-toggle-value { color: var(--purple); }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar { display: none; }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 1;
      transition: opacity 160ms ease, color 160ms ease;
    }

    .legend-item:hover { color: var(--ink); }

    .legend-item:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .legend-item.is-hidden-series { opacity: 0.36; }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
      background: var(--australia);
    }

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -3px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #trendChart {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 0 3px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue { left: 30px; }
      .cone.green { left: 64px; }
      .cone.red { left: 78px; }
      .loader-text { font-size: 10px; }

      .chart-tab { font-size: 12px; }
      .live-data { margin-right: 3px; font-size: 8px; }

      .chart-heading-row {
        height: 29px;
        min-height: 29px;
        gap: 4px;
      }

      .chart-heading { font-size: 14px; }
      .heading-controls { gap: 3px; }

      .yoy-trend-toggle {
        width: 68px;
        flex-basis: 68px;
        grid-template-columns: 15px max-content 1fr;
        padding-right: 4px;
        padding-left: 4px;
      }

      .yoy-toggle-label,
      .yoy-toggle-value { font-size: 8px; }
      .legend-item { font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div id="loadingState" class="app-loading" role="status" aria-label="Loading Australian population data">
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading Australian population data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div id="tabList" class="tab-list" role="tablist" aria-label="Australian population chart">
            <button id="populationTab" class="chart-tab" type="button" role="tab" aria-selected="true">Population</button>
          </div>
        </div>

        <div id="dataSourceIndicator" class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button id="headingScrollLeft" class="heading-scroll-button heading-scroll-left is-hidden" type="button" aria-label="Scroll graph title left">‹</button>
          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">Australian population</h2>
          </div>
          <button id="headingScrollRight" class="heading-scroll-button heading-scroll-right is-hidden" type="button" aria-label="Scroll graph title right">›</button>
        </div>

        <div class="heading-controls">
          <button id="yoyTrendToggle" class="yoy-trend-toggle is-on" type="button" aria-pressed="true" aria-label="Trend labels on">
            <span class="yoy-binary-indicator" aria-hidden="true"></span>
            <span class="yoy-toggle-label">Trend</span>
            <span id="yoyToggleValue" class="yoy-toggle-value">ON</span>
          </button>
        </div>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <div class="legend-viewport">
            <div id="chartLegend" class="chart-legend" aria-label="Chart legend"></div>
          </div>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <canvas id="trendChart" aria-label="Australian population trend chart" role="img"></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    const SHEET_ID =
      '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE';

    const POPULATION_SHEET =
      'Auspopnbystate';

    // Row 30 = headers; row 31 onward = raw data.
    // A = Year; J = Australia.
    const POPULATION_RANGE =
      'A30:J';

    const FETCH_TIMEOUT_MS =
      15000;

    const LOCAL_CACHE_KEY =
      'pff-australian-population-trends-v1';

    const AUSTRALIA_COLOUR =
      '#0b5d1e';

    // Dynamic zero-based population scale. The upper bound expands to the
    // next clean major tick as the population grows, rather than being fixed.
    const POPULATION_SCALE_TARGET_INTERVALS =
      7;

    const EMBEDDED_FALLBACK = [
      {year:2012,value:22928023},
      {year:2013,value:23297777},
      {year:2014,value:23640331},
      {year:2015,value:23984581},
      {year:2016,value:24385064},
      {year:2017,value:24759018},
      {year:2018,value:25146140},
      {year:2019,value:25520468},
      {year:2020,value:25630698},
      {year:2021,value:25773795},
      {year:2022,value:26320285},
      {year:2023,value:26956660},
      {year:2024,value:27388006}
    ];

    const app =
      document.getElementById('app');

    const loadingState =
      document.getElementById('loadingState');

    const statusElement =
      document.getElementById('status');

    const tabList =
      document.getElementById('tabList');

    const populationTab =
      document.getElementById('populationTab');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const yoyToggleValue =
      document.getElementById('yoyToggleValue');

    const chartLegend =
      document.getElementById('chartLegend');

    const trendCanvas =
      document.getElementById('trendChart');

    let rows = [];
    let chart = null;
    let yoyTrendOn = true;
    let seriesHidden = false;

    function reducedMotion() {
      return window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function rgba(hex, alpha) {
      const cleaned =
        String(hex || '#151515').replace('#', '').trim();

      const value =
        Number.parseInt(cleaned, 16);

      if (!Number.isFinite(value)) {
        return `rgba(21,21,21,${alpha})`;
      }

      const red = (value >> 16) & 255;
      const green = (value >> 8) & 255;
      const blue = value & 255;

      return `rgba(${red},${green},${blue},${alpha})`;
    }

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function numericCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return NaN;
      }

      if (
        typeof cell.v === 'number' &&
        Number.isFinite(cell.v)
      ) {
        return cell.v;
      }

      const cleaned =
        cleanText(cell.f ?? cell.v)
          .replace(/,/g, '')
          .replace(/[^\d.-]/g, '');

      if (!cleaned || !/\d/.test(cleaned)) {
        return NaN;
      }

      const number = Number(cleaned);
      return Number.isFinite(number) ? number : NaN;
    }

    function formatInteger(value) {
      const number = Number(value);
      return Number.isFinite(number)
        ? Math.round(number).toLocaleString('en-AU')
        : '—';
    }

    function formatMillions(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      if (Math.abs(number) < 0.5) {
        return '0';
      }

      const millions = number / 1000000;
      const rounded = Math.round(millions * 10) / 10;

      return `${Number.isInteger(rounded) ? rounded.toFixed(0) : rounded.toFixed(1)}m`;
    }

    function niceStep(value) {
      if (!Number.isFinite(value) || value <= 0) {
        return 1000000;
      }

      const exponent = Math.floor(Math.log10(value));
      const magnitude = Math.pow(10, exponent);
      const fraction = value / magnitude;
      const multipliers = [1, 2, 2.5, 5, 10];
      const multiplier =
        multipliers.find(candidate => fraction <= candidate) ?? 10;

      return multiplier * magnitude;
    }

    function populationScale() {
      const maximumObserved =
        rows.reduce(
          (maximum, row) =>
            Number.isFinite(row?.value)
              ? Math.max(maximum, row.value)
              : maximum,
          0
        );

      const paddedMaximum =
        maximumObserved > 0
          ? maximumObserved * 1.06
          : 30000000;

      const step = niceStep(
        paddedMaximum / POPULATION_SCALE_TARGET_INTERVALS
      );

      const max = Math.max(
        step,
        Math.ceil(paddedMaximum / step) * step
      );

      return {
        min: 0,
        max,
        step
      };
    }

    function scaleValues(scale) {
      const count =
        Math.round((scale.max - scale.min) / scale.step);

      return Array.from(
        {length: count + 1},
        (_, index) => scale.min + scale.step * index
      );
    }

    function latestAnnualisedGrowth() {
      const recent =
        rows
          .filter(row => Number.isFinite(row.value))
          .slice(-3);

      if (recent.length < 2) {
        return NaN;
      }

      const points = recent
        .map(row => ({
          x: Number(row.year),
          y: row.value > 0 ? Math.log(row.value) : NaN
        }))
        .filter(point => Number.isFinite(point.y));

      if (points.length < 2) {
        return NaN;
      }

      const meanX =
        points.reduce((sum, point) => sum + point.x, 0) /
        points.length;

      const meanY =
        points.reduce((sum, point) => sum + point.y, 0) /
        points.length;

      let numerator = 0;
      let denominator = 0;

      points.forEach(point => {
        const dx = point.x - meanX;
        numerator += dx * (point.y - meanY);
        denominator += dx * dx;
      });

      if (denominator <= 0) {
        return NaN;
      }

      const slope = numerator / denominator;
      return (Math.exp(slope) - 1) * 100;
    }

    function rowRatioMap(sourceRows) {
      const result = new Map();
      if (!sourceRows?.length) return result;

      const first = sourceRows[0].year;
      const last = sourceRows[sourceRows.length - 1].year;

      sourceRows.forEach(row => {
        const ratio = last > first
          ? (row.year - first) / (last - first)
          : 0.5;
        result.set(row.year, ratio);
      });

      return result;
    }

    function shouldLabelYear(year) {
      return Number.isFinite(Number(year)) && Number(year) % 2 === 0;
    }

    function shouldMajorYear(year) {
      return Number.isFinite(Number(year)) && Number(year) % 2 === 0;
    }

    function currentYAxisTracks() {
      return scaleValues(populationScale()).map((value, index, values) => ({
        value,
        ratio: values.length > 1 ? index / (values.length - 1) : 0
      }));
    }

    function currentXAxisTracks() {
      const map = rowRatioMap(rows);

      return rows.map(row => ({
        year: row.year,
        ratio: map.get(row.year) ?? 0,
        alpha: 1,
        labelAlpha: shouldLabelYear(row.year) ? 1 : 0,
        majorAlpha: shouldMajorYear(row.year) ? 1 : 0
      }));
    }

    function buildDatasetData() {
      if (!rows.length) return [];

      const firstYear = rows[0].year;
      const lastYear = rows[rows.length - 1].year;

      return rows.map(row => ({
        x: lastYear > firstYear
          ? (row.year - firstYear) / (lastYear - firstYear)
          : 0.5,
        y: row.value,
        year: row.year
      }));
    }

    function buildDataset() {
      return {
        label: 'Australia',
        data: buildDatasetData(),
        parsing: false,
        borderColor: AUSTRALIA_COLOUR,
        backgroundColor: AUSTRALIA_COLOUR,
        pointBackgroundColor: AUSTRALIA_COLOUR,
        pointBorderColor: '#ffffff',
        borderWidth: 3,
        borderCapStyle: 'round',
        borderJoinStyle: 'round',
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHitRadius: 5,
        pointBorderWidth: 1,
        tension: 0.28,
        cubicInterpolationMode: 'monotone',
        spanGaps: false,
        fill: false,
        hidden: seriesHidden
      };
    }

    function loadGVizSheet(sheetName, range) {
      return new Promise((resolve, reject) => {
        const callbackName =
          `__pff_population_${Date.now()}_${Math.random().toString(36).slice(2)}`;

        const script = document.createElement('script');
        let completed = false;

        const cleanup = () => {
          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }
        };

        const timer = window.setTimeout(() => {
          if (completed) return;
          completed = true;
          cleanup();
          reject(new Error(`Timed out loading ${sheetName}.`));
        }, FETCH_TIMEOUT_MS);

        window[callbackName] = response => {
          if (completed) return;

          completed = true;
          window.clearTimeout(timer);
          cleanup();

          if (!response || response.status === 'error') {
            const message =
              response?.errors?.[0]?.detailed_message ||
              response?.errors?.[0]?.message ||
              `Could not load ${sheetName}.`;
            reject(new Error(message));
            return;
          }

          resolve(response.table);
        };

        script.onerror = () => {
          if (completed) return;
          completed = true;
          window.clearTimeout(timer);
          cleanup();
          reject(new Error(`Could not connect to ${sheetName}.`));
        };

        const params = new URLSearchParams({
          sheet: sheetName,
          range,
          headers: '1',
          tqx: `out:json;responseHandler:${callbackName}`
        });

        script.src =
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;
        script.async = true;
        document.head.appendChild(script);
      });
    }

    function parsePopulationTable(table) {
      const parsed = [];

      (table?.rows || []).forEach(sourceRow => {
        const cells = sourceRow?.c || [];
        const year = numericCell(cells[0]);
        const australia = numericCell(cells[9]);

        if (
          !Number.isFinite(year) ||
          year < 1900 ||
          year > 2200 ||
          !Number.isFinite(australia)
        ) {
          return;
        }

        parsed.push({
          year: Math.round(year),
          value: australia
        });
      });

      return parsed.sort((a, b) => a.year - b.year);
    }

    function saveLocalCache(data) {
      try {
        localStorage.setItem(
          LOCAL_CACHE_KEY,
          JSON.stringify({savedAt: Date.now(), data})
        );
      } catch (_) {
        // Cache is optional.
      }
    }

    function readLocalCache() {
      try {
        const raw = localStorage.getItem(LOCAL_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed?.data) && parsed.data.length >= 3
          ? parsed.data
          : null;
      } catch (_) {
        return null;
      }
    }

    function setDataSource(source) {
      const live = source === 'live';
      const cached = source === 'cached';

      dataSourceIndicator.classList.toggle('is-cached', !live);

      const label = live
        ? 'Live data'
        : cached
          ? 'Cached data'
          : 'Snapshot data';

      dataSourceIndicator.setAttribute('aria-label', label);
      dataSourceText.textContent = live
        ? 'LIVE data'
        : cached
          ? 'CACHED data'
          : 'SNAPSHOT data';
    }

    async function loadData() {
      try {
        const table = await loadGVizSheet(
          POPULATION_SHEET,
          POPULATION_RANGE
        );

        const liveRows = parsePopulationTable(table);

        if (liveRows.length < 3) {
          throw new Error('Live sheet data were incomplete.');
        }

        saveLocalCache(liveRows);
        setDataSource('live');
        return liveRows;
      } catch (error) {
        const cached = readLocalCache();

        if (cached?.length >= 3) {
          setDataSource('cached');
          return cached;
        }

        setDataSource('snapshot');
        return EMBEDDED_FALLBACK.map(row => ({...row}));
      }
    }

    function updateYoyToggle() {
      yoyTrendToggle.classList.toggle('is-on', yoyTrendOn);
      yoyTrendToggle.setAttribute('aria-pressed', String(yoyTrendOn));
      yoyTrendToggle.setAttribute(
        'aria-label',
        `Trend labels ${yoyTrendOn ? 'on' : 'off'}`
      );
      yoyToggleValue.textContent = yoyTrendOn ? 'ON' : 'OFF';
    }

    function updateHeadingScrollControls() {
      const maximum = Math.max(
        0,
        headingScrollViewport.scrollWidth - headingScrollViewport.clientWidth
      );
      const hasOverflow = maximum > 2;

      headingScrollLeft.classList.toggle(
        'is-hidden',
        !hasOverflow || headingScrollViewport.scrollLeft <= 2
      );

      headingScrollRight.classList.toggle(
        'is-hidden',
        !hasOverflow || headingScrollViewport.scrollLeft >= maximum - 2
      );
    }

    function positionTabIndicator() {
      tabList.style.setProperty(
        '--tab-indicator-x',
        `${populationTab.offsetLeft}px`
      );
      tabList.style.setProperty(
        '--tab-indicator-width',
        `${populationTab.offsetWidth}px`
      );
    }

    function renderLegend() {
      chartLegend.replaceChildren();

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'legend-item';
      button.classList.toggle('is-hidden-series', seriesHidden);
      button.setAttribute('aria-pressed', String(!seriesHidden));

      const swatch = document.createElement('span');
      swatch.className = 'legend-line';

      const text = document.createElement('span');
      text.textContent = 'Australia';

      button.append(swatch, text);

      button.addEventListener('click', () => {
        seriesHidden = !seriesHidden;
        button.classList.toggle('is-hidden-series', seriesHidden);
        button.setAttribute('aria-pressed', String(!seriesHidden));

        if (chart) {
          chart.data.datasets[0].hidden = seriesHidden;
          chart.options.animation.duration = 0;
          chart.update('none');
        }
      });

      chartLegend.appendChild(button);
    }

    const pffAxesPlugin = {
      id: 'pffAxesPlugin',

      beforeDatasetsDraw(chartInstance) {
        const {ctx, chartArea} = chartInstance;
        if (!chartArea) return;

        const yTracks = currentYAxisTracks();

        ctx.save();

        yTracks.forEach(track => {
          if (track.ratio <= 0.001) return;
          const y = chartArea.bottom - chartArea.height * track.ratio;
          ctx.beginPath();
          ctx.moveTo(chartArea.left, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.right, Math.round(y) + 0.5);
          ctx.strokeStyle = 'rgba(105, 113, 138, 0.075)';
          ctx.lineWidth = 1;
          ctx.stroke();
        });

        for (let index = 0; index < yTracks.length - 1; index += 1) {
          const ratio = (yTracks[index].ratio + yTracks[index + 1].ratio) / 2;
          const y = chartArea.bottom - chartArea.height * ratio;
          ctx.beginPath();
          ctx.moveTo(chartArea.left, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.right, Math.round(y) + 0.5);
          ctx.strokeStyle = 'rgba(105, 113, 138, 0.035)';
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(chartInstance) {
        const {ctx, chartArea} = chartInstance;
        if (!chartArea) return;

        const mobile = window.innerWidth <= 430;
        const yTracks = currentYAxisTracks();
        const xTracks = currentXAxisTracks();

        ctx.save();
        ctx.lineCap = 'butt';

        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#151515';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font = '12px Lato, sans-serif';

        yTracks.forEach(track => {
          const y = chartArea.bottom - chartArea.height * track.ratio;
          ctx.beginPath();
          ctx.moveTo(chartArea.left, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.left - 5, Math.round(y) + 0.5);
          ctx.stroke();
          ctx.fillText(formatMillions(track.value), chartArea.left - 8, y);
        });

        ctx.strokeStyle = '#69718a';
        ctx.globalAlpha = 0.60;
        ctx.lineWidth = 0.7;

        for (let index = 0; index < yTracks.length - 1; index += 1) {
          const ratio = (yTracks[index].ratio + yTracks[index + 1].ratio) / 2;
          const y = chartArea.bottom - chartArea.height * ratio;
          ctx.beginPath();
          ctx.moveTo(chartArea.left, Math.round(y) + 0.5);
          ctx.lineTo(chartArea.left - 2, Math.round(y) + 0.5);
          ctx.stroke();
        }

        xTracks.forEach(track => {
          if (track.alpha <= 0.01) return;

          const x = chartArea.left + chartArea.width * track.ratio;
          const major = track.majorAlpha > 0.5;

          ctx.save();
          ctx.globalAlpha = clamp(track.alpha, 0, 1);
          ctx.strokeStyle = major ? '#151515' : '#69718a';
          ctx.lineWidth = major ? 1 : 0.7;
          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, chartArea.bottom);
          ctx.lineTo(
            Math.round(x) + 0.5,
            chartArea.bottom + (major ? 5 : 2)
          );
          ctx.stroke();

          if (track.labelAlpha > 0.02) {
            ctx.globalAlpha = clamp(track.labelAlpha, 0, 1);
            ctx.fillStyle = '#151515';
            ctx.font = `${mobile ? 9 : 10}px Lato, sans-serif`;
            ctx.textBaseline = 'top';

            let labelX = x;

            if (track.ratio <= 0.001) {
              ctx.textAlign = 'left';
              labelX = x + 2;
            } else if (track.ratio >= 0.999) {
              ctx.textAlign = 'right';
              labelX = x - 2;
            } else {
              ctx.textAlign = 'center';
            }

            ctx.fillText(
              String(track.year),
              labelX,
              chartArea.bottom + 8
            );
          }

          ctx.restore();
        });

        ctx.restore();
      }
    };

    const axisSpinesPlugin = {
      id: 'axisSpinesPlugin',

      afterDraw(chartInstance) {
        const {ctx, chartArea} = chartInstance;
        if (!chartArea) return;

        ctx.save();
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(Math.round(chartArea.left) + 0.5, chartArea.top);
        ctx.lineTo(Math.round(chartArea.left) + 0.5, chartArea.bottom);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(chartArea.left, Math.round(chartArea.bottom) + 0.5);
        ctx.lineTo(chartArea.right, Math.round(chartArea.bottom) + 0.5);
        ctx.stroke();

        ctx.restore();
      }
    };

    const paTrendLabelsPlugin = {
      id: 'paTrendLabelsPlugin',

      afterDatasetsDraw(chartInstance) {
        if (!yoyTrendOn || seriesHidden || rows.length < 2) return;

        const {ctx, chartArea} = chartInstance;
        const meta = chartInstance.getDatasetMeta(0);
        const dataset = chartInstance.data.datasets[0];

        if (!meta?.data?.length || meta.hidden || !dataset) return;

        const growth = latestAnnualisedGrowth();
        if (!Number.isFinite(growth)) return;

        let anchorIndex = -1;

        for (let index = dataset.data.length - 1; index >= 0; index -= 1) {
          if (
            Number.isFinite(dataset.data[index]?.y) &&
            Number.isFinite(meta.data[index]?.x) &&
            Number.isFinite(meta.data[index]?.y)
          ) {
            anchorIndex = index;
            break;
          }
        }

        if (anchorIndex < 0) return;

        const point = meta.data[anchorIndex];
        const mobile = window.innerWidth <= 430;
        const fontSize = mobile ? 8.2 : 9.1;
        const labelHeight = mobile ? 14 : 15;
        const paddingX = mobile ? 4 : 5;
        const arrowGap = mobile ? 2.5 : 3;
        const isIncrease = growth > 0.05;
        const isDecrease = growth < -0.05;
        const arrow = isIncrease ? '↑' : isDecrease ? '↓' : '';
        const valueText = `${Math.abs(growth).toFixed(1)}% p.a.`;

        function seriesTint(hex, strength = 0.20, alpha = 0.84) {
          const cleaned = String(hex || '#69718a').replace('#', '').trim();
          const value = Number.parseInt(cleaned, 16);

          if (!Number.isFinite(value)) {
            return `rgba(239, 240, 244, ${alpha})`;
          }

          const red = (value >> 16) & 255;
          const green = (value >> 8) & 255;
          const blue = value & 255;
          const mix = channel => Math.round(255 + (channel - 255) * strength);

          return `rgba(${mix(red)},${mix(green)},${mix(blue)},${alpha})`;
        }

        ctx.save();
        ctx.font = `700 ${fontSize}px Lato, sans-serif`;
        ctx.textBaseline = 'middle';

        const arrowWidth = arrow ? ctx.measureText(arrow).width : 0;
        const valueWidth = ctx.measureText(valueText).width;
        const labelWidth =
          paddingX * 2 +
          arrowWidth +
          (arrow ? arrowGap : 0) +
          valueWidth;

        const labelRight = clamp(
          chartArea.right - 4,
          chartArea.left + labelWidth + 5,
          chartArea.right - 4
        );

        const labelLeft = labelRight - labelWidth;
        const labelY = clamp(
          point.y,
          chartArea.top + labelHeight / 2,
          chartArea.bottom - labelHeight / 2
        );

        const targetX =
          point.x < labelLeft
            ? labelLeft
            : point.x > labelRight
              ? labelRight
              : clamp(point.x, labelLeft, labelRight);

        const displaced =
          Math.abs(targetX - point.x) > 7 ||
          Math.abs(labelY - point.y) > 2 ||
          labelLeft < point.x - 4;

        if (displaced) {
          ctx.beginPath();
          ctx.moveTo(point.x, point.y);
          ctx.lineTo(targetX, labelY);
          ctx.strokeStyle = 'rgba(105, 113, 138, 0.58)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }

        const fillColour = seriesTint(AUSTRALIA_COLOUR, 0.20, 0.84);
        const directionColour =
          isIncrease ? '#14823b' :
          isDecrease ? '#b42318' :
          '#69718a';

        const radius = 3;
        const top = labelY - labelHeight / 2;
        const bottom = labelY + labelHeight / 2;

        ctx.beginPath();
        ctx.moveTo(labelLeft + radius, top);
        ctx.lineTo(labelRight - radius, top);
        ctx.quadraticCurveTo(labelRight, top, labelRight, top + radius);
        ctx.lineTo(labelRight, bottom - radius);
        ctx.quadraticCurveTo(labelRight, bottom, labelRight - radius, bottom);
        ctx.lineTo(labelLeft + radius, bottom);
        ctx.quadraticCurveTo(labelLeft, bottom, labelLeft, bottom - radius);
        ctx.lineTo(labelLeft, top + radius);
        ctx.quadraticCurveTo(labelLeft, top, labelLeft + radius, top);
        ctx.closePath();

        ctx.fillStyle = fillColour;
        ctx.fill();

        ctx.strokeStyle = rgba(AUSTRALIA_COLOUR, 0.42);
        ctx.lineWidth = 0.65;
        ctx.stroke();

        let textX = labelLeft + paddingX;
        ctx.textAlign = 'left';
        ctx.fillStyle = directionColour;

        if (arrow) {
          ctx.fillText(arrow, textX, labelY - 0.2);
          textX += arrowWidth + arrowGap;
        }

        ctx.fillText(valueText, textX, labelY);
        ctx.restore();
      }
    };

    Chart.register(
      pffAxesPlugin,
      axisSpinesPlugin,
      paTrendLabelsPlugin
    );

    function baseChartOptions() {
      const mobile = window.innerWidth <= 430;
      const yScale = populationScale();

      return {
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 0,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 3),

        animation: {
          duration: 1500,
          easing: 'easeInOutCubic'
        },

        animations: {
          x: {duration: 1500, easing: 'easeInOutCubic'},
          y: {duration: 1500, easing: 'easeInOutCubic'},
          borderColor: {duration: 0},
          backgroundColor: {duration: 0}
        },

        transitions: {
          active: {
            animation: {
              duration: 170,
              easing: 'easeOutCubic'
            }
          }
        },

        interaction: {
          mode: 'nearest',
          intersect: true,
          axis: 'xy'
        },

        layout: {
          autoPadding: false,
          padding: {
            top: mobile ? 8 : 9,
            right: 4,
            bottom: 0,
            left: 0
          }
        },

        plugins: {
          legend: {display: false},
          tooltip: {
            displayColors: false,
            backgroundColor: '#ffffff',
            titleColor: '#151515',
            bodyColor: '#69718a',
            borderColor: '#e8eaf0',
            borderWidth: 1,
            padding: 9,
            cornerRadius: 4,
            titleFont: {
              family: 'Lato',
              size: 12,
              weight: '700'
            },
            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },
            callbacks: {
              title(items) {
                const year = items?.[0]?.raw?.year;
                return Number.isFinite(Number(year)) ? String(year) : '';
              },
              label(context) {
                const valueText =
                  `${context.dataset.label}: ${formatInteger(context.raw?.y)}`;

                if (!yoyTrendOn) {
                  return valueText;
                }

                const growth = latestAnnualisedGrowth();

                if (!Number.isFinite(growth)) {
                  return valueText;
                }

                const sign =
                  growth > 0 ? '+' : growth < 0 ? '−' : '';

                return `${valueText} · ${sign}${Math.abs(growth).toFixed(1)}% p.a.`;
              }
            }
          }
        },

        scales: {
          x: {
            type: 'linear',
            min: 0,
            max: 1,
            afterFit(scaleObject) {
              scaleObject.height = mobile ? 43 : 46;
            },
            border: {display: false},
            grid: {display: false, drawTicks: false},
            ticks: {display: false},
            title: {
              display: true,
              text: 'Year',
              color: '#151515',
              padding: {top: mobile ? 21 : 22},
              font: {
                family: 'Lato',
                size: mobile ? 12 : 13,
                weight: '700'
              }
            }
          },

          y: {
            min: yScale.min,
            max: yScale.max,
            afterFit(scaleObject) {
              scaleObject.width = mobile ? 61 : 69;
            },
            border: {display: false},
            grid: {display: false, drawTicks: false},
            ticks: {display: false},
            title: {
              display: true,
              text: 'Population',
              color: '#151515',
              padding: {bottom: 4},
              font: {
                family: 'Lato',
                size: mobile ? 12 : 13,
                weight: '700'
              }
            }
          }
        }
      };
    }

    function createChart() {
      chart = new Chart(
        trendCanvas.getContext('2d'),
        {
          type: 'line',
          data: {
            datasets: [buildDataset()]
          },
          options: baseChartOptions()
        }
      );
    }

    function refreshResponsiveLayout() {
      positionTabIndicator();
      updateHeadingScrollControls();

      if (!chart) return;

      const mobile = window.innerWidth <= 430;

      chart.options.scales.y.afterFit = scaleObject => {
        scaleObject.width = mobile ? 61 : 69;
      };

      chart.options.scales.x.afterFit = scaleObject => {
        scaleObject.height = mobile ? 43 : 46;
      };

      chart.options.scales.x.title.font.size = mobile ? 12 : 13;
      chart.options.scales.y.title.font.size = mobile ? 12 : 13;
      chart.options.scales.x.title.padding.top = mobile ? 21 : 22;
      chart.resize();
      chart.draw();
    }

    yoyTrendToggle.addEventListener('click', () => {
      yoyTrendOn = !yoyTrendOn;
      updateYoyToggle();
      chart?.draw();
    });

    headingScrollLeft.addEventListener('click', () => {
      headingScrollViewport.scrollBy({left: -160, behavior: 'smooth'});
    });

    headingScrollRight.addEventListener('click', () => {
      headingScrollViewport.scrollBy({left: 160, behavior: 'smooth'});
    });

    headingScrollViewport.addEventListener('scroll', updateHeadingScrollControls, {passive:true});

    document.addEventListener('pointerdown', event => {
      if (!chart || event.target === trendCanvas) return;
      chart.setActiveElements([]);
      chart.tooltip?.setActiveElements([], {x:0, y:0});
      chart.draw();
    });

    if ('ResizeObserver' in window) {
      new ResizeObserver(refreshResponsiveLayout).observe(app);
    } else {
      window.addEventListener('resize', refreshResponsiveLayout);
    }

    async function initialise() {
      try {
        rows = await loadData();
        renderLegend();
        updateYoyToggle();
        createChart();

        app.classList.remove('is-loading');
        app.setAttribute('aria-busy', 'false');
        loadingState.setAttribute('aria-hidden', 'true');

        requestAnimationFrame(refreshResponsiveLayout);
      } catch (error) {
        statusElement.textContent =
          error?.message || 'Could not load Australian population data.';
        app.classList.remove('is-loading');
        app.setAttribute('aria-busy', 'false');
      }
    }

    initialise();
  </script>
</body>
