            'item-check';

          check.setAttribute(
            'aria-hidden',
            'true'
          );

          const label =
            document.createElement(
              'span'
            );

          label.className =
            'item-option-label';

          label.textContent =
            option.label;

          button.append(
            check,
            label
          );

          button.addEventListener(
            'click',
            event => {
              event.stopPropagation();

              if (
                option.key ===
                  SELECT_ALL_KEY
              ) {
                toggleAllSelectable();
                return;
              }

              toggleSelectedSeries(
                option.key
              );
            }
          );

          itemMenuScroll
            .appendChild(
              button
            );
        }
      );

      syncItemMenuSelection();
    }

    function syncItemMenuSelection() {
      const allSelected =
        allSelectableSelected();

      const someSelected =
        someSelectableSelected();

      itemMenuScroll
        .querySelectorAll(
          '.item-option'
        )
        .forEach(
          button => {
            const key =
              button.dataset.key;

            if (
              key ===
              SELECT_ALL_KEY
            ) {
              button.hidden =
                false;

              button.classList.toggle(
                'is-selected',
                allSelected
              );

              button.classList.toggle(
                'is-indeterminate',
                !allSelected &&
                someSelected
              );

              button.setAttribute(
                'aria-checked',
                allSelected
                  ? 'true'
                  : someSelected
                    ? 'mixed'
                    : 'false'
              );

              return;
            }

            button.hidden =
              false;

            button.classList.remove(
              'is-indeterminate'
            );

            const selected =
              selectedSeries.has(
                key
              );

            button.classList.toggle(
              'is-selected',
              selected
            );

            button.setAttribute(
              'aria-checked',
              String(
                selected
              )
            );
          }
        );
    }

    function toggleSelectedSeries(
      key
    ) {
      const next =
        new Set(
          selectedSeries
        );

      if (
        next.has(key)
      ) {
        next.delete(
          key
        );
      } else {
        next.add(
          key
        );
      }

      selectedSeries =
        next;

      updateItemButtonText();
      syncItemMenuSelection();

      renderChartChange(
        true,
        true,
        'selection'
      );
    }

    function openItemMenu() {
      itemMenu.classList.add(
        'is-open'
      );

      itemButton.setAttribute(
        'aria-expanded',
        'true'
      );
    }

    function closeItemMenu() {
      itemMenu.classList.remove(
        'is-open'
      );

      itemButton.setAttribute(
        'aria-expanded',
        'false'
      );
    }

    // ============================================================
    // LEGEND
    // ============================================================

    function updateOverflowButtons(
      scroller,
      leftButton,
      rightButton
    ) {
      const maximum =
        Math.max(
          0,
          scroller.scrollWidth -
          scroller.clientWidth
        );

      const hasOverflow =
        maximum > 2;

      leftButton.classList.toggle(
        'is-hidden',
        !hasOverflow ||
        scroller.scrollLeft <=
          2
      );

      rightButton.classList.toggle(
        'is-hidden',
        !hasOverflow ||
        scroller.scrollLeft >=
          maximum - 2
      );
    }

    function updateHeadingScrollControls() {
      const maximumScroll =
        Math.max(
          0,
          headingScrollViewport.scrollWidth -
            headingScrollViewport.clientWidth
        );

      const hasOverflow =
        maximumScroll > 2;

      headingScrollLeft.classList.toggle(
        'is-hidden',
        !hasOverflow ||
          headingScrollViewport.scrollLeft <= 2
      );

      headingScrollRight.classList.toggle(
        'is-hidden',
        !hasOverflow ||
          headingScrollViewport.scrollLeft >=
            maximumScroll - 2
      );
    }

    function headingScrollAmount() {
      return Math.max(
        80,
        headingScrollViewport.clientWidth *
          0.72
      );
    }

    function updateLegendScrollControls() {
      updateOverflowButtons(
        chartLegend,
        legendScrollLeft,
        legendScrollRight
      );
    }

    function scrollByAmount(
      element,
      direction
    ) {
      element.scrollBy({
        left:
          direction *
          Math.max(
            80,
            element.clientWidth *
            0.72
          ),
        behavior:
          reducedMotion()
            ? 'auto'
            : 'smooth'
      });
    }

    function createLegendItem(
      key
    ) {
      const item =
        document.createElement(
          'span'
        );

      item.className =
        'legend-item';

      item.dataset.key =
        key;

      const swatch =
        document.createElement(
          'span'
        );

      swatch.className =
        'legend-line';

      const text =
        document.createElement(
          'span'
        );

      item.append(
        swatch,
        text
      );

      syncLegendItemState(
        item,
        key
      );

      return item;
    }

    function syncLegendItemState(
      element,
      key
    ) {
      element.dataset.key =
        key;

      const swatch =
        element.querySelector(
          '.legend-line'
        );

      const text =
        element.querySelector(
          'span:last-child'
        );

      if (swatch) {
        const colour =
          seriesColour(
            key
          );

        const longConsult =
          isLongConsultItem(
            key
          );

        const shortConsult =
          isShortConsultItem(
            key
          );

        swatch.classList.toggle(
          'is-short-consult',
          shortConsult
        );

        swatch.style.color =
          colour;

        swatch.style.background =
          shortConsult
            ? 'transparent'
            : colour;

        swatch.title =
          longConsult
            ? '28.5-minute consultation item'
            : shortConsult
              ? 'Short consultation item'
              : '';
      }

      if (text) {
        text.textContent =
          seriesLabel(
            key
          );
      }
    }

    function updateLegend(
      animate = true
    ) {
      const nextKeys =
        visibleSelectedKeys();

      const existing =
        new Map(
          Array.from(
            chartLegend.querySelectorAll(
              '.legend-item[data-key]'
            )
          ).map(
            element => [
              element.dataset.key,
              element
            ]
          )
        );

      const nextSet =
        new Set(
          nextKeys
        );

      for (
        const [key, element]
        of existing
      ) {
        if (
          !nextSet.has(
            key
          )
        ) {
          element
            .getAnimations?.()
            .forEach(
              animation =>
                animation.cancel()
            );

          element.remove();
          existing.delete(
            key
          );
        }
      }

      const fragment =
        document.createDocumentFragment();

      const added =
        [];

      nextKeys.forEach(
        key => {
          let element =
            existing.get(
              key
            );

          if (!element) {
            element =
              createLegendItem(
                key
              );

            added.push(
              element
            );
          } else {
            syncLegendItemState(
              element,
              key
            );
          }

          fragment.appendChild(
            element
          );
        }
      );

      chartLegend.appendChild(
        fragment
      );

      if (
        animate &&
        !reducedMotion()
      ) {
        added.forEach(
          element => {
            element.animate?.(
              [
                {
                  opacity: 0,
                  transform:
                    'translateX(5px)'
                },
                {
                  opacity: 1,
                  transform:
                    'translateX(0)'
                }
              ],
              {
                duration: 260,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );
          }
        );
      }

      requestAnimationFrame(
        updateLegendScrollControls
      );
    }

    // ============================================================
    // HEADING / TABS / TOGGLES
    // ============================================================

    function headingModeText() {
      return activeView ===
        'capacity'
        ? 'capacity billed'
        : 'services per FTE optom';
    }

    function yAxisTitle() {
      return activeView ===
        'capacity'
        ? 'Capacity billed (%)'
        : 'Services / FTE optom / week';
    }

    function updateHeading() {
      slideFadeTextChange(
        chartHeadingMode,
        headingModeText(),
        activeView ===
          'services'
          ? 1
          : -1
      );

      headingScrollViewport
        .scrollTo({
          left: 0,
          behavior:
            'auto'
        });

      requestAnimationFrame(
        updateHeadingScrollControls
      );
    }

    function updateTabIndicator(
      animate = true
    ) {
      const activeTab =
        chartTabs.find(
          tab =>
            tab.dataset.view ===
            activeView
        );

      if (!activeTab) {
        return;
      }

      if (!animate) {
        tabList.classList.add(
          'is-positioning'
        );
      }

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${activeTab.offsetLeft}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${activeTab.offsetWidth}px`
      );

      if (!animate) {
        requestAnimationFrame(
          () =>
            tabList.classList
              .remove(
                'is-positioning'
              )
        );
      }
    }

    function updateTabs() {
      chartTabs.forEach(
        tab => {
          const active =
            tab.dataset.view ===
            activeView;

          tab.classList.toggle(
            'is-active',
            active
          );

          tab.setAttribute(
            'aria-selected',
            String(active)
          );
        }
      );

      updateTabIndicator(
        true
      );
    }

    function updateYoyToggle() {
      yoyTrendToggle
        .classList.toggle(
          'is-on',
          yoyTrendOn
        );

      yoyTrendToggle
        .setAttribute(
          'aria-pressed',
          String(
            yoyTrendOn
          )
        );

      yoyTrendToggle
        .setAttribute(
          'aria-label',
          `Trend labels ${yoyTrendOn ? 'on' : 'off'}`
        );

      yoyToggleValue.textContent =
        yoyTrendOn
          ? 'ON'
          : 'OFF';
    }

    // ============================================================
    // CHART
    // ============================================================

    function tooltipValue(
      raw
    ) {
      const value =
        raw?.y;

      const number =
        finiteNumber(
          value
        );

      if (
        number === null
      ) {
        return '—';
      }

      if (
        activeView ===
        'capacity'
      ) {
        return `${
          number.toLocaleString(
            'en-AU',
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }
          )
        }% of capacity billed`;
      }

      return `${
        number.toLocaleString(
          'en-AU',
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
          }
        )
      } services / FTE optom / week`;
    }

    function baseChartOptions() {
      const mobile =
        window.innerWidth <=
        430;

      return {
        responsive:
          true,

        maintainAspectRatio:
          false,

        resizeDelay:
          40,

        devicePixelRatio:
          Math.min(
            window.devicePixelRatio ||
              1,
            2
          ),

        animation: {
          duration:
            760,
          easing:
            'easeOutQuart'
        },

        animations: {
          x: {
            // Years/x positions are identical across all Medicare views.
            duration: 0
          },

          y: {
            duration:
              760,
            easing:
              'easeOutQuart'
          },

          borderColor: {
            duration:
              0
          },

          backgroundColor: {
            duration:
              0
          }
        },

        transitions: {
          active: {
            animation: {
              duration:
                180
            }
          }
        },

        interaction: {
          mode:
            'nearest',
          intersect:
            true,
          axis:
            'xy'
        },

        layout: {
          autoPadding:
            false,

          padding: {
            top:
              mobile
                ? 8
                : 9,
            right:
              4,
            bottom:
              0,
            left:
              0
          }
        },

        plugins: {
          legend: {
            display:
              false
          },

          tooltip: {
            displayColors:
              true,

            backgroundColor:
              'rgba(21, 21, 21, 0.94)',

            titleColor:
              '#ffffff',

            bodyColor:
              '#ffffff',

            borderColor:
              'rgba(255,255,255,0.10)',

            borderWidth:
              1,

            padding:
              9,

            cornerRadius:
              4,

            titleFont: {
              family:
                'Lato',
              size:
                11,
              weight:
                '700'
            },

            bodyFont: {
              family:
                'Lato',
              size:
                11,
              weight:
                '400'
            },

            callbacks: {
              title(items) {
                const year =
                  items?.[0]?.raw
                    ?.year;

                return Number.isFinite(
                  Number(year)
                )
                  ? String(year)
                  : '';
              },

              label(context) {
                const valueText =
                  `${context.dataset.label}: ${tooltipValue(context.raw)}`;

                if (
                  !yoyTrendOn
                ) {
                  return valueText;
                }

                const growth =
                  latestAnnualisedGrowth(
                    context.dataset
                      .seriesKey
                  );

                if (
                  !Number.isFinite(
                    growth
                  )
                ) {
                  return valueText;
                }

                const sign =
                  growth > 0
                    ? '+'
                    : growth < 0
                      ? '−'
                      : '';

                return `${valueText} · ${sign}${Math.abs(growth).toFixed(1)}% p.a.`;
              }
            }
          }
        },

        scales: {
          x: {
            type:
              'linear',

            min:
              0,

            max:
              1,

            afterFit(
              scaleObject
            ) {
              scaleObject.height =
                mobile
                  ? 43
                  : 46;
            },

            border: {
              display:
                false
            },

            grid: {
              display:
                false,
              drawTicks:
                false
            },

            ticks: {
              display:
                false
            },

            title: {
              display:
                true,
              text:
                'Year',
              color:
                '#151515',
              padding: {
                top:
                  mobile
                    ? 21
                    : 22
              },
              font: {
                family:
                  'Lato',
                size:
                  mobile
                    ? 12
                    : 13,
                weight:
                  '700'
              }
            }
          },

          y: {
            min:
              currentScale.min,

            max:
              currentScale.max,

            afterFit(
              scaleObject
            ) {
              scaleObject.width =
                mobile
                  ? 61
                  : 69;
            },

            border: {
              display:
                false
            },

            grid: {
              display:
                false,
              drawTicks:
                false
            },

            ticks: {
              display:
                false
            },

            title: {
              display:
                false
            }
          }
        }
      };
    }

    function createChart() {
      currentScale =
        computeScale();

      setYAxisTickValuesImmediately(
        currentScale
      );

      setYAxisTitleImmediately(
        yAxisTitle()
      );

      chart =
        new Chart(
          demandCanvas.getContext(
            '2d'
          ),
          {
            type:
              'line',

            data: {
              datasets:
                buildDatasets()
            },

            options:
              baseChartOptions()
          }
        );
    }

    function renderChartChange(
      animate = true,
      legendAnimate = true,
      reason = 'data'
    ) {
      if (!chart) {
        return;
      }

      const duration =
        animate
          ? chartAnimationDuration(
              reason
            )
          : 0;

      const previousScale =
        copyScale(
          currentScale
        );

      const previousTitle =
        yAxisTitleAnimation
          .progress <
          0.5
          ? yAxisTitleAnimation
              .from
          : yAxisTitleAnimation
              .to;

      const nextScale =
        copyScale(
          computeScale()
        );

      const nextTitle =
        yAxisTitle();

      const scaleChanged =
        !scalesNearlyEqual(
          previousScale,
          nextScale
        );

      const titleChanged =
        String(
          previousTitle ||
          ''
        ) !==
        String(
          nextTitle ||
          ''
        );

      currentScale = {
        min:
          nextScale.min,
        max:
          nextScale.max,
        step:
          nextScale.step
      };

      /*
       * Retained Medicare datasets remain the same Chart.js objects, so the
       * lines morph rather than disappearing/reappearing.
       */
      syncChartDatasets();

      chart.options.scales.y.min =
        nextScale.min;

      chart.options.scales.y.max =
        nextScale.max;

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeOutQuart';

      /*
       * Years never change between views, so keep X positions static even
       * though the pasted generic workforce chart animates X when its
       * categories can change.
       */
      chart.options.animations.x.duration =
        0;

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeOutQuart';

      chart.update(
        duration > 0
          ? undefined
          : 'none'
      );

      /*
       * PFF-style synchronized Y-axis transition: numeric labels count
       * smoothly while tick marks and horizontal guides slide to their new
       * positions on the same easeOutCubic clock.
       */
      if (
        scaleChanged &&
        duration > 0
      ) {
        animateYAxisTickValues(
          yTickTargets(
            nextScale
          ),
          duration,
          nextScale
        );
      } else {
        setYAxisTickValuesImmediately(
          nextScale
        );
      }

      /*
       * Axis titles use the latest PFF 420ms cross-fade, with no translation.
       * If the title is unchanged, it remains completely static.
       */
      if (
        titleChanged &&
        duration > 0
      ) {
        animateYAxisTitle(
          nextTitle,
          Math.min(
            duration,
            420
          )
        );
      } else if (
        titleChanged
      ) {
        setYAxisTitleImmediately(
          nextTitle
        );
      }

      updateLegend(
        legendAnimate
      );
    }

    // ============================================================
    // EVENTS
    // ============================================================

    chartTabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => {
            const nextView =
              tab.dataset.view;

            if (
              !nextView ||
              nextView ===
                activeView
            ) {
              return;
            }

            closeItemMenu();

            activeView =
              nextView;

            updateTabs();
            updateHeading();
            renderChartChange(
              true,
              true,
              'view'
            );
          }
        );
      }
    );

    yoyTrendToggle
      .addEventListener(
        'click',
        () => {
          yoyTrendOn =
            !yoyTrendOn;

          updateYoyToggle();
          chart?.draw();
        }
      );

    itemButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        if (
          itemMenu.classList.contains(
            'is-open'
          )
        ) {
          closeItemMenu();
        } else {
          openItemMenu();
        }
      }
    );

    document.addEventListener(
      'click',
      event => {
        if (
          !itemControl.contains(
            event.target
          )
        ) {
          closeItemMenu();
        }
      }
    );

    document.addEventListener(
      'keydown',
      event => {
        if (
          event.key ===
          'Escape'
        ) {
          closeItemMenu();
          itemButton.focus();
        }
      }
    );

    headingScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        headingScrollViewport.scrollBy({
          left:
            -headingScrollAmount(),
          behavior:
            reducedMotion()
              ? 'auto'
              : 'smooth'
        });
      }
    );

    headingScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        headingScrollViewport.scrollBy({
          left:
            headingScrollAmount(),
          behavior:
            reducedMotion()
              ? 'auto'
              : 'smooth'
        });
      }
    );

    headingScrollViewport.addEventListener(
      'scroll',
      updateHeadingScrollControls,
      {
        passive:
          true
      }
    );

    legendScrollLeft
      .addEventListener(
        'click',
        () =>
          scrollByAmount(
            chartLegend,
            -1
          )
      );

    legendScrollRight
      .addEventListener(
        'click',
        () =>
          scrollByAmount(
            chartLegend,
            1
          )
      );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive:
          true
      }
    );

    let resizeFrame =
      null;

    window.addEventListener(
      'resize',
      () => {
        if (
          resizeFrame
        ) {
          cancelAnimationFrame(
            resizeFrame
          );
        }

        resizeFrame =
          requestAnimationFrame(
            () => {
              resizeFrame =
                null;

              updateTabIndicator(
                false
              );

              updateHeadingScrollControls();
              updateLegendScrollControls();
              chart?.resize();
            }
          );
      }
    );

    let headingResizeObserver =
      null;

    if (
      'ResizeObserver' in
      window
    ) {
      headingResizeObserver =
        new ResizeObserver(
          updateHeadingScrollControls
        );

      headingResizeObserver.observe(
        headingScrollShell
      );

      headingResizeObserver.observe(
        headingScrollViewport
      );

      headingResizeObserver.observe(
        chartHeading
      );
    }

    requestAnimationFrame(
      updateHeadingScrollControls
    );

    // ============================================================
    // STARTUP
    // ============================================================

    async function initialise() {
      try {
        sourceData =
          await loadData();

        if (
          !validSourceData(
            sourceData
          )
        ) {
          throw new Error(
            'No usable Medicare service data were found.'
          );
        }

        /*
         * Keep colour assignment stable even if a live row omits colour
         * metadata: colour identity is tied to the raw item order.
         */
        sourceData.items =
          sourceData.items.map(
            (
              item,
              index
            ) => ({
              ...item,
              colour:
                item.colour ||
                EMBEDDED_FALLBACK
                  .items?.[
                    index
                  ]?.colour ||
                '#69718a'
            })
          );

        buildItemMenu();
        updateItemButtonText();
          updateYoyToggle();
        updateTabs();
        updateHeading();

        createChart();
        updateLegend(false);

        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );

        loadingState.setAttribute(
          'aria-hidden',
          'true'
        );

        requestAnimationFrame(
          () => {
            updateTabIndicator(
              false
            );

            updateHeadingScrollControls();
            updateLegendScrollControls();
            chart.resize();
          }
        );
      } catch (error) {
        statusElement.textContent =
          error?.message ||
          'Could not load Medicare service data.';

        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );
      }
    }

    initialise();
  </script>
</body>
</html>
