    // LIVE GOOGLE SHEETS LOAD
    // ============================================================

    function loadGVizSheet(
      sheetName,
      range,
      headers = '1'
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `__pff_medicare_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement(
              'script'
            );

          let completed =
            false;

          const cleanup = () => {
            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(script);
            }

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }
          };

          const timer =
            window.setTimeout(
              () => {
                if (completed) {
                  return;
                }

                completed = true;
                cleanup();

                reject(
                  new Error(
                    `Timed out loading ${sheetName}.`
                  )
                );
              },
              FETCH_TIMEOUT_MS
            );

          window[
            callbackName
          ] = response => {
            if (completed) {
              return;
            }

            completed = true;
            window.clearTimeout(
              timer
            );
            cleanup();

            if (
              !response ||
              response.status ===
                'error'
            ) {
              const message =
                response?.errors?.[0]
                  ?.detailed_message ||
                response?.errors?.[0]
                  ?.message ||
                `Could not load ${sheetName}.`;

              reject(
                new Error(message)
              );

              return;
            }

            const table =
              response.table;

            if (!table) {
              reject(
                new Error(
                  `No table data were returned from ${sheetName}.`
                )
              );

              return;
            }

            resolve(table);
          };

          script.onerror = () => {
            if (completed) {
              return;
            }

            completed = true;
            window.clearTimeout(
              timer
            );
            cleanup();

            reject(
              new Error(
                `Could not connect to ${sheetName}.`
              )
            );
          };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              headers,
              tq: 'select *',
              tqx:
                `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async = true;
          document.head
            .appendChild(script);
        }
      );
    }

    function itemNumberCell(
      cell
    ) {
      const value =
        numericCell(
          cell
        );

      if (
        Number.isFinite(
          value
        )
      ) {
        return String(
          Math.round(value)
        );
      }

      const raw =
        cell?.v ??
        cell?.f ??
        '';

      const text =
        String(raw)
          .trim();

      return /^\d{5}$/.test(text)
        ? text
        : '';
    }

    function parseMetadataRows(
      itemTable,
      hoursTable
    ) {
      const itemCells =
        itemTable?.rows?.[0]?.c ||
        [];

      const hourCells =
        hoursTable?.rows?.[0]?.c ||
        [];

      const colourByItem =
        new Map(
          EMBEDDED_FALLBACK
            .items
            .map(item => [
              item.item,
              item.colour
            ])
        );

      const parsed =
        [];

      for (
        let start = 0;
        start + 8 <
          itemCells.length;
        start += 9
      ) {
        const item =
          itemNumberCell(
            itemCells[start]
          );

        if (
          !/^\d{5}$/.test(
            item
          )
        ) {
          break;
        }

        const repeated =
          Array.from(
            {length: 9},
            (_, offset) =>
              itemNumberCell(
                itemCells[
                  start + offset
                ]
              )
          );

        if (
          !repeated.every(
            value =>
              value === item
          )
        ) {
          break;
        }

        parsed.push({
          item,
          hours:
            numericCell(
              hourCells[
                start
              ]
            ),
          colour:
            colourByItem.get(
              item
            ) ||
            EMBEDDED_FALLBACK
              .items?.[
                parsed.length
              ]?.colour ||
            '#69718a'
        });
      }

      return parsed;
    }

    function parseMedicareDataTable(
      table,
      itemSchema
    ) {
      const rows =
        table?.rows || [];

      if (!rows.length) {
        throw new Error(
          'Medicareitems returned no annual rows.'
        );
      }

      const parsedRows =
        [];

      for (const row of rows) {
        const cells =
          row?.c || [];

        const yearValue =
          numericCell(
            cells[0]
          );

        if (
          !Number.isFinite(
            yearValue
          )
        ) {
          continue;
        }

        const year =
          Math.round(
            yearValue
          );

        if (
          year < 1900 ||
          year > 2200
        ) {
          continue;
        }

        /*
         * C30:KE is queried with row 30 as the single header row.
         * Returned row data therefore begin at sheet row 31.
         *
         * C is index 0 (Calendar year).
         * D:L is item 1; its Australian Total is index 9.
         * Each next item block advances another 9 columns:
         * 9, 18, 27, ...
         */
        const totals =
          itemSchema.map(
            (_, itemIndex) =>
              numericCell(
                cells[
                  9 +
                  itemIndex * 9
                ]
              )
          );

        if (
          totals.some(
            Number.isFinite
          )
        ) {
          parsedRows.push({
            year,
            totals
          });
        }
      }

      parsedRows.sort(
        (a, b) =>
          a.year - b.year
      );

      return {
        items:
          itemSchema,
        rows:
          parsedRows
      };
    }

    function parseClinicianTable(
      table
    ) {
      const rows =
        [];

      (
        table?.rows ||
        []
      ).forEach(
        sourceRow => {
          const cells =
            sourceRow?.c ||
            [];

          const yearValue =
            numericCell(
              cells[0]
            );

          if (
            !Number.isFinite(
              yearValue
            )
          ) {
            return;
          }

          const year =
            Math.round(
              yearValue
            );

          if (
            year < 1900 ||
            year > 2200
          ) {
            return;
          }

          const counts =
            Array.from(
              {
                length:
                  RAW_CLINICIAN_SERIES_COUNT
              },
              (
                _,
                index
              ) =>
                numericCell(
                  cells[
                    CLINICIAN_COUNT_FIRST_INDEX +
                    index
                  ]
                )
            );

          const hours =
            Array.from(
              {
                length:
                  RAW_CLINICIAN_SERIES_COUNT
              },
              (
                _,
                index
              ) =>
                numericCell(
                  cells[
                    CLINICIAN_HOURS_FIRST_INDEX +
                    index
                  ]
                )
            );

          if (
            counts.some(
              Number.isFinite
            ) &&
            hours.some(
              Number.isFinite
            )
          ) {
            rows.push({
              year,
              counts,
              hours
            });
          }
        }
      );

      rows.sort(
        (
          first,
          second
        ) =>
          first.year -
          second.year
      );

      return rows;
    }

    function clinicianRowsFromCoverageCache() {
      try {
        const raw =
          localStorage.getItem(
            COVERAGE_RAW_CACHE_KEY
          );

        if (!raw) {
          return null;
        }

        const cached =
          JSON.parse(
            raw
          );

        const countsByYear =
          cached?.clinicianCountByYear;

        const hoursByYear =
          cached?.weeklyHoursByYear;

        if (
          !countsByYear ||
          !hoursByYear
        ) {
          return null;
        }

        const years =
          Array.from(
            new Set([
              ...Object.keys(
                countsByYear
              ),
              ...Object.keys(
                hoursByYear
              )
            ])
          )
            .map(Number)
            .filter(
              Number.isFinite
            )
            .sort(
              (
                first,
                second
              ) =>
                first -
                second
            );

        const rows =
          years
            .map(
              year => ({
                year,
                counts:
                  Array.from(
                    countsByYear[
                      year
                    ] ||
                    []
                  ),
                hours:
                  Array.from(
                    hoursByYear[
                      year
                    ] ||
                    []
                  )
              })
            )
            .filter(
              row =>
                row.counts.length >=
                  RAW_CLINICIAN_SERIES_COUNT &&
                row.hours.length >=
                  RAW_CLINICIAN_SERIES_COUNT
            );

        return rows.length >= 2
          ? rows
          : null;
      } catch (_) {
        return null;
      }
    }

    function combineMedicareWithClinicalSupply(
      medicareData,
      clinicianRows
    ) {
      const clinicianByYear =
        new Map(
          (
            clinicianRows ||
            []
          ).map(
            row => [
              row.year,
              row
            ]
          )
        );

      const rows =
        medicareData.rows
          .map(
            medicareRow => {
              const clinician =
                clinicianByYear.get(
                  medicareRow.year
                );

              if (!clinician) {
                return null;
              }

              let activeClinicians =
                0;

              let cliniciansWithHours =
                0;

              let availableClinicalHoursWeek =
                0;

              for (
                let index = 0;
                index <
                  RAW_CLINICIAN_SERIES_COUNT;
                index += 1
              ) {
                const count =
                  finiteNumber(
                    clinician
                      .counts?.[
                        index
                      ]
                  );

                const hours =
                  finiteNumber(
                    clinician
                      .hours?.[
                        index
                      ]
                  );

                if (
                  Number.isFinite(
                    count
                  ) &&
                  count >= 0
                ) {
                  activeClinicians +=
                    count;
                }

                if (
                  Number.isFinite(
                    count
                  ) &&
                  count >= 0 &&
                  Number.isFinite(
                    hours
                  ) &&
                  hours >= 0
                ) {
                  cliniciansWithHours +=
                    count;

                  availableClinicalHoursWeek +=
                    count *
                    hours;
                }
              }

              if (
                activeClinicians <= 0 ||
                availableClinicalHoursWeek <= 0
              ) {
                return null;
              }

              return {
                ...medicareRow,
                activeClinicians,
                cliniciansWithHours,
                availableClinicalHoursWeek,
                availableClinicalHoursAnnual:
                  availableClinicalHoursWeek *
                  52
              };
            }
          )
          .filter(Boolean);

      return {
        items:
          medicareData.items,
        rows
      };
    }

    function saveLocalCache(
      data
    ) {
      try {
        localStorage.setItem(
          LOCAL_CACHE_KEY,
          JSON.stringify({
            savedAt:
              Date.now(),
            data
          })
        );
      } catch (_) {
        // Cache is optional.
      }
    }

    function readLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            LOCAL_CACHE_KEY
          );

        if (!raw) {
          return null;
        }

        const parsed =
          JSON.parse(raw);

        return validSourceData(
          parsed?.data
        )
          ? parsed.data
          : null;
      } catch (_) {
        return null;
      }
    }

    function setDataSource(
      source
    ) {
      const live =
        source === 'live';

      dataSourceIndicator
        .classList.toggle(
          'is-cached',
          !live
        );

      const label =
        live
          ? 'Live data'
          : source === 'cached'
            ? 'Cached data'
            : 'Snapshot data';

      dataSourceIndicator
        .setAttribute(
          'aria-label',
          label
        );

      dataSourceText.textContent =
        live
          ? 'LIVE data'
          : source === 'cached'
            ? 'CACHED data'
            : 'SNAPSHOT data';
    }

    async function loadData() {
      try {
        const [
          medicareResult,
          clinicianResult
        ] =
          await Promise.allSettled([
            loadGVizSheet(
              MEDICARE_SHEET,
              MEDICARE_DATA_RANGE,
              '1'
            ),
            loadGVizSheet(
              CLINICIAN_SHEET,
              CLINICIAN_RANGE,
              '2'
            )
          ]);

        if (
          medicareResult.status !==
            'fulfilled'
        ) {
          throw medicareResult.reason ||
            new Error(
              'Could not load Medicare billings.'
            );
        }

        let itemSchema =
          EMBEDDED_FALLBACK
            .items
            .map(item => ({
              ...item
            }));

        const [
          itemResult,
          hoursResult
        ] =
          await Promise.allSettled([
            loadGVizSheet(
              MEDICARE_SHEET,
              MEDICARE_ITEM_RANGE,
              '0'
            ),
            loadGVizSheet(
              MEDICARE_SHEET,
              MEDICARE_HOURS_RANGE,
              '0'
            )
          ]);

        if (
          itemResult.status ===
            'fulfilled' &&
          hoursResult.status ===
            'fulfilled'
        ) {
          const liveMetadata =
            parseMetadataRows(
              itemResult.value,
              hoursResult.value
            );

          if (
            liveMetadata.length ===
            EMBEDDED_FALLBACK
              .items.length
          ) {
            itemSchema =
              liveMetadata;
          }
        }

        const medicareData =
          parseMedicareDataTable(
            medicareResult.value,
            itemSchema
          );

        let clinicianRows =
          clinicianResult.status ===
            'fulfilled'
            ? parseClinicianTable(
                clinicianResult.value
              )
            : null;

        let clinicianFromCache =
          false;

        if (
          !Array.isArray(
            clinicianRows
          ) ||
          clinicianRows.length < 2
        ) {
          clinicianRows =
            clinicianRowsFromCoverageCache();

          clinicianFromCache =
            Array.isArray(
              clinicianRows
            ) &&
            clinicianRows.length >= 2;
        }

        if (
          !Array.isArray(
            clinicianRows
          ) ||
          clinicianRows.length < 2
        ) {
          throw new Error(
            'Raw clinical-hours supply data were unavailable.'
          );
        }

        const liveData =
          combineMedicareWithClinicalSupply(
            medicareData,
            clinicianRows
          );

        if (
          !validSourceData(
            liveData
          ) ||
          liveData.rows.length < 2
        ) {
          throw new Error(
            'No common Medicare and clinical-hours years were available.'
          );
        }

        saveLocalCache(
          liveData
        );

        setDataSource(
          clinicianFromCache
            ? 'cached'
            : 'live'
        );

        statusElement.textContent =
          '';

        return liveData;
      } catch (error) {
        const cached =
          readLocalCache();

        statusElement.textContent =
          '';

        if (
          validSourceData(
            cached
          ) &&
          cached.rows.every(
            row =>
              Number.isFinite(
                row?.activeClinicians
              ) &&
              Number.isFinite(
                row?.availableClinicalHoursWeek
              )
          )
        ) {
          setDataSource(
            'cached'
          );

          return cached;
        }

        const clinicianRows =
          clinicianRowsFromCoverageCache();

        if (
          Array.isArray(
            clinicianRows
          ) &&
          clinicianRows.length >= 2
        ) {
          const fallback =
            combineMedicareWithClinicalSupply(
              cloneData(
                EMBEDDED_FALLBACK
              ),
              clinicianRows
            );

          if (
            validSourceData(
              fallback
            ) &&
            fallback.rows.length >= 2
          ) {
            setDataSource(
              'cached'
            );

            return fallback;
          }
        }

        throw error;
      }
    }

    // ============================================================
    // SERIES + METRICS
    // ============================================================

    function itemIndexFor(
      itemNumber
    ) {
      return sourceData.items
        .findIndex(
          item =>
            item.item ===
            itemNumber
        );
    }

    function itemMetaFor(
      itemNumber
    ) {
      return sourceData.items
        .find(
          item =>
            item.item ===
            itemNumber
        ) || null;
    }

    function rawItemCount(
      row,
      itemIndex
    ) {
      const value =
        row?.totals?.[
          itemIndex
        ];

      return finiteNumber(
        value
      );
    }

    function totalServices(
      row
    ) {
      let total =
        0;

      let found =
        false;

      sourceData.items
        .forEach(
          (
            _item,
            itemIndex
          ) => {
            const count =
              rawItemCount(
                row,
                itemIndex
              );

            if (
              Number.isFinite(
                count
              )
            ) {
              total +=
                count;

              found =
                true;
            }
          }
        );

      return found
        ? total
        : null;
    }

    function totalMedicareHours(
      row
    ) {
      let total =
        0;

      let found =
        false;

      sourceData.items
        .forEach(
          (
            item,
            itemIndex
          ) => {
            const count =
              rawItemCount(
                row,
                itemIndex
              );

            const hours =
              finiteNumber(
                item.hours
              );

            if (
              Number.isFinite(
                count
              ) &&
              Number.isFinite(
                hours
              )
            ) {
              total +=
                count *
                hours;

              found =
                true;
            }
          }
        );

      return found
        ? total
        : null;
    }

    function itemServicesMetric(
      row,
      itemNumber
    ) {
      const index =
        itemIndexFor(
          itemNumber
        );

      if (
        index < 0
      ) {
        return null;
      }

      const count =
        rawItemCount(
          row,
          index
        );

      return Number.isFinite(
        count
      )
        ? count
        : null;
    }

    function itemHoursMetric(
      row,
      itemNumber
    ) {
      const count =
        itemServicesMetric(
          row,
          itemNumber
        );

      const hours =
        finiteNumber(
          itemMetaFor(
            itemNumber
          )?.hours
        );

      return (
        Number.isFinite(
          count
        ) &&
        Number.isFinite(
          hours
        )
      )
        ? count *
          hours
        : null;
    }

    function displayMetric(
      row,
      seriesKey
    ) {
      if (
        activeView ===
        'services'
      ) {
        const services =
          seriesKey ===
            ALL_SERIES_KEY
            ? totalServices(
                row
              )
            : itemServicesMetric(
                row,
                seriesKey
              );

        const availableClinicalHoursWeek =
          finiteNumber(
            row?.availableClinicalHoursWeek
          );

        const clinicalFTE =
          Number.isFinite(
            availableClinicalHoursWeek
          )
            ? availableClinicalHoursWeek /
              FULL_TIME_CLINICAL_HOURS
            : null;

        if (
          !Number.isFinite(
            services
          ) ||
          !Number.isFinite(
            clinicalFTE
          ) ||
          clinicalFTE <= 0
        ) {
          return null;
        }

        return services /
          clinicalFTE /
          52;
      }

      const medicareHours =
        seriesKey ===
          ALL_SERIES_KEY
          ? totalMedicareHours(
              row
            )
          : itemHoursMetric(
              row,
              seriesKey
            );

      const clinicalHours =
        finiteNumber(
          row
            ?.availableClinicalHoursAnnual
        );

      if (
        !Number.isFinite(
          medicareHours
        ) ||
        !Number.isFinite(
          clinicalHours
        ) ||
        clinicalHours <= 0
      ) {
        return null;
      }

      return medicareHours /
        clinicalHours *
        100;
    }

    function itemSeriesKeys() {
      return sourceData.items
        .map(
          item =>
            item.item
        );
    }

    function selectableKeysForMode() {
      return [
        ALL_SERIES_KEY,
        ...itemSeriesKeys()
      ];
    }

    function selectedKeys() {
      const ordered =
        [];

      if (
        selectedSeries.has(
          ALL_SERIES_KEY
        )
      ) {
        ordered.push(
          ALL_SERIES_KEY
        );
      }

      sourceData.items
        .forEach(
          item => {
            if (
              selectedSeries.has(
                item.item
              )
            ) {
              ordered.push(
                item.item
              );
            }
          }
        );

      return ordered;
    }

    function visibleSelectedKeys() {
      return selectedKeys();
    }

    function allSelectableSelected() {
      const selectable =
        selectableKeysForMode();

      return (
        selectable.length > 0 &&
        selectable.every(
          key =>
            selectedSeries.has(
              key
            )
        )
      );
    }

    function someSelectableSelected() {
      return selectableKeysForMode()
        .some(
          key =>
            selectedSeries.has(
              key
            )
        );
    }

    function toggleAllSelectable() {
      const selectable =
        selectableKeysForMode();

      const next =
        new Set(
          selectedSeries
        );

      const shouldClear =
        selectable.length > 0 &&
        selectable.every(
          key =>
            next.has(
              key
            )
        );

      selectable.forEach(
        key => {
          if (
            shouldClear
          ) {
            next.delete(
              key
            );
          } else {
            next.add(
              key
            );
          }
        }
      );

      selectedSeries =
        next;

      updateItemButtonText();
      syncItemMenuSelection();
      renderChartChange(
        true,
        true,
        'selection'
      );
    }

    function seriesLabel(
      key
    ) {
      return key ===
        ALL_SERIES_KEY
        ? 'Total Medicare'
        : key;
    }

    function seriesColour(
      key
    ) {
      if (
        key ===
        ALL_SERIES_KEY
      ) {
        return ALL_SERIES_COLOUR;
      }

      return (
        ITEM_COLOUR_MAP[
          key
        ] ||
        itemMetaFor(key)
          ?.colour ||
        '#69718a'
      );
    }

    function currentRows() {
      return sourceData.rows;
    }

    function yearRatio(
      year
    ) {
      const rows =
        currentRows();

      if (!rows.length) {
        return NaN;
      }

      const first =
        rows[0].year;

      const last =
        rows[
          rows.length - 1
        ].year;

      return last > first
        ? (
            year -
            first
          ) /
          (
            last -
            first
          )
        : 0.5;
    }

    function buildSeriesData(
      key
    ) {
      return currentRows()
        .map(row => ({
          x:
            yearRatio(
              row.year
            ),
          y:
            displayMetric(
              row,
              key
            ),
          year:
            row.year
        }));
    }

    function allDatasetKeys() {
      return [
        ALL_SERIES_KEY,
        ...itemSeriesKeys()
      ];
    }

    function datasetVisible(
      key
    ) {
      return selectedSeries.has(
        key
      );
    }

    function datasetModel(
      key
    ) {
      const colour =
        seriesColour(
          key
        );

      const longConsult =
        isLongConsultItem(
          key
        );

      const shortConsult =
        isShortConsultItem(
          key
        );

      return {
        label:
          seriesLabel(key),
        seriesKey:
          key,
        data:
          buildSeriesData(
            key
          ),
        parsing:
          false,
        hidden:
          !datasetVisible(
            key
          ),
        borderColor:
          colour,
        backgroundColor:
          colour,
        pointBackgroundColor:
          colour,
        pointBorderColor:
          '#ffffff',
        borderWidth:
          key ===
          ALL_SERIES_KEY
            ? 2.8
            : longConsult
              ? 2.45
              : 1.9,
        borderDash:
          shortConsult
            ? [
                8,
                4
              ]
            : [],
        borderDashOffset:
          0,
        borderCapStyle:
          'round',
        borderJoinStyle:
          'round',
        pointRadius:
          0,
        pointHoverRadius:
          4,
        pointHitRadius:
          5,
        pointBorderWidth:
          1,
        tension:
          0.28,
        cubicInterpolationMode:
          'monotone',
        spanGaps:
          false,
        fill:
          false
      };
    }

    function buildDatasets() {
      return allDatasetKeys()
        .map(
          datasetModel
        );
    }

    function syncChartDatasets() {
      if (!chart) {
        return;
      }

      const existing =
        new Map(
          chart.data.datasets
            .map(
              dataset => [
                dataset.seriesKey,
                dataset
              ]
            )
        );

      chart.data.datasets =
        allDatasetKeys()
          .map(key => {
            const model =
              datasetModel(
                key
              );

            const dataset =
              existing.get(
                key
              );

            if (!dataset) {
              return model;
            }

            /*
             * Retain the same dataset object so Chart.js can interpolate
             * its existing point geometry to the new y-values instead of
             * treating the line as a newly inserted series.
             */
            dataset.label =
              model.label;

            dataset.data =
              model.data;

            dataset.hidden =
              model.hidden;

            dataset.borderColor =
              model.borderColor;

            dataset.backgroundColor =
              model.backgroundColor;

            dataset.pointBackgroundColor =
              model.pointBackgroundColor;

            dataset.pointBorderColor =
              model.pointBorderColor;

            dataset.borderWidth =
              model.borderWidth;

            dataset.borderDash =
              model.borderDash;

            dataset.borderDashOffset =
              model.borderDashOffset;

            dataset.borderCapStyle =
              model.borderCapStyle;

            dataset.borderJoinStyle =
              model.borderJoinStyle;

            dataset.pointRadius =
              model.pointRadius;

            dataset.pointHoverRadius =
              model.pointHoverRadius;

            dataset.pointHitRadius =
              model.pointHitRadius;

            dataset.pointBorderWidth =
              model.pointBorderWidth;

            dataset.tension =
              model.tension;

            dataset.cubicInterpolationMode =
              model.cubicInterpolationMode;

            dataset.spanGaps =
              model.spanGaps;

            dataset.fill =
              model.fill;

            dataset.parsing =
              false;

            return dataset;
          });
    }

    // ============================================================
    // P.A. TREND
    // ============================================================

    function latestAnnualisedGrowth(
      key
    ) {
      const recent =
        currentRows()
          .map(row => ({
            year:
              row.year,
            value:
              displayMetric(
                row,
                key
              )
          }))
          .filter(
            point =>
              Number.isFinite(
                point.value
              ) &&
              point.value > 0
          )
          .slice(-3);

      if (
        recent.length < 2
      ) {
        return NaN;
      }

      const points =
        recent.map(
          point => ({
            x:
              point.year,
            y:
              Math.log(
                point.value
              )
          })
        );

      const meanX =
        points.reduce(
          (
            sum,
            point
          ) =>
            sum +
            point.x,
          0
        ) /
        points.length;

      const meanY =
        points.reduce(
          (
            sum,
            point
          ) =>
            sum +
            point.y,
          0
        ) /
        points.length;

      let numerator =
        0;

      let denominator =
        0;

      points.forEach(
        point => {
          const dx =
            point.x -
            meanX;

          numerator +=
            dx *
            (
              point.y -
              meanY
            );

          denominator +=
            dx *
            dx;
        }
      );

      if (
        denominator <= 0
      ) {
        return NaN;
      }

      const slope =
        numerator /
        denominator;

      return (
        Math.exp(slope) -
        1
      ) * 100;
    }

    // ============================================================
    // DYNAMIC PFF-STYLE Y AXIS
    // ============================================================

    function niceNumber(
      value,
      round
    ) {
      if (
        !Number.isFinite(value) ||
        value <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(
            value
          )
        );

      const fraction =
        value /
        Math.pow(
          10,
          exponent
        );

      let niceFraction;

      if (round) {
        if (
          fraction < 1.5
        ) {
          niceFraction = 1;
        } else if (
          fraction < 3
        ) {
          niceFraction = 2;
        } else if (
          fraction < 7
        ) {
          niceFraction = 5;
        } else {
          niceFraction = 10;
        }
      } else {
        if (
          fraction <= 1
        ) {
          niceFraction = 1;
        } else if (
          fraction <= 2
        ) {
          niceFraction = 2;
        } else if (
          fraction <= 5
        ) {
          niceFraction = 5;
        } else {
          niceFraction = 10;
        }
      }

      return (
        niceFraction *
        Math.pow(
          10,
          exponent
        )
      );
    }

    function computeScale() {
      const values =
        [];

      visibleSelectedKeys()
        .forEach(key => {
          currentRows()
            .forEach(row => {
              const value =
                displayMetric(
                  row,
                  key
                );

              if (
                Number.isFinite(
                  value
                ) &&
                value >= 0
              ) {
                values.push(
                  value
                );
              }
            });
        });

      const maximum =
        values.length
          ? Math.max(...values)
          : 5;

      const roughStep =
        Math.max(
          maximum / 5,
          Number.EPSILON
        );

      const step =
        niceNumber(
          roughStep,
          true
        );

      let max =
        Math.ceil(
          maximum /
          step
        ) *
        step;

      if (
        max <= maximum
      ) {
        max += step;
      }

      if (
        max <= 0
      ) {
        max = step * 5;
      }

      let finalStep =
        niceNumber(
          max / 5,
          true
        );

      max =
        Math.ceil(
          maximum /
          finalStep
        ) *
        finalStep;

      while (
        max /
        finalStep < 4
      ) {
        max +=
          finalStep;
      }

      return {
        min: 0,
        max,
        step:
          finalStep
      };
    }

    function copyScale(
      scale
    ) {
      const minimum =
        Number(
          scale?.min
        );

      const maximum =
        Number(
          scale?.max
        );

      const stepValue =
        Number(
          scale?.step
        );

      const min =
        Number.isFinite(
          minimum
        )
          ? minimum
          : 0;

      const max =
        Number.isFinite(
          maximum
        ) &&
        maximum > min
          ? maximum
          : min + 1;

      const intervals =
        Math.max(
          1,
          Math.round(
            Number.isFinite(
              stepValue
            ) &&
            stepValue > 0
              ? (
                  max -
                  min
                ) /
                stepValue
              : 5
          )
        );

      return {
        min,
        max,
        intervals,
        step:
          (
            max -
            min
          ) /
          intervals
      };
    }

    function scalesNearlyEqual(
      first,
      second,
      tolerance = 1e-9
    ) {
      if (
        !first ||
        !second
      ) {
        return false;
      }

      const a =
        copyScale(
          first
        );

      const b =
        copyScale(
          second
        );

      return (
        Math.abs(
          a.min -
          b.min
        ) <= tolerance &&
        Math.abs(
          a.max -
          b.max
        ) <= tolerance &&
        a.intervals ===
          b.intervals
      );
    }

    function yTickTargets(
      scale =
        currentScale
    ) {
      const current =
        copyScale(
          scale
        );

      return Array.from(
        {
          length:
            current.intervals +
            1
        },
        (
          _,
          index
        ) =>
          current.min +
          current.step *
          index
      );
    }

    function yTickRatios(
      scale =
        currentScale
    ) {
      const current =
        copyScale(
          scale
        );

      return Array.from(
        {
          length:
            current.intervals +
            1
        },
        (
          _,
          index
        ) =>
          index /
          current.intervals
      );
    }

    function setYAxisTickValuesImmediately(
      scale =
        currentScale
    ) {
      if (
        yAxisTickAnimation.raf
      ) {
        cancelAnimationFrame(
          yAxisTickAnimation.raf
        );

        yAxisTickAnimation.raf =
          null;
      }

      ++yAxisTickAnimation.token;

      yAxisTickAnimation.values =
        yTickTargets(
          scale
        );

      yAxisTickAnimation.ratios =
        yTickRatios(
          scale
        );
    }

    function mapCurrentValuesToTargetCount(
      currentValues,
      targetValues
    ) {
      if (
        !currentValues.length
      ) {
        return [
          ...targetValues
        ];
      }

      return Array.from(
        {
          length:
            targetValues.length
        },
        (
          _,
          index
        ) => {
          if (
            targetValues.length ===
            1
          ) {
            return Number(
              currentValues[0]
            );
          }

          const sourcePosition =
            index *
            (
              currentValues.length -
              1
            ) /
            (
              targetValues.length -
              1
            );

          const lowerIndex =
            Math.floor(
              sourcePosition
            );

          const upperIndex =
            Math.min(
              currentValues.length -
                1,
              Math.ceil(
                sourcePosition
              )
            );

          const lower =
            Number(
              currentValues[
                lowerIndex
              ]
            );

          const upper =
            Number(
              currentValues[
                upperIndex
              ]
            );

          if (
            !Number.isFinite(
              lower
            )
          ) {
            return Number.isFinite(
              upper
            )
              ? upper
              : Number(
                  targetValues[
                    index
                  ]
                );
          }

          if (
            !Number.isFinite(
              upper
            ) ||
            upperIndex ===
              lowerIndex
          ) {
            return lower;
          }

          const fraction =
            sourcePosition -
            lowerIndex;

          return lower +
            (
              upper -
              lower
            ) *
            fraction;
        }
      );
    }

    function mapCurrentRatiosToTargetCount(
      currentRatios,
      targetRatios
    ) {
      if (
        !currentRatios.length
      ) {
        return [
          ...targetRatios
        ];
      }

      /*
       * Use nearest existing tick positions rather than interpolating them
       * immediately onto the target grid. This preserves the visible PFF
       * "slide" when the number of Y-axis intervals changes.
       */
      return targetRatios.map(
        (
          _targetRatio,
          index
        ) => {
          if (
            targetRatios.length ===
            1
          ) {
            return Number(
              currentRatios[0]
            ) || 0;
          }

          const sourceIndex =
            Math.round(
              index *
              (
                currentRatios.length -
                1
              ) /
              (
                targetRatios.length -
                1
              )
            );

          const ratio =
            Number(
              currentRatios[
                Math.min(
                  currentRatios.length -
                    1,
                  Math.max(
                    0,
                    sourceIndex
                  )
                )
              ]
            );

          return Number.isFinite(
            ratio
          )
            ? ratio
            : targetRatios[
                index
              ];
        }
      );
    }

    function animateYAxisTickValues(
      targets,
      duration = 720,
      targetScale =
        currentScale
    ) {
      const targetValues =
        Array.from(
          targets || []
        );

      const targetRatios =
        yTickRatios(
          targetScale
        );

      if (
        !targetValues.length ||
        !targetRatios.length
      ) {
        return;
      }

      if (
        yAxisTickAnimation.raf
      ) {
        cancelAnimationFrame(
          yAxisTickAnimation.raf
        );

        yAxisTickAnimation.raf =
          null;
      }

      const token =
        ++yAxisTickAnimation.token;

      const currentValues =
        Array.from(
          yAxisTickAnimation.values ||
          []
        );

      const currentRatios =
        Array.from(
          yAxisTickAnimation.ratios ||
          []
        );

      const startValues =
        mapCurrentValuesToTargetCount(
          currentValues,
          targetValues
        );

      const startRatios =
        mapCurrentRatiosToTargetCount(
          currentRatios,
          targetRatios
        );

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        yAxisTickAnimation.values =
          [
            ...targetValues
          ];

        yAxisTickAnimation.ratios =
          [
            ...targetRatios
          ];

        chart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (
          token !==
          yAxisTickAnimation.token
        ) {
          return;
        }

        const progress =
          clamp(
            (
              now -
              startedAt
            ) /
              duration,
            0,
            1
          );

        const eased =
          easeOutCubic(
            progress
          );

        yAxisTickAnimation.values =
          targetValues.map(
            (
              target,
              index
            ) => {
              const start =
                Number(
                  startValues[
                    index
                  ]
                );

              return Number.isFinite(
                start
              )
                ? start +
                    (
                      target -
                      start
                    ) *
                    eased
                : target;
            }
          );

        yAxisTickAnimation.ratios =
          targetRatios.map(
            (
              target,
              index
            ) => {
              const start =
                Number(
                  startRatios[
                    index
                  ]
                );

              return Number.isFinite(
                start
              )
                ? start +
                    (
                      target -
                      start
                    ) *
                    eased
                : target;
            }
          );

        chart?.draw();

        if (
          progress < 1
        ) {
          yAxisTickAnimation.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          yAxisTickAnimation.raf =
            null;

          yAxisTickAnimation.values =
            [
              ...targetValues
            ];

          yAxisTickAnimation.ratios =
            [
              ...targetRatios
            ];

          chart?.draw();
        }
      }

      yAxisTickAnimation.raf =
        requestAnimationFrame(
          frame
        );
    }

    function setYAxisTitleImmediately(
      text =
        yAxisTitle()
    ) {
      const value =
        String(
          text || ''
        );

      if (
        yAxisTitleAnimation.raf
      ) {
        cancelAnimationFrame(
          yAxisTitleAnimation.raf
        );

        yAxisTitleAnimation.raf =
          null;
      }

      ++yAxisTitleAnimation.token;

      yAxisTitleAnimation.from =
        value;

      yAxisTitleAnimation.to =
        value;

      yAxisTitleAnimation.progress =
        1;
    }

    function animateYAxisTitle(
      nextText,
      duration = 420
    ) {
      const target =
        String(
          nextText || ''
        );

      const current =
        yAxisTitleAnimation.progress <
          0.5
          ? yAxisTitleAnimation.from
          : yAxisTitleAnimation.to;

      if (
        current === target
      ) {
        setYAxisTitleImmediately(
          target
        );
        return;
      }

      if (
        yAxisTitleAnimation.raf
      ) {
        cancelAnimationFrame(
          yAxisTitleAnimation.raf
        );

        yAxisTitleAnimation.raf =
          null;
      }

      const token =
        ++yAxisTitleAnimation.token;

      yAxisTitleAnimation.from =
        current;

      yAxisTitleAnimation.to =
        target;

      yAxisTitleAnimation.progress =
        0;

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        setYAxisTitleImmediately(
          target
        );

        chart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (
          token !==
          yAxisTitleAnimation.token
        ) {
          return;
        }

        const progress =
          clamp(
            (
              now -
              startedAt
            ) /
              duration,
            0,
            1
          );

        yAxisTitleAnimation.progress =
          easeOutCubic(
            progress
          );

        chart?.draw();

        if (
          progress < 1
        ) {
          yAxisTitleAnimation.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          yAxisTitleAnimation.raf =
            null;

          setYAxisTitleImmediately(
            target
          );

          chart?.draw();
        }
      }

      yAxisTitleAnimation.raf =
        requestAnimationFrame(
          frame
        );
    }

    function drawYAxisTitle(
      context,
      chartArea
    ) {
      const mobile =
        window.innerWidth <=
        430;

      const progress =
        clamp(
          yAxisTitleAnimation.progress,
          0,
          1
        );

      /*
       * Exact fade profile used in the latest pasted workforce chart:
       * the outgoing title disappears first, then the incoming title
       * completes the cross-fade. No positional slide is applied.
       */
      const outgoingOpacity =
        clamp(
          1 -
            progress *
            2.2,
          0,
          1
        );

      const incomingOpacity =
        clamp(
          (
            progress -
            0.32
          ) /
            0.68,
          0,
          1
        );

      const x =
        Math.max(
          mobile
            ? 10
            : 11,
          chartArea.left -
            (
              mobile
                ? 53
                : 59
            )
        );

      const y =
        chartArea.top +
        chartArea.height /
          2;

      const draw = (
        text,
        opacity
      ) => {
        if (
          !text ||
          opacity <= 0
        ) {
          return;
        }

        context.save();

        context.globalAlpha =
          opacity;

        context.translate(
          x,
          y
        );

        context.rotate(
          -Math.PI /
          2
        );

        context.fillStyle =
          '#151515';

        context.textAlign =
          'center';

        context.textBaseline =
          'middle';

        context.font =
          `700 ${mobile ? 12 : 13}px Lato, sans-serif`;

        context.fillText(
          text,
          0,
          0
        );

        context.restore();
      };

      if (
        yAxisTitleAnimation.from ===
          yAxisTitleAnimation.to ||
        progress >= 1
      ) {
        draw(
          yAxisTitleAnimation.to,
          1
        );

        return;
      }

      draw(
        yAxisTitleAnimation.from,
        outgoingOpacity
      );

      draw(
        yAxisTitleAnimation.to,
        incomingOpacity
      );
    }

    // ============================================================
    // PFF X AXIS YEAR TRACKS
    // ============================================================

    function isCompactYearRange(
      rows
    ) {
      if (
        !rows?.length
      ) {
        return false;
      }

      const first =
        Number(
          rows[0].year
        );

      const last =
        Number(
          rows[
            rows.length - 1
          ].year
        );

      return (
        Number.isFinite(
          first
        ) &&
        Number.isFinite(
          last
        ) &&
        last - first <= 5
      );
    }

    function shouldLabelYear(
      year,
      rows
    ) {
      if (
        isCompactYearRange(
          rows
        )
      ) {
        return true;
      }

      return (
        Number.isFinite(
          Number(year)
        ) &&
        Number(year) % 2 === 0
      );
    }

    function shouldMajorYear(
      year
    ) {
      return (
        Number.isFinite(
          Number(year)
        ) &&
        Number(year) % 2 === 0
      );
    }

    function currentXAxisTracks() {
      const rows =
        currentRows();

      return rows.map(
        row => ({
          year:
            row.year,
          ratio:
            yearRatio(
              row.year
            ),
          alpha:
            1,
          labelAlpha:
            shouldLabelYear(
              row.year,
              rows
            )
              ? 1
              : 0,
          majorAlpha:
            shouldMajorYear(
              row.year
            )
              ? 1
              : 0
        })
      );
    }

    // ============================================================
    // CUSTOM PFF CHART PLUGINS
    // ============================================================

    const pffAxesPlugin = {
      id:
        'pffAxesPlugin',

      beforeDatasetsDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const scale =
          copyScale(
            currentScale
          );

        const intervals =
          scale.intervals;

        const ratios =
          yAxisTickAnimation
            .ratios.length ===
            intervals + 1
            ? yAxisTickAnimation
                .ratios
            : yTickRatios(
                scale
              );

        ctx.save();

        // Minor horizontal guides slide halfway between animated major ticks.
        ctx.strokeStyle =
          'rgba(105, 113, 138, 0.035)';

        ctx.lineWidth =
          0.7;

        for (
          let index = 0;
          index < intervals;
          index += 1
        ) {
          const ratio =
            (
              Number(
                ratios[
                  index
                ]
              ) +
              Number(
                ratios[
                  index + 1
                ]
              )
            ) /
            2;

          const y =
            chartArea.bottom -
            chartArea.height *
              ratio;

          ctx.beginPath();

          ctx.moveTo(
            chartArea.left,
            Math.round(
              y
            ) +
            0.5
          );

          ctx.lineTo(
            chartArea.right,
            Math.round(
              y
            ) +
            0.5
          );

          ctx.stroke();
        }

        // Major guides move on the same clock as the labels/tick marks.
        ctx.strokeStyle =
          'rgba(105, 113, 138, 0.075)';

        ctx.lineWidth =
          1;

        for (
          let index = 0;
          index <= intervals;
          index += 1
        ) {
          const ratio =
            Number(
              ratios[
                index
              ]
            );

          const y =
            chartArea.bottom -
            chartArea.height *
              ratio;

          ctx.beginPath();

          ctx.moveTo(
            chartArea.left,
            Math.round(
              y
            ) +
            0.5
          );

          ctx.lineTo(
            chartArea.right,
            Math.round(
              y
            ) +
            0.5
          );

          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const scale =
          copyScale(
            currentScale
          );

        const intervals =
          scale.intervals;

        const mobile =
          window.innerWidth <=
          430;

        const values =
          yAxisTickAnimation
            .values.length ===
            intervals + 1
            ? yAxisTickAnimation
                .values
            : yTickTargets(
                scale
              );

        const ratios =
          yAxisTickAnimation
            .ratios.length ===
            intervals + 1
            ? yAxisTickAnimation
                .ratios
            : yTickRatios(
                scale
              );

        const xTracks =
          currentXAxisTracks();

        ctx.save();

        ctx.lineCap =
          'butt';

        // Major Y ticks and smoothly counting labels stay in fixed positions.
        ctx.strokeStyle =
          '#151515';

        ctx.lineWidth =
          1;

        ctx.fillStyle =
          '#151515';

        ctx.textAlign =
          'right';

        ctx.textBaseline =
          'middle';

        ctx.font =
          `${mobile ? 9 : 10}px Lato, sans-serif`;

        for (
          let index = 0;
          index <= intervals;
          index += 1
        ) {
          const ratio =
            Number(
              ratios[
                index
              ]
            );

          const y =
            chartArea.bottom -
            chartArea.height *
              ratio;

          ctx.beginPath();

          ctx.moveTo(
            chartArea.left,
            Math.round(
              y
            ) +
            0.5
          );

          ctx.lineTo(
            chartArea.left -
            5,
            Math.round(
              y
            ) +
            0.5
          );

          ctx.stroke();

          const value =
            Number(
              values[
                index
              ]
            );

          ctx.fillText(
            formatAxisValue(
              Number.isFinite(
                value
              )
                ? value
                : scale.min +
                    scale.step *
                    index
            ),
            chartArea.left -
            8,
            y
          );
        }

        // Minor Y ticks.
        ctx.strokeStyle =
          '#69718a';

        ctx.globalAlpha =
          0.60;

        ctx.lineWidth =
          1;

        for (
          let index = 0;
          index < intervals;
          index += 1
        ) {
          const ratio =
            (
              Number(
                ratios[
                  index
                ]
              ) +
              Number(
                ratios[
                  index + 1
                ]
              )
            ) /
            2;

          const y =
            chartArea.bottom -
            chartArea.height *
              ratio;

          ctx.beginPath();

          ctx.moveTo(
            chartArea.left,
            Math.round(
              y
            ) +
            0.5
          );

          ctx.lineTo(
            chartArea.left -
            2,
            Math.round(
              y
            ) +
            0.5
          );

          ctx.stroke();
        }

        // X-axis years and tick positions never change in this module.
        ctx.globalAlpha =
          1;

        xTracks.forEach(
          track => {
            const x =
              chartArea.left +
              chartArea.width *
              track.ratio;

            const major =
              track.majorAlpha >
              0.5;

            ctx.save();

            ctx.strokeStyle =
              major
                ? '#151515'
                : '#69718a';

            ctx.globalAlpha =
              major
                ? 1
                : 0.60;

            ctx.lineWidth =
              major
                ? 1
                : 0.7;

            ctx.beginPath();

            ctx.moveTo(
              Math.round(
                x
              ) +
              0.5,
              chartArea.bottom
            );

            ctx.lineTo(
              Math.round(
                x
              ) +
              0.5,
              chartArea.bottom +
              (
                major
                  ? 5
                  : 2
              )
            );

            ctx.stroke();

            if (
              track.labelAlpha >
              0.02
            ) {
              ctx.globalAlpha =
                1;

              ctx.fillStyle =
                '#151515';

              ctx.font =
                `${mobile ? 9 : 10}px Lato, sans-serif`;

              ctx.textBaseline =
                'top';

              let labelX =
                x;

              if (
                track.ratio <=
                0.001
              ) {
                ctx.textAlign =
                  'left';

                labelX =
                  x + 2;
              } else if (
                track.ratio >=
                0.999
              ) {
                ctx.textAlign =
                  'right';

                labelX =
                  x - 2;
              } else {
                ctx.textAlign =
                  'center';
              }

              ctx.fillText(
                String(
                  track.year
                ),
                labelX,
                chartArea.bottom +
                8
              );
            }

            ctx.restore();
          }
        );

        ctx.restore();

        drawYAxisTitle(
          ctx,
          chartArea
        );
      }
    };

    /*
     * The chart-area spines themselves do not move between Medicare views,
     * so they remain completely static. Only markings/text whose values or
     * positions actually change are animated.
     */
    const axisSpinesPlugin = {
      id:
        'axisSpinesPlugin',

      afterDraw(
        chartInstance
      ) {
        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        ctx.save();

        ctx.strokeStyle =
          '#151515';

        ctx.lineWidth =
          1.1;

        ctx.beginPath();
        ctx.moveTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(
            chartArea.left
          ) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(
          chartArea.left,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.lineTo(
          chartArea.right,
          Math.round(
            chartArea.bottom
          ) + 0.5
        );
        ctx.stroke();

        ctx.restore();
      }
    };

    const paTrendLabelsPlugin = {
      id:
        'paTrendLabelsPlugin',

      afterDatasetsDraw(
        chartInstance
      ) {
        if (!yoyTrendOn) {
          return;
        }

        const {
          ctx,
          chartArea
        } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const mobile =
          window.innerWidth <=
          430;

        const fontSize =
          mobile
            ? 8.2
            : 9.1;

        const labelHeight =
          mobile
            ? 14
            : 15;

        const paddingX =
          mobile
            ? 4
            : 5;

        const arrowGap =
          mobile
            ? 2.5
            : 3;

        const items =
          [];

        function seriesTint(
          hex,
          strength = 0.20,
          alpha = 0.84
        ) {
          const cleaned =
            String(
              hex || '#69718a'
            )
              .replace('#', '')
              .trim();

          const value =
            Number.parseInt(
              cleaned,
              16
            );

          if (
            !Number.isFinite(
              value
            )
          ) {
            return `rgba(239,240,244,${alpha})`;
          }

          const red =
            (value >> 16) &
            255;

          const green =
            (value >> 8) &
            255;

          const blue =
            value &
            255;

          const mix =
            channel =>
              Math.round(
                255 +
                (
                  channel -
                  255
                ) *
                strength
              );

          return `rgba(${mix(red)},${mix(green)},${mix(blue)},${alpha})`;
        }

        ctx.save();

        ctx.font =
          `700 ${fontSize}px Lato, sans-serif`;

        ctx.textBaseline =
          'middle';

        chartInstance.data
          .datasets
          .forEach(
            (
              dataset,
              seriesIndex
            ) => {
              const meta =
                chartInstance
                  .getDatasetMeta(
                    seriesIndex
                  );

              if (
                !dataset ||
                !meta?.data?.length ||
                !chartInstance.isDatasetVisible(
                  seriesIndex
                )
              ) {
                return;
              }

              const growth =
                latestAnnualisedGrowth(
                  dataset.seriesKey
                );

              if (
                !Number.isFinite(
                  growth
                )
              ) {
                return;
              }

              let anchorIndex =
                -1;

              for (
                let index =
                  dataset.data.length -
                  1;
                index >= 0;
                index -= 1
              ) {
                if (
                  Number.isFinite(
                    dataset.data[
                      index
                    ]?.y
                  ) &&
                  Number.isFinite(
                    meta.data[
                      index
                    ]?.x
                  ) &&
                  Number.isFinite(
                    meta.data[
                      index
                    ]?.y
                  )
                ) {
                  anchorIndex =
                    index;

                  break;
                }
              }

              if (
                anchorIndex < 0
              ) {
                return;
              }

              const point =
                meta.data[
                  anchorIndex
                ];

              const isIncrease =
                growth >
                0.05;

              const isDecrease =
                growth <
                -0.05;

              const arrow =
                isIncrease
                  ? '↑'
                  : isDecrease
                    ? '↓'
                    : '';

              const valueText =
                `${Math.abs(growth).toFixed(1)}% p.a.`;

              const arrowWidth =
                arrow
                  ? ctx
                      .measureText(
                        arrow
                      )
                      .width
                  : 0;

              const valueWidth =
                ctx
                  .measureText(
                    valueText
                  )
                  .width;

              const labelWidth =
                paddingX * 2 +
                arrowWidth +
                (
                  arrow
                    ? arrowGap
                    : 0
                ) +
                valueWidth;

              items.push({
                seriesIndex,
                seriesColour:
                  dataset.borderColor,
                growth,
                isIncrease,
                isDecrease,
                arrow,
                valueText,
                arrowWidth,
                labelWidth,
                anchorX:
                  point.x,
                anchorY:
                  point.y
              });
            }
          );

        if (!items.length) {
          ctx.restore();
          return;
        }

        const placed =
          [];

        function overlaps(
          rectangle
        ) {
          const padding =
            6;

          return placed.some(
            existing =>
              !(
                rectangle.right +
                  padding <
                existing.left ||
                rectangle.left -
                  padding >
                existing.right ||
                rectangle.bottom +
                  padding <
                existing.top ||
                rectangle.top -
                  padding >
                existing.bottom
              )
          );
        }

        items
          .sort(
            (a, b) =>
              a.anchorY -
              b.anchorY
          )
          .forEach(
            (
              item,
              itemIndex
            ) => {
              const horizontalOffsets =
                [
                  0,
                  -68,
                  -136,
                  -34,
                  -102,
                  -170,
                  -204
                ];

              const verticalOffsets =
                [
                  0,
                  -2,
                  2,
                  -4,
                  4,
                  -6,
                  6,
                  -8,
                  8
                ];

              let chosen =
                null;

              for (
                const horizontalOffset
                of horizontalOffsets
              ) {
                for (
                  const verticalOffset
                  of verticalOffsets
                ) {
                  const proposedRight =
                    clamp(
                      chartArea.right -
                        4 +
                        horizontalOffset,
                      chartArea.left +
                        item.labelWidth +
                        5,
                      chartArea.right -
                        4
                    );

                  const proposedLeft =
                    proposedRight -
                    item.labelWidth;

                  const proposedY =
                    clamp(
                      item.anchorY +
                        verticalOffset,
                      chartArea.top +
                        labelHeight /
                        2,
                      chartArea.bottom -
                        labelHeight /
                        2
                    );

                  const rectangle = {
                    left:
                      proposedLeft,
                    right:
                      proposedRight,
                    top:
                      proposedY -
                      labelHeight /
                      2,
                    bottom:
                      proposedY +
                      labelHeight /
                      2,
                    y:
                      proposedY
                  };

                  if (
                    !overlaps(
                      rectangle
                    )
                  ) {
                    chosen =
                      rectangle;

                    break;
                  }
                }

                if (chosen) {
                  break;
                }
              }

              if (!chosen) {
                const right =
                  clamp(
                    chartArea.right -
                      4 -
                      (
                        itemIndex %
                        5
                      ) *
                      72,
                    chartArea.left +
                      item.labelWidth +
                      5,
                    chartArea.right -
                      4
                  );

                const y =
                  clamp(
                    item.anchorY +
                      (
                        itemIndex %
                        2 ===
                        0
                          ? -6
                          : 6
                      ),
                    chartArea.top +
                      labelHeight /
                      2,
                    chartArea.bottom -
                      labelHeight /
                      2
                  );

                chosen = {
                  left:
                    right -
                    item.labelWidth,
                  right,
                  top:
                    y -
                    labelHeight /
                    2,
                  bottom:
                    y +
                    labelHeight /
                    2,
                  y
                };
              }

              item.labelLeft =
                chosen.left;

              item.labelRight =
                chosen.right;

              item.labelY =
                chosen.y;

              placed.push(
                chosen
              );
            }
          );

        items.forEach(
          item => {
            const targetX =
              item.anchorX <
              item.labelLeft
                ? item.labelLeft
                : item.anchorX >
                  item.labelRight
                  ? item.labelRight
                  : clamp(
                      item.anchorX,
                      item.labelLeft,
                      item.labelRight
                    );

            const displaced =
              Math.abs(
                targetX -
                item.anchorX
              ) > 7 ||
              Math.abs(
                item.labelY -
                item.anchorY
              ) > 2 ||
              item.labelLeft <
                item.anchorX -
                4;

            if (!displaced) {
              return;
            }

            ctx.beginPath();
            ctx.moveTo(
              item.anchorX,
              item.anchorY
            );
            ctx.lineTo(
              targetX,
              item.labelY
            );
            ctx.strokeStyle =
              'rgba(105, 113, 138, 0.58)';
            ctx.lineWidth =
              0.8;
            ctx.stroke();
          }
        );

        items.forEach(
          item => {
            const fillColour =
              seriesTint(
                item.seriesColour,
                0.20,
                0.84
              );

            const directionColour =
              item.isIncrease
                ? '#14823b'
                : item.isDecrease
                  ? '#b42318'
                  : '#69718a';

            const radius =
              3;

            const top =
              item.labelY -
              labelHeight /
              2;

            const bottom =
              item.labelY +
              labelHeight /
              2;

            ctx.beginPath();
            ctx.moveTo(
              item.labelLeft +
              radius,
              top
            );
            ctx.lineTo(
              item.labelRight -
              radius,
              top
            );
            ctx.quadraticCurveTo(
              item.labelRight,
              top,
              item.labelRight,
              top +
              radius
            );
            ctx.lineTo(
              item.labelRight,
              bottom -
              radius
            );
            ctx.quadraticCurveTo(
              item.labelRight,
              bottom,
              item.labelRight -
              radius,
              bottom
            );
            ctx.lineTo(
              item.labelLeft +
              radius,
              bottom
            );
            ctx.quadraticCurveTo(
              item.labelLeft,
              bottom,
              item.labelLeft,
              bottom -
              radius
            );
            ctx.lineTo(
              item.labelLeft,
              top +
              radius
            );
            ctx.quadraticCurveTo(
              item.labelLeft,
              top,
              item.labelLeft +
              radius,
              top
            );
            ctx.closePath();

            ctx.fillStyle =
              fillColour;

            ctx.fill();

            ctx.strokeStyle =
              rgba(
                item.seriesColour,
                0.42
              );

            ctx.lineWidth =
              0.65;

            ctx.stroke();

            let textX =
              item.labelLeft +
              paddingX;

            ctx.textAlign =
              'left';

            ctx.fillStyle =
              directionColour;

            if (item.arrow) {
              ctx.fillText(
                item.arrow,
                textX,
                item.labelY -
                0.2
              );

              textX +=
                item.arrowWidth +
                arrowGap;
            }

            ctx.fillText(
              item.valueText,
              textX,
              item.labelY
            );
          }
        );

        ctx.restore();
      }
    };

    Chart.register(
      pffAxesPlugin,
      axisSpinesPlugin,
      paTrendLabelsPlugin
    );

    // ============================================================
    // ITEM MULTI-SELECT
    // ============================================================

    function updateItemButtonText() {
      const keys =
        visibleSelectedKeys();

      const selectable =
        selectableKeysForMode();

      const selectedVisibleCount =
        selectable.filter(
          key =>
            selectedSeries.has(
              key
            )
        ).length;

      if (
        selectable.length > 0 &&
        selectedVisibleCount ===
          selectable.length
      ) {
        itemButtonValue
          .textContent =
          'All selected';

        return;
      }

      if (
        !keys.length
      ) {
        itemButtonValue
          .textContent =
          'Select';

        return;
      }

      if (
        keys.length === 1 &&
        keys[0] ===
          ALL_SERIES_KEY
      ) {
        itemButtonValue
          .textContent =
          'Total';

        return;
      }

      const itemCount =
        keys.filter(
          key =>
            key !==
            ALL_SERIES_KEY
        ).length;

      const hasTotal =
        keys.includes(
          ALL_SERIES_KEY
        );

      if (
        itemCount === 1 &&
        !hasTotal
      ) {
        itemButtonValue
          .textContent =
          keys.find(
            key =>
              key !==
              ALL_SERIES_KEY
          ) ||
          'Select';

        return;
      }

      if (
        hasTotal &&
        itemCount > 0
      ) {
        itemButtonValue
          .textContent =
          `Total + ${itemCount}`;

        return;
      }

      itemButtonValue
        .textContent =
        `${itemCount} selected`;
    }
