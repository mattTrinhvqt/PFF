    function createChart() {
      currentScale =
        computeScale();

      setYAxisImmediately(
        currentScale
      );

      setYAxisTitleImmediately(
        viewConfig()
          .yTitle
      );

      chart =
        new Chart(
          canvas,
          {
            type:
              'line',

            data: {
              labels:
                combinedRows.map(
                  row =>
                    String(
                      row.year
                    )
                ),

              datasets: [
                datasetModel(0),
                datasetModel(1)
              ]
            },

            options:
              chartOptions()
          }
        );
    }

    function renderChartChange(
      reason =
        'tab'
    ) {
      if (
        !chart
      ) {
        return;
      }

      const config =
        viewConfig();

      const duration =
        chartAnimationDuration(
          reason
        );

      const previousTitle =
        yAxisTitleAnimation.progress <
          0.5
          ? yAxisTitleAnimation.from
          : yAxisTitleAnimation.to;

      const nextScale =
        computeScale();

      syncDatasets();

      currentScale =
        nextScale;

      chart.options.scales.y.min =
        nextScale.min;

      chart.options.scales.y.max =
        nextScale.max;

      chart.options.layout.padding.top =
        showTrend
          ? 11
          : 6;

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeOutQuart';

      chart.options.animations.x.duration =
        0;

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeOutQuart';

      chart.options.animations.colors.duration =
        duration;

      chart.update(
        duration > 0
          ? undefined
          : 'none'
      );

      animateYAxis(
        nextScale,
        duration
      );

      if (
        String(
          previousTitle ||
          ''
        ) !==
        String(
          config.yTitle ||
          ''
        )
      ) {
        animateYAxisTitle(
          config.yTitle,
          Math.min(
            duration,
            420
          )
        );
      }

      renderLegend(
        true
      );
    }

    chartTabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => {
            const next =
              tab.dataset.view;

            if (
              !next ||
              next ===
                activeView
            ) {
              return;
            }

            activeView =
              next;

            chartTabs.forEach(
              button => {
                const active =
                  button.dataset.view ===
                  activeView;

                button.classList.toggle(
                  'is-active',
                  active
                );

                button.setAttribute(
                  'aria-selected',
                  String(
                    active
                  )
                );
              }
            );

            updateTabIndicator(
              true
            );

            updateHeading(
              true
            );

            renderChartChange(
              'tab'
            );
          }
        );
      }
    );

    yoyTrendToggle.addEventListener(
      'click',
      () => {
        showTrend =
          !showTrend;

        yoyTrendToggle.classList.toggle(
          'is-on',
          showTrend
        );

        yoyTrendToggle.setAttribute(
          'aria-pressed',
          String(
            showTrend
          )
        );

        yoyTrendToggle.setAttribute(
          'aria-label',
          `Trend labels ${showTrend ? 'on' : 'off'}`
        );

        yoyToggleValue.textContent =
          showTrend
            ? 'ON'
            : 'OFF';

        if (
          chart
        ) {
          chart.options.layout.padding.top =
            showTrend
              ? 11
              : 6;

          chart.update(
            'none'
          );

          chart.draw();
        }
      }
    );

    function wireScrollButton(
      button,
      element,
      direction
    ) {
      button.addEventListener(
        'click',
        event => {
          event.stopPropagation();

          element.scrollBy({
            left:
              scrollAmount(
                element
              ) *
              direction,
            behavior:
              reducedMotion()
                ? 'auto'
                : 'smooth'
          });
        }
      );
    }

    wireScrollButton(
      tabScrollLeft,
      tabList,
      -1
    );

    wireScrollButton(
      tabScrollRight,
      tabList,
      1
    );

    wireScrollButton(
      headingScrollLeft,
      headingScrollViewport,
      -1
    );

    wireScrollButton(
      headingScrollRight,
      headingScrollViewport,
      1
    );

    wireScrollButton(
      legendScrollLeft,
      chartLegend,
      -1
    );

    wireScrollButton(
      legendScrollRight,
      chartLegend,
      1
    );

    tabList.addEventListener(
      'scroll',
      updateTabScrollControls,
      {
        passive:
          true
      }
    );

    headingScrollViewport.addEventListener(
      'scroll',
      updateHeadingScrollControls,
      {
        passive:
          true
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive:
          true
      }
    );

    window.addEventListener(
      'resize',
      () => {
        if (
          resizeFrame
        ) {
          cancelAnimationFrame(
            resizeFrame
          );
        }

        resizeFrame =
          requestAnimationFrame(
            () => {
              resizeFrame =
                null;

              updateTabIndicator(
                false
              );

              updateTabScrollControls();
              updateHeadingScrollControls();
              updateLegendScrollControls();

              if (
                chart
              ) {
                chart.options =
                  chartOptions();

                chart.update(
                  'none'
                );
              }
            }
          );
      }
    );

    if (
      'ResizeObserver' in
      window
    ) {
      const observer =
        new ResizeObserver(
          () => {
            updateTabScrollControls();
            updateHeadingScrollControls();
            updateLegendScrollControls();
          }
        );

      observer.observe(
        tabList
      );

      observer.observe(
        headingScrollShell
      );

      observer.observe(
        headingScrollViewport
      );

      observer.observe(
        chartHeading
      );

      observer.observe(
        chartLegend
      );
    }

    // ============================================================
    // START
    // ============================================================

    async function init() {
      try {
        sourceData =
          await loadData();

        combinedRows =
          buildCombinedRows(
            sourceData
          );

        if (
          combinedRows.length <
          3
        ) {
          throw new Error(
            'Fewer than three common annual observations were available.'
          );
        }

        baseYear =
          combinedRows[0]
            .year;

        updateHeading(
          false
        );

        renderLegend(
          false
        );

        createChart();

        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );

        requestAnimationFrame(
          () => {
            updateTabIndicator(
              false
            );

            updateTabScrollControls();
            updateHeadingScrollControls();
            updateLegendScrollControls();

            chart.resize();
          }
        );
      } catch (
        error
      ) {
        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );

        statusElement.textContent =
          error?.message ||
          'Could not load demand and supply data.';
      }
    }

    init();
  </script>
</body>
</html>
