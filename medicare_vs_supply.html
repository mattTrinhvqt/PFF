<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Medicare Demand vs Optometry Supply</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --medicare-green: #00a651;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 4px;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    /* ============================================================
     * TOP TABS + LIVE STATUS
     * ============================================================ */

    .module-top {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms var(--motion-ease),
        width 420ms var(--motion-ease);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab:hover:not(.is-active) {
      color: var(--ink);
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
      transition: background-color 220ms ease;
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ============================================================
     * GRAPH HEADING + INLINE CONTROLS
     * ============================================================ */

    .chart-heading-row {
      position: relative;
      z-index: 40;
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 31px;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin: 0;
    }

    .heading-scroll-shell {
      position: relative;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }

    .heading-scroll-viewport {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .heading-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    .heading-scroll-button {
      position: absolute;
      top: 4px;
      z-index: 4;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .heading-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .heading-scroll-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 1px;
    }

    .heading-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .heading-scroll-left {
      left: 0;
    }

    .heading-scroll-right {
      right: 0;
    }

    .chart-heading {
      display: inline-block;
      width: max-content;
      min-width: max-content;
      margin: 0;
      padding: 4px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed {
      display: inline;
    }

    .chart-heading-mode-wrap {
      position: relative;
      display: inline-block;
      width: 12.6em;
      height: 22px;
      overflow: hidden;
      vertical-align: top;
    }

    .chart-heading-mode {
      position: absolute;
      top: 0;
      left: 0;
      display: inline-block;
      white-space: nowrap;
      will-change: opacity, transform;
    }

    .heading-controls {
      position: relative;
      z-index: 55;
      display: flex;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-start;
      gap: 4px;
    }

    /* ---------- multi-item selector ---------- */

    .item-control {
      position: relative;
      z-index: 70;
      flex: 0 0 auto;
      margin-top: 2px;
    }

    .item-button {
      display: grid;
      width: 96px;
      height: 27px;
      grid-template-columns: max-content minmax(0, 1fr) 8px;
      align-items: center;
      gap: 4px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      text-align: left;
      cursor: pointer;
      transition:
        border-color 140ms ease,
        box-shadow 140ms ease;
    }

    .item-button:hover,
    .item-button[aria-expanded="true"] {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .item-button[aria-expanded="true"] {
      border-color: var(--purple);
    }

    .item-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .item-button-value {
      min-width: 0;
      overflow: hidden;
      color: var(--purple);
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-arrow {
      width: 0;
      height: 0;
      border-top: 4px solid var(--muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .item-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    .item-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 100;
      display: none;
      width: 136px;
      max-height: min(330px, calc(100vh - 120px));
      overflow: hidden;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
    }

    .item-menu.is-open {
      display: flex;
      flex-direction: column;
    }

    .item-menu-title {
      flex: 0 0 auto;
      margin: 0;
      padding: 7px 10px;
      color: var(--muted);
      background: #fff;
      border-bottom: 1px solid var(--track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .item-menu-scroll {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .item-option {
      display: grid;
      width: 100%;
      min-height: 31px;
      grid-template-columns: 15px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 5px 9px;
      color: var(--ink);
      background: #fff;
      border: 0;
      border-bottom: 1px solid rgba(232, 234, 240, 0.58);
      font-family: inherit;
      font-size: 11px;
      line-height: 1.2;
      text-align: left;
      cursor: pointer;
    }

    .item-option:last-child {
      border-bottom: 0;
    }

    .item-option:hover {
      background: rgba(232, 234, 240, 0.30);
    }

    .item-option:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .item-check {
      position: relative;
      width: 15px;
      height: 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .item-option.is-selected .item-check {
      border-color: var(--purple);
      background: var(--purple);
    }

    .item-option.is-selected .item-check::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .item-option.is-indeterminate .item-check {
      border-color: var(--purple);
      background: var(--purple);
    }

    .item-option.is-indeterminate .item-check::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 3px;
      width: 7px;
      height: 2px;
      background: #fff;
      border: 0;
      transform: none;
    }

    .item-option-master {
      font-weight: 700;
      border-bottom-color: var(--track);
    }

    .item-option-total {
      font-weight: 700;
      border-bottom-color: var(--track);
    }

    .item-option-master.is-selected .item-option-label,
    .item-option-master.is-indeterminate .item-option-label,
    .item-option-total.is-selected .item-option-label {
      color: var(--purple);
      font-weight: 700;
    }


    .item-option-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-option.is-selected .item-option-label {
      color: var(--purple);
      font-weight: 700;
    }

    /* ---------- Trend toggle: matches the PFF supply module ---------- */

    .yoy-trend-toggle {
      display: grid;
      width: 74px;
      height: 27px;
      flex: 0 0 74px;
      grid-template-columns: 15px max-content 1fr;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .yoy-trend-toggle > * {
      pointer-events: none;
    }

    .yoy-trend-toggle:hover {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .yoy-trend-toggle.is-on {
      border-color: var(--purple);
    }

    .yoy-trend-toggle:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .yoy-binary-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .yoy-trend-toggle.is-on .yoy-binary-indicator::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .yoy-toggle-label,
    .yoy-toggle-value {
      font-size: 8.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .yoy-toggle-label {
      color: var(--ink);
    }

    .yoy-toggle-value {
      display: block;
      width: 100%;
      min-width: 0;
      color: var(--muted);
      letter-spacing: 0.025em;
      text-align: center;
    }

    .yoy-trend-toggle.is-on .yoy-toggle-value {
      color: var(--purple);
    }

    /* ============================================================
     * LEGEND
     * ============================================================ */

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(232, 234, 240, 0.74);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(21, 21, 21, 0.05);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.68;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transition:
        opacity 160ms ease,
        background 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.90);
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      opacity: 1;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
      background: var(--ink);
    }

    .legend-line.is-short-consult {
      height: 0;
      background: transparent !important;
      border-top: 3px dashed currentColor;
      border-radius: 0;
    }

    /* ============================================================
     * CHART
     * ============================================================ */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -2px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #demandChart {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 2px;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        gap: 4px;
      }

      .chart-heading {
        font-size: 14px;
      }

      .heading-controls {
        gap: 3px;
      }

      .item-button {
        width: 88px;
        padding-right: 4px;
        padding-left: 4px;
        font-size: 8px;
      }

      .item-menu {
        width: 138px;
      }

      .value-mode-toggle {
        width: 68px;
        flex-basis: 68px;
      }

      .value-mode-button {
        padding-right: 2px;
        padding-left: 2px;
        font-size: 8px;
      }

      .yoy-trend-toggle {
        width: 68px;
        flex-basis: 68px;
        grid-template-columns: 15px max-content 1fr;
        gap: 3px;
        padding-right: 3px;
        padding-left: 3px;
      }

      .yoy-toggle-label,
      .yoy-toggle-value {

    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.max(
        minimum,
        Math.min(maximum, value)
      );
    }

    function easeOutQuart(value) {
      return 1 -
        Math.pow(
          1 - value,
          4
        );
    }

    function easeOutCubic(value) {
      const clamped =
        clamp(
          value,
          0,
          1
        );

      return 1 -
        Math.pow(
          1 - clamped,
          3
        );
    }

    function cubicBezierCoordinate(
      t,
      first,
      second
    ) {
      const inverse =
        1 - t;

      return (
        3 *
          inverse *
          inverse *
          t *
          first +
        3 *
          inverse *
          t *
          t *
          second +
        t * t * t
      );
    }

    function cubicBezierDerivative(
      t,
      first,
      second
    ) {
      const inverse =
        1 - t;

      return (
        3 *
          inverse *
          inverse *
          first +
        6 *
          inverse *
          t *
          (
            second -
            first
          ) +
        3 *
          t *
          t *
          (
            1 -
            second
          )
      );
    }

    function pffMotionEase(value) {
      const x =
        clamp(
          Number(value) || 0,
          0,
          1
        );

      if (
        x <= 0 ||
        x >= 1
      ) {
        return x;

      let t =
        x;

      for (
        let iteration = 0;
        iteration < 6;
        iteration += 1
      ) {
        const currentX =
          cubicBezierCoordinate(
            t,
            0.22,
            0.36
          );

        const derivative =
          cubicBezierDerivative(
            t,
            0.22,
            0.36
          );

        if (
          Math.abs(derivative) <
          1e-6
        ) {

        }

        t =
          clamp(
            t -
            (
              currentX -
              x
            ) /
              derivative,
            0,
            1
          );
      }

      return cubicBezierCoordinate(
        t,
        1,
        1
      );
    }

        incoming
      );

      headingAnimationGhost =
        incoming;

      const outgoingAnimation =
        element.animate(
          [
            {
              opacity: 1,
              transform:
                'translateX(0)'
            },
            {
              opacity: 0,
              transform:
                `translateX(${-distance * direction}px)`
            }
          ],
          {
            duration: 420,
            easing:
              PFF_MOTION_EASING,
            fill:
              'forwards'
          }
        );

      const incomingAnimation =
        incoming.animate(
          [
            {
              opacity: 0,
              transform:
                `translateX(${distance * direction}px)`
            },
            {
              opacity: 1,
              transform:
                'translateX(0)'
            }
          ],
          {
            duration: 420,
            easing:
              PFF_MOTION_EASING,
            fill:
              'forwards'
          }
        );

      Promise.allSettled([
        outgoingAnimation.finished,
        incomingAnimation.finished
      ]).then(
        () => {
          if (
            token !==
            headingAnimationToken
          ) {
            incoming.remove();
            return;
          }

          element.textContent =
            text;

          element.style.opacity =
            '1';

          element.style.transform =
            'translateX(0)';

          outgoingAnimation.cancel();
          incomingAnimation.cancel();
          incoming.remove();

          headingAnimationGhost =
            null;
        }
      );
    }

    function finiteNumber(value) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? number
        : null;
    }

    function rgba(
      hex,
      alpha
    ) {
      const cleaned =
        String(
          hex || '#151515'
        )
          .replace('#', '')
          .trim();

      const value =
        Number.parseInt(
          cleaned,
          16
        );

      if (
        !Number.isFinite(value)
      ) {
        return `rgba(21,21,21,${alpha})`;
      }

      const red =
        (value >> 16) & 255;

      const green =
        (value >> 8) & 255;

      const blue =
        value & 255;

      return `rgba(${red},${green},${blue},${alpha})`;
    }

    function cellValue(cell) {
      if (!cell) {
        return null;
      }

      const raw =
        cell.v ??
        cell.f ??
        null;

      return (
        raw === null ||
        raw === ''
      )
        ? null
        : raw;
    }

    function numericCell(cell) {
      const raw =
        cellValue(cell);

      if (
        raw === null ||
        raw === undefined ||
        raw === ''
      ) {
        return null;
      }

      const number =
        Number(
          typeof raw === 'string'
            ? raw.replace(/,/g, '')
            : raw
        );

      return Number.isFinite(number)
        ? number
        : null;
    }

    function textCell(cell) {
      const raw =
        cellValue(cell);

      return (
        raw === null ||
        raw === undefined
      )
        ? ''
        : String(raw).trim();
    }

    function itemText(cell) {
      const text =
        textCell(cell);

      if (
        /^\d{5}$/.test(text)
      ) {
        return text;
      }

      const value =
        numericCell(cell);

      return Number.isFinite(value)
        ? String(
            Math.round(value)
          )
        : '';
    }

    function cloneData(data) {
      return JSON.parse(
        JSON.stringify(data)
      );
    }

    function validSourceData(data) {
      return Boolean(
        data &&
        Array.isArray(data.items) &&
        data.items.length >= 1 &&
        Array.isArray(data.rows) &&
        data.rows.length >= 3
      );
    }

    function formatInteger(value) {
      const number =
        finiteNumber(value);

      return number === null
        ? '—'
        : Math.round(number)
            .toLocaleString('en-AU');
    }

    function formatHours(value) {
      const number =
        finiteNumber(value);

      if (number === null) {
        return '—';
      }

      return number.toLocaleString(
        'en-AU',
        {
          minimumFractionDigits: 0,
          maximumFractionDigits:
            Math.abs(number) < 100
              ? 1
              : 0
        }
      );
    }

    function formatPercent(value) {
      const number =
        finiteNumber(value);

      if (number === null) {
        return '—';
      }

      return `${number.toLocaleString(
        'en-AU',
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 1
        }
      )}%`;
    }

    function formatAxisValue(value) {
      const number =
        finiteNumber(value);

      if (number === null) {
        return '';
      }

      const absolute =
        Math.abs(number);

      if (
        activeView ===
        'capacity'
      ) {
        return `${
          number.toLocaleString(
            'en-AU',
            {
              minimumFractionDigits: 0,
              maximumFractionDigits:
                absolute < 1
                  ? 2
                  : 1
            }
          )
        }%`;
      }

      return number.toLocaleString(
        'en-AU',
        {
          minimumFractionDigits: 0,
          maximumFractionDigits:
            absolute < 10
              ? 2
              : 1
        }
      );
    }

    function fadeTextChange(
      element,
      nextText,
      duration = 240
    ) {
      if (
        !element ||
        element.textContent === nextText
      ) {
        return;
      }

      if (
        reducedMotion() ||
        !element.animate
      ) {
        element.textContent =
          nextText;
        return;
      }

      const token =
        Symbol('text');

      element._pffToken =
        token;

      const fadeOut =
        element.animate(
          [
            {opacity:1},
            {opacity:0}
          ],
          {
            duration:
              Math.round(
                duration * 0.42
              ),
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      fadeOut.finished
        .then(() => {
          if (
            element._pffToken !==
            token
          ) {
            return;
          }

          element.textContent =
            nextText;

          return element.animate(
            [
              {opacity:0},
              {opacity:1}
            ],
            {
              duration:
                Math.round(
                  duration * 0.58
                ),
              easing:
                'cubic-bezier(0.22, 1, 0.36, 1)',
              fill: 'forwards'
            }
          ).finished;
        })
        .catch(() => {});
    }
