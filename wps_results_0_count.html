<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Best Optometry Workplaces</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;

      /*
       * Each Gold/Silver/Bronze box is permanently the same height.
       * 44px comfortably fits two employer lines at the normal 14px
       * desktop font size.
       */
      --podium-row-height: 44px;
      --live-red: #e53935;
      --cached-amber: #c27c00;
      --track: #e8eaf0;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --gold-bg: #fff7d9;
      --gold-border: #ead58a;
      --gold-ink: #78600a;

      --silver-bg: #f3f5f8;
      --silver-border: #d9dee6;
      --silver-ink: #657084;

      --bronze-bg: #faeee5;
      --bronze-border: #e8c9af;
      --bronze-ink: #8b5635;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-touch-callout: none;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      max-width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      margin: 0 auto;
      padding:
        clamp(6px, 2.5vh, 14px)
        4px
        2px;
      overflow: hidden;
      background: #fff;
      text-align: center;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      -webkit-clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation:
        blueConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation:
        greenConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation:
        redConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation:
        loadingTextPulse
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    .response-summary {
      flex: 0 0 auto;
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: clamp(2px, 1vh, 5px);
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      width: 100%;
      min-height: clamp(23px, 6vh, 31px);
      margin-top: 2px;
      align-items: center;
      justify-content: center;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      min-width: 6px;
      min-height: 6px;
      flex: 0 0 6px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    h1 {
      flex: 0 0 auto;
      margin:
        12px
        12px
        clamp(5px, 2.5vh, 14px);
      color: var(--ink);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.2;
    }

    /*
     * This area takes all remaining embed height.
     * JavaScript changes the three row proportions according
     * to the number of employers in each box.
     */
    .podium-list {
      display: grid;
      flex: 0 0 auto;
      grid-template-rows: repeat(
        3,
        var(--podium-row-height)
      );
      gap: clamp(4px, 1.4vh, 8px);
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: visible;
    }

    .podium-row {
      display: grid;
      grid-template-columns:
        clamp(
          54px,
          16vw,
          78px
        )
        minmax(
          0,
          1fr
        );
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--track);
      border-radius: clamp(4px, 1.4vh, 7px);
      text-align: left;
    }

    .medal {
      display: flex;
      min-width: 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
      padding: clamp(3px, 1.5vh, 8px);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .result {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      padding:
        4px
        clamp(6px, 2.7vw, 14px);
      overflow: hidden;
      color: var(--ink);
      background: #fff;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.2;
    }

    /*
     * Every employer remains on one line.
     * One shared font size is applied to every employer.
     */
    .employer-line {
      display: block;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      line-height: 1.2;
      text-align: left;
      white-space: nowrap;
    }

    .gold {
      border-color: var(--gold-border);
    }

    .gold .medal {
      color: var(--gold-ink);
      background: var(--gold-bg);
    }

    .silver {
      border-color: var(--silver-border);
    }

    .silver .medal {
      color: var(--silver-ink);
      background: var(--silver-bg);
    }

    .bronze {
      border-color: var(--bronze-border);
    }

    .bronze .medal {
      color: var(--bronze-ink);
      background: var(--bronze-bg);
    }

    #status {
      flex: 0 0 auto;
      max-height: 42px;
      margin: 6px 8px 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    #status[hidden] {
      display: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding-right: 3px;
        padding-left: 3px;
      }

      .response-value {
        font-size: 24px;
      }

      .live-data {
        font-size: 8px;
      }

      h1 {
        margin-top: 10px;
        font-size: 18px;
      }

      .medal {
        font-size: 10px;
      }

      .result {
        font-size: 12px;
      }

      .podium-row {
        grid-template-columns:
          clamp(
            52px,
            18vw,
            70px
          )
          minmax(
            0,
            1fr
          );
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }

    @media (max-width: 350px) {
      h1 {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  
    /* Standalone embed: remove the old nested-iframe height reservation. */
    html,
    body,
    #fit,
    #app {
      height: auto;
    }

    #app {
      padding-bottom: 0;
    }

    h1[hidden],
    .podium-list[hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="fit">
    <main
      id="app"
      class="is-loading"
      aria-busy="true"
    >
      <div
        id="loading-state"
        class="app-loading"
        role="status"
        aria-label="Loading"
      >
        <div class="cone-loader">
          <div
            class="cone blue"
            aria-hidden="true"
          ></div>

          <div
            class="cone green"
            aria-hidden="true"
          ></div>

          <div
            class="cone red"
            aria-hidden="true"
          ></div>
        </div>

        <div class="loader-text">
          Analysing workplace rankings...
        </div>
      </div>

      <section
        class="response-summary"
        aria-live="polite"
      >
        <div class="response-label">
          No. of responses
        </div>

        <div class="response-value-row">
          <div
            id="response-count"
            class="response-value"
          ></div>

          <div
            id="data-source-indicator"
            class="live-data"
            aria-label="Live data"
          >
            <span
              class="live-data-dot"
              aria-hidden="true"
            ></span>

            <span id="data-source-text">LIVE data</span>
          </div>
        </div>
      </section>

      <h1 hidden>
        Best optometry workplaces
      </h1>

      <div class="podium-list" hidden>
        <section class="podium-row gold">
          <div class="medal">
            Gold
          </div>

          <div
            id="gold-text"
            class="result"
          ></div>
        </section>

        <section class="podium-row silver">
          <div class="medal">
            Silver
          </div>

          <div
            id="silver-text"
            class="result"
          ></div>
        </section>

        <section class="podium-row bronze">
          <div class="medal">
            Bronze
          </div>

          <div
            id="bronze-text"
            class="result"
          ></div>
        </section>
      </div>

      <p
        id="status"
        role="alert"
        hidden
      ></p>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID =
      '1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ';

    const SHEET_GID =
      '0';

    const RAW_DATA_RANGE =
      'A2:C';

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    /*
     * Reuse the existing Workplace Promoter Score raw-data cache.
     * It already stores raw A:D, so this summary needs no
     * separate summary-cell cache.
     */
    const CACHE_APP_KEY =
      'workplace-promoter-score-graph';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Testing switch only.
     * Leave false in normal use.
     */
    const FORCE_CACHED_DATA =
      false;


    const app =
      document.getElementById(
        'app'
      );

    const loadingState =
      document.getElementById(
        'loading-state'
      );

    const responseCount =
      document.getElementById(
        'response-count'
      );

    const podiumList =
      document.querySelector(
        '.podium-list'
      );

    const dataSourceIndicator =
      document.getElementById(
        'data-source-indicator'
      );

    const dataSourceText =
      document.getElementById(
        'data-source-text'
      );

    const status =
      document.getElementById(
        'status'
      );


    const podiumRows = [
      {
        key:
          'gold'
      },

      {
        key:
          'silver'
      },

      {
        key:
          'bronze'
      }
    ];


    function setDataSource(
      source
    ) {
      const isCached =
        source ===
        'cached';


      dataSourceIndicator.hidden =
        false;


      dataSourceIndicator
        .classList
        .toggle(
          'is-cached',
          isCached
        );


      dataSourceIndicator
        .setAttribute(
          'aria-label',
          isCached
            ? 'Cached data'
            : 'Live data'
        );


      dataSourceText.textContent =
        isCached
          ? 'CACHED data'
          : 'LIVE data';
    }


    const EMPLOYERS = [
      {
        fullName:

      {

    function normaliseEmployerName(
      value
    ) {
      return String(
        value ||
        ''
      )
        .toLowerCase()
        .normalize(
          'NFKD'
        )
        .replace(
          /[’‘]/g,
          "'"
        )
        .replace(
          /&/g,
          ' and '
        )
        .replace(
          /[^a-z0-9]+/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }


    const EMPLOYER_ALIAS_MAP =
      new Map();


    EMPLOYERS.forEach(
      (
        employer,
        employerIndex
      ) => {
        [
          employer.fullName,
          ...employer.aliases
        ].forEach(
          alias => {
            EMPLOYER_ALIAS_MAP.set(
              normaliseEmployerName(
                alias
              ),
              {
                fullName:
                  employer.fullName,

                order:
                  employerIndex
              }
            );
          }
        );
      }
    );


    function getEmployerAppearance(
      employerName
    ) {
      const original =
        String(
          employerName ||
          ''
        ).trim();


      const normalised =
        normaliseEmployerName(
          original
        );


      const knownEmployer =
        EMPLOYER_ALIAS_MAP.get(
          normalised
        );


      if (
        knownEmployer
      ) {
        return {
          key:
            normaliseEmployerName(
              knownEmployer.fullName
            ),

          fullName:
            knownEmployer.fullName,

          order:
            knownEmployer.order
        };
      }


      return {
        key:
          normalised ||
          original,

        fullName:
          original ||
          'Unknown employer',

        order:
          Number.MAX_SAFE_INTEGER
      };
    }


    const EMPLOYER_SEPARATOR =
      '\u001F';


    function formatWorkplaceEmployers(
      value
    ) {
      const text =
        String(
          value ||
          ''
        )
          .trim()
          .replace(
            /^#(?:1|2|3)\s*/,
            ''
          );


      const employers =
        text
          .split(
            EMPLOYER_SEPARATOR
          )
          .map(
            employer =>
              employer.trim()
          )
          .filter(
            Boolean
          );


      return employers.length
        ? employers
        : [
            'No result available'
          ];
    }

    function renderWorkplaceResult(
      target,
      value
    ) {
      const employers =
        formatWorkplaceEmployers(
          value
        );

      const fragment =
        document.createDocumentFragment();


      employers.forEach(
        (
          employer,
          index
        ) => {
          const line =
            document.createElement(
              'span'
            );

          line.className =
            'employer-line';

          line.textContent =
            index <
            employers.length - 1
              ? `${employer};`
              : employer;

          fragment.appendChild(
            line
          );
        }
      );


      target.replaceChildren(
        fragment
      );
    }


    /*
     * Gold, Silver and Bronze always remain the same fixed height.
     * The employer font is reduced separately if more than two
     * employer lines need to fit inside a box.
     */
    function updatePodiumRowProportions() {
      podiumList.style.gridTemplateRows =
        'repeat(3, var(--podium-row-height))';
    }


    /*
     * Each Gold/Silver/Bronze box normally uses a 14px
     * employer font on desktop and 12px on mobile.
     *
     * If the employers in one box do not fit vertically
     * or horizontally, only that box's employer font is
     * reduced. The other boxes remain at the normal size
     * unless they independently need to shrink as well.
     */
    function fitSharedEmployerFontSize() {
      const results =
        Array.from(
          document.querySelectorAll(
            '.result'
          )
        );

      const baseFontSize =
        window.matchMedia(
          '(max-width: 430px)'
        ).matches
          ? 12
          : 14;


      results.forEach(
        result => {
          const lines =
            Array.from(
              result.querySelectorAll(
                '.employer-line'
              )
            );


          if (
            !lines.length
          ) {
            return;
          }


          /*
           * Always begin this box at the normal responsive size.
           */
          lines.forEach(
            line => {
              line.style.fontSize =
                `${baseFontSize}px`;
            }
          );


          let boxFontSize =
            baseFontSize;


          /*
           * Horizontal limit:
           * if an employer name is too long for this particular
           * box, reduce this box only enough to keep it on one line.
           */
          lines.forEach(
            line => {
              if (
                line.clientWidth <=
                  1 ||
                line.scrollWidth <=
                  0
              ) {
                return;
              }


              const widthScale =
                line.clientWidth /
                line.scrollWidth;


              boxFontSize =
                Math.min(
                  boxFontSize,
                  baseFontSize *
                  widthScale
                );
            }
          );


          /*
           * Vertical limit:
           * a 40px box comfortably fits up to two employer
           * lines at 11px. If there are more lines, reduce
           * this box's font only as much as necessary.
           */
          const styles =
            window.getComputedStyle(
              result
            );

          const paddingTop =
            parseFloat(
              styles.paddingTop
            ) || 0;

          const paddingBottom =
            parseFloat(
              styles.paddingBottom
            ) || 0;

          const gap =
            parseFloat(
              styles.rowGap ||
              styles.gap
            ) || 0;

          const computedLineHeight =
            parseFloat(
              window
                .getComputedStyle(
                  lines[0]
                )
                .lineHeight
            ) ||
            baseFontSize *
              1.2;

          const lineHeightRatio =
            computedLineHeight /
            baseFontSize;

          const availableHeight =
            Math.max(
              1,
              result.clientHeight -
              paddingTop -
              paddingBottom -
              gap *
              Math.max(
                0,
                lines.length -
                1
              )
            );

          const verticalFontLimit =
            availableHeight /
            (
              lines.length *
              lineHeightRatio
            );


          boxFontSize =
            Math.min(
              boxFontSize,
              verticalFontLimit
            );


          boxFontSize =
            Math.max(
              1,
              Math.floor(
                boxFontSize *
                10
              ) /
              10
            );


          lines.forEach(
            line => {
              line.style.fontSize =
                `${boxFontSize}px`;
            }
          );


          /*
           * Final small correction for browser rounding,
           * again affecting this box only.
           */
          const finalWidthScale =
            Math.min(
              1,
              ...lines.map(
                line => {
                  if (
                    line.clientWidth <=
                      1 ||
                    line.scrollWidth <=
                      0
                  ) {
                    return 1;
                  }


                  return (
                    line.clientWidth /
                    line.scrollWidth
                  );
                }
              )
            );


          if (
            finalWidthScale <
            1
          ) {
            boxFontSize =
              Math.max(
                1,
                boxFontSize *
                finalWidthScale *
                0.995
              );


            lines.forEach(
              line => {
                line.style.fontSize =
                  `${boxFontSize}px`;
              }
            );
          }
        }
      );
    }
    let responsiveLayoutFrame =
      null;


    function refreshPodiumLayout() {
      if (
        responsiveLayoutFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveLayoutFrame
        );
      }


      responsiveLayoutFrame =
        requestAnimationFrame(
          () => {
            responsiveLayoutFrame =
              null;

            updatePodiumRowProportions();


            /*
             * Allow the new grid row proportions to be applied
             * before measuring the available line height.
             */
            requestAnimationFrame(
              fitSharedEmployerFontSize
            );
          }
        );
    }


    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      app.setAttribute(
        'aria-busy',
        'false'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );

      refreshPodiumLayout();
    }


    function getCellDisplayValue(
      cell
    ) {
      if (
        !cell
      ) {
        return '';
      }


      return String(
        cell.f ??
        cell.v ??
        ''
      ).trim();
    }


    function loadGvizRange(
      range
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `bestWorkplacesCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              'script'
            );

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'Could not load data'
                  )
                );
              },
              10000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response => {
            cleanup();


            if (
              response?.status ===
              'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }


            resolve(
              response
            );
          };


          script.onerror =
            () => {
              cleanup();

              reject(
                new Error(
                  'Could not load data'
                )
              );
            };


          const params =
            new URLSearchParams({
              gid:
                SHEET_GID,

              range,

              headers:
                '0',

              tqx:
                `responseHandler:${callbackName}`
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function loadCachedDashboard() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          if (
            !CACHE_WEB_APP_URL ||
            CACHE_WEB_APP_URL.includes(
              'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE'
            )
          ) {
            reject(
              new Error(
                'The cached-data web app URL has not been configured'
              )
            );

            return;
          }


          const callbackName =
            `bestWorkplacesCacheCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;


          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'The cached-data request timed out'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          function finish(
            error,
            response
          ) {
            if (
              settled
            ) {
              return;
            }


            settled =
              true;

            cleanup();


            if (
              error
            ) {
              reject(
                error
              );

              return;
            }


            resolve(
              response
            );
          }


          window[
            callbackName
          ] = response => {
            if (
              !response ||
              typeof response !==
                'object'
            ) {
              finish(
                new Error(
                  'The cached-data response was malformed'
                )
              );

              return;
            }


            finish(
              null,
              response
            );
          };


          script.onerror =
            () => {
              finish(
                new Error(
                  'Could not load the cached-data service'
                )
              );
            };


          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });


          const separator =
            CACHE_WEB_APP_URL.includes(
              '?'
            )
              ? '&'
              : '?';


          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function calculateMedian(
      values
    ) {
      const sorted =
        values
          .filter(
            Number.isFinite
          )
          .slice()
          .sort(
            (
              first,
              second
            ) =>
              first -
              second
          );


      if (
        !sorted.length
      ) {
        return NaN;
      }


      const middle =
        Math.floor(
          sorted.length /
          2
        );


      if (
        sorted.length %
          2 ===
        1
      ) {
        return sorted[
          middle
        ];
      }


      return (
        sorted[
          middle - 1
        ] +
        sorted[
          middle
        ]
      ) /
      2;
    }


    function buildDashboardFromRawData(
      response
    ) {
      const rows =
        response
          ?.table
          ?.rows ||
        [];


      let totalResponses =
        0;


      const employerScores =
        new Map();


      rows.forEach(
        row => {
          const cells =
            row?.c ||
            [];


          const timestamp =
            getCellDisplayValue(
              cells[0]
            );


          /*
           * Equivalent to:
           * =COUNTA(A2:A)
           */
          if (
            timestamp !==
            ''
          ) {
            totalResponses++;
          }


          const employerName =
            getCellDisplayValue(
              cells[1]
            );


          const scoreText =
            getCellDisplayValue(
              cells[2]
            );


          if (
            !employerName ||
            scoreText ===
              ''
          ) {
            return;
          }


          const score =
            Number(
              scoreText
            );


          if (
            !Number.isFinite(
              score
            )
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          if (
            !employerScores.has(
              appearance.key
            )
          ) {
            employerScores.set(
              appearance.key,
              {
                fullName:
                  appearance.fullName,

                order:
                  appearance.order,

                scores:
                  []
              }
            );
          }


          employerScores
            .get(
              appearance.key
            )
            .scores
            .push(
              score
            );
        }
      );


      const employers =
        [
          ...employerScores.values()
        ]
          .map(
            employer => ({
              fullName:
                employer.fullName,

              order:
                employer.order,

              median:
                calculateMedian(
                  employer.scores
                )
            })
          )
          .filter(
            employer =>
              Number.isFinite(
                employer.median
              )
          );


      const distinctMedians =
        [
          ...new Set(
            employers.map(
              employer =>
                employer.median
            )
          )
        ]
          .sort(
            (
              first,
              second
            ) =>
              second -
              first
          );


      function buildRankText(
        rankIndex
      ) {
        const targetMedian =
          distinctMedians[
            rankIndex
          ];


        if (
          !Number.isFinite(
            targetMedian
          )
        ) {
          return '';
        }


        const matchingEmployers =
          employers
            .filter(
              employer =>
                employer.median ===
                targetMedian
            )
            .sort(
              (
                first,
                second
              ) =>
                first.order -
                  second.order ||
                first.fullName.localeCompare(
                  second.fullName
                )
            )
            .map(
              employer =>
                employer.fullName
            );


        if (
          !matchingEmployers.length
        ) {
          return '';
        }


        return (
          `#${rankIndex + 1} ` +
          matchingEmployers.join(
            EMPLOYER_SEPARATOR
          )
        );
      }


      return {
        responseCount:
          String(
            totalResponses
          ),

        gold:
          buildRankText(
            0
          ),

        silver:
          buildRankText(
            1
          ),

        bronze:
          buildRankText(
            2
          )
      };
    }

    function isUsableDashboardText(
      value
    ) {
      const text =
        String(
          value ??
          ''
        ).trim();


      return Boolean(
        text &&
        text !==
          '—'
      );
    }


    function validateDashboardData(
      data
    ) {
      const requiredFields = [
        'responseCount',
        'gold',
        'silver',
        'bronze'
      ];


      const missingField =
        requiredFields.find(
          field =>
            !isUsableDashboardText(
              data?.[
                field
              ]
            )
        );


      if (
        missingField
      ) {
        throw new Error(
          `Dashboard data is missing a usable ${missingField} value`
        );
      }


      return {
        responseCount:
          String(
            data.responseCount
          ).trim(),

        gold:
          String(
            data.gold
          ).trim(),

        silver:
          String(
            data.silver
          ).trim(),

        bronze:
          String(
            data.bronze
          ).trim()
      };
    }


    function normaliseCachedDashboard(
      response
    ) {
      if (
        response?.ok !==
        true
      ) {
        throw new Error(
          response?.error ||
          response?.message ||
          'The cached-data service did not return a snapshot'
        );
      }


      if (
        response.appKey !==
        CACHE_APP_KEY
      ) {
        throw new Error(
          'The cached-data response belongs to a different app'
        );
      }


      if (
        !response.cachedAt ||
        Number.isNaN(
          Date.parse(
            response.cachedAt
          )
        )
      ) {
        throw new Error(
          'The cached-data response has no valid timestamp'
        );
      }


      if (
        !Array.isArray(
          response.data?.rows
        ) ||
        !response.data.rows.length
      ) {
        throw new Error(
          'The cached-data response has no survey rows'
        );
      }


      const rawResponse = {
        table: {
          rows:
            response.data.rows.map(
              row => ({
                c: [
                  {
                    v:
                      row?.[0] ??
                      ''
                  },

                  {
                    v:
                      row?.[1] ??
                      ''
                  },

                  {
                    v:
                      row?.[2] ??
                      ''
                  }
                ]
              })
            )
        }
      };


      return validateDashboardData(
        buildDashboardFromRawData(
          rawResponse
        )
      );
    }


    function renderDashboard(
      data
    ) {
      status.hidden =
        true;

      status.textContent =
        '';


      responseCount.textContent =
        data.responseCount ||
        '—';


      podiumRows.forEach(
        (
          {
            key
          }
        ) => {
          const target =
            document.getElementById(
              `${key}-text`
            );


          renderWorkplaceResult(
            target,
            data[
              key
            ]
          );
        }
      );


      hideLoadingState();
    }


    function showError(
      error
    ) {
      console.error(
        error
      );


      dataSourceIndicator.hidden =
        true;


      responseCount.textContent =
        '—';


      podiumRows.forEach(
        (
          {
            key
          }
        ) => {
          const target =
            document.getElementById(
              `${key}-text`
            );


          renderWorkplaceResult(
            target,
            '—'
          );
        }
      );


      status.hidden =
        false;

      status.textContent =
        `Unable to load results: ${
          error.message ||
          error
        }`;


      hideLoadingState();
    }


    async function loadDashboard() {
      let liveError =
        null;


      if (
        !FORCE_CACHED_DATA
      ) {
        try {
          const rawData =
            await loadGvizRange(
              RAW_DATA_RANGE
            );


          const liveDashboard =
            validateDashboardData(
              buildDashboardFromRawData(
                rawData
              )
            );


          setDataSource(
            'live'
          );


          renderDashboard(
            liveDashboard
          );

          return;
        } catch (
          error
        ) {
          liveError =
            error;


          console.warn(
            'Live Google Sheets data could not be used',
            error
          );
        }
      } else {
        liveError =
          new Error(
            'Live data bypassed for cached-data test'
          );
      }


      try {
        const cachedResponse =
          await loadCachedDashboard();


        const cachedDashboard =
          normaliseCachedDashboard(
            cachedResponse
          );


        setDataSource(
          'cached'
        );


        renderDashboard(
          cachedDashboard
        );
      } catch (
        cachedError
      ) {
        console.error(
          'Live Google Sheets data error',
          liveError
        );


        console.error(
          'Cached Apps Script data error',
          cachedError
        );


        showError(
          new Error(
            'Live and cached data are currently unavailable'
          )
        );
      }
    }


    let lastObservedWidth =
      0;

    let lastObservedHeight =
      0;

    let layoutResizeObserver =
      null;


    if (
      'ResizeObserver' in
      window
    ) {
      layoutResizeObserver =
        new ResizeObserver(
          entries => {
            const appEntry =
              entries.find(
                entry =>
                  entry.target ===
                  app
              );


            if (
              !appEntry
            ) {
              return;
            }


            const currentWidth =
              appEntry.contentRect.width;

            const currentHeight =
              appEntry.contentRect.height;

            const widthChanged =
              Math.abs(
                currentWidth -
                lastObservedWidth
              ) >
              0.5;

            const heightChanged =
              Math.abs(
                currentHeight -
                lastObservedHeight
              ) >
              0.5;


            if (
              currentWidth >
                1 &&
              currentHeight >
                1 &&
              (
                widthChanged ||
                heightChanged
              )
            ) {
              lastObservedWidth =
                currentWidth;

              lastObservedHeight =
                currentHeight;

              refreshPodiumLayout();
            }
          }
        );


      layoutResizeObserver.observe(
        app
      );
    }


    window.addEventListener(
      'resize',
      refreshPodiumLayout,
      {
        passive:
          true
      }
    );


    window.visualViewport
      ?.addEventListener(
        'resize',
        refreshPodiumLayout,
        {
          passive:
            true
        }
      );


    window.addEventListener(
      'pageshow',
      refreshPodiumLayout
    );


    document.addEventListener(
      'visibilitychange',
      () => {
        if (
          !document.hidden
        ) {
          refreshPodiumLayout();
        }
      }
    );


    if (
      document.fonts
        ?.ready
    ) {
      document.fonts.ready.then(
        refreshPodiumLayout
      );
    }


    document.addEventListener(
      'DOMContentLoaded',
      loadDashboard
    );
  </script>
</body>
