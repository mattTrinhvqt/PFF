<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Best Optometry Workplaces</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-touch-callout: none;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      max-width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      margin: 0 auto;
      padding:
        clamp(6px, 2.5vh, 14px)
        4px
        2px;
      overflow: hidden;
      background: #fff;
      text-align: center;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      -webkit-clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation:
        blueConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation:
        greenConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation:
        redConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation:
        loadingTextPulse
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    .response-summary {
      flex: 0 0 auto;
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: clamp(2px, 1vh, 5px);
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value {
      margin-top: 2px;
      color: var(--ink);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .response-value.is-loading {
      display: flex;
      min-width: 64px;
      min-height: 31px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .response-value.is-loading .cone-loader {
      width: 64px;
      height: 22px;
      margin: 0 auto;
    }

    .response-value.is-loading .cone {
      bottom: 1px;
      width: 20px;
      height: 22px;
    }

    .response-value.is-loading .cone.blue {
      left: 14px;
    }

    .response-value.is-loading .cone.green {
      left: 27px;
    }

    .response-value.is-loading .cone.red {
      left: 33px;
    }

    .response-value.is-loading .loader-text {
      margin: -1px 0 0;
      font-size: 7.5px;
      line-height: 1;
    }

    .response-value-row {
      position: relative;
      display: flex;
      width: 100%;
      min-height: clamp(23px, 6vh, 31px);
      margin-top: 2px;
      align-items: center;
      justify-content: center;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      min-width: 6px;
      min-height: 6px;
      flex: 0 0 6px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    #status {
      flex: 0 0 auto;
      max-height: 42px;
      margin: 6px 8px 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    #status[hidden] {
      display: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding-right: 3px;
        padding-left: 3px;
      }

      .response-value {
        font-size: 24px;
      }

      .response-value.is-loading {
        min-width: 64px;
        min-height: 31px;
      }

      .response-value.is-loading .cone-loader {
        width: 64px;
        height: 22px;
      }

      .response-value.is-loading .cone {
        width: 20px;
        height: 22px;
      }

      .response-value.is-loading .cone.blue {
        left: 14px;
      }

      .response-value.is-loading .cone.green {
        left: 27px;
      }

      .response-value.is-loading .cone.red {
        left: 33px;
      }

      .response-value.is-loading .loader-text {
        font-size: 7.5px;
      }

      .live-data {
        font-size: 8px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  
    /* Standalone embed: remove the old nested-iframe height reservation. */
    html,
    body,
    #fit,
    #app {
      height: auto;
    }

    #app {
      padding-bottom: 0;
    }
</style>
</head>

<body>
  <div id="fit">
    <main
      id="app"
      aria-busy="true"
    >
      <section
        class="response-summary"
        aria-live="polite"
      >
        <div class="response-label">
          No. of responses
        </div>

        <div class="response-value-row">
          <div
            id="response-count"
            class="response-value is-loading"
          >
            <div
              class="cone-loader"
              role="status"
              aria-label="Counting responses"
            >
              <div
                class="cone blue"
                aria-hidden="true"
              ></div>

              <div
                class="cone green"
                aria-hidden="true"
              ></div>

              <div
                class="cone red"
                aria-hidden="true"
              ></div>
            </div>

            <div class="loader-text">
              Counting...
            </div>
          </div>

          <div
            id="data-source-indicator"
            class="live-data"
            aria-label="Live data"
            hidden
          >
            <span
              class="live-data-dot"
              aria-hidden="true"
            ></span>

            <span id="data-source-text">LIVE data</span>
          </div>
        </div>
      </section>

      <p
        id="status"
        role="alert"
        hidden
      ></p>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID =
      '1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ';

    const SHEET_GID =
      '0';

    const RAW_DATA_RANGE =
      'A2:C';

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    /*
     * Reuse the existing Workplace Promoter Score raw-data cache.
     * It already stores raw A:D, so this summary needs no
     * separate summary-cell cache.
     */
    const CACHE_APP_KEY =
      'workplace-promoter-score-graph';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    /*
     * Testing switch only.
     * Leave false in normal use.
     */
    const FORCE_CACHED_DATA =
      false;


    const app =
      document.getElementById(
        'app'
      );

    const responseCount =
      document.getElementById(
        'response-count'
      );

    const dataSourceIndicator =
      document.getElementById(
        'data-source-indicator'
      );

    const dataSourceText =
      document.getElementById(
        'data-source-text'
      );

    const status =
      document.getElementById(
        'status'
      );


    function setDataSource(
      source
    ) {
      const isCached =
        source ===
        'cached';


      dataSourceIndicator.hidden =
        false;


      dataSourceIndicator
        .classList
        .toggle(
          'is-cached',
          isCached
        );


      dataSourceIndicator
        .setAttribute(
          'aria-label',
          isCached
            ? 'Cached data'
            : 'Live data'
        );


      dataSourceText.textContent =
        isCached
          ? 'CACHED data'
          : 'LIVE data';
    }


    function hideLoadingState() {
      responseCount.classList.remove(
        'is-loading'
      );

      app.setAttribute(
        'aria-busy',
        'false'
      );
    }


    function getCellDisplayValue(
      cell
    ) {
      if (
        !cell
      ) {
        return '';
      }


      return String(
        cell.f ??
        cell.v ??
        ''
      ).trim();
    }


    function loadGvizRange(
      range
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `bestWorkplacesCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              'script'
            );

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'Could not load data'
                  )
                );
              },
              10000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response => {
            cleanup();


            if (
              response?.status ===
              'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }


            resolve(
              response
            );
          };


          script.onerror =
            () => {
              cleanup();

              reject(
                new Error(
                  'Could not load data'
                )
              );
            };


          const params =
            new URLSearchParams({
              gid:
                SHEET_GID,

              range,

              headers:
                '0',

              tqx:
                `responseHandler:${callbackName}`
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function loadCachedDashboard() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          if (
            !CACHE_WEB_APP_URL ||
            CACHE_WEB_APP_URL.includes(
              'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE'
            )
          ) {
            reject(
              new Error(
                'The cached-data web app URL has not been configured'
              )
            );

            return;
          }


          const callbackName =
            `bestWorkplacesCacheCallback_${Date.now()}_${Math.floor(
              Math.random() *
              100000
            )}`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;


          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'The cached-data request timed out'
                  )
                );
              },
              CACHE_FETCH_TIMEOUT_MS
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );


            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }


            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          function finish(
            error,
            response
          ) {
            if (
              settled
            ) {
              return;
            }


            settled =
              true;

            cleanup();


            if (
              error
            ) {
              reject(
                error
              );

              return;
            }


            resolve(
              response
            );
          }


          window[
            callbackName
          ] = response => {
            if (
              !response ||
              typeof response !==
                'object'
            ) {
              finish(
                new Error(
                  'The cached-data response was malformed'
                )
              );

              return;
            }


            finish(
              null,
              response
            );
          };


          script.onerror =
            () => {
              finish(
                new Error(
                  'Could not load the cached-data service'
                )
              );
            };


          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });


          const separator =
            CACHE_WEB_APP_URL.includes(
              '?'
            )
              ? '&'
              : '?';


          script.src =
            `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    function buildDashboardFromRawData(
      response
    ) {
      const rows =
        response
          ?.table
          ?.rows ||
        [];


      let totalResponses =
        0;


      rows.forEach(
        row => {
          const cells =
            row?.c ||
            [];


          const timestamp =
            getCellDisplayValue(
              cells[0]
            );


          /*
           * Equivalent to:
           * =COUNTA(A2:A)
           */
          if (
            timestamp !==
            ''
          ) {
            totalResponses++;
          }
        }
      );


      return {
        responseCount:
          String(
            totalResponses
          )
      };
    }


    function isUsableDashboardText(
      value
    ) {
      const text =
        String(
          value ??
          ''
        ).trim();


      return Boolean(
        text &&
        text !==
          '—'
      );
    }


    function validateDashboardData(
      data
    ) {
      if (
        !isUsableDashboardText(
          data?.responseCount
        )
      ) {
        throw new Error(
          'Dashboard data is missing a usable responseCount value'
        );
      }


      return {
        responseCount:
          String(
            data.responseCount
          ).trim()
      };
    }


    function normaliseCachedDashboard(
      response
    ) {
      if (
        response?.ok !==
        true
      ) {
        throw new Error(
          response?.error ||
          response?.message ||
          'The cached-data service did not return a snapshot'
        );
      }


      if (
        response.appKey !==
        CACHE_APP_KEY
      ) {
        throw new Error(
          'The cached-data response belongs to a different app'
        );
      }


      if (
        !response.cachedAt ||
        Number.isNaN(
          Date.parse(
            response.cachedAt
          )
        )
      ) {
        throw new Error(
          'The cached-data response has no valid timestamp'
        );
      }


      if (
        !Array.isArray(
          response.data?.rows
        ) ||
        !response.data.rows.length
      ) {
        throw new Error(
          'The cached-data response has no survey rows'
        );
      }


      const rawResponse = {
        table: {
          rows:
            response.data.rows.map(
              row => ({
                c: [
                  {
                    v:
                      row?.[0] ??
                      ''
                  },

                  {
                    v:
                      row?.[1] ??
                      ''
                  },

                  {
                    v:
                      row?.[2] ??
                      ''
                  }
                ]
              })
            )
        }
      };


      return validateDashboardData(
        buildDashboardFromRawData(
          rawResponse
        )
      );
    }


    function renderDashboard(
      data
    ) {
      status.hidden =
        true;

      status.textContent =
        '';


      responseCount.textContent =
        data.responseCount ||
        '—';


      hideLoadingState();
    }


    function showError(
      error
    ) {
      console.error(
        error
      );


      dataSourceIndicator.hidden =
        true;


      responseCount.textContent =
        '—';


      status.hidden =
        false;

      status.textContent =
        `Unable to load results: ${
          error.message ||
          error
        }`;


      hideLoadingState();
    }


    async function loadDashboard() {
      let liveError =
        null;


      if (
        !FORCE_CACHED_DATA
      ) {
        try {
          const rawData =
            await loadGvizRange(
              RAW_DATA_RANGE
            );


          const liveDashboard =
            validateDashboardData(
              buildDashboardFromRawData(
                rawData
              )
            );


          setDataSource(
            'live'
          );


          renderDashboard(
            liveDashboard
          );

          return;
        } catch (
          error
        ) {
          liveError =
            error;


          console.warn(
            'Live Google Sheets data could not be used',
            error
          );
        }
      } else {
        liveError =
          new Error(
            'Live data bypassed for cached-data test'
          );
      }


      try {
        const cachedResponse =
          await loadCachedDashboard();


        const cachedDashboard =
          normaliseCachedDashboard(
            cachedResponse
          );


        setDataSource(
          'cached'
        );


        renderDashboard(
          cachedDashboard
        );
      } catch (
        cachedError
      ) {
        console.error(
          'Live Google Sheets data error',
          liveError
        );


        console.error(
          'Cached Apps Script data error',
          cachedError
        );


        showError(
          new Error(
            'Live and cached data are currently unavailable'
          )
        );
      }
    }


    document.addEventListener(
      'DOMContentLoaded',
      loadDashboard
    );
  </script>
</body>
</html>
