<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Permanent Salary Data</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --trend-yellow: #f1c232;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 0;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .module-top {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        width 420ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .tab-scroll-arrow {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: none;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding-bottom: 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .tab-scroll-arrow-left {
      left: 0;
    }

    .tab-scroll-arrow-right {
      right: 0;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    .chart-heading-row {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      height: 31px;
      min-height: 31px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 4px 116px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
      will-change: opacity;
    }

    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;
      display: inline-flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--purple);
      font-size: 15px;
      line-height: 1;
    }

    .chart-options-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 1;
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .legend-square {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border: 1px solid transparent;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
    }

    .legend-bubble {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
    }

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -2px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .chart-note {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      max-width: min(230px, calc(100% - 80px));
      padding: 5px 7px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(105, 113, 138, 0.16);
      border-radius: 4px;
      font-size: 8.5px;
      line-height: 1.3;
      pointer-events: none;
    }

    .chart-note.is-hidden {
      display: none;
    }

    #permanentSalaryChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 0;
      }

      .tab-scroll-arrow {
        display: inline-flex;
      }

      .tab-scroll-shell.can-scroll-left .tab-scroll-arrow-left,
      .tab-scroll-shell.can-scroll-right .tab-scroll-arrow-right {
        opacity: 0.72;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        height: 30px;
        min-height: 30px;
      }

      .chart-heading {
        padding-top: 4px;
        padding-right: 108px;
        font-size: 14px;
        line-height: 21px;
      }

      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .chart-note {
        max-width: min(205px, calc(100% - 68px));
        font-size: 8px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 100px;
        font-size: 13px;
      }

      .reaggregate-button {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading permanent salary data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading permanent salary data...</div>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div
            class="tab-list"
            role="tablist"
            aria-label="Permanent salary views"
          >
            <button class="chart-tab is-active" type="button" role="tab" data-view="experience" aria-selected="true">Experience</button>
            <button class="chart-tab" type="button" role="tab" data-view="rurality" aria-selected="false">Rurality</button>
            <button class="chart-tab" type="button" role="tab" data-view="state" aria-selected="false">State</button>
            <button class="chart-tab" type="button" role="tab" data-view="employer" aria-selected="false">Employer</button>
            <button class="chart-tab" type="button" role="tab" data-view="date" aria-selected="false">Time</button>
          </div>

          <span class="tab-scroll-arrow tab-scroll-arrow-left" aria-hidden="true">‹</span>
          <span class="tab-scroll-arrow tab-scroll-arrow-right" aria-hidden="true">›</span>
        </div>

        <div class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span>LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 class="chart-heading">
          <span class="chart-heading-fixed">FTE salaries</span><span id="chartHeadingDetail" class="chart-heading-detail">by experience</span>
        </h2>

        <button
          id="reaggregateButton"
          class="reaggregate-button is-hidden"
          type="button"
          aria-hidden="true"
          tabindex="-1"
        >
          <span>Re-aggregate</span>
          <span class="reset-icon" aria-hidden="true">↻</span>
        </button>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >&#8249;</button>

          <div id="legendViewport" class="legend-viewport">
            <div id="chartLegend" class="chart-legend" aria-label="Chart legend"></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >&#8250;</button>
        </div>
      </div>

      <div class="chart-shell">
        <aside id="chartNote" class="chart-note is-hidden" role="note"></aside>

        <canvas
          id="permanentSalaryChart"
          aria-label="Permanent FTE salary chart"
          tabindex="-1"
        ></canvas>
      </div>
    </main>
  </div>

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')

    function normaliseText(value) {

    function parseDate(value) {
      if (
        typeof value === 'number' &&
        value > 20000 &&
        value < 80000
      ) {
        return Date.UTC(1899, 11, 30) + value * DAY_MS;
      }

      const text = cleanText(value);

      if (!text) {
        return null;
      }

      const googleDate = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/
      );

      if (googleDate) {
        return Date.UTC(
          Number(googleDate[1]),
          Number(googleDate[2]),
          Number(googleDate[3])
        );
      }

      const auDate = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})/
      );

      if (auDate) {
        let year = Number(auDate[3]);

        if (year < 100) {
          year += 2000;
        }

        return Date.UTC(
          year,
          Number(auDate[2]) - 1,
          Number(auDate[1])
        );
      }

      const isoDate = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
      );

      if (isoDate) {
        return Date.UTC(
          Number(isoDate[1]),
          Number(isoDate[2]) - 1,
          Number(isoDate[3])
        );
      }

      const parsed = new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          );
    }

    function percentile(sortedValues, probability) {
      if (!sortedValues.length) {
        return NaN;
      }

      const index =
        (sortedValues.length - 1) *
        probability;

      const lowerIndex = Math.floor(index);
      const upperIndex = Math.ceil(index);

      if (lowerIndex === upperIndex) {
        return sortedValues[lowerIndex];
      }

      return (
        sortedValues[lowerIndex] +
        (
          sortedValues[upperIndex] -
          sortedValues[lowerIndex]
        ) *
        (index - lowerIndex)
      );
    }

    function logGamma(value) {
      const coefficients = [
        676.5203681218851,
        -1259.1392167224028,
        771.3234287776531,
        -176.6150291621406,
        12.507343278686905,
        -0.13857109526572012,
        9.984369578019572e-6,
        1.5056327351493116e-7
      ];

      if (value < 0.5) {
        return (
          Math.log(Math.PI) -
          Math.log(Math.sin(Math.PI * value)) -
          logGamma(1 - value)
        );
      }

      const shifted = value - 1;
      let series = 0.9999999999998099;

      coefficients.forEach((coefficient, index) => {
        series += coefficient / (shifted + index + 1);
      });

      const total =
        shifted +
        coefficients.length -
        0.5;

      return (
        0.5 * Math.log(2 * Math.PI) +
        (shifted + 0.5) * Math.log(total) -
        total +
        Math.log(series)
      );
    }

    function betaContinuedFraction(a, b, x) {
      const maximumIterations = 200;
      const epsilon = 3e-14;
      const minimumValue = 1e-300;
      const qab = a + b;
      const qap = a + 1;
      const qam = a - 1;

      let c = 1;
      let d = 1 - qab * x / qap;

      if (Math.abs(d) < minimumValue) {
        d = minimumValue;
      }

      d = 1 / d;

      let result = d;

      for (
        let iteration = 1;
        iteration <= maximumIterations;
        iteration += 1
      ) {
        const doubledIteration = 2 * iteration;

        let coefficient =
          iteration *
          (b - iteration) *
          x /
          (
            (qam + doubledIteration) *
            (a + doubledIteration)
          );

        d = 1 + coefficient * d;

        if (Math.abs(d) < minimumValue) {
          d = minimumValue;
        }

        c = 1 + coefficient / c;

        if (Math.abs(c) < minimumValue) {
          c = minimumValue;
        }

        d = 1 / d;
        result *= d * c;

        coefficient =
          -(a + iteration) *
          (qab + iteration) *
          x /
          (
            (a + doubledIteration) *
            (qap + doubledIteration)
          );

        d = 1 + coefficient * d;

        if (Math.abs(d) < minimumValue) {
          d = minimumValue;
        }

        c = 1 + coefficient / c;

        if (Math.abs(c) < minimumValue) {
          c = minimumValue;
        }

        d = 1 / d;

        const change = d * c;
        result *= change;

        if (Math.abs(change - 1) < epsilon) {
          break;
        }
      }

      return result;
    }

    function regularizedIncompleteBeta(x, a, b) {
      if (x <= 0) {
        return 0;
      }

      if (x >= 1) {
        return 1;
      }

      const betaTerm = Math.exp(
        logGamma(a + b) -
        logGamma(a) -
        logGamma(b) +
        a * Math.log(x) +
        b * Math.log1p(-x)
      );

      if (x < (a + 1) / (a + b + 2)) {
        return (
          betaTerm *
          betaContinuedFraction(a, b, x) /
          a
        );
      }

      return (
        1 -
        betaTerm *
        betaContinuedFraction(b, a, 1 - x) /
        b
      );
    }

    function calculateTwoSidedTTestPValue(
      tStatistic,
      degreesOfFreedom
    ) {
      if (
        !Number.isFinite(tStatistic) ||
        !Number.isFinite(degreesOfFreedom) ||
        degreesOfFreedom <= 0
      ) {
        return NaN;
      }

      const absoluteT = Math.abs(tStatistic);

      const betaInput =
        degreesOfFreedom /
        (
          degreesOfFreedom +
          absoluteT * absoluteT
        );

      return clamp(
        regularizedIncompleteBeta(
          betaInput,
          degreesOfFreedom / 2,
          0.5
        ),
        0,
        1
      );
    }

    function formatPValue(value) {

      if (value < 0.0001) {

      if (value < 0.01) {

    function calculateRegression(
      data,
      transformX = value => value
    ) {
      const transformedData = data
        .map(point => ({
          originalX: point.x,
          x: transformX(point.x),
          y: point.y
        }))
        .filter(point =>
          Number.isFinite(point.x) &&
          Number.isFinite(point.y)
        );

      if (transformedData.length < 2) {
        return null;
      }

      const meanX =
        transformedData.reduce(
          (total, point) => total + point.x,
          0
        ) /
        transformedData.length;

      const meanY =
        transformedData.reduce(
          (total, point) => total + point.y,
          0
        ) /
        transformedData.length;

      let numerator = 0;
      let denominator = 0;

      transformedData.forEach(point => {
        numerator +=
          (point.x - meanX) *
          (point.y - meanY);

        denominator += Math.pow(
          point.x - meanX,
          2
        );
      });

      if (!denominator) {
        return null;
      }

      const slope = numerator / denominator;
      const intercept = meanY - slope * meanX;

      const minimumX = Math.min(
        ...transformedData.map(point => point.originalX)
      );

      const maximumX = Math.max(
        ...transformedData.map(point => point.originalX)
      );

      const predict = originalX =>
        intercept +
        slope * transformX(originalX);

      const residualVariation = transformedData.reduce(
        (total, point) => {
          const predicted =
            intercept +
            slope * point.x;

          return (
            total +
            Math.pow(
              point.y - predicted,
              2
            )
          );
        },
        0
      );

      let pValue = NaN;

      if (transformedData.length > 2) {
        const degreesOfFreedom =
          transformedData.length - 2;

        const residualVariance =
          residualVariation /
          degreesOfFreedom;

        const slopeStandardError = Math.sqrt(
          residualVariance /
          denominator
        );

        if (slopeStandardError === 0) {
          pValue =
            slope === 0
              ? 1
              : 0;
        } else if (
          Number.isFinite(slopeStandardError)
        ) {
          pValue =
            calculateTwoSidedTTestPValue(
              slope /
              slopeStandardError,
              degreesOfFreedom
            );
        }
      }

      return {
        slope,
        minimumX,
        maximumX,
        predict,
        pValue
      };
    }

    function rgba(colour, opacity) {
      const text = String(colour || '').trim();
      const match = text.match(/^#([0-9a-f]{6})$/i);

      if (!match) {
        return `rgba(119, 119, 119, ${opacity})`;
      }

      const digits = match[1];

      return `rgba(${parseInt(digits.slice(0, 2), 16)}, ${parseInt(
        digits.slice(2, 4),
        16
      )}, ${parseInt(digits.slice(4, 6), 16)}, ${opacity})`;
    }

    function parseCssColour(
      value,
      fallback = 'rgba(119, 119, 119, 1)'
    ) {
      const text = String(value || '').trim();
      const hex = text.match(/^#([0-9a-f]{6})$/i);
      const rgbaMatch = text.match(
        /^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)(?:\s*,\s*([\d.]+))?\s*\)$/i
      );

      if (hex) {
        const digits = hex[1];

        return {
          red: parseInt(digits.slice(0, 2), 16),
          green: parseInt(digits.slice(2, 4), 16),
          blue: parseInt(digits.slice(4, 6), 16),
          alpha: 1
        };
      }

      if (rgbaMatch) {
        return {
          red: clamp(Number(rgbaMatch[1]), 0, 255),
          green: clamp(Number(rgbaMatch[2]), 0, 255),
          blue: clamp(Number(rgbaMatch[3]), 0, 255),
          alpha: clamp(
            rgbaMatch[4] === undefined
              ? 1
              : Number(rgbaMatch[4]),
            0,
            1
          )
        };
      }

      if (text !== fallback) {
        return parseCssColour(
          fallback,
          'rgba(119, 119, 119, 1)'
        );
      }

      return {
        red: 119,
        green: 119,
        blue: 119,
        alpha: 1
      };
    }

    function interpolateCssColour(
      firstColour,
      secondColour,
      progress
    ) {
      const first = parseCssColour(firstColour);
      const second = parseCssColour(secondColour);
      const mix = clamp(progress, 0, 1);

      return `rgba(${Math.round(
        first.red +
        (second.red - first.red) * mix
      )}, ${Math.round(
        first.green +
        (second.green - first.green) * mix
      )}, ${Math.round(
        first.blue +
        (second.blue - first.blue) * mix
      )}, ${
        first.alpha +
        (second.alpha - first.alpha) * mix
      })`;
    }

    function fadeCssColour(
      colour,
      opacityMultiplier
    ) {
      const parsed = parseCssColour(colour);

      return `rgba(${Math.round(parsed.red)}, ${Math.round(parsed.green)}, ${Math.round(parsed.blue)}, ${
        parsed.alpha *
        clamp(
          opacityMultiplier,
          0,
          1
        )
      })`;
    }

    function easeOutCubic(progress) {
      return 1 - Math.pow(1 - progress, 3);
    }

    function easeInOutCubic(progress) {
      return progress < 0.5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;
    }

    function runAnimation({
      duration,
      easing,
      onFrame,
      onComplete
    }) {
      if (activeAnimationFrame !== null) {
        cancelAnimationFrame(
          activeAnimationFrame
        );

        activeAnimationFrame = null;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (reduceMotion || duration <= 0) {
        onFrame(1);
        onComplete?.();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const rawProgress = Math.min(
          (now - startedAt) / duration,
          1
        );

        onFrame(
          easing(rawProgress)
        );

        if (rawProgress < 1) {
          activeAnimationFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          activeAnimationFrame = null;
          onComplete?.();
        }
      }

      activeAnimationFrame =
        requestAnimationFrame(
          frame
        );
    }

    function loadSheetRows() {
      return new Promise((resolve, reject) => {
        const callbackName =
          `pffPermanentSalaryCallback_${Date.now()}_${Math.floor(
            Math.random() * 1000000
          )}`;

        const script = document.createElement('script');
        let settled = false;

        const timeout = window.setTimeout(() => {
          finish(
            new Error(
              'Could not load Google Sheet data'
            )
          );
        }, CONFIG.fetchTimeoutMs);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }

          script.remove();
        }

        function finish(error, response) {
          if (settled) {
            return;
          }

          settled = true;
          cleanup();

          if (error) {
            reject(error);
            return;
          }

          if (
            !response ||
            response.status === 'error'
          ) {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                'Could not load Google Sheet data'
              )
            );

            return;
          }

          resolve(response?.table?.rows || []);
        }

        window[callbackName] =
          response =>
            finish(null, response);

        script.onerror =
          () =>
            finish(
              new Error(
                'Network error loading Google Sheet data'
              )
            );

        const params = new URLSearchParams({
          sheet: CONFIG.sheetName,
          range: CONFIG.range,
          headers: '1',
          tq: 'select *',
          tqx: `responseHandler:${callbackName}`,
          _: String(Date.now())
        });

        script.src =
          `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?` +
          params.toString();

        document.body.appendChild(script);
      });
    }

    function getXAxisChangeMap(
      previousOptions,
      nextOptions
    ) {
      const previousView =
        previousOptions?.pffTickView || '';

      const nextView =
        nextOptions?.pffTickView || '';

      const previousAxisVisible =
        previousOptions?.display !== false;

      const nextAxisVisible =
        nextOptions?.display !== false;

      const previousTicksVisible =
        previousAxisVisible &&
        previousOptions?.grid?.drawTicks !== false &&
        previousView !== 'hidden';

      const nextTicksVisible =
        nextAxisVisible &&
        nextOptions?.grid?.drawTicks !== false &&
        nextView !== 'hidden';

      const previousLabelsVisible =
        previousAxisVisible &&
        previousOptions?.ticks?.display !== false &&
        previousView !== 'hidden';

      const nextLabelsVisible =
        nextAxisVisible &&
        nextOptions?.ticks?.display !== false &&
        nextView !== 'hidden';

      const previousTitleText =
        previousOptions?.title?.text;

      const nextTitleText =
        nextOptions?.title?.text;

      const previousTitleHasText =
        Array.isArray(previousTitleText)
          ? previousTitleText.some(Boolean)
          : Boolean(previousTitleText);

      const nextTitleHasText =
        Array.isArray(nextTitleText)
          ? nextTitleText.some(Boolean)
          : Boolean(nextTitleText);

      const previousTitleVisible =
        previousAxisVisible &&
        previousOptions?.title?.display !== false &&
        previousTitleHasText;

      const nextTitleVisible =
        nextAxisVisible &&
        nextOptions?.title?.display !== false &&
        nextTitleHasText;

      const previousBorderVisible =
        previousAxisVisible &&
        previousOptions?.border?.display !== false;

      const nextBorderVisible =
        nextAxisVisible &&
        nextOptions?.border?.display !== false;

      const previousTickSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        tickLength: previousOptions?.grid?.tickLength
      });

      const nextTickSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        tickLength: nextOptions?.grid?.tickLength
      });

      const previousLabelSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        colour: previousOptions?.ticks?.color,
        font: previousOptions?.ticks?.font || {}
      });

      const nextLabelSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        colour: nextOptions?.ticks?.color,
        font: nextOptions?.ticks?.font || {}
      });

      const previousTitleSignature = JSON.stringify({
        text: previousTitleText,
        colour: previousOptions?.title?.color,
        font: previousOptions?.title?.font || {},
        padding: previousOptions?.title?.padding || {}
      });

      const nextTitleSignature = JSON.stringify({
        text: nextTitleText,
        colour: nextOptions?.title?.color,
        font: nextOptions?.title?.font || {},
        padding: nextOptions?.title?.padding || {}
      });

      const previousBorderSignature = JSON.stringify({
        colour: previousOptions?.border?.color,
        width: previousOptions?.border?.width
      });

      const nextBorderSignature = JSON.stringify({
        colour: nextOptions?.border?.color,
        width: nextOptions?.border?.width
      });

      return {
        ticks:
          previousTicksVisible !== nextTicksVisible ||
          (
            previousTicksVisible &&
            nextTicksVisible &&
            previousTickSignature !== nextTickSignature
          ),

        labels:
          previousLabelsVisible !== nextLabelsVisible ||
          (
            previousLabelsVisible &&
            nextLabelsVisible &&
            previousLabelSignature !== nextLabelSignature
          ),

        title:
          previousTitleVisible !== nextTitleVisible ||
          (
            previousTitleVisible &&
            nextTitleVisible &&
            previousTitleSignature !== nextTitleSignature
          ),

        border:
          previousBorderVisible !== nextBorderVisible ||
          (
            previousBorderVisible &&
            nextBorderVisible &&
            previousBorderSignature !== nextBorderSignature
          )
      };
    }

    function resolveAxisValue(
      value,
      context,
      fallback
    ) {
      try {
        return typeof value === 'function'
          ? value(context)
          : value ?? fallback;
      } catch (_) {
        return fallback;
      }
    }

    function normaliseAxisPadding(value) {
      const numericValue =
        typeof value === 'number' ||
        typeof value === 'string'
          ? Number(value)
          : NaN;

      if (Number.isFinite(numericValue)) {
        return {
          top: numericValue,
          right: numericValue,
          bottom: numericValue,
          left: numericValue
        };
      }

      return {
        top: Number(value?.top) || 0,
        right: Number(value?.right) || 0,
        bottom: Number(value?.bottom) || 0,
        left: Number(value?.left) || 0
      };
    }

    function getAxisFont(
      fontOptions,
      fallbackSize = 10,
      fallbackWeight = '400'
    ) {
      const family =
        fontOptions?.family ||
        Chart.defaults.font.family ||
        "'Lato', sans-serif";

      const size =
        Number(fontOptions?.size) ||
        fallbackSize;

      const weight =
        fontOptions?.weight ||
        fallbackWeight;

      const style =
        fontOptions?.style
          ? `${fontOptions.style} `
          : '';

      const configuredLineHeight =
        fontOptions?.lineHeight;

      let lineHeight = size * 1.2;

      if (typeof configuredLineHeight === 'string') {
        const lineHeightText =
          configuredLineHeight.trim();

        const numericLineHeight =
          parseFloat(lineHeightText);

        if (Number.isFinite(numericLineHeight)) {
          if (lineHeightText.endsWith('px')) {
            lineHeight = numericLineHeight;
          } else if (lineHeightText.endsWith('%')) {
            lineHeight =
              size *
              numericLineHeight /
              100;
          } else {
            lineHeight =
              size *
              numericLineHeight;
          }
        }
      } else if (
        Number.isFinite(
          Number(configuredLineHeight)
        )
      ) {
        lineHeight =
          size *
          Number(configuredLineHeight);
      }

      return {
        css:
          `${style}${weight} ${size}px ${family}`,

        lineHeight
      };
    }

    function captureXAxisSnapshot(
      scale,
      styleOptions = scale?.options
    ) {
      if (!scale || !styleOptions) {
        return null;
      }

      const tickOptions =
        styleOptions.ticks || {};

      const gridOptions =
        styleOptions.grid || {};

      const titleOptions =
        styleOptions.title || {};

      const borderOptions =
        styleOptions.border || {};

      const tickPadding =
        Number(tickOptions.padding) || 0;

      const ticks =
        (scale.ticks || []).map(
          (tick, index) => {
            const context =
              typeof scale.getContext === 'function'
                ? scale.getContext(index)
                : {
                    chart,
                    scale,
                    tick,
                    index,
                    type: 'tick'
                  };

            let label = tick.label;

            if (
              label === undefined &&
              typeof tickOptions.callback === 'function'
            ) {
              try {
                label = tickOptions.callback.call(
                  scale,
                  tick.value,
                  index,
                  scale.ticks
                );
              } catch (_) {
                label = tick.value;
              }
            }

            const labelLines =
              Array.isArray(label)
                ? label.map(
                    line => String(line ?? '')
                  )
                : [String(label ?? '')];

            const fontOptions =
              resolveAxisValue(
                tickOptions.font,
                context,
                tickOptions.font || {}
              );

            const font =
              getAxisFont(
                fontOptions,
                10,
                '400'
              );

            const tickValue =
              Number(tick.value);

            const isMajor =
              isMajorXAxisTick(
                tickValue,
                styleOptions.pffTickView
              );

            const tickLength =
              isMajor
                ? 6
                : 2;

            const tickWidth =
              isMajor
                ? 1.1
                : 0.7;

            const configuredLayoutTickLength =
              Number(gridOptions.tickLength);

            const layoutTickLength =
              Number.isFinite(
                configuredLayoutTickLength
              )
                ? configuredLayoutTickLength
                : tickLength;

            return {
              x:
                scale.getPixelForTick(index),

              axisY:
                scale.top,

              labelY:
                scale.top +
                layoutTickLength +
                tickPadding +
                font.lineHeight / 2,

              labelLines,
              font,
              tickLength,
              tickWidth,

              showTick:
                styleOptions.display !== false &&
                gridOptions.drawTicks !== false,

              showLabel:
                styleOptions.display !== false &&
                tickOptions.display !== false,

              tickColour:
                '#151515',

              labelColour:
                resolveAxisValue(
                  tickOptions.color,
                  context,
                  '#151515'
                )
            };
          }
        );

      const titlePadding =
        normaliseAxisPadding(
          titleOptions.padding
        );

      const titleContext = {
        chart,
        scale,
        type: 'scale'
      };

      const titleFontOptions =
        resolveAxisValue(
          titleOptions.font,
          titleContext,
          titleOptions.font || {}
        );

      const titleFont =
        getAxisFont(
          titleFontOptions,
          13,
          '700'
        );

      const titleLines =
        Array.isArray(titleOptions.text)
          ? titleOptions.text.map(
              line => String(line ?? '')
            )
          : [String(titleOptions.text ?? '')];

      const borderContext = {
        chart,
        scale,
        type: 'scale'
      };

      const resolvedBorderWidth =
        Number(
          resolveAxisValue(
            borderOptions.width,
            borderContext,
            1
          )
        );

      return {
        ticks,

        title: {
          show:
            styleOptions.display !== false &&
            titleOptions.display !== false &&
            titleLines.some(Boolean),

          x:
            (scale.left + scale.right) / 2,

          y:
            scale.bottom -
            titlePadding.bottom -
            titleFont.lineHeight / 2,

          lines:
            titleLines,

          font:
            titleFont,

          colour:
            resolveAxisValue(
              titleOptions.color,
              titleContext,
              '#151515'
            )
        },

        border: {
          show:
            styleOptions.display !== false &&
            borderOptions.display !== false,

          left:
            scale.left,

          right:
            scale.right,

          y:
            scale.top,

          colour:
            resolveAxisValue(
              borderOptions.color,
              borderContext,
              '#151515'
            ),

          width:
            Number.isFinite(resolvedBorderWidth)
              ? resolvedBorderWidth
              : 1
        }
      };
    }

    function safeCaptureXAxisSnapshot(
      scale,
      styleOptions
    ) {
      try {
        return captureXAxisSnapshot(
          scale,
          styleOptions
        );
      } catch (error) {
        console.warn(
          'Could not animate the x-axis',
          error
        );

        return null;
      }
    }

    function drawXAxisSnapshot(
      context,
      snapshot,
      opacities,
      offsetX = 0
    ) {
      if (!snapshot) {
        return;
      }

      const tickOpacity = clamp(
        Number(opacities?.ticks) || 0,
        0,
        1
      );

      const labelOpacity = clamp(
        Number(opacities?.labels) || 0,
        0,
        1
      );

      const titleOpacity = clamp(
        Number(opacities?.title) || 0,
        0,
        1
      );

      const borderOpacity = clamp(
        Number(opacities?.border) || 0,
        0,
        1
      );

      if (
        tickOpacity <= 0.001 &&
        labelOpacity <= 0.001 &&
        titleOpacity <= 0.001 &&
        borderOpacity <= 0.001
      ) {
        return;
      }

      context.save();
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.lineCap = 'butt';

      if (
        snapshot.border?.show &&
        borderOpacity > 0.001
      ) {
        context.globalAlpha =
          borderOpacity;

        context.beginPath();
        context.strokeStyle =
          snapshot.border.colour;

        context.lineWidth =
          snapshot.border.width;

        context.moveTo(
          snapshot.border.left + offsetX,
          snapshot.border.y
        );

        context.lineTo(
          snapshot.border.right + offsetX,
          snapshot.border.y
        );

        context.stroke();
      }

      snapshot.ticks.forEach(tick => {
        const x = tick.x + offsetX;

        if (
          tick.showTick &&
          tick.tickLength > 0 &&
          tickOpacity > 0.001
        ) {
          context.globalAlpha =
            tickOpacity;

          context.beginPath();
          context.strokeStyle =
            tick.tickColour;

          context.lineWidth =
            tick.tickWidth;

          context.moveTo(
            x,
            tick.axisY
          );

          context.lineTo(
            x,
            tick.axisY + tick.tickLength
          );

          context.stroke();
        }

        if (
          !tick.showLabel ||
          !tick.labelLines.some(Boolean) ||
          labelOpacity <= 0.001
        ) {
          return;
        }

        context.globalAlpha =
          labelOpacity;

        context.font =
          tick.font.css;

        context.fillStyle =
          tick.labelColour;

        const firstLineY =
          tick.labelY -
          (
            tick.labelLines.length - 1
          ) *
          tick.font.lineHeight / 2;

        tick.labelLines.forEach(
          (line, lineIndex) => {
            if (!line) {
              return;
            }

            context.fillText(
              line,
              x,
              firstLineY +
              lineIndex * tick.font.lineHeight
            );
          }
        );
      });

      if (
        snapshot.title.show &&
        titleOpacity > 0.001
      ) {
        context.globalAlpha =
          titleOpacity;

        context.font =
          snapshot.title.font.css;

        context.fillStyle =
          snapshot.title.colour;

        const firstLineY =
          snapshot.title.y -
          (
            snapshot.title.lines.length - 1
          ) *
          snapshot.title.font.lineHeight / 2;

        snapshot.title.lines.forEach(
          (line, lineIndex) => {
            if (!line) {
              return;
            }

            context.fillText(
              line,
              snapshot.title.x + offsetX,
              firstLineY +
              lineIndex *
              snapshot.title.font.lineHeight
            );
          }
        );
      }

      context.restore();
    }

    function getIncomingXAxisOpacity(part) {
      if (
        !xAxisFade.active ||
        xAxisFade.changes?.[part] === false
      ) {
        return 1;
      }

      return clamp(
        xAxisFade.progress,
        0,
        1
      );
    }

    function createFadingXAxisOptions(options) {
      const tickOptions =
        options?.ticks || {};

      const gridOptions =
        options?.grid || {};

      const titleOptions =
        options?.title || {};

      const borderOptions =
        options?.border || {};

      return {
        ...options,

        ticks: {
          ...tickOptions,

          color(context) {
            const colour =
              resolveAxisValue(
                tickOptions.color,
                context,
                '#151515'
              );

            return fadeCssColour(
              colour,
              getIncomingXAxisOpacity('labels')
            );
          }
        },

        grid: {
          ...gridOptions,

          tickColor(context) {
            const colour =
              resolveAxisValue(
                gridOptions.tickColor,
                context,
                'rgba(21, 21, 21, 0)'
              );

            return fadeCssColour(
              colour,
              getIncomingXAxisOpacity('ticks')
            );
          }
        },

        title: {
          ...titleOptions,

          color(context) {
            const colour =
              resolveAxisValue(
                titleOptions.color,
                context,
                '#151515'
              );

            return fadeCssColour(
              colour,
              getIncomingXAxisOpacity('title')
            );
          }
        },

        border: {
          ...borderOptions,

          color(context) {
            const colour =
              resolveAxisValue(
                borderOptions.color,
                context,
                '#151515'
              );

            return fadeCssColour(
              colour,
              getIncomingXAxisOpacity('border')
            );
          }
        }
      };
    }

    const xAxisFadePlugin = {
      id: 'xAxisFadePlugin',

      afterDraw(activeChart) {
        if (!xAxisFade.active) {
          return;
        }

        const progress = clamp(
          xAxisFade.progress,
          0,
          1
        );

        const outgoingOpacity = clamp(
          1 - progress,
          0,
          1
        );

        drawXAxisSnapshot(
          activeChart.ctx,
          xAxisFade.from,
          {
            ticks:
              xAxisFade.changes.ticks
                ? outgoingOpacity
                : 0,

            labels:
              xAxisFade.changes.labels
                ? outgoingOpacity
                : 0,

            title:
              xAxisFade.changes.title
                ? outgoingOpacity
                : 0,

            border:
              xAxisFade.changes.border
                ? outgoingOpacity
                : 0
          },
          0
        );
      }
    };

    function isMajorYAxisTick(value) {
      if (!Number.isFinite(value)) {
        return false;
      }

      const quotient =
        (
          value -
          yAxisModel.minimum
        ) /
        yAxisModel.majorStep;

      return (
        Math.abs(
          quotient -
          Math.round(quotient)
        ) <
        1e-8
      );
    }

    function isMajorXAxisTick(value, view) {
      if (!Number.isFinite(value)) {
        return false;
      }

      if (view === 'experience') {
        return value % 5 === 0;
      }

      if (view === 'date') {
        const month =
          new Date(value).getUTCMonth();

        return [0, 3, 6, 9].includes(
          month
        );
      }

      return false;
    }

    function drawVariableAxisTicks(
      context,
      scale,
      axis,
      view
    ) {
      if (!scale) {
        return;
      }

      const ticks =
        scale.ticks || [];

      if (!ticks.length) {
        return;
      }

      const tickColour =
        axis === 'x'
          ? fadeCssColour(
              '#151515',
              getIncomingXAxisOpacity('ticks')
            )
          : '#151515';

      context.save();
      context.lineCap = 'butt';
      context.strokeStyle = tickColour;

      ticks.forEach((tick, index) => {
        const value =
          Number(tick.value);

        const pixel =
          scale.getPixelForTick(index);

        if (!Number.isFinite(pixel)) {
          return;
        }

        const isMajor =
          axis === 'x'
            ? isMajorXAxisTick(
                value,
                view
              )
            : isMajorYAxisTick(
                value
              );

        const tickLength =
          axis === 'x'
            ? isMajor
              ? 6
              : 2
            : isMajor
              ? 5
              : 2;

        const tickWidth =
          isMajor
            ? 1.1
            : 0.7;

        context.beginPath();
        context.lineWidth = tickWidth;

        if (axis === 'x') {
          context.moveTo(
            pixel,
            scale.top
          );

          context.lineTo(
            pixel,
            scale.top +
            tickLength
          );
        } else {
          context.moveTo(
            scale.right,
            pixel
          );

          context.lineTo(
            scale.right -
            tickLength,
            pixel
          );
        }

        context.stroke();
      });

      context.restore();
    }

    const variableAxisTickPlugin = {
      id: 'variableAxisTickPlugin',

      afterDraw(activeChart) {
        if (
          [
            'experience',
            'date',
            'rurality'
          ].includes(activeView)
        ) {
          drawVariableAxisTicks(
            activeChart.ctx,
            activeChart.scales.x,
            'x',
            activeView
          );
        }

        drawVariableAxisTicks(
          activeChart.ctx,
          activeChart.scales.y,
          'y',
          activeView
        );
      }
    };

    function createYAxisOptions() {
      return {
        min: yAxisModel.minimum,
        max: yAxisModel.maximum,

        afterFit(scale) {
          scale.width = window.matchMedia(
            '(max-width: 430px)'
          ).matches
            ? 64
            : 70;
        },

        afterBuildTicks(scale) {
          const count =
            Math.round(
              (
                yAxisModel.maximum -
                yAxisModel.minimum
              ) /
              yAxisModel.minorStep
            ) +
            1;

          scale.ticks = Array.from(
            {
              length: count
            },
            (_, index) => ({
              value:
                yAxisModel.minimum +
                index *
                yAxisModel.minorStep
            })
          );
        },

        title: {
          display: true,
          text: 'FTE salary ($)',
          color: '#151515',

          font: {
            family: 'Lato',
            size: 13,
            weight: '700'
          }
        },

        ticks: {
          color: '#151515',
          autoSkip: false,
          padding: 3,

          font: {
            family: 'Lato',
            size: 11,
            weight: '400'
          },

          callback(value) {
            return isMajorYAxisTick(Number(value))
              ? formatCompactSalary(Number(value))
              : '';
          }
        },

        grid: {
          color(context) {
            return isMajorYAxisTick(
              Number(context.tick?.value)
            )
              ? 'rgba(105, 113, 138, 0.075)'
              : 'rgba(105, 113, 138, 0.035)';
          },

          lineWidth(context) {
            return isMajorYAxisTick(
              Number(context.tick?.value)
            )
              ? 1
              : 0.7;
          },

          drawTicks: true,
          tickLength: 5,
          tickColor: 'rgba(21, 21, 21, 0)',
          tickWidth: 0
        },

        border: {
          display: true,
          color: '#151515',
          width: 1.1
        }
      };
    }

    function buildLegendItem(
      colour,
      label,
      markerType = 'square'
    ) {
      return {
        colour,
        label,
        markerType
      };
    }

    function buildContinuousView({
      sourceRows,
      xAccessor,
      xScale,
      regressionType = 'linear',
      slopeLabel,
      slopeMultiplier = 1
    }) {
      const points = sourceRows
        .map(row => ({
          x: xAccessor(row),
          y: row.fteSalary,
          kind: 'continuousPoint',
          ...row
        }))
        .filter(point =>
          Number.isFinite(point.x)
        );

      const transformX =
        regressionType === 'logarithmic'
          ? value =>
              Math.log1p(
                Math.max(0, value)
              )
          : value => value;

      const fitted = calculateRegression(
        points,
        transformX
      );

      const datasets = [
        {
          type: 'scatter',
          datasetRole: 'continuousPoints',
          label: 'FTE salary',
          data: points,
          parsing: false,
          showLine: false,
          clip: false,
          order: 1,

          pointStyle: 'rect',
          pointRadius: CONFIG.pointRadius,
          pointHoverRadius: CONFIG.pointHoverRadius,
          pointHitRadius: 4,

          pointBackgroundColor: rgba(
            '#6600ff',
            CONFIG.pointOpacity
          ),

          pointHoverBackgroundColor: rgba(
            '#6600ff',
            CONFIG.pointHoverOpacity
          ),

          pointBorderColor: rgba(
            '#6600ff',
            0.34
          ),

          pointHoverBorderColor: '#6600ff',
          pointBorderWidth: 0.45,
          pointHoverBorderWidth: 1
        }
      ];

      if (fitted) {
        const count = 96;
        const span =
          fitted.maximumX -
          fitted.minimumX;

        datasets.push({
          type: 'line',
          datasetRole: 'regression',

          label:
            regressionType === 'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',

          data: Array.from(
            {
              length: count
            },
            (_, index) => {
              const proportion =
                count === 1
                  ? 0
                  : index /
                    (count - 1);

              const x =
                fitted.minimumX +
                span *
                proportion;

              return {
                x,
                y: fitted.predict(x)
              };
            }
          ),

          parsing: false,
          showLine: true,
          clip: false,
          fill: false,
          order: 10,

          borderColor: '#f1c232',
          backgroundColor: '#f1c232',
          borderWidth: CONFIG.regressionWidth,
          borderCapStyle: 'round',
          borderJoinStyle: 'round',

          pointRadius: 0,
          pointHoverRadius: 0,
          pointHitRadius: 7,

          tension:
            regressionType === 'logarithmic'
              ? 0.12
              : 0,

          metadata: {
            regressionType,
            slope: fitted.slope,
            pValue: fitted.pValue,
            slopeLabel,
            slopeMultiplier
          }
        });
      }

      return {
        datasets,

        xScale: fixedXAxis(
          xScale
        ),

        legendItems: [
          buildLegendItem(
            rgba(
              '#6600ff',
              CONFIG.pointOpacity
            ),
            'FTE salary',
            'square'
          ),

          buildLegendItem(
            '#f1c232',
            regressionType === 'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',
            'line'
          )
        ],

        note: ''
      };
    }

    function buildExperienceView() {
      const availableRows = rows.filter(row =>
        Number.isFinite(row.experience) &&
        row.experience >= 0 &&
        row.experience <= 45
      );

      return buildContinuousView({
        sourceRows: availableRows,
        xAccessor: row => row.experience,
        regressionType: 'logarithmic',
        slopeLabel: '/year per ln(years + 1)',

        xScale: {

    function startOfUtcMonth(timestamp) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth(),
        1
      );
    }

    function addUtcMonths(
      timestamp,
      months
    ) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth() +
          months,
        1
      );
    }

    function bubbleRadius(respondents) {
      return clamp(
        11 +
        Math.pow(
          respondents,
          0.78
        ) *
        3.15,
        18,
        66
      );
    }

    function bubblePositions(items) {
      const sorted = items
        .slice()
        .sort(
          (
            first,
            second
          ) =>
            first.y -
              second.y ||
            second.statistics.count -
              first.statistics.count ||
            first.label.localeCompare(
              second.label
            )
        );

      const laneLast = [];
      const laneByKey = new Map();

      sorted.forEach(item => {
        let lane = laneLast.findIndex(
          last =>
            item.y -
              last >
            yAxisModel.majorStep *
              0.42
        );

        if (lane === -1) {
          lane = laneLast.length;
          laneLast.push(item.y);
        } else {
          laneLast[lane] = item.y;
        }

        laneByKey.set(
          item.categoryKey,
          lane
        );
      });

      const count = Math.max(
        5,
        laneLast.length
      );

      return new Map(
        [...laneByKey.entries()].map(
          (
            [
              key,
              lane
            ]
          ) => [
            key,

            21 +
            lane /
            Math.max(
              1,
              count - 1
            ) *
            63
          ]
        )
      );
    }

    function rebuildBubbleStore(view) {
      const store =
        bubbleStores[view];

      const config =
        bubbleConfig(view);

      store.categories =
        config.order.filter(
          key =>
            rows.some(
              row =>
                config.accessor(row) ===
                key
            )
        );

      store.rowsByKey = new Map();

      const aggregates =
        store.categories.map(
          categoryKey => {
            const categoryRows = rows.filter(
              row =>
                config.accessor(row) ===
                categoryKey
            );

            const statistics =
              calculateStatistics(
                categoryRows.map(
                  row => row.fteSalary
                )
              );

            store.rowsByKey.set(
              categoryKey,
              categoryRows
            );

            return {
              x: 21,
              y: statistics.median,
              bubbleView: view,
              categoryKey,
              label: config.label(categoryKey),
              fullName: config.fullName(categoryKey),
              colour: config.colour(categoryKey),
              baseRadius: bubbleRadius(
                statistics.count
              ),
              statistics
            };
          }
        );

      const positions =
        bubblePositions(
          aggregates
        );

      store.aggregates = aggregates
        .map(item => ({
          ...item,

          x:
            positions.get(
              item.categoryKey
            ) ??
            21
        }))
        .sort(
          (
            first,
            second
          ) =>
            second.y -
              first.y ||
            second.baseRadius -
              first.baseRadius
        );

      store.rawPoints = [];
      store.splitKeys.clear();
      store.splitProgress.clear();
      store.mergingKeys.clear();
      store.mergeProgress = 0;
      store.dimProgress = 0;
    }

    function bubbleVisibility(raw) {
      const store =
        bubbleStores[
          raw.bubbleView
        ];

      if (
        store.splitProgress.has(
          raw.categoryKey
        )
      ) {
        return (
          1 -
          store.splitProgress.get(
            raw.categoryKey
          )
        );
      }

      if (
        store.mergingKeys.has(
          raw.categoryKey
        )
      ) {
        return store.mergeProgress;
      }

      return store.splitKeys.has(
        raw.categoryKey
      )
        ? 0
        : 1;
    }

    function displayedBubbleRadius(context) {
      const raw = context.raw;

      if (!raw) {
        return 0;
      }

      const visibility =
        bubbleVisibility(raw);

      if (visibility <= 0.001) {
        return 0;
      }

      const scale = Math.min(
        clamp(
          (
            context.chart.width ||
            520
          ) /
          520,
          0.78,
          1.05
        ),

        clamp(
          (
            context.chart.height ||
            585
          ) /
          585,
          0.68,
          1.04
        )
      );

      return raw.baseRadius * scale;
    }
