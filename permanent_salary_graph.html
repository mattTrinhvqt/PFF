<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Permanent Salary Data</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js?v=1.2.0-20260910c"></script>

  <style>
    :root {
      --pff-trend-yellow: #f1c232;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
    }

    .reaggregate-button {
      display: inline-flex;
      min-height: 27px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      color: var(--pff-muted);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--pff-ink);
      border-color: var(--pff-ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--pff-purple);
      font-size: 15px;
      line-height: 1;
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .chart-note {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      max-width: min(230px, calc(100% - 80px));
      padding: 5px 7px;
      color: var(--pff-muted);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(105, 113, 138, 0.16);
      border-radius: 4px;
      font-size: 8.5px;
      line-height: 1.3;
      pointer-events: none;
    }

    .chart-note.is-hidden {
      display: none;
    }

    @media (max-width: 430px) {
      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .chart-note {
        max-width: min(205px, calc(100% - 68px));
        font-size: 8px;
      }
    }

    @media (max-width: 350px) {
      .reaggregate-button {
        font-size: 9px;
      }
    }
  </style>
</head>

          <button

            aria-label="Scroll salary tabs right"

        </div>

        <div id="dataSourceIndicator" class="live-data" aria-label="Live data">

      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">

        <div class="heading-controls">

          >

        </div>
      </div>

      <div class="chart-options-row">

        <canvas

      </div>
    </main>

    const xAxisFade = {
      active: false,
      progress: 1,
      from: null,
      changes: {
        ticks: false,
        labels: false,
        title: false,
        border: false
      }
    };

    function normaliseEmployer(value) {
      const text = normaliseText(value);

      if (
        !text ||
        text === 'x' ||
        text === 'xxx'
      ) {
        return null;
      }

      const employer = EMPLOYERS.find(item =>
        [
          item.key,
          item.label,
          item.fullName,
          ...item.aliases
        ].some(candidate =>
          normaliseText(candidate) === text
        )
      );

      return employer?.key || null;
    }



    function formatCurrency(
      value,
      maximumFractionDigits = 0
    ) {
      return PFF.formatCurrency(
        value,
        {
          maximumFractionDigits
        }
      );
    }

    function formatCompactSalary(
      value
    ) {
      return PFF.formatCompactNumber(
        value,
        {
          thousandThreshold: 1,
          thousandDecimals: 1,
          millionDecimals: 1,
          invalid: ''
        }
      );
    }

    function formatDate(
      timestamp
    ) {
      return PFF.formatDate(
        timestamp,
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          timeZone: 'UTC'
        }
      );
    }

    function formatMedianIqr(statistics) {
      if (!statistics) {
        return '—';
      }

      return (
        `${formatCurrency(statistics.median, 0)} ` +
        `[${formatNumber(statistics.q1, 0)}, ${formatNumber(statistics.q3, 0)}]`
      );
    }

    function buildIndividualDetailLines(raw) {
      const lines = [];

      if (activeView === 'experience') {
        lines.push(
          Number.isFinite(
            raw?.experience
          )
            ? `Experience: ${formatNumber(raw.experience, 1)} years`
            : 'Experience: Unspecified'
        );

        return lines;
      }

      if (activeView === 'rurality') {
        lines.push(
          `Rurality: ${
            raw?.rurality ||
            'Unspecified'
          }`
        );
      }

      if (activeView === 'state') {
        lines.push(
          `State: ${
            raw?.state ||
            'Unspecified'
          }`
        );
      }

      if (activeView === 'employer') {
        lines.push(
          `Employer: ${
            EMPLOYER_BY_KEY.get(
              raw?.employerKey
            )?.fullName ||
            'Unspecified'
          }`
        );
      }

      if (activeView === 'date') {
        lines.push(
          Number.isFinite(
            raw?.date
          )
            ? `Date: ${formatDate(raw.date)}`
            : 'Date: Unspecified'
        );
      }

      lines.push(
        `Experience: ${
          formatExperienceBand(
            raw?.experience
          )
        }`
      );

      return lines;
    }

    function normaliseRows(sourceRows) {
      return sourceRows
        .map((sourceRow, sourceIndex) => {
          const cells = sourceRow?.c || [];

          return {
            sourceIndex,

            date:
              parseDate(cells[0]?.v) ??
              parseDate(cells[0]?.f),

            experience:
              toNumber(
                getCellValue(cells[2])
              ),

            rurality:
              normaliseRurality(
                getCellValue(cells[4])
              ),

            state:
              normaliseState(
                getCellValue(cells[8])
              ),

            employerKey:
              normaliseEmployer(
                getCellValue(cells[9])
              ),

            fteSalary:
              toNumber(
                getCellValue(cells[22])
              )
          };
        })
        .filter(row =>
          Number.isFinite(row.fteSalary) &&
          row.fteSalary >= CONFIG.minimumSalary &&
          row.fteSalary <= CONFIG.maximumSalary
        )
        .map(row => ({
          ...row,

          experience:
            Number.isFinite(row.experience)
              ? row.experience
              : null
        }));
    }

    function fixedXAxis(options) {
      const originalAfterFit = options?.afterFit;
      const ticks = options?.ticks || {};
      const title = options?.title || {};

      return {
        ...options,

        ticks: {
          ...ticks,
          padding: 3,

          font: {
            ...(ticks.font || {}),
            lineHeight: '12px'
          }
        },

        title: {
          ...title,

          padding: {
            top: 7,
            bottom: 2
          },

          font: {
            ...(title.font || {}),
            lineHeight: '16px'
          }
        },

        afterFit(scale) {
          if (
            typeof originalAfterFit === 'function'
          ) {
            originalAfterFit(scale);
          }

          scale.height = 46;
        }
      };
    }

    function getXAxisChangeMap(
      previousOptions,
      nextOptions
    ) {
      const previousView =
        previousOptions?.pffTickView || '';

      const nextView =
        nextOptions?.pffTickView || '';

      const previousAxisVisible =
        previousOptions?.display !== false;

      const nextAxisVisible =
        nextOptions?.display !== false;

      const previousTicksVisible =
        previousAxisVisible &&
        previousOptions?.grid?.drawTicks !== false &&
        previousView !== 'hidden';

      const nextTicksVisible =
        nextAxisVisible &&
        nextOptions?.grid?.drawTicks !== false &&
        nextView !== 'hidden';

      const previousLabelsVisible =
        previousAxisVisible &&
        previousOptions?.ticks?.display !== false &&
        previousView !== 'hidden';

      const nextLabelsVisible =
        nextAxisVisible &&
        nextOptions?.ticks?.display !== false &&
        nextView !== 'hidden';

      const previousTitleText =
        previousOptions?.title?.text;

      const nextTitleText =
        nextOptions?.title?.text;

      const previousTitleHasText =
        Array.isArray(previousTitleText)
          ? previousTitleText.some(Boolean)
          : Boolean(previousTitleText);

      const nextTitleHasText =
        Array.isArray(nextTitleText)
          ? nextTitleText.some(Boolean)
          : Boolean(nextTitleText);

      const previousTitleVisible =
        previousAxisVisible &&
        previousOptions?.title?.display !== false &&
        previousTitleHasText;

      const nextTitleVisible =
        nextAxisVisible &&
        nextOptions?.title?.display !== false &&
        nextTitleHasText;

      const previousBorderVisible =
        previousAxisVisible &&
        previousOptions?.border?.display !== false;

      const nextBorderVisible =
        nextAxisVisible &&
        nextOptions?.border?.display !== false;

      const previousTickSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        tickLength: previousOptions?.grid?.tickLength
      });

      const nextTickSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        tickLength: nextOptions?.grid?.tickLength
      });

      const previousLabelSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        colour: previousOptions?.ticks?.color,
        font: previousOptions?.ticks?.font || {}
      });

      const nextLabelSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        colour: nextOptions?.ticks?.color,
        font: nextOptions?.ticks?.font || {}
      });

      const previousTitleSignature = JSON.stringify({
        text: previousTitleText,
        colour: previousOptions?.title?.color,
        font: previousOptions?.title?.font || {},
        padding: previousOptions?.title?.padding || {}
      });

      const nextTitleSignature = JSON.stringify({
        text: nextTitleText,
        colour: nextOptions?.title?.color,
        font: nextOptions?.title?.font || {},
        padding: nextOptions?.title?.padding || {}
      });

      const previousBorderSignature = JSON.stringify({
        colour: previousOptions?.border?.color,
        width: previousOptions?.border?.width
      });

      const nextBorderSignature = JSON.stringify({
        colour: nextOptions?.border?.color,
        width: nextOptions?.border?.width
      });

      return {
        ticks:
          previousTicksVisible !== nextTicksVisible ||
          (
            previousTicksVisible &&
            nextTicksVisible &&
            previousTickSignature !== nextTickSignature
          ),

        labels:
          previousLabelsVisible !== nextLabelsVisible ||
          (
            previousLabelsVisible &&
            nextLabelsVisible &&
            previousLabelSignature !== nextLabelSignature
          ),

        title:
          previousTitleVisible !== nextTitleVisible ||
          (
            previousTitleVisible &&
            nextTitleVisible &&
            previousTitleSignature !== nextTitleSignature
          ),

        border:
          previousBorderVisible !== nextBorderVisible ||
          (
            previousBorderVisible &&
            nextBorderVisible &&
            previousBorderSignature !== nextBorderSignature
          )
      };
    }

    function resolveAxisValue(
      value,
      context,
      fallback
    ) {
      try {
        return typeof value === 'function'
          ? value(context)
          : value ?? fallback;
      } catch (_) {
        return fallback;
      }
    }

    function normaliseAxisPadding(value) {
      const numericValue =
        typeof value === 'number' ||
        typeof value === 'string'
          ? Number(value)
          : NaN;

      if (Number.isFinite(numericValue)) {
        return {
          top: numericValue,
          right: numericValue,
          bottom: numericValue,
          left: numericValue
        };
      }

      return {
        top: Number(value?.top) || 0,
        right: Number(value?.right) || 0,
        bottom: Number(value?.bottom) || 0,
        left: Number(value?.left) || 0
      };
    }

    function getAxisFont(
      fontOptions,
      fallbackSize = 10,
      fallbackWeight = '400'
    ) {
      const family =
        fontOptions?.family ||
        Chart.defaults.font.family ||
        "'Lato', sans-serif";

      const size =
        Number(fontOptions?.size) ||
        fallbackSize;

      const weight =
        fontOptions?.weight ||
        fallbackWeight;

      const style =
        fontOptions?.style
          ? `${fontOptions.style} `
          : '';

      const configuredLineHeight =
        fontOptions?.lineHeight;

      let lineHeight = size * 1.2;

      if (typeof configuredLineHeight === 'string') {
        const lineHeightText =
          configuredLineHeight.trim();

        const numericLineHeight =
          parseFloat(lineHeightText);

        if (Number.isFinite(numericLineHeight)) {
          if (lineHeightText.endsWith('px')) {
            lineHeight = numericLineHeight;
          } else if (lineHeightText.endsWith('%')) {
            lineHeight =
              size *
              numericLineHeight /
              100;
          } else {
            lineHeight =
              size *
              numericLineHeight;
          }
        }
      } else if (
        Number.isFinite(
          Number(configuredLineHeight)
        )
      ) {
        lineHeight =
          size *
          Number(configuredLineHeight);
      }

      return {
        css:
          `${style}${weight} ${size}px ${family}`,

        lineHeight
      };
    }

    function captureXAxisSnapshot(
      scale,
      styleOptions = scale?.options
    ) {
      if (!scale || !styleOptions) {
        return null;
      }

      const tickOptions =
        styleOptions.ticks || {};

      const gridOptions =
        styleOptions.grid || {};

      const titleOptions =
        styleOptions.title || {};

      const borderOptions =
        styleOptions.border || {};

      const tickPadding =
        Number(tickOptions.padding) || 0;

      const ticks =
        (scale.ticks || []).map(
          (tick, index) => {
            const context =
              typeof scale.getContext === 'function'
                ? scale.getContext(index)
                : {
                    chart,
                    scale,
                    tick,
                    index,
                    type: 'tick'
                  };

            let label = tick.label;

            if (
              label === undefined &&
              typeof tickOptions.callback === 'function'
            ) {
              try {
                label = tickOptions.callback.call(
                  scale,
                  tick.value,
                  index,
                  scale.ticks
                );
              } catch (_) {
                label = tick.value;
              }
            }

            const labelLines =
              Array.isArray(label)
                ? label.map(
                    line => String(line ?? '')
                  )
                : [String(label ?? '')];

            const fontOptions =
              resolveAxisValue(
                tickOptions.font,
                context,
                tickOptions.font || {}
              );

            const font =
              getAxisFont(
                fontOptions,
                10,
                '400'
              );

            const tickValue =
              Number(tick.value);

            const isMajor =
              isMajorXAxisTick(
                tickValue,
                styleOptions.pffTickView
              );

            const tickLength =
              isMajor
                ? 6
                : 2;

            const tickWidth =
              isMajor
                ? 1.1
                : 0.7;

            const configuredLayoutTickLength =
              Number(gridOptions.tickLength);

            const layoutTickLength =
              Number.isFinite(
                configuredLayoutTickLength
              )
                ? configuredLayoutTickLength
                : tickLength;

            return {
              x:
                scale.getPixelForTick(index),

              axisY:
                scale.top,

              labelY:
                scale.top +
                layoutTickLength +
                tickPadding +
                font.lineHeight / 2,

              labelLines,
              font,
              tickLength,
              tickWidth,

              showTick:
                styleOptions.display !== false &&
                gridOptions.drawTicks !== false,

              showLabel:
                styleOptions.display !== false &&
                tickOptions.display !== false,

              tickColour:
                '#151515',

              labelColour:
                resolveAxisValue(
                  tickOptions.color,
                  context,
                  '#151515'
                )
            };
          }
        );

      const titlePadding =
        normaliseAxisPadding(
          titleOptions.padding
        );

      const titleContext = {
        chart,
        scale,
        type: 'scale'
      };

      const titleFontOptions =
        resolveAxisValue(
          titleOptions.font,
          titleContext,
          titleOptions.font || {}
        );

      const titleFont =
        getAxisFont(
          titleFontOptions,
          13,
          '700'
        );

      const titleLines =
        Array.isArray(titleOptions.text)
          ? titleOptions.text.map(
              line => String(line ?? '')
            )
          : [String(titleOptions.text ?? '')];

      const borderContext = {
        chart,
        scale,
        type: 'scale'
      };

      const resolvedBorderWidth =
        Number(
          resolveAxisValue(
            borderOptions.width,
            borderContext,
            1
          )
        );

      return {
        ticks,

        title: {
          show:
            styleOptions.display !== false &&
            titleOptions.display !== false &&
            titleLines.some(Boolean),

          x:
            (scale.left + scale.right) / 2,

          y:
            scale.bottom -
            titlePadding.bottom -
            titleFont.lineHeight / 2,

          lines:
            titleLines,

          font:
            titleFont,

          colour:
            resolveAxisValue(
              titleOptions.color,
              titleContext,
              '#151515'
            )
        },

        border: {
          show:
            styleOptions.display !== false &&
            borderOptions.display !== false,

          left:
            scale.left,

          right:
            scale.right,

          y:
            scale.top,

          colour:
            resolveAxisValue(
              borderOptions.color,
              borderContext,
              '#151515'
            ),

          width:
            Number.isFinite(resolvedBorderWidth)
              ? resolvedBorderWidth
              : 1
        }
      };
    }

    function safeCaptureXAxisSnapshot(
      scale,
      styleOptions
    ) {
      try {
        return captureXAxisSnapshot(
          scale,
          styleOptions
        );
      } catch (error) {
        console.warn(
          'Could not animate the x-axis',
          error
        );

        return null;
      }
    }

    function drawXAxisSnapshot(
      context,
      snapshot,
      opacities,
      offsetX = 0
    ) {
      if (!snapshot) {
        return;
      }

      const tickOpacity = clamp(
        Number(opacities?.ticks) || 0,
        0,
        1
      );

      const labelOpacity = clamp(
        Number(opacities?.labels) || 0,
        0,
        1
      );

      const titleOpacity = clamp(
        Number(opacities?.title) || 0,
        0,
        1
      );

      const borderOpacity = clamp(
        Number(opacities?.border) || 0,
        0,
        1
      );

      if (
        tickOpacity <= 0.001 &&
        labelOpacity <= 0.001 &&
        titleOpacity <= 0.001 &&
        borderOpacity <= 0.001
      ) {
        return;
      }

      context.save();
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.lineCap = 'butt';

      if (
        snapshot.border?.show &&
        borderOpacity > 0.001
      ) {
        context.globalAlpha =
          borderOpacity;

        context.beginPath();
        context.strokeStyle =
          snapshot.border.colour;

        context.lineWidth =
          snapshot.border.width;

        context.moveTo(
          snapshot.border.left + offsetX,
          snapshot.border.y
        );

        context.lineTo(
          snapshot.border.right + offsetX,
          snapshot.border.y
        );

        context.stroke();
      }

      snapshot.ticks.forEach(tick => {
        const x = tick.x + offsetX;

        if (
          tick.showTick &&
          tick.tickLength > 0 &&
          tickOpacity > 0.001
        ) {
          context.globalAlpha =
            tickOpacity;

          context.beginPath();
          context.strokeStyle =
            tick.tickColour;

          context.lineWidth =
            tick.tickWidth;

          context.moveTo(
            x,
            tick.axisY
          );

          context.lineTo(
            x,
            tick.axisY + tick.tickLength
          );

          context.stroke();
        }

        if (
          !tick.showLabel ||
          !tick.labelLines.some(Boolean) ||
          labelOpacity <= 0.001
        ) {
          return;
        }

        context.globalAlpha =
          labelOpacity;

        context.font =
          tick.font.css;

        context.fillStyle =
          tick.labelColour;

        const firstLineY =
          tick.labelY -
          (
            tick.labelLines.length - 1
          ) *
          tick.font.lineHeight / 2;

        tick.labelLines.forEach(
          (line, lineIndex) => {
            if (!line) {
              return;
            }

            context.fillText(
              line,
              x,
              firstLineY +
              lineIndex * tick.font.lineHeight
            );
          }
        );
      });

      if (
        snapshot.title.show &&
        titleOpacity > 0.001
      ) {
        context.globalAlpha =
          titleOpacity;

        context.font =
          snapshot.title.font.css;

        context.fillStyle =
          snapshot.title.colour;

        const firstLineY =
          snapshot.title.y -
          (
            snapshot.title.lines.length - 1
          ) *
          snapshot.title.font.lineHeight / 2;

        snapshot.title.lines.forEach(
          (line, lineIndex) => {
            if (!line) {
              return;
            }

            context.fillText(
              line,
              snapshot.title.x + offsetX,
              firstLineY +
              lineIndex *
              snapshot.title.font.lineHeight
            );
          }
        );
      }

      context.restore();
    }

    function getIncomingXAxisOpacity(part) {
      if (
        !xAxisFade.active ||
        xAxisFade.changes?.[part] === false
      ) {
        return 1;
      }

      return clamp(
        xAxisFade.progress,
        0,
        1
      );
    }

    function createFadingXAxisOptions(options) {
      const tickOptions =
        options?.ticks || {};

      const gridOptions =
        options?.grid || {};

      const titleOptions =
        options?.title || {};

      const borderOptions =
        options?.border || {};

      return {
        ...options,

        ticks: {
          ...tickOptions,

          color(context) {
            const colour =
              resolveAxisValue(
                tickOptions.color,
                context,
                '#151515'
              );

            return fadeCssColour(
              colour,
              getIncomingXAxisOpacity('labels')
            );
          }
        },

        grid: {
          ...gridOptions,

          tickColor(context) {
            const colour =
              resolveAxisValue(
                gridOptions.tickColor,
                context,
                'rgba(21, 21, 21, 0)'
              );

            return fadeCssColour(
              colour,
              getIncomingXAxisOpacity('ticks')
            );
          }
        },

        title: {
          ...titleOptions,

          color(context) {
            const colour =
              resolveAxisValue(
                titleOptions.color,
                context,
                '#151515'
              );

            return fadeCssColour(
              colour,
              getIncomingXAxisOpacity('title')
            );
          }
        },

        border: {
          ...borderOptions,

          color(context) {
            const colour =
              resolveAxisValue(
                borderOptions.color,
                context,
                '#151515'
              );

            return fadeCssColour(
              colour,
              getIncomingXAxisOpacity('border')
            );
          }
        }
      };
    }

    const xAxisFadePlugin = {
      id: 'xAxisFadePlugin',

      afterDatasetsDraw(activeChart) {
        if (!xAxisFade.active) {
          return;
        }

        const progress = clamp(
          xAxisFade.progress,
          0,
          1
        );

        const outgoingOpacity = clamp(
          1 - progress,
          0,
          1
        );

        drawXAxisSnapshot(
          activeChart.ctx,
          xAxisFade.from,
          {
            ticks:
              xAxisFade.changes.ticks
                ? outgoingOpacity
                : 0,

            labels:
              xAxisFade.changes.labels
                ? outgoingOpacity
                : 0,

            title:
              xAxisFade.changes.title
                ? outgoingOpacity
                : 0,

            border:
              xAxisFade.changes.border
                ? outgoingOpacity
                : 0
          },
          0
        );
      }
    };

    function isMajorYAxisTick(value) {
      if (!Number.isFinite(value)) {
        return false;
      }

      const quotient =
        (
          value -
          yAxisModel.minimum
        ) /
        yAxisModel.majorStep;

      return (
        Math.abs(
          quotient -
          Math.round(quotient)
        ) <
        1e-8
      );
    }

    function isMajorXAxisTick(value, view) {
      if (!Number.isFinite(value)) {
        return false;
      }

      if (view === 'experience') {
        return value % 5 === 0;
      }

      if (view === 'date') {
        const month =
          new Date(value).getUTCMonth();

        return [0, 3, 6, 9].includes(
          month
        );
      }

      return false;
    }

    function drawVariableAxisTicks(
      context,
      scale,
      axis,
      view
    ) {
      if (!scale) {
        return;
      }

      const ticks =
        scale.ticks || [];

      if (!ticks.length) {
        return;
      }

      const tickColour =
        axis === 'x'
          ? fadeCssColour(
              '#151515',
              getIncomingXAxisOpacity('ticks')
            )
          : '#151515';

      context.save();
      context.lineCap = 'butt';
      context.strokeStyle = tickColour;

      ticks.forEach((tick, index) => {
        const value =
          Number(tick.value);

        const pixel =
          scale.getPixelForTick(index);

        if (!Number.isFinite(pixel)) {
          return;
        }

        const isMajor =
          axis === 'x'
            ? isMajorXAxisTick(
                value,
                view
              )
            : isMajorYAxisTick(
                value
              );

        const tickLength =
          axis === 'x'
            ? isMajor
              ? 6
              : 2
            : isMajor
              ? 5
              : 2;

        const tickWidth =
          isMajor
            ? 1.1
            : 0.7;

        context.beginPath();
        context.lineWidth = tickWidth;

        if (axis === 'x') {
          context.moveTo(
            pixel,
            scale.top
          );

          context.lineTo(
            pixel,
            scale.top +
            tickLength
          );
        } else {
          context.moveTo(
            scale.right,
            pixel
          );

          context.lineTo(
            scale.right -
            tickLength,
            pixel
          );
        }

        context.stroke();
      });

      context.restore();
    }

    const variableAxisTickPlugin = {
      id: 'variableAxisTickPlugin',

      afterDatasetsDraw(activeChart) {
        if (
          [
            'experience',
            'date',
            'rurality'
          ].includes(activeView)
        ) {
          drawVariableAxisTicks(
            activeChart.ctx,
            activeChart.scales.x,
            'x',
            activeView
          );
        }

        drawVariableAxisTicks(
          activeChart.ctx,
          activeChart.scales.y,
          'y',
          activeView
        );
      }
    };

    function createYAxisOptions() {
      return {
        min: yAxisModel.minimum,
        max: yAxisModel.maximum,

        afterFit(scale) {
          scale.width = window.matchMedia(
            '(max-width: 430px)'
          ).matches
            ? 64
            : 70;
        },

        afterBuildTicks(scale) {
          const count =
            Math.round(
              (
                yAxisModel.maximum -
                yAxisModel.minimum
              ) /
              yAxisModel.minorStep
            ) +
            1;

          scale.ticks = Array.from(
            {
              length: count
            },
            (_, index) => ({
              value:
                yAxisModel.minimum +
                index *
                yAxisModel.minorStep
            })
          );
        },

        title: {
          display: true,
          text: 'FTE salary ($)',
          color: '#151515',

          font: {
            family: 'Lato',
            size: 13,
            weight: '700'
          }
        },

        ticks: {
          color: '#151515',
          autoSkip: false,
          padding: 3,

          font: {
            family: 'Lato',
            size: 12,
            weight: '400'
          },

          callback(value) {
            return isMajorYAxisTick(Number(value))
              ? formatCompactSalary(Number(value))
              : '';
          }
        },

        grid: {
          color(context) {
            return isMajorYAxisTick(
              Number(context.tick?.value)
            )
              ? 'rgba(105, 113, 138, 0.075)'
              : 'rgba(105, 113, 138, 0.035)';
          },

          lineWidth(context) {
            return isMajorYAxisTick(
              Number(context.tick?.value)
            )
              ? 1
              : 0.7;
          },

          drawTicks: true,
          tickLength: 5,
          tickColor: 'rgba(21, 21, 21, 0)',
          tickWidth: 0
        },

        border: {
          display: true,
          color: '#151515',
          width: 1.1
        }
      };
    }

    function buildLegendItem(
      colour,
      label,
      markerType = 'square'
    ) {
      return {
        colour,
        label,
        markerType
      };
    }

    function buildContinuousView({
      sourceRows,
      xAccessor,
      xScale,
      regressionType = 'linear',
      slopeLabel,
      slopeMultiplier = 1
    }) {
      const points = sourceRows
        .map(row => ({
          x: xAccessor(row),
          y: row.fteSalary,
          kind: 'continuousPoint',
          ...row
        }))
        .filter(point =>
          Number.isFinite(point.x)
        );

      const transformX =
        regressionType === 'logarithmic'
          ? value =>
              Math.log1p(
                Math.max(0, value)
              )
          : value => value;

      const fitted = calculateRegression(
        points,
        transformX
      );

      const datasets = [
        {
          type: 'scatter',
          datasetRole: 'continuousPoints',
          label: 'FTE salary ($)',
          data: points,
          parsing: false,
          showLine: false,
          clip: false,

          pointStyle: 'rect',
          pointRadius: CONFIG.pointRadius,
          pointHoverRadius: CONFIG.pointHoverRadius,
          pointHitRadius: 4,

          pointBackgroundColor: rgba(
            '#6600ff',
            CONFIG.pointOpacity
          ),

          pointHoverBackgroundColor: rgba(
            '#6600ff',
            CONFIG.pointHoverOpacity
          ),

          pointBorderColor: rgba(
            '#6600ff',
            0.34
          ),

          pointHoverBorderColor: '#6600ff',
          pointBorderWidth: 0.45,
          pointHoverBorderWidth: 1
        }
      ];

      if (fitted) {
        const count = 96;

        const span =
          fitted.maximumX -
          fitted.minimumX;

        datasets.push({
          type: 'line',
          datasetRole: 'regression',
          order: -10,

          label:
            regressionType === 'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',

          data: Array.from(
            {
              length: count
            },
            (_, index) => {
              const proportion =
                count === 1
                  ? 0
                  : index /
                    (count - 1);

              const x =
                fitted.minimumX +
                span *
                proportion;

              return {
                x,
                y: fitted.predict(x)
              };
            }
          ),

          parsing: false,
          showLine: true,
          clip: false,
          fill: false,

          borderColor: '#f1c232',
          backgroundColor: '#f1c232',
          borderWidth: CONFIG.regressionWidth,
          borderCapStyle: 'round',
          borderJoinStyle: 'round',

          pointRadius: 0,
          pointHoverRadius: 0,
          pointHitRadius: 7,

          tension:
            regressionType === 'logarithmic'
              ? 0.12
              : 0,

          metadata: {
            regressionType,
            slope: fitted.slope,
            pValue: fitted.pValue,
            slopeLabel,
            slopeMultiplier
          }
        });
      }

      return {
        datasets,

        xScale: fixedXAxis(
          xScale
        ),

        legendItems: [
          buildLegendItem(
            rgba(
              '#6600ff',
              CONFIG.pointOpacity
            ),
            'FTE salary ($)',
            'square'
          ),

          buildLegendItem(
            '#f1c232',
            regressionType === 'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',
            'line'
          )
        ],

        note: ''
      };
    }
    function buildExperienceView() {
      const availableRows = rows.filter(row =>
        Number.isFinite(row.experience) &&
        row.experience >= 0 &&
        row.experience <= 45
      );

      return buildContinuousView({
        sourceRows: availableRows,
        xAccessor: row => row.experience,
        regressionType: 'logarithmic',
        slopeLabel: ' per ln(years + 1)',

        xScale: {
          type: 'linear',
          pffTickView: 'experience',
          min: 0,
          max: 45,

          afterBuildTicks(scale) {
            scale.ticks = Array.from(
              {
                length: 46
              },
              (_, value) => ({
                value
              })
            );
          },

          title: {
            display: true,
            text: 'Experience (years)',
            color: '#151515',

            font: {
              family: 'Lato',
              size: 13,
              weight: '700'
            }
          },

          ticks: {
            color: '#151515',
            autoSkip: false,
            maxRotation: 0,
            minRotation: 0,

            font: {
              family: 'Lato',
              size: 10,
              weight: '400'
            },

            callback(value) {
              return Number(value) % 5 === 0
                ? String(value)
                : '';
            }
          },

          grid: {
            drawOnChartArea: false,
            drawTicks: true,
            tickLength: 6,
            tickColor: 'rgba(21, 21, 21, 0)',
            tickWidth: 0
          },

          border: {
            display: true,
            color: '#151515',
            width: 1.1
          }
        }
      });
    }

    function startOfUtcMonth(timestamp) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth(),
        1
      );
    }

    function addUtcMonths(
      timestamp,
      months
    ) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth() +
          months,
        1
      );
    }

    function buildDateView() {
      const availableRows = rows.filter(row =>
        Number.isFinite(row.date)
      );

      if (!availableRows.length) {
        return {
          datasets: [],
          xScale: fixedXAxis({
            type: 'linear',
            pffTickView: 'date',
            min: 0,
            max: 1,

            title: {
              display: true,
              text: 'Date submitted',
              color: '#151515',

              font: {
                family: 'Lato',
                size: 13,
                weight: '700'
              }
            },

            ticks: {
              display: false
            },

            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },

            border: {
              display: true,
              color: '#151515',
              width: 1.1
            }
          }),

          legendItems: [],
          note: 'No valid submission dates are available'
        };
      }

      const values = availableRows.map(
        row => row.date
      );

      const minimum = Math.min(...values);
      const maximum = Math.max(...values);
      const firstMonth =

    function bubbleRadius(respondents) {
      return clamp(
        11 +
        Math.pow(
          respondents,
          0.78
        ) *
        3.15,
        18,
        66
      );
    }

    function bubblePositions(items) {
      const sorted = items
        .slice()
        .sort(
          (
            first,
            second
          ) =>
            first.y -
              second.y ||
            second.statistics.count -
              first.statistics.count ||
            first.label.localeCompare(
              second.label
            )
        );

      const laneLast = [];
      const laneByKey = new Map();

      sorted.forEach(item => {
        let lane = laneLast.findIndex(
          last =>
            item.y -
              last >
            yAxisModel.majorStep *
              0.42
        );

        if (lane === -1) {
          lane = laneLast.length;
          laneLast.push(item.y);
        } else {
          laneLast[lane] = item.y;
        }

        laneByKey.set(
          item.categoryKey,
          lane
        );
      });

      const count = Math.max(
        5,
        laneLast.length
      );

      return new Map(
        [...laneByKey.entries()].map(
          (
            [
              key,
              lane
            ]
          ) => [
            key,

            21 +
            lane /
            Math.max(
              1,
              count - 1
            ) *
            63
          ]
        )
      );
    }

    function rebuildBubbleStore(view) {
      const store =
        bubbleStores[view];

      const config =
        bubbleConfig(view);

      store.categories =
        config.order.filter(
          key =>
            rows.some(
              row =>
                config.accessor(row) ===
                key
            )
        );

      store.rowsByKey = new Map();

      const aggregates =
        store.categories.map(
          categoryKey => {
            const categoryRows = rows.filter(
              row =>
                config.accessor(row) ===
                categoryKey
            );

            const statistics =
              calculateStatistics(
                categoryRows.map(
                  row => row.fteSalary
                )
              );

            store.rowsByKey.set(
              categoryKey,
              categoryRows
            );

            return {
              x: 21,
              y: statistics.median,
              bubbleView: view,
              categoryKey,
              label: config.label(categoryKey),
              fullName: config.fullName(categoryKey),
              colour: config.colour(categoryKey),
              baseRadius: bubbleRadius(
                statistics.count
              ),
              statistics
            };
          }
        );

      const positions =
        bubblePositions(
          aggregates
        );

      store.aggregates = aggregates
        .map(item => ({
          ...item,

          x:
            positions.get(
              item.categoryKey
            ) ??
            21
        }))
        .sort(
          (
            first,
            second
          ) =>
            second.y -
              first.y ||
            second.baseRadius -
              first.baseRadius
        );

      store.rawPoints = [];
      store.splitKeys.clear();
      store.splitProgress.clear();
      store.mergingKeys.clear();
      store.mergeProgress = 0;
      store.dimProgress = 0;
    }

    function bubbleVisibility(raw) {
      const store =
        bubbleStores[
          raw.bubbleView
        ];

      if (
        store.splitProgress.has(
          raw.categoryKey
        )
      ) {
        return (
          1 -
          store.splitProgress.get(
            raw.categoryKey
          )
        );
      }

      if (
        store.mergingKeys.has(
          raw.categoryKey
        )
      ) {
        return store.mergeProgress;
      }

      return store.splitKeys.has(
        raw.categoryKey
      )
        ? 0
        : 1;
    }

    function displayedBubbleRadius(context) {
      const raw = context.raw;

      if (!raw) {
        return 0;
      }

      const visibility =
        bubbleVisibility(raw);

      if (visibility <= 0.001) {
        return 0;
      }

      const scale = Math.min(
        clamp(
          (
            context.chart.width ||
            520
          ) /
          520,
          0.78,
          1.05
        ),

        clamp(
          (
            context.chart.height ||
            585
          ) /
          585,
          0.68,
          1.04
        )
      );

      return raw.baseRadius * scale;
    }

    function distanceToSegment(
      px,
      py,
      ax,
      ay,
      bx,
      by
    ) {
      const dx = bx - ax;
      const dy = by - ay;

      if (dx === 0 && dy === 0) {
        return Math.hypot(
          px - ax,
          py - ay
        );
      }

      const proportion = clamp(
        (
          (px - ax) * dx +
          (py - ay) * dy
        ) /
        (
          dx * dx +
          dy * dy
        ),
        0,
        1
      );

      const closestX =
        ax +
        proportion * dx;

      const closestY =
        ay +
        proportion * dy;

      return Math.hypot(
        px - closestX,
        py - closestY
      );
    }

    function findNearestInteractiveLine(
      event,
      maximumDistance = 10
    ) {
      if (!chart?.chartArea) {
        return null;
      }

      const x = Number(event?.x);
      const y = Number(event?.y);
      const area = chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let bestMatch = null;

      chart.data.datasets.forEach(
        (
          dataset,
          datasetIndex
        ) => {
          if (
            dataset.datasetRole !==
              'regression' &&
            dataset.datasetRole !==
              'categoryMedian'
          ) {
            return;
          }

          const renderedPoints =
            chart
              .getDatasetMeta(
                datasetIndex
              )
              ?.data ||
            [];

          for (
            let index = 0;
            index <
              renderedPoints.length - 1;
            index += 1
          ) {
            const first =
              renderedPoints[index];

            const second =
              renderedPoints[index + 1];

            if (
              !Number.isFinite(first?.x) ||
              !Number.isFinite(first?.y) ||
              !Number.isFinite(second?.x) ||
              !Number.isFinite(second?.y)
            ) {
              continue;
            }

            const distance =
              distanceToSegment(
                x,
                y,
                first.x,
                first.y,
                second.x,
                second.y
              );

            if (distance > maximumDistance) {
              continue;
            }

            const firstDistance =
              Math.hypot(
                x - first.x,
                y - first.y
              );

            const secondDistance =
              Math.hypot(
                x - second.x,
                y - second.y
              );

            const nearestIndex =
              firstDistance <= secondDistance
                ? index
                : index + 1;

            if (
              !bestMatch ||
              distance < bestMatch.distance
            ) {
              bestMatch = {
                datasetIndex,
                index: nearestIndex,
                distance
              };
            }
          }
        }
      );

      return bestMatch;
    }
    function findRawBubbleElement(event) {
      if (!chart?.chartArea) {
        return null;
      }

      const x =
        Number(event?.x);

      const y =
        Number(event?.y);

      const area =
        chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let nearestRawPoint =
        null;

      chart.data.datasets.forEach(
        (dataset, datasetIndex) => {
          if (
            dataset.datasetRole !==
              'bubbleRaw'
          ) {
            return;
          }

          const renderedPoints =
            chart
              .getDatasetMeta(
                datasetIndex
              )
              ?.data || [];

          renderedPoints.forEach(
            (element, index) => {
              if (
                !element ||
                typeof element.inRange !==
                  'function' ||
                !element.inRange(
                  x,
                  y,
                  true
                )
              ) {
                return;
              }

              const distance =
                Math.hypot(
                  x - element.x,
                  y - element.y
                );

              if (
                !nearestRawPoint ||
                distance <
                  nearestRawPoint.distance
              ) {
                nearestRawPoint = {
                  datasetIndex,
                  index,
                  distance
                };
              }
            }
          );
        }
      );

      return nearestRawPoint;
    }
