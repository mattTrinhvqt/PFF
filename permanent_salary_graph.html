    function distanceToSegment(
      px,
      py,
      ax,
      ay,
      bx,
      by
    ) {
      const dx = bx - ax;
      const dy = by - ay;

      if (dx === 0 && dy === 0) {
        return Math.hypot(
          px - ax,
          py - ay
        );
      }

      const proportion = clamp(
        (
          (px - ax) * dx +
          (py - ay) * dy
        ) /
        (
          dx * dx +
          dy * dy
        ),
        0,
        1
      );

      const closestX =
        ax +
        proportion * dx;

      const closestY =
        ay +
        proportion * dy;

      return Math.hypot(
        px - closestX,
        py - closestY
      );
    }

    function findNearestInteractiveLine(
      event,
      maximumDistance = 10
    ) {
      if (!chart?.chartArea) {
        return null;
      }

      const x = Number(event?.x);
      const y = Number(event?.y);
      const area = chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let bestMatch = null;

      chart.data.datasets.forEach(
        (
          dataset,
          datasetIndex
        ) => {
          if (
            dataset.datasetRole !==
              'regression' &&
            dataset.datasetRole !==
              'categoryMedian'
          ) {
            return;
          }

          const renderedPoints =
            chart
              .getDatasetMeta(
                datasetIndex
              )
              ?.data ||
            [];

          for (
            let index = 0;
            index <
              renderedPoints.length - 1;
            index += 1
          ) {
            const first =
              renderedPoints[index];

            const second =
              renderedPoints[index + 1];

            if (
              !Number.isFinite(first?.x) ||
              !Number.isFinite(first?.y) ||
              !Number.isFinite(second?.x) ||
              !Number.isFinite(second?.y)
            ) {
              continue;
            }

            const distance =
              distanceToSegment(
                x,
                y,
                first.x,
                first.y,
                second.x,
                second.y
              );

            if (distance > maximumDistance) {
              continue;
            }

            const firstDistance =
              Math.hypot(
                x - first.x,
                y - first.y
              );

            const secondDistance =
              Math.hypot(
                x - second.x,
                y - second.y
              );

            const nearestIndex =
              firstDistance <= secondDistance
                ? index
                : index + 1;

            if (
              !bestMatch ||
              distance < bestMatch.distance
            ) {
              bestMatch = {
                datasetIndex,
                index: nearestIndex,
                distance
              };
            }
          }
        }
      );

      return bestMatch;
    }

    function showSelectedTooltip(
      event,
      selectedElement
    ) {
      const renderedElement =
        chart
          .getDatasetMeta(
            selectedElement.datasetIndex
          )
          ?.data
          ?.[
            selectedElement.index
          ];

      chart.tooltip.setActiveElements(
        [
          {
            datasetIndex:
              selectedElement.datasetIndex,

            index:
              selectedElement.index
          }
        ],
        {
          x:
            Number.isFinite(event?.x)
              ? event.x
              : renderedElement?.x ?? 0,

          y:
            Number.isFinite(event?.y)
              ? event.y
              : renderedElement?.y ?? 0
        }
      );

      chart.update('none');
    }

    function showHoveredLineTooltip(
      event,
      selectedElement
    ) {
      if (
        !selectedElement ||
        !chart
      ) {
        return;
      }

      const dataset =
        chart.data.datasets[
          selectedElement.datasetIndex
        ];

      if (
        dataset?.datasetRole !==
          'regression' &&
        dataset?.datasetRole !==
          'categoryMedian'
      ) {
        return;
      }

      const currentActive =
        chart.tooltip
          ?.getActiveElements
          ?.()
          ?.[0];

      if (
        currentActive?.datasetIndex ===
          selectedElement.datasetIndex &&
        currentActive?.index ===
          selectedElement.index
      ) {
        return;
      }

      showSelectedTooltip(
        event,
        selectedElement
      );
    }

    function handleChartHover(
      event,
      elements
    ) {
      if (
        !chart ||
        interactionLocked
      ) {
        if (chart) {
          chart.canvas.style.cursor =
            'default';
        }

        return;
      }

      const selectedElement =
        getInteractiveElement(elements) ||
        findNearestInteractiveLine(event);

      const dataset = selectedElement
        ? chart.data.datasets[
            selectedElement.datasetIndex
          ]
        : null;

      const raw = selectedElement
        ? dataset?.data?.[
            selectedElement.index
          ]
        : null;

      chart.canvas.style.cursor =
        dataset?.datasetRole ===
          'bubbleAggregate' &&
        raw &&
        !bubbleStores[
          raw.bubbleView
        ].splitKeys.has(
          raw.categoryKey
        )
          ? 'pointer'
          : selectedElement
            ? 'pointer'
            : 'default';

      if (
        selectedElement &&
        (
          dataset?.datasetRole ===
            'regression' ||
          dataset?.datasetRole ===
            'categoryMedian'
        )
      ) {
        showHoveredLineTooltip(
          event,
          selectedElement
        );
      }
    }

    function handleChartClick(
      event,
      elements
    ) {
      if (
        !chart ||
        interactionLocked
      ) {
        return;
      }

      event?.native?.preventDefault?.();

      const selectedElement =
        getInteractiveElement(elements) ||
        findNearestInteractiveLine(event);

      if (!selectedElement) {
        chart.tooltip.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

        chart.update('none');
        return;
      }

      showSelectedTooltip(
        event,
        selectedElement
      );

      const dataset =
        chart.data.datasets[
          selectedElement.datasetIndex
        ];

      const raw =
        dataset?.data?.[
          selectedElement.index
        ];

      if (
        dataset?.datasetRole !==
          'bubbleAggregate' ||
        !raw ||
        bubbleStores[
          raw.bubbleView
        ].splitKeys.has(
          raw.categoryKey
        )
      ) {
        lastBubbleClick = '';
        lastBubbleClickAt = 0;
        return;
      }

      const clickedAt =
        performance.now();

      const key =
        `${raw.bubbleView}:${raw.categoryKey}`;

      const isSecondActivation =
        lastBubbleClick === key &&
        clickedAt -
          lastBubbleClickAt <=
          CONFIG.doubleActivationMs;

      if (isSecondActivation) {
        lastBubbleClick = '';
        lastBubbleClickAt = 0;

        chart.tooltip.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

        chart.update('none');

        splitBubble(
          raw.bubbleView,
          raw.categoryKey
        );

        return;
      }

      lastBubbleClick = key;
      lastBubbleClickAt = clickedAt;
    }

    function isLineDataset(dataset) {
      return (
        dataset?.datasetRole === 'regression' ||
        dataset?.datasetRole === 'categoryMedian' ||
        (
          dataset?.type === 'line' &&
          dataset?.showLine !== false
        )
      );
    }

    function resolveScriptableValue(
      value,
      context,
      fallback
    ) {
      try {
        if (typeof value === 'function') {
          return value(context);
        }

        if (Array.isArray(value)) {
          return (
            value[context.dataIndex] ??
            fallback
          );
        }

        return value ?? fallback;
      } catch (_) {
        return fallback;
      }
    }

    function getTargetPointStyle(
      dataset,
      raw,
      index
    ) {
      const context = {
        chart,
        raw,
        dataIndex: index,
        dataset,
        datasetIndex: 0,
        type: 'data'
      };

      const backgroundColour =
        resolveScriptableValue(
          dataset.pointBackgroundColor,
          context,
          raw?.colour
            ? rgba(
                raw.colour,
                CONFIG.aggregateOpacity
              )
            : 'rgba(102, 0, 255, 0.20)'
        );

      const borderColour =
        resolveScriptableValue(
          dataset.pointBorderColor,
          context,
          backgroundColour
        );

      const radius = Number(
        resolveScriptableValue(
          dataset.pointRadius,
          context,
          CONFIG.pointRadius
        )
      );

      return {
        backgroundColour,
        borderColour,

        radius:
          Number.isFinite(radius)
            ? radius
            : CONFIG.pointRadius,

        pointStyle:
          resolveScriptableValue(
            dataset.pointStyle,
            context,
            'circle'
          )
      };
    }

    function captureRenderedGeometry() {
      const pointPixels = [];
      const lineGroups = [];

      if (!chart) {
        return {
          pointPixels,
          lineGroups
        };
      }

      chart.data.datasets.forEach(
        (dataset, datasetIndex) => {
          const metadata =
            chart.getDatasetMeta(
              datasetIndex
            );

          const renderedElements =
            metadata?.data || [];

          const data =
            dataset.data || [];

          const pixels =
            renderedElements
              .map((element, index) => {
                if (
                  !Number.isFinite(element?.x) ||
                  !Number.isFinite(element?.y)
                ) {
                  return null;
                }

                return {
                  x: element.x,
                  y: element.y,
                  raw: data[index] || {},
                  role: dataset.datasetRole,
                  datasetMetadata:
                    dataset.metadata || {},

                  style: {
                    backgroundColour:
                      element.options
                        ?.backgroundColor ||
                      element.options
                        ?.borderColor ||
                      'rgba(119, 119, 119, 0.35)',

                    borderColour:
                      element.options
                        ?.borderColor ||
                      element.options
                        ?.backgroundColor ||
                      'rgba(119, 119, 119, 0.35)',

                    radius:
                      Number(
                        element.options?.radius
                      ) ||
                      CONFIG.pointRadius,

                    pointStyle:
                      element.options
                        ?.pointStyle ||
                      'circle'
                  }
                };
              })
              .filter(Boolean);

          if (!pixels.length) {
            return;
          }

          if (
            isLineDataset(dataset) &&
            pixels.length > 1
          ) {
            lineGroups.push({
              role:
                dataset.datasetRole,

              pixels,

              metadata:
                dataset.metadata || {},

              style: {
                borderColour:
                  metadata
                    ?.dataset
                    ?.options
                    ?.borderColor ||
                  dataset.borderColor ||
                  '#777777',

                borderWidth:
                  Number(
                    metadata
                      ?.dataset
                      ?.options
                      ?.borderWidth
                  ) ||
                  Number(
                    dataset.borderWidth
                  ) ||
                  1
              }
            });
          } else {
            pointPixels.push(
              ...pixels
            );
          }
        }
      );

      return {
        pointPixels,
        lineGroups
      };
    }

    function samplePixel(
      sourcePixels,
      index,
      targetLength
    ) {
      if (!sourcePixels.length) {
        return null;
      }

      if (targetLength <= 1) {
        return sourcePixels[0];
      }

      const sourceIndex = Math.round(
        index *
        (
          sourcePixels.length - 1
        ) /
        Math.max(
          1,
          targetLength - 1
        )
      );

      return sourcePixels[
        sourceIndex
      ];
    }

    function findNearestPixel(
      targetPixel,
      candidates
    ) {
      if (!candidates.length) {
        return null;
      }

      let nearest =
        candidates[0];

      let nearestDistance =
        Infinity;

      candidates.forEach(candidate => {
        const distance = Math.hypot(
          targetPixel.x - candidate.x,
          targetPixel.y - candidate.y
        );

        if (distance < nearestDistance) {
          nearest = candidate;
          nearestDistance = distance;
        }
      });

      return nearest;
    }

    function choosePointStartPixel(
      targetRaw,
      targetPixel,
      geometry
    ) {
      const allPointPixels =
        geometry.pointPixels;

      if (!allPointPixels.length) {
        return findNearestPixel(
          targetPixel,
          geometry.lineGroups.flatMap(
            group => group.pixels
          )
        );
      }

      if (
        Number.isInteger(
          targetRaw?.sourceIndex
        )
      ) {
        const exactSource =
          allPointPixels.find(
            pixel =>
              pixel.raw?.sourceIndex ===
              targetRaw.sourceIndex
          );

        if (exactSource) {
          return exactSource;
        }
      }

      if (
        targetRaw?.bubbleView &&
        targetRaw?.categoryKey
      ) {
        const sameBubble =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.bubbleView ===
                targetRaw.bubbleView &&
              pixel.raw?.categoryKey ===
                targetRaw.categoryKey
          );

        if (sameBubble.length) {
          return findNearestPixel(
            targetPixel,
            sameBubble
          );
        }
      }

      if (targetRaw?.state) {
        const sameState =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.state ===
              targetRaw.state
          );

        if (sameState.length) {
          return findNearestPixel(
            targetPixel,
            sameState
          );
        }
      }

      if (targetRaw?.employerKey) {
        const sameEmployer =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.employerKey ===
              targetRaw.employerKey
          );

        if (sameEmployer.length) {
          return findNearestPixel(
            targetPixel,
            sameEmployer
          );
        }
      }

      if (targetRaw?.rurality) {
        const sameRurality =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.rurality ===
              targetRaw.rurality
          );

        if (sameRurality.length) {
          return findNearestPixel(
            targetPixel,
            sameRurality
          );
        }
      }

      if (targetRaw?.category) {
        const sameCategory =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.category ===
              targetRaw.category
          );

        if (sameCategory.length) {
          return findNearestPixel(
            targetPixel,
            sameCategory
          );
        }
      }

      return findNearestPixel(
        targetPixel,
        allPointPixels
      );
    }

    function chooseLineSourceGroup(
      targetDataset,
      geometry
    ) {
      const sameRoleGroups =
        geometry.lineGroups.filter(
          group =>
            group.role ===
            targetDataset.datasetRole
        );

      if (sameRoleGroups.length) {
        const targetCategory =
          targetDataset
            .metadata
            ?.category;

        const exactCategory =
          sameRoleGroups.find(
            group =>
              targetCategory &&
              group.metadata?.category ===
              targetCategory
          );

        if (exactCategory) {
          return exactCategory;
        }

        const targetMedian = Number(
          targetDataset
            .metadata
            ?.statistics
            ?.median
        );

        if (Number.isFinite(targetMedian)) {
          return sameRoleGroups
            .slice()
            .sort(
              (first, second) =>
                Math.abs(
                  Number(
                    first
                      .metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                ) -
                Math.abs(
                  Number(
                    second
                      .metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                )
            )[0];
        }

        return sameRoleGroups[0];
      }

      return {
        role: 'points',
        pixels: geometry.pointPixels,
        metadata: {},

        style: {
          borderColour:
            'rgba(119, 119, 119, 0)',

          borderWidth: 0
        }
      };
    }

    function createTransitionPlans(
      targetDatasets,
      geometry
    ) {
      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return targetDatasets.map(
        targetDataset => {
          const targetData =
            (
              targetDataset.data || []
            ).map(point => ({
              ...point
            }));

          const targetIsLine =
            isLineDataset(
              targetDataset
            );

          const lineSourceGroup =
            targetIsLine
              ? chooseLineSourceGroup(
                  targetDataset,
                  geometry
                )
              : null;

          const sourcePixels = [];

          const startData =
            targetData.map(
              (targetPoint, index) => {
                const targetPixel = {
                  x:
                    xScale.getPixelForValue(
                      targetPoint.x
                    ),

                  y:
                    yScale.getPixelForValue(
                      targetPoint.y
                    )
                };

                const sourcePixel =
                  targetIsLine
                    ? samplePixel(
                        lineSourceGroup
                          ?.pixels || [],
                        index,
                        targetData.length
                      )
                    : choosePointStartPixel(
                        targetPoint,
                        targetPixel,
                        geometry
                      );

                sourcePixels.push(
                  sourcePixel
                );

                if (!sourcePixel) {
                  return {
                    ...targetPoint
                  };
                }

                return {
                  ...targetPoint,

                  x:
                    xScale.getValueForPixel(
                      sourcePixel.x
                    ),

                  y:
                    yScale.getValueForPixel(
                      sourcePixel.y
                    )
                };
              }
            );

          if (targetIsLine) {
            const targetColour =
              String(
                targetDataset.borderColor ||
                '#777777'
              );

            const targetWidth =
              Number(
                targetDataset.borderWidth
              ) ||
              1;

            const startColour =
              lineSourceGroup
                ?.style
                ?.borderColour ||
              fadeCssColour(
                targetColour,
                0
              );

            const startWidth =
              Number(
                lineSourceGroup
                  ?.style
                  ?.borderWidth
              ) ||
              0;

            return {
              kind: 'line',

              transitionDataset: {
                ...targetDataset,
                data: startData,
                borderColor: startColour,
                backgroundColor: startColour,
                borderWidth: startWidth,
                pointHitRadius: 0
              },

              targetDataset,
              startData,
              targetData,
              startColour,
              targetColour,
              startWidth,
              targetWidth
            };
          }

          const targetStyles =
            targetData.map(
              (point, index) =>
                getTargetPointStyle(
                  targetDataset,
                  point,
                  index
                )
            );

          const startStyles =
            targetStyles.map(
              (targetStyle, index) => {
                const sourceStyle =
                  sourcePixels[index]?.style;

                if (sourceStyle) {
                  return sourceStyle;
                }

                return {
                  backgroundColour:
                    fadeCssColour(
                      targetStyle
                        .backgroundColour,
                      0
                    ),

                  borderColour:
                    fadeCssColour(
                      targetStyle
                        .borderColour,
                      0
                    ),

                  radius: 0,

                  pointStyle:
                    targetStyle.pointStyle
                };
              }
            );

          return {
            kind: 'point',

            transitionDataset: {
              ...targetDataset,
              data: startData,

              pointBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointHoverBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointHoverBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHoverRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHitRadius: 0,

              pointStyle:
                targetDataset.pointStyle ||
                'circle'
            },

            targetDataset,
            startData,
            targetData,
            startStyles,
            targetStyles
          };
        }
      );
    }

    function createDepartingLinePlans(
      geometry,
      targetDatasets
    ) {
      const targetRoles =
        new Set(
          targetDatasets
            .filter(
              isLineDataset
            )
            .map(
              dataset =>
                dataset.datasetRole
            )
        );

      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return geometry.lineGroups
        .filter(
          group =>
            !targetRoles.has(
              group.role
            )
        )
        .map(group => {
          const data =
            group.pixels.map(
              pixel => ({
                x:
                  xScale.getValueForPixel(
                    pixel.x
                  ),

                y:
                  yScale.getValueForPixel(
                    pixel.y
                  )
              })
            );

          const colour =
            group.style.borderColour ||
            '#777777';

          const width =
            Number(
              group.style.borderWidth
            ) ||
            1;

          return {
            dataset: {
              type: 'line',
              datasetRole: 'transitionGhost',
              data,
              parsing: false,
              showLine: true,
              clip: false,
              fill: false,
              order: 20,
              borderColor: colour,
              backgroundColor: colour,
              borderWidth: width,
              borderCapStyle: 'round',
              borderJoinStyle: 'round',
              pointRadius: 0,
              pointHoverRadius: 0,
              pointHitRadius: 0,
              tension: 0
            },

            colour,
            width
          };
        });
    }

    function animateViewMorph(
      model,
      duration
    ) {
      const geometry =
        captureRenderedGeometry();

      const previousXAxis =
        safeCaptureXAxisSnapshot(
          chart.scales.x,
          currentXAxisOptions
        );

      const xAxisChanges =
        getXAxisChangeMap(
          currentXAxisOptions,
          model.xScale
        );

      xAxisFade.from =
        previousXAxis;

      xAxisFade.progress = 0;
      xAxisFade.changes =
        xAxisChanges;

      xAxisFade.active = true;
      interactionLocked = true;
      viewMorphInProgress = true;

      chart.tooltip.setActiveElements(
        [],
        {
          x: 0,
          y: 0
        }
      );

      chart.options.animation.duration = 0;

      const fadingXAxisOptions =
        createFadingXAxisOptions(
          model.xScale
        );

      chart.options.scales.x =
        fadingXAxisOptions;

      chart.options.scales.y =
        createYAxisOptions();

      chart.data.datasets = [];
      chart.update('none');

      const plans =
        createTransitionPlans(
          model.datasets,
          geometry
        );

      const departingLinePlans =
        createDepartingLinePlans(
          geometry,
          model.datasets
        );

      chart.data.datasets = [
        ...plans.map(
          plan =>
            plan.transitionDataset
        ),

        ...departingLinePlans.map(
          plan =>
            plan.dataset
        )
      ];

      chart.update('none');

      runAnimation({
        duration,
        easing: easeInOutCubic,

        onFrame(progress) {
          xAxisFade.progress = progress;

          plans.forEach(
            (plan, datasetIndex) => {
              const dataset =
                chart.data.datasets[
                  datasetIndex
                ];

              dataset.data =
                plan.targetData.map(
                  (
                    targetPoint,
                    pointIndex
                  ) => {
                    const startPoint =
                      plan.startData[
                        pointIndex
                      ] ||
                      targetPoint;

                    return {
                      ...targetPoint,

                      x:
                        startPoint.x +
                        (
                          targetPoint.x -
                          startPoint.x
                        ) *
                        progress,

                      y:
                        startPoint.y +
                        (
                          targetPoint.y -
                          startPoint.y
                        ) *
                        progress
                    };
                  }
                );

              if (plan.kind === 'line') {
                dataset.borderColor =
                  interpolateCssColour(
                    plan.startColour,
                    plan.targetColour,
                    progress
                  );

                dataset.backgroundColor =
                  dataset.borderColor;

                dataset.borderWidth =
                  plan.startWidth +
                  (
                    plan.targetWidth -
                    plan.startWidth
                  ) *
                  progress;

                return;
              }

              dataset.pointBackgroundColor =
                plan.startStyles.map(
                  (
                    startStyle,
                    pointIndex
                  ) =>
                    interpolateCssColour(
                      startStyle
                        .backgroundColour,

                      plan.targetStyles[
                        pointIndex
                      ].backgroundColour,

                      progress
                    )
                );

              dataset.pointHoverBackgroundColor =
                dataset.pointBackgroundColor;

              dataset.pointBorderColor =
                plan.startStyles.map(
                  (
                    startStyle,
                    pointIndex
                  ) =>
                    interpolateCssColour(
                      startStyle
                        .borderColour,

                      plan.targetStyles[
                        pointIndex
                      ].borderColour,

                      progress
                    )
                );

              dataset.pointHoverBorderColor =
                dataset.pointBorderColor;

              dataset.pointRadius =
                plan.startStyles.map(
                  (
                    startStyle,
                    pointIndex
                  ) =>
                    startStyle.radius +
                    (
                      plan.targetStyles[
                        pointIndex
                      ].radius -
                      startStyle.radius
                    ) *
                    progress
                );

              dataset.pointHoverRadius =
                dataset.pointRadius;
            }
          );

          departingLinePlans.forEach(
            (plan, ghostIndex) => {
              const dataset =
                chart.data.datasets[
                  plans.length +
                  ghostIndex
                ];

              dataset.borderColor =
                fadeCssColour(
                  plan.colour,
                  1 - progress
                );

              dataset.backgroundColor =
                dataset.borderColor;

              dataset.borderWidth =
                plan.width *
                (1 - progress);
            }
          );

          chart.update('none');
        },

        onComplete() {
          xAxisFade.active = false;
          xAxisFade.progress = 1;
          xAxisFade.from = null;

          xAxisFade.changes = {
            ticks: false,
            labels: false,
            title: false,
            border: false
          };

          currentXAxisOptions =
            model.xScale;

          chart.options.scales.x =
            model.xScale;

          chart.data.datasets =
            model.datasets;

          interactionLocked = false;
          viewMorphInProgress = false;

          chart.update('none');
          updateReaggregateButton();
        }
      });
    }

    function createChart() {
      const model =
        buildViewModel(
          activeView
        );

      currentXAxisOptions =
        model.xScale;

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: 'scatter',

          data: {
            datasets: model.datasets
          },

          options: {
            responsive: true,
            maintainAspectRatio: false,
            resizeDelay: 0,

            devicePixelRatio: Math.min(
              window.devicePixelRatio || 1,
              3
            ),

            animation: {
              duration: 0
            },

            transitions: {
              resize: {
                animation: {
                  duration: 0
                }
              },

              active: {
                animation: {
                  duration: 170,
                  easing: 'easeOutCubic'
                }
              }
            },

            layout: {
              autoPadding: false,

              padding: {
                top: 4,
                right: 4,
                bottom: 0,
                left: 0
              }
            },

            interaction: {
              mode: 'nearest',
              axis: 'xy',
              intersect: true,
              includeInvisible: false
            },

            onHover:
              handleChartHover,

            onClick:
              handleChartClick,

            plugins: {
              legend: {
                display: false
              },

              tooltip: {
                enabled: true,
                mode: 'nearest',
                intersect: true,
                displayColors: false,

                backgroundColor:
                  '#ffffff',

                titleColor:
                  '#151515',

                bodyColor:
                  '#69718a',

                borderColor:
                  '#e8eaf0',

                borderWidth: 1,
                cornerRadius: 4,
                padding: 9,

                titleFont: {
                  family: 'Lato',
                  size: 12,
                  weight: '700'
                },

                bodyFont: {
                  family: 'Lato',
                  size: 11,
                  weight: '400'
                },

                filter() {
                  return !interactionLocked;
                },

                callbacks: {
                  title(items) {
                    return tooltipTitle(
                      items?.[0]
                    );
                  },

                  label(item) {
                    return tooltipLabel(
                      item
                    );
                  }
                }
              }
            },

            scales: {
              x: model.xScale,
              y: createYAxisOptions()
            }
          },

          plugins: [
            xAxisFadePlugin,
            variableAxisTickPlugin,
            bubbleLabelPlugin
          ]
        }
      );

      updateLegend(
        model.legendItems,
        false
      );

      updateChartNote(
        model.note
      );
    }

    function applyView(
      nextView,
      animate = true
    ) {
      if (
        !chart ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      activeView = nextView;
      lastBubbleClick = '';
      lastBubbleClickAt = 0;

      const model =
        buildViewModel(
          activeView
        );

      fadeTextChange(
        chartHeadingDetail,
        VIEW_CONFIG[
          activeView
        ]
      );

      updateActiveTab();

      updateLegend(
        model.legendItems,
        animate
      );

      updateChartNote(
        model.note
      );

      updateReaggregateButton();

      if (!animate) {
        currentXAxisOptions =
          model.xScale;

        chart.options.animation.duration = 0;

        chart.data.datasets =
          model.datasets;

        chart.options.scales.x =
          model.xScale;

        chart.options.scales.y =
          createYAxisOptions();

        chart.update('none');
        return;
      }

      animateViewMorph(
        model,
        CONFIG.transitionMs
      );
    }

    function requestViewSwitch(nextView) {
      if (
        nextView === activeView ||
        interactionLocked ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      const currentStore =
        bubbleStores[
          activeView
        ];

      if (
        currentStore?.splitKeys.size
      ) {
        reaggregate(() => {
          applyView(
            nextView,
            true
          );
        });

        return;
      }

      applyView(
        nextView,
        true
      );
    }

    function appendLegendItem(
      colour,
      label,
      markerType = 'square'
    ) {
      const item =
        document.createElement(
          'span'
        );

      item.className =
        'legend-item';

      const marker =
        document.createElement(
          'span'
        );

      marker.className =
        markerType === 'line'
          ? 'legend-line'
          : markerType === 'bubble'
            ? 'legend-bubble'
            : 'legend-square';

      marker.style.background =
        colour;

      if (
        markerType === 'square'
      ) {
        marker.style.borderColor =
          colour;
      }

      const text =
        document.createElement(
          'span'
        );

      text.textContent =
        label;

      item.appendChild(
        marker
      );

      item.appendChild(
        text
      );

      chartLegend.appendChild(
        item
      );
    }

    function updateLegendScrollControls() {
      const maximumScroll =
        chartLegend.scrollWidth -
        chartLegend.clientWidth;

      legendScrollLeft.classList.toggle(
        'is-hidden',
        maximumScroll <= 2 ||
        chartLegend.scrollLeft <= 2
      );

      legendScrollRight.classList.toggle(
        'is-hidden',
        maximumScroll <= 2 ||
        chartLegend.scrollLeft >=
          maximumScroll - 2
      );
    }

    function renderLegendItems(items) {
      chartLegend.textContent = '';
      chartLegend.scrollLeft = 0;

      items.forEach(item => {
        appendLegendItem(
          item.colour,
          item.label,
          item.markerType
        );
      });

      requestAnimationFrame(
        updateLegendScrollControls
      );
    }

    function updateLegend(
      items,
      animate = true
    ) {
      const signature =
        JSON.stringify(items);

      if (
        signature ===
        currentLegendSignature
      ) {
        return;
      }

      const token =
        ++legendAnimationToken;

      chartLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        !animate ||
        reduceMotion ||
        !chartLegend.animate
      ) {
        renderLegendItems(items);

        currentLegendSignature =
          signature;

        chartLegend.style.opacity =
          '';

        return;
      }

      const fadeOut =
        chartLegend.animate(
          [
            {
              opacity: 1
            },

            {
              opacity: 0
            }
          ],
          {
            duration: 170,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      fadeOut.finished
        .then(() => {
          if (
            token !==
            legendAnimationToken
          ) {
            return;
          }

          fadeOut.cancel();

          renderLegendItems(
            items
          );

          currentLegendSignature =
            signature;

          const fadeIn =
            chartLegend.animate(
              [
                {
                  opacity: 0
                },

                {
                  opacity: 1
                }
              ],
              {
                duration: 270,

                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );

          fadeIn.finished
            .then(
              () =>
                fadeIn.cancel()
            )
            .catch(
              () => {}
            );
        })
        .catch(() => {
          if (
            token !==
            legendAnimationToken
          ) {
            return;
          }

          renderLegendItems(
            items
          );

          currentLegendSignature =
            signature;
        });
    }

    function updateChartNote(note) {
      chartNote.textContent =
        note || '';

      chartNote.classList.toggle(
        'is-hidden',
        !note
      );
    }

    function updateTabScrollHints() {
      if (
        !tabList ||
        !tabScrollShell
      ) {
        return;
      }

      const maximumScrollLeft =
        Math.max(
          0,
          tabList.scrollWidth -
          tabList.clientWidth
        );

      const tolerance = 2;

      tabScrollShell.classList.toggle(
        'can-scroll-left',
        tabList.scrollLeft >
          tolerance
      );

      tabScrollShell.classList.toggle(
        'can-scroll-right',
        tabList.scrollLeft <
          maximumScrollLeft -
          tolerance
      );
    }

    function updateTabIndicator(
      animate = true
    ) {
      const selectedTab =
        tabByView.get(
          activeView
        );

      if (
        !tabList ||
        !selectedTab
      ) {
        return;
      }

      if (!animate) {
        tabList.classList.add(
          'is-positioning'
        );
      }

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${selectedTab.offsetLeft}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${selectedTab.offsetWidth}px`
      );

      if (animate) {
        const targetScrollLeft =
          selectedTab.offsetLeft -
          (
            tabList.clientWidth -
            selectedTab.offsetWidth
          ) /
          2;

        tabList.scrollTo({
          left:
            Math.max(
              0,
              targetScrollLeft
            ),

          behavior:
            'smooth'
        });
      } else {
        requestAnimationFrame(() => {
          tabList.classList.remove(
            'is-positioning'
          );
        });
      }

      requestAnimationFrame(
        updateTabScrollHints
      );
    }

    function updateActiveTab() {
      chartTabs.forEach(tab => {
        const isActive =
          tab.dataset.view ===
          activeView;

        tab.classList.toggle(
          'is-active',
          isActive
        );

        tab.setAttribute(
          'aria-selected',
          String(isActive)
        );
      });

      updateTabIndicator(true);
    }

    function fadeTextChange(
      element,
      nextText
    ) {
      if (
        !element ||
        element.textContent === nextText
      ) {
        return;
      }

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        reduceMotion ||
        !element.animate
      ) {
        element.textContent =
          nextText;

        return;
      }

      const fadeOut =
        element.animate(
          [
            {
              opacity: 1
            },

            {
              opacity: 0
            }
          ],
          {
            duration: 170,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      fadeOut.finished
        .then(() => {
          fadeOut.cancel();

          element.textContent =
            nextText;

          const fadeIn =
            element.animate(
              [
                {
                  opacity: 0
                },

                {
                  opacity: 1
                }
              ],
              {
                duration: 260,

                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );

          fadeIn.finished
            .then(
              () =>
                fadeIn.cancel()
            )
            .catch(
              () => {}
            );
        })
        .catch(() => {
          element.textContent =
            nextText;
        });
    }

    function updateReaggregateButton() {
      const store =
        bubbleStores[
          activeView
        ];

      const shouldShow = Boolean(
        store &&
        (
          store.splitKeys.size ||
          store.mergingKeys.size
        )
      );

      reaggregateButton.classList.toggle(
        'is-hidden',
        !shouldShow
      );

      reaggregateButton.setAttribute(
        'aria-hidden',
        String(!shouldShow)
      );

      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;

      reaggregateButton.disabled =
        interactionLocked;
    }

    function rawBubblePoints(
      view,
      categoryKey
    ) {
      const store =
        bubbleStores[view];

      const aggregate =
        store.aggregates.find(
          item =>
            item.categoryKey ===
            categoryKey
        );

      const categoryRows =
        store.rowsByKey.get(
          categoryKey
        ) ||
        [];

      if (
        !aggregate ||
        !categoryRows.length
      ) {
        return [];
      }

      const grouped =
        new Map();

      categoryRows.forEach(row => {
        const key =
          String(row.fteSalary);

        if (!grouped.has(key)) {
          grouped.set(
            key,
            []
          );
        }

        grouped.get(key).push(
          row
        );
      });

      const points = [];

      grouped.forEach(groupRows => {
        const count =
          groupRows.length;

        const halfSpan = Math.min(
          9,

          Math.max(
            0,
            (count - 1) *
              0.8
          ),

          Math.max(
            0,

            Math.min(
              aggregate.x - 5,
              95 - aggregate.x
            )
          )
        );

        groupRows.forEach(
          (
            row,
            index
          ) => {
            const targetX =
              count === 1
                ? aggregate.x
                : aggregate.x -
                  halfSpan +
                  index /
                  (count - 1) *
                  halfSpan *
                  2;

            points.push({
              x: aggregate.x,
              y: aggregate.y,
              targetX,
              targetY: row.fteSalary,
              bubbleView: view,
              categoryKey,
              label: aggregate.label,
              fullName: aggregate.fullName,
              colour: aggregate.colour,
              statistics: aggregate.statistics,
              ...row
            });
          }
        );
      });

      return points;
    }

    function splitBubble(
      view,
      categoryKey
    ) {
      const store =
        bubbleStores[view];

      if (
        !chart ||
        activeView !== view ||
        interactionLocked ||
        store.splitKeys.has(
          categoryKey
        )
      ) {
        return;
      }

      const points =
        rawBubblePoints(
          view,
          categoryKey
        );

      if (!points.length) {
        return;
      }

      const shouldDim =
        store.splitKeys.size ===
        0;

      interactionLocked = true;

      store.splitKeys.add(
        categoryKey
      );

      store.splitProgress.set(
        categoryKey,
        0
      );

      points.forEach(point => {
        point.startX = point.x;
        point.startY = point.y;
      });

      store.rawPoints.push(
        ...points
      );

      chart.data.datasets[1].data =
        store.rawPoints;

      chart.update('none');
      updateReaggregateButton();

      runAnimation({
        duration:
          CONFIG.splitAnimationMs,

        easing:
          easeOutCubic,

        onFrame(progress) {
          store.splitProgress.set(
            categoryKey,
            progress
          );

          if (shouldDim) {
            store.dimProgress =
              progress;
          }

          points.forEach(point => {
            point.x =
              point.startX +
              (
                point.targetX -
                point.startX
              ) *
              progress;

            point.y =
              point.startY +
              (
                point.targetY -
                point.startY
              ) *
              progress;
          });

          chart.update('none');
        },

        onComplete() {
          points.forEach(point => {
            point.x = point.targetX;
            point.y = point.targetY;
          });

          store.splitProgress.delete(
            categoryKey
          );

          if (shouldDim) {
            store.dimProgress = 1;
          }

          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();
        }
      });
    }

    function reaggregate(
      callback = null
    ) {
      const store =
        bubbleStores[
          activeView
        ];

      if (
        !store ||
        !store.splitKeys.size ||
        interactionLocked ||
        !chart
      ) {
        return;
      }

      interactionLocked = true;
      store.mergeProgress = 0;

      store.splitKeys.forEach(
        key =>
          store.mergingKeys.add(
            key
          )
      );

      store.rawPoints.forEach(point => {
        const aggregate =
          store.aggregates.find(
            item =>
              item.categoryKey ===
              point.categoryKey
          );

        point.startX = point.x;
        point.startY = point.y;

        point.endX =
          aggregate?.x ??
          point.x;

        point.endY =
          aggregate?.y ??
          point.y;
      });

      chart.update('none');
      updateReaggregateButton();

      runAnimation({
        duration:
          CONFIG.mergeAnimationMs,

        easing:
          easeInOutCubic,

        onFrame(progress) {
          store.mergeProgress =
            progress;

          store.dimProgress =
            1 - progress;

          store.rawPoints.forEach(point => {
            point.x =
              point.startX +
              (
                point.endX -
                point.startX
              ) *
              progress;

            point.y =
              point.startY +
              (
                point.endY -
                point.startY
              ) *
              progress;
          });

          chart.update('none');
        },

        onComplete() {
          store.rawPoints = [];

          chart.data.datasets[1].data =
            store.rawPoints;

          store.splitKeys.clear();
          store.splitProgress.clear();
          store.mergingKeys.clear();
          store.mergeProgress = 0;
          store.dimProgress = 0;

          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();

          callback?.();
        }
      });
    }

    reaggregateButton.addEventListener(
      'click',
      () => {
        reaggregate();
      }
    );

    chartTabs.forEach(tab => {
      tab.addEventListener(
        'click',
        () => {
          requestViewSwitch(
            tab.dataset.view
          );
        }
      );
    });

    tabList.addEventListener(
      'scroll',
      updateTabScrollHints,
      {
        passive: true
      }
    );

    legendScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            -Math.max(
              110,
              legendViewport.clientWidth *
              0.72
            ),

          behavior: 'smooth'
        });
      }
    );

    legendScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        chartLegend.scrollBy({
          left:
            Math.max(
              110,
              legendViewport.clientWidth *
              0.72
            ),

          behavior: 'smooth'
        });
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      {
        passive: true
      }
    );

    chartCanvas.addEventListener(
      'contextmenu',
      event => {
        event.preventDefault();
      }
    );

    chartCanvas.addEventListener(
      'selectstart',
      event => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      'pointerdown',
      event => {
        if (
          !event.target.closest(
            '#permanentSalaryChart'
          ) &&
          chart
        ) {
          chart.tooltip.setActiveElements(
            [],
            {
              x: 0,
              y: 0
            }
          );

          chart.update('none');
        }
      }
    );

    function refreshResponsiveLayout() {
      if (
        responsiveLayoutFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveLayoutFrame
        );
      }

      responsiveLayoutFrame =
        requestAnimationFrame(() => {
          responsiveLayoutFrame =
            null;

          chart?.resize();
          updateTabIndicator(false);
          updateTabScrollHints();
          updateLegendScrollControls();
        });
    }

    let layoutResizeObserver = null;

    if ('ResizeObserver' in window) {
      layoutResizeObserver =
        new ResizeObserver(entries => {
          const hasUsableSize =
            entries.some(
              entry =>
                entry.contentRect.width >
                  1 &&
                entry.contentRect.height >
                  1
            );

          if (hasUsableSize) {
            refreshResponsiveLayout();
          }
        });

      layoutResizeObserver.observe(app);
      layoutResizeObserver.observe(chartShell);
    }

    window.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive: true
      }
    );

    window.visualViewport?.addEventListener(
      'resize',
      refreshResponsiveLayout,
      {
        passive: true
      }
    );

    window.addEventListener(
      'pageshow',
      refreshResponsiveLayout
    );

    document.addEventListener(
      'visibilitychange',
      () => {
        if (!document.hidden) {
          refreshResponsiveLayout();
        }
      }
    );

    if (document.fonts?.ready) {
      document.fonts.ready.then(
        refreshResponsiveLayout
      );
    }

    function setStatus(message = '') {
      statusElement.textContent =
        message;
    }

    function hideLoadingState() {
      app.classList.remove(
        'is-loading'
      );

      app.setAttribute(
        'aria-busy',
        'false'
      );

      loadingState.setAttribute(
        'aria-hidden',
        'true'
      );

      refreshResponsiveLayout();
    }

    async function loadDashboard() {
      try {
        setStatus();

        const sourceRows =
          await loadSheetRows();

        rows =
          normaliseRows(
            sourceRows
          );

        if (!rows.length) {
          throw new Error(
            'No valid FTE salary rows were found in columns A to W'
          );
        }

        rebuildBubbleStore('state');
        rebuildBubbleStore('employer');
        createChart();
        updateTabIndicator(false);
        hideLoadingState();
        setStatus();
      } catch (error) {
        console.error(error);
        hideLoadingState();

        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load permanent salary data'
          ).replace(
            /\.+$/,
            ''
          )
        );
      }
    }

    updateTabIndicator(false);
    loadDashboard();
  </script>
</body>
</html>
