        (dataset, datasetIndex) => {
          if (
            dataset.datasetRole !==
              'bubbleAggregate'
          ) {
            return;
          }

          const renderedPoints =
            chart
              .getDatasetMeta(
                datasetIndex
              )
              ?.data || [];

          renderedPoints.forEach(
            (element, index) => {
              if (
                !element ||
                typeof element.inRange !==
                  'function' ||
                !element.inRange(
                  x,
                  y,
                  true
                )
              ) {
                return;
              }

              const distance =
                Math.hypot(
                  x - element.x,
                  y - element.y
                );

              if (
                !nearestAggregate ||
                distance <
                  nearestAggregate.distance
              ) {
                nearestAggregate = {
                  datasetIndex,
                  index,
                  distance
                };
              }
            }
          );
        }
      );

      if (nearestAggregate) {
        return nearestAggregate;
      }

      return findNearestInteractiveLine(
        event
      );
    }

    function showSelectedTooltip(
      event,
      selectedElement
    ) {
      const renderedElement =
        chart
          .getDatasetMeta(
            selectedElement.datasetIndex
          )
          ?.data
          ?.[
            selectedElement.index
          ];

      chart.tooltip.setActiveElements(
        [
          {
            datasetIndex:
              selectedElement.datasetIndex,

            index:
              selectedElement.index
          }
        ],
        {
          x:
            Number.isFinite(event?.x)
              ? event.x
              : renderedElement?.x ?? 0,

          y:
            Number.isFinite(event?.y)
              ? event.y
              : renderedElement?.y ?? 0
        }
      );

      chart.update('none');
    }

    function showHoveredLineTooltip(
      event,
      selectedElement
    ) {
      if (
        !selectedElement ||
        !chart
      ) {
        return;
      }

      const dataset =
        chart.data.datasets[
          selectedElement.datasetIndex
        ];

      if (
        dataset?.datasetRole !==
          'regression' &&
        dataset?.datasetRole !==
          'categoryMedian' &&
        dataset?.datasetRole !==
          'bubbleAggregate' &&
        dataset?.datasetRole !==
          'bubbleRaw'
      ) {
        return;
      }

      const currentActive =
        chart.tooltip
          ?.getActiveElements
          ?.()
          ?.[0];

      if (
        currentActive?.datasetIndex ===
          selectedElement.datasetIndex &&
        currentActive?.index ===
          selectedElement.index
      ) {
        return;
      }

      showSelectedTooltip(
        event,
        selectedElement
      );
    }

    function handleChartHover(
      event,
      elements
    ) {
      if (
        !chart ||
        interactionLocked
      ) {
        if (chart) {
          chart.canvas.style.cursor =
            'default';
        }

        return;
      }

      const selectedElement =
        findRawBubbleElement(event) ||
        findPrioritySummaryElement(event) ||
        getInteractiveElement(elements);

      const dataset = selectedElement
        ? chart.data.datasets[
            selectedElement.datasetIndex
          ]
        : null;

      const raw = selectedElement
        ? dataset?.data?.[
            selectedElement.index
          ]
        : null;

      chart.canvas.style.cursor =
        dataset?.datasetRole ===
          'bubbleAggregate' &&
        raw &&
        !bubbleStores[
          raw.bubbleView
        ].splitKeys.has(
          raw.categoryKey
        )
          ? 'pointer'
          : selectedElement
            ? 'pointer'
            : 'default';

      if (
        selectedElement &&
        (
          dataset?.datasetRole ===
            'regression' ||
          dataset?.datasetRole ===
            'categoryMedian' ||
          dataset?.datasetRole ===
            'bubbleAggregate' ||
          dataset?.datasetRole ===
            'bubbleRaw'
        )
      ) {
        showHoveredLineTooltip(
          event,
          selectedElement
        );
      }
    }

    function handleChartClick(
      event,
      elements
    ) {
      if (
        !chart ||
        interactionLocked
      ) {
        return;
      }

      event?.native?.preventDefault?.();

      const selectedElement =
        findRawBubbleElement(event) ||
        findPrioritySummaryElement(event) ||
        getInteractiveElement(elements);

      if (!selectedElement) {
        chart.tooltip.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

        chart.update('none');
        return;
      }

      showSelectedTooltip(
        event,
        selectedElement
      );

      const dataset =
        chart.data.datasets[
          selectedElement.datasetIndex
        ];

      const raw =
        dataset?.data?.[
          selectedElement.index
        ];

      if (
        dataset?.datasetRole !==
          'bubbleAggregate' ||
        !raw ||
        bubbleStores[
          raw.bubbleView
        ].splitKeys.has(
          raw.categoryKey
        )
      ) {
        lastBubbleClick = '';
        lastBubbleClickAt = 0;
        return;
      }

      const clickedAt =
        performance.now();

      const key =
        `${raw.bubbleView}:${raw.categoryKey}`;

      const isSecondActivation =
        lastBubbleClick === key &&
        clickedAt -
          lastBubbleClickAt <=
          CONFIG.doubleActivationMs;

      if (isSecondActivation) {
        lastBubbleClick = '';
        lastBubbleClickAt = 0;

        chart.tooltip.setActiveElements(
          [],
          {
            x: 0,
            y: 0
          }
        );

        chart.update('none');

        splitBubble(
          raw.bubbleView,
          raw.categoryKey
        );

        return;
      }

      lastBubbleClick = key;
      lastBubbleClickAt = clickedAt;
    }

    function getTargetPointStyle(
      dataset,
      raw,
      index
    ) {
      const context = {
        chart,
        raw,
        dataIndex: index,
        dataset,
        datasetIndex: 0,
        type: 'data'
      };

      const backgroundColour =
        resolveScriptableValue(
          dataset.pointBackgroundColor,
          context,
          raw?.colour
            ? rgba(
                raw.colour,
                CONFIG.aggregateOpacity
              )
            : 'rgba(102, 0, 255, 0.20)'
        );

      const borderColour =
        resolveScriptableValue(
          dataset.pointBorderColor,
          context,
          backgroundColour
        );

      const radius = Number(
        resolveScriptableValue(
          dataset.pointRadius,
          context,
          CONFIG.pointRadius
        )
      );

      return {
        backgroundColour,
        borderColour,

        radius:
          Number.isFinite(radius)
            ? radius
            : CONFIG.pointRadius,

        pointStyle:
          resolveScriptableValue(
            dataset.pointStyle,
            context,
            'circle'
          )
      };
    }

    function captureRenderedGeometry() {
      const pointPixels = [];
      const lineGroups = [];

      if (!chart) {
        return {
          pointPixels,
          lineGroups
        };
      }

      chart.data.datasets.forEach(
        (dataset, datasetIndex) => {
          const metadata =
            chart.getDatasetMeta(
              datasetIndex
            );

          const renderedElements =
            metadata?.data || [];

          const data =
            dataset.data || [];

          const pixels =
            renderedElements
              .map((element, index) => {
                if (
                  !Number.isFinite(element?.x) ||
                  !Number.isFinite(element?.y)
                ) {
                  return null;
                }

                return {
                  x: element.x,
                  y: element.y,
                  raw: data[index] || {},
                  role: dataset.datasetRole,
                  datasetMetadata:
                    dataset.metadata || {},

                  style: {
                    backgroundColour:
                      element.options
                        ?.backgroundColor ||
                      element.options
                        ?.borderColor ||
                      'rgba(119, 119, 119, 0.35)',

                    borderColour:
                      element.options
                        ?.borderColor ||
                      element.options
                        ?.backgroundColor ||
                      'rgba(119, 119, 119, 0.35)',

                    radius:
                      Number(
                        element.options?.radius
                      ) ||
                      CONFIG.pointRadius,

                    pointStyle:
                      element.options
                        ?.pointStyle ||
                      'circle'
                  }
                };
              })
              .filter(Boolean);

          if (!pixels.length) {
            return;
          }

          if (
            isLineDataset(dataset) &&
            pixels.length > 1
          ) {
            lineGroups.push({
              role:
                dataset.datasetRole,

              pixels,

              metadata:
                dataset.metadata || {},

              style: {
                borderColour:
                  metadata
                    ?.dataset
                    ?.options
                    ?.borderColor ||
                  dataset.borderColor ||
                  '#777777',

                borderWidth:
                  Number(
                    metadata
                      ?.dataset
                      ?.options
                      ?.borderWidth
                  ) ||
                  Number(
                    dataset.borderWidth
                  ) ||
                  1
              }
            });
          } else {
            pointPixels.push(
              ...pixels
            );
          }
        }
      );

      return {
        pointPixels,
        lineGroups
      };
    }

    function samplePixel(
      sourcePixels,
      index,
      targetLength
    ) {
      if (!sourcePixels.length) {
        return null;
      }

      if (targetLength <= 1) {
        return sourcePixels[0];
      }

      const sourceIndex = Math.round(
        index *
        (
          sourcePixels.length - 1
        ) /
        Math.max(
          1,
          targetLength - 1
        )
      );

      return sourcePixels[
        sourceIndex
      ];
    }

    function findNearestPixel(
      targetPixel,
      candidates
    ) {
      if (!candidates.length) {
        return null;
      }

      let nearest =
        candidates[0];

      let nearestDistance =
        Infinity;

      candidates.forEach(candidate => {
        const distance = Math.hypot(
          targetPixel.x - candidate.x,
          targetPixel.y - candidate.y
        );

        if (distance < nearestDistance) {
          nearest = candidate;
          nearestDistance = distance;
        }
      });

      return nearest;
    }

    function choosePointStartPixel(
      targetRaw,
      targetPixel,
      geometry
    ) {
      const allPointPixels =
        geometry.pointPixels;

      if (!allPointPixels.length) {
        return findNearestPixel(
          targetPixel,
          geometry.lineGroups.flatMap(
            group => group.pixels
          )
        );
      }

      if (
        Number.isInteger(
          targetRaw?.sourceIndex
        )
      ) {
        const exactSource =
          allPointPixels.find(
            pixel =>
              pixel.raw?.sourceIndex ===
              targetRaw.sourceIndex
          );

        if (exactSource) {
          return exactSource;
        }
      }

      if (
        targetRaw?.bubbleView &&
        targetRaw?.categoryKey
      ) {
        const sameBubble =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.bubbleView ===
                targetRaw.bubbleView &&
              pixel.raw?.categoryKey ===
                targetRaw.categoryKey
          );

        if (sameBubble.length) {
          return findNearestPixel(
            targetPixel,
            sameBubble
          );
        }
      }

      if (targetRaw?.state) {
        const sameState =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.state ===
              targetRaw.state
          );

        if (sameState.length) {
          return findNearestPixel(
            targetPixel,
            sameState
          );
        }
      }

      if (targetRaw?.employerKey) {
        const sameEmployer =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.employerKey ===
              targetRaw.employerKey
          );

        if (sameEmployer.length) {
          return findNearestPixel(
            targetPixel,
            sameEmployer
          );
        }
      }

      if (targetRaw?.rurality) {
        const sameRurality =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.rurality ===
              targetRaw.rurality
          );

        if (sameRurality.length) {
          return findNearestPixel(
            targetPixel,
            sameRurality
          );
        }
      }

      if (targetRaw?.category) {
        const sameCategory =
          allPointPixels.filter(
            pixel =>
              pixel.raw?.category ===
              targetRaw.category
          );

        if (sameCategory.length) {
          return findNearestPixel(
            targetPixel,
            sameCategory
          );
        }
      }

      return findNearestPixel(
        targetPixel,
        allPointPixels
      );
    }

    function chooseLineSourceGroup(
      targetDataset,
      geometry
    ) {
      const sameRoleGroups =
        geometry.lineGroups.filter(
          group =>
            group.role ===
            targetDataset.datasetRole
        );

      if (sameRoleGroups.length) {
        const targetCategory =
          targetDataset
            .metadata
            ?.category;

        const exactCategory =
          sameRoleGroups.find(
            group =>
              targetCategory &&
              group.metadata?.category ===
              targetCategory
          );

        if (exactCategory) {
          return exactCategory;
        }

        const targetMedian = Number(
          targetDataset
            .metadata
            ?.statistics
            ?.median
        );

        if (Number.isFinite(targetMedian)) {
          return sameRoleGroups
            .slice()
            .sort(
              (first, second) =>
                Math.abs(
                  Number(
                    first
                      .metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                ) -
                Math.abs(
                  Number(
                    second
                      .metadata
                      ?.statistics
                      ?.median
                  ) -
                  targetMedian
                )
            )[0];
        }

        return sameRoleGroups[0];
      }

      return {
        role: 'points',
        pixels: geometry.pointPixels,
        metadata: {},

        style: {
          borderColour:
            'rgba(119, 119, 119, 0)',

          borderWidth: 0
        }
      };
    }

    function createTransitionPlans(
      targetDatasets,
      geometry
    ) {
      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return targetDatasets.map(
        targetDataset => {
          const targetData =
            (
              targetDataset.data || []
            ).map(point => ({
              ...point
            }));

          const targetIsLine =
            isLineDataset(
              targetDataset
            );

          const lineSourceGroup =
            targetIsLine
              ? chooseLineSourceGroup(
                  targetDataset,
                  geometry
                )
              : null;

          const sourcePixels = [];

          const startData =
            targetData.map(
              (targetPoint, index) => {
                const targetPixel = {
                  x:
                    xScale.getPixelForValue(
                      targetPoint.x
                    ),

                  y:
                    yScale.getPixelForValue(
                      targetPoint.y
                    )
                };

                const sourcePixel =
                  targetIsLine
                    ? samplePixel(
                        lineSourceGroup
                          ?.pixels || [],
                        index,
                        targetData.length
                      )
                    : choosePointStartPixel(
                        targetPoint,
                        targetPixel,
                        geometry
                      );

                sourcePixels.push(
                  sourcePixel
                );

                if (!sourcePixel) {
                  return {
                    ...targetPoint
                  };
                }

                return {
                  ...targetPoint,

                  x:
                    xScale.getValueForPixel(
                      sourcePixel.x
                    ),

                  y:
                    yScale.getValueForPixel(
                      sourcePixel.y
                    )
                };
              }
            );

          if (targetIsLine) {
            const targetColour =
              String(
                targetDataset.borderColor ||
                '#777777'
              );

            const targetWidth =
              Number(
                targetDataset.borderWidth
              ) ||
              1;

            const startColour =
              lineSourceGroup
                ?.style
                ?.borderColour ||
              fadeCssColour(
                targetColour,
                0
              );

            const startWidth =
              Number(
                lineSourceGroup
                  ?.style
                  ?.borderWidth
              ) ||
              0;

            return {
              kind: 'line',

              transitionDataset: {
                ...targetDataset,
                data: startData,
                borderColor: startColour,
                backgroundColor: startColour,
                borderWidth: startWidth,
                pointHitRadius: 0
              },

              targetDataset,
              startData,
              targetData,
              startColour,
              targetColour,
              startWidth,
              targetWidth
            };
          }

          const targetStyles =
            targetData.map(
              (point, index) =>
                getTargetPointStyle(
                  targetDataset,
                  point,
                  index
                )
            );

          const startStyles =
            targetStyles.map(
              (targetStyle, index) => {
                const sourceStyle =
                  sourcePixels[index]?.style;

                if (sourceStyle) {
                  return sourceStyle;
                }

                return {
                  backgroundColour:
                    fadeCssColour(
                      targetStyle
                        .backgroundColour,
                      0
                    ),

                  borderColour:
                    fadeCssColour(
                      targetStyle
                        .borderColour,
                      0
                    ),

                  radius: 0,

                  pointStyle:
                    targetStyle.pointStyle
                };
              }
            );

          return {
            kind: 'point',

            transitionDataset: {
              ...targetDataset,
              data: startData,

              pointBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointHoverBackgroundColor:
                startStyles.map(
                  style =>
                    style.backgroundColour
                ),

              pointBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointHoverBorderColor:
                startStyles.map(
                  style =>
                    style.borderColour
                ),

              pointRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHoverRadius:
                startStyles.map(
                  style =>
                    style.radius
                ),

              pointHitRadius: 0,

              pointStyle:
                targetDataset.pointStyle ||
                'circle'
            },

            targetDataset,
            startData,
            targetData,
            startStyles,
            targetStyles
          };
        }
      );
    }

    function createDepartingLinePlans(
      geometry,
      targetDatasets
    ) {
      const targetRoles =
        new Set(
          targetDatasets
            .filter(
              isLineDataset
            )
            .map(
              dataset =>
                dataset.datasetRole
            )
        );

      const xScale =
        chart.scales.x;

      const yScale =
        chart.scales.y;

      return geometry.lineGroups
        .filter(
          group =>
            !targetRoles.has(
              group.role
            )
        )
        .map(group => {
          const data =
            group.pixels.map(
              pixel => ({
                x:
                  xScale.getValueForPixel(
                    pixel.x
                  ),

                y:
                  yScale.getValueForPixel(
                    pixel.y
                  )
              })
            );

          const colour =
            group.style.borderColour ||
            '#777777';

          const width =
            Number(
              group.style.borderWidth
            ) ||
            1;

          return {
            dataset: {
              type: 'line',
              datasetRole: 'transitionGhost',
              data,
              parsing: false,
              showLine: true,
              clip: false,
              fill: false,
              order: 20,
              borderColor: colour,
              backgroundColor: colour,
              borderWidth: width,
              borderCapStyle: 'round',
              borderJoinStyle: 'round',
              pointRadius: 0,
              pointHoverRadius: 0,
              pointHitRadius: 0,
              tension: 0
            },

            colour,
            width
          };
        });
    }

    function animateViewMorph(
      model,
      duration
    ) {
      PFFCharts.runViewMorph({
        chart,
        model,
        duration,
        xAxisFade,
        currentXAxisOptions,
        captureRenderedGeometry,
        captureXAxisSnapshot:
          safeCaptureXAxisSnapshot,
        getXAxisChangeMap,
        createFadingXAxisOptions,
        createYAxisOptions,
        createTransitionPlans,
        createDepartingLinePlans,
        animationController,
        setCurrentXAxisOptions(value) {
          currentXAxisOptions =
            value;
        },
        setInteractionLocked(value) {
          interactionLocked =
            value;
        },
        setViewMorphInProgress(value) {
          viewMorphInProgress =
            value;
        },
        onComplete() {
          updateReaggregateButton();
        }
      });
    }

    function createChart() {
      const model =
        buildViewModel(
          activeView
        );

      currentXAxisOptions =
        model.xScale;

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: 'scatter',

          data: {
            datasets: model.datasets
          },

          options: {
            responsive: true,
            maintainAspectRatio: false,
            resizeDelay: 0,

            devicePixelRatio: Math.min(
              window.devicePixelRatio || 1,
              3
            ),

            animation: {
              duration: 0
            },

            transitions: {
              resize: {
                animation: {
                  duration: 0
                }
              },

              active: {
                animation: {
                  duration: 170,
                  easing: 'easeOutCubic'
                }
              }
            },

            layout: {
              autoPadding: false,

              padding: {
                top: 4,
                right: 4,
                bottom: 0,
                left: 0
              }
            },

            interaction: {
              mode: 'nearest',
              axis: 'xy',
              intersect: true,
              includeInvisible: false
            },

            onHover:
              handleChartHover,

            onClick:
              handleChartClick,

            plugins: {
              legend: {
                display: false
              },

              tooltip:
                PFFCharts.tooltipOptions({
                  filter() {
                    return !interactionLocked;
                  },

                  callbacks: {
                    title(items) {
                      return tooltipTitle(
                        items?.[0]
                      );
                    },

                    label(item) {
                      return tooltipLabel(
                        item
                      );
                    }
                  }
                })
            },

            scales: {
              x: model.xScale,
              y: createYAxisOptions()
            }
          },

          plugins: [
            xAxisFadePlugin,
            variableAxisTickPlugin,
            bubbleLabelPlugin
          ]
        }
      );

      updateLegend(
        model.legendItems,
        false
      );

      updateChartNote(
        model.note
      );
    }

    function applyView(
      nextView,
      animate = true
    ) {
      if (
        !chart ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      activeView = nextView;
      lastBubbleClick = '';
      lastBubbleClickAt = 0;

      const model =
        buildViewModel(
          activeView
        );

      PFF.animateTextChange(
        chartHeadingDetail,
        VIEW_CONFIG[
          activeView
        ]
      );

      tabsController?.set(
        activeView,
        {
          notify: false
        }
      );

      updateLegend(
        model.legendItems,
        animate
      );

      updateChartNote(
        model.note
      );

      updateReaggregateButton();

      if (!animate) {
        currentXAxisOptions =
          model.xScale;

        chart.options.animation.duration = 0;

        chart.data.datasets =
          model.datasets;

        chart.options.scales.x =
          model.xScale;

        chart.options.scales.y =
          createYAxisOptions();

        chart.update('none');
        return;
      }

      animateViewMorph(
        model,
        CONFIG.transitionMs
      );
    }

    function requestViewSwitch(nextView) {
      if (
        nextView === activeView ||
        interactionLocked ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      const currentStore =
        bubbleStores[
          activeView
        ];

      if (
        currentStore?.splitKeys.size
      ) {
        reaggregate(() => {
          applyView(
            nextView,
            true
          );
        });

        return;
      }

      applyView(
        nextView,
        true
      );
    }

    function updateLegend(
      items,
      animate = true
    ) {
      legendController?.update(
        items,
        animate
      );
    }

    function updateChartNote(note) {
      chartNote.textContent =
        note || '';

      chartNote.classList.toggle(
        'is-hidden',
        !note
      );
    }

    function updateReaggregateButton() {
      const store =
        bubbleStores[
          activeView
        ];

      const shouldShow = Boolean(
        store &&
        (
          store.splitKeys.size ||
          store.mergingKeys.size
        )
      );

      reaggregateButton.classList.toggle(
        'is-hidden',
        !shouldShow
      );

      reaggregateButton.setAttribute(
        'aria-hidden',
        String(!shouldShow)
      );

      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;

      reaggregateButton.disabled =
        interactionLocked;
    }

    function rawBubblePoints(
      view,
      categoryKey
    ) {
      const store =
        bubbleStores[view];

      const aggregate =
        store.aggregates.find(
          item =>
            item.categoryKey ===
            categoryKey
        );

      const categoryRows =
        store.rowsByKey.get(
          categoryKey
        ) ||
        [];

      if (
        !aggregate ||
        !categoryRows.length
      ) {
        return [];
      }

      const grouped =
        new Map();

      categoryRows.forEach(row => {
        const key =
          String(row.fteSalary);

        if (!grouped.has(key)) {
          grouped.set(
            key,
            []
          );
        }

        grouped.get(key).push(
          row
        );
      });

      const points = [];

      grouped.forEach(groupRows => {
        const count =
          groupRows.length;

        const halfSpan = Math.min(
          9,

          Math.max(
            0,
            (count - 1) *
              0.8
          ),

          Math.max(
            0,

            Math.min(
              aggregate.x - 5,
              95 - aggregate.x
            )
          )
        );

        groupRows.forEach(
          (
            row,
            index
          ) => {
            const targetX =
              count === 1
                ? aggregate.x
                : aggregate.x -
                  halfSpan +
                  index /
                  (count - 1) *
                  halfSpan *
                  2;

            points.push({
              x: aggregate.x,
              y: aggregate.y,
              targetX,
              targetY: row.fteSalary,
              bubbleView: view,
              categoryKey,
              label: aggregate.label,
              fullName: aggregate.fullName,
              colour: aggregate.colour,
              statistics: aggregate.statistics,
              ...row
            });
          }
        );
      });

      return points;
    }

    function splitBubble(
      view,
      categoryKey
    ) {
      const store =
        bubbleStores[view];

      if (
        !chart ||
        activeView !== view ||
        interactionLocked ||
        store.splitKeys.has(
          categoryKey
        )
      ) {
        return;
      }

      const points =
        rawBubblePoints(
          view,
          categoryKey
        );

      if (!points.length) {
        return;
      }

      const shouldDim =
        store.splitKeys.size ===
        0;

      interactionLocked = true;

      store.splitKeys.add(
        categoryKey
      );

      store.splitProgress.set(
        categoryKey,
        0
      );

      points.forEach(point => {
        point.startX = point.x;
        point.startY = point.y;
      });

      store.rawPoints.push(
        ...points
      );

      chart.data.datasets[1].data =
        store.rawPoints;

      chart.update('none');
      updateReaggregateButton();

      animationController.run({
        duration:
          CONFIG.splitAnimationMs,

        easing:
          easeOutCubic,

        onFrame(progress) {
          store.splitProgress.set(
            categoryKey,
            progress
          );

          if (shouldDim) {
            store.dimProgress =
              progress;
          }

          points.forEach(point => {
            point.x =
              point.startX +
              (
                point.targetX -
                point.startX
              ) *
              progress;

            point.y =
              point.startY +
              (
                point.targetY -
                point.startY
              ) *
              progress;
          });

          chart.update('none');
        },

        onComplete() {
          points.forEach(point => {
            point.x = point.targetX;
            point.y = point.targetY;
          });

          store.splitProgress.delete(
            categoryKey
          );

          if (shouldDim) {
            store.dimProgress = 1;
          }

          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();
        }
      });
    }

    function reaggregate(
      callback = null
    ) {
      const store =
        bubbleStores[
          activeView
        ];

      if (
        !store ||
        !store.splitKeys.size ||
        interactionLocked ||
        !chart
      ) {
        return;
      }

      interactionLocked = true;
      store.mergeProgress = 0;

      store.splitKeys.forEach(
        key =>
          store.mergingKeys.add(
            key
          )
      );

      store.rawPoints.forEach(point => {
        const aggregate =
          store.aggregates.find(
            item =>
              item.categoryKey ===
              point.categoryKey
          );

        point.startX = point.x;
        point.startY = point.y;

        point.endX =
          aggregate?.x ??
          point.x;

        point.endY =
          aggregate?.y ??
          point.y;
      });

      chart.update('none');
      updateReaggregateButton();

      animationController.run({
        duration:
          CONFIG.mergeAnimationMs,

        easing:
          easeInOutCubic,

        onFrame(progress) {
          store.mergeProgress =
            progress;

          store.dimProgress =
            1 - progress;

          store.rawPoints.forEach(point => {
            point.x =
              point.startX +
              (
                point.endX -
                point.startX
              ) *
              progress;

            point.y =
              point.startY +
              (
                point.endY -
                point.startY
              ) *
              progress;
          });

          chart.update('none');
        },

        onComplete() {
          store.rawPoints = [];

          chart.data.datasets[1].data =
            store.rawPoints;

          store.splitKeys.clear();
          store.splitProgress.clear();
          store.mergingKeys.clear();
          store.mergeProgress = 0;
          store.dimProgress = 0;

          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();

          callback?.();
        }
      });
    }

    reaggregateButton.addEventListener(
      'click',
      () => {
        reaggregate();
      }
    );

    tabsController =
      PFF.setupTabs({
        tabList,
        tabs:
          chartTabs,
        scroller:
          tabList,
        leftButton:
          tabScrollLeft,
        rightButton:
          tabScrollRight,
        valueAttribute:
          'view',
        initialValue:
          activeView,
        controlled:
          true,
        onRequest(nextView) {
          requestViewSwitch(
            nextView
          );
        }
      });

    headingScroller =
      PFF.setupScrollableRegion({
        scroller:
          headingScrollViewport,
        leftButton:
          headingScrollLeft,
        rightButton:
          headingScrollRight
      });

    legendController =
      PFFCharts.setupDisplayLegend({
        legend:
          chartLegend,
        leftButton:
          legendScrollLeft,
        rightButton:
          legendScrollRight
      });

    interactionsController =
      PFFCharts.setupChartInteractions({
        canvas:
          chartCanvas,
        getChart() {
          return chart;
        }
      });

    responsiveController =
      PFFCharts.createResponsiveController({
        getChart() {
          return chart;
        },
        observe: [
          app,
          chartShell
        ],
        applyResponsiveChartOptions:
          false,
        onRefresh() {
          tabsController?.update();
          headingScroller?.update();
          legendController?.refresh();
        }
      });

    async function loadDashboard() {
      await PFF.initialiseApp({
        app,
        status:
          statusElement,
        forceCached:
          FORCE_CACHED_DATA,
        cacheKey:
          CONFIG.localCacheKey,
        minRows:
          1,
        dataSourceOptions: {
          indicator:
            dataSourceIndicator,
          text:
            dataSourceText
        },
        loadLive() {
          return PFFCharts.loadGVizSheet({
            sheetId:
              CONFIG.sheetId,
            sheetName:
              CONFIG.sheetName,
            range:
              CONFIG.range,
            headers:
              '1',
            query:
              'select *',
            timeoutMs:
              CONFIG.fetchTimeoutMs
          });
        },
        parseLive(table) {
          const parsedRows =
            normaliseRows(
              table?.rows || []
            );

          if (!parsedRows.length) {
            throw new Error(
              'No valid FTE salary rows were found in columns A to W'
            );
          }

          return parsedRows;
        },
        loadRemoteCache() {
          return PFFCharts.loadAppsScriptCache({
            url:
              CACHE_WEB_APP_URL,
            appKey:
              CACHE_APP_KEY,
            timeoutMs:
              CACHE_FETCH_TIMEOUT_MS
          });
        },
        parseRemoteCache(response) {
          if (
            !response?.cachedAt ||
            Number.isNaN(
              Date.parse(
                response.cachedAt
              )
            )
          ) {
            throw new Error(
              'Cached permanent salary data have an invalid timestamp'
            );
          }

          const sourceRows =
            Array.isArray(
              response?.data?.rows
            )
              ? response.data.rows
              : [];

          const parsedRows =
            sourceRows
              .map(
                (row, sourceIndex) => ({
                  sourceIndex,
                  date:
                    parseDate(row?.[0]),
                  experience:
                    toNumber(row?.[1]),
                  rurality:
                    normaliseRurality(
                      row?.[2]
                    ),
                  state:
                    normaliseState(
                      row?.[3]
                    ),
                  employerKey:
                    normaliseEmployer(
                      row?.[4]
                    ),
                  fteSalary:
                    toNumber(row?.[5])
                })
              )
              .filter(
                row =>
                  Number.isFinite(
                    row.fteSalary
                  ) &&
                  row.fteSalary >=
                    CONFIG.minimumSalary &&
                  row.fteSalary <=
                    CONFIG.maximumSalary
              )
              .map(row => ({
                ...row,
                experience:
                  Number.isFinite(
                    row.experience
                  )
                    ? row.experience
                    : null
              }));

          if (!parsedRows.length) {
            throw new Error(
              'No valid cached FTE salary rows were found'
            );
          }

          return parsedRows;
        },
        onLiveError(error) {
          console.warn(
            'Live Google Sheets permanent salary data could not be used',
            error
          );
        },
        onRemoteCacheError(error) {
          console.warn(
            'Backend 1 permanent salary cache could not be used',
            error
          );
        },
        render(loaded) {
          rows =
            loaded.rows;

          rebuildBubbleStore(
            'state'
          );

          rebuildBubbleStore(
            'employer'
          );

          createChart();

          tabsController?.set(
            activeView,
            {
              animate: false,
              notify: false
            }
          );

          return chart;
        },
        onReady() {
          responsiveController?.refresh();
        },
        onError() {
          dataSourceIndicator.style.display =
            'none';
        },
        errorMessage:
          '⚠ Live, Backend 1 cached and browser-cached permanent salary data are currently unavailable'
      });
    }

    loadDashboard();
  </script>
</body>
