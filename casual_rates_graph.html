<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Casual Rates Data</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --trend-yellow: #f1c232;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;

      --state-nsw: #2db7f5;
      --state-qld: #7a0036;
      --state-act: #7b61ff;
      --state-vic: #2d3a8c;
      --state-sa: #f03a47;
      --state-nt: #c25e00;
      --state-wa: #000000;
      --state-tas: #22a36b;

      --rurality-mm1: #3f4851;
      --rurality-mm2: #4f1500;
      --rurality-mm3: #7e2800;
      --rurality-mm4: #a14216;
      --rurality-mm5: #c87452;
      --rurality-mm6: #e1b69a;
      --rurality-mm7: #f3e0d3;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      margin-inline: auto;
      padding: 7px 6px 0;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0% { opacity: 0; }
      12% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0% { opacity: 0; }
      20% { opacity: 0; }
      32% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0% { opacity: 0; }
      40% { opacity: 0; }
      52% { opacity: 1; }
      76% { opacity: 1; }
      87% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0% { opacity: 0.45; }
      52% { opacity: 0.78; }
      76% { opacity: 0.78; }
      87% { opacity: 0.45; }
      100% { opacity: 0.45; }
    }

    .module-top {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      pointer-events: none;
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        width 420ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, width;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: none;
    }

    .tab-scroll-arrow {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: none;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding-bottom: 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .tab-scroll-arrow-left {
      left: 0;
    }

    .tab-scroll-arrow-right {
      right: 0;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    .chart-heading-row {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      height: 31px;
      min-height: 31px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 4px 116px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
      will-change: opacity;
    }

    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;
      display: inline-flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--purple);
      font-size: 15px;
      line-height: 1;
    }

    .chart-options-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      padding: 0 0 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .legend-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 0 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 160ms ease;
    }

    .legend-scroll-button:hover {
      opacity: 1;
    }

    .legend-scroll-button.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .legend-square {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border: 1px solid transparent;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
    }

    .legend-bubble {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
    }

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -2px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .chart-note {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      max-width: min(230px, calc(100% - 80px));
      padding: 5px 7px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(105, 113, 138, 0.16);
      border-radius: 4px;
      font-size: 8.5px;
      line-height: 1.3;
      pointer-events: none;
    }

    .chart-note.is-hidden {
      display: none;
    }

    #casualChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 0;
      }

      .tab-scroll-arrow {
        display: inline-flex;
      }

      .tab-scroll-shell.can-scroll-left .tab-scroll-arrow-left,
      .tab-scroll-shell.can-scroll-right .tab-scroll-arrow-right {
        opacity: 0.72;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        height: 30px;
        min-height: 30px;
      }

      .chart-heading {
        padding-top: 4px;
        padding-right: 108px;
        font-size: 14px;
        line-height: 21px;
      }

      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .chart-note {
        max-width: min(205px, calc(100% - 68px));
        font-size: 8px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 100px;
        font-size: 13px;
      }

      .reaggregate-button {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading casual rate data"
      >
        <div class="cone-loader">
          <div class="cone blue" aria-hidden="true"></div>
          <div class="cone green" aria-hidden="true"></div>
          <div class="cone red" aria-hidden="true"></div>
        </div>

        <div class="loader-text">Loading casual rate data...</div>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div
            class="tab-list"
            role="tablist"
            aria-label="Casual rate views"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-view="experience"
              aria-selected="true"
            >
              Experience
            </button>
            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="rurality"
              aria-selected="false"
            >
              Rurality
            </button>
            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="state"
              aria-selected="false"
            >
              State
            </button>
            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="employer"
              aria-selected="false"
            >
              Employer
            </button>
            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="date"
              aria-selected="false"
            >
              Time
            </button>
          </div>

          <span
            class="tab-scroll-arrow tab-scroll-arrow-left"
            aria-hidden="true"
          >‹</span>

          <span
            class="tab-scroll-arrow tab-scroll-arrow-right"
            aria-hidden="true"
          >›</span>
        </div>

        <div class="live-data" aria-label="Live data">
          <span class="live-data-dot" aria-hidden="true"></span>
          <span>LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">
        <h2 id="chartHeading" class="chart-heading">
          <span class="chart-heading-fixed">Casual rates</span><span id="chartHeadingDetail" class="chart-heading-detail">by experience</span>
        </h2>

        <button
          id="reaggregateButton"
          class="reaggregate-button is-hidden"
          type="button"
          aria-hidden="true"
          tabindex="-1"
        >
          <span>Re-aggregate</span>
          <span class="reset-icon" aria-hidden="true">↻</span>
        </button>
      </div>

      <div class="chart-options-row">
        <div id="legendNav" class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"
          >
            &#8249;
          </button>

          <div id="legendViewport" class="legend-viewport">
            <div
              id="chartLegend"
              class="chart-legend"
              aria-label="Chart legend"
            ></div>
          </div>

          <button
            id="legendScrollRight"
            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >
            &#8250;
          </button>
        </div>
      </div>

      <div class="chart-shell">
        <aside id="chartNote" class="chart-note is-hidden" role="note"></aside>

        <canvas
          id="casualChart"
          aria-label="Casual rate chart"
          tabindex="-1"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    const CONFIG = {
      sheetId: '1UZizMV2CNlyNbKytN4QCSc4HcsKCx-PxOrboJyMCN1E',
      sheetName: 'Data',
      range: 'A:J',
      fetchTimeoutMs: 20000,

      transitionMs: 1050,
      splitAnimationMs: 820,
      mergeAnimationMs: 820,
      doubleActivationMs: 420,

      pointRadius: 2.7,
      pointHoverRadius: 4.4,
      regressionWidth: 3.6,

      pointOpacity: 0.20,
      pointHoverOpacity: 0.68,
      categoryPointOpacity: 0.20,
      categoryPointHoverOpacity: 0.68,

      aggregateOpacity: 0.91,
      aggregateHoverOpacity: 0.98,
      dimmedAggregateOpacity: 0.48,
      dimmedAggregateHoverOpacity: 0.60,
      rawPointRadius: 4,

      minimumRate: 0,
      maximumRate: 500
    };

    const VIEW_CONFIG = {
      experience: 'by experience',
      rurality: 'by rurality',
      state: 'by state',
      employer: 'by employer',
      date: 'over time'
    };

    const STATE_ORDER = ['NSW', 'QLD', 'VIC', 'ACT', 'SA', 'NT', 'WA', 'TAS'];

    const STATE_COLOURS = {
      NSW: '#2db7f5',
      QLD: '#7a0036',
      ACT: '#7b61ff',
      VIC: '#2d3a8c',
      SA: '#f03a47',
      NT: '#c25e00',
      WA: '#000000',
      TAS: '#22a36b'
    };

    const RURALITY_ORDER = ['MM1', 'MM2', 'MM3', 'MM4', 'MM5', 'MM6', 'MM7'];

    const RURALITY_COLOURS = {
      MM1: '#3f4851',
      MM2: '#4f1500',
      MM3: '#7e2800',
      MM4: '#a14216',
      MM5: '#c87452',
      MM6: '#e1b69a',
      MM7: '#f3e0d3'
    };

    const EMPLOYERS = [
      { key: 'toss', label: 'TOSS', fullName: 'The Optical Super Store', colour: '#ff2401', aliases: ['TOSS', 'The Optical Superstore', 'The Optical Super Store'] },
      { key: 'th', label: 'TH', fullName: "Teacher's Health", colour: '#007781', aliases: ['TH', 'THF', 'Teachers Health', 'Teachers Health Fund', "Teacher's Health", "Teacher's Health Fund", 'Teacher’s Health Fund'] },
      { key: 'costco', label: 'Costco', fullName: 'Costco Optical', colour: '#e32a36', aliases: ['Costco', 'Costco Optical'] },
      { key: 'ow', label: 'OW', fullName: 'Oscar Wylee', colour: '#f16c20', aliases: ['OW', 'Oscar Wylee'] },
      { key: 'bn', label: 'BN', fullName: 'Bailey Nelson', colour: '#002e5a', aliases: ['BN', 'Bailey Nelson'] },
      { key: '1001', label: '1001', fullName: '1001 Optometry', colour: '#000000', aliases: ['1001', '1001 Optometry'] },
      { key: 'cw', label: 'CW', fullName: 'Chemist Warehouse Optometry', colour: '#ea0f0f', aliases: ['CW', 'Chemist Warehouse', 'Chemist Warehouse Optometry', 'Chemist/Optometrist Warehouse'] },
      { key: 'indie', label: 'Indie', fullName: 'Independent', colour: '#5a3be7', aliases: ['Indie', 'Independent'] },
      { key: 'hcf', label: 'HCF', fullName: 'HCF Eyecare', colour: '#da1c5c', aliases: ['HCF', 'HCF Eyecare'] },
      { key: 'ophthal', label: 'Ophthal', fullName: 'Ophthalmologist', colour: '#ffb000', aliases: ['Ophthal', 'Ophthalmologist', 'Ophthal practice'] },

    function resolveAxisValue(value, context, fallback) {
      try {
        return typeof value === 'function'
          ? value(context)
          : value ?? fallback;
      } catch (_) {
        return fallback;
      }
    }

    function normaliseAxisPadding(value) {
      const numericValue =
        typeof value === 'number' ||
        typeof value === 'string'
          ? Number(value)
          : NaN;

      if (Number.isFinite(numericValue)) {
        return {
          top: numericValue,
          right: numericValue,
          bottom: numericValue,
          left: numericValue
        };
      }

      return {
        top: Number(value?.top) || 0,
        right: Number(value?.right) || 0,
        bottom: Number(value?.bottom) || 0,
        left: Number(value?.left) || 0
      };
    }

    function getAxisFont(
      fontOptions,
      fallbackSize = 10,
      fallbackWeight = '400'
    ) {
      const family =
        fontOptions?.family ||
        Chart.defaults.font.family ||
        "'Lato', sans-serif";

      const size = Number(fontOptions?.size) || fallbackSize;
      const weight = fontOptions?.weight || fallbackWeight;
      const style = fontOptions?.style ? `${fontOptions.style} ` : '';
      const configuredLineHeight = fontOptions?.lineHeight;
      let lineHeight = size * 1.2;

      if (typeof configuredLineHeight === 'string') {
        const text = configuredLineHeight.trim();
        const numericValue = parseFloat(text);

        if (Number.isFinite(numericValue)) {
          if (text.endsWith('px')) {
            lineHeight = numericValue;
          } else if (text.endsWith('%')) {
            lineHeight = size * numericValue / 100;
          } else {
            lineHeight = size * numericValue;
          }
        }
      } else if (Number.isFinite(Number(configuredLineHeight))) {
        lineHeight = size * Number(configuredLineHeight);
      }

      return {
        css: `${style}${weight} ${size}px ${family}`,
        lineHeight
      };
    }

    function captureXAxisSnapshot(
      scale,
      styleOptions = scale?.options
    ) {
      if (!scale || !styleOptions) {
        return null;
      }

      const tickOptions = styleOptions.ticks || {};
      const gridOptions = styleOptions.grid || {};
      const titleOptions = styleOptions.title || {};
      const tickPadding = Number(tickOptions.padding) || 0;

      const ticks = (scale.ticks || []).map((tick, index) => {
        const context =
          typeof scale.getContext === 'function'
            ? scale.getContext(index)
            : {
                chart,
                scale,
                tick,
                index,
                type: 'tick'
              };

        let label = tick.label;

        if (
          label === undefined &&
          typeof tickOptions.callback === 'function'
        ) {
          try {
            label = tickOptions.callback.call(
              scale,
              tick.value,
              index,
              scale.ticks
            );
          } catch (_) {
            label = tick.value;
          }
        }

        const labelLines = Array.isArray(label)
          ? label.map(line => String(line ?? ''))
          : [String(label ?? '')];

        const fontOptions = resolveAxisValue(
          tickOptions.font,
          context,
          tickOptions.font || {}
        );

        const font = getAxisFont(fontOptions, 10, '400');
        const tickLength = Number(
          resolveAxisValue(gridOptions.tickLength, context, 0)
        ) || 0;
        const tickWidth = Number(
          resolveAxisValue(gridOptions.tickWidth, context, 1)
        ) || 1;

        return {
          x: scale.getPixelForTick(index),
          axisY: scale.top,
          labelY:
            scale.top +
            tickLength +
            tickPadding +
            font.lineHeight / 2,
          labelLines,
          font,
          tickLength,
          tickWidth,
          showTick:
            styleOptions.display !== false &&
            gridOptions.drawTicks !== false,
          showLabel:
            styleOptions.display !== false &&
            tickOptions.display !== false,
          tickColour: resolveAxisValue(
            gridOptions.tickColor,
            context,
            '#151515'
          ),
          labelColour: resolveAxisValue(
            tickOptions.color,
            context,
            '#151515'
          )
        };

      const titlePadding = normaliseAxisPadding(titleOptions.padding);
      const titleFontOptions = resolveAxisValue(
        titleOptions.font,
        {
          chart,
          scale,
          type: 'scale'
        },
        titleOptions.font || {}

      const titleLines = Array.isArray(titleOptions.text)
        ? titleOptions.text.map(line => String(line ?? ''))
        : [String(titleOptions.text ?? '')];

      return {
        ticks,
        title: {
          show:
            styleOptions.display !== false &&
            titleOptions.display !== false &&
            titleLines.some(Boolean),
          x: (scale.left + scale.right) / 2,
          y:
            scale.bottom -
            titlePadding.bottom -
            titleFont.lineHeight / 2,
          lines: titleLines,
          font: titleFont,
          colour: resolveAxisValue(
            titleOptions.color,

    function drawXAxisSnapshot(
      context,
      snapshot,
      opacity,
      offsetX = 0
    ) {
      if (!snapshot || opacity <= 0.001) {
        return;
      }

      context.save();
      context.globalAlpha = opacity;
      context.textAlign = 'center';
      context.textBaseline = 'middle';

      snapshot.ticks.forEach(tick => {
        const x = tick.x + offsetX;

        if (tick.showTick && tick.tickLength > 0) {
          context.beginPath();
          context.strokeStyle = tick.tickColour;
          context.lineWidth = tick.tickWidth;
          context.moveTo(x, tick.axisY);
          context.lineTo(x, tick.axisY + tick.tickLength);
          context.stroke();
        }

        if (!tick.showLabel || !tick.labelLines.some(Boolean)) {
          return;
        }

        context.font = tick.font.css;
        context.fillStyle = tick.labelColour;

        const firstLineY =
          tick.labelY -
          (tick.labelLines.length - 1) *
          tick.font.lineHeight / 2;

        tick.labelLines.forEach((line, lineIndex) => {
          if (!line) {
            return;
          }

          context.fillText(
            line,
            x,
            firstLineY + lineIndex * tick.font.lineHeight
          );
        });
      });

      if (snapshot.title.show) {
        context.font = snapshot.title.font.css;
        context.fillStyle = snapshot.title.colour;

        const firstLineY =
          snapshot.title.y -
          (snapshot.title.lines.length - 1) *
          snapshot.title.font.lineHeight / 2;

        snapshot.title.lines.forEach((line, lineIndex) => {
          if (!line) {
            return;
          }

          context.fillText(
            line,
            snapshot.title.x + offsetX,
            firstLineY + lineIndex * snapshot.title.font.lineHeight
          );
        });
      }

      context.restore();
    }

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()

    function normaliseText(value) {

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function rgba(colour, opacity) {
      const text = String(colour || '').trim();
      const match = text.match(/^#([0-9a-f]{6})$/i);

      if (!match) {
        return `rgba(119, 119, 119, ${opacity})`;
      }

      const digits = match[1];
      const red = parseInt(digits.slice(0, 2), 16);
      const green = parseInt(digits.slice(2, 4), 16);
      const blue = parseInt(digits.slice(4, 6), 16);

      return `rgba(${red}, ${green}, ${blue}, ${opacity})`;
    }

    function parseCssColour(
      value,
      fallback = 'rgba(119, 119, 119, 1)'
    ) {
      const text = String(value || '').trim();
      const hex = text.match(/^#([0-9a-f]{6})$/i);
      const rgbaMatch = text.match(
        /^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)(?:\s*,\s*([\d.]+))?\s*\)$/i
      );

      if (hex) {
        const digits = hex[1];

        return {
          red: parseInt(digits.slice(0, 2), 16),
          green: parseInt(digits.slice(2, 4), 16),
          blue: parseInt(digits.slice(4, 6), 16),
          alpha: 1
        };
      }

      if (rgbaMatch) {
        return {
          red: clamp(Number(rgbaMatch[1]), 0, 255),
          green: clamp(Number(rgbaMatch[2]), 0, 255),
          blue: clamp(Number(rgbaMatch[3]), 0, 255),
          alpha: clamp(
            rgbaMatch[4] === undefined
              ? 1
              : Number(rgbaMatch[4]),
            0,
            1
          )
        };
      }

      if (text !== fallback) {
        return parseCssColour(
          fallback,
          'rgba(119, 119, 119, 1)'
        );
      }

      return {
        red: 119,
        green: 119,
        blue: 119,
        alpha: 1
      };
    }

    function interpolateCssColour(
      firstColour,
      secondColour,
      progress
    ) {
      const first = parseCssColour(firstColour);
      const second = parseCssColour(secondColour);
      const mix = clamp(progress, 0, 1);

      return `rgba(${Math.round(
        first.red + (second.red - first.red) * mix
      )}, ${Math.round(
        first.green + (second.green - first.green) * mix
      )}, ${Math.round(
        first.blue + (second.blue - first.blue) * mix
      )}, ${
        first.alpha + (second.alpha - first.alpha) * mix
      })`;
    }

    function fadeCssColour(colour, opacityMultiplier) {
      const parsed = parseCssColour(colour);

      return `rgba(${Math.round(parsed.red)}, ${Math.round(parsed.green)}, ${Math.round(parsed.blue)}, ${
        parsed.alpha * clamp(opacityMultiplier, 0, 1)
      })`;
    }

    function easeOutCubic(progress) {
      return 1 - Math.pow(1 - progress, 3);
    }

    function easeInOutCubic(progress) {
      return progress < 0.5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;
    }

    function runAnimation({
      duration,
      easing,
      onFrame,
      onComplete
    }) {
      if (activeAnimationFrame !== null) {
        cancelAnimationFrame(activeAnimationFrame);
        activeAnimationFrame = null;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (reduceMotion || duration <= 0) {
        onFrame(1);
        onComplete?.();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const rawProgress = Math.min(
          (now - startedAt) / duration,
          1
        );

        onFrame(easing(rawProgress));

        if (rawProgress < 1) {
          activeAnimationFrame = requestAnimationFrame(frame);
        } else {
          activeAnimationFrame = null;
          onComplete?.();
        }
      }

      activeAnimationFrame = requestAnimationFrame(frame);
    }


    function toNumber(value) {
      const number = Number(
        cleanText(value).replace(/[^\d.-]/g, '')

      return Number.isFinite(number) ? number : NaN;

    function parseDate(value) {
      if (
        typeof value === 'number' &&
        value > 20000 &&
        value < 80000
      ) {
        return Date.UTC(1899, 11, 30) + value * DAY_MS;
      }

      const text = cleanText(value);
      const googleDate = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/
      );

      if (googleDate) {
        return Date.UTC(
          Number(googleDate[1]),
          Number(googleDate[2]),
          Number(googleDate[3])
        );
      }

      const auDate = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})/
      );

      if (auDate) {
        let year = Number(auDate[3]);

        if (year < 100) {
          year += 2000;
        }

        return Date.UTC(
          year,
          Number(auDate[2]) - 1,
          Number(auDate[1])
        );
      }

      const parsed = new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          );
    }

    function normaliseRurality(value) {
      const match = cleanText(value)
        .toUpperCase()
        .match(/(?:MM\s*)?([1-7])/);

    function normaliseState(value) {

    function normaliseEmployer(value) {

    function percentile(sorted, probability) {
      if (!sorted.length) {
        return NaN;
      }

      const index = (sorted.length - 1) * probability;
      const lower = Math.floor(index);
      const upper = Math.ceil(index);

      if (lower === upper) {
        return sorted[lower];
      }

      return (
        sorted[lower] +
        (sorted[upper] - sorted[lower]) *
        (index - lower)
      );
    }

    function statistics(values) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort((a, b) => a - b);

      return {
        count: sorted.length,
        median: percentile(sorted, 0.5),
        q1: percentile(sorted, 0.25),
        q3: percentile(sorted, 0.75)
      };
    }

    function regression(data, transform = value => value) {
      const usable = data
        .map(point => ({
          originalX: point.x,
          x: transform(point.x),
          y: point.y
        }))
        .filter(point =>
          Number.isFinite(point.x) &&
          Number.isFinite(point.y)
        );

      if (usable.length < 2) {
        return null;
      }

      const meanX = usable.reduce((sum, point) => sum + point.x, 0) / usable.length;
      const meanY = usable.reduce((sum, point) => sum + point.y, 0) / usable.length;

      let numerator = 0;
      let denominator = 0;

      usable.forEach(point => {
        numerator += (point.x - meanX) * (point.y - meanY);
        denominator += Math.pow(point.x - meanX, 2);
      });

      if (!denominator) {
        return null;
      }

      const slope = numerator / denominator;
      const intercept = meanY - slope * meanX;

      return {
        slope,
        minimumX: Math.min(...usable.map(point => point.originalX)),
        maximumX: Math.max(...usable.map(point => point.originalX)),
        predict: originalX => intercept + slope * transform(originalX)
      };
    }

    function loadRows() {
      return new Promise((resolve, reject) => {
        const callback = `pffCasual_${Date.now()}_${Math.floor(
          Math.random() * 100000
        )}`;

        const script = document.createElement('script');
        let finished = false;

        const timeout = setTimeout(() => {
          done(new Error('Could not load Google Sheet data'));
        }, CONFIG.fetchTimeoutMs);

        function cleanup() {
          clearTimeout(timeout);

          try {
            delete window[callback];
          } catch (_) {
            window[callback] = undefined;
          }

          script.remove();
        }

        function done(error, response) {
          if (finished) {
            return;
          }

          finished = true;
          cleanup();

          if (error) {
            reject(error);
          } else if (!response || response.status === 'error') {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                'Could not load Google Sheet data'
              )
            );
          } else {
            resolve(response?.table?.rows || []);
          }
        }

        window[callback] = response => done(null, response);
        script.onerror = () => done(new Error('Network error loading Google Sheet data'));

        const params = new URLSearchParams({
          sheet: CONFIG.sheetName,
          range: CONFIG.range,
          headers: '1',
          tq: 'select *',
          tqx: `responseHandler:${callback}`,
          _: String(Date.now())
        });

        script.src =
          `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?` +
          params.toString();

        document.body.appendChild(script);
      });
    }

    function normaliseRows(sourceRows) {
      return sourceRows
        .map((sourceRow, sourceIndex) => {
          const cells = sourceRow?.c || [];

        )

    function fixedXAxis(options) {
      const originalAfterFit = options?.afterFit;
      const ticks = options?.ticks || {};
      const grid = options?.grid || {};
      const title = options?.title || {};

      return {
        ...options,
        ticks: {
          ...ticks,
          padding: 3,
          font: {
            ...(ticks.font || {}),
            lineHeight: '12px'
          }
        },
        grid: {
          ...grid
        },
        title: {
          ...title,
          padding: {
            top: 7,
            bottom: 2
          },
          font: {
            ...(title.font || {}),
            lineHeight: '16px'
          }
        },
        afterFit(scale) {
          if (typeof originalAfterFit === 'function') {
            originalAfterFit(scale);
          }

          scale.height = 46;
        }
      };
    }


    function yAxisOptions() {
      return {
        min: yAxisModel.minimum,
        max: yAxisModel.maximum,
        afterFit(scale) {
          scale.width = window.matchMedia('(max-width: 430px)').matches
            ? 58
            : 62;
        },
        afterBuildTicks(scale) {
          scale.ticks = Array.from(
            {
              length:
                Math.round(
                  (yAxisModel.maximum - yAxisModel.minimum) /
                  yAxisModel.minorStep
                ) + 1
            },
            (_, index) => ({
              value:
                yAxisModel.minimum +
                index * yAxisModel.minorStep

          display: true,

            return (

          }

            )

    function continuousView({
      availableRows,
      xAccessor,
      xScale,
      regressionType,
      slopeLabel,
      slopeMultiplier = 1
    }) {
      const points = availableRows
        .map(row => ({
          x: xAccessor(row),
          y: row.hourlyRate,
          kind: 'raw',
          ...row
        }))
        .filter(point => Number.isFinite(point.x));

      const transform =
        regressionType === 'logarithmic'
          ? value => Math.log1p(Math.max(0, value))
          : value => value;

      const fitted = regression(points, transform);

      const datasets = [
        {
          type: 'scatter',
          datasetRole: 'continuousPoints',
          label: 'Hourly rate ($)',
          data: points,
          parsing: false,
          pointStyle: 'rect',
          pointRadius: CONFIG.pointRadius,
          pointHoverRadius: CONFIG.pointHoverRadius,
          pointBackgroundColor: rgba('#6600ff', CONFIG.pointOpacity),
          pointHoverBackgroundColor: rgba('#6600ff', CONFIG.pointHoverOpacity),
          pointBorderColor: rgba('#6600ff', 0.34),
          pointHoverBorderColor: '#6600ff',
          pointBorderWidth: 0.45,
          pointHoverBorderWidth: 1,
          showLine: false,
          clip: false
        }
      ];

      if (fitted) {
        const count = 96;
        const span = fitted.maximumX - fitted.minimumX;

        datasets.push({
          type: 'line',
          datasetRole: 'regression',
          label:
            regressionType === 'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',
          data: Array.from(
            {
              length: count
            },
            (_, index) => {
              const proportion =
                count === 1 ? 0 : index / (count - 1);

              const x =
                fitted.minimumX +
                span * proportion;

              return {
                x,
                y: fitted.predict(x)
              };
            }
          ),
          parsing: false,
          showLine: true,
          pointRadius: 0,
          pointHoverRadius: 0,
          pointHitRadius: 7,
          borderColor: '#f1c232',
          backgroundColor: '#f1c232',
          borderWidth: CONFIG.regressionWidth,
          borderCapStyle: 'round',
          borderJoinStyle: 'round',
          tension: regressionType === 'logarithmic' ? 0.12 : 0,
          metadata: {
            slope: fitted.slope,
            slopeLabel,
            slopeMultiplier
          }
        });
      }

      return {
        datasets,
        xScale: fixedXAxis(xScale),
        legend: [
          {
            colour: rgba('#6600ff', CONFIG.pointOpacity),
            label: 'Hourly rate ($)',
            marker: 'square'
          },
          {
            colour: '#f1c232',
            label:
              regressionType === 'logarithmic'
                ? 'Logarithmic regression'
                : 'Linear regression',
            marker: 'line'
          }
        ],
        note: ''
      };
    }

    function startOfMonth(timestamp) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth(),
        1
      );
    }

    function addMonths(timestamp, months) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth() + months,
        1
      );
    }

    function dateView() {
      const availableRows = rows.filter(row =>
        Number.isFinite(row.date)
      );

      const values = availableRows.map(row => row.date);
      const minimum = Math.min(...values);
      const maximum = Math.max(...values);
      const firstMonth = startOfMonth(minimum);
      const finalMonth = startOfMonth(maximum);
      const monthAfterLast = addMonths(finalMonth, 1);
      const ticks = [];

      for (
        let month = firstMonth;
        month <= finalMonth;
        month = addMonths(month, 1)
      ) {
        ticks.push(month);
      }

      return continuousView({
        availableRows,
        xAccessor: row => row.date,
        regressionType: 'linear',
        slopeLabel: '/hour per year',
        slopeMultiplier: YEAR_MS,
        xScale: {
          type: 'linear',
          min: firstMonth,
          max: monthAfterLast,
          afterBuildTicks(scale) {
            scale.ticks = ticks.map(value => ({ value }));
          },
          title: {
            display: true,
            text: 'Date submitted',
            color: '#151515',
            font: {
              family: 'Lato',
              size: 13,
              weight: '700'
            }

          ticks: {
            color: '#151515',

            minRotation: 0,

            callback(value) {
              const date = new Date(Number(value));
              const month = date.getUTCMonth();

              return [0, 3, 6, 9].includes(month)
                ? `${String(month + 1).padStart(2, '0')}/${date.getUTCFullYear()}`
                : '';
            }
          },
          grid: {
            drawOnChartArea: false,
            drawTicks: true,

              return [0, 3, 6, 9].includes(month)

    function bubbleConfig(view) {
      if (view === 'employer') {
        return {
          order: EMPLOYERS.map(employer => employer.key),
          accessor: row => row.employerKey,
          label: key => EMPLOYER_BY_KEY.get(key)?.label || key,
          fullName: key => EMPLOYER_BY_KEY.get(key)?.fullName || key,
          colour: key => EMPLOYER_BY_KEY.get(key)?.colour || '#777777'
        };
      }

      return {
        order: STATE_ORDER,
        accessor: row => row.state,
        label: key => key,
        fullName: key => key,
        colour: key => STATE_COLOURS[key] || '#777777'
      };
    }

    function bubbleRadius(respondents, view) {
      return clamp(
        11 + Math.pow(respondents, 0.78) * 3.15,
        18,
        66
      );
    }

    function bubblePositions(items) {
      const sorted = items
        .slice()
        .sort((a, b) =>
          a.y - b.y ||
          b.statistics.count - a.statistics.count
        );

      const laneLast = [];
      const laneByKey = new Map();

      sorted.forEach(item => {
        let lane = laneLast.findIndex(last =>
          item.y - last > 10
        );

        if (lane === -1) {
          lane = laneLast.length;
          laneLast.push(item.y);
        } else {
          laneLast[lane] = item.y;
        }

        laneByKey.set(item.categoryKey, lane);
      });

      const count = Math.max(5, laneLast.length);

      return new Map(
        [...laneByKey.entries()].map(([key, lane]) => [
          key,
          21 + lane / Math.max(1, count - 1) * 63
        ])
      );
    }

    function rebuildBubbleStore(view) {
      const store = bubbleStores[view];
      const config = bubbleConfig(view);

      store.categories = config.order.filter(key =>
        rows.some(row => config.accessor(row) === key)
      );

      store.rowsByKey = new Map();

      const aggregates = store.categories.map(categoryKey => {
        const categoryRows = rows.filter(row =>
          config.accessor(row) === categoryKey
        );

        const stats = statistics(
          categoryRows.map(row => row.hourlyRate)
        );

        store.rowsByKey.set(categoryKey, categoryRows);

        return {
          x: 21,
          y: stats.median,
          bubbleView: view,
          categoryKey,
          label: config.label(categoryKey),
          fullName: config.fullName(categoryKey),
          colour: config.colour(categoryKey),
          baseRadius: bubbleRadius(stats.count, view),
          statistics: stats
        };
      });

      const positions = bubblePositions(aggregates);

      store.aggregates = aggregates
        .map(item => ({
          ...item,
          x: positions.get(item.categoryKey) ?? 21
        }))
        .sort((a, b) =>
          b.y - a.y ||
          b.baseRadius - a.baseRadius
        );
    }

    function bubbleVisibility(raw) {
      const store = bubbleStores[raw.bubbleView];

      if (store.splitProgress.has(raw.categoryKey)) {
        return 1 - store.splitProgress.get(raw.categoryKey);
      }

      if (store.mergingKeys.has(raw.categoryKey)) {
        return store.mergeProgress;
      }

      return store.splitKeys.has(raw.categoryKey)
        ? 0
        : 1;
    }

    function displayedBubbleRadius(context) {
      const raw = context.raw;

      if (!raw) {
        return 0;
      }

      const visibility = bubbleVisibility(raw);

      if (visibility <= 0.001) {
        return 0;
      }

      const scale = Math.min(
        clamp((context.chart.width || 520) / 520, 0.78, 1.05),
        clamp((context.chart.height || 585) / 585, 0.68, 1.04)
      );

      return raw.baseRadius * scale;
    }

              return interactionLocked

    const bubbleLabelPlugin = {
      id: 'bubbleLabelPlugin',

      afterDatasetDraw(activeChart, args) {
        if (
          !['state', 'employer'].includes(activeView) ||
          viewMorphInProgress ||
          args.index !== 0 ||
          activeChart.data.datasets[0]?.datasetRole !== 'bubbleAggregate'
        ) {
          return;
        }

        const context = activeChart.ctx;
        const dataset = activeChart.data.datasets[0];
        const elements = activeChart.getDatasetMeta(0).data;

        elements.forEach((element, index) => {
          const raw = dataset.data[index];
          const visibility = bubbleVisibility(raw);

          if (visibility <= 0.02) {
            return;
          }

          context.save();
          context.globalAlpha =
            visibility *
            (1 - bubbleStores[raw.bubbleView].dimProgress * 0.43);
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.font =
            `700 ${raw.bubbleView === 'employer' ? 11 : 13}px Lato, sans-serif`;
          context.lineWidth = 1.7;
          context.strokeStyle = 'rgba(255,255,255,0.94)';
          context.fillStyle = '#151515';
          context.strokeText(raw.label, element.x, element.y);
          context.fillText(raw.label, element.x, element.y);
          context.restore();
        });
      }
    };
