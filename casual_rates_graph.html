<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Casual Rates Data</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js?v=1.2.0-20260910c"></script>

  <style>
    /* Casual Rates-specific components only. Shared PFF chart styling lives in pff_chart_core.js. */

    .chart-heading-row {
      position: relative;
      display: block;
      width: 100%;
      height: 30px;
      min-width: 0;
      min-height: 30px;
      flex: 0 0 auto;
      margin: 0;
    }

    .chart-heading {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 4px 116px 0 0;
      overflow: visible;
      color: var(--pff-ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
      will-change: opacity;
    }

    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;
      display: inline-flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      color: var(--pff-muted);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      box-shadow: none;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--pff-ink);
      border-color: var(--pff-ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--pff-purple);
      font-size: 15px;
      line-height: 1;
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .chart-options-row .legend-nav {
      min-width: 54px;
      flex: 1 1 auto;
    }

    .live-data.is-unavailable .live-data-dot {
      background: var(--pff-muted);
    }

    .chart-note {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      max-width: min(230px, calc(100% - 80px));
      padding: 5px 7px;
      color: var(--pff-muted);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(105, 113, 138, 0.16);
      border-radius: 4px;
      font-size: 8.5px;
      line-height: 1.3;
      pointer-events: none;
    }

    .chart-note.is-hidden {
      display: none;
    }

    @media (max-width: 430px) {
      .chart-heading-row {
        height: 29px;
        min-height: 29px;
      }

      .chart-heading {
        padding-top: 4px;
        padding-right: 108px;
        font-size: 14px;
        line-height: 21px;
      }

      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .chart-note {
        max-width: min(205px, calc(100% - 68px));
        font-size: 8px;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 100px;
        font-size: 13px;
      }

      .reaggregate-button {
        font-size: 9px;
      }
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">

      <div class="module-top">

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="chart-heading-row">

        <button
          id="reaggregateButton"
          class="reaggregate-button is-hidden"

          aria-hidden="true"

      </div>

      <div class="chart-options-row">
        <div id="legendNav" class="legend-nav">
          <button
            id="legendScrollLeft"
            class="legend-scroll-button legend-scroll-left is-hidden"
            type="button"
            aria-label="Scroll legend left"

            &#8249;
          </button>

          <div id="legendViewport" class="legend-viewport">
            <div

          </div>

          <button

            class="legend-scroll-button legend-scroll-right is-hidden"
            type="button"
            aria-label="Scroll legend right"
          >
            &#8250;
          </button>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <aside id="chartNote" class="chart-note is-hidden" role="note"></aside>

        <canvas
          id="casualChart"
          aria-label="Casual rate chart"
          tabindex="-1"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    const CONFIG = {

    const CACHE_WEB_APP_URL =

    const CACHE_APP_KEY =

    /*

    };

    const STATE_ORDER = [

    ];

    ];

    const RURALITY_COLOURS =

    const EMPLOYERS = [
      { key: 'toss', label: 'TOSS', fullName: 'The Optical Super Store', colour: '#ff2401', aliases: ['TOSS', 'The Optical Superstore', 'The Optical Super Store'] },
      { key: 'th', label: 'TH', fullName: 'Teachers Health', colour: '#007781', aliases: ['TH', 'THF', 'Teachers Health', 'Teachers Health Fund', "Teacher's Health", "Teacher's Health Fund", 'Teacher’s Health', 'Teacher’s Health Fund'] },
      { key: 'costco', label: 'Costco', fullName: 'Costco Optical', colour: '#e32a36', aliases: ['Costco', 'Costco Optical'] },
      { key: 'ow', label: 'OW', fullName: 'Oscar Wylee', colour: '#f16c20', aliases: ['OW', 'Oscar Wylee'] },
      { key: 'bn', label: 'BN', fullName: 'Bailey Nelson', colour: '#002e5a', aliases: ['BN', 'Bailey Nelson'] },
      { key: '1001', label: '1001', fullName: '1001 Optometry', colour: '#000000', aliases: ['1001', '1001 Optometry'] },
      { key: 'cw', label: 'CW', fullName: 'Chemist Warehouse Optometry', colour: '#ea0f0f', aliases: ['CW', 'Chemist Warehouse', 'Chemist Warehouse Optometry', 'Chemist/Optometrist Warehouse'] },
      { key: 'indie', label: 'Indie', fullName: 'Independent', colour: '#5a3be7', aliases: ['Indie', 'Independent'] },
      { key: 'hcf', label: 'HCF', fullName: 'HCF Eyecare', colour: '#da1c5c', aliases: ['HCF', 'HCF Eyecare'] },
      { key: 'ophthal', label: 'Ophthal', fullName: 'Ophthalmologist', colour: '#ffb000', aliases: ['Ophthal', 'Ophthalmologist', 'Ophthal practice'] },
      { key: 'toc', label: 'TOC', fullName: 'The Optical Company', colour: '#13543c', aliases: ['NIB', 'TOC', 'The Optical Company', 'The Optical Company (incl. NIB)', 'NIB (incl. the Optical Company)'] },
      { key: 'ss', label: 'SS', fullName: 'Specsavers', colour: '#009552', aliases: ['SS', 'Specsavers'] },
      { key: 'bupa', label: 'Bupa', fullName: 'Bupa Optical', colour: '#0075c2', aliases: ['Bupa', 'Bupa Optical'] },
      { key: 'other', label: 'Other', fullName: 'Other', colour: '#bfc3c7', aliases: ['Other', 'Other (e.g., uni, hospital, govt, not-for-profit)'] },
      { key: 'opsm', label: 'OPSM', fullName: 'OPSM', colour: '#6fb0d4', aliases: ['OPSM', 'OPSM (incl. L&P, EyeQ)'] },
      { key: 'dresden', label: 'Dresden', fullName: 'Dresden Vision', colour: '#999999', aliases: ['Dresden', 'Dresden Vision'] },
      { key: 'obnp', label: 'ObNP', fullName: 'Optical by National Pharmacies', colour: '#2cb4a6', aliases: ['ObNP', 'Optical by National Pharmacies'] },
      { key: 'gm', label: 'G&M', fullName: 'George & Matilda Eyecare', colour: '#000000', aliases: ['G&M', 'George & Matilda', 'George & Matilda Eyecare'] }
    ];

    const EMPLOYER_BY_KEY = new Map(
      EMPLOYERS.map(employer => [employer.key, employer])
    );

    const YEAR_MS =
      365.2425 * 86400000;

    const app =
      document.getElementById('app');

    const statusElement =
      document.getElementById('status');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const reaggregateButton =
      document.getElementById('reaggregateButton');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartTabs =
      [...document.querySelectorAll('.chart-tab')];

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartNote =
      document.getElementById('chartNote');

    const chartShell =
      document.getElementById('chartShell');

    const chartCanvas =
      document.getElementById('casualChart');

    const dataSourceIndicator =
      document.getElementById(
        'data-source-indicator'
      );

    const dataSourceText =
      document.getElementById(
        'data-source-text'
      );

    let rows = [];
    let chart = null;
    let activeView = 'experience';
    let interactionLocked = false;
    let viewMorphInProgress = false;
    let currentXAxisOptions = null;
    let tabsController = null;
    let legendController = null;
    let responsiveController = null;
    let interactionsController = null;

    const animationController =
      PFFCharts.createAnimationController();

    let lastBubbleClick = '';
    let lastBubbleClickAt = 0;

    const yAxisModel = {
      minimum: 40,
      maximum: 100,
      majorStep: 10,
      minorStep: 5
    };

    const xAxisFade = {
      active: false,
      progress: 1,
      from: null,
      changes: {
        ticks: false,
        labels: false,
        title: false,
        border: false
      }
    };

    function getXAxisChangeMap(
      previousOptions,
      nextOptions
    ) {
      const previousView =
        previousOptions?.pffTickView || '';

      const nextView =
        nextOptions?.pffTickView || '';

      const previousAxisVisible =
        previousOptions?.display !== false;

      const nextAxisVisible =
        nextOptions?.display !== false;

      const previousTicksVisible =
        previousAxisVisible &&
        previousOptions?.grid?.drawTicks !== false &&
        previousView !== 'hidden';

      const nextTicksVisible =
        nextAxisVisible &&
        nextOptions?.grid?.drawTicks !== false &&
        nextView !== 'hidden';

      const previousLabelsVisible =
        previousAxisVisible &&
        previousOptions?.ticks?.display !== false &&
        previousView !== 'hidden';

      const nextLabelsVisible =
        nextAxisVisible &&
        nextOptions?.ticks?.display !== false &&
        nextView !== 'hidden';

      const previousTitleText =
        previousOptions?.title?.text;

      const nextTitleText =
        nextOptions?.title?.text;

      const previousTitleHasText = Array.isArray(
        previousTitleText
      )
        ? previousTitleText.some(Boolean)
        : Boolean(previousTitleText);

      const nextTitleHasText = Array.isArray(
        nextTitleText
      )
        ? nextTitleText.some(Boolean)
        : Boolean(nextTitleText);

      const previousTitleVisible =
        previousAxisVisible &&
        previousOptions?.title?.display !== false &&
        previousTitleHasText;

      const nextTitleVisible =
        nextAxisVisible &&
        nextOptions?.title?.display !== false &&
        nextTitleHasText;

      const previousBorderVisible =
        previousAxisVisible &&
        previousOptions?.border?.display !== false;

      const nextBorderVisible =
        nextAxisVisible &&
        nextOptions?.border?.display !== false;

      const previousTickSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        tickLength: previousOptions?.grid?.tickLength
      });

      const nextTickSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        tickLength: nextOptions?.grid?.tickLength
      });

      const previousLabelSignature = JSON.stringify({
        view: previousView,
        minimum: previousOptions?.min,
        maximum: previousOptions?.max,
        colour: previousOptions?.ticks?.color,
        font: previousOptions?.ticks?.font || {}
      });

      const nextLabelSignature = JSON.stringify({
        view: nextView,
        minimum: nextOptions?.min,
        maximum: nextOptions?.max,
        colour: nextOptions?.ticks?.color,
        font: nextOptions?.ticks?.font || {}
      });

      const previousTitleSignature = JSON.stringify({
        text: previousTitleText,
        colour: previousOptions?.title?.color,
        font: previousOptions?.title?.font || {},
        padding: previousOptions?.title?.padding || {}
      });

      const nextTitleSignature = JSON.stringify({
        text: nextTitleText,
        colour: nextOptions?.title?.color,
        font: nextOptions?.title?.font || {},
        padding: nextOptions?.title?.padding || {}
      });

      const previousBorderSignature = JSON.stringify({
        colour: previousOptions?.border?.color,
        width: previousOptions?.border?.width
      });

      const nextBorderSignature = JSON.stringify({
        colour: nextOptions?.border?.color,
        width: nextOptions?.border?.width
      });

      return {
        ticks:
          previousTicksVisible !== nextTicksVisible ||
          (
            previousTicksVisible &&
            nextTicksVisible &&
            previousTickSignature !== nextTickSignature
          ),

        labels:
          previousLabelsVisible !== nextLabelsVisible ||
          (
            previousLabelsVisible &&
            nextLabelsVisible &&
            previousLabelSignature !== nextLabelSignature
          ),

        title:
          previousTitleVisible !== nextTitleVisible ||
          (
            previousTitleVisible &&
            nextTitleVisible &&
            previousTitleSignature !== nextTitleSignature
          ),

        border:
          previousBorderVisible !== nextBorderVisible ||
          (
            previousBorderVisible &&
            nextBorderVisible &&
            previousBorderSignature !== nextBorderSignature
          )
      };
    }

    function isMajorXAxisTick(value, view) {
      if (!Number.isFinite(value)) {
        return false;
      }

      if (view === 'experience') {
        return value % 5 === 0;
      }

      if (view === 'date') {
        const month = new Date(value).getUTCMonth();

        return [0, 3, 6, 9].includes(month);
      }

      return false;
    }

    function isMajorYAxisTick(value) {
      if (!Number.isFinite(value)) {
        return false;
      }

      return (
        (value - yAxisModel.minimum) %
        yAxisModel.majorStep === 0
      );
    }

    function drawVariableAxisTicks(
      context,
      scale,
      axis,
      view
    ) {
      if (!scale) {
        return;
      }

      const ticks = scale.ticks || [];

      if (!ticks.length) {
        return;
      }

      const tickColour =
        axis === 'x'
          ? fadeCssColour(
              '#151515',
              getIncomingXAxisOpacity('ticks')
            )
          : '#151515';

      context.save();
      context.lineCap = 'butt';

      ticks.forEach((tick, index) => {
        const value = Number(tick.value);
        const pixel = scale.getPixelForTick(index);

        if (!Number.isFinite(pixel)) {
          return;
        }

        const isMajor =
          axis === 'x'
            ? isMajorXAxisTick(value, view)
            : isMajorYAxisTick(value);

        const tickLength =
          axis === 'x'
            ? isMajor
              ? 6
              : 2
            : isMajor
              ? 5
              : 2;

        const tickWidth = isMajor
          ? 1.1
          : 0.7;

        context.beginPath();
        context.strokeStyle = tickColour;
        context.lineWidth = tickWidth;

        if (axis === 'x') {
          context.moveTo(pixel, scale.top);
          context.lineTo(
            pixel,
            scale.top + tickLength
          );
        } else {
          context.moveTo(scale.right, pixel);
          context.lineTo(
            scale.right - tickLength,
            pixel
          );
        }

        context.stroke();
      });

      context.restore();
    }

    function resolveAxisValue(value, context, fallback) {
      try {
        return typeof value === 'function'
          ? value(context)
          : value ?? fallback;
      } catch (_) {
        return fallback;
      }
    }

    function normaliseAxisPadding(value) {
      const numericValue =
        typeof value === 'number' ||
        typeof value === 'string'
          ? Number(value)
          : NaN;

      if (Number.isFinite(numericValue)) {
        return {
          top: numericValue,
          right: numericValue,
          bottom: numericValue,
          left: numericValue
        };
      }

      return {
        top: Number(value?.top) || 0,
        right: Number(value?.right) || 0,
        bottom: Number(value?.bottom) || 0,
        left: Number(value?.left) || 0
      };
    }

    function getAxisFont(
      fontOptions,
      fallbackSize = 10,
      fallbackWeight = '400'
    ) {
      const family =
        fontOptions?.family ||
        Chart.defaults.font.family ||
        "'Lato', sans-serif";

      const size = Number(fontOptions?.size) || fallbackSize;
      const weight = fontOptions?.weight || fallbackWeight;
      const style = fontOptions?.style ? `${fontOptions.style} ` : '';
      const configuredLineHeight = fontOptions?.lineHeight;
      let lineHeight = size * 1.2;

      if (typeof configuredLineHeight === 'string') {
        const text = configuredLineHeight.trim();
        const numericValue = parseFloat(text);

        if (Number.isFinite(numericValue)) {
          if (text.endsWith('px')) {
            lineHeight = numericValue;
          } else if (text.endsWith('%')) {
            lineHeight = size * numericValue / 100;
          } else {
            lineHeight = size * numericValue;
          }
        }
      } else if (Number.isFinite(Number(configuredLineHeight))) {
        lineHeight = size * Number(configuredLineHeight);
      }

      return {
        css: `${style}${weight} ${size}px ${family}`,
        lineHeight
      };
    }

    function captureXAxisSnapshot(
      scale,
      styleOptions = scale?.options
    ) {
      if (!scale || !styleOptions) {
        return null;
      }

      const tickOptions = styleOptions.ticks || {};
      const gridOptions = styleOptions.grid || {};
      const titleOptions = styleOptions.title || {};
      const borderOptions = styleOptions.border || {};
      const tickPadding = Number(tickOptions.padding) || 0;

      const ticks = (scale.ticks || []).map((tick, index) => {
        const context =
          typeof scale.getContext === 'function'
            ? scale.getContext(index)
            : {
                chart,
                scale,
                tick,
                index,
                type: 'tick'
              };

        let label = tick.label;

        if (
          label === undefined &&
          typeof tickOptions.callback === 'function'
        ) {
          try {
            label = tickOptions.callback.call(
              scale,
              tick.value,
              index,
              scale.ticks
            );
          } catch (_) {
            label = tick.value;
          }
        }

        const labelLines = Array.isArray(label)
          ? label.map(line => String(line ?? ''))
          : [String(label ?? '')];

        const fontOptions = resolveAxisValue(
          tickOptions.font,
          context,
          tickOptions.font || {}
        );

        const font = getAxisFont(
          fontOptions,
          10,
          '400'
        );

        const tickValue = Number(tick.value);

        const isMajor = isMajorXAxisTick(
          tickValue,
          styleOptions.pffTickView
        );

        const tickLength = isMajor
          ? 6

        return {

    function drawXAxisSnapshot(
      context,
      snapshot,
      opacities,
      offsetX = 0
    ) {
      if (!snapshot) {
        return;
      }

      const tickOpacity = clamp(
        Number(opacities?.ticks) || 0,
        0,
        1
      );

      const labelOpacity = clamp(
        Number(opacities?.labels) || 0,
        0,
        1
      );

      const titleOpacity = clamp(
        Number(opacities?.title) || 0,
        0,
        1
      );

      const borderOpacity = clamp(
        Number(opacities?.border) || 0,
        0,
        1
      );

      if (
        tickOpacity <= 0.001 &&
        labelOpacity <= 0.001 &&
        titleOpacity <= 0.001 &&
        borderOpacity <= 0.001
      ) {
        return;
      }

      context.save();
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.lineCap = 'butt';

      if (
        snapshot.border?.show &&
        borderOpacity > 0.001
      ) {
        context.globalAlpha = borderOpacity;
        context.beginPath();
        context.strokeStyle = snapshot.border.colour;
        context.lineWidth = snapshot.border.width;
        context.moveTo(
          snapshot.border.left + offsetX,
          snapshot.border.y
        );
        context.lineTo(
          snapshot.border.right + offsetX,
          snapshot.border.y
        );
        context.stroke();
      }

      snapshot.ticks.forEach(tick => {
        const x = tick.x + offsetX;

        if (
          tick.showTick &&
          tick.tickLength > 0 &&
          tickOpacity > 0.001
        ) {
          context.globalAlpha = tickOpacity;
          context.beginPath();
          context.strokeStyle = tick.tickColour;
          context.lineWidth = tick.tickWidth;
          context.moveTo(x, tick.axisY);
          context.lineTo(
            x,
            tick.axisY + tick.tickLength
          );
          context.stroke();
        }

        if (
          !tick.showLabel ||
          !tick.labelLines.some(Boolean) ||
          labelOpacity <= 0.001
        ) {
          return;
        }

        context.globalAlpha = labelOpacity;
        context.font = tick.font.css;
        context.fillStyle = tick.labelColour;

        const firstLineY =
          tick.labelY -
          (
            tick.labelLines.length - 1
          ) *
          tick.font.lineHeight / 2;

        tick.labelLines.forEach((line, lineIndex) => {
          if (!line) {
            return;
          }

          context.fillText(
            line,
            x,
            firstLineY +
            lineIndex * tick.font.lineHeight
          );
        });
      });

      if (
        snapshot.title.show &&
        titleOpacity > 0.001
      ) {
        context.globalAlpha = titleOpacity;
        context.font = snapshot.title.font.css;
        context.fillStyle = snapshot.title.colour;

        const firstLineY =
          snapshot.title.y -
          (
            snapshot.title.lines.length - 1
          ) *
          snapshot.title.font.lineHeight / 2;

        snapshot.title.lines.forEach(
          (line, lineIndex) => {
            if (!line) {
              return;
            }

            context.fillText(
              line,
              snapshot.title.x + offsetX,
              firstLineY +
              lineIndex *
              snapshot.title.font.lineHeight
            );
          }
        );
      }

      context.restore();
    }

    function continuousView({
      availableRows,
      xAccessor,
      xScale,
      regressionType,
      slopeLabel,
      slopeMultiplier = 1
    }) {
      const points = availableRows
        .map(row => ({
          x: xAccessor(row),
          y: row.hourlyRate,
          kind: 'raw',
          ...row
        }))
        .filter(point => Number.isFinite(point.x));

      const transform =
        regressionType === 'logarithmic'
          ? value => Math.log1p(Math.max(0, value))
          : value => value;

      const fitted = regression(points, transform);

      const datasets = [
        {
          type: 'scatter',
          datasetRole: 'continuousPoints',
          label: 'Hourly rate ($)',
          data: points,
          parsing: false,
          pointStyle: 'rect',
          pointRadius: CONFIG.pointRadius,
          pointHoverRadius: CONFIG.pointHoverRadius,
          pointHitRadius: 4,
          pointBackgroundColor: rgba('#6600ff', CONFIG.pointOpacity),
          pointHoverBackgroundColor: rgba('#6600ff', CONFIG.pointHoverOpacity),
          pointBorderColor: rgba('#6600ff', 0.34),
          pointHoverBorderColor: '#6600ff',
          pointBorderWidth: 0.45,
          pointHoverBorderWidth: 1,
          showLine: false,
          clip: false
        }
      ];

      if (fitted) {
        const count = 96;
        const span = fitted.maximumX - fitted.minimumX;

        datasets.push({
          type: 'line',
          datasetRole: 'regression',
          label:
            regressionType === 'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',
          data: Array.from(
            {
              length: count
            },
            (_, index) => {
              const proportion =
                count === 1 ? 0 : index / (count - 1);

              const x =
                fitted.minimumX +
                span * proportion;

              return {
                x,
                y: fitted.predict(x)
              };
            }
          ),
          parsing: false,
          showLine: true,
          pointRadius: 0,
          pointHoverRadius: 0,
          pointHitRadius: 7,
          borderColor: '#f1c232',
          backgroundColor: '#f1c232',
          borderWidth: CONFIG.regressionWidth,
          borderCapStyle: 'round',
          borderJoinStyle: 'round',
          tension: regressionType === 'logarithmic' ? 0.12 : 0,
          metadata: {
            slope: fitted.slope,
            slopeLabel,
            slopeMultiplier,
            pValue: fitted.pValue
          }
        });
      }

      return {
        datasets,
        xScale: fixedXAxis(xScale),
        legend: [
          {
            colour: rgba('#6600ff', CONFIG.pointOpacity),
            label: 'Hourly rate ($)',
            marker: 'square'
          },
          {
            colour: '#f1c232',
            label:
              regressionType === 'logarithmic'
                ? 'Logarithmic regression'
                : 'Linear regression',
            marker: 'line'
          }
        ],
        note: ''
      };
    }

    function startOfMonth(timestamp) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth(),
        1
      );
    }

    function addMonths(timestamp, months) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth() + months,
        1
      );
    }

    function dateView() {
      const availableRows = rows.filter(row =>
        Number.isFinite(row.date)
      );

      const values = availableRows.map(row => row.date);
      const minimum = Math.min(...values);
      const maximum = Math.max(...values);
      const firstMonth = startOfMonth(minimum);
      const finalMonth = startOfMonth(maximum);
      const monthAfterLast = addMonths(finalMonth, 1);
      const ticks = [];

      for (
        let month = firstMonth;
        month <= finalMonth;
        month = addMonths(month, 1)
      ) {
        ticks.push(month);
      }

      return continuousView({
        availableRows,
        xAccessor: row => row.date,
        regressionType: 'linear',
        slopeLabel: '/hour per year',
        slopeMultiplier: YEAR_MS,
        xScale: {
          type: 'linear',
          pffTickView: 'date',
          min: firstMonth,
          max: monthAfterLast,
          afterBuildTicks(scale) {
            scale.ticks = ticks.map(value => ({ value }));

    function bubbleConfig(view) {
      if (view === 'employer') {
        return {
          order: EMPLOYERS

    function bubbleRadius(respondents) {
      return clamp(
        11 + Math.pow(respondents, 0.78) * 3.15,
        18,
        66
      );
    }

    function bubblePositions(items) {
      const sorted = items
        .slice()
        .sort((a, b) =>
          a.y - b.y ||
          b.statistics.count - a.statistics.count
        );

      const laneLast = [];
      const laneByKey = new Map();

      sorted.forEach(item => {
        let lane = laneLast.findIndex(last =>
          item.y - last > 10
        );

        if (lane === -1) {
          lane = laneLast.length;
          laneLast.push(item.y);
        } else {
          laneLast[lane] = item.y;
        }

        laneByKey.set(item.categoryKey, lane);
      });

      const count = Math.max(5, laneLast.length);

      return new Map(
        [...laneByKey.entries()].map(([key, lane]) => [
          key,
          21 + lane / Math.max(1, count - 1) * 63
        ])
      );
    }

    function rebuildBubbleStore(view) {
      const store = bubbleStores[view];
      const config = bubbleConfig(view);

      store.categories = config.order.filter(key =>
        rows.some(row => config.accessor(row) === key)
      );

      store.rowsByKey = new Map();

      const aggregates = store.categories.map(categoryKey => {
        const categoryRows = rows.filter(row =>
          config.accessor(row) === categoryKey
        );

        const stats = statistics(
          categoryRows.map(row => row.hourlyRate)
        );

        store.rowsByKey.set(categoryKey, categoryRows);

        return {
          x: 21,
          y: stats.median,
          bubbleView: view,
          categoryKey,
          label: config.label(categoryKey),
          fullName: config.fullName(categoryKey),
          colour: config.colour(categoryKey),
          baseRadius: bubbleRadius(stats.count),
          statistics: stats
        };
      });

      const positions = bubblePositions(aggregates);

      store.aggregates = aggregates
        .map(item => ({
          ...item,
          x: positions.get(item.categoryKey) ?? 21
        }))
        .sort((a, b) =>
          b.y - a.y ||
          b.baseRadius - a.baseRadius
        );
    }

    function bubbleVisibility(raw) {
      const store = bubbleStores[raw.bubbleView];

      if (store.splitProgress.has(raw.categoryKey)) {
        return 1 - store.splitProgress.get(raw.categoryKey);
      }

      if (store.mergingKeys.has(raw.categoryKey)) {
        return store.mergeProgress;
      }

      return store.splitKeys.has(raw.categoryKey)
        ? 0
        : 1;
    }

    function displayedBubbleRadius(context) {
      const raw = context.raw;

      if (!raw) {
        return 0;
      }

      const visibility = bubbleVisibility(raw);

      if (visibility <= 0.001) {
        return 0;
      }

      const scale = Math.min(
        clamp((context.chart.width || 520) / 520, 0.78, 1.05),
        clamp((context.chart.height || 585) / 585, 0.68, 1.04)
      );

      return raw.baseRadius * scale;
    }

    const bubbleLabelPlugin = {

    function getInteractiveElement(elements) {
      return elements.find(element => {
        const role = chart
          ?.data
          ?.datasets

          ?.datasetRole;

        return (
          role === 'continuousPoints' ||
          role === 'regression' ||

          role === 'categoryMedian' ||
          role === 'bubbleAggregate' ||
          role === 'bubbleRaw'
        );
      });
    }

    function distanceToSegment(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;

      if (dx === 0 && dy === 0) {
        return Math.hypot(px - ax, py - ay);
      }

      const proportion = clamp(
        ((px - ax) * dx + (py - ay) * dy) /
        (dx * dx + dy * dy),
        0,
        1
      );

      const closestX = ax + proportion * dx;
      const closestY = ay + proportion * dy;

      return Math.hypot(px - closestX, py - closestY);
    }

    function findNearestInteractiveLine(event, maximumDistance = 10) {
      if (!chart?.chartArea) {
        return null;
      }

      const x = Number(event?.x);
      const y = Number(event?.y);
      const area = chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let bestMatch = null;

      chart.data.datasets.forEach((dataset, datasetIndex) => {
        if (
          dataset.datasetRole !== 'regression' &&
          dataset.datasetRole !== 'categoryMedian'
        ) {
          return;
        }

        const renderedPoints =
          chart.getDatasetMeta(datasetIndex)?.data || [];

        for (
          let index = 0;
          index < renderedPoints.length - 1;
          index += 1
        ) {
          const first = renderedPoints[index];
          const second = renderedPoints[index + 1];

          if (
            !Number.isFinite(first?.x) ||
            !Number.isFinite(first?.y) ||
            !Number.isFinite(second?.x) ||
            !Number.isFinite(second?.y)
          ) {
            continue;
          }

          const distance = distanceToSegment(
            x,
            y,
            first.x,
            first.y,
            second.x,
            second.y
          );

          if (distance > maximumDistance) {
            continue;
          }

          const firstDistance = Math.hypot(x - first.x, y - first.y);
          const secondDistance = Math.hypot(x - second.x, y - second.y);
          const nearestIndex =
            firstDistance <= secondDistance
              ? index
              : index + 1;

          if (!bestMatch || distance < bestMatch.distance) {
            bestMatch = {
              datasetIndex,
              index: nearestIndex,
              distance
            };
          }
        }
      });

      return bestMatch;
    }

    function findRawBubbleElement(event) {
      if (!chart?.chartArea) {
        return null;
      }

      const x = Number(event?.x);
      const y = Number(event?.y);
      const area = chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let nearestRawPoint = null;

      chart.data.datasets.forEach((dataset, datasetIndex) => {
        if (dataset.datasetRole !== 'bubbleRaw') {
          return;
        }

        const renderedPoints =
          chart.getDatasetMeta(datasetIndex)?.data || [];

        renderedPoints.forEach((element, index) => {
          if (
            !element ||
            typeof element.inRange !== 'function' ||
            !element.inRange(x, y, true)
          ) {
            return;
          }

          const distance = Math.hypot(
            x - element.x,
            y - element.y
          );

          if (
            !nearestRawPoint ||
            distance < nearestRawPoint.distance
          ) {
            nearestRawPoint = {
              datasetIndex,
              index,
              distance
            };
          }
        });
      });

      return nearestRawPoint;
    }

    function findPrioritySummaryElement(event) {
      if (!chart?.chartArea) {
        return null;
      }

      const x = Number(event?.x);
      const y = Number(event?.y);
      const area = chart.chartArea;

      if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        x < area.left ||
        x > area.right ||
        y < area.top ||
        y > area.bottom
      ) {
        return null;
      }

      let nearestAggregate = null;

      chart.data.datasets.forEach((dataset, datasetIndex) => {
        if (dataset.datasetRole !== 'bubbleAggregate') {
          return;
        }

        const renderedPoints =
          chart.getDatasetMeta(datasetIndex)?.data || [];

        renderedPoints.forEach((element, index) => {
          if (
            !element ||
            typeof element.inRange !== 'function' ||
            !element.inRange(x, y, true)
          ) {
            return;
          }

          const distance = Math.hypot(
            x - element.x,
            y - element.y
          );

          if (
            !nearestAggregate ||
            distance < nearestAggregate.distance
          ) {
            nearestAggregate = {
              datasetIndex,
              index,
              distance
            };
          }
        });
      });

      if (nearestAggregate) {
        return nearestAggregate;
      }

      return findNearestInteractiveLine(event);
    }

    function showSelectedTooltip(event, selectedElement) {
      const renderedElement = chart
        .getDatasetMeta(selectedElement.datasetIndex)
        ?.data
        ?.[selectedElement.index];

      chart.tooltip.setActiveElements(
        [
          {
            datasetIndex: selectedElement.datasetIndex,
            index: selectedElement.index
          }
        ],
        {
          x: Number.isFinite(event?.x)
            ? event.x
            : renderedElement?.x ?? 0,
          y: Number.isFinite(event?.y)
            ? event.y
            : renderedElement?.y ?? 0
        }
      );

    function showHoveredSummaryTooltip(
      event,
      selectedElement
    ) {
      if (
        !selectedElement ||
        !chart
      ) {
        return;
      }

      const dataset =
        chart.data.datasets[
          selectedElement.datasetIndex
        ];

      if (
        dataset?.datasetRole !== 'regression' &&
        dataset?.datasetRole !== 'categoryMedian' &&
        dataset?.datasetRole !== 'bubbleAggregate' &&
        dataset?.datasetRole !== 'bubbleRaw'
      ) {
        return;
      }

      const currentActive =
        chart.tooltip
          ?.getActiveElements
          ?.()
          ?.[0];

      if (
        currentActive?.datasetIndex ===

        currentActive?.index ===

      ) {

      showSelectedTooltip(

      );

    function handleChartHover(event, elements) {
      if (!chart || interactionLocked) {
        if (chart) {
          chart.canvas.style.cursor = 'default';
        }
        return;
      }

      const selectedElement =
        findRawBubbleElement(event) ||
        findPrioritySummaryElement(event) ||
        getInteractiveElement(elements);

      const dataset = selectedElement
        ? chart.data.datasets[selectedElement.datasetIndex]
        : null;
      const raw = selectedElement
        ? dataset?.data?.[selectedElement.index]
        : null;

      chart.canvas.style.cursor =
        dataset?.datasetRole === 'bubbleAggregate' &&
        raw &&
        !bubbleStores[raw.bubbleView].splitKeys.has(raw.categoryKey)
          ? 'pointer'
          : selectedElement
            ? 'pointer'
            : 'default';

      if (
        selectedElement &&
        (
          dataset?.datasetRole === 'regression' ||
          dataset?.datasetRole === 'categoryMedian' ||
          dataset?.datasetRole === 'bubbleAggregate' ||
          dataset?.datasetRole === 'bubbleRaw'
        )
      ) {
        showHoveredSummaryTooltip(
          event,
          selectedElement
        );
      }
    }

    function handleChartClick(event, elements) {
      if (!chart || interactionLocked) {
        return;
      }

      event?.native?.preventDefault?.();

      const selectedElement =
        findRawBubbleElement(event) ||
        findPrioritySummaryElement(event) ||
        getInteractiveElement(elements);

      if (!selectedElement) {
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.update('none');
        return;
      }

      showSelectedTooltip(event, selectedElement);

      const dataset = chart.data.datasets[selectedElement.datasetIndex];
      const raw = dataset?.data?.[selectedElement.index];

      if (
        dataset?.datasetRole !== 'bubbleAggregate' ||
        !raw ||
        bubbleStores[raw.bubbleView].splitKeys.has(raw.categoryKey)
      ) {
        lastBubbleClick = '';
        lastBubbleClickAt = 0;
        return;
      }

      const clickedAt = performance.now();
      const key = `${raw.bubbleView}:${raw.categoryKey}`;
      const isSecondActivation =
        lastBubbleClick === key &&
        clickedAt - lastBubbleClickAt <= CONFIG.doubleActivationMs;

      if (isSecondActivation) {
        lastBubbleClick = '';
        lastBubbleClickAt = 0;
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
        chart.update('none');
        splitBubble(raw.bubbleView, raw.categoryKey);
        return;
      }

      lastBubbleClick = key;
      lastBubbleClickAt = clickedAt;
    }



    function getTargetPointStyle(dataset, raw, index) {
      const context = {
        chart,
        raw,
        dataIndex: index,
        dataset,
        datasetIndex: 0,
        type: 'data'
      };

      );

        )
      };
    }

    function captureRenderedGeometry() {
      const pointPixels = [];
      const lineGroups = [];

      if (!chart) {
        return {
          pointPixels,
          lineGroups
        };
      }

      chart.data.datasets.forEach((dataset, datasetIndex) => {
        const metadata = chart.getDatasetMeta(datasetIndex);
        const renderedElements = metadata?.data || [];
        const data = dataset.data || [];

        const pixels = renderedElements
          .map((element, index) => {
            if (
              !Number.isFinite(element?.x) ||
              !Number.isFinite(element?.y)
            ) {
              return null;
            }

            return {
              x: element.x,
              y: element.y,
              raw: data[index] || {},
              role: dataset.datasetRole,
              datasetMetadata: dataset.metadata || {},
              style: {
                backgroundColour:
                  element.options?.backgroundColor ||
                  element.options?.borderColor ||
                  'rgba(119, 119, 119, 0.35)',
                borderColour:
                  element.options?.borderColor ||
                  element.options?.backgroundColor ||
                  'rgba(119, 119, 119, 0.35)',
                radius:
                  Number(element.options?.radius) ||
                  CONFIG.pointRadius,
                pointStyle:
                  element.options?.pointStyle ||
                  'circle'
              }
            };
          })
          .filter(Boolean);

        if (!pixels.length) {
          return;
        }

        if (isLineDataset(dataset) && pixels.length > 1) {
          lineGroups.push({
            role: dataset.datasetRole,
            pixels,
            metadata: dataset.metadata || {},
            style: {
              borderColour:
                metadata?.dataset?.options?.borderColor ||
                dataset.borderColor ||
                '#777777',
              borderWidth:
                Number(metadata?.dataset?.options?.borderWidth) ||
                Number(dataset.borderWidth) ||
                1
            }
          });
        } else {
          pointPixels.push(...pixels);
        }
      });

      return {
        pointPixels,
        lineGroups
      };
    }

    function samplePixel(sourcePixels, index, targetLength) {
      if (!sourcePixels.length) {
        return null;
      }

      if (targetLength <= 1) {
        return sourcePixels[0];
      }

      const sourceIndex = Math.round(
        index *
        (sourcePixels.length - 1) /
        Math.max(1, targetLength - 1)
      );

      return sourcePixels[sourceIndex];
    }

    function findNearestPixel(targetPixel, candidates) {
      if (!candidates.length) {
        return null;
      }

      let nearest = candidates[0];
      let nearestDistance = Infinity;

      candidates.forEach(candidate => {
        const distance = Math.hypot(
          targetPixel.x - candidate.x,
          targetPixel.y - candidate.y
        );

        if (distance < nearestDistance) {
          nearest = candidate;
          nearestDistance = distance;
        }
      });

      return nearest;
    }

    function choosePointStartPixel(targetRaw, targetPixel, geometry) {
      const allPointPixels = geometry.pointPixels;

      if (!allPointPixels.length) {
        return findNearestPixel(
          targetPixel,
          geometry.lineGroups.flatMap(group => group.pixels)
        );
      }

      if (Number.isInteger(targetRaw?.sourceIndex)) {
        const exactSource = allPointPixels.find(
          pixel => pixel.raw?.sourceIndex === targetRaw.sourceIndex
        );

        if (exactSource) {
          return exactSource;
        }
      }

      if (targetRaw?.bubbleView && targetRaw?.categoryKey) {
        const sameBubble = allPointPixels.filter(pixel =>
          pixel.raw?.bubbleView === targetRaw.bubbleView &&
          pixel.raw?.categoryKey === targetRaw.categoryKey
        );

        if (sameBubble.length) {
          return findNearestPixel(targetPixel, sameBubble);
        }
      }

      if (targetRaw?.state) {
        const sameState = allPointPixels.filter(
          pixel => pixel.raw?.state === targetRaw.state
        );

        if (sameState.length) {
          return findNearestPixel(targetPixel, sameState);
        }
      }

      if (targetRaw?.employerKey) {
        const sameEmployer = allPointPixels.filter(
          pixel => pixel.raw?.employerKey === targetRaw.employerKey
        );

        if (sameEmployer.length) {
          return findNearestPixel(targetPixel, sameEmployer);
        }
      }

      if (targetRaw?.category) {
        const sameCategory = allPointPixels.filter(
          pixel => pixel.raw?.category === targetRaw.category
        );

        if (sameCategory.length) {
          return findNearestPixel(targetPixel, sameCategory);
        }
      }

      return findNearestPixel(targetPixel, allPointPixels);
    }

    function chooseLineSourceGroup(targetDataset, geometry) {
      const sameRoleGroups = geometry.lineGroups.filter(
        group => group.role === targetDataset.datasetRole
      );

      if (sameRoleGroups.length) {
        const targetCategory = targetDataset.metadata?.category;
        const exactCategory = sameRoleGroups.find(
          group =>
            targetCategory &&
            group.metadata?.category === targetCategory
        );

        if (exactCategory) {
          return exactCategory;
        }

        const targetMedian = Number(
          targetDataset.metadata?.statistics?.median
        );

        if (Number.isFinite(targetMedian)) {
          return sameRoleGroups
            .slice()
            .sort((first, second) =>
              Math.abs(
                Number(first.metadata?.statistics?.median) -
                targetMedian
              ) -
              Math.abs(
                Number(second.metadata?.statistics?.median) -
                targetMedian
              )
            )[0];
        }

        return sameRoleGroups[0];
      }

      return {
        role: 'points',
        pixels: geometry.pointPixels,
        metadata: {},
        style: {
          borderColour: 'rgba(119, 119, 119, 0)',
          borderWidth: 0
        }
      };
    }

    function createTransitionPlans(targetDatasets, geometry) {
      const xScale = chart.scales.x;
      const yScale = chart.scales.y;

      return targetDatasets.map(targetDataset => {
        const targetData = (targetDataset.data || []).map(point => ({
          ...point
        }));

        const targetIsLine = isLineDataset(targetDataset);
        const lineSourceGroup = targetIsLine
          ? chooseLineSourceGroup(targetDataset, geometry)
          : null;
        const sourcePixels = [];

        const startData = targetData.map((targetPoint, index) => {
          const targetPixel = {
            x: xScale.getPixelForValue(targetPoint.x),
            y: yScale.getPixelForValue(targetPoint.y)
          };

          const sourcePixel = targetIsLine
            ? samplePixel(
                lineSourceGroup?.pixels || [],
                index,
                targetData.length
              )
            : choosePointStartPixel(
                targetPoint,
                targetPixel,
                geometry
              );

          sourcePixels.push(sourcePixel);

          if (!sourcePixel) {
            return {
              ...targetPoint
            };
          }

          return {
            ...targetPoint,
            x: xScale.getValueForPixel(sourcePixel.x),
            y: yScale.getValueForPixel(sourcePixel.y)
          };
        });

        if (targetIsLine) {
          const targetColour = String(
            targetDataset.borderColor || '#777777'
          );
          const targetWidth = Number(targetDataset.borderWidth) || 1;
          const startColour =
            lineSourceGroup?.style?.borderColour ||
            fadeCssColour(targetColour, 0);
          const startWidth =
            Number(lineSourceGroup?.style?.borderWidth) || 0;

          return {
            kind: 'line',
            transitionDataset: {
              ...targetDataset,
              data: startData,
              borderColor: startColour,
              backgroundColor: startColour,
              borderWidth: startWidth,
              pointHitRadius: 0
            },
            targetDataset,
            startData,
            targetData,
            startColour,
            targetColour,
            startWidth,
            targetWidth
          };
        }

        const targetStyles = targetData.map((point, index) =>
          getTargetPointStyle(targetDataset, point, index)
        );

        const startStyles = targetStyles.map((targetStyle, index) => {
          const sourceStyle = sourcePixels[index]?.style;

          if (sourceStyle) {
            return sourceStyle;
          }

          return {
            backgroundColour: fadeCssColour(
              targetStyle.backgroundColour,
              0
            ),
            borderColour: fadeCssColour(
              targetStyle.borderColour,
              0
            ),
            radius: 0,
            pointStyle: targetStyle.pointStyle
          };
        });

        return {
          kind: 'point',
          transitionDataset: {
            ...targetDataset,
            data: startData,
            pointBackgroundColor: startStyles.map(
              style => style.backgroundColour
            ),
            pointHoverBackgroundColor: startStyles.map(
              style => style.backgroundColour
            ),
            pointBorderColor: startStyles.map(
              style => style.borderColour
            ),
            pointHoverBorderColor: startStyles.map(
              style => style.borderColour
            ),
            pointRadius: startStyles.map(style => style.radius),
            pointHoverRadius: startStyles.map(style => style.radius),
            pointHitRadius: 0,
            pointStyle: targetDataset.pointStyle || 'circle'
          },
          targetDataset,
          startData,
          targetData,
          startStyles,
          targetStyles
        };
      });
    }

    function createDepartingLinePlans(geometry, targetDatasets) {
      const targetRoles = new Set(
        targetDatasets
          .filter(isLineDataset)
          .map(dataset => dataset.datasetRole)
      );
      const xScale = chart.scales.x;
      const yScale = chart.scales.y;

      return geometry.lineGroups
        .filter(group => !targetRoles.has(group.role))
        .map(group => {
          const data = group.pixels.map(pixel => ({
            x: xScale.getValueForPixel(pixel.x),
            y: yScale.getValueForPixel(pixel.y)
          }));
          const colour = group.style.borderColour || '#777777';
          const width = Number(group.style.borderWidth) || 1;

          return {
            dataset: {
              type: 'line',
              datasetRole: 'transitionGhost',
              data,
              parsing: false,
              showLine: true,
              clip: false,
              fill: false,
              order: 20,
              borderColor: colour,
              backgroundColor: colour,
              borderWidth: width,
              borderCapStyle: 'round',
              borderJoinStyle: 'round',
              pointRadius: 0,
              pointHoverRadius: 0,
              pointHitRadius: 0,
              tension: 0
            },
            colour,
            width
          };
        });
    }

    function animateViewMorph(
      model,
      duration
    ) {
      PFFCharts.runViewMorph({
        chart,
        model,
        duration,
        xAxisFade,
        currentXAxisOptions,
        captureRenderedGeometry,
        captureXAxisSnapshot:
          safeCaptureXAxisSnapshot,
        getXAxisChangeMap,
        createFadingXAxisOptions,
        createYAxisOptions:
          yAxisOptions,
        createTransitionPlans,
        createDepartingLinePlans,
        animationController,
        setCurrentXAxisOptions(value) {
          currentXAxisOptions =
            value;
        },
        setInteractionLocked(value) {
          interactionLocked =
            value;
        },
        setViewMorphInProgress(value) {
          viewMorphInProgress =
            value;
        },
        onComplete() {
          updateReaggregateButton();
        }
      });
    }

    function createChart() {
      const model = viewModel(activeView);
      currentXAxisOptions = model.xScale;

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: 'scatter',
          data: {
            datasets: model.datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            resizeDelay: 0,
            devicePixelRatio: Math.min(
              window.devicePixelRatio || 1,
              PFF.defaults.maxDevicePixelRatio
            ),
            animation: {
              duration: 0
            },
            transitions: {
              resize: {
                animation: {
                  duration: 0
                }
              },
              active: {
                animation: {
                  duration: PFF.defaults.hoverAnimationMs,
                  easing: 'easeOutCubic'
                }
              }
            },
            layout: {
              autoPadding: false,
              padding: {
                top: 4,
                right: 4,
                bottom: 0,
                left: 0
              }
            },
            interaction: {
              mode: 'nearest',
              axis: 'xy',
              intersect: true,
              includeInvisible: false
            },
            onHover: handleChartHover,
            onClick: handleChartClick,
            plugins: {
              legend: {
                display: false
              },
              tooltip: PFFCharts.tooltipOptions({
                filter() {
                  return !interactionLocked;
                },
                callbacks: {
                  title(items) {
                    return tooltipTitle(items?.[0]);
                  },
                  label(item) {
                    return tooltipLabel(item);
                  }
                }
              })
            },
            scales: {
              x: model.xScale,
              y: yAxisOptions()
            }
          },
          plugins: [
            xAxisFadePlugin,
            variableAxisTickPlugin,
            bubbleLabelPlugin
          ]
        }
      );

      updateLegend(model.legend, false);
      updateChartNote(model.note);
    }

    function applyView(
      nextView,
      animate = true
    ) {
      if (
        !chart ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      activeView = nextView;
      lastBubbleClick = '';
      lastBubbleClickAt = 0;

      const model =
        viewModel(
          activeView
        );

      PFF.animateTextChange(
        chartHeadingDetail,
        VIEW_CONFIG[
          activeView
        ]
      );

      tabsController?.set(
        activeView,
        {
          notify: false
        }
      );

      updateLegend(
        model.legend,
        animate
      );

      updateChartNote(
        model.note
      );

      updateReaggregateButton();

      if (!animate) {
        currentXAxisOptions =
          model.xScale;

        chart.options.animation.duration =
          0;

        chart.data.datasets =
          model.datasets;

        chart.options.scales.x =
          model.xScale;

        chart.options.scales.y =
          yAxisOptions();

        chart.update('none');
        return;
      }

      animateViewMorph(
        model,
        CONFIG.transitionMs
      );
    }

    function requestViewSwitch(nextView) {
      if (
        nextView === activeView ||
        interactionLocked ||
        !VIEW_CONFIG[nextView]
      ) {
        return;
      }

      const currentStore =
        bubbleStores[
          activeView
        ];

      if (
        currentStore?.splitKeys.size
      ) {
        reaggregate(() => {
          applyView(
            nextView,
            true
          );
        });

        return;
      }

      applyView(
        nextView,
        true
      );
    }

    function updateLegend(
      items,
      animate = true
    ) {
      legendController?.update(
        Array.from(
          items ||
          []
        ).map(item => ({
          ...item,
          markerType:
            item.markerType ||
            item.marker ||
            'square'
        })),
        animate
      );
    }

    function updateChartNote(note) {
      chartNote.textContent =
        note || '';

      chartNote.classList.toggle(
        'is-hidden',
        !note
      );
    }

    function updateReaggregateButton() {
      const store = bubbleStores[activeView];
      const show = Boolean(
        store &&
        (
          store.splitKeys.size ||
          store.mergingKeys.size
        )
      );

      reaggregateButton.classList.toggle('is-hidden', !show);
      reaggregateButton.setAttribute('aria-hidden', String(!show));
      reaggregateButton.tabIndex = show ? 0 : -1;
      reaggregateButton.disabled = interactionLocked;
    }

    function rawBubblePoints(view, categoryKey) {
      const store = bubbleStores[view];
      const aggregate = store.aggregates.find(item =>
        item.categoryKey === categoryKey
      );

      const categoryRows = store.rowsByKey.get(categoryKey) || [];

      if (!aggregate || !categoryRows.length) {
        return [];
      }

      const grouped = new Map();

      categoryRows.forEach(row => {
        const key = String(row.hourlyRate);

        if (!grouped.has(key)) {
          grouped.set(key, []);
        }

        grouped.get(key).push(row);
      });

      const points = [];

      grouped.forEach(groupRows => {
        const count = groupRows.length;
        const halfSpan = Math.min(
          9,
          Math.max(0, (count - 1) * 0.8),
          Math.max(
            0,
            Math.min(
              aggregate.x - 5,
              95 - aggregate.x
            )
          )
        );

        groupRows.forEach((row, index) => {
          const targetX =
            count === 1
              ? aggregate.x
              : aggregate.x -
                halfSpan +
                index /
                (count - 1) *
                halfSpan *
                2;

          points.push({
            x: aggregate.x,
            y: aggregate.y,
            targetX,
            targetY: row.hourlyRate,
            bubbleView: view,
            categoryKey,
            label: aggregate.label,
            fullName: aggregate.fullName,
            colour: aggregate.colour,
            statistics: aggregate.statistics,
            ...row
          });
        });
      });

      return points;
    }

    function splitBubble(view, categoryKey) {
      const store = bubbleStores[view];

      if (
        !chart ||
        activeView !== view ||
        interactionLocked ||
        store.splitKeys.has(categoryKey)
      ) {
        return;
      }

      const points = rawBubblePoints(view, categoryKey);

      if (!points.length) {
        return;
      }

      const shouldDim = store.splitKeys.size === 0;
      interactionLocked = true;
      store.splitKeys.add(categoryKey);
      store.splitProgress.set(categoryKey, 0);

      points.forEach(point => {
        point.startX = point.x;
        point.startY = point.y;
      });

      store.rawPoints.push(...points);
      chart.data.datasets[1].data = store.rawPoints;
      chart.update('none');
      updateReaggregateButton();

      animationController.run({
        duration: CONFIG.splitAnimationMs,
        easing: easeOutCubic,
        onFrame(progress) {
          store.splitProgress.set(categoryKey, progress);

          if (shouldDim) {
            store.dimProgress = progress;
          }

          points.forEach(point => {
            point.x =
              point.startX +
              (point.targetX - point.startX) * progress;
            point.y =
              point.startY +
              (point.targetY - point.startY) * progress;
          });

          chart.update('none');
        },
        onComplete() {
          points.forEach(point => {
            point.x = point.targetX;
            point.y = point.targetY;
          });

          store.splitProgress.delete(categoryKey);

          if (shouldDim) {
            store.dimProgress = 1;
          }

          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();
        }
      });
    }

    function reaggregate(callback = null) {
      const store = bubbleStores[activeView];

      if (
        !store ||
        !store.splitKeys.size ||
        interactionLocked ||
        !chart
      ) {
        return;
      }

      interactionLocked = true;
      store.mergeProgress = 0;
      store.splitKeys.forEach(key => store.mergingKeys.add(key));

      store.rawPoints.forEach(point => {
        const aggregate = store.aggregates.find(
          item => item.categoryKey === point.categoryKey
        );

        point.startX = point.x;
        point.startY = point.y;
        point.endX = aggregate?.x ?? point.x;
        point.endY = aggregate?.y ?? point.y;
      });

      chart.update('none');
      updateReaggregateButton();

      animationController.run({
        duration: CONFIG.mergeAnimationMs,
        easing: easeInOutCubic,
        onFrame(progress) {
          store.mergeProgress = progress;
          store.dimProgress = 1 - progress;

          store.rawPoints.forEach(point => {
            point.x =
              point.startX +
              (point.endX - point.startX) * progress;
            point.y =
              point.startY +
              (point.endY - point.startY) * progress;
          });

          chart.update('none');
        },
        onComplete() {
          store.rawPoints = [];
          chart.data.datasets[1].data = store.rawPoints;
          store.splitKeys.clear();
          store.splitProgress.clear();
          store.mergingKeys.clear();
          store.mergeProgress = 0;
          store.dimProgress = 0;
          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();
          callback?.();
        }
      });
    }

    reaggregateButton.addEventListener(
      'click',
      () => {
        reaggregate();
      }
    );

    tabsController =
      PFF.setupTabs({
        tabList,
        tabs:
          chartTabs,
        scroller:
          tabList,
        leftButton:
          tabScrollLeft,
        rightButton:
          tabScrollRight,
        valueAttribute:
          'view',
        initialValue:
          activeView,
        controlled:
          true,
        onRequest(nextView) {
          requestViewSwitch(
            nextView
          );
        }
      });

    legendController =
      PFFCharts.setupDisplayLegend({
        legend:
          chartLegend,
        leftButton:
          legendScrollLeft,
        rightButton:
          legendScrollRight
      });

    interactionsController =
      PFFCharts.setupChartInteractions({
        canvas:
          chartCanvas,
        getChart() {
          return chart;
        }
      });

    responsiveController =
      PFFCharts.createResponsiveController({
        getChart() {
          return chart;
        },
        observe: [
          app,
          chartShell
        ],
        applyResponsiveChartOptions:
          false,
        onRefresh() {
          tabsController?.update();
          legendController?.refresh();
        }
      });

    async function loadDashboard() {
      await PFF.initialiseApp({
        app,
        status:
          statusElement,
        forceCached:
          FORCE_CACHED_DATA,
        cacheKey:
          CONFIG.localCacheKey,
        minRows:
          1,
        dataSourceOptions: {
          indicator:
            dataSourceIndicator,
          text:
            dataSourceText
        },
        loadLive() {
          return PFFCharts.loadGVizSheet({
            sheetId:
              CONFIG.sheetId,
            sheetName:
              CONFIG.sheetName,
            range:
              CONFIG.range,
            headers:
              '1',
            query:
              'select *',
            timeoutMs:
              CONFIG.fetchTimeoutMs
          });
        },
        parseLive(table) {
          const parsedRows =
            normaliseRows(
              table?.rows || []
            );

          if (!parsedRows.length) {
            throw new Error(
              'No valid hourly rate rows were found in columns A to J'
            );
          }

          return parsedRows;
        },
        loadRemoteCache() {
          return PFFCharts.loadAppsScriptCache({
            url:
              CACHE_WEB_APP_URL,
            appKey:
              CACHE_APP_KEY,
            timeoutMs:
              CACHE_FETCH_TIMEOUT_MS
          });
        },
        parseRemoteCache(response) {
          const sourceRows =
            Array.isArray(
              response?.data?.rows
            )
              ? response.data.rows
              : [];

          if (!sourceRows.length) {
            throw new Error(
              'Cached casual rate data has no rows'
            );
          }

          const cachedRows =
            sourceRows.map(
              (
                row,
                rowIndex
              ) => {
                if (
                  !Array.isArray(row) ||
                  row.length < 6
                ) {
                  throw new Error(
                    `Cached casual rate row ${rowIndex + 1} is malformed`
                  );
                }

                return row
                  .slice(
                    0,
                    6
                  )
                  .map(value =>
                    String(
                      value ??
                      ''
                    ).trim()
                  );
              }
            );

          const parsedRows =
            cachedRows
              .map(
                (row, sourceIndex) => ({
                  sourceIndex,
                  date:
                    parseDate(row[0]),
                  hourlyRate:
                    toNumber(row[1]),
                  experience:
                    toNumber(row[2]),
                  rurality:
                    normaliseRurality(
                      row[3]
                    ),
                  state:
                    normaliseState(
                      row[4]
                    ),
                  employerKey:
                    normaliseEmployer(
                      row[5]
                    )
                })
              )
              .filter(
                row =>
                  Number.isFinite(
                    row.hourlyRate
                  ) &&
                  row.hourlyRate >
                    CONFIG.minimumRate &&
                  row.hourlyRate <=
                    CONFIG.maximumRate
              )
              .map(row => ({
                ...row,
                experience:
                  Number.isFinite(
                    row.experience
                  )
                    ? row.experience
                    : null
              }));

          if (!parsedRows.length) {
            throw new Error(
              'No valid cached hourly rate rows were found'
            );
          }

          return parsedRows;
        },
        onLiveError(error) {
          console.warn(
            'Live Google Sheets casual rate data could not be used',
            error
          );
        },
        onRemoteCacheError(error) {
          console.warn(
            'Cached casual rate backend data could not be used',
            error
          );
        },
        render(loaded) {
          rows =
            loaded.rows;

          rebuildBubbleStore(
            'state'
          );

          rebuildBubbleStore(
            'employer'
          );

          createChart();

          tabsController?.set(
            activeView,
            {
              animate: false,
              notify: false
            }
          );

          return chart;
        },
        onReady() {
          responsiveController?.refresh();
        },
        onError(error) {
          dataSourceIndicator.style.display =
            '';

          dataSourceIndicator.classList.remove(
            'is-cached'
          );

          dataSourceIndicator.classList.add(
            'is-unavailable'
          );

          dataSourceIndicator.setAttribute(
            'aria-label',
            'Data unavailable'
          );

          dataSourceText.textContent =
            'DATA unavailable';

          const message =
            FORCE_CACHED_DATA &&
            error?.message ===
              'Live data was skipped because forceCached is enabled.'
              ? 'Unable to load casual rate data'
              : String(
                  error?.message ||
                  'Unable to load casual rate data'
                );

          PFF.setStatus(
            '⚠ ' +
            message,
            statusElement
          );
        }
      });
    }

    loadDashboard();
  </script>
</body>
