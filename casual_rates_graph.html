<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Casual Rates Data</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --yellow: #f1c232;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      color: var(--ink);
      font-family: 'Lato', sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      height: 100%;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      margin-inline: auto;
      padding: 7px 6px 0;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      animation-duration: 2.7s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.blue {
      left: 33px;
      background: rgba(74, 86, 255, 0.82);
      animation-name: blueCone;
    }

    .cone.green {
      left: 69px;
      background: rgba(36, 210, 116, 0.78);
      animation-name: greenCone;
    }

    .cone.red {
      left: 85px;
      background: rgba(255, 92, 48, 0.76);
      animation-name: redCone;
    }

    .loader-text {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    @keyframes blueCone {
      0%, 100% { opacity: 0; }
      12%, 76% { opacity: 1; }
      87% { opacity: 0; }
    }

    @keyframes greenCone {
      0%, 20%, 100% { opacity: 0; }
      32%, 76% { opacity: 1; }
      87% { opacity: 0; }
    }

    @keyframes redCone {
      0%, 40%, 100% { opacity: 0; }
      52%, 76% { opacity: 1; }
      87% { opacity: 0; }
    }

    .module-top {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: var(--tab-indicator-width, 0px);
      height: 2px;
      background: var(--purple);
      transform: translate3d(var(--tab-indicator-x, 0px), 0, 0);
      transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        width 420ms cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .chart-tab.is-active {
      color: var(--purple);
      cursor: default;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      flex: 0 0 auto;
      width: 100%;
      margin-top: 3px;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
    }

    #status:empty {
      display: none;
    }

    .chart-heading-row {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      height: 30px;
      min-height: 30px;
    }

    .chart-heading {
      margin: 0;
      padding: 4px 112px 0 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      white-space: nowrap;
    }

    .chart-heading-detail {
      display: inline-block;
      margin-left: 0.28em;
    }

    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;
      display: inline-flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      color: var(--purple);
      font-size: 15px;
    }

    .chart-options-row {
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      min-height: 28px;
      align-items: center;
      padding-bottom: 2px;
    }

    .legend-nav {
      position: relative;
      flex: 1 1 auto;
      min-width: 54px;
      height: 28px;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-scroll-button {
      position: absolute;
      top: 3px;
      z-index: 3;
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .legend-scroll-left {
      left: 0;
    }

    .legend-scroll-right {
      right: 0;
    }

    .legend-scroll-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .legend-square {
      width: 7px;
      height: 7px;
    }

    .legend-line {
      width: 17px;
      height: 3px;
      border-radius: 2px;
    }

    .legend-bubble {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin-top: -2px;
      overflow: hidden;
      contain: layout paint;
    }

    .chart-note {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      max-width: min(252px, calc(100% - 82px));
      padding: 8px 9px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(105, 113, 138, 0.16);
      border-radius: 4px;
      font-size: 9px;
      line-height: 1.35;
      pointer-events: none;
    }

    .chart-note.is-hidden {
      display: none;
    }

    #casualChart {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      user-select: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 0;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .chart-heading {
        padding-right: 105px;
        font-size: 14px;
      }

      .reaggregate-button {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading casual rate data"
      >
        <div class="cone-loader">
          <div class="cone blue"></div>
          <div class="cone green"></div>
          <div class="cone red"></div>
        </div>
        <div class="loader-text">Loading casual rate data...</div>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div class="tab-list" role="tablist">
            <button class="chart-tab is-active" data-view="experience">Experience</button>
            <button class="chart-tab" data-view="rurality">Rurality</button>
            <button class="chart-tab" data-view="state">State</button>
            <button class="chart-tab" data-view="employer">Employer</button>
            <button class="chart-tab" data-view="date">Time</button>
          </div>
        </div>

        <div class="live-data">
          <span class="live-data-dot"></span>
          <span>LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert"></div>

      <div class="chart-heading-row">
        <h2 class="chart-heading">
          <span>Casual rates</span><span id="chartHeadingDetail" class="chart-heading-detail">by experience</span>
        </h2>

        <button
          id="reaggregateButton"
          class="reaggregate-button is-hidden"
          type="button"
          tabindex="-1"
        >
          <span>Re-aggregate</span>
          <span class="reset-icon">↻</span>
        </button>
      </div>

      <div class="chart-options-row">
        <div class="legend-nav">
          <button id="legendScrollLeft" class="legend-scroll-button legend-scroll-left is-hidden">‹</button>
          <div id="chartLegend" class="chart-legend"></div>
          <button id="legendScrollRight" class="legend-scroll-button legend-scroll-right is-hidden">›</button>
        </div>
      </div>

      <div class="chart-shell">
        <aside id="chartNote" class="chart-note is-hidden"></aside>
        <canvas id="casualChart" tabindex="-1"></canvas>
      </div>
    </main>
  </div>

  <script>
    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    const CONFIG = {
      sheetId: '1UZizMV2CNlyNbKytN4QCSc4HcsKCx-PxOrboJyMCN1E',
      sheetName: 'Data',
      range: 'A:J',
      timeoutMs: 20000,
      pointRadius: 2.7,
      pointHoverRadius: 4.4,
      regressionWidth: 3.6,
      minimumRate: 0,
      maximumRate: 500,
      splitMs: 820,
      mergeMs: 820,
      doubleActivationMs: 420
    };

    const VIEW_CONFIG = {
      experience: 'by experience',
      rurality: 'by rurality',
      state: 'by state',
      employer: 'by employer',
      date: 'over time'
    };

    const STATE_ORDER = ['NSW', 'QLD', 'VIC', 'ACT', 'SA', 'NT', 'WA', 'TAS'];

    const STATE_COLOURS = {
      NSW: '#2db7f5',
      QLD: '#7a0036',
      ACT: '#7b61ff',
      VIC: '#2d3a8c',
      SA: '#f03a47',
      NT: '#c25e00',
      WA: '#000000',
      TAS: '#22a36b'
    };

    const RURALITY_ORDER = ['MM1', 'MM2', 'MM3', 'MM4', 'MM5', 'MM6', 'MM7'];

    const RURALITY_COLOURS = {
      MM1: '#3f4851',
      MM2: '#4f1500',
      MM3: '#7e2800',
      MM4: '#a14216',
      MM5: '#c87452',
      MM6: '#e1b69a',
      MM7: '#f3e0d3'
    };

    const EMPLOYERS = [
      { key: 'toss', label: 'TOSS', fullName: 'The Optical Super Store', colour: '#ff2401', aliases: ['TOSS', 'The Optical Superstore', 'The Optical Super Store'] },
      { key: 'th', label: 'TH', fullName: "Teacher's Health", colour: '#007781', aliases: ['TH', 'THF', 'Teachers Health', 'Teachers Health Fund', "Teacher's Health", "Teacher's Health Fund", 'Teacher’s Health Fund'] },
      { key: 'costco', label: 'Costco', fullName: 'Costco Optical', colour: '#e32a36', aliases: ['Costco', 'Costco Optical'] },
      { key: 'ow', label: 'OW', fullName: 'Oscar Wylee', colour: '#f16c20', aliases: ['OW', 'Oscar Wylee'] },
      { key: 'bn', label: 'BN', fullName: 'Bailey Nelson', colour: '#002e5a', aliases: ['BN', 'Bailey Nelson'] },
      { key: '1001', label: '1001', fullName: '1001 Optometry', colour: '#000000', aliases: ['1001', '1001 Optometry'] },
      { key: 'cw', label: 'CW', fullName: 'Chemist Warehouse Optometry', colour: '#ea0f0f', aliases: ['CW', 'Chemist Warehouse', 'Chemist Warehouse Optometry', 'Chemist/Optometrist Warehouse'] },
      { key: 'indie', label: 'Indie', fullName: 'Independent', colour: '#5a3be7', aliases: ['Indie', 'Independent'] },
      { key: 'hcf', label: 'HCF', fullName: 'HCF Eyecare', colour: '#da1c5c', aliases: ['HCF', 'HCF Eyecare'] },
      { key: 'ophthal', label: 'Ophthal', fullName: 'Ophthalmologist', colour: '#ffb000', aliases: ['Ophthal', 'Ophthalmologist', 'Ophthal practice'] },
      { key: 'toc', label: 'TOC', fullName: 'The Optical Company', colour: '#13543c', aliases: ['NIB', 'TOC', 'The Optical Company', 'The Optical Company (incl. NIB)', 'NIB (incl. the Optical Company)'] },
      { key: 'ss', label: 'SS', fullName: 'Specsavers', colour: '#009552', aliases: ['SS', 'Specsavers'] },
      { key: 'bupa', label: 'Bupa', fullName: 'Bupa Optical', colour: '#0075c2', aliases: ['Bupa', 'Bupa Optical'] },
      { key: 'other', label: 'Other', fullName: 'Other', colour: '#bfc3c7', aliases: ['Other', 'Other (e.g., uni, hospital, govt, not-for-profit)'] },
      { key: 'opsm', label: 'OPSM', fullName: 'OPSM', colour: '#6fb0d4', aliases: ['OPSM', 'OPSM (incl. L&P, EyeQ)'] },
      { key: 'dresden', label: 'Dresden', fullName: 'Dresden Vision', colour: '#999999', aliases: ['Dresden', 'Dresden Vision'] },
      { key: 'obnp', label: 'ObNP', fullName: 'Optical by National Pharmacies', colour: '#2cb4a6', aliases: ['ObNP', 'Optical by National Pharmacies'] },
      { key: 'gm', label: 'G&M', fullName: 'George & Matilda Eyecare', colour: '#000000', aliases: ['G&M', 'George & Matilda', 'George & Matilda Eyecare'] }
    ];

    const EMPLOYER_BY_KEY = new Map(
      EMPLOYERS.map(employer => [employer.key, employer])
    );

    const DAY_MS = 86400000;
    const YEAR_MS = 365.2425 * DAY_MS;

    const app = document.getElementById('app');
    const loadingState = document.getElementById('loadingState');
    const statusElement = document.getElementById('status');
    const headingDetail = document.getElementById('chartHeadingDetail');
    const chartCanvas = document.getElementById('casualChart');
    const chartLegend = document.getElementById('chartLegend');
    const chartNote = document.getElementById('chartNote');
    const tabs = [...document.querySelectorAll('.chart-tab')];
    const tabList = document.querySelector('.tab-list');
    const reaggregateButton = document.getElementById('reaggregateButton');
    const legendScrollLeft = document.getElementById('legendScrollLeft');
    const legendScrollRight = document.getElementById('legendScrollRight');

    let rows = [];
    let chart = null;
    let activeView = 'experience';
    let interactionLocked = false;
    let animationFrame = null;
    let lastBubbleClick = '';
    let lastBubbleClickAt = 0;

    const yAxisModel = {
      minimum: 40,
      maximum: 160,
      majorStep: 10,
      minorStep: 5
    };

    function createBubbleStore() {
      return {
        categories: [],
        aggregates: [],
        rowsByKey: new Map(),
        rawPoints: [],
        splitKeys: new Set(),
        splitProgress: new Map(),
        mergingKeys: new Set(),
        mergeProgress: 0,
        dimProgress: 0
      };
    }

    const bubbleStores = {
      state: createBubbleStore(),
      employer: createBubbleStore()
    };

    function cleanText(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function normaliseText(value) {
      return cleanText(value)
        .replace(/[’‘]/g, "'")
        .toLowerCase();
    }

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function rgba(colour, opacity) {
      const match = String(colour || '').match(/^#([0-9a-f]{6})$/i);

      if (!match) {
        return `rgba(119,119,119,${opacity})`;
      }

      const digits = match[1];

      return `rgba(${parseInt(digits.slice(0, 2), 16)},${parseInt(
        digits.slice(2, 4),
        16
      )},${parseInt(digits.slice(4, 6), 16)},${opacity})`;
    }

    function toNumber(value) {
      const number = Number(
        cleanText(value).replace(/[^\d.-]/g, '')
      );

      return Number.isFinite(number) ? number : NaN;
    }

    function getCellValue(cell) {
      return cell?.v ?? cell?.f ?? '';
    }

    function parseDate(value) {
      if (
        typeof value === 'number' &&
        value > 20000 &&
        value < 80000
      ) {
        return Date.UTC(1899, 11, 30) + value * DAY_MS;
      }

      const text = cleanText(value);
      const googleDate = text.match(
        /^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/
      );

      if (googleDate) {
        return Date.UTC(
          Number(googleDate[1]),
          Number(googleDate[2]),
          Number(googleDate[3])
        );
      }

      const auDate = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})/
      );

      if (auDate) {
        let year = Number(auDate[3]);

        if (year < 100) {
          year += 2000;
        }

        return Date.UTC(
          year,
          Number(auDate[2]) - 1,
          Number(auDate[1])
        );
      }

      const parsed = new Date(text);

      return Number.isNaN(parsed.getTime())
        ? null
        : Date.UTC(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
          );
    }

    function normaliseRurality(value) {
      const match = cleanText(value)
        .toUpperCase()
        .match(/(?:MM\s*)?([1-7])/);

      return match ? `MM${match[1]}` : null;
    }

    function normaliseState(value) {
      return cleanText(value)
        .toUpperCase()
        .match(/\b(?:NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/)?.[0] || null;
    }

    function normaliseEmployer(value) {
      const text = normaliseText(value);

      if (!text || text === 'x' || text === 'xxx') {
        return null;
      }

      const employer = EMPLOYERS.find(item =>
        [
          item.key,
          item.label,
          item.fullName,
          ...item.aliases
        ].some(candidate => normaliseText(candidate) === text)
      );

      return employer?.key || 'other';
    }

    function percentile(sorted, probability) {
      if (!sorted.length) {
        return NaN;
      }

      const index = (sorted.length - 1) * probability;
      const lower = Math.floor(index);
      const upper = Math.ceil(index);

      if (lower === upper) {
        return sorted[lower];
      }

      return (
        sorted[lower] +
        (sorted[upper] - sorted[lower]) *
        (index - lower)
      );
    }

    function statistics(values) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort((a, b) => a - b);

      return {
        count: sorted.length,
        median: percentile(sorted, 0.5),
        q1: percentile(sorted, 0.25),
        q3: percentile(sorted, 0.75)
      };
    }

    function formatNumber(value, decimals = 1) {
      return Number.isFinite(Number(value))
        ? new Intl.NumberFormat('en-AU', {
            maximumFractionDigits: decimals
          }).format(Number(value))
        : '—';
    }

    function formatCurrency(value, decimals = 0) {
      return Number.isFinite(Number(value))
        ? new Intl.NumberFormat('en-AU', {
            style: 'currency',
            currency: 'AUD',
            minimumFractionDigits: 0,
            maximumFractionDigits: decimals
          }).format(Number(value))
        : '—';
    }

    function formatDate(timestamp) {
      return new Intl.DateTimeFormat('en-AU', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        timeZone: 'UTC'
      }).format(new Date(timestamp));
    }

    function formatMedianIqr(stats) {
      return (
        `${formatCurrency(stats?.median, 1)}/hour ` +
        `[${formatNumber(stats?.q1, 1)}, ${formatNumber(stats?.q3, 1)}]`
      );
    }

    function recordLines(raw) {
      return [
        Number.isFinite(raw?.experience)
          ? `Experience: ${formatNumber(raw.experience, 1)} years`
          : 'Experience: Unspecified',
        `Rurality: ${raw?.rurality || 'Unspecified'}`,
        `State: ${raw?.state || 'Unspecified'}`,
        `Employer: ${
          EMPLOYER_BY_KEY.get(raw?.employerKey)?.fullName ||
          'Unspecified'
        }`,
        Number.isFinite(raw?.date)
          ? `Date: ${formatDate(raw.date)}`
          : 'Date: Unspecified'
      ];
    }

    function regression(data, transform = value => value) {
      const usable = data
        .map(point => ({
          originalX: point.x,
          x: transform(point.x),
          y: point.y
        }))
        .filter(point =>
          Number.isFinite(point.x) &&
          Number.isFinite(point.y)
        );

      if (usable.length < 2) {
        return null;
      }

      const meanX = usable.reduce((sum, point) => sum + point.x, 0) / usable.length;
      const meanY = usable.reduce((sum, point) => sum + point.y, 0) / usable.length;

      let numerator = 0;
      let denominator = 0;

      usable.forEach(point => {
        numerator += (point.x - meanX) * (point.y - meanY);
        denominator += Math.pow(point.x - meanX, 2);
      });

      if (!denominator) {
        return null;
      }

      const slope = numerator / denominator;
      const intercept = meanY - slope * meanX;

      return {
        slope,
        minimumX: Math.min(...usable.map(point => point.originalX)),
        maximumX: Math.max(...usable.map(point => point.originalX)),
        predict: originalX => intercept + slope * transform(originalX)
      };
    }

    function loadRows() {
      return new Promise((resolve, reject) => {
        const callback = `pffCasual_${Date.now()}_${Math.floor(
          Math.random() * 100000
        )}`;

        const script = document.createElement('script');
        let finished = false;

        const timeout = setTimeout(() => {
          done(new Error('Could not load Google Sheet data'));
        }, CONFIG.timeoutMs);

        function cleanup() {
          clearTimeout(timeout);

          try {
            delete window[callback];
          } catch (_) {
            window[callback] = undefined;
          }

          script.remove();
        }

        function done(error, response) {
          if (finished) {
            return;
          }

          finished = true;
          cleanup();

          if (error) {
            reject(error);
          } else if (!response || response.status === 'error') {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                'Could not load Google Sheet data'
              )
            );
          } else {
            resolve(response?.table?.rows || []);
          }
        }

        window[callback] = response => done(null, response);
        script.onerror = () => done(new Error('Network error loading Google Sheet data'));

        const params = new URLSearchParams({
          sheet: CONFIG.sheetName,
          range: CONFIG.range,
          headers: '1',
          tq: 'select *',
          tqx: `responseHandler:${callback}`,
          _: String(Date.now())
        });

        script.src =
          `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?` +
          params.toString();

        document.body.appendChild(script);
      });
    }

    function normaliseRows(sourceRows) {
      return sourceRows
        .map((sourceRow, sourceIndex) => {
          const cells = sourceRow?.c || [];

          return {
            sourceIndex,
            date:
              parseDate(cells[0]?.v) ??
              parseDate(cells[0]?.f),
            hourlyRate: toNumber(getCellValue(cells[1])),
            experience: toNumber(getCellValue(cells[2])),
            rurality: normaliseRurality(getCellValue(cells[4])),
            state: normaliseState(getCellValue(cells[8])),
            employerKey: normaliseEmployer(getCellValue(cells[9]))
          };
        })
        .filter(row =>
          Number.isFinite(row.hourlyRate) &&
          row.hourlyRate > CONFIG.minimumRate &&
          row.hourlyRate <= CONFIG.maximumRate
        )
        .map(row => ({
          ...row,
          experience: Number.isFinite(row.experience)
            ? row.experience
            : null
        }));

    function continuousView({
      availableRows,
      xAccessor,
      xScale,
      regressionType,
      slopeLabel,
      slopeMultiplier = 1
    }) {
      const points = availableRows
        .map(row => ({
          x: xAccessor(row),
          y: row.hourlyRate,
          kind: 'raw',
          ...row
        }))
        .filter(point => Number.isFinite(point.x));

      const transform =
        regressionType === 'logarithmic'
          ? value => Math.log1p(Math.max(0, value))
          : value => value;

      const fitted = regression(points, transform);

      const datasets = [
        {
          type: 'scatter',
          role: 'raw',
          label: 'Hourly weekday rate',
          data: points,
          parsing: false,
          pointStyle: 'rect',
          pointRadius: CONFIG.pointRadius,
          pointHoverRadius: CONFIG.pointHoverRadius,
          pointBackgroundColor: rgba('#6600ff', 0.20),
          pointHoverBackgroundColor: rgba('#6600ff', 0.68),
          pointBorderColor: rgba('#6600ff', 0.34),
          pointHoverBorderColor: '#6600ff',
          pointBorderWidth: 0.45,
          pointHoverBorderWidth: 1,
          showLine: false,
          clip: false
        }
      ];

      if (fitted) {
        const count = regressionType === 'logarithmic' ? 96 : 2;
        const span = fitted.maximumX - fitted.minimumX;

        datasets.push({
          type: 'line',
          role: 'regression',
          label:
            regressionType === 'logarithmic'
              ? 'Logarithmic regression'
              : 'Linear regression',
          data: Array.from(
            {
              length: count
            },
            (_, index) => {
              const proportion =
                count === 1 ? 0 : index / (count - 1);

              const x =
                fitted.minimumX +
                span * proportion;

              return {
                x,
                y: fitted.predict(x)
              };
            }
          ),
          parsing: false,
          showLine: true,
          pointRadius: 0,
          pointHitRadius: 7,
          borderColor: '#f1c232',
          backgroundColor: '#f1c232',
          borderWidth: CONFIG.regressionWidth,
          borderCapStyle: 'round',
          borderJoinStyle: 'round',
          tension: regressionType === 'logarithmic' ? 0.12 : 0,
          metadata: {
            slope: fitted.slope,
            slopeLabel,
            slopeMultiplier
          }
        });
      }

      return {
        datasets,
        xScale: fixedXAxis(xScale),
        legend: [
          {
            colour: rgba('#6600ff', 0.20),
            label: 'Hourly weekday rate',
            marker: 'square'
          },
          {
            colour: '#f1c232',
            label:
              regressionType === 'logarithmic'
                ? 'Logarithmic regression'
                : 'Linear regression',
            marker: 'line'
          }
        ],
        note: ''
      };
    }

    function startOfMonth(timestamp) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth(),
        1
      );
    }

    function addMonths(timestamp, months) {
      const date = new Date(timestamp);

      return Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth() + months,
        1
      );
    }

    function dateView() {
      const availableRows = rows.filter(row =>
        Number.isFinite(row.date)
      );

      const values = availableRows.map(row => row.date);
      const minimum = Math.min(...values);
      const maximum = Math.max(...values);
      const firstMonth = startOfMonth(minimum);
      const finalMonth = startOfMonth(maximum);
      const monthAfterLast = addMonths(finalMonth, 1);
      const ticks = [];

      for (
        let month = firstMonth;
        month <= finalMonth;
        month = addMonths(month, 1)
      ) {
        ticks.push(month);
      }

      return continuousView({
        availableRows,
        xAccessor: row => row.date,
        regressionType: 'linear',
        slopeLabel: '/hour per year',
        slopeMultiplier: YEAR_MS,
        xScale: {
          type: 'linear',
          min: firstMonth,
          max: monthAfterLast,
          afterBuildTicks(scale) {
            scale.ticks = ticks.map(value => ({ value }));
          },
          title: {
            display: true,
            text: 'Date submitted',
            color: '#151515',
            font: {
              family: 'Lato',
              size: 13,
              weight: '700'
            }
          },
          ticks: {
            color: '#151515',
            autoSkip: false,
            maxRotation: 0,
            minRotation: 0,

              family: 'Lato',
              size: window.matchMedia('(max-width: 430px)').matches
                ? 9

            callback(value) {
              const date = new Date(Number(value));
              const month = date.getUTCMonth();

              return [0, 3, 6, 9].includes(month)
                ? `${String(month + 1).padStart(2, '0')}/${date.getUTCFullYear()}`
                : '';
            }
          },
          grid: {
            drawOnChartArea: false,
            drawTicks: true,
            tickColor: '#151515'
          },
          border: {
            display: true,
            color: '#151515',
            width: 1.1
          }
        }
      });
    }

    function bubbleConfig(view) {
      if (view === 'employer') {
        return {
          order: EMPLOYERS.map(employer => employer.key),
          accessor: row => row.employerKey,
          label: key => EMPLOYER_BY_KEY.get(key)?.label || key,
          fullName: key => EMPLOYER_BY_KEY.get(key)?.fullName || key,
          colour: key => EMPLOYER_BY_KEY.get(key)?.colour || '#777777'
        };
      }

      return {
        order: STATE_ORDER,
        accessor: row => row.state,
        label: key => key,
        fullName: key => key,
        colour: key => STATE_COLOURS[key] || '#777777'
      };
    }

    function bubbleRadius(respondents, view) {
      return clamp(
        11 + Math.pow(respondents, 0.78) * 3.15,
        18,
        view === 'employer' ? 54 : 66
      );
    }

    function bubblePositions(items) {
      const sorted = items
        .slice()
        .sort((a, b) =>
          a.y - b.y ||
          b.statistics.count - a.statistics.count
        );

      const laneLast = [];
      const laneByKey = new Map();

      sorted.forEach(item => {
        let lane = laneLast.findIndex(last =>
          item.y - last > 10
        );

        if (lane === -1) {
          lane = laneLast.length;
          laneLast.push(item.y);
        } else {
          laneLast[lane] = item.y;
        }

        laneByKey.set(item.categoryKey, lane);
      });

      const count = Math.max(5, laneLast.length);

      return new Map(
        [...laneByKey.entries()].map(([key, lane]) => [
          key,
          15 + lane / Math.max(1, count - 1) * 71
        ])
      );
    }

    function rebuildBubbleStore(view) {
      const store = bubbleStores[view];
      const config = bubbleConfig(view);

      store.categories = config.order.filter(key =>
        rows.some(row => config.accessor(row) === key)
      );

      store.rowsByKey = new Map();

      const aggregates = store.categories.map(categoryKey => {
        const categoryRows = rows.filter(row =>
          config.accessor(row) === categoryKey
        );

        const stats = statistics(
          categoryRows.map(row => row.hourlyRate)
        );

        store.rowsByKey.set(categoryKey, categoryRows);

        return {
          x: 15,
          y: stats.median,
          bubbleView: view,
          categoryKey,
          label: config.label(categoryKey),
          fullName: config.fullName(categoryKey),
          colour: config.colour(categoryKey),
          baseRadius: bubbleRadius(stats.count, view),
          statistics: stats
        };
      });

      const positions = bubblePositions(aggregates);

      store.aggregates = aggregates
        .map(item => ({
          ...item,
          x: positions.get(item.categoryKey) ?? 15
        }))
        .sort((a, b) =>
          b.y - a.y ||
          b.baseRadius - a.baseRadius
        );
    }

    function bubbleVisibility(raw) {
      const store = bubbleStores[raw.bubbleView];

      if (store.splitProgress.has(raw.categoryKey)) {
        return 1 - store.splitProgress.get(raw.categoryKey);
      }

      if (store.mergingKeys.has(raw.categoryKey)) {
        return store.mergeProgress;
      }

      return store.splitKeys.has(raw.categoryKey)
        ? 0
        : 1;
    }

    function displayedBubbleRadius(context) {
      const raw = context.raw;

      if (!raw) {
        return 0;
      }

      const visibility = bubbleVisibility(raw);

      if (visibility <= 0.001) {
        return 0;
      }

      const scale = Math.min(
        clamp((context.chart.width || 520) / 520, 0.78, 1.05),
        clamp((context.chart.height || 585) / 585, 0.68, 1.04)
      );

      return raw.baseRadius * scale;
    }

    function bubbleView(view) {
      const store = bubbleStores[view];
      const config = bubbleConfig(view);

      return {
        datasets: [
          {
            type: 'scatter',
            role: 'bubbleAggregate',
            data: store.aggregates,
            parsing: false,
            pointRadius: displayedBubbleRadius,
            pointHoverRadius(context) {
              const radius = displayedBubbleRadius(context);

              return interactionLocked
                ? radius
                : radius + 0.8;
            },
            pointHitRadius: 0,
            pointBackgroundColor(context) {
              const raw = context.raw;
              const opacity =
                0.91 +
                (0.48 - 0.91) *
                bubbleStores[raw.bubbleView].dimProgress;

              return rgba(
                raw.colour,
                opacity * bubbleVisibility(raw)
              );
            },
            pointHoverBackgroundColor(context) {
              const raw = context.raw;
              const opacity =
                0.98 +
                (0.60 - 0.98) *
                bubbleStores[raw.bubbleView].dimProgress;

              return rgba(
                raw.colour,
                opacity * bubbleVisibility(raw)
              );
            },
            pointBorderWidth: 0,
            showLine: false,
            clip: false
          },
          {
            type: 'scatter',
            role: 'bubbleRaw',
            data: store.rawPoints,
            parsing: false,
            pointRadius: 4,
            pointHoverRadius: 4.8,
            pointHitRadius: 2,
            pointBackgroundColor(context) {
              return rgba(context.raw?.colour, 0.91);
            },
            pointHoverBackgroundColor(context) {
              return rgba(context.raw?.colour, 0.98);
            },
            pointBorderWidth: 0,
            showLine: false,
            clip: false
          }

        xScale: fixedXAxis({

          max: 100,

            display: false
          },

            display: false
          },

            drawOnChartArea: false,

          },

          colour: config.colour(key),

    function viewModel(view) {
      if (view === 'rurality') {
        return ruralityView();
      }

      if (view === 'state' || view === 'employer') {
        return bubbleView(view);
      }

      if (view === 'date') {
        return dateView();
      }

      return experienceView();
    }

    const bubbleLabelPlugin = {
      id: 'bubbleLabelPlugin',

      afterDatasetDraw(activeChart, args) {
        if (
          !['state', 'employer'].includes(activeView) ||
          args.index !== 0 ||
          activeChart.data.datasets[0]?.role !== 'bubbleAggregate'
        ) {
          return;
        }

        const context = activeChart.ctx;
        const dataset = activeChart.data.datasets[0];
        const elements = activeChart.getDatasetMeta(0).data;

        elements.forEach((element, index) => {
          const raw = dataset.data[index];
          const visibility = bubbleVisibility(raw);

          if (visibility <= 0.02) {
            return;
          }

          context.save();
          context.globalAlpha =
            visibility *
            (1 - bubbleStores[raw.bubbleView].dimProgress * 0.43);
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.font =
            `700 ${raw.bubbleView === 'employer' ? 11 : 13}px Lato, sans-serif`;
          context.lineWidth = 1.7;
          context.strokeStyle = 'rgba(255,255,255,0.94)';
          context.fillStyle = '#151515';
          context.strokeText(raw.label, element.x, element.y);
          context.fillText(raw.label, element.x, element.y);
          context.restore();
        });
      }
    };

    function tooltipTitle(item) {
      const raw = item?.raw;
      const role = item?.dataset?.role;

      if (
        role === 'bubbleAggregate' ||
        role === 'bubbleRaw'
      ) {
        return raw?.fullName || raw?.label || '';
      }

      if (role === 'median') {
        return item?.dataset?.metadata?.category || '';
      }

      if (role === 'regression') {
        return item?.dataset?.label || '';
      }

      return raw?.category || 'Casual rate';
    }

    function tooltipLabel(item) {
      const role = item.dataset.role;
      const raw = item.raw;
      const metadata = item.dataset.metadata || {};

      if (role === 'regression') {
        const slope =
          Number(metadata.slope) *
          Number(metadata.slopeMultiplier || 1);

        return [
          `Slope: ${formatCurrency(slope, 1)}${metadata.slopeLabel || ''}`
        ];
      }

      if (role === 'median') {
        return [
          `Median [IQR]: ${formatMedianIqr(metadata.statistics)}`,
          `Respondents: ${formatNumber(metadata.statistics?.count, 0)}`
        ];
      }

      if (role === 'bubbleAggregate') {
        return [
          `Median [IQR]: ${formatMedianIqr(raw.statistics)}`,
          `Respondents: ${formatNumber(raw.statistics?.count, 0)}`,
          'Double-tap for raw rates'
        ];
      }

      if (role === 'bubbleRaw') {
        return [
          `Rate: ${formatCurrency(raw.hourlyRate, 1)}/hour`,
          ...recordLines(raw),
          `Median [IQR]: ${formatMedianIqr(raw.statistics)}`,
          `Respondents: ${formatNumber(raw.statistics?.count, 0)}`
        ];
      }

      return [
        `Rate: ${formatCurrency(raw?.hourlyRate, 1)}/hour`,
        ...recordLines(raw)
      ];
    }

    function createChart() {
      const model = viewModel(activeView);

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: 'scatter',
          data: {
            datasets: model.datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
              duration: 520,
              easing: 'easeInOutCubic'
            },
            layout: {
              autoPadding: false,
              padding: {
                top: 4,
                right: 4,
                bottom: 0,
                left: 0
              }
            },
            interaction: {
              mode: 'nearest',
              axis: 'xy',
              intersect: true
            },
            onClick(event, elements) {
              if (interactionLocked || !elements.length) {
                return;
              }

              const element = elements[0];
              const dataset = chart.data.datasets[element.datasetIndex];
              const raw = dataset.data[element.index];

              if (
                dataset.role !== 'bubbleAggregate' ||
                !raw ||
                bubbleStores[raw.bubbleView].splitKeys.has(raw.categoryKey)
              ) {
                return;
              }

              const now = performance.now();
              const key = `${raw.bubbleView}:${raw.categoryKey}`;

              if (
                lastBubbleClick === key &&
                now - lastBubbleClickAt <= CONFIG.doubleActivationMs
              ) {
                lastBubbleClick = '';
                lastBubbleClickAt = 0;
                splitBubble(raw.bubbleView, raw.categoryKey);
              } else {
                lastBubbleClick = key;
                lastBubbleClickAt = now;
              }
            },
            plugins: {
              legend: {
                display: false
              },
              tooltip: {
                enabled: true,
                displayColors: false,
                backgroundColor: '#fff',
                titleColor: '#151515',
                bodyColor: '#69718a',
                borderColor: '#e8eaf0',
                borderWidth: 1,
                cornerRadius: 4,
                padding: 9,
                callbacks: {
                  title(items) {
                    return tooltipTitle(items?.[0]);
                  },
                  label(item) {
                    return tooltipLabel(item);
                  }
                }
              }
            },
            scales: {
              x: model.xScale,
              y: yAxisOptions()
            }
          },
          plugins: [
            bubbleLabelPlugin
          ]
        }
      );

      renderLegend(model.legend);
      updateNote(model.note);
    }

    function applyView(view) {
      if (
        view === activeView ||
        interactionLocked
      ) {
        return;
      }

      const currentStore = bubbleStores[activeView];

      if (
        currentStore &&
        currentStore.splitKeys.size
      ) {
        reaggregate(() => applyView(view));
        return;
      }

      activeView = view;
      const model = viewModel(view);

      tabs.forEach(tab => {
        tab.classList.toggle(
          'is-active',
          tab.dataset.view === view
        );
      });

      headingDetail.textContent = VIEW_CONFIG[view];
      chart.data.datasets = model.datasets;
      chart.options.scales.x = model.xScale;
      chart.options.scales.y = yAxisOptions();
      chart.update();
      renderLegend(model.legend);
      updateNote(model.note);
      updateReaggregateButton();
      updateTabIndicator();
    }

    function renderLegend(items) {
      chartLegend.textContent = '';

      items.forEach(item => {
        const wrapper = document.createElement('span');
        wrapper.className = 'legend-item';

        const marker = document.createElement('span');
        marker.className =
          item.marker === 'line'
            ? 'legend-line'
            : item.marker === 'bubble'
              ? 'legend-bubble'
              : 'legend-square';

        marker.style.background = item.colour;

        const label = document.createElement('span');
        label.textContent = item.label;

        wrapper.append(marker, label);
        chartLegend.appendChild(wrapper);
      });

      requestAnimationFrame(updateLegendArrows);
    }

    function updateLegendArrows() {
      const maximum =
        chartLegend.scrollWidth -
        chartLegend.clientWidth;

      legendScrollLeft.classList.toggle(
        'is-hidden',
        maximum <= 2 ||
        chartLegend.scrollLeft <= 2
      );

      legendScrollRight.classList.toggle(
        'is-hidden',
        maximum <= 2 ||
        chartLegend.scrollLeft >= maximum - 2
      );
    }

    function updateNote(note) {
      chartNote.textContent = note || '';
      chartNote.classList.toggle('is-hidden', !note);
    }

    function updateTabIndicator() {
      const selected = tabs.find(tab =>
        tab.dataset.view === activeView
      );

      if (!selected) {
        return;
      }

      tabList.style.setProperty(
        '--tab-indicator-x',
        `${selected.offsetLeft}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${selected.offsetWidth}px`
      );

      tabList.scrollTo({
        left: Math.max(
          0,
          selected.offsetLeft -
          (tabList.clientWidth - selected.offsetWidth) / 2
        ),
        behavior: 'smooth'
      });
    }

    function updateReaggregateButton() {
      const store = bubbleStores[activeView];
      const show = Boolean(
        store &&
        (
          store.splitKeys.size ||
          store.mergingKeys.size
        )
      );

      reaggregateButton.classList.toggle(
        'is-hidden',
        !show
      );

      reaggregateButton.tabIndex = show ? 0 : -1;
      reaggregateButton.disabled = interactionLocked;
    }

    function rawBubblePoints(view, categoryKey) {
      const store = bubbleStores[view];
      const aggregate = store.aggregates.find(item =>
        item.categoryKey === categoryKey
      );

      const categoryRows = store.rowsByKey.get(categoryKey) || [];

      if (!aggregate || !categoryRows.length) {
        return [];
      }

      const grouped = new Map();

      categoryRows.forEach(row => {
        const key = String(row.hourlyRate);

        if (!grouped.has(key)) {
          grouped.set(key, []);
        }

        grouped.get(key).push(row);
      });

      const points = [];

      grouped.forEach(groupRows => {
        const count = groupRows.length;
        const halfSpan = Math.min(
          9,
          Math.max(0, (count - 1) * 0.8),
          Math.max(
            0,
            Math.min(
              aggregate.x - 5,
              95 - aggregate.x
            )
          )
        );

        groupRows.forEach((row, index) => {
          const targetX =
            count === 1
              ? aggregate.x
              : aggregate.x -
                halfSpan +
                index /
                (count - 1) *
                halfSpan *
                2;

          points.push({
            x: aggregate.x,
            y: aggregate.y,
            targetX,
            targetY: row.hourlyRate,
            bubbleView: view,
            categoryKey,
            label: aggregate.label,
            fullName: aggregate.fullName,
            colour: aggregate.colour,
            statistics: aggregate.statistics,
            ...row
          });
        });
      });

      return points;
    }

    function animate(duration, frame, complete) {
      if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
      }

      const started = performance.now();

      function step(now) {
        const raw = Math.min((now - started) / duration, 1);
        const progress =
          raw < 0.5
            ? 4 * raw * raw * raw
            : 1 - Math.pow(-2 * raw + 2, 3) / 2;

        frame(progress);

        if (raw < 1) {
          animationFrame = requestAnimationFrame(step);
        } else {
          animationFrame = null;
          complete?.();
        }
      }

      animationFrame = requestAnimationFrame(step);
    }

    function splitBubble(view, categoryKey) {
      const store = bubbleStores[view];

      if (
        interactionLocked ||
        store.splitKeys.has(categoryKey)
      ) {
        return;
      }

      const points = rawBubblePoints(view, categoryKey);

      if (!points.length) {
        return;
      }

      const shouldDim = store.splitKeys.size === 0;

      interactionLocked = true;
      store.splitKeys.add(categoryKey);
      store.splitProgress.set(categoryKey, 0);
      store.rawPoints.push(...points);
      chart.data.datasets[1].data = store.rawPoints;
      chart.update('none');
      updateReaggregateButton();

      animate(
        CONFIG.splitMs,
        progress => {
          store.splitProgress.set(categoryKey, progress);

          if (shouldDim) {
            store.dimProgress = progress;
          }

          points.forEach(point => {
            point.x =
              point.x +
              (point.targetX - point.x) *
              progress;

            point.y =
              point.y +
              (point.targetY - point.y) *
              progress;
          });

          chart.update('none');
        },
        () => {
          points.forEach(point => {
            point.x = point.targetX;
            point.y = point.targetY;
          });

          store.splitProgress.delete(categoryKey);
          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();
        }
      );
    }

    function reaggregate(callback = null) {
      const store = bubbleStores[activeView];

      if (
        !store ||
        !store.splitKeys.size ||
        interactionLocked
      ) {
        return;
      }

      interactionLocked = true;
      store.mergeProgress = 0;

      store.splitKeys.forEach(key =>
        store.mergingKeys.add(key)
      );

      store.rawPoints.forEach(point => {
        const aggregate = store.aggregates.find(item =>
          item.categoryKey === point.categoryKey
        );

        point.startX = point.x;
        point.startY = point.y;
        point.endX = aggregate?.x ?? point.x;
        point.endY = aggregate?.y ?? point.y;
      });

      animate(
        CONFIG.mergeMs,
        progress => {
          store.mergeProgress = progress;
          store.dimProgress = 1 - progress;

          store.rawPoints.forEach(point => {
            point.x =
              point.startX +
              (point.endX - point.startX) *
              progress;

            point.y =
              point.startY +
              (point.endY - point.startY) *
              progress;
          });

          chart.update('none');
        },
        () => {
          store.rawPoints = [];
          chart.data.datasets[1].data = store.rawPoints;
          store.splitKeys.clear();
          store.splitProgress.clear();
          store.mergingKeys.clear();
          store.mergeProgress = 0;
          store.dimProgress = 0;
          interactionLocked = false;
          chart.update('none');
          updateReaggregateButton();
          callback?.();
        }
      );
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        applyView(tab.dataset.view);
      });
    });

    reaggregateButton.addEventListener('click', () => {
      reaggregate();
    });

    legendScrollLeft.addEventListener('click', () => {
      chartLegend.scrollBy({
        left: -Math.max(110, chartLegend.clientWidth * 0.72),
        behavior: 'smooth'
      });
    });

    legendScrollRight.addEventListener('click', () => {
      chartLegend.scrollBy({
        left: Math.max(110, chartLegend.clientWidth * 0.72),
        behavior: 'smooth'
      });
    });

    chartLegend.addEventListener(
      'scroll',
      updateLegendArrows,
      {
        passive: true
      }
    );

    window.addEventListener('resize', () => {
      chart?.resize();
      updateTabIndicator();
      updateLegendArrows();
    });

    async function start() {
      try {
        const sourceRows = await loadRows();
        rows = normaliseRows(sourceRows);

        if (!rows.length) {
          throw new Error(
            'No valid hourly rate rows were found in columns A to J'
          );
        }

        rebuildBubbleStore('state');
        rebuildBubbleStore('employer');
        createChart();
        updateTabIndicator();
        app.classList.remove('is-loading');
        app.setAttribute('aria-busy', 'false');
        loadingState.setAttribute('aria-hidden', 'true');
      } catch (error) {
        console.error(error);
        app.classList.remove('is-loading');
        statusElement.textContent =
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load casual rate data'
          ).replace(/\.+$/, '');
      }
    }

    start();
  </script>
</body>
</html>
