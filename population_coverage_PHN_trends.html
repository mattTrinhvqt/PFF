<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Population Coverage PHN Trends</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js"></script>

  <style>
    :root {
      --pff-sufficient: #20c9d7;
      --pff-saturated: #ff00ff;
      --pff-nsw: #2db7f5;
      --pff-vic: #2d3a8c;
      --pff-qld: #7a0036;
      --pff-sa: #f03a47;
      --pff-wa: #000000;
      --pff-tas: #22a36b;
      --pff-nt: #c25e00;
      --pff-act: #7b61ff;
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .state-option-code {
      min-width: 30px;
      font-weight: 700;
    }

    .state-filter-nsw { color: var(--pff-nsw); }
    .state-filter-vic { color: var(--pff-vic); }
    .state-filter-qld { color: var(--pff-qld); }
    .state-filter-sa { color: var(--pff-sa); }
    .state-filter-wa { color: var(--pff-wa); }
    .state-filter-tas { color: var(--pff-tas); }
    .state-filter-nt { color: var(--pff-nt); }
    .state-filter-act { color: var(--pff-act); }

    .chart-legend .legend-item {
      cursor: default;
    }

    .chart-legend .legend-item:hover {
      color: var(--pff-muted);
    }

    .benchmark-legend {
      position: absolute;
      top: 8px;
      right: 5px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 4px 6px;
      color: var(--pff-muted);
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(105, 113, 138, 0.14);
      border-radius: 4px;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .benchmark-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .benchmark-legend-line {
      width: 17px;
      height: 0;
      flex: 0 0 17px;
      border-top: 2px dotted var(--pff-saturated);
    }

    .benchmark-legend-line.is-saturated {
      border-top-color: var(--pff-saturated);
    }

    .benchmark-legend-line.is-sufficient {
      border-top-color: var(--pff-sufficient);
    }

    @media (max-width: 430px) {
      .benchmark-legend {
        top: 7px;
        right: 3px;
        font-size: 8px;
      }
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">

      <div class="chart-heading-row">

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      sheetId:
        '1KEegg33bfnqNQPZ8M6pDzrIFBYjbquayK3FOprPCTlE',

      clinicianSheet:
        'OptomsbyPHN',

      clinicianRange:
        'A30:CQ',

      populationSheet:
        'AuspopnbyPHN',

      populationRange:
        'A30:AF',

      localCacheKey:
        'pff_phn_coverage_extremes_v3'
    });

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'pff-phn-population-coverage-trends-v1';

    const LIVE_CLINICIAN_FIRST_INDEX =
      64; // BM

    const LIVE_POPULATION_FIRST_INDEX =
      1;  // B

    const REMOTE_FIRST_INDEX =
      1;

    const SERIES_COUNT =
      31;

    /*
      'latest-year' = choose each state's sparsest/densest PHN in the latest
                      available common year, then follow that same PHN backwards.

      'per-year'    = re-select the sparsest/densest PHN separately every year.
    */
    const EXTREME_SELECTION_MODE =
      'latest-year';

    const SATURATED_BENCHMARK =
      5000;

    const SUFFICIENT_BENCHMARK =
      10000;

    const SATURATED_COLOUR =
      '#ff00ff';

    const SUFFICIENT_COLOUR =
      '#20c9d7';

    const PHNS = [
      'Central and Eastern Sydney',
      'Northern Sydney',
      'Western Sydney',
      'Nepean Blue Mountains',
      'South Western Sydney',
      'South Eastern NSW',
      'Western NSW',
      'Hunter New England and Central Coast',
      'North Coast',
      'Murrumbidgee',
      'North Western Melbourne',
      'Eastern Melbourne',
      'South Eastern Melbourne',
      'Gippsland',
      'Murray',
      'Western Victoria',
      'Brisbane North',
      'Brisbane South',
      'Gold Coast',
      'Darling Downs and West Moreton',
      'Western Queensland',
      'Central Queensland',
      'Northern Queensland',
      'Adelaide',
      'Country SA',
      'Perth North',
      'Perth South',
      'Country WA',
      'Tasmania',
      'Northern Territory',
      'Australian Capital Territory'
    ];

    const STATE_CODES = [
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'NSW', 'NSW', 'NSW', 'NSW', 'NSW',
      'VIC', 'VIC', 'VIC', 'VIC', 'VIC', 'VIC',
      'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD', 'QLD',
      'SA', 'SA',
      'WA', 'WA', 'WA',
      'TAS',
      'NT',
      'ACT'
    ];

    const ALL_STATES = [
      'NSW', 'VIC', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT'
    ];

    const STATE_NAMES = {
      NSW: 'New South Wales',
      VIC: 'Victoria',
      QLD: 'Queensland',
      SA: 'South Australia',
      WA: 'Western Australia',
      TAS: 'Tasmania',
      NT: 'Northern Territory',
      ACT: 'Australian Capital Territory'
    };

    const STATE_COLOURS = {
      NSW: '#2db7f5',
      VIC: '#2d3a8c',
      QLD: '#7a0036',
      SA: '#f03a47',
      WA: '#000000',
      TAS: '#22a36b',
      NT: '#c25e00',
      ACT: '#7b61ff'
    };

    const app =
      document.getElementById('app');

    const statusEl =
      document.getElementById('status');

    const liveData =
      document.getElementById('liveData');

    const liveDataText =
      document.getElementById('liveDataText');

    const modeTabList =
      document.getElementById('modeTabs');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const modeTabs =
      Array.from(
        document.querySelectorAll('.chart-tab[data-mode]')
      );

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const yoyTrendToggle =
      document.getElementById('yoyTrendToggle');

    const stateControl =
      document.getElementById('stateControl');

    const stateButton =
      document.getElementById('stateButton');

    const stateButtonValue =
      document.getElementById('stateButtonValue');

    const stateMenu =
      document.getElementById('stateMenu');

    const stateAll =
      document.getElementById('stateAll');

    const stateOptions =
      document.getElementById('stateOptions');

    const chartLegend =
      document.getElementById('chartLegend');

    const legendScrollLeft =
      document.getElementById('legendScrollLeft');

    const legendScrollRight =
      document.getElementById('legendScrollRight');

    const chartShell =
      document.getElementById('chartShell');

    const chartCanvas =
      document.getElementById('coverageChart');

    const state = {
      clinicianByYear: {},
      populationByYear: {},
      years: [],
      selectedStates: new Set(ALL_STATES),
      displayMode: 'dense',
      fixedExtremes: {},
      yScales: {
        sparse: null,
        dense: null
      }
    };

    let chart =
      null;

    let chartSummary =
      null;

    let tabsController =
      null;

    let headingScroller =
      null;

    let legendScroller =
      null;

    let trendController =
      null;

    let stateMenuController =
      null;

    let interactionsController =
      null;

    let responsiveController =
      null;

    let unifiedYAxis =
      null;

    let legendAnimationToken =
      0;

    function dataNumber(value) {
      if (
        value &&
        typeof value === 'object' &&
        (
          Object.prototype.hasOwnProperty.call(value, 'v') ||
          Object.prototype.hasOwnProperty.call(value, 'f')
        )
      ) {
        const direct =
          PFFCharts.numericCell(value);

        return Number.isFinite(direct)
          ? direct
          : null;
      }

      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {
        return null;
      }

      const cleaned =
        PFF.cleanText(value)
          .replace(/,/g, '')
          .replace(/[^0-9.+-]/g, '');

      if (
        !cleaned ||
        !/\d/.test(cleaned)
      ) {
        return null;
      }

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : null;
    }

    function yearValue(value) {
      const numeric =
        dataNumber(value);

      if (!Number.isFinite(numeric)) {
        return null;
      }

      const year =
        Math.round(numeric);

      return year >= 1900 && year <= 2200
        ? year
        : null;
    }

    function parseTable(
      table,
      firstDataIndex
    ) {
      const result = {};

      (table?.rows || []).forEach(
        sourceRow => {
          const cells =
            sourceRow?.c || [];

          const year =
            yearValue(cells[0]);

          if (!year) {
            return;
          }

          const values =
            Array.from(
              { length: SERIES_COUNT },
              (_, index) =>
                dataNumber(
                  cells[
                    firstDataIndex +
                    index
                  ]
                )
            );

          if (values.some(Number.isFinite)) {
            result[year] =
              values;
          }
        }
      );

      return result;
    }

    function parseRemoteRows(
      sourceRows,
      firstDataIndex = REMOTE_FIRST_INDEX
    ) {
      const result = {};

      (Array.isArray(sourceRows) ? sourceRows : [])
        .forEach(row => {
          const year =
            yearValue(row?.[0]);

          if (!year) {
            return;
          }

          const values =
            Array.from(
              { length: SERIES_COUNT },
              (_, index) =>
                dataNumber(
                  row?.[
                    firstDataIndex +
                    index
                  ]
                )
            );

          if (values.some(Number.isFinite)) {
            result[year] =
              values;
          }
        });

      return result;
    }

    function normaliseSeries(values) {
      if (
        !Array.isArray(values) ||
        values.length < SERIES_COUNT
      ) {
        return null;
      }

      const normalised =
        values
          .slice(0, SERIES_COUNT)
          .map(value => {
            if (
              value === null ||
              value === undefined ||
              value === ''
            ) {
              return null;
            }

            const number =
              Number(value);

            return Number.isFinite(number)
              ? number
              : null;
          });

      return normalised.some(Number.isFinite)
        ? normalised
        : null;
    }

    function combineYearMaps(
      clinicianByYear,
      populationByYear
    ) {
      const years =
        Array.from(
          new Set([
            ...Object.keys(clinicianByYear || {}).map(Number),
            ...Object.keys(populationByYear || {}).map(Number)
          ])
        )
          .filter(Number.isFinite)
          .sort((first, second) => first - second);

      return years.map(year => ({
        year,
        clinician:
          normaliseSeries(
            clinicianByYear?.[year]
          ),
        population:
          normaliseSeries(
            populationByYear?.[year]
          )
      }));
    }

    function validateCombinedRows(sourceRows) {
      const rows =
        (Array.isArray(sourceRows) ? sourceRows : [])
          .map(row => {
            const year =
              Number(row?.year);

            if (
              !Number.isFinite(year) ||
              year < 1900 ||
              year > 2200
            ) {
              return null;
            }

            const clinician =
              normaliseSeries(
                row?.clinician
              );

            const population =
              normaliseSeries(
                row?.population
              );

            if (!clinician && !population) {
              return null;
            }

            return {
              year:
                Math.round(year),
              clinician,
              population
            };
          })
          .filter(Boolean)
          .sort(
            (first, second) =>
              first.year -
              second.year
          );

      if (
        !rows.some(row => row.clinician) ||
        !rows.some(row => row.population) ||
        !rows.some(
          row =>
            row.clinician &&
            row.population
        )
      ) {
        throw new Error(
          'Population Coverage PHN Trends data were incomplete.'
        );
      }

      return rows;
    }

    function parseLiveData(raw) {
      return validateCombinedRows(
        combineYearMaps(
          parseTable(
            raw?.clinicianTable,
            LIVE_CLINICIAN_FIRST_INDEX
          ),
          parseTable(
            raw?.populationTable,
            LIVE_POPULATION_FIRST_INDEX
          )
        )
      );
    }

    function parseRemoteCache(snapshot) {
      return validateCombinedRows(
        combineYearMaps(
          parseRemoteRows(
            snapshot?.data?.clinicianRows
          ),
          parseRemoteRows(
            snapshot?.data?.populationRows
          )
        )
      );
    }

    function applyLoadedRows(sourceRows) {
      const rows =
        validateCombinedRows(sourceRows);

      state.clinicianByYear = {};
      state.populationByYear = {};

      rows.forEach(row => {
        if (row.clinician) {
          state.clinicianByYear[
            row.year
          ] = [...row.clinician];
        }

        if (row.population) {
          state.populationByYear[
            row.year
          ] = [...row.population];
        }
      });
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(raw);

        if (
          Array.isArray(
            parsed?.rows
          )
        ) {
          return;
        }

        if (
          parsed?.clinicianByYear &&
          parsed?.populationByYear
        ) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            validateCombinedRows(
              combineYearMaps(
                parsed.clinicianByYear,
                parsed.populationByYear
              )
            )
          );
        }
      } catch (_) {
        // Browser cache is optional.
      }
    }

    function sortedYears(object) {
      return Object.keys(object)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function commonYears() {
      const clinicianYears =
        new Set(
          sortedYears(
            state.clinicianByYear
          )
        );

      return sortedYears(
        state.populationByYear
      ).filter(
        year =>
          clinicianYears.has(year)
      );
    }

    function coverageForPHN(
      year,
      index
    ) {
      const clinicians =
        Number(
          state.clinicianByYear?.[
            year
          ]?.[
            index
          ]
        );

      const population =
        Number(
          state.populationByYear?.[
            year
          ]?.[
            index
          ]
        );

      if (
        !Number.isFinite(clinicians) ||
        !Number.isFinite(population) ||
        clinicians <= 0
      ) {
        return null;
      }

      const coverage =
        population / clinicians;

      return Number.isFinite(coverage) &&
        coverage > 0
          ? coverage
          : null;
    }

    function indicesForState(stateCode) {
      return STATE_CODES
        .map(
          (code, index) =>
            code === stateCode
              ? index
              : -1
        )
        .filter(
          index => index >= 0
        );
    }

    function extremeAtYear(
      stateCode,
      year,
      kind
    ) {
      const candidates =
        indicesForState(stateCode)
          .map(
            index => ({
              index,
              value:
                coverageForPHN(
                  year,
                  index
                )
            })
          )
          .filter(
            item =>
              Number.isFinite(
                item.value
              )
          );

      if (!candidates.length) {
        return null;
      }

      candidates.sort(
        (first, second) =>
          first.value -
          second.value
      );

      return kind === 'dense'
        ? candidates[0]
        : candidates[
            candidates.length - 1
          ];
    }

    function buildFixedExtremes() {
      state.fixedExtremes = {};

      if (!state.years.length) {
        return;
      }

      for (const stateCode of ALL_STATES) {
        let sparse = null;
        let dense = null;

        for (
          let index = state.years.length - 1;
          index >= 0;
          index -= 1
        ) {
          const year =
            state.years[index];

          sparse =
            sparse ||
            extremeAtYear(
              stateCode,
              year,
              'sparse'
            );

          dense =
            dense ||
            extremeAtYear(
              stateCode,
              year,
              'dense'
            );

          if (sparse && dense) {
            break;
          }
        }

        state.fixedExtremes[
          stateCode
        ] = {
          sparseIndex:
            sparse?.index ?? null,
          denseIndex:
            dense?.index ?? null
        };
      }
    }

    function pointSeriesFor(
      stateCode,
      kind
    ) {
      if (
        EXTREME_SELECTION_MODE ===
        'per-year'
      ) {
        const phnByPoint = [];

        const data =
          state.years.map(
            year => {
              const extreme =
                extremeAtYear(
                  stateCode,
                  year,
                  kind
                );

              phnByPoint.push(
                extreme
                  ? PHNS[extreme.index]
                  : ''
              );

              return extreme
                ? extreme.value
                : null;
            }
          );

        return {
          data,
          phnByPoint
        };
      }

      const index =
        state.fixedExtremes?.[
          stateCode
        ]?.[
          `${kind}Index`
        ];

      if (!Number.isInteger(index)) {
        return {
          data:
            state.years.map(
              () => null
            ),
          phnByPoint:
            state.years.map(
              () => ''
            )
        };
      }

      return {
        data:
          state.years.map(
            year => {
              const value =
                coverageForPHN(
                  year,
                  index
                );

              return Number.isFinite(value)
                ? value
                : null;
            }
          ),

        phnByPoint:
          state.years.map(
            () => PHNS[index]
          )
      };
    }

    function trendRowsFor(
      stateCode,
      kind
    ) {
      const series =
        pointSeriesFor(
          stateCode,
          kind
        );

      return state.years.map(
        (year, index) => ({
          year,
          value:
            series.data[index]
        })
      );
    }

    function latestAnnualisedGrowth(
      stateCode,
      kind = state.displayMode
    ) {
      if (
        !trendController ||
        trendController.mode === 'off'
      ) {
        return NaN;
      }

      return PFFCharts.latestConsecutiveTrend(
        trendRowsFor(
          stateCode,
          kind
        ),
        row => row.value,
        trendController.windowSize
      );
    }

    function isSinglePHNState(stateCode) {
      return indicesForState(
        stateCode
      ).length === 1;
    }

    function niceStep(rawStep) {
      if (
        !Number.isFinite(rawStep) ||
        rawStep <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(rawStep)
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        rawStep / magnitude;

      let niceFraction;

      if (fraction <= 1) {
        niceFraction = 1;
      } else if (fraction <= 2) {
        niceFraction = 2;
      } else if (fraction <= 2.5) {
        niceFraction = 2.5;
      } else if (fraction <= 5) {
        niceFraction = 5;
      } else {
        niceFraction = 10;
      }

      return niceFraction *
        magnitude;
    }

    function nextNiceStep(step) {
      const value =
        Math.max(
          1e-9,
          Number(step) || 1
        );

      const exponent =
        Math.floor(
          Math.log10(value)
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        value / magnitude;

      if (fraction < 1.5) {
        return 2 * magnitude;
      }

      if (fraction < 2.25) {
        return 2.5 * magnitude;
      }

      if (fraction < 3.75) {
        return 5 * magnitude;
      }

      if (fraction < 7.5) {
        return 10 * magnitude;
      }

      return 20 * magnitude;
    }

    function valuesForMode(kind) {
      const values = [];

      for (const stateCode of ALL_STATES) {
        const series =
          pointSeriesFor(
            stateCode,
            kind
          );

        for (const value of series.data) {
          if (Number.isFinite(value)) {
            values.push(value);
          }
        }
      }

      values.push(
        SATURATED_BENCHMARK,
        SUFFICIENT_BENCHMARK
      );

      return values;
    }

    function deriveModeScale(kind) {
      const values =
        valuesForMode(kind);

      if (!values.length) {
        return {
          min: 0,
          max: 10000,
          step: 2000,
          intervals: 5
        };
      }

      const dataMax =
        Math.max(...values);

      const paddedMax =
        Math.max(
          SUFFICIENT_BENCHMARK,
          kind === 'sparse'
            ? dataMax * 1.08
            : dataMax * 1.05
        );

      let step =
        niceStep(
          paddedMax / 5
        );

      let maximum =
        step * 5;

      while (maximum < paddedMax) {
        step =
          nextNiceStep(step);

        maximum =
          step * 5;
      }

      return {
        min: 0,
        max: maximum,
        step,
        intervals: 5
      };
    }

    function buildYScales() {
      state.yScales.sparse =
        deriveModeScale(
          'sparse'
        );

      state.yScales.dense =
        deriveModeScale(
          'dense'
        );
    }

    function yScaleForMode(
      mode = state.displayMode
    ) {
      return (
        state.yScales?.[
          mode
        ] || {
          min: 0,
          max: 10000,
          step: 2000,
          intervals: 5
        }
      );
    }

    function datasetForState(
      stateCode,
      kind
    ) {
      const colour =
        STATE_COLOURS[stateCode];

      const series =
        pointSeriesFor(
          stateCode,
          kind
        );

      const single =
        isSinglePHNState(
          stateCode
        );

      const legendPHN =
        series.phnByPoint.find(Boolean) ||
        stateCode;

      const visible =
        state.selectedStates.has(
          stateCode
        );

      return PFFCharts.lineDataset({
        label:
          legendPHN,
        data:
          series.data,
        hidden:
          !visible,
        borderColor:
          colour,
        backgroundColor:
          colour,
        pointBackgroundColor:
          colour,
        pointBorderColor:
          '#ffffff',
        pointBorderWidth:
          1,
        borderCapStyle:
          'round',
        borderJoinStyle:
          'round',
        cubicInterpolationMode:
          'monotone',
        _stateCode:
          stateCode,
        _kind:
          single
            ? 'only'
            : kind,
        _phnByPoint:
          series.phnByPoint,
        _seriesLabel:
          legendPHN,
        _activeSeries:
          visible
      });
    }

    function buildDatasets() {
      return ALL_STATES.map(
        stateCode =>
          datasetForState(
            stateCode,
            state.displayMode
          )
      );
    }

    function tooltipLabel(context) {
      const dataset =
        context.dataset;

      const stateCode =
        dataset?._stateCode || '';

      const kind =
        dataset?._kind === 'only'
          ? 'Single PHN'
          : state.displayMode === 'sparse'
            ? 'Sparsest'
            : 'Densest';

      const phn =
        dataset?._phnByPoint?.[
          context.dataIndex
        ] || '';

      const value =
        Number(context.raw);

      const year =
        Number(
          state.years?.[
            context.dataIndex
          ]
        );

      const phnIndex =
        PHNS.indexOf(phn);

      const clinicians =
        phnIndex >= 0 &&
        Number.isFinite(year)
          ? Number(
              state.clinicianByYear?.[
                year
              ]?.[
                phnIndex
              ]
            )
          : null;

      const population =
        phnIndex >= 0 &&
        Number.isFinite(year)
          ? Number(
              state.populationByYear?.[
                year
              ]?.[
                phnIndex
              ]
            )
          : null;

      const lines = [
        `${stateCode} — ${kind}`,
        phn,
        `${PFF.formatInteger(value)} people per FTE clinician`
      ];

      if (
        Number.isFinite(clinicians) &&
        Number.isFinite(population)
      ) {
        lines.push(
          `${PFF.formatOneDecimal(clinicians)} active FTE clinicians · ${PFF.formatInteger(population)} people`
        );
      }

      return lines;
    }

    const coverageBenchmarksPlugin = {
      id:
        'phnCoverageBenchmarksPlugin',

      beforeDatasetsDraw(chartInstance) {
        const {
          ctx,
          chartArea
        } = chartInstance;

        if (
          !chartArea ||
          !unifiedYAxis
        ) {
          return;
        }

        const benchmarks = [
          {
            value:
              SUFFICIENT_BENCHMARK,
            colour:
              SUFFICIENT_COLOUR
          },
          {
            value:
              SATURATED_BENCHMARK,
            colour:
              SATURATED_COLOUR
          }
        ];

        ctx.save();
        ctx.lineCap =
          'round';
        ctx.lineWidth =
          2.2;
        ctx.setLineDash(
          [1, 4]
        );

        benchmarks.forEach(
          benchmark => {
            const ratio =
              PFF.clamp(
                unifiedYAxis.valueToRatio(
                  benchmark.value
                ),
                0,
                1
              );

            const y =
              chartArea.bottom -
              chartArea.height *
                ratio;

            ctx.strokeStyle =
              benchmark.colour;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              y
            );
            ctx.lineTo(
              chartArea.right,
              y
            );
            ctx.stroke();
          }
        );

        ctx.restore();
      }
    };

    const yearTickMarksPlugin =
      PFFCharts.createYearTickMarksPlugin({
        id:
          'phnCoverageYearTickMarks',
        getValue({ index }) {
          return state.years[index];
        },
        isMajor(value) {
          const year =
            Number(value);

          return Number.isFinite(year) &&
            year % 2 === 0;
        }
      });

    const coverageTrendLabelsPlugin =
      PFFCharts.createTrendLabelsPlugin({
        id:
          'phnCoverageTrendLabelsPlugin',

        enabled() {
          return (
            trendController?.mode !==
            'off'
          );
        },

        isActive({
          dataset,
          meta
        }) {
          return Boolean(
            dataset?._activeSeries !== false &&
            !meta?.hidden
          );
        },

        getTrendValue({ dataset }) {
          return latestAnnualisedGrowth(
            dataset?._stateCode,
            state.displayMode
          );
        }
      });

    function chartOptions() {
      const scale =
        yScaleForMode();

      const duration =
        PFFCharts.chartAnimationDuration();

      return PFFCharts.baseChartOptions({
        normalized:
          true,

        animation: {
          duration,
          easing:
            'easeInOutCubic'
        },

        animations: {
          x: {
            duration:
              0
          },
          y: {
            duration,
            easing:
              'easeInOutCubic'
          },
          colors: {
            duration:
              0
          }
        },

        transitions:
          PFFCharts.seriesVisibilityTransitionOptions(
            260
          ),

        layout: {
          autoPadding:
            true,
          padding: {
            top:
              PFF.mobileLayout()
                ? 8
                : 9,
            right:
              3,
            bottom:
              0,
            left:
              0
          }
        },

        plugins: {
          tooltip: {
            callbacks: {
              title(items) {
                return items?.length
                  ? String(
                      items[0].label
                    )
                  : '';
              },
              label:
                tooltipLabel
            }
          }
        },

        scales: {
          x:
            PFFCharts.xYearScaleOptions(),

          y:
            PFFCharts.yScaleOptions(
              scale,
              {
                ticks: {
                  display:
                    false,
                  stepSize:
                    scale.step
                },
                title: {
                  display:
                    false
                }
              }
            )
        }
      });
    }

    function syncChartScale() {
      if (!chart) {
        return;
      }

      const scale =
        yScaleForMode();

      chart.options.scales.y.min =
        scale.min;

      chart.options.scales.y.max =
        scale.max;

      chart.options.scales.y.ticks.stepSize =
        scale.step;
    }

    function syncChartDatasets() {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets();

      nextDatasets.forEach(
        (
          nextDataset,
          index
        ) => {
          const current =
            chart.data.datasets?.[
              index
            ];

          if (!current) {
            chart.data.datasets[
              index
            ] = nextDataset;
            return;
          }

          Object.assign(
            current,
            nextDataset
          );

          const visible =
            state.selectedStates.has(
              nextDataset._stateCode
            );

          current._activeSeries =
            visible;

          chart.setDatasetVisibility(
            index,
            visible
          );
        }
      );

      chart.data.datasets.length =
        nextDatasets.length;
    }

    function appendLegendItem({
      colour,
      label
    }) {
      const item =
        document.createElement('span');

      item.className =
        'legend-item';

      const marker =
        document.createElement('span');

      marker.className =
        'legend-line';

      marker.style.setProperty(
        '--legend-colour',
        colour
      );

      const text =
        document.createElement('span');

      text.textContent =
        label;

      item.append(
        marker,
        text
      );

      chartLegend.appendChild(item);
    }

    function renderLegend(
      animate = true
    ) {
      const token =
        ++legendAnimationToken;

      const drawLegend = () => {
        if (token !== legendAnimationToken) {
          return;
        }

        chartLegend.replaceChildren();

        ALL_STATES.forEach(
          stateCode => {
            if (
              !state.selectedStates.has(
                stateCode
              )
            ) {
              return;
            }

            const series =
              pointSeriesFor(
                stateCode,
                state.displayMode
              );

            const phnName =
              series.phnByPoint.find(Boolean) ||
              stateCode;

            appendLegendItem({
              colour:
                STATE_COLOURS[stateCode],
              label:
                phnName
            });
          }
        );

        requestAnimationFrame(
          () =>
            legendScroller?.update()
        );
      };

      if (
        !animate ||
        PFF.reducedMotion() ||
        !chartLegend.childElementCount ||
        typeof chartLegend.animate !== 'function'
      ) {
        drawLegend();
        return;
      }

      const outgoing =
        chartLegend.animate(
          [
            { opacity: 1 },
            { opacity: 0 }
          ],
          {
            duration: 150,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      outgoing.finished
        .catch(() => {})
        .then(
          () => {
            drawLegend();

            if (
              token !==
              legendAnimationToken
            ) {
              return;
            }

            chartLegend.animate(
              [
                { opacity: 0 },
                { opacity: 1 }
              ],
              {
                duration: 230,
                easing:
                  'cubic-bezier(0.22, 1, 0.36, 1)',
                fill:
                  'both'
              }
            );
          }
        );
    }

    function buildStateControls() {
      stateOptions.replaceChildren();

      ALL_STATES.forEach(
        stateCode => {
          const label =
            document.createElement('label');

          label.className =
            'state-option';

          const input =
            document.createElement('input');

          input.type =
            'checkbox';

          input.checked =
            state.selectedStates.has(
              stateCode
            );

          input.dataset.stateCode =
            stateCode;

          const box =
            document.createElement('span');

          box.className =
            'state-option-box';

          box.setAttribute(
            'aria-hidden',
            'true'
          );

          const code =
            document.createElement('span');

          code.className =
            `state-option-code state-filter-${stateCode.toLowerCase()}`;

          code.textContent =
            stateCode;

          code.title =
            STATE_NAMES[stateCode];

          label.append(
            input,
            box,
            code
          );

          stateOptions.appendChild(
            label
          );
        }
      );
    }

    function selectedStateSummary() {
      const selected =
        ALL_STATES.filter(
          code =>
            state.selectedStates.has(
              code
            )
        );

      if (selected.length === ALL_STATES.length) return 'All';
      if (selected.length === 0) return 'None';
      if (selected.length === 1) return selected[0];
      return String(selected.length);
    }

    function syncStateControlsFromState() {
      stateOptions
        .querySelectorAll(
          'input[data-state-code]'
        )
        .forEach(
          input => {
            input.checked =
              state.selectedStates.has(
                input.dataset.stateCode
              );
          }
        );

      const count =
        state.selectedStates.size;

      stateAll.checked =
        count === ALL_STATES.length;

      stateAll.indeterminate =
        count > 0 &&
        count < ALL_STATES.length;

      PFF.animateHeading({
        fixed:
          stateButtonValue,
        fixedText:
          selectedStateSummary(),
        duration:
          180
      });
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const selected =
        ALL_STATES.filter(
          code =>
            state.selectedStates.has(
              code
            )
        );

      const modeText =
        state.displayMode === 'sparse'
          ? 'Sparsest PHNs'
          : 'Densest PHNs';

      const trendText =
        trendController?.mode !== 'off'
          ? ` ${trendController.windowSize}-year trend labels are on.`
          : ' Trend labels are off.';

      PFFCharts.updateChartSummary(
        `${modeText} population coverage trends from ${state.years[0] ?? 'unavailable'} to ${state.years[state.years.length - 1] ?? 'unavailable'}. Visible states: ${selected.length ? selected.join(', ') : 'none'}.${trendText}`,
        chartSummary
      );
    }

    function createChart() {
      unifiedYAxis =
        PFFCharts.createUnifiedYAxis({
          id:
            'phnCoverageUnifiedYAxis',
          getChart() {
            return chart;
          },
          getScale() {
            return yScaleForMode();
          },
          getDecimals() {
            return 0;
          },
          getTitle() {
            return 'People per FTE clinician';
          },
          formatValue(value) {
            const number =
              Number(value);

            if (
              !Number.isFinite(number)
            ) {
              return '';
            }

            if (
              Math.abs(number) < 1000
            ) {
              return PFF.formatInteger(
                number
              );
            }

            const thousands =
              number / 1000;

            return `${
              Number.isInteger(thousands)
                ? thousands
                : Number(
                    thousands.toFixed(1)
                  )
            }k`;
          }
        });

      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type:
              'line',

            data: {
              labels:
                state.years,
              datasets:
                buildDatasets()
            },

            options:
              chartOptions(),

            plugins: [
              unifiedYAxis.plugin,
              coverageBenchmarksPlugin,
              yearTickMarksPlugin,
              coverageTrendLabelsPlugin
            ]
          }
        );

      unifiedYAxis.setImmediately(
        yScaleForMode(),
        0
      );
    }

    function renderChart(
      reason = 'filter',
      previousScale = null
    ) {
      if (!chart) {
        return;
      }

      const duration =
        reason === 'mode'
          ? PFFCharts.chartAnimationDuration()
          : 520;

      const oldScale =
        previousScale
          ? PFFCharts.copyScale(
              previousScale
            )
          : unifiedYAxis.currentScale();

      const nextScale =
        PFFCharts.copyScale(
          yScaleForMode()
        );

      syncChartScale();
      syncChartDatasets();

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        reason === 'mode'
          ? 'easeInOutCubic'
          : 'easeOutCubic';

      chart.options.animations.x.duration =
        0;

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        reason === 'mode'
          ? 'easeInOutCubic'
          : 'easeOutCubic';

      chart.update();

      if (reason === 'mode') {
        unifiedYAxis.animate(
          oldScale,
          nextScale,
          {
            duration,
            fromDecimals:
              0,
            toDecimals:
              0
          }
        );
      } else {
        unifiedYAxis.setImmediately(
          nextScale,
          0
        );
      }

      renderLegend(
        reason === 'mode'
      );

      tabsController?.update();
      headingScroller?.update();
      updateAccessibleSummary();
    }

    function setDisplayMode(nextMode) {
      if (
        !['dense', 'sparse'].includes(nextMode) ||
        nextMode === state.displayMode
      ) {
        return;
      }

      const previousScale =
        unifiedYAxis
          ? unifiedYAxis.currentScale()
          : yScaleForMode();

      state.displayMode =
        nextMode;

      renderChart(
        'mode',
        previousScale
      );
    }

    function applyStateFilter() {
      syncStateControlsFromState();
      renderChart(
        'filter'
      );
    }

    function setupControls() {
      buildStateControls();
      syncStateControlsFromState();

      tabsController =
        PFF.setupTabs({
          tabList:
            modeTabList,
          tabs:
            modeTabs,
          valueAttribute:
            'mode',
          initialValue:
            state.displayMode,
          leftButton:
            tabScrollLeft,
          rightButton:
            tabScrollRight,
          onChange(value) {
            setDisplayMode(value);
          }
        });

      headingScroller =
        PFF.setupScrollableRegion({
          scroller:
            headingScrollViewport,
          leftButton:
            headingScrollLeft,
          rightButton:
            headingScrollRight
        });

      legendScroller =
        PFF.setupScrollableRegion({
          scroller:
            chartLegend,
          leftButton:
            legendScrollLeft,
          rightButton:
            legendScrollRight
        });

      trendController =
        PFFCharts.setupTrendToggle({
          button:
            yoyTrendToggle,
          initialMode:
            '3yr',
          onChange() {
            chart?.draw();
            updateAccessibleSummary();
          }
        });

      /*
       * Keep the shared tooltip-dismiss handler from performing a full
       * Chart.js relayout when this non-chart trend control is clicked.
       */
      yoyTrendToggle.addEventListener(
        'pointerdown',
        event => {
          event.stopPropagation();
        }
      );

      stateMenuController =
        PFF.setupMenu({
          menu:
            stateControl,
          button:
            stateButton,
          panel:
            stateMenu
        });

      stateAll.addEventListener(
        'change',
        () => {
          state.selectedStates =
            stateAll.checked
              ? new Set(ALL_STATES)
              : new Set();

          applyStateFilter();
        }
      );

      stateOptions.addEventListener(
        'change',
        event => {
          const input =
            event.target.closest(
              'input[data-state-code]'
            );

          if (!input) {
            return;
          }

          const stateCode =
            input.dataset.stateCode;

          if (input.checked) {
            state.selectedStates.add(
              stateCode
            );
          } else {
            state.selectedStates.delete(
              stateCode
            );
          }

          applyStateFilter();
        }
      );
    }

    function setupResponsiveBehaviour() {
      responsiveController =
        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },
          observe: [
            app,
            chartShell,
            chartLegend
          ],
          beforeResize(chartInstance) {
            const scale =
              yScaleForMode();

            chartInstance.options.scales.x =
              PFFCharts.xYearScaleOptions();

            chartInstance.options.scales.y =
              PFFCharts.yScaleOptions(
                scale,
                {
                  ticks: {
                    display:
                      false,
                    stepSize:
                      scale.step
                  },
                  title: {
                    display:
                      false
                  }
                }
              );
          },
          afterResize() {
            unifiedYAxis?.setImmediately(
              yScaleForMode(),
              0
            );
            chart?.draw();
          },
          onRefresh() {
            tabsController?.update();
            headingScroller?.update();
            legendScroller?.update();
          }
        });
    }

    migrateLegacyLocalCache();
    setupControls();

    PFF.initialiseApp({
      app,
      status:
        statusEl,

      async loadLive() {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.clinicianSheet,
              range:
                CONFIG.clinicianRange,
              headers:
                '1'
            }),

            PFFCharts.loadGVizSheet({
              sheetId:
                CONFIG.sheetId,
              sheetName:
                CONFIG.populationSheet,
              range:
                CONFIG.populationRange,
              headers:
                '1'
            })
          ]);

        return {
          clinicianTable,
          populationTable
        };
      },

      parseLive:
        parseLiveData,

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,
          appKey:
            CACHE_APP_KEY
        });
      },

      parseRemoteCache,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        1,

      onLiveError(error) {
        console.warn(
          'Live Population Coverage PHN Trends data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(error) {
        console.warn(
          'Apps Script Population Coverage PHN Trends cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          liveData,
        text:
          liveDataText
      },

      render(loaded) {
        applyLoadedRows(
          loaded.rows
        );

        state.years =
          commonYears();

        if (!state.years.length) {
          throw new Error(
            'No years were common to the clinician and population sheets.'
          );
        }

        buildFixedExtremes();
        buildYScales();
        createChart();
        renderLegend(
          false
        );

        chartSummary =
          PFFCharts.ensureChartSummary({
            id:
              'populationCoveragePhnTrendsSummary',
            parent:
              app
          });

        chartCanvas.setAttribute(
          'aria-describedby',
          chartSummary.id
        );

        updateAccessibleSummary();

        interactionsController =
          PFFCharts.setupChartInteractions({
            canvas:
              chartCanvas,
            getChart() {
              return chart;
            }
          });

        setupResponsiveBehaviour();

        requestAnimationFrame(
          () => {
            tabsController?.update();
            headingScroller?.update();
            legendScroller?.update();
            unifiedYAxis?.setImmediately(
              yScaleForMode(),
              0
            );
            chart?.draw();
          }
        );

        return chart;
      },

      onError() {
        liveData.style.visibility =
          'hidden';
      },

      errorMessage:
        'Population Coverage PHN Trends data unavailable.'
    });
  </script>
</body>
</html>
