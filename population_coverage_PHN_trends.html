    // ============================================================
    // APP STATE
    // ============================================================

    const state = {
      clinicianByYear: {},
      populationByYear: {},
      years: [],
      selectedStates: new Set(ALL_STATES),
      displayMode: 'dense',
      sourceState: 'live',
      savedAt: null,
      fixedExtremes: {},
      yScales: {
        sparse: null,
        dense: null
      }
    };

    let chart = null;
    let legendAnimationToken = 0;
    let trendLabelsOn = true;

    // ============================================================
    // HELPERS
    // ============================================================

    function reducedMotion() {
      return window.matchMedia?.(
        '(prefers-reduced-motion: reduce)'
      )?.matches === true;
    }

    function clamp(value, minimum, maximum) {
      return Math.max(
        minimum,
        Math.min(maximum, value)
      );
    }

    function formatNumber(value) {
      const numeric = Number(value);

      if (!Number.isFinite(numeric)) {
        return '—';
      }

      return Math.round(numeric)
        .toLocaleString('en-AU');
    }

    function formatOneDecimal(value) {
      const numeric = Number(value);

      if (!Number.isFinite(numeric)) {
        return '—';
      }

      return numeric.toLocaleString(
        'en-AU',
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 1
        }
      );
    }

    function rgba(
      hex,
      alpha = 1
    ) {
      const cleaned =
        String(hex || '#69718a')
          .replace('#', '')
          .trim();

      if (!/^[0-9a-fA-F]{6}$/.test(cleaned)) {
        return `rgba(105,113,138,${alpha})`;
      }

      const value =
        Number.parseInt(
          cleaned,
          16
        );

      const red =
        (value >> 16) & 255;

      const green =
        (value >> 8) & 255;

      const blue =
        value & 255;

      return `rgba(${red},${green},${blue},${alpha})`;
    }

    function seriesTint(
      hex,
      strength = 0.20,
      alpha = 0.84
    ) {
      const cleaned =
        String(hex || '#69718a')
          .replace('#', '')
          .trim();

      if (!/^[0-9a-fA-F]{6}$/.test(cleaned)) {
        return `rgba(239,240,244,${alpha})`;
      }

      const value =
        Number.parseInt(
          cleaned,
          16
        );

      const red =
        (value >> 16) & 255;

      const green =
        (value >> 8) & 255;

      const blue =
        value & 255;

      const mix =
        channel =>
          Math.round(
            255 -
            (255 - channel) *
              strength
          );

      return `rgba(${mix(red)},${mix(green)},${mix(blue)},${alpha})`;
    }

    function fadeTextChange(
      element,
      nextText,
      animate = true
    ) {
      if (!element) return;

      const text = String(nextText);

      if (element.textContent === text) {
        return;
      }

      if (
        !animate ||
        reducedMotion() ||
        typeof element.animate !== 'function'
      ) {
        element.textContent = text;
        return;
      }

      const token =
        (Number(element.dataset.textAnimationToken) || 0) + 1;

      element.dataset.textAnimationToken = String(token);

      const fadeOut = element.animate(
        [
          { opacity: 1 },
          { opacity: 0 }
        ],
        {
          duration: 150,
          easing: 'ease-out',
          fill: 'forwards'
        }
      );

      fadeOut.finished
        .then(() => {
          if (Number(element.dataset.textAnimationToken) !== token) return;
          fadeOut.cancel();
          element.textContent = text;

          const fadeIn = element.animate(
            [
              { opacity: 0 },
              { opacity: 1 }
            ],
            {
              duration: 230,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
            }
          );

          fadeIn.finished
            .then(() => fadeIn.cancel())
            .catch(() => {});
        })
        .catch(() => {
          element.textContent = text;
        });
    }

    function easeInOutCubic(value) {
      return value < 0.5
        ? 4 * value * value * value
        : 1 - Math.pow(-2 * value + 2, 3) / 2;
    }

    // ============================================================
    // GOOGLE SHEETS JSONP
    // ============================================================

    function loadGVizSheet(
      sheetName,
      range
    ) {
      return new Promise(
        (resolve, reject) => {
          const callbackName =
            `__pff_coverage_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const script =
            document.createElement('script');

          let completed =
            false;

          const cleanup = () => {
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }

            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] = undefined;
            }
          };

          const timer =
            window.setTimeout(
              () => {
                if (completed) {
                  return;
                }

                completed = true;
                cleanup();

                reject(
                  new Error(
                    `Timed out loading ${sheetName}.`
                  )
                );
              },
              15000
            );

          window[callbackName] =
            response => {
              if (completed) {
                return;
              }

              completed = true;
              window.clearTimeout(timer);
              cleanup();

              if (
                !response ||
                response.status === 'error'
              ) {
                const message =
                  response?.errors?.[0]?.detailed_message ||
                  response?.errors?.[0]?.message ||
                  `Could not load ${sheetName}.`;

                reject(
                  new Error(message)
                );

                return;
              }

              resolve(response.table);
            };

          script.onerror = () => {
            if (completed) {
              return;
            }

            completed = true;
            window.clearTimeout(timer);
            cleanup();

            reject(
              new Error(
                `Could not connect to ${sheetName}.`
              )
            );
          };

          const params =
            new URLSearchParams({
              sheet: sheetName,
              range,
              headers: '1',
              tqx: `out:json;responseHandler:${callbackName}`
            });

          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;

          script.async = true;
          document.head.appendChild(script);
        }
      );
    }

    function numericCell(cell) {
      if (
        !cell ||
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ''
      ) {
        return null;
      }

      if (
        typeof cell.v === 'number'
      ) {
        return Number.isFinite(cell.v)
          ? cell.v
          : null;
      }

      const cleaned =
        String(cell.v)
          .replace(/,/g, '')
          .replace(/[^0-9.+-]/g, '');

      if (!cleaned) {
        return null;
      }

      const value =
        Number(cleaned);

      return Number.isFinite(value)
        ? value
        : null;
    }

    function yearCell(cell) {
      const value =
        numericCell(cell);

      if (value === null) {
        return null;
      }

      const year =
        Math.round(value);

      return (
        year >= 1900 &&
        year <= 2200
      )
        ? year
        : null;
    }

    function parseTable(
      table,
      firstDataIndex
    ) {
      const result = {};
      const rows = table?.rows || [];

      for (const row of rows) {
        const cells = row?.c || [];
        const year = yearCell(cells[0]);

        if (!year) {
          continue;
        }

        const values =
          PHNS.map(
            (_, index) =>
              numericCell(
                cells[firstDataIndex + index]
              )
          );

        if (
          values.some(Number.isFinite)
        ) {
          result[year] = values;
        }
      }

      return result;
    }

    // ============================================================
    // CACHE
    // ============================================================

    function saveCache() {
      try {
        const savedAt = Date.now();

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            savedAt,
            clinicianByYear: state.clinicianByYear,
            populationByYear: state.populationByYear
          })
        );

        state.savedAt = savedAt;
      } catch (_) {
        // Cache is optional.
      }
    }

    function loadCache() {
      try {
        const raw =
          localStorage.getItem(CACHE_KEY);

        if (!raw) {
          return false;
        }

        const cached =
          JSON.parse(raw);

        if (
          !cached?.clinicianByYear ||
          !cached?.populationByYear
        ) {
          return false;
        }

        state.clinicianByYear =
          cached.clinicianByYear;

        state.populationByYear =
          cached.populationByYear;

        state.savedAt =
          cached.savedAt || null;

        return true;
      } catch (_) {
        return false;
      }
    }

    async function loadData() {
      try {
        const [
          clinicianTable,
          populationTable
        ] =
          await Promise.all([
            loadGVizSheet(
              CLINICIAN_SHEET,
              CLINICIAN_RANGE
            ),
            loadGVizSheet(
              POPULATION_SHEET,
              POPULATION_RANGE
            )
          ]);

        state.clinicianByYear =
          parseTable(
            clinicianTable,
            CLINICIAN_FIRST_INDEX
          );

        state.populationByYear =
          parseTable(
            populationTable,
            POPULATION_FIRST_INDEX
          );

        if (
          !Object.keys(state.clinicianByYear).length
        ) {
          throw new Error(
            'No clinician data were found from row 31 onward.'
          );
        }

        if (
          !Object.keys(state.populationByYear).length
        ) {
          throw new Error(
            'No population data were found from row 31 onward.'
          );
        }

        state.sourceState = 'live';
        saveCache();
      } catch (error) {
        if (loadCache()) {
          state.sourceState = 'cached';
          return;
        }

        throw error;
      }
    }

    // ============================================================
    // YEARS + COVERAGE
    // ============================================================

    function sortedYears(object) {
      return Object.keys(object)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
    }

    function commonYears() {
      const clinicianYears =
        new Set(
          sortedYears(state.clinicianByYear)
        );

      return sortedYears(
        state.populationByYear
      ).filter(
        year => clinicianYears.has(year)
      );
    }

    function coverageForPHN(
      year,
      index
    ) {
      const clinicians =
        Number(
          state.clinicianByYear[year]?.[index]
        );

      const population =
        Number(
          state.populationByYear[year]?.[index]
        );

      if (
        !Number.isFinite(clinicians) ||
        !Number.isFinite(population) ||
        clinicians <= 0
      ) {
        return null;
      }

      return population / clinicians;
    }

    function indicesForState(stateCode) {
      return STATE_CODES
        .map(
          (code, index) =>
            code === stateCode
              ? index
              : -1
        )
        .filter(
          index => index >= 0
        );
    }

    function extremeAtYear(
      stateCode,
      year,
      kind
    ) {
      const candidates =
        indicesForState(stateCode)
          .map(
            index => ({
              index,
              value: coverageForPHN(
                year,
                index
              )
            })
          )
          .filter(
            item => Number.isFinite(item.value)
          );

      if (!candidates.length) {
        return null;
      }

      candidates.sort(
        (a, b) => a.value - b.value
      );

      return kind === 'dense'
        ? candidates[0]
        : candidates[candidates.length - 1];
    }

    function buildFixedExtremes() {
      state.fixedExtremes = {};

      if (!state.years.length) {
        return;
      }

      for (const stateCode of ALL_STATES) {
        let sparse = null;
        let dense = null;

        for (
          let index = state.years.length - 1;
          index >= 0;
          index -= 1
        ) {
          const year =
            state.years[index];

          sparse =
            sparse ||
            extremeAtYear(
              stateCode,
              year,
              'sparse'
            );

          dense =
            dense ||
            extremeAtYear(
              stateCode,
              year,
              'dense'
            );

          if (sparse && dense) {
            break;
          }
        }

        state.fixedExtremes[stateCode] = {
          sparseIndex: sparse?.index ?? null,
          denseIndex: dense?.index ?? null
        };
      }
    }

    function pointSeriesFor(
      stateCode,
      kind
    ) {
      if (
        EXTREME_SELECTION_MODE === 'per-year'
      ) {
        const phnByPoint = [];

        const data =
          state.years.map(
            year => {
              const extreme =
                extremeAtYear(
                  stateCode,
                  year,
                  kind
                );

              phnByPoint.push(
                extreme
                  ? PHNS[extreme.index]
                  : ''
              );

              return extreme
                ? extreme.value
                : null;
            }
          );

        return {
          data,
          phnByPoint
        };
      }

      const index =
        state.fixedExtremes[stateCode]?.[
          `${kind}Index`
        ];

      if (!Number.isInteger(index)) {
        return {
          data: state.years.map(() => null),
          phnByPoint: state.years.map(() => '')
        };
      }

      return {
        data:
          state.years.map(
            year => {
              const value =
                coverageForPHN(
                  year,
                  index
                );

              return Number.isFinite(value)
                ? value
                : null;
            }
          ),

        phnByPoint:
          state.years.map(
            () => PHNS[index]
          )
      };
    }

    function latestAnnualisedGrowth(
      stateCode,
      kind = state.displayMode
    ) {
      const series =
        pointSeriesFor(
          stateCode,
          kind
        );

      const recent =
        state.years
          .map(
            (year, index) => ({
              year,
              value:
                series.data[index]
            })
          )
          .filter(
            row =>
              Number.isFinite(
                row.value
              ) &&
              row.value > 0
          )
          .slice(-3);

      if (recent.length < 2) {
        return NaN;
      }

      const firstYear =
        recent[0].year;

      const points =
        recent.map(
          row => ({
            x:
              row.year -
              firstYear,
            y:
              Math.log(
                row.value
              )
          })
        );

      const meanX =
        points.reduce(
          (sum, point) =>
            sum + point.x,
          0
        ) / points.length;

      const meanY =
        points.reduce(
          (sum, point) =>
            sum + point.y,
          0
        ) / points.length;

      let numerator = 0;
      let denominator = 0;

      points.forEach(
        point => {
          const dx =
            point.x -
            meanX;

          numerator +=
            dx *
            (
              point.y -
              meanY
            );

          denominator +=
            dx * dx;
        }
      );

      if (
        !Number.isFinite(denominator) ||
        denominator <= 0
      ) {
        return NaN;
      }

      const slope =
        numerator /
        denominator;

      return Number.isFinite(slope)
        ? Math.expm1(slope) * 100
        : NaN;
    }

    function isSinglePHNState(stateCode) {
      return indicesForState(stateCode).length === 1;
    }

    // ============================================================
    // MODE-SPECIFIC Y SCALES
    // ============================================================

    function niceStep(rawStep) {
      if (
        !Number.isFinite(rawStep) ||
        rawStep <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(rawStep)
        );

      const magnitude =
        Math.pow(10, exponent);

      const fraction =
        rawStep / magnitude;

      let niceFraction;

      if (fraction <= 1) {
        niceFraction = 1;
      } else if (fraction <= 2) {
        niceFraction = 2;
      } else if (fraction <= 2.5) {
        niceFraction = 2.5;
      } else if (fraction <= 5) {
        niceFraction = 5;
      } else {
        niceFraction = 10;
      }

      return niceFraction * magnitude;
    }

    function nextNiceStep(step) {
      const value =
        Math.max(
          1e-9,
          Number(step) || 1
        );

      const exponent =
        Math.floor(
          Math.log10(value)
        );

      const magnitude =
        Math.pow(10, exponent);

      const fraction =
        value / magnitude;

      if (fraction < 1.5) {
        return 2 * magnitude;
      }

      if (fraction < 2.25) {
        return 2.5 * magnitude;
      }

      if (fraction < 3.75) {
        return 5 * magnitude;
      }

      if (fraction < 7.5) {
        return 10 * magnitude;
      }

      return 20 * magnitude;
    }

    function valuesForMode(kind) {
      const values = [];

      for (const stateCode of ALL_STATES) {
        const series =
          pointSeriesFor(
            stateCode,
            kind
          );

        for (const value of series.data) {
          if (Number.isFinite(value)) {
            values.push(value);
          }
        }
      }

      values.push(
        SATURATED_BENCHMARK,
        SUFFICIENT_BENCHMARK
      );

      return values;
    }

    function deriveModeScale(kind) {
      const values =
        valuesForMode(kind);

      if (!values.length) {
        return {
          min: 0,
          max: 10000,
          step: 2000,
          intervals: 5
        };
      }

      const dataMin =
        Math.min(...values);

      const dataMax =
        Math.max(...values);

      if (kind === 'sparse') {
        const paddedMax =
          Math.max(
            SUFFICIENT_BENCHMARK,
            dataMax * 1.08
          );

        let step =
          niceStep(
            paddedMax / 5
          );

        let maximum =
          step * 5;

        while (maximum < paddedMax) {
          step = nextNiceStep(step);
          maximum = step * 5;
        }

        return {
          min: 0,
          max: maximum,
          step,
          intervals: 5
        };
      }

      // Densest PHNs sit on a much lower range. Keep a zero baseline
      // and normally use 0–10,000, which gives six fixed major labels
      // (0, 2k, 4k, 6k, 8k, 10k) and makes the denser trajectories
      // materially easier to read. It still expands automatically if
      // future densest values move above 10,000.
      const paddedMax =
        Math.max(
          SUFFICIENT_BENCHMARK,
          dataMax * 1.05
        );

      let step =
        niceStep(
          paddedMax / 5
        );

      let maximum =
        step * 5;

      while (maximum < paddedMax) {
        step = nextNiceStep(step);
        maximum = step * 5;
      }

      return {
        min: 0,
        max: maximum,
        step,
        intervals: 5
      };
    }

    function buildYScales() {
      state.yScales.sparse =
        deriveModeScale('sparse');

      state.yScales.dense =
        deriveModeScale('dense');
    }

    function yScaleForMode(
      mode = state.displayMode
    ) {
      return state.yScales[mode] || {
        min: 0,
        max: 10000,
        step: 2000,
        intervals: 5
      };
    }

    function yTickTargets(
      mode = state.displayMode
    ) {
      const scale =
        yScaleForMode(mode);

      return Array.from(
        { length: scale.intervals + 1 },
        (_, index) =>
          scale.min + scale.step * index
      );
    }

    // ============================================================
    // COUNTING Y-AXIS LABELS
    // ============================================================

    const yAxisTickAnimation = {
      values: [],
      token: 0,
      raf: null
    };

    function setYAxisTickValuesImmediately(
      mode = state.displayMode
    ) {
      yAxisTickAnimation.values =
        yTickTargets(mode);
    }

    function animateYAxisTickValues(
      targets,
      duration = 1500
    ) {
      const targetValues =
        Array.from(targets || []);

      if (!targetValues.length) {
        return;
      }

      if (yAxisTickAnimation.raf) {
        cancelAnimationFrame(
          yAxisTickAnimation.raf
        );
        yAxisTickAnimation.raf = null;
      }

      const token =
        ++yAxisTickAnimation.token;

      const startValues =
        yAxisTickAnimation.values.length === targetValues.length
          ? [...yAxisTickAnimation.values]
          : [...targetValues];

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        yAxisTickAnimation.values =
          [...targetValues];
        chart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (
          token !== yAxisTickAnimation.token
        ) {
          return;
        }

        const progress =
          clamp(
            (now - startedAt) / duration,
            0,
            1
          );

        const eased =
          easeInOutCubic(progress);

        yAxisTickAnimation.values =
          targetValues.map(
            (target, index) => {
              const start =
                Number(startValues[index]);

              return Number.isFinite(start)
                ? start +
                  (target - start) * eased
                : target;
            }
          );

        chart?.draw();

        if (progress < 1) {
          yAxisTickAnimation.raf =
            requestAnimationFrame(frame);
        } else {
          yAxisTickAnimation.raf = null;
          yAxisTickAnimation.values =
            [...targetValues];
          chart?.draw();
        }
      }

      yAxisTickAnimation.raf =
        requestAnimationFrame(frame);
    }

    // ============================================================
    // BENCHMARK LINE SLIDE ANIMATION
    // ============================================================

    const benchmarkLineAnimation = {
      ratios: [],
      token: 0,
      raf: null
    };

    function benchmarkRatiosForMode(
      mode = state.displayMode
    ) {
      const scale =
        yScaleForMode(mode);

      const span =
        Math.max(
          1e-9,
          scale.max - scale.min
        );

      return [
        SATURATED_BENCHMARK,
        SUFFICIENT_BENCHMARK
      ].map(
        value =>
          1 -
          (
            value - scale.min
          ) / span
      );
    }

    function setBenchmarkLinePositionsImmediately(
      mode = state.displayMode
    ) {
      benchmarkLineAnimation.ratios =
        benchmarkRatiosForMode(mode);
    }

    function animateBenchmarkLinePositions(
      mode = state.displayMode,
      duration = 1500
    ) {
      const targets =
        benchmarkRatiosForMode(mode);

      if (benchmarkLineAnimation.raf) {
        cancelAnimationFrame(
          benchmarkLineAnimation.raf
        );
        benchmarkLineAnimation.raf = null;
      }

      const token =
        ++benchmarkLineAnimation.token;

      const starts =
        benchmarkLineAnimation.ratios.length ===
          targets.length
          ? [...benchmarkLineAnimation.ratios]
          : [...targets];

      if (
        reducedMotion() ||
        duration <= 0
      ) {
        benchmarkLineAnimation.ratios =
          [...targets];
        chart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      function frame(now) {
        if (
          token !==
          benchmarkLineAnimation.token
        ) {
          return;
        }

        const progress =
          clamp(
            (now - startedAt) / duration,
            0,
            1
          );

        const eased =
          easeInOutCubic(progress);

        benchmarkLineAnimation.ratios =
          targets.map(
            (target, index) => {
              const start =
                Number(starts[index]);

              return Number.isFinite(start)
                ? start +
                  (target - start) * eased
                : target;
            }
          );

        chart?.draw();

        if (progress < 1) {
          benchmarkLineAnimation.raf =
            requestAnimationFrame(frame);
        } else {
          benchmarkLineAnimation.raf = null;
          benchmarkLineAnimation.ratios =
            [...targets];
          chart?.draw();
        }
      }

      benchmarkLineAnimation.raf =
        requestAnimationFrame(frame);
    }

    // ============================================================
    // DATASETS
    // ============================================================

    function datasetFor(
      stateCode,
      kind
    ) {
      const colour =
        STATE_COLOURS[stateCode];

      const series =
        pointSeriesFor(
          stateCode,
          kind
        );

      const single =
        isSinglePHNState(stateCode);

      const legendPHN =
        series.phnByPoint.find(Boolean) ||
        stateCode;

      return {
        label:
          legendPHN,

        data:
          series.data,

        hidden:
          !state.selectedStates.has(stateCode),

        _stateCode:
          stateCode,

        _kind:
          single
            ? 'only'
            : kind,

        _phnByPoint:
          series.phnByPoint,

        borderColor:
          colour,

        backgroundColor:
          colour,

        borderWidth:
          3,

        pointRadius:
          0,

        pointHoverRadius:
          4,

        pointHitRadius:
          5,

        pointBackgroundColor:
          colour,

        pointBorderColor:
          '#fff',

        pointBorderWidth:
          1,

        tension:
          0.28,

        cubicInterpolationMode:
          'monotone',

        spanGaps:
          false
      };
    }

    function buildDatasets() {
      return ALL_STATES.map(
        stateCode =>
          datasetFor(
            stateCode,
            state.displayMode
          )
      );
    }

    // ============================================================
    // LEGEND
    // ============================================================

    function appendLegendItem({
      colour,
      label
    }) {
      const item =
        document.createElement('span');

      item.className =
        'legend-item';

      const marker =
        document.createElement('span');

      marker.className =
        'legend-line';

      marker.style.background =
        colour;

      const text =
        document.createElement('span');

      text.textContent = label;

      item.append(
        marker,
        text
      );

      chartLegend.appendChild(item);
    }

    function updateLegend(
      animate = true
    ) {
      const token =
        ++legendAnimationToken;

      const drawLegend = () => {
        if (token !== legendAnimationToken) {
          return;
        }

        chartLegend.textContent = '';

        for (const stateCode of ALL_STATES) {
          if (
            !state.selectedStates.has(stateCode)
          ) {
            continue;
          }

          const series =
            pointSeriesFor(
              stateCode,
              state.displayMode
            );

          const phnName =
            series.phnByPoint.find(Boolean) ||
            stateCode;

          appendLegendItem({
            colour: STATE_COLOURS[stateCode],
            label: phnName
          });
        }

        requestAnimationFrame(
          updateLegendScrollControls
        );
      };

      if (
        !animate ||
        reducedMotion() ||
        !chartLegend.childElementCount
      ) {
        drawLegend();
        return;
      }

      const outgoing =
        chartLegend.animate(
          [
            { opacity: 1 },
            { opacity: 0 }
          ],
          {
            duration: 150,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

      outgoing.finished
        .catch(() => {})
        .then(
          () => {
            drawLegend();

            if (
              token !== legendAnimationToken
            ) {
              return;
            }

            chartLegend.animate(
              [
                { opacity: 0 },
                { opacity: 1 }
              ],
              {
                duration: 230,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'both'
              }
            );
          }
        );
    }

    function updateHeadingScrollControls() {
      const maximumScroll =
        Math.max(
          0,
          headingScrollViewport.scrollWidth -
            headingScrollViewport.clientWidth
        );

      const hasOverflow =
        maximumScroll > 2;

      headingScrollLeft.classList.toggle(
        'is-hidden',
        !hasOverflow ||
          headingScrollViewport.scrollLeft <= 2
      );

      headingScrollRight.classList.toggle(
        'is-hidden',
        !hasOverflow ||
          headingScrollViewport.scrollLeft >=
            maximumScroll - 2
      );
    }

    function headingScrollAmount() {
      return Math.max(
        80,
        headingScrollViewport.clientWidth * 0.72
      );
    }

    headingScrollLeft.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        headingScrollViewport.scrollBy({
          left: -headingScrollAmount(),
          behavior: 'smooth'
        });
      }
    );

    headingScrollRight.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        headingScrollViewport.scrollBy({
          left: headingScrollAmount(),
          behavior: 'smooth'
        });
      }
    );

    headingScrollViewport.addEventListener(
      'scroll',
      updateHeadingScrollControls,
      {
        passive: true
      }
    );

    function updateLegendScrollControls() {
      const maximumScroll =
        chartLegend.scrollWidth -
        chartLegend.clientWidth;

      legendScrollLeft.classList.toggle(
        'is-hidden',
        maximumScroll <= 2 ||
          chartLegend.scrollLeft <= 2
      );

      legendScrollRight.classList.toggle(
        'is-hidden',
        maximumScroll <= 2 ||
          chartLegend.scrollLeft >=
            maximumScroll - 2
      );
    }

    function legendScrollAmount() {
      return Math.max(
        80,
        legendViewport.clientWidth * 0.72
      );
    }

    legendScrollLeft.addEventListener(
      'click',
      () => {
        chartLegend.scrollBy({
          left: -legendScrollAmount(),
          behavior: 'smooth'
        });
      }
    );

    legendScrollRight.addEventListener(
      'click',
      () => {
        chartLegend.scrollBy({
          left: legendScrollAmount(),
          behavior: 'smooth'
        });
      }
    );

    chartLegend.addEventListener(
      'scroll',
      updateLegendScrollControls,
      { passive: true }
    );

    // ============================================================
    // CHART PLUGINS
    // ============================================================

    const coverageBenchmarksPlugin = {
      id: 'coverageBenchmarksPlugin',

      beforeDatasetsDraw(chartInstance) {
        const { ctx, chartArea } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const benchmarks = [
          {
            colour: SATURATED_COLOUR
          },
          {
            colour: SUFFICIENT_COLOUR
          }
        ];

        const ratios =
          benchmarkLineAnimation.ratios.length ===
            benchmarks.length
            ? benchmarkLineAnimation.ratios
            : benchmarkRatiosForMode();

        ctx.save();
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.setLineDash([1, 4]);

        benchmarks.forEach(
          (benchmark, index) => {
            const ratio =
              Number(ratios[index]);

            if (!Number.isFinite(ratio)) {
              return;
            }

            const y =
              chartArea.top +
              chartArea.height * ratio;

            if (
              y < chartArea.top - 1 ||
              y > chartArea.bottom + 1
            ) {
              return;
            }

            ctx.strokeStyle =
              benchmark.colour;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              Math.round(y) + 0.5
            );
            ctx.lineTo(
              chartArea.right,
              Math.round(y) + 0.5
            );
            ctx.stroke();
          }
        );

        ctx.restore();
      }
    };

    const pffAxesPlugin = {
      id: 'pffAxesPlugin',

      beforeDatasetsDraw(chartInstance) {
        const { ctx, chartArea } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        const intervals =
          yScaleForMode().intervals;

        if (intervals <= 0) {
          return;
        }

        ctx.save();

        // PFF graphs use horizontal grey guides only.
        // Minor guides sit halfway between each major Y interval.
        ctx.strokeStyle =
          'rgba(105, 113, 138, 0.035)';
        ctx.lineWidth = 0.7;

        for (
          let index = 0;
          index < intervals;
          index += 1
        ) {
          const ratio =
            (index + 0.5) / intervals;

          const y =
            chartArea.bottom -
            chartArea.height * ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        // Major horizontal guides.
        ctx.strokeStyle =
          'rgba(105, 113, 138, 0.075)';
        ctx.lineWidth = 1;

        for (
          let index = 0;
          index <= intervals;
          index += 1
        ) {
          const ratio =
            index / intervals;

          const y =
            chartArea.bottom -
            chartArea.height * ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(chartInstance) {
        const { ctx, chartArea, scales } =
          chartInstance;

        const xScale =
          scales?.x;

        if (
          !chartArea ||
          !xScale
        ) {
          return;
        }

        const scaleDef =
          yScaleForMode();

        const intervals =
          scaleDef.intervals;

        const values =
          yAxisTickAnimation.values.length ===
            intervals + 1
            ? yAxisTickAnimation.values
            : yTickTargets();

        ctx.save();
        ctx.lineCap = 'butt';

        // Major Y ticks and counting labels at fixed positions.
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#151515';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font =
          '12px Lato, sans-serif';

        for (
          let index = 0;
          index <= intervals;
          index += 1
        ) {
          const ratio =
            index / intervals;

          const y =
            chartArea.bottom -
            chartArea.height * ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 5,
            Math.round(y) + 0.5
          );
          ctx.stroke();

          const value =
            Number(values[index]);

          ctx.fillText(
            formatNumber(
              Number.isFinite(value)
                ? value
                : scaleDef.min +
                  scaleDef.step * index
            ),
            chartArea.left - 8,
            y
          );
        }

        // Minor Y ticks.
        ctx.strokeStyle = '#69718a';
        ctx.globalAlpha = 0.60;
        ctx.lineWidth = 0.7;

        for (
          let index = 0;
          index < intervals;
          index += 1
        ) {
          const ratio =
            (index + 0.5) / intervals;

          const y =
            chartArea.bottom -
            chartArea.height * ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 2,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        // X ticks: every year gets a tick, with even years as major ticks.
        // No vertical grid lines are drawn through the plot.
        ctx.globalAlpha = 1;

        for (
          let index = 0;
          index < state.years.length;
          index += 1
        ) {
          const year =
            Number(state.years[index]);

          const x =
            xScale.getPixelForTick(index);

          if (!Number.isFinite(x)) {
            continue;
          }

          const major =
            Number.isFinite(year) &&
            year % 2 === 0;

          ctx.strokeStyle =
            major
              ? '#151515'
              : '#69718a';

          ctx.globalAlpha =
            major
              ? 1
              : 0.60;

          ctx.lineWidth =
            major
              ? 1
              : 0.7;

          ctx.beginPath();
          ctx.moveTo(
            Math.round(x) + 0.5,
            chartArea.bottom
          );
          ctx.lineTo(
            Math.round(x) + 0.5,
            chartArea.bottom +
              (major ? 5 : 2)
          );
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    const axisSpinesPlugin = {
      id: 'axisSpinesPlugin',

      afterDraw(chartInstance) {
        const { ctx, chartArea } =
          chartInstance;

        if (!chartArea) {
          return;
        }

        ctx.save();
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(
          Math.round(chartArea.left) + 0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(chartArea.left) + 0.5,
          chartArea.bottom
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(
          chartArea.left,
          Math.round(chartArea.bottom) + 0.5
        );
        ctx.lineTo(
          chartArea.right,
          Math.round(chartArea.bottom) + 0.5
        );
        ctx.stroke();

        ctx.restore();
      }
    };

    const coverageTrendLabelsPlugin = {
      id:
        'coverageTrendLabelsPlugin',

      afterDatasetsDraw(
        chartInstance
      ) {
        if (!trendLabelsOn) {
          return;
        }

        const {
          ctx,
          chartArea
        } = chartInstance;

        if (!chartArea) {
          return;
        }

        const mobile =
          window.innerWidth <= 430;

        const fontSize =
          mobile
            ? 8.2
            : 9.1;

        const labelHeight =
          mobile
            ? 14
            : 15;

        const paddingX =
          mobile
            ? 4
            : 5;

        const arrowGap =
          mobile
            ? 2.5
            : 3;

        const items = [];

        ctx.save();

        ctx.font =
          `700 ${fontSize}px Lato, sans-serif`;

        ctx.textBaseline =
          'middle';

        ALL_STATES.forEach(
          (
            stateCode,
            seriesIndex
          ) => {
            if (
              !state.selectedStates.has(
                stateCode
              )
            ) {
              return;
            }

            const meta =
              chartInstance.getDatasetMeta(
                seriesIndex
              );

            if (
              !meta ||
              meta.hidden
            ) {
              return;
            }

            const growth =
              latestAnnualisedGrowth(
                stateCode,
                state.displayMode
              );

            if (
              !Number.isFinite(
                growth
              )
            ) {
              return;
            }

            const dataset =
              chartInstance.data.datasets[
                seriesIndex
              ];

            if (
              !dataset ||
              !meta.data?.length
            ) {
              return;
            }

            let anchorIndex = -1;

            for (
              let index =
                dataset.data.length - 1;
              index >= 0;
              index -= 1
            ) {
              if (
                Number.isFinite(
                  dataset.data[index]
                ) &&
                Number.isFinite(
                  meta.data[index]?.x
                ) &&
                Number.isFinite(
                  meta.data[index]?.y
                )
              ) {
                anchorIndex =
                  index;
                break;
              }
            }

            if (anchorIndex < 0) {
              return;
            }

            const point =
              meta.data[
                anchorIndex
              ];

            const isIncrease =
              growth > 0.05;

            const isDecrease =
              growth < -0.05;

            const arrow =
              isIncrease
                ? '↑'
                : isDecrease
                  ? '↓'
                  : '';

            const valueText =
              `${Math.abs(growth).toFixed(1)}% p.a.`;

            const arrowWidth =
              arrow
                ? ctx.measureText(
                    arrow
                  ).width
                : 0;

            const valueWidth =
              ctx.measureText(
                valueText
              ).width;

            const labelWidth =
              paddingX * 2 +
              arrowWidth +
              (
                arrow
                  ? arrowGap
                  : 0
              ) +
              valueWidth;

            items.push({
              seriesColour:
                STATE_COLOURS[
                  stateCode
                ],
              isIncrease,
              isDecrease,
              arrow,
              valueText,
              arrowWidth,
              labelWidth,
              anchorX:
                point.x,
              anchorY:
                point.y
            });
          }
        );

        if (!items.length) {
          ctx.restore();
          return;
        }

        const placed = [];

        function overlaps(
          rectangle
        ) {
          const padding = 5;

          return placed.some(
            existing =>
              !(
                rectangle.right +
                  padding <
                  existing.left ||
                rectangle.left -
                  padding >
                  existing.right ||
                rectangle.bottom +
                  padding <
                  existing.top ||
                rectangle.top -
                  padding >
                  existing.bottom
              )
          );
        }

        items
          .sort(
            (
              first,
              second
            ) =>
              first.anchorY -
              second.anchorY
          )
          .forEach(
            (
              item,
              itemIndex
            ) => {
              const horizontalOffsets =
                [
                  0,
                  -68,
                  -136,
                  -34,
                  -102,
                  -170
                ];

              const verticalOffsets =
                [
                  0,
                  -2,
                  2,
                  -4,
                  4,
                  -6,
                  6,
                  -8,
                  8
                ];

              let chosen = null;

              for (
                const horizontalOffset
                of horizontalOffsets
              ) {
                for (
                  const verticalOffset
                  of verticalOffsets
                ) {
                  const proposedRight =
                    clamp(
                      chartArea.right -
                        4 +
                        horizontalOffset,
                      chartArea.left +
                        item.labelWidth +
                        5,
                      chartArea.right -
                        4
                    );

                  const proposedLeft =
                    proposedRight -
                    item.labelWidth;

                  const proposedY =
                    clamp(
                      item.anchorY +
                        verticalOffset,
                      chartArea.top +
                        labelHeight /
                        2,
                      chartArea.bottom -
                        labelHeight /
                        2
                    );

                  const rectangle = {
                    left:
                      proposedLeft,
                    right:
                      proposedRight,
                    top:
                      proposedY -
                      labelHeight /
                      2,
                    bottom:
                      proposedY +
                      labelHeight /
                      2,
                    y:
                      proposedY
                  };

                  if (
                    !overlaps(
                      rectangle
                    )
                  ) {
                    chosen =
                      rectangle;
                    break;
                  }
                }

                if (chosen) {
                  break;
                }
              }

              if (!chosen) {
                const right =
                  clamp(
                    chartArea.right -
                      4 -
                      (itemIndex % 3) *
                        68,
                    chartArea.left +
                      item.labelWidth +
                      5,
                    chartArea.right -
                      4
                  );

                const y =
                  clamp(
                    item.anchorY +
                      (
                        itemIndex % 2 ===
                          0
                          ? -6
                          : 6
                      ),
                    chartArea.top +
                      labelHeight /
                      2,
                    chartArea.bottom -
                      labelHeight /
                      2
                  );

                chosen = {
                  left:
                    right -
                    item.labelWidth,
                  right,
                  top:
                    y -
                    labelHeight /
                    2,
                  bottom:
                    y +
                    labelHeight /
                    2,
                  y
                };
              }

              item.labelLeft =
                chosen.left;

              item.labelRight =
                chosen.right;

              item.labelY =
                chosen.y;

              placed.push(
                chosen
              );
            }
          );

        items.forEach(
          item => {
            const targetX =
              item.anchorX <
              item.labelLeft
                ? item.labelLeft
                : item.anchorX >
                  item.labelRight
                  ? item.labelRight
                  : clamp(
                      item.anchorX,
                      item.labelLeft,
                      item.labelRight
                    );

            const displaced =
              Math.abs(
                targetX -
                item.anchorX
              ) >
                7 ||
              Math.abs(
                item.labelY -
                item.anchorY
              ) >
                2 ||
              item.labelLeft <
                item.anchorX -
                4;

            if (!displaced) {
              return;
            }

            ctx.beginPath();

            ctx.moveTo(
              item.anchorX,
              item.anchorY
            );

            ctx.lineTo(
              targetX,
              item.labelY
            );

            ctx.strokeStyle =
              'rgba(105, 113, 138, 0.58)';

            ctx.lineWidth =
              0.8;

            ctx.stroke();
          }
        );

        items.forEach(
          item => {
            const fillColour =
              seriesTint(
                item.seriesColour,
                0.20,
                0.84
              );

            const directionColour =
              item.isIncrease
                ? '#14823b'
                : item.isDecrease
                  ? '#b42318'
                  : '#69718a';

            const radius = 3;

            const top =
              item.labelY -
              labelHeight /
              2;

            const bottom =
              item.labelY +
              labelHeight /
              2;

            ctx.beginPath();

            ctx.moveTo(
              item.labelLeft +
                radius,
              top
            );

            ctx.lineTo(
              item.labelRight -
                radius,
              top
            );

            ctx.quadraticCurveTo(
              item.labelRight,
              top,
              item.labelRight,
              top +
                radius
            );

            ctx.lineTo(
              item.labelRight,
              bottom -
                radius
            );

            ctx.quadraticCurveTo(
              item.labelRight,
              bottom,
              item.labelRight -
                radius,
              bottom
            );

            ctx.lineTo(
              item.labelLeft +
                radius,
              bottom
            );

            ctx.quadraticCurveTo(
              item.labelLeft,
              bottom,
              item.labelLeft,
              bottom -
                radius
            );

            ctx.lineTo(
              item.labelLeft,
              top +
                radius
            );

            ctx.quadraticCurveTo(
              item.labelLeft,
              top,
              item.labelLeft +
                radius,
              top
            );

            ctx.closePath();

            ctx.fillStyle =
              fillColour;

            ctx.fill();

            ctx.strokeStyle =
              rgba(
                item.seriesColour,
                0.42
              );

            ctx.lineWidth =
              0.65;

            ctx.stroke();

            let textX =
              item.labelLeft +
              paddingX;

            ctx.textAlign =
              'left';

            ctx.fillStyle =
              directionColour;

            if (item.arrow) {
              ctx.fillText(
                item.arrow,
                textX,
                item.labelY -
                  0.2
              );

              textX +=
                item.arrowWidth +
                arrowGap;
            }

            ctx.fillText(
              item.valueText,
              textX,
              item.labelY
            );
          }
        );

        ctx.restore();
      }
    };

    Chart.register(
      pffAxesPlugin,
      coverageBenchmarksPlugin,
      axisSpinesPlugin,
      coverageTrendLabelsPlugin
    );

    // ============================================================
    // CHART CONFIGURATION
    // ============================================================

    function chartAnimationDuration(reason) {
      if (reducedMotion()) {
        return 0;
      }

      switch (reason) {
        case 'mode':
        case 'initial':
          return 1500;

        case 'filter':
        default:
          return 520;
      }
    }

    function chartAnimationEasing(reason) {
      return reason === 'mode' ||
        reason === 'initial'
        ? 'easeInOutCubic'
        : 'easeOutCubic';
    }

    function tooltipLabel(context) {
      const dataset =
        context.dataset;

      const stateCode =
        dataset._stateCode || '';

      const kind =
        dataset._kind === 'only'
          ? 'Single PHN'
          : state.displayMode === 'sparse'
            ? 'Sparsest'
            : 'Densest';

      const phn =
        dataset._phnByPoint?.[
          context.dataIndex
        ] || '';

      const value =
        Number(context.raw);

      const year =
        Number(
          state.years[
            context.dataIndex
          ]
        );

      const phnIndex =
        PHNS.indexOf(phn);

      const clinicians =
        phnIndex >= 0 && Number.isFinite(year)
          ? Number(
              state.clinicianByYear?.[
                year
              ]?.[
                phnIndex
              ]
            )
          : null;

      const population =
        phnIndex >= 0 && Number.isFinite(year)
          ? Number(
              state.populationByYear?.[
                year
              ]?.[
                phnIndex
              ]
            )
          : null;

      const lines = [
        `${stateCode} — ${kind}`,
        phn,
        `${formatNumber(value)} people per FTE clinician`
      ];

      if (
        Number.isFinite(clinicians) &&
        Number.isFinite(population)
      ) {
        lines.push(
          `${formatOneDecimal(clinicians)} active FTE clinicians · ${formatNumber(population)} people`
        );
      }

      return lines;
    }

    function baseChartOptions() {
      const mobile =
        window.innerWidth <= 430;

      const scaleDef =
        yScaleForMode();

      return {
        responsive: true,
        maintainAspectRatio: false,
        normalized: true,
        resizeDelay: 0,

        devicePixelRatio:
          Math.min(
            window.devicePixelRatio || 1,
            3
          ),

        animation: {
          duration:
            reducedMotion()
              ? 0
              : 1500,
          easing: 'easeInOutCubic'
        },

        animations: {
          x: {
            duration: 0
          },
          y: {
            duration:
              reducedMotion()
                ? 0
                : 1500,
            easing: 'easeInOutCubic'
          },
          colors: {
            duration: 0
          }
        },

        transitions: {
          active: {
            animation: {
              duration:
                reducedMotion()
                  ? 0
                  : 170,
              easing: 'easeOutCubic'
            }
          }
        },

        interaction: {
          mode: 'nearest',
          intersect: true,
          axis: 'xy'
        },

        layout: {
          autoPadding: true,
          padding: {
            top: mobile ? 8 : 9,
            right: 3,
            bottom: 0,
            left: 0
          }
        },

        plugins: {
          legend: {
            display: false
          },

          tooltip: {
            displayColors: false,
            backgroundColor: '#ffffff',
            titleColor: '#151515',
            bodyColor: '#69718a',
            borderColor: '#e8eaf0',
            borderWidth: 1,
            padding: 9,
            cornerRadius: 4,

            titleFont: {
              family: 'Lato',
              size: 12,
              weight: '700'
            },

            bodyFont: {
              family: 'Lato',
              size: 11,
              weight: '400'
            },

            callbacks: {
              title(items) {
                return items?.length
                  ? String(items[0].label)
                  : '';
              },

              label: tooltipLabel
            }
          }
        },

        scales: {
          x: {
            type: 'category',
            offset: false,

            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },

            border: {
              display: false
            },

            ticks: {
              color: '#151515',
              padding: 7,
              maxRotation: 0,
              minRotation: 0,
              autoSkip: false,

              font: {
                family: 'Lato',
                size: mobile ? 9 : 10,
                weight: '400'
              },

              callback(value, index) {
                const year =
                  Number(state.years[index]);

                return Number.isFinite(year) &&
                  year % 2 === 0
                  ? String(year)
                  : '';
              }
            },

            title: {
              display: true,
              text: 'Year',
              color: '#151515',
              padding: {
                top: 3
              },

              font: {
                family: 'Lato',
                size: mobile ? 12 : 13,
                weight: '700'
              }
            }
          },

          y: {
            min: scaleDef.min,
            max: scaleDef.max,

            afterFit(scale) {
              scale.width =
                mobile
                  ? 61
                  : 69;
            },

            grid: {
              drawOnChartArea: false,
              drawTicks: false
            },

            border: {
              display: false
            },

            ticks: {
              display: false,
              stepSize: scaleDef.step
            },

            title: {
              display: true,
              text: 'People per FTE clinician',
              color: '#151515',
              padding: {
                bottom: 4
              },

              font: {
                family: 'Lato',
                size: mobile ? 12 : 13,
                weight: '700'
              }
            }
          }
        }

      };
    }

    function createChart() {
      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type: 'line',

            data: {
              labels: state.years,
              datasets: buildDatasets()
            },

            options: baseChartOptions()
          }
        );
    }

    function syncChartScale() {
      if (!chart) {
        return;
      }

      const scaleDef =
        yScaleForMode();

      const y =
        chart.options.scales.y;

      y.min = scaleDef.min;
      y.max = scaleDef.max;
      y.ticks.stepSize = scaleDef.step;
    }

    function syncChartDatasets() {
      if (!chart) {
        return;
      }

      const nextDatasets =
        buildDatasets();

      nextDatasets.forEach(
        (nextDataset, index) => {
          const current =
            chart.data.datasets[index];

          if (!current) {
            return;
          }

          current.label =
            nextDataset.label;

          current.data =
            nextDataset.data;

          current.hidden =
            nextDataset.hidden;

          current._kind =
            nextDataset._kind;

          current._phnByPoint =
            nextDataset._phnByPoint;
        }
      );
    }

    function renderChart(
      reason = 'filter',
      animateText = true
    ) {
      if (!chart) {
        setYAxisTickValuesImmediately();
        createChart();
        return;
      }

      const nextAxisTargets =
        yTickTargets();

      syncChartDatasets();
      syncChartScale();

      const duration =
        chartAnimationDuration(reason);

      const easing =
        chartAnimationEasing(reason);

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        easing;

      // Years do not change between Densest/Sparsest or state filters.
      chart.options.animations.x.duration =
        0;

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        easing;

      chart.update();

      if (reason === 'mode') {
        animateYAxisTickValues(
          nextAxisTargets,
          duration
        );

        animateBenchmarkLinePositions(
          state.displayMode,
          duration
        );
      } else {
        yAxisTickAnimation.values =
          [...nextAxisTargets];

        setBenchmarkLinePositionsImmediately(
          state.displayMode
        );
      }

      if (reason === 'mode') {
        updateLegend(true);
      }
    }

    // ============================================================
    // MODE TABS
    // ============================================================

    function positionModeTabIndicator(
      animate = true
    ) {
      const activeTab =
        modeTabs.find(
          tab =>
            tab.classList.contains(
              'is-active'
            )
        );

      if (
        !activeTab ||
        !modeTabList
      ) {
        return;
      }

      if (!animate) {
        modeTabList.classList.add(
          'is-positioning'
        );
      }

      const listRect =
        modeTabList.getBoundingClientRect();

      const tabRect =
        activeTab.getBoundingClientRect();

      const x =
        tabRect.left -
        listRect.left +
        modeTabList.scrollLeft;

      modeTabList.style.setProperty(
        '--tab-indicator-x',
        `${x}px`
      );

      modeTabList.style.setProperty(
        '--tab-indicator-width',
        `${tabRect.width}px`
      );

      if (!animate) {
        requestAnimationFrame(
          () => {
            requestAnimationFrame(
              () =>
                modeTabList.classList.remove(
                  'is-positioning'
                )
            );
          }
        );
      }
    }

    function updateModeTabs(
      animate = true
    ) {
      modeTabs.forEach(
        tab => {
          const active =
            tab.dataset.mode ===
            state.displayMode;

          tab.classList.toggle(
            'is-active',
            active
          );

          tab.setAttribute(
            'aria-selected',
            active
              ? 'true'
              : 'false'
          );
        }
      );

      requestAnimationFrame(
        () =>
          positionModeTabIndicator(
            animate
          )
      );
    }

    modeTabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => {
            const mode =
              tab.dataset.mode;

            if (
              !['sparse', 'dense'].includes(mode) ||
              mode === state.displayMode
            ) {
              return;
            }

            state.displayMode = mode;
            updateModeTabs(true);
            renderChart('mode', false);
          }
        );
      }
    );

    // ============================================================
    // STATE FILTER
    // ============================================================

    function buildStateControls() {
      stateOptions.textContent = '';

      for (const stateCode of ALL_STATES) {
        const label =
          document.createElement('label');

        label.className =
          'state-option';

        const input =
          document.createElement('input');

        input.type = 'checkbox';
        input.checked = true;
        input.dataset.stateCode = stateCode;

        const box =
          document.createElement('span');

        box.className =
          'state-option-box';

        box.setAttribute(
          'aria-hidden',
          'true'
        );

        const code =
          document.createElement('span');

        code.className =
          `state-option-code state-filter-${stateCode.toLowerCase()}`;

        code.textContent =
          stateCode;

        code.title =
          STATE_NAMES[stateCode];

        label.append(
          input,
          box,
          code
        );

        stateOptions.appendChild(label);
      }
    }

    function stateInputs() {
      return Array.from(
        stateOptions.querySelectorAll(
          'input[data-state-code]'
        )
      );
    }

    function selectedStateSummary() {
      const selected =
        ALL_STATES.filter(
          code =>
            state.selectedStates.has(
              code
            )
        );

      if (selected.length === ALL_STATES.length) return 'All';
      if (selected.length === 0) return 'None';
      if (selected.length === 1) return selected[0];
      return String(selected.length);
    }

    function syncStateControlsFromState() {
      const inputs =
        stateInputs();

      inputs.forEach(
        input => {
          input.checked =
            state.selectedStates.has(
              input.dataset.stateCode
            );
        }
      );

      const count =
        state.selectedStates.size;

      stateAll.checked =
        count === ALL_STATES.length;

      stateAll.indeterminate =
        count > 0 &&
        count < ALL_STATES.length;

      fadeTextChange(
        stateButtonValue,
        selectedStateSummary(),
        true
      );
    }

    function applyStateFilter() {
      syncStateControlsFromState();
      updateLegend(true);
      renderChart('filter', false);
    }

    stateButton.addEventListener(
      'click',
      event => {
        event.stopPropagation();

        const open =
          !stateMenu.classList.contains(
            'is-open'
          );

        setStateMenuOpen(open);
      }
    );

    stateMenu.addEventListener(
      'click',
      event => event.stopPropagation()
    );

    stateAll.addEventListener(
      'change',
      () => {
        state.selectedStates =
          stateAll.checked
            ? new Set(ALL_STATES)
            : new Set();

        applyStateFilter();
      }
    );

    stateOptions.addEventListener(
      'change',
      event => {
        const input =
          event.target.closest(
            'input[data-state-code]'
          );

        if (!input) {
          return;
        }

        const stateCode =
          input.dataset.stateCode;

        if (input.checked) {
          state.selectedStates.add(
            stateCode
          );
        } else {
          state.selectedStates.delete(
            stateCode
          );
        }

        applyStateFilter();
      }
    );

    function setStateMenuOpen(isOpen) {
      stateMenu.classList.toggle(
        'is-open',
        isOpen
      );

      stateButton.setAttribute(
        'aria-expanded',
        String(isOpen)
      );
    }

    document.addEventListener(
      'click',
      event => {
        if (!stateControl.contains(event.target)) {
          setStateMenuOpen(false);
        }
      }
    );

    document.addEventListener(
      'keydown',
      event => {
        if (event.key === 'Escape') {
          setStateMenuOpen(false);
          stateButton.focus();
        }
      }
    );

    // ============================================================
    // DATA SOURCE STATUS
    // ============================================================

    function updateSourceStatus() {
      if (
        state.sourceState === 'cached'
      ) {
        liveData.classList.add(
          'is-cached'
        );

        liveData.setAttribute(
          'aria-label',
          'Cached data'
        );

        liveDataText.textContent =
          'CACHED data';
      } else {
        liveData.classList.remove(
          'is-cached'
        );

        liveData.setAttribute(
          'aria-label',
          'Live data'
        );

        liveDataText.textContent =
          'LIVE data';
      }
    }

    // ============================================================
    // TREND TOGGLE
    // ============================================================

    function updateTrendToggle() {
      yoyTrendToggle.classList.toggle(
        'is-on',
        trendLabelsOn
      );

      yoyTrendToggle.setAttribute(
        'aria-pressed',
        String(trendLabelsOn)
      );

      yoyTrendToggle.setAttribute(
        'aria-label',
        `3-year trend labels ${trendLabelsOn ? 'on' : 'off'}`
      );

      yoyToggleValue.textContent =
        trendLabelsOn
          ? 'ON'
          : 'OFF';
    }

    yoyTrendToggle.addEventListener(
      'click',
      () => {
        trendLabelsOn =
          !trendLabelsOn;

        updateTrendToggle();

        chart?.draw();
      }
    );

    // ============================================================
    // RESPONSIVE LAYOUT
    // ============================================================

    let resizeFrame = null;

    window.addEventListener(
      'resize',
      () => {
        if (resizeFrame !== null) {
          cancelAnimationFrame(
            resizeFrame
          );
        }

        resizeFrame =
          requestAnimationFrame(
            () => {
              resizeFrame = null;

              updateHeadingScrollControls();
              updateLegendScrollControls();
              positionModeTabIndicator(false);

              if (!chart) {
                return;
              }

              chart.options =
                baseChartOptions();

              setYAxisTickValuesImmediately(
                state.displayMode
              );

              setBenchmarkLinePositionsImmediately(
                state.displayMode
              );

              chart.update('none');
            }
          );
      }
    );

    if ('ResizeObserver' in window) {
      const legendResizeObserver =
        new ResizeObserver(
          updateLegendScrollControls
        );

      legendResizeObserver.observe(
        legendViewport
      );

      legendResizeObserver.observe(
        chartLegend
      );

      const headingResizeObserver =
        new ResizeObserver(
          updateHeadingScrollControls
        );

      headingResizeObserver.observe(
        headingScrollShell
      );

      headingResizeObserver.observe(
        headingScrollViewport
      );

      headingResizeObserver.observe(
        chartHeading
      );
    }

    requestAnimationFrame(
      updateHeadingScrollControls
    );

    // ============================================================
    // START
    // ============================================================

    async function init() {
      buildStateControls();
      syncStateControlsFromState();
      updateModeTabs(false);

      try {
        await loadData();

        state.years =
          commonYears();

        if (!state.years.length) {
          throw new Error(
            'No years were common to the clinician and population sheets.'
          );
        }

        buildFixedExtremes();
        buildYScales();
        setYAxisTickValuesImmediately('dense');
        setBenchmarkLinePositionsImmediately('dense');
        updateSourceStatus();
        updateTrendToggle();
        updateLegend(false);
        createChart();

        requestAnimationFrame(
          updateHeadingScrollControls
        );

        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );

        requestAnimationFrame(
          () => {
            updateLegendScrollControls();
            positionModeTabIndicator(false);
          }
        );
      } catch (error) {
        app.classList.remove(
          'is-loading'
        );

        app.setAttribute(
          'aria-busy',
          'false'
        );

        updateSourceStatus();

        statusEl.textContent =
          error?.message ||
          'Could not load PHN population coverage data.';
      }
    }

    init();
  </script>
</body>
</html>
