<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Optometry Labour Demand</title>

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>
  <script src="./assets/pff_chart_core.js"></script>

  <style>
    :root {
      --trend-yellow: #f1c232;
    }

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .passive-legend .legend-item {
      cursor: default;

    }

    .legend-square {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      background: rgba(102, 0, 255, 0.24);
      border: 1px solid rgba(102, 0, 255, 0.46);
    }

    .trend-legend {
      transform-origin: left center;
      will-change: opacity, transform;
    }

    .trend-legend[hidden] {
      display: none;
    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading optometry labour demand data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading optometry labour demand data…</p>
      </div>

      <div class="module-top">
        <div class="tab-list" aria-label="Labour demand module">
          <div
            class="chart-tab is-active"
            style="border-bottom-color: var(--pff-purple);"
          >Labour demand</div>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">

      <div class="chart-options-row">
        <div class="chart-legend passive-legend" aria-label="Chart legend">
          <span class="legend-item">
            <span class="legend-square" aria-hidden="true"></span>
            <span>Monthly FTE job ads</span>
          </span>

          <span id="trendLegend" class="legend-item trend-legend">
            <span
              class="legend-line"
              style="--legend-colour: var(--trend-yellow);"

            ></span>
            <span>13-week trailing average</span>

      <div class="chart-shell">
        <canvas
          id="demandChart"
          aria-label="Australian optometry labour demand chart"
          role="img"
        ></canvas>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const CONFIG = {
      jobSheetId:
        '1ZcZrPHvux_ckk2cJqRYu1oz9uT4brcRmcJ80bP-v--4',

      jobSheetName:
        'Mirror table',

      jobRange:
        'B3:V',

      fetchTimeoutMs:
        20000,

      cacheFetchTimeoutMs:
        10000,

      localCacheKey:
        'pff-labour-demand-fte-job-ads-v1',

      trailingWeeks:
        13,

      pointRadius:
        2.7,

      pointHoverRadius:
        4.4,

      trendWidth:
        3,

      columns: {
        repeatFlag: 0,
        date: 2,
        fteDays: 11
      }
    };

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbx4E4fZUhs1RDLFfsMAhJCSHQIWHcNg-PjZOSif93hKSOq6o0gv1OD8wcLjsa3ssy4mDQ/exec';

    const CACHE_APP_KEY =
      'pff-optometry-related-job-tracker';

    const DAY_MS =
      24 * 60 * 60 * 1000;

    const AVERAGE_MONTH_DAYS =
      365.2425 / 12;

    const TRAILING_WINDOW_MS =
      CONFIG.trailingWeeks *
      7 *
      DAY_MS;

    const clamp =
      PFF.clamp;

    const rgba =
      PFF.rgba;

    const cleanText =
      PFF.cleanText;

    const app =
      document.getElementById(
        'app'
      );

    const dataSourceIndicator =
      document.getElementById(
        'dataSourceIndicator'
      );

    const dataSourceText =
      document.getElementById(
        'dataSourceText'
      );

    const trendLegend =
      document.getElementById(
        'trendLegend'
      );

    const statusElement =
      document.getElementById(
        'status'
      );

    const chartCanvas =
      document.getElementById(
        'demandChart'
      );

    let rows =
      [];

    let chart =
      null;

    let trendMode =
      '3yr';

    let axisBounds =
      null;

    let yAxisModel = {
      min: 0,
      max: 1,
      majorStep: 1
    };

    let trendLegendAnimationToken =
      0;

    function normaliseText(
      value
    ) {
      return cleanText(
        value
      ).toLowerCase();
    }

    function getCellText(
      cell
    ) {
      return cleanText(
        cell?.f ??
        cell?.v ??
        ''
      );
    }

    function parseDateValue(
      value
    ) {
      if (
        value instanceof
        Date
      ) {
        return Number.isNaN(
          value.getTime()
        )
          ? null
          : new Date(
              Date.UTC(
                value.getFullYear(),
                value.getMonth(),
                value.getDate()
              )
            );
      }

      if (
        typeof value ===
        'number' &&
        Number.isFinite(
          value
        )
      ) {
        const googleEpoch =
          Date.UTC(
            1899,
            11,
            30
          );

        const date =
          new Date(
            googleEpoch +
            value *
            DAY_MS
          );

        return Number.isNaN(
          date.getTime()
        )
          ? null
          : date;
      }

      const text =
        cleanText(
          value
        );

      if (!text) {
        return null;
      }

      let match =
        text.match(
          /^Date\((\d+),(\d+),(\d+)\)$/
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(
              match[1]
            ),
            Number(
              match[2]
            ),
            Number(
              match[3]
            )
          )
        );
      }

      match =
        text.match(
          /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
        );

      if (match) {
        let year =
          Number(
            match[3]
          );

        if (
          year <
          100
        ) {
          year +=
            2000;
        }

        return new Date(
          Date.UTC(
            year,
            Number(
              match[2]
            ) -
            1,
            Number(
              match[1]
            )
          )
        );
      }

      match =
        text.match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(
              match[1]
            ),
            Number(
              match[2]
            ) -
            1,
            Number(
              match[3]
            )
          )
        );
      }

      const parsed =
        new Date(
          text
        );

      return Number.isNaN(
        parsed.getTime()
      )
        ? null
        : new Date(
            Date.UTC(
              parsed.getFullYear(),
              parsed.getMonth(),
              parsed.getDate()
            )
          );
    }

    function parseDateCell(
      cell
    ) {
      return (
        parseDateValue(
          cell?.v
        ) ||
        parseDateValue(
          cell?.f
        )
      );
    }

    function parseEstimatedDaysPerWeek(
      value
    ) {
      if (
        typeof value ===
        'number' &&
        Number.isFinite(
          value
        )
      ) {
        return clamp(
          value,
          0,
          5
        );
      }

      const text =
        cleanText(
          value
        );

      if (
        !text ||
        normaliseText(
          text
        ) ===
        'xxx'
      ) {
        return 5;
      }

      const values = [
        ...text.matchAll(
          /\d+(?:\.\d+)?/g
        )
      ]
        .map(
          match =>
            Number(
              match[0]
            )
        )
        .filter(
          number =>
            Number.isFinite(
              number
            ) &&
            number >=
            0 &&
            number <=
            7
        );

      if (
        !values.length
      ) {
        return 5;
      }

      const estimate =
        values.reduce(
          (
            total,
            number
          ) =>
            total +
            number,
          0
        ) /
        values.length;

      return clamp(
        estimate,
        0,
        5
      );
    }

    function normaliseRows(
      sourceRows
    ) {
      const result =
        [];

      sourceRows.forEach(
        sourceRow => {
          const cells =
            sourceRow?.c ||
            [];

          const repeatFlag =
            normaliseText(
              getCellText(
                cells[
                  CONFIG
                    .columns
                    .repeatFlag
                ]
              )
            );

          if (
            repeatFlag !==
            'no'
          ) {
            return;
          }

          const date =
            parseDateCell(
              cells[
                CONFIG
                  .columns
                  .date
              ]
            );

          if (!date) {
            return;
          }

          const fteCell =
            cells[
              CONFIG
                .columns
                .fteDays
            ];

          const fteDays =
            parseEstimatedDaysPerWeek(
              fteCell?.v ??
              fteCell?.f ??
              ''
            );

          result.push({
            x:
              date.getTime(),

            fteDays,

            fteWeight:
              fteDays /
              5
          });
        }
      );

      return result.sort(
        (
          first,
          second
        ) =>
          first.x -
          second.x
      );
    }

    function startOfUtcMonth(
      date
    ) {
      return new Date(
        Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth(),
          1
        )
      );
    }

    function addUtcMonths(
      date,
      months
    ) {
      return new Date(
        Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth() +
            months,
          1
        )
      );
    }

    function calculateAxisBounds(
      data
    ) {
      const xValues =
        data
          .map(
            row =>
              row.x
          )
          .filter(
            Number.isFinite
          );

      const minimumDate =
        new Date(
          Math.min(
            ...xValues
          )
        );

      const maximumDate =
        new Date(
          Math.max(
            ...xValues
          )
        );

      const firstMonth =
        startOfUtcMonth(
          minimumDate
        );

      const lastDataMonth =
        startOfUtcMonth(
          maximumDate
        );

      const monthAfterLast =
        addUtcMonths(
          lastDataMonth,
          1
        );

      return {
        xMin:
          firstMonth
            .getTime(),

        xMax:
          monthAfterLast
            .getTime(),

        firstDataTime:
          Math.min(
            ...xValues
          ),

        lastDataMonth:
          lastDataMonth
            .getTime()
      };
    }

    function buildMonthTicks(
      minimum,
      maximumDataMonth
    ) {
      const ticks =
        [];

      let month =
        startOfUtcMonth(
          new Date(
            minimum
          )
        );

      const finalMonth =
        startOfUtcMonth(
          new Date(
            maximumDataMonth
          )
        );

      while (
        month <=
        finalMonth
      ) {
        ticks.push({
          value:
            month.getTime()
        });

        month =
          addUtcMonths(
            month,
            1
          );
      }

      return ticks;
    }

    function buildMonthSequence() {
      return buildMonthTicks(
        axisBounds.xMin,
        axisBounds.lastDataMonth
      ).map(
        tick =>
          tick.value
      );
    }

    function getMonthTimestamp(
      timestamp
    ) {
      return startOfUtcMonth(
        new Date(
          timestamp
        )
      ).getTime();
    }

    function formatTooltipMonth(
      timestamp
    ) {
      return new Intl.DateTimeFormat(
        'en-AU',
        {
          month:
            'short',

          year:
            'numeric',

          timeZone:
            'UTC'
        }
      ).format(
        new Date(
          timestamp
        )
      );
    }

    function formatMonthShort(
      timestamp
    ) {
      return new Intl.DateTimeFormat(
        'en-AU',
        {
          month:
            'short',

          timeZone:
            'UTC'
        }
      ).format(
        new Date(
          timestamp
        )
      );
    }

    function formatQuarterRange(
      timestamp
    ) {
      const endMonth =
        new Date(
          timestamp
        );

      const startMonth =
        addUtcMonths(
          endMonth,
          -2
        );

      const abbreviatedYear =
        String(
          endMonth.getUTCFullYear()
        ).slice(
          -2
        );

      return (
        `${formatMonthShort(
          startMonth.getTime()
        )}–` +
        `${formatMonthShort(
          endMonth.getTime()
        )} quarter '` +
        abbreviatedYear
      );
    }

    function formatQuarterTick(
      timestamp
    ) {
      const date =
        new Date(
          timestamp
        );

      const month =
        date.getUTCMonth();

      return [
        0,
        3,
        6,
        9
      ].includes(
        month
      )
        ? `${month + 1}/${date.getUTCFullYear()}`
        : '';
    }

    function isQuarterTick(
      timestamp
    ) {
      const month =
        new Date(
          Number(
            timestamp
          )
        ).getUTCMonth();

      return [
        0,
        3,
        6,
        9
      ].includes(
        month
      );
    }

    function buildMonthlyCountSeries() {
      const counts =
        new Map();

      buildMonthSequence()
        .forEach(
          month =>
            counts.set(
              month,
              0
            )
        );

      rows.forEach(
        row => {
          const month =
            getMonthTimestamp(
              row.x
            );

          if (
            !counts.has(
              month
            )
          ) {
            return;
          }

          counts.set(
            month,
            counts.get(
              month
            ) +
            row.fteWeight
          );
        }
      );

      return [
        ...counts.entries()
      ].map(
        (
          [
            x,
            value
          ]
        ) => ({
          x,
          y:
            value,

          value,

          monthLabel:
            formatTooltipMonth(
              x
            )
        })
      );
    }

    function buildTrailingAverageSeries() {
      const now =
        Date.now();

      return buildMonthSequence()
        .map(
          monthTimestamp => {
            const monthStart =
              new Date(
                monthTimestamp
              );

            const monthEnd =
              addUtcMonths(
                monthStart,
                1
              ).getTime();

            const effectiveEnd =
              Math.min(
                monthEnd,
                now
              );

            const windowStart =
              effectiveEnd -
              TRAILING_WINDOW_MS;

            if (
              windowStart <
              axisBounds.firstDataTime
            ) {
              return {
                x:
                  monthTimestamp,

                y:
                  null,

                value:
                  null,

                quarterLabel:
                  formatQuarterRange(
                    monthTimestamp
                  )
              };
            }

            const windowCount =
              rows.reduce(
                (
                  total,
                  row
                ) =>
                  total +
                  (
                    row.x >=
                      windowStart &&
                    row.x <
                      effectiveEnd
                      ? row.fteWeight
                      : 0
                  ),
                0
              );

            const value =
              windowCount *
              AVERAGE_MONTH_DAYS /
              (
                CONFIG
                  .trailingWeeks *
                7
              );

            return {
              x:
                monthTimestamp,

              y:
                value,

              value,

              quarterLabel:
                formatQuarterRange(
                  monthTimestamp
                )
            };
          }
        );
    }

    function niceStep(
      value
    ) {
      if (
        !Number.isFinite(
          value
        ) ||
        value <=
        0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(
            value
          )
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        value /
        magnitude;

      if (
        fraction <=
        1
      ) {
        return magnitude;
      }

      if (
        fraction <=
        2
      ) {
        return (
          2 *
          magnitude
        );
      }

      if (
        fraction <=
        2.5
      ) {
        return (
          2.5 *
          magnitude
        );
      }

      if (
        fraction <=
        5
      ) {
        return (
          5 *
          magnitude
        );
      }

      return (
        10 *
        magnitude
      );
    }

    function calculateYAxis(
      monthly,
      trend
    ) {
      const values = [
        ...monthly,
        ...trend
      ]
        .map(
          point =>
            point?.value
        )
        .filter(
          Number.isFinite
        );

      const observedMaximum =
        Math.max(
          0.1,
          ...values
        );

      const paddedMaximum =
        observedMaximum *
        1.06;

      const majorStep =
        niceStep(
          paddedMaximum /
          6
        );

      const maximum =
        Math.max(
          majorStep *
          6,
          majorStep
        );

      return {
        min:
          0,

        max:
          maximum,

        majorStep
      };
    }

    function formatAxisNumber(
      value
    ) {
      const number =
        Number(
          value
        );

      if (
        !Number.isFinite(
          number
        )
      ) {
        return '';
      }

      return Number.isInteger(
        number
      )
        ? number.toLocaleString(
            'en-AU'
          )
        : number.toFixed(
            1
          );
    }

    function currentYAxisTracks() {
      const scale =
        yAxisModel;

      const count =
        Math.max(
          1,
          Math.round(
            (
              scale.max -
              scale.min
            ) /
            scale.majorStep
          )
        );

      return Array.from(
        {
          length:
            count +
            1
        },
        (
          _,
          index
        ) => {
          const value =
            scale.min +
            scale.majorStep *
            index;

          return {
            value,
            ratio:
              scale.max >
              scale.min
                ? (
                    value -
                    scale.min
                  ) /
                  (
                    scale.max -
                    scale.min
                  )
                : 0
          };
        }
      );
    }

    function currentXAxisTracks() {
      if (
        !axisBounds
      ) {
        return [];
      }

      const span =
        axisBounds.xMax -
        axisBounds.xMin;

      if (
        span <=
        0
      ) {
        return [];
      }

      return buildMonthTicks(
        axisBounds.xMin,
        axisBounds.lastDataMonth
      ).map(
        tick => ({
          value:
            tick.value,

          ratio:
            (
              tick.value -
              axisBounds.xMin
            ) /
            span,

          major:
            isQuarterTick(
              tick.value
            ),

          label:
            formatQuarterTick(
              tick.value
            )
        })
      );
    }

    function latestAnnualisedGrowth(
      trendSeries,
      years = 3
    ) {
      const requiredMonths =
        Math.max(
          2,
          Math.round(
            Number(years) *
            12
          )
        );

      const recent =
        trendSeries
          .filter(
            point =>
              Number.isFinite(
                point?.x
              ) &&
              Number.isFinite(
                point?.value
              ) &&
              point.value >
                0
          )
          .slice(
            -requiredMonths
          );

      if (
        recent.length <
        requiredMonths
      ) {
        return NaN;
      }

      const firstTime =
        recent[0].x;

      const points =
        recent
          .map(
            point => ({
              x:
                (
                  point.x -
                  firstTime
                ) /
                (
                  365.2425 *
                  DAY_MS
                ),

              y:
                Math.log(
                  point.value
                )
            })
          )
          .filter(
            point =>
              Number.isFinite(
                point.x
              ) &&
              Number.isFinite(
                point.y
              )
          );

      if (
        points.length <
        2
      ) {
        return NaN;
      }

      const slope =
        PFFCharts.linearSlope(
          points
        );

      return Number.isFinite(
        slope
      )
        ? Math.expm1(
            slope
          ) *
          100
        : NaN;
    }

    const sourceMilestonePlugin = {
      id:
        'sourceMilestonePlugin',

      afterDatasetsDraw(
        activeChart
      ) {
        const xScale =
          activeChart
            .scales
            .x;

        const area =
          activeChart
            .chartArea;

        if (
          !xScale ||
          !area
        ) {
          return;
        }

        const context =
          activeChart
            .ctx;

        const events = [
          {
            date:
              Date.UTC(
                2025,
                11,
                1
              ),

            label:
              'EssiLux jobs added'
          },
          {
            date:
              Date.UTC(
                2026,
                6,
                1
              ),

            label:
              'Indeed jobs added'
          }
        ];

        context.save();

        context.fillStyle =
          'rgba(105, 113, 138, 0.76)';

        context.font =
          '400 9px Lato, sans-serif';

        context.textAlign =
          'left';

        context.textBaseline =
          'top';

        context.fillText(
          'SEEK jobs only',
          area.left +
            4,
          area.top +
            5
        );

        events.forEach(
          event => {
            const x =
              xScale
                .getPixelForValue(
                  event.date
                );

            if (
              x <
                area.left ||
              x >
                area.right
            ) {
              return;
            }

            context.save();

            context.beginPath();

            context.setLineDash([
              4,
              4
            ]);

            context.strokeStyle =
              'rgba(105, 113, 138, 0.26)';

            context.lineWidth =
              1;

            context.moveTo(
              x,
              area.top
            );

            context.lineTo(
              x,
              area.bottom
            );

            context.stroke();

            context.setLineDash(
              []
            );

            context.translate(
              x +
                5,
              area.top +
                Math.min(
                  100,
                  area.height *
                    0.46
                )
            );

            context.rotate(
              -Math.PI /
              2
            );

            context.fillStyle =
              'rgba(105, 113, 138, 0.58)';

            context.font =
              '400 9px Lato, sans-serif';

            context.textAlign =
              'left';

            context.textBaseline =
              'middle';

            context.fillText(
              event.label,
              0,
              0
            );

            context.restore();
          }
        );

        context.restore();
      }
    };

    const demandAxesPlugin = {
      id:
        'demandAxesPlugin',

      beforeDatasetsDraw(
        activeChart
      ) {
        const {
          ctx,
          chartArea
        } = activeChart;

        if (
          !chartArea
        ) {
          return;
        }

        const yTracks =
          currentYAxisTracks();

        ctx.save();

        yTracks.forEach(
          track => {
            if (
              track.ratio <=
              0.001
            ) {
              return;
            }

            const y =
              chartArea.bottom -
              chartArea.height *
              track.ratio;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              Math.round(
                y
              ) +
              0.5
            );
            ctx.lineTo(
              chartArea.right,
              Math.round(
                y
              ) +
              0.5
            );
            ctx.strokeStyle =
              'rgba(105, 113, 138, 0.075)';
            ctx.lineWidth =
              1;
            ctx.stroke();
          }
        );

        for (
          let index =
            0;
          index <
            yTracks.length -
            1;
          index +=
            1
        ) {
          const ratio =
            (
              yTracks[index].ratio +
              yTracks[index + 1].ratio
            ) /
            2;

          const y =
            chartArea.bottom -
            chartArea.height *
            ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(
              y
            ) +
            0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(
              y
            ) +
            0.5
          );
          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.035)';
          ctx.lineWidth =
            0.7;
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(
        activeChart
      ) {
        const {
          ctx,
          chartArea
        } = activeChart;

        if (
          !chartArea
        ) {
          return;
        }

        const mobile =
          window.innerWidth <=
          430;

        const yTracks =
          currentYAxisTracks();

        const xTracks =
          currentXAxisTracks();

        ctx.save();
        ctx.lineCap =
          'butt';

        ctx.strokeStyle =
          '#151515';
        ctx.lineWidth =
          1;
        ctx.fillStyle =
          '#151515';
        ctx.textAlign =
          'right';
        ctx.textBaseline =
          'middle';
        ctx.font =
          '12px Lato, sans-serif';

        yTracks.forEach(
          track => {
            const y =
              chartArea.bottom -
              chartArea.height *
              track.ratio;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              Math.round(
                y
              ) +
              0.5
            );
            ctx.lineTo(
              chartArea.left -
              5,
              Math.round(
                y
              ) +
              0.5
            );
            ctx.stroke();
            ctx.fillText(
              formatAxisNumber(
                track.value
              ),
              chartArea.left -
              8,
              y
            );
          }
        );

        ctx.strokeStyle =
          '#69718a';
        ctx.globalAlpha =
          0.60;
        ctx.lineWidth =
          0.7;

        for (
          let index =
            0;
          index <
            yTracks.length -
            1;
          index +=
            1
        ) {
          const ratio =
            (
              yTracks[index].ratio +
              yTracks[index + 1].ratio
            ) /
            2;

          const y =
            chartArea.bottom -
            chartArea.height *
            ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(
              y
            ) +
            0.5
          );
          ctx.lineTo(
            chartArea.left -
            2,
            Math.round(
              y
            ) +
            0.5
          );
          ctx.stroke();
        }

        xTracks.forEach(
          track => {
            const x =
              chartArea.left +
              chartArea.width *
              track.ratio;

            ctx.save();
            ctx.globalAlpha =
              1;
            ctx.strokeStyle =
              track.major
                ? '#151515'
                : '#69718a';
            ctx.lineWidth =
              track.major
                ? 1
                : 0.7;
            ctx.beginPath();
            ctx.moveTo(
              Math.round(
                x
              ) +
              0.5,
              chartArea.bottom
            );
            ctx.lineTo(
              Math.round(
                x
              ) +
              0.5,
              chartArea.bottom +
              (
                track.major
                  ? 5
                  : 2
              )
            );
            ctx.stroke();

            if (
              track.major &&
              track.label
            ) {
              ctx.fillStyle =
                '#151515';
              ctx.font =
                `${mobile ? 9 : 10}px Lato, sans-serif`;
              ctx.textBaseline =
                'top';

              let labelX =
                x;

              if (
                track.ratio <=
                0.001
              ) {
                ctx.textAlign =
                  'left';
                labelX =
                  x +
                  2;
              } else if (
                track.ratio >=
                0.999
              ) {
                ctx.textAlign =
                  'right';
                labelX =
                  x -
                  2;
              } else {
                ctx.textAlign =
                  'center';
              }

              ctx.fillText(
                track.label,
                labelX,
                chartArea.bottom +
                8
              );
            }

            ctx.restore();
          }
        );

        ctx.restore();
      }
    };

    const paTrendLabelPlugin = {
      id:
        'paTrendLabelPlugin',

      afterDatasetsDraw(
        activeChart
      ) {
        if (
          trendMode ===
          'off'
        ) {
          return;
        }

        const dataset =
          activeChart
            .data
            .datasets?.[1];

        const meta =
          activeChart
            .getDatasetMeta(
              1
            );

        if (
          !dataset ||
          !meta?.data?.length ||
          meta.hidden
        ) {
          return;
        }

        const growth =
          latestAnnualisedGrowth(
            dataset.data,
            trendWindowYears()
          );

        if (
          !Number.isFinite(
            growth
          )
        ) {
          return;
        }

        let anchorIndex =
          -1;

        for (
          let index =
            dataset.data.length -
            1;
          index >=
            0;
          index -=
            1
        ) {
          if (
            Number.isFinite(
              dataset.data[index]?.y
            ) &&
            Number.isFinite(
              meta.data[index]?.x
            ) &&
            Number.isFinite(
              meta.data[index]?.y
            )
          ) {
            anchorIndex =
              index;
            break;
          }
        }

        if (
          anchorIndex <
          0
        ) {
          return;
        }

        const {
          ctx,
          chartArea
        } = activeChart;

        const point =
          meta.data[
            anchorIndex
          ];

        const mobile =
          window.innerWidth <=
          430;

        const fontSize =
          mobile
            ? 8.2
            : 9.1;

        const labelHeight =
          mobile
            ? 14
            : 15;

        const paddingX =
          mobile
            ? 4
            : 5;

        const arrowGap =
          mobile
            ? 2.5
            : 3;

        const isIncrease =
          growth >
          0.05;

        const isDecrease =
          growth <
          -0.05;

        const arrow =
          isIncrease
            ? '↑'
            : isDecrease
              ? '↓'
              : '';

        const valueText =
          `${Math.abs(growth).toFixed(1)}% p.a.`;

        ctx.save();
        ctx.font =
          `700 ${fontSize}px Lato, sans-serif`;
        ctx.textBaseline =
          'middle';

        const arrowWidth =
          arrow
            ? ctx.measureText(
                arrow
              ).width
            : 0;

        const valueWidth =
          ctx.measureText(
            valueText
          ).width;

        const labelWidth =
          paddingX *
          2 +
          arrowWidth +
          (
            arrow
              ? arrowGap
              : 0
          ) +
          valueWidth;

        const labelRight =
          clamp(
            chartArea.right -
            4,
            chartArea.left +
            labelWidth +
            5,
            chartArea.right -
            4
          );

        const labelLeft =
          labelRight -
          labelWidth;

        const labelY =
          clamp(
            point.y,
            chartArea.top +
            labelHeight /
            2,
            chartArea.bottom -
            labelHeight /
            2
          );

        const targetX =
          point.x <
          labelLeft
            ? labelLeft
            : point.x >
                labelRight
              ? labelRight
              : clamp(
                  point.x,
                  labelLeft,
                  labelRight
                );

        const displaced =
          Math.abs(
            targetX -
            point.x
          ) >
            7 ||
          Math.abs(
            labelY -
            point.y
          ) >
            2 ||
          labelLeft <
            point.x -
            4;

        if (
          displaced
        ) {
          ctx.beginPath();
          ctx.moveTo(
            point.x,
            point.y
          );
          ctx.lineTo(
            targetX,
            labelY
          );
          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.58)';
          ctx.lineWidth =
            0.8;
          ctx.stroke();
        }

        const radius =
          3;

        const top =
          labelY -
          labelHeight /
          2;

        const bottom =
          labelY +
          labelHeight /
          2;

        ctx.beginPath();
        ctx.moveTo(
          labelLeft +
          radius,
          top
        );
        ctx.lineTo(
          labelRight -
          radius,
          top
        );
        ctx.quadraticCurveTo(
          labelRight,
          top,
          labelRight,
          top +
          radius
        );
        ctx.lineTo(
          labelRight,
          bottom -
          radius
        );
        ctx.quadraticCurveTo(
          labelRight,
          bottom,
          labelRight -
          radius,
          bottom
        );
        ctx.lineTo(
          labelLeft +
          radius,
          bottom
        );
        ctx.quadraticCurveTo(
          labelLeft,
          bottom,
          labelLeft,
          bottom -
          radius
        );
        ctx.lineTo(
          labelLeft,
          top +
          radius
        );
        ctx.quadraticCurveTo(
          labelLeft,
          top,
          labelLeft +
          radius,
          top
        );
        ctx.closePath();

        ctx.fillStyle =
          'rgba(252, 243, 214, 0.84)';
        ctx.fill();

        ctx.strokeStyle =
          rgba(
            '#f1c232',
            0.42
          );
        ctx.lineWidth =
          0.65;
        ctx.stroke();

        let textX =
          labelLeft +
          paddingX;

        ctx.textAlign =
          'left';

        ctx.fillStyle =
          isIncrease
            ? '#14823b'
            : isDecrease
              ? '#b42318'
              : '#69718a';

        if (
          arrow
        ) {
          ctx.fillText(
            arrow,
            textX,
            labelY -
            0.2
          );

          textX +=
            arrowWidth +
            arrowGap;
        }

        ctx.fillText(
          valueText,
          textX,
          labelY
        );

        ctx.restore();
      }
    };

    const axisSpinesPlugin =
      PFFCharts.createAxisSpinesPlugin({
        id:
          'labourDemandAxisSpines'
      });

    function trendWindowYears() {
      return trendMode ===
        '10yr'
        ? 10
        : 3;
    }

    function trendVisible() {
      return trendMode !==
        'off';
    }

    function setTrendLegendVisibility(
      shouldShow,
      animate = true
    ) {
      const token =
        ++trendLegendAnimationToken;

      trendLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      if (
        !animate ||
        PFF.reducedMotion() ||
        !trendLegend.animate
      ) {
        trendLegend.hidden =
          !shouldShow;
        trendLegend.style.opacity =
          '';
        trendLegend.style.transform =
          '';
        return;
      }

      if (shouldShow) {
        trendLegend.hidden =
          false;

        const animation =
          trendLegend.animate(
            [
              {
                opacity: 0,
                transform: 'scaleX(0.96)'
              },
              {
                opacity: 1,
                transform: 'scaleX(1)'
              }
            ],
            {
              duration:
                PFF.defaults.microTransitionMs,
              easing:
                'ease-out',
              fill:
                'both'
            }
          );

        animation.finished
          .catch(() => {})
          .then(() => {
            if (
              token ===
              trendLegendAnimationToken
            ) {
              trendLegend.style.opacity =
                '';
              trendLegend.style.transform =
                '';
            }
          });

        return;
      }

      const animation =
        trendLegend.animate(
          [
            {
              opacity: 1,
              transform: 'scaleX(1)'
            },
            {
              opacity: 0,
              transform: 'scaleX(0.96)'
            }
          ],
          {
            duration:
              PFF.defaults.microTransitionMs,
            easing:
              'ease-out',
            fill:
              'both'
          }
        );

      animation.finished
        .catch(() => {})
        .then(() => {
          if (
            token ===
            trendLegendAnimationToken
          ) {
            trendLegend.hidden =
              true;
            trendLegend.style.opacity =
              '';
            trendLegend.style.transform =
              '';
          }
        });
    }

    function tooltipTitle(
      items
    ) {
      const raw =
        items?.[0]
          ?.raw;

      if (
        !Number.isFinite(
          raw?.x
        )
      ) {
        return '';
      }

      return (
        items?.[0]
          ?.dataset
          ?.datasetRole ===
        'trend'
          ? raw.quarterLabel
          : raw.monthLabel
      );
    }

    function tooltipLabel(
      context
    ) {
      const value =
        Number(
          context
            .raw
            ?.value
        );

      if (
        !Number.isFinite(
          value
        )
      ) {
        return '';
      }

      if (
        context
          .dataset
          .datasetRole !==
        'trend'
      ) {
        return `${value.toFixed(1)} FTE ads`;
      }

      const valueText =
        `${value.toFixed(1)} FTE ads/month`;

      const growth =
        latestAnnualisedGrowth(
          context.dataset.data,
          trendWindowYears()
        );

      if (
        !trendVisible() ||
        !Number.isFinite(
          growth
        )
      ) {
        return valueText;
      }

      const sign =
        growth > 0
          ? '+'
          : growth < 0
            ? '−'
            : '';

      return `${valueText} · ${sign}${Math.abs(growth).toFixed(1)}% p.a.`;
    }

    function createChart() {
      const monthly =
        buildMonthlyCountSeries();

      const trend =
        buildTrailingAverageSeries();

      yAxisModel =
        calculateYAxis(
          monthly,
          trend
        );

      const mobile =
        PFF.mobileLayout();

      const monthlyDataset = {
        type:
          'scatter',

        label:
          'Monthly FTE job ads',

        datasetRole:
          'monthly',

        data:
          monthly,

        parsing:
          false,

        showLine:
          false,

        order:
          1,

        pointStyle:
          'rect',

        pointRadius:
          CONFIG.pointRadius,

        pointHoverRadius:
          CONFIG.pointHoverRadius,

        pointHitRadius:
          mobile
            ? 9
            : 5,

        pointBackgroundColor:
          rgba(
            '#6600ff',
            0.22
          ),

        pointHoverBackgroundColor:
          rgba(
            '#6600ff',
            0.72
          ),

        pointBorderColor:
          rgba(
            '#6600ff',
            0.46
          ),

        pointHoverBorderColor:
          '#6600ff',

        pointBorderWidth:
          0.55,

        pointHoverBorderWidth:
          1
      };

      const trendDataset =
        PFFCharts.lineDataset({
          label:
            '13-week trailing average',

          datasetRole:
            'trend',

          data:
            trend,

          parsing:
            false,

          order:
            10,

          borderColor:
            '#f1c232',

          backgroundColor:
            '#f1c232',

          borderWidth:
            CONFIG.trendWidth,

          borderCapStyle:
            'round',

          borderJoinStyle:
            'round',

          pointRadius:
            0,

          pointHoverRadius:
            0,

          pointHitRadius:
            mobile
              ? 9
              : 5,

          tension:
            0.28,

          cubicInterpolationMode:
            'monotone'
        });

      const options =
        PFFCharts.baseChartOptions({
          plugins: {
            tooltip:
              PFFCharts.tooltipOptions({
                callbacks: {
                  title:
                    tooltipTitle,
                  label:
                    tooltipLabel
                }
              })
          },

          scales: {
            x: {
              type:
                'linear',

              min:
                axisBounds.xMin,

              max:
                axisBounds.xMax,

              bounds:
                'data',

              afterFit(
                scaleObject
              ) {
                scaleObject.height =
                  PFF.mobileLayout()
                    ? 43
                    : 46;
              },

              border: {
                display:
                  false
              },

              grid: {
                display:
                  false,
                drawTicks:
                  false
              },

              ticks: {
                display:
                  false
              },

              title: {
                display:
                  true,

                text:
                  'Date advertised',

                color:
                  '#151515',

                padding: {
                  top:
                    PFF.mobileLayout()
                      ? 21
                      : 22
                },

                font: {
                  family:
                    'Lato',

                  size:
                    PFF.mobileLayout()
                      ? 12
                      : 13,

                  weight:
                    '700'
                }
              }
            },

            y: {
              min:
                yAxisModel.min,

              max:
                yAxisModel.max,

              afterFit(
                scaleObject
              ) {
                scaleObject.width =
                  PFF.mobileLayout()
                    ? PFF.defaults.yAxisMobileWidth
                    : PFF.defaults.yAxisDesktopWidth;
              },

              border: {
                display:
                  false
              },

              grid: {
                display:
                  false,
                drawTicks:
                  false
              },

              ticks: {
                display:
                  false
              },

              title: {
                display:
                  true,

                text:
                  'FTE job ads/month',

                color:
                  '#151515',

                padding: {
                  bottom:
                    4
                },

                font: {
                  family:
                    'Lato',

                  size:
                    PFF.mobileLayout()
                      ? 12
                      : 13,

                  weight:
                    '700'
                }
              }
            }
          }
        });

      chart =
        new Chart(
          chartCanvas.getContext(
            '2d'
          ),
          {
            data: {
              datasets: [
                monthlyDataset,
                trendDataset
              ]
            },
            options
          }
        );
    }

    function applyTrendMode(
      mode,
      animateLegend = true
    ) {
      trendMode =
        mode;

      const visible =
        trendVisible();

      setTrendLegendVisibility(
        visible,
        animateLegend
      );

      if (!chart) {
        return;
      }

      chart.setDatasetVisibility(
        1,
        visible
      );

      const duration =
        PFFCharts.chartAnimationDuration();

      chart.options.animation.duration =
        duration;
      chart.options.animations.x.duration =
        duration;
      chart.options.animations.y.duration =
        duration;

      chart.update(
        duration > 0
          ? undefined
          : 'none'
      );
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(
            raw
          );

        if (
          Array.isArray(
            parsed
          ) &&
          parsed.length
        ) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            parsed
          );
        }
      } catch (_) {
      }
    }

    function parseRemoteRows(
      snapshot
    ) {
      return (
        Array.isArray(
          snapshot?.data?.labourDemandRows
        )
          ? snapshot.data.labourDemandRows
          : []
      )
        .map(
          row => ({
            x:
              Number(
                row?.[0]
              ),

            fteWeight:
              Number(
                row?.[1]
              )
          })
        )
        .filter(
          row =>
            Number.isFinite(
              row.x
            ) &&
            Number.isFinite(
              row.fteWeight
            )
        )
        .sort(
          (
            first,
            second
          ) =>
            first.x -
            second.x
        );
    }

    migrateLegacyLocalCache();

    Chart.register(
      demandAxesPlugin,
      axisSpinesPlugin,
      sourceMilestonePlugin,
      paTrendLabelPlugin
    );

    chartCanvas.addEventListener(
      'contextmenu',
      event =>
        event.preventDefault()
    );

    chartCanvas.addEventListener(
      'selectstart',
      event =>
        event.preventDefault()
    );

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      loadLive() {
        return PFFCharts.loadGVizSheet({
          sheetId:
            CONFIG.jobSheetId,
          sheetName:
            CONFIG.jobSheetName,
          range:
            CONFIG.jobRange,
          headers:
            '0',
          timeoutMs:
            CONFIG.fetchTimeoutMs
        });
      },

      parseLive(
        table
      ) {
        return normaliseRows(
          table?.rows ||
          []
        );
      },

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,
          appKey:
            CACHE_APP_KEY,
          timeoutMs:
            CONFIG.cacheFetchTimeoutMs
        });
      },

      parseRemoteCache:
        parseRemoteRows,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        1,

      onLiveError(
        error
      ) {
        console.warn(
          'Live labour demand data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(
        error
      ) {
        console.warn(
          'Apps Script labour demand cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,
        text:
          dataSourceText
      },

      render(
        loaded
      ) {
        rows =
          loaded.rows;

        axisBounds =
          calculateAxisBounds(
            rows
          );

        createChart();

        PFFCharts.createResponsiveController({
          getChart() {
            return chart;
          },
          observe: [
            app,
            chartCanvas
          ]
        });

        return chart;
      },

      errorMessage:
        'Labour demand data unavailable.'
    });
  </script>
