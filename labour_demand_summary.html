<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Optometry Labour Demand</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --trend-yellow: #f1c232;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      display: flex;
      width: min(calc(100% - 12px), 520px);
      max-width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      margin-inline: auto;
      padding: 0 4px;
      overflow: hidden;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0%, 100% { opacity: 0; }
      12%, 76% { opacity: 1; }
      87% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0%, 20%, 100% { opacity: 0; }
      32%, 76% { opacity: 1; }
      87% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0%, 40%, 100% { opacity: 0; }
      52%, 76% { opacity: 1; }
      87% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0%, 100% { opacity: 0.45; }
      52%, 76% { opacity: 0.78; }
      87% { opacity: 0.45; }
    }

    /* ---------- Module label + live status ---------- */

    .module-top {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .module-label {
      position: relative;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--purple);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .module-label::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: var(--purple);
      pointer-events: none;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
      transition: background-color 220ms ease;
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    /* ---------- Heading + trend control ---------- */

    .chart-heading-row {
      position: relative;
      z-index: 30;
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 30px;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
      margin: 0;
    }

    .chart-heading {
      display: inline-block;
      width: max-content;
      min-width: max-content;
      margin: 0;
      padding: 4px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
      will-change: opacity;
    }

    .trend-toggle {
      display: grid;
      width: 78px;
      height: 27px;
      flex: 0 0 78px;
      grid-template-columns: 15px max-content 1fr;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      padding: 0 5px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .trend-toggle > * {
      pointer-events: none;
    }

    .trend-toggle:hover {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .trend-toggle.is-on {
      border-color: var(--purple);
    }

    .trend-toggle:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .trend-indicator {
      position: relative;
      width: 15px;
      height: 15px;
      min-width: 15px;
      max-width: 15px;
      border: 1px solid var(--muted);
      border-radius: 2px;
      background: #fff;
    }

    .trend-toggle.is-on .trend-indicator {
      border-color: var(--purple);
      background: var(--purple);
    }

    .trend-toggle.is-on .trend-indicator::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .trend-toggle-label,
    .trend-toggle-value {
      font-size: 8.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .trend-toggle-label {
      color: var(--ink);
    }

    .trend-toggle-value {
      display: block;
      width: 100%;
      min-width: 0;
      color: var(--muted);
      letter-spacing: 0.025em;
      text-align: center;
    }

    .trend-toggle.is-on .trend-toggle-value {
      color: var(--purple);
    }

    /* ---------- Legend ---------- */

    .chart-options-row {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 0 2px;
    }

    .chart-legend {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 28px;
      align-items: center;
      gap: 10px;
      padding: 1px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .chart-legend::-webkit-scrollbar {
      display: none;
    }

    .legend-item {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .legend-square {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      background: rgba(102, 0, 255, 0.24);
      border: 1px solid rgba(102, 0, 255, 0.46);
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 17px;
      border-radius: 2px;
      background: var(--trend-yellow);
    }

    .trend-legend {
      transform-origin: left center;
      will-change: opacity, transform;
    }

    .trend-legend[hidden] {
      display: none;
    }

    /* ---------- Chart ---------- */

    .chart-shell {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: -3px 0 0;
      overflow: hidden;
      contain: layout paint;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #demandChart {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    #status {
      position: absolute;
      inset: 0;
      z-index: 101;
      display: flex;
      width: 100%;
      margin: 0;
      padding: 0 8px;
      align-items: center;
      justify-content: center;
      color: var(--error);
      background: #fff;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    #status:empty {
      display: none;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 0 3px;
      }

      .cone-loader {
        width: 160px;
        height: 70px;
      }

      .cone {
        width: 52px;
        height: 61px;
      }

      .cone.blue {
        left: 30px;
      }

      .cone.green {
        left: 64px;
      }

      .cone.red {
        left: 78px;
      }

      .loader-text {
        font-size: 10px;
      }

      .module-label {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        min-height: 29px;
      }

      .chart-heading {
        font-size: 14px;
      }

      .trend-toggle {
        width: 74px;
        flex-basis: 74px;
        padding-right: 4px;
        padding-left: 4px;
      }

      .trend-toggle-label,
      .trend-toggle-value {
        font-size: 8px;
      }

      .legend-item {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading optometry labour demand data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading optometry labour demand data…</p>
      </div>

      <div class="module-top">
        <div class="module-label">Labour demand</div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div class="chart-heading-row">
        <h2 class="chart-heading">FTE job ads</h2>

        <button
          id="trendToggle"
          class="trend-toggle is-on"
          type="button"
          aria-pressed="true"
          aria-label="Trend line on"
        >
          <span class="trend-indicator" aria-hidden="true"></span>
          <span class="trend-toggle-label">Trend</span>
          <span id="trendToggleValue" class="trend-toggle-value">ON</span>
        </button>
      </div>

      <div class="chart-options-row">
        <div class="chart-legend" aria-label="Chart legend">
          <span class="legend-item">
            <span class="legend-square" aria-hidden="true"></span>
            <span>Monthly FTE job ads</span>
          </span>

          <span id="trendLegend" class="legend-item trend-legend">
            <span class="legend-line" aria-hidden="true"></span>
            <span>13-week trailing average</span>
          </span>
        </div>
      </div>

      <div class="chart-shell">
        <canvas
          id="demandChart"
          aria-label="Australian optometry labour demand chart"
          role="img"
        ></canvas>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>
    </main>
  </div>

  <script>
    'use strict';

    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.color = '#151515';

    const CONFIG = {
      jobSheetId:
        '1ZcZrPHvux_ckk2cJqRYu1oz9uT4brcRmcJ80bP-v--4',

      jobSheetGid:
        '1641593359',

      jobSheetName:
        'Mirror table',

      jobRange:
        'B3:V',

      fetchTimeoutMs:
        20000,

      cacheFetchTimeoutMs:
        10000,

      localCacheKey:
        'pff-labour-demand-fte-job-ads-v1',

      trailingWeeks:
        13,

      pointRadius:
        2.7,

      pointHoverRadius:
        4.4,

      trendWidth:
        3,

      columns: {
        repeatFlag: 0,
        date: 2,
        fteDays: 11
      }
    };

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'pff-job-ads-data';

    const FORCE_CACHED_DATA =
      false;

    const DAY_MS =
      24 * 60 * 60 * 1000;

    const AVERAGE_MONTH_DAYS =
      365.2425 / 12;

    const TRAILING_WINDOW_MS =
      CONFIG.trailingWeeks *
      7 *
      DAY_MS;

    const app =
      document.getElementById(
        'app'
      );

    const loadingState =
      document.getElementById(
        'loadingState'
      );

    const dataSourceIndicator =
      document.getElementById(
        'dataSourceIndicator'
      );

    const dataSourceText =
      document.getElementById(
        'dataSourceText'
      );

    const trendToggle =
      document.getElementById(
        'trendToggle'
      );

    const trendToggleValue =
      document.getElementById(
        'trendToggleValue'
      );

    const trendLegend =
      document.getElementById(
        'trendLegend'
      );

    const statusElement =
      document.getElementById(
        'status'
      );

    const chartCanvas =
      document.getElementById(
        'demandChart'
      );

    let rows =
      [];

    let chart =
      null;

    let trendOn =
      true;

    let axisBounds =
      null;

    let yAxisModel = {
      min: 0,
      max: 1,
      majorStep: 1
    };

    let trendLegendAnimationToken =
      0;

    function reducedMotion() {
      return window
        .matchMedia(
          '(prefers-reduced-motion: reduce)'
        )
        .matches;
    }

    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.max(
        minimum,
        Math.min(
          maximum,
          value
        )
      );
    }

    function cleanText(
      value
    ) {
      return String(
        value ??
        ''
      )
        .replace(
          /\u00a0/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }

    function normaliseText(
      value
    ) {
      return cleanText(
        value
      ).toLowerCase();
    }

    function getCellText(
      cell
    ) {
      return cleanText(
        cell?.f ??
        cell?.v ??
        ''
      );
    }

    function parseDateValue(
      value
    ) {
      if (
        value instanceof
        Date
      ) {
        return Number.isNaN(
          value.getTime()
        )
          ? null
          : new Date(
              Date.UTC(
                value.getFullYear(),
                value.getMonth(),
                value.getDate()
              )
            );
      }

      if (
        typeof value ===
        'number' &&
        Number.isFinite(
          value
        )
      ) {
        const googleEpoch =
          Date.UTC(
            1899,
            11,
            30
          );

        const date =
          new Date(
            googleEpoch +
            value *
            DAY_MS
          );

        return Number.isNaN(
          date.getTime()
        )
          ? null
          : date;
      }

      const text =
        cleanText(
          value
        );

      if (!text) {
        return null;
      }

      let match =
        text.match(
          /^Date\((\d+),(\d+),(\d+)\)$/
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(
              match[1]
            ),
            Number(
              match[2]
            ),
            Number(
              match[3]
            )
          )
        );
      }

      match =
        text.match(
          /^(\d{1,2})[/-](\d{1,2})[/-](\d{2}|\d{4})$/
        );

      if (match) {
        let year =
          Number(
            match[3]
          );

        if (
          year <
          100
        ) {
          year +=
            2000;
        }

        return new Date(
          Date.UTC(
            year,
            Number(
              match[2]
            ) -
            1,
            Number(
              match[1]
            )
          )
        );
      }

      match =
        text.match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(
              match[1]
            ),
            Number(
              match[2]
            ) -
            1,
            Number(
              match[3]
            )
          )
        );
      }

      const parsed =
        new Date(
          text
        );

      return Number.isNaN(
        parsed.getTime()
      )
        ? null
        : new Date(
            Date.UTC(
              parsed.getFullYear(),
              parsed.getMonth(),
              parsed.getDate()
            )
          );
    }

    function parseDateCell(
      cell
    ) {
      return (
        parseDateValue(
          cell?.v
        ) ||
        parseDateValue(
          cell?.f
        )
      );
    }

    function parseEstimatedDaysPerWeek(
      value
    ) {
      if (
        typeof value ===
        'number' &&
        Number.isFinite(
          value
        )
      ) {
        return clamp(
          value,
          0,
          5
        );
      }

      const text =
        cleanText(
          value
        );

      if (
        !text ||
        normaliseText(
          text
        ) ===
        'xxx'
      ) {
        return 5;
      }

      const values = [
        ...text.matchAll(
          /\d+(?:\.\d+)?/g
        )
      ]
        .map(
          match =>
            Number(
              match[0]
            )
        )
        .filter(
          number =>
            Number.isFinite(
              number
            ) &&
            number >=
            0 &&
            number <=
            7
        );

      if (
        !values.length
      ) {
        return 5;
      }

      const estimate =
        values.reduce(
          (
            total,
            number
          ) =>
            total +
            number,
          0
        ) /
        values.length;

      return clamp(
        estimate,
        0,
        5
      );
    }

    function normaliseRows(
      sourceRows
    ) {
      const result =
        [];

      sourceRows.forEach(
        sourceRow => {
          const cells =
            sourceRow?.c ||
            [];

          const repeatFlag =
            normaliseText(
              getCellText(
                cells[
                  CONFIG
                    .columns
                    .repeatFlag
                ]
              )
            );

          if (
            repeatFlag !==
            'no'
          ) {
            return;
          }

          const date =
            parseDateCell(
              cells[
                CONFIG
                  .columns
                  .date
              ]
            );

          if (!date) {
            return;
          }

          const fteCell =
            cells[
              CONFIG
                .columns
                .fteDays
            ];

          const fteDays =
            parseEstimatedDaysPerWeek(
              fteCell?.v ??
              fteCell?.f ??
              ''
            );

          result.push({
            x:
              date.getTime(),

            fteDays,

            fteWeight:
              fteDays /
              5
          });
        }
      );

      return result.sort(
        (
          first,
          second
        ) =>
          first.x -
          second.x
      );
    }

    function startOfUtcMonth(
      date
    ) {
      return new Date(
        Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth(),
          1
        )
      );
    }

    function addUtcMonths(
      date,
      months
    ) {
      return new Date(
        Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth() +
            months,
          1
        )
      );
    }

    function calculateAxisBounds(
      data
    ) {
      const xValues =
        data
          .map(
            row =>
              row.x
          )
          .filter(
            Number.isFinite
          );

      const minimumDate =
        new Date(
          Math.min(
            ...xValues
          )
        );

      const maximumDate =
        new Date(
          Math.max(
            ...xValues
          )
        );

      const firstMonth =
        startOfUtcMonth(
          minimumDate
        );

      const lastDataMonth =
        startOfUtcMonth(
          maximumDate
        );

      const monthAfterLast =
        addUtcMonths(
          lastDataMonth,
          1
        );

      return {
        xMin:
          firstMonth
            .getTime(),

        xMax:
          monthAfterLast
            .getTime(),

        firstDataTime:
          Math.min(
            ...xValues
          ),

        lastDataMonth:
          lastDataMonth
            .getTime()
      };
    }

    function buildMonthTicks(
      minimum,
      maximumDataMonth
    ) {
      const ticks =
        [];

      let month =
        startOfUtcMonth(
          new Date(
            minimum
          )
        );

      const finalMonth =
        startOfUtcMonth(
          new Date(
            maximumDataMonth
          )
        );

      while (
        month <=
        finalMonth
      ) {
        ticks.push({
          value:
            month.getTime()
        });

        month =
          addUtcMonths(
            month,
            1
          );
      }

      return ticks;
    }

    function buildMonthSequence() {
      return buildMonthTicks(
        axisBounds.xMin,
        axisBounds.lastDataMonth
      ).map(
        tick =>
          tick.value
      );
    }

    function getMonthTimestamp(
      timestamp
    ) {
      return startOfUtcMonth(
        new Date(
          timestamp
        )
      ).getTime();
    }

    function formatTooltipMonth(
      timestamp
    ) {
      return new Intl.DateTimeFormat(
        'en-AU',
        {
          month:
            'short',

          year:
            'numeric',

          timeZone:
            'UTC'
        }
      ).format(
        new Date(
          timestamp
        )
      );
    }

    function formatMonthShort(
      timestamp
    ) {
      return new Intl.DateTimeFormat(
        'en-AU',
        {
          month:
            'short',

          timeZone:
            'UTC'
        }
      ).format(
        new Date(
          timestamp
        )
      );
    }

    function formatQuarterRange(
      timestamp
    ) {
      const endMonth =
        new Date(
          timestamp
        );

      const startMonth =
        addUtcMonths(
          endMonth,
          -2
        );

      const abbreviatedYear =
        String(
          endMonth.getUTCFullYear()
        ).slice(
          -2
        );

      return (
        `${formatMonthShort(
          startMonth.getTime()
        )}–` +
        `${formatMonthShort(
          endMonth.getTime()
        )} quarter '` +
        abbreviatedYear
      );
    }

    function formatQuarterTick(
      timestamp
    ) {
      const date =
        new Date(
          timestamp
        );

      const month =
        date.getUTCMonth();

      return [
        0,
        3,
        6,
        9
      ].includes(
        month
      )
        ? `${month + 1}/${date.getUTCFullYear()}`
        : '';
    }

    function isQuarterTick(
      timestamp
    ) {
      const month =
        new Date(
          Number(
            timestamp
          )
        ).getUTCMonth();

      return [
        0,
        3,
        6,
        9
      ].includes(
        month
      );
    }

    function buildMonthlyCountSeries() {
      const counts =
        new Map();

      buildMonthSequence()
        .forEach(
          month =>
            counts.set(
              month,
              0
            )
        );

      rows.forEach(
        row => {
          const month =
            getMonthTimestamp(
              row.x
            );

          if (
            !counts.has(
              month
            )
          ) {
            return;
          }

          counts.set(
            month,
            counts.get(
              month
            ) +
            row.fteWeight
          );
        }
      );

      return [
        ...counts.entries()
      ].map(
        (
          [
            x,
            value
          ]
        ) => ({
          x,
          y:
            value,

          value,

          monthLabel:
            formatTooltipMonth(
              x
            )
        })
      );
    }

    function buildTrailingAverageSeries() {
      const now =
        Date.now();

      return buildMonthSequence()
        .map(
          monthTimestamp => {
            const monthStart =
              new Date(
                monthTimestamp
              );

            const monthEnd =
              addUtcMonths(
                monthStart,
                1
              ).getTime();

            const effectiveEnd =
              Math.min(
                monthEnd,
                now
              );

            const windowStart =
              effectiveEnd -
              TRAILING_WINDOW_MS;

            if (
              windowStart <
              axisBounds.firstDataTime
            ) {
              return {
                x:
                  monthTimestamp,

                y:
                  null,

                value:
                  null,

                quarterLabel:
                  formatQuarterRange(
                    monthTimestamp
                  )
              };
            }

            const windowCount =
              rows.reduce(
                (
                  total,
                  row
                ) =>
                  total +
                  (
                    row.x >=
                      windowStart &&
                    row.x <
                      effectiveEnd
                      ? row.fteWeight
                      : 0
                  ),
                0
              );

            const value =
              windowCount *
              AVERAGE_MONTH_DAYS /
              (
                CONFIG
                  .trailingWeeks *
                7
              );

            return {
              x:
                monthTimestamp,

              y:
                value,

              value,

              quarterLabel:
                formatQuarterRange(
                  monthTimestamp
                )
            };
          }
        );
    }

    function niceStep(
      value
    ) {
      if (
        !Number.isFinite(
          value
        ) ||
        value <=
        0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(
            value
          )
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        value /
        magnitude;

      if (
        fraction <=
        1
      ) {
        return magnitude;
      }

      if (
        fraction <=
        2
      ) {
        return (
          2 *
          magnitude
        );
      }

      if (
        fraction <=
        2.5
      ) {
        return (
          2.5 *
          magnitude
        );
      }

      if (
        fraction <=
        5
      ) {
        return (
          5 *
          magnitude
        );
      }

      return (
        10 *
        magnitude
      );
    }

    function calculateYAxis(
      monthly,
      trend
    ) {
      const values = [
        ...monthly,
        ...trend
      ]
        .map(
          point =>
            point?.value
        )
        .filter(
          Number.isFinite
        );

      const observedMaximum =
        Math.max(
          0.1,
          ...values
        );

      const paddedMaximum =
        observedMaximum *
        1.06;

      const majorStep =
        niceStep(
          paddedMaximum /
          6
        );

      const maximum =
        Math.max(
          majorStep *
          6,
          majorStep
        );

      return {
        min:
          0,

        max:
          maximum,

        majorStep
      };
    }

    function latestAnnualisedGrowth(
      trendSeries
    ) {
      const MIN_MONTHS_FOR_PA_TREND =
        36;

      const recent =
        trendSeries
          .filter(
            point =>
              Number.isFinite(
                point?.x
              ) &&
              Number.isFinite(
                point?.value
              ) &&
              point.value >
                0
          )
          .slice(
            -MIN_MONTHS_FOR_PA_TREND
          );

      /*
       * Do not show an annualised trend until there are
       * roughly three years of usable monthly observations.
       * This mirrors the multi-year basis used by the supply
       * graph and avoids over-interpreting the newer, noisier
       * job-ad series.
       */
      if (
        recent.length <
        MIN_MONTHS_FOR_PA_TREND
      ) {
        return NaN;
      }

      const firstTime =
        recent[0].x;

      const points =
        recent
          .map(
            point => ({
              x:
                (
                  point.x -
                  firstTime
                ) /
                (
                  365.2425 *
                  DAY_MS
                ),

              y:
                Math.log(
                  point.value
                )
            })
          )
          .filter(
            point =>
              Number.isFinite(
                point.x
              ) &&
              Number.isFinite(
                point.y
              )
          );

      if (
        points.length <
        2
      ) {
        return NaN;
      }

      const meanX =
        points.reduce(
          (
            total,
            point
          ) =>
            total +
            point.x,
          0
        ) /
        points.length;

      const meanY =
        points.reduce(
          (
            total,
            point
          ) =>
            total +
            point.y,
          0
        ) /
        points.length;

      let numerator =
        0;

      let denominator =
        0;

      points.forEach(
        point => {
          const dx =
            point.x -
            meanX;

          numerator +=
            dx *
            (
              point.y -
              meanY
            );

          denominator +=
            dx *
            dx;
        }
      );

      if (
        denominator <=
        0
      ) {
        return NaN;
      }

      const annualLogSlope =
        numerator /
        denominator;

      return (
        Math.exp(
          annualLogSlope
        ) -
        1
      ) *
      100;
    }

    function formatAxisNumber(
      value
    ) {
      const number =
        Number(
          value
        );

      if (
        !Number.isFinite(
          number
        )
      ) {
        return '';
      }

      return Number.isInteger(
        number
      )
        ? number.toLocaleString(
            'en-AU'
          )
        : number.toFixed(
            1
          );
    }

    function currentYAxisTracks() {
      const scale =
        yAxisModel;

      const count =
        Math.max(
          1,
          Math.round(
            (
              scale.max -
              scale.min
            ) /
            scale.majorStep
          )
        );

      return Array.from(
        {
          length:
            count +
            1
        },
        (
          _,
          index
        ) => {
          const value =
            scale.min +
            scale.majorStep *
            index;

          return {
            value,
            ratio:
              scale.max >
              scale.min
                ? (
                    value -
                    scale.min
                  ) /
                  (
                    scale.max -
                    scale.min
                  )
                : 0
          };
        }
      );
    }

    function currentXAxisTracks() {
      if (
        !axisBounds
      ) {
        return [];
      }

      const span =
        axisBounds.xMax -
        axisBounds.xMin;

      if (
        span <=
        0
      ) {
        return [];
      }

      return buildMonthTicks(
        axisBounds.xMin,
        axisBounds.lastDataMonth
      ).map(
        tick => ({
          value:
            tick.value,

          ratio:
            (
              tick.value -
              axisBounds.xMin
            ) /
            span,

          major:
            isQuarterTick(
              tick.value
            ),

          label:
            formatQuarterTick(
              tick.value
            )
        })
      );
    }

    function rgba(
      hex,
      alpha
    ) {
      const cleaned =
        String(
          hex ||
          '#000000'
        )
          .replace(
            '#',
            ''
          )
          .trim();

      const value =
        Number.parseInt(
          cleaned,
          16
        );

      if (
        !Number.isFinite(
          value
        )
      ) {
        return `rgba(0,0,0,${alpha})`;
      }

      return (
        `rgba(${(value >> 16) & 255},` +
        `${(value >> 8) & 255},` +
        `${value & 255},${alpha})`
      );
    }

    function loadSheetRows() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffDemandLive_${
              Date.now()
            }_${
              Math.floor(
                Math.random() *
                1000000
              )
            }`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Could not load live job ad data'
                  )
                );
              },
              CONFIG
                .fetchTimeoutMs
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }

          function finish(
            error,
            response
          ) {
            if (
              settled
            ) {
              return;
            }

            settled =
              true;

            cleanup();

            if (
              error
            ) {
              reject(
                error
              );

              return;
            }

            if (
              !response ||
              response.status ===
                'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load live job ad data'
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          }

          window[
            callbackName
          ] =
            response =>
              finish(
                null,
                response
              );

          script.onerror =
            () => {
              finish(
                new Error(
                  'Network error loading live job ad data'
                )
              );
            };

          const params =
            new URLSearchParams({
              sheet:
                CONFIG
                  .jobSheetName,

              range:
                CONFIG
                  .jobRange,

              headers:
                '0',

              tq:
                'select *',

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(
                  Date.now()
                )
            });

          params.set(
            'gid',
            CONFIG
              .jobSheetGid
          );

          script.src =
            `https://docs.google.com/spreadsheets/d/${
              CONFIG.jobSheetId
            }/gviz/tq?${
              params.toString()
            }`;

          document.body
            .appendChild(
              script
            );
        }
      );
    }

    function loadCentralCachedData() {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            `pffDemandCache_${
              Date.now()
            }_${
              Math.floor(
                Math.random() *
                1000000
              )
            }`;

          const script =
            document.createElement(
              'script'
            );

          let settled =
            false;

          const timeout =
            window.setTimeout(
              () => {
                finish(
                  new Error(
                    'Could not load cached job ad data'
                  )
                );
              },
              CONFIG
                .cacheFetchTimeoutMs
            );

          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (
              error
            ) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }

          function finish(
            error,
            payload
          ) {
            if (
              settled
            ) {
              return;
            }

            settled =
              true;

            cleanup();

            if (
              error
            ) {
              reject(
                error
              );

              return;
            }

            if (
              !payload ||
              payload.ok !==
                true ||
              payload.appKey !==
                CACHE_APP_KEY ||
              !payload.data
            ) {
              reject(
                new Error(
                  payload
                    ?.error ||
                  'Cached job ad data are invalid'
                )
              );

              return;
            }

            resolve(
              payload.data
            );
          }

          window[
            callbackName
          ] =
            payload =>
              finish(
                null,
                payload
              );

          script.onerror =
            () =>
              finish(
                new Error(
                  'Network error loading cached job ad data'
                )
              );

          const params =
            new URLSearchParams({
              appKey:
                CACHE_APP_KEY,

              callback:
                callbackName,

              _:
                String(
                  Date.now()
                )
            });

          script.src =
            `${
              CACHE_WEB_APP_URL
            }?${
              params.toString()
            }`;

          document.body
            .appendChild(
              script
            );
        }
      );
    }

    function restoreCachedJobRows(
      cachedRows
    ) {
      const sourceIndexes = [
        0,
        2,
        4,
        5,
        6,
        7,
        9,
        11,
        20
      ];

      return (
        Array.isArray(
          cachedRows
        )
          ? cachedRows
          : []
      ).map(
        row => {
          const cells =
            Array.from(
              {
                length:
                  21
              },
              () =>
                null
            );

          sourceIndexes
            .forEach(
              (
                sourceIndex,
                cachedIndex
              ) => {
                cells[
                  sourceIndex
                ] =
                  makeCachedCell(
                    row?.[
                      cachedIndex
                    ]
                  );
              }
            );

          return {
            c:
              cells
          };
        }
      );
    }

    const sourceMilestonePlugin = {
      id:
        'sourceMilestonePlugin',

      afterDatasetsDraw(
        activeChart
      ) {
        const xScale =
          activeChart
            .scales
            .x;

        const area =
          activeChart
            .chartArea;

        if (
          !xScale ||
          !area
        ) {
          return;
        }

        const context =
          activeChart
            .ctx;

        const events = [
          {
            date:
              Date.UTC(
                2025,
                11,
                1
              ),

            label:
              'EssiLux jobs added'
          },
          {
            date:
              Date.UTC(
                2026,
                6,
                1
              ),

            label:
              'Indeed jobs added'
          }
        ];

        context.save();

        context.fillStyle =
          'rgba(105, 113, 138, 0.76)';

        context.font =
          '400 9px Lato, sans-serif';

        context.textAlign =
          'left';

        context.textBaseline =
          'top';

        context.fillText(
          'SEEK jobs only',
          area.left +
            4,
          area.top +
            5
        );

        events.forEach(
          event => {
            const x =
              xScale
                .getPixelForValue(
                  event.date
                );

            if (
              x <
                area.left ||
              x >
                area.right
            ) {
              return;
            }

            context.save();

            context.beginPath();

            context.setLineDash([
              4,
              4
            ]);

            context.strokeStyle =
              'rgba(105, 113, 138, 0.26)';

            context.lineWidth =
              1;

            context.moveTo(
              x,
              area.top
            );

            context.lineTo(
              x,
              area.bottom
            );

            context.stroke();

            context.setLineDash(
              []
            );

            context.translate(
              x +
                5,
              area.top +
                Math.min(
                  100,
                  area.height *
                    0.46
                )
            );

            context.rotate(
              -Math.PI /
              2
            );

            context.fillStyle =
              'rgba(105, 113, 138, 0.58)';

            context.font =
              '400 9px Lato, sans-serif';

            context.textAlign =
              'left';

            context.textBaseline =
              'middle';

            context.fillText(
              event.label,
              0,
              0
            );

            context.restore();
          }
        );

        context.restore();
      }
    };

    const demandAxesPlugin = {
      id:
        'demandAxesPlugin',

      beforeDatasetsDraw(
        activeChart
      ) {
        const {
          ctx,
          chartArea
        } = activeChart;

        if (
          !chartArea
        ) {
          return;
        }

        const yTracks =
          currentYAxisTracks();

        ctx.save();

        yTracks.forEach(
          track => {
            if (
              track.ratio <=
              0.001
            ) {
              return;
            }

            const y =
              chartArea.bottom -
              chartArea.height *
              track.ratio;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              Math.round(
                y
              ) +
              0.5
            );
            ctx.lineTo(
              chartArea.right,
              Math.round(
                y
              ) +
              0.5
            );
            ctx.strokeStyle =
              'rgba(105, 113, 138, 0.075)';
            ctx.lineWidth =
              1;
            ctx.stroke();
          }
        );

        for (
          let index =
            0;
          index <
            yTracks.length -
            1;
          index +=
            1
        ) {
          const ratio =
            (
              yTracks[index].ratio +
              yTracks[index + 1].ratio
            ) /
            2;

          const y =
            chartArea.bottom -
            chartArea.height *
            ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(
              y
            ) +
            0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(
              y
            ) +
            0.5
          );
          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.035)';
          ctx.lineWidth =
            0.7;
          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(
        activeChart
      ) {
        const {
          ctx,
          chartArea
        } = activeChart;

        if (
          !chartArea
        ) {
          return;
        }

        const mobile =
          window.innerWidth <=
          430;

        const yTracks =
          currentYAxisTracks();

        const xTracks =
          currentXAxisTracks();

        ctx.save();
        ctx.lineCap =
          'butt';

        ctx.strokeStyle =
          '#151515';
        ctx.lineWidth =
          1;
        ctx.fillStyle =
          '#151515';
        ctx.textAlign =
          'right';
        ctx.textBaseline =
          'middle';
        ctx.font =
          '12px Lato, sans-serif';

        yTracks.forEach(
          track => {
            const y =
              chartArea.bottom -
              chartArea.height *
              track.ratio;

            ctx.beginPath();
            ctx.moveTo(
              chartArea.left,
              Math.round(
                y
              ) +
              0.5
            );
            ctx.lineTo(
              chartArea.left -
              5,
              Math.round(
                y
              ) +
              0.5
            );
            ctx.stroke();
            ctx.fillText(
              formatAxisNumber(
                track.value
              ),
              chartArea.left -
              8,
              y
            );
          }
        );

        ctx.strokeStyle =
          '#69718a';
        ctx.globalAlpha =
          0.60;
        ctx.lineWidth =
          0.7;

        for (
          let index =
            0;
          index <
            yTracks.length -
            1;
          index +=
            1
        ) {
          const ratio =
            (
              yTracks[index].ratio +
              yTracks[index + 1].ratio
            ) /
            2;

          const y =
            chartArea.bottom -
            chartArea.height *
            ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(
              y
            ) +
            0.5
          );
          ctx.lineTo(
            chartArea.left -
            2,
            Math.round(
              y
            ) +
            0.5
          );
          ctx.stroke();
        }

        xTracks.forEach(
          track => {
            const x =
              chartArea.left +
              chartArea.width *
              track.ratio;

            ctx.save();
            ctx.globalAlpha =
              1;
            ctx.strokeStyle =
              track.major
                ? '#151515'
                : '#69718a';
            ctx.lineWidth =
              track.major
                ? 1
                : 0.7;
            ctx.beginPath();
            ctx.moveTo(
              Math.round(
                x
              ) +
              0.5,
              chartArea.bottom
            );
            ctx.lineTo(
              Math.round(
                x
              ) +
              0.5,
              chartArea.bottom +
              (
                track.major
                  ? 5
                  : 2
              )
            );
            ctx.stroke();

            if (
              track.major &&
              track.label
            ) {
              ctx.fillStyle =
                '#151515';
              ctx.font =
                `${mobile ? 9 : 10}px Lato, sans-serif`;
              ctx.textBaseline =
                'top';

              let labelX =
                x;

              if (
                track.ratio <=
                0.001
              ) {
                ctx.textAlign =
                  'left';
                labelX =
                  x +
                  2;
              } else if (
                track.ratio >=
                0.999
              ) {
                ctx.textAlign =
                  'right';
                labelX =
                  x -
                  2;
              } else {
                ctx.textAlign =
                  'center';
              }

              ctx.fillText(
                track.label,
                labelX,
                chartArea.bottom +
                8
              );
            }

            ctx.restore();
          }
        );

        ctx.restore();
      }
    };

    const axisSpinesPlugin = {
      id:
        'axisSpinesPlugin',

      afterDraw(
        activeChart
      ) {
        const {
          ctx,
          chartArea
        } = activeChart;

        if (
          !chartArea

          return;

        ctx.save();
        ctx.strokeStyle =
          '#151515';
        ctx.lineWidth =

        ctx.beginPath();

            chartArea.left

          0.5,
          chartArea.top
        );
        ctx.lineTo(
          Math.round(
            chartArea.left
          ) +

        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(

        ctx.lineTo(

    const paTrendLabelPlugin = {
      id:
        'paTrendLabelPlugin',

      afterDatasetsDraw(
        activeChart
      ) {
        if (
          !trendOn
        ) {
          return;
        }

        const dataset =
          activeChart
            .data
            .datasets?.[1];

        const meta =
          activeChart
            .getDatasetMeta(
              1
            );

        if (
          !dataset ||
          !meta?.data?.length ||
          meta.hidden
        ) {
          return;
        }

        const growth =
          latestAnnualisedGrowth(
            dataset.data
          );

        if (
          !Number.isFinite(
            growth
          )
        ) {
          return;
        }

        let anchorIndex =
          -1;

        for (
          let index =
            dataset.data.length -
            1;
          index >=
            0;
          index -=
            1
        ) {
          if (
            Number.isFinite(
              dataset.data[index]?.y
            ) &&
            Number.isFinite(
              meta.data[index]?.x
            ) &&
            Number.isFinite(
              meta.data[index]?.y
            )
          ) {
            anchorIndex =
              index;
            break;
          }
        }

        if (
          anchorIndex <
          0
        ) {
          return;
        }

        const {
          ctx,
          chartArea
        } = activeChart;

        const point =
          meta.data[
            anchorIndex
          ];

        const mobile =
          window.innerWidth <=
          430;

        const fontSize =
          mobile
            ? 8.2
            : 9.1;

        const labelHeight =
          mobile
            ? 14
            : 15;

        const paddingX =
          mobile
            ? 4
            : 5;

        const arrowGap =
          mobile
            ? 2.5
            : 3;

        const isIncrease =
          growth >
          0.05;

        const isDecrease =
          growth <
          -0.05;

        const arrow =
          isIncrease
            ? '↑'
            : isDecrease
              ? '↓'
              : '';

        const valueText =
          `${Math.abs(growth).toFixed(1)}% p.a.`;

        ctx.save();
        ctx.font =
          `700 ${fontSize}px Lato, sans-serif`;
        ctx.textBaseline =
          'middle';

        const arrowWidth =
          arrow
            ? ctx.measureText(
                arrow
              ).width
            : 0;

        const valueWidth =
          ctx.measureText(
            valueText
          ).width;

        const labelWidth =
          paddingX *
          2 +
          arrowWidth +
          (
            arrow
              ? arrowGap
              : 0
          ) +
          valueWidth;

        const labelRight =
          clamp(
            chartArea.right -
            4,
            chartArea.left +
            labelWidth +
            5,
            chartArea.right -
            4
          );

        const labelLeft =
          labelRight -
          labelWidth;

        const labelY =
          clamp(
            point.y,
            chartArea.top +
            labelHeight /
            2,
            chartArea.bottom -
            labelHeight /
            2
          );

        const targetX =
          point.x <
          labelLeft
            ? labelLeft
            : point.x >
                labelRight
              ? labelRight
              : clamp(
                  point.x,
                  labelLeft,
                  labelRight
                );

        const displaced =
          Math.abs(
            targetX -
            point.x
          ) >
            7 ||
          Math.abs(
            labelY -
            point.y
          ) >
            2 ||
          labelLeft <
            point.x -
            4;

        if (
          displaced
        ) {
          ctx.beginPath();
          ctx.moveTo(
            point.x,
            point.y
          );
          ctx.lineTo(
            targetX,
            labelY
          );
          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.58)';
          ctx.lineWidth =
            0.8;
          ctx.stroke();
        }

        const radius =
          3;

        const top =
          labelY -
          labelHeight /
          2;

        const bottom =
          labelY +
          labelHeight /
          2;

        ctx.beginPath();
        ctx.moveTo(
          labelLeft +
          radius,
          top
        );
        ctx.lineTo(
          labelRight -
          radius,
          top
        );
        ctx.quadraticCurveTo(
          labelRight,
          top,
          labelRight,
          top +
          radius
        );
        ctx.lineTo(
          labelRight,
          bottom -
          radius
        );
        ctx.quadraticCurveTo(
          labelRight,
          bottom,
          labelRight -
          radius,
          bottom
        );
        ctx.lineTo(
          labelLeft +
          radius,
          bottom
        );
        ctx.quadraticCurveTo(
          labelLeft,
          bottom,
          labelLeft,
          bottom -
          radius
        );
        ctx.lineTo(
          labelLeft,
          top +
          radius
        );
        ctx.quadraticCurveTo(
          labelLeft,
          top,
          labelLeft +
          radius,
          top
        );
        ctx.closePath();

        ctx.fillStyle =
          'rgba(252, 243, 214, 0.84)';
        ctx.fill();

        ctx.strokeStyle =
          rgba(
            '#f1c232',
            0.42
          );
        ctx.lineWidth =
          0.65;
        ctx.stroke();

        let textX =
          labelLeft +
          paddingX;

        ctx.textAlign =
          'left';

        ctx.fillStyle =
          isIncrease
            ? '#14823b'
            : isDecrease
              ? '#b42318'
              : '#69718a';

        if (
          arrow
        ) {
          ctx.fillText(
            arrow,
            textX,
            labelY -
            0.2
          );

          textX +=
            arrowWidth +
            arrowGap;
        }

        ctx.fillText(
          valueText,
          textX,
          labelY
        );

        ctx.restore();
      }
    };

    function setTrendLegendVisibility(
      shouldShow,
      animate = true
    ) {
      const token =
        ++trendLegendAnimationToken;

      trendLegend
        .getAnimations?.()
        .forEach(
          animation =>
            animation.cancel()
        );

      if (
        reducedMotion() ||
        !animate ||
        !trendLegend.animate
      ) {
        trendLegend.hidden =
          !shouldShow;
        trendLegend.style.opacity =
          '';
        trendLegend.style.transform =
          '';
        return;
      }

      if (
        shouldShow
      ) {
        trendLegend.hidden =
          false;

        const animation =
          trendLegend.animate(
            [
              {
                opacity:
                  0,
                transform:
                  'translateY(-2px) scale(0.94)'
              },
              {
                opacity:
                  1,
                transform:
                  'translateY(0) scale(1)'
              }
            ],
            {
              duration:
                260,
              easing:
                'cubic-bezier(0.22, 1, 0.36, 1)',
              fill:
                'both'
            }
          );

        animation.finished
          .then(
            () => {
              if (
                token !==
                trendLegendAnimationToken
              ) {
                return;
              }

              trendLegend.style.opacity =
                '';
              trendLegend.style.transform =
                '';
            }
          )
          .catch(
            () => {}
          );

        return;
      }

      const animation =
        trendLegend.animate(
          [
            {
              opacity:
                1,
              transform:
                'translateY(0) scale(1)'
            },
            {
              opacity:
                0,
              transform:
                'translateY(-2px) scale(0.94)'
            }
          ],
          {
            duration:
              140,
            easing:
              'ease-out',
            fill:
              'both'
          }
        );

      animation.finished
        .then(
          () => {
            if (
              token !==
              trendLegendAnimationToken
            ) {
              return;
            }

            trendLegend.hidden =
              true;
            trendLegend.style.opacity =
              '';
            trendLegend.style.transform =
              '';
          }
        )
        .catch(
          () => {}
        );
    }

    function setTrendVisibility(
      shouldShow

      trendOn =

        duration;
      chart.options.animations.y.duration =
        duration;

      chart.update();

    async function loadDemandChart() {
      let liveError =
        null;

      if (
        !FORCE_CACHED_DATA
      ) {
        try {
          const liveRows =
            normaliseRows(
              await loadSheetRows()
            );

          if (
            liveRows.length
          ) {
            rows =
              liveRows;

            saveLocalCache(
              rows
            );

            setDataSource(
              'live'
            );

            axisBounds =
              calculateAxisBounds(
                rows
              );

            createChart();
            updateTrendToggle(false);
            hideLoadingState();

            return;
          }

          liveError =
            new Error(
              'Live job ad data were empty'
            );
        } catch (
          error
        ) {
          liveError =
            error;
        }
      }

      try {
        const cachedData =
          await loadCentralCachedData();

        const cachedRows =
          normaliseRows(
            restoreCachedJobRows(
              cachedData
                ?.jobRows
            )
          );

        if (
          cachedRows.length
        ) {
          rows =
            cachedRows;

          saveLocalCache(
            rows
          );

          setDataSource(
            'cached'
          );

          axisBounds =
            calculateAxisBounds(
              rows
            );

          createChart();
          updateTrendToggle(false);
          hideLoadingState();

          return;
        }
      } catch (
        cacheError
      ) {
        console.error(
          'Live labour demand data error',
          liveError
        );

        console.error(
          'Cached labour demand data error',
          cacheError
        );
      }

      const localRows =
        loadLocalCache();

      if (
        localRows.length
      ) {
        rows =
          localRows;

        setDataSource(
          'cached'
        );

        axisBounds =
          calculateAxisBounds(
            rows
          );

        createChart();
        updateTrendToggle(false);
        hideLoadingState();

        return;
      }

      showError(
        liveError ||
        new Error(
          'No labour demand data were available'
        )
      );
    }

    function refreshResponsiveLayout() {
      if (
        responsiveFrame !==
        null
      ) {
        cancelAnimationFrame(
          responsiveFrame

      }

      responsiveFrame =
        requestAnimationFrame(
          () => {
            responsiveFrame =
              null;

            if (
              chart
            ) {
              const mobile =
                window.innerWidth <=
                430;

              chart.options.scales.y.afterFit =
                scaleObject => {
                  scaleObject.width =
                    mobile
                      ? 61
                      : 69;
                };

              chart.options.scales.x.afterFit =
                scaleObject => {
                  scaleObject.height =
                    mobile
                      ? 43
                      : 46;
                };

              chart.options.scales.x.title.font.size =
                mobile
                  ? 12
                  : 13;

              chart.options.scales.y.title.font.size =
                mobile
                  ? 12
                  : 13;

              chart.options.scales.x.title.padding.top =
                mobile
                  ? 21
                  : 22;

              chart.resize();
              chart.draw();
            }
          }
        );
    }

    let resizeObserver =
      null;

    if (
      'ResizeObserver' in
      window
    ) {
      resizeObserver =
        new ResizeObserver(
          entries => {
            const hasUsableSize =
              entries.some(
                entry =>
                  entry
                    .contentRect
                    .width >
                    1 &&
                  entry
                    .contentRect
                    .height >
                    1
              );

            if (
              hasUsableSize
            ) {
              refreshResponsiveLayout();
            }
          }
        );

      resizeObserver
        .observe(
          app
        );
    }

    window
      .addEventListener(
        'resize',
        refreshResponsiveLayout,
        {
          passive:
            true
        }
      );

    window
      .visualViewport
      ?.addEventListener(
        'resize',
        refreshResponsiveLayout,
        {
          passive:
            true
        }
      );

    window
      .addEventListener(
        'pageshow',
        refreshResponsiveLayout
      );

    document
      .addEventListener(
        'visibilitychange',
        () => {
          if (
            !document.hidden
          ) {
            refreshResponsiveLayout();
          }
        }
      );

    if (
      document
        .fonts
        ?.ready
    ) {
      document
        .fonts
        .ready
        .then(
          refreshResponsiveLayout
        );
    }

    loadDemandChart();
  </script>
</body>
</html>
