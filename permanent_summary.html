<html lang="en-AU">

  <style>
    /*
     * Shared font, colours, loader, source indicator, reduced-motion
     * handling and responsive infrastructure come from PFF Core.
     * Only Permanent Salary Summary-specific layout remains here.
     */
    html,
    body {
      height: auto;
      min-height: 0;
      overflow: hidden;
    }

    #fit {
      display: block;
      min-height: 0;
      overflow: hidden;
    }

    #app {
      display: block;
      width: 100%;
      min-height: 0;
      margin: 0;
      padding: 14px 2px 14px;
      text-align: center;
    }

    #app.is-loading .response-summary,
    #app.is-loading .salary-section {
      display: none;
    }

    .app-loading {
      position: static;
      inset: auto;
      width: 100%;
      height: auto;
      min-height: 190px;
      background: transparent;
    }

    .live-data {
      position: absolute;
      right: 1px;
      bottom: 4px;
      margin: 0;
      padding: 0;
      font-size: 9px;
    }

    .response-summary {
      width: 100%;
      padding: 0;
    }

    .response-summary::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin-top: 5px;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgba(102, 0, 255, 0.16) 24%,
        var(--pff-purple) 50%,
        rgba(102, 0, 255, 0.16) 76%,
        #fff 100%
      );
    }

    .response-label {
      color: var(--pff-muted);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }

    .response-value-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 31px;
      margin-top: 2px;
    }

    .response-value {
      margin-top: 2px;
      color: var(--pff-ink);
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }


    /* ---------- Compact salary distribution ---------- */

    .salary-distribution {
      width: 100%;
      margin: 2px 0 0;
      padding: 0;
    }

    .salary-distribution-canvas-wrap {
      position: relative;
      width: 100%;
      height: 55px;
      overflow: hidden;
    }

    #salary-distribution-canvas {
      display: block;
      width: 100%;
      height: 55px;
    }

    .salary-distribution-status {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: var(--pff-muted);
      background: rgba(255, 255, 255, 0.88);
      font-size: 9px;
      line-height: 1.25;
      text-align: center;
    }

    .salary-distribution-status.is-visible {
      display: flex;
    }


    /* ---------- Salary table ---------- */

    .salary-section {
      width: 100%;
      margin-top: 6px;
    }


    .salary-table-wrap {
      position: relative;
      width: 100%;
    }

    .salary-table-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 24%;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--pff-ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .salary-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .salary-table th,
    .salary-table td {

      padding: 8px 6px;
      line-height: 1.2;
      text-align: center;
      vertical-align: middle;

      font-weight: 700;
      white-space: nowrap;

    }

    function calculatePercentiles(values) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      return PERCENTILES.map(
        item =>

            item.probability

      );
    }

    function formatSalaryCurrency(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      if (number === 0) {
        return '$0';
      }

      if (Math.abs(number) >= 1000) {
        return `$${formatNumber(
          Math.round(number / 1000),
          0
        )}k`;
      }

      return `$${formatNumber(
        Math.round(number),
        0
      )}`;
    }

    function formatBonusCurrency(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      if (number === 0) {
        return '$0';
      }

      if (Math.abs(number) >= 1000) {
        const scaled =
          number / 1000;

        return `$${formatNumber(
          scaled,
          Math.abs(
            scaled -
            Math.round(scaled)
          ) < 0.05
            ? 0
            : 1
        )}k`;
      }

      return `$${formatNumber(
        Math.round(number),
        0
      )}`;
    }

    function formatHourly(value) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? `$${formatNumber(
            number,
            0

        : '—';
    }

    function formatPlainNumber(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return '—';
      }

      return formatNumber(
        number,
        Math.abs(
          number -
          Math.round(number)
        ) < 0.05
          ? 0
          : 1
      );
    }


    function formatMetricValue(metricKey, value) {
      if (

      if (
        metricKey === 'hourly' ||
        metricKey === 'unloadedHourly'
      ) {
        return formatHourly(value);
      }

      return formatPlainNumber(value);

    function calculateKernelDensity(
      values,
      minimumX,
      maximumX,
      sampleCount = 120
    ) {
      const sorted = values
        .filter(Number.isFinite)
        .slice()
        .sort(
          (first, second) =>
            first - second
        );

      if (sorted.length < 2) {
        return [];
      }

      const count =
        sorted.length;

      const mean =
        sorted.reduce(
          (total, value) =>
            total + value,
          0
        ) /
        count;

      const variance =
        sorted.reduce(
          (total, value) =>
            total +
            Math.pow(
              value - mean,
              2
            ),
          0
        ) /
        Math.max(
          1,
          count - 1
        );

      const standardDeviation =
        Math.sqrt(
          Math.max(
            0,
            variance
          )
        );

      const q1 =
        percentile(
          sorted,
          0.25
        );

      const q3 =
        percentile(
          sorted,
          0.75
        );

      const robustSigma =
        Number.isFinite(q1) &&
        Number.isFinite(q3) &&
        q3 > q1
          ? (q3 - q1) / 1.34
          : NaN;

      const scaleCandidates = [
        standardDeviation,
        robustSigma
      ].filter(
        value =>
          Number.isFinite(value) &&
          value > 0
      );

      const fallbackScale =
        Math.max(
          1,
          (maximumX - minimumX) /
          6
        );

      const scale =
        scaleCandidates.length
          ? Math.min(
              ...scaleCandidates
            )
          : fallbackScale;

      const silvermanBandwidth =
        0.9 *
        scale *
        Math.pow(
          count,
          -0.2
        );

      const range =
        Math.max(
          1,
          maximumX - minimumX
        );

      const bandwidth =
        Math.max(
          3000,
          Math.min(
            range * 0.22,
            Number.isFinite(
              silvermanBandwidth
            ) &&
            silvermanBandwidth > 0
              ? silvermanBandwidth
              : range / 10
          )
        );

      const normalisingConstant =
        1 /
        (
          bandwidth *
          Math.sqrt(
            2 * Math.PI
          )
        );

      const result = [];

      for (
        let index = 0;
        index < sampleCount;
        index += 1
      ) {
        const proportion =
          sampleCount === 1
            ? 0
            : index /
              (sampleCount - 1);

        const x =
          minimumX +
          proportion *
          range;

        let density = 0;

        sorted.forEach(value => {
          const z =
            (x - value) /
            bandwidth;

          density +=
            Math.exp(
              -0.5 *
              z *
              z
            );
        });

        density =
          density *
          normalisingConstant /
          count;

        if (
          Number.isFinite(density)
        ) {
          result.push({
            x,
            y: density
          });
        }
      }

      return result;
    }

      ].map(item => ({
        ...item,
        value: percentile(
          salaries,
          item.probability
        )
      }));

      const minimumX = 60000;
      const maximumX = 180000;

      const density =
        calculateKernelDensity(
          salaries,
          minimumX,
          maximumX
        );

      if (density.length < 2) {
        setDistributionStatus(
          'Salary distribution unavailable'
        );
        return;
      }

      const maximumDensity =
        Math.max(
          ...density.map(
            point => point.y
          )
        );

      if (
        !Number.isFinite(
          maximumDensity
        ) ||
        maximumDensity <= 0
      ) {
        setDistributionStatus(
          'Salary distribution unavailable'
        );
        return;
      }

      const cssWidth =
        Math.max(
          1,
          salaryDistributionCanvas.clientWidth
        );

      const cssHeight =
        Math.max(
          1,
          salaryDistributionCanvas.clientHeight
        );

      const pixelRatio =
        Math.min(
          window.devicePixelRatio || 1,
          3
        );

      salaryDistributionCanvas.width =
        Math.round(
          cssWidth *
          pixelRatio
        );

      salaryDistributionCanvas.height =
        Math.round(
          cssHeight *
          pixelRatio
        );

      const context =
        salaryDistributionCanvas.getContext(
          '2d'
        );

      context.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
      );

      context.clearRect(
        0,
        0,
        cssWidth,
        cssHeight
      );

      const padding = {
        top: 4,
        right: 5,
        bottom: 0.5,
        left: 5
      };

      const plotHeight =
        Math.max(
          1,
          cssHeight -
          padding.top -
          padding.bottom
        );

      const baselineY =
        padding.top +
        plotHeight;

      /*
       * Align the distribution with the percentile columns below it.
       * The live table controls the target positions, so this continues
       * to line up when the embed/table width changes.
       *
       * The salary axis is piecewise-linear between percentile anchors:
       *   5th -> 5th column centre
       *   20th -> 20th column centre
       *   median -> Median column centre
       *   80th -> 80th column centre
       *   95th -> 95th column centre
       * Values between those percentiles retain proportional spacing.
       */
      const canvasRect =
        salaryDistributionCanvas.getBoundingClientRect();

      const headerCells =
        [
          ...salaryTable.querySelectorAll(
            'thead tr:first-child th'
          )
        ];

      const fallbackFirstColumnFraction = 0.24;
      const fallbackValueColumnFraction =
        (1 - fallbackFirstColumnFraction) / 5;

      const fallbackTargetForIndex = index =>
        cssWidth *
        (
          fallbackFirstColumnFraction +
          fallbackValueColumnFraction *
          (index + 0.5)
        );

      const targetForColumn = index => {
        const cell =
          headerCells[index + 1];

        if (!cell) {
          return fallbackTargetForIndex(index);
        }

        const rect =
          cell.getBoundingClientRect();

        return Math.max(
          padding.left,
          Math.min(
            cssWidth - padding.right,
            rect.left +
            rect.width / 2 -
            canvasRect.left
          )
        );
      };

      const percentileAnchors =
        distributionPercentiles.map(
          (item, index) => ({
            ...item,
            targetX:
              targetForColumn(index)
          })
        );

      const firstValueCell =
        headerCells[1];

      const lastValueCell =
        headerCells[5];

      const firstValueRect =
        firstValueCell?.getBoundingClientRect();

      const lastValueRect =
        lastValueCell?.getBoundingClientRect();

      const numericPlotLeft =
        firstValueRect
          ? Math.max(
              padding.left,
              firstValueRect.left -
              canvasRect.left +
              2
            )
          : Math.max(
              padding.left,
              cssWidth *
              fallbackFirstColumnFraction +
              2
            );

      const numericPlotRight =
        lastValueRect
          ? Math.min(
              cssWidth - padding.right,
              lastValueRect.right -
              canvasRect.left -
              3
            )
          : cssWidth - padding.right;

      const xAnchors = [
        {
          value: minimumX,
          pixel: numericPlotLeft
        },
        ...percentileAnchors.map(
          item => ({
            value: item.value,
            pixel: item.targetX
          })
        ),
        {
          value: maximumX,
          pixel: numericPlotRight
        }
      ]
        .filter(
          anchor =>
            Number.isFinite(anchor.value) &&
            Number.isFinite(anchor.pixel)
        )
        .sort(
          (first, second) =>
            first.value - second.value
        );

      /*
       * Duplicate percentile values can occur in small/clustered samples.
       * Collapse them into a single anchor to keep the mapping monotonic.
       */
      const uniqueXAnchors = [];

      xAnchors.forEach(anchor => {
        const previous =
          uniqueXAnchors[
            uniqueXAnchors.length - 1
          ];

        if (
          previous &&
          Math.abs(
            previous.value -
            anchor.value
          ) < 1e-8
        ) {
          previous.pixel =
            Math.max(
              previous.pixel,
              anchor.pixel
            );
          return;
        }

        uniqueXAnchors.push({
          ...anchor
        });
      });

      /*
       * Enforce increasing pixel positions. This is mainly defensive for
       * unusual percentile ties or extremely narrow embeds.
       */
      for (
        let index = 1;
        index < uniqueXAnchors.length;
        index += 1
      ) {
        uniqueXAnchors[index].pixel =
          Math.max(
            uniqueXAnchors[index].pixel,
            uniqueXAnchors[index - 1].pixel +
            0.25
          );
      }

      const xToPixel = value => {
        const clampedValue =
          Math.min(
            maximumX,
            Math.max(
              minimumX,
              value
            )
          );

        for (
          let index = 1;
          index < uniqueXAnchors.length;
          index += 1
        ) {
          const previous =
            uniqueXAnchors[index - 1];

          const current =
            uniqueXAnchors[index];

          if (
            clampedValue <= current.value
          ) {
            const span =
              current.value -
              previous.value;

            const proportion =
              span === 0
                ? 0
                : (
                    clampedValue -
                    previous.value
                  ) /
                  span;

            return previous.pixel +
              (
                current.pixel -
                previous.pixel
              ) *
              proportion;
          }
        }

        return uniqueXAnchors[
          uniqueXAnchors.length - 1
        ].pixel;
      };

      const densityToPixel = value =>
        baselineY -
        (
          value /
          maximumDensity
        ) *
        (
          plotHeight - 5
        );

      const findDensityPoint = value => {
        for (
          let index = 1;
          index < density.length;
          index += 1
        ) {
          const previous = density[index - 1];
          const current = density[index];

          if (
            value >= previous.x &&
            value <= current.x
          ) {
            const span =
              current.x - previous.x;

            const proportion =
              span === 0
                ? 0
                : (value - previous.x) /
                  span;

            return {
              x: value,
              y:
                previous.y +
                (current.y - previous.y) *
                proportion
            };
          }
        }

        return density.reduce(
          (nearest, point) =>
            Math.abs(point.x - value) <
            Math.abs(nearest.x - value)
              ? point
              : nearest,
          density[0]
        );
      };

      /* Density area */
      context.save();
      context.beginPath();

      density.forEach(
        (point, index) => {
          const x =
            xToPixel(
              point.x
            );

          const y =
            densityToPixel(
              point.y
            );

          if (index === 0) {
            context.moveTo(
              x,
              baselineY
            );
            context.lineTo(
              x,
              y
            );
          } else {
            context.lineTo(
              x,
              y
            );
          }
        }
      );

      context.lineTo(
        xToPixel(
          density[
            density.length - 1
          ].x
        ),
        baselineY
      );
      context.closePath();
      context.fillStyle =
        'rgba(241, 194, 50, 0.10)';
      context.fill();
      context.restore();

      /* Raw salaries */
      context.save();
      context.fillStyle =
        'rgba(102, 0, 255, 0.28)';

      salaries.forEach(
        (salary, index) => {
          const yOffset =
            2 +
            (index % 3) *
            2.1;

          context.beginPath();
          context.arc(
            xToPixel(salary),
            baselineY - yOffset,
            1.35,
            0,
            Math.PI * 2
          );
          context.fill();
        }
      );
      context.restore();

      /* Density curve */
      context.save();
      context.beginPath();
      context.strokeStyle =
        '#f1c232';
      context.lineWidth = 2;
      context.lineCap = 'round';
      context.lineJoin = 'round';

      density.forEach(
        (point, index) => {
          const x =
            xToPixel(
              point.x
            );

          const y =
            densityToPixel(
              point.y
            );

          if (index === 0) {
            context.moveTo(x, y);
          } else {
            context.lineTo(x, y);
          }
        }
      );

      context.stroke();
      context.restore();

      const labels =
        percentileAnchors.map(item => {
          const curvePoint =
            findDensityPoint(
              item.value
            );

          return {
            ...item,
            x:
              xToPixel(
                item.value
              ),
            curveY:
              densityToPixel(
                curvePoint.y
              ),
            valueText:
              formatDistributionSalary(
                item.value
              )
          };
        });

      /* Percentile guide lines */
      labels.forEach(label => {
        context.save();
        context.beginPath();
        context.setLineDash(
          label.dash
        );
        context.strokeStyle =
          label.strokeStyle;
        context.lineWidth =
          label.key === 'median'
            ? 1.1
            : 1;
        context.moveTo(
          label.x,
          label.curveY
        );
        context.lineTo(
          label.x,
          baselineY
        );
        context.stroke();
        context.restore();
      });

    }


    function validSalary(value) {
      return (
        Number.isFinite(value) &&
        value >= 30000 &&
        value <= 500000
      );
    }


    function validBonus(value) {
      return (
        Number.isFinite(value) &&
        value >= 0
      );
    }


    function validHours(value) {
      return (
        Number.isFinite(value) &&
        value > 0 &&
        value <= 100
      );
    }


    function validShiftCount(value) {
      return (
        Number.isFinite(value) &&
        value >= 0 &&
        value <= 31
      );
    }


    function calculateUnloadFactor(row) {
      const saturdays =
        validShiftCount(row?.saturdays)
          ? row.saturdays
          : 0;

      const sundays =
        validShiftCount(row?.sundays)
          ? row.sundays
          : 0;

      const lateNights =
        validShiftCount(row?.lateNights)
          ? row.lateNights
          : 0;

      const loadingHoursPerFourWeeks =
        saturdays *
          SATURDAY_SHIFT_HOURS *
          SATURDAY_LOADING +
        sundays *
          SUNDAY_SHIFT_HOURS *
          SUNDAY_LOADING +
        lateNights *
          LATE_NIGHT_SHIFT_HOURS *
          LATE_NIGHT_LOADING;

      const referenceHoursPerFourWeeks =
        LOADING_REFERENCE_WEEKLY_HOURS *
        4;

      return Math.max(
        0,
        1 -
        loadingHoursPerFourWeeks /
        referenceHoursPerFourWeeks
      );
    }


    function valuesForMetric(rows, key) {
      if (key === 'salary') {
        return rows
          .map(row => row.salary)
          .filter(validSalary);
      }

      if (key === 'hourly') {
        return rows
          .map(
            row =>
              validSalary(row.salary)
                ? row.salary /
                  52 /
                  fteWeeklyHours
                : NaN
          )
          .filter(Number.isFinite);
      }

      if (key === 'bonuses') {
        return rows
          .map(row => row.bonuses)
          .filter(validBonus);
      }

      if (key === 'unloadedSalary') {
        return rows
          .map(row => row.unloadedSalary)
          .filter(validSalary);
      }

      if (key === 'unloadedHourly') {
        return rows
          .map(
            row =>
              validSalary(row.unloadedSalary)
                ? row.unloadedSalary /
                  52 /
                  fteWeeklyHours
                : NaN
          )
          .filter(Number.isFinite);
      }

      if (key === 'unloadedBonuses') {
        return rows
          .map(row => row.unloadedBonuses)
          .filter(validBonus);
      }

      if (key === 'hoursPerWeek') {
        return rows
          .map(row => row.hoursPerWeek)
          .filter(validHours);
      }

      if (key === 'saturdays') {
        return rows
          .map(row => row.saturdays)
          .filter(validShiftCount);
      }

      if (key === 'sundays') {
        return rows
          .map(row => row.sundays)
          .filter(validShiftCount);
      }

      if (key === 'lateNights') {
        return rows
          .map(row => row.lateNights)
          .filter(validShiftCount);
      }

      return [];
    }


    function calculateSummary(rows) {
      const metricKeys = [
        'salary',
        'hourly',
        'bonuses',
        'unloadedSalary',
        'unloadedHourly',
        'unloadedBonuses',
        'hoursPerWeek',
        'saturdays',
        'sundays',
        'lateNights'
      ];

      const metrics = {};

      metricKeys.forEach(
        key => {
          metrics[key] =
            calculatePercentiles(
              valuesForMetric(
                rows,
                key
              )
            );
        }
      );

      return {
        metrics
      };
    }


    function renderLiveSummary() {
      const summary =
        calculateSummary(
          rawRows
        );

      responseCount.textContent =
        String(
          rawRows.length
        );

      responseCount.classList.remove(
        'error'
      );

      renderCalculatedSalaryTable(
        summary
      );

    }


    function liveRowsForBrowserCache(table) {
      return (
        table?.rows ||
        []
      )
        .map(
          rawRow => {
            const cells =
              rawRow?.c ||
              [];

            return Array.from(
              {
                length:
                  8
              },
              (
                _,
                index
              ) =>
                cellValue(
                  cells[index]
                )
            );
          }
        )
        .filter(
          row =>
            Boolean(
              cleanText(
                row?.[
                  SOURCE_COLUMNS.date
                ]
              )
            )
        );
    }

    function remoteRowsForBrowserCache(payload) {
      if (
        !payload?.cachedAt ||
        Number.isNaN(
          Date.parse(
            payload.cachedAt
          )
        )
      ) {
        throw new Error(
          'Cached permanent salary data have an invalid timestamp'
        );
      }

      const sourceRows =
        Array.isArray(
          payload?.data?.rows
        )
          ? payload.data.rows
          : [];

      return sourceRows
        .filter(
          row =>
            Array.isArray(row) &&
            row.length >=
              EXPECTED_BACKEND_ROW_LENGTH
        )
        .map(
          row => [
            row?.[
              BACKEND_COLUMNS.date
            ] ?? '',

            row?.[
              BACKEND_COLUMNS.modeFteHours
            ] ?? '',

            row?.[
              BACKEND_COLUMNS.hoursPerWeek
            ] ?? '',

            row?.[
              BACKEND_COLUMNS.saturdays
            ] ?? '',

            row?.[
              BACKEND_COLUMNS.sundays
            ] ?? '',

            row?.[
              BACKEND_COLUMNS.lateNights
            ] ?? '',

            row?.[
              BACKEND_COLUMNS.salary
            ] ?? '',

            row?.[
              BACKEND_COLUMNS.bonuses
            ] ?? ''
          ]
        )
        .filter(
          row =>
            Boolean(
              cleanText(
                row?.[
                  SOURCE_COLUMNS.date
                ]
              )
            )
        );
    }

    function normaliseSourceRows(
      sourceRows
    ) {
      const result = [];
      const fteHourCandidates = [];

      Array.from(
        sourceRows ||
        []
      ).forEach(
        sourceRow => {
          const date =
            parseDateUtc(
              sourceRow?.[
                SOURCE_COLUMNS.date
              ]
            );

          const modeHours =
            toNumber(
              sourceRow?.[
                SOURCE_COLUMNS.modeFteHours
              ]
            );

          if (
            Number.isFinite(
              modeHours
            ) &&
            modeHours > 0
          ) {
            fteHourCandidates.push(
              modeHours
            );
          }

          if (
            !Number.isFinite(
              date
            )
          ) {
            return;
          }

          const row = {
            date,

            salary:
              toNumber(
                sourceRow?.[
                  SOURCE_COLUMNS.salary
                ]
              ),

            bonuses:
              toNumber(
                sourceRow?.[
                  SOURCE_COLUMNS.bonuses
                ]
              ),

            hoursPerWeek:
              toNumber(
                sourceRow?.[
                  SOURCE_COLUMNS.hoursPerWeek
                ]
              ),

            saturdays:
              toNumber(
                sourceRow?.[
                  SOURCE_COLUMNS.saturdays
                ]
              ),

            sundays:
              toNumber(
                sourceRow?.[
                  SOURCE_COLUMNS.sundays
                ]
              ),

            lateNights:
              toNumber(
                sourceRow?.[
                  SOURCE_COLUMNS.lateNights
                ]
              )
          };

          const unloadFactor =
            calculateUnloadFactor(
              row
            );

          row.unloadedSalary =
            validSalary(
              row.salary
            )
              ? row.salary *
                unloadFactor
              : NaN;

          row.unloadedBonuses =
            validBonus(
              row.bonuses
            )
              ? row.bonuses *
                unloadFactor
              : NaN;

          result.push(
            row
          );
        }
      );

      if (
        fteHourCandidates.length
      ) {
        fteWeeklyHours =
          fteHourCandidates[0];
      }

      return result;
    }

    function setLoadedSourceIndicator(
      loaded
    ) {
      if (
        loaded?.source ===
        'live'
      ) {
        PFF.setDataSourceIndicator(
          'live',
          {
            indicator:
              dataSourceIndicator,

            text:
              dataSourceText
          }
        );

        return;
      }

      if (
        loaded?.source ===
        'cached'
      ) {
        PFF.setDataSourceIndicator(
          'cached',
          {
            indicator:
              dataSourceIndicator,

            text:
              dataSourceText
          }
        );

        if (
          dataSourceText
        ) {
          dataSourceText.textContent =
            loaded.remote
              ? 'BACKEND cache'
              : 'BROWSER cache';
        }

        dataSourceIndicator
          ?.setAttribute(
            'aria-label',
            loaded.remote
              ? 'Backend cached data'
              : 'Browser cached data'
          );

        return;
      }

      PFF.setDataSourceIndicator(
        'unavailable',
        {
          indicator:
            dataSourceIndicator,

          text:
            dataSourceText
        }
      );
    }

    async function loadRowsWithFallback() {
      let liveError =
        null;

      let remoteError =
        null;

      return PFFCharts
        .loadLiveCacheFallback({
          forceCached:
            FORCE_CACHED_DATA,

          cacheKey:
            CONFIG.localCacheKey,

          minRows:
            CONFIG.minimumRows,

          loadLive:
            () =>
              PFFCharts
                .loadGVizSheet({
                  sheetId:
                    CONFIG.sheetId,

                  sheetName:
                    CONFIG.sheetName,

                  range:
                    CONFIG.liveRange,

                  headers:
                    '1',

                  query:
                    CONFIG.liveQuery,

                  timeoutMs:
                    CONFIG.fetchTimeoutMs
                }),

          parseLive:
            liveRowsForBrowserCache,

          loadRemoteCache:
            () =>
              PFFCharts
                .loadAppsScriptCache({
                  url:
                    CONFIG.cacheWebAppUrl,

                  appKey:
                    CONFIG.cacheAppKey,

                  timeoutMs:
                    CONFIG.cacheFetchTimeoutMs
                }),

          parseRemoteCache:
            remoteRowsForBrowserCache,

          onLiveError(
            error
          ) {
            liveError =
              error;

            console.warn(
              'Live permanent salary data could not be used',
              error
            );
          },

          onRemoteCacheError(
            error
          ) {
            remoteError =
              error;

            console.warn(
              'Backend 1 permanent salary data could not be used',
              error
            );
          }
        })
        .catch(
          error => {
            console.error(
              'All Permanent Salary Summary data sources failed',
              {
                liveError,
                remoteError,
                finalError:
                  error
              }
            );

            throw new Error(
              'Live, backend and browser cached data are currently unavailable'
            );
          }
        );
    }

    function renderLoadedData(
      loaded
    ) {
      const rows =
        normaliseSourceRows(
          loaded?.rows
        );

      if (!rows.length) {
        throw new Error(
          'Permanent salary raw data are incomplete'
        );
      }

      rawRows =
        rows;

      hasRawData =
        true;

      setLoadedSourceIndicator(
        loaded
      );

      if (
        salaryFootnote
      ) {
        salaryFootnote.innerHTML =
          'Salary (FTE) excl. super, incl. location and weekend/night loadings<br>' +
          "* adjusted to 'unloaded' FTE (removes weekend and 6pm+ loadings)";
      }

      renderLiveSummary();

      return rows;
    }

    function showError(
      error
    ) {
      console.error(
        error
      );

      hasRawData =
        false;

      responseCount.textContent =
        '—';

      responseCount.classList.add(
        'error'
      );

      salaryTable
        .querySelector(
          'thead'
        )
        .textContent =
        '';

      salaryTable
        .querySelector(
          'tbody'
        )
        .textContent =
        '';

      setDistributionStatus(
        'Salary distribution unavailable'
      );
    }

    const responsiveController =
      PFFCharts
        .createResponsiveController({
          observe: [
            app,
            salaryDistributionCanvas
              ?.parentElement
          ],

          applyResponsiveChartOptions:
            false,

          onRefresh() {
            if (
              !hasRawData ||
              !rawRows.length ||
              app.classList.contains(
                'is-loading'
              )
            ) {
              return;
            }

            renderSalaryDistribution(
              rawRows
            );
          }
        });

    PFF.initialiseApp({
      app,

      load:
        loadRowsWithFallback,

      render:
        renderLoadedData,

      onReady() {
        requestAnimationFrame(
          () => {
            if (
              hasRawData &&
              rawRows.length
            ) {
              renderSalaryDistribution(
                rawRows
              );
            }
          }
        );
      },

      onError(
        error
      ) {
        PFF.setDataSourceIndicator(
          'unavailable',
          {
            indicator:
              dataSourceIndicator,

            text:
              dataSourceText
          }
        );

        showError(
          error
        );
      }
    });
  </script>
