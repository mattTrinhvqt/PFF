<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Workplace Recommendation Associations</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #6600ff;
      --purple-soft: #f4efff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
      --cached-amber: #c27c00;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      line-height: 1.42;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: flex-start;
    }

    #app {
      position: relative;
      width: min(calc(100% - 12px), 520px);
      min-width: 0;
      margin-inline: auto;
      padding: 8px 6px 6px;
      background: #fff;
    }

    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      min-height: 220px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 150px;
      height: 66px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 7px;
      width: 49px;
      height: 57px;
      opacity: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 28px;
      background: var(--blue-cone);
      animation: blueConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.green {
      left: 58px;
      background: var(--green-cone);
      animation: greenConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .cone.red {
      left: 72px;
      background: var(--red-cone);
      animation: redConeCycle 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    .loader-text {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      animation: loadingTextPulse 2.7s infinite cubic-bezier(0.45, 0, 0.25, 1);
    }

    @keyframes blueConeCycle {
      0%, 100% { opacity: 0; }
      12%, 76% { opacity: 1; }
      87% { opacity: 0; }
    }

    @keyframes greenConeCycle {
      0%, 20%, 100% { opacity: 0; }
      32%, 76% { opacity: 1; }
      87% { opacity: 0; }
    }

    @keyframes redConeCycle {
      0%, 40%, 100% { opacity: 0; }
      52%, 76% { opacity: 1; }
      87% { opacity: 0; }
    }

    @keyframes loadingTextPulse {
      0%, 100% { opacity: 0.45; }
      52%, 76% { opacity: 0.78; }
      87% { opacity: 0.45; }
    }

    .top-row {
      width: 100%;
      min-width: 0;
      margin: 0 0 5px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
    }

    .summary-row {
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-end;
      gap: 7px;
      padding: 0 0 5px;
      border-bottom: 1px solid var(--track);
    }

    .intro-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .intro-scroll {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .intro-scroll::-webkit-scrollbar {
      display: none;
    }

    .intro {
      width: max-content;
      min-width: 100%;
      margin: 0;
      padding: 0 18px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
      text-align: left;
      white-space: nowrap;
    }

    .intro-scroll-arrow {
      position: absolute;
      top: 50%;
      z-index: 2;
      display: inline-flex;
      width: 16px;
      height: 16px;
      align-items: center;
      justify-content: center;
      padding-bottom: 2px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.94);
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 160ms ease;
    }

    .intro-scroll-arrow-left {
      left: 0;
    }

    .intro-scroll-arrow-right {
      right: 0;
    }

    .intro-scroll-shell.can-scroll-left .intro-scroll-arrow-left,
    .intro-scroll-shell.can-scroll-right .intro-scroll-arrow-right {
      opacity: 0.72;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 1px 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data[hidden] {
      display: none;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    .live-data.is-cached .live-data-dot {
      background: var(--cached-amber);
    }

    .results {
      width: 100%;
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
    }

    .result-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      min-width: 0;
      align-items: center;
      gap: 10px;
      min-height: 35px;
      padding: 5px 0;
    }

    .factor-rank {
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.28;
      text-align: left;
      white-space: nowrap;
    }

    .factor-name {
      min-width: 0;
      color: var(--ink);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.28;
      text-align: left;
    }

    .effect-trigger {
      display: inline-block;
      min-width: 0;
      margin: 0;
      padding: 1px 0 2px;
      color: var(--purple);
      background: transparent;
      border: 0;
      border-radius: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      text-align: right;
      white-space: nowrap;
      cursor: help;
    }

    .effect-trigger:hover,
    .effect-trigger:focus-visible,
    .effect-trigger.is-open {
      color: var(--purple);
      outline: none;
    }

    #status {
      margin: 8px 0 0;
      color: var(--error);
      font-size: 14px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    .tooltip {
      position: fixed;
      z-index: 9999;
      display: none;
      width: max-content;
      max-width: min(300px, calc(100vw - 20px));
      padding: 7px 9px;
      color: #fff;
      background: rgba(21, 21, 21, 0.96);
      border-radius: 5px;
      box-shadow: 0 5px 18px rgba(21, 21, 21, 0.18);
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.38;
      text-align: left;
      pointer-events: none;
      white-space: normal;
    }

    .tooltip.is-visible {
      display: block;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding-right: 3px;
        padding-left: 3px;
      }

      h1 {
        font-size: 18px;
      }

      .result-row {
        grid-template-columns: 20px minmax(0, 1fr) auto;
        gap: 7px;
        min-height: 39px;
      }

      .factor-rank,
      .factor-name,
      .effect-trigger,
      .intro,
      .loader-text {
        font-size: 14px;
      }
    }

    @media (max-width: 350px) {
      h1 {
        font-size: 17px;
      }

      .intro,
      .factor-rank,
      .factor-name,
      .effect-trigger {
        font-size: 14px;
      }

      .result-row {
        gap: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div class="app-loading" role="status" aria-label="Analysing workplace survey data">
        <div class="cone-loader" aria-hidden="true">
          <div class="cone blue"></div>
          <div class="cone green"></div>
          <div class="cone red"></div>
        </div>
        <div class="loader-text">Analysing workplace data...</div>
      </div>

      <div class="top-row">
        <h1>What makes employee optoms recommend a workplace?</h1>
      </div>

      <div class="summary-row">
        <div class="intro-scroll-shell">
          <div id="introScroll" class="intro-scroll">
            <p class="intro">Adjusted for all other factors, values show the associated difference in recommendation score (out of 10)</p>
          </div>
          <span class="intro-scroll-arrow intro-scroll-arrow-left" aria-hidden="true">‹</span>
          <span class="intro-scroll-arrow intro-scroll-arrow-right" aria-hidden="true">›</span>
        </div>

        <div id="dataSourceIndicator" class="live-data" aria-label="Live data" hidden>
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <ul id="results" class="results" aria-live="polite"></ul>


      <p id="status" role="alert" aria-live="polite"></p>
    </main>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip"></div>

  <script>
    /************************************************************
     * DATA SETTINGS
     ************************************************************/

    const SHEET_ID =
      '1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ';

    const SHEET_NAME =
      'Data';

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxd-Tt2APxe1mds1APNpg_wTBAldVXJY4L4BUL4EIKg_xX0WBQRF3MrMnRTTX1It1p05A/exec';

    const CACHE_APP_KEY =
      'workplace-promoter-score-graph';

    const CACHE_FETCH_TIMEOUT_MS =
      10000;

    const FORCE_CACHED_DATA =
      false;

    /*
     * Raw survey columns:
     * A = timestamp
     * B = employer
     * C = 0-10 recommendation score
     * D = endorsed positive influences
     */
    const RAW_QUERY =
      'select A, B, C, D ' +
      'where B is not null ' +
      'and C is not null';

    const FACTORS = [
      {
        key: 'pay',
        label: 'Pay/bonuses'
      },
      {
        key: 'worklife',
        label: 'Work-life flexibility'
      },
      {
        key: 'autonomy',
        label: 'Clinical autonomy & professional growth'
      },
      {
        key: 'support',
        label: 'Supportive team & management'
      },
      {
        key: 'workload',
        label: 'Staffing & sustainable workload'
      },
      {
        key: 'tech',
        label: 'Quality equipment & technology'
      }
    ];

    /************************************************************
     * ELEMENTS
     ************************************************************/

    const app =
      document.getElementById('app');

    const resultsElement =
      document.getElementById('results');

    const introScrollShell =
      document.querySelector('.intro-scroll-shell');

    const introScroll =
      document.getElementById('introScroll');


    const statusElement =
      document.getElementById('status');

    const tooltip =
      document.getElementById('tooltip');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    let activeTooltipTrigger =
      null;

    /************************************************************
     * BASIC HELPERS
     ************************************************************/

    function hideLoadingState() {
      app.classList.remove('is-loading');
      app.setAttribute('aria-busy', 'false');
    }

    function setStatus(message = '') {
      statusElement.textContent = message;
    }

    function setDataSource(source) {
      const isLive =
        source === 'live';

      const isCached =
        source === 'cached';

      const visible =
        isLive || isCached;

      dataSourceIndicator.hidden =
        !visible;

      if (!visible) {
        return;
      }

      dataSourceIndicator.classList.toggle(
        'is-cached',
        isCached
      );

      dataSourceIndicator.setAttribute(
        'aria-label',
        isCached ? 'Cached data' : 'Live data'
      );

      dataSourceText.textContent =
        isCached ? 'CACHED data' : 'LIVE data';

      requestAnimationFrame(
        updateIntroScrollCues
      );
    }

    function getCellValue(cell) {
      if (!cell) {
        return null;
      }

      if (cell.v !== undefined && cell.v !== null) {
        return cell.v;
      }

      if (cell.f !== undefined && cell.f !== null) {
        return cell.f;
      }

      return null;
    }

    function toNumber(value) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? number
        : NaN;
    }

    function clamp(value, min, max) {
      return Math.max(
        min,
        Math.min(max, value)
      );
    }

    function formatTrimmed(value, digits = 2) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      const rounded =
        Number(value.toFixed(digits));

      if (Object.is(rounded, -0) || rounded === 0) {
        return '0';
      }

      return String(rounded);
    }

    function formatSigned(value, digits = 2) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      const rounded =
        Number(value.toFixed(digits));

      if (Object.is(rounded, -0) || rounded === 0) {
        return '0';
      }

      return `${rounded > 0 ? '+' : '−'}${formatTrimmed(Math.abs(rounded), digits)}`;
    }

    function formatCIBound(value, digits = 2) {
      return formatTrimmed(value, digits);
    }

    function formatPValue(p) {
      if (!Number.isFinite(p)) {
        return 'p = —';
      }

      if (p < 0.0001) {
        return 'p < 0.0001';
      }

      if (p < 0.001) {
        return 'p < 0.001';
      }

      if (p < 0.01) {
        return 'p < 0.01';
      }

      if (p < 0.05) {
        return 'p < 0.05';
      }

      return `p = ${formatTrimmed(p, 2)}`;
    }

    function formatDiagnosticP(p) {
      if (!Number.isFinite(p)) {
        return '—';
      }

      if (p < 0.001) {
        return '<0.001';
      }

      return p.toFixed(3);
    }

    /************************************************************
     * GOOGLE SHEETS JSONP + CACHE FALLBACK
     ************************************************************/

    function loadSheetQuery(query) {
      return new Promise((resolve, reject) => {
        const callbackName =
          'pffRegressionCallback_' +
          Date.now() +
          '_' +
          Math.floor(Math.random() * 1000000);

        const script =
          document.createElement('script');

        const timeout =
          window.setTimeout(() => {
            cleanup();
            reject(new Error('Could not load Google Sheet data'));
          }, 20000);

        function cleanup() {
          window.clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = response => {
          cleanup();

          if (!response || response.status === 'error') {
            reject(
              new Error(
                response?.errors?.[0]?.detailed_message ||
                'Could not load Google Sheet data'
              )
            );
            return;
          }

          resolve(response?.table?.rows || []);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('Network error loading Google Sheet data'));
        };

        const params =
          new URLSearchParams({
            sheet: SHEET_NAME,
            headers: '1',
            tq: query,
            tqx: `responseHandler:${callbackName}`,
            _: String(Date.now())
          });

        script.src =
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
          params.toString();

        document.body.appendChild(script);
      });
    }

    function loadCachedRawRows() {
      return new Promise((resolve, reject) => {
        if (!CACHE_WEB_APP_URL) {
          reject(new Error('Cached-data service is not configured'));
          return;
        }

        const callbackName =
          'pffRegressionCacheCallback_' +
          Date.now() +
          '_' +
          Math.floor(Math.random() * 1000000);

        const script =
          document.createElement('script');

        let finished =
          false;

        const timer =
          window.setTimeout(() => {
            finish(new Error('Cached-data service timed out'));
          }, CACHE_FETCH_TIMEOUT_MS);

        function cleanup() {
          window.clearTimeout(timer);

          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        function finish(error, value) {
          if (finished) {
            return;
          }

          finished = true;
          cleanup();

          if (error) {
            reject(error);
          } else {
            resolve(value);
          }
        }

        window[callbackName] = response => {
          if (!response || response.ok === false) {
            finish(
              new Error(
                response?.message ||
                'Cached-data service returned an error'
              )
            );
            return;
          }

          if (
            !Array.isArray(response.data?.rows) ||
            !response.data.rows.length
          ) {
            finish(new Error('The cached-data response has no survey rows'));
            return;
          }

          const rows =
            response.data.rows.map(row => ({
              c: [
                { v: row?.[0] ?? '' },
                { v: row?.[1] ?? '' },
                { v: row?.[2] ?? '' },
                { v: row?.[3] ?? '' }
              ]
            }));

          finish(null, rows);
        };

        script.onerror = () => {
          finish(new Error('Could not load the cached-data service'));
        };

        const params =
          new URLSearchParams({
            appKey: CACHE_APP_KEY,
            callback: callbackName,
            _: String(Date.now())
          });

        const separator =
          CACHE_WEB_APP_URL.includes('?')
            ? '&'
            : '?';

        script.src =
          `${CACHE_WEB_APP_URL}${separator}${params.toString()}`;

        document.body.appendChild(script);
      });
    }

    async function loadRawRowsWithFallback() {
      let liveError =
        null;

      if (!FORCE_CACHED_DATA) {
        try {
          const rows =
            await loadSheetQuery(RAW_QUERY);

          if (!rows.length) {
            throw new Error('No valid live survey rows found');
          }

          setDataSource('live');
          return rows;
        } catch (error) {
          liveError = error;
          console.warn('Live workplace data could not be used', error);
        }
      }

      try {
        const rows =
          await loadCachedRawRows();

        if (!rows.length) {
          throw new Error('No valid cached survey rows found');
        }

        setDataSource('cached');
        console.warn(
          'Using cached workplace survey data',
          liveError?.message
        );

        return rows;
      } catch (cachedError) {
        setDataSource('none');
        console.error('Live data error', liveError);
        console.error('Cached data error', cachedError);
        throw new Error('Live and cached workplace data are currently unavailable');
      }
    }

    /************************************************************
     * FACTOR NORMALISATION
     ************************************************************/

    function normaliseFactorText(value) {
      return String(value || '')
        .toLowerCase()
        .normalize('NFKD')
        .replace(/[’‘]/g, "'")
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function getFactorKey(value) {
      const text =
        normaliseFactorText(value);

      if (
        !text ||
        text === 'none' ||
        text === 'nil' ||
        text === 'no factors' ||
        text === 'no factor' ||
        text === 'nothing'
      ) {
        return null;
      }

      if (
        text.includes('pay') ||
        text.includes('bonus') ||
        text.includes('remuneration')
      ) {
        return 'pay';
      }

      if (
        text.includes('work life') ||
        text.includes('worklife') ||
        text.includes('flexib')
      ) {
        return 'worklife';
      }

      if (
        text.includes('autonomy') ||
        text.includes('professional growth') ||
        text.includes('professional development')
      ) {
        return 'autonomy';
      }

      if (
        text.includes('support') ||
        (text.includes('team') && text.includes('management'))
      ) {
        return 'support';
      }

      if (
        text.includes('staffing') ||
        text.includes('workload')
      ) {
        return 'workload';
      }

      if (
        text.includes('equipment') ||
        text.includes('technology') ||
        text === 'tech'
      ) {
        return 'tech';
      }

      return null;
    }

    function getEndorsedFactorKeys(value) {
      const factorKeys =
        new Set();

      const rawText =
        String(value || '').trim();

      if (!rawText) {
        return factorKeys;
      }

      rawText
        .split(/[;,|\n]+/)
        .forEach(factor => {
          const factorKey =
            getFactorKey(factor);

          if (factorKey) {
            factorKeys.add(factorKey);
          }
        });

      if (!factorKeys.size) {
        FACTORS.forEach(factor => {
          const normalisedLabel =
            normaliseFactorText(factor.label);

          const normalisedWhole =
            normaliseFactorText(rawText);

          if (
            normalisedWhole.includes(normalisedLabel) ||
            getFactorKey(rawText) === factor.key
          ) {
            factorKeys.add(factor.key);
          }
        });
      }

      return factorKeys;
    }

    function normaliseObservations(rows) {
      const observations =
        [];

      rows.forEach(row => {
        const timestamp =
          getCellValue(row?.c?.[0]);

        const employer =
          String(getCellValue(row?.c?.[1]) || '').trim();

        const score =
          toNumber(getCellValue(row?.c?.[2]));

        const rawFactors =
          getCellValue(row?.c?.[3]);

        if (
          !employer ||
          !Number.isFinite(score) ||
          score < 0 ||
          score > 10
        ) {
          return;
        }

        const endorsed =
          getEndorsedFactorKeys(rawFactors);

        const predictors =
          FACTORS.map(factor =>
            endorsed.has(factor.key) ? 1 : 0
          );

        observations.push({
          timestamp,
          employer,
          score,
          predictors
        });
      });

      return observations;
    }

    /************************************************************
     * MATRIX HELPERS
     ************************************************************/

    function zeros(rows, cols) {
      return Array.from(
        { length: rows },
        () => Array(cols).fill(0)
      );
    }

    function transpose(matrix) {
      if (!matrix.length) {
        return [];
      }

      return matrix[0].map(
        (_, columnIndex) =>
          matrix.map(row => row[columnIndex])
      );
    }

    function matrixMultiply(a, b) {
      const rows =
        a.length;

      const inner =
        b.length;

      const cols =
        b[0].length;

      const out =
        zeros(rows, cols);

      for (let i = 0; i < rows; i++) {
        for (let k = 0; k < inner; k++) {
          const aik = a[i][k];

          for (let j = 0; j < cols; j++) {
            out[i][j] += aik * b[k][j];
          }
        }
      }

      return out;
    }

    function matrixVectorMultiply(matrix, vector) {
      return matrix.map(row =>
        row.reduce(
          (sum, value, index) =>
            sum + value * vector[index],
          0
        )
      );
    }

    function dot(a, b) {
      let sum = 0;

      for (let i = 0; i < a.length; i++) {
        sum += a[i] * b[i];
      }

      return sum;
    }

    function invertMatrix(matrix) {
      const n =
        matrix.length;

      if (!n || matrix.some(row => row.length !== n)) {
        throw new Error('Matrix must be square');
      }

      const augmented =
        matrix.map((row, i) => [
          ...row.map(value => Number(value)),
          ...Array.from(
            { length: n },
            (_, j) => i === j ? 1 : 0
          )
        ]);

      for (let column = 0; column < n; column++) {
        let pivotRow =
          column;

        let pivotMagnitude =
          Math.abs(augmented[column][column]);

        for (let row = column + 1; row < n; row++) {
          const magnitude =
            Math.abs(augmented[row][column]);

          if (magnitude > pivotMagnitude) {
            pivotMagnitude = magnitude;
            pivotRow = row;
          }
        }

        if (pivotMagnitude < 1e-11) {
          throw new Error('Predictors are perfectly collinear or lack variation');
        }

        if (pivotRow !== column) {
          [augmented[column], augmented[pivotRow]] =
            [augmented[pivotRow], augmented[column]];
        }

        const pivot =
          augmented[column][column];

        for (let j = 0; j < 2 * n; j++) {
          augmented[column][j] /= pivot;
        }

        for (let row = 0; row < n; row++) {
          if (row === column) {
            continue;
          }

          const factor =
            augmented[row][column];

          if (Math.abs(factor) < 1e-18) {
            continue;
          }

          for (let j = 0; j < 2 * n; j++) {
            augmented[row][j] -= factor * augmented[column][j];
          }
        }
      }

      return augmented.map(row => row.slice(n));
    }

    function mean(values) {
      return values.reduce((sum, value) => sum + value, 0) /
        values.length;
    }

    /************************************************************
     * DISTRIBUTION FUNCTIONS
     ************************************************************/

    function logGamma(z) {
      const coefficients = [
        676.5203681218851,
        -1259.1392167224028,
        771.32342877765313,
        -176.61502916214059,
        12.507343278686905,
        -0.13857109526572012,
        9.9843695780195716e-6,
        1.5056327351493116e-7
      ];

      if (z < 0.5) {
        return Math.log(Math.PI) -
          Math.log(Math.sin(Math.PI * z)) -
          logGamma(1 - z);
      }

      let x =
        0.99999999999980993;

      z -= 1;

      for (let i = 0; i < coefficients.length; i++) {
        x += coefficients[i] / (z + i + 1);
      }

      const t =
        z + coefficients.length - 0.5;

      return 0.5 * Math.log(2 * Math.PI) +
        (z + 0.5) * Math.log(t) -
        t +
        Math.log(x);
    }

    function betaContinuedFraction(a, b, x) {
      const maxIterations = 200;
      const epsilon = 3e-14;
      const fpMin = 1e-300;

      const qab = a + b;
      const qap = a + 1;
      const qam = a - 1;

      let c = 1;
      let d = 1 - qab * x / qap;

      if (Math.abs(d) < fpMin) {
        d = fpMin;
      }

      d = 1 / d;
      let h = d;

      for (let m = 1; m <= maxIterations; m++) {
        const m2 = 2 * m;

        let aa =
          m * (b - m) * x /
          ((qam + m2) * (a + m2));

        d = 1 + aa * d;
        if (Math.abs(d) < fpMin) d = fpMin;

        c = 1 + aa / c;
        if (Math.abs(c) < fpMin) c = fpMin;

        d = 1 / d;
        h *= d * c;

        aa =
          -(a + m) * (qab + m) * x /
          ((a + m2) * (qap + m2));

        d = 1 + aa * d;
        if (Math.abs(d) < fpMin) d = fpMin;

        c = 1 + aa / c;
        if (Math.abs(c) < fpMin) c = fpMin;

        d = 1 / d;

        const delta =
          d * c;

        h *= delta;

        if (Math.abs(delta - 1) < epsilon) {
          break;
        }
      }

      return h;
    }

    function regularizedIncompleteBeta(x, a, b) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;

      const logTerm =
        logGamma(a + b) -
        logGamma(a) -
        logGamma(b) +
        a * Math.log(x) +
        b * Math.log(1 - x);

      const bt =
        Math.exp(logTerm);

      if (x < (a + 1) / (a + b + 2)) {
        return bt * betaContinuedFraction(a, b, x) / a;
      }

      return 1 -
        bt * betaContinuedFraction(b, a, 1 - x) / b;
    }

    function studentTCdf(t, degreesOfFreedom) {
      if (!Number.isFinite(t)) {
        return t < 0 ? 0 : 1;
      }

      const df =
        degreesOfFreedom;

      const x =
        df / (df + t * t);

      const ibeta =
        regularizedIncompleteBeta(
          x,
          df / 2,
          0.5
        );

      if (t >= 0) {
        return 1 - 0.5 * ibeta;
      }

      return 0.5 * ibeta;
    }

    function twoSidedTPValue(t, degreesOfFreedom) {
      const cdf =
        studentTCdf(
          Math.abs(t),
          degreesOfFreedom
        );

      return clamp(
        2 * (1 - cdf),
        0,
        1
      );
    }

    function studentTCritical975(degreesOfFreedom) {
      let low = 0;
      let high = 20;

      for (let i = 0; i < 80; i++) {
        const mid =
          (low + high) / 2;

        if (studentTCdf(mid, degreesOfFreedom) < 0.975) {
          low = mid;
        } else {
          high = mid;
        }
      }

      return (low + high) / 2;
    }

    function regularizedGammaQ(a, x) {
      if (x < 0 || a <= 0) {
        return NaN;
      }

      if (x === 0) {
        return 1;
      }

      const epsilon =
        1e-14;

      const fpMin =
        1e-300;

      if (x < a + 1) {
        let sum =
          1 / a;

        let term =
          sum;

        let ap =
          a;

        for (let n = 1; n <= 200; n++) {
          ap += 1;
          term *= x / ap;
          sum += term;

          if (Math.abs(term) < Math.abs(sum) * epsilon) {
            break;
          }
        }

        const p =
          sum *
          Math.exp(
            -x +
            a * Math.log(x) -
            logGamma(a)
          );

        return clamp(1 - p, 0, 1);
      }

      let b =
        x + 1 - a;

      let c =
        1 / fpMin;

      let d =
        1 / b;

      let h =
        d;

      for (let i = 1; i <= 200; i++) {
        const an =
          -i * (i - a);

        b += 2;
        d = an * d + b;

        if (Math.abs(d) < fpMin) {
          d = fpMin;
        }

        c = b + an / c;

        if (Math.abs(c) < fpMin) {
          c = fpMin;
        }

        d = 1 / d;

        const delta =
          d * c;

        h *= delta;

        if (Math.abs(delta - 1) < epsilon) {
          break;
        }
      }

      return clamp(
        Math.exp(
          -x +
          a * Math.log(x) -
          logGamma(a)
        ) * h,
        0,
        1
      );
    }

    function chiSquareSurvival(statistic, degreesOfFreedom) {
      if (!Number.isFinite(statistic) || statistic < 0) {
        return NaN;
      }

      return regularizedGammaQ(
        degreesOfFreedom / 2,
        statistic / 2
      );
    }

    /************************************************************
     * OLS + HC3 ROBUST INFERENCE
     ************************************************************/

    function fitOls(X, y) {
      const n =
        X.length;

      const k =
        X[0].length;

      const Xt =
        transpose(X);

      const XtX =
        matrixMultiply(Xt, X);

      const XtXInverse =
        invertMatrix(XtX);

      const Xty =
        Xt.map(column => dot(column, y));

      const beta =
        matrixVectorMultiply(XtXInverse, Xty);

      const fitted =
        X.map(row => dot(row, beta));

      const residuals =
        y.map((value, i) => value - fitted[i]);

      const yMean =
        mean(y);

      const sse =
        residuals.reduce(
          (sum, residual) => sum + residual * residual,
          0
        );

      const sst =
        y.reduce(
          (sum, value) => {
            const delta = value - yMean;
            return sum + delta * delta;
          },
          0
        );

      const r2 =
        sst > 0
          ? 1 - sse / sst
          : 0;

      const leverage =
        X.map(row => {
          const transformed =
            matrixVectorMultiply(XtXInverse, row);

          return clamp(
            dot(row, transformed),
            0,
            0.999999999
          );
        });

      return {
        n,
        k,
        beta,
        fitted,
        residuals,
        sse,
        r2,
        leverage,
        XtXInverse
      };
    }

    function calculateHc3Covariance(model, X) {
      const k =
        model.k;

      const meat =
        zeros(k, k);

      for (let i = 0; i < model.n; i++) {
        const denominator =
          Math.max(
            1e-8,
            1 - model.leverage[i]
          );

        const adjustedResidual =
          model.residuals[i] / denominator;

        const weight =
          adjustedResidual * adjustedResidual;

        for (let a = 0; a < k; a++) {
          for (let b = 0; b < k; b++) {
            meat[a][b] +=
              X[i][a] * X[i][b] * weight;
          }
        }
      }

      return matrixMultiply(
        matrixMultiply(
          model.XtXInverse,
          meat
        ),
        model.XtXInverse
      );
    }

    function calculateInference(model, X) {
      const covariance =
        calculateHc3Covariance(model, X);

      const df =
        model.n - model.k;

      const critical =
        studentTCritical975(df);

      return model.beta.map((coefficient, index) => {
        const variance =
          Math.max(
            0,
            covariance[index][index]
          );

        const se =
          Math.sqrt(variance);

        const t =
          se > 0
            ? coefficient / se
            : coefficient === 0
              ? 0
              : coefficient > 0
                ? Infinity
                : -Infinity;

        const p =
          twoSidedTPValue(t, df);

        return {
          coefficient,
          se,
          t,
          p,
          lower: coefficient - critical * se,
          upper: coefficient + critical * se
        };
      });
    }

    /************************************************************
     * MODEL CHECKS
     ************************************************************/

    function calculateVifs(X) {
      const predictorCount =
        X[0].length - 1;

      const vifs =
        [];

      for (let target = 1; target <= predictorCount; target++) {
        const y =
          X.map(row => row[target]);

        const targetMean =
          mean(y);

        const targetSst =
          y.reduce((sum, value) => {
            const delta = value - targetMean;
            return sum + delta * delta;
          }, 0);

        if (targetSst < 1e-12) {
          vifs.push(Infinity);
          continue;
        }

        const auxX =
          X.map(row => [
            1,
            ...row
              .slice(1)
              .filter((_, index) => index !== target - 1)
          ]);

        try {
          const model =
            fitOls(auxX, y);

          const denominator =
            Math.max(
              1e-12,
              1 - model.r2
            );

          vifs.push(1 / denominator);
        } catch (_) {
          vifs.push(Infinity);
        }
      }

      return vifs;
    }

    function breuschPaganTest(model, X) {
      const squaredResiduals =
        model.residuals.map(value => value * value);

      try {
        const auxiliary =
          fitOls(X, squaredResiduals);

        const statistic =
          model.n * Math.max(0, auxiliary.r2);

        const degreesOfFreedom =
          X[0].length - 1;

        return {
          statistic,
          degreesOfFreedom,
          p: chiSquareSurvival(
            statistic,
            degreesOfFreedom
          )
        };
      } catch (_) {
        return {
          statistic: NaN,
          degreesOfFreedom: X[0].length - 1,
          p: NaN
        };
      }
    }

    function jarqueBeraTest(residuals) {
      const n =
        residuals.length;

      const residualMean =
        mean(residuals);

      let m2 = 0;
      let m3 = 0;
      let m4 = 0;

      residuals.forEach(value => {
        const delta =
          value - residualMean;

        const delta2 =
          delta * delta;

        m2 += delta2;
        m3 += delta2 * delta;
        m4 += delta2 * delta2;
      });

      m2 /= n;
      m3 /= n;
      m4 /= n;

      if (m2 < 1e-15) {
        return {
          statistic: 0,
          p: 1
        };
      }

      const skewness =
        m3 / Math.pow(m2, 1.5);

      const kurtosis =
        m4 / (m2 * m2);

      const statistic =
        n / 6 *
        (
          skewness * skewness +
          Math.pow(kurtosis - 3, 2) / 4
        );

      return {
        statistic,
        p: chiSquareSurvival(statistic, 2)
      };
    }

    function calculateInfluence(model) {
      const mse =
        model.sse /
        Math.max(1, model.n - model.k);

      const cookThreshold =
        4 / model.n;

      let influentialCount =
        0;

      if (mse <= 0) {
        return {
          cookThreshold,
          influentialCount
        };
      }

      for (let i = 0; i < model.n; i++) {
        const h =
          model.leverage[i];

        const denominator =
          Math.max(
            1e-10,
            (1 - h) * (1 - h)
          );

        const cooksDistance =
          (
            model.residuals[i] * model.residuals[i] /
            (model.k * mse)
          ) *
          (h / denominator);

        if (cooksDistance > cookThreshold) {
          influentialCount += 1;
        }
      }

      return {
        cookThreshold,
        influentialCount
      };
    }

    function runModelChecks(model, X) {
      const vifs =
        calculateVifs(X);

      const maxVif =
        Math.max(...vifs);

      const bp =
        breuschPaganTest(model, X);

      const jb =
        jarqueBeraTest(model.residuals);

      const influence =
        calculateInfluence(model);

      const issues =
        [];

      if (!Number.isFinite(maxVif) || maxVif >= 10) {
        issues.push('high collinearity');
      } else if (maxVif >= 5) {
        issues.push('moderate collinearity');
      }

      /*
       * Heteroskedasticity and residual non-normality are reported
       * in the diagnostic tooltip but do not automatically make the
       * public summary look problematic: displayed inference already
       * uses HC3 robust standard errors.
       */
      if (
        influence.influentialCount >
        Math.max(3, Math.ceil(model.n * 0.10))
      ) {
        issues.push('many potential influential observations');
      }

      return {
        vifs,
        maxVif,
        bp,
        jb,
        influence,
        issues
      };
    }

    /************************************************************
     * MODEL ASSEMBLY
     ************************************************************/

    function buildDesignMatrix(observations) {
      const X =
        observations.map(observation => [
          1,
          ...observation.predictors
        ]);

      const y =
        observations.map(observation => observation.score);

      return { X, y };
    }

    function validatePredictorVariation(observations) {
      const missingVariation =
        [];

      FACTORS.forEach((factor, index) => {
        const values =
          observations.map(
            observation => observation.predictors[index]
          );

        const hasZero =
          values.some(value => value === 0);

        const hasOne =
          values.some(value => value === 1);

        if (!hasZero || !hasOne) {
          missingVariation.push(factor.label);
        }
      });

      return missingVariation;
    }

    function analyseObservations(observations) {
      const parameterCount =
        FACTORS.length + 1;

      if (observations.length <= parameterCount + 2) {
        throw new Error(
          `Not enough usable responses to fit the adjusted model yet (n=${observations.length}).`
        );
      }

      const missingVariation =
        validatePredictorVariation(observations);

      if (missingVariation.length) {
        throw new Error(
          'The adjusted model cannot be estimated yet because these factors do not have both endorsed and non-endorsed responses: ' +
          missingVariation.join(', ')
        );
      }

      const { X, y } =
        buildDesignMatrix(observations);

      const model =
        fitOls(X, y);

      const inference =
        calculateInference(model, X);

      const checks =
        runModelChecks(model, X);

      const effects =
        FACTORS.map((factor, index) => ({
          ...factor,
          ...inference[index + 1]
        }));

      return {
        model,
        inference,
        checks,
        effects
      };
    }

    function updateIntroScrollCues() {
      if (!introScrollShell || !introScroll) {
        return;
      }

      const maxScroll =
        Math.max(0, introScroll.scrollWidth - introScroll.clientWidth);

      const tolerance =
        2;

      introScrollShell.classList.toggle(
        'can-scroll-left',
        introScroll.scrollLeft > tolerance
      );

      introScrollShell.classList.toggle(
        'can-scroll-right',
        introScroll.scrollLeft < maxScroll - tolerance
      );
    }


    /************************************************************
     * DISPLAY
     ************************************************************/

    function effectDisplayText(effect) {
      if (!(effect.p < 0.05)) {
        return 'Not significant';
      }

      const magnitude =
        formatTrimmed(
          Math.abs(effect.coefficient),
          2
        );

      if (effect.coefficient > 0) {
        return `+${magnitude} points`;
      }

      if (effect.coefficient < 0) {
        return `−${magnitude} points lower`;
      }

      return '0 points';
    }

    function effectTooltipText(effect) {
      return (
        `${formatSigned(effect.coefficient)} ` +
        `(95% CI; ${formatCIBound(effect.lower)}, ${formatCIBound(effect.upper)}), ` +
        formatPValue(effect.p)
      );
    }

    function renderResults(analysis) {
      resultsElement.innerHTML = '';

      const sortedEffects =
        [...analysis.effects].sort(
          (a, b) => b.coefficient - a.coefficient
        );

      sortedEffects.forEach((effect, index) => {
        const row =
          document.createElement('li');

        row.className =
          'result-row';

        const rank =
          document.createElement('span');

        rank.className =
          'factor-rank';

        rank.textContent =
          `${index + 1})`;

        const label =
          document.createElement('span');

        label.className =
          'factor-name';

        label.textContent =
          effect.label;

        const trigger =
          document.createElement('button');

        trigger.type =
          'button';

        trigger.className =
          'effect-trigger';

        trigger.textContent =
          effectDisplayText(effect);

        trigger.dataset.tooltip =
          effectTooltipText(effect);

        trigger.setAttribute(
          'aria-label',
          `${effect.label}: ${trigger.textContent}. ${trigger.dataset.tooltip}`
        );

        row.appendChild(rank);
        row.appendChild(label);
        row.appendChild(trigger);
        resultsElement.appendChild(row);
      });

    }

    /************************************************************
     * TOOLTIP INTERACTION
     ************************************************************/

    function positionTooltip(trigger) {
      const margin =
        8;

      const gap =
        7;

      const triggerRect =
        trigger.getBoundingClientRect();

      const tooltipRect =
        tooltip.getBoundingClientRect();

      let left =
        triggerRect.left +
        triggerRect.width / 2 -
        tooltipRect.width / 2;

      left =
        clamp(
          left,
          margin,
          window.innerWidth - tooltipRect.width - margin
        );

      let top =
        triggerRect.top - tooltipRect.height - gap;

      if (top < margin) {
        top =
          triggerRect.bottom + gap;
      }

      top =
        clamp(
          top,
          margin,
          window.innerHeight - tooltipRect.height - margin
        );

      tooltip.style.left =
        `${left}px`;

      tooltip.style.top =
        `${top}px`;
    }

    function showTooltip(trigger) {
      const text =
        trigger?.dataset?.tooltip;

      if (!text) {
        return;
      }

      if (
        activeTooltipTrigger &&
        activeTooltipTrigger !== trigger
      ) {
        activeTooltipTrigger.classList.remove('is-open');
      }

      activeTooltipTrigger =
        trigger;

      trigger.classList.add('is-open');

      tooltip.textContent =
        text;

      tooltip.classList.add('is-visible');

      requestAnimationFrame(() => {
        positionTooltip(trigger);
      });
    }

    function hideTooltip() {
      if (activeTooltipTrigger) {
        activeTooltipTrigger.classList.remove('is-open');
      }

      activeTooltipTrigger =
        null;

      tooltip.classList.remove('is-visible');
    }

    document.addEventListener('pointerover', event => {
      if (event.pointerType === 'touch') {
        return;
      }

      const trigger =
        event.target.closest('[data-tooltip]');

      if (trigger) {
        showTooltip(trigger);
      }
    });

    document.addEventListener('pointerout', event => {
      if (event.pointerType === 'touch') {
        return;
      }

      const trigger =
        event.target.closest('[data-tooltip]');

      if (
        trigger &&
        !trigger.contains(event.relatedTarget)
      ) {
        hideTooltip();
      }
    });

    document.addEventListener('focusin', event => {
      const trigger =
        event.target.closest('[data-tooltip]');

      if (trigger) {
        showTooltip(trigger);
      }
    });

    document.addEventListener('focusout', event => {
      const trigger =
        event.target.closest('[data-tooltip]');

      if (trigger) {
        hideTooltip();
      }
    });

    document.addEventListener('click', event => {
      const trigger =
        event.target.closest('[data-tooltip]');

      if (!trigger) {
        hideTooltip();
        return;
      }

      if (
        activeTooltipTrigger === trigger &&
        tooltip.classList.contains('is-visible')
      ) {
        hideTooltip();
      } else {
        showTooltip(trigger);
      }
    });

    window.addEventListener('resize', () => {
      if (activeTooltipTrigger) {
        positionTooltip(activeTooltipTrigger);
      }
    });

    if (introScroll) {
      introScroll.addEventListener(
        'scroll',
        updateIntroScrollCues,
        { passive: true }
      );
    }

    window.addEventListener(
      'resize',
      updateIntroScrollCues
    );

    requestAnimationFrame(
      updateIntroScrollCues
    );


    window.addEventListener('scroll', () => {
      if (activeTooltipTrigger) {
        positionTooltip(activeTooltipTrigger);
      }
    }, true);

    /************************************************************
     * START
     ************************************************************/

    async function initialise() {
      try {
        setStatus('');

        const rawRows =
          await loadRawRowsWithFallback();

        const observations =
          normaliseObservations(rawRows);

        if (!observations.length) {
          throw new Error('No usable workplace survey responses were found');
        }

        const analysis =
          analyseObservations(observations);

        renderResults(analysis);
      } catch (error) {
        console.error(error);
        setStatus(
          error?.message ||
          'Unable to analyse workplace survey data right now'
        );
      } finally {
        hideLoadingState();
      }
    }

    initialise();
  </script>
</body>
</html>
