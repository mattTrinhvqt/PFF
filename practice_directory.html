<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Optometry Practice Directory</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="./assets/pff_chart_core.js?v=1.2.11-20260917"></script>

  <style>
    :root {
      --directory-corporate: #00b26f;
      --directory-independent: #5a3be7;
      --directory-other: #8b9099;
      --directory-track: #f0f2f5;
      --directory-row-line: #f8f9fa;
      --directory-first-column: 168px;
    }

    body {
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: none;
      padding: 2px 4px 8px;
    }

    #status {
      min-height: 0;
      padding: 0 3px;
      color: var(--pff-error);
      font-size: 10px;
      line-height: 1.3;
    }

    #status:empty {
      display: none;
    }

    .directory-topbar {
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding: 3px 3px 5px;
    }

    .search-control {
      position: relative;
      display: flex;
      min-width: 230px;
      max-width: 560px;
      flex: 1 1 360px;
      align-items: center;
      min-height: 31px;
      padding: 0 7px;
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      transition:
        border-color 140ms ease,
        box-shadow 140ms ease;
    }

    .search-control:focus-within {
      border-color: var(--pff-ink);
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .search-icon {
      flex: 0 0 auto;
      margin-right: 5px;
      color: var(--pff-muted);
      font-size: 13px;
      line-height: 1;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      height: 28px;
      padding: 0;
      color: var(--pff-ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-family: Lato, Arial, sans-serif;
      font-size: 11px;
      line-height: 1;
    }

    .search-input::placeholder {
      color: var(--pff-muted);
      opacity: 0.86;
    }

    .search-clear {
      display: none;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      padding: 0;
      color: var(--pff-muted);
      background: transparent;
      border: 0;
      border-radius: 50%;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    .search-clear.is-visible {
      display: inline-flex;
    }

    .search-clear:hover {
      color: var(--pff-ink);
      background: var(--pff-track);
    }

    .live-data-inline {
      flex: 0 0 auto;
    }

    .controls-scroll-shell {
      position: relative;
      width: 100%;
      min-width: 0;
      padding: 0 3px 5px;
      border-bottom: 1px solid var(--pff-track);
    }

    .controls-scroller {
      min-width: 0;
      overflow: visible;
    }

    .controls {
      display: flex;
      width: 100%;
      min-width: 0;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }

    .controls-scroll-arrow {
      top: 1px;
    }

    .filter-control {
      position: relative;
      z-index: 45;
      flex: 0 0 auto;
    }

    .filter-button,
    .reset-button {
      min-height: 31px;
      padding: 0 5px;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      box-shadow: none;
      font-family: Lato, Arial, sans-serif;
      cursor: pointer;
      transition:
        border-color 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease;
    }

    .filter-button:hover,
    .filter-button[aria-expanded="true"],
    .reset-button:hover {
      box-shadow: inset 0 0 0 1px rgba(21, 21, 21, 0.12);
    }

    .filter-button:focus-visible,
    .reset-button:focus-visible,
    .search-clear:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .multi-filter-button {
      display: grid;
      grid-template-columns: max-content 58px 8px;
      align-items: center;
      gap: 4px;
    }

    #state-button {
      min-width: 124px;
    }

    #ownership-button {
      min-width: 148px;
      grid-template-columns: max-content 68px 8px;
    }

    #rurality-button {
      min-width: 206px;
      grid-template-columns: max-content 60px 8px;
    }

    #phn-button {
      min-width: 132px;
      grid-template-columns: max-content 58px 8px;
    }

    #specialty-button {
      min-width: 178px;
      grid-template-columns: max-content 62px 8px;
    }

    #reset-filters {
      min-width: 94px;
    }

    .filter-label-wrap {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 1px;
      text-align: left;
    }

    .filter-label {
      color: var(--pff-ink);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.05;
      white-space: nowrap;
    }

    .filter-subtext {
      color: var(--pff-muted);
      font-size: 8px;
      font-weight: 400;
      line-height: 1.05;
      white-space: nowrap;
    }

    .filter-value {
      display: inline-block;
      width: 58px;
      min-width: 58px;
      color: var(--pff-purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.025em;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }

    .menu-arrow {
      width: 0;
      height: 0;
      min-width: 0;
      flex: 0 0 auto;
      border-top: 4px solid var(--pff-muted);
      border-right: 4px solid transparent;
      border-left: 4px solid transparent;
      transition: transform 140ms ease;
    }

    .filter-button[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    .reset-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--pff-muted);
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
    }

    .reset-button:hover {
      color: var(--pff-ink);
      border-color: var(--pff-ink);
    }

    .reset-icon {
      display: inline-block;
      color: var(--pff-purple);
      font-size: 15px;
      line-height: 1;
    }

    .filter-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 70;
      display: none;
      min-width: 164px;
      max-height: min(430px, 70vh);
      overflow-y: auto;
      padding: 5px 0;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(21, 21, 21, 0.12);
      text-align: left;
      overscroll-behavior: contain;
    }

    #ownership-menu {
      min-width: 180px;
    }

    #rurality-menu,
    #specialty-menu {
      min-width: 218px;
    }

    #phn-menu {
      min-width: 290px;
    }

    .filter-menu.is-open {
      display: block;
    }

    .filter-menu-title {
      position: sticky;
      top: -5px;
      z-index: 2;
      margin: 0;
      padding: 6px 10px 7px;
      color: var(--pff-muted);
      background: var(--pff-white);
      border-bottom: 1px solid var(--pff-track);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .filter-option {
      display: flex;
      min-height: 32px;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      color: var(--pff-ink);
      background: var(--pff-white);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.25;
      cursor: pointer;
      user-select: none;
    }

    .filter-option:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .filter-option input {
      width: 14px;
      height: 14px;
      min-width: 14px;
      max-width: 14px;
      flex: 0 0 14px;
      margin: 0;
      accent-color: var(--pff-purple);
      cursor: pointer;
    }

    .filter-option-all {
      color: var(--pff-ink);
      border-bottom: 1px solid var(--pff-track);
      font-weight: 700;
    }

    .filter-option-count {
      margin-left: auto;
      color: var(--pff-muted);
      font-size: 10px;
      font-weight: 400;
    }

    .ownership-corporate { color: var(--directory-corporate); font-weight: 700; }
    .ownership-independent { color: var(--directory-independent); font-weight: 700; }
    .ownership-other { color: var(--directory-other); font-weight: 700; }

    .state-option-code {
      min-width: 30px;
      font-weight: 700;
    }

    .state-filter-nsw { color: var(--pff-state-nsw); }
    .state-filter-vic { color: var(--pff-state-vic); }
    .state-filter-qld { color: var(--pff-state-qld); }
    .state-filter-sa { color: var(--pff-state-sa); }
    .state-filter-wa { color: var(--pff-state-wa); }
    .state-filter-tas { color: var(--pff-state-tas); }
    .state-filter-nt { color: var(--pff-state-nt); }
    .state-filter-act { color: var(--pff-state-act); }

    .table-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: var(--pff-white);
      border-top: 0;
      border-bottom: 1px solid var(--directory-track);
      border-radius: 0;
      box-shadow: none;
      isolation: isolate;
    }

    .table-shell::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--directory-first-column);
      z-index: 12;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        rgba(21, 21, 21, 0.16) 10%,
        var(--pff-ink) 18%,
        rgba(21, 21, 21, 0.16) 78%,
        #fff 100%
      );
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
    }

    .data-table {
      width: max-content;
      min-width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    .data-table thead {
      position: sticky;
      top: 0;
      z-index: 7;
      background: var(--pff-white);
    }

    .data-table thead::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 13;
      height: 1px;
      background: var(--pff-ink);
      pointer-events: none;
    }

    .sticky-table-header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 40;
      display: none;
      overflow: hidden;
      background: var(--pff-white);
      pointer-events: none;
    }

    .sticky-table-header.is-visible {
      display: block;
    }

    .sticky-table-header-scroll {
      width: 100%;
      overflow: hidden;
    }

    .sticky-table-header .data-table thead {
      position: relative;
      top: auto;
    }

    .sticky-table-header .data-table th {
      background: var(--pff-white);
    }

    .data-table th,
    .data-table td {
      position: relative;
      min-width: 0;
      padding: 6px;
      overflow: hidden;
      color: var(--pff-ink);
      border-right: 1px solid var(--directory-track);
      border-bottom: 1px solid var(--directory-row-line);
      line-height: 1.2;
      text-align: left;
      text-overflow: ellipsis;
      vertical-align: middle;
      white-space: nowrap;
    }

    .data-table th {
      color: var(--pff-muted);
      background: var(--pff-white);
      border-bottom: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .data-table td {
      background: var(--pff-white);
      font-size: 12px;
      font-weight: 400;
    }

    .data-table th:last-child,
    .data-table td:last-child {
      border-right: 0;
    }

    .data-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .data-table tbody tr:hover td {
      filter: brightness(0.988);
    }

    .data-table th[data-key="practiceName"],
    .data-table td[data-key="practiceName"] {
      position: sticky;
      left: 0;
      z-index: 5;
      width: var(--directory-first-column);
      min-width: var(--directory-first-column);
      max-width: var(--directory-first-column);
      padding-right: 5px;
      padding-left: 5px;
      background: var(--pff-white);
      background-clip: padding-box;
      font-weight: 700;
    }

    .data-table th[data-key="practiceName"] {
      z-index: 11;
    }

    .sort-button {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0;
      color: inherit;
      background: transparent;
      border: 0;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .sort-button:hover .sort-label {
      color: var(--pff-ink);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .sort-indicator {
      min-width: 8px;
      color: var(--pff-purple);
      font-size: 9px;
      text-align: right;
    }

    .practice-link {
      display: block;
      max-width: 100%;
      overflow: hidden;
      color: var(--pff-purple);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      text-overflow: ellipsis;
      white-space: nowrap;
      -webkit-user-drag: none;
    }

    .practice-link:hover {
      text-decoration-thickness: 2px;
    }

    .specialty-yes {
      color: var(--pff-purple);
      font-weight: 700;
    }

    .specialty-no {
      color: var(--pff-muted);
    }

    .employer-brand-known {
      font-weight: 700;
    }

    .has-full-text {
      cursor: default;
    }

    .has-full-text:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: -2px;
    }

    .full-text-popover {
      position: fixed;
      z-index: 200;
      display: none;
      max-width: min(320px, calc(100vw - 16px));
      padding: 7px 9px;
      color: var(--pff-ink);
      background: var(--pff-white);
      border: 1px solid var(--pff-track);
      border-radius: 4px;
      box-shadow: 0 7px 20px rgba(21, 21, 21, 0.16);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    .full-text-popover.is-visible {
      display: block;
    }

    .empty-state {
      display: none;
      width: 100%;
      padding: 34px 12px;
      color: var(--pff-muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .empty-state.is-visible {
      display: block;
    }

    @media (max-width: 900px) {
      .directory-topbar {
        align-items: stretch;
        flex-wrap: wrap;
      }

      .search-control {
        max-width: none;
      }

      .controls-scroller {
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 2px;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .controls-scroller::-webkit-scrollbar {
        display: none;
      }

      .controls {
        width: max-content;
        min-width: 100%;
        flex-wrap: nowrap;
        justify-content: flex-start;
      }

      .filter-menu {
        position: fixed;
        top: 8px;
        right: auto;
        left: 8px;
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);
      }
    }

    @media (max-width: 700px) {
      #app {
        padding-right: 2px;
        padding-left: 2px;
      }

      .directory-topbar,
      .controls-scroll-shell {
        padding-right: 2px;
        padding-left: 2px;
      }

      .search-control {
        min-width: calc(100% - 86px);
        min-height: 29px;
      }

      .search-input {
        font-size: 10px;
      }

      .controls {
        gap: 4px;
      }

      .filter-button,
      .reset-button {
        min-height: 27px;
      }

      .filter-label {
        font-size: 9px;
      }

      .filter-subtext {
        font-size: 7px;
      }

      .filter-value {
        font-size: 9px;
      }

      #state-button { min-width: 112px; }
      #ownership-button { min-width: 138px; }
      #rurality-button { min-width: 190px; }
      #phn-button { min-width: 120px; }
      #specialty-button { min-width: 164px; }

      .data-table th,
      .data-table td {
        padding: 5px;
      }

      .data-table th,
      .data-table td,
      .full-text-popover {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app" class="pff-app is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading optometry practice directory"
      >
        <div class="cone-loader" aria-hidden="true">
          <div class="cone blue"></div>
          <div class="cone green"></div>
          <div class="cone red"></div>
        </div>
        <div class="loader-text">Loading practice directory…</div>
      </div>

      <div class="directory-topbar">
        <div class="search-control">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search practice, suburb, address, ownership, rurality or PHN"
            aria-label="Search practice directory"
          >
          <button
            id="searchClear"
            class="search-clear"
            type="button"
            aria-label="Clear search"
          >×</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data live-data-inline"
          aria-label="Live data"
          aria-live="polite"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="alert" aria-live="polite"></div>

      <div class="controls-scroll-shell">
        <div class="controls-scroller">
          <div class="controls" aria-label="Practice directory filters">
            <div id="stateControl" class="filter-control">
              <button
                id="state-button"
                class="filter-button multi-filter-button"
                type="button"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="state-menu"
              >
                <span class="filter-label-wrap">
                  <span class="filter-label">State</span>
                </span>
                <span id="state-value" class="filter-value">ALL</span>
                <span class="menu-arrow" aria-hidden="true"></span>
              </button>

              <div id="state-menu" class="filter-menu" role="group" aria-label="State filters">
                <p class="filter-menu-title">Show states</p>
                <label class="filter-option filter-option-all">
                  <input id="state-all" type="checkbox" checked>
                  <span>All states</span>
                  <span id="state-all-count" class="filter-option-count"></span>
                </label>
                <label class="filter-option state-filter-nsw"><input class="state-filter" type="checkbox" value="NSW" checked><span class="state-option-code">NSW</span><span data-count-for="state:NSW" class="filter-option-count"></span></label>
                <label class="filter-option state-filter-vic"><input class="state-filter" type="checkbox" value="VIC" checked><span class="state-option-code">VIC</span><span data-count-for="state:VIC" class="filter-option-count"></span></label>
                <label class="filter-option state-filter-qld"><input class="state-filter" type="checkbox" value="QLD" checked><span class="state-option-code">QLD</span><span data-count-for="state:QLD" class="filter-option-count"></span></label>
                <label class="filter-option state-filter-sa"><input class="state-filter" type="checkbox" value="SA" checked><span class="state-option-code">SA</span><span data-count-for="state:SA" class="filter-option-count"></span></label>
                <label class="filter-option state-filter-wa"><input class="state-filter" type="checkbox" value="WA" checked><span class="state-option-code">WA</span><span data-count-for="state:WA" class="filter-option-count"></span></label>
                <label class="filter-option state-filter-tas"><input class="state-filter" type="checkbox" value="TAS" checked><span class="state-option-code">TAS</span><span data-count-for="state:TAS" class="filter-option-count"></span></label>
                <label class="filter-option state-filter-nt"><input class="state-filter" type="checkbox" value="NT" checked><span class="state-option-code">NT</span><span data-count-for="state:NT" class="filter-option-count"></span></label>
                <label class="filter-option state-filter-act"><input class="state-filter" type="checkbox" value="ACT" checked><span class="state-option-code">ACT</span><span data-count-for="state:ACT" class="filter-option-count"></span></label>
              </div>
            </div>

            <div id="ownershipControl" class="filter-control">
              <button
                id="ownership-button"
                class="filter-button multi-filter-button"
                type="button"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="ownership-menu"
              >
                <span class="filter-label-wrap">
                  <span class="filter-label">Ownership</span>
                </span>
                <span id="ownership-value" class="filter-value">ALL</span>
                <span class="menu-arrow" aria-hidden="true"></span>
              </button>

              <div id="ownership-menu" class="filter-menu" role="group" aria-label="Ownership filters">
                <p class="filter-menu-title">Show ownership</p>
                <label class="filter-option filter-option-all">
                  <input id="ownership-all" type="checkbox" checked>
                  <span>All ownership</span>

    function cleanText(value) {
      return PFF.cleanText(value);
    }

    function normaliseSearchText(value) {
      return PFF.normaliseText(value)
        .replace(/[^a-z0-9]+/g, '');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function safeExternalUrl(value) {
      const raw = cleanText(value);

      if (!raw) {
        return '';
      }

      try {
        const url = new URL(
          raw,
          window.location.href
        );

        return (
          url.protocol === 'https:' ||
          url.protocol === 'http:'
        )
          ? url.href
          : '';
      } catch (_) {
        return '';
      }
    }

    function mapUrlForRow(row) {
      const supplied =
        safeExternalUrl(row.mapsUrl);

      if (supplied) {
        return supplied;
      }

      const latitude =
        Number(row.latitude);

      const longitude =
        Number(row.longitude);

      if (
        Number.isFinite(latitude) &&
        Number.isFinite(longitude)
      ) {
        return (
          'https://www.google.com/maps?q=' +
          encodeURIComponent(
            `${latitude},${longitude}`
          )
        );
      }

      const query = [
        row.practiceName,
        row.address,
        row.suburb,
        row.state,
        row.postcode
      ]
        .filter(Boolean)
        .join(', ');

      return query
        ? (
            'https://www.google.com/maps/search/?api=1&query=' +
            encodeURIComponent(query)
          )
        : '';
    }

    function normaliseOwnership(value) {
      const text =
        cleanText(value).toLowerCase();

      if (!text) {
        return null;
      }

      if (
        text === 'corporate' ||
        text.startsWith('corporate ')
      ) {
        return 'Corporate';
      }

      if (
        text === 'independent' ||
        text.startsWith('independent ')
      ) {
        return 'Independent';
      }

      return 'Other';
    }

    function isYes(value) {
      return /^y(?:es)?$/i.test(
        cleanText(value)
      );
    }

    function normaliseArrayRow(
      values,
      sourceIndex
    ) {
      if (
        !Array.isArray(values) ||
        values.length <
          CONFIG.sourceColumnCount
      ) {
        return null;
      }

      const row = {};

      SOURCE_KEYS.forEach(
        (key, index) => {
          row[key] =
            cleanText(values[index]);
        }
      );

      if (!row.practiceName) {
        return null;
      }

      row.sourceIndex =
        sourceIndex;

      row.stateCode =
        PFF.normaliseState(row.state);

      row.ownershipCode =
        normaliseOwnership(
          row.employerType
        );

      row.mmmCode =
        PFF.normaliseMMM(row.mmm);

      row.phnCode =
        cleanText(row.phn);

      row.specialties = {
        dryEye:
          isYes(row.dryEye),

        contactLenses:
          isYes(row.contactLenses),

        paediatric:
          isYes(row.paediatric)
      };

      row.searchText =
        PFF.normaliseText(
          [
            row.practiceName,
            row.address,
            row.suburb,
            row.state,
            row.postcode,
            row.brandParent,
            row.employer,
            row.employerType,
            row.mmm,
            row.phn
          ].join(' ')
        );

      row.compactSearchText =
        normaliseSearchText(
          row.searchText
        );

      return row;
    }

    function parseLiveTable(table) {
      return (table?.rows || [])
        .map(
          (rawRow, sourceIndex) => {
            const cells =
              rawRow?.c || [];

            const values =
              Array.from(
                {
                  length:
                    CONFIG.sourceColumnCount
                },
                (_, index) =>
                  PFF.cellValue(
                    cells[index]
                  )
              );

            const row =
              normaliseArrayRow(
                values,
                sourceIndex
              );

            return row
              ? SOURCE_KEYS.map(
                  key => row[key]
                )
              : null;
          }
        )
        .filter(Boolean);
    }

    function parseRemoteCache(payload) {
      const rows =
        Array.isArray(
          payload?.data?.rows
        )
          ? payload.data.rows
          : [];

      return rows
        .map(
          (values, sourceIndex) => {
            const row =
              normaliseArrayRow(
                values,
                sourceIndex
              );

            return row
              ? SOURCE_KEYS.map(
                  key => row[key]
                )
              : null;
          }
        )
        .filter(Boolean);
    }

    function restoreRows(rows) {
      return (rows || [])
        .map(
          (values, sourceIndex) => {
            if (Array.isArray(values)) {
              return normaliseArrayRow(
                values,
                sourceIndex
              );
            }

            return normaliseArrayRow(
              SOURCE_KEYS.map(
                key => values?.[key] ?? ''
              ),
              sourceIndex
            );
          }
        )
        .filter(Boolean);
    }

    function setLoadedSourceIndicator(loaded) {
      if (loaded?.source === 'live') {
        PFF.setDataSourceIndicator(
          'live',
          {
            indicator:
              dataSourceIndicator,
            text:
              dataSourceText
          }
        );

        dataSourceText.textContent =
          'LIVE data';

        return;
      }

      if (
        loaded?.source === 'cached' &&
        loaded?.remote
      ) {
        PFF.setDataSourceIndicator(
          'cached',
          {
            indicator:
              dataSourceIndicator,
            text:
              dataSourceText
          }
        );

        dataSourceText.textContent =
          'BACKEND cache';

        dataSourceIndicator.setAttribute(
          'aria-label',
          'Backend cached data'
        );

        return;
      }

      if (loaded?.source === 'cached') {
        PFF.setDataSourceIndicator(
          'cached',
          {
            indicator:
              dataSourceIndicator,
            text:
              dataSourceText
          }
        );

        dataSourceText.textContent =
          'BROWSER cache';

        dataSourceIndicator.setAttribute(
          'aria-label',
          'Browser cached data'
        );

        return;
      }

      PFF.setDataSourceIndicator(
        'unavailable',
        {
          indicator:
            dataSourceIndicator,
          text:
            dataSourceText
        }
      );
    }

    function countBy(
      rows,
      getter
    ) {
      const counts =
        new Map();

      rows.forEach(
        row => {
          const key =
            getter(row);

          if (!key) {
            return;
          }

          counts.set(
            key,
            (counts.get(key) || 0) + 1
          );
        }
      );

      return counts;
    }

    function setCountText(
      selector,
      value
    ) {
      const element =
        document.querySelector(selector);

      if (element) {
        element.textContent =
          Number.isFinite(value)
            ? PFF.formatInteger(value)
            : '';
      }
    }

    function phnSortIndex(value) {
      const index =
        PHN_CANONICAL_ORDER.indexOf(value);

      return index >= 0
        ? index
        : Number.MAX_SAFE_INTEGER;
    }

    function derivePHNValues() {
      const values =
        Array.from(
          new Set(
            sourceRows
              .map(row => row.phnCode)
              .filter(Boolean)
          )
        );

      values.sort(
        (first, second) => {
          const firstIndex =
            phnSortIndex(first);

          const secondIndex =
            phnSortIndex(second);

          if (firstIndex !== secondIndex) {
            return firstIndex - secondIndex;
          }

          return first.localeCompare(
            second,
            'en-AU',
            {
              numeric:
                true,
              sensitivity:
                'base'
            }
          );
        }
      );

      phnValues =
        values;

      selectedPHNs.clear();

      phnValues.forEach(
        value =>
          selectedPHNs.add(value)
      );
    }

    function renderRuralityOptions() {

    function updateFilterCounts() {
      const stateCounts =
        countBy(
          sourceRows,
          row => row.stateCode
        );

      const ownershipCounts =
        countBy(
          sourceRows,
          row => row.ownershipCode
        );

      const mmmCounts =
        countBy(
          sourceRows,
          row => row.mmmCode
        );

      const phnCounts =
        countBy(
          sourceRows,
          row => row.phnCode
        );

      STATES.forEach(
        value => {
          setCountText(
            `[data-count-for="state:${value}"]`,
            stateCounts.get(value) || 0
          );
        }
      );

      OWNERSHIP_TYPES.forEach(
        value => {
          setCountText(
            `[data-count-for="ownership:${value}"]`,
            ownershipCounts.get(value) || 0
          );
        }
      );

      MMM_VALUES.forEach(
        value => {
          setCountText(
            `[data-count-for="mmm:${value}"]`,
            mmmCounts.get(value) || 0
          );
        }
      );

      phnOptions
        .querySelectorAll(
          '[data-phn-count]'
        )
        .forEach(
          element => {
            const value =
              element.dataset.phnCount || '';

            element.textContent =
              PFF.formatInteger(
                phnCounts.get(value) || 0
              );
          }
        );

      [
        'dryEye',
        'contactLenses',
        'paediatric'
      ].forEach(
        value => {
          setCountText(
            `[data-count-for="specialty:${value}"]`,
            sourceRows.filter(
              row =>
                row.specialties[value]
            ).length
          );
        }
      );

      const total =
        PFF.formatInteger(
          sourceRows.length
        );

      document.getElementById(
        'state-all-count'
      ).textContent = total;

      document.getElementById(
        'ownership-all-count'
      ).textContent = total;

      document.getElementById(
        'rurality-all-count'

      document.getElementById(
        'phn-all-count'
      ).textContent = total;

      document.getElementById(
        'specialty-all-count'
      ).textContent = total;
    }

      selectedCheckboxValues(
        '.ownership-filter'
      ).forEach(
        value =>
          selectedOwnershipTypes.add(value)
      );

      selectedMMM.clear();
      selectedCheckboxValues(
        '.rurality-filter'
      ).forEach(
        value =>
          selectedMMM.add(value)
      );

      selectedPHNs.clear();
      selectedCheckboxValues(
        '.phn-filter'
      ).forEach(
        value =>
          selectedPHNs.add(value)
      );

      requiredSpecialties.clear();
      selectedCheckboxValues(
        '.specialty-filter'
      ).forEach(
        value =>
          requiredSpecialties.add(value)
      );
    }

    function updateAllCheckbox(
      allId,
      selector
    ) {
      const all =
        document.getElementById(allId);

      const items = [
        ...document.querySelectorAll(
          selector
        )
      ];

      const checked =
        items.filter(
          item => item.checked
        ).length;

      all.checked =
        items.length > 0 &&
        checked === items.length;

      all.indeterminate =
        checked > 0 &&
        checked < items.length;
    }

    function compactSelectionLabel(
      selectedCount,
      totalCount,
      allLabel = 'ALL'
    ) {
      if (selectedCount === totalCount) {
        return allLabel;
      }

      if (selectedCount === 0) {
        return 'NONE';
      }

      if (selectedCount === 1) {
        return '1 selected';
      }

      return `${selectedCount} selected`;
    }

    function animateFilterValue(
      id,
      text
    ) {
      const element =
        document.getElementById(id);

      if (!element) {
        return;
      }

      if (
        element.textContent === text ||
        PFF.reducedMotion()
      ) {
        element.textContent = text;
        return;
      }

      PFF.animateHeading({
        fixed:
          element,
        fixedText:
          text,
        duration:
          180
      });
    }

    function updateFilterButtonLabels() {
      animateFilterValue(
        'state-value',
        compactSelectionLabel(
          selectedStates.size,
          STATES.length
        )
      );

      animateFilterValue(
        'ownership-value',
        compactSelectionLabel(
          selectedOwnershipTypes.size,
          OWNERSHIP_TYPES.length
        )
      );

      animateFilterValue(
        'rurality-value',
        compactSelectionLabel(
          selectedMMM.size,
          MMM_VALUES.length
        )
      );

      animateFilterValue(
        'phn-value',
        compactSelectionLabel(
          selectedPHNs.size,
          phnValues.length
        )
      );

      animateFilterValue(
        'specialty-value',
        requiredSpecialties.size
          ? `${requiredSpecialties.size} req.`
          : 'ANY'
      );
    }

    function specialtyRequirementsMet(row) {
      for (
        const specialty of
        requiredSpecialties
      ) {
        if (!row.specialties[specialty]) {
          return false;
        }
      }

      return true;
    }

    function compareValues(
      first,
      second,
      key
    ) {
      if (key === 'state') {
        const firstIndex =
          STATES.indexOf(
            first.stateCode
          );

        const secondIndex =
          STATES.indexOf(
            second.stateCode
          );

        return (
          (firstIndex < 0 ? 999 : firstIndex) -
          (secondIndex < 0 ? 999 : secondIndex)
        );
      }

      if (key === 'mmm') {
        const firstMMM =
          first.mmmCode || 'ZZ';

        const secondMMM =
          second.mmmCode || 'ZZ';

        return firstMMM.localeCompare(
          secondMMM,
          'en-AU',
          {
            numeric:
              true
          }
        );
      }

      if (key === 'employerType') {
        const firstOwnership =
          first.ownershipCode || 'ZZ';

        const secondOwnership =
          second.ownershipCode || 'ZZ';

        return firstOwnership.localeCompare(
          secondOwnership,
          'en-AU',
          {
            numeric:
              true,
            sensitivity:
              'base'
          }
        );
      }

      const firstValue =
        cleanText(first[key]);

      const secondValue =
        cleanText(second[key]);

      if (key === 'postcode') {
        const firstNumber =
          Number(firstValue);

        const secondNumber =
          Number(secondValue);

        if (
          Number.isFinite(firstNumber) &&
          Number.isFinite(secondNumber)
        ) {
          return firstNumber - secondNumber;
        }
      }

      return firstValue.localeCompare(
        secondValue,
        'en-AU',
        {
          numeric:
            true,
          sensitivity:
            'base'
        }
      );
    }

    function applyFilters() {
      const search =
        PFF.normaliseText(
          searchInput.value
        );

      const compactSearch =
        normaliseSearchText(
          searchInput.value
        );

      filteredRows =
        sourceRows
          .filter(
            row => {
              if (
                search &&
                !row.searchText.includes(search) &&
                !row.compactSearchText.includes(
                  compactSearch
                )
              ) {
                return false;
              }

              if (
                selectedStates.size !==
                  STATES.length &&
                !selectedStates.has(
                  row.stateCode
                )
              ) {
                return false;
              }

              if (
                selectedOwnershipTypes.size !==
                  OWNERSHIP_TYPES.length &&
                !selectedOwnershipTypes.has(
                  row.ownershipCode
                )
              ) {
                return false;
              }

              if (
                selectedMMM.size !==
                  MMM_VALUES.length &&
                !selectedMMM.has(
                  row.mmmCode
                )
              ) {
                return false;
              }

              if (
                selectedPHNs.size !==
                  phnValues.length &&
                !selectedPHNs.has(
                  row.phnCode
                )
              ) {
                return false;
              }

              return specialtyRequirementsMet(
                row
              );
            }
          )
          .sort(
            (first, second) => {
              const comparison =
                compareValues(
                  first,
                  second,
                  sortKey
                );

              if (comparison !== 0) {
                return sortDirection === 'asc'
                  ? comparison
                  : -comparison;
              }

              return (
                first.sourceIndex -
                second.sourceIndex
              );
            }
          );
    }

    function ownershipClass(value) {
      const ownership =
        normaliseOwnership(value);

      if (!ownership) {
        return '';
      }

      return (
        'ownership-' +
        ownership
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
      );
    }

    function formatCell(
      row,
      column
    ) {
      const value =
        row[column.key];

      if (column.key === 'practiceName') {
        const url =
          mapUrlForRow(row);

        return url
          ? `
              <a
                class="practice-link"
                href="${escapeHtml(url)}"
                target="_blank"
                rel="noopener"
                aria-label="Open ${escapeHtml(row.practiceName)} in Google Maps"
                title="${escapeHtml(row.practiceName)}"
              >${escapeHtml(row.practiceName)}</a>
            `
          : escapeHtml(
              row.practiceName || '—'
            );
      }

      if (column.key === 'state') {
        const state =
          row.stateCode;

        const colour =
          state
            ? PFF.stateColours?.[state]
            : '';

        return `
          <span style="${colour ? `color:${escapeHtml(colour)};font-weight:700;` : ''}">
            ${escapeHtml(state || value || '—')}
          </span>
        `;
      }

      if (column.key === 'mmm') {
        const mmm =
          row.mmmCode;

        const colour =
          mmm
            ? PFF.mmmColours?.[mmm]
            : '';

        return `
          <span style="${colour ? `color:${escapeHtml(colour)};font-weight:700;` : ''}">
            ${escapeHtml(mmm || value || '—')}
          </span>
        `;
      }

      if (column.key === 'employerType') {
        const ownership =
          row.ownershipCode;

        return `
          <span class="${ownershipClass(value)}">
            ${escapeHtml(ownership || value || '—')}
          </span>
        `;
      }

      if (column.key === 'brandParent') {
        const appearance =
          PFF.getEmployerAppearance(
            value,
            {
              fallbackLabel:
                value,
              fallbackColour:
                ''
            }
          );

        const style =
          appearance?.matched &&
          appearance.colour
            ? `color:${escapeHtml(appearance.colour)};`
            : '';

        return `
          <span
            class="${appearance?.matched ? 'employer-brand-known' : ''}"
            style="${style}"
          >${escapeHtml(value || '—')}</span>
        `;
      }

      if (
        [
          'dryEye',
          'contactLenses',
          'paediatric'
        ].includes(column.key)
      ) {
        const yes =
          isYes(value);

        return `
          <span
            class="${yes ? 'specialty-yes' : 'specialty-no'}"
            aria-label="${yes ? 'Yes' : 'No'}"
          >${yes ? '✓' : '×'}</span>
        `;
      }

      return escapeHtml(
        value || '—'
      );
    }

    function headerLabel(column) {
      if (column.key === 'practiceName') {
        return (
          `Practice (total = ${PFF.formatInteger(sourceRows.length)})`
        );
      }

      return column.label;
    }

    function renderHeader(columns) {
      const tableWidth =
        columns.reduce(
          (total, column) => total + column.width,
          0
        );

      tableColgroup.innerHTML =
        columns
          .map(
            column =>
              `<col style="width:${column.width}px;min-width:${column.width}px;max-width:${column.width}px;">`
          )
          .join('');

      dataTable.style.width =
        `${tableWidth}px`;

      dataTable.style.minWidth =
        `${tableWidth}px`;

      tableHead.innerHTML = `
        <tr>
          ${columns.map(
            column => {
              const active =
                sortKey === column.key;

              const ariaSort =
                active
                  ? (
                      sortDirection === 'asc'
                        ? 'ascending'
                        : 'descending'
                    )
                  : 'none';

              return `
                <th
                  data-key="${column.key}"
                  scope="col"
                  aria-sort="${ariaSort}"
                >
                  <button
                    class="sort-button"
                    type="button"
                    data-sort-key="${column.key}"
                    aria-label="Sort by ${escapeHtml(headerLabel(column))}"
                  >
                    <span class="sort-label">${escapeHtml(headerLabel(column))}</span>
                    <span class="sort-indicator" aria-hidden="true">${active ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</span>
                  </button>
                </th>
              `;
            }
          ).join('')}
        </tr>
      `;
    }

    function renderRows(columns) {
      tableBody.innerHTML =
        filteredRows
          .map(
            row => `
              <tr>
                ${columns.map(
                  column => {
                    const raw =
                      column.key === 'mmm'
                        ? (row.mmmCode || row.mmm || '')
                        : column.key === 'employerType'
                          ? (row.ownershipCode || row.employerType || '')
                          : row[column.key] || '';

                    const fullText =
                      cleanText(raw);

                    const popoverAttrs =
                      fullText
                        ? (
                            ` class="has-full-text" tabindex="0" data-full-text="${escapeHtml(fullText)}" title="${escapeHtml(fullText)}"`
                          )
                        : '';

                    return `
                      <td
                        data-key="${column.key}"
                        ${popoverAttrs}
                      >${formatCell(row, column)}</td>
                    `;
                  }
                ).join('')}
              </tr>
            `
          )
          .join('');

      const hasRows =
        filteredRows.length > 0;

      tableScroll.style.display =
        hasRows
          ? ''
          : 'none';

      emptyState.classList.toggle(
        'is-visible',
        !hasRows
      );
    }

    function syncStickyHeaderGeometry() {
      stickyHeaderController.sync();

      const sourceHeaders = [
        ...tableHead.querySelectorAll('th')
      ];

      const stickyCols = [
        ...stickyHeaderTable.querySelectorAll('colgroup col')
      ];

      sourceHeaders.forEach(
        (header, index) => {
          const width =
            header.getBoundingClientRect().width;

          const stickyCol =
            stickyCols[index];

          if (
            !stickyCol ||
            !Number.isFinite(width) ||
            width <= 0
          ) {
            return;
          }

          const pixelWidth =
            `${width}px`;

          stickyCol.style.width =
            pixelWidth;

          stickyCol.style.minWidth =
            pixelWidth;

          stickyCol.style.maxWidth =
            pixelWidth;
        }
      );

      const renderedWidth =
        dataTable.getBoundingClientRect().width;

      if (
        Number.isFinite(renderedWidth) &&
        renderedWidth > 0
      ) {
        const pixelWidth =
          `${renderedWidth}px`;

        stickyHeaderTable.style.width =
          pixelWidth;

        stickyHeaderTable.style.minWidth =
          pixelWidth;
      }

      stickyHeaderController.update();
    }

    function renderTable() {
      renderHeader(
        COLUMN_CONFIG
      );

      renderRows(
        COLUMN_CONFIG
      );

      requestAnimationFrame(
        syncStickyHeaderGeometry
      );

      controlsScrollController.update();
    }

    function scheduleRender() {
      if (renderFrame !== null) {
        cancelAnimationFrame(
          renderFrame
        );
      }

      renderFrame =
        requestAnimationFrame(
          () => {
            renderFrame = null;
            applyFilters();
            renderTable();
          }
        );
    }

    function handleFilterChange() {
      syncSelectedSetsFromControls();

      updateAllCheckbox(
        'state-all',
        '.state-filter'
      );

      updateAllCheckbox(
        'ownership-all',
        '.ownership-filter'
      );

      updateAllCheckbox(
        'rurality-all',
        '.rurality-filter'
      );

      updateAllCheckbox(
        'phn-all',
        '.phn-filter'
      );

      const specialtyInputs = [
        ...document.querySelectorAll(
          '.specialty-filter'
        )
      ];

      const specialtyAll =
        document.getElementById(
          'specialty-all'
        );

      specialtyAll.checked =
        specialtyInputs.every(
          input => !input.checked
        );

      specialtyAll.indeterminate =
        false;

      updateFilterButtonLabels();
      scheduleRender();
    }

    function setupAllCheckbox(
      allId,
      itemSelector,
      emptyMeansAll = false
    ) {
      const all =
        document.getElementById(allId);

      all.addEventListener(
        'change',
        () => {
          const items = [
            ...document.querySelectorAll(
              itemSelector
            )
          ];

          if (emptyMeansAll) {
            items.forEach(
              item => {
                item.checked = false;
              }
            );

            all.checked = true;
          } else {
            items.forEach(
              item => {
                item.checked =
                  all.checked;
              }
            );
          }

          handleFilterChange();
        }
      );
    }

    function setupDelegatedFilter(
      container,
      itemSelector,
      allId,
      emptyMeansAll = false
    ) {
      container.addEventListener(
        'change',
        event => {
          const item =
            event.target.closest(
              itemSelector
            );

          if (!item) {
            return;
          }

          if (emptyMeansAll && item.checked) {
            document.getElementById(
              allId
            ).checked = false;
          }

          handleFilterChange();
        }
      );
    }

    function setupMenus() {
      [
        [
          'stateControl',
          'state-button',
          'state-menu'
        ],
        [
          'ownershipControl',
          'ownership-button',
          'ownership-menu'
        ],
        [
          'ruralityControl',
          'rurality-button',
          'rurality-menu'
        ],
        [
          'phnControl',
          'phn-button',
          'phn-menu'
        ],
        [
          'specialtyControl',
          'specialty-button',
          'specialty-menu'
        ]
      ].forEach(
        ([menuId, buttonId, panelId]) => {
          menuControllers[menuId] =
            PFF.setupMenu({
              menu:
                document.getElementById(
                  menuId
                ),

              button:
                document.getElementById(
                  buttonId
                ),

              panel:
                document.getElementById(
                  panelId
                ),

              focusOnOpen:
                false
            });
        }
      );
    }

    function resetFilters() {
      searchInput.value = '';

      searchClear.classList.remove(
        'is-visible'
      );

      document.querySelectorAll(
        '.state-filter, .ownership-filter, .rurality-filter, .phn-filter'
      ).forEach(
        input => {
          input.checked = true;
        }
      );

      document.querySelectorAll(
        '.specialty-filter'
      ).forEach(
        input => {
          input.checked = false;
        }
      );

      [
        'state-all',
        'ownership-all',
        'rurality-all',
        'phn-all',
        'specialty-all'
      ].forEach(
        id => {
          const checkbox =
            document.getElementById(id);

          checkbox.checked = true;
          checkbox.indeterminate = false;
        }
      );

      syncSelectedSetsFromControls();
      updateFilterButtonLabels();
      scheduleRender();
    }

    function handleSortRequest(event) {
      const button =
        event.target.closest(
          '[data-sort-key]'
        );

      if (!button) {
        return;
      }

      const key =
        button.dataset.sortKey;

      if (sortKey === key) {
        sortDirection =
          sortDirection === 'asc'
            ? 'desc'
            : 'asc';
      } else {
        sortKey = key;
        sortDirection = 'asc';
      }

      scheduleRender();
    }

    function setupInteractions() {
      renderRuralityOptions();
      setupMenus();

      setupAllCheckbox(
        'state-all',
        '.state-filter'
      );

      setupAllCheckbox(
        'ownership-all',
        '.ownership-filter'
      );

      setupAllCheckbox(
        'rurality-all',
        '.rurality-filter'
      );

      setupAllCheckbox(
        'phn-all',
        '.phn-filter'
      );

      setupAllCheckbox(
        'specialty-all',
        '.specialty-filter',
        true
      );

      document.querySelectorAll(
        '.state-filter, .ownership-filter, .specialty-filter'
      ).forEach(
        input => {
          input.addEventListener(
            'change',
            handleFilterChange
          );
        }
      );

      setupDelegatedFilter(
        ruralityOptions,
        '.rurality-filter',
        'rurality-all'
      );

      setupDelegatedFilter(
        phnOptions,
        '.phn-filter',
        'phn-all'
      );

      searchInput.addEventListener(
        'input',
        () => {
          searchClear.classList.toggle(
            'is-visible',
            Boolean(searchInput.value)
          );

          clearTimeout(
            searchTimer
          );

          searchTimer =
            setTimeout(
              () => scheduleRender(),
              120
            );
        }
      );

      searchClear.addEventListener(
        'click',
        () => {
          searchInput.value = '';

          searchClear.classList.remove(
            'is-visible'
          );

          searchInput.focus();
          scheduleRender();
        }
      );

      resetFiltersButton.addEventListener(
        'click',
        resetFilters
      );

      tableHead.addEventListener(
        'click',
        handleSortRequest
      );

    }

    setupInteractions();

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      loadLive() {
        return PFFCharts.loadGVizSheet({
          sheetId:
            CONFIG.spreadsheetId,

          sheetName:
            CONFIG.sheetName,

          range:
            CONFIG.sourceRange,

          headers:
            '1',

          timeoutMs:
            CONFIG.fetchTimeoutMs
        });
      },

      parseLive:
        parseLiveTable,

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,

          appKey:
            CONFIG.appKey,

          timeoutMs:
            CONFIG.cacheFetchTimeoutMs
        });
      },

      parseRemoteCache,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        CONFIG.minimumRows,

      forceCached:
        FORCE_CACHED_DATA,

      onLiveError(error) {
        console.warn(
          'Live practice-directory data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(error) {
        console.warn(
          'Practice-directory Apps Script cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,
        text:
          dataSourceText
      },

      render(loaded) {
        sourceRows =
          restoreRows(
            loaded.rows
          );

        if (
          sourceRows.length <
          CONFIG.minimumRows
        ) {
          throw new Error(
            'Practice directory did not contain enough usable rows.'
          );
        }

        setLoadedSourceIndicator(
          loaded
        );

        derivePHNValues();
        renderPHNOptions();

        document.querySelectorAll(
          '.rurality-filter, .phn-filter'
        ).forEach(
          input => {
            input.checked = true;
          }
        );

        syncSelectedSetsFromControls();
        updateFilterCounts();
        updateFilterButtonLabels();
        scheduleRender();

        requestAnimationFrame(
          () => {
            controlsScrollController.update();
            syncStickyHeaderGeometry();
          }
        );

        return dataTable;
      },

      onError() {
        setLoadedSourceIndicator({
          source:
            'unavailable'
        });
      },

      errorMessage:
        'Practice directory data are unavailable from the live sheet, backend cache and browser cache.'
    });
  </script>
</body>
</html>
