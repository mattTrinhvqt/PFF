      employerMap.forEach(
        employer => {
          employer.statistics =
            calculateScoreStatistics(
              employer.scores
            );
        }
      );


      return employerMap;
    }


    /************************************************************
     * FIXED AGGREGATE POSITIONS
     ************************************************************/

    function buildAggregatePositions(
      items
    ) {
      const groups =
        new Map();


      items.forEach(
        item => {
          const scoreKey =
            String(
              Number(
                item.score
              )
            );

          if (
            !groups.has(
              scoreKey
            )
          ) {
            groups.set(
              scoreKey,
              []
            );
          }

          groups
            .get(
              scoreKey
            )
            .push(
              item
            );
        }
      );


      const maximumGroupSize =
        Math.max(
          1,
          ...[
            ...groups.values()
          ].map(
            group =>
              group.length
          )
        );


      /*
       * Extra internal padding prevents large circles from
       * excessively crossing the y-axis or right chart boundary.
       */
      const leftPosition =
        20;

      const rightPosition =
        82;


      const sharedPositions =
        maximumGroupSize ===
          1
          ? [
              leftPosition
            ]
          : Array.from(
              {
                length:
                  maximumGroupSize
              },
              (
                _,
                index
              ) =>
                leftPosition +
                (
                  index /
                  (
                    maximumGroupSize -
                    1
                  )
                ) *
                (
                  rightPosition -
                  leftPosition
                )
            );


      const positions =
        new Map();


      groups.forEach(
        group => {
          group
            .slice()
            .sort(
              (
                first,
                second
              ) =>
                second.respondents -
                  first.respondents ||
                first.fullName.localeCompare(
                  second.fullName
                )
            )
            .forEach(
              (
                item,
                index
              ) => {
                positions.set(
                  item.canonicalKey,
                  sharedPositions[
                    index
                  ]
                );
              }
            );
        }
      );


      return positions;
    }

    /*
     * Assign nearby endorsement values to separate horizontal
     * lanes. Values separated by 5 percentage points or less
     * cannot occupy the same lane.
     */
    function buildProximityPositions(
      items,
      proximityThreshold =
        5
    ) {
      const sortedItems =
        items
          .slice()
          .sort(
            (
              first,
              second
            ) =>
              first.score -
                second.score ||
              second.respondents -
                first.respondents ||
              first.fullName.localeCompare(
                second.fullName
              )
          );

      /*
       * Each entry stores the most recent percentage occupying
       * that horizontal lane.
       */
      const laneLastScores =
        [];

      const laneAssignments =
        new Map();


      sortedItems.forEach(
        item => {
          let laneIndex =
            laneLastScores.findIndex(
              previousScore =>
                (
                  item.score -
                  previousScore
                ) >
                proximityThreshold
            );


          /*
           * Every existing lane contains another value within
           * five percentage points, so create a lane to the right.
           */
          if (
            laneIndex ===
            -1
          ) {
            laneIndex =
              laneLastScores.length;

            laneLastScores.push(
              item.score
            );
          } else {
            laneLastScores[
              laneIndex
            ] =
              item.score;
          }


          laneAssignments.set(
            item.canonicalKey,
            laneIndex
          );
        }
      );


      const laneCount =
        Math.max(
          1,
          laneLastScores.length
        );

      /*
       * Retain at least five possible positions so a second
       * nearby value moves only one position to the right rather
       * than jumping across the whole chart.
       */
      const positionCount =
        Math.max(
          5,
          laneCount
        );

      const leftPosition =
        20;

      const rightPosition =
        82;

      const sharedPositions =
        Array.from(
          {
            length:
              positionCount
          },
          (
            _,
            index
          ) =>
            leftPosition +
            (
              index /
              (
                positionCount -
                1
              )
            ) *
            (
              rightPosition -
              leftPosition
            )
        );

      const positions =
        new Map();


      laneAssignments.forEach(
        (
          laneIndex,
          employerKey
        ) => {
          positions.set(
            employerKey,
            sharedPositions[
              laneIndex
            ]
          );
        }
      );


      return positions;
    }
    
    function buildAggregatePoints(
      items
    ) {
      return items
        .map(
          item => {
            const metrics =
              {};


            VIEW_KEYS.forEach(
              viewKey => {
                if (
                  viewKey ===
                  'overall'
                ) {
                  metrics[
                    viewKey
                  ] = {
                    value:
                      item.score,

                    respondents:
                      item.respondents
                  };

                  return;
                }


                const viewItem =
                  viewEmployerData
                    .get(
                      viewKey
                    )
                    ?.get(
                      item.canonicalKey
                    );


                /*
                 * Preserve the existing fallback behaviour when a
                 * percentage row is unexpectedly missing.
                 */
                metrics[
                  viewKey
                ] = {
                  value:
                    clamp(
                      viewItem
                        ?.score ??
                      item.score *
                        10,
                      0,
                      100
                    ),

                  respondents:
                    viewItem
                      ?.respondents ??
                    item.respondents
                };
              }
            );


            return {
              kind:
                'aggregate',

              x:
                aggregatePositions.get(
                  item.canonicalKey
                ) ??
                20,

              y:
                0,

              targetY:
                item.score *
                10,

              metrics,

              currentMetricValue:
                item.score,

              currentRespondents:
                item.respondents,

              baseRadius:
                getBaseBubbleRadius(
                  item.respondents
                ),

              canonicalKey:
                item.canonicalKey,

              shortLabel:
                item.label,

              fullName:
                item.fullName,

              respondents:
                item.respondents,

              colour:
                item.colour,

              canSplit:
                Boolean(
                  rawEmployerData
                    .get(
                      item.canonicalKey
                    )
                    ?.scores
                    ?.length
                )
            };
          }
        )
        .sort(
          (
            first,
            second
          ) => {
            if (
              first.targetY !==
              second.targetY
            ) {
              return (
                second.targetY -
                first.targetY
              );
            }

            return (
              second.baseRadius -
              first.baseRadius
            );
          }
        );
    }
    function getAggregatePoint(
      employerKey
    ) {
      return aggregatePoints.find(
        point =>
          point.canonicalKey ===
          employerKey
      );
    }


    /************************************************************
     * RAW SCORE POINTS
     ************************************************************/

    function createRawEmployerPoints(
      aggregateItem,
      rawEmployer
    ) {
      const aggregateX =
        aggregatePositions.get(
          aggregateItem.canonicalKey
        ) ??
        20;

      const aggregateY =
        aggregateItem.score *
        10;

      const scoreGroups =
        new Map();


      rawEmployer.scores.forEach(
        score => {
          const scoreKey =
            String(
              score
            );

          if (
            !scoreGroups.has(
              scoreKey
            )
          ) {
            scoreGroups.set(
              scoreKey,
              []
            );
          }

          scoreGroups
            .get(
              scoreKey
            )
            .push(
              score
            );
        }
      );


      const points =
        [];


      scoreGroups.forEach(
        (
          scores,
          scoreKey
        ) => {
          const score =
            Number(
              scoreKey
            );

          const pointCount =
            scores.length;

          /*
           * Limit the horizontal spread equally on both sides of
           * the original aggregate position. This keeps every row
           * centred on the aggregate bubble's vertical axis.
           */
          const maximumHalfSpan =
            Math.max(
              0,
              Math.min(
                aggregateX -
                  14,
                88 -
                  aggregateX
              )
            );

          const span =
            Math.min(
              21,
              Math.max(
                0,
                (
                  pointCount -
                  1
                ) *
                2.35
              ),
              maximumHalfSpan *
                2
            );

          const startX =
            aggregateX -
            span /
              2;


          scores.forEach(
            (
              _,
              index
            ) => {
              const targetX =
                pointCount ===
                  1
                  ? aggregateX
                  : startX +
                    (
                      index /
                      (
                        pointCount -
                        1
                      )
                    ) *
                    span;


              points.push({
                kind:
                  'raw',

                x:
                  aggregateX,

                y:
                  aggregateY,

                targetX:
                  targetX,
                targetY:
                  score *
                  10,

                baseRadius:
                  RAW_POINT_RADIUS,

                canonicalKey:
                  aggregateItem.canonicalKey,

                fullName:
                  aggregateItem.fullName,

                colour:
                  aggregateItem.colour,

                rawScore:
                  score,

                scoreCount:
                  rawEmployer.statistics.count,

                median:
                  rawEmployer.statistics.median,

                q1:
                  rawEmployer.statistics.q1,

                q3:
                  rawEmployer.statistics.q3
              });
            }
          );
        }
      );


      return points;
    }


    /************************************************************
     * AGGREGATE VISIBILITY
     ************************************************************/

    function getAggregateVisibility(
      employerKey
    ) {
      if (
        splitProgress.has(
          employerKey
        )
      ) {
        return (
          1 -
          splitProgress.get(
            employerKey
          )
        );
      }

      if (
        mergingEmployers.has(
          employerKey
        )
      ) {
        return mergeProgress;
      }

      if (
        splitEmployers.has(
          employerKey
        )
      ) {
        return 0;
      }

      return 1;
    }


    function getAggregateRadius(
      chart,
      raw
    ) {
      if (
        !raw
      ) {
        return 0;
      }

      const visibility =
        getAggregateVisibility(
          raw.canonicalKey
        );

      if (
        visibility <=
        0.001
      ) {
        return 0;
      }

      return getDisplayedBubbleRadius(
        chart,
        raw
      );
    }


    /************************************************************
     * BUTTON STATE
     ************************************************************/

    function updateReaggregateButton() {
      const shouldShow =
        splitEmployers.size > 0 ||
        mergingEmployers.size > 0;


      reaggregateButton
        .classList
        .toggle(
          'is-hidden',
          !shouldShow
        );


      reaggregateButton.setAttribute(
        'aria-hidden',
        String(
          !shouldShow
        )
      );


      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;


      reaggregateButton.disabled =
        interactionLocked;
    }


    /************************************************************
     * Y-AXIS DESCRIPTIONS
     ************************************************************/

    const axisDescriptionPlugin = {
      id:
        'axisDescriptionPlugin',


      afterDraw(
        chart
      ) {
        const yScale =
          chart.scales.y;


        if (
          !yScale
        ) {
          return;
        }


        const context =
          chart.ctx;

        const tickLength =
          Number(
            yScale.options
              .grid
              ?.tickLength ??
            0
          );

        const tickPadding =
          Number(
            yScale.options
              .ticks
              ?.padding ??
            0
          );


        /*
         * Position the descriptions against the same right edge
         * as the normal numerical tick labels.
         */
        const textX =
          yScale.right -
          tickLength -
          tickPadding +
          1;


        const descriptions = [
          {
            value:
              0,

            text:
              '(not at all)',

            offsetY:
              -13
          },

          {
            value:
              50,

            text:
              '(unsure)',

            offsetY:
              13
          },

          {
            value:
              100,

            text:
              '(extremely)',

            offsetY:
              13
          }
        ];


        context.save();

        /*
         * Fade these labels out on Pay and back in on Overall.
         */
        context.globalAlpha =
          axisDescriptionOpacity;

        context.font =
          '400 10px Lato, sans-serif';

        context.fillStyle =
          '#69718a';

        context.textAlign =
          'right';

        context.textBaseline =
          'middle';


        descriptions.forEach(
          description => {
            context.fillText(
              description.text,
              textX,
              yScale.getPixelForValue(
                description.value
              ) +
              description.offsetY
            );
          }
        );


        context.restore();
      }
    };


    /************************************************************
     * BUBBLE LABELS
     ************************************************************/

    const bubbleLabelPlugin = {
      id:
        'bubbleLabelPlugin',


      afterDatasetDraw(
        chart,
        args
      ) {
        /*
         * Aggregate labels are drawn immediately after aggregate
         * circles. The raw dataset is then rendered over both.
         */
        if (
          args.index !== 0
        ) {
          return;
        }


        const context =
          chart.ctx;

        const dataset =
          chart.data
            .datasets[0];

        const metadata =
          chart.getDatasetMeta(
            0
          );


        metadata.data.forEach(
          (
            element,
            index
          ) => {
            const raw =
              dataset.data[
                index
              ];


            if (
              !raw ||
              !raw.shortLabel
            ) {
              return;
            }


            const visibility =
              getAggregateVisibility(
                raw.canonicalKey
              );

            /*
             * Gradually fade all remaining aggregate labels while
             * raw scores are displayed, then restore them during
             * re-aggregation.
             */
            const labelOpacity =
              1 +
              (
                DIMMED_AGGREGATE_LABEL_OPACITY -
                1
              ) *
              aggregateDimProgress;


            if (
              visibility <=
              0.02
            ) {
              return;
            }


            const radius =
              getDisplayedBubbleRadius(
                chart,
                raw
              );


            if (
              radius <=
              0
            ) {
              return;
            }


            /*
             * Keep every employer label the same readable size,
             * even when the text is larger than its bubble.
             */
            const fontSize =
              13;


            context.save();

            context.globalAlpha =
              visibility *
              labelOpacity;

            context.textAlign =
              'center';

            context.textBaseline =
              'middle';

            context.font =
              `700 ${fontSize}px Lato, sans-serif`;

            context.lineJoin =
              'round';

            context.lineWidth =
              Math.max(
                1.8,
                fontSize *
                  0.15
              );

            context.strokeStyle =
              'rgba(255, 255, 255, 0.94)';

            context.fillStyle =
              '#151515';


            context.strokeText(
              raw.shortLabel,
              element.x,
              element.y
            );

            context.fillText(
              raw.shortLabel,
              element.x,
              element.y
            );


            context.restore();
          }
        );
      }
    };

    /************************************************************
     * VIEW SWITCHING
     ************************************************************/

    function getViewTargets(
      point,
      view
    ) {
      const isOverall =
        view ===
        'overall';

      const metric =
        point.metrics
          ?.[view] ??
        point.metrics
          ?.overall;

      const positions =
        viewPositions.get(
          view
        ) ??
        aggregatePositions;

      const metricValue =
        metric
          ?.value ??
        0;

      const respondents =
        metric
          ?.respondents ??
        0;


      return {
        x:
          positions.get(
            point.canonicalKey
          ) ??
          aggregatePositions.get(
            point.canonicalKey
          ) ??
          point.x,

        y:
          isOverall
            ? metricValue *
              10
            : metricValue,

        radius:
          getBaseBubbleRadius(
            respondents
          ),

        metricValue,

        respondents
      };
    }

    function updateTabScrollHints() {
      if (
        !tabList ||
        !tabScrollShell
      ) {
        return;
      }

      const maximumScrollLeft =
        Math.max(
          0,
          tabList.scrollWidth -
            tabList.clientWidth
        );

      const tolerance =
        2;

      tabScrollShell.classList.toggle(
        'can-scroll-left',
        tabList.scrollLeft >
          tolerance
      );

      tabScrollShell.classList.toggle(
        'can-scroll-right',
        tabList.scrollLeft <
          maximumScrollLeft -
            tolerance
      );
    }


    function updateTabIndicator(
      animate =
        true
    ) {
      const selectedTab =
        tabByView.get(
          activeView
        );


      if (
        !tabList ||
        !selectedTab
      ) {
        return;
      }


      if (
        !animate
      ) {
        tabList.classList.add(
          'is-positioning'
        );
      }


      tabList.style.setProperty(
        '--tab-indicator-x',
        `${selectedTab.offsetLeft}px`
      );

      tabList.style.setProperty(
        '--tab-indicator-width',
        `${selectedTab.offsetWidth}px`
      );


      if (
        animate
      ) {
        const targetScrollLeft =
          selectedTab.offsetLeft -
          (
            tabList.clientWidth -
            selectedTab.offsetWidth
          ) /
          2;


        tabList.scrollTo({
          left:
            Math.max(
              0,
              targetScrollLeft
            ),

          behavior:
            'smooth'
        });
      } else {
        requestAnimationFrame(
          () => {
            tabList.classList.remove(
              'is-positioning'
            );
          }
        );
      }

      requestAnimationFrame(
        updateTabScrollHints
      );
    }


    function updateActiveTab() {
      viewTabs.forEach(
        tab => {
          const isActive =
            tab.dataset.view ===
            activeView;

          tab.classList.toggle(
            'is-active',
            isActive
          );

          tab.setAttribute(
            'aria-selected',
            String(
              isActive
            )
          );
        }
      );


      updateTabIndicator(
        true
      );
    }


    function animateViewSwitch(
      nextView
    ) {
      if (
        !promoterChart ||
        interactionLocked ||
        nextView ===
          activeView ||
        !VIEW_CONFIG[
          nextView
        ]
      ) {
        return;
      }


      const nextConfig =
        VIEW_CONFIG[
          nextView
        ];

      const startingDescriptionOpacity =
        axisDescriptionOpacity;

      const targetDescriptionOpacity =
        nextView ===
          'overall'
          ? 1
          : 0;

      const startingAxisTickMultiplier =
        axisTickMultiplier;

      const targetAxisTickMultiplier =
        nextView ===
          'overall'
          ? 0.1
          : 1;


      aggregatePoints.forEach(
        point => {
          const targets =
            getViewTargets(
              point,
              nextView
            );

          point.viewStartX =
            point.x;

          point.viewStartY =
            point.y;

          point.viewStartRadius =
            point.baseRadius;

          point.viewTargetX =
            targets.x;

          point.viewTargetY =
            targets.y;

          point.viewTargetRadius =
            targets.radius;

          point.viewTargetMetricValue =
            targets.metricValue;

          point.viewTargetRespondents =
            targets.respondents;
        }
      );


      interactionLocked =
        true;

      lastAggregateClickKey =
        null;

      lastAggregateClickTime =
        0;

      activeView =
        nextView;


      const nextHeadingText =
        nextConfig.heading;

      const nextAxisTitleText =
        nextConfig.axisTitle;

      /*
       * The y-axis title changes only when moving between Overall
       * and an endorsement view. It remains fully visible when
       * switching between two endorsement views.
       */
      const currentAxisTitleText =
        promoterChart.options
          .scales
          .y
          .title
          .text;

      const shouldFadeAxisTitle =
        currentAxisTitleText !==
        nextAxisTitleText;

      let viewTextSwitched =
        false;


      updateActiveTab();


      runAnimation({
        duration:
          VIEW_TRANSITION_MS,

        easing:
          easeInOutCubic,

        onFrame(
          progress
        ) {
          aggregatePoints.forEach(
            point => {
              point.x =
                point.viewStartX +
                (
                  point.viewTargetX -
                  point.viewStartX
                ) *
                progress;

              point.y =
                point.viewStartY +
                (
                  point.viewTargetY -
                  point.viewStartY
                ) *
                progress;

              point.baseRadius =
                point.viewStartRadius +
                (
                  point.viewTargetRadius -
                  point.viewStartRadius
                ) *
                progress;
            }
          );


          axisDescriptionOpacity =
            startingDescriptionOpacity +
            (
              targetDescriptionOpacity -
              startingDescriptionOpacity
            ) *
            progress;


          axisTickMultiplier =
            startingAxisTickMultiplier +
            (
              targetAxisTickMultiplier -
              startingAxisTickMultiplier
            ) *
            progress;


          const titleOpacity =
            Math.abs(
              progress *
                2 -
              1
            );


          if (
            !viewTextSwitched &&
            progress >=
              0.5
          ) {
            chartHeading.textContent =
              nextHeadingText;

            promoterChart.options
              .scales
              .y
              .title
              .text =
                nextAxisTitleText;

            viewTextSwitched =
              true;
          }


          chartHeading.style.opacity =
            String(
              titleOpacity
            );

          promoterChart.options
            .scales
            .y
            .title
            .color =
              `rgba(21, 21, 21, ${
                shouldFadeAxisTitle
                  ? titleOpacity
                  : 1
              })`;


          promoterChart.update(
            'none'
          );
        },

        onComplete() {
          aggregatePoints.forEach(
            point => {
              point.x =
                point.viewTargetX;

              point.y =
                point.viewTargetY;

              point.targetY =
                point.viewTargetY;

              point.baseRadius =
                point.viewTargetRadius;

              point.currentMetricValue =
                point.viewTargetMetricValue;

              point.currentRespondents =
                point.viewTargetRespondents;

              point.respondents =
                point.viewTargetRespondents;
            }
          );


          /*
           * Lower values are rendered later and therefore remain
           * on top. At the same value, smaller bubbles stay on top.
           */
          aggregatePoints.sort(
            (
              first,
              second
            ) =>
              second.y -
                first.y ||
              second.baseRadius -
                first.baseRadius
          );


          axisDescriptionOpacity =
            targetDescriptionOpacity;

          axisTickMultiplier =
            targetAxisTickMultiplier;

          chartHeading.textContent =
            nextHeadingText;

          chartHeading.style.opacity =
            '1';

          promoterChart.options
            .scales
            .y
            .title
            .text =
              nextAxisTitleText;

          promoterChart.options
            .scales
            .y
            .title
            .color =
              '#151515';


          promoterChart.update(
            'none'
          );

          interactionLocked =
            false;

          updateReaggregateButton();
        }
      });
    }


    function requestViewSwitch(
      nextView
    ) {
      if (
        nextView ===
          activeView ||
        interactionLocked ||
        !VIEW_CONFIG[
          nextView
        ]
      ) {
        return;
      }


      /*
       * Raw Overall points are re-aggregated before switching to
       * any other workplace survey view.
       */
      if (
        splitEmployers.size >
        0
      ) {
        animateReaggregation(
          () => {
            animateViewSwitch(
              nextView
            );
          }
        );

        return;
      }


      animateViewSwitch(
        nextView
      );
    }
    /************************************************************
     * INITIAL RISE
     *
     * This runs once only. Later split and merge actions never
     * move unrelated aggregate bubbles.
     ************************************************************/

    function animateInitialRise() {
      if (
        !promoterChart
      ) {
        return;
      }


      initialLoadActive =
        true;

      interactionLocked =
        true;

      updateReaggregateButton();


      runAnimation({
        duration:
          INITIAL_RISE_MS,

        easing:
          easeOutCubic,

        onFrame(
          progress
        ) {
          aggregatePoints.forEach(
            point => {
              point.y =
                point.targetY *
                progress;
            }
          );


          promoterChart.update(
            'none'
          );
        },

        onComplete() {
          aggregatePoints.forEach(
            point => {
              point.y =
                point.targetY;
            }
          );


          promoterChart.update(
            'none'
          );


          initialLoadActive =
            false;

          interactionLocked =
            false;

          updateReaggregateButton();
        }
      });
    }


    /************************************************************
     * SPLIT ONE EMPLOYER
     *
     * Only the selected employer's raw points move.
     * Existing aggregate and split points remain stationary.
     ************************************************************/

    function animateEmployerSplit(
      employerKey
    ) {
      if (
        interactionLocked ||
        splitEmployers.has(
          employerKey
        ) ||
        !promoterChart
      ) {
        return;
      }


      const aggregateItem =
        aggregateItems.find(
          item =>
            item.canonicalKey ===
            employerKey
        );

      const rawEmployer =
        rawEmployerData.get(
          employerKey
        );


      if (
        !aggregateItem ||
        !rawEmployer
          ?.scores
          ?.length
      ) {
        return;
      }


      /*
       * Only the first split needs to dim all aggregate bubbles.
       * Additional splits begin while they are already dimmed.
       */
      const shouldAnimateAggregateDimming =
        splitEmployers.size ===
        0;

      interactionLocked =
        true;

      splitEmployers.add(
        employerKey
      );

      splitProgress.set(
        employerKey,
        0
      );


      const newPoints =
        createRawEmployerPoints(
          aggregateItem,
          rawEmployer
        );


      newPoints.forEach(
        point => {
          point.startX =
            point.x;

          point.startY =
            point.y;
        }
      );


      rawDisplayPoints.push(
        ...newPoints
      );


      promoterChart
        .data
        .datasets[1]
        .data =
          rawDisplayPoints;


      promoterChart.update(
        'none'
      );


      updateReaggregateButton();


      runAnimation({
        duration:
          SPLIT_ANIMATION_MS,

        easing:
          easeOutCubic,

        onFrame(
          progress
        ) {
          splitProgress.set(
            employerKey,
            progress
          );

          if (
            shouldAnimateAggregateDimming
          ) {
            aggregateDimProgress =
              progress;
          }


          newPoints.forEach(
            point => {
              point.x =
                point.startX +
                (
                  point.targetX -
                  point.startX
                ) *
                progress;

              point.y =
                point.startY +
                (
                  point.targetY -
                  point.startY
                ) *
                progress;
            }
          );


          promoterChart.update(
            'none'
          );
        },

        onComplete() {
          newPoints.forEach(
            point => {
              point.x =
                point.targetX;

              point.y =
                point.targetY;
            }
          );


          splitProgress.delete(
            employerKey
          );

          if (
            shouldAnimateAggregateDimming
          ) {
            aggregateDimProgress =
              1;
          }


          promoterChart.update(
            'none'
          );


          interactionLocked =
            false;

          updateReaggregateButton();
        }
      });
    }


    /************************************************************
     * REVERSE ALL SPLITS
     *
     * Aggregate bubbles fade back in at their existing full size.
     * Raw points move back into them and are then removed.
     ************************************************************/

    function animateReaggregation(
      onCompleteCallback =
        null
    ) {
      if (
        interactionLocked ||
        !promoterChart ||
        splitEmployers.size ===
          0
      ) {
        return;
      }


      interactionLocked =
        true;

      mergeProgress =
        0;


      splitEmployers.forEach(
        employerKey => {
          mergingEmployers.add(
            employerKey
          );
        }
      );


      rawDisplayPoints.forEach(
        point => {
          const aggregatePoint =
            getAggregatePoint(
              point.canonicalKey
            );


          point.mergeStartX =
            point.x;

          point.mergeStartY =
            point.y;

          point.mergeTargetX =
            aggregatePoint?.x ??
            point.x;

          point.mergeTargetY =
            aggregatePoint?.targetY ??
            point.y;
        }
      );


      promoterChart.update(
        'none'
      );


      updateReaggregateButton();


      runAnimation({
        duration:
          MERGE_ANIMATION_MS,

        easing:
          easeInOutCubic,

        onFrame(
          progress
        ) {
          mergeProgress =
            progress;

          /*
           * Gradually return aggregate bubbles to normal opacity.
           */
          aggregateDimProgress =
            1 -
            progress;


          rawDisplayPoints.forEach(
            point => {
              point.x =
                point.mergeStartX +
                (
                  point.mergeTargetX -
                  point.mergeStartX
                ) *
                progress;

              point.y =
                point.mergeStartY +
                (
                  point.mergeTargetY -
                  point.mergeStartY
                ) *
                progress;
            }
          );


          promoterChart.update(
            'none'
          );
        },

        onComplete() {
          mergeProgress =
            1;


          rawDisplayPoints =
            [];


          promoterChart
            .data
            .datasets[1]
            .data =
              rawDisplayPoints;


          splitEmployers.clear();
          splittingCleanup();
          mergingEmployers.clear();

          mergeProgress =
            0;

          aggregateDimProgress =
            0;


          promoterChart.update(
            'none'
          );


          interactionLocked =
            false;

          updateReaggregateButton();

          if (
            typeof onCompleteCallback ===
            'function'
          ) {
            onCompleteCallback();
          }
        }
      });
    }


    function splittingCleanup() {
      splitProgress.clear();
    }


    /************************************************************
     * CREATE CHART
     ************************************************************/

    function createChart() {
      const canvas =
        document.getElementById(
          'promoterChart'
        );

      const chartShell =
        canvas.parentElement;

      const fixedChartHeight =
        window.matchMedia(
          '(max-width: 350px)'
        ).matches
          ? 420
          : window.matchMedia(
              '(max-width: 430px)'
            ).matches
              ? 450
              : 585;

      const fixedChartWidth =
        Math.max(
          300,
          Math.round(
            chartShell.getBoundingClientRect().width
          )
        );

      /*
       * Set the canvas drawing dimensions once. Chart.js will no
       * longer enlarge it when additional raw points are added.
       */
      canvas.width =
        fixedChartWidth;

      canvas.height =
        fixedChartHeight;

      canvas.style.width =
        `${fixedChartWidth}px`;

      canvas.style.height =
        `${fixedChartHeight}px`;

      const context =
        canvas.getContext(
          '2d'
        );


      promoterChart =
        new Chart(
          context,
          {
            type:
              'scatter',


            data: {
              datasets: [
                {
                  label:
                    'Aggregated employer scores',

                  /*
                   * Higher order values are drawn first.
                   * The raw dataset uses a lower order and therefore
                   * renders over every aggregate bubble.
                   */
                  order:
                    10,

                  data:
                    aggregatePoints,

                  parsing:
                    false,

                  showLine:
                    false,

                  clip:
                    false,


                  pointRadius(
                    chartContext
                  ) {
                    return getAggregateRadius(
                      chartContext.chart,
                      chartContext.raw
                    );
                  },


                  pointHoverRadius(
                    chartContext
                  ) {
                    const raw =
                      chartContext.raw;

                    const radius =
                      getAggregateRadius(
                        chartContext.chart,
                        raw
                      );


                    if (
                      interactionLocked ||
                      radius <= 0
                    ) {
                      return radius;
                    }


                    return (
                      radius +
                      0.8
                    );
                  },


                  /*
                   * A zero hit radius makes overlap selection more
                   * precise and less sensitive.
                   */
                  pointHitRadius:
                    0,


                  pointBackgroundColor(
                    chartContext
                  ) {
                    const raw =
                      chartContext.raw;

                    const visibility =
                      raw
                        ? getAggregateVisibility(
                            raw.canonicalKey
                          )
                        : 0;

                    const opacity =
                      BUBBLE_OPACITY +
                      (
                        DIMMED_AGGREGATE_OPACITY -
                        BUBBLE_OPACITY
                      ) *
                      aggregateDimProgress;


                    return hexToRgba(
                      raw?.colour ||
                      '#777777',

                      opacity *
                      visibility
                    );
                  },


                  pointHoverBackgroundColor(
                    chartContext
                  ) {
                    const raw =
                      chartContext.raw;

                    const visibility =
                      raw
                        ? getAggregateVisibility(
                            raw.canonicalKey
                          )
                        : 0;

                    const opacity =
                      BUBBLE_HOVER_OPACITY +
                      (
                        DIMMED_AGGREGATE_HOVER_OPACITY -
                        BUBBLE_HOVER_OPACITY
                      ) *
                      aggregateDimProgress;


                    return hexToRgba(
                      raw?.colour ||
                      '#777777',

                      opacity *
                      visibility
                    );
                  },


                  pointBorderWidth:
                    0,

                  pointHoverBorderWidth:
                    0
                },


                {
                  label:
                    'Raw employer scores',

                  /*
                   * Lower order means this dataset is rendered later
                   * and remains visually above aggregate bubbles.
                   */
                  order:
                    -10,

                  data:
                    rawDisplayPoints,

                  parsing:
                    false,

                  showLine:
                    false,

                  clip:
                    false,


                  pointRadius(
                    chartContext
                  ) {
                    return getDisplayedBubbleRadius(
                      chartContext.chart,
                      chartContext.raw
                    );
                  },


                  pointHoverRadius(
                    chartContext
                  ) {
                    const radius =
                      getDisplayedBubbleRadius(
                        chartContext.chart,
                        chartContext.raw
                      );


                    if (
                      interactionLocked ||
                      radius <= 0
                    ) {
                      return radius;
                    }


                    return (
                      radius +
                      0.7
                    );
                  },


                  /*
                   * Small hit padding retains usability without
                   * causing nearby overlapping points to activate.
                   */
                  pointHitRadius:
                    1,


                  pointBackgroundColor(
                    chartContext
                  ) {
                    return hexToRgba(
                      chartContext
                        .raw
                        ?.colour ||
                        '#777777',

                      BUBBLE_OPACITY
                    );
                  },


                  pointHoverBackgroundColor(
                    chartContext
                  ) {
                    return hexToRgba(
                      chartContext
                        .raw
                        ?.colour ||
                        '#777777',

                      BUBBLE_HOVER_OPACITY
                    );
                  },


                  pointBorderWidth:
                    0,

                  pointHoverBorderWidth:
                    0
                }
              ]
            },


            options: {
              responsive:
                false,

              maintainAspectRatio:
                false,

              /*
               * Match high-density screens while limiting the
               * maximum resolution to avoid excessive memory use.
               */
              devicePixelRatio:
                4,


              /*
               * Ordinary chart updates do not animate. Initial rise,
               * splitting and merging are controlled explicitly.
               */
              animation: {
                duration:
                  0
              },


              /*
               * Hover retains a brief, subtle radius transition.
               */
              transitions: {
                active: {
                  animation: {
                    duration:
                      HOVER_ANIMATION_MS,

                    easing:
                      'easeOutCubic'
                  }
                },

                resize: {
                  animation: {
                    duration:
                      0
                  }
                }
              },


              interaction: {
                mode:
                  'nearest',

                axis:
                  'xy',

                intersect:
                  true,

                includeInvisible:
                  false
              },


              layout: {
                autoPadding:
                  false,

                padding: {
                  top:
                    0,

                  right:
                    1,

                  bottom:
                    0,

                  /*
                   * Moves the y-axis and plotting area right so
                   * the descriptive labels remain inside the canvas.
                   */
                  left:
                    window.matchMedia(
                      '(max-width: 430px)'
                    ).matches
                      ? 32
                      : 36
                }
              },


              onHover(
                event,
                elements,
                chart
              ) {
                if (
                  interactionLocked ||
                  !elements.length
                ) {
                  chart.canvas.style.cursor =
                    'default';

                  return;
                }


                const selectedElement =
                  elements[0];


                const point =
                  chart
                    .data
                    .datasets[
                      selectedElement
                        .datasetIndex
                    ]
                    ?.data
                    ?.[
                      selectedElement
                        .index
                    ];


                chart.canvas.style.cursor =
                  activeView ===
                    'overall' &&
                  selectedElement
                    .datasetIndex ===
                      0 &&
                  point?.kind ===
                    'aggregate' &&
                  point.canSplit &&
                  !splitEmployers.has(
                    point.canonicalKey
                  )
                    ? 'pointer'
                    : 'default';
              },


              onClick(
                event,
                elements,
                chart
              ) {
                if (
                  interactionLocked ||
                  !elements.length
                ) {
                  return;
                }


                const selectedElement =
                  elements[0];

                const point =
                  chart
                    .data
                    .datasets[
                      selectedElement
                        .datasetIndex
                    ]
                    ?.data
                    ?.[
                      selectedElement
                        .index
                    ];


                const renderedElement =
                  chart
                    .getDatasetMeta(
                      selectedElement
                        .datasetIndex
                    )
                    ?.data
                    ?.[
                      selectedElement
                        .index
                    ];


                /*
                 * One click or tap displays and retains the tooltip.
                 * This also works for raw-score points.
                 */
                chart.tooltip
                  .setActiveElements(
                    [
                      {
                        datasetIndex:
                          selectedElement
                            .datasetIndex,

                        index:
                          selectedElement
                            .index
                      }
                    ],

                    {
                      x:
                        Number.isFinite(
                          event.x
                        )
                          ? event.x
                          : renderedElement
                              ?.x ??
                            0,

                      y:
                        Number.isFinite(
                          event.y
                        )
                          ? event.y
                          : renderedElement
                              ?.y ??
                            0
                    }
                  );


                chart.update(
                  'none'
                );


                /*
                 * Only aggregate bubbles can be split. Raw bubbles
                 * retain normal single-tap tooltip behaviour.
                 */
                if (
                  activeView !==
                    'overall' ||
                  selectedElement
                    .datasetIndex !==
                    0 ||
                  point?.kind !==
                    'aggregate' ||
                  !point.canSplit ||
                  splitEmployers.has(
                    point.canonicalKey
                  )
                ) {
                  lastAggregateClickKey =
                    null;

                  lastAggregateClickTime =
                    0;

                  return;
                }


                const clickedAt =
                  performance.now();

                const isSecondActivation =
                  lastAggregateClickKey ===
                    point.canonicalKey &&
                  (
                    clickedAt -
                    lastAggregateClickTime
                  ) <=
                    DOUBLE_ACTIVATION_MS;


                if (
                  isSecondActivation
                ) {
                  lastAggregateClickKey =
                    null;

                  lastAggregateClickTime =
                    0;


                  chart.tooltip
                    .setActiveElements(
                      [],
                      {
                        x:
                          0,

                        y:
                          0
                      }
                    );


                  chart.update(
                    'none'
                  );


                  animateEmployerSplit(
                    point.canonicalKey
                  );

                  return;
                }


                /*
                 * This was the first click or tap. Keep the tooltip
                 * open and wait to see whether another follows.
                 */
                lastAggregateClickKey =
                  point.canonicalKey;

                lastAggregateClickTime =
                  clickedAt;
              },

              plugins: {
                legend: {
                  display:
                    false
                },


                tooltip: {
                  enabled:
                    true,

                  mode:
                    'nearest',

                  intersect:
                    true,

                  displayColors:
                    false,

                  backgroundColor:
                    '#ffffff',

                  titleColor:
                    '#151515',

                  bodyColor:
                    '#69718a',

                  borderColor:
                    '#e8eaf0',

                  borderWidth:
                    1,

                  cornerRadius:
                    4,

                  padding:
                    9,


                  titleFont: {
                    family:
                      'Lato',

                    size:
                      12,

                    weight:
                      '700'
                  },


                  bodyFont: {
                    family:
                      'Lato',

                    size:
                      11,

                    weight:
                      '400'
                  },


                  filter() {
                    return (
                      !initialLoadActive &&
                      !interactionLocked
                    );
                  },


                  callbacks: {
                    title(
                      tooltipItems
                    ) {
                      return (
                        tooltipItems
                          ?.[0]
                          ?.raw
                          ?.fullName ||
                        ''
                      );
                    },


                    label(
                      tooltipItem
                    ) {
                      const raw =
                        tooltipItem.raw;


                      if (
                        raw?.kind ===
                        'raw'
                      ) {
                        return [
                          `Raw score: ${formatStatistic(raw.rawScore)}`,
                          `Respondents: ${formatNumber(raw.scoreCount)}`,
                          (
                            'Median [IQR]: ' +
                            `${formatStatistic(raw.median)} ` +
                            `[${formatStatistic(raw.q1)}–${formatStatistic(raw.q3)}]`
                          )
                        ];
                      }

                      if (
                        activeView !==
                        'overall'
                      ) {
                        return [
                          (
                            'Optometrists endorsing: ' +
                            `${formatStatistic(raw?.currentMetricValue)}%`
                          ),

                          (
                            'Respondents: ' +
                            `${formatNumber(raw?.currentRespondents ?? 0)}`
                          )
                        ];
                      }


                      return [
                        (
                          'Median score: ' +
                          `${formatStatistic(raw?.currentMetricValue)}`
                        ),

                        (
                          'Respondents: ' +
                          `${formatNumber(raw?.currentRespondents ?? 0)}`
                        ),

                        raw?.canSplit
                          ? 'Double-tap for raw scores'
                          : ''
                      ].filter(
                        Boolean
                      );
                    }
                  }
                }
              },


              scales: {
                x: {
                  type:
                    'linear',

                  min:
                    0,

                  max:
                    100,

                  display:
                    false,

                  grid: {
                    display:
                      false
                  },

                  border: {
                    display:
                      false
                  }
                },


                y: {
                  min:
                    0,

                  max:
                    100,

                  /*
                   * Keep the y-axis spine in one fixed position.
                   * As the numbers gain digits, they expand left
                   * instead of pushing the spine right.
                   */
                  afterFit(
                    scale
                  ) {
                    scale.width =
                      window.matchMedia(
                        '(max-width: 430px)'
                      ).matches
                        ? 52
                        : 54;
                  },


                  title: {
                    display:
                      true,

                    text:
                      '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0Score',

                    color:
                      '#151515',

                    font: {
                      family:
                        'Lato',

                      size:
                        13,

                      weight:
                        '700'
                    },

                    padding: {
                      bottom:
                        0
                    }
                  },


                  ticks: {
                    stepSize:
                      10,

                    color:
                      '#151515',
                    
                    padding:
                      2,

                    autoSkip:
                      false,

                    maxRotation:
                      0,

                    minRotation:
                      0,

                    font: {
                      family:
                        'Lato',

                      size:
                        12,

                      weight:
                        '400'
                    },


                    callback(
                      value
                    ) {
                      const number =
                        Number(
                          value
                        );

                      return String(
                        Math.round(
                          number *
                          axisTickMultiplier
                        )
                      );
                    }
                  },


                  grid: {
                    color:
                      'rgba(105, 113, 138, 0.075)',

                    lineWidth:
                      1,

                    drawTicks:
                      true,

                    tickLength:
                      7,

                    tickColor:
                      '#151515',

                    tickWidth:
                      1.2
                  },


                  border: {
                    display:
                      true,

                    color:
                      '#151515',

                    width:
                      1.1
                  }
                }
              }
            },


            plugins: [
              axisDescriptionPlugin,
              bubbleLabelPlugin
            ]
          }
        );
    }


    /************************************************************
     * RE-AGGREGATE AND TAB EVENTS
     ************************************************************/

    reaggregateButton.addEventListener(
      'click',
      () => {
        animateReaggregation();
      }
    );


    viewTabs.forEach(
      tab => {
        tab.addEventListener(
          'click',
          () => {
            requestViewSwitch(
              tab.dataset.view
            );
          }
        );
      }
    );


    /*
     * Place the indicator beneath Overall without animating
     * from the left edge during initial page loading.
     */
    updateTabIndicator(
      false
    );


    /*
     * Recalculate after Lato loads because tab widths can change.
     */
    if (
      document.fonts
        ?.ready
    ) {
      document.fonts.ready.then(
        () => {
          updateTabIndicator(
            false
          );
        }
      );
    }


    tabList.addEventListener(
      'scroll',
      updateTabScrollHints,
      {
        passive:
          true
      }
    );


      () => {
        updateTabIndicator(
          false
        );
      }
    );
    /************************************************************
     * LOAD ONCE
     ************************************************************/

    async function loadPromoterChart() {
      try {
        setStatus();


        const queryResults =
          await Promise.all([
            loadSheetQuery(
              RAW_QUERY
            ),

            ...VIEW_KEYS.map(
              viewKey =>
                loadSheetQuery(
                  VIEW_CONFIG[
                    viewKey
                  ].query
                )
            )
          ]);


        const rawRows =
          queryResults[0];

        const viewRows =
          queryResults.slice(
            1
          );


        rawEmployerData =
          normaliseRawRows(
            rawRows
          );


        viewItems.clear();
        viewEmployerData.clear();
        viewPositions.clear();


        VIEW_KEYS.forEach(
          (
            viewKey,
            index
          ) => {
            const rows =
              viewRows[
                index
              ];

            /*
             * Overall uses a 0–10 score. Every other view uses
             * an endorsement percentage from 0–100.
             */
            const items =
              viewKey ===
                'overall'
                ? normaliseAggregateRows(
                    rows
                  )
                : normalisePayRows(
                    rows
                  );


            viewItems.set(
              viewKey,
              items
            );


            viewEmployerData.set(
              viewKey,
              new Map(
                items.map(
                  item => [
                    item.canonicalKey,
                    item
                  ]
                )
              )
            );


            viewPositions.set(
              viewKey,
              viewKey ===
                'overall'
                ? buildAggregatePositions(
                    items
                  )
                : buildProximityPositions(
                    items,
                    5
                  )
            );
          }
        );


        aggregateItems =
          viewItems.get(
            'overall'
          ) ??
          [];


        if (
          !aggregateItems.length
        ) {
          throw new Error(
            'No valid aggregate rows found in columns AM to AO'
          );
        }


        aggregatePositions =
          viewPositions.get(
            'overall'
          ) ??
          new Map();


        aggregatePoints =
          buildAggregatePoints(
            aggregateItems
          );


        createChart();

        updateReaggregateButton();

        updateTabIndicator(
          false
        );

        hideLoadingState();

        setStatus();

        animateInitialRise();
      } catch (
        error
      ) {
        console.error(
          error
        );


        hideLoadingState();


        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load chart'
          ).replace(
            /\.+$/,
            ''
          )
        );
      }
    }
    loadPromoterChart();
  </script>
</body>
