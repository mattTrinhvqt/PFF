<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Workplace Promoter Score</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    #app {
      width: min(calc(100% - 12px), 520px);
      max-width: 100%;
      min-width: 0;
      margin-inline: auto;
      padding: 7px 6px 0;
      overflow: hidden;
      background: #fff;
    }

    /* ---------- Tab and live status ---------- */

    .module-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-list {
      display: flex;
      align-items: flex-end;
      min-width: 0;
    }

    .chart-tab {
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--purple);
      background: #fff;
      border: 0;
      border-bottom: 2px solid var(--purple);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: default;
    }

    .live-data {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0 1px 7px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ---------- Chart heading ---------- */

    .chart-heading-row {
      position: relative;
      width: 100%;
      height: 30px;
      min-height: 30px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 4px 112px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
    }
    
    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;

      min-height: 27px;
      padding: 0 6px;

      color: var(--muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;

      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;

      cursor: pointer;

      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease,
        visibility 0s linear;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow:
        inset 0 0 0 1px
        rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: none;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--purple);
      font-size: 15px;
      line-height: 1;
    }

    /* ---------- Constant-size chart ---------- */

    .chart-shell {
      position: relative;
      display: block;
      width: 100%;
      height: 585px;
      min-height: 585px;
      max-height: 585px;
      flex: 0 0 585px;
      margin: -3px 0 0;
      overflow: hidden;
      contain: strict;
    }

    #promoterChart {
      position: absolute;
      top: 0;
      right: 0;
      bottom: auto;
      left: 0;
      display: block;
      width: 100%;
      height: 585px !important;
      min-height: 585px !important;
      max-height: 585px !important;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 0;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        height: 29px;
        min-height: 29px;
      }

      .chart-heading {
        padding-top: 4px;
        padding-right: 105px;
        font-size: 14px;
        line-height: 21px;
      }

      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .chart-shell {
        height: 450px;
        min-height: 450px;
        max-height: 450px;
        flex-basis: 450px;
      }

      #promoterChart {
        height: 450px !important;
        min-height: 450px !important;
        max-height: 450px !important;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 97px;
        font-size: 13px;
      }

      .reaggregate-button {
        font-size: 9px;
      }

      .chart-shell {
        height: 420px;
        min-height: 420px;
        max-height: 420px;
        flex-basis: 420px;
      }

      #promoterChart {
        height: 420px !important;
        min-height: 420px !important;
        max-height: 420px !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app">

      <div class="module-top">
        <div
          class="tab-list"

          aria-label="Promoter score views"
        >

            class="chart-tab"

        <button

          aria-hidden="true"

            aria-hidden="true"

        </button>
      </div>

      <div class="chart-shell">
        <canvas
          id="promoterChart"
          aria-label="Workplace promoter score chart"

    </main>

    function normaliseEmployerName(
      value
    ) {
      return String(
        value || ''
      )
        .toLowerCase()
        .normalize('NFKD')
        .replace(
          /[’‘]/g,
          "'"
        )
        .replace(
          /&/g,
          ' and '
        )
        .replace(
          /[^a-z0-9]+/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }


    const EMPLOYER_ALIAS_MAP =
      new Map();


    EMPLOYERS.forEach(
      employer => {
        [
          employer.label,
          employer.fullName,
          ...employer.aliases
        ].forEach(
          alias => {
            EMPLOYER_ALIAS_MAP.set(
              normaliseEmployerName(
                alias
              ),
              employer
            );
          }
        );
      }
    );


    function getEmployerAppearance(
      employerName
    ) {
      const original =
        String(
          employerName || ''
        ).trim();

      const normalised =
        normaliseEmployerName(
          original
        );

      const knownEmployer =
        EMPLOYER_ALIAS_MAP.get(
          normalised
        );

      if (
        knownEmployer
      ) {
        return knownEmployer;
      }

      const fallbackKey =
        normalised ||
        `unknown-${original}`;

      if (
        original.length <=
        10
      ) {
        return {
          key:
            fallbackKey,

          label:
            original || '—',

          fullName:
            original ||
            'Unknown employer',

          colour:
            '#777777'
        };
      }

      const initials =
        original
          .split(/\s+/)
          .filter(Boolean)
          .map(
            word =>
              word.charAt(0)
          )
          .join('')
          .slice(0, 6);

      return {
        key:
          fallbackKey,

        label:
          initials ||
          original.slice(
            0,
            10
          ),

        fullName:
          original,

        colour:
          '#777777'
      };
    }


    /************************************************************

     ************************************************************/

    function setStatus(

    ) {

    function formatNumber(
      value
    ) {
      return new Intl.NumberFormat(
        'en-AU'
      ).format(
        value
      );
    }


    function formatStatistic(
      value
    ) {
      if (
        !Number.isFinite(
          value
        )
      ) {
        return '—';
      }

      if (
        Number.isInteger(
          value
        )
      ) {
        return String(
          value
        );
      }

      return value
        .toFixed(1)
        .replace(
          /\.0$/,
          ''
        );
    }


    function getCellValue(
      cell
    ) {
      if (!cell) {
        return '';
      }

      return (
        cell.v ??
        cell.f ??
        ''
      );
    }


    function toNumber(
      value
    ) {
      const number =
        typeof value ===
          'number'
          ? value
          : parseFloat(
              String(
                value
              ).replace(
                /[^\d.-]/g,
                ''
              )
            );

      return Number.isFinite(
        number
      )
        ? number
        : NaN;
    }


    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.max(
        minimum,
        Math.min(
          maximum,
          value
        )
      );
    }


    function hexToRgba(
      hex,
      opacity
    ) {
      const cleaned =
        String(
          hex
        )
          .replace(
            '#',
            ''
          )
          .trim();

      if (
        !/^[0-9a-f]{6}$/i.test(
          cleaned
        )
      ) {
        return (
          `rgba(119, 119, 119, ${opacity})`
        );
      }

      const red =
        parseInt(
          cleaned.slice(
            0,
            2
          ),
          16
        );

      const green =
        parseInt(
          cleaned.slice(
            2,
            4
          ),
          16
        );

      const blue =
        parseInt(
          cleaned.slice(
            4,
            6
          ),
          16
        );

      return (
        `rgba(${red}, ${green}, ${blue}, ${opacity})`
      );
    }


    function getBaseBubbleRadius(
      respondents
    ) {
      const calculated =
        BUBBLE_OFFSET +
        (
          Math.pow(
            respondents,
            BUBBLE_EXPONENT
          ) *
          BUBBLE_MULTIPLIER
        );

      return clamp(
        calculated,
        MIN_RADIUS,
        MAX_RADIUS
      );
    }


    function getDisplayedBubbleRadius(
      chart,
      raw
    ) {
      const baseRadius =
        Number(
          raw?.baseRadius
        );

      if (
        !Number.isFinite(
          baseRadius
        ) ||
        baseRadius <= 0
      ) {
        return 0;
      }

      const chartWidth =
        Number(
          chart?.width
        );

      const safeChartWidth =
        Number.isFinite(
          chartWidth
        ) &&
        chartWidth > 0
          ? chartWidth
          : 520;

      const widthScale =
        clamp(
          safeChartWidth / 520,
          0.72,
          1
        );

      return (
        baseRadius *
        widthScale
      );
    }


    function percentile(
      sortedValues,
      probability
    ) {
      if (
        !sortedValues.length
      ) {
        return NaN;
      }

      if (
        sortedValues.length ===
        1
      ) {
        return sortedValues[0];
      }

      const index =
        (
          sortedValues.length -
          1
        ) *
        probability;

      const lowerIndex =
        Math.floor(
          index
        );

      const upperIndex =
        Math.ceil(
          index
        );

      if (
        lowerIndex ===
        upperIndex
      ) {
        return sortedValues[
          lowerIndex
        ];
      }

      const fraction =
        index -
        lowerIndex;

      return (
        sortedValues[
          lowerIndex
        ] +
        (
          sortedValues[
            upperIndex
          ] -
          sortedValues[
            lowerIndex
          ]
        ) *
        fraction
      );
    }


    function calculateScoreStatistics(
      scores
    ) {
      const sorted =
        scores
          .filter(
            Number.isFinite
          )
          .slice()
          .sort(
            (
              first,
              second
            ) =>
              first -
              second
          );

      return {
        count:
          sorted.length,

        median:
          percentile(
            sorted,
            0.50
          ),

        q1:
          percentile(
            sorted,
            0.25
          ),

        q3:
          percentile(
            sorted,
            0.75
          )
      };
    }


    function easeOutCubic(
      progress
    ) {
      return (
        1 -
        Math.pow(
          1 - progress,
          3
        )
      );
    }


    function easeInOutCubic(
      progress
    ) {
      return progress < 0.5
        ? 4 *
          progress *
          progress *
          progress
        : 1 -
          Math.pow(
            -2 *
            progress +
            2,
            3
          ) /
          2;
    }


    function runAnimation({
      duration,
      easing,
      onFrame,
      onComplete
    }) {
      if (
        activeAnimationFrame
      ) {
        cancelAnimationFrame(
          activeAnimationFrame
        );
      }

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        reduceMotion ||
        duration <= 0
      ) {
        onFrame(1);

        if (
          onComplete
        ) {
          onComplete();
        }

        return;
      }

      const startedAt =
        performance.now();


      function frame(
        now
      ) {
        const progress =
          Math.min(
            (
              now -
              startedAt
            ) /
            duration,
            1
          );

        const eased =
          easing(
            progress
          );

        onFrame(
          eased
        );

        if (
          progress <
          1
        ) {
          activeAnimationFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          activeAnimationFrame =
            null;

          if (
            onComplete
          ) {
            onComplete();
          }
        }
      }


      activeAnimationFrame =
        requestAnimationFrame(
          frame
        );
    }


    /************************************************************
     * GOOGLE SHEETS JSONP
     ************************************************************/

    function loadSheetQuery(
      query
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            'pffPromoterCallback_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() *
              1000000
            );

          const script =
            document.createElement(
              'script'
            );

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'Could not load Google Sheet data'
                  )
                );
              },
              20000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response => {
            cleanup();

            if (
              !response ||
              response.status ===
                'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          };


          script.onerror =
            () => {
              cleanup();

              reject(
                new Error(
                  'Network error loading Google Sheet data'
                )
              );
            };


          const params =
            new URLSearchParams({
              sheet:
                SHEET_NAME,

              headers:
                '1',

              tq:
                query,

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(
                  Date.now()
                )
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
            params.toString();


          document.body
            .appendChild(
              script
            );
        }
      );
    }


    /************************************************************
     * NORMALISE AGGREGATE DATA
     ************************************************************/

    function normaliseAggregateRows(
      rows
    ) {
      const employers =
        new Map();


      rows.forEach(
        row => {
          const employerName =
            String(
              getCellValue(
                row?.c?.[0]
              ) || ''
            ).trim();

          const score =
            toNumber(
              getCellValue(
                row?.c?.[1]
              )
            );

          const respondents =
            toNumber(
              getCellValue(
                row?.c?.[2]
              )
            );


          if (
            !employerName ||
            !Number.isFinite(
              score
            ) ||
            score < 0 ||
            score > 10 ||
            !Number.isFinite(
              respondents
            ) ||
            respondents <= 0
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          employers.set(
            appearance.key,
            {
              canonicalKey:
                appearance.key,

              sourceName:
                employerName,

              score,

              respondents,

              label:
                appearance.label,

              fullName:
                appearance.fullName,

              colour:
                appearance.colour
            }
          );
        }
      );


      return [
        ...employers.values()
      ];
    }


    /************************************************************
     * NORMALISE RAW DATA
     ************************************************************/

    function normaliseRawRows(
      rows
    ) {
      const employerMap =
        new Map();


      rows.forEach(
        row => {
          const employerName =
            String(
              getCellValue(
                row?.c?.[0]
              ) || ''
            ).trim();

          const score =
            toNumber(
              getCellValue(
                row?.c?.[1]
              )
            );


          if (
            !employerName ||
            !Number.isFinite(
              score
            ) ||
            score < 0 ||
            score > 10
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          if (
            !employerMap.has(
              appearance.key
            )
          ) {
            employerMap.set(
              appearance.key,
              {
                canonicalKey:
                  appearance.key,

                label:
                  appearance.label,

                fullName:
                  appearance.fullName,

                colour:
                  appearance.colour,

                scores:
                  []
              }
            );
          }


          employerMap
            .get(
              appearance.key
            )
            .scores
            .push(
              score
            );
        }
      );


      employerMap.forEach(
        employer => {
          employer.statistics =
            calculateScoreStatistics(
              employer.scores
            );
        }
      );


      return employerMap;
    }


    /************************************************************
     * FIXED AGGREGATE POSITIONS
     ************************************************************/

    function buildAggregatePositions(
      items
    ) {
      const groups =
        new Map();


      items.forEach(
        item => {
          const scoreKey =
            String(
              Number(
                item.score
              )
            );

          if (
            !groups.has(
              scoreKey
            )
          ) {
            groups.set(
              scoreKey,
              []
            );
          }

          groups
            .get(
              scoreKey
            )
            .push(
              item
            );
        }
      );


      const maximumGroupSize =
        Math.max(
          1,
          ...[
            ...groups.values()
          ].map(
            group =>
              group.length
          )
        );


      /*
       * Extra internal padding prevents large circles from
       * excessively crossing the y-axis or right chart boundary.
       */
      const leftPosition =
        20;

      const rightPosition =
        82;


      const sharedPositions =
        maximumGroupSize ===
          1
          ? [
              leftPosition
            ]
          : Array.from(
              {
                length:
                  maximumGroupSize
              },
              (
                _,
                index
              ) =>
                leftPosition +
                (
                  index /
                  (
                    maximumGroupSize -
                    1
                  )
                ) *
                (
                  rightPosition -
                  leftPosition
                )
            );


      const positions =
        new Map();


      groups.forEach(
        group => {
          group
            .slice()
            .sort(
              (
                first,
                second
              ) =>
                second.respondents -
                  first.respondents ||
                first.fullName.localeCompare(
                  second.fullName
                )
            )
            .forEach(
              (
                item,
                index
              ) => {
                positions.set(
                  item.canonicalKey,
                  sharedPositions[
                    index
                  ]
                );
              }
            );
        }
      );


      return positions;
    }


    function buildAggregatePoints(
      items
    ) {
      return items
        .map(
          item => ({
            kind:
              'aggregate',

            x:
              aggregatePositions.get(
                item.canonicalKey
              ) ??
              20,

            /*
             * The initial animation starts these at zero and
             * moves them to targetY only once.
             */
            y:
              0,

            targetY:
              item.score,

            baseRadius:
              getBaseBubbleRadius(
                item.respondents
              ),

            canonicalKey:
              item.canonicalKey,

            shortLabel:
              item.label,

            fullName:
              item.fullName,

            respondents:
              item.respondents,

            colour:
              item.colour,

            canSplit:
              Boolean(
                rawEmployerData
                  .get(
                    item.canonicalKey
                  )
                  ?.scores
                  ?.length
              )
          })
        )
        .sort(
          (
            first,
            second
          ) => {
            /*
             * Once at their target positions, lower scores are
             * drawn later and therefore remain above higher scores.
             */
            if (
              first.targetY !==
              second.targetY
            ) {
              return (
                second.targetY -
                first.targetY
              );
            }

            return (
              second.baseRadius -
              first.baseRadius
            );
          }
        );
    }


    function getAggregatePoint(
      employerKey
    ) {
      return aggregatePoints.find(
        point =>
          point.canonicalKey ===
          employerKey
      );
    }


    /************************************************************
     * RAW SCORE POINTS
     ************************************************************/

    function createRawEmployerPoints(
      aggregateItem,
      rawEmployer
    ) {
      const aggregateX =
        aggregatePositions.get(
          aggregateItem.canonicalKey
        ) ??
        20;

      const aggregateY =
        aggregateItem.score;

      const scoreGroups =
        new Map();


      rawEmployer.scores.forEach(
        score => {
          const scoreKey =
            String(
              score
            );

          if (
            !scoreGroups.has(
              scoreKey
            )
          ) {
            scoreGroups.set(
              scoreKey,
              []
            );
          }

          scoreGroups
            .get(
              scoreKey
            )
            .push(
              score
            );
        }
      );


      const points =
        [];


      scoreGroups.forEach(
        (
          scores,
          scoreKey
        ) => {
          const score =
            Number(
              scoreKey
            );

          const pointCount =
            scores.length;

          const span =
            Math.min(
              21,
              Math.max(
                0,
                (
                  pointCount -
                  1
                ) *
                2.35
              )
            );


          let startX =
            aggregateX -
            span /
            2;


          startX =
            clamp(
              startX,
              14,
              88 -
              span
            );


          scores.forEach(
            (
              _,
              index
            ) => {
              const targetX =
                pointCount ===
                  1
                  ? aggregateX
                  : startX +
                    (
                      index /
                      (
                        pointCount -
                        1
                      )
                    ) *
                    span;


              points.push({
                kind:
                  'raw',

                x:
                  aggregateX,

                y:
                  aggregateY,

                targetX:
                  clamp(
                    targetX,
                    14,
                    88
                  ),

                targetY:
                  score,

                baseRadius:
                  RAW_POINT_RADIUS,

                canonicalKey:
                  aggregateItem.canonicalKey,

                fullName:
                  aggregateItem.fullName,

                colour:
                  aggregateItem.colour,

                rawScore:
                  score,

                scoreCount:
                  rawEmployer.statistics.count,

                median:
                  rawEmployer.statistics.median,

                q1:
                  rawEmployer.statistics.q1,

                q3:
                  rawEmployer.statistics.q3
              });
            }
          );
        }
      );


      return points;
    }


    /************************************************************
     * AGGREGATE VISIBILITY
     ************************************************************/

    function getAggregateVisibility(
      employerKey
    ) {
      if (
        splitProgress.has(
          employerKey
        )
      ) {
        return (
          1 -
          splitProgress.get(
            employerKey
          )
        );
      }

      if (
        mergingEmployers.has(
          employerKey
        )
      ) {
        return mergeProgress;
      }

      if (
        splitEmployers.has(
          employerKey
        )
      ) {
        return 0;
      }

      return 1;
    }


    function getAggregateRadius(
      chart,
      raw
    ) {
      if (
        !raw
      ) {
        return 0;
      }

      const visibility =
        getAggregateVisibility(
          raw.canonicalKey
        );

      if (
        visibility <=
        0.001
      ) {
        return 0;
      }

      return getDisplayedBubbleRadius(
        chart,
        raw
      );
    }


    /************************************************************
     * BUTTON STATE
     ************************************************************/

    function updateReaggregateButton() {
      const shouldShow =
        splitEmployers.size > 0 ||
        mergingEmployers.size > 0;


      reaggregateButton
        .classList
        .toggle(
          'is-hidden',
          !shouldShow
        );


      reaggregateButton.setAttribute(
        'aria-hidden',
        String(
          !shouldShow
        )
      );


      reaggregateButton.tabIndex =
        shouldShow
          ? 0
          : -1;


      reaggregateButton.disabled =
        interactionLocked;
    }


    /************************************************************
     * Y-AXIS DESCRIPTIONS
     ************************************************************/

    const axisDescriptionPlugin = {
      id:
        'axisDescriptionPlugin',


      afterDraw(
        chart
      ) {
        const yScale =
          chart.scales.y;


        if (
          !yScale
        ) {
          return;
        }


        const context =
          chart.ctx;

        const tickLength =
          Number(
            yScale.options
              .grid
              ?.tickLength ??
            0
          );

        const tickPadding =
          Number(
            yScale.options
              .ticks
              ?.padding ??
            0
          );


        /*
         * Position the descriptions against the same right edge
         * as the normal numerical tick labels.
         */
        const textX =
          yScale.right -
          tickLength -
          tickPadding +
          1;


        const descriptions = [
          {
            value:
              0,

            text:
              '(not at all)',

            offsetY:
              -13
          },

          {
            value:
              5,

            text:
              '(unsure)',

            offsetY:
              13
          },

          {
            value:
              10,

            text:
              '(extremely)',

            offsetY:
              13
          }
        ];


        context.save();

        context.font =
          '400 10px Lato, sans-serif';

        context.fillStyle =
          '#69718a';

        context.textAlign =
          'right';

        context.textBaseline =
          'middle';


        descriptions.forEach(
          description => {
            context.fillText(
              description.text,
              textX,
              yScale.getPixelForValue(
                description.value
              ) +
              description.offsetY
            );
          }
        );


        context.restore();
      }
    };


    /************************************************************
     * BUBBLE LABELS
     ************************************************************/

    const bubbleLabelPlugin = {
      id:
        'bubbleLabelPlugin',


      afterDatasetDraw(
        chart,
        args
      ) {
        /*
         * Aggregate labels are drawn immediately after aggregate
         * circles. The raw dataset is then rendered over both.
         */
        if (
          args.index !== 0
        ) {
          return;
        }


        const context =
          chart.ctx;

        const dataset =
          chart.data
            .datasets[0];

        const metadata =
          chart.getDatasetMeta(
            0
          );


        metadata.data.forEach(
          (
            element,
            index
          ) => {
            const raw =
              dataset.data[
                index
              ];


            if (
              !raw ||
              !raw.shortLabel
            ) {
              return;
            }


            const visibility =
              getAggregateVisibility(
                raw.canonicalKey
              );


            if (
              visibility <=
              0.02
            ) {
              return;
            }


            const radius =
              getDisplayedBubbleRadius(
                chart,
                raw
              );


            if (
              radius <=
              0
            ) {
              return;
            }


            /*
             * Keep every employer label the same readable size,
             * even when the text is larger than its bubble.
             */
            const fontSize =
              13;


            context.save();

            context.globalAlpha =
              visibility;

            context.textAlign =
              'center';

            context.textBaseline =
              'middle';

            context.font =
              `700 ${fontSize}px Lato, sans-serif`;

            context.lineJoin =
              'round';

            context.lineWidth =
              Math.max(
                1.8,
                fontSize *
                  0.15
              );

            context.strokeStyle =
              'rgba(255, 255, 255, 0.94)';

            context.fillStyle =
              '#151515';


            context.strokeText(
              raw.shortLabel,
              element.x,
              element.y
            );

            context.fillText(
              raw.shortLabel,
              element.x,
              element.y
            );


            context.restore();
          }
        );
      }
    };


    /************************************************************
     * INITIAL RISE
     *
     * This runs once only. Later split and merge actions never
     * move unrelated aggregate bubbles.
     ************************************************************/

    function animateInitialRise() {
      if (
        !promoterChart
      ) {
        return;
      }


      initialLoadActive =
        true;

      interactionLocked =
        true;

      updateReaggregateButton();


      runAnimation({
        duration:
          INITIAL_RISE_MS,

        easing:
          easeOutCubic,

        onFrame(
          progress
        ) {
          aggregatePoints.forEach(
            point => {
              point.y =
                point.targetY *
                progress;
            }
          );


          promoterChart.update(
            'none'
          );
        },

        onComplete() {
          aggregatePoints.forEach(
            point => {
              point.y =
                point.targetY;
            }
          );


          promoterChart.update(
            'none'
          );


          initialLoadActive =
            false;

          interactionLocked =
            false;

          updateReaggregateButton();
        }
      });
    }


    /************************************************************
     * SPLIT ONE EMPLOYER
     *
     * Only the selected employer's raw points move.
     * Existing aggregate and split points remain stationary.
     ************************************************************/

    function animateEmployerSplit(
      employerKey
    ) {
      if (
        interactionLocked ||
        splitEmployers.has(
          employerKey
        ) ||
        !promoterChart
      ) {
        return;
      }


      const aggregateItem =
        aggregateItems.find(
          item =>
            item.canonicalKey ===
            employerKey
        );

      const rawEmployer =
        rawEmployerData.get(
          employerKey
        );


      if (
        !aggregateItem ||
        !rawEmployer
          ?.scores
          ?.length
      ) {
        return;
      }


      interactionLocked =
        true;

      splitEmployers.add(
        employerKey
      );

      splitProgress.set(
        employerKey,
        0
      );


      const newPoints =
        createRawEmployerPoints(
          aggregateItem,
          rawEmployer
        );


      newPoints.forEach(
        point => {
          point.startX =
            point.x;

          point.startY =
            point.y;
        }
      );


      rawDisplayPoints.push(
        ...newPoints
      );


      promoterChart
        .data
        .datasets[1]
        .data =
          rawDisplayPoints;


      promoterChart.update(
        'none'
      );


      updateReaggregateButton();


      runAnimation({
        duration:
          SPLIT_ANIMATION_MS,

        easing:
          easeOutCubic,

        onFrame(
          progress
        ) {
          splitProgress.set(
            employerKey,
            progress
          );


          newPoints.forEach(
            point => {
              point.x =
                point.startX +
                (
                  point.targetX -
                  point.startX
                ) *
                progress;

              point.y =
                point.startY +
                (
                  point.targetY -
                  point.startY
                ) *
                progress;
            }
          );


          promoterChart.update(
            'none'
          );
        },

        onComplete() {
          newPoints.forEach(
            point => {
              point.x =
                point.targetX;

              point.y =
                point.targetY;
            }
          );


          splitProgress.delete(
            employerKey
          );


          promoterChart.update(
            'none'
          );


          interactionLocked =
            false;

          updateReaggregateButton();
        }
      });
    }


    /************************************************************
     * REVERSE ALL SPLITS
     *
     * Aggregate bubbles fade back in at their existing full size.
     * Raw points move back into them and are then removed.
     ************************************************************/

    function animateReaggregation() {
      if (
        interactionLocked ||
        !promoterChart ||
        splitEmployers.size ===
          0
      ) {
        return;
      }


      interactionLocked =
        true;

      mergeProgress =
        0;


      splitEmployers.forEach(
        employerKey => {
          mergingEmployers.add(
            employerKey
          );
        }
      );


      rawDisplayPoints.forEach(
        point => {
          const aggregatePoint =
            getAggregatePoint(
              point.canonicalKey
            );


          point.mergeStartX =
            point.x;

          point.mergeStartY =
            point.y;

          point.mergeTargetX =
            aggregatePoint?.x ??
            point.x;

          point.mergeTargetY =
            aggregatePoint?.targetY ??
            point.y;
        }
      );


      promoterChart.update(
        'none'
      );


      updateReaggregateButton();


      runAnimation({
        duration:
          MERGE_ANIMATION_MS,

        easing:
          easeInOutCubic,

        onFrame(
          progress
        ) {
          mergeProgress =
            progress;


          rawDisplayPoints.forEach(
            point => {
              point.x =
                point.mergeStartX +
                (
                  point.mergeTargetX -
                  point.mergeStartX
                ) *
                progress;

              point.y =
                point.mergeStartY +
                (
                  point.mergeTargetY -
                  point.mergeStartY
                ) *
                progress;
            }
          );


          promoterChart.update(
            'none'
          );
        },

        onComplete() {
          mergeProgress =
            1;


          rawDisplayPoints =
            [];


          promoterChart
            .data
            .datasets[1]
            .data =
              rawDisplayPoints;


          splitEmployers.clear();
          splittingCleanup();
          mergingEmployers.clear();

          mergeProgress =
            0;


          promoterChart.update(
            'none'
          );


          interactionLocked =
            false;

          updateReaggregateButton();
        }
      });
    }


    function splittingCleanup() {
      splitProgress.clear();
    }


    /************************************************************
     * CREATE CHART
     ************************************************************/

    function createChart() {
      const canvas =
        document.getElementById(
          'promoterChart'
        );

      const chartShell =
        canvas.parentElement;

      const fixedChartHeight =
        window.matchMedia(
          '(max-width: 350px)'
        ).matches
          ? 420
          : window.matchMedia(
              '(max-width: 430px)'
            ).matches
              ? 450
              : 585;

      const fixedChartWidth =
        Math.max(
          300,
          Math.round(
            chartShell.getBoundingClientRect().width
          )
        );

      /*
       * Set the canvas drawing dimensions once. Chart.js will no
       * longer enlarge it when additional raw points are added.
       */
      canvas.width =
        fixedChartWidth;

      canvas.height =
        fixedChartHeight;

      canvas.style.width =
        `${fixedChartWidth}px`;

      canvas.style.height =
        `${fixedChartHeight}px`;

      const context =
        canvas.getContext(
          '2d'
        );


      promoterChart =
        new Chart(
          context,
          {
            type:
              'scatter',


            data: {
              datasets: [
                {
                  label:
                    'Aggregated employer scores',

                  /*
                   * Higher order values are drawn first.
                   * The raw dataset uses a lower order and therefore
                   * renders over every aggregate bubble.
                   */
                  order:
                    10,

                  data:
                    aggregatePoints,

                  parsing:
                    false,

                  showLine:
                    false,

                  clip:
                    false,


                  pointRadius(
                    chartContext
                  ) {
                    return getAggregateRadius(
                      chartContext.chart,
                      chartContext.raw
                    );
                  },


                  pointHoverRadius(
                    chartContext
                  ) {
                    const raw =
                      chartContext.raw;

                    const radius =
                      getAggregateRadius(
                        chartContext.chart,
                        raw
                      );


                    if (
                      interactionLocked ||
                      radius <= 0
                    ) {
                      return radius;
                    }


                    return (
                      radius +
                      0.8
                    );
                  },


                  /*
                   * A zero hit radius makes overlap selection more
                   * precise and less sensitive.
                   */
                  pointHitRadius:
                    0,


                  pointBackgroundColor(
                    chartContext
                  ) {
                    const raw =
                      chartContext.raw;

                    const visibility =
                      raw
                        ? getAggregateVisibility(
                            raw.canonicalKey
                          )
                        : 0;

                    const anyEmployerSplit =
                      splitEmployers.size >
                        0 ||
                      mergingEmployers.size >
                        0;

                    const opacity =
                      anyEmployerSplit
                        ? DIMMED_AGGREGATE_OPACITY
                        : BUBBLE_OPACITY;


                    return hexToRgba(
                      raw?.colour ||
                      '#777777',

                      opacity *
                      visibility
                    );
                  },


                  pointHoverBackgroundColor(
                    chartContext
                  ) {
                    const raw =
                      chartContext.raw;

                    const visibility =
                      raw
                        ? getAggregateVisibility(
                            raw.canonicalKey
                          )
                        : 0;

                    const anyEmployerSplit =
                      splitEmployers.size >
                        0 ||
                      mergingEmployers.size >
                        0;

                    const opacity =
                      anyEmployerSplit
                        ? DIMMED_AGGREGATE_HOVER_OPACITY
                        : BUBBLE_HOVER_OPACITY;


                    return hexToRgba(
                      raw?.colour ||
                      '#777777',

                      opacity *
                      visibility
                    );
                  },


                  pointBorderWidth:
                    0,

                  pointHoverBorderWidth:
                    0
                },


                {
                  label:
                    'Raw employer scores',

                  /*
                   * Lower order means this dataset is rendered later
                   * and remains visually above aggregate bubbles.
                   */
                  order:
                    -10,

                  data:
                    rawDisplayPoints,

                  parsing:
                    false,

                  showLine:
                    false,

                  clip:
                    false,


                  pointRadius(
                    chartContext
                  ) {
                    return getDisplayedBubbleRadius(
                      chartContext.chart,
                      chartContext.raw
                    );
                  },


                  pointHoverRadius(
                    chartContext
                  ) {
                    const radius =
                      getDisplayedBubbleRadius(
                        chartContext.chart,
                        chartContext.raw
                      );


                    if (
                      interactionLocked ||
                      radius <= 0
                    ) {
                      return radius;
                    }


                    return (
                      radius +
                      0.7
                    );
                  },


                  /*
                   * Small hit padding retains usability without
                   * causing nearby overlapping points to activate.
                   */
                  pointHitRadius:
                    1,


                  pointBackgroundColor(
                    chartContext
                  ) {
                    return hexToRgba(
                      chartContext
                        .raw
                        ?.colour ||
                        '#777777',

                      BUBBLE_OPACITY
                    );
                  },


                  pointHoverBackgroundColor(
                    chartContext
                  ) {
                    return hexToRgba(
                      chartContext
                        .raw
                        ?.colour ||
                        '#777777',

                      BUBBLE_HOVER_OPACITY
                    );
                  },


                  pointBorderWidth:
                    0,

                  pointHoverBorderWidth:
                    0
                }
              ]
            },


            options: {
              responsive:
                false,

              maintainAspectRatio:
                false,

              /*
               * Match high-density screens while limiting the
               * maximum resolution to avoid excessive memory use.
               */
              devicePixelRatio:
                4,


              /*
               * Ordinary chart updates do not animate. Initial rise,
               * splitting and merging are controlled explicitly.
               */
              animation: {
                duration:
                  0
              },


              /*
               * Hover retains a brief, subtle radius transition.
               */
              transitions: {
                active: {
                  animation: {
                    duration:
                      HOVER_ANIMATION_MS,

                    easing:
                      'easeOutCubic'
                  }
                },

                resize: {
                  animation: {
                    duration:
                      0
                  }
                }
              },


              interaction: {
                mode:
                  'nearest',

                axis:
                  'xy',

                intersect:
                  true,

                includeInvisible:
                  false
              },


              layout: {
                autoPadding:
                  false,

                padding: {
                  top:
                    0,

                  right:
                    1,

                  bottom:
                    0,

                  /*
                   * Moves the y-axis and plotting area right so
                   * the descriptive labels remain inside the canvas.
                   */
                  left:
                    window.matchMedia(
                      '(max-width: 430px)'
                    ).matches
                      ? 32
                      : 36
                }
              },


              onHover(
                event,
                elements,
                chart
              ) {
                if (
                  interactionLocked ||
                  !elements.length
                ) {
                  chart.canvas.style.cursor =
                    'default';

                  return;
                }


                const selectedElement =
                  elements[0];


                const point =
                  chart
                    .data
                    .datasets[
                      selectedElement
                        .datasetIndex
                    ]
                    ?.data
                    ?.[
                      selectedElement
                        .index
                    ];


                chart.canvas.style.cursor =
                  selectedElement
                    .datasetIndex ===
                      0 &&
                  point?.kind ===
                    'aggregate' &&
                  point.canSplit &&
                  !splitEmployers.has(
                    point.canonicalKey
                  )
                    ? 'pointer'
                    : 'default';
              },


              onClick(
                event,
                elements,
                chart
              ) {
                if (
                  interactionLocked ||
                  !elements.length
                ) {
                  return;
                }


                const selectedElement =
                  elements[0];

                const point =
                  chart
                    .data
                    .datasets[
                      selectedElement
                        .datasetIndex
                    ]
                    ?.data
                    ?.[
                      selectedElement
                        .index
                    ];


                const renderedElement =
                  chart
                    .getDatasetMeta(
                      selectedElement
                        .datasetIndex
                    )
                    ?.data
                    ?.[
                      selectedElement
                        .index
                    ];


                /*
                 * One click or tap displays and retains the tooltip.
                 * This also works for raw-score points.
                 */
                chart.tooltip
                  .setActiveElements(
                    [
                      {
                        datasetIndex:
                          selectedElement
                            .datasetIndex,

                        index:
                          selectedElement
                            .index
                      }
                    ],

                    {
                      x:
                        Number.isFinite(
                          event.x
                        )
                          ? event.x
                          : renderedElement
                              ?.x ??
                            0,

                      y:
                        Number.isFinite(
                          event.y
                        )
                          ? event.y
                          : renderedElement
                              ?.y ??
                            0
                    }
                  );


                chart.update(
                  'none'
                );


                /*
                 * Only aggregate bubbles can be split. Raw bubbles
                 * retain normal single-tap tooltip behaviour.
                 */
                if (
                  selectedElement
                    .datasetIndex !==
                    0 ||
                  point?.kind !==
                    'aggregate' ||
                  !point.canSplit ||
                  splitEmployers.has(
                    point.canonicalKey
                  )
                ) {
                  lastAggregateClickKey =
                    null;

                  lastAggregateClickTime =
                    0;

                  return;
                }


                const clickedAt =
                  performance.now();

                const isSecondActivation =
                  lastAggregateClickKey ===
                    point.canonicalKey &&
                  (
                    clickedAt -
                    lastAggregateClickTime
                  ) <=
                    DOUBLE_ACTIVATION_MS;


                if (
                  isSecondActivation
                ) {
                  lastAggregateClickKey =
                    null;

                  lastAggregateClickTime =
                    0;


                  chart.tooltip
                    .setActiveElements(
                      [],
                      {
                        x:
                          0,

                        y:
                          0
                      }
                    );


                  chart.update(
                    'none'
                  );


                  animateEmployerSplit(
                    point.canonicalKey
                  );

                  return;
                }


                /*
                 * This was the first click or tap. Keep the tooltip
                 * open and wait to see whether another follows.
                 */
                lastAggregateClickKey =
                  point.canonicalKey;

                lastAggregateClickTime =
                  clickedAt;
              },

              plugins: {
                legend: {
                  display:
                    false
                },


                tooltip: {
                  enabled:
                    true,

                  mode:
                    'nearest',

                  intersect:
                    true,

                  displayColors:
                    false,

                  backgroundColor:
                    '#ffffff',

                  titleColor:
                    '#151515',

                  bodyColor:
                    '#69718a',

                  borderColor:
                    '#e8eaf0',

                  borderWidth:
                    1,

                  cornerRadius:
                    4,

                  padding:
                    9,


                  titleFont: {
                    family:
                      'Lato',

                    size:
                      12,

                    weight:
                      '700'
                  },


                  bodyFont: {
                    family:
                      'Lato',

                    size:
                      11,

                    weight:
                      '400'
                  },


                  filter() {
                    return (
                      !initialLoadActive &&
                      !interactionLocked
                    );
                  },


                  callbacks: {
                    title(
                      tooltipItems
                    ) {
                      return (
                        tooltipItems
                          ?.[0]
                          ?.raw
                          ?.fullName ||
                        ''
                      );
                    },


                    label(
                      tooltipItem
                    ) {
                      const raw =
                        tooltipItem.raw;


                      if (
                        raw?.kind ===
                        'raw'
                      ) {
                        return [
                          `Raw score: ${formatStatistic(raw.rawScore)}`,
                          `Respondents: ${formatNumber(raw.scoreCount)}`,
                          (
                            'Median [IQR]: ' +
                            `${formatStatistic(raw.median)} ` +
                            `[${formatStatistic(raw.q1)}–${formatStatistic(raw.q3)}]`
                          )
                        ];
                      }


                      return [
                        `Median score: ${formatStatistic(raw?.targetY)}`,
                        `Respondents: ${formatNumber(raw?.respondents ?? 0)}`,
                        raw?.canSplit
                          ? 'Click to show raw scores'
                          : ''
                      ].filter(
                        Boolean
                      );
                    }
                  }
                }
              },


              scales: {
                x: {
                  type:
                    'linear',

                  min:
                    0,

                  max:
                    100,

                  display:
                    false,

                  grid: {
                    display:
                      false
                  },

                  border: {
                    display:
                      false
                  }
                },


                y: {
                  min:
                    0,

                  max:
                    10,


                  title: {
                    display:
                      true,

                    text:
                      '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0Score',

                    color:
                      '#151515',

                    font: {
                      family:
                        'Lato',

                      size:
                        13,

                      weight:
                        '700'
                    },

                    padding: {
                      bottom:
                        0
                    }
                  },


                  ticks: {
                    stepSize:
                      1,

                    color:
                      '#151515',
                    
                    padding:
                      2,

                    autoSkip:
                      false,

                    maxRotation:
                      0,

                    minRotation:
                      0,

                    font: {
                      family:
                        'Lato',

                      size:
                        12,

                      weight:
                        '400'
                    },


                    callback(
                      value
                    ) {
                      return String(
                        Number(
                          value
                        )
                      );
                    }
                  },


                  grid: {
                    color:
                      'rgba(105, 113, 138, 0.075)',

                    lineWidth:
                      1,

                    drawTicks:
                      true,

                    tickLength:
                      7,

                    tickColor:
                      '#151515',

                    tickWidth:
                      1.2
                  },


                  border: {
                    display:
                      true,

                    color:
                      '#151515',

                    width:
                      1.1
                  }
                }
              }
            },


            plugins: [
              axisDescriptionPlugin,
              bubbleLabelPlugin
            ]
          }
        );
    }


    /************************************************************
     * RE-AGGREGATE
     ************************************************************/

    reaggregateButton.addEventListener(
      'click',
      animateReaggregation
    );


    /************************************************************
     * LOAD ONCE
     ************************************************************/

    async function loadPromoterChart() {
      try {
        setStatus();


        const [
          aggregateRows,
          rawRows
        ] =
          await Promise.all([
            loadSheetQuery(
              AGGREGATE_QUERY
            ),

            loadSheetQuery(
              RAW_QUERY
            )
          ]);


        aggregateItems =
          normaliseAggregateRows(
            aggregateRows
          );


        rawEmployerData =
          normaliseRawRows(
            rawRows
          );


        if (
          !aggregateItems.length
        ) {
          throw new Error(
            'No valid aggregate rows found in columns AM to AO'
          );
        }


        aggregatePositions =
          buildAggregatePositions(
            aggregateItems
          );


        aggregatePoints =
          buildAggregatePoints(
            aggregateItems
          );


        createChart();

        updateReaggregateButton();

        setStatus();

        animateInitialRise();

      } catch (
        error
      ) {
        console.error(
          error
        );


        setStatus(
          '⚠ ' +
          String(
            error?.message ||
            'Unable to load chart'
          ).replace(
            /\.+$/,
            ''
          )
        );
      }
    }


    loadPromoterChart();
  </script>
</body>
