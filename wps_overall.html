<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PFF Workplace Promoter Score</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
  ></script>

  <style>
    :root {
      --purple: #6600ff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
      --live-red: #e53935;

      --blue-cone: rgba(74, 86, 255, 0.82);
      --green-cone: rgba(36, 210, 116, 0.78);
      --red-cone: rgba(255, 92, 48, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      color: var(--ink);
      background: #fff;
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    #app {
      position: relative;
      width: min(calc(100% - 12px), 520px);
      max-width: 100%;
      min-width: 0;
      margin-inline: auto;
      padding: 7px 6px 0;
      overflow: hidden;
      background: #fff;
    }

    /*
     * Retain the normal module dimensions while hiding its
     * contents beneath the loading animation.
     */
    #app.is-loading > :not(.app-loading) {
      visibility: hidden;
    }

    #app:not(.is-loading) .app-loading {
      display: none;
    }

    .app-loading {
      position: absolute;
      inset: 0;
      z-index: 100;

      display: flex;
      min-height: 210px;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #fff;
    }

    .cone-loader {
      position: relative;
      width: 176px;
      height: 78px;
      margin: 0 auto;
      overflow: visible;
      isolation: isolate;
    }

    .cone {
      position: absolute;
      bottom: 8px;
      width: 58px;
      height: 68px;
      opacity: 0;

      clip-path:
        polygon(
          50% 0%,
          100% 100%,
          0% 100%
        );

      -webkit-clip-path:
        polygon(
          50% 0%,
          100% 100%,
          0% 100%
        );

      mix-blend-mode: normal;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: opacity;
    }

    .cone.blue {
      left: 33px;
      background: var(--blue-cone);

      animation:
        blueConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.green {
      left: 69px;
      background: var(--green-cone);

      animation:
        greenConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .cone.red {
      left: 85px;
      background: var(--red-cone);

      animation:
        redConeCycle
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    .loader-text {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;

      animation:
        loadingTextPulse
        2.7s
        infinite
        cubic-bezier(
          0.45,
          0,
          0.25,
          1
        );
    }

    @keyframes blueConeCycle {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes greenConeCycle {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 0;
      }

      32% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes redConeCycle {
      0% {
        opacity: 0;
      }

      40% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      76% {
        opacity: 1;
      }

      87% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes loadingTextPulse {
      0% {
        opacity: 0.45;
      }

      52% {
        opacity: 0.78;
      }

      76% {
        opacity: 0.78;
      }

      87% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.45;
      }
    }

    /* ---------- Tab and live status ---------- */

    .module-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--track);
    }

    .tab-scroll-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tab-list {
      position: relative;
      display: flex;
      width: 100%;
      align-items: flex-end;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-scroll-arrow {
      position: absolute;
      top: 3px;
      z-index: 3;

      display: none;
      width: 18px;
      height: 20px;
      align-items: center;
      justify-content: center;

      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 10px;

      font-size: 18px;
      font-weight: 700;
      line-height: 1;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 160ms ease;
    }

    .tab-scroll-arrow-left {
      left: 0;
    }

    .tab-scroll-arrow-right {
      right: 0;
    }

    /*
     * One shared indicator moves underneath the active tab,
     * rather than each tab displaying its own separate line.
     */
    .tab-list::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 1;

      width:
        var(
          --tab-indicator-width,
          0px
        );

      height: 2px;
      background: var(--purple);
      pointer-events: none;

      transform:
        translate3d(
          var(
            --tab-indicator-x,
            0px
          ),
          0,
          0
        );

      transition:
        transform 300ms
          cubic-bezier(
            0.22,
            1,
            0.36,
            1
          ),
        width 300ms
          cubic-bezier(
            0.22,
            1,
            0.36,
            1
          );

      will-change:
        transform,
        width;
    }

    /*
     * Suppress animation when initially positioning the line
     * or recalculating it after a browser resize.
     */
    .tab-list.is-positioning::after {
      transition: none;
    }

    .chart-tab {
      flex: 0 0 auto;
      min-height: 29px;
      margin: 0;
      padding: 0 9px 6px;
      color: var(--muted);
      background: #fff;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;

      transition:
        color 180ms ease,
        border-color 180ms ease;
    }

    .chart-tab.is-active {
      color: var(--purple);
      border-bottom-color: transparent;
      cursor: default;
    }

    .chart-tab:focus-visible {
      outline: none;
    }

    .live-data {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin: 0 1px 8px 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .live-data-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--live-red);
    }

    #status {
      width: 100%;
      margin: 3px 0 0;
      color: var(--error);
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
    }

    #status:empty {
      display: none;
    }

    /* ---------- Chart heading ---------- */

    .chart-heading-row {
      position: relative;
      width: 100%;
      height: 30px;
      min-height: 30px;
      margin: 0;
    }

    .chart-heading {
      margin: 0;
      padding: 4px 112px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: left;
      white-space: nowrap;
      opacity: 1;
      will-change: opacity;
    }
    
    .reaggregate-button {
      position: absolute;
      top: 2px;
      right: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;

      min-height: 27px;
      padding: 0 6px;

      color: var(--muted);
      background: #fff;
      border: 1px solid var(--track);
      border-radius: 4px;
      box-shadow: none;

      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;

      cursor: pointer;

      transition:
        color 140ms ease,
        border-color 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease,
        visibility 0s linear;
    }

    .reaggregate-button:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow:
        inset 0 0 0 1px
        rgba(21, 21, 21, 0.12);
    }

    .reaggregate-button:focus-visible {
      outline: none;
    }

    .reaggregate-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .reaggregate-button.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .reset-icon {
      display: inline-block;
      color: var(--purple);
      font-size: 15px;
      line-height: 1;
    }

    /* ---------- Constant-size chart ---------- */

    .chart-shell {
      position: relative;
      display: block;
      width: 100%;
      height: 585px;
      min-height: 585px;
      max-height: 585px;
      flex: 0 0 585px;
      margin: -3px 0 0;
      overflow: hidden;
      contain: strict;
    }

    #promoterChart {
      position: absolute;
      top: 0;
      right: 0;
      bottom: auto;
      left: 0;
      display: block;
      width: 100%;
      touch-action: manipulation;
      height: 585px !important;
      min-height: 585px !important;
      max-height: 585px !important;
    }

    @media (max-width: 430px) {
      #app {
        width: calc(100% - 6px);
        padding: 6px 2px 0;
      }

      .tab-scroll-arrow {
        display: inline-flex;
      }

      .tab-scroll-shell.can-scroll-left
        .tab-scroll-arrow-left {
        opacity: 0.72;
      }

      .tab-scroll-shell.can-scroll-right
        .tab-scroll-arrow-right {
        opacity: 0.72;
      }

      .chart-tab {
        padding-right: 7px;
        padding-left: 7px;
        font-size: 12px;
      }

      .live-data {
        margin-right: 3px;
        font-size: 8px;
      }

      .chart-heading-row {
        height: 29px;
        min-height: 29px;
      }

      .chart-heading {
        padding-top: 4px;
        padding-right: 105px;
        font-size: 14px;
        line-height: 21px;
      }

      .reaggregate-button {
        min-height: 26px;
        padding-right: 5px;
        padding-left: 5px;
        font-size: 10px;
      }

      .chart-shell {
        height: 450px;
        min-height: 450px;
        max-height: 450px;
        flex-basis: 450px;
      }

      #promoterChart {
        height: 450px !important;
        min-height: 450px !important;
        max-height: 450px !important;
      }
    }

    @media (max-width: 350px) {
      .chart-heading {
        padding-right: 97px;
        font-size: 13px;
      }

      .reaggregate-button {
        font-size: 9px;
      }

      .chart-shell {
        height: 420px;
        min-height: 420px;
        max-height: 420px;
        flex-basis: 420px;
      }

      #promoterChart {
        height: 420px !important;
        min-height: 420px !important;
        max-height: 420px !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .cone.blue,
      .cone.green,
      .cone.red {
        animation: none;
        opacity: 1;
      }

      .loader-text {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main
      id="app"
      class="is-loading"
      aria-busy="true"
    >
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading workplace survey data"
      >
        <div class="cone-loader">
          <div
            class="cone blue"
            aria-hidden="true"
          ></div>

          <div
            class="cone green"
            aria-hidden="true"
          ></div>

          <div
            class="cone red"
            aria-hidden="true"
          ></div>
        </div>

        <div class="loader-text">
          Loading workplace data...
        </div>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <div
            class="tab-list"
          role="tablist"
          aria-label="Workplace survey views"
        >
          <button
            class="chart-tab is-active"
            type="button"
            role="tab"
            data-view="overall"
            aria-selected="true"
          >
            Overall
          </button>

          <button
            class="chart-tab"
            type="button"
            role="tab"
            data-view="pay"
            aria-selected="false"
          >
            Pay
          </button>

          <button
            class="chart-tab"
            type="button"
            role="tab"
            data-view="worklife"
            aria-selected="false"
          >
            Work-life
          </button>

          <button
            class="chart-tab"
            type="button"
            role="tab"
            data-view="autonomy"
            aria-selected="false"
          >
            Autonomy
          </button>

          <button
            class="chart-tab"
            type="button"
            role="tab"
            data-view="support"
            aria-selected="false"
          >
            Support
          </button>

          <button
            class="chart-tab"
            type="button"
            role="tab"
            data-view="workload"
            aria-selected="false"
          >
            Workload
          </button>

          <button
            class="chart-tab"
            type="button"
            role="tab"
            data-view="tech"
            aria-selected="false"
          >
            Tech
          </button>
          </div>

          <span
            class="tab-scroll-arrow tab-scroll-arrow-left"
            aria-hidden="true"
          >‹</span>

          <span
            class="tab-scroll-arrow tab-scroll-arrow-right"
            aria-hidden="true"
          >›</span>
        </div>

        <div
          class="live-data"
          aria-label="Live data"
        >
          <span
            class="live-data-dot"
            aria-hidden="true"
          ></span>

          <span>LIVE data</span>
        </div>
      </div>

      <div
        id="status"
        role="alert"
        aria-live="polite"
      ></div>

      <div class="chart-heading-row">
        <h2
          id="chartHeading"
          class="chart-heading"
        >
          Likely to recommend workplace?
        </h2>

        <button
          id="reaggregateButton"
          class="reaggregate-button is-hidden"
          type="button"
          aria-hidden="true"
          tabindex="-1"
        >
          <span>Re-aggregate</span>
          <span
            class="reset-icon"
            aria-hidden="true"
          >↻</span>
        </button>
      </div>

      <div class="chart-shell">
        <canvas
          id="promoterChart"
          aria-label="Workplace promoter score chart"
        ></canvas>
      </div>

    </main>
  </div>

  <script>
    /************************************************************
     * GLOBAL CHART SETTINGS
     ************************************************************/

    Chart.defaults.font.family =
      "'Lato', sans-serif";

    Chart.defaults.color =
      '#151515';


    /************************************************************
     * GOOGLE SHEET SETTINGS
     ************************************************************/

    const SHEET_ID =
      '1G3BV5lA_jaRPRR3ZmFWL-j8nRVWk5k01D-gOeO5nVgQ';

    const SHEET_NAME =
      'Data';


    const OVERALL_AXIS_TITLE =
      (
        '\u00A0\u00A0\u00A0\u00A0' +
        '\u00A0\u00A0\u00A0\u00A0' +
        '\u00A0\u00A0\u00A0\u00A0' +
        '\u00A0\u00A0\u00A0\u00A0' +
        '\u00A0\u00A0\u00A0\u00A0' +
        '\u00A0\u00A0Score'
      );


    const ENDORSEMENT_AXIS_TITLE =
      '% of optometrists endorsing';


    const VIEW_CONFIG = {
      overall: {
        heading:
          'Likely to recommend workplace?',

        axisTitle:
          OVERALL_AXIS_TITLE,

        tooltipLabel:
          'Median score',

        query:
          (
            'select AM, AN, AO ' +
            'where AM is not null ' +
            'and AN is not null ' +
            'and AO is not null'
          )
      },


      pay: {
        heading:
          'Pay/bonuses',

        axisTitle:
          ENDORSEMENT_AXIS_TITLE,

        tooltipLabel:
          'Optometrists endorsing',

        query:
          (
            'select AL, AS, AT ' +
            'where AL is not null ' +
            'and AS is not null ' +
            'and AT is not null'
          )
      },


      worklife: {
        heading:
          'Work-life flexibility',

        axisTitle:
          ENDORSEMENT_AXIS_TITLE,

        tooltipLabel:
          'Optometrists endorsing',

        query:
          (
            'select AL, AX, AY ' +
            'where AL is not null ' +
            'and AX is not null ' +
            'and AY is not null'
          )
      },


      autonomy: {
        heading:
          'Clinical autonomy & professional growth',

        axisTitle:
          ENDORSEMENT_AXIS_TITLE,

        tooltipLabel:
          'Optometrists endorsing',

        query:
          (
            'select AL, BC, BD ' +
            'where AL is not null ' +
            'and BC is not null ' +
            'and BD is not null'
          )
      },


      support: {
        heading:
          'Supportive team & management',

        axisTitle:
          ENDORSEMENT_AXIS_TITLE,

        tooltipLabel:
          'Optometrists endorsing',

        query:
          (
            'select AL, BH, BI ' +
            'where AL is not null ' +
            'and BH is not null ' +
            'and BI is not null'
          )
      },


      workload: {
        heading:
          'Staffing & sustainable workload',

        axisTitle:
          ENDORSEMENT_AXIS_TITLE,

        tooltipLabel:
          'Optometrists endorsing',

        query:
          (
            'select AL, BM, BN ' +
            'where AL is not null ' +
            'and BM is not null ' +
            'and BN is not null'
          )
      },


      tech: {
        heading:
          'Quality equipment & technology',

        axisTitle:
          ENDORSEMENT_AXIS_TITLE,

        tooltipLabel:
          'Optometrists endorsing',

        query:
          (
            'select AL, BR, BS ' +
            'where AL is not null ' +
            'and BR is not null ' +
            'and BS is not null'
          )
      }
    };


    const VIEW_KEYS =
      Object.keys(
        VIEW_CONFIG
      );


    /*
     * B = employer
     * C = recommendation score
     */
    const RAW_QUERY =
      (
        'select B, C ' +
        'where B is not null ' +
        'and C is not null'
      );


    /************************************************************
     * CHART APPEARANCE
     ************************************************************/

    const MIN_RADIUS =
      8;

    const MAX_RADIUS =
      50;

    const BUBBLE_EXPONENT =
      0.80;

    const BUBBLE_MULTIPLIER =
      1.76;

    const BUBBLE_OFFSET =
      4;

    const BUBBLE_OPACITY =
      0.91;

    const BUBBLE_HOVER_OPACITY =
      0.98;

    const RAW_POINT_RADIUS =
      3.8;

    /*
     * Initial rise happens once.
     * Splitting and re-aggregation use separate custom animations.
     */
    const INITIAL_RISE_MS =
      900;

    const SPLIT_ANIMATION_MS =
      820;

    const MERGE_ANIMATION_MS =
      820;

    /*
     * Keeps hover changes subtle and less distracting.
     */
    const HOVER_ANIMATION_MS =
      170;

    const VIEW_TRANSITION_MS =
      1500;

    /*
     * Maximum interval between two clicks or taps for splitting.
     */
    const DOUBLE_ACTIVATION_MS =
      420;

    /*
     * Aggregate bubbles become more transparent whenever at
     * least one employer is displaying raw scores.
     */
    const DIMMED_AGGREGATE_OPACITY =
      0.50;

    const DIMMED_AGGREGATE_HOVER_OPACITY =
      0.62;

    /*
     * Employer labels fade proportionally with the aggregate
     * bubbles whenever raw scores are displayed.
     */
    const DIMMED_AGGREGATE_LABEL_OPACITY =
      0.55;


    /************************************************************
     * STATE
     ************************************************************/

    let promoterChart =
      null;

    /*
     * Overall aggregate rows are retained separately because
     * raw-score splitting is available only from Overall.
     */
    let aggregateItems =
      [];

    /*
     * These maps store the rows, employer records and horizontal
     * positions for every chart view.
     */
    const viewItems =
      new Map();

    const viewEmployerData =
      new Map();

    const viewPositions =
      new Map();

    let aggregatePoints =
      [];

    let aggregatePositions =
      new Map();

    let rawEmployerData =
      new Map();

    let rawDisplayPoints =
      [];

    let initialLoadActive =
      false;

    let interactionLocked =
      false;

    let activeAnimationFrame =
      null;

    let mergeProgress =
      0;

    /*
     * 0 = normal aggregate opacity
     * 1 = fully dimmed aggregate opacity
     */
    let aggregateDimProgress =
      0;

    /*
     * Overall uses a displayed scale of 0–10.
     * Every endorsement view uses 0–100.
     */
    let activeView =
      'overall';

    let axisDescriptionOpacity =
      1;

    let axisTickMultiplier =
      0.1;

    /*
     * Used to distinguish a single click/tap from a second
     * click/tap on the same aggregate bubble.
     */

    function normaliseEmployerName(
      value
    ) {
      return String(
        value || ''
      )
        .toLowerCase()
        .normalize('NFKD')
        .replace(
          /[’‘]/g,
          "'"
        )
        .replace(
          /&/g,
          ' and '
        )
        .replace(
          /[^a-z0-9]+/g,
          ' '
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        );
    }

    function getEmployerAppearance(
      employerName
    ) {
      const original =
        String(
          employerName || ''
        ).trim();

      const normalised =
        normaliseEmployerName(
          original
        );

      const knownEmployer =
        EMPLOYER_ALIAS_MAP.get(
          normalised
        );

      if (
        knownEmployer
      ) {
        return knownEmployer;
      }

      const fallbackKey =
        normalised ||
        `unknown-${original}`;

      if (
        original.length <=
        10
      ) {
        return {
          key:
            fallbackKey,

          label:
            original || '—',

          fullName:
            original ||
            'Unknown employer',

          colour:
            '#777777'
        };
      }

      const initials =
        original
          .split(/\s+/)
          .filter(Boolean)
          .map(
            word =>
              word.charAt(0)
          )
          .join('')
          .slice(0, 6);

      return {
        key:
          fallbackKey,

        label:
          initials ||
          original.slice(
            0,
            10
          ),

        fullName:
          original,

        colour:
          '#777777'
      };
    }

    function toNumber(
      value
    ) {
      const number =
        typeof value ===
          'number'
          ? value
          : parseFloat(
              String(
                value
              ).replace(
                /[^\d.-]/g,
                ''
              )
            );

      return Number.isFinite(
        number
      )
        ? number
        : NaN;
    }


    function toPercentage(
      value
    ) {
      const number =
        toNumber(
          value
        );

      if (
        !Number.isFinite(
          number
        )
      ) {
        return NaN;
      }

      /*
       * Google Sheets percentage cells commonly return 0–1
       * even when displayed as 0%–100%.
       */
      return number >= 0 &&
        number <= 1
          ? number * 100
          : number;
    }
    function clamp(
      value,
      minimum,
      maximum
    ) {
      return Math.max(
        minimum,
        Math.min(
          maximum,
          value
        )
      );
    }


    function hexToRgba(
      hex,
      opacity
    ) {
      const cleaned =
        String(
          hex
        )
          .replace(
            '#',
            ''
          )
          .trim();

      if (
        !/^[0-9a-f]{6}$/i.test(
          cleaned
        )
      ) {
        return (
          `rgba(119, 119, 119, ${opacity})`
        );
      }

      const red =
        parseInt(
          cleaned.slice(
            0,
            2
          ),
          16
        );

      const green =
        parseInt(
          cleaned.slice(
            2,
            4
          ),
          16
        );

      const blue =
        parseInt(
          cleaned.slice(
            4,
            6
          ),
          16
        );

      return (
        `rgba(${red}, ${green}, ${blue}, ${opacity})`
      );
    }


    function getBaseBubbleRadius(
      respondents
    ) {
      const calculated =
        BUBBLE_OFFSET +
        (
          Math.pow(
            respondents,
            BUBBLE_EXPONENT
          ) *
          BUBBLE_MULTIPLIER
        );

      return clamp(
        calculated,
        MIN_RADIUS,
        MAX_RADIUS
      );
    }


    function getDisplayedBubbleRadius(
      chart,
      raw
    ) {
      const baseRadius =
        Number(
          raw?.baseRadius
        );

      if (
        !Number.isFinite(
          baseRadius
        ) ||
        baseRadius <= 0
      ) {
        return 0;
      }

      const chartWidth =
        Number(
          chart?.width
        );

      const safeChartWidth =
        Number.isFinite(
          chartWidth
        ) &&
        chartWidth > 0
          ? chartWidth
          : 520;

      const widthScale =
        clamp(
          safeChartWidth / 520,
          0.72,
          1
        );

      return (
        baseRadius *
        widthScale
      );
    }


    function percentile(
      sortedValues,
      probability
    ) {
      if (
        !sortedValues.length
      ) {
        return NaN;
      }

      if (
        sortedValues.length ===
        1
      ) {
        return sortedValues[0];
      }

      const index =
        (
          sortedValues.length -
          1
        ) *
        probability;

      const lowerIndex =
        Math.floor(
          index
        );

      const upperIndex =
        Math.ceil(
          index
        );

      if (
        lowerIndex ===
        upperIndex
      ) {
        return sortedValues[
          lowerIndex
        ];
      }

      const fraction =
        index -
        lowerIndex;

      return (
        sortedValues[
          lowerIndex
        ] +
        (
          sortedValues[
            upperIndex
          ] -
          sortedValues[
            lowerIndex
          ]
        ) *
        fraction
      );
    }


    function calculateScoreStatistics(
      scores
    ) {
      const sorted =
        scores
          .filter(
            Number.isFinite
          )
          .slice()
          .sort(
            (
              first,
              second
            ) =>
              first -
              second
          );

      return {
        count:
          sorted.length,

        median:
          percentile(
            sorted,
            0.50
          ),

        q1:
          percentile(
            sorted,
            0.25
          ),

        q3:
          percentile(
            sorted,
            0.75
          )
      };
    }


    function easeOutCubic(
      progress
    ) {
      return (
        1 -
        Math.pow(
          1 - progress,
          3
        )
      );
    }


    function easeInOutCubic(
      progress
    ) {
      return progress < 0.5
        ? 4 *
          progress *
          progress *
          progress
        : 1 -
          Math.pow(
            -2 *
            progress +
            2,
            3
          ) /
          2;
    }


    function runAnimation({
      duration,
      easing,
      onFrame,
      onComplete
    }) {
      if (
        activeAnimationFrame
      ) {
        cancelAnimationFrame(
          activeAnimationFrame
        );
      }

      const reduceMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if (
        reduceMotion ||
        duration <= 0
      ) {
        onFrame(1);

        if (
          onComplete
        ) {
          onComplete();
        }

        return;
      }

      const startedAt =
        performance.now();


      function frame(
        now
      ) {
        const progress =
          Math.min(
            (
              now -
              startedAt
            ) /
            duration,
            1
          );

        const eased =
          easing(
            progress
          );

        onFrame(
          eased
        );

        if (
          progress <
          1
        ) {
          activeAnimationFrame =
            requestAnimationFrame(
              frame
            );
        } else {
          activeAnimationFrame =
            null;

          if (
            onComplete
          ) {
            onComplete();
          }
        }
      }


      activeAnimationFrame =
        requestAnimationFrame(
          frame
        );
    }

    function loadSheetQuery(
      query
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const callbackName =
            'pffPromoterCallback_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() *
              1000000
            );

          const script =
            document.createElement(
              'script'
            );

          const timeout =
            window.setTimeout(
              () => {
                cleanup();

                reject(
                  new Error(
                    'Could not load Google Sheet data'
                  )
                );
              },
              20000
            );


          function cleanup() {
            window.clearTimeout(
              timeout
            );

            try {
              delete window[
                callbackName
              ];
            } catch (_) {
              window[
                callbackName
              ] = undefined;
            }

            if (
              script.parentNode
            ) {
              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] = response => {
            cleanup();

            if (
              !response ||
              response.status ===
                'error'
            ) {
              reject(
                new Error(
                  response
                    ?.errors
                    ?.[0]
                    ?.detailed_message ||
                  'Could not load Google Sheet data'
                )
              );

              return;
            }

            resolve(
              response
                ?.table
                ?.rows ||
              []
            );
          };


          script.onerror =
            () => {
              cleanup();

              reject(
                new Error(
                  'Network error loading Google Sheet data'
                )
              );
            };


          const params =
            new URLSearchParams({
              sheet:
                SHEET_NAME,

              headers:
                '1',

              tq:
                query,

              tqx:
                `responseHandler:${callbackName}`,

              _:
                String(
                  Date.now()
                )
            });


          script.src =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
            params.toString();


          document.body
            .appendChild(
              script
            );
        }
      );
    }

    function normaliseAggregateRows(
      rows

      const employers =
        new Map();


      rows.forEach(
        row => {
          const employerName =
            String(
              getCellValue(
                row?.c?.[0]

            ).trim();

          const score =
            toNumber(
              getCellValue(
                row?.c?.[1]
              )
            );

          const respondents =
            toNumber(
              getCellValue(
                row?.c?.[2]
              )
            );


          if (
            !employerName ||
            !Number.isFinite(
              score
            ) ||
            score < 0 ||
            score > 10 ||
            !Number.isFinite(
              respondents
            ) ||
            respondents <= 0
          ) {
            return;
          }


          const appearance =
            getEmployerAppearance(
              employerName
            );


          employers.set(
            appearance.key,
            {
              canonicalKey:
                appearance.key,

              sourceName:
                employerName,

              score,

              respondents,

              label:
                appearance.label,

              fullName:
                appearance.fullName,

              colour:
                appearance.colour
            }
          );
        }
      );


      return [
        ...employers.values()
      ];
    }
