<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workplace Promoter Score</title>

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #6600ff;
      --purple-soft: #f4efff;
      --ink: #151515;
      --muted: #69718a;
      --track: #e8eaf0;
      --error: #b42318;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      background: #fff;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #fit {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100dvh;
      width: 100%;
    }

    .box {
      width: min(calc(100% - 16px), 520px);
      max-width: 100%;
      min-width: 0;
      margin-inline: auto;
      padding: 14px 14px 22px;
      text-align: center;
    }

    .tracker-notice {
      width: 100%;
      margin: 0 0 8px;
      padding: 0 0 14px;
      border-bottom: 1px solid var(--track);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .tracker-notice p { margin: 0; }

    .tracker-notice p + p { margin-top: 2px; }

    .step { display: none; }

    .step.active {
      display: grid;
      grid-template-areas:
        "progress"
        "body"
        "nav";
      grid-template-rows: 28px minmax(0, 1fr) 48px;
      min-height: clamp(480px, 64dvh, 580px);
      align-items: stretch;
    }
    
    .progress {
      grid-area: progress;
      min-height: 28px;
      margin: 0;
      padding: 0;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 28px;
      text-align: center;
      text-transform: uppercase;
    }

    .step-body {
      grid-area: body;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-width: 0;
      padding: 18px 0 14px;
    }

    .step-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin: 0 0 12px;
      color: var(--ink);
      font-size: clamp(22px, 5.4vw, 28px);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }

    .step-title small,
    .checklist-title small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
    }

    .employer-context {
      display: block;
      margin-bottom: 8px;
      color: var(--purple);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .score-input {
      display: block;
      width: 100%;
      height: 50px;
      margin: 0 auto 18px;
      padding: 0 4px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--track);
      border-radius: 0;
      font: inherit;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      outline: none;
      transition:
        border-color 140ms ease,
        box-shadow 140ms ease;
    }

    .score-input:hover {
      border-bottom-color: var(--muted);
    }

    .score-input:focus-visible {
      border-bottom-color: var(--purple);
      box-shadow: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    .checklist-title {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
    }

    .checklist {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 2px;
      width: 100%;
      margin: 0;
      text-align: left;
    }

    .check-option {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      width: 100%;
      height: 28px;
      margin: 0;
      padding: 3px 8px;
      color: var(--ink);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      text-align: left;
      white-space: nowrap;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .check-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--purple);
    }

    .check-option:hover {
      background: #fafafa;
      border-color: var(--track);
    }

    .check-option:not(.employer-option):focus-within {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .check-option input:focus-visible {
      outline: none;
    }
    
    .check-option.selected {
      background: var(--purple-soft);
      border-color: var(--purple);
    }

    .check-option.selected:hover {
      background: var(--purple-soft);
      border-color: var(--purple);
    }
    


    /* ---------- Employer selection cards (Q1 only) ---------- */

    .employer-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .check-option.employer-option {
      --employer-colour: var(--purple);

      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      font-size: inherit;
      line-height: normal;
      white-space: normal;
    }

    .check-option.employer-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      opacity: 0;
      pointer-events: none;
    }

    .employer-card {
      display: flex;
      width: 100%;
      min-height: 34px;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 4px 4px 5px;
      overflow: hidden;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--track);
      border-radius: 0;
      box-shadow: none;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.12;
      text-align: center;
      white-space: normal;
      transition:
        border-color 140ms ease,
        box-shadow 140ms ease,
        transform 140ms ease;
    }

    .check-option.employer-option:hover {
      background: transparent;
      border-color: transparent;
    }

    .check-option.employer-option:hover .employer-card {
      border-bottom-color: var(--employer-colour);
    }

    .check-option.employer-option.selected,
    .check-option.employer-option.selected:hover {
      background: transparent;
      border-color: transparent;
    }

    .check-option.employer-option.selected .employer-card {
      border-bottom-color: var(--employer-colour);
      box-shadow:
        inset 0 -2px 0
        var(--employer-colour);
    }

    .check-option.employer-option input:focus-visible + .employer-card {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }

    .nav-row {
      grid-area: nav;
      display: flex;
      align-items: center;
      align-self: end;
      width: 100%;
      min-width: 0;
      min-height: 48px;
      margin: 0;
      padding: 0;
      gap: 10px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .nav-row button {
      flex: 1;
      min-height: 48px;
      padding: 0 18px;
      color: #fff;
      background: var(--ink);
      border: 0;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
    }

    .nav-row button:hover {
      background: #26324d;
    }

    .nav-row button:focus-visible {
      outline: 2px solid rgba(102, 0, 255, 0.22);
      outline-offset: 2px;
    }
    
    input:disabled,
    select:disabled,
    textarea:disabled,
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #out {
      width: 100%;
      min-height: 1.6em;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
      white-space: pre-line;
    }
    
    #out:empty {
      display: none;
    }

    #out.is-error {
      position: relative;
      padding-left: 22px;
      color: var(--error);
    }

    #out.is-error::before {
      content: "!";
      position: absolute;
      top: 0.12em;
      left: 0;
      display: inline-flex;
      width: 16px;
      height: 16px;
      align-items: center;
      justify-content: center;
      color: var(--error);
      border: 1.5px solid var(--error);
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }
    
    #out.terminal-state {
      min-height: 0;
      margin: 28px auto 0;
      white-space: normal;
      text-align: left;
    }
    
    .terminal-card {
      width: 100%;
      text-align: left;
    }
    
    .terminal-title {
      color: var(--ink);
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }
    
    .terminal-subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .terminal-results-line {
      margin-top: 2px;
    }
    
    .terminal-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--track);
    }
    
    .terminal-section-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.3;
      text-transform: uppercase;
    }
    
    .terminal-details {
      margin-top: 5px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
    }

    .previous-submission {
      width: 100%;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--track);
      text-align: left;
    }

    .previous-submission-detail {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .previous-submission-detail span {
      margin-right: 8px;
      color: var(--muted);
      font-weight: 700;
    }

    .previous-submission-detail strong {
      color: var(--ink);
      font-weight: 700;
    }

    @media (max-width: 430px) {
      .box {
        width: calc(100% - 12px);
        padding: 12px 8px 20px;
      }

      .step.active {
        min-height: clamp(470px, 66dvh, 590px);
      }

      .step-body {
        padding: 16px 0 14px;
      }

      .step-title {
        font-size: clamp(21px, 5.2vw, 26px);
      }

      .checklist {
        gap: 2px;
      }

      .check-option {
        height: auto;
        min-height: 28px;
        padding: 5px 7px;
        gap: 6px;
        font-size: 11px;
        line-height: 1.25;
        white-space: normal;
      }


      .employer-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
      }

      .check-option.employer-option {
        min-height: 0;
        padding: 0;
      }

      .employer-card {
        min-height: 34px;
        padding: 4px 3px 5px;
        font-size: 10.5px;
        line-height: 1.1;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <div id="app" class="box">
      <aside id="trackerNotice" class="tracker-notice" role="note">
        <p>Best used in a non-Facebook browser</p>
        <p>Australian clinical employee optometrists only</p>
      </aside>

      <div id="step1" class="step active">
        <div class="step-body">
          <label class="step-title">
            Where have you worked in the last 3 years?
            <small>Select all that apply</small>
          </label>

          <div class="checklist employer-grid" aria-label="Employers worked for">
            <label class="check-option employer-option" style="order: 1; --employer-colour:#000000;">
              <input type="checkbox" class="emp" value="1001">
              <span class="employer-card">1001 Optometry</span>
            </label>

            <label class="check-option employer-option" style="order: 2; --employer-colour:#002e5a;">
              <input type="checkbox" class="emp" value="Bailey Nelson">
              <span class="employer-card">Bailey Nelson</span>
            </label>

            <label class="check-option employer-option" style="order: 3; --employer-colour:#0075c2;">
              <input type="checkbox" class="emp" value="Bupa">
              <span class="employer-card">Bupa Optical</span>
            </label>

            <label class="check-option employer-option" style="order: 4; --employer-colour:#ea0f0f;">
              <input type="checkbox" class="emp" value="Chemist/Optometrist Warehouse">
              <span class="employer-card">Chemist Warehouse Optometry</span>
            </label>

            <label class="check-option employer-option" style="order: 5; --employer-colour:#e32a36;">
              <input type="checkbox" class="emp" value="Costco">
              <span class="employer-card">Costco Optical</span>
            </label>

            <label class="check-option employer-option" style="order: 6; --employer-colour:#999999;">
              <input type="checkbox" class="emp" value="Dresden">
              <span class="employer-card">Dresden Vision</span>
            </label>

            <label class="check-option employer-option" style="order: 7; --employer-colour:#434343;">
              <input type="checkbox" class="emp" value="Eye Concepts">
              <span class="employer-card">Eye Concepts</span>
            </label>

            <label class="check-option employer-option" style="order: 8; --employer-colour:#000000;">
              <input type="checkbox" class="emp" value="George &amp; Matilda">
              <span class="employer-card">George &amp; Matilda Eyecare</span>
            </label>

            <label class="check-option employer-option" style="order: 9; --employer-colour:#da1c5c;">
              <input type="checkbox" class="emp" value="HCF">
              <span class="employer-card">HCF Eyecare</span>
            </label>

            <label class="check-option employer-option" style="order: 10; --employer-colour:#f78a22;">
              <input type="checkbox" class="emp" value="iContact">
              <span class="employer-card">iContact</span>
            </label>

            <label class="check-option employer-option" style="order: 11; --employer-colour:#5a3be7;">
              <input type="checkbox" class="emp" value="Independent">
              <span class="employer-card">Independent</span>
            </label>

            <label class="check-option employer-option" style="order: 19; --employer-colour:#13543c;">
              <input type="checkbox" class="emp" value="NIB (incl. the Optical Company)">
              <span class="employer-card">The Optical Company (incl. NIB)</span>
            </label>

            <label class="check-option employer-option" style="order: 12; --employer-colour:#ffb000;">
              <input type="checkbox" class="emp" value="Ophthalmologist">
              <span class="employer-card">Ophthalmologist</span>
            </label>

            <label class="check-option employer-option" style="order: 13; --employer-colour:#6fb0d4;">
              <input type="checkbox" class="emp" value="OPSM (incl. L&amp;P, EyeQ)">
              <span class="employer-card">OPSM (incl. L&amp;P, EyeQ)</span>
            </label>

            <label class="check-option employer-option" style="order: 14; --employer-colour:#2cb4a6;">
              <input type="checkbox" class="emp" value="Optical by National Pharmacies">
              <span class="employer-card">Optical by National Pharmacies</span>
            </label>

            <label class="check-option employer-option" style="order: 15; --employer-colour:#f16c20;">
              <input type="checkbox" class="emp" value="Oscar Wylee">
              <span class="employer-card">Oscar Wylee</span>
            </label>

            <label class="check-option employer-option" style="order: 16; --employer-colour:#bfc3c7;">
              <input type="checkbox" class="emp
