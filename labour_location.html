  <script>

    const CACHE_APP_KEY =

    const STATE_LABELS = [
      'NSW',
      'VIC',
      'QLD',

      'WA',

      'NT',

    ];

    const STATE_COLOURS = [

    const app =

    let rows = [];
    let chart = null;
    let chartSummary = null;
    let activeGroup = 'state';
    let activeMetric = 'count';
    let axisBounds = null;
    let tabsController = null;
    let headingScroller = null;
    let metricController = null;
    let legendController = null;
    let responsiveController = null;

    const hiddenSeriesByGroup =
      new Map();

    const yAxisTickAnimation = {
      values: [],
      raf: null,
      token: 0
    };

    const yAxisTitleAnimation = {
      from: 'FTE job ads/month',
      to: 'FTE job ads/month',

    function normaliseText(value) {
      return PFF.cleanText(value)
        .toLowerCase();
    }

    function getCellText(cell) {
      return PFF.cleanText(
        cell?.f ??
        cell?.v ??
        ''
      );
    }

    function configuredGroupLabels(
      group = activeGroup
    ) {
      return group === 'state'
        ? STATE_LABELS
        : RURALITY_LABELS;
    }

    function configuredGroupColours(
      group = activeGroup
    ) {
      return group === 'state'
        ? STATE_COLOURS
        : RURALITY_COLOURS;
    }

    function colourForGroupLabel(
      label,
      group = activeGroup
    ) {
      const labels =
        configuredGroupLabels(group);

      const colours =
        configuredGroupColours(group);

      const index =
        labels.indexOf(label);

      return index >= 0
        ? colours[index]
        : '#69718a';
    }

    function groupLabels(
      group = activeGroup,
      includeSmallGroups = false
    ) {
      return configuredGroupLabels(group)
        .filter(label => {
          const count =
            rows.filter(
              row =>
                row?.[group] === label
            ).length;

          return (
            count > 0 &&
            (
              includeSmallGroups ||
              count >= CONFIG.minimumGroupSize
            )
          );
        });
    }

    function groupColours(
      group = activeGroup
    ) {
      return groupLabels(group)
        .map(
          label =>
            colourForGroupLabel(
              label,
              group
            )
        );
    }

    function getExcludedGroupCount(
      group = activeGroup
    ) {
      return groupLabels(
        group,
        true
      ).filter(label =>
        rows.filter(
          row =>
            row?.[group] === label
        ).length <
          CONFIG.minimumGroupSize
      ).length;
    }

    function hiddenSeriesSet(
      group = activeGroup
    ) {
      if (!hiddenSeriesByGroup.has(group)) {
        hiddenSeriesByGroup.set(
          group,
          new Set()
        );
      }

      return hiddenSeriesByGroup.get(group);
    }

    function parseDateValue(value) {
      if (value instanceof Date) {
        return Number.isNaN(
          value.getTime()
        )
          ? null
          : new Date(
              Date.UTC(
                value.getFullYear(),
                value.getMonth(),
                value.getDate()
              )
            );
      }

      if (
        typeof value === 'number' &&
        Number.isFinite(value)
      ) {
        const googleEpoch =
          Date.UTC(
            1899,
            11,
            30
          );

        const date =
          new Date(
            googleEpoch +
            value * DAY_MS
          );

        return Number.isNaN(
          date.getTime()
        )
          ? null
          : date;
      }

      const text =
        PFF.cleanText(value);

      if (!text) {
        return null;
      }

      let match =
        text.match(
          /^Date\((\d+),(\d+),(\d+)\)$/
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]),
            Number(match[3])
          )
        );
      }

      match =
        text.match(
          /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2}|\d{4})$/
        );

      if (match) {
        let year =
          Number(match[3]);

        if (year < 100) {
          year += 2000;
        }

        return new Date(
          Date.UTC(
            year,
            Number(match[2]) - 1,
            Number(match[1])
          )
        );
      }

      match =
        text.match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );

      if (match) {
        return new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
          )
        );
      }

      const parsed =
        new Date(text);

      return Number.isNaN(
        parsed.getTime()
      )
        ? null
        : new Date(
            Date.UTC(
              parsed.getFullYear(),
              parsed.getMonth(),
              parsed.getDate()
            )
          );
    }

    function parseDateCell(cell) {
      return (
        parseDateValue(cell?.v) ||
        parseDateValue(cell?.f)
      );
    }

    function parseEstimatedDaysPerWeek(
      value
    ) {
      if (
        typeof value === 'number' &&
        Number.isFinite(value)
      ) {
        return PFF.clamp(
          value,
          0,
          5
        );
      }

      const text =
        PFF.cleanText(value);

      if (
        !text ||
        normaliseText(text) === 'xxx'
      ) {
        return 5;
      }

      const values = [
        ...text.matchAll(
          /\d+(?:\.\d+)?/g
        )
      ]
        .map(
          match =>
            Number(match[0])
        )
        .filter(
          number =>
            Number.isFinite(number) &&
            number >= 0 &&
            number <= 7
        );

      if (!values.length) {
        return 5;
      }

      const estimate =
        values.reduce(
          (
            total,
            number
          ) =>
            total + number,
          0
        ) /
        values.length;

      return PFF.clamp(
        estimate,
        0,
        5
      );
    }

    function getStateGroup(value) {
      const matches =
        PFF.cleanText(value)
          .toUpperCase()
          .match(
            /\b(?:NSW|QLD|VIC|ACT|SA|NT|WA|TAS)\b/g
          ) ||
        [];

      return matches[0] || null;
    }

    function getRuralityGroup(value) {
      const matches = [
        ...PFF.cleanText(value)
          .toUpperCase()
          .matchAll(
            /\bMM\s*([1-7])\b/g
          )
      ];

      if (!matches.length) {
        return null;
      }

      return matches.some(
        match =>
          Number(match[1]) === 1
      )
        ? 'Metro'
        : 'Non-metro';
    }

    function normaliseRows(
      sourceRows
    ) {
      const result = [];

      (sourceRows || [])
        .forEach(sourceRow => {
          const cells =
            sourceRow?.c ||
            [];

          const repeatFlag =
            normaliseText(
              getCellText(
                cells[
                  CONFIG.columns.repeatFlag
                ]
              )
            );

          if (repeatFlag !== 'no') {
            return;
          }

          const date =
            parseDateCell(
              cells[
                CONFIG.columns.date
              ]
            );

          if (!date) {
            return;
          }

          const fteCell =
            cells[
              CONFIG.columns.fteDays
            ];

          const fteDays =
            parseEstimatedDaysPerWeek(
              fteCell?.v ??
              fteCell?.f ??
              ''
            );

          result.push({
            x: date.getTime(),
            fteDays,
            fteWeight:
              fteDays / 5,
            state:
              getStateGroup(
                getCellText(
                  cells[
                    CONFIG.columns.state
                  ]
                )
              ),
            rurality:
              getRuralityGroup(
                getCellText(
                  cells[
                    CONFIG.columns.rurality
                  ]
                )
              )
          });
        });

      return result.sort(
        (
          first,
          second
        ) =>
          first.x - second.x
      );
    }

    function parseRemoteRows(snapshot) {
      const sourceRows =
        Array.isArray(
          snapshot?.data?.labourLocationRows
        )
          ? snapshot.data.labourLocationRows
          : [];

      return sourceRows
        .map(row => {
          const x =
            Number(row?.[0]);

          const fteWeight =
            Number(row?.[1]);

          const stateText =
            String(
              row?.[2] ??
              ''
            )
              .trim()
              .toUpperCase();

          const ruralityText =
            String(
              row?.[3] ??
              ''
            )
              .trim();

          return {
            x,
            fteDays:
              fteWeight * 5,
            fteWeight,
            state:
              STATE_LABELS.includes(
                stateText
              )
                ? stateText
                : null,
            rurality:
              RURALITY_LABELS.includes(
                ruralityText
              )
                ? ruralityText
                : null
          };
        })
        .filter(
          row =>
            Number.isFinite(row.x) &&
            Number.isFinite(row.fteWeight)
        )
        .sort(
          (
            first,
            second
          ) =>
            first.x - second.x
        );
    }

    function migrateLegacyLocalCache() {
      try {
        const raw =
          localStorage.getItem(
            CONFIG.localCacheKey
          );

        if (!raw) {
          return;
        }

        const parsed =
          JSON.parse(raw);

        if (!Array.isArray(parsed)) {
          return;
        }

        const legacyRows =
          parsed
            .map(row => ({
              x:
                Number(row?.x),
              fteDays:
                Number(row?.fteDays),
              fteWeight:
                Number(row?.fteWeight),
              state:
                STATE_LABELS.includes(
                  row?.state
                )
                  ? row.state
                  : null,
              rurality:
                RURALITY_LABELS.includes(
                  row?.rurality
                )
                  ? row.rurality
                  : null
            }))
            .filter(
              row =>
                Number.isFinite(row.x) &&
                Number.isFinite(row.fteWeight)
            );

        if (legacyRows.length) {
          PFFCharts.saveLocalCache(
            CONFIG.localCacheKey,
            legacyRows
          );
        }
      } catch (_) {
      }
    }

    function startOfUtcMonth(date) {
      return new Date(
        Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth(),
          1
        )
      );
    }

    function addUtcMonths(
      date,
      months
    ) {
      return new Date(
        Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth() + months,
          1
        )
      );
    }

    function getMonthTimestamp(
      timestamp
    ) {
      return startOfUtcMonth(
        new Date(timestamp)
      ).getTime();
    }

    function calculateAxisBounds(data) {
      const xValues =
        data
          .map(
            row =>
              Number(row?.x)
          )
          .filter(
            Number.isFinite
          );

      if (!xValues.length) {
        throw new Error(
          'Labour location data had no valid dates.'
        );
      }

      const minimumDate =
        new Date(
          Math.min(
            ...xValues
          )
        );

      const maximumDate =
        new Date(
          Math.max(
            ...xValues
          )
        );

      const firstMonth =
        startOfUtcMonth(
          minimumDate
        );

      const lastMonth =
        startOfUtcMonth(
          maximumDate
        );

      return {
        xMin:
          firstMonth.getTime(),

        xMax:
          addUtcMonths(
            lastMonth,
            1
          ).getTime(),

        firstDataTime:
          Math.min(
            ...xValues
          ),

        lastDataMonth:
          lastMonth.getTime()
      };
    }

    function buildMonthSequence() {
      const result = [];

      let current =
        new Date(
          axisBounds.xMin
        );

      const end =
        new Date(
          axisBounds.lastDataMonth
        );

      while (
        current.getTime() <=
        end.getTime()
      ) {
        result.push(
          current.getTime()
        );

        current =
          addUtcMonths(
            current,
            1
          );
      }

      return result;
    }

    function rowsForSeries(
      label,
      group = activeGroup
    ) {
      return rows.filter(
        row =>
          row?.[group] === label
      );
    }

    function classifiedRows(
      group = activeGroup
    ) {
      const allowed =
        new Set(
          groupLabels(group)
        );

      return rows.filter(
        row =>
          allowed.has(
            row?.[group]
          )
      );
    }

    function buildTrailingAverageSeries(
      data
    ) {
      const now =
        Date.now();

      return buildMonthSequence()
        .map(monthTimestamp => {
          const monthStart =
            new Date(
              monthTimestamp
            );

          const monthEnd =
            addUtcMonths(
              monthStart,
              1
            ).getTime();

          const effectiveEnd =
            Math.min(
              monthEnd,
              now
            );

          const windowStart =
            effectiveEnd -
            TRAILING_WINDOW_MS;

          if (
            windowStart <
            axisBounds.firstDataTime
          ) {
            return {
              x:
                monthTimestamp,
              y:
                null,
              value:
                null,
              periodLabel:
                formatTrailingPeriod(
                  monthTimestamp
                )
            };
          }

          const windowCount =
            data.reduce(
              (
                total,
                row
              ) =>
                total +
                (
                  row.x >= windowStart &&
                  row.x < effectiveEnd
                    ? row.fteWeight
                    : 0
                ),
              0
            );

          const value =
            windowCount *
            AVERAGE_MONTH_DAYS /
            (
              CONFIG.trailingWeeks *
              7
            );

          return {
            x:
              monthTimestamp,
            y:
              value,
            value,
            periodLabel:
              formatTrailingPeriod(
                monthTimestamp
              )
          };
        });
    }

    function buildTrailingShareSeries(
      data,
      denominatorData
    ) {
      const now =
        Date.now();

      return buildMonthSequence()
        .map(monthTimestamp => {
          const monthStart =
            new Date(
              monthTimestamp
            );

          const monthEnd =
            addUtcMonths(
              monthStart,
              1
            ).getTime();

          const effectiveEnd =
            Math.min(
              monthEnd,
              now
            );

          const windowStart =
            effectiveEnd -
            TRAILING_WINDOW_MS;

          if (
            windowStart <
            axisBounds.firstDataTime
          ) {
            return {
              x:
                monthTimestamp,
              y:
                null,
              value:
                null,
              periodLabel:
                formatTrailingPeriod(
                  monthTimestamp
                )
            };
          }

          const numerator =
            data.reduce(
              (
                total,
                row
              ) =>
                total +
                (
                  row.x >= windowStart &&
                  row.x < effectiveEnd
                    ? row.fteWeight
                    : 0
                ),
              0
            );

          const denominator =
            denominatorData.reduce(
              (
                total,
                row
              ) =>
                total +
                (
                  row.x >= windowStart &&
                  row.x < effectiveEnd
                    ? row.fteWeight
                    : 0
                ),
              0
            );

          const value =
            denominator > 0
              ? numerator /
                denominator *
                100
              : null;

          return {
            x:
              monthTimestamp,
            y:
              value,
            value,
            periodLabel:
              formatTrailingPeriod(
                monthTimestamp
              )
          };
        });
    }

    function formatTrailingPeriod(
      timestamp
    ) {
      const monthStart =
        new Date(timestamp);

      const monthEnd =
        addUtcMonths(
          monthStart,
          1
        ).getTime();

      const effectiveEnd =
        Math.min(
          monthEnd,
          Date.now()
        );

      const windowStart =
        new Date(
          effectiveEnd -
          TRAILING_WINDOW_MS
        );

      const endDate =
        new Date(
          effectiveEnd - 1
        );

      const formatter =
        new Intl.DateTimeFormat(
          'en-AU',
          {
            day:
              'numeric',
            month:
              'short',
            year:
              'numeric',
            timeZone:
              'UTC'
          }
        );

      return (
        `${formatter.format(windowStart)} – ` +
        formatter.format(endDate)
      );
    }

    function buildMonthTicks(
      minimum,
      maximum
    ) {
      const ticks = [];

      let cursor =
        startOfUtcMonth(
          new Date(minimum)
        );

      if (
        cursor.getTime() < minimum
      ) {
        cursor =
          addUtcMonths(
            cursor,
            1
          );
      }

      while (
        cursor.getTime() <= maximum
      ) {
        ticks.push({
          value:
            cursor.getTime()
        });

        cursor =
          addUtcMonths(
            cursor,
            1
          );
      }

      return ticks;
    }

    function isQuarterTick(timestamp) {
      const month =
        new Date(
          Number(timestamp)
        ).getUTCMonth();

      return [
        0,
        3,
        6,
        9
      ].includes(month);
    }

    function formatQuarterTick(
      timestamp
    ) {
      if (!isQuarterTick(timestamp)) {
        return '';
      }

      const date =
        new Date(
          Number(timestamp)
        );

      return (
        `${date.getUTCMonth() + 1}/` +
        date.getUTCFullYear()
      );
    }

    function niceStep(value) {
      if (
        !Number.isFinite(value) ||
        value <= 0
      ) {
        return 1;
      }

      const exponent =
        Math.floor(
          Math.log10(value)
        );

      const magnitude =
        Math.pow(
          10,
          exponent
        );

      const fraction =
        value /
        magnitude;

      if (fraction <= 1) {
        return magnitude;
      }

      if (fraction <= 2) {
        return 2 * magnitude;
      }

      if (fraction <= 2.5) {
        return 2.5 * magnitude;
      }

      if (fraction <= 5) {
        return 5 * magnitude;
      }

      return 10 * magnitude;
    }

    function seriesBundle(
      group = activeGroup,
      metric = activeMetric
    ) {
      const labels =
        groupLabels(group);

      const denominator =
        classifiedRows(group);

      return labels.map(label => {
        const data =
          rowsForSeries(
            label,
            group
          );

        const trend =
          metric === 'share'
            ? buildTrailingShareSeries(
                data,
                denominator
              )
            : buildTrailingAverageSeries(
                data
              );

        return {
          label,
          trend
        };
      });
    }

    function currentYAxis(
      bundle = seriesBundle()
    ) {
      if (activeMetric === 'share') {
        const values =
          bundle
            .flatMap(
              series =>
                series.trend.map(
                  point =>
                    point.value
                )
            )
            .filter(
              Number.isFinite
            );

        const observedMaximum =
          Math.max(
            10,
            ...values
          );

        const majorStep =
          activeGroup === 'rurality'
            ? 20
            : Math.max(
                5,
                niceStep(
                  observedMaximum *
                  1.08 /
                  5
                )
              );

        return {
          min: 0,
          max:
            activeGroup === 'rurality'
              ? 100
              : Math.max(
                  majorStep * 5,
                  Math.ceil(
                    observedMaximum /
                    majorStep
                  ) *
                  majorStep
                ),
          majorStep,
          title:
            '% of FTE job ads'
        };
      }

      const values =
        bundle
          .flatMap(
            series =>
              series.trend.map(
                point =>
                  point.value
              )
          )
          .filter(
            Number.isFinite
          );

      const observedMaximum =
        Math.max(
          0.5,
          ...values
        );

      const majorStep =
        Math.max(
          0.5,
          niceStep(
            observedMaximum *
            1.08 /
            5
          )
        );

      return {
        min: 0,
        max:
          Math.max(
            majorStep * 5,
            Math.ceil(
              observedMaximum /
              majorStep
            ) *
            majorStep
          ),
        majorStep,
        title:
          'FTE job ads/month'
      };
    }

    function yAxisTickTargets(config) {
      const intervals =
        Math.max(
          1,
          Math.round(
            (
              config.max -
              config.min
            ) /
            config.majorStep
          )
        );

      return Array.from(
        {
          length:
            intervals + 1
        },
        (
          _,
          index
        ) =>
          config.min +
          config.majorStep *
          index
      );
    }

    function animateYAxisTickValues(
      targets,
      duration = 420
    ) {
      const targetValues =
        [...targets];

      if (!targetValues.length) {
        return;
      }

      if (yAxisTickAnimation.raf) {
        cancelAnimationFrame(
          yAxisTickAnimation.raf
        );

        yAxisTickAnimation.raf =
          null;
      }

      const token =
        ++yAxisTickAnimation.token;

      const startValues =
        yAxisTickAnimation.values.length ===
        targetValues.length
          ? [...yAxisTickAnimation.values]
          : [...targetValues];

      if (
        PFF.reducedMotion() ||
        duration <= 0
      ) {
        yAxisTickAnimation.values =
          targetValues;

        chart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      const frame = now => {
        if (
          token !==
          yAxisTickAnimation.token
        ) {
          return;
        }

        const progress =
          PFF.clamp(
            (
              now -
              startedAt
            ) /
            duration,
            0,
            1
          );

        const eased =
          PFFCharts.easeOutCubic(
            progress
          );

        yAxisTickAnimation.values =
          targetValues.map(
            (
              target,
              index
            ) =>
              startValues[index] +
              (
                target -
                startValues[index]
              ) *
              eased
          );

        chart?.draw();

        if (progress < 1) {
          yAxisTickAnimation.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          yAxisTickAnimation.raf =
            null;

          yAxisTickAnimation.values =
            targetValues;
        }
      };

      yAxisTickAnimation.raf =
        requestAnimationFrame(
          frame
        );
    }

    function animateYAxisTitle(
      nextTitle,
      duration = 360
    ) {
      if (
        yAxisTitleAnimation.to ===
        nextTitle
      ) {
        return;
      }

      if (yAxisTitleAnimation.raf) {
        cancelAnimationFrame(
          yAxisTitleAnimation.raf
        );

        yAxisTitleAnimation.raf =
          null;
      }

      yAxisTitleAnimation.from =
        yAxisTitleAnimation.to;

      yAxisTitleAnimation.to =
        nextTitle;

      yAxisTitleAnimation.progress =
        0;

      const token =
        ++yAxisTitleAnimation.token;

      if (
        PFF.reducedMotion() ||
        duration <= 0
      ) {
        yAxisTitleAnimation.progress =
          1;

        chart?.draw();
        return;
      }

      const startedAt =
        performance.now();

      const frame = now => {
        if (
          token !==
          yAxisTitleAnimation.token
        ) {
          return;
        }

        yAxisTitleAnimation.progress =
          PFF.clamp(
            (
              now -
              startedAt
            ) /
            duration,
            0,
            1
          );

        chart?.draw();

        if (
          yAxisTitleAnimation.progress <
          1
        ) {
          yAxisTitleAnimation.raf =
            requestAnimationFrame(
              frame
            );
        } else {
          yAxisTitleAnimation.raf =
            null;
        }
      };

      yAxisTitleAnimation.raf =
        requestAnimationFrame(
          frame
        );
    }

    function formatYAxisValue(
      value,
      metric = activeMetric
    ) {
      if (!Number.isFinite(value)) {
        return '';
      }

      if (metric === 'share') {
        return `${Math.round(value)}%`;
      }

      return Number(value)
        .toFixed(
          Math.abs(value) < 10 &&
          Math.abs(value % 1) > 1e-8
            ? 1
            : 0
        )
        .replace(
          /\.0$/,
          ''
        );
    }

    function drawYAxisTitle(
      context,
      chartArea
    ) {
      const progress =
        PFF.clamp(
          yAxisTitleAnimation.progress,
          0,
          1
        );

      const x =
        Math.max(
          PFF.mobileLayout()
            ? 9
            : 10,
          chartArea.left -
            (
              PFF.mobileLayout()
                ? 53
                : 59
            )
        );

      const y =
        chartArea.top +
        chartArea.height /
        2;

      const draw = (
        text,
        opacity
      ) => {
        if (
          !text ||
          opacity <= 0
        ) {
          return;
        }

        context.save();
        context.globalAlpha =
          opacity;
        context.translate(
          x,
          y
        );
        context.rotate(
          -Math.PI /
          2
        );
        context.fillStyle =
          '#151515';
        context.textAlign =
          'center';
        context.textBaseline =
          'middle';
        context.font =
          `700 ${PFF.mobileLayout() ? 12 : 13}px Lato, sans-serif`;
        context.fillText(
          text,
          0,
          0
        );
        context.restore();
      };

      if (
        yAxisTitleAnimation.from ===
          yAxisTitleAnimation.to ||
        progress >= 1
      ) {
        draw(
          yAxisTitleAnimation.to,
          1
        );
        return;
      }

      draw(
        yAxisTitleAnimation.from,
        PFF.clamp(
          1 -
          progress *
          2.2,
          0,
          1
        )
      );

      draw(
        yAxisTitleAnimation.to,
        PFF.clamp(
          (
            progress -
            0.32
          ) /
          0.68,
          0,
          1
        )
      );
    }

    function tooltipTitle(items) {
      const raw =
        items?.[0]?.raw;

      return Number.isFinite(

    function tooltipLabel(context) {

      );

    function drawChartNote(
      context,
      area,
      text
    ) {
      if (!text) {
        return;
      }

      context.save();
      context.font =
        '400 8.5px Lato, sans-serif';
      context.textBaseline =
        'middle';
      context.textAlign =
        'left';

      const maximumTextWidth =
        Math.max(
          90,
          Math.min(
            235,
            area.right -
            area.left -
            20
          )
        );

      const words =
        text.split(/\s+/);

      const lines = [];
      let line = '';

      words.forEach(word => {
        const candidate =
          line
            ? `${line} ${word}`
            : word;

        if (
          line &&
          context.measureText(
            candidate
          ).width >
          maximumTextWidth
        ) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      });

      if (line) {
        lines.push(line);
      }

      const paddingX = 5;
      const paddingY = 4;
      const lineHeight = 11;

      const textWidth =
        Math.max(
          ...lines.map(
            item =>
              context.measureText(
                item
              ).width
          )
        );

      const boxWidth =
        textWidth +
        paddingX * 2;

      const boxHeight =
        lines.length *
        lineHeight +
        paddingY * 2;

      const x =
        area.right -
        boxWidth -
        6;

      const y =
        area.bottom -
        boxHeight -
        6;

      const radius = 4;

      context.beginPath();
      context.moveTo(
        x + radius,
        y
      );
      context.lineTo(
        x + boxWidth - radius,
        y
      );
      context.quadraticCurveTo(
        x + boxWidth,
        y,
        x + boxWidth,
        y + radius
      );
      context.lineTo(
        x + boxWidth,
        y + boxHeight - radius
      );
      context.quadraticCurveTo(
        x + boxWidth,
        y + boxHeight,
        x + boxWidth - radius,
        y + boxHeight
      );
      context.lineTo(
        x + radius,
        y + boxHeight
      );
      context.quadraticCurveTo(
        x,
        y + boxHeight,
        x,
        y + boxHeight - radius
      );
      context.lineTo(
        x,
        y + radius
      );
      context.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
      );
      context.closePath();

      context.fillStyle =
        'rgba(255, 255, 255, 0.84)';
      context.fill();

      context.strokeStyle =
        'rgba(105, 113, 138, 0.16)';
      context.lineWidth = 1;
      context.stroke();

      context.fillStyle =
        'rgba(105, 113, 138, 0.88)';

      lines.forEach(
        (
          item,
          index
        ) => {
          context.fillText(
            item,
            x + paddingX,
            y +
              paddingY +
              lineHeight * index +
              lineHeight / 2
          );
        }
      );

      context.restore();
    }

    const locationYAxisPlugin = {
      id:
        'locationYAxisPlugin',

      beforeDatasetsDraw(
        activeChart
      ) {
        const {
          ctx,
          chartArea
        } = activeChart;

        if (!chartArea) {
          return;
        }

        const config =
          currentYAxis();

        const targets =
          yAxisTickTargets(config);

        const intervals =
          Math.max(
            1,
            targets.length - 1
          );

        ctx.save();

        for (
          let index = 1;
          index <= intervals;
          index += 1
        ) {
          const ratio =
            index /
            intervals;

          const y =
            chartArea.bottom -
            chartArea.height *
            ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );
          ctx.strokeStyle =
            'rgba(105, 113, 138, 0.075)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        for (
          let index = 0;
          index < intervals;
          index += 1
        ) {
          const ratio =
            (
              index +
              0.5
            ) /
            intervals;

          const y =
            chartArea.bottom -
            chartArea.height *
            ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.right,
            Math.round(y) + 0.5
          );
          ctx.strokeStyle =

          ctx.stroke();
        }

        ctx.restore();
      },

      afterDraw(
        activeChart
      ) {
        const {
          ctx,
          chartArea
        } = activeChart;

        if (!chartArea) {
          return;
        }

        const config =
          currentYAxis();

        const targets =
          yAxisTickTargets(config);

        const values =
          yAxisTickAnimation.values.length ===
          targets.length
            ? yAxisTickAnimation.values
            : targets;

        const intervals =
          Math.max(
            1,
            targets.length - 1
          );

        ctx.save();
        ctx.lineCap =
          'butt';
        ctx.strokeStyle =
          '#151515';
        ctx.lineWidth = 1;
        ctx.fillStyle =
          '#151515';
        ctx.textAlign =
          'right';
        ctx.textBaseline =
          'middle';
        ctx.font =
          '12px Lato, sans-serif';

        for (
          let index = 0;
          index <= intervals;
          index += 1
        ) {
          const ratio =
            index /
            intervals;

          const y =
            chartArea.bottom -
            chartArea.height *
            ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 5,
            Math.round(y) + 0.5
          );
          ctx.stroke();

          ctx.fillText(
            formatYAxisValue(
              Number(values[index]),
              activeMetric
            ),
            chartArea.left - 8,
            y
          );
        }

        ctx.strokeStyle =
          '#69718a';
        ctx.globalAlpha = 0.60;
        ctx.lineWidth = 0.7;

        for (
          let index = 0;
          index < intervals;
          index += 1
        ) {
          const ratio =
            (
              index +
              0.5
            ) /
            intervals;

          const y =
            chartArea.bottom -
            chartArea.height *
            ratio;

          ctx.beginPath();
          ctx.moveTo(
            chartArea.left,
            Math.round(y) + 0.5
          );
          ctx.lineTo(
            chartArea.left - 2,
            Math.round(y) + 0.5
          );
          ctx.stroke();
        }

        ctx.restore();

        drawYAxisTitle(
          ctx,
          chartArea
        );
      }
    };

                    7
                },
                font: {
                  family:
                    'Lato',
                  size:
                    PFF.mobileLayout()
                      ? 12
                      : 13,
                  weight:
                    '700'
                }
              }
            },

            y:
              PFFCharts.yScaleOptions({
                min:
                  axis.min,
                max:
                  axis.max,
                step:
                  axis.majorStep,
                intervals:
                  Math.max(
                    1,
                    Math.round(
                      (
                        axis.max -
                        axis.min
                      ) /
                      axis.majorStep
                    )
                  )
              })
          }
        });

      chart =
        new Chart(
          chartCanvas.getContext('2d'),
          {
            type:
              'line',
            data: {
              datasets:
                makeDatasetSlots()
            },
            options,
            plugins: [
              locationYAxisPlugin,
              sourceMilestonePlugin,
              axisSpinesPlugin
            ]
          }
        );

      syncDatasets(bundle);
      chart.update('none');
      updateAccessibleSummary();
    }

    function renderChart(
      reason = 'view'
    ) {
      if (!chart) {
        return;
      }

      const bundle =
        seriesBundle();

      const axis =
        currentYAxis(bundle);

      syncDatasets(bundle);

      chart.options.scales.x.min =
        axisBounds.xMin;

      chart.options.scales.x.max =
        axisBounds.xMax;

      chart.options.scales.y.min =
        axis.min;

      chart.options.scales.y.max =
        axis.max;

      const duration =
        reason === 'legend'
          ? (
              PFF.reducedMotion()
                ? 0
                : 260
            )
          : PFFCharts.chartAnimationDuration();

      chart.options.animation.duration =
        duration;

      chart.options.animation.easing =
        'easeInOutCubic';

      chart.options.animations.x.duration =
        0;

      chart.options.animations.y.duration =
        duration;

      chart.options.animations.y.easing =
        'easeInOutCubic';

      chart.options.animations.colors.duration =
        0;

      chart.update(
        duration > 0
          ? undefined
          : 'none'
      );

      animateYAxisTickValues(
        yAxisTickTargets(axis),
        Math.min(
          duration,
          420
        )
      );

      animateYAxisTitle(
        axis.title,
        Math.min(
          duration,
          360
        )
      );

      updateAccessibleSummary();
    }

    function headingDetailText() {
      return (
        `\u00a0${activeGroup === 'state' ? 'state' : 'rurality'}` +
        (
          activeMetric === 'share'
            ? ' (%)'
            : ''
        )
      );
    }

    function updateHeading() {
      PFF.animateHeading({
        fixed:
          chartHeadingFixed,
        detail:
          chartHeadingDetail,
        fixedText:
          'FTE job ads by',
        detailText:
          headingDetailText(),
        duration:
          PFF.defaults.microTransitionMs
      });

      headingScrollViewport.scrollLeft =
        0;

      requestAnimationFrame(
        () =>
          headingScroller?.update()
      );
    }

    function legendItems() {
      const labels =
        groupLabels();

      const colours =
        groupColours();

      const hidden =
        hiddenSeriesSet();

      return labels.map(
        (
          label,
          index
        ) => ({
          datasetIndex:
            index,
          label,
          colour:
            colours[index],
          active:
            !hidden.has(label)
        })
      );
    }

    function updateAccessibleSummary() {
      if (!chartSummary) {
        return;
      }

      const hidden =
        hiddenSeriesSet();

      const visibleSeries =
        seriesBundle()
          .filter(
            series =>
              !hidden.has(
                series.label
              )
          );

      const latestText =
        visibleSeries
          .map(series => {
            const latest =
              [...series.trend]
                .reverse()
                .find(
                  point =>
                    Number.isFinite(
                      point?.value
                    )
                );

            if (!latest) {
              return null;
            }

            return activeMetric === 'share'
              ? `${series.label} ${latest.value.toFixed(1)}%`
              : `${series.label} ${latest.value.toFixed(1)} FTE ads per month`;
          })
          .filter(Boolean)
          .join(', ');

      const excluded =
        getExcludedGroupCount(
          activeGroup
        );

      PFFCharts.updateChartSummary(
        `Labour demand by ${activeGroup === 'state' ? 'state' : 'rurality'}, ` +
        `${activeMetric === 'share' ? 'percentage share' : 'FTE job ads per month'} using a 13-week trailing average. ` +
        `${latestText || 'No visible series.'}` +
        `${excluded > 0 ? ` ${excluded} small group${excluded === 1 ? '' : 's'} with fewer than ${CONFIG.minimumGroupSize} job ads excluded.` : ''}`,
        chartSummary
      );
    }

    function setupControls() {
      tabsController =
        PFF.setupTabs({
          tabList,
          tabs:
            chartTabs,
          valueAttribute:
            'group',
          initialValue:
            activeGroup,
          leftButton:
            tabScrollLeft,
          rightButton:
            tabScrollRight,
          onChange(nextGroup) {
            if (
              !nextGroup ||
              nextGroup === activeGroup
            ) {
              return;
            }

            activeGroup =
              nextGroup;

            updateHeading();
            legendController?.render();
            renderChart('view');
          }
        });

      headingScroller =
        PFF.setupScrollableRegion({
          scroller:
            headingScrollViewport,
          leftButton:
            headingScrollLeft,
          rightButton:
            headingScrollRight
        });

      metricController =
        PFF.setupMetricSwitch({
          element:
            metricSwitch,
          buttons:
            metricButtons,
          valueAttribute:
            'metric',
          initialValue:
            activeMetric,
          onChange(nextMetric) {
            if (
              !nextMetric ||
              nextMetric === activeMetric
            ) {
              return;
            }

            activeMetric =
              nextMetric;

            updateHeading();
            renderChart('view');
          }
        });

      legendController =
        PFFCharts.setupLegend({
          legend:
            chartLegend,
          leftButton:
            legendScrollLeft,
          rightButton:
            legendScrollRight,
          getChart() {
            return chart;
          },
          getItems:
            legendItems,
          updateMode:
            PFF.reducedMotion()
              ? 'none'
              : undefined,
          onToggle({
            visible,
            item
          }) {
            const hidden =
              hiddenSeriesSet();

            if (visible) {
              hidden.delete(
                item.label
              );
            } else {
              hidden.add(
                item.label
              );
            }

            updateAccessibleSummary();
          }
        });

      chartCanvas.addEventListener(
        'contextmenu',
        event =>
          event.preventDefault()
      );

      chartCanvas.addEventListener(
        'selectstart',
        event =>
          event.preventDefault()
      );
    }

    migrateLegacyLocalCache();
    setupControls();
    updateHeading();

    PFF.initialiseApp({
      app,
      status:
        statusElement,

      loadLive() {
        return PFFCharts.loadGVizSheet({
          sheetId:
            CONFIG.jobSheetId,
          sheetName:
            CONFIG.jobSheetName,
          range:
            CONFIG.jobRange,
          headers:
            '0',
          timeoutMs:
            CONFIG.fetchTimeoutMs,
          query:
            'select *'
        });
      },

      parseLive(table) {
        return normaliseRows(
          table?.rows ||
          []
        );
      },

      loadRemoteCache() {
        return PFFCharts.loadAppsScriptCache({
          url:
            CACHE_WEB_APP_URL,
          appKey:
            CACHE_APP_KEY,
          timeoutMs:
            CONFIG.cacheFetchTimeoutMs
        });
      },

      parseRemoteCache:
        parseRemoteRows,

      cacheKey:
        CONFIG.localCacheKey,

      minRows:
        1,

      onLiveError(error) {
        console.warn(
          'Live labour location data unavailable; trying Apps Script cache.',
          error
        );
      },

      onRemoteCacheError(error) {
        console.warn(
          'Apps Script labour location cache unavailable; trying browser cache.',
          error
        );
      },

      dataSourceOptions: {
        indicator:
          dataSourceIndicator,
        text:
          dataSourceText
      },

      render(loaded) {
        rows =
          loaded.rows;

        axisBounds =
          calculateAxisBounds(
            rows
          );

        chartSummary =
          PFFCharts.ensureChartSummary({
            canvas:
              chartCanvas,
            id:
              'labourLocationSummary'
          });

        createChart();
        legendController.render();
        tabsController.update();
        headingScroller.update();

        responsiveController =
          PFFCharts.createResponsiveController({
            getChart() {
              return chart;
            },
            observe: [
              app,
              chartShell
            ],
            onRefresh() {
              tabsController?.update();
              headingScroller?.update();
            }
          });

        return chart;
      },

      errorMessage:
        'Labour demand location data unavailable.'
    });
  </script>
</body>
</html>
