<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PFF Practice Landscape</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./assets/pff_chart_core.js?v=1.2.11-20260917"></script>

  <style>
    :root {
      --landscape-purple: #6600ff;
      --landscape-unclassified: #bfc3c7;
      --landscape-australia: #0b5d1e;
    }

    .chart-heading-row {
      align-items: flex-start;
      gap: 6px;
    }

    .chart-heading-row .heading-scroll-shell {
      min-width: 0;
      flex: 1 1 auto;
    }

    .chart-heading-row .heading-scroll-viewport {
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .chart-heading-row .heading-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    .chart-heading {
      width: max-content;
      min-width: max-content;
      max-width: none;
      margin: 0;
      white-space: nowrap;
    }

    .chart-heading-fixed,
    .chart-heading-detail {
      display: inline-block;
    }

    .chart-heading-detail {
      margin-left: 0.28em;
    }

    .heading-controls {
      margin-left: auto;
      padding-top: 2px;
      flex: 0 0 auto;
    }

    .area-button {
      min-width: 84px;
      grid-template-columns: max-content minmax(30px, 1fr) 8px;
      gap: 3px;
      padding-right: 4px;
      padding-left: 4px;
    }

    .area-menu {
      min-width: 164px;
      max-height: min(390px, calc(100vh - 92px));
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 113, 138, 0.34) transparent;
    }

    .area-option-name {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .chart-scroll {
      position: absolute;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 113, 138, 0.30) transparent;
    }

    .chart-scroll.is-scrollable {
      overflow-x: hidden;
      overflow-y: auto;
    }

    .chart-stage {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 100%;
    }

    .chart-stage canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      opacity: 1;
      will-change: opacity;
    }

    @media (max-width: 430px) {

      .area-button {
        min-width: 80px;
        padding-right: 4px;
        padding-left: 4px;
      }

      .area-menu {
        width: min(238px, calc(100vw - 14px));
      }

    }

    @media (max-width: 350px) {
      .area-button {
        min-width: 78px;
      }

    }
  </style>
</head>

<body class="pff-chart-app">
  <div id="fit">
    <main id="app" class="is-loading" aria-busy="true">
      <div
        id="loadingState"
        class="app-loading"
        role="status"
        aria-label="Loading practice landscape data"
      >
        <div class="cone-loader" aria-hidden="true">
          <span class="cone blue"></span>
          <span class="cone green"></span>
          <span class="cone red"></span>
        </div>
        <p class="loader-text">Loading practice landscape data…</p>
      </div>

      <div class="module-top">
        <div class="tab-scroll-shell">
          <button
            id="tabScrollLeft"
            class="tab-scroll-button tab-scroll-left is-hidden"
            type="button"
            aria-label="Scroll practice landscape tabs left"
          >‹</button>

          <div
            id="tabList"
            class="tab-list"
            role="tablist"
            aria-label="Practice landscape views"
          >
            <button
              class="chart-tab is-active"
              type="button"
              role="tab"
              data-view="brands"
              aria-selected="true"
            >Brands (non-independent)</button>

            <button
              class="chart-tab"
              type="button"
              role="tab"
              data-view="suburbs"
              aria-selected="false"
            >Suburbs</button>
          </div>

          <button
            id="tabScrollRight"
            class="tab-scroll-button tab-scroll-right is-hidden"
            type="button"
            aria-label="Scroll practice landscape tabs right"
          >›</button>
        </div>

        <div
          id="dataSourceIndicator"
          class="live-data"
          aria-label="Live data"
          aria-live="polite"
        >
          <span class="live-data-dot" aria-hidden="true"></span>
          <span id="dataSourceText">LIVE data</span>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div class="chart-heading-row">
        <div id="headingScrollShell" class="heading-scroll-shell">
          <button
            id="headingScrollLeft"
            class="heading-scroll-button heading-scroll-left is-hidden"
            type="button"
            aria-label="Scroll chart heading left"
          >‹</button>

          <div id="headingScrollViewport" class="heading-scroll-viewport">
            <h2 id="chartHeading" class="chart-heading">
              <span class="chart-heading-fixed">Practice landscape by</span>
              <span id="chartHeadingDetail" class="chart-heading-detail">brand (non-independent)</span>
            </h2>
          </div>

          <button
            id="headingScrollRight"
            class="heading-scroll-button heading-scroll-right is-hidden"
            type="button"
            aria-label="Scroll chart heading right"
          >›</button>
        </div>

        <div class="heading-controls">
          <div id="areaControl" class="state-control">
            <button
              id="areaButton"
              class="state-button area-button"
              type="button"
              aria-expanded="false"
              aria-controls="areaMenu"
            >
              <span>Location</span>
              <span id="areaButtonValue" class="state-button-value">Australia</span>
              <span class="menu-arrow" aria-hidden="true"></span>
            </button>

            <div id="areaMenu" class="state-menu area-menu" role="menu">
              <div class="state-menu-title">Show location</div>
              <div id="areaOptions"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="chartShell" class="chart-shell">
        <div id="chartScroll" class="chart-scroll">
          <div id="chartStage" class="chart-stage">
            <canvas
              id="practiceLandscapeChart"
              aria-label="Australian optometry practice landscape chart"
              role="img"
            ></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      spreadsheetId:
        '1v6nHeJDkbYF-Pan7OEDLLBhYLghuGxFVBoRX4ibuWSE',

      sheetName:
        '2026 Optom practice directory',

      sheetGid:
        '1196929681',

      sourceRange:
        'B32:X',

      sourceColumnCount:
        23,

      fetchTimeoutMs:
        25000,

      cacheFetchTimeoutMs:
        15000,

      appKey:
        'pff-optom-practice-directory',

      localCacheKey:
        'pff-practice-landscape-rows-v1',

      minimumRows:
        100,

      rankLimit:
        20,

      spineTransitionMs:
        220,

      axisTransitionMs:
        700,

      locationTransitionMs:
        700,

      columns: Object.freeze({
        practiceName: 0,
        suburb: 2,
        state: 3,
        employerType: 10,
        cleanedBrandParent: 17
      })
    });

    const CACHE_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbx7MftpgGcsWY2uFvIt6BPXVWeCPLFjjGAeE4h1m46EG-xqFZ7_-wpYh0ccxo-yPmIG/exec';

    /* Testing switch only. Leave false in production. */
    const FORCE_CACHED_DATA = false;

    const STATE_ORDER = Object.freeze([
      'NSW',
      'VIC',
      'QLD',
      'SA',
      'WA',
      'TAS',
      'NT',
      'ACT'
    ]);

    const STATE_NAMES = Object.freeze({
      NSW: 'New South Wales',
      VIC: 'Victoria',
      QLD: 'Queensland',
      SA: 'South Australia',
      WA: 'Western Australia',
      TAS: 'Tasmania',
      NT: 'Northern Territory',
      ACT: 'Australian Capital Territory'
    });

    const BRAND_COLOURS = Object.freeze({
      essilorluxottica: '#6fb0d4',
      'national pharmacies': '#2cb4a6',
      'quinn and co eyecare': '#82b9ca',
      'vision australia': '#002664',
      'health partners': '#002463',
      westfund: '#ff5a1f',
      'australian college of optometry': '#27b8c1',
      'aco eye health': '#27b8c1',
      owndays: '#000000',
      'dry eye solution': '#24b9c1',
      'unsw sydney': '#ffe600',
      'ufs healthcare': '#12669b',
      gmhba: '#32d2ea',
      'tuh health hub': '#42c2bd',
      'optometry australia': '#2f7fb8',
      'queensland university of technology qut': '#00407a',
      'queensland university of technology': '#00407a',
      'flinders university': '#ffd300',
      'lions eye institute': '#101f9e',
      'university of western australia': '#27348b',
      'paris miki': '#005078'
    });

    const app =
      document.getElementById('app');

    const statusElement =
      document.getElementById('status');

    const dataSourceIndicator =
      document.getElementById('dataSourceIndicator');

    const dataSourceText =
      document.getElementById('dataSourceText');

    const tabList =
      document.getElementById('tabList');

    const tabScrollLeft =
      document.getElementById('tabScrollLeft');

    const tabScrollRight =
      document.getElementById('tabScrollRight');

    const chartHeadingDetail =
      document.getElementById('chartHeadingDetail');

    const headingScrollViewport =
      document.getElementById('headingScrollViewport');

    const headingScrollLeft =
      document.getElementById('headingScrollLeft');

    const headingScrollRight =
      document.getElementById('headingScrollRight');

    const areaControl =
      document.getElementById('areaControl');

    const areaButton =
      document.getElementById('areaButton');

    const areaButtonValue =
      document.getElementById('areaButtonValue');

    const areaMenu =
      document.getElementById('areaMenu');

    const areaOptions =
      document.getElementById('areaOptions');

    const chartShell =
      document.getElementById('chartShell');

    const chartScroll =
      document.getElementById('chartScroll');

    const chartStage =
      document.getElementById('chartStage');

    const chartCanvas =
      document.getElementById('practiceLandscapeChart');

    let sourceRows = [];
    let chart = null;
    let activeModel = null;
    let activeView = 'brands';
    let activeArea = 'AUS';
    let activeAxisSpec = null;
    let tabsController = null;
    let headingScroller = null;
    let areaMenuController = null;
    let chartInteractionController = null;
    let responsiveController = null;
    let chartSummary = null;
    let spineTransitionFrame = null;
    let axisTransitionFrame = null;

    const locationTransitionAnimator =
      PFFCharts.createAnimationController();

    const locationReorderState = {
      active: false,
      progress: 1,
      fromYByKey: new Map()
    };

    const spineTransitionState = {
      active: false,
      left: NaN,
      right: NaN,
      top: NaN,
      bottom: NaN
    };

    const axisTransitionState = {
      active: false,
      max: NaN
    };

    const collator =
      new Intl.Collator('en-AU', {
        sensitivity: 'base',
        numeric: true
      });

    function normaliseGroupingText(value) {
      return PFF.cleanText(value)
        .replace(/\s+/g, ' ')
        .trim();
    }

    function normaliseBrand(value) {
      const text = normaliseGroupingText(value);

      if (
        !text ||
        /^(?:x|xx|xxx|n\/?a|not available)$/i.test(text)
      ) {
        return 'Unclassified';
      }

      return text;
    }

    function sourceRowsFromTable(table) {
      return (table?.rows || [])
        .map(rawRow => {
          const cells = rawRow?.c || [];

          return Array.from(
            { length: CONFIG.sourceColumnCount },
            (_, index) => PFF.cleanText(
              PFF.cellValue(cells[index])
            )
          );
        })
        .filter(values =>
          Boolean(
            PFF.cleanText(
              values[CONFIG.columns.practiceName]
            )
          )
        );
    }

    function sourceRowsFromRemoteCache(payload) {
      const rows = Array.isArray(payload?.data?.rows)
        ? payload.data.rows
        : [];

      return rows
        .filter(row =>
          Array.isArray(row) &&
          row.length >= CONFIG.sourceColumnCount
        )
        .map(row =>
          Array.from(
            { length: CONFIG.sourceColumnCount },
            (_, index) => PFF.cleanText(row[index])
          )
        )
        .filter(values =>
          Boolean(
            PFF.cleanText(
              values[CONFIG.columns.practiceName]
            )
          )
        );
    }

    function normaliseRows(rows) {
      return (Array.isArray(rows) ? rows : [])
        .map((values, sourceIndex) => {
          if (
            !Array.isArray(values) ||
            values.length < CONFIG.sourceColumnCount
          ) {
            return null;
          }

          const practiceName = PFF.cleanText(
            values[CONFIG.columns.practiceName]
          );

          if (!practiceName) {
            return null;
          }

          return {
            sourceIndex,
            practiceName,
            suburb: normaliseGroupingText(
              values[CONFIG.columns.suburb]
            ),
            state: PFF.normaliseState(
              values[CONFIG.columns.state]
            ),
            employerType: normaliseGroupingText(
              values[CONFIG.columns.employerType]
            ),
            brand: normaliseBrand(
              values[CONFIG.columns.cleanedBrandParent]
            )
          };
        })
        .filter(Boolean);
    }

    function setLoadedSourceIndicator(loaded) {
      const source = loaded?.source;
      const remote = Boolean(loaded?.remote);

      if (source === 'live') {
        PFF.setDataSourceIndicator('live', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        dataSourceText.textContent = 'LIVE data';
        return;
      }

      if (source === 'cached' && remote) {
        PFF.setDataSourceIndicator('cached', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        dataSourceText.textContent = 'BACKEND cache';
        return;
      }

      if (source === 'cached') {
        PFF.setDataSourceIndicator('cached', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });

        dataSourceText.textContent = 'BROWSER cache';
        return;
      }

      PFF.setDataSourceIndicator('unavailable', {
        indicator: dataSourceIndicator,
        text: dataSourceText
      });
    }

    async function loadPracticeRows() {
      return PFFCharts.loadLiveCacheFallback({
        forceCached: FORCE_CACHED_DATA,
        cacheKey: CONFIG.localCacheKey,
        minRows: CONFIG.minimumRows,

        loadLive: () =>
          PFFCharts.loadGVizSheet({
            sheetId: CONFIG.spreadsheetId,
            sheetName: CONFIG.sheetName,
            gid: CONFIG.sheetGid,
            range: CONFIG.sourceRange,
            headers: '1',
            timeoutMs: CONFIG.fetchTimeoutMs
          }),

        parseLive: sourceRowsFromTable,

        loadRemoteCache: () =>
          PFFCharts.loadAppsScriptCache({
            url: CACHE_WEB_APP_URL,
            appKey: CONFIG.appKey,
            timeoutMs: CONFIG.cacheFetchTimeoutMs
          }),

        parseRemoteCache: sourceRowsFromRemoteCache,

        onLiveError(error) {
          console.warn(
            'Live practice-landscape data unavailable; trying Practice Directory backend cache.',
            error
          );
        },

        onRemoteCacheError(error) {
          console.warn(
            'Practice Directory backend cache unavailable; trying browser cache.',
            error
          );
        }
      });
    }

    function availableStates() {
      const found = new Set(
        sourceRows
          .map(row => row.state)
          .filter(Boolean)
      );

      return STATE_ORDER.filter(state => found.has(state));
    }

    function areaLabel(value = activeArea) {
      return value === 'AUS'
        ? 'Australia'
        : value;
    }

    function areaLongLabel(value = activeArea) {
      return value === 'AUS'
        ? 'Australia'
        : STATE_NAMES[value] || value;
    }

    function filteredRowsForArea() {
      if (activeArea === 'AUS') {
        return sourceRows;
      }

      return sourceRows.filter(row => row.state === activeArea);
    }

    function rankLimit() {
      return CONFIG.rankLimit;
    }

    function buildSuburbGroups(rows) {
      const groups = new Map();
      let usableRows = 0;

      rows.forEach(row => {
        if (!row.suburb || !row.state) {
          return;
        }

        usableRows += 1;

        const key =
          `${row.state}\u0000${row.suburb.toLowerCase()}`;

        if (!groups.has(key)) {
          groups.set(key, {
            key: `suburb:${key}`,
            label: row.suburb,
            state: row.state,
            count: 0
          });
        }

        groups.get(key).count += 1;
      });

      return {
        groups: Array.from(groups.values()),
        usableRows
      };
    }

    function excludedBrand(value) {
      const key = normaliseGroupingText(value)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      return (
        key.startsWith('independent') ||
        key.startsWith('provision') ||
        key === 'eyecare plus'
      );
    }

    function buildBrandGroups(rows) {
      const groups = new Map();
      let usableRows = 0;

      rows.forEach(row => {
        const label = row.brand || 'Unclassified';
        const employerType = normaliseGroupingText(
          row.employerType
        ).toLowerCase();

        if (
          employerType === 'independent' ||
          excludedBrand(label)
        ) {
          return;
        }

        usableRows += 1;
        const key = label.toLowerCase();

        if (!groups.has(key)) {
          groups.set(key, {
            key: `brand:${key}`,
            label,
            count: 0
          });
        }

        groups.get(key).count += 1;
      });

      return {
        groups: Array.from(groups.values()),
        usableRows
      };
    }

    function buildModel() {
      const areaRows = filteredRowsForArea();
      const grouped = activeView === 'suburbs'
        ? buildSuburbGroups(areaRows)
        : buildBrandGroups(areaRows);

      const allGroups = grouped.groups
        .sort((a, b) => {
          const countDifference = b.count - a.count;

          if (countDifference !== 0) {
            return countDifference;
          }

          if (activeView === 'suburbs') {
            const stateDifference =
              collator.compare(a.state, b.state);

            if (stateDifference !== 0) {
              return stateDifference;
            }
          }

          return collator.compare(a.label, b.label);
        });

      const groups = allGroups.slice(0, rankLimit());

      return {
        view: activeView,
        area: activeArea,
        areaRows,
        usableRows: grouped.usableRows,
        totalCategories: allGroups.length,
        groups,
        values: groups.map(group => group.count)
      };
    }

    function tickLabel(group) {
      if (!group) {
        return '';
      }

      if (activeView === 'suburbs' && activeArea === 'AUS') {
        return `${group.label} · ${group.state}`;
      }

      return group.label;
    }

    function clippedTickLabel(value) {
      const text = String(value || '');
      const limit = PFF.mobileLayout() ? 21 : 30;

      if (text.length <= limit) {
        return text;
      }

      return `${text.slice(0, Math.max(1, limit - 1))}…`;
    }

    function brandColourKey(value) {
      return normaliseGroupingText(value)
        .toLowerCase()
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function rgbaFromHex(hex, alpha) {
      const clean = String(hex || '').replace('#', '').trim();

      if (!/^[0-9a-f]{6}$/i.test(clean)) {
        return hex;
      }

      const red = parseInt(clean.slice(0, 2), 16);
      const green = parseInt(clean.slice(2, 4), 16);
      const blue = parseInt(clean.slice(4, 6), 16);

      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function groupAppearance(group) {
      if (activeView === 'suburbs') {
        const colour =
          PFF.stateColours?.[group?.state] || '#69718a';

        return {
          background: colour,
          hoverBackground: colour,
          border: colour,
          hoverBorder: colour,
          borderWidth: 0
        };
      }

      const label = group?.label || '';

      if (label === 'Unclassified') {
        return {
          background: '#bfc3c7',
          hoverBackground: '#bfc3c7',
          border: '#bfc3c7',
          hoverBorder: '#bfc3c7',
          borderWidth: 0
        };
      }

      const key = brandColourKey(label);
      const explicitColour = BRAND_COLOURS[key];

      if (explicitColour) {
        return {
          background: explicitColour,
          hoverBackground: explicitColour,
          border: explicitColour,
          hoverBorder: explicitColour,
          borderWidth: 0
        };
      }

      const sharedAppearance = PFF.getEmployerAppearance(
        label,
        {
          fallbackLabel: label,
          fallbackColour: ''
        }
      );

      if (sharedAppearance?.matched && sharedAppearance.colour) {
        return {
          background: sharedAppearance.colour,
          hoverBackground: sharedAppearance.colour,
          border: sharedAppearance.colour,
          hoverBorder: sharedAppearance.colour,
          borderWidth: 0
        };
      }

      const purple = '#6600ff';

      return {
        background: rgbaFromHex(purple, 0.50),
        hoverBackground: rgbaFromHex(purple, 0.76),
        border: rgbaFromHex(purple, 0.68),
        hoverBorder: purple,
        borderWidth: 0.7
      };
    }

    function valueText(group) {
      if (!group) {
        return '';
      }

      return PFF.formatInteger(group.count);
    }

    function headingDetail() {
      return activeView === 'suburbs'
        ? 'suburb'
        : 'brand (non-independent)';
    }

    function updateHeading(animate = true) {
      const next = headingDetail();

      if (!animate || PFF.reducedMotion()) {
        chartHeadingDetail.textContent = next;
        requestAnimationFrame(() => headingScroller?.update?.());
        return;
      }

      PFF.animateTextChange(
        chartHeadingDetail,
        next,
        {
          fadeOutMs: 150,
          fadeInMs: 220
        }
      );

      window.setTimeout(
        () => headingScroller?.update?.(),
        230
      );
    }

    function buildAreaMenu() {
      areaOptions.textContent = '';

      const options = [
        {
          value: 'AUS',
          label: 'Australia'
        },
        ...availableStates().map(state => ({
          value: state,
          label: state
        }))
      ];

      options.forEach(option => {
        const label = document.createElement('label');
        label.className = 'state-option';

        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'practice-landscape-area';
        input.value = option.value;
        input.checked = option.value === activeArea;

        const box = document.createElement('span');
        box.className = 'state-option-box';
        box.setAttribute('aria-hidden', 'true');

        const name = document.createElement('span');
        name.className = 'area-option-name';
        name.textContent = option.label;
        name.style.color = option.value === 'AUS'
          ? 'var(--landscape-australia)'
          : PFF.stateColours?.[option.value] || '#69718a';

        label.append(input, box, name);
        areaOptions.appendChild(label);
      });
    }

    function syncAreaControl(animate = true) {
      const next = areaLabel();

      areaButtonValue.style.color = activeArea === 'AUS'
        ? 'var(--landscape-australia)'
        : PFF.stateColours?.[activeArea] || '#69718a';

      areaOptions
        .querySelectorAll('input[name="practice-landscape-area"]')
        .forEach(input => {
          input.checked = input.value === activeArea;
        });

      if (!animate || PFF.reducedMotion()) {
        areaButtonValue.textContent = next;
        return;
      }

      PFF.animateTextChange(
        areaButtonValue,
        next,
        {
          fadeOutMs: 130,
          fadeInMs: 200
        }
      );
    }

    function stageHeightFor() {
      return Math.max(
        chartShell.clientHeight || 0,
        PFF.mobileLayout() ? 310 : 340
      );
    }

    function updateStageGeometry(model, resetScroll = false) {
      const height = stageHeightFor();
      const shellHeight = Math.max(chartShell.clientHeight || 0, 1);
      const scrollable = height > shellHeight + 4;

      chartStage.style.height = `${height}px`;
      chartStage.style.minHeight = `${height}px`;
      chartScroll.classList.toggle('is-scrollable', scrollable);

      if (resetScroll) {
        chartScroll.scrollTop = 0;
      }
    }

    const barValueLabelsPlugin = {
      id: 'practiceLandscapeValueLabels',

      afterDatasetsDraw(chartInstance) {
        const model = activeModel;

        if (!model?.groups?.length) {
          return;
        }

        const meta = chartInstance.getDatasetMeta(0);
        const area = chartInstance.chartArea;
        const ctx = chartInstance.ctx;

        ctx.save();
        ctx.font = '700 10px Lato, sans-serif';
        ctx.fillStyle = '#69718a';
        ctx.textBaseline = 'middle';

        meta.data.forEach((element, index) => {
          const group = model.groups[index];

          if (!element || !group) {
            return;
          }

          const properties = element.getProps(
            ['x', 'y'],
            true
          );

          if (
            !Number.isFinite(properties.x) ||
            !Number.isFinite(properties.y)
          ) {
            return;
          }

          const animatedValue =
            locationReorderState.active
              ? Number(
                  chartInstance.data.datasets?.[0]?.data?.[index]
                )
              : NaN;
          const text = Number.isFinite(animatedValue)
            ? PFF.formatInteger(Math.round(animatedValue))
            : valueText(group);
          const width = ctx.measureText(text).width;
          const proposedX = properties.x + 5;

          if (proposedX + width <= area.right - 2) {
            ctx.textAlign = 'left';
            ctx.fillText(text, proposedX, properties.y);
          } else {
            ctx.textAlign = 'right';
            ctx.fillText(text, area.right - 2, properties.y);
          }
        });

        ctx.restore();
      }
    };

    function captureGroupYPositions(model) {
      const positions = new Map();

      if (!chart || !model?.groups?.length) {
        return positions;
      }

      const elements = chart.getDatasetMeta(0)?.data || [];

      model.groups.forEach((group, index) => {
        const y = elements[index]?.y;

        if (group?.key && Number.isFinite(y)) {
          positions.set(group.key, y);
        }
      });

      return positions;
    }

    function animatedGroupY(chartInstance, group, index) {
      const targetY = chartInstance?.scales?.y?.getPixelForValue(index);

      if (
        !Number.isFinite(targetY) ||
        !locationReorderState.active
      ) {
        return targetY;
      }

      const fromY = locationReorderState.fromYByKey.get(
        group?.key
      );

      if (!Number.isFinite(fromY)) {
        return targetY;
      }

      return fromY +
        (targetY - fromY) *
        Math.max(0, Math.min(locationReorderState.progress, 1));
    }

    const locationReorderGeometryPlugin = {
      id: 'pffPracticeLandscapeLocationReorder',

      beforeDatasetsDraw(chartInstance) {
        if (
          !locationReorderState.active ||
          !activeModel?.groups?.length
        ) {
          return;
        }

        chartInstance.data.datasets.forEach((_dataset, datasetIndex) => {
          const elements =
            chartInstance.getDatasetMeta(datasetIndex)?.data || [];

          elements.forEach((element, index) => {
            const group = activeModel.groups[index];
            const y = animatedGroupY(
              chartInstance,
              group,
              index
            );

            if (Number.isFinite(y)) {
              element.y = y;
            }
          });
        });
      }
    };

    function niceAxisStep(roughStep) {
      const value = Math.max(Number(roughStep) || 1, 1);
      const magnitude = 10 ** Math.floor(Math.log10(value));
      const candidates = [1, 2, 5, 10].map(
        factor => factor * magnitude
      );

      return candidates.reduce((best, candidate) => {
        const bestDistance = Math.abs(Math.log(best / value));
        const candidateDistance = Math.abs(
          Math.log(candidate / value)
        );

        return candidateDistance < bestDistance
          ? candidate
          : best;
      }, candidates[0]);
    }

    function axisSpecFor(model) {
      const maximum = model.values.length
        ? Math.max(...model.values)
        : 0;
      const paddedMaximum = Math.max(2, maximum * 1.14 + 1);
      const majorStep = Math.max(
        1,
        Math.round(niceAxisStep(paddedMaximum / 5))
      );
      const minorStep = majorStep / 2;
      const max = Math.max(
        majorStep,
        Math.ceil(paddedMaximum / majorStep) * majorStep
      );

      return {
        max,
        majorStep,
        minorStep
      };
    }

    function copyChartArea(area) {
      if (!area) {
        return null;
      }

      const copy = {
        left: Number(area.left),
        right: Number(area.right),
        top: Number(area.top),
        bottom: Number(area.bottom)
      };

      return Object.values(copy).every(Number.isFinite)
        ? copy
        : null;
    }

    function setSpineGeometry(area) {
      const geometry = copyChartArea(area);

      if (!geometry) {
        return;
      }

      spineTransitionState.left = geometry.left;
      spineTransitionState.right = geometry.right;
      spineTransitionState.top = geometry.top;
      spineTransitionState.bottom = geometry.bottom;
    }

    function animateSpineGeometry(
      fromArea,
      toArea,
      duration = CONFIG.spineTransitionMs
    ) {
      if (spineTransitionFrame !== null) {
        cancelAnimationFrame(spineTransitionFrame);
        spineTransitionFrame = null;
      }

      const from = copyChartArea(fromArea);
      const to = copyChartArea(toArea);

      if (!from || !to) {
        spineTransitionState.active = false;
        setSpineGeometry(to || from);
        chart?.draw();
        return;
      }

      spineTransitionState.active = true;
      setSpineGeometry(from);

      if (PFF.reducedMotion() || duration <= 0) {
        setSpineGeometry(to);
        spineTransitionState.active = false;
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );
        const eased = PFFCharts.easeInOutCubic(progress);

        spineTransitionState.left =
          from.left + (to.left - from.left) * eased;
        spineTransitionState.right =
          from.right + (to.right - from.right) * eased;
        spineTransitionState.top =
          from.top + (to.top - from.top) * eased;
        spineTransitionState.bottom =
          from.bottom + (to.bottom - from.bottom) * eased;

        chart?.draw();

        if (progress < 1) {
          spineTransitionFrame = requestAnimationFrame(frame);
        } else {
          spineTransitionFrame = null;
          setSpineGeometry(to);
          spineTransitionState.active = false;
          chart?.draw();
        }
      }

      spineTransitionFrame = requestAnimationFrame(frame);
    }

    function animateAxisMaximum(
      fromMaximum,
      toMaximum,
      duration = CONFIG.axisTransitionMs
    ) {
      if (axisTransitionFrame !== null) {
        cancelAnimationFrame(axisTransitionFrame);
        axisTransitionFrame = null;
      }

      const from = Number(fromMaximum);
      const to = Number(toMaximum);

      if (!Number.isFinite(from) || !Number.isFinite(to)) {
        axisTransitionState.active = false;
        axisTransitionState.max = to;
        chart?.draw();
        return;
      }

      axisTransitionState.active = true;
      axisTransitionState.max = from;

      if (PFF.reducedMotion() || duration <= 0 || from === to) {
        axisTransitionState.max = to;
        axisTransitionState.active = false;
        chart?.draw();
        return;
      }

      const startedAt = performance.now();

      function frame(now) {
        const progress = Math.min(
          (now - startedAt) / duration,
          1
        );
        const eased = PFFCharts.easeInOutCubic(progress);

        axisTransitionState.max = from + (to - from) * eased;
        chart?.draw();

        if (progress < 1) {
          axisTransitionFrame = requestAnimationFrame(frame);
        } else {
          axisTransitionFrame = null;
          axisTransitionState.max = to;
          axisTransitionState.active = false;
          chart?.draw();
        }
      }

      axisTransitionFrame = requestAnimationFrame(frame);
    }

    function currentAxisGeometry(chartInstance) {
      const area = chartInstance?.chartArea;

      if (!area) {
        return null;
      }

      return {
        left:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.left)
            ? spineTransitionState.left
            : area.left,
        right:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.right)
            ? spineTransitionState.right
            : area.right,
        top:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.top)
            ? spineTransitionState.top
            : area.top,
        bottom:
          spineTransitionState.active &&
          Number.isFinite(spineTransitionState.bottom)
            ? spineTransitionState.bottom
            : area.bottom
      };
    }

    function displayedAxisMaximum() {
      const maximum =
        axisTransitionState.active &&
        Number.isFinite(axisTransitionState.max)
          ? axisTransitionState.max
          : activeAxisSpec?.max;

      return Math.max(Number(maximum) || 1, 1);
    }

    function xAxisPixel(geometry, value) {
      return geometry.left +
        (geometry.right - geometry.left) *
        (Number(value) / displayedAxisMaximum());
    }

    const constantSpinePlugin = {
      id: 'pffPracticeLandscapeConstantSpines',

      afterDatasetsDraw(chartInstance) {
        const geometry = currentAxisGeometry(chartInstance);

        if (!geometry) {
          return;
        }

        const context = chartInstance.ctx;

        context.save();
        context.strokeStyle = '#151515';
        context.lineWidth = 1;
        context.lineCap = 'butt';

        context.beginPath();
        context.moveTo(geometry.left, geometry.bottom);
        context.lineTo(geometry.right, geometry.bottom);
        context.stroke();

        context.beginPath();
        context.moveTo(geometry.left, geometry.top);
        context.lineTo(geometry.left, geometry.bottom);
        context.stroke();

        context.restore();
      }
    };

    const barAxisPresentationPlugin = {
      id: 'pffPracticeLandscapeAxisPresentation',

      beforeDatasetsDraw(chartInstance) {
        const geometry = currentAxisGeometry(chartInstance);
        const spec = activeAxisSpec;

        if (!geometry || !spec) {
          return;
        }

        const currentMaximum = displayedAxisMaximum();
        const lastValue = Math.ceil(
          currentMaximum / spec.minorStep
        ) * spec.minorStep;
        const context = chartInstance.ctx;

        context.save();
        context.lineCap = 'butt';

        for (
          let value = 0;
          value <= lastValue + spec.minorStep * 0.25;
          value += spec.minorStep
        ) {
          const x = xAxisPixel(geometry, value);

          if (x < geometry.left - 1 || x > geometry.right + 1) {
            continue;
          }

          const major = Math.abs(
            value / spec.majorStep -
            Math.round(value / spec.majorStep)
          ) < 1e-6;

          context.strokeStyle = major
            ? 'rgba(105, 113, 138, 0.075)'
            : 'rgba(105, 113, 138, 0.035)';
          context.lineWidth = major ? 1 : 0.7;
          context.beginPath();
          context.moveTo(Math.round(x) + 0.5, geometry.top);
          context.lineTo(Math.round(x) + 0.5, geometry.bottom);
          context.stroke();
        }

        context.restore();
      },

      afterDraw(chartInstance) {
        const geometry = currentAxisGeometry(chartInstance);
        const spec = activeAxisSpec;

        if (!geometry || !spec) {
          return;
        }

        const context = chartInstance.ctx;
        const mobile = PFF.mobileLayout();
        const tickFontSize = mobile ? 9 : 10;
        const titleFontSize = mobile ? 12 : 13;
        const currentMaximum = displayedAxisMaximum();
        const lastValue = Math.ceil(
          currentMaximum / spec.minorStep
        ) * spec.minorStep;
        const meta = chartInstance.getDatasetMeta(0);

        context.save();
        context.lineCap = 'butt';
        context.strokeStyle = '#151515';
        context.fillStyle = '#151515';
        context.textAlign = 'right';
        context.textBaseline = 'middle';
        context.font = `400 ${mobile ? 9 : 10}px Lato, sans-serif`;

        (activeModel?.groups || []).forEach((group, index) => {
          const bar = meta?.data?.[index];

          if (!Number.isFinite(bar?.y)) {
            return;
          }

          context.fillText(
            clippedTickLabel(tickLabel(group)),
            geometry.left - 5,
            bar.y
          );
        });

        for (
          let value = 0;
          value <= lastValue + spec.minorStep * 0.25;
          value += spec.minorStep
        ) {
          const x = xAxisPixel(geometry, value);

          if (x < geometry.left - 1 || x > geometry.right + 1) {
            continue;
          }

          const major = Math.abs(
            value / spec.majorStep -
            Math.round(value / spec.majorStep)
          ) < 1e-6;
          const tickLength = major ? 6 : 2;

          context.beginPath();
          context.lineWidth = major ? 1 : 0.7;
          context.moveTo(Math.round(x) + 0.5, geometry.bottom);
          context.lineTo(
            Math.round(x) + 0.5,
            geometry.bottom + tickLength
          );
          context.stroke();
        }

        context.font = `400 ${tickFontSize}px Lato, sans-serif`;
        context.textBaseline = 'top';

        for (
          let value = 0;
          value <= lastValue + spec.majorStep * 0.25;
          value += spec.majorStep
        ) {
          const x = xAxisPixel(geometry, value);

          if (x < geometry.left - 1 || x > geometry.right + 1) {
            continue;
          }

          context.textAlign = value === 0
            ? 'left'
            : 'center';
          context.fillText(
            PFF.formatInteger(value),
            x,
            geometry.bottom + 9
          );
        }

        context.font = `700 ${titleFontSize}px Lato, sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'alphabetic';
        context.fillText(
          'Number of practices',
          geometry.left + (geometry.right - geometry.left) / 2,
          geometry.bottom + 42
        );

        context.restore();
      }
    };

    function tooltipCallbacks() {
      return {
        title(items) {
          const index = items?.[0]?.dataIndex;
          const group = activeModel?.groups?.[index];

          if (!group) {
            return '';
          }

          if (activeView === 'suburbs') {
            return `${group.label}, ${group.state}`;
          }

          return group.label;
        },

        label(context) {
          const group = activeModel?.groups?.[context.dataIndex];

          if (!group) {
            return '';
          }

          return `Practices: ${PFF.formatInteger(group.count)}`;
        }
      };
    }

    function chartOptions(model) {
      const spec = axisSpecFor(model);

      return PFFCharts.baseChartOptions({
        indexAxis: 'y',

        interaction: {
          mode: 'nearest',
          intersect: true,
          axis: 'y'
        },

        layout: {
          autoPadding: false,
          padding: {
            top: 5,
            right: PFF.mobileLayout() ? 28 : 36,
            bottom: 0,
            left: 0
          }
        },

        scales: {
          x: {
            beginAtZero: true,
            min: 0,
            max: spec.max,
            afterFit(scale) {
              scale.height = 50;
            },
            ticks: {
              display: false
            },
            grid: {
              display: false,
              drawTicks: false
            },
            border: {
              display: false
            },
            title: {
              display: false
            }
          },

          y: {
            afterFit(scale) {
              scale.width = PFF.mobileLayout()
                ? 112
                : 148;
            },
            ticks: {
              display: false
            },
            grid: {
              display: false,
              drawTicks: false
            },
            border: {
              display: false
            }
          }
        },

        plugins: {
          legend: {
            display: false
          },
          tooltip: PFFCharts.tooltipOptions({
            callbacks: tooltipCallbacks()
          })
        }
      });
    }

    function chartData(model) {
      const appearances = model.groups.map(group =>
        groupAppearance(group)
      );

      return {
        labels: model.groups.map(group => tickLabel(group)),
        datasets: [
          {
            label: 'Practices',
            data: model.values,
            backgroundColor: appearances.map(item => item.background),
            hoverBackgroundColor: appearances.map(
              item => item.hoverBackground
            ),
            borderColor: appearances.map(item => item.border),
            hoverBorderColor: appearances.map(item => item.hoverBorder),
            borderWidth: appearances.map(item => item.borderWidth),
            borderRadius: 2,
            borderSkipped: false,
            categoryPercentage: 0.82,
            barPercentage: 0.74,
            minBarLength: 2
          }
        ]
      };
    }

    function createChart(model) {
      activeModel = model;
      activeAxisSpec = axisSpecFor(model);
      axisTransitionState.max = activeAxisSpec.max;
      axisTransitionState.active = false;
      updateStageGeometry(model, true);

      chart = new Chart(
        chartCanvas.getContext('2d'),
        {
          type: 'bar',
          data: chartData(model),
          options: chartOptions(model),
          plugins: [
            locationReorderGeometryPlugin,
            barAxisPresentationPlugin,
            constantSpinePlugin,
            barValueLabelsPlugin
          ]
        }
      );

      setSpineGeometry(chart.chartArea);
    }

    function updateChart(model, animate = true) {
      const previousModel = activeModel;
      const previousArea = copyChartArea(chart?.chartArea);
      const previousMaximum = Number(
        chart?.options?.scales?.x?.max ??
        axisTransitionState.max ??
        activeAxisSpec?.max
      );
      const shouldAnimateLocationReorder = Boolean(
        chart &&
        previousModel &&
        previousModel.view === model.view &&
        previousModel.area !== model.area &&
        animate &&
        !PFF.reducedMotion()
      );

      const previousYByKey = shouldAnimateLocationReorder
        ? captureGroupYPositions(previousModel)
        : new Map();
      const previousIndexByKey = shouldAnimateLocationReorder
        ? new Map(
            previousModel.groups.map((group, index) => [
              group.key,
              index
            ])
          )
        : new Map();
      const currentValues = shouldAnimateLocationReorder
        ? (chart.data.datasets?.[0]?.data || []).map(
            value => Number(value) || 0
          )
        : [];

      locationTransitionAnimator.cancel();
      locationReorderState.active = false;
      locationReorderState.progress = 1;
      locationReorderState.fromYByKey = new Map();

      activeModel = model;
      activeAxisSpec = axisSpecFor(model);
      updateStageGeometry(model, true);

      if (!chart) {
        createChart(model);
        return;
      }

      if (shouldAnimateLocationReorder) {
        if (axisTransitionFrame !== null) {
          cancelAnimationFrame(axisTransitionFrame);
          axisTransitionFrame = null;
        }

        const targetData = chartData(model);
        const targetDataset = targetData.datasets[0];
        const startValues = model.groups.map(group => {
          const previousIndex = previousIndexByKey.get(group.key);

          return previousIndex === undefined
            ? 0
            : currentValues[previousIndex] || 0;
        });
        const targetValues = model.values.map(
          value => Number(value) || 0
        );
        const startMaximum =
          Number.isFinite(previousMaximum) && previousMaximum > 0
            ? previousMaximum
            : activeAxisSpec.max;
        const targetMaximum = activeAxisSpec.max;
        const dataset = chart.data.datasets[0];

        chart.data.labels = targetData.labels;

        Object.keys(targetDataset).forEach(key => {
          if (key !== 'data') {
            dataset[key] = targetDataset[key];
          }
        });
        dataset.data = startValues.slice();

        chart.options = chartOptions(model);
        chart.options.scales.x.max = startMaximum;

        locationReorderState.active = true;
        locationReorderState.progress = 0;
        locationReorderState.fromYByKey = previousYByKey;

        axisTransitionState.active = true;
        axisTransitionState.max = startMaximum;

        chart.tooltip?.setActiveElements([], { x: 0, y: 0 });
        chart.update('none');

        const nextArea = copyChartArea(chart.chartArea);
        animateSpineGeometry(previousArea, nextArea);

        locationTransitionAnimator.run({
          duration: CONFIG.locationTransitionMs,
          easing: PFFCharts.easeInOutCubic,

          onFrame(progress) {
            locationReorderState.progress = progress;

            dataset.data = targetValues.map((targetValue, index) => {
              const startValue = startValues[index] || 0;

              return startValue +
                (targetValue - startValue) * progress;
            });

            const displayedMaximum =
              startMaximum +
              (targetMaximum - startMaximum) * progress;

            chart.options.scales.x.max = displayedMaximum;
            axisTransitionState.max = displayedMaximum;
            chart.update('none');
          },

          onComplete() {
            dataset.data = targetValues.slice();
            chart.options.scales.x.max = targetMaximum;

            locationReorderState.active = false;
            locationReorderState.progress = 1;
            locationReorderState.fromYByKey = new Map();

            axisTransitionState.active = false;
            axisTransitionState.max = targetMaximum;

            chart.update('none');
            setSpineGeometry(chart.chartArea);
          }
        });

        return;
      }

      chart.data = chartData(model);
      chart.options = chartOptions(model);
      chart.update(
        animate && !PFF.reducedMotion()
          ? undefined
          : 'none'
      );

      const nextArea = copyChartArea(chart.chartArea);

      if (animate && !PFF.reducedMotion()) {
        animateSpineGeometry(previousArea, nextArea);
        animateAxisMaximum(
          previousMaximum,
          activeAxisSpec.max
        );
      } else {
        if (spineTransitionFrame !== null) {
          cancelAnimationFrame(spineTransitionFrame);
          spineTransitionFrame = null;
        }
        if (axisTransitionFrame !== null) {
          cancelAnimationFrame(axisTransitionFrame);
          axisTransitionFrame = null;
        }

        spineTransitionState.active = false;
        axisTransitionState.active = false;
        axisTransitionState.max = activeAxisSpec.max;
        setSpineGeometry(nextArea);
        chart.draw();
      }
    }

    function updateAccessibleSummary() {
      if (!chartSummary || !activeModel) {
        return;
      }

      const first = activeModel.groups[0];
      const subject = activeView === 'suburbs'
        ? 'suburbs'
        : 'non-independent brand or parent categories';
      const topText = first
        ? ` Highest shown: ${tickLabel(first)}, ${PFF.formatInteger(first.count)} practices.`
        : '';

      PFFCharts.updateChartSummary(
        `Practice landscape showing ${PFF.formatInteger(activeModel.groups.length)} ${subject} for ${areaLongLabel()}. ` +
        `${PFF.formatInteger(activeModel.usableRows)} practice rows contribute to this view.${topText}`,
        chartSummary
      );
    }

    function renderView({ animate = true } = {}) {
      const model = buildModel();

      updateHeading(animate);
      syncAreaControl(animate);
      updateChart(model, animate);
      updateAccessibleSummary();
    }

    function configureControls() {
      headingScroller = PFF.setupScrollableRegion({
        scroller: headingScrollViewport,
        leftButton: headingScrollLeft,
        rightButton: headingScrollRight,
        tolerance: 2
      });

      tabsController = PFF.setupTabs({
        tabList,
        tabs: tabList.querySelectorAll('.chart-tab'),
        valueAttribute: 'view',
        initialValue: activeView,
        leftButton: tabScrollLeft,
        rightButton: tabScrollRight,
        onChange(value) {
          activeView = value;
          areaMenuController?.closeMenu?.();
          renderView({ animate: true });
        }
      });

      areaMenuController = PFF.setupMenu({
        menu: areaControl,
        button: areaButton,
        panel: areaMenu,
        focusOnOpen: false
      });

      areaOptions.addEventListener('change', event => {
        const input = event.target.closest(
          'input[name="practice-landscape-area"]'
        );

        if (!input) {
          return;
        }

        activeArea = input.value;
        areaMenuController?.closeMenu?.();
        renderView({ animate: true });
      });


      chartInteractionController =
        PFFCharts.setupChartInteractions({
          canvas: chartCanvas,
          getChart: () => chart
        });

      responsiveController =
        PFFCharts.createResponsiveController({
          getChart: () => chart,
          observe: [app, chartShell],
          applyResponsiveChartOptions: false,
          onRefresh() {
            if (!chart || !activeModel) {
              return;
            }

            locationTransitionAnimator.cancel();
            locationReorderState.active = false;
            locationReorderState.progress = 1;
            locationReorderState.fromYByKey = new Map();

            if (axisTransitionFrame !== null) {
              cancelAnimationFrame(axisTransitionFrame);
              axisTransitionFrame = null;
            }

            updateStageGeometry(activeModel, false);
            activeAxisSpec = axisSpecFor(activeModel);
            axisTransitionState.active = false;
            axisTransitionState.max = activeAxisSpec.max;
            chart.data = chartData(activeModel);
            chart.options = chartOptions(activeModel);
            chart.resize();
            chart.update('none');
            setSpineGeometry(chart.chartArea);
            tabsController?.update?.();
            headingScroller?.update?.();
          }
        });
    }

    PFF.initialiseApp({
      app,
      status: statusElement,
      load: loadPracticeRows,

      render(loaded) {
        sourceRows = normaliseRows(loaded.rows);

        if (!sourceRows.length) {
          throw new Error(
            'No usable optometry practice rows were returned from the practice directory.'
          );
        }

        setLoadedSourceIndicator(loaded);
        buildAreaMenu();
        configureControls();

        chartSummary = PFFCharts.ensureChartSummary({
          id: 'practiceLandscapeChartSummary',
          parent: app
        });

        chartCanvas.setAttribute(
          'aria-describedby',
          chartSummary.id
        );

        renderView({ animate: false });
        return chart;
      },

      onError() {
        PFF.setDataSourceIndicator('unavailable', {
          indicator: dataSourceIndicator,
          text: dataSourceText
        });
      },

      errorMessage:
        'Practice landscape data unavailable.'
    });
  </script>
</body>
</html>
